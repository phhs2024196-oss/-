  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $a_{26}=0$을 축으로 $\lvert a_k\rvert$가 대칭이므로 합은 $2\sum_{k=1}^{25}\frac{1}{\sqrt{a_{k+1}}+\sqrt{a_k}}$이고, 유리화하면 망원합이 된다.
    steps:
    - id: 1a
      content: $a_n=104-4n$, $\sum_{k=1}^{50}=2\sum_{k=1}^{25}\frac{\sqrt{a_{k+1}}-\sqrt{a_k}}{-4}=-\frac12(\sqrt{a_{26}}-\sqrt{a_1})=5$
      criteria:
      - 1.B1
      - 1.B2
      - 1.M1
      - 1.A1
    hint_ladder:
    - $\lvert a_{25}\rvert=\lvert a_{27}\rvert$이고 공차가 0이 아니면 $a_{25}$와 $a_{27}$은 어떤 관계인가?
    - $k\le25$와 $k\ge26$에서 $\lvert a_k\rvert$는 어떻게 변하는가?
    - 분모를 유리화하면 분모가 공차의 크기가 된다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2024 선행학습 영향평가 보고서」 p.55 문항 해설 및 풀이과정
    steps:
    - id: 1b-1
      content: |
        $\lvert a_{25}\rvert=\lvert a_{27}\rvert$에서 공차가 0이 아니므로 $a_{25}=-a_{27}$이고, $a_{26}=\dfrac{a_{25}+a_{27}}{2}=0$.
      criteria:
      - 1.B1
    - id: 1b-2
      content: |
        공차가 $-4$인 등차수열 $\{a_n\}$은 $a_n=a_1-4(n-1)$에서 $a_{26}=a_1-4(25)=0$, $\therefore a_1=100$.
        따라서 $a_n=104-4n$.
      criteria:
      - 1.B2
    - id: 1b-3
      content: |
        $a_{26}=0$을 기준으로 $\lvert a_{26+j}\rvert=\lvert a_{26-j}\rvert$이므로 $k=26,\dots,50$의 항은 $k=1,\dots,25$의 항과 같다($k\le26$이면 $a_k\ge0$).
        $$\sum_{k=1}^{50}\frac{1}{\sqrt{\lvert a_{k+1}\rvert}+\sqrt{\lvert a_k\rvert}}=2\sum_{k=1}^{25}\frac{1}{\sqrt{a_{k+1}}+\sqrt{a_k}}=2\sum_{k=1}^{25}\frac{\sqrt{a_{k+1}}-\sqrt{a_k}}{a_{k+1}-a_k}=-\frac12\sum_{k=1}^{25}\left(\sqrt{a_{k+1}}-\sqrt{a_k}\right)$$
      criteria:
      - 1.M1
    - id: 1b-4
      content: |
        $$=-\frac12\left\{(\sqrt{a_2}-\sqrt{a_1})+(\sqrt{a_3}-\sqrt{a_2})+\cdots+(\sqrt{a_{26}}-\sqrt{a_{25}})\right\}=-\frac12\left(-\sqrt{a_1}+\sqrt{a_{26}}\right)=-\frac12(-10+0)=5$$
      criteria:
      - 1.A1
