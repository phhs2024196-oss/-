  - 넓이 최대 ⇔ 현 $\mathrm{AB}$와 평행한 접선의 접점
  conditions:
  - (가) → 이차, $x^2$ 계수 $\frac58$
  - (나) → $f(1)=2$, $f'(1)=2$
  - $b<k<1$
