  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f(x)=\frac58x^2+\frac34x+\frac58$, 법선 기울기 $-\frac12$, $f'(k)=-\frac12$에서 $k=-1$.
    steps:
    - id: 1a
      content: (가)(나) → $f$ 결정 → $f'(1)=2$ → 현 $\mathrm{AB}$ 기울기 $-\frac12$ → $f'(k)=-\frac12$ → $k=-1$
      criteria:
      - 1.M1
      - 1.A1
      - 1.B1
      - 1.M2
      - 1.A2
    hint_ladder:
    - (가)에서 $f(x)$의 차수와 최고차항 계수를 정하자.
    - (나)는 $f(1)$과 $f'(1)$에 대해 무엇을 알려 주는가?
    - 밑변 $\mathrm{AB}$가 고정되면 높이가 최대인 점은 어디인가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2024 선행학습 영향평가 보고서」 p.57 문항 해설 및 풀이과정
    steps:
    - id: 1b-1
      content: |
        (가)에서 $f(x)$는 2차 다항함수이고 $x^2$의 계수는 $\dfrac58$.
        (나)에서 $f(x)-2=(x-1)\left(\dfrac58x+a\right)$, 또한 (나)에서 $\dfrac58+a=2$, $\therefore a=\dfrac{11}{8}$
        $$f(x)-2=\frac58x^2+\frac68x-\frac{11}{8}\qquad\therefore f(x)=\frac58x^2+\frac34x+\frac58$$
      criteria:
      - 1.M1
      - 1.A1
    - id: 1b-2
      content: |
        $f(1)=2$, $f'(x)=\dfrac54x+\dfrac34$에서 $(1,2)$에서 접선의 기울기는 $f'(1)=2$.
        따라서 점 $(1,2)$ 위의 접선에 수직인 직선의 기울기는 $-\dfrac12$.
      criteria:
      - 1.B1
    - id: 1b-3
      content: |
        (보충) 밑변 $\mathrm{AB}$가 고정되어 있으므로 넓이는 $\mathrm{P}_k$와 직선 $\mathrm{AB}$ 사이 거리가 최대일 때 최대이고, 그때 $\mathrm{P}_k$에서의 접선은 직선 $\mathrm{AB}$와 평행하다. (직선 $\mathrm{AB}$: $y=-\frac12x+\frac52$, $b=-3$)
        $y=f(x)$가 $b<k<1$ 구간에서 $\mathrm{AP}_k\mathrm{B}$의 넓이가 최대가 되게 하는 $\mathrm{P}_k$는 $y=f(x)$의 접선의 기울기가 $-\dfrac12$일 때의 값이므로
        $$f'(k)=\frac54k+\frac34=-\frac12,\quad \frac54k=-\frac54\qquad\therefore k=-1$$
      criteria:
      - 1.M2
      - 1.A2
