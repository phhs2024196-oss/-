      implied_ok: false
      steps:
      - 1b-2
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: $m$의 조건에 따라 $a^2\ge0$인 근의 개수와 $a$의 개수($a^2=0$이면 1개)를 나누어 셌다. (공식 배점 4점을 분류 2 + 답 2로 나눔, 추정)
