    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f(a^2)=5$의 $a$ 개수는 $y=f(u)\ (u\ge0)$와 $y=5$의 교점으로 센다. $1\le m<5$.
    steps:
    - id: 1a
      content: 극한 $=f(a^2)=5$; $f(1)=m+4$, $f(3)=f(0)=m$; $a$ 개수 $\ge4\iff m\le5-0$ 이고 $m+4\ge5$, $m<5$ → $m=1,2,3,4$, 합 10
      criteria:
      - 1.M1
      - 1.A1
      - 1.B1
      - 1.M2
      - 1.A2
    hint_ladder:
    - $f$의 한 부정적분 $F$를 두고 $x^2=u$로 치환하면 극한은 무엇인가?
    - $f(u)=5$의 근 $u\ge0$ 하나는 $a$ 몇 개에 대응하는가?
    - $m$ 값에 따라 $y=f(u)$와 $y=5$의 교점을 세어 표로 정리하자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2024 선행학습 영향평가 보고서」 p.59 문항 해설 및 풀이과정
    steps:
    - id: 1b-1
      content: |
        $f(t)=t^3-6t^2+9t+m$의 부정적분 중 하나를 $F(x)$라 하고, $x^2=u$로 치환하면 $x\to a$일 때 $u\to a^2$이므로
        $$\lim_{x\to a}\frac{1}{x^2-a^2}\int_{a^2}^{x^2}f(t)dt=\lim_{u\to a^2}\frac{F(u)-F(a^2)}{u-a^2}=F'(a^2)=f(a^2)=5$$
      criteria:
      - 1.M1
      - 1.A1
    - id: 1b-2
      content: |
        $f(a^2)=5$를 만족하는 $a^2\ge0$인 $a$의 개수를 구하기 위해, $f(x)=x^3-6x^2+9x+m$에서
        $$f'(x)=3x^2-12x+9=3(x^2-4x+3)=3(x-1)(x-3)$$
        극댓값 $f(1)=m+4$, 극솟값 $f(3)=m$.
      criteria:
      - 1.B1
    - id: 1b-3
      content: |
        $m=0$일 때의 $f(x)$의 그래프를 그리면 [그림: $y=x^3-6x^2+9x$의 그래프. 원점을 지나 $x=1$에서 극댓값 4, $x=3$에서 극솟값 0(x축에 접함), 그 뒤 증가하여 직선 $y=5$와 한 번 만남]과 같고, $m$의 조건에 따라 $f(a^2)=5$를 만족하는 $a$의 개수를 구하면

        | $m$ | $a^2\ge0$인 $a^2$의 개수 | $a$의 개수 |
        |---|---|---|
        | $m<1$ | 1 | 2 |
        | $m=1$ | 2 | 4 |
        | $1<m<5$ | 3 | 6 |
        | $m=5$ | 2 ($a^2=0$ 포함) | 3 ($a^2=0$일 때 $a$는 1개의 근) |
        | $m>5$ | 0 | 0 |

        $\therefore$ $a$의 개수가 4개 이상인 $m$은 $1\le m<5$, $m=1,2,3,4$이므로 모든 $m$의 합은 $10$.
      criteria:
      - 1.M2
      - 1.A2
