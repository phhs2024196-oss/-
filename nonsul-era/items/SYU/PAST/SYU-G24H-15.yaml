key_idea: 극한값은 $F'(a^2)=f(a^2)$이므로 $f(u)=5\ (u=a^2\ge0)$의 근의 개수를 그래프로 세고, $u>0$이면 $a$ 2개, $u=0$이면 1개로 센다.
stuck: $u=a^2\ge0$ 제한과 $u=0$일 때 $a$가 1개뿐임을 반영해 $m$으로 경우를 나누는 것
