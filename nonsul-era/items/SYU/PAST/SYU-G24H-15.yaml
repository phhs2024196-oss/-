stem: |
  다항함수 $f(x)=x^3-6x^2+9x+m$에 대하여 $\displaystyle\lim_{x\to a}\frac{1}{x^2-a^2}\int_{a^2}^{x^2}f(t)dt=5$를 만족시키는 실수 $a$의 개수가 4개 이상이 되도록 하는 모든 정수 $m$의 합을 구하시오. [10점]
