stem: |
  최고차항의 계수가 1이고 원점을 지나는 사차함수 $f(x)$가 다음 조건을 만족시킬 때, 함수 $f(x)$의 극댓값을 구하시오. [10점]

  (가) $f(1-x)=f(1+x)$
  (나) $x=2$에서 함수 $f(x)$의 극솟값을 갖는다.
