    key_idea: (가)에서 그래프가 $x=1$에 대칭이므로 극소점 $x=2$의 대칭점 $x=0$도 극소, $x=1$은 극대이다.
    steps:
    - id: 1a
      content: (가)에서 그래프가 $x=1$에 대칭이므로 극소점 $x=2$의 대칭점 $x=0$도 극소, $x=1$은 극대이다.
      criteria:
      - 1.M1
    hint_ladder:
    - (가)는 그래프의 어떤 대칭을 뜻하는가?
    - $x=2$의 극소점을 $x=1$에 대해 대칭이동하면?
    - $f'(x)$의 세 근을 알면 $f'(x)$를 인수 꼴로 쓸 수 있다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2024 선행학습 영향평가 보고서」 pp.81-82 문항 해설 및 풀이과정
    steps:
    - id: 1b-1
      content: 조건 (가)에서 $f(x)$는 $x=1$에 대해 대칭이고, 조건 (나)에서 $x=2$에서 극소이므로 $x=1$에서 극대이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: 그러므로 $x=0$에서도 극소이고 $f'(x)=kx(x-1)(x-2)$이다.
      criteria:
      - 1.M2
    - id: 1b-3
      content: 최고차항의 계수가 1이므로 $k=4$, $f'(x)=4x^3-12x^2+8x$이고, $f(x)$는 원점을 지나므로 $f(x)=x^4-4x^3+4x^2$이다.
      criteria:
      - 1.A1
    - id: 1b-4
      content: $\therefore f(1)=1-4+4=1$
      criteria:
      - 1.A2
