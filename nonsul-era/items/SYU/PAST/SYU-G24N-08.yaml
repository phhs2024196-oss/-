  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 접선 $y=2x+k$에서 $k=\dfrac{\sqrt5}{2^n}$, 마름모 넓이 $S_n=\dfrac{5}{4^n}$이므로 $S_n-\dfrac2\pi T_n=\dfrac{3}{4^n}$의 등비합.
    steps:
    - id: 1a
      content: 접선 $y=2x+k$에서 $k=\dfrac{\sqrt5}{2^n}$, 마름모 넓이 $S_n=\dfrac{5}{4^n}$이므로 $S_n-\dfrac2\pi T_n=\dfrac{3}{4^n}$의 등비합.
      criteria:
      - 1.M1
    hint_ladder:
    - 접선과 원의 중심 사이 거리는 반지름과 같다.
    - 네 직선이 만드는 도형의 꼭짓점은 좌표축 위에 있다.
    - $\dfrac{3}{4^n}$의 합은 등비수열의 합이다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2024 선행학습 영향평가 보고서」 pp.83-84 문항 해설 및 풀이과정
    steps:
    - id: 1b-1
      content: 직선 $\mathrm{B}_n$의 방정식을 $y=2x+k$라 두면 $2x-y+k=0$과 $(0,0)$의 거리는 원의 반지름 $\dfrac{1}{2^n}$과 같으므로 $\dfrac{k}{\sqrt{4+1}}=\dfrac{1}{2^n}$, $\therefore y=2x+\dfrac{\sqrt5}{2^n}$
      criteria:
      - 1.M1
    - id: 1b-2
      content: $S_n=\dfrac{\sqrt5}{2^n}\cdot\dfrac{\sqrt5}{2^n}=\dfrac{5}{4^n}$ (마름모의 두 대각선 길이 $\dfrac{2\sqrt5}{2^n}$, $\dfrac{\sqrt5}{2^n}$의 곱의 절반)
      criteria:
      - 1.M2
    - id: 1b-3
      content: $T_n=\pi\left(\dfrac{1}{2^n}\right)^2=\dfrac{\pi}{4^n}$, $\therefore S_n-\dfrac{2}{\pi}T_n=\dfrac{5}{4^n}-\dfrac{2}{4^n}=\dfrac{3}{4^n}$
      criteria:
      - 1.A1
    - id: 1b-4
      content: $\displaystyle\sum_{n=1}^{5}\dfrac{3}{4^n}=\dfrac{\frac34\left(1-\left(\frac14\right)^5\right)}{1-\frac14}=1-\left(\dfrac14\right)^5=1-\left(\dfrac12\right)^{10}=\dfrac{1023}{1024}$
      criteria:
      - 1.A2
