stem: |
  그림과 같이 자연수 $n$에 대하여 기울기의 절댓값이 2이고, 원 $x^2+y^2=\dfrac{1}{4^n}$과 접하는 네 직선을 $\mathrm{A}_n$, $\mathrm{B}_n$, $\mathrm{C}_n$, $\mathrm{D}_n$이라 하자. 네 직선 $\mathrm{A}_n$, $\mathrm{B}_n$, $\mathrm{C}_n$, $\mathrm{D}_n$으로 둘러싸인 부분의 넓이를 $S_n$, 원의 넓이를 $T_n$이라 할 때, $\displaystyle\sum_{n=1}^{5}\left(S_n-\dfrac{2}{\pi}T_n\right)$의 값을 구하시오. [10점]

  [그림: 좌표평면에 원점 O를 중심으로 하는 원 $x^2+y^2=\dfrac{1}{4^n}$이 그려져 있고, 이 원에 접하는 네 직선이 마름모를 이룬다. 직선 $\mathrm{A}_n$, $\mathrm{B}_n$은 $y$축의 양의 부분 위의 한 점에서 만나며 위쪽 끝에 $\mathrm{A}_n$(왼쪽), $\mathrm{B}_n$(오른쪽) 이름이 붙어 있고, 직선 $\mathrm{C}_n$, $\mathrm{D}_n$은 $y$축의 음의 부분 위의 한 점에서 만나며 위쪽 끝에 $\mathrm{C}_n$(왼쪽), $\mathrm{D}_n$(오른쪽) 이름이 붙어 있다. 마름모의 나머지 두 꼭짓점은 $x$축 위에 있고, 원 옆에 화살표로 $x^2+y^2=\dfrac{1}{4^n}$이 표시되어 있다.]
