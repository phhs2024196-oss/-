stem: 두 점 P, Q가 원점을 출발하여 수직선 위를 움직이고 있다. 시각 $t\ (t\ge 0)$에서의 두 점 P, Q의 속도가 각각 $v_P(t)=|t^2-3t|$, $v_Q(t)=t$이고, 두 점의 속도가 같아지는 시각을 $t_1$, $t_2\ (0<t_1<t_2)$라 하자. $t=0$에서 $t=t_1$까지 두 점 P, Q가 각각 움직인 거리의 차이를 $d_1$, $t=t_1$에서 $t=t_2$까지 두 점 P,Q가 각각 움직인 거리의 차이를 $d_2$라 할 때, $d_1+d_2$의 값을 구하시오. [10점]
