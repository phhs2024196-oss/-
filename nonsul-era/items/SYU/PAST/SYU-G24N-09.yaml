  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $|t^2-3t|=t$의 두 근 $t_1=2$, $t_2=4$를 구하고 구간별로 두 점의 거리 차를 적분한다.
    steps:
    - id: 1a
      content: $|t^2-3t|=t$의 두 근 $t_1=2$, $t_2=4$를 구하고 구간별로 두 점의 거리 차를 적분한다.
      criteria:
      - 1.M1
    hint_ladder:
    - $|t^2-3t|=t$를 절댓값 안의 부호에 따라 나누어 풀자.
    - $t=3$에서 $v_P$의 식이 바뀐다.
    - 각 구간에서 어느 점이 더 빠른지 보고 차를 적분하자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2024 선행학습 영향평가 보고서」 pp.85-86 문항 해설 및 풀이과정
    steps:
    - id: 1b-1
      content: 두 점의 속도가 같아지는 시각 $t_1$, $t_2$는 $-t^2+3t=t$, $t^2-2t=0$ $\therefore t_1=2$ / $t^2-3t=t$, $t^2-4t=0$ $\therefore t_2=4$
      criteria:
      - 1.M1
    - id: 1b-2
      content: $d_1=\displaystyle\int_0^2\{(-t^2+3t)-t\}dt=\int_0^2(-t^2+2t)dt=\left[-\dfrac13t^3+t^2\right]_0^2=\dfrac43$
      criteria:
      - 1.M2
    - id: 1b-3
      content: $d_2=\displaystyle\int_2^3\{t-(-t^2+3t)\}dt+\int_3^4\{t-(t^2-3t)\}dt=\int_2^3(t^2-2t)dt+\int_3^4(-t^2+4t)dt=\left[\dfrac13t^3-t^2\right]_2^3+\left[-\dfrac13t^3+2t^2\right]_3^4=3$
      criteria:
      - 1.M3
    - id: 1b-4
      content: $\therefore d_1+d_2=\dfrac{13}{3}$
      criteria:
      - 1.A1
