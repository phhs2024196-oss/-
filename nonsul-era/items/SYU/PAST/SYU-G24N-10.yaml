stem: 자연수 $n$에 대하여 곡선 $y=\log_2 x$가 두 직선 $x=n(n+2)$, $x=(n+1)^2$과 만나는 점을 각각 $\mathrm{P}_n$, $\mathrm{Q}_n$이라 하자. 두 점 $\mathrm{P}_n$, $\mathrm{Q}_n$을 지나는 직선의 기울기를 $a_n$이라 할 때, $\displaystyle\sum_{k=1}^{10}a_k=\log_2\dfrac{q}{p}$를 만족시키는 $p+q$의 값을 구하시오. (단, $p$, $q$는 서로소인 자연수이다.) [10점]
