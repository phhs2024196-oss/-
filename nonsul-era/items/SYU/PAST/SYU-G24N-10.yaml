    key_idea: $(n+1)^2-n(n+2)=1$이므로 $a_n=\log_2\dfrac{(n+1)^2}{n(n+2)}$, 합은 진수의 곱으로 소거된다.
    steps:
    - id: 1a
      content: $(n+1)^2-n(n+2)=1$이므로 $a_n=\log_2\dfrac{(n+1)^2}{n(n+2)}$, 합은 진수의 곱으로 소거된다.
      criteria:
      - 1.M1
    hint_ladder:
    - 두 점의 $x$좌표의 차를 계산해 보자.
    - 로그의 합은 진수의 곱이다.
    - $\dfrac{(k+1)^2}{k(k+2)}=\dfrac{k+1}{k}\cdot\dfrac{k+1}{k+2}$로 나누어 곱해 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2024 선행학습 영향평가 보고서」 pp.87-88 문항 해설 및 풀이과정
    steps:
    - id: 1b-1
      content: $y=\log_2x$와 두 직선과 만나는 점은 $\mathrm{P}_n(n(n+2),\log_2n(n+2))$, $\mathrm{Q}_n((n+1)^2,\log_2(n+1)^2)$
      criteria:
      - 1.M1
    - id: 1b-2
      content: $a_n=\dfrac{\log_2(n+1)^2-\log_2n(n+2)}{(n+1)^2-n(n+2)}=\log_2\dfrac{(n+1)^2}{n(n+2)}$
      criteria:
      - 1.M2
    - id: 1b-3
      content: $\displaystyle\sum_{k=1}^{10}a_k=\sum_{k=1}^{10}\log_2\dfrac{(k+1)^2}{k(k+2)}=\log_2\left(\dfrac{2\cdot2}{1\cdot3}\right)+\log_2\left(\dfrac{3\cdot3}{2\cdot4}\right)+\log_2\left(\dfrac{4\cdot4}{3\cdot5}\right)+\cdots+\log_2\left(\dfrac{11\cdot11}{10\cdot12}\right)=\log_2\left(\dfrac{2\cdot11}{12}\right)=\log_2\dfrac{11}{6}$ (공식 해설의 셋째 항은 $\dfrac{3\cdot3}{3\cdot5}$로 인쇄되어 있으나 $\dfrac{4\cdot4}{3\cdot5}$가 맞다)
      criteria:
      - 1.M3
    - id: 1b-4
      content: $\therefore p+q=17$
      criteria:
      - 1.A1
