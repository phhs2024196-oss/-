  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\sin\left(2x-\dfrac\pi2\right)=-\cos2x$, $\cos\left(3x+\dfrac\pi2\right)=-\sin3x$로 바꾸고 대칭축과 주기로 해의 합을 구한다.
    steps:
    - id: 1a
      content: $\sin\left(2x-\dfrac\pi2\right)=-\cos2x$, $\cos\left(3x+\dfrac\pi2\right)=-\sin3x$로 바꾸고 대칭축과 주기로 해의 합을 구한다.
      criteria:
      - 1.M1
    hint_ladder:
    - 두 방정식을 $\cos2x$, $\sin3x$에 대한 식으로 바꾸어 보자.
    - $0\le x<2\pi$이면 $2x$, $3x$의 범위는?
    - 한 주기 안의 두 해는 어떤 직선에 대칭인가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2024 선행학습 영향평가 보고서」 pp.89-90 문항 해설 및 풀이과정
    steps:
    - id: 1b-1
      content: '$\sin\left(2x-\dfrac\pi2\right)=\sin\left(2\left(x-\dfrac\pi4\right)\right)=\dfrac12\ (=-\cos2x)$ : 주기 $\pi$. 근은 총 4개$(\alpha_1,\alpha_2,\alpha_3,\alpha_4)$이고, $\alpha_1$, $\alpha_2$는 $x=\dfrac\pi2$에 대하여 대칭이므로 $\alpha_1+\alpha_2=\pi$. 주기 $\pi$이므로 $\alpha_3+\alpha_4=\alpha_1+\alpha_2+2\pi=3\pi$. $\therefore\alpha=4\pi$'
      criteria:
      - 1.M1
    - id: 1b-2
      content: '$\cos\left(3x+\dfrac\pi2\right)=\cos\left(3\left(x+\dfrac16\pi\right)\right)=\dfrac13\ (=-\sin3x)$ : 주기 $\dfrac23\pi$. 근은 총 6개이고, $\beta_1+\beta_2=2\times\dfrac\pi2=\pi$, $\beta_3+\beta_4=\beta_1+\beta_2+\dfrac43\pi=\dfrac73\pi$, $\beta_5+\beta_6=\beta_3+\beta_4+\dfrac43\pi=\dfrac{11}{3}\pi$. $\therefore\beta=7\pi$'
      criteria:
      - 1.M2
    - id: 1b-3
      content: $\therefore\beta-\alpha=3\pi$
      criteria:
      - 1.A1
