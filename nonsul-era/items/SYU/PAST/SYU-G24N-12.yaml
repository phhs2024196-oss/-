stem: |
  두 함수

  $$f(x)=\begin{cases}\log_2(x+1) & (x\ge 1)\\ 2^{x-2} & (x<1)\end{cases},\quad g(x)=ax^2+bx+1$$

  에 대하여 함수 $\dfrac{g(x)}{f(x)}$와 함수 $\dfrac{g(x)}{f(-x)}$가 모두 실수 전체의 집합에서 연속일 때, $a$, $b$의 값을 구하시오. (단 $a$, $b$는 상수이다.) [10점]
