  concepts:
  - 함수의 연속
  - 좌극한·우극한
  - 지수함수·로그함수의 함숫값
  tools:
  - 경계점에서 좌우 극한 비교
  - $f(-x)$의 구간 변환
  - 연립방정식
  conditions:
  - $f$는 $x=1$에서 불연속($1$과 $\dfrac12$)
  - $f(-x)$는 $x=-1$에서 불연속
  - $f>0$이므로 분모 0 문제 없음
