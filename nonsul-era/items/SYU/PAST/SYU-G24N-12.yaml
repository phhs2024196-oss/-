  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f$는 $x=1$에서, $f(-x)$는 $x=-1$에서 끊기므로 그 점에서 분자 $g$가 0이어야 몫이 연속이다.
    steps:
    - id: 1a
      content: $f$는 $x=1$에서, $f(-x)$는 $x=-1$에서 끊기므로 그 점에서 분자 $g$가 0이어야 몫이 연속이다.
      criteria:
      - 1.M1
    hint_ladder:
    - $f(x)$는 어디에서 불연속인가?
    - 분모의 좌우 극한이 다를 때 몫이 연속이려면 분자는?
    - $f(-x)$는 $-x\ge1$, 즉 $x\le-1$에서 로그식이다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2024 선행학습 영향평가 보고서」 pp.91-92 문항 해설 및 풀이과정
    steps:
    - id: 1b-1
      content: $\dfrac{g(x)}{f(x)}$가 $x=1$에서 연속이려면 $\displaystyle\lim_{x\to1-}\dfrac{ax^2+bx+1}{2^{x-2}}=\lim_{x\to1+}\dfrac{ax^2+bx+1}{\log_2(x+1)}$, $\therefore a+b+1=0$ …①
      criteria:
      - 1.M1
    - id: 1b-2
      content: $\dfrac{g(x)}{f(-x)}$가 $x=-1$에서 연속이려면, $f(-x)=\begin{cases}\log_2(-x+1) & (x\le-1)\\ 2^{-x-2} & (x>-1)\end{cases}$
      criteria:
      - 1.M2
    - id: 1b-3
      content: $\displaystyle\lim_{x\to-1-}\dfrac{ax^2+bx+1}{\log_2(-x+1)}=\lim_{x\to-1+}\dfrac{ax^2+bx+1}{2^{-x-2}}$, $\therefore a-b+1=0$ …②
      criteria:
      - 1.M3
    - id: 1b-4
      content: ①과 ②를 연립하여 $a=-1$, $b=0$
      criteria:
      - 1.A1
