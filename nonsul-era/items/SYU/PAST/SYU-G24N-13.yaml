  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 극한이 존재하려면 분자→0, 그 뒤 분자를 $f(t+a)-f(a)$ 꼴로 묶어 미분계수로 바꾼다.
    steps:
    - id: 1a
      content: 극한이 존재하려면 분자→0, 그 뒤 분자를 $f(t+a)-f(a)$ 꼴로 묶어 미분계수로 바꾼다.
      criteria:
      - 1.M1
    hint_ladder:
    - 분모가 0으로 가는데 극한값이 있으면 분자는?
    - $f(x-1)+2=f(x-1)-f(3)$으로 볼 수 있다.
    - (나)의 분자에서 $f(2)$, $f(3)$을 빼고 더해 묶어 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2024 선행학습 영향평가 보고서」 pp.93-94 문항 해설 및 풀이과정
    steps:
    - id: 1b-1
      content: (가)에서 $x\to4$에서 극한값을 가지려면 $f(3)+2=0$ $\therefore f(3)=-2$
      criteria:
      - 1.M1
    - id: 1b-2
      content: (가)에서 $x-4=t$로 치환하면 $\displaystyle\lim_{t\to0}\dfrac{f(t+3)+2}{t}=\lim_{t\to0}\dfrac{f(t+3)-f(3)}{t}=-4$ $\therefore f'(3)=-4$
      criteria:
      - 1.M2
    - id: 1b-3
      content: (나)에서 $x-2=t$로 치환하면 $\displaystyle\lim_{t\to0}\dfrac{2f(t+2)+3f(t+3)+t+2}{t}=\lim_{t\to0}\dfrac1t[2\{f(t+2)-f(2)\}+3\{f(t+3)-f(3)\}+2f(2)+3f(3)+t+2]=2f'(2)+3f'(3)+\lim_{t\to0}\dfrac{t+2f(2)+3f(3)+2}{t}$. 마지막 항이 극한값을 가지려면 $2f(2)+3f(3)+2=0$, $2f(2)-6+2=0$ $\therefore f(2)=2$
      criteria:
      - 1.M3
    - id: 1b-4
      content: (나)에서 $2f'(2)+3f'(3)+1=1$, $2f'(2)-12=0$ $\therefore f'(2)=6$, $\therefore f(2)+f'(2)=8$
      criteria:
      - 1.A1
