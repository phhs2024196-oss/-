stimuli: []
stem: |
  함수 $f(x)$가 다음 조건을 만족시킨다.

  (가) $\displaystyle\lim_{x\to4}\dfrac{f(x-1)+2}{x-4}=-4$
  (나) $\displaystyle\lim_{x\to2}\dfrac{2f(x)+3f(x+1)+x}{x-2}=1$

  $f(2)+f'(2)$의 값을 구하시오. (단, 로피탈 정리는 사용할 수 없다.) [10점]
elements:
  materials:
  - 극한 조건 두 개로 주어진 함수 $f(x)$
  concepts:
  - $\dfrac00$ 꼴 극한의 조건
  - 미분계수의 정의
  tools:
  - 치환 $x-4=t$, $x-2=t$
  - 분자 재배열
  conditions:
  - (가) → $f(3)=-2$, $f'(3)=-4$
  - (나) → $2f(2)+3f(3)+2=0$, $2f'(2)+3f'(3)+1=1$
