  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\cos\left(-ax+\dfrac{3\pi}8\right)=\sin\left(ax+\dfrac\pi8\right)$이므로 $f(x)=8a\sin\left(ax+\dfrac\pi8\right)+3$; $y=3$과의 교점은 한 주기에 2개.
    steps:
    - id: 1a
      content: $\cos\left(-ax+\dfrac{3\pi}8\right)=\sin\left(ax+\dfrac\pi8\right)$이므로 $f(x)=8a\sin\left(ax+\dfrac\pi8\right)+3$; $y=3$과의 교점은 한 주기에 2개.
      criteria:
      - 1.M1
    hint_ladder:
    - $\cos$의 각에서 $-ax$의 부호를 정리해 보자.
    - $\cos\theta=\sin\left(\theta+\dfrac\pi2\right)$
    - $y=3$과 만나는 점은 $\sin(\cdots)=0$인 점이다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2024 선행학습 영향평가 보고서」 pp.95-96 문항 해설 및 풀이과정
    steps:
    - id: 1b-1
      content: $f(x)$의 두 번째 항에서 $\cos\left(-ax+\dfrac{3\pi}8\right)=\cos\left(ax-\dfrac{3\pi}8\right)=\sin\left(ax-\dfrac{3\pi}8+\dfrac\pi2\right)=\sin\left(ax+\dfrac\pi8\right)$
      criteria:
      - 1.M1
    - id: 1b-2
      content: $f(x)=8a\sin\left(ax+\dfrac\pi8\right)+3$ 그래프의 주기는 $\dfrac{2\pi}{a}$. 주어진 $x$의 영역에서 주기에 따른 근의 개수는 $a=1$일 때 2, $a=2$일 때 4, $a=3$일 때 6 $\therefore a=3$
      criteria:
      - 1.M2
    - id: 1b-3
      content: 그래프의 최댓값 $M=8a+3=27$ $\therefore a+M=30$
      criteria:
      - 1.A1
