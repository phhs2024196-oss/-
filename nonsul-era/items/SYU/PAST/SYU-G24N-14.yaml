stem: $0\le x<2\pi$일 때, 함수 $f(x)=5a\sin\left(ax+\dfrac{\pi}{8}\right)+3a\cos\left(-ax+\dfrac{3\pi}{8}\right)+3$의 그래프가 직선 $y=3$과 여섯 개의 점에서 만난다. $a$의 값과 함수 $f(x)$의 최댓값 $M$의 합, $a+M$의 값을 구하시오. (단, $a$는 양의 정수이다.) [10점]
