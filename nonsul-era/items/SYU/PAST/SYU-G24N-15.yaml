stem: |
  함수 $f(x)$가 실수 전체의 집합에서 연속이고, 다음 조건을 만족시킨다.

  (가) $f(x)=\begin{cases}a(x^2+3x) & (-1\le x<0)\\ -x^3+ax & (0\le x<1)\end{cases}$
  (나) $f(x+2)=f(x)+2$

  $\displaystyle\int_0^{24}f(x)dx$의 값을 구하시오. (단, $a$는 상수이다)
