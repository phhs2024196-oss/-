  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 연속 조건으로 $a=1$; $f(x+2)=f(x)+2$이므로 길이 2 구간의 적분은 매번 4씩 늘어 등차수열을 이룬다.
    steps:
    - id: 1a
      content: 연속 조건으로 $a=1$; $f(x+2)=f(x)+2$이므로 길이 2 구간의 적분은 매번 4씩 늘어 등차수열을 이룬다.
      criteria:
      - 1.M1
    hint_ladder:
    - $x=1$에서의 연속 조건을 (나)로 $f(-1)$과 연결해 보자.
    - $[1,2]$에서 $f(x)=f(x-2)+2$이다.
    - 길이 2인 구간마다 적분값이 얼마씩 늘어나는가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2024 선행학습 영향평가 보고서」 pp.97-99 문항 해설 및 풀이과정
    steps:
    - id: 1b-1
      content: 주어진 함수의 조건에서 $f(-1)+2=f(1)$, $a(-2)+2=-1+a$ $\therefore a=1$, $f(x)=\begin{cases}x^2+3x & (-1\le x<0)\\ -x^3+x & (0\le x<1)\end{cases}$
      criteria:
      - 1.M1
    - id: 1b-2
      content: $\displaystyle\int_0^2f(x)dx=\int_0^1f(x)dx+\int_1^2f(x)dx=\int_0^1(-x^3+x)dx+\int_{-1}^0(x^2+3x+2)dx=\left[-\dfrac14x^4+\dfrac12x^2\right]_0^1+\left[\dfrac13x^3+\dfrac32x^2+2x\right]_{-1}^0=\dfrac{13}{12}$
      criteria:
      - 1.M2
    - id: 1b-3
      content: $\displaystyle\int_2^4f(x)dx=\int_0^2f(x)dx+4$(사각형의 넓이), $\displaystyle\int_0^{24}f(x)dx=\int_0^2f(x)dx+\int_2^4f(x)dx+\cdots+\int_{22}^{24}f(x)dx=S_1+S_2+\cdots+S_{12}$. $S_n$은 초항 $S_1=\dfrac{13}{12}$, 공차 4인 등차수열
      criteria:
      - 1.M3
    - id: 1b-4
      content: $\displaystyle\sum_{k=1}^{12}S_k=\dfrac{(12)\left\{2\cdot\dfrac{13}{12}+(12-1)(4)\right\}}{2}=277$
      criteria:
      - 1.A1
