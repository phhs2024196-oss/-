stem: 수직선 위를 움직이는 점 P의 시각 $t\ (t\ge 0)$에서의 속도 $v(t)$가 $v(t)=-t^2+t$이다. 점 P가 $t=0$일 때 원점을 출발하여 다시 원점으로 돌아오는 시각을 $k$라 하자. $t=0$에서 $t=k$까지 점 P가 움직인 거리와 시각 $k$를 각각 구하시오. [10점]
