    key_idea: 원점 복귀 ⇔ $\int_0^kv\,dt=0$으로 $k$를 구하고, 거리는 $\int_0^k|v|\,dt$.
    steps:
    - id: 1a
      content: 원점 복귀 ⇔ $\int_0^kv\,dt=0$으로 $k$를 구하고, 거리는 $\int_0^k|v|\,dt$.
      criteria:
      - 1.M1
    hint_ladder:
    - 원점으로 돌아왔다면 위치의 변화량은?
    - $v(t)$의 부호가 바뀌는 시각을 찾자.
    - 거리는 $|v(t)|$를 적분한다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2024 선행학습 영향평가 보고서」 pp.122-123 문항 해설 및 풀이과정
    steps:
    - id: 1b-1
      content: 위치의 변화량이 0이므로 $\displaystyle\int_0^k(-t^2+t)dt=\left(-\dfrac13t^3+\dfrac12t^2\right)_0^k=-\dfrac13k^3+\dfrac12k^2=-\dfrac16k^2(2k-3)=0$ $\therefore k=\dfrac32$
      criteria:
      - 1.M1
    - id: 1b-2
      content: '점 P가 움직임이 바뀌는 순간 $v(t)=0$이므로 $v(t)=-t^2+t=-t(t-1)$. 따라서 $t=0$에서 $t=\dfrac32$까지 움직인 거리를 $d$라 할 때, $d=\displaystyle\int_0^{\frac32}|-t^2+t|dt=2\int_0^1(-t^2+t)dt=2\left[-\dfrac13t^3+\dfrac12t^2\right]_0^1=2\cdot\dfrac16=\dfrac13$ (보충: $\displaystyle\int_1^{\frac32}(t^2-t)dt=\dfrac16=\int_0^1(-t^2+t)dt$이므로 2배로 쓸 수 있다)'
      criteria:
      - 1.M2
