stem: |
  그림과 같이 서로 다른 네 점 A, B, C, D가 지름 AB의 길이가 5인 원 위에 있다. $\angle\mathrm{CAB}$의 이등분선이 점 D와 만나고 선분 BD의 길이가 3일 때, 선분 AC의 길이를 구하시오. (단, 삼각함수의 덧셈정리, 배각의 공식은 사용할 수 없다.) [10점]

  [그림: 원의 지름 AB가 수평으로 그려져 있고(A 왼쪽, B 오른쪽, 중심에 점), 점 C는 원의 왼쪽 위 A 가까이, 점 D는 원의 위쪽(중심보다 약간 오른쪽)에 있다. 선분 AC, CD, AD, DB가 그려져 있고, 점 A에서 $\angle\mathrm{CAD}$와 $\angle\mathrm{DAB}$에 같은 표시(점)가 있다.]
