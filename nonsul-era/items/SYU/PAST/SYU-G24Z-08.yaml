    steps:
    - id: 1a
      content: 지름의 원주각 $90^\circ$로 $\mathrm{AD}=4$, 같은 원주각이므로 $\mathrm{CD}=\mathrm{BD}=3$, 삼각형 ACD에 코사인법칙.
      criteria:
      - 1.M1
    hint_ladder:
    - 지름 AB에 대한 원주각 $\angle\mathrm{ADB}$는?
    - 같은 크기의 원주각에 대한 현의 길이는 같다.
    - 삼각형 ACD에 코사인법칙을 쓰자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2024 선행학습 영향평가 보고서」 pp.124-125 문항 해설 및 풀이과정
    steps:
    - id: 1b-1
      content: 삼각형 ABD에서 $\angle\mathrm{ADB}=90^\circ$이므로 $\overline{\mathrm{AD}}=\sqrt{\overline{\mathrm{AB}}^2-\overline{\mathrm{BD}}^2}=\sqrt{5^2-3^2}=4$
      criteria:
      - 1.M1
    - id: 1b-2
      content: $\angle\mathrm{DAB}=\theta$라 할 때 $\cos\theta=\dfrac45$. $\angle\mathrm{CAD}=\angle\mathrm{DAB}$이므로 $\overline{\mathrm{CD}}=\overline{\mathrm{BD}}=3$
      criteria:
      - 1.M2
    - id: 1b-3
      content: 코사인법칙에 의해 $\overline{\mathrm{CD}}^2=\overline{\mathrm{AC}}^2+\overline{\mathrm{AD}}^2-2\overline{\mathrm{AC}}\,\overline{\mathrm{AD}}\cos\theta$, $9=x^2+16-2\cdot x\cdot4\cdot\dfrac45$, $x^2-\dfrac{32}{5}x+7=0$, $5x^2-32x+35=(5x-7)(x-5)=0$, $\therefore x=\dfrac75,\ 5$. $\overline{\mathrm{AC}}$은 지름의 길이보다 작으므로 $\overline{\mathrm{AC}}=\dfrac75$ (공식 해설에는 둘째 식의 '−'가 '='로 인쇄되어 있다)
      criteria:
      - 1.M3
      - 1.A1
