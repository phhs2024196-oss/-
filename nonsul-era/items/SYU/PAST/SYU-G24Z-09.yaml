    key_idea: 점근선 $x=m-\dfrac34$가 $y$축의 오른쪽(또는 위)이면 항상 가능, 왼쪽이면 $y$절편 $\le0$이어야 한다.
    steps:
    - id: 1a
      content: 점근선 $x=m-\dfrac34$가 $y$축의 오른쪽(또는 위)이면 항상 가능, 왼쪽이면 $y$절편 $\le0$이어야 한다.
      criteria:
      - 1.M1
    hint_ladder:
    - 평행이동한 그래프의 점근선은?
    - 점근선이 $y$축 오른쪽에 있으면 어떻게 되는가?
    - 점근선이 $y$축 왼쪽이면 $y$절편의 부호를 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2024 선행학습 영향평가 보고서」 pp.127-128 문항 해설 및 풀이과정
    steps:
    - id: 1b-1
      content: 함수 $f(x)$를 $x$축으로 평행이동 하면 $f(x)=\log_2\left(x-m+\dfrac34\right)+2$. $y=f(x)$의 그래프가 2사분면을 지나지 않을 조건은 $f(0)\le0$일 때이므로 $f(0)=\log_2\left(-m+\dfrac34\right)+2$에서 $f(0)$의 값이 존재하기 위해서는 $-m+\dfrac34>0$ $\therefore m<\dfrac34$이어야 한다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: i) $m\ge\dfrac34$인 경우, $f(x)=\log_2\left(x-m+\dfrac34\right)+2$의 점근선이 항상 양수이므로 $f(x)$는 2사분면을 지나지 않는다.
      criteria:
      - 1.M2
    - id: 1b-3
      content: ii) $m<\dfrac34$인 경우, $f(0)$ 값이 존재하고 $f(0)=\log_2\left(-m+\dfrac34\right)+2\le0$이므로 $\log_2\left(-m+\dfrac34\right)\le\log_22^{-2}$, $-m+\dfrac34\le\dfrac14$ $\therefore\dfrac12\le m<\dfrac34$
      criteria:
      - 1.M3
    - id: 1b-4
      content: i)와 ii)에 의해 $m\ge\dfrac12$
      criteria:
      - 1.A1
