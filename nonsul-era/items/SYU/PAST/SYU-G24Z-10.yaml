    key_idea: $x=1$, $x=4$에서 연속; $x=4$의 우극한은 주기 5로 $x=-1$의 값과 같다.
    steps:
    - id: 1a
      content: $x=1$, $x=4$에서 연속; $x=4$의 우극한은 주기 5로 $x=-1$의 값과 같다.
      criteria:
      - 1.M1
    hint_ladder:
    - $x=1$에서 양쪽 식의 값이 같아야 한다.
    - $x=4$ 바로 오른쪽의 값은 주기 5로 어디의 값과 같은가?
    - $22$를 5로 나눈 나머지 쪽으로 옮기자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2024 선행학습 영향평가 보고서」 pp.129-130 문항 해설 및 풀이과정
    steps:
    - id: 1b-1
      content: 조건 (나)에서 $f(x)$는 $x=1$에서 연속이므로 $\displaystyle\lim_{x\to1-}f(x)=\lim_{x\to1+}f(x)$, $3=\dfrac{a+b}{3}$ $\therefore a+b=9$ …①
      criteria:
      - 1.M1
    - id: 1b-2
      content: $f(x)$는 $x=4$에서 연속이고 조건 (가)에 의해 $\displaystyle\lim_{x\to4-}f(x)=\lim_{x\to4+}f(x)=\lim_{x\to-1+}f(x)$, $\dfrac{4a+b}{6}=(-1)^2-1+1=1$ $\therefore 4a+b=6$ …②
      criteria:
      - 1.M2
    - id: 1b-3
      content: ①, ②를 연립하면 $a=-1$, $b=10$. $f(22)=f(2)=\dfrac{2a+b}{4}=\dfrac14(-2+10)=2$
      criteria:
      - 1.A1
