  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $g(x)=-\cos3x$, $\sin^2=1-\cos^2$으로 $\left(\cos3x-\dfrac12\right)^2=0$.
    steps:
    - id: 1a
      content: $g(x)=-\cos3x$, $\sin^2=1-\cos^2$으로 $\left(\cos3x-\dfrac12\right)^2=0$.
      criteria:
      - 1.M1
    hint_ladder:
    - $x$축 방향 평행이동은 $x$ 대신 $x-\dfrac\pi6$
    - $\sin^2$을 $\cos$로 바꾸면 $\cos3x$의 이차식
    - $3x$의 범위를 확인하자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2024 선행학습 영향평가 보고서」 pp.131-132 문항 해설 및 풀이과정
    steps:
    - id: 1b-1
      content: $g(x)=\sin3\left(x-\dfrac\pi6\right)=\sin\left(3x-\dfrac\pi2\right)=-\cos3x$
      criteria:
      - 1.M1
    - id: 1b-2
      content: $\{f(x)\}^2=g(x)+\dfrac54$에서 $\sin^23x=-\cos3x+\dfrac54$, $\sin^23x=1-\cos^23x$이므로 $1-\cos^23x=-\cos3x+\dfrac54$, $\cos^23x-\cos3x+\dfrac14=\left(\cos3x-\dfrac12\right)^2=0$ $\therefore\cos3x=\dfrac12$
      criteria:
      - 1.M2
    - id: 1b-3
      content: $0\le x<\dfrac23\pi$에서 $0\le3x<2\pi$이므로 $3x=\dfrac\pi3,\ \dfrac53\pi$ $\therefore x=\dfrac\pi9,\ \dfrac59\pi$
      criteria:
      - 1.A1
