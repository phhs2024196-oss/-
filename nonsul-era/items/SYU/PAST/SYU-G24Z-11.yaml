stem: 함수 $f(x)=\sin 3x$에 대하여 $y=f(x)$의 그래프를 $x$축 방향으로 $\dfrac{\pi}{6}$만큼 평행이동한 그래프를 $y=g(x)$라 하자. $0\le x<\dfrac{2}{3}\pi$일 때, 방정식 $\{f(x)\}^2=g(x)+\dfrac{5}{4}$를 만족시키는 모든 실수 $x$의 값을 구하시오. [10점]
