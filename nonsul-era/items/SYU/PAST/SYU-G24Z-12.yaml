    steps:
    - id: 1a
      content: $a_{26}=0$이고 $|a_k|$가 $k=26$에 대칭이므로 앞 25항의 2배, 유리화 후 망원합.
      criteria:
      - 1.M1
    hint_ladder:
    - $|a_{25}|=|a_{27}|$이면 $a_{26}$은?
    - $|a_k|$는 $k=26$을 기준으로 대칭이다.
    - 분모를 유리화하면 차가 공차로 일정하다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2024 선행학습 영향평가 보고서」 pp.133-134 문항 해설 및 풀이과정
    steps:
    - id: 1b-1
      content: $|a_{25}|=|a_{27}|$에서 $a_{25}=-a_{27}$이므로 $a_{26}=0$
      criteria:
      - 1.M1
    - id: 1b-2
      content: 공차가 $-4$인 등차수열 $\{a_n\}$은 $a_n=a_1-4(n-1)$에서 $a_{26}=a_1-4(25)=0$ $\therefore a_1=100$. 따라서 $a_n=104-4n$
      criteria:
      - 1.M2
    - id: 1b-3
      content: '$\displaystyle\sum_{k=1}^{50}\dfrac{1}{\sqrt{|a_{k+1}|}+\sqrt{|a_k|}}=2\sum_{k=1}^{25}\dfrac{1}{\sqrt{a_{k+1}}+\sqrt{a_k}}=2\sum_{k=1}^{25}\dfrac{\sqrt{a_{k+1}}-\sqrt{a_k}}{a_{k+1}-a_k}=-\dfrac12\sum_{k=1}^{25}(\sqrt{a_{k+1}}-\sqrt{a_k})=-\dfrac12(-\sqrt{a_1}+\sqrt{a_{26}})=-\dfrac12(-10+0)=5$ (보충: $k=26,\dots,50$의 항은 $|a_{26+j}|=|a_{26-j}|$이므로 $k=1,\dots,25$의 항과 같은 값을 거꾸로 늘어놓은 것이어서 2배가 된다)'
      criteria:
      - 1.M3
      - 1.A1
