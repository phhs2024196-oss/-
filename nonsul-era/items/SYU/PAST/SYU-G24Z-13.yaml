  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f(x)=\dfrac58x^2+\dfrac34x+\dfrac58$; 넓이 최대인 $\mathrm{P}_k$는 접선 기울기가 AB의 기울기 $-\dfrac12$와 같은 점.
    steps:
    - id: 1a
      content: $f(x)=\dfrac58x^2+\dfrac34x+\dfrac58$; 넓이 최대인 $\mathrm{P}_k$는 접선 기울기가 AB의 기울기 $-\dfrac12$와 같은 점.
      criteria:
      - 1.M1
    hint_ladder:
    - (가)에서 $f$의 차수와 최고차항 계수는?
    - (나)는 $f(1)$과 $f'(1)$을 알려 준다.
    - 밑변 AB가 고정일 때 높이가 최대인 점은?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2024 선행학습 영향평가 보고서」 pp.135-136 문항 해설 및 풀이과정
    steps:
    - id: 1b-1
      content: (가)에서 $f(x)$는 2차 다항함수이고 $x^2$의 계수는 $\dfrac58$. (나)에서 $f(x)-2=(x-1)\left(\dfrac58x+a\right)$, 또한 (나)에서 $\dfrac58+a=2$ $\therefore a=\dfrac{11}{8}$. $f(x)-2=\dfrac58x^2+\dfrac68x-\dfrac{11}8$ $\therefore f(x)=\dfrac58x^2+\dfrac34x+\dfrac58$
      criteria:
      - 1.M1
    - id: 1b-2
      content: $f(1)=2$, $f'(x)=\dfrac54x+\dfrac34$에서 $(1,2)$에서 접선의 기울기는 $f'(1)=2$. 따라서 점 $(1,2)$ 위의 접선에 수직인 직선의 기울기는 $-\dfrac12$
      criteria:
      - 1.M2
    - id: 1b-3
      content: '$y=f(x)$가 $b<k<1$ 구간에서 $\mathrm{AP}_k\mathrm{B}$의 넓이가 최대가 되게 하는 $\mathrm{P}_k$는 $y=f(x)$의 접선의 기울기가 $-\dfrac12$일 때의 값이므로 $f''(k)=\dfrac54k+\dfrac34=-\dfrac12$, $\dfrac54k=-\dfrac54$ $\therefore k=-1$ (보충: 밑변 AB가 고정이므로 높이, 즉 직선 AB와 $\mathrm{P}_k$ 사이 거리가 최대인 점은 AB에 평행한 접선의 접점이다. 실제로 $b=-3$)'
      criteria:
      - 1.A1
