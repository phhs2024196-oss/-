stem: |
  다항함수 $f(x)$가 다음 조건을 만족시킨다.

  (가) $\displaystyle\lim_{x\to\infty}\dfrac{8f(x)}{x^2+1}=5$
  (나) $\displaystyle\lim_{x\to1}\dfrac{f(x)-2}{x-1}=2$

  곡선 $y=f(x)$ 위의 점 $\mathrm{A}(1,f(1))$에서의 접선과 수직이면서 점 A를 지나는 직선이 $y=f(x)$와 만나는 점 중 A가 아닌 점을 $\mathrm{B}(b,f(b))$라 하자. 직선 $x=k\ (b<k<1)$가 곡선 $y=f(x)$와 만나는 점을 $\mathrm{P}_k$라 할 때, 삼각형 $\mathrm{AP}_k\mathrm{B}$의 넓이가 최대가 되도록 하는 $k$의 값을 구하시오. [10점]
