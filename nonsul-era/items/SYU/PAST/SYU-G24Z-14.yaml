    key_idea: 첫 극한을 $f(4)$를 빼고 더해 $\dfrac52(f'(4)-f(4))=5$로, 둘째 극한을 $x-3=t$로 $f'(4)-f(4)+1$로 만든다.
    steps:
    - id: 1a
      content: 첫 극한을 $f(4)$를 빼고 더해 $\dfrac52(f'(4)-f(4))=5$로, 둘째 극한을 $x-3=t$로 $f'(4)-f(4)+1$로 만든다.
      criteria:
      - 1.M1
    hint_ladder:
    - 분자에 $f(4)$를 빼고 더해 보자.
    - $\dfrac{f(-3x+4)-f(4)}{-3x}\to f'(4)$가 되도록 분모를 맞추자.
    - 둘째 극한은 $x-3=t$로 치환.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2024 선행학습 영향평가 보고서」 pp.137-138 문항 해설 및 풀이과정
    steps:
    - id: 1b-1
      content: 주어진 식으로부터 $\displaystyle\lim_{x\to0}\dfrac{f(2x+4)-f(4)+f(4)-f(-3x+4)-5xf(4)}{2x}=\lim_{x\to0}\dfrac{f(2x+4)-f(4)}{2x}+\lim_{x\to0}\dfrac{f(-3x+4)-f(4)}{-2x\cdot\frac32}\cdot\dfrac32-\dfrac52f(4)=f'(4)+\dfrac32f'(4)-\dfrac52f(4)=\dfrac52(f'(4)-f(4))=5$ $\therefore f'(4)-f(4)=2$
      criteria:
      - 1.M1
    - id: 1b-2
      content: $x-3=t$로 치환하면, $x\to3$는 $t=0$이고 $x=t+3$이므로 $\displaystyle\lim_{t\to0}\dfrac{f(t+4)-(t+1)f(4)}{t}+1=\lim_{t\to0}\dfrac{f(t+4)-f(4)}{t}-f(4)+1=f'(4)-f(4)+1=2+1=3$
      criteria:
      - 1.M2
      - 1.A1
