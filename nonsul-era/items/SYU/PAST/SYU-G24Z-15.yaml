  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 극한값은 $f(a^2)$; $u=a^2\ge0$에서 $f(u)=5$의 근 개수를 극댓값 $m+4$·극솟값 $m$으로 분류한다.
    steps:
    - id: 1a
      content: 극한값은 $f(a^2)$; $u=a^2\ge0$에서 $f(u)=5$의 근 개수를 극댓값 $m+4$·극솟값 $m$으로 분류한다.
      criteria:
      - 1.M1
    hint_ladder:
    - $\int_{a^2}^{x^2}f(t)dt=F(x^2)-F(a^2)$로 써 보자.
    - $f(a^2)=5$에서 $u=a^2\ge0$의 개수와 $a$의 개수의 관계는?
    - 극댓값과 극솟값이 5보다 큰지 작은지로 나누자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2024 선행학습 영향평가 보고서」 pp.139-140 문항 해설 및 풀이과정
    steps:
    - id: 1b-1
      content: $f(x)=t^3-6t^2+9t+m$의 부정적분 중 하나를 $F(x)$라 하고, $x^2=u$로 치환하면 $x\to a$일 때 $u\to a^2$이므로 $\displaystyle\lim_{x\to a}\dfrac{1}{x^2-a^2}\int_{a^2}^{x^2}f(t)dt=\lim_{u\to a^2}\dfrac{F(u)-F(a^2)}{u-a^2}=F'(a^2)=f(a^2)=5$
      criteria:
      - 1.M1
    - id: 1b-2
      content: $f(a^2)=5$를 만족하는 $a^2\ge0$인 $a$의 개수를 구하기 위해, $f'(x)=3x^2-12x+9=3(x-1)(x-3)$, 극댓값 $f(1)=m+4$, 극솟값 $f(3)=m$
      criteria:
      - 1.M2
    - id: 1b-3
      content: '$m$의 조건에 따라 $f(a^2)=5$를 만족하는 $a$의 개수: $m<1$이면 $a^2$ 1개, $a$ 2개; $m=1$이면 2개, 4개; $1<m<5$이면 3개, 6개; $m=5$이면 $a^2$ 2개($a^2=0$ 포함), $a$ 3개($a^2=0$일 때 $a$는 1개의 근); $m>5$이면 0개. $\therefore$ $a$의 개수가 4개 이상인 $m$은 $1\le m<5$, $m=1,2,3,4$이므로 모든 $m$의 합은 10'
      criteria:
      - 1.M3
      - 1.A1
