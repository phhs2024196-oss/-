stem: |
  두 정수 $a$, $b$와 자연수 $k$에 대하여 다음 조건을 만족시키는 모든 $k$의 값의 합을 $A$, 모든 $ab$의 값의 합을 $B$라 할 때, $A+B$의 값을 구하시오. [10점]

  $$\sqrt[k]{a}\times\sqrt[k]{b}=-\sqrt[5]{2}\qquad(3<k<50)$$

elements:
  materials:
  - 실수 $k$제곱근의 곱 $\sqrt[k]{a}\times\sqrt[k]{b}=-\sqrt[5]{2}$
  - 정수 $a$, $b$와 범위 $3<k<50$인 자연수 $k$
  concepts:
  - 거듭제곱근의 뜻
  - 실수 $k$제곱근의 부호($k$ 홀수·짝수)
  - 유리수 지수
  - 등차수열의 합
  - 등비수열의 합
  tools:
  - 양변을 $k$제곱
  - 지수가 정수가 되는 조건 판정
  - 등차·등비수열 합 공식
  conditions:
  - 좌변이 음수 → 한 근은 음수 → $k$ 홀수
  - $ab=-2^{\frac{k}{5}}$가 정수 → $k$는 5의 배수
  - $3<k<50$ → $k=5,15,25,35,45$
  stimuli_used: []
  subpart_links: 단일 논제

