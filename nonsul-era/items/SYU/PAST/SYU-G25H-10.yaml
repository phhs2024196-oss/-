subparts:
- id: '1'
  stem: |
    $A+B$의 값을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: -557, equivalents: ['$A=125$', '$B=-682$'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 곱이 음수이므로 $k$는 홀수, $k$제곱하면 $ab=-2^{\frac{k}{5}}$이고 정수가 되려면 $k$는 5의 배수이다.
    steps:
    - id: 1a
      content: |
        $k$ 홀수 + $ab=-2^{\frac{k}{5}}$ 정수 → $k=5,15,25,35,45$, $A=125$, $B=-2-2^3-2^5-2^7-2^9=-682$, $A+B=-557$.
      criteria: [1.R1, 1.A1, 1.A2]
    hint_ladder:
    - 좌변의 두 거듭제곱근 중 하나는 음수여야 한다. 음수의 실수 $k$제곱근은 언제 존재하는가?
    - 양변을 $k$제곱해 $ab$를 $k$로 나타내 보자.
    - $ab$가 정수가 되려면 $\frac{k}{5}$는 어떤 수여야 하는가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2025 선행학습 영향평가 보고서」 p.50–51 문항 해설 및 풀이과정
    steps:
    - id: 1b-1
      content: |
        $\sqrt[k]{a}\times\sqrt[k]{b}=-\sqrt[5]{2}$에서 $\sqrt[k]{a}\times\sqrt[k]{b}$의 값이 음수이므로 $\sqrt[k]{a}$, $\sqrt[k]{b}$ 중 하나는 양수, 하나는 음수이다.
        $\sqrt[k]{a}$가 음수라 할 때, $\sqrt[k]{a}$는 $a$의 $k$제곱근 중 실수이고 이 값이 음수이므로 $k$는 홀수이어야 한다.
      criteria: [1.R1]
    - id: 1b-2
      content: |
        양변을 $k$제곱하면 $a\times b=(-1)^k\times(\sqrt[5]{2})^k=(-1)^k\times2^{\frac{k}{5}}=-2^{\frac{k}{5}}$ ($k$가 홀수).
        $ab=-2^{\frac{k}{5}}$의 값이 정수이어야 하므로 $\frac{k}{5}$는 자연수, 즉 $k=5,\ 15,\ 25,\ 35,\ 45$ $(3<k<50)$.
        (보충: $\frac{k}{5}$가 자연수가 아니면 $2^{\frac{k}{5}}$는 무리수이다. 또 $a=-1$, $b=2^{\frac{k}{5}}$처럼 정수쌍이 실제로 존재한다.)
        등차수열의 합 공식 $S_n=\dfrac{n(a+l)}{2}=\dfrac{5(5+45)}{2}=125$ $\therefore A=125$
      criteria: [1.A1]
    - id: 1b-3
      content: |
        $ab=-2^1,\ -2^3,\ -2^5,\ -2^7,\ -2^9$
        등비수열의 합 공식 $S_n=\dfrac{a(r^n-1)}{r-1}=\dfrac{-2(2^{10}-1)}{2^2-1}=-682$ $\therefore B=-682$
        $\therefore A+B=-557$
      criteria: [1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.R1
      mark_type: R
      points: 2
      evidence: $k$의 값이 홀수이어야 함을 밝혔다(곱이 음수 → 한 근이 음수 → $k$ 홀수).
      depends_on: []
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: $k=5,15,25,35,45$를 찾고 $A=125$를 구했다.
      depends_on: [1.R1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: $ab=-2,-2^3,\cdots,-2^9$의 합 $B=-682$를 구했다.
      depends_on: [1.R1]
      steps: [1b-3]
