    outcome_code: '71'
    wrong_work: '$k=27$에서 중근 $-3$을 두 개로 세어 $b=2$로 보고 $a<b$에 포함'
    detect_cue: $A=2$ 또는 $A=1$, $B=27$ 또는 $C=5$
    feedback: 양·음의 실근의 「개수」는 서로 다른 실근을 셉니다. 접하는 경우 교점은 하나입니다.
    remedy: [RL-1]
  - id: MC-CAL-4202
    outcome_code: '72'
    wrong_work: '$k=0$일 때 근 $x=0$을 양의 근(또는 음의 근)으로 세어 $a\ne b$로 분류'
    detect_cue: $k=0$을 $B$ 또는 $C$ 쪽에 포함, $A=2$
    feedback: $0$은 양수도 음수도 아닙니다. $k=0$이면 양의 근 1개, 음의 근 1개입니다.
    remedy: [RL-2]

