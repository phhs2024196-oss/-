subparts:
- id: '1'
  stem: |
    $A+B-C$의 값을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: 25, equivalents: ['$A=3$', '$B=26$', '$C=4$'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $y=f(x)$와 $y=k$의 교점을 극댓값 27, 극솟값 $-5$, $f(0)=0$ 기준으로 분류한다.
    steps:
    - id: 1a
      content: |
        $k=27,-5,0$에서 $a=b=1$, $0<k<27$에서 $a=1,b=2$, $-5<k<0$에서 $a=2,b=1$ → $A=3$, $B=26$, $C=4$, $A+B-C=25$.
      criteria: [1.B1, 1.B2, 1.B3]
    hint_ladder:
    - $k$를 우변으로 넘겨 $y=x^3+3x^2-9x$와 $y=k$의 교점으로 생각해 보자.
    - 극댓값·극솟값과 $y$절편 $f(0)=0$이 경계가 된다.
    - $a$, $b$가 모두 0이 아니려면 교점이 두 개 이상이어야 한다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2025 선행학습 영향평가 보고서」 p.52–53 문항 해설 및 풀이과정
    steps:
    - id: 1b-1
      content: |
        방정식 $x^3+3x^2-9x=k$의 근의 개수는 $f(x)=x^3+3x^2-9x$라 할 때 함수 $y=f(x)$ 그래프와 직선 $y=k$가 만나는 점의 개수와 같다.
        $f'(x)=3x^2+6x-9=3(x+3)(x-1)$ $\therefore$ $x=-3$에서 극대, $x=1$에서 극소.
        $f(-3)=27$, $f(1)=-5$, $f(0)=0$. $a$, $b$ 모두 0이 아니므로 $k$ 값의 범위는 $-5\le k\le27$이다.
        (보충: $k>27$ 또는 $k<-5$이면 실근이 하나뿐이어서 $a$, $b$ 중 하나가 0이다.)
      criteria: [1.B1]
    - id: 1b-2
      content: |
        i) $a=b$일 때 $k$의 값 $27,\ -5,\ 0$ $\therefore A=3$
        (보충: $k=27$이면 근 $-3$(중근), $3$; $k=-5$이면 근 $1$(중근), $-5$; $k=0$이면 근 $0$과 양수 하나, 음수 하나.)
      criteria: [1.B1]
    - id: 1b-3
      content: |
        ii) $a<b$일 때 $k$의 값 $0<k<27$ $\therefore B=26$
      criteria: [1.B2]
    - id: 1b-4
      content: |
        iii) $a>b$일 때 $k$의 값 $-5<k<0$ $\therefore C=4$
        $A+B-C=25$
      criteria: [1.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 2
      evidence: $A=3$을 구했다($k=27,-5,0$).
      depends_on: []
      steps: [1b-1, 1b-2]
    - id: 1.B2
      mark_type: B
      points: 4
      evidence: $B=26$을 구했다($0<k<27$인 정수).
      depends_on: []
      steps: [1b-3]
    - id: 1.B3
      mark_type: B
      points: 4
      evidence: $C=4$를 구했다($-5<k<0$인 정수).
      depends_on: []
      steps: [1b-4]
