stem: |
  방정식 $x^3+3x^2-9x-k=0$의 양의 실근의 개수를 $a$, 음의 실근의 개수를 $b$라 하자. $a=b$를 만족시키는 모든 정수 $k$의 개수를 $A$, $a<b$를 만족시키는 모든 정수 $k$의 개수를 $B$, $a>b$를 만족시키는 모든 정수 $k$의 개수를 $C$라 할 때, $A+B-C$의 값을 구하시오. (단, $a$와 $b$는 모두 $0$이 아니다.) [10점]

elements:
  materials:
  - 삼차방정식 $x^3+3x^2-9x-k=0$
  - 양의 실근 개수 $a$, 음의 실근 개수 $b$
  - 정수 $k$의 개수 $A$, $B$, $C$
  concepts:
  - 방정식의 실근과 그래프의 교점
  - 도함수를 이용한 극대·극소
  - 삼차함수의 그래프 개형
  tools:
  - $f(x)=x^3+3x^2-9x$와 직선 $y=k$의 교점 세기
  - $f'(x)=3(x+3)(x-1)$로 극값 구하기
  - $k$의 범위에 따른 경우 나누기
  conditions:
  - 극댓값 $f(-3)=27$, 극솟값 $f(1)=-5$, $f(0)=0$
  - $a$와 $b$는 모두 $0$이 아님 → $-5\le k\le27$
  - 서로 다른 실근의 개수로 셈(중근은 하나)
  stimuli_used: []
  subpart_links: 단일 논제

