stem: |
  첫째항이 $4$인 수열 $\{a_n\}$이 모든 자연수 $n$에 대하여
  $\displaystyle\sum_{k=1}^{n}\left(\frac{a_k}{k+1}-\frac{a_{k+1}}{k+2}\right)=-2n$을 만족시킬 때, $\displaystyle\sum_{n=1}^{9}\left(\frac{20}{a_n}+\frac{24}{a_{n+2}}\right)$의 값을 구하시오.
  [10점]

elements:
  materials:
  - 첫째항이 $4$인 수열 $\{a_n\}$
  - 조건 $\sum_{k=1}^{n}\left(\frac{a_k}{k+1}-\frac{a_{k+1}}{k+2}\right)=-2n$
  - 구할 합 $\sum_{n=1}^{9}\left(\frac{20}{a_n}+\frac{24}{a_{n+2}}\right)$
  concepts:
  - 합의 기호 $\Sigma$의 성질
  - 망원합(소거되는 합)
  - 부분분수 분해
  tools:
  - 합을 펼쳐 소거
  - 일반항 $a_n=2n(n+1)$ 유도
  - $\frac{1}{n(n+1)}=\frac1n-\frac1{n+1}$
  conditions:
  - 망원합 결과 $2-\frac{a_{n+1}}{n+2}=-2n$ → $a_{n+1}=2(n+1)(n+2)$
  - $a_1=4$도 $2n(n+1)$에 맞음 → 모든 $n$에서 $a_n=2n(n+1)$
