intent: 수열의 성질을 이용하여 여러 가지 수열의 합을 구할 수 있다.
key_idea: '좌변의 합이 망원합 $2-\dfrac{a_{n+1}}{n+2}$이 되어 $a_n=2n(n+1)$, 이후 부분분수로 두 합을 각각 망원합으로 계산한다.'
stuck: 조건식의 합을 펼쳐 소거되는 구조를 보고 $a_{n+1}$을 바로 구하는 것
