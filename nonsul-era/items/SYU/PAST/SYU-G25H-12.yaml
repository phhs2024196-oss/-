subparts:
- id: '1'
  stem: |
    $\sum_{n=1}^{9}\left(\frac{20}{a_n}+\frac{24}{a_{n+2}}\right)$의 값을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: 12, equivalents: ['$a_n=2n(n+1)$'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 좌변은 망원합 $\frac{a_1}{2}-\frac{a_{n+1}}{n+2}$이다.
    steps:
    - id: 1a
      content: |
        $2-\frac{a_{n+1}}{n+2}=-2n$ → $a_n=2n(n+1)$, $\sum\frac{20}{a_n}=10\left(1-\frac1{10}\right)=9$, $\sum\frac{24}{a_{n+2}}=12\left(\frac13-\frac1{12}\right)=3$, 합 $12$.
      criteria: [1.M1, 1.A1, 1.A2]
    hint_ladder:
    - 좌변의 합을 $k=1,2,3$까지 펼쳐 보면 어떤 항이 지워지는가?
    - 남는 항만으로 $a_{n+1}$을 $n$의 식으로 나타내 보자.
    - $\frac{1}{n(n+1)}$, $\frac{1}{(n+2)(n+3)}$을 부분분수로 나누자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2025 선행학습 영향평가 보고서」 p.54–55 문항 해설 및 풀이과정
    steps:
    - id: 1b-1
      content: |
        i) $\sum_{k=1}^{n}\left(\frac{a_k}{k+1}-\frac{a_{k+1}}{k+2}\right)=\left(\frac{a_1}{2}-\frac{a_2}{3}\right)+\left(\frac{a_2}{3}-\frac{a_3}{4}\right)+\cdots+\left(\frac{a_n}{n+1}-\frac{a_{n+1}}{n+2}\right)$
        $=2-\frac{a_{n+1}}{n+2}=-2n$
        $\frac{a_{n+1}}{n+2}=2n+2$ $\therefore a_{n+1}=2(n+1)(n+2)$ $(n\ge1)$
        $a_n=2n(n+1)$ $(n\ge2)$
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $a_1=4$이므로 $a_n=2n(n+1)$이다 $(n\ge1)$. $a_{n+2}=2(n+2)(n+3)$
        $\sum_{n=1}^{9}\left(\frac{20}{a_n}+\frac{24}{a_{n+2}}\right)=\sum_{n=1}^{9}\frac{20}{a_n}+\sum_{n=1}^{9}\frac{24}{a_{n+2}}$
      criteria: [1.M1]
    - id: 1b-3
      content: |
        ii) $\sum_{n=1}^{9}\frac{20}{a_n}=10\sum_{n=1}^{9}\frac{1}{n(n+1)}=10\left\{\left(\frac11-\frac12\right)+\left(\frac12-\frac13\right)+\cdots+\left(\frac19-\frac1{10}\right)\right\}$
        $=10\left(\frac11-\frac1{10}\right)=9$
      criteria: [1.A1]
    - id: 1b-4
      content: |
        iii) $\sum_{n=1}^{9}\frac{24}{a_{n+2}}=12\sum_{n=1}^{9}\frac{1}{(n+2)(n+3)}=12\left\{\left(\frac13-\frac14\right)+\left(\frac14-\frac15\right)+\cdots+\left(\frac1{11}-\frac1{12}\right)\right\}$
        $=12\left(\frac13-\frac1{12}\right)=3$
        $\therefore 9+3=12$
      criteria: [1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: 망원합으로 $a_n=2n(n+1)$ $(n\ge2)$를 구했다.
      depends_on: []
      steps: [1b-1, 1b-2]
    - id: 1.A1
