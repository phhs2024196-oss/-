      points: 3
      evidence: $\sum_{n=1}^{9}\frac{20}{a_n}=9$를 구했다.
      depends_on: [1.M1]
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: $\sum_{n=1}^{9}\frac{24}{a_{n+2}}=3$을 구했다.
      depends_on: [1.M1]
      steps: [1b-4]
