    wrong_work: '남는 항을 $\frac{a_n}{n+1}$로 잡아 $2-\frac{a_n}{n+1}=-2n$ → $a_n=2(n+1)^2$'
    detect_cue: $a_n=2(n+1)^2$ 또는 $a_1=8$로 첫째항과 모순
    feedback: 합을 실제로 펼쳐 마지막 괄호의 두 번째 항 $\frac{a_{n+1}}{n+2}$가 남는 것을 확인하세요.
    remedy: [RL-1]
  - id: MC-ALG-4204
    outcome_code: '72'
    wrong_work: '$\sum_{n=1}^{9}\frac{24}{a_{n+2}}=12\left(1-\frac1{10}\right)$처럼 첨자 이동을 무시'
    detect_cue: 두 번째 합이 $\frac{54}{5}$ 등 3이 아님
    feedback: $a_{n+2}=2(n+2)(n+3)$이므로 망원합의 첫 항은 $\frac13$, 끝 항은 $\frac1{12}$입니다.
    remedy: [RL-2]

