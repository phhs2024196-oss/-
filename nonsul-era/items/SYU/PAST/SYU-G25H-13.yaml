subparts:
- id: '1'
  stem: |
    $\sum_{n=1}^{9}S_n$의 값을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '\dfrac{13\sqrt{3}}{12}', equivalents: ['$S_1=\dfrac{\sqrt3}{12}$', '$S_2=\dfrac{\sqrt3}{6}$'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 교점의 $y$좌표는 모두 $\frac{\sqrt3}{2}$이고 밑변이 $\frac13$, $\frac23$으로 번갈아 나온다.
    steps:
    - id: 1a
      content: |
        $\tan\pi x=\sqrt3$ → $x=\frac13$, 대칭으로 $\frac23,\frac43,\frac53,\cdots$. $S_{\text{홀}}=\frac{\sqrt3}{12}$, $S_{\text{짝}}=\frac{\sqrt3}{6}$ → $5\cdot\frac{\sqrt3}{12}+4\cdot\frac{\sqrt3}{6}=\frac{13\sqrt3}{12}$.
      criteria: [1.M1, 1.A1, 1.A2, 1.A3]
    hint_ladder:
    - $0<x<\frac12$에서 절댓값을 벗기고 $\tan\pi x$를 구해 보자.
    - 두 함수의 주기는 1이고 $[0,1]$에서 $x=\frac12$에 대해 대칭이다.
    - 삼각형의 높이는 모두 같고 밑변만 달라진다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2025 선행학습 영향평가 보고서」 p.57–58 문항 해설 및 풀이과정
    steps:
    - id: 1b-1
      content: |
        i) 삼각형 $\mathrm{A}_n\mathrm{B}_n\mathrm{A}_{n+1}$은 $\overline{\mathrm{A}_n\mathrm{A}_{n+1}}$을 밑변, $\mathrm{A}_n$의 $y$좌표의 값을 높이로 한다.
        $\lvert\sin\pi x\rvert=\sqrt3\lvert\cos\pi x\rvert$
        $\sin\pi x>0$, $\cos\pi x>0$일 때, $\frac{\sin\pi x}{\cos\pi x}=\tan\pi x=\sqrt3$ $\therefore x=\frac13$이고,
        $\sin\frac{\pi}{3}=\frac{\sqrt3}{2}$이므로 $\mathrm{A}_1\left(\frac13,\frac{\sqrt3}{2}\right)$
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $f(x)=\lvert\sin\pi x\rvert$와 $g(x)=\sqrt3\lvert\cos\pi x\rvert$는 주기가 1이고 닫힌구간 $[0,1]$에 대하여 두 함수 $y=f(x)$, $y=g(x)$의 그래프가 $x=\frac12$에 대하여 대칭이다.
        따라서 두 점 $\mathrm{A}_1$과 $\mathrm{A}_2$는 $x=\frac12$에 대칭이므로 $\mathrm{A}_2\left(\frac23,\frac{\sqrt3}{2}\right)$,
        $\mathrm{A}_2$와 $\mathrm{A}_3$는 $x=1$에 대칭이므로 $\mathrm{A}_3\left(\frac43,\frac{\sqrt3}{2}\right)$.
        한편, 삼각형의 높이는 $\mathrm{A}_1$의 $y$좌표와 같으므로 $\frac{\sqrt3}{2}$이다.
        (보충: $\mathrm{B}_n$은 $x=\frac12,1,\frac32,2,\cdots$로 각 삼각형의 두 꼭짓점 $\mathrm{A}_n$, $\mathrm{A}_{n+1}$ 사이 $x$축 위에 있다.)
      criteria: [1.M1]
    - id: 1b-3
      content: |
        ii) $S_1=\frac12\cdot\left(\frac23-\frac13\right)\left(\frac{\sqrt3}{2}\right)=\frac{\sqrt3}{12}$
        $S_1+S_3+S_5+S_7+S_9=\frac{\sqrt3}{12}\times5=\frac{5\sqrt3}{12}$
      criteria: [1.A1]
    - id: 1b-4
      content: |
        iii) $S_2=\frac12\cdot\left(\frac43-\frac23\right)\left(\frac{\sqrt3}{2}\right)=\frac{2\sqrt3}{12}=\frac{\sqrt3}{6}$
        $S_2+S_4+S_6+S_8=\frac{\sqrt3}{6}\times4=\frac{2\sqrt3}{3}$
      criteria: [1.A2]
    - id: 1b-5
      content: |
        iv) $\therefore\ \frac{5\sqrt3}{12}+\frac{2\sqrt3}{3}=\frac{13\sqrt3}{12}$
      criteria: [1.A3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: $\frac{\sin\pi x}{\cos\pi x}=\tan\pi x=\sqrt3$에서 $x=\frac13$을 구했다.
      depends_on: []
      steps: [1b-1, 1b-2]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: $S_1\times5=\frac{5\sqrt3}{12}$를 구했다(홀수 번째 넓이의 합).
      depends_on: [1.M1]
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: $S_2\times4=\frac{2\sqrt3}{3}$을 구했다(짝수 번째 넓이의 합).
      depends_on: [1.M1]
      steps: [1b-4]
    - id: 1.A3
      mark_type: A
      points: 1
      evidence: $\frac{5\sqrt3}{12}+\frac{2\sqrt3}{3}=\frac{13\sqrt3}{12}$를 구했다.
      depends_on: [1.M1]
      steps: [1b-5]
