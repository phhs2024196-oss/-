key_idea: '$\tan\pi x=\sqrt3$에서 $A_1\left(\frac13,\frac{\sqrt3}{2}\right)$, 주기 1과 $x=\frac12$ 대칭으로 교점 간격이 $\frac13$, $\frac23$으로 번갈아 나타난다.'
stuck: 두 그래프의 대칭성으로 교점의 $x$좌표가 $\frac13,\frac23,\frac43,\frac53,\cdots$임을 정리하는 것
