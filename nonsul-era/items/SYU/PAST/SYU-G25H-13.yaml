stem: |
  $x>0$에서 정의된 두 함수 $f(x)=\lvert\sin\pi x\rvert$, $g(x)=\sqrt3\lvert\cos\pi x\rvert$에 대하여 함수 $y=f(x)$의 그래프가 함수 $y=g(x)$의 그래프와 만나는 점을 $x$좌표가 작은 것부터 차례로 $\mathrm{A}_1$, $\mathrm{A}_2$, $\mathrm{A}_3$, $\cdots$이라 하고, 함수 $y=f(x)$의 그래프 또는 함수 $y=g(x)$의 그래프가 $x$축과 만나는 점을 $x$좌표가 작은 것부터 차례로 $\mathrm{B}_1$, $\mathrm{B}_2$, $\mathrm{B}_3$, $\cdots$이라 하자. 자연수 $n$에 대하여 삼각형 $\mathrm{A}_n\mathrm{B}_n\mathrm{A}_{n+1}$의 넓이를 $S_n$이라 할 때, $\displaystyle\sum_{n=1}^{9}S_n$의 값을 구하시오. [10점]

elements:
  materials:
  - $f(x)=\lvert\sin\pi x\rvert$, $g(x)=\sqrt3\lvert\cos\pi x\rvert$ $(x>0)$
  - 교점 $\mathrm{A}_n$, $x$축 위의 점 $\mathrm{B}_n$
  - 삼각형 $\mathrm{A}_n\mathrm{B}_n\mathrm{A}_{n+1}$의 넓이 $S_n$
  concepts:
  - 삼각함수의 그래프와 주기
  - 절댓값 함수의 대칭
  - $\tan\frac{\pi}{3}=\sqrt3$
  - 삼각형의 넓이
  tools:
  - $\frac{\sin\pi x}{\cos\pi x}=\tan\pi x=\sqrt3$
  - 직선 $x=\frac12$, $x=1$에 대한 대칭
  - 홀수 번째·짝수 번째 넓이를 나누어 합
  conditions:
  - 모든 교점의 $y$좌표는 $\frac{\sqrt3}{2}$ → 삼각형의 높이 일정
  - 밑변 $\overline{\mathrm{A}_n\mathrm{A}_{n+1}}$은 $n$ 홀수일 때 $\frac13$, 짝수일 때 $\frac23$
  - $\mathrm{B}_n$의 $x$좌표는 $\frac{n}{2}$
  stimuli_used: []
  subpart_links: 단일 논제

