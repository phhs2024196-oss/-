stem: |
  수열 $\{a_n\}$은 $a_1=1$이고, 다음 조건을 만족시킨다.

  (가) $a_{m+1}=(3m-1)a_m\quad(m=1,\ 2,\ 3,\ 4,\ 5,\ 6)$
  (나) 모든 자연수 $n$에 대하여 $a_{n+7}=a_n+n$이다.

  수열 $\{a_n\}$의 첫째항부터 제$n$항까지의 합을 $S_n$이라 할 때, $S_{84}-S_{77}$을 $110$으로 나눈 나머지를 구하시오. [10점]

elements:
  materials:
  - $a_1=1$, $a_{m+1}=(3m-1)a_m$ $(m=1,\cdots,6)$
  - $a_{n+7}=a_n+n$ (모든 자연수 $n$)
  - $S_{84}-S_{77}$을 $110$으로 나눈 나머지
  concepts:
  - 수열의 귀납적 정의
  - 합의 기호와 부분합
  - 자연수의 거듭제곱의 합 $\sum k$
  - 나머지 계산
  tools:
  - $a_1$~$a_7$ 직접 계산
  - $110=2\times5\times11$로 배수 판정
  - 블록 합의 누적 $S_{7(j+1)}-S_{7j}=S_7+\sum_{k=1}^{7j}k$
  conditions:
  - $a_5,a_6,a_7$은 $2$, $5$, $11$을 모두 인수로 가짐 → 110의 배수
  - $S_{84}-S_{77}=a_{78}+\cdots+a_{84}$
