subparts:
- id: '1'
  stem: |
    $S_{84}-S_{77}$을 $110$으로 나눈 나머지를 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: 16, equivalents: ['$S_{84}-S_{77}=S_7+3003$'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $S_7\equiv a_1+a_2+a_3+a_4=93$, $S_{84}-S_{77}=S_7+\sum_{k=1}^{77}k$.
    steps:
    - id: 1a
      content: |
        $S_7\equiv93$, $\sum_{k=1}^{77}k=3003\equiv33$ $\pmod{110}$ → $93+33=126\equiv16$.
      criteria: [1.B1, 1.M1, 1.A1]
    hint_ladder:
    - $a_1$부터 $a_7$까지 곱의 꼴로 써 보자. 어느 항부터 $2$, $5$, $11$이 모두 들어가는가?
    - $S_{14}-S_7$, $S_{21}-S_{14}$는 $S_7$보다 얼마씩 큰가?
    - $S_{84}-S_{77}$까지 늘어난 양을 하나의 합으로 써 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2025 선행학습 영향평가 보고서」 p.60 문항 해설 및 풀이과정
    steps:
    - id: 1b-1
      content: |
        i) $a_1=1$, $a_2=1\cdot2$, $a_3=1\cdot2\cdot5$, $a_4=1\cdot2\cdot5\cdot8$, $a_5=1\cdot2\cdot5\cdot8\cdot11$, $a_6=1\cdot2\cdot5\cdot8\cdot11\cdot14$, $a_7=1\cdot2\cdot5\cdot8\cdot11\cdot14\cdot17$
        $110=2\times5\times11$이므로 $a_5,a_6,a_7$은 110으로 나누어 떨어짐
        $\therefore S_7$을 110으로 나눈 나머지는 $a_1+a_2+a_3+a_4=93$
      criteria: [1.B1]
    - id: 1b-2
      content: |
        한편, $a_{n+7}=a_n+n$에서
        $S_{14}-S_7=S_7+\sum_{k=1}^{7}k$
        $S_{21}-S_{14}=S_7+\sum_{k=1}^{14}k$
        $\cdots$
        $S_{84}-S_{77}=S_7+\sum_{k=1}^{77}k$이므로
        (보충: $a_{n+7}=a_n+n$을 $n=1,\cdots,7$에 더하면 $S_{14}-S_7=S_7+(1+\cdots+7)$, 같은 방법으로 블록마다 앞 블록보다 $8+\cdots+14$, … 씩 더해진다.)
      criteria: [1.M1]
    - id: 1b-3
      content: |
        ii) $\sum_{k=1}^{77}k=\frac{77(1+77)}{2}=77\times39$
        $77\times39$를 110으로 나눈 나머지는 $33$
      criteria: [1.M1]
    - id: 1b-4
      content: |
        iii) $\therefore 93+33=126$을 110으로 나눈 나머지는 $16$
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 4
      evidence: $S_7$을 110으로 나눈 나머지 $a_1+a_2+a_3+a_4=93$을 구했다.
      depends_on: []
      steps: [1b-1]
    - id: 1.M1
