      evidence: $S_{84}-S_{77}=S_7+\sum_{k=1}^{77}k$로 보고 $\sum_{k=1}^{77}k$를 110으로 나눈 나머지 $33$을 구했다.
      depends_on: []
      steps: [1b-2, 1b-3]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: $93+33=126$을 110으로 나눈 나머지 $16$을 구했다.
      depends_on: [1.B1, 1.M1]
      steps: [1b-4]
