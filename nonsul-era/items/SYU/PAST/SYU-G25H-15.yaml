key_idea: '$3t^2-2xt=3t\left(t-\frac23x\right)$의 부호가 바뀌는 $t=\frac23x$가 $[0,1]$의 어디에 있느냐로 $x\le0$, $0<x\le\frac32$, $x>\frac32$를 나누어 $f(x)$를 구한다.'
stuck: $\frac23x$의 위치로 구간을 나누고, 가운데 구간의 삼차식 $\frac{8}{27}x^3-x+1$의 극솟값이 최솟값임을 판단하는 것
