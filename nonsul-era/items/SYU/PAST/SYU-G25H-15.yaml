stem: |
  함수 $f(x)=\displaystyle\int_0^1\lvert3t^2-2xt\rvert dt$의 최솟값을 구하시오. [10점]

elements:
  materials:
  - 매개변수 $x$를 포함한 절댓값 정적분 $f(x)=\int_0^1\lvert3t^2-2xt\rvert dt$
  concepts:
  - 절댓값 함수의 정적분
  - 다항함수의 정적분
  - 도함수를 이용한 극값
  - 연속함수의 최솟값
  tools:
  - $3t\left(t-\frac23x\right)=0$에서 $t=0,\ \frac23x$
  - $x\le0$, $0<x\le\frac32$, $x>\frac32$로 구간 나누기
  - $f'(x)=\frac89x^2-1$로 극소 판정
  conditions:
  - $x\le0$에서 $f(x)=1-x$ (감소)
  - $0<x\le\frac32$에서 $f(x)=\frac{8}{27}x^3-x+1$
  - $x>\frac32$에서 $f(x)=x-1$ (증가)
