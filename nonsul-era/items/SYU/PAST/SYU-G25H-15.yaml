subparts:
- id: '1'
  stem: |
    $f(x)$의 최솟값을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '1-\dfrac{\sqrt{2}}{2}', equivalents: ['$x=\dfrac{3}{2\sqrt2}$일 때'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $t=\frac23x$의 위치로 세 구간을 나누면 가운데 구간에서만 극소가 생긴다.
    steps:
    - id: 1a
      content: |
        $f(x)=1-x\ (x\le0)$, $\frac{8}{27}x^3-x+1\ (0<x\le\frac32)$, $x-1\ (x>\frac32)$ → $x=\frac{3}{2\sqrt2}$에서 최솟값 $1-\frac{\sqrt2}{2}$.
      criteria: [1.M1, 1.A1, 1.A2, 1.A3, 1.A4]
    hint_ladder:
    - $3t^2-2xt=0$이 되는 $t$를 구해 보자.
    - $\frac23x$가 $0$보다 작을 때, $0$과 $1$ 사이일 때, $1$보다 클 때로 나누자.
    - 가운데 구간에서 $f'(x)=0$인 점을 찾자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2025 선행학습 영향평가 보고서」 p.61–63 문항 해설 및 풀이과정
    steps:
    - id: 1b-1
      content: |
        $3t\left(t-\frac23x\right)=0$일 때 $\therefore t=0,\ \frac23x$
        $x\le0$, $0<x\le\frac32$, $x>\frac32$로 구간을 나눔
      criteria: [1.M1]
    - id: 1b-2
      content: |
        i) $\frac23x\le0\Rightarrow x\le0$
        ($[0,1]$에서 $3t^2-2xt\ge0$)
        $f(x)=\int_0^1(3t^2-2xt)dt=\left[t^3-xt^2\right]_0^1=1-x$
      criteria: [1.A1]
    - id: 1b-3
      content: |
        ii) $0<\frac23x\le1\Rightarrow0<x\le\frac32$
        $f(x)=\int_0^1\lvert3t^2-2xt\rvert dt=\int_0^{\frac23x}(-3t^2+2xt)dt+\int_{\frac23x}^1(3t^2-2xt)dt$
        $=\left[-t^3+xt^2\right]_0^{\frac23x}+\left[t^3-xt^2\right]_{\frac23x}^1$
        $=2\left(-\frac{8}{27}x^3+\frac49x^3\right)+(1-x)$
        $=\frac{8}{27}x^3-x+1$
      criteria: [1.A2]
    - id: 1b-4
      content: |
        iii) $\frac23x>1\Rightarrow x>\frac32$
        $f(x)=\int_0^1(-3t^2+2xt)dt=\left[-t^3+xt^2\right]_0^1=x-1$
      criteria: [1.A3]
    - id: 1b-5
      content: |
        $0<x<\frac32$일 때 $f'(x)=\frac89x^2-1$, $x=\pm\frac{3}{2\sqrt2}$.
        $f(x)$는 $0<x\le\frac32$ 구간 중 $x=\frac{3}{2\sqrt2}$에서 극소를 가진다.
        $f(x)$는 $x\le0$에서 감소 함수, $x>\frac32$에서 증가 함수이고 $f(x)$는 연속이기 때문에 $0<x\le\frac32$에서의 극솟값이 최솟값이다.
        $\therefore$ 최솟값은 $f\left(\frac{3}{2\sqrt2}\right)=1-\frac{\sqrt2}{2}$
      criteria: [1.A4]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 1
      evidence: $x\le0$, $0<x\le\frac32$, $x>\frac32$로 구간을 나누었다.
      depends_on: []
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: $f(x)=1-x$의 식을 구했다(감소 함수 확인).
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: $f(x)=\frac{8}{27}x^3-x+1$의 식을 구했다.
      depends_on: [1.M1]
      steps: [1b-3]
    - id: 1.A3
      mark_type: A
      points: 2
      evidence: $f(x)=x-1$의 식을 구했다(증가 함수 확인).
      depends_on: [1.M1]
      steps: [1b-4]
    - id: 1.A4
      mark_type: A
      points: 3
      evidence: $f(x)$가 $0<\frac23x\le1$에서의 극솟값이 최솟값임을 확인하여 $1-\frac{\sqrt2}{2}$를 구했다.
      depends_on: [1.M1]
      steps: [1b-5]
