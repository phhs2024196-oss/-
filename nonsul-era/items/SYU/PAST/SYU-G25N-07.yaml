  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f$는 증가, $g$는 감소하므로 최솟값은 정의역 끝 $x=0$, $x=1$에서, 교점은 $1-x=x$에서 $x=\dfrac12$.
    steps:
    - id: 1a
      content: |
        $a=0$, $b=1$, $c=\dfrac12$ → $a+2b+4c=0+2+2=4$.
      criteria:
      - 1.M1
      - 1.M2
      - 1.M3
      - 1.A1
    hint_ladder:
    - $y=-\log_2(1-x)$는 증가함수인가, 감소함수인가?
    - 증가함수의 최솟값은 정의역의 어느 끝에서 생기는가?
    - $-\log_2x=-\log_2(1-x)$이면 진수끼리 같다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2025 선행학습 영향평가 보고서」 p.84~85 문항 해설 및 풀이과정
    steps:
    - id: 1b-1
      content: |
        함수 $f(x)=-\log_2(1-x)$는 증가함수이므로 $x=0$에서 최소이다. $a=0$
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        함수 $g(x)=-\log_2 x$는 감소함수이므로 $x=1$에서 최소이다. $b=1$
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $-\log_2 x=-\log_2(1-x)$에서 $x=1-x$, 즉 $x=\dfrac12$에서 교점을 가지므로 $c=\dfrac12$
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        $a+2b+4c=0+2+2=4$
      criteria:
      - 1.A1
