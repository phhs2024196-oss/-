  - 로그함수 $g(x)=-\log_2 x\ (0<x\le1)$
  - 두 그래프의 교점
  concepts:
  - 로그함수의 증가·감소
  - 제한된 정의역에서의 최솟값
  - 로그방정식
  tools:
  - 단조성 판단
  - 진수 비교로 방정식 풀이
  conditions:
  - $f$는 증가함수 → 최솟값은 $x=0$
  - $g$는 감소함수 → 최솟값은 $x=1$
  - $-\log_2 x=-\log_2(1-x)\iff x=1-x$
