stimuli: []
stem: |
  $0\le x<1$에서 정의된 함수 $f(x)=-\log_2(1-x)$와 $0<x\le1$에서 정의된 함수 $g(x)=-\log_2 x$가 있다. 두 함수 $f(x)$와 $g(x)$는 각각 $x=a$, $x=b$에서 최솟값을 가지고, 두 함수 $y=f(x)$, $y=g(x)$의 그래프가 만나는 점의 $x$좌표를 $c$라 할 때, $a+2b+4c$의 값을 구하시오.
elements:
  materials:
