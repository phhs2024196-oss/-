  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 극한이 존재하려면 $f(1)+g(1)=0$이고, 두 극한을 미분계수의 정의로 바꾸면 $f'(1)+g'(1)=9$, $\dfrac12f'(1)-\dfrac13g'(1)=\dfrac13$.
    steps:
    - id: 1a
      content: |
        $f(1)+g(1)=0$ → $f'(1)+g'(1)=9$, $\dfrac12f'(1)-\dfrac13g'(1)=\dfrac13$ → $f'(1)=4$, $g'(1)=5$ → $14$.
      criteria:
      - 1.M1
      - 1.M2
      - 1.M3
      - 1.A1
    hint_ladder:
    - 분모가 $0$으로 가는데 극한값이 있다면 분자는?
    - $f(1)+g(1)=0$을 이용해 분자에서 $f(1)$, $g(1)$을 빼 보자.
    - $\dfrac{f(1+h/2)-f(1)}{h/2}$ 꼴을 만들어 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2025 선행학습 영향평가 보고서」 p.86~87 문항 해설 및 풀이과정
    steps:
    - id: 1b-1
      content: |
        (분모)$\to0$이고 극한값이 존재하므로 (분자)$\to0$이어야 한다. $f(1)+g(1)=0$
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $x-1=t$로 치환하면 $\lim_{t\to1}\dfrac{f(t)+g(t)}{t-1}=9$.
        따라서 $\lim_{t\to1}\dfrac{f(t)-f(1)+g(t)-g(1)}{t-1}=\lim_{t\to1}\dfrac{f(t)-f(1)}{t-1}+\lim_{t\to1}\dfrac{g(t)-g(1)}{t-1}=f'(1)+g'(1)=9$ … ㉠
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $\lim_{h\to0}\dfrac{f\left(1+\frac h2\right)-f(1)+g\left(1-\frac h3\right)-g(1)}{h}=\lim_{h\to0}\dfrac12\cdot\dfrac{f\left(1+\frac h2\right)-f(1)}{\frac h2}+\lim_{h\to0}\left(-\dfrac13\right)\dfrac{g\left(1-\frac h3\right)-g(1)}{-\frac h3}=\dfrac12f'(1)-\dfrac13g'(1)=\dfrac13$ … ㉡ (즉 $3f'(1)-2g'(1)=2$)
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        ㉠과 ㉡을 연립하면 $f'(1)=4$, $g'(1)=5$이므로 $f'(1)+2g'(1)=14$
      criteria:
      - 1.A1
