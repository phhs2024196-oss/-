stimuli: []
stem: |
  두 다항함수 $f(x)$, $g(x)$가 $\lim_{x\to2}\dfrac{f(x-1)+g(x-1)}{x-2}=9$,
  $\lim_{h\to0}\dfrac{f\left(1+\dfrac{h}{2}\right)+g\left(1-\dfrac{h}{3}\right)}{h}=\dfrac13$을 만족시킨다.
  $f'(1)+2g'(1)$의 값을 구하시오. (단, 로피탈 정리는 사용할 수 없다.)
