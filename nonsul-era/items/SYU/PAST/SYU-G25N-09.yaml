stem: |
  삼각형 $\mathrm{ABC}$가 다음 조건을 만족시킬 때, $\overline{\mathrm{AB}}+\overline{\mathrm{BC}}-\overline{\mathrm{CA}}$의 값을 구하시오.

  (가) 내접원의 넓이는 $7\pi$이다.
  (나) $2\overline{\mathrm{AB}}=\overline{\mathrm{BC}}=\sqrt2\,\overline{\mathrm{CA}}$
