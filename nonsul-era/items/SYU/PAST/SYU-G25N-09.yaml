  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 넓이를 $\dfrac12r(a+b+c)$와 $\dfrac12ac\sin B$ 두 가지로 나타내 같게 놓는다.
    steps:
    - id: 1a
      content: |
        $S=\dfrac{\sqrt7}{2}(3+\sqrt2)x=\dfrac{\sqrt7}{4}x^2$ → $x=2(3+\sqrt2)$ → $(3-\sqrt2)x=14$.
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
    hint_ladder:
    - 내접원의 반지름 $r$을 알면 넓이를 둘레로 나타낼 수 있다.
    - 각 $\mathrm{B}$의 코사인을 세 변으로 구해 보자.
    - 두 넓이 식을 같게 놓아라.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2025 선행학습 영향평가 보고서」 p.88~89 문항 해설 및 풀이과정
    steps:
    - id: 1b-1
      content: |
        내접원의 반지름을 $r$이라 하면 (가)에서 $\pi r^2=7\pi$, $r=\sqrt7$.
        (나)에서 $\overline{\mathrm{AB}}=x$라 하면 $\overline{\mathrm{BC}}=2x$, $\overline{\mathrm{CA}}=\sqrt2x$.
        넓이 $S=\dfrac12r(\overline{\mathrm{AB}}+\overline{\mathrm{BC}}+\overline{\mathrm{CA}})=\dfrac12\sqrt7(x+2x+\sqrt2x)=\dfrac{\sqrt7}{2}(3+\sqrt2)x$ … ㉠
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        코사인법칙에 의하여 $\cos B=\dfrac{x^2+4x^2-2x^2}{2\cdot x\cdot2x}=\dfrac34$이므로 $\sin B=\sqrt{1-\left(\dfrac34\right)^2}=\dfrac{\sqrt7}{4}$.
        $S=\dfrac12\overline{\mathrm{AB}}\cdot\overline{\mathrm{BC}}\sin B=\dfrac12\cdot x\cdot2x\cdot\dfrac{\sqrt7}{4}=\dfrac{\sqrt7}{4}x^2$ … ㉡
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        ㉠, ㉡에서 $\dfrac{\sqrt7}{2}(3+\sqrt2)x=\dfrac{\sqrt7}{4}x^2$, $x=2(3+\sqrt2)$.
        $\therefore\ \overline{\mathrm{AB}}+\overline{\mathrm{BC}}-\overline{\mathrm{CA}}=(3-\sqrt2)x=2(3-\sqrt2)(3+\sqrt2)=14$
      criteria:
      - 1.A1
