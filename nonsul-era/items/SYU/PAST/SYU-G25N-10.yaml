  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f$를 $\dfrac1{x+2}-5$, $4\left(x+\dfrac12\right)^2-4$, $-\log_2(9x-1)$로 그려 $k$의 범위별 교점 개수 $g(k)$를 구하고 한쪽 극한을 읽는다.
    steps:
    - id: 1a
      content: |
        $g(k)$: $1\ (k\ge5)$, $2\ (-3<k<5)$, $4\ (-4<k\le-3)$, $2\ (k=-4)$, $1\ (-5\le k<-4)$, $2\ (k<-5)$ → $1+2+2=5$.
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
    hint_ladder:
    - $\dfrac{-5x-9}{x+2}$를 $\dfrac{a}{x+2}+b$ 꼴로 바꾸어 점근선을 찾자.
    - 구간의 끝점에서 함숫값이 포함되는지 표시하며 그래프를 그려라.
    - $k$를 위에서 아래로 움직이며 교점 개수가 바뀌는 값을 찾아라.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2025 선행학습 영향평가 보고서」 p.90~91 문항 해설 및 풀이과정
    steps:
    - id: 1b-1
      content: |
        $f(x)=\begin{cases}\dfrac{-5x-9}{x+2}=\dfrac1{x+2}-5 & (x<-1)\\ 4x^2+4x-3=4\left(x+\dfrac12\right)^2-4 & (-1\le x<1)\\ -\log_2(9x-1) & (x\ge1)\end{cases}$ 의 그래프를 그린다.
      criteria:
      - 1.M1
      - 1.M2
    - id: 1b-2
      content: |
        $k$의 값의 범위에 따른 $g(k)$: $g(k)=1\ (k\ge5)$, $2\ (-3<k<5)$, $4\ (-4<k\le-3)$
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        $g(k)=2\ (k=-4)$, $1\ (-5\le k<-4)$, $2\ (k<-5)$
      criteria:
      - 1.M2
    - id: 1b-4
      content: |
        따라서 $\lim_{k\to-4-}g(k)=1$, $\lim_{k\to-3+}g(k)=2$, $\lim_{k\to5-}g(k)=2$이고 합은 $5$이다.
      criteria:
      - 1.A1
