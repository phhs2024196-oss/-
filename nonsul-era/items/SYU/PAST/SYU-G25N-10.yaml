  - id: MC-CAL-4253
    outcome_code: '71'
    wrong_work: $x<-1$ 부분에서 $x\to-1-$일 때의 값 $-4$를 포함된 값으로 보거나 $-2<x<-1$ 가지를 빠뜨림
    detect_cue: $\lim_{k\to-3+}g(k)$를 $1$ 또는 $3$으로 셈
    feedback: $x<-1$의 유리함수는 $x=-2$를 경계로 두 가지가 있고, $-2<x<-1$ 가지의 값의 범위는 $(-4,\infty)$입니다.
    remedy:
    - RL-1
  - id: MC-CAL-4254
    outcome_code: '72'
    wrong_work: 한쪽 극한 대신 함숫값 $g(-4)$, $g(-3)$, $g(5)$를 더함
    detect_cue: $g(-4)+g(-3)+g(5)=2+4+1=7$
    feedback: $\lim_{k\to-4-}g(k)$는 $k$가 $-4$보다 작은 쪽에서 다가갈 때의 값입니다. 그 근방 구간의 $g$값을 쓰세요.
    remedy:
    - RL-2
