stimuli: []
stem: |
  함수 $f(x)=\begin{cases}\dfrac{-5x-9}{x+2} & (x<-1)\\ 4x^2+4x-3 & (-1\le x<1)\\ -\log_2(9x-1) & (x\ge1)\end{cases}$의 그래프가
  직선 $y=k$와 만나는 점의 개수를 $g(k)$라 할 때,
  $\lim_{k\to-4-}g(k)+\lim_{k\to-3+}g(k)+\lim_{k\to5-}g(k)$의 값을 구하시오. (단, $k$는 실수이다.)
elements:
  materials:
  - 유리함수·이차함수·로그함수로 이루어진 구간별 함수
  - 수평선 $y=k$와의 교점 개수 $g(k)$
  concepts:
  - 유리함수의 점근선
  - 이차함수의 꼭짓점
  - 로그함수의 그래프
  - 좌극한·우극한
  tools:
  - 표준형 변형 $\dfrac1{x+2}-5$, $4\left(x+\frac12\right)^2-4$
  - 그래프를 그려 $k$의 범위 분류
  conditions:
  - $x<-1$에서 점근선 $x=-2$, $y=-5$; $x\to-1-$일 때 $-4$로 다가감(포함 안 됨)
  - '$-1\le x<1$: 꼭짓점 $\left(-\frac12,-4\right)$, $f(-1)=-3$, $x\to1-$일 때 $5$'
  - '$x\ge1$: $f(1)=-3$에서 감소'
  stimuli_used: []
  subpart_links: 단일 논제
