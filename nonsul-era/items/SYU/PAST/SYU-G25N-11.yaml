  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $y=2^{\frac xn}$은 $(0,1)$, $(n,2)$를 지나므로 $n$에 따라 교점 수가 $1,2,2,3,4,4,5,6,6,\cdots$로 늘고, $S_{2k}$는 첫째항 $5$, 공차 $6$인 등차수열이다.
    steps:
    - id: 1a
      content: |
        $n=1:k=1$, $n=2,3:k=2$, $n=4:k=3$, $n=5,6:k=4$, … → $S_2=5$, $S_4=11$, $S_6=17$, … (공차 $6$) → $\dfrac{10(2\times5+9\times6)}{2}=320$.
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
    hint_ladder:
    - $f$의 그래프를 한 주기 그리고, 최댓값 $2$가 나오는 $x$를 표시하자.
    - $y=2^{\frac xn}$이 높이 $2$에 닿는 $x$는?
    - $n=1,2,3,4,\cdots$에 대해 교점 수를 표로 정리하자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2025 선행학습 영향평가 보고서」 p.92~94 문항 해설 및 풀이과정
    steps:
    - id: 1b-1
      content: |
        (나)의 조건에서 $f(x)$의 그래프는 $0<x\le3$의 그래프가 주기로 반복된다. 자연수 $n$에 대하여 $y=2^{\frac xn}$의 그래프는 두 점 $(0,1)$, $(n,2)$를 지난다.
        $n=1$일 때 $(1,2)$를 지나고 $f(x)$와 한 점에서 만나므로 $k=1$; $n=2,3$일 때 각각 $(2,2)$, $(3,2)$를 지나고 두 점에서 만나므로 $k=2$;
        $n=4$일 때 $(4,2)$를 지나고 $k=3$; $n=5,6$일 때 $k=4$; …
        정리하면 $n=1\to k=1$, $n=2,3\to k=2$, $n=4\to k=3$, $n=5,6\to k=4$, $n=7\to k=5$, $n=8,9\to k=6$, ….
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $S_2=2+3=5$, $S_4=5+6=11$, $S_6=8+9=17$, …이므로 $\{S_{2k}\}$는 첫째항이 $5$이고 공차가 $6$인 등차수열이다.
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $\therefore\ \sum_{k=1}^{10}S_{2k}=\dfrac{10(2\times5+9\times6)}{2}=320$
      criteria:
      - 1.A1
