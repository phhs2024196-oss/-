stimuli: []
stem: |
  $x>0$에서 정의된 함수 $f(x)$가 다음을 만족시킨다.

  (가) $f(x)=\begin{cases}3^x-1 & (0<x\le1)\\ -2\log_3x+2 & (1<x\le3)\end{cases}$
  (나) $f(x+3)=f(x)$

  두 함수 $y=f(x)$와 $y=2^{\frac{x}{n}}$의 그래프가 만나는 점의 개수가 $k$가 되도록 하는 모든 자연수 $n$의 합을 $S_k$라 하자. $\sum_{k=1}^{10}S_{2k}$의 값을 구하시오.
elements:
  materials:
  - 주기 $3$인 함수 $f$(지수 증가 구간 + 로그 감소 구간)
  - 지수함수 $y=2^{\frac xn}$
  - 합 $S_k$와 $\sum S_{2k}$
  concepts:
  - 주기함수
  - 지수함수·로그함수의 그래프
  - 등차수열의 합
  tools:
  - 그래프 교점 세기
  - $n$과 교점 수의 규칙 찾기
  - 등차수열 합 공식
  conditions:
  - $f$의 최댓값 $2$는 $x=3m+1$, 최솟값 $0$은 $x=3m$
  - $2^{\frac xn}$은 $(0,1)$, $(n,2)$를 지나고 $x>n$이면 $2$보다 큼
  stimuli_used: []
  subpart_links: 단일 논제
