  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $g$가 연속 ⇔ $f(a)=2a+k$이므로 $h(k)$는 $y=f(x)$와 $y=2x+k$의 교점 수; 기울기 $2$인 접선과 점 $(2,14)$를 지나는 직선 사이에서 교점이 $4$개.
    steps:
    - id: 1a
      content: |
        접선 $k=-\dfrac52$(왼쪽 포물선), $k=-6$(오른쪽 포물선), $(2,14)$ 통과 $k=10$ → $-\dfrac52<k<10$ → 정수 $12$개.
      criteria:
      - 1.R1
      - 1.M1
      - 1.M2
      - 1.M3
      - 1.A1
    hint_ladder:
    - $g$가 $x=a$에서 연속이려면 $f(a)$와 $2a+k$가 어떤 관계여야 하는가?
    - $h(k)$를 두 그래프의 교점 개수로 바꾸어 보자.
    - 기울기 $2$인 직선을 위아래로 움직이며 교점 수가 바뀌는 순간을 찾아라.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2025 선행학습 영향평가 보고서」 p.95~97 문항 해설 및 풀이과정
    steps:
    - id: 1b-1
      content: |
        $g(x)$가 $x=a$에서 연속이 되도록 하는 실수 $a$의 개수가 $4$가 되기 위해서는 $y=f(x)$ 그래프와 $y=2x+k$의 그래프가 $4$개의 교점을 가져야 한다.
        $f(x)=\begin{cases}2(x+1)^2-4 & (x<2)\\ (x-5)^2+5 & (x\ge2)\end{cases}$
        $y=2x+k$의 그래프가 $y$절편 $k$가 증가하면서 $f(x)$와 처음으로 접선을 이룰 때는 교점이 $1$개이고, 두 번째로 접선을 이룰 때는 교점이 $3$개이다. 또한 $(2,14)$를 지날 때 $3$개의 교점을 가지므로 $4$개의 교점을 갖기 위해서는 $3$개의 교점을 갖는 두 직선 사이에 위치해야 한다.
      criteria:
      - 1.R1
    - id: 1b-2
      content: |
        (1) $2x^2+4x-2$의 기울기 $2$인 접선: $4x_1+4=2$, $x_1=-\dfrac12$, $y_1=2\cdot\left(-\dfrac12\right)^2+4\cdot\left(-\dfrac12\right)-2=-\dfrac72$. 접선 $y=2x-\dfrac52$, $k=-\dfrac52$
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        (2) $x^2-10x+30$의 기울기 $2$인 접선: $2x_2-10=2$, $x_2=6$, 접점 $(6,6)$, 접선 $y=2x-6$, $k=-6$. 이때 교점은 $1$개이므로 $3$개의 교점을 지나지 않는다.
      criteria:
      - 1.M2
    - id: 1b-4
      content: |
        (3) $(2,14)$를 지날 때 $y=2x+10$, $k=10$
      criteria:
      - 1.M3
    - id: 1b-5
      content: |
        따라서 $(2,14)$를 지나는 직선 $y=2x+10$과 접선 $y=2x-\dfrac52$ 사이에 위치해야 하고, $4$개의 교점을 가지기 위한 $k$의 범위는 $-\dfrac52<k<10$이므로 정수의 개수는 $12$개이다.
      criteria:
      - 1.A1
