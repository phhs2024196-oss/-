stem: |
  함수 $f(x)=\begin{cases}2x^2+4x-2 & (x<2)\\ x^2-10x+30 & (x\ge2)\end{cases}$에 대하여 함수 $g(x)=\begin{cases}f(x) & (x<a)\\ 2x+k & (x\ge a)\end{cases}$가
  실수 전체의 집합에서 연속이 되도록 하는 실수 $a$의 개수를 $h(k)$라 하자. $h(k)=4$를 만족시키는 정수 $k$의 개수를 구하시오.
