  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 직선은 $[0,n]$에서 $-1$부터 $1$까지 오르고 그 구간에 $y=\sin n\pi x$가 $\dfrac{n^2}{2}$주기 있으므로 $n$이 홀수면 $n^2$개, 짝수면 $n^2-1$개.
    steps:
    - id: 1a
      content: |
        $f(9)=20\times2+20\times2+1=81$, $f(20)=100\times2+100\times2-1=399$ → $480$.
      criteria:
      - 1.M1
      - 1.M2
    hint_ladder:
    - 직선의 $y$값이 $-1$과 $1$ 사이에 있는 $x$의 범위는?
    - 그 범위에 $y=\sin n\pi x$의 주기가 몇 개 들어가는가?
    - 가운데 $x=\dfrac n2$ 근처를 따로 살펴보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2025 선행학습 영향평가 보고서」 p.98~101 문항 해설 및 풀이과정
    steps:
    - id: 1b-1
      content: |
        (풀이 1) $n=9$인 경우, 총 주기는 $\dfrac{81}{2}$개이므로, $x=9$의 절반 지점인 직선 $x=\dfrac92$를 기준으로 왼쪽(구간 A) $20$개, 오른쪽(구간 B) $20$개의 사인함수가 대칭으로 존재한다. 또한 $x=\dfrac92$에서 사인함수의 반파장이 양의 구간에 위치한다.
        구간 A의 $20$개 주기는 $y$값이 $0$보다 작은 구간에서 주기당 $2$개의 교점을, 구간 B의 $20$개 주기는 $y$값이 $0$보다 큰 구간에서 주기당 $2$개의 교점을 가지고, 중심의 반주기에서 $1$개의 추가 교점을 가진다.
        $\therefore\ f(9)=20\times2+20\times2+1=81$
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $n=20$인 경우, 총 주기는 $\dfrac{400}{2}$개이므로, $x=10$을 기준으로 왼쪽(구간 C) $100$개, 오른쪽(구간 D) $100$개의 사인함수가 존재한다.
        왼쪽($x<10$) $100$개는 $y<0$인 구간에서 주기당 $2$개, 오른쪽($x>10$) $100$개는 $y>0$인 구간에서 주기당 $2$개의 교점을 가지며, 점 $x=10$에서 교점이 중복되므로
        $f(20)=100\times2+100\times2-1=399$, $\therefore\ f(9)+f(20)=81+399=480$
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        (풀이 2) 직선이 $-1$에서 $1$까지 도달하는 $x$의 범위는 $[0,n]$이고, 이 구간에서 $y=\sin n\pi x$의 주기의 개수는 $\dfrac{n^2}{2}$이다.
        $n$이 홀수이면 교점의 개수는 $2\cdot\dfrac{n^2-1}{2}+1=n^2$, $n$이 짝수이면 $2\cdot\dfrac{n^2}{2}-1=n^2-1$.
        (확인: $n=1$이면 $1$개, $n=2$이면 $3$개, $n=3$이면 $9$개.) $\therefore\ f(9)+f(20)=81+399=480$
      criteria:
      - 1.M1
      - 1.M2
