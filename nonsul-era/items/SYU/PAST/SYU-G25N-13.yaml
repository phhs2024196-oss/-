stem: |
  자연수 $n$에 대하여 직선 $y=\dfrac{2}{n}x-1$과 함수 $y=\sin n\pi x$의 그래프의 교점의 개수를 $f(n)$이라 할 때, $f(9)+f(20)$의 값을 구하시오.
