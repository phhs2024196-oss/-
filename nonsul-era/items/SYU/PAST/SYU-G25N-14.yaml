subparts:
- id: '1'
  stem: 위 문제의 답을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: expression
    value: -A+B+8a
    equivalents:
    - B-A+8a
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $x-b=X$ 치환으로 $\int_0^af(x)dx=-B+2a$, $f(x)-5$가 기함수라 $\int_{-a}^af(x)dx=10a$를 써서 구간을 나누어 합친다.
    steps:
    - id: 1a
      content: |
        $\int_{-a}^{-b}=\int_0^{-b}-\int_0^{-a}$, $\int_0^{-b}f=-A$, $\int_0^af=-B+2a$, $-\int_0^{-a}f=10a-\int_0^af=B+8a$ → $-A+B+8a$.
      criteria:
      - 1.M1
      - 1.M2
      - 1.M3
      - 1.M4
    hint_ladder:
    - $\int_{-a}^{-b}$을 $0$을 기준으로 두 적분의 차로 나누어 보자.
    - $B$의 적분에서 $x-b=X$로 치환하면 어떤 구간의 적분이 되는가?
    - $x^3-a^2x$는 기함수이다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2025 선행학습 영향평가 보고서」 p.102~105 문항 해설 및 풀이과정
    steps:
    - id: 1b-1
      content: |
        (수식 변형) $\int_{-a}^{-b}f(x)dx=\int_0^{-b}f(x)dx-\int_0^{-a}f(x)dx$
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $\int_0^{-b}f(x)dx=-A$
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $\int_b^{a+b}\{-f(x-b)+2\}dx=B$에서 $x-b=X$로 치환하면 $\int_0^a\{-f(X)+2\}dX=B$, $-\int_0^af(x)dx=B-2a$, $\int_0^af(x)dx=-B+2a$
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        $\int_{-a}^af(x)dx=\int_{-a}^a(x^3-a^2x+5)dx=10a=\int_{-a}^0f(x)dx+\int_0^af(x)dx$이므로
        $-\int_0^{-a}f(x)dx=10a-\int_0^af(x)dx=B+8a$
        $\therefore\ \int_{-a}^{-b}f(x)dx=-A+B+8a$
      criteria:
      - 1.M4
  - id: S2-B
    audience: B
    method_no: 2
    source_flow: 「2025 선행학습 영향평가 보고서」 p.103 (그래프 변형)
    steps:
    - id: 2b-1
      content: |
        $f(x)-5=x(x-a)(x+a)$. $y=5$ 위 $-b\le x\le0$ 부분 넓이를 $C$라 하면 $A=C+5b$, $C=A-5b$.
      criteria:
      - 1.M2
    - id: 2b-2
      content: |
        $g(x)=-f(x-b)+2=-[f(x-b)-2]$의 $b\le x\le a+b$ 부분에서 $y=-3$ 위 넓이를 $D$라 하면 $B=-(3a-D)=D-3a$, $D=B+3a$.
      criteria:
      - 1.M3
    - id: 2b-3
      content: |
        $\int_{-a}^{-b}f(x)dx=D-C+5(a-b)=B+3a-A+5b+5a-5b=-A+B+8a$
      criteria:
      - 1.M4
