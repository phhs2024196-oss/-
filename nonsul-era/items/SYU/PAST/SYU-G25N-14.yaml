  - id: MC-CAL-4257
    outcome_code: '71'
    wrong_work: $x-b=X$ 치환에서 적분구간을 바꾸지 않거나 상수 $2$의 적분($2a$)을 빠뜨림
    detect_cue: $\int_0^af(x)dx=-B$ 또는 $-B+2(a+b)$로 씀
