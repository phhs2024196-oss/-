stimuli: []
stem: |
  $a>b$인 두 양수 $a$, $b$와 삼차함수 $f(x)=x^3-a^2x+5$에 대하여
  $\int_{-b}^{0}f(x)dx=A$, $\int_{b}^{a+b}\{-f(x-b)+2\}dx=B$
  일 때, $\int_{-a}^{-b}f(x)dx$의 값을 $A,B$, $a$를 이용하여 표현하시오. (단, $f(x)$의 극솟값은 $2$보다 크다.)
elements:
  materials:
  - 삼차함수 $f(x)=x^3-a^2x+5$ ($f(x)-5$는 기함수)
  - 세 정적분 $A$, $B$, $\int_{-a}^{-b}f(x)dx$
  concepts:
  - 정적분의 구간 나누기
  - 평행이동(치환)과 정적분
  - 기함수의 대칭구간 정적분
  tools:
  - $x-b=X$ 치환
  - $\int_{-a}^{a}(x^3-a^2x+5)dx=10a$
  - 구간 합·차로 재구성
  conditions:
  - $a>b>0$
  - 극솟값 $>2$ (그래프 해석용 조건)
