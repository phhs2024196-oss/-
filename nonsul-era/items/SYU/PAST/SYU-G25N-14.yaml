  - id: MC-CAL-4258
    outcome_code: '72'
    wrong_work: $\int_{-a}^af(x)dx$에서 상수항 $5$를 빠뜨려 $0$으로 봄
    detect_cue: 답이 $-A+B-2a$
    feedback: $x^3-a^2x$만 기함수이고 상수 $5$의 적분은 $5\times2a=10a$입니다.
    remedy:
    - RL-2
