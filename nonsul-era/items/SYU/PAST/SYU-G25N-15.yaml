stimuli: []
stem: |
  그림과 같이 둘레의 길이가 $4$인 원 위를 시계방향으로 움직이는 두 점 $\mathrm{P}$, $\mathrm{Q}$가 있다. 두 점 $\mathrm{P}$, $\mathrm{Q}$는 원의 지름의 양 끝점에서 시각 $t=0$일 때 동시에 출발하고 시각 $t\,(t\ge0)$에서의 속도가 각각 $v_P(t)=3t^2$, $v_Q(t)=3t+6$이다. 점 $\mathrm{P}$가 원을 $16$바퀴 도는 동안 점 $\mathrm{P}$와 점 $\mathrm{Q}$가 만나는 횟수를 구하시오.

  [그림: 원의 중심을 지나는 수평 지름의 왼쪽 끝에 점 P, 오른쪽 끝에 점 Q가 표시되어 있고, P 근처(왼쪽 위)와 Q 근처(오른쪽 아래)에 시계방향 회전을 나타내는 화살표가 그려져 있다.]
elements:
  materials:
  - 둘레 $4$인 원 위의 두 점 $\mathrm{P}$, $\mathrm{Q}$(지름의 양 끝에서 출발)
  - 속도 $v_P=3t^2$, $v_Q=3t+6$
  concepts:
  - 속도와 이동거리(정적분)
  - 삼차함수의 증감
  - 방정식의 실근 개수
  tools:
  - 이동거리 $x_1=t^3$, $x_2=\dfrac32t^2+6t$
  - 만남 조건 $x_1-(x_2+2)=4n$
  - 증감표와 수평선 $y=4n$의 교점 세기
  conditions:
  - P가 16바퀴 → 거리 $64$ → $0\le t\le4$
  - '$f(t)=t^3-\frac32t^2-6t-2$: $f(0)=-2$, $f(2)=-12$(극소), $f(4)=14$'
