  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $t_1=4$까지 $t^3-\left(\dfrac32t^2+6t+2\right)=4n$ 이 되는 시각의 수를 $y=t^3-\dfrac32t^2-6t-2$의 그래프와 $y=4n$의 교점으로 센다.
    steps:
    - id: 1a
      content: |
        $t_1=4$; $f(t)=t^3-\dfrac32t^2-6t-2$는 $-2\searrow-12\nearrow14$; $4n=-8,-4$ 각 $2$회, $4n=-12$ $1$회, $4n=0,4,8,12$ 각 $1$회 → $9$회.
      criteria:
      - 1.B1
      - 1.M1
      - 1.M2
      - 1.A1
    hint_ladder:
    - P가 16바퀴 도는 데 걸리는 시간부터 구하자.
    - 두 점이 만나려면 이동거리의 차가 얼마여야 하는가?(처음 간격은 반 바퀴)
    - 차를 $t$의 함수로 두고 그 그래프와 $y=4n$의 교점을 세어라.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2025 선행학습 영향평가 보고서」 p.106~108 문항 해설 및 풀이과정
    steps:
    - id: 1b-1
      content: |
        P가 $16$바퀴 도는 데 움직인 거리는 $4\times16=64$. 걸리는 시간을 $t_1$이라 하면 $\int_0^{t_1}3t^2dt=t_1^3=64$이므로 $t_1=4$
      criteria:
      - 1.B1
    - id: 1b-2
      content: |
        P가 움직인 거리 $x_1(t)=\int_0^t3t^2dt=t^3$, Q가 움직인 거리 $x_2(t)=\int_0^t(3t+6)dt=\dfrac32t^2+6t$
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        원의 둘레가 $4$이고 둘 사이의 거리가 $2$이므로 P와 Q가 만나려면 $x_1(t)-\{x_2(t)+2\}=t^3-\dfrac32t^2-6t-2=4n$ ($n$은 정수)이다.
        $f(t)=t^3-\dfrac32t^2-6t-2$라 두면 만난 횟수는 $y=f(t)\ (0\le t\le4)$와 $y=4n$이 만나는 점의 개수와 같다.
        $f'(t)=3t^2-3t-6=3(t-2)(t+1)$이므로 $f(0)=-2$, $f$는 $t=2$까지 감소해 $f(2)=-12$, 이후 증가해 $f(4)=14$.
      criteria:
      - 1.M2
    - id: 1b-4
      content: |
        i) $-2<4n\le14$일 때 $n=0,1,2,3$: $4$회
        ii) $-12<4n\le-2$일 때 $n=-2,-1$: 두 점씩이므로 $4$회
        iii) $4n=-12$일 때 $n=-3$: $1$회
        총 $9$회
      criteria:
      - 1.A1
