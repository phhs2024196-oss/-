subparts:
- id: '1'
  stem: |
    $f(1)+f(4)$의 값을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '1/2'
    equivalents: ['$\dfrac{1}{2}$', '0.5']
    tolerance: null
    note: '$a=-\dfrac{1}{4}$, $b=\dfrac{5}{2}$, $f(1)=\dfrac{7}{2}$, $f(4)=-3$'
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 미분가능 ⇒ 연속이므로 $x=2$에서 함숫값 일치와 미분계수 일치, 두 식으로 $a$, $b$를 구한다.
    steps:
    - id: 1a
      content: '$16a+8=12a+2+2b$, $24a+4=12a+1$에서 $a=-\dfrac14$, $b=\dfrac52$이고 $f(1)+f(4)=\dfrac72-3=\dfrac12$'
      criteria: [1.M1, 1.A1, 1.A2]
    hint_ladder:
    - 미분가능한 함수는 반드시 연속이다. $x=2$에서 무엇이 같아야 할까?
    - 좌극한과 우극한, 그리고 $x=2$에서의 좌·우 미분계수를 각각 같게 놓아 보자.
    - '$f(4)$는 $x\ge 2$ 쪽 식에 대입한다.'
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2026 선행학습 영향평가 보고서」 p.60~61 문항 해설 및 풀이과정
    steps:
    - id: 1b-1
      content: |
        실수 전체의 집합에서 미분가능하므로 $x=2$에서 연속이다.
        $\displaystyle\lim_{x\to2-}(2ax^3+4x)=\lim_{x\to2+}(3ax^2+x+2b)$에서 $16a+8=12a+2+2b$ … ①
      criteria: [1.M1, 1.A1]
    - id: 1b-2
      content: |
        $x=2$에서 미분가능하므로 $f'(x)=\begin{cases}6ax^2+4 & (x<2)\\ 6ax+1 & (x\ge 2)\end{cases}$에서
        $f'(2)=24a+4=12a+1$ … ②
      criteria: [1.M1]
    - id: 1b-3
      content: |
        ②에서 $12a=-3$, $a=-\dfrac14$. 이를 ①에 대입하면 $-4+8=-3+2+2b$, 즉 $4=-1+2b$이므로 $b=\dfrac52$.
      criteria: [1.M1, 1.A1]
    - id: 1b-4
      content: |
        $\therefore f(x)=\begin{cases}-\dfrac12x^3+4x & (x<2)\\ -\dfrac34x^2+x+5 & (x\ge 2)\end{cases}$
        $f(1)=\dfrac72$, $f(4)=-12+4+5=-3$이므로 $f(1)+f(4)=\dfrac12$
      criteria: [1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
