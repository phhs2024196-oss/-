stem: |
  함수 $f(x)=\begin{cases}2ax^3+4x & (x<2)\\ 3ax^2+x+2b & (x\ge 2)\end{cases}$가 실수 전체의 집합에서 미분가능할 때,
  $f(1)+f(4)$의 값을 구하시오. (단, $a$, $b$는 상수이다.)

