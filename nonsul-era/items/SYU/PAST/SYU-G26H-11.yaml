stimuli: []

stem: |
  함수 $f(x)=\dfrac{1}{3}x^3-x^2-3x$에 대하여 $x$에 대한 방정식 $\lvert f(x)\rvert=k$의 서로 다른 실근의 개수를 $n$이라 하자. $n$이 홀수가 되도록 하는 모든 $k$의 값의 합을 $\alpha$, $n$이 짝수가 되도록 하는 모든 $k$의 값의 합을 $\beta$라 할 때, $\beta-\alpha$의 값을 구하시오. (단, $n>2$, $k$는 정수이다.)

elements:
  materials: ['삼차함수 $f(x)=\dfrac13x^3-x^2-3x$와 그 절댓값 함수 $y=\lvert f(x)\rvert$', '수평선 $y=k$']
  concepts: [도함수와 극대·극소, 삼차함수의 그래프 개형, 절댓값 함수의 그래프, 방정식의 실근과 그래프의 교점]
  tools: ['$f^{\prime}(x)=(x-3)(x+1)$로 극값 구하기', 그래프 접어 올리기, 정수 $k$의 경우 분류]
  conditions: ['극댓값 $f(-1)=\dfrac53$, 극솟값 $f(3)=-9$', '$n>2$ → $0\le k\le 9$인 정수만 대상', '$k$는 정수 → $k=\dfrac53$은 제외']
  stimuli_used: []
  subpart_links: 단일 논제

