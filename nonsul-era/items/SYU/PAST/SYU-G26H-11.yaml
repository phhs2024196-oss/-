    detect_cue: '$k=9$가 짝수 쪽 합에 들어가 있거나 답이 $45$'
    feedback: 서로 다른 실근의 개수는 그래프의 교점 개수입니다. 접하는 점은 한 개로 셉니다.
    remedy: [RL-1]
  - id: MC-CAL-4104
    outcome_code: '71'
    wrong_work: '$y=\lvert f(x)\rvert$를 그리지 않고 $f(x)=k$의 실근만 세어 $k=1$일 때 $n=3$, $k\ge2$일 때 $n=1$ 등으로 분류'
    detect_cue: '$f(x)=-k$인 경우를 고려한 흔적이 없고 $x$축 아래 부분을 접지 않음'
    feedback: '$\lvert f(x)\rvert=k$는 $f(x)=k$ 또는 $f(x)=-k$입니다. $x$축 아래 부분을 위로 접은 그래프를 그리세요.'
    remedy: [RL-2]

