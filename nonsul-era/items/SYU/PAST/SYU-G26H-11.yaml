subparts:
- id: '1'
  stem: |
    $\beta-\alpha$의 값을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '27'
    equivalents: []
    tolerance: null
    note: '$n=3$: $k=0,9$ / $n=4$: $k=2,3,\cdots,8$ / $n=6$: $k=1$ → $\alpha=9$, $\beta=36$'
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 극값 $\dfrac53$, $-9$를 구해 $y=\lvert f(x)\rvert$를 그리고, 정수 $k=0,1,\cdots,9$마다 교점 개수를 센다.
    steps:
    - id: 1a
      content: '$n=3$ ($k=0,9$), $n=4$ ($k=2\sim8$), $n=6$ ($k=1$)이므로 $\beta-\alpha=36-9=27$'
      criteria: [1.M1, 1.M2, 1.M3, 1.A1]
    hint_ladder:
    - 실근의 개수는 $y=\lvert f(x)\rvert$와 $y=k$의 교점 개수와 같다.
    - '$f^{\prime}(x)=0$에서 극값을 구하고, $x$축 아래 부분을 위로 접어 보자.'
    - '$k\ge10$이면 $n=2$이므로 조건 $n>2$에서 제외된다. $k=0$, $k=9$에서 접하는 점을 주의하자.'
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2026 선행학습 영향평가 보고서」 p.62~63 문항 해설 및 풀이과정
    steps:
    - id: 1b-1
      content: |
        $n$은 $y=\lvert f(x)\rvert$ 그래프와 직선 $y=k$가 만나는 교점의 개수와 같다.
        $f^{\prime}(x)=x^2-2x-3=(x-3)(x+1)$이므로 $x=-1$에서 극대(극댓값 $\dfrac53$), $x=3$에서 극소(극솟값 $-9$)이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        함수 $y=f(x)$의 그래프는 [그림1]과 같고, 함수 $y=\lvert f(x)\rvert$의 그래프는 [그림2]와 같다.
        [그림1: $y=f(x)$의 그래프. $x=-1$에서 극댓값 $\dfrac53$, 원점을 지나 내려가 $x=3$에서 극솟값 $-9$를 갖고 다시 증가하는 삼차함수 곡선.]
        [그림2: $y=\lvert f(x)\rvert$의 그래프. $x=-1$에서 높이 $\dfrac53$의 작은 봉우리, 원점과 양의 $x$절편에서 $x$축에 닿고, $x=3$에서 높이 $9$의 큰 봉우리. 점선 $y=k$가 가로로 그어져 있음.]
      criteria: [1.M1]
    - id: 1b-3
      content: |
        $n=3$일 때, $k=0,9$
        $n=4$일 때, $k=2,3,4,5,6,7,8$
        $n=6$일 때, $k=1$
      criteria: [1.M1, 1.M2, 1.M3]
    - id: 1b-4
      content: |
        $\therefore\alpha=0+9=9$, $\beta=1+2+3+4+5+6+7+8=36$, $\beta-\alpha=27$
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
