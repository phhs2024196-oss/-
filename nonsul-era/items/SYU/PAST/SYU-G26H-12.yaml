subparts:
- id: '1'
  stem: |
    두 접선과 곡선으로 둘러싸인 부분의 넓이를 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '16/3'
    equivalents: ['$\dfrac{16}{3}$']
    tolerance: null
    note: '접점의 $x$좌표 $-3$, $1$ / 접선 $y=-2x-5$, $y=6x+3$'
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 접점을 $(a,a^2+4a+4)$로 두고 접선이 $(-1,-3)$을 지나게 하면 $a=-3,1$. 넓이는 $x=-1$에서 나누어 적분한다.
    steps:
    - id: 1a
      content: '$a=-3$ 또는 $1$, $\displaystyle\int_{-3}^{-1}(x+3)^2dx+\int_{-1}^{1}(x-1)^2dx=\dfrac83+\dfrac83=\dfrac{16}{3}$'
      criteria: [1.M1, 1.A1]
    hint_ladder:
    - 점 $(-1,-3)$은 곡선 위에 있는가? 아니라면 접점을 미지수로 두자.
    - 접선의 방정식에 $(-1,-3)$을 대입하면 접점의 $x$좌표에 대한 방정식이 나온다.
    - 두 접선이 만나는 $x=-1$을 경계로 위쪽 곡선, 아래쪽 직선이 바뀐다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2026 선행학습 영향평가 보고서」 p.64~65 문항 해설 및 풀이과정
    steps:
    - id: 1b-1
      content: |
        $y=x^2+4x+4$, $y^{\prime}=2x+4$
        접점의 좌표를 $(a,\ a^2+4a+4)$라 하면, 접선의 기울기는 $2a+4$이므로
        접선의 방정식은 $y=(2a+4)(x-a)+a^2+4a+4$
      criteria: [1.M1]
    - id: 1b-2
      content: |
        이 접선이 $(-1,\ -3)$을 지나므로
        $-3=(2a+4)(-1-a)+a^2+4a+4=-a^2-2a$
        $a^2+2a-3=0$, $(a+3)(a-1)=0$ $\therefore a=-3$ 또는 $1$
        즉, 접선의 방정식은 $y=-2x-5$ 또는 $y=6x+3$
      criteria: [1.M1]
    - id: 1b-3
      content: |
        [그림: 포물선 $y=(x+2)^2$와 두 접선 $y=-2x-5$(접점 $(-3,1)$), $y=6x+3$(접점 $(1,9)$)이 점 $(-1,-3)$에서 만나고, 포물선과 두 접선 사이의 영역 $S$가 색칠되어 있음.]
        $\displaystyle\int_{-3}^{-1}\{(x^2+4x+4)-(-2x-5)\}dx+\int_{-1}^{1}\{(x^2+4x+4)-(6x+3)\}dx$
        $\displaystyle=\int_{-3}^{-1}(x^2+6x+9)dx+\int_{-1}^{1}(x^2-2x+1)dx$
        $\displaystyle=\Big[\dfrac13x^3+3x^2+9x\Big]_{-3}^{-1}+\Big[\dfrac13x^3-x^2+x\Big]_{-1}^{1}=\dfrac83+\dfrac83=\dfrac{16}{3}$
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
