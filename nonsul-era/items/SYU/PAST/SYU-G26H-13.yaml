  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $a_n$은 $1,1,-1,-1$이 반복되므로 네 항씩 묶으면 각 묶음의 합이 $-4$이다.
    steps:
    - id: 1a
      content: '$(1+2-3-4)+\cdots+(93+94-95-96)+97+98-99=-4\times24+96=0$'
      criteria: [1.M1, 1.A1]
    hint_ladder:
    - $n=1,2,3,\cdots,8$을 대입해 지수가 홀수인지 짝수인지 확인해 보자.
    - 부호가 4개 주기로 반복된다면 네 항씩 묶어 보자.
    - 99항은 4개짜리 묶음 몇 개와 남는 항 몇 개인가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2026 선행학습 영향평가 보고서」 p.66~67 문항 해설 및 풀이과정
    steps:
    - id: 1b-1
      content: |
        $\dfrac{n^2+n-2}{2}=\dfrac{(n+2)(n-1)}{2}$에서
        $n=1$일 때, $\dfrac{3\times0}{2}=0$, $(-1)^0=1$
        $n=2$일 때, $\dfrac{4\times1}{2}=2$, $(-1)^2=1$
        $n=3$일 때, $\dfrac{5\times2}{2}=5$, $(-1)^5=-1$
        $n=4$일 때, $\dfrac{6\times3}{2}=9$, $(-1)^9=-1$
        $n=5$일 때, $\dfrac{7\times4}{2}=14$, $(-1)^{14}=1$
        $n=6$일 때, $\dfrac{8\times5}{2}=20$, $(-1)^{20}=1$
        $n=7$일 때, $\dfrac{9\times6}{2}=27$, $(-1)^{27}=-1$
        $n=8$일 때, $\dfrac{10\times7}{2}=35$, $(-1)^{35}=-1$
        이므로 수열 $\{a_n\}$은 $1,1,-1,-1,\cdots$이 반복적으로 나타난다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        보충: $\dfrac{(n+4+2)(n+4-1)}{2}-\dfrac{(n+2)(n-1)}{2}=4n+10$은 짝수이므로 부호는 실제로 주기 4로 반복된다.
      criteria: [1.M1]
    - id: 1b-3
      content: |
        $\displaystyle\therefore\sum_{n=1}^{99}na_n=(1+2-3-4)+(5+6-7-8)+\cdots+(93+94-95-96)+97+98-99$
        $=(-4\times24)+97+98-99=0$
      criteria: [1.A1]
