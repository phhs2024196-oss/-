subparts:
- id: '1'
  stem: |
    극한값을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '5/6'
    equivalents: ['$\dfrac{5}{6}$']
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$[5x]=5x-\alpha$로 두고 유리화하면 $\dfrac{5x-\alpha}{\sqrt{9x^2+5x-\alpha}+3x}\to\dfrac56$'
    steps:
    - id: 1a
      content: '$\displaystyle\lim_{x\to\infty}\dfrac{5-\frac{\alpha}{x}}{\sqrt{9+\frac5x-\frac{\alpha}{x^2}}+3}=\dfrac56$'
      criteria: [1.M1, 1.M2, 1.A1]
    hint_ladder:
    - '$[5x]$와 $5x$의 차이는 얼마 이하인가?'
    - '$\sqrt{A}-B$ 꼴은 $\sqrt{A}+B$를 곱해 유리화한다.'
    - 분모와 분자를 $x$로 나누어 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2026 선행학습 영향평가 보고서」 p.68~69 문항 해설 및 풀이과정
    steps:
    - id: 1b-1
      content: |
        $5x=[5x]+\alpha\ (0\le\alpha<1)$라 하면 $[5x]=5x-\alpha$이므로
        $\displaystyle\lim_{x\to\infty}(\sqrt{9x^2+[5x]}-3x)=\lim_{x\to\infty}(\sqrt{9x^2+5x-\alpha}-3x)$
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $\displaystyle=\lim_{x\to\infty}\dfrac{(\sqrt{9x^2+5x-\alpha}-3x)\times(\sqrt{9x^2+5x-\alpha}+3x)}{(\sqrt{9x^2+5x-\alpha}+3x)}$
        $\displaystyle=\lim_{x\to\infty}\dfrac{5x-\alpha}{\sqrt{9x^2+5x-\alpha}+3x}$
      criteria: [1.M2]
    - id: 1b-3
      content: |
        $\displaystyle=\lim_{x\to\infty}\dfrac{5-\dfrac{\alpha}{x}}{\sqrt{9+\dfrac{5}{x}-\dfrac{\alpha}{x^2}}+3}=\dfrac56$
        보충: $0\le\alpha<1$로 유계이므로 $\dfrac{\alpha}{x}\to0$, $\dfrac{\alpha}{x^2}\to0$이다($\alpha$는 $x$에 따라 변하지만 범위가 정해져 있다).
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
