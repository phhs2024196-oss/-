subparts:
- id: '1'
  stem: |
    $f(n)<2$를 만족시키는 $n$의 최댓값을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '22'
    equivalents: []
    tolerance: null
    note: '$f(n)=\log_3\dfrac{n+4}{3}$'
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '진수 $t=1+\dfrac{n+1}{\frac{2x}{y}+\frac{2y}{x}-1}\le1+\dfrac{n+1}{3}$이고, $\log_3\dfrac{n+4}{3}<2$에서 $n<23$'
    steps:
    - id: 1a
      content: '$f(n)=\log_3\dfrac{n+4}{3}<2\iff n+4<27$이므로 $n$의 최댓값은 $22$'
      criteria: [1.M1, 1.M2, 1.A1]
    hint_ladder:
    - 로그의 차를 하나의 로그로 묶으면 진수는 분수식이다. 분자에서 분모를 빼 보자.
    - 분자·분모를 $xy$로 나누면 $\dfrac{x}{y}+\dfrac{y}{x}$ 꼴이 나온다. $xy>0$을 이용하자.
    - '$\log_3 t<2$는 $t<9$와 같다.'
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2026 선행학습 영향평가 보고서」 p.70~71 문항 해설 및 풀이과정
    steps:
    - id: 1b-1
      content: |
        $\log_3(2x^2+nxy+2y^2)-\log_3(2x^2-xy+2y^2)=\log_3\dfrac{2x^2+nxy+2y^2}{2x^2-xy+2y^2}$
        $t=\dfrac{2x^2+nxy+2y^2}{2x^2-xy+2y^2}$이라고 하면 $\log_3t$는 밑이 1보다 크므로 $t$가 최대일 때, $\log_3t$도 최댓값을 갖는다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $t=\dfrac{2x^2+nxy+2y^2+xy-xy}{2x^2-xy+2y^2}=1+\dfrac{(n+1)xy}{2x^2-xy+2y^2}=1+\dfrac{n+1}{\dfrac{2x}{y}-1+\dfrac{2y}{x}}$
      criteria: [1.M1]
    - id: 1b-3
      content: |
        $xy>0$에서 $\dfrac{x}{y}>0$, $\dfrac{y}{x}>0$이므로
        $t=1+\dfrac{n+1}{\dfrac{2x}{y}+\dfrac{2y}{x}-1}\le1+\dfrac{n+1}{2\sqrt{\dfrac{2x}{y}\cdot\dfrac{2y}{x}}-1}=1+\dfrac{n+1}{3}=\dfrac{n+4}{3}$
        (단, 등호는 $\dfrac{x}{y}=\dfrac{y}{x}$ 즉 $x=y$일 때) $t$의 최댓값이 $\dfrac{n+4}{3}$이므로
        $f(n)=\log_3\Big(\dfrac{n+4}{3}\Big)<2$
      criteria: [1.M2]
    - id: 1b-4
      content: |
        로그의 밑이 1보다 크므로 $\dfrac{n+4}{3}<3^2$ $\therefore n+4<3^3$, $n<23$
        $\therefore n$의 최댓값은 $22$
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
