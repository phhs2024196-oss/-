  misconceptions:
  - id: MC-ALG-4103
    outcome_code: '70'
    wrong_work: '$\log_3t<2$를 $t<2\times3=6$으로 바꿔 $\dfrac{n+4}{3}<6$, $n<14$ → $13$'
    detect_cue: '부등식에 $6$이 나오거나 답이 $13$'
    feedback: '$\log_3t<2\iff t<3^2$입니다. 로그의 정의로 진수 부등식으로 바꾸세요.'
    remedy: [RL-1]
  - id: MC-ALG-4104
    outcome_code: '71'
    wrong_work: '분모의 $-1$을 빠뜨리거나 산술·기하평균을 $\dfrac{2x}{y}+\dfrac{2y}{x}\ge2$로 잘못 적용해 $t$의 최댓값을 틀림(예: $1+\dfrac{n+1}{4}$ → $n<31$, $30$)'
    detect_cue: '$t$의 최댓값이 $\dfrac{n+4}{3}$이 아니거나 등호 조건($x=y$) 언급이 없음'
    feedback: '$\dfrac{2x}{y}+\dfrac{2y}{x}\ge2\sqrt{4}=4$이고 분모는 여기서 1을 뺀 $3$ 이상입니다. 등호가 $x=y$에서 성립함도 확인하세요.'
    remedy: [RL-2]

