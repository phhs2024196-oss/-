stimuli: []
stem: |
  그림과 같이 어느 자동차에 장착된 와이퍼가 $1$초에 한 번씩 왕복하며 유리를 닦는다. 길이가 $40\text{cm}$인 와이퍼에서 실제로 유리를 닦는 고무날의 길이는 $30\text{cm}$이고, $\dfrac{3}{5}\pi$만큼 부채꼴 모양으로 회전할 때, $2.5$초 동안 와이퍼의 고무날이 회전하며 닦은 유리창의 넓이를 구하시오. (단, 유리창은 한 평면 위에 있고, 왕복이라 함은 와이퍼의 고무날이 다시 출발점으로 돌아오는 것을 의미한다. 와이퍼 고무날의 두께는 무시하고, 유리창을 닦는 속도는 전 구간에서 일정하다.)

  [그림: 중심각이 $\dfrac{3}{5}\pi$인 부채꼴 모양의 와이퍼 회전 영역. 중심(부채꼴 꼭짓점)에서 바깥 호까지의 길이 $40\text{cm}$(점선 표시), 왼쪽 반지름 위 바깥쪽 끝에서부터 $30\text{cm}$ 구간이 굵은 선(고무날)으로 그려져 있고, 반지름 $40$인 큰 부채꼴에서 반지름 $10$인 작은 부채꼴을 뺀 띠 모양 영역이 회색으로 칠해져 있다. 꼭짓점의 각에 $\dfrac{3}{5}\pi$가 표시되어 있다.]
