subparts:
- id: '1'
  stem: 위 문제의 답을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 2250\pi
    equivalents:
    - 2250\pi\ \text{cm}^2
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 한 번 쓸 때 닦이는 넓이는 반지름 40과 10인 두 부채꼴의 넓이 차이고, 2.5초 동안 5번 쓴다.
    steps:
    - id: 1a
      content: |
        한 번 쓸 때 $\dfrac12(40^2-10^2)\cdot\dfrac35\pi=450\pi$, $2.5$초 동안 $5$번 쓰므로 $2250\pi$.
      criteria:
      - 1.M1
      - 1.A1
    hint_ladder:
    - 고무날이 닿지 않는 부분은 어디인가?
    - 한 번 쓸 때 닦이는 영역은 두 부채꼴의 차이다.
    - $1$왕복은 몇 번의 쓸기인가? $2.5$초 동안은?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2026 선행학습 영향평가 보고서」 p.94~95 문항 해설 및 풀이과정
    steps:
    - id: 1b-1
      content: |
        부채꼴의 반지름을 $r$, 중심각을 $\theta$라 할 때 부채꼴의 넓이는 $S=\dfrac12 r^2\theta$이다.
        고무날에 의해 닦이는 넓이 $=$ 전체 부채꼴의 넓이 $-$ 안 닦이는 부채꼴의 넓이이므로
        $S=\left(\dfrac12\times40^2\times\dfrac35\pi\right)-\left(\dfrac12\times10^2\times\dfrac35\pi\right)=450\pi\ (\text{cm}^2)$ … ①
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $1$초에 한 번 왕복(갔다가 돌아옴 = $2$번 쓸기)하므로 $2.5$초 동안 작동하면 총 $5$번 유리면을 닦게 된다.
        따라서 ①$\times5=2250\pi\ (\text{cm}^2)$이다. (단위 표시가 없어도 정답으로 인정)
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
