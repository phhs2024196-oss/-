    outcome_code: '71'
    wrong_work: $g(x)=\log_2(-x+2)+b$의 점근선을 $x=-2$ 또는 $y=b$로 잡음
    detect_cue: 직선 $m$을 $x=2$가 아닌 식으로 둠
    feedback: 로그함수의 점근선은 진수가 $0$이 되는 $x$값, 즉 $-x+2=0$인 $x=2$입니다.
    remedy:
    - RL-1
  - id: MC-ALG-4154
    outcome_code: '72'
    wrong_work: $\log_2(-x+2)=a-b$에서 $x=2+2^{a-b}$ 또는 $x=2^{a-b}-2$
    detect_cue: B의 $x$좌표 부호 처리 오류
    feedback: $-x+2=2^{a-b}$에서 $x=2-2^{a-b}$입니다. 로그의 정의를 적용한 뒤 $x$에 대해 정리하세요.
    remedy:
    - RL-2
