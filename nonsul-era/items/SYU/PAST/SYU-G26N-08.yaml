subparts:
- id: '1'
  stem: 위 문제의 답을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: \log_2 6
    equivalents:
    - 1+\log_2 3
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $l:y=a$, $m:x=2$이므로 $\mathrm{A}(2,8+a)$, $\mathrm{B}(2-2^{a-b},a)$이고 거리 조건에서 $2^{a-b}=6$.
    steps:
    - id: 1a
      content: |
        $\mathrm{A}(2,8+a)$, $\mathrm{B}(2-2^{a-b},a)$ → $(2^{a-b})^2+8^2=100$ → $2^{a-b}=6$ → $a-b=\log_2 6$.
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
    hint_ladder:
    - 두 그래프의 점근선은 각각 무엇인가?
    - $g(x)=a$를 만족하는 $x$를 $a-b$로 나타내 보자.
    - $\overline{\mathrm{AB}}$를 $2^{a-b}$로 나타내고, $2^{a-b}>0$을 잊지 말자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2026 선행학습 영향평가 보고서」 p.96~97 문항 해설 및 풀이과정
    steps:
    - id: 1b-1
      content: |
        $f(x)=2^{x+1}+a$의 점근선은 직선 $l:y=a$, $g(x)=\log_2(-x+2)+b$의 점근선은 직선 $m:x=2$이다.
        곡선 $y=f(x)$와 직선 $m$의 교점은 $\mathrm{A}(2,\ 2^3+a)$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        곡선 $y=g(x)$와 직선 $l$의 교점: $\log_2(-x+2)+b=a$에서 $-x+2=2^{a-b}$이므로 $\mathrm{B}(2-2^{a-b},\ a)$이다.
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $\overline{\mathrm{AB}}=\sqrt{(2^{a-b})^2+2^6}=10$이므로 $(2^{a-b})^2=36$, $2^{a-b}=6$ 또는 $-6$.
        $2^{a-b}>0$이므로 $2^{a-b}=6$, 따라서 $a-b=\log_2 6\ (=1+\log_2 3)$이다.
      criteria:
      - 1.A1
