stem: |
  두 상수 $a,\ b$에 대하여 두 함수 $f(x)=2^{x+1}+a,\ g(x)=\log_2(-x+2)+b$의 그래프의 점근선을 각각 $l,\ m$이라 하고, 곡선 $y=f(x)$와 직선 $m$이 만나는 점을 $\mathrm{A}$, 곡선 $y=g(x)$와 직선 $l$이 만나는 점을 $\mathrm{B}$라 하자. $\overline{\mathrm{AB}}=10$일 때, $a-b$의 값을 구하시오.
