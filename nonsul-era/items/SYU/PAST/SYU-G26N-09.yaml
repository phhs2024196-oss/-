subparts:
- id: '1'
  stem: 위 문제의 답을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: \dfrac{3\sqrt{5}}{2}
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 코사인법칙으로 $\cos A$, 사인법칙으로 $R$, 넓이 $=\dfrac12 r(a+b+c)$로 $r$.
    steps:
    - id: 1a
      content: |
        $\cos A=-\dfrac27$, $\sin A=\dfrac{3\sqrt5}{7}$, $R=\dfrac{21\sqrt5}{10}$, 넓이 $6\sqrt5=10r$에서 $r=\dfrac{3\sqrt5}{5}$, $R-r=\dfrac{3\sqrt5}{2}$.
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
    hint_ladder:
    - 한 각의 코사인을 코사인법칙으로 구해 보자.
    - 사인법칙으로 $R$를 구하자.
    - 넓이를 $\dfrac12 bc\sin A$와 $\dfrac12 r(a+b+c)$ 두 가지로 나타내자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2026 선행학습 영향평가 보고서」 p.98~99 문항 해설 및 풀이과정
    steps:
    - id: 1b-1
      content: |
        $\cos A=\dfrac{b^2+c^2-a^2}{2bc}=\dfrac{7^2+4^2-9^2}{2\times7\times4}=-\dfrac27$.
        $0^\circ<A<180^\circ$일 때 $\sin A>0$이므로 $\sin A=\sqrt{1-\cos^2A}=\sqrt{1-\dfrac{4}{49}}=\dfrac{3\sqrt5}{7}$.
        사인법칙에서 $2R=\dfrac{a}{\sin A}=\dfrac{9}{\frac{3\sqrt5}{7}}=\dfrac{21\sqrt5}{5}$, 따라서 $R=\dfrac{21\sqrt5}{10}$.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        삼각형 $\mathrm{ABC}$의 넓이 $=\dfrac12 bc\sin A=\dfrac12\times4\times7\times\dfrac{3\sqrt5}{7}=6\sqrt5$.
        내접원의 반지름의 길이를 $r$라 하면 $6\sqrt5=\dfrac12 r(a+b+c)=\dfrac12 r\times20=10r$이므로 $r=\dfrac{3\sqrt5}{5}$.
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $R-r=\dfrac{21\sqrt5}{10}-\dfrac{6\sqrt5}{10}=\dfrac{3\sqrt5}{2}$.
      criteria:
      - 1.A1
