stimuli: []
stem: |
  $\overline{\mathrm{AB}}=7,\ \overline{\mathrm{BC}}=9,\ \overline{\mathrm{CA}}=4$인 삼각형 $\mathrm{ABC}$의 외접원의 반지름의 길이를 $R$, 내접원의 반지름의 길이를 $r$라 할 때, $R-r$의 값을 구하시오.
