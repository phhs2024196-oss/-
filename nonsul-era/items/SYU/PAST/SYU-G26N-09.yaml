  concepts:
  - 코사인법칙
  - 사인법칙 $\dfrac{a}{\sin A}=2R$
  - 삼각형의 넓이 $\dfrac12 bc\sin A$
  - 넓이 $=\dfrac12 r(a+b+c)$
  tools:
