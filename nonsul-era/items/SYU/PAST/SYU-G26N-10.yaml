  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $S_n=an^2$이고 $\dfrac{a_{k+1}}{S_kS_{k+1}}=\dfrac1{S_k}-\dfrac1{S_{k+1}}$로 망원합.
    steps:
    - id: 1a
      content: |
        $S_n=an^2$, $a=\dfrac72$; $\sum_{k=1}^{9}\left(\dfrac1{S_k}-\dfrac1{S_{k+1}}\right)=\dfrac1{S_1}-\dfrac1{S_{10}}=\dfrac27-\dfrac1{350}=\dfrac{99}{350}$.
      criteria:
      - 1.M1
      - 1.A1
    hint_ladder:
    - $a_2=3a_1$에서 공차를 첫째항으로 나타내 보자.
    - $S_n$을 구하면 첫 조건에서 첫째항이 정해진다.
    - $a_{k+1}=S_{k+1}-S_k$를 이용하면 분수를 둘로 쪼갤 수 있다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2026 선행학습 영향평가 보고서」 p.100~101 문항 해설 및 풀이과정
    steps:
    - id: 1b-1
      content: |
        등차수열 $\{a_n\}$의 첫째항을 $a$, 공차를 $d$라 하면 $a_n=a+(n-1)d$이다.
        $d=a_2-a_1=3a_1-a_1=2a_1$이므로 $a_n=a+(n-1)2a=a(2n-1)$.
        $S_n=\dfrac{n(a+l)}{2}=\dfrac{n(a+2an-a)}{2}=an^2$.
        $\displaystyle\sum_{k=1}^{3}\frac1{S_k}=\frac1a+\frac1{4a}+\frac1{9a}=\frac{49}{36a}=\frac7{18}$이므로 $a=\dfrac72$, 대입하면 $a_n=7n-\dfrac72$.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $\displaystyle\sum_{k=1}^{9}\frac{a_{k+1}}{S_kS_{k+1}}=\sum_{k=1}^{9}\frac{S_{k+1}-S_k}{S_kS_{k+1}}=\sum_{k=1}^{9}\left(\frac1{S_k}-\frac1{S_{k+1}}\right)=\frac1{S_1}-\frac1{S_{10}}$.
        $S_n=\dfrac72n^2$이므로 $S_1=\dfrac72$, $S_{10}=350$. 따라서 $\dfrac1{S_1}-\dfrac1{S_{10}}=\dfrac27-\dfrac1{350}=\dfrac{99}{350}$.
      criteria:
      - 1.A1
