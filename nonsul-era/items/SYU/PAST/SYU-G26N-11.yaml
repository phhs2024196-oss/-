  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $h$는 기함수이므로 $h'$는 우함수, $x^5h'$·$x^3h'$는 기함수여서 적분이 $0$이고 $3\int_{-7}^7h'=6h(7)$만 남는다.
    steps:
    - id: 1a
      content: |
        $h$ 기함수 → $h'$ 우함수 → $\int_{-7}^7(2x^5+x^3)h'=0$, $3\int_{-7}^7h'=6h(7)=42$ → $h(7)=7$, $h(-7)=-7$.
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
    hint_ladder:
    - $h(-x)$를 계산해 보자.
    - 기함수를 미분하면 어떤 함수가 되는가?
    - $2x^5h'(x)$, $x^3h'(x)$는 기함수인가 우함수인가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2026 선행학습 영향평가 보고서」 p.102~103 문항 해설 및 풀이과정
    steps:
    - id: 1b-1
      content: |
        $f(x)=-f(-x)$, $g(x)=g(-x)$이므로 $h(-x)=f(-x)g(-x)=-f(x)g(x)=-h(x)$ … ①
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        따라서 다항함수 $h(x)$는 홀수 차수의 항만 있으므로 $h'(x)$는 짝수 차수의 항 또는 상수항만 있게 된다.
        $\displaystyle\int_{-7}^{7}(2x^5+x^3+3)h'(x)dx=\int_{-7}^{7}\{2x^5h'(x)+x^3h'(x)+3h'(x)\}dx$에서
        $2x^5h'(x)$, $x^3h'(x)$는 홀수 차수의 항만 존재하므로 $[-7,7]$에서의 정적분이 $0$이다.
        $\displaystyle\int_{-7}^{7}\{2x^5h'(x)+x^3h'(x)+3h'(x)\}dx=3\int_{-7}^{7}h'(x)dx=3\times2\int_{0}^{7}h'(x)dx$
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $=6\big[h(x)\big]_0^7=6\{h(7)-h(0)\}=42$이므로 $h(7)-h(0)=7$ … ②
        한편 ①에서 양변에 $x=0$을 대입하면 $h(0)=-h(0)$이므로 $h(0)=0$.
        ②에 대입하면 $h(7)=7$, 따라서 $h(-7)=-h(7)=-7$.
      criteria:
      - 1.A1
