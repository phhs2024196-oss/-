stem: |
  $\displaystyle\lim_{x\to1}\frac{x^{n+2}-(n+2)x+n+1}{(x^{n+1}-1)^2}=\frac{5}{8}$를 만족시키는 자연수 $n$의 값을 구하시오.
  (단, $1$보다 큰 자연수 $t$에 대해 $x^t-1=(x-1)(x^{t-1}+x^{t-2}+x^{t-3}+\cdots+1)$이고, 로피탈 정리는 사용할 수 없다.)
