  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 분자 $=(x-1)\{(x^{n+1}-1)+(x^n-1)+\cdots+(x-1)\}$로 한 번 더 $(x-1)$을 묶어 내 극한 $\dfrac{n+2}{2(n+1)}$.
    steps:
    - id: 1a
      content: |
        극한 $=\dfrac{(n+1)+n+\cdots+1}{(n+1)^2}=\dfrac{n+2}{2(n+1)}=\dfrac58$ → $n=3$.
      criteria:
      - 1.M1
      - 1.A1
    hint_ladder:
    - 분모를 $(x-1)^2(\cdots)^2$로 인수분해하자.
    - 분자를 $x(x^{n+1}-1)-(n+1)(x-1)$로 정리해 보자.
    - $\dfrac{x^k-1}{x-1}$의 $x\to1$ 극한은 $k$이다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2026 선행학습 영향평가 보고서」 p.104~105 문항 해설 및 풀이과정
    steps:
    - id: 1b-1
      content: |
        분모·분자를 정리한다. $x^{n+1}-1=(x-1)(x^n+x^{n-1}+x^{n-2}+\cdots+1)$이므로
        $(x^{n+1}-1)^2=(x-1)^2(x^n+x^{n-1}+x^{n-2}+\cdots+1)^2$ … ①
        $x^{n+2}-(n+2)x+n+1=x^{n+2}-x-(n+1)(x-1)=x(x^{n+1}-1)-(n+1)(x-1)$
        $=x(x-1)(x^n+x^{n-1}+\cdots+1)-(n+1)(x-1)=(x-1)(x^{n+1}+x^n+x^{n-1}+\cdots+x-n-1)$ … ②
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        ①, ②에서
        $\displaystyle\lim_{x\to1}\frac{x^{n+2}-(n+2)x+n+1}{(x^{n+1}-1)^2}=\lim_{x\to1}\frac{\dfrac{x^{n+1}+x^n+\cdots+x-n-1}{x-1}}{(x^n+x^{n-1}+\cdots+1)^2}$
        $\displaystyle=\lim_{x\to1}\frac{\dfrac{x^{n+1}-1}{x-1}+\dfrac{x^n-1}{x-1}+\cdots+\dfrac{x-1}{x-1}}{(x^n+x^{n-1}+\cdots+1)^2}=\frac{(n+1)+n+(n-1)+\cdots+1}{(n+1)^2}$ … ③
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        ③의 분자는 $\displaystyle\sum_{k=1}^{n+1}k=\frac{(n+1)(n+2)}{2}$이므로 $\dfrac{(n+1)(n+2)}{2(n+1)^2}=\dfrac{n+2}{2(n+1)}=\dfrac58$.
        $8n+16=10n+10$에서 $n=3$.
      criteria:
      - 1.A1
