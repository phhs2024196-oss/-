  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 두 접선이 같으려면 기울기가 같아 $x_1=-x_2$($x_1\ne x_2$)이고, $y$절편 비교로 $a=4x_2^3$.
    steps:
    - id: 1a
      content: |
        기울기 같음 → $x_1=-x_2$, $y$절편 같음 → $a=4x_2^3$, $|2x_2|=5$, $a>0$ → $x_2=\dfrac52$, $a=\dfrac{125}2$.
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
    hint_ladder:
    - 두 접점에서의 접선의 방정식을 각각 쓰자.
    - 두 직선이 같으려면 기울기와 $y$절편이 같아야 한다.
    - $|x_2-x_1|=5$에서 $x_1\ne x_2$이다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2026 선행학습 영향평가 보고서」 p.106~107 문항 해설 및 풀이과정
    steps:
    - id: 1b-1
      content: |
        $f(x)=x^3-5x$, $g(x)=x^3-5x+a$라 하면 $f'(x)=3x^2-5$, $g'(x)=3x^2-5$.
        곡선 $y=f(x)$ 위의 점 $(x_1,\ x_1^3-5x_1)$에서의 접선: $y=(3x_1^2-5)(x-x_1)+x_1^3-5x_1$ … ①
        곡선 $y=g(x)$ 위의 점 $(x_2,\ x_2^3-5x_2+a)$에서의 접선: $y=(3x_2^2-5)(x-x_2)+x_2^3-5x_2+a$ … ②
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        ①과 ②는 같은 직선이므로 $3x_1^2-5=3x_2^2-5$ … ③, $-2x_1^3=-2x_2^3+a$ … ④
        ③에서 $x_1^2-x_2^2=0$, $(x_1+x_2)(x_1-x_2)=0$. 그런데 $|x_2-x_1|=5$이므로 $x_1\ne x_2$, 따라서 $x_1=-x_2$.
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        이를 ④에 대입하면 $a=4x_2^3$ … ⑤
        $|x_2-x_1|=5$이므로 $|2x_2|=5$, $x_2=-\dfrac52$ 또는 $\dfrac52$.
      criteria:
      - 1.M2
    - id: 1b-4
      content: |
        ⑤에 대입하면 $x_2=-\dfrac52$일 때 $a=-\dfrac{125}{2}$, $x_2=\dfrac52$일 때 $a=\dfrac{125}{2}$. 그런데 $a>0$이므로 $a=\dfrac{125}{2}$.
      criteria:
      - 1.A1
