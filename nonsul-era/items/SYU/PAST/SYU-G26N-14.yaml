key_idea: 원주각 $\angle\mathrm{ACB}$는 중심각 $\angle\mathrm{AOB}$의 절반이므로 $\sin\theta=\dfrac{y_{\mathrm A}}{t}$, $y_{\mathrm A}^2=ax_{\mathrm A}$.
stuck: $\theta(t)$가 $x$축과 $\mathrm{OA}$가 이루는 각과 같음을 원주각으로 파악하는 것
