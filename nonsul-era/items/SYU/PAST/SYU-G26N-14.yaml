- '[사람확인] 공식 해설 중간식 오식: $k^2=a\times\frac{-1+\sqrt{a^2+4t^2}}{2}$ 및 $\sin^2\theta=\frac{-a+a\sqrt{a^2+4t^2}}{2t^2}$ — 바른 식은 $k^2=\frac{a(-a+\sqrt{a^2+4t^2})}{2}$, $\sin^2\theta=\frac{-a^2+a\sqrt{a^2+4t^2}}{2t^2}$ (최종 답 $\frac3{10}$은 맞음)'
stimuli: []
stem: |
  그림과 같이 양수 $t$에 대하여 원 $x^2+y^2=t^2$이 두 곡선 $y=\sqrt{ax},\ y=-\sqrt{ax}$와 만나는 점을 각각 $\mathrm{A},\ \mathrm{B}$라 하고, 원 $x^2+y^2=t^2$이 $x$축과 만나는 점 중 $x$좌표가 음수인 점을 $\mathrm{C}$라 하자. $\angle\mathrm{ACB}=\theta(t)$라 할 때, $\displaystyle\lim_{t\to\infty}\{t\times\sin^2\theta(t)\}=\frac{3}{10}$을 만족시킨다. 상수 $a$의 값을 구하시오. (단, $0<\theta(t)<\dfrac{\pi}{2},\ a>0$)

  [그림: 좌표평면에 원점 $\mathrm{O}$를 중심으로 하는 원 $x^2+y^2=t^2$, 원점에서 오른쪽으로 열린 곡선 $y=\sqrt{ax}$(위쪽)와 $y=-\sqrt{ax}$(아래쪽)가 그려져 있다. 원과 $y=\sqrt{ax}$의 교점 $\mathrm{A}$(제1사분면), 원과 $y=-\sqrt{ax}$의 교점 $\mathrm{B}$(제4사분면), 원과 $x$축의 음의 부분의 교점 $\mathrm{C}$가 표시되고, 선분 $\mathrm{CA}$, $\mathrm{CB}$가 그려져 있다.] [판독확인: 문제지 쪽(p.108)에는 그림이 없고 해설 쪽(p.109) 첫머리에 그림이 실려 있음 — 문제지 원본에 포함된 그림으로 보고 옮김]
