  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 원주각 $\angle\mathrm{ACB}$는 중심각 $\angle\mathrm{AOB}$의 절반이므로 $\sin\theta=\dfrac{y_{\mathrm A}}{t}$, $y_{\mathrm A}^2=ax_{\mathrm A}$.
    steps:
    - id: 1a
      content: |
        $x_{\mathrm A}=\dfrac{-a+\sqrt{a^2+4t^2}}2$, $\sin^2\theta=\dfrac{ax_{\mathrm A}}{t^2}$, $t\sin^2\theta=\dfrac{a(\sqrt{a^2+4t^2}-a)}{2t}\to a$ → $a=\dfrac3{10}$.
      criteria:
      - 1.M1
      - 1.A1
    hint_ladder:
    - $\angle\mathrm{ACB}$는 원주각이다. 같은 호에 대한 중심각은?
    - 점 $\mathrm{A}$의 좌표를 $t$로 나타내자.
    - $t\to\infty$일 때 $\sqrt{a^2+4t^2}\approx2t$이다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2026 선행학습 영향평가 보고서」 p.108~109 문항 해설 및 풀이과정
    steps:
    - id: 1b-1
      content: |
        $y=\sqrt{ax}$를 $x^2+y^2=t^2$에 대입하면 $x^2+ax-t^2=0$, $x=\dfrac{-a\pm\sqrt{a^2+4t^2}}{2}$에서 $x>0$이므로 $x=\dfrac{-a+\sqrt{a^2+4t^2}}{2}$.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        점 $\mathrm{A}$의 $y$좌표를 $k\ (k\ge0)$라 할 때 $\sin\theta(t)=\dfrac{k}{t}$이다.
        (보충: $\mathrm{A}$와 $\mathrm{B}$는 $x$축에 대칭이므로 중심각 $\angle\mathrm{AOB}$는 $\mathrm{OA}$가 $x$축과 이루는 각의 $2$배이고, 원주각 $\angle\mathrm{ACB}$는 그 절반이므로 $\theta(t)$는 $\mathrm{OA}$가 $x$축의 양의 방향과 이루는 각과 같다.)
        $k^2=a\times\dfrac{-a+\sqrt{a^2+4t^2}}{2}$, $\sin^2\theta(t)=\dfrac{k^2}{t^2}=\dfrac{-a^2+a\sqrt{a^2+4t^2}}{2t^2}$
        (공식 해설에는 $-1+\sqrt{a^2+4t^2}$, $-a+a\sqrt{a^2+4t^2}$로 인쇄되어 있으나 오식이다.)
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        $\displaystyle\lim_{t\to\infty}\{t\times\sin^2\theta(t)\}=\lim_{t\to\infty}\left\{t\cdot\frac1{t^2}\cdot a\times\frac{-a+\sqrt{a^2+4t^2}}{2}\right\}=a$
        (보충: $\dfrac{\sqrt{a^2+4t^2}-a}{2t}=\dfrac{\sqrt{\frac{a^2}{t^2}+4}-\frac at}{2}\to1$)
        따라서 $a=\dfrac3{10}$.
      criteria:
      - 1.A1
