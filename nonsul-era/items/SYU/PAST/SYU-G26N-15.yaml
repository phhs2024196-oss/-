stimuli: []
stem: |
  최고차항의 계수가 $1$이고 $f(0)=0$인 삼차함수 $f(x)$와 최고차항의 계수가 $1$이고 $g(\alpha)=0\ (\alpha<0)$인 이차함수 $g(x)$가 다음 조건을 만족시킬 때, $\alpha$의 값을 구하시오.

  (가) 함수 $|f(x)|$는 $x=\alpha$에서만 미분가능하지 않다.
  (나) 모든 실수 $x$에 대하여 $\displaystyle\int_{\alpha}^{x}f(t)g(t)dt\ge0$이다.
  (다) 다항함수 $h(x)$가 모든 실수 $x$에 대하여 $xh(x)=f(x)g(x)$일 때, 함수 $h(x)$의 극솟값은 $-432$이다.
