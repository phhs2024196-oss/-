  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: (가)에서 $f(x)=(x-\alpha)x^2$, (나)에서 $g(x)\ge0$이므로 $g(x)=(x-\alpha)^2$, $h(x)=(x-\alpha)^3x$의 극솟값 $h(\alpha/4)=-432$.
    steps:
    - id: 1a
      content: |
        $f=(x-\alpha)x^2$, $g=(x-\alpha)^2$, $h=(x-\alpha)^3x$, $h'=(x-\alpha)^2(4x-\alpha)$, $h(\alpha/4)=-\dfrac{27}{256}\alpha^4=-432$ → $\alpha=-8$.
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
    hint_ladder:
    - $|f(x)|$가 미분가능하지 않은 점은 $f$의 부호가 바뀌는 근이다. $0$은 어떤 근이어야 하는가?
    - (나)의 적분이 $x=\alpha$의 좌우에서 모두 $0$ 이상이려면 $f(x)g(x)$의 부호는?
    - $h(x)=(x-\alpha)^3x$의 극소를 증감표로 찾자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2026 선행학습 영향평가 보고서」 p.110~112 문항 해설 및 풀이과정
    steps:
    - id: 1b-1
      content: |
        함수 $|f(x)|$는 $x=\alpha\ (\alpha<0)$에서 미분가능하지 않고 $f(0)=0$이므로, $y=f(x)$의 그래프는 $x=\alpha$에서 $x$축을 뚫고 지나가고 $x=0$에서 $x$축에 접하는 개형이다.
        (보충: $x=0$이 단순근이면 $|f(x)|$가 $x=0$에서도 미분가능하지 않으므로 $0$은 중근이다.)
        즉, $f(x)=(x-\alpha)x^2$.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $x<\alpha$인 모든 실수 $x$에 대하여 $\displaystyle\int_\alpha^x f(t)g(t)dt\ge0$이 성립하려면 어떤 열린구간 $(\beta,\alpha)$에 속하는 모든 $x$에 대하여 $f(x)g(x)\le0$이어야 한다.
        $x\ge\alpha$인 모든 실수 $x$에 대하여 $\displaystyle\int_\alpha^x f(t)g(t)dt\ge0$이 성립하려면 어떤 열린구간 $(\alpha,\gamma)$에 속하는 모든 $x$에 대하여 $f(x)g(x)\ge0$이어야 한다.
        그런데 $x<\alpha$에서 $f(x)<0$, $x\ge\alpha$에서 $f(x)\ge0$이므로 모든 실수 $x$에 대하여 $g(x)\ge0$이어야 한다.
        이차함수 $g(x)$는 최고차항의 계수가 $1$이고 $g(\alpha)=0$이므로 $g(x)=(x-\alpha)^2$.
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        조건 (다)에서 $xh(x)=f(x)g(x)=(x-\alpha)^3x^2$이고 $h(x)$는 다항함수이므로 $h(x)=(x-\alpha)^3x$.
        $h'(x)=3(x-\alpha)^2x+(x-\alpha)^3=(x-\alpha)^2(4x-\alpha)$, $h'(x)=0$에서 $x=\alpha$ 또는 $x=\dfrac\alpha4$이고, $\alpha<0$이므로 $\alpha<\dfrac\alpha4$.
        증감표: $x<\alpha$에서 $h'<0$, $\alpha<x<\dfrac\alpha4$에서 $h'<0$, $x>\dfrac\alpha4$에서 $h'>0$이므로 $h$는 $x=\dfrac\alpha4$에서 극소이다.
        $h\left(\dfrac\alpha4\right)=\left(\dfrac\alpha4-\alpha\right)^3\dfrac\alpha4=-\left(\dfrac34\right)^3\cdot\dfrac{\alpha^4}{4}=-432$, $\alpha<0$이므로 $\alpha=-8$.
      criteria:
      - 1.A1
