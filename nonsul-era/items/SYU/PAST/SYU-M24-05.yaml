      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: $3^{m-1}<300$을 만족하는 $m=1,\cdots,6$을 찾고 합 $21$을 적었다.
      depends_on: [1.M1, 1.A1]
      steps: [1b-3]
