    wrong_work: '$a_n=3^n$으로 두어 $3^m<300$에서 $m=1,\cdots,5$, 합 $15$'
    detect_cue: 첫째항 $a_1$을 $3$으로 쓰거나 일반항 지수가 $n$이다
    feedback: 합 조건으로 첫째항을 먼저 정한 뒤 일반항 $a_n=a_1r^{n-1}$에 넣으세요.
    remedy: [RL-1]
  - id: MC-ALG-4402
    outcome_code: '72'
    wrong_work: '$a_{n+1}^2-6a_na_{n+1}+9a_n^2=0$을 근의 공식으로 풀다가 $a_{n+1}=\pm3a_n$ 등으로 두 경우를 만듦'
    detect_cue: 공비 $-3$ 경우가 등장하거나 완전제곱 인수분해가 없다
    feedback: 이 식은 $(a_{n+1}-3a_n)^2$이라 근이 하나뿐입니다. 판별식이 0인지 먼저 보세요.
    remedy: [RL-2]

