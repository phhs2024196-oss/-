subparts:
- id: '1'
  stem: |
    $a_m<300$인 모든 자연수 $m$의 합을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 21
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 관계식을 완전제곱으로 묶으면 공비 $3$인 등비수열이고, 합 조건에서 $a_1=1$이다.
    steps:
    - {id: 1a, content: '$(a_{n+1}-3a_n)^2=0$, $a_n=3^{n-1}$, $3^{m-1}<300\iff m\le6$, 합 $21$', criteria: [1.M1, 1.A1, 1.A2]}
    hint_ladder:
    - 주어진 식을 한쪽으로 모아 보자.
    - $a_{n+1}^2-6a_na_{n+1}+9a_n^2$은 어떤 식의 제곱인가?
    - 공비를 알면 합 조건에서 첫째항이 정해진다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2024학년도 삼육대 모의논술고사 정답」 p.12 채점기준 예시답안
    steps:
    - id: 1b-1
      content: |
        $a_{n+1}^2+9a_n^2=6a_na_{n+1}$에서 $(a_{n+1}-3a_n)^2=0$, 즉 $a_{n+1}=3a_n$이다.
        즉, 수열 $\{a_n\}$은 공비가 $3$인 등비수열이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $\displaystyle\sum_{k=1}^{5}a_k=\dfrac{a_1(3^5-1)}{3-1}=\dfrac{a_1(242)}{2}=121a_1=121$
        $\therefore a_1=1$이고 수열 $a_n=3^{n-1}$이다.
      criteria: [1.A1]
    - id: 1b-3
      content: |
        $a_m<300$에서 $3^{m-1}<300$의 조건에 맞는 자연수 $m$은 $1,2,3,4,5,6$이고($3^5=243<300<729=3^6$),
        모든 $m$의 값의 합은 $1+2+3+4+5+6=21$이다.
      criteria: [1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: $(a_{n+1}-3a_n)^2=0$으로 변형해 $a_{n+1}=3a_n$, 공비 $3$인 등비수열임을 적었다.
