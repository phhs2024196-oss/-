  수열의 귀납적정의를 이용한 수열의 조건 구하기
key_idea: |
  $a_{n+1}^2+9a_n^2=6a_na_{n+1}$을 $(a_{n+1}-3a_n)^2=0$으로 묶어 공비 $3$인 등비수열임을 얻는다.
