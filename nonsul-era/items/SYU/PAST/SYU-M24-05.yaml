stem: |
  수열 $\{a_n\}$은 모든 자연수 $n$에 대하여 $a_{n+1}^2+9a_n^2=6a_na_{n+1}$을 만족시킨다. $\displaystyle\sum_{k=1}^{5}a_k=121$일 때, $a_m<300$인 모든 자연수 $m$의 합의 값은?

elements:
  materials:
  - 이차 관계식 $a_{n+1}^2+9a_n^2=6a_na_{n+1}$로 정의된 수열
  - 첫째항부터 제5항까지의 합 $121$
  concepts:
  - 수열의 귀납적 정의
  - 등비수열의 일반항과 합
  tools:
  - 완전제곱식으로 인수분해
  - 등비수열의 합 공식
  - 지수 부등식의 정수해 나열
  conditions:
  - $(a_{n+1}-3a_n)^2=0$이므로 모든 $n$에서 $a_{n+1}=3a_n$
  - $\sum_{k=1}^5a_k=121a_1=121$에서 $a_1=1$
  - $3^{m-1}<300$인 자연수 $m$을 모두 찾는다
  stimuli_used: []
  subpart_links: 단일 논제

