subparts:
- id: '1'
  stem: |
    $f(1)$의 값을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '5/2'
    equivalents: ['$\dfrac{5}{2}$', '2.5']
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: (a)로 $f(x)=\frac12x^3+x^2+\frac a2x+\frac b2$ 꼴을 정하고 (b)로 $b=0$, $a=2$를 정한다.
    steps:
    - {id: 1a, content: '$2f(x)-x^3=2x^2+ax+b$, $b=0$, $a=2$, $f(1)=\frac52$', criteria: [1.M1, 1.M2, 1.A1, 1.A2]}
    hint_ladder:
    - 분모가 $2x^2$인데 극한값이 $1$이면 분자는 몇 차식이어야 하는가?
    - (b)에서 분모가 $0$으로 가면 분자는 어떻게 되어야 하는가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2024학년도 삼육대 모의논술고사 정답」 p.13 채점기준 예시답안
    steps:
    - id: 1b-1
      content: |
        조건 (a)에서 $\displaystyle\lim_{x\to\infty}\dfrac{2f(x)-x^3}{2x^2}=1$을 만족시키기 위해 $2f(x)-x^3$은 최고차항의 계수가 $2$인 이차함수이므로
        $2f(x)=x^3+2x^2+ax+b$, $f(x)=\dfrac12x^3+x^2+\dfrac a2x+\dfrac b2$
      criteria: [1.M1]
    - id: 1b-2
      content: |
        조건 (b)에서 $\displaystyle\lim_{x\to0}\dfrac{f(x)}{x}=1$을 만족하기 위해 $\displaystyle\lim_{x\to0}f(x)=0$이므로
        $\displaystyle\lim_{x\to0}\left(\dfrac12x^3+x^2+\dfrac a2x+\dfrac b2\right)=0$, $\therefore\dfrac b2=0$, $b=0$ $\cdots$ (i)
      criteria: [1.M2]
    - id: 1b-3
      content: |
        $\displaystyle\lim_{x\to0}\dfrac{f(x)}{x}=\lim_{x\to0}\dfrac{\frac12x^3+x^2+\frac a2x}{x}=\lim_{x\to0}\left(\dfrac12x^2+x+\dfrac a2\right)=1$이므로 $\therefore\dfrac a2=1$, $a=2$ $\cdots$ (ii)
      criteria: [1.A1]
    - id: 1b-4
      content: |
        (i), (ii)에서 $f(x)=\dfrac12x^3+x^2+x$이므로 $f(1)=\dfrac12+1+1=\dfrac52$
      criteria: [1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: (a)에서 $2f(x)-x^3$이 최고차항 계수 $2$인 이차식임을 밝혀 $f(x)=\frac12x^3+x^2+\frac a2x+\frac b2$ 꼴로 적었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: (b)에서 $\lim_{x\to0}f(x)=0$임을 근거로 $b=0$을 얻었다.
      depends_on: []
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: 약분한 극한 $\frac a2=1$에서 $a=2$를 얻었다.
      depends_on: [1.M1, 1.M2]
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: $f(x)=\frac12x^3+x^2+x$와 $f(1)=\frac52$를 적었다.
      depends_on: [1.M1, 1.A1]
      steps: [1b-4]
