    wrong_work: '$2f(x)-x^3$의 이차항 계수를 $1$로 두어 $f(x)=\frac12x^3+\frac12x^2+x$, $f(1)=2$'
    detect_cue: 분모의 계수 $2$를 반영하지 않고 이차항 계수를 극한값 $1$과 같게 둠
    feedback: $\infty/\infty$ 꼴 극한값은 (분자 최고차항 계수)÷(분모 최고차항 계수)입니다. 분모의 $2$를 곱하세요.
    remedy: [RL-1]
  - id: MC-CAL-4402
    outcome_code: '72'
    wrong_work: '(b)를 $f(0)=1$로 읽어 $b=2$로 둠'
    detect_cue: (b)를 함숫값 조건으로 바꿔 쓰고 $0/0$ 꼴 언급이 없다
