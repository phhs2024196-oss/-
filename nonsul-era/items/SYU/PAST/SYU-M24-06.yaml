stem: |
  다항함수 $f(x)$가 다음 두 조건을 만족할 때, $\displaystyle\lim_{x\to\infty}\dfrac{2f(x)-x^3}{2x^2}=1$ $\cdots$ (a), $\displaystyle\lim_{x\to0}\dfrac{f(x)}{x}=1$ $\cdots$ (b)
  $f(1)$의 값을 구하시오.

elements:
  materials:
  - 두 극한 조건을 만족하는 다항함수 $f(x)$
  concepts:
  - 함수의 극한의 성질
  - 다항함수의 차수와 최고차항
  tools:
  - $\infty/\infty$ 꼴에서 최고차항 비교
  - $0/0$ 꼴에서 분자의 극한이 $0$
  conditions:
  - (a)에서 $2f(x)-x^3=2x^2+ax+b$
  - (b)에서 $f(0)=0$이고 $\lim_{x\to0}f(x)/x$가 일차항 계수
  stimuli_used: []
  subpart_links: 단일 논제

