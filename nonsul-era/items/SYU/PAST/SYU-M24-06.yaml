intent: |
  함수의 극한 성질을 이용한 미정계수 찾기
key_idea: |
  $x\to\infty$ 조건으로 $2f(x)-x^3$이 최고차항 계수 $2$인 이차식임을, $x\to0$ 조건으로 상수항 $0$과 일차항 계수를 정한다.
stuck: |
  $\infty/\infty$ 꼴 극한값에서 분자의 차수와 최고차항 계수를 읽어 내는 것
