key_idea: |
  $f(x)=2a-\sqrt3\tan x$는 $\left(-\frac\pi2,\frac\pi2\right)$에서 감소하므로 최댓값은 왼쪽 끝, 최솟값은 오른쪽 끝에서 얻는다.
