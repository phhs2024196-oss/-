stem: |
  함수 $f(x)=2a-\sqrt3\tan x$가 닫힌구간 $\left[-\dfrac{\pi}{6},b\right]$에서 최댓값 $11$, 최솟값 $7$을 가질 때, $ab$의 값은? ($a,b$ 는 상수이다.)

