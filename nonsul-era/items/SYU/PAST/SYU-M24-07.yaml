subparts:
- id: '1'
  stem: |
    $ab$의 값을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '5*pi/3'
    equivalents: ['$\dfrac{5\pi}{3}$']
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 감소함수이므로 $f\!\left(-\frac\pi6\right)=11$, $f(b)=7$을 세운다.
    steps:
    - {id: 1a, content: '$2a+1=11\Rightarrow a=5$, $\tan b=\sqrt3\Rightarrow b=\frac\pi3$, $ab=\frac{5\pi}3$', criteria: [1.M1, 1.R1, 1.A1]}
    hint_ladder:
    - $-\sqrt3\tan x$는 증가하는가, 감소하는가?
    - 감소함수의 최댓값·최솟값은 구간의 어디에서 생기는가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2024학년도 삼육대 모의논술고사 정답」 p.14 채점기준 예시답안
    steps:
    - id: 1b-1
      content: |
        $f(x)$의 그래프의 주기는 $\pi$로 $\left[-\dfrac\pi6,b\right]$ 범위는 $\left[-\dfrac\pi2,\dfrac\pi2\right]$ 구간에 속하고,
        $f(x)$의 그래프는 감소함수이면서 $-\sqrt3\tan x$ 그래프를 $y$축 방향으로 $2a$만큼 평행이동한 그래프이다.
        (보충: $f$가 정의되려면 구간이 $x=\frac\pi2$를 넘을 수 없으므로 $-\frac\pi6<b<\frac\pi2$.)
      criteria: [1.M1]
    - id: 1b-2
      content: |
        따라서 최댓값은 $f\!\left(-\dfrac\pi6\right)$이며, 최솟값은 $f(b)$이다.
      criteria: [1.R1]
    - id: 1b-3
      content: |
        $f\!\left(-\dfrac\pi6\right)=2a-\sqrt3\tan\left(-\dfrac\pi6\right)=2a+1=11$ $\therefore a=5$ $\cdots$ (i)
        $f(b)=10-\sqrt3\tan b=7$, $\tan b=\sqrt3$ $\therefore b=\dfrac\pi3$ $\cdots$ (ii)
        (i), (ii)에서 $ab=\dfrac{5\pi}{3}$
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: 주기 $\pi$와 구간이 $\left[-\frac\pi2,\frac\pi2\right]$ 안에 있음, $f$가 감소함수(평행이동한 그래프)임을 적었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.R1
      mark_type: R
      points: 2
      evidence: 감소성으로부터 최댓값이 $f\!\left(-\frac\pi6\right)$, 최솟값이 $f(b)$임을 밝혔다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: $a=5$, $b=\frac\pi3$을 구하고 $ab=\frac{5\pi}3$을 적었다.
      depends_on: [1.R1]
      steps: [1b-3]
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-ALG-4403}
  - {code: '72', misconception: MC-ALG-4404}
  misconceptions:
  - id: MC-ALG-4403
    outcome_code: '71'
    wrong_work: '$\tan$이 증가하므로 $f$도 증가한다고 보아 $f\!\left(-\frac\pi6\right)=7$, $f(b)=11$로 둠($a=3$, $\tan b=-\frac{5}{\sqrt3}$로 모순)'
    detect_cue: 최솟값을 왼쪽 끝점에 대응시킴
    feedback: 계수 $-\sqrt3$이 음수이므로 $f$는 감소합니다. 부호를 보고 최대·최소 위치를 정하세요.
    remedy: [RL-1]
  - id: MC-ALG-4404
    outcome_code: '72'
    wrong_work: '$\tan\left(-\frac\pi6\right)=\frac1{\sqrt3}$으로 써서 $2a-1=11$, $a=6$, $ab=2\pi$'
    detect_cue: $a=6$ 또는 $2a-1$이 보인다
    feedback: 탄젠트는 홀함수입니다. $\tan\left(-\frac\pi6\right)=-\frac{1}{\sqrt3}$입니다.
    remedy: [RL-2]

