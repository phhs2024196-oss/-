  - 닫힌구간 $\left[-\frac\pi6,b\right]$
  concepts:
  - 탄젠트함수의 그래프와 주기
  - 삼각함수의 최대·최소
  tools:
  - 감소함수의 최대·최소는 구간 끝점
  - 특수각의 탄젠트값
  conditions:
  - 구간이 $\left(-\frac\pi2,\frac\pi2\right)$ 안에 있어야 $f$가 정의·연속
  - 최댓값 $f\!\left(-\frac\pi6\right)=11$, 최솟값 $f(b)=7$
