subparts:
- id: '1'
  stem: |
    조건을 만족하는 모든 정수 $a$의 값의 합을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 3
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 접점 $x$좌표 방정식에서 $m=0$을 빼낸 이차식의 판별식 $<0$.
    steps:
    - {id: 1a, content: '$-m(2m^2-3(a+1)m+6a)=0$, $9(a+1)^2-48a<0\iff\frac13<a<3$, $a=1,2$, 합 $3$', criteria: [1.M1, 1.M2, 1.R1, 1.A1]}
    hint_ladder:
    - 접점을 $(m,m^3-3m^2-3)$으로 두고 접선이 $(a,-3)$을 지나는 식을 세워 보자.
    - 그 식에서 $m=0$은 언제나 근이다. 남은 이차식은 어떠해야 하는가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2024학년도 삼육대 모의논술고사 정답」 p.15 채점기준 예시답안
    steps:
    - id: 1b-1
      content: |
        접점의 좌표를 $(m,m^3-3m^2-3)$이라 두고, 접선의 기울기를 $3m^2-6m$이라 할 때, 접선의 방정식은
        $y-(m^3-3m^2-3)=(3m^2-6m)(x-m)$
      criteria: [1.M1]
    - id: 1b-2
      content: |
        이 접선이 $(a,-3)$을 지나므로 $-3=(3m^2-6m)(a-m)+(m^3-3m^2-3)$,
        $-2m^3+3(a+1)m^2-6am=0$, $-m(2m^2-3(a+1)m+6a)=0$에서 접선이 한 개만 존재하기 위해서는 해가 한 개만 존재해야 한다.
      criteria: [1.M2]
    - id: 1b-3
      content: |
        (i) $m=0$인 경우 $a$의 값이 존재하지 않음
        (ii) 따라서 $2m^2-3(a+1)m+6a=0$의 해는 존재하지 않아야 한다.
        (보충: $m=0$은 모든 $a$에 대해 근이고, 접선 $y=-3$은 항상 $(a,-3)$을 지난다. 이차식이 $m=0$을 근으로 가지려면 $a=0$인데 그때 다른 근 $m=\frac32$가 생기며, 중근($D=0$)이어도 $m\ne0$인 근이 하나 더 생기므로, 이차식이 실근을 갖지 않는 경우만 남는다.)
      criteria: [1.R1]
    - id: 1b-4
      content: |
        따라서 판별식 $D<0$인 조건을 이용하여 $9(a+1)^2-48a<0$, $3a^2-10a+3=(3a-1)(a-3)<0$,
        $\dfrac13<a<3$이므로 정수 $a$는 $1,2$, 모든 $a$의 합은 $3$
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: 접점을 $(m,m^3-3m^2-3)$으로 두고 접선의 방정식 $y-(m^3-3m^2-3)=(3m^2-6m)(x-m)$을 적었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: $(a,-3)$을 대입해 $-m(2m^2-3(a+1)m+6a)=0$을 얻고, 접선 1개 ⇔ 해 1개임을 적었다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.R1
      mark_type: R
      points: 3
      evidence: $m=0$ 외에 이차방정식 $2m^2-3(a+1)m+6a=0$의 해가 존재하지 않아야 함을 밝혔다.
      depends_on: [1.M2]
      steps: [1b-3]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: $9(a+1)^2-48a<0$에서 $\frac13<a<3$, 정수 $a=1,2$, 합 $3$을 적었다.
      depends_on: [1.R1]
      steps: [1b-4]
