  미분계수와 도함수의 성질을 이용하여 곡선 밖의 점에서 그은 접선을 구하는 문제
key_idea: |
  접점의 $x$좌표 $m$에 대한 방정식 $-m(2m^2-3(a+1)m+6a)=0$이 $m=0$ 하나만 가져야 하므로 이차식의 판별식이 음수여야 한다.
stuck: |
  $m=0$이 항상 근이라는 것을 보고 나머지 이차식이 실근을 갖지 않아야 함을 정리하는 것
