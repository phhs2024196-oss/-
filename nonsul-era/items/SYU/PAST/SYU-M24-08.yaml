stem: |
  곡선 밖의 점 $(a,-3)$에서 곡선 $y=x^3-3x^2-3$에 그은 접선이 한 개만 존재하도록 하는 모든 정수 $a$의 값의 합은?

elements:
  materials:
  - 삼차함수 곡선 $y=x^3-3x^2-3$
  - 곡선 밖의 점 $(a,-3)$
  concepts:
  - 미분계수와 접선의 기울기
  - 접선의 방정식
  - 이차방정식의 판별식
  tools:
  - 접점을 $(m,m^3-3m^2-3)$으로 두고 지나는 점 대입
  - 인수분해 후 판별식
  conditions:
  - 접선의 개수 = 접점 $x$좌표 $m$에 대한 삼차방정식의 서로 다른 실근 개수
  - $m=0$은 항상 근이므로 $2m^2-3(a+1)m+6a=0$이 ($0$ 이외의) 실근을 갖지 않아야 함
