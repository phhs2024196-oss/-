subparts:
- id: '1'
  stem: |
    부등식을 만족시키는 정수 $x$의 개수를 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 6
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $3^{f(x)}$로 묶으면 $0<3^{f(x)}<3^5$, 즉 $f(x)<5$.
    steps:
    - {id: 1a, content: '$3^{f(x)}(3^{f(x)}-3^5)<0\Rightarrow f(x)<5\Rightarrow-1<x<6$, 정수 $6$개', criteria: [1.M1, 1.M2, 1.A1, 1.M3, 1.A2]}
    hint_ladder:
    - $9^{f(x)}$를 밑이 $3$인 꼴로 바꿔 보자.
    - $3^{f(x)}=t$로 두면 어떤 부등식이 되는가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2024학년도 삼육대학교 논술가이드」 p.22 모의문제 문항 1번 답안 예시답안
    steps:
    - id: 1b-1
      content: |
        $9^{f(x)}-3^{5+f(x)}<0$에서 $(3^2)^{f(x)}-3^5\cdot3^{f(x)}<0$, $(3^{f(x)})^2-3^5\cdot3^{f(x)}<0$
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $3^{f(x)}(3^{f(x)}-3^5)<0$, $0<3^{f(x)}<3^5$ (보충: $3^{f(x)}>0$이므로 양변을 나눌 수 있다.)
      criteria: [1.M2]
    - id: 1b-3
      content: |
        따라서 $f(x)<5$ (보충: 밑 $3>1$이므로 지수함수는 증가함수.)
      criteria: [1.A1]
    - id: 1b-4
      content: |
        $f(x)=x^2-5x-1$에 대입하여 $x^2-5x-1<5$, $x^2-5x-6=(x+1)(x-6)<0$
      criteria: [1.M3]
    - id: 1b-5
      content: |
        $-1<x<6$을 만족하는 정수 $x$는 $0,1,2,3,4,5$이므로 $6$개
      criteria: [1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: $9^{f(x)}$를 $(3^{f(x)})^2$, $3^{5+f(x)}$를 $3^5\cdot3^{f(x)}$로 바꿔 적었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: $3^{f(x)}(3^{f(x)}-3^5)<0$으로 묶어 $0<3^{f(x)}<3^5$를 얻었다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: $f(x)<5$를 적었다.
      depends_on: [1.M2]
      steps: [1b-3]
    - id: 1.M3
      mark_type: M
      points: 2
      evidence: $x^2-5x-6=(x+1)(x-6)<0$을 세웠다.
      depends_on: [1.A1]
      steps: [1b-4]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: 정수 $0,1,2,3,4,5$를 나열하고 $6$개라고 적었다.
      depends_on: [1.M3]
      steps: [1b-5]
