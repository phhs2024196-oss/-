  - id: MC-ALG-4405
    outcome_code: '71'
    wrong_work: '$3^{5+f(x)}=3^5+3^{f(x)}$로 분해'
    detect_cue: 지수의 합을 거듭제곱의 합으로 바꾼 식이 있다
    feedback: $3^{p+q}=3^p\cdot3^q$입니다. 지수의 합은 곱으로 나뉩니다.
    remedy: [RL-1]
  - id: MC-ALG-4406
    outcome_code: '72'
    wrong_work: '$-1\le x\le6$으로 끝점을 포함해 $8$개'
    detect_cue: 답이 $8$이거나 $-1$, $6$이 해에 포함됨
    feedback: 엄격한 부등식 $<0$이므로 $(x+1)(x-6)=0$인 끝점은 제외됩니다.
    remedy: [RL-2]

