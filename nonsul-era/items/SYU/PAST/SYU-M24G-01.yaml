intent: |
  지수함수의 성질을 이용한 부등식의 해 구하기
key_idea: |
  $9^{f(x)}=(3^{f(x)})^2$으로 치환해 $3^{f(x)}(3^{f(x)}-3^5)<0$, 즉 $f(x)<5$로 바꾼다.
stuck: |
  $9^{f(x)}$와 $3^{5+f(x)}$를 같은 밑 $3^{f(x)}$로 묶는 것
