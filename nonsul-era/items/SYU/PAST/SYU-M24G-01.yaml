stem: |
  함수 $f(x)=x^2-5x-1$에 대하여 부등식 $9^{f(x)}-3^{5+f(x)}<0$을 만족시키는 정수 $x$의 개수는?

elements:
  materials:
  - 이차함수 $f(x)=x^2-5x-1$을 지수로 갖는 부등식 $9^{f(x)}-3^{5+f(x)}<0$
  concepts:
  - 지수법칙
  - 지수함수의 단조성
  - 이차부등식
  tools:
  - $3^{f(x)}$로 묶어 인수분해
  - 밑이 1보다 큰 지수함수의 증가성
  conditions:
  - $3^{f(x)}>0$이므로 $3^{f(x)}<3^5\iff f(x)<5$
  - $x^2-5x-6<0$의 정수해
  stimuli_used: []
  subpart_links: 단일 논제

