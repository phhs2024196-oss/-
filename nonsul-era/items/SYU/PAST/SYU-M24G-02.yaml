    detect_cue: $-2a_nb_n$ 대신 $-a_nb_n$
    feedback: $(a+b)^2=a^2+2ab+b^2$이므로 $a^2+b^2=(a+b)^2-2ab$입니다.
    remedy: [RL-1]
