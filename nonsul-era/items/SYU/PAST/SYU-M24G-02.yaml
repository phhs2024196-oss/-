subparts:
- id: '1'
  stem: |
    $\displaystyle\sum_{k=1}^{15}(a_k^2+b_k^2)$의 값을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 910
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $a_n^2+b_n^2=n^2-2n-6$을 $k=1$부터 $15$까지 더한다.
    steps:
    - {id: 1a, content: '$a_n+b_n=n$, $a_nb_n=n+3$, $a_n^2+b_n^2=n^2-2n-6$, $1240-240-90=910$', criteria: [1.M1, 1.M2, 1.M3, 1.A1]}
    hint_ladder:
    - 두 근을 직접 구하지 말고 합과 곱을 이용하자.
    - $a^2+b^2$을 $a+b$와 $ab$로 나타내 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2024학년도 삼육대학교 논술가이드」 p.23 모의문제 문항 2번 답안 예시답안
    steps:
    - id: 1b-1
      content: |
        $x^2-nx+n+3=0$의 해가 $a_n$, $b_n$이므로 $a_n+b_n=n$, $a_nb_n=n+3$
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $a_n^2+b_n^2=(a_n+b_n)^2-2a_nb_n=(n)^2-2(n+3)=n^2-2n-6$
        (보충: $n\le5$에서는 두 근이 허근이지만 근과 계수의 관계와 이 항등식은 그대로 성립한다.)
      criteria: [1.M2]
    - id: 1b-3
      content: |
        $\displaystyle\sum_{k=1}^{15}(a_k^2+b_k^2)=\sum_{k=1}^{15}(k^2-2k-6)=\sum_{k=1}^{15}k^2-2\sum_{k=1}^{15}k-6\cdot15=\dfrac{15\times16\times31}{6}-\dfrac{(2)(15\times16)}{2}-90$
      criteria: [1.M3]
    - id: 1b-4
      content: |
        $=1240-240-90=910$
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: 근과 계수의 관계 $a_n+b_n=n$, $a_nb_n=n+3$을 적었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: $a_n^2+b_n^2=(a_n+b_n)^2-2a_nb_n=n^2-2n-6$을 적었다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.M3
      mark_type: M
      points: 3
      evidence: $\sum$의 성질로 $\sum k^2-2\sum k-6\cdot15$로 나누고 공식에 대입한 식을 적었다.
      depends_on: [1.M2]
      steps: [1b-3]
