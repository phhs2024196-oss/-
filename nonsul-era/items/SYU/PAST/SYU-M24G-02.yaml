intent: |
  이차방정식의 해 조건을 이용한 수열의 합 계산
key_idea: |
  근과 계수의 관계로 $a_n^2+b_n^2=(a_n+b_n)^2-2a_nb_n=n^2-2n-6$을 얻고 $\sum$ 공식을 쓴다.
stuck: |
  $a_n^2+b_n^2$을 두 근의 합과 곱으로 표현하는 것
