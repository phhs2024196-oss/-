stem: |
  두 수열 $\{a_n\}$, $\{b_n\}$에서 $a_n$, $b_n$을 두 근으로 하는 이차방정식이 $x^2-nx+n+3=0$일 때, $\displaystyle\sum_{k=1}^{15}(a_k^2+b_k^2)$의 값을 구하시오.

elements:
  materials:
  - 계수가 $n$에 따라 변하는 이차방정식 $x^2-nx+n+3=0$의 두 근으로 만든 수열
  concepts:
  - 이차방정식의 근과 계수의 관계
  - $\sum$의 성질
  - 자연수의 거듭제곱의 합
  tools:
  - $a^2+b^2=(a+b)^2-2ab$
  - $\sum k^2=\frac{n(n+1)(2n+1)}6$, $\sum k=\frac{n(n+1)}2$
  conditions:
  - $a_n+b_n=n$, $a_nb_n=n+3$
  stimuli_used: []
  subpart_links: 단일 논제

