intent: |
  극한의 성질을 이용하여 함수값 계산
key_idea: |
  조건 (1)에서 $f(x)=(x-3)g(x)$, 조건 (2)에서 $g(x)-1=k(x-2)^2(x-a)$로 두고 두 극한값으로 $k$, $a$를 정한다.
stuck: |
  $(x-2)^2$로 나눈 극한이 수렴하려면 $f(x)-x+3$이 $(x-2)^2$을 인수로 가져야 함을 쓰는 것
