stem: |
  사차함수 $f(x)$가 $\displaystyle\lim_{x\to3}\dfrac{xf(x)}{x-3}=6$, $\displaystyle\lim_{x\to2}\dfrac{f(x)-x+3}{(x-2)^2}=2$를 만족시킬 때, $f(1)$의 값은?

elements:
  materials:
  - 두 극한 조건을 만족하는 사차함수 $f(x)$
  concepts:
  - 함수의 극한의 성질
  - 인수정리
  tools:
  - $0/0$ 꼴 극한에서 분자의 인수 찾기
  - 미정계수 연립
  conditions:
  - 조건 (1)에서 $f(3)=0$, $f(x)=(x-3)g(x)$($g$는 삼차함수)
  - 조건 (2)에서 $f(x)-(x-3)=(x-3)(g(x)-1)$이 $(x-2)^2$을 인수로 가짐
  stimuli_used: []
  subpart_links: 단일 논제

