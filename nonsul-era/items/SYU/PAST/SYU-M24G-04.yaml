  - id: MC-CAL-4407
    outcome_code: '71'
    wrong_work: '넓이 대신 $\int_{-3}^{2}\{f(x)-(x+3)\}dx$를 부호 그대로 계산해 직선 위·아래 부분이 상쇄됨'
    detect_cue: 교점 $x=0$에서 구간을 나누지 않고 한 번에 적분
    feedback: 넓이는 (위 함수)−(아래 함수)를 구간별로 적분합니다. 교점에서 위아래가 바뀌는지 확인하세요.
    remedy: [RL-1]
  - id: MC-CAL-4408
    outcome_code: '72'
    wrong_work: '(나)를 $f(x+5)=f(x)$로 보고 직선과의 관계가 구간마다 같다고 가정하거나, $[0,20]$을 $[-3,2]$의 길이 $5$로 나눈 $4$배 대신 다른 배수를 사용'
    detect_cue: 평행이동 후 직선도 함께 옮겨진다는 설명 없이 반복 횟수를 정함
    feedback: $f(x+5)=f(x)+5$는 그래프를 $(5,5)$만큼 옮긴 것입니다. 직선 $y=x+3$도 같은 이동에서 자기 자신이 되는지 확인하세요.
    remedy: [RL-2]

