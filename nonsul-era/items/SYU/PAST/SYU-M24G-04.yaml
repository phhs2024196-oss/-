  함수 관계를 이용하여 정적분 계산
key_idea: |
  $f(x+5)=f(x)+5$이면 그래프가 $(5,5)$씩 평행이동하고 직선 $y=x+3$도 그대로 옮겨지므로 $[0,20]$의 넓이는 $[-3,2]$ 넓이의 $4$배이다.
stuck: |
