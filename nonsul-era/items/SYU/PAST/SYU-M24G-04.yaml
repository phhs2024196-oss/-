subparts:
- id: '1'
  stem: |
    넓이의 합을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 34
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $[-3,2]$에서 넓이 $\frac{17}2$를 구해 $4$배한다.
    steps:
    - {id: 1a, content: '$\frac92+\frac{11}6+\frac{13}6=\frac{17}2$, $\frac{17}2\times4=34$', criteria: [1.M1, 1.R1, 1.A1, 1.A2, 1.A3, 1.A4, 1.A5]}
    hint_ladder:
    - 그래프를 $(5,5)$만큼 옮기면 직선 $y=x+3$은 어떻게 되는가?
    - 한 주기 $[-3,2]$에서 곡선과 직선의 교점을 찾아 구간을 나눠 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2024학년도 삼육대학교 논술가이드」 p.25 모의문제 문항 4번 답안 예시답안
    steps:
    - id: 1b-1
      content: |
        [그림: $x$축 $-3$에서 $5$ 남짓까지, $y=f(x)$와 직선 $y=x+3$을 그린 그래프. $[-3,1]$에서 꼭짓점 $(-1,4)$인 위로 볼록한 포물선 조각, $[1,2]$에서 아래로 볼록한 조각이 $(2,5)$에 이르고, 다시 $(5,5)$ 평행이동한 같은 모양이 이어진다. 직선과 곡선 사이(교점 $x=-3,0,2$ 및 옮긴 점)가 빗금으로 칠해져 있고, $x$축 아래에 $[0,5]$ 구간을 화살표로 표시하며 「$[0,20]$ 4번 반복」이라 적혀 있다.]
        (보충: $f(x+5)-5=f(x)$이고 $(x+5)+3-5=x+3$이므로 그래프와 직선을 함께 $(5,5)$만큼 옮겨도 겹친다.)
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $[0,5]$ 구간의 면적은 $[-3,2]$ 구간의 면적과 동일.
        각 구간 $[5,10]$, $[10,15]$, $[15,20]$에 해당하는 면적은 모두 $[0,5]$ 구간의 면적과 같음.
      criteria: [1.R1]
    - id: 1b-3
      content: |
        [구간1] $[-3,0]$: $\displaystyle\int_{-3}^{0}[-(x^2+2x-3)-(x+3)]dx=\int_{-3}^{0}(-x^2-3x)dx=\left[-\dfrac13x^3-\dfrac32x^2\right]_{-3}^{0}=-9+\dfrac{27}2$
      criteria: [1.A1]
    - id: 1b-4
      content: |
        [구간2] $[0,1]$: $\displaystyle\int_{0}^{1}[(x+3)-(-x^2-2x+3)]dx=\int_{0}^{1}(x^2+3x)dx=\left[\dfrac13x^3+\dfrac32x^2\right]_0^1=\dfrac13+\dfrac32$
      criteria: [1.A2]
    - id: 1b-5
      content: |
        [구간3] $[1,2]$: $\displaystyle\int_{1}^{2}[(x+3)-(x^2+2x-3)]dx=\int_{1}^{2}(-x^2-x+6)dx=\left[-\dfrac13x^3-\dfrac12x^2+6x\right]_1^2=-\dfrac73-\dfrac32+6$
      criteria: [1.A3]
    - id: 1b-6
      content: |
        구간1+구간2+구간3 $=-9+\dfrac{27}2+\dfrac13+\dfrac32-\dfrac73-\dfrac32+6=\dfrac{17}2$
      criteria: [1.A4]
    - id: 1b-7
      content: |
        $[0,20]$구간 $=\dfrac{17}2\times4=34$
      criteria: [1.A5]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: (가)(나)로 그래프를 그리고 직선과 둘러싸인 부분이 $[0,5]$ 단위로 반복됨을 나타냈다(그림 또는 평행이동 설명).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.R1
      mark_type: R
      points: 2
      evidence: $[0,5]$의 넓이가 $[-3,2]$의 넓이와 같고, $[5,10]$, $[10,15]$, $[15,20]$도 같음을 밝혔다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 1
      evidence: $[-3,0]$의 넓이 $\int_{-3}^0(-x^2-3x)dx=\frac92$를 계산했다.
      depends_on: [1.M1]
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 1
      evidence: $[0,1]$의 넓이 $\int_0^1(x^2+3x)dx=\frac{11}6$을 계산했다.
      depends_on: [1.M1]
      steps: [1b-4]
    - id: 1.A3
      mark_type: A
      points: 1
      evidence: $[1,2]$의 넓이 $\int_1^2(-x^2-x+6)dx=\frac{13}6$을 계산했다.
      depends_on: [1.M1]
      steps: [1b-5]
    - id: 1.A4
      mark_type: A
      points: 1
      evidence: 세 구간 넓이의 합 $\frac{17}2$를 적었다.
      depends_on: [1.M1, 1.A1, 1.A2, 1.A3]
      steps: [1b-6]
    - id: 1.A5
      mark_type: A
      points: 1
      evidence: $\frac{17}2\times4=34$를 적었다.
      depends_on: [1.R1, 1.A4]
      steps: [1b-7]
