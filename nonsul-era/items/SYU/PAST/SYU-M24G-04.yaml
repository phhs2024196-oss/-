stem: |
  함수 $f(x)$가 다음 조건을 만족시킨다.
  (가) $-3\le x<2$일 때, $f(x)=\lvert x^2+2x-3\rvert$, (나) 모든 실수 $x$에 대하여, $f(x+5)=f(x)+5$이다.
  닫힌 구간 $[0,20]$에서 곡선 $y=f(x)$와 직선 $y=x+3$으로 둘러싸인 부분들의 넓이의 합을 구하시오.

elements:
  materials:
  - 절댓값 이차함수 $\lvert x^2+2x-3\rvert$를 $(5,5)$씩 평행이동해 이어 붙인 함수
  - 직선 $y=x+3$
  concepts:
  - 정적분과 넓이
  - 함수의 평행이동
  tools:
  - 구간 분할 정적분
  - 평행이동에 대한 넓이 불변
  conditions:
  - $f(x+5)=f(x)+5$와 직선 $y=x+3$은 $(5,5)$ 평행이동으로 겹쳐짐
  - $[0,5]$의 넓이 = $[-3,2]$의 넓이, $[0,20]$은 그 $4$배
  stimuli_used: []
  subpart_links: 단일 논제

