- id: '3'
  stem: |
    [문제 1-3] (10점)
    $0\le x\le\pi$일 때, 함수 $y=f(x)$의 그래프가 직선 $y=-3$과 만나는 서로 다른 두 점의 $x$좌표를 각각 $a$, $b$라 하자. $a+b$의 값을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 3*pi/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: $0\le x\le\pi$ 에서 $y=f(x)$ 의 그래프는 직선 $x=\dfrac{3\pi}{4}$ 에 대하여 대칭이다(최솟값 $-4$ 는 $x=\dfrac{3\pi}{4}$ 에서).
      source_flow: 모범답안 p.1-4
      criteria:
      - 3.M1
    - id: 3b-2
      content: 대칭성에 의하여 $\dfrac{a+b}{2}=\dfrac34\pi$ 이므로 $a+b=\dfrac32\pi$ 이다.
      source_flow: 모범답안 p.1-4
      criteria:
      - 3.A1
  # 채점기준 미공개 — 단계별 추정
  rubric:
