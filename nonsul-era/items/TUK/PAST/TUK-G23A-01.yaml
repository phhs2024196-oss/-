      mark_type: M
      points: 6
      evidence: 그래프의 대칭축 $x=\dfrac{3\pi}{4}$ 를 찾았다.
      steps:
      - 3b-1
    - id: 3.A1
      mark_type: A
      points: 4
      evidence: $a+b=\dfrac{3\pi}{2}$ 를 구했다.
      depends_on:
      - 3.M1
      steps:
      - 3b-2
