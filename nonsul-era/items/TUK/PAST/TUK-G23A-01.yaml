stimuli: []
stem: |
  [문제 1] (45점)
  함수 $f(x)=3\sin2x-1$에 대하여 다음 물음에 답하시오.
subparts:
- id: '1'
  stem: |
    [문제 1-1] (10점)
    $0\le x\le\pi$일 때, 방정식 $f(x)=2$를 푸시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: pi/4
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: $3\sin2x-1=2$ 에서 $\sin2x=1$ 이다.
      source_flow: 모범답안 p.1-4
      criteria:
      - 1.M1
    - id: 1b-2
      content: $0\le x\le\pi$ 에서 $0\le2x\le2\pi$ 이므로 $2x=\dfrac{\pi}{2}$, 따라서 $x=\dfrac{\pi}{4}$ 이다.
      source_flow: 모범답안 p.1-4
      criteria:
      - 1.A1
  # 채점기준 미공개 — 단계별 추정
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 6
      evidence: $f(x)=2$ 에서 $\sin2x=1$ 로 정리했다.
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: 범위 $0\le2x\le2\pi$ 를 확인하여 $x=\dfrac{\pi}{4}$ 를 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    [문제 1-2] (10점)
    $0\le x\le\pi$일 때, 함수 $g(x)=2^{1-x}+3$에 대하여 $y=(g\circ f)(x)$의 최댓값과 최솟값을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: max=35; min=7/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: $0\le x\le\pi$ 에서 $-4\le f(x)\le2$ 이고 $g(x)$ 는 감소함수이다.
      source_flow: 모범답안 p.1-4
      criteria:
      - 2.M1
    - id: 2b-2
      content: 따라서 최댓값은 $g(-4)=35$, 최솟값은 $g(2)=\dfrac72$ 이다.
      source_flow: 모범답안 p.1-4
      criteria:
      - 2.A1
  # 채점기준 미공개 — 단계별 추정
  rubric:
