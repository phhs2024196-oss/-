- id: '4'
  stem: |
    [문제 1-4] (15점)
    모든 실수 $x$에 대하여 부등식
    $$f(x)\ge k+\sin2x-\sin^2\left(2x-\dfrac{\pi}{2}\right)$$
    가 항상 성립하도록 하는 실수 $k$의 값의 범위를 구하시오.
  points: 15
  depends_on: []
  answer:
    kind: expression
    value: k <= -3
    equivalents: []
    tolerance: null
  solutions:
  - id: S4-B
    audience: B
    method_no: 1
    steps:
    - id: 4b-1
      content: $t=\sin2x$ 라 하면 $-1\le t\le1$ 이고, 부등식은 $g(t)=t^2-2t+k\le0$ 이다.
      source_flow: 모범답안 p.1-4
      criteria:
      - 4.M1
    - id: 4b-2
      content: $-1\le t\le1$ 에서 $g(t)$ 의 최댓값은 $g(-1)=k+3$ 이므로 이것이 $0$ 보다 작거나 같아야 한다.
      source_flow: 모범답안 p.1-4
      criteria:
      - 4.M1
    - id: 4b-3
      content: 따라서 $k\le-3$ 이다.
      source_flow: 모범답안 p.1-4
      criteria:
      - 4.A1
  # 채점기준 미공개 — 단계별 추정
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 4.M1
      mark_type: M
      points: 9
      evidence: $t=\sin2x$ 로 치환하여 $-1\le t\le1$ 에서 $g(t)=t^2-2t+k\le0$ 꼴로 만들고 최댓값 $g(-1)=k+3$ 을 구했다.
      steps:
      - 4b-1
      - 4b-2
    - id: 4.A1
      mark_type: A
      points: 6
      evidence: $k+3\le0$ 에서 $k\le-3$ 을 구했다.
      depends_on:
      - 4.M1
      steps:
      - 4b-3
