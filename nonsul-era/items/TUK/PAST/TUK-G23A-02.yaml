- id: '1'
  stem: |
    [문제 2-1] (10점)
    수열 $\{a_n\}$은 모든 자연수 $n$에 대하여
    $$(a_{n+1})^2=a_na_{n+2}$$
    를 만족시킨다. $a_1=1$, $a_2=2$일 때, $a_5$의 값을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '16'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: 모든 $n$에 대하여 $(a_{n+1})^2=a_na_{n+2}$ 이므로 $\{a_n\}$ 은 등비수열이고, 첫째항이 $1$, 공비가 $2$ 이다.
      source_flow: 모범답안 p.5-8
      criteria:
      - 1.M1
    - id: 1b-2
      content: 따라서 $a_5=2^4=16$ 이다.
      source_flow: 모범답안 p.5-8
      criteria:
      - 1.A1
  # 채점기준 미공개 — 단계별 추정
