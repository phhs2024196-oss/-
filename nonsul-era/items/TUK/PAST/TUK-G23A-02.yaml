      steps:
      - 3b-1
    - id: 3.A1
      mark_type: A
      points: 4
      evidence: 같은 방식으로 $c_5,\dots,c_8$ 을 구하여 $c_8=\dfrac1{16}$ 을 얻었다.
      depends_on:
      - 3.M1
      steps:
      - 3b-2
