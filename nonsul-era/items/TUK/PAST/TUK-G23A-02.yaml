- id: '3'
  stem: |
    [문제 2-3] (10점)
    수열 $\{c_n\}$은 모든 자연수 $n$에 대하여
    $$c_{n+2}=\begin{cases}\dfrac{(c_{n+1})^2}{c_n}&(c_n<5)\\2c_{n+1}-c_n&(c_n\ge5)\end{cases}$$
    를 만족시킨다. $c_1=6$, $c_2=4$일 때, $c_8$의 값을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 1/16
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: $c_1\ge5$ 이므로 $c_3=2c_2-c_1=2$, $c_2<5$ 이므로 $c_4=\dfrac{(c_3)^2}{c_2}=1$ 이다.
      source_flow: 모범답안 p.5-8
      criteria:
      - 3.M1
    - id: 3b-2
      content: 계속해서 $c_5=\dfrac12$, $c_6=\dfrac14$, $c_7=\dfrac18$ 이므로 $c_8=\dfrac1{16}$ 이다.
      source_flow: 모범답안 p.5-8
      criteria:
      - 3.A1
  # 채점기준 미공개 — 단계별 추정
