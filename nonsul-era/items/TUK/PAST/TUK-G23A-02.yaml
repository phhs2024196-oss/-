- id: '2'
  stem: |
    [문제 2-2] (10점)
    수열 $\{b_n\}$은 모든 자연수 $n$에 대하여
    $$2b_{n+1}=b_n+b_{n+2}$$
    를 만족시킨다. $b_1=1$, $b_2=3$일 때, $\displaystyle\sum_{n=1}^{6}(1+b_n)^2$ 의 값을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '364'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: $\{b_n\}$ 은 첫째항이 $1$, 공차가 $2$ 인 등차수열이므로 일반항은 $b_n=2n-1$ 이다.
      source_flow: 모범답안 p.5-8
      criteria:
      - 2.M1
    - id: 2b-2
      content: $\displaystyle\sum_{n=1}^{6}(1+b_n)^2=\sum_{n=1}^{6}4n^2=4\times\dfrac{6\times7\times13}{6}=364$ 이다.
      source_flow: 모범답안 p.5-8
      criteria:
      - 2.A1
