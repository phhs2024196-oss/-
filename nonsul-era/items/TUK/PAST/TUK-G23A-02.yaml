- id: '4'
  stem: |
    [문제 2-4] (15점)
    제4항이 $p$이고 제7항이 $q$인 등차수열 $\{d_n\}$에 대하여 함수
    $$f(x)=\dfrac13x^3-\dfrac12x^2-20x+3$$
    이 $x=p$에서 극소이고 $x=q$에서 극대일 때, 일반항 $d_n$을 구하시오.
  points: 15
  depends_on: []
  answer:
    kind: expression
    value: -3*n+17
    equivalents: []
    tolerance: null
  solutions:
  - id: S4-B
    audience: B
    method_no: 1
    steps:
    - id: 4b-1
      content: $f'(x)=x^2-x-20=(x-5)(x+4)$ 이고 증감표는 $x=-4$ 에서 극대, $x=5$ 에서 극소이다.
      source_flow: 모범답안 p.5-8
      criteria:
      - 4.M1
    - id: 4b-2
      content: 따라서 $d_4=5$, $d_7=-4$ 이다.
      source_flow: 모범답안 p.5-8
      criteria:
      - 4.M1
    - id: 4b-3
      content: 첫째항을 $d_1$, 공차를 $d$ 라 하면 $d_1+3d=5$, $d_1+6d=-4$ 에서 $d_1=14$, $d=-3$ 이다. 따라서 $d_n=-3n+17$ 이다.
      source_flow: 모범답안 p.5-8
      criteria:
      - 4.A1
  # 채점기준 미공개 — 단계별 추정
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 4.M1
      mark_type: M
      points: 9
      evidence: $f'(x)=0$ 의 해와 증감표로 극소점 $x=5$, 극대점 $x=-4$ 를 찾아 $d_4=5$, $d_7=-4$ 를 얻었다.
      steps:
      - 4b-1
      - 4b-2
    - id: 4.A1
      mark_type: A
      points: 6
      evidence: 연립방정식으로 $d_1=14$, $d=-3$ 을 구하여 $d_n=-3n+17$ 을 썼다.
      depends_on:
      - 4.M1
      steps:
      - 4b-3
