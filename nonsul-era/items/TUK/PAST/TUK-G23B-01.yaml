      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: $g(3a-2b)=\dfrac{27}{25}$ 를 계산했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
