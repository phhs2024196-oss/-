- id: '2'
  stem: |
    [문제 1-2] (10점)
    정의역이 $\{x\mid1\le x\le4\}$일 때, 함수 $y=\left(\dfrac12\right)^{x^2-4x+6}$의 최댓값과 최솟값을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: max=1/4; min=1/64
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: $1\le x\le4$ 에서 $2\le x^2-4x+6=(x-2)^2+2\le6$ 이고, $y=\left(\dfrac12\right)^x$ 는 감소함수이다.
      source_flow: 모범답안 p.1-4
      criteria:
      - 2.M1
    - id: 2b-2
      content: 따라서 최댓값은 $\left(\dfrac12\right)^2=\dfrac14$, 최솟값은 $\left(\dfrac12\right)^6=\dfrac1{64}$ 이다.
      source_flow: 모범답안 p.1-4
      criteria:
      - 2.A1
  # 채점기준 미공개 — 단계별 추정
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
