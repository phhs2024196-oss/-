      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 6
      evidence: 함수와 역함수의 교점이 $y=a^{x-m}$ 과 $y=x$ 의 교점임을 이용해 $a^{1-m}=1$, $a^{3-m}=3$ 을 세웠다.
      steps:
      - 3b-1
    - id: 3.A1
      mark_type: A
      points: 4
      evidence: $m=1$, $a=\sqrt3$ 을 구했다.
      depends_on:
      - 3.M1
      steps:
      - 3b-2
