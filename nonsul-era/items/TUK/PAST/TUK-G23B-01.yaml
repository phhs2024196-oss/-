- id: '3'
  stem: |
    [문제 1-3] (10점)
    함수 $y=a^{x-m}$ $(a>1)$의 그래프와 그 역함수의 그래프가 두 점에서 만나고, 두 교점의 $x$좌표가 각각 $1$과 $3$일 때, 실수 $a$와 $m$의 값을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: a=sqrt(3); m=1
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: $y=a^{x-m}$ 과 그 역함수의 교점은 $y=a^{x-m}$ 과 $y=x$ 의 교점과 같다.
      source_flow: 모범답안 p.1-4
      criteria:
      - 3.M1
    - id: 3b-2
      content: $a^{1-m}=1$, $a^{3-m}=3$ 이므로 $m=1$, $a=\sqrt3$ 이다.
      source_flow: 모범답안 p.1-4
      criteria:
      - 3.A1
  # 채점기준 미공개 — 단계별 추정
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
