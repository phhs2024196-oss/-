  다음 물음에 답하시오.
subparts:
- id: '1'
  stem: |
    [문제 1-1] (10점)
    함수 $y=f(x)$의 역함수를 $y=g(x)$라 하자. $f(x)=\log_2x$이고 $f(3)=a$, $f(5)=b$일 때, $g(3a-2b)$의 값을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 27/25
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: $f(x)=\log_2x$ 의 역함수는 $g(x)=2^x$ 이고 $a=\log_23$, $b=\log_25$ 이다.
      source_flow: 모범답안 p.1-4
      criteria:
      - 1.M1
    - id: 1b-2
      content: 따라서 $g(3a-2b)=\dfrac{2^{3a}}{2^{2b}}=\dfrac{2^{3\log_23}}{2^{2\log_25}}=\dfrac{27}{25}$ 이다.
      source_flow: 모범답안 p.1-4
      criteria:
      - 1.A1
  # 채점기준 미공개 — 단계별 추정
