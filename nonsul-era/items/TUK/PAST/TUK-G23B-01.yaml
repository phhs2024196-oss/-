- id: '4'
  stem: |
    [문제 1-4] (15점)
    방정식
    $$x^3-3x^2+(1+\log_2a)=0$$
    이 서로 다른 세 실근을 갖도록 하는 양수 $a$의 값의 범위를 구하시오.
  points: 15
  depends_on: []
  answer:
    kind: expression
    value: 1/2 < a < 8
    equivalents: []
    tolerance: null
  solutions:
  - id: S4-B
    audience: B
    method_no: 1
    steps:
    - id: 4b-1
      content: $f(x)=x^3-3x^2+(1+\log_2a)$ 라 하면 $f'(x)=3x^2-6x$ 이고 증감표는 $x=0$ 에서 극대, $x=2$ 에서 극소이다.
      source_flow: 모범답안 p.1-4
      criteria:
      - 4.M1
    - id: 4b-2
      content: 서로 다른 세 실근을 가지려면 $f(0)\times f(2)<0$, 즉 $(1+\log_2a)(-3+\log_2a)<0$ 이다.
      source_flow: 모범답안 p.1-4
      criteria:
      - 4.M1
    - id: 4b-3
      content: 따라서 $-1<\log_2a<3$ 이므로 $\dfrac12<a<8$ 이다.
      source_flow: 모범답안 p.1-4
      criteria:
      - 4.A1
  # 채점기준 미공개 — 단계별 추정
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 4.M1
      mark_type: M
      points: 9
      evidence: $f'(x)=3x^2-6x$ 의 증감표로 극대·극소를 찾고 $f(0)f(2)<0$ 조건을 세웠다.
      steps:
      - 4b-1
      - 4b-2
    - id: 4.A1
      mark_type: A
      points: 6
      evidence: 부등식을 풀어 $\dfrac12<a<8$ 을 구했다.
      depends_on:
      - 4.M1
      steps:
      - 4b-3
