stem: |
  [문제 2] (45점)
  함수 $f(x)=\dfrac13x^3+x^2-3x+\dfrac23$에 대하여 다음 물음에 답하시오.
subparts:
- id: '1'
  stem: |
    [문제 2-1] (10점)
    함수 $f(x)$의 극솟값을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '-1'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: $f'(x)=x^2+2x-3=(x+3)(x-1)$ 이고 증감표는 $x=-3$ 에서 극대, $x=1$ 에서 극소이다.
      source_flow: 모범답안 p.5-8
      criteria:
      - 1.M1
    - id: 1b-2
      content: 극솟값은 $f(1)=-1$ 이다.
      source_flow: 모범답안 p.5-8
      criteria:
      - 1.A1
  # 채점기준 미공개 — 단계별 추정
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 6
      evidence: $f'(x)=(x+3)(x-1)$ 과 증감표로 극소가 되는 $x=1$ 을 찾았다.
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: 극솟값 $f(1)=-1$ 을 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    [문제 2-2] (10점)
    미분가능한 함수 $y=g(x)$에 대하여 함수 $h(x)=f(x)g(x)$라 하자.
    함수 $y=g(x)$의 그래프 위의 점 $(1,\,g(1))$에서의 접선의 기울기가 $3$일 때, $h'(1)$의 값을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '-3'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: $g'(1)=3$ 이고 $h'(x)=f'(x)g(x)+f(x)g'(x)$ 이다.
      source_flow: 모범답안 p.5-8
      criteria:
      - 2.M1
    - id: 2b-2
      content: 따라서 $h'(1)=f'(1)g(1)+f(1)g'(1)=0\cdot g(1)+(-1)\cdot3=-3$ 이다.
      source_flow: 모범답안 p.5-8
      criteria:
      - 2.A1
  # 채점기준 미공개 — 단계별 추정
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 6
      evidence: 곱의 미분법으로 $h'(x)=f'(x)g(x)+f(x)g'(x)$ 를 세웠다.
      steps:
      - 2b-1
    - id: 2.A1
      mark_type: A
      points: 4
      evidence: $f'(1)=0$, $f(1)=-1$, $g'(1)=3$ 을 대입하여 $h'(1)=-3$ 을 구했다.
      depends_on:
      - 2.M1
      steps:
      - 2b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    [문제 2-3] (10점)
    부등식
    $$f(x)\ge-3x^2+17x+a+\dfrac13$$
    이 $x>0$인 모든 실수에 대하여 항상 성립하도록 하는 실수 $a$의 최댓값을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '-21'
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: $h(x)=f(x)-\left(-3x^2+17x+\dfrac13\right)=\dfrac13x^3+4x^2-20x+\dfrac13$ 이라 하면 $h'(x)=x^2+8x-20=(x+10)(x-2)$ 이다.
      source_flow: 모범답안 p.5-8
      criteria:
      - 3.M1
    - id: 3b-2
      content: $x>0$ 에서 $h(x)$ 는 $x=2$ 에서 최솟값 $h(2)=-21$ 을 가지므로 $a\le-21$ 이고, $a$ 의 최댓값은 $-21$ 이다.
      source_flow: 모범답안 p.5-8
      criteria:
      - 3.A1
  # 채점기준 미공개 — 단계별 추정
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 6
      evidence: 부등식을 $h(x)\ge a$ 꼴로 바꾸고 $h'(x)=(x+10)(x-2)$ 로 증감을 조사했다.
      steps:
      - 3b-1
    - id: 3.A1
      mark_type: A
      points: 4
      evidence: $x>0$ 에서의 최솟값 $h(2)=-21$ 을 구해 $a$ 의 최댓값 $-21$ 을 얻었다.
      depends_on:
      - 3.M1
      steps:
      - 3b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '4'
  stem: |
    [문제 2-4] (15점)
    닫힌구간 $[k,\,k+2]$에서 함수 $f(x)$의 최솟값이 $-1$이 되도록 하는 정수 $k$의 값을 모두 구하시오.
  points: 15
  depends_on: []
  answer:
    kind: set
    value: -5, -1, 0, 1
    equivalents: []
    tolerance: null
  solutions:
  - id: S4-B
    audience: B
    method_no: 1
    steps:
    - id: 4b-1
      content: $f(x)$ 는 [문제 2-1]에 의하여 $x=1$ 에서 극솟값 $-1$ 을 가진다. 따라서 $y=-1$ 은 $y=f(x)$ 에 접하고, 다른 한 교점은 $(-5,-1)$ 이다.
      source_flow: 모범답안 p.5-8
      criteria:
      - 4.M1
    - id: 4b-2
      content: (1) $f(-5)=f(1)=-1$ 이므로 $[k,k+2]$ 에서 $f(x)$ 의 최솟값이 $-1$ 이 되려면 $k=-5$ 가 되어야 한다.
      source_flow: 모범답안 p.5-8
      criteria:
      - 4.M1
    - id: 4b-3
      content: (2) $[k,k+2]$ 가 $x=1$ 을 포함해야 하므로 정수 $k$ 의 값은 $-1,\,0,\,1$ 이다. 따라서 $k=-5,\,-1,\,0,\,1$ 이다.
      source_flow: 모범답안 p.5-8
      criteria:
      - 4.A1
  # 채점기준 미공개 — 단계별 추정
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 4.M1
      mark_type: M
      points: 9
      evidence: 극솟값 $-1$ 에서 $y=-1$ 과 $y=f(x)$ 의 교점 $x=1$(접), $x=-5$ 를 찾아 최솟값이 $-1$ 이 되는 경우를 나누었다.
      steps:
      - 4b-1
      - 4b-2
    - id: 4.A1
      mark_type: A
      points: 6
      evidence: $k=-5$ 와 $x=1$ 을 포함하는 $k=-1,0,1$ 을 모두 구했다.
      depends_on:
      - 4.M1
      steps:
      - 4b-3
