    criteria:
    - id: 4.M1
      mark_type: M
      points: 12
      evidence: 대칭성으로 넓이를 $A_1$, $A_3$ 의 두 배씩으로 나누고 $A_1=\dfrac13$ 을 계산했다.
      steps:
      - 4b-1
      - 4b-2
    - id: 4.A1
      mark_type: A
      points: 8
      evidence: (나)(라)로 $A_3=\sqrt3A_1$ 임을 보이고 총 넓이 $\dfrac{2(1+\sqrt3)}{3}$ 을 구했다.
      depends_on:
      - 4.M1
      steps:
      - 4b-3
