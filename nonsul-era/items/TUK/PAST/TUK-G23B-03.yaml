stimuli: []
stem: |
  [문제 3] (60점)
  $x\ge0$에서 정의된 두 함수 $f(x)$, $g(x)$에 대하여
  함수 $f(x)$가 조건
  (가) $f(x)=1-(x-2)^2\ (1\le x\le3)$
  (나) $f(x+2)=\sqrt3f(x)$
  를 만족시키고 함수 $g(x)$가 조건
  (다) $g(x)=\begin{cases}(x-1)^2&(1\le x<2)\\(x-3)^2&(2\le x\le3)\end{cases}$
  (라) $g(x+2)=\sqrt3g(x)$
  를 만족시킨다. 다음 물음에 답하시오.
subparts:
- id: '1'
  stem: |
    [문제 3-1] (10점)
    $f(0)$과 $g(0)$의 값을 각각 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: f(0)=sqrt(3)/3; g(0)=sqrt(3)/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: (나)에서 $f(2)=\sqrt3f(0)$ 이고 (가)에서 $f(2)=1$ 이므로 $f(0)=\dfrac1{\sqrt3}\times f(2)=\dfrac1{\sqrt3}$ 이다.
      source_flow: 모범답안 p.9-15
      criteria:
      - 1.M1
    - id: 1b-2
      content: (라)에서 $g(2)=\sqrt3g(0)$ 이고 (다)에서 $g(2)=1$ 이므로 $g(0)=\dfrac1{\sqrt3}\times g(2)=\dfrac1{\sqrt3}$ 이다.
      source_flow: 모범답안 p.9-15
      criteria:
      - 1.A1
  # 채점기준 미공개 — 단계별 추정
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 6
      evidence: (나)를 $x=0$ 에 적용하여 $f(0)=\dfrac1{\sqrt3}f(2)=\dfrac1{\sqrt3}$ 을 구했다.
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: (라)를 $x=0$ 에 적용하여 $g(0)=\dfrac1{\sqrt3}$ 을 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    [문제 3-2] (10점)
    곡선 $y=f(x)$ 위의 세 점 A$(5,f(5))$, B$(6,f(6))$, C$(7,f(7))$로 이루어진 삼각형 ABC에서 $\sin A$의 값을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 3*sqrt(10)/10
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: $f(5)=\sqrt3f(3)=3f(1)=0$, $f(6)=\sqrt3f(4)=3f(2)=3$, $f(7)=\sqrt3f(5)=0$ 이므로 A$(5,0)$, B$(6,3)$, C$(7,0)$ 이다.
      source_flow: 모범답안 p.9-15
      criteria:
      - 2.M1
    - id: 2b-2
      content: 점 B에서 직선 AC에 내린 수선의 발을 H라 하면 $\sin A=\dfrac{\overline{\text{BH}}}{\overline{\text{AB}}}=\dfrac{3}{\sqrt{10}}=\dfrac{3\sqrt{10}}{10}$ 이다.
      source_flow: 모범답안 p.9-15
      criteria:
      - 2.A1
  # 채점기준 미공개 — 단계별 추정
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 6
      evidence: (나)를 반복 적용하여 세 점 A$(5,0)$, B$(6,3)$, C$(7,0)$ 의 좌표를 구했다.
      steps:
      - 2b-1
    - id: 2.A1
      mark_type: A
      points: 4
      evidence: 수선의 발 H를 이용해 $\sin A=\dfrac{3\sqrt{10}}{10}$ 을 구했다.
      depends_on:
      - 2.M1
      steps:
      - 2b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    [문제 3-3] (20점)
    $\displaystyle\sum_{n=1}^{13}f(n)$ 의 값을 구하시오.
  points: 20
  depends_on: []
  answer:
    kind: value
    value: 13*(sqrt(3)+1)
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: $f(1)=0$ 이므로 $f(3)=\sqrt3f(1)=0$, $f(5)=\sqrt3f(3)=0$, $\cdots$ 따라서 $n$ 이 홀수일 때 $f(n)=0$ 이다.
      source_flow: 모범답안 p.9-15
      criteria:
      - 3.M1
    - id: 3b-2
      content: $\displaystyle\sum_{n=1}^{13}f(n)=f(2)+f(4)+\cdots+f(12)=1+\sqrt3+(\sqrt3)^2+\cdots+(\sqrt3)^5$ 이다.
      source_flow: 모범답안 p.9-15
      criteria:
      - 3.M1
    - id: 3b-3
      content: 등비수열의 합으로 $\dfrac{(\sqrt3)^6-1}{\sqrt3-1}=13(\sqrt3+1)$ 이다.
      source_flow: 모범답안 p.9-15
      criteria:
      - 3.A1
  # 채점기준 미공개 — 단계별 추정
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 12
      evidence: 홀수 $n$ 에서 $f(n)=0$ 이고 짝수 $n$ 에서 $f(2k)=(\sqrt3)^{k-1}$ 임을 이용해 합을 $1+\sqrt3+\cdots+(\sqrt3)^5$ 로 바꾸었다.
      steps:
      - 3b-1
      - 3b-2
    - id: 3.A1
      mark_type: A
      points: 8
      evidence: 등비수열의 합으로 $13(\sqrt3+1)$ 을 구했다.
      depends_on:
      - 3.M1
      steps:
      - 3b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '4'
  stem: |
    [문제 3-4] (20점)
    닫힌구간 $[1,5]$에서 두 곡선 $y=f(x)$와 $y=g(x)$로 둘러싸인 도형의 넓이를 구하시오.
  points: 20
  depends_on: []
  answer:
    kind: value
    value: 2*(1+sqrt(3))/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S4-B
    audience: B
    method_no: 1
    steps:
    - id: 4b-1
      content: 대칭성에 의하여 $x=2$, $x=4$ 를 기준으로 그림의 $A_1=A_2$, $A_3=A_4$ 이다.
      source_flow: 모범답안 p.9-15
      criteria:
      - 4.M1
    - id: 4b-2
      content: $A_1=\displaystyle\int_1^2\{1-(x-2)^2-(x-1)^2\}dx=\dfrac13$ 이고, $A_3=\sqrt3\displaystyle\int_3^4\{1-(x-4)^2-(x-3)^2\}dx=\sqrt3\int_1^2\{1-(x-2)^2-(x-1)^2\}dx=\dfrac{\sqrt3}{3}$ 이다.
      source_flow: 모범답안 p.9-15
      criteria:
      - 4.M1
    - id: 4b-3
      content: 따라서 넓이는 $2\times\dfrac{1+\sqrt3}{3}$ 이다.
      source_flow: 모범답안 p.9-15
      criteria:
      - 4.A1
  # 채점기준 미공개 — 단계별 추정
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
