      steps:
      - 2b-1
    - id: 2.A1
      mark_type: A
      points: 4
      evidence: $\overline{AB}=2$ 로부터 $\log_3(a-2)=1$ 을 풀어 $a=5$ 를 구했다.
      depends_on:
      - 2.M1
