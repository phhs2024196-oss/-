- id: '3'
  stem: |
    [1-3] [10점]
    모든 항이 양수인 등비수열 $\{a_n\}$이 모든 자연수 $n$에 대하여
    $$\log_3a_{n+2}-\log_3a_n=2$$
    를 만족시킨다. $a_2\times a_4\times a_6=3^{15}$일 때, $a_k=3^{46}$인 자연수 $k$의 값을 구하고 그 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '45'
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: $\log_3a_{n+2}-\log_3a_n=2$ 에서 $\log_3\dfrac{a_{n+2}}{a_n}=\log_39$, $a_{n+2}=9a_n$ 이다. 첫째항을 $a_1=a$, 공비를 $r$ 라 하면 $r^2=9$ 이고 모든 항이 양수이므로 $r=3$ 이다.
      source_flow: 예시답안 p.1-3
      criteria:
      - 3.M1
    - id: 3b-2
      content: $a_2\times a_4\times a_6=ar\times ar^3\times ar^5=a^3\cdot3^9=3^{15}$ 에서 $a^3=3^6$, $a=9$ 이다.
      source_flow: 예시답안 p.1-3
      criteria:
      - 3.M1
    - id: 3b-3
      content: $a_k=3^{46}$ 에서 $9\times3^{k-1}=3^{46}$, $3^{k+1}=3^{46}$ 이므로 $k=45$ 이다.
      source_flow: 예시답안 p.1-3
      criteria:
      - 3.A1
