- id: '2'
  stem: |
    [1-2] [10점]
    두 곡선
    $$y=-3^{x-2}+a,\quad y=2^x$$
    이 직선 $y=2$와 만나는 점을 각각 A, B라 하자. $\overline{\text{AB}}=2$일 때, 상수 $a$의 값을 구하고 그 과정을 서술하시오. (단, $a>3$)
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '5'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: $-3^{x-2}+a=2$ 에서 $x=\log_3(a-2)+2$ 이므로 점 A 의 좌표는 $\text{A}(\log_3(a-2)+2,\,2)$ 이고, $2^x=2$ 에서 $x=1$ 이므로 점 B 의 좌표는 $\text{B}(1,\,2)$ 이다.
      source_flow: 예시답안 p.1-3
      criteria:
      - 2.M1
    - id: 2b-2
      content: $\overline{\text{AB}}=2$ 이므로 $\{\log_3(a-2)+2\}-1=2$ 이고 $\log_3(a-2)=1$ 에서 $a-2=3$, $a=5$ 이다.
      source_flow: 예시답안 p.1-3
      criteria:
      - 2.A1
  # 채점기준 미공개 — 단계별 추정
  rubric:
