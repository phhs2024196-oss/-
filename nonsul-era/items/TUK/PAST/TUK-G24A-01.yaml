stem: |
  [문제 1]
subparts:
- id: '1'
  stem: |
    [1-1] [10점]
    다음은 $0\le\theta<2\pi$일 때, $x$에 대한 이차방정식
    $$x^2+(4\sin\theta)x+2\cos\theta+2=0$$
    이 중근을 갖도록 하는 모든 $\theta$의 값을 구하는 과정이다.

    이차방정식 $x^2+(4\sin\theta)x+2\cos\theta+2=0$의 판별식을 $D$라 하면
    이차방정식이 중근을 가져야 하므로
    $$D=(4\sin\theta)^2-4(2\cos\theta+2)=0$$
    이어야 한다. 즉, $2\sin^2\theta-\cos\theta-1=0$
    이고, $\sin^2\theta=1-\cos^2\theta$이므로
    $$2(1-\cos^2\theta)-\cos\theta-1=0$$
    이다. 따라서
    $$(\ \boxed{\text{(가)}}\ )(\cos\theta+1)=0$$
    이므로
    $$\cos\theta=\boxed{\text{(나)}}\ \text{또는}\ \cos\theta=-1$$
    $0\le\theta<2\pi$에서
    $\cos\theta=\boxed{\text{(나)}}$일 때, $\theta=\boxed{\text{(다)}}$ 또는 $\theta=\boxed{\text{(라)}}$이고
    $\cos\theta=-1$일 때, $\theta=\boxed{\text{(마)}}$이다.

    위의 과정에서 (가) ~ (마)에 알맞은 식 또는 값을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 가=2*cos(t)-1; 나=1/2; 다=pi/3; 라=5*pi/3; 마=pi
    equivalents:
    - 가 = 1-2*cos(t) 도 정답
    - 다와 라는 서로 바꾸어도 정답
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: $D=(4\sin\theta)^2-4(2\cos\theta+2)=0$ 에서 $2\sin^2\theta-\cos\theta-1=0$ 이고 $\sin^2\theta=1-\cos^2\theta$ 이므로 $2(1-\cos^2\theta)-\cos\theta-1=0$, 즉 $-(2\cos\theta-1)(\cos\theta+1)=0$ 이다. 따라서 (가) $=2\cos\theta-1$ (또는 $-2\cos\theta+1$).
      source_flow: 예시답안 p.1-3
      criteria:
      - 1.M1
    - id: 1b-2
      content: $\cos\theta=\dfrac12$ 또는 $\cos\theta=-1$ 이므로 (나) $=\dfrac12$. $0\le\theta<2\pi$ 에서 $\cos\theta=\dfrac12$ 일 때 (다) $=\dfrac\pi3$, (라) $=\dfrac{5\pi}3$ (순서 바꾸어도 됨), $\cos\theta=-1$ 일 때 (마) $=\pi$ 이다.
      source_flow: 예시답안 p.1-3
      criteria:
      - 1.A1
