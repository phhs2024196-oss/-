- id: '2'
  stem: |
    [2-2] [10점]
    실수 $a$ $(a>2)$에 대하여 함수
    $$f(x)=-2x^3+3(a+2)x^2-12ax-\dfrac32a^2+18a$$
    의 극댓값을 $g(a)$라 할 때, $\displaystyle\lim_{a\to2+}\dfrac{g'(a)}{a-2}$ 의 값을 구하고 그 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '-3'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: $f'(x)=-6x^2+6(a+2)x-12a=-6(x-2)(x-a)$ 이므로 $f'(x)=0$ 인 $x$ 는 $x=2$ 또는 $x=a$ 이다. $a>2$ 이므로 증감표에서 $x=a$ 에서 극대이고 극댓값은 $f(a)=a^3-\dfrac{15}2a^2+18a=g(a)$ 이다.
      source_flow: 예시답안 p.4-6
      criteria:
      - 2.M1
    - id: 2b-2
      content: $g'(a)=3a^2-15a+18=3(a-2)(a-3)$ 이므로 $\displaystyle\lim_{a\to2+}\dfrac{g'(a)}{a-2}=\lim_{a\to2+}3(a-3)=-3$ 이다.
      source_flow: 예시답안 p.4-6
      criteria:
      - 2.A1
  # 채점기준 미공개 — 단계별 추정
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 6
      evidence: $f'(x)=-6(x-2)(x-a)$ 와 증감표로 $x=a$ 에서 극대임을 밝히고 $g(a)=a^3-\dfrac{15}2a^2+18a$ 를 구했다.
      steps:
      - 2b-1
    - id: 2.A1
      mark_type: A
      points: 4
      evidence: $g'(a)=3(a-2)(a-3)$ 을 구하고 극한값 $-3$ 을 계산했다.
      depends_on:
      - 2.M1
      steps:
      - 2b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    [2-3] [10점]
    수직선 위를 움직이는 점 P의 시각 $t$ $(t\ge0)$에서의 속도 $v(t)$와 가속도 $a(t)$가 다음 조건을 만족시킨다.
    (가) $0\le t\le1$일 때, $v(t)=t^3-t$이다.
    (나) $t\ge1$일 때, $a(t)=2t+1$이다.
    시각 $t=0$에서 $t=2$까지 점 P가 움직인 거리를 구하고 그 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 25/12
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: (가)에서 $v(1)=0$. (나)에서 $t\ge1$ 일 때 $a(t)=2t+1$ 이므로 $v(t)=t^2+t+C$ ($C$ 는 적분상수)이고 $v(1)=2+C$ 이다. 따라서 $2+C=0$ 에서 $C=-2$, $v(t)=\begin{cases}t^3-t&(0\le t\le1)\\t^2+t-2&(t\ge1)\end{cases}$ 이다.
      source_flow: 예시답안 p.4-6
      criteria:
      - 3.M1
    - id: 3b-2
      content: 움직인 거리를 $s$ 라 하면 $s=\displaystyle\int_0^2|v(t)|dt=\int_0^1(-t^3+t)dt+\int_1^2(t^2+t-2)dt=\dfrac14+\dfrac{11}6=\dfrac{25}{12}$ 이다.
      source_flow: 예시답안 p.4-6
      criteria:
      - 3.A1
  # 채점기준 미공개 — 단계별 추정
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 6
      evidence: $v(1)=0$ 과 적분으로 $t\ge1$ 에서 $v(t)=t^2+t-2$ 를 구했다.
      steps:
      - 3b-1
    - id: 3.A1
      mark_type: A
      points: 4
      evidence: 구간별 부호를 확인하여 $\int_0^2|v(t)|dt=\dfrac{25}{12}$ 를 계산했다.
      depends_on:
      - 3.M1
      steps:
      - 3b-2
