subparts:
- id: '1'
  stem: |
    [2-1] [10점]
    이차함수 $f(x)$가 다음 조건을 만족시킬 때, $f(1)$의 값을 구하고 그 과정을 서술하시오.
    (가) $\displaystyle\lim_{x\to\infty}\dfrac{\{f(x)\}^2}{2x^2f(x)+3f(x^2)}=2$
    (나) $\displaystyle\lim_{x\to0}\dfrac{f(x)}{x}=3$
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '13'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: $f(x)=ax^2+bx+c$ (단, $a,b,c$ 는 상수, $a\neq0$)라 하자. (가)에서 분모·분자의 최고차항을 비교하면 $\dfrac{a^2}{5a}=\dfrac a5=2$ 에서 $a=10$ 이다.
      source_flow: 예시답안 p.4-6
      criteria:
      - 1.M1
    - id: 1b-2
      content: (나)에서 $x\to0$ 일 때 (분모)$\to0$ 이고 극한값이 존재하므로 (분자)$\to0$ 이어야 한다. 즉 $\displaystyle\lim_{x\to0}f(x)=f(0)=c=0$ 이다.
      source_flow: 예시답안 p.4-6
      criteria:
      - 1.M1
    - id: 1b-3
      content: $f(x)=10x^2+bx$ 이고 $\displaystyle\lim_{x\to0}\dfrac{f(x)}x=\lim_{x\to0}(10x+b)=b=3$ 이므로 $f(x)=10x^2+3x$, 따라서 $f(1)=13$ 이다.
      source_flow: 예시답안 p.4-6
      criteria:
      - 1.A1
  # 채점기준 미공개 — 단계별 추정
