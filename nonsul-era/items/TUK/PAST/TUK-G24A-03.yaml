      mark_type: A
      points: 4
      evidence: $y=x$ 대칭으로 $\int_0^1\{1-f(x)\}dx$ 를 세워 $\dfrac{13}{12}$ 을 계산했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-3
