  misconceptions: []
- id: '3'
  stem: |
    [3-3] [15점]
    $a>0$인 실수 $a$에 대하여 함수 $f(x)$를
    $$f(x)=\begin{cases}x^2+ax&(x<0)\\-x^2+ax&(x\ge0)\end{cases}$$
    이라 하자. $\displaystyle\int_{-a}^a|f'(x)|\,dx=1$일 때, $\displaystyle\lim_{h\to0}\dfrac{f(-a+2h)-f(a-h)}{h}$ 의 값을 구하고 그 과정을 서술하시오.
  points: 15
  depends_on: []
  answer:
    kind: value
    value: '-3'
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: $\displaystyle\lim_{h\to0-}\dfrac{f(0+h)-f(0)}h=a$, $\displaystyle\lim_{h\to0+}\dfrac{f(0+h)-f(0)}h=a$ 이므로 $f(x)$ 는 $x=0$ 에서 미분가능하고 $f'(x)=\begin{cases}2x+a&(x<0)\\-2x+a&(x\ge0)\end{cases}$ 이다.
      source_flow: 예시답안 p.7-9
      criteria:
      - 3.M1
    - id: 3b-2
      content: $\displaystyle\int_{-a}^a|f'(x)|dx$ 는 그림과 같이 $x$축과 $y$축과 직선 $y=-2x+a$ 로 이루어진 삼각형 넓이의 $4$배이므로 $4\left(\dfrac12\times\dfrac a2\times a\right)=a^2=1$ 에서 $a=1$ $(a>0)$ 이다. 이때 $f(x)=\begin{cases}x^2+x&(x<0)\\-x^2+x&(x\ge0)\end{cases}$, $f'(x)=\begin{cases}2x+1&(x<0)\\-2x+1&(x\ge0)\end{cases}$ 이다.
      source_flow: 예시답안 p.7-9
      criteria:
      - 3.M1
    - id: 3b-3
      content: $f(-1)=f(1)=0$ 이므로 $\displaystyle\lim_{h\to0}\dfrac{f(-1+2h)-f(1-h)}h=\lim_{h\to0}\dfrac{f(-1+2h)-f(-1)}h+\lim_{h\to0}\dfrac{f(1-h)-f(1)}{-h}=2f'(-1)+f'(1)$ 이고 $f'(-1)=-1$, $f'(1)=-1$ 이므로 값은 $-3$ 이다.
      source_flow: 예시답안 p.7-9
      criteria:
      - 3.A1
  # 채점기준 미공개 — 단계별 추정
