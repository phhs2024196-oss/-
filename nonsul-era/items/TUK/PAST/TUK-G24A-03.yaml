      mark_type: M
      points: 9
      evidence: $x=0$ 에서 미분가능함을 보이고 $\int|f'|$ 를 삼각형 넓이의 $4$배로 계산해 $a=1$ 을 구했다.
      steps:
      - 3b-1
      - 3b-2
    - id: 3.A1
      mark_type: A
      points: 6
      evidence: 극한을 $2f'(-1)+f'(1)$ 로 변형하고 $f'(-1)=f'(1)=-1$ 로 $-3$ 을 구했다.
      depends_on:
      - 3.M1
      steps:
      - 3b-3
