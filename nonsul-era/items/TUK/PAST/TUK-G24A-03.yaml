- id: '2'
  stem: |
    [3-2] [15점]
    이차함수 $f(x)=ax^2+bx+c$가 다음 조건을 만족시킨다.
    (가) 모든 실수 $x$에 대하여 $ax^4+bx^2+c=\displaystyle\int_0^x(x^2+2t)f'(t)\,dt$이다.
    (나) $(a+b)^2=4$
    $f(1)>0$일 때, $f'(1)$의 값을 구하고 그 과정을 서술하시오. (단, $a,b,c$는 상수이다.)
  points: 15
  depends_on: []
  answer:
    kind: value
    value: '-4'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: (가)에 $x=0$ 을 대입하면 $c=0$ 이므로 $f(x)=ax^2+bx$, $f'(x)=2ax+b$ 이다.
      source_flow: 예시답안 p.7-9
      criteria:
      - 2.M1
    - id: 2b-2
      content: $\displaystyle\int_0^x(x^2+2t)(2at+b)dt=ax^4+\left(\dfrac{4a}3+b\right)x^3+bx^2$ 이고 이것이 $ax^4+bx^2$ 과 모든 실수 $x$ 에서 같으므로 $b=-\dfrac43a$ 이다.
      source_flow: 예시답안 p.7-9
      criteria:
      - 2.M1
    - id: 2b-3
      content: (나)에서 $a+b=-2$ 또는 $a+b=2$. $a+b=-2$ 이면 $a=6$, $b=-8$, $f(1)=-2$ 로 $f(1)>0$ 에 모순이다. $a+b=2$ 이면 $a=-6$, $b=8$, $f(x)=-6x^2+8x$, $f(1)=2>0$ 이므로 $f'(x)=-12x+8$, $f'(1)=-4$ 이다.
      source_flow: 예시답안 p.7-9
      criteria:
      - 2.A1
  # 채점기준 미공개 — 단계별 추정
  rubric:
