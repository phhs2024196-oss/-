    criteria:
    - id: 1.M1
      mark_type: M
      points: 6
      evidence: $f$ 가 증가함수여서 역함수가 존재함을 밝히고 $g(-1)=0$, $f(1)=1$ 을 구했다.
      steps:
      - 1b-1
      - 1b-2
