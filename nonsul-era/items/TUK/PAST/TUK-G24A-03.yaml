      mark_type: M
      points: 9
      evidence: $x=0$ 대입으로 $c=0$ 을 얻고 적분을 계산하여 $b=-\dfrac43a$ 를 구했다.
      steps:
      - 2b-1
      - 2b-2
    - id: 2.A1
      mark_type: A
      points: 6
      evidence: (나)와 $f(1)>0$ 으로 $a=-6$, $b=8$ 을 가려 $f'(1)=-4$ 를 구했다.
      depends_on:
      - 2.M1
      steps:
      - 2b-3
