subparts:
- id: '1'
  stem: |
    [3-1] [10점]
    함수 $f(x)=x^3-x^2+2x-1$의 역함수를 $g(x)$라 할 때, $\displaystyle\int_{-1}^1g(x)\,dx$ 의 값을 구하고 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 13/12
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: $f'(x)=3x^2-2x+2=3\left(x-\dfrac13\right)^2+\dfrac53>0$ 이므로 $f(x)$ 는 증가하여 역함수 $g(x)$ 가 존재한다. $f(0)=-1$ 이므로 $g(-1)=0$ 이고, $f(x)=x$ 에서 $(x-1)(x^2+1)=0$, 곡선 $y=f(x)$ 와 직선 $y=x$ 의 교점의 $x$좌표는 $x=1$ 이다.
      source_flow: 예시답안 p.7-9
      criteria:
      - 1.M1
    - id: 1b-2
      content: $\displaystyle\int_{-1}^1g(x)dx$ 는 곡선 $y=g(x)$ 와 $x$축 및 직선 $x=1$ 로 둘러싸인 부분의 넓이이고, $y=x$ 에 대한 대칭에 의하여 곡선 $y=f(x)$ 와 $y$축 및 직선 $y=1$ 로 둘러싸인 부분의 넓이와 같다.
      source_flow: 예시답안 p.7-9
      criteria:
      - 1.M1
    - id: 1b-3
      content: 따라서 $\displaystyle\int_{-1}^1g(x)dx=\int_0^1\{1-f(x)\}dx=\int_0^1(-x^3+x^2-2x+2)dx=\dfrac{13}{12}$ 이다.
      source_flow: 예시답안 p.7-9
      criteria:
      - 1.A1
  # 채점기준 미공개 — 단계별 추정
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
