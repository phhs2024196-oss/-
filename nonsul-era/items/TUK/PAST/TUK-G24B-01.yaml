- id: '2'
  stem: |
    [1-2] [10점]
    두 곡선
    $$y=\log_3(-x),\quad y=\log_{\frac13}x+a$$
    가 직선 $y=2$와 만나는 점을 각각 A, B라 하자. $\overline{\text{AB}}=18$일 때, 상수 $a$의 값을 구하고 그 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '4'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: $\log_3(-x)=2$ 에서 $x=-9$ 이므로 점 A 의 좌표는 $\text{A}(-9,\,2)$ 이다. $\log_{\frac13}x+a=2$ 에서 $\log_{\frac13}x=2-a$, $x=\left(\dfrac13\right)^{2-a}=3^{a-2}$ 이므로 점 B 의 좌표는 $\text{B}\left(3^{a-2},\,2\right)$ 이다.
      source_flow: 예시답안 p.1-3
      criteria:
      - 2.M1
    - id: 2b-2
      content: $\overline{\text{AB}}=18$ 이므로 $3^{a-2}+9=18$, $3^{a-2}=9=3^2$ 에서 $a=4$ 이다.
      source_flow: 예시답안 p.1-3
      criteria:
      - 2.A1
