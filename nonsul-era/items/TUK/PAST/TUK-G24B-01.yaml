- id: '3'
  stem: |
    [1-3] [10점]
    모든 항이 양수인 등비수열 $\{a_n\}$이 모든 자연수 $n$에 대하여
    $$2^{a_{n+2}}=16^{a_n}$$
    을 만족시킨다. 수열 $\{a_n\}$의 첫째항부터 제 $n$항까지의 합을 $S_n$이라 하자. $S_8-S_4=160$일 때, $a_5$의 값을 구하고 그 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 32/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: $2^{a_{n+2}}=16^{a_n}=(2^4)^{a_n}=2^{4a_n}$ 에서 $a_{n+2}=4a_n$ 이다. 첫째항을 $a_1=a$, 공비를 $r$ 라 하면 $r^2=4$ 이고 모든 항이 양수이므로 $r=2$ 이다.
      source_flow: 예시답안 p.1-3
      criteria:
      - 3.M1
    - id: 3b-2
      content: $S_8-S_4=\dfrac{a(2^8-1)}{2-1}-\dfrac{a(2^4-1)}{2-1}=a(2^8-2^4)=160$ 에서 $a=\dfrac23$ 이다. 따라서 $a_5=ar^4=\dfrac23\times2^4=\dfrac{32}3$ 이다.
      source_flow: 예시답안 p.1-3
      criteria:
      - 3.A1
  # 채점기준 미공개 — 단계별 추정
