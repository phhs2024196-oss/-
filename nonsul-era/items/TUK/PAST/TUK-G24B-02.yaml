subparts:
- id: '1'
  stem: |
    [2-1] [10점]
    서로 다른 두 상수 $a,b$에 대하여 함수 $f(x)=x^3-\dfrac32x^2-3x+4$가
    $$\lim_{h\to0}\dfrac{f(a+3h)-f(a)}h=\lim_{h\to0}\dfrac{f(b)-f(b-3h)}h=9$$
    를 만족시킬 때, 곡선 $y=f(x)$ 위의 점 $(a+b,\,f(a+b))$에서의 접선의 방정식을 구하고 그 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: expression
    value: y = -3*x + 7/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: $\displaystyle\lim_{h\to0}\dfrac{f(a+3h)-f(a)}h=3f'(a)=9$ 에서 $f'(a)=3$, $\displaystyle\lim_{h\to0}\dfrac{f(b)-f(b-3h)}h=3f'(b)=9$ 에서 $f'(b)=3$ 이다. $f'(x)=3x^2-3x-3$ 이므로 $a,b$ 는 $3x^2-3x-3=3$ 의 서로 다른 두 실근이다.
      source_flow: 예시답안 p.4-6
      criteria:
      - 1.M1
    - id: 1b-2
      content: $3x^2-3x-6=3(x+1)(x-2)=0$ 에서 $x=-1$ 또는 $x=2$ 이므로 $a+b=1$ 이다.
      source_flow: 예시답안 p.4-6
      criteria:
      - 1.M1
    - id: 1b-3
      content: $f(a+b)=f(1)=\dfrac12$, $f'(a+b)=f'(1)=-3$ 이므로 접선의 방정식은 $y-\dfrac12=-3(x-1)$, 즉 $y=-3x+\dfrac72$ 이다.
      source_flow: 예시답안 p.4-6
      criteria:
      - 1.A1
  # 채점기준 미공개 — 단계별 추정
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
