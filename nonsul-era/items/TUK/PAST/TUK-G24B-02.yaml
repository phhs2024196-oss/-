  misconceptions: []
- id: '2'
  stem: |
    [2-2] [10점]
    실수 $a$ $(a>1)$에 대하여 함수
    $$f(x)=x^3-\dfrac32(a+1)x^2+3ax-\dfrac94a^2+3a$$
    의 극솟값을 $g(a)$라 할 때, $\displaystyle\lim_{a\to1+}\dfrac{g'(a)}{a-1}$ 의 값을 구하고 그 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: -9/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: $f'(x)=3x^2-3(a+1)x+3a=3(x-1)(x-a)$ 이므로 $f'(x)=0$ 인 $x$ 의 값은 $x=1$ 또는 $x=a$ 이다. $a>1$ 이므로 증감표에서 $x=a$ 에서 극소이고 극솟값은 $f(a)=-\dfrac{a^3}2-\dfrac34a^2+3a=g(a)$ 이다.
      source_flow: 예시답안 p.4-6
      criteria:
      - 2.M1
    - id: 2b-2
      content: $g'(a)=-\dfrac32a^2-\dfrac32a+3=-\dfrac32(a+2)(a-1)$ 이므로 $\displaystyle\lim_{a\to1+}\dfrac{g'(a)}{a-1}=-\dfrac32\lim_{a\to1+}(a+2)=-\dfrac92$ 이다.
      source_flow: 예시답안 p.4-6
      criteria:
      - 2.A1
  # 채점기준 미공개 — 단계별 추정
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 6
      evidence: $f'(x)=3(x-1)(x-a)$ 와 증감표로 $x=a$ 에서 극소임을 밝히고 $g(a)=-\dfrac{a^3}2-\dfrac34a^2+3a$ 를 구했다.
      steps:
      - 2b-1
    - id: 2.A1
      mark_type: A
      points: 4
      evidence: $g'(a)=-\dfrac32(a+2)(a-1)$ 을 구하고 극한값 $-\dfrac92$ 를 계산했다.
      depends_on:
      - 2.M1
      steps:
      - 2b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    [2-3] [10점]
    두 점 P, Q는 시각 $t=0$일 때 동시에 원점을 출발하여 수직선 위를 움직인다.
    두 점 P, Q의 시각 $t$ $(t\ge0)$에서의 속도가 각각
    $$v_1(t)=3t^2-11t+8,\quad v_2(t)=-3t^2+5t$$
    이다. 점 P가 출발한 후 점 Q와 만날 때까지 점 P가 움직인 거리를 구하고 그 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '5'
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: 시각 $t$ 에서 P, Q 의 위치를 $x_1(t)$, $x_2(t)$ 라 하면 $x_1(t)=t^3-\dfrac{11}2t^2+8t+C_1$, $x_2(t)=-t^3+\dfrac52t^2+C_2$ 이고 $x_1(0)=x_2(0)=0$ 이므로 $C_1=C_2=0$ 이다. 만나는 시각 $t$ $(t>0)$ 는 $2t^3-8t^2+8t=2t(t-2)^2=0$ 에서 $t=2$ 이다.
      source_flow: 예시답안 p.4-6
      criteria:
      - 3.M1
    - id: 3b-2
      content: $v_1(t)=(t-1)(3t-8)$ 이므로 $0\le t\le1$ 일 때 $v_1(t)\ge0$, $1\le t\le2$ 일 때 $v_1(t)\le0$ 이다.
      source_flow: 예시답안 p.4-6
      criteria:
      - 3.M1
    - id: 3b-3
      content: 움직인 거리 $s=\displaystyle\int_0^2|v_1(t)|dt=\int_0^1(3t^2-11t+8)dt+\int_1^2(-3t^2+11t-8)dt=\dfrac72+\dfrac32=5$ 이다.
      source_flow: 예시답안 p.4-6
      criteria:
      - 3.A1
  # 채점기준 미공개 — 단계별 추정
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 6
      evidence: 위치 $x_1(t)$, $x_2(t)$ 를 구하고 만나는 시각 $t=2$ 를 구했다.
      steps:
      - 3b-1
      - 3b-2
    - id: 3.A1
      mark_type: A
      points: 4
      evidence: $v_1$ 의 부호 변화를 구간으로 나누어 $\int_0^2|v_1|dt=5$ 를 계산했다.
      depends_on:
      - 3.M1
      steps:
      - 3b-3
