      steps:
      - 1b-1
      - 1b-2
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: $f(1)=\dfrac12$, $f'(1)=-3$ 으로 접선 $y=-3x+\dfrac72$ 를 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-3
  outcome_codes:
