      steps:
      - 3b-1
      - 3b-2
    - id: 3.A1
      mark_type: A
      points: 6
      evidence: $(a-3)(a+1)^3=0$ 에서 $a=3$ 을 구하고 $f'(3)=8$ 을 얻었다.
      depends_on:
      - 3.M1
      steps:
      - 3b-3
