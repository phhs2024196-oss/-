subparts:
- id: '1'
  stem: |
    [3-1] [10점]
    함수 $f(x)=x^2+2$ $(x\ge0)$의 역함수를 $g(x)$라 할 때, 곡선 $y=g(x)$와 직선 $y=\dfrac13(x-2)$로 둘러싸인 부분의 넓이를 구하고 그 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 9/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: 함수 $y=\dfrac13(x-2)$ 의 역함수는 $y=3x+2$ 이다. 함수 $y=f(x)$ 의 그래프와 그 역함수 $y=g(x)$ 의 그래프는 직선 $y=x$ 에 대하여 대칭이므로 구하는 넓이는 곡선 $y=f(x)$ 와 직선 $y=3x+2$ 로 둘러싸인 부분의 넓이와 같다.
      source_flow: 예시답안 p.7-10
      criteria:
      - 1.M1
    - id: 1b-2
      content: 교점의 $x$좌표는 $x^2+2=3x+2$, $x(x-3)=0$ 에서 $x=0$ 또는 $x=3$ 이다. 따라서 구하는 넓이는 $\displaystyle\int_0^3\{(3x+2)-(x^2+2)\}dx=\int_0^3(-x^2+3x)dx=\dfrac92$ 이다.
      source_flow: 예시답안 p.7-10
      criteria:
      - 1.A1
  # 채점기준 미공개 — 단계별 추정
