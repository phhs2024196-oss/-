- id: '2'
  stem: |
    [3-2] [15점]
    다항함수 $f(x)$가 다음 조건을 만족시킨다.
    (가) 함수 $f(x)$의 한 부정적분을 $F(x)$라 할 때, 모든 실수 $x$에 대하여 $\displaystyle\int_0^xtf'(t)\,dt=2F(x)+kx$이다. (단, $k$는 상수이다.)
    (나) 함수 $f(x)$의 최솟값은 $-3$이다.
    $f(1)\ge0$일 때, $\displaystyle\int_0^1f(x)\,dx$ 의 최솟값을 구하고 그 과정을 서술하시오.
  points: 15
  depends_on: []
  answer:
    kind: value
    value: '-2'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: (가)의 양변을 $x$ 에 대하여 미분하면 $xf'(x)=2f(x)+k$ …㉠. 다항함수 $f(x)$ 의 최고차항을 $ax^n$ $(a\neq0)$ 라 하면 ㉠의 양변의 최고차항이 같아야 하므로 $nax^n=2ax^n$ 에서 $n=2$, 즉 $f(x)$ 는 이차함수이다.
      source_flow: 예시답안 p.7-10
      criteria:
      - 2.M1
    - id: 2b-2
      content: $f(x)=ax^2+bx+c$ 라 하면 ㉠에서 $2ax^2+bx=2ax^2+2bx+2c+k$ 가 모든 $x$ 에서 성립하므로 $b=2b$, $2c+k=0$ 이다. 따라서 $b=0$, $c=-\dfrac k2$ 이고 $f(x)=ax^2-\dfrac k2$ 이다. (나)에서 최솟값이 $-3$ 이므로 $a>0$ 이고 $-\dfrac k2=-3$, $k=6$, $f(x)=ax^2-3$ 이다.
      source_flow: 예시답안 p.7-10
      criteria:
      - 2.M1
    - id: 2b-3
      content: $f(1)\ge0$ 이므로 $a-3\ge0$, $a\ge3$ 이다. $\displaystyle\int_0^1f(x)dx=\int_0^1(ax^2-3)dx=\dfrac a3-3$ 이므로 최솟값은 $a=3$ 일 때 $-2$ 이다.
      source_flow: 예시답안 p.7-10
      criteria:
      - 2.A1
  # 채점기준 미공개 — 단계별 추정
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 9
      evidence: (가)를 미분하여 $xf'(x)=2f(x)+k$ 를 얻고 최고차항 비교로 $f$ 가 이차함수임을 보였다.
      steps:
      - 2b-1
      - 2b-2
    - id: 2.A1
      mark_type: A
      points: 6
      evidence: 계수 비교와 (나)로 $f(x)=ax^2-3$, $a\ge3$ 을 구하고 $\int_0^1f(x)dx$ 의 최솟값 $-2$ 를 얻었다.
      depends_on:
      - 2.M1
      steps:
      - 2b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    [3-3] [15점]
    $a>1$인 상수 $a$에 대하여 다항함수 $f(x)$가 다음 조건을 만족시킬 때, $f'(a)$의 값을 구하고 그 과정을 서술하시오.
    (가) $\displaystyle\lim_{x\to\infty}\dfrac{f(x)-x^3}{x^2}=-a$
    (나) $\displaystyle\lim_{x\to0}\dfrac{f(x)-a}{x}=-1$
    (다) $\displaystyle\int_{-1}^1f(x)\,dx=\int_1^a|f(x)|\,dx$
  points: 15
  depends_on: []
  answer:
    kind: value
    value: '8'
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: (가)에서 $f(x)$ 의 최고차항은 $x^3$ 이고 이차항의 계수는 $-a$ 이다. $f(x)=x^3-ax^2+bx+c$ 라 하면 $f'(x)=3x^2-2ax+b$ …㉠. (나)에서 $x\to0$ 일 때 (분모)$\to0$ 이므로 (분자)$\to0$ 이어야 하여 $f(0)=a$, 즉 $c=a$ 이고 $f'(0)=-1$ 이므로 $b=-1$ 이다. 따라서 $f(x)=x^3-ax^2-x+a=(x+1)(x-1)(x-a)$, $f'(x)=3x^2-2ax-1$ 이다.
      source_flow: 예시답안 p.7-10
      criteria:
      - 3.M1
    - id: 3b-2
      content: $1\le x\le a$ 에서 $f(x)\le0$ 이므로 $\displaystyle\int_1^a|f(x)|dx=-\int_1^af(x)dx$ 이고, (다)에서 $\displaystyle\int_{-1}^1f(x)dx+\int_1^af(x)dx=0$, 즉 $\displaystyle\int_{-1}^af(x)dx=0$ 이다.
      source_flow: 예시답안 p.7-10
      criteria:
      - 3.M1
    - id: 3b-3
      content: $\displaystyle\int_{-1}^a(x^3-ax^2-x+a)dx=-\dfrac1{12}a^4+\dfrac12a^2+\dfrac23a+\dfrac14=0$ 에서 $a^4-6a^2-8a-3=0$, $(a-3)(a+1)^3=0$ 이므로 $a=3$ $(a>1)$ 이다. 따라서 $f'(x)=3x^2-6x-1$ 이고 $f'(3)=8$ 이다.
      source_flow: 예시답안 p.7-10
      criteria:
      - 3.A1
  # 채점기준 미공개 — 단계별 추정
