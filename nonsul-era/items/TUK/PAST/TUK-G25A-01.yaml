stem: 문제1 [10점]
subparts:
- id: '1'
  stem: |
    문제1 [10점]
    함수 $f(x)=a\sin bx+c$는 주기가 $\dfrac{\pi}{2}$이고 최댓값은 7, 최솟값은 3이다. 다음은 함수 $f(x)$에 대하여 세 상수 $a,b,c$의 값을 구하는 과정이다. ⑴ ~ ⑸ 에 알맞은 식 또는 수를 구하시오. (단, $a>0$, $b>0$)

    함수 $f(x)$는 주기가 $\dfrac{\pi}{2}$이므로 $b=$ ⑴ 이다.
    함수 $f(x)=a\sin bx+c$의 최댓값과 최솟값을 $a$와 $c$에 대한 식으로 나타내면
    최댓값은 ⑵ 이고 최솟값은 ⑶ 이므로
    $a=$ ⑷ , $c=$ ⑸ 이다.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: ⑴=4; ⑵=a+c; ⑶=-a+c; ⑷=2; ⑸=5
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: 함수 $f(x)$의 주기가 $\dfrac{\pi}{2}$이고 $b>0$이므로 $\dfrac{2\pi}{b}=\dfrac{\pi}{2}$, 즉 $b=4$이다. (⑴ 4)
      source_flow: 예시답안 문항카드 1 p.27
      criteria:
      - 1.B1
    - id: 1b-2
      content: $a>0$이므로 $f(x)=a\sin4x+c$의 최댓값은 $a+c$, 최솟값은 $-a+c$이다. (⑵ $a+c$, ⑶ $-a+c$)
      source_flow: 예시답안 문항카드 1 p.27
      criteria:
      - 1.B2
      - 1.B3
    - id: 1b-3
      content: $a+c=7$, $-a+c=3$을 연립하면 $a=2$, $c=5$이다. (⑷ 2, ⑸ 5)
      source_flow: 예시답안 문항카드 1 p.27
      criteria:
      - 1.B4
      - 1.B5
