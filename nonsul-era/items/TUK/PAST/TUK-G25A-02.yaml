stem: 문제2 [10점]
subparts:
- id: '1'
  stem: |
    문제2 [10점]
    1이 아닌 서로 다른 두 양수 $a,b$에 대하여
    $$2\log_a b:\log_a b+1=1:\log_a b$$
    일 때, $\log_a b+\log_b a$의 값을 구하고 그 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: -5/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: $2\log_a b:\log_a b+1=1:\log_a b$에서 $2(\log_a b)^2=\log_a b+1$, 즉 $2(\log_a b)^2-\log_a b-1=0$, $(2\log_a b+1)(\log_a b-1)=0$이다.
      source_flow: 예시답안 문항카드 2 p.29
      criteria:
      - 1.M1
    - id: 1b-2
      content: $\log_a b=-\dfrac12$ 또는 $\log_a b=1$이고 $a\ne b$이므로 $\log_a b=-\dfrac12$이다.
      source_flow: 예시답안 문항카드 2 p.29
      criteria:
      - 1.A1
    - id: 1b-3
      content: $\log_a b+\log_b a=\log_a b+\dfrac{1}{\log_a b}=\left(-\dfrac12\right)+(-2)=-\dfrac52$
      source_flow: 예시답안 문항카드 2 p.29
      criteria:
      - 1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: 비례식을 이용해 $2(\log_a b)^2-\log_a b-1=0$을 구했다.
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: $a\ne b$이므로 $\log_a b=-\dfrac12$을 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: $\log_a b+\log_b a=-\dfrac52$를 구했다.
      depends_on:
      - 1.A1
      - 1.M1
      steps:
      - 1b-3
