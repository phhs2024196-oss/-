      - 1b-2
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: $\dfrac{a_3}{a_5}=\dfrac{1}{r^2}=\left(\dfrac1r\right)^2=4^2=16$을 구했다.
      depends_on:
      - 1.A1
      - 1.M1
      steps:
      - 1b-3
