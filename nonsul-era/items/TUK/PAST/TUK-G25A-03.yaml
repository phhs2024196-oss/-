stem: 문제3 [10점]
subparts:
- id: '1'
  stem: |
    문제3 [10점]
    모든 항이 양수인 등비수열 $\{a_n\}$에 대하여 $\dfrac{5a_2}{a_3+a_4}=16$일 때, $\dfrac{a_3}{a_5}$의 값을 구하고 그 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '16'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |-
        등비수열 $\{a_n\}$의 첫째항을 $a$, 공비를 $r$이라 하면 수열의 모든 항이 양수이므로 $r>0$이다.
        $$\dfrac{5a_2}{a_3+a_4}=\dfrac{5ar}{ar^2+ar^3}=\dfrac{5}{r+r^2}=16$$
      source_flow: 예시답안 문항카드 3 p.31
      criteria:
      - 1.M1
    - id: 1b-2
      content: $16r^2+16r-5=0$, $(4r-1)(4r+5)=0$에서 $r=\dfrac14$ 또는 $r=-\dfrac54$이고 $r>0$이므로 $r=\dfrac14$이다.
      source_flow: 예시답안 문항카드 3 p.31
      criteria:
      - 1.A1
    - id: 1b-3
      content: $\dfrac{a_3}{a_5}=\dfrac{1}{r^2}=\left(\dfrac1r\right)^2=4^2=16$
      source_flow: 예시답안 문항카드 3 p.31
      criteria:
      - 1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: $\dfrac{5}{r+r^2}=16$을 구했다.
      steps:
