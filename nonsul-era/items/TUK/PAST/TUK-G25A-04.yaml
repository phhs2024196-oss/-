subparts:
- id: '1'
  stem: |
    문제4 [10점]
    두 함수 $y=\left(\dfrac14\right)^{x-1}-1$, $y=2^x+k$의 그래프가 제1사분면에서 만나도록 하는 모든 실수 $k$의 값의 범위가 $\alpha<k<\beta$일 때, $\log_{\sqrt2}(\beta-\alpha)$의 값을 구하고 그 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '4'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: $y=\left(\dfrac14\right)^{x-1}-1$의 그래프는 제1사분면에서 점 $(1,0)$과 점 $(0,3)$ 사이에 있다. 함수 $y=2^x+k$의 그래프가 점 $(1,0)$을 지날 때 $k=-2$이다.
      source_flow: 예시답안 문항카드 4 p.33
      criteria:
      - 1.M1
    - id: 1b-2
      content: 함수 $y=2^x+k$의 그래프가 점 $(0,3)$을 지날 때 $k=2$이다.
      source_flow: 예시답안 문항카드 4 p.33
      criteria:
      - 1.M2
    - id: 1b-3
      content: 따라서 두 함수의 그래프가 제1사분면에서 만나도록 하는 모든 $k$의 값의 범위는 $-2<k<2$이다.
      source_flow: 예시답안 문항카드 4 p.33
      criteria:
      - 1.A1
    - id: 1b-4
      content: $\alpha=-2$, $\beta=2$이므로 $\log_{\sqrt2}(\beta-\alpha)=2\log_2 4=4$
      source_flow: 예시답안 문항카드 4 p.33
      criteria:
      - 1.A2
