stem: 문제5 [10점]
subparts:
- id: '1'
  stem: |
    문제5 [10점]
    두 다항함수 $f(x),g(x)$가 다음 조건을 만족시킨다.

    (가) $\lim_{x\to1}\dfrac{f(x)-g(x)}{x-1}=0$
    (나) $f(x)g(x)=x^3-4x^2+x+6$

    $f'(1)$의 값을 구하고 그 과정을 서술하시오. (단, $f(1)>0$)
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '-1'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: 조건 (가)에서 $\lim_{x\to1}(x-1)=0$이므로 $\lim_{x\to1}\{f(x)-g(x)\}=0$, $f(1)-g(1)=0$에서 $f(1)=g(1)$이다. ……㉠
      source_flow: 예시답안 문항카드 5 p.36
      criteria:
      - 1.M1
    - id: 1b-2
      content: $\lim_{x\to1}\dfrac{f(x)-g(x)}{x-1}=\lim_{x\to1}\dfrac{f(x)-f(1)-g(x)+g(1)}{x-1}=\lim_{x\to1}\dfrac{f(x)-f(1)}{x-1}-\lim_{x\to1}\dfrac{g(x)-g(1)}{x-1}=f'(1)-g'(1)=0$에서 $f'(1)=g'(1)$이다. ……㉡
      source_flow: 예시답안 문항카드 5 p.36
      criteria:
      - 1.M2
    - id: 1b-3
      content: 조건 (나)의 양변에 $x=1$을 대입하면 $f(1)g(1)=4$이고, ㉠에 의하여 $\{f(1)\}^2=4$, $f(1)>0$이므로 $f(1)=2$이다. ……㉢
      source_flow: 예시답안 문항카드 5 p.36
      criteria:
      - 1.A1
    - id: 1b-4
      content: 조건 (나)의 양변을 $x$에 대하여 미분하면 $f'(x)g(x)+f(x)g'(x)=3x^2-8x+1$이고, $x=1$을 대입하면 $f'(1)g(1)+f(1)g'(1)=-4$이다. ㉠, ㉡에 의하여 $2f'(1)f(1)=-4$이고 ㉢에 의하여 $f'(1)=-1$이다.
      source_flow: 예시답안 문항카드 5 p.36
      criteria:
      - 1.A2
