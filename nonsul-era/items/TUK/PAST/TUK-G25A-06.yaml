stem: 문제6 [10점]
subparts:
- id: '1'
  stem: |
    문제6 [10점]
    서로 다른 두 양수 $a,b$에 대하여 함수 $f(x)$가
    $$f(x)=\begin{cases}-x-a&(x<1)\\2a&(x=1)\\bx-3&(x>1)\end{cases}$$
    이다. 함수 $\{f(x)\}^2$이 모든 실수 $x$에서 연속일 때, $f(a-b)+f(a+b)$의 값을 구하고 그 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '30'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |-
        함수 $\{f(x)\}^2=\begin{cases}(-x-a)^2&(x<1)\\(2a)^2&(x=1)\\(bx-3)^2&(x>1)\end{cases}$이 모든 실수 $x$에서 연속이려면 $x=1$에서 연속이어야 하므로 $\lim_{x\to1-}\{f(x)\}^2=\{f(1)\}^2=\lim_{x\to1+}\{f(x)\}^2$이다.
        $\lim_{x\to1-}\{f(x)\}^2=(1+a)^2$ ……㉠, $\{f(1)\}^2=4a^2$ ……㉡, $\lim_{x\to1+}\{f(x)\}^2=(b-3)^2$ ……㉢
      source_flow: 예시답안 문항카드 6 p.39
      criteria:
      - 1.M1
    - id: 1b-2
      content: ㉠, ㉡에 의하여 $(1+a)^2=4a^2$, $3a^2-2a-1=(a-1)(3a+1)=0$에서 $a=1$ 또는 $a=-\dfrac13$이고 $a$는 양수이므로 $a=1$이다.
      source_flow: 예시답안 문항카드 6 p.39
      criteria:
      - 1.M1
    - id: 1b-3
      content: ㉡, ㉢에 의하여 $4a^2=(b-3)^2$, $a=1$을 대입하면 $b-3=2$ 또는 $b-3=-2$에서 $b=5$ 또는 $b=1$이고 $a\ne b$이므로 $b=5$이다.
      source_flow: 예시답안 문항카드 6 p.39
      criteria:
      - 1.A1
    - id: 1b-4
      content: $f(x)=\begin{cases}-x-1&(x<1)\\2&(x=1)\\5x-3&(x>1)\end{cases}$이므로 $f(a-b)+f(a+b)=f(-4)+f(6)=3+27=30$
      source_flow: 예시답안 문항카드 6 p.39
      criteria:
      - 1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
