stem: 문제7 [10점]
subparts:
- id: '1'
  stem: |
    문제7 [10점]
    실수 $k$ ($k>1$)에 대하여 곡선 $y=-x^2+kx$와 직선 $y=x$가 만나는 두 점 중 원점이 아닌 점을 P라 하고, 직선 $y=x$가 직선 $x=k$와 만나는 점을 Q라 하자. 곡선 $y=-x^2+kx$와 선분 OP로 둘러싸인 부분의 넓이를 $A$라 하고, 곡선 $y=-x^2+kx$와 직선 $x=k$ 및 선분 PQ로 둘러싸인 부분의 넓이를 $B$라 하자. $B-A=\dfrac23$일 때, $k$의 값을 구하고 그 과정을 서술하시오. (단, O는 원점이다.)
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '2'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |-
        곡선 $y=-x^2+kx$와 직선 $y=x$가 만나는 점 P의 $x$좌표는 $k-1$이고 $B-A=\dfrac23$이므로
        $$\int_{k-1}^{k}\{x-(-x^2+kx)\}dx-\int_0^{k-1}(-x^2+kx-x)dx=\dfrac23$$ ……㉠
      source_flow: 예시답안 문항카드 7 p.42
      criteria:
      - 1.M1
    - id: 1b-2
      content: |-
        ㉠에서 $\int_0^k(x^2-kx+x)dx=\dfrac23$이고
        $$\int_0^k(x^2-kx+x)dx=\left[\dfrac{x^3}{3}+\dfrac{1-k}{2}x^2\right]_0^k=\dfrac{k^3}{3}+\dfrac{1-k}{2}k^2=-\dfrac{k^3}{6}+\dfrac{k^2}{2}=\dfrac23$$ ……㉡
      source_flow: 예시답안 문항카드 7 p.42
      criteria:
      - 1.A1
    - id: 1b-3
      content: ㉡에서 $k^3-3k^2+4=(k+1)(k-2)^2=0$이므로 $k=2$이다.
      source_flow: 예시답안 문항카드 7 p.42
      criteria:
      - 1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
