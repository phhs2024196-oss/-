stem: 문제8 [15점]
subparts:
- id: '1'
  stem: |
    문제8 [15점]
    시각 $t=0$일 때 원점을 출발하여 수직선 위를 움직이는 점 P의 시각 $t$ ($t\ge0$)에서의 속도 $v(t)$가 두 상수 $a,b$ ($a>4b>0$)에 대하여
    $$v(t)=6t^2-(a+8b)t+(a+2b)b$$
    일 때, 점 P가 다음 조건을 만족시킨다.

    (가) 점 P는 시각 $t=t_1$과 $t=t_2$에서 운동 방향을 바꾸고 $t_2-t_1=\dfrac13$이다.
    (나) 시각 $t=0$에서 $t=b$까지 점 P가 움직인 거리는 3이다.

    시각 $t=2$에서의 점 P의 위치를 구하고 그 과정을 서술하시오.
  points: 15
  depends_on: []
  answer:
    kind: value
    value: '4'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: 점 P가 운동 방향을 바꿀 때 속도가 0이므로 $v(t)=6t^2-(a+8b)t+(a+2b)b=(t-b)(6t-a-2b)=0$에서 $t=b$ 또는 $t=\dfrac{a+2b}{6}$이고, $a>4b$이므로 $\dfrac{a+2b}{6}>b$이다.
      source_flow: 예시답안 문항카드 8 p.45
      criteria:
      - 1.M1
    - id: 1b-2
      content: 조건 (가)에서 $t_2-t_1=\dfrac{a+2b}{6}-b=\dfrac{a-4b}{6}=\dfrac13$이므로 $a-4b=2$ ……㉠
      source_flow: 예시답안 문항카드 8 p.45
      criteria:
      - 1.M2
    - id: 1b-3
      content: 한편 $0\le t\le b$에서 $v(t)\ge0$이고 조건 (나)에서 $\int_0^b|v(t)|dt=3$이므로 $\int_0^b|v(t)|dt=\int_0^b v(t)dt=\int_0^b\{6t^2-(a+8b)t+(a+2b)b\}dt$이다.
      source_flow: 예시답안 문항카드 8 p.45
      criteria:
      - 1.M3
    - id: 1b-4
      content: $\int_0^b v(t)dt=\left[2t^3-\dfrac12(a+8b)t^2+(a+2b)bt\right]_0^b=2b^3-\dfrac{b^2}{2}(a+8b)+(a+2b)b^2=\dfrac12ab^2=3$ ……㉡
      source_flow: 예시답안 문항카드 8 p.45
      criteria:
      - 1.A1
    - id: 1b-5
      content: ㉠, ㉡에서 $a=6$, $b=1$이다. 따라서 $v(t)=6t^2-14t+8$이다.
      source_flow: 예시답안 문항카드 8 p.45
      criteria:
      - 1.A2
    - id: 1b-6
      content: 시각 $t$에서의 점 P의 위치를 $x(t)$라 하면 $t=2$에서의 위치는 $x(2)=x(0)+\int_0^2v(t)dt=0+\int_0^2(6t^2-14t+8)dt=\Big[2t^3-7t^2+8t\Big]_0^2=4$
      source_flow: 예시답안 문항카드 8 p.45
      criteria:
      - 1.A3
