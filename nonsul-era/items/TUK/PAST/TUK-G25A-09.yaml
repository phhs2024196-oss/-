stem: 문제9 [15점]
subparts:
- id: '1'
  stem: |
    문제9 [15점]
    다항함수 $f(x)$가 모든 실수 $x$에 대하여
    $$\int_0^x f(t)dt=f(x)-\dfrac23x^3+4x^2-2x-2$$
    를 만족시킨다. 양수 $k$에 대하여 직선 $y=k$가 곡선 $y=f(x)$와 서로 다른 두 점 A, B에서 만날 때, 삼각형 AOB의 넓이를 $g(k)$라 하자. $g(k)$가 최대일 때, $k$의 값을 구하고 그 과정을 서술하시오. (단, O는 원점이다.)
  points: 15
  depends_on: []
  answer:
    kind: value
    value: 8/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |-
        (ⅰ) 양변에 $x=0$을 대입하면 $f(0)=2$이다.
        (ⅱ) 양변을 $x$에 대하여 미분하면 $f(x)=f'(x)-2x^2+8x-2$ ……㉠이고 ㉠은 $x$에 대한 항등식이므로 $f(x)$의 최고차항은 $-2x^2$이다. $f(0)=2$이므로 $f(x)=-2x^2+ax+2$라 하자. ㉠에 의하여 $-2x^2+ax+2=-4x+a-2x^2+8x-2$에서 $a=4$이므로 $f(x)=-2x^2+4x+2$이다.
      source_flow: 예시답안 문항카드 9 p.48
      criteria:
      - 1.M1
    - id: 1b-2
      content: 곡선 $y=-2x^2+4x+2$와 직선 $y=k$가 서로 다른 두 점에서 만나므로 방정식 $2x^2-4x+k-2=0$은 서로 다른 두 실근을 갖는다. 판별식을 $D$라 하면 $D=16-8(k-2)>0$, $k<4$이고 $k$는 양수이므로 $0<k<4$이다.
      source_flow: 예시답안 문항카드 9 p.48
      criteria:
      - 1.A1
    - id: 1b-3
      content: $2x^2-4x+k-2=0$의 서로 다른 두 실근을 $\alpha,\beta$라 하면 $\alpha+\beta=2$, $\alpha\beta=\dfrac{k-2}{2}$이므로 $\overline{AB}=|\alpha-\beta|=\sqrt{(\alpha+\beta)^2-4\alpha\beta}=\sqrt{4-2(k-2)}=\sqrt{8-2k}$이다.
      source_flow: 예시답안 문항카드 9 p.48
      criteria:
      - 1.M2
    - id: 1b-4
      content: 삼각형 AOB의 넓이는 $g(k)=\dfrac12\times\sqrt{8-2k}\times k=\dfrac12\sqrt{8k^2-2k^3}$이다.
      source_flow: 예시답안 문항카드 9 p.48
      criteria:
      - 1.A2
    - id: 1b-5
      content: $0<k<4$에서 함수 $h(k)=8k^2-2k^3$이라 하면 $h(k)$가 최대일 때 $g(k)$도 최대이다. $h'(k)=16k-6k^2=2k(8-3k)$, $h'(k)=0$에서 $k=0$ 또는 $k=\dfrac83$이다.
      source_flow: 예시답안 문항카드 9 p.48
      criteria:
      - 1.M3
    - id: 1b-6
      content: 함수 $h(k)$의 증가와 감소를 표로 나타내면 $0<k<\dfrac83$에서 $h'(k)>0$(증가), $k=\dfrac83$에서 극대, $\dfrac83<k<4$에서 $h'(k)<0$(감소)이다. 따라서 $h(k)$가 $k=\dfrac83$에서 최대이므로 $g(k)$도 $k=\dfrac83$일 때 최대이다.
      source_flow: 예시답안 문항카드 9 p.48
      criteria:
      - 1.A3
