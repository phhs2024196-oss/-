stem: 문제1 [10점]
subparts:
- id: '1'
  stem: |
    문제1 [10점]
    $\angle A>\dfrac{\pi}{2}$인 이등변삼각형 ABC에 대하여
    $$\sin A=\cos B,\ \overline{AC}=2\sqrt3$$
    이다. 다음은 삼각형 ABC의 외접원의 넓이를 구하는 과정이다. ⑴ ~ ⑷ 에 알맞은 수를 구하시오.

    삼각형 ABC는 $\angle A>\dfrac{\pi}{2}$인 이등변삼각형이므로 $\angle B=\angle C$ ……㉠
    $\angle A>\dfrac{\pi}{2}$이고 $\sin A=\cos B$이므로 $\angle A=\dfrac{\pi}{2}+\angle B$ ……㉡
    삼각형의 세 내각의 크기의 합은 $\pi$이므로 $\angle A+\angle B+\angle C=\pi$ ……㉢
    ㉠, ㉡, ㉢에 의하여 $\angle A=$ ⑴ , $\angle B=$ ⑵
    삼각형 ABC의 외접원의 반지름의 길이를 $R$이라 하면 $R=$ ⑶ 이므로
    외접원의 넓이는 ⑷ 이다.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: ⑴=2*pi/3; ⑵=pi/6; ⑶=2*sqrt(3); ⑷=12*pi
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: ㉠, ㉡, ㉢에 의하여 $\angle B=\dfrac{\pi}{6}$이므로 $\angle A=\dfrac{\pi}{2}+\angle B=\dfrac23\pi$이다. (⑴ $\dfrac23\pi$, ⑵ $\dfrac{\pi}{6}$)
      source_flow: 예시답안 문항카드 10 p.52
      criteria:
      - 1.B1
      - 1.B2
    - id: 1b-2
      content: 삼각형 ABC의 외접원의 반지름의 길이를 $R$이라 할 때 사인법칙을 이용하면 $2R=\dfrac{\overline{AC}}{\sin B}=\dfrac{2\sqrt3}{\dfrac12}=4\sqrt3$이다. (⑶ $2\sqrt3$)
      source_flow: 예시답안 문항카드 10 p.52
      criteria:
      - 1.B3
    - id: 1b-3
      content: 따라서 $R=2\sqrt3$이므로 외접원의 넓이는 $\pi R^2=12\pi$이다. (⑷ $12\pi$)
      source_flow: 예시답안 문항카드 10 p.52
      criteria:
      - 1.B4
