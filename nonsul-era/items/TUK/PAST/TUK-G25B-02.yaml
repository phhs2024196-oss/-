      points: 3
      evidence: 수직 조건 $\dfrac{1}{\sqrt2}\times\left(-\dfrac{a}{2}\right)=-1$을 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: $a=2\sqrt2$를 구했다.
