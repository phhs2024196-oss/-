stem: 문제2 [10점]
subparts:
- id: '1'
  stem: |
    문제2 [10점]
    좌표평면 위의 두 점 $(0,0)$, $(\sqrt[3]{4},\sqrt[6]{2})$를 지나는 직선이 직선 $ax+2y=1$과 서로 수직일 때, $a^2$의 값을 구하고 그 과정을 서술하시오. (단, $a$는 상수이다.)
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '8'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: 두 점 $(0,0)$과 $(\sqrt[3]{4},\sqrt[6]{2})$를 지나는 직선의 기울기는 $\dfrac{\sqrt[6]{2}}{\sqrt[3]{4}}=2^{\frac16-\frac23}=2^{-\frac12}=\dfrac{1}{\sqrt2}$이다.
      source_flow: 예시답안 문항카드 11 p.54
      criteria:
      - 1.M1
    - id: 1b-2
      content: 직선 $ax+2y=1$의 기울기는 $-\dfrac{a}{2}$이다. 두 직선이 서로 수직이므로 $\dfrac{1}{\sqrt2}\times\left(-\dfrac{a}{2}\right)=-1$이다.
      source_flow: 예시답안 문항카드 11 p.54
      criteria:
      - 1.M2
    - id: 1b-3
      content: $a=2\sqrt2$
      source_flow: 예시답안 문항카드 11 p.54
      criteria:
      - 1.A1
    - id: 1b-4
      content: 따라서 $a^2=8$
      source_flow: 예시답안 문항카드 11 p.54
      criteria:
      - 1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
