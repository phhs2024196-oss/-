stem: 문제3 [10점]
subparts:
- id: '1'
  stem: |
    문제3 [10점]
    등차수열 $\{a_n\}$의 첫째항부터 제$n$항까지의 합을 $S_n$이라 하자. 모든 자연수 $n$에 대하여
    $$S_{n+2}-S_n=10n+9$$
    가 성립할 때, $a_3$의 값을 구하고 그 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '12'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: 등차수열 $\{a_n\}$의 첫째항을 $a$, 공차를 $d$라 하자. 모든 자연수 $n$에 대하여 $S_{n+2}-S_n=a_{n+2}+a_{n+1}=a+(n+1)d+a+nd=2dn+2a+d=10n+9$이다.
      source_flow: 예시답안 문항카드 12 p.56
      criteria:
      - 1.M1
    - id: 1b-2
      content: $2d=10$, $2a+d=9$이므로
      source_flow: 예시답안 문항카드 12 p.56
      criteria:
      - 1.M2
    - id: 1b-3
      content: $d=5$, $a=2$이다.
      source_flow: 예시답안 문항카드 12 p.56
      criteria:
      - 1.A1
    - id: 1b-4
      content: 따라서 $a_3=2+2\times5=12$
      source_flow: 예시답안 문항카드 12 p.56
      criteria:
      - 1.A2
  rubric:
