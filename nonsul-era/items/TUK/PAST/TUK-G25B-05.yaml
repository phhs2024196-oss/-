stem: 문제5 [10점]
subparts:
- id: '1'
  stem: |
    문제5 [10점]
    두 다항함수 $f(x),g(x)$가 다음 조건을 만족시킨다.

    (가) $\lim_{x\to2}\dfrac{g(x)-4}{x-2}=2f(2)$
    (나) $f(x)g(x)=x^4-x^2$

    $f'(2)$의 값을 구하고 그 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 5/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: 조건 (가)에서 $\lim_{x\to2}(x-2)=0$이므로 $\lim_{x\to2}\{g(x)-4\}=0$, $g(2)-4=0$에서 $g(2)=4$이다. ……㉠
      source_flow: 예시답안 문항카드 14 p.61
      criteria:
      - 1.M1
    - id: 1b-2
      content: $\lim_{x\to2}\dfrac{g(x)-4}{x-2}=\lim_{x\to2}\dfrac{g(x)-g(2)}{x-2}=g'(2)$이므로 $g'(2)=2f(2)$이다. ……㉡
      source_flow: 예시답안 문항카드 14 p.61
      criteria:
      - 1.M2
    - id: 1b-3
      content: 조건 (나)의 양변에 $x=2$를 대입하면 $f(2)g(2)=12$이고 ㉠에 의하여 $f(2)=3$이다. ……㉢
      source_flow: 예시답안 문항카드 14 p.61
      criteria:
      - 1.A1
    - id: 1b-4
      content: ㉡, ㉢에 의하여 $g'(2)=6$이다. ……㉣
      source_flow: 예시답안 문항카드 14 p.61
      criteria:
      - 1.A2
    - id: 1b-5
      content: 조건 (나)의 양변을 $x$에 대하여 미분하면 $f'(x)g(x)+f(x)g'(x)=4x^3-2x$이고, $x=2$를 대입하면 $f'(2)g(2)+f(2)g'(2)=28$이다. ㉠, ㉢, ㉣에 의하여 $f'(2)=\dfrac52$이다.
      source_flow: 예시답안 문항카드 14 p.61
      criteria:
      - 1.A3
