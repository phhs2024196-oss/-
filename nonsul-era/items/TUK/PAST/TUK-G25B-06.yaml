stem: 문제6 [10점]
subparts:
- id: '1'
  stem: |
    문제6 [10점]
    두 자연수 $a,b$에 대하여 함수 $f(x)$가
    $$f(x)=\begin{cases}\dfrac{b^2}{x^2+bx+1}&(x\neq0)\\\dfrac{a^2}{4}&(x=0)\end{cases}$$
    이다. 함수 $f(x)$가 모든 실수 $x$에서 연속일 때, $a$와 $b$의 값을 구하고 그 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: a=2; b=1
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: (ⅰ) 함수 $f(x)$가 모든 실수 $x$에서 연속이려면 $x=0$에서 연속이어야 하므로 $\lim_{x\to0}f(x)=f(0)$이다. $\lim_{x\to0}f(x)=\lim_{x\to0}\dfrac{b^2}{x^2+bx+1}=b^2$이고 $f(0)=\dfrac{a^2}{4}$이므로 $b^2=\dfrac{a^2}{4}$ ……㉠
      source_flow: 예시답안 문항카드 15 p.64
      criteria:
      - 1.M1
    - id: 1b-2
      content: ㉠에서 $a=2b$ 또는 $a=-2b$이고 $a,b$가 모두 자연수이므로 $a=2b$ ……㉡
      source_flow: 예시답안 문항카드 15 p.64
      criteria:
      - 1.M1
    - id: 1b-3
      content: (ⅱ) 함수 $g(x)=\dfrac{b^2}{x^2+bx+1}$ $(x\ne0)$이라 하면 함수 $g(x)$가 $x\ne0$인 모든 실수 $x$에서 연속이어야 하므로 $x\ne0$인 모든 실수 $x$에 대하여 $x^2+bx+1\ne0$이어야 한다. $x=0$이면 $x^2+bx+1=1\ne0$이므로 이차방정식 $x^2+bx+1=0$의 판별식을 $D$라 하면 $D<0$이어야 한다. $D=b^2-4=(b+2)(b-2)<0$에서 $-2<b<2$이다.
      source_flow: 예시답안 문항카드 15 p.64
      criteria:
      - 1.M2
    - id: 1b-4
      content: 따라서 자연수 $b$의 값은 $b=1$이고 ㉡에 의하여 $a=2$이다.
      source_flow: 예시답안 문항카드 15 p.64
      criteria:
      - 1.A1
      - 1.A2
