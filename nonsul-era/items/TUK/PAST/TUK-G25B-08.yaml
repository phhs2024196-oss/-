      evidence: $0\le t\le1$에서 $v(t)\ge0$, $1\le t\le-2a-1$에서 $v(t)\le0$을 구했다.
      depends_on:
      - 1.M2
      steps:
      - 1b-4
    - id: 1.M3
      mark_type: M
      points: 2
      evidence: $\int_0^3|v(t)|dt=\int_0^1v(t)dt-\int_1^3v(t)dt$를 구했다.
      depends_on:
      - 1.R1
      steps:
      - 1b-5
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: $7a+b=-16$을 구했다.
      depends_on:
      - 1.M3
      steps:
      - 1b-6
