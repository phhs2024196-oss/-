key_idea: 위치를 미분해 $v(t)=(t-1)(t+2a+1)$을 얻고, $a\le-2$로 $-2a-1\ge3$임을 확인해 $[0,3]$에서 $v$의 부호가 $t=1$에서만 바뀐다고 판단한다. $\int_0^3|v(t)|dt=2x(1)-x(3)$로 $7a+b=-16$을 얻어 $a,b$를 구한다.
