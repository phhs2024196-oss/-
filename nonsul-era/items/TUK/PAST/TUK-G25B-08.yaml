stem: 문제8 [15점]
subparts:
- id: '1'
  stem: |
    문제8 [15점]
    시각 $t=0$일 때 출발하여 수직선 위를 움직이는 점 P의 시각 $t$ ($t\ge0$)에서의 위치 $x(t)$가 두 상수 $a,b$에 대하여
    $$x(t)=\dfrac13t^3+at^2+bt$$
    일 때, 시각 $t$에서의 점 P의 속도 $v(t)$가 다음 조건을 만족시킨다.

    (가) $v(1)=0$
    (나) $\int_0^3|v(t)|dt=\dfrac{23}{3}$

    시각 $t=6$에서의 점 P의 속도를 구하고 그 과정을 서술하시오. (단, $a\le-2$)
  points: 15
  depends_on: []
  answer:
    kind: value
    value: '5'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: $x(t)=\dfrac13t^3+at^2+bt$에서 $v(t)=\dfrac{d}{dt}x(t)=t^2+2at+b$이다.
      source_flow: 예시답안 문항카드 17 p.70
      criteria:
      - 1.M1
    - id: 1b-2
      content: 조건 (가)에서 $v(1)=1+2a+b=0$이므로 $b=-2a-1$ ……㉠
      source_flow: 예시답안 문항카드 17 p.70
      criteria:
      - 1.A1
    - id: 1b-3
      content: $v(t)=t^2+2at+b=t^2+2at-(2a+1)=(t-1)(t+2a+1)$, $v(t)=0$에서 $t=1$ 또는 $t=-2a-1$이다. 이때 $a\le-2$이므로 $-2a-1\ge3$이다.
      source_flow: 예시답안 문항카드 17 p.70
      criteria:
      - 1.M2
    - id: 1b-4
      content: 한편 $0\le t\le1$에서 $v(t)\ge0$, $1\le t\le-2a-1$에서 $v(t)\le0$이다.
      source_flow: 예시답안 문항카드 17 p.70
      criteria:
      - 1.R1
    - id: 1b-5
      content: 조건 (나)에서 $\int_0^3|v(t)|dt=\dfrac{23}{3}$이므로 $\int_0^3|v(t)|dt=\int_0^1v(t)dt-\int_1^3v(t)dt=x(1)-x(0)-\{x(3)-x(1)\}=2x(1)-x(3)=2\left(\dfrac13+a+b\right)-(9+9a+3b)=\dfrac{23}{3}$
      source_flow: 예시답안 문항카드 17 p.70
      criteria:
      - 1.M3
    - id: 1b-6
      content: 에서 $7a+b=-16$ ……㉡
      source_flow: 예시답안 문항카드 17 p.70
      criteria:
      - 1.A2
    - id: 1b-7
      content: ㉠, ㉡에서 $a=-3$, $b=5$이므로 $v(t)=t^2+2at+b=t^2-6t+5$이다.
      source_flow: 예시답안 문항카드 17 p.70
      criteria:
      - 1.A3
    - id: 1b-8
      content: 따라서 시각 $t=6$에서의 점 P의 속도는 $v(6)=36-36+5=5$이다.
      source_flow: 예시답안 문항카드 17 p.70
      criteria:
      - 1.A4
