stem: 문제9 [15점]
subparts:
- id: '1'
  stem: |
    문제9 [15점]
    다항함수 $f(x)$가 다음 조건을 만족시킨다.

    (가) 모든 실수 $x$에 대하여 $\int_0^x f(t)dt=\dfrac16x^4+ax^3+bx^2$이다.
    (나) $|f'(-1)|+|f'(2)|=0$

    함수 $f(x)$에 대하여 함수 $g(x)$를
    $$g(x)=\dfrac14|3f(x)-24x-4|$$
    라 하자. 곡선 $y=g(x)$와 직선 $y=k$가 서로 다른 네 점에서 만나도록 하는 모든 자연수 $k$의 개수를 구하고 그 과정을 서술하시오.
  points: 15
  depends_on: []
  answer:
    kind: value
    value: '11'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: 조건 (가)에서 $\int_0^x f(t)dt=\dfrac16x^4+ax^3+bx^2$의 양변을 $x$에 대하여 미분하면 $f(x)=\dfrac23x^3+3ax^2+2bx$이다.
      source_flow: 예시답안 문항카드 18 p.73
      criteria:
      - 1.M1
    - id: 1b-2
      content: 조건 (나)에서 $|f'(-1)|+|f'(2)|=0$이므로 $f'(-1)=0$이고 $f'(2)=0$이다. $f'(x)=2x^2+6ax+2b$이므로 $f'(-1)=2-6a+2b=0$에서 $3a-b=1$ ……㉠, $f'(2)=8+12a+2b=0$에서 $6a+b=-4$ ……㉡
      source_flow: 예시답안 문항카드 18 p.73
      criteria:
      - 1.M2
    - id: 1b-3
      content: ㉠, ㉡에서 $a=-\dfrac13$, $b=-2$이므로 $f(x)=\dfrac23x^3-x^2-4x$이다.
      source_flow: 예시답안 문항카드 18 p.73
      criteria:
      - 1.A1
    - id: 1b-4
      content: $g(x)=\dfrac14|3f(x)-24x-4|=\dfrac14|2x^3-3x^2-36x-4|$이다. 함수 $h(x)=2x^3-3x^2-36x-4$라 하면 $h'(x)=6x^2-6x-36$이고 $h'(x)=0$에서 $x=-2$ 또는 $x=3$이다.
      source_flow: 예시답안 문항카드 18 p.73
      criteria:
      - 1.M3
    - id: 1b-5
      content: 함수 $h(x)$의 증가와 감소를 표로 나타내면 $x<-2$에서 $h'(x)>0$(증가), $x=-2$에서 극대, $-2<x<3$에서 $h'(x)<0$(감소), $x=3$에서 극소, $x>3$에서 $h'(x)>0$(증가)이다.
      source_flow: 예시답안 문항카드 18 p.73
      criteria:
      - 1.M3
    - id: 1b-6
      content: $h(-2)=40$, $h(3)=-85$이고 $g(x)=\dfrac14|h(x)|$이므로 $g(-2)=10$, $g(3)=\dfrac{85}{4}$이고 함수 $g(x)$의 그래프는 $h(x)=0$인 곳에서 꺾이며 $x=-2$에서 극댓값 10, $x=3$에서 극댓값 $\dfrac{85}{4}$를 갖는다.
      source_flow: 예시답안 문항카드 18 p.73
      criteria:
      - 1.A2
    - id: 1b-7
      content: 따라서 곡선 $y=g(x)$와 직선 $y=k$가 서로 다른 네 점에서 만나도록 하는 모든 $k$의 값의 범위가 $10<k<\dfrac{85}{4}$이므로 자연수 $k$의 개수는 11이다.
      source_flow: 예시답안 문항카드 18 p.73
      criteria:
      - 1.A3
