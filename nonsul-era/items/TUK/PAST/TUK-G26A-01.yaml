subparts:
- id: '1'
  stem: |
    $\dfrac{3}{2}\pi<\theta<2\pi$인 $\theta$에 대하여 $\sin\left(\dfrac{\pi}{2}+\theta\right)=\dfrac{2}{3}$일 때, $\sin\theta\times\tan\theta$의 값을 구하고 그 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 5/6
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\sin\left(\dfrac{\pi}{2}+\theta\right)=\cos\theta$이므로 $\cos\theta=\dfrac{2}{3}$이다.
      source_flow: 예시답안 p.30
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $\dfrac{3}{2}\pi<\theta<2\pi$에서 $\sin\theta<0$이므로
        $$\sin\theta=-\sqrt{1-\cos^2\theta}=-\sqrt{1-\left(\dfrac{2}{3}\right)^2}=-\dfrac{\sqrt5}{3}$$
      source_flow: 예시답안 p.30
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $$\tan\theta=\dfrac{\sin\theta}{\cos\theta}=\dfrac{-\dfrac{\sqrt5}{3}}{\dfrac{2}{3}}=-\dfrac{\sqrt5}{2}$$
      source_flow: 예시답안 p.30
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        따라서 $\sin\theta\times\tan\theta=\left(-\dfrac{\sqrt5}{3}\right)\times\left(-\dfrac{\sqrt5}{2}\right)=\dfrac{5}{6}$이다.
      source_flow: 예시답안 p.30
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
