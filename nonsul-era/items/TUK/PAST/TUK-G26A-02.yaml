stem: |
  [문제 2] [10점]
subparts:
- id: '1'
  stem: |
    $0\le x\le\pi$일 때, 방정식 $2\cos^2x-\sin x-1=0$의 모든 실근의 곱을 구하고 그 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 5*pi**2/36
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $2\cos^2x-\sin x-1=2\left(1-\sin^2x\right)-\sin x-1=0$, 즉 $2\sin^2x+\sin x-1=0$
      source_flow: 예시답안 p.32
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $(2\sin x-1)(\sin x+1)=0$에서 $\sin x=\dfrac{1}{2}$ 또는 $\sin x=-1$
      source_flow: 예시답안 p.32
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $0\le x\le\pi$에서 $\sin x\ge0$이므로 $\sin x=\dfrac{1}{2}$, $x=\dfrac{\pi}{6}$ 또는 $x=\dfrac{5}{6}\pi$
      source_flow: 예시답안 p.32
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        따라서 모든 실근의 곱은 $\dfrac{\pi}{6}\times\dfrac{5}{6}\pi=\dfrac{5}{36}\pi^2$이다.
      source_flow: 예시답안 p.32
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: $2\sin^2x+\sin x-1=0$을 구했다.
