      steps:
      - 1b-2
    - id: 1.M3
      mark_type: M
      points: 3
      evidence: $\sin x\ge0$을 이용해 $x=\dfrac{\pi}{6}$, $x=\dfrac{5}{6}\pi$를 구했다.
      steps:
      - 1b-3
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: 모든 실근의 곱 $\dfrac{\pi}{6}\times\dfrac{5}{6}\pi=\dfrac{5}{36}\pi^2$을 구했다.
