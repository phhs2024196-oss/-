stem: |
  [문제 3] [10점]
subparts:
- id: '1'
  stem: |
    함수 $f(x)=-\log_3x+a$가 닫힌구간 $\left[\dfrac{1}{27},9\right]$에서 최댓값 $6$, 최솟값 $b$를 가질 때, 두 상수 $a$와 $b$의 값을 구하고 그 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: a=3; b=1
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        함수 $y=f(x)$의 그래프는 $y=\log_3x$의 그래프를 $x$축에 대하여 대칭이동한 후 $y$축의 방향으로 $a$만큼 평행이동한 것이다. $x$의 값이 증가하면 $y$의 값은 감소하므로 $f(x)$는 $x=\dfrac{1}{27}$에서 최댓값 $6$을 갖는다.
      source_flow: 예시답안 p.35
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        같은 이유로 $x=9$에서 최솟값 $b$를 갖는다.
      source_flow: 예시답안 p.35
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $f\left(\dfrac{1}{27}\right)=-\log_3\dfrac{1}{27}+a=6$, $3+a=6$에서 $a=3$
      source_flow: 예시답안 p.35
      criteria:
      - 1.A1
    - id: 1b-4
      content: |
        $b=f(9)=-\log_39+3=-2+3=1$
      source_flow: 예시답안 p.35
      criteria:
      - 1.A2
  rubric:
