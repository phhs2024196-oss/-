key_idea: $0\le x\le2$에서 $f(x)\le0$이므로 $\int_0^2|f(x)|dx=-\int_0^2f(x)dx$로 절댓값을 벗기고, 정적분의 구간 합을 $\int_2^af(x)dx$로 정리하여 $a$에 대한 삼차방정식을 푼다.
