subparts:
- id: '1'
  stem: |
    함수 $f(x)=3x^2-6x$에 대하여
    $$\int_0^af(x)dx+\int_0^2|f(x)|dx=0$$
    을 만족시키는 모든 실수 $a$의 값을 구하고 그 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: set
    value: -1, 2
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $0\le x\le2$에서 $f(x)=3x(x-2)\le0$이므로 $\displaystyle\int_0^2|f(x)|dx=-\int_0^2f(x)dx$
      source_flow: 예시답안 p.41
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $$\int_0^af(x)dx+\int_0^2|f(x)|dx=\int_0^af(x)dx-\int_0^2f(x)dx=\int_2^af(x)dx$$
      source_flow: 예시답안 p.41
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $$\int_2^a\left(3x^2-6x\right)dx=\left[x^3-3x^2\right]_2^a=a^3-3a^2+4=(a+1)(a-2)^2=0$$
      source_flow: 예시답안 p.41
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        에서 $a=-1$ 또는 $a=2$. 따라서 모든 실수 $a$의 값은 $-1$, $2$이다.
      source_flow: 예시답안 p.41
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: $\int_0^2|f(x)|dx=-\int_0^2f(x)dx$를 구했다.
      steps:
      - 1b-1
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: $\int_0^af(x)dx+\int_0^2|f(x)|dx=\int_2^af(x)dx$로 정리했다.
      steps:
      - 1b-2
    - id: 1.M3
      mark_type: M
      points: 3
      evidence: $\int_2^af(x)dx=\left[x^3-3x^2\right]_2^a=(a+1)(a-2)^2$을 구했다.
      steps:
      - 1b-3
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: 모든 실수 $a$의 값 $-1$, $2$를 구했다.
      depends_on:
      - 1.M3
      steps:
      - 1b-4
