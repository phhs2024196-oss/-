stem: |
  [문제 6] [10점]
subparts:
- id: '1'
  stem: |
    함수 $f(x)=-x^2+2ax$ $(a>1)$에 대하여 곡선 $y=f(x)$와 $x$축이 만나는 점 중 원점이 아닌 점을 P라 하고, 직선 $y=2x$에 평행한 직선이 곡선 $y=f(x)$에 접하는 점을 Q라 하자.
    삼각형 OPQ의 넓이를 $S(a)$라 할 때, $\displaystyle\lim_{a\to1+}\dfrac{S(a)}{a-1}$의 값을 구하고 그 과정을 서술하시오. (단, O는 원점이다.)
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '2'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $-x^2+2ax=0$, $x(x-2a)=0$에서 $x=2a$이므로 점 P의 좌표는 P$(2a,0)$
      source_flow: 예시답안 p.44
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $f'(x)=-2x+2a=2$에서 $x=a-1$
      source_flow: 예시답안 p.44
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        점 Q의 좌표는 Q$\left(a-1,a^2-1\right)$
      source_flow: 예시답안 p.44
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        삼각형 OPQ의 넓이는 $S(a)=\dfrac{1}{2}\times2a\times\left(a^2-1\right)=a\left(a^2-1\right)$
      source_flow: 예시답안 p.44
      criteria:
      - 1.M4
    - id: 1b-5
      content: |
        $$\lim_{a\to1+}\dfrac{S(a)}{a-1}=\lim_{a\to1+}\dfrac{a(a-1)(a+1)}{a-1}=\lim_{a\to1+}a(a+1)=2$$
      source_flow: 예시답안 p.44
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: 점 P의 좌표 P$(2a,0)$을 구했다.
      steps:
      - 1b-1
    - id: 1.M2
      mark_type: M
      points: 1
      evidence: 점 Q의 $x$좌표 $x=a-1$을 구했다.
      steps:
      - 1b-2
    - id: 1.M3
      mark_type: M
      points: 3
      evidence: 점 Q의 좌표 Q$\left(a-1,a^2-1\right)$을 구했다.
      steps:
      - 1b-3
    - id: 1.M4
      mark_type: M
      points: 2
      evidence: 삼각형 OPQ의 넓이 $S(a)=a\left(a^2-1\right)$을 구했다.
      steps:
      - 1b-4
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: 극한값 $\displaystyle\lim_{a\to1+}\dfrac{S(a)}{a-1}=2$를 구했다.
      depends_on:
      - 1.M4
      steps:
      - 1b-5
