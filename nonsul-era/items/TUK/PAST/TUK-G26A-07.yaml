subparts:
- id: '1'
  stem: |
    최고차항의 계수가 $1$인 삼차함수 $f(x)$에 대하여 집합
    $$\left\{x\mid\lim_{h\to0}\dfrac{f(x+h)-f(x)}{h}=4\right\}$$
    의 원소가 $-2$와 $3$이다. 실수 $t$에 대하여 곡선 $y=f(x)$ 위의 점 $(t,f(t))$에서의 접선의 기울기를 $g(t)$라 할 때, $g(4)$의 값을 구하고 그 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '22'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        집합 $\left\{x\mid\lim_{h\to0}\dfrac{f(x+h)-f(x)}{h}=4\right\}=\{x\mid f'(x)=4\}=\{-2,3\}$이므로 $f'(-2)=4$, $f'(3)=4$
      source_flow: 예시답안 p.47
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $f'(x)$는 최고차항의 계수가 $3$인 이차함수이므로 $f'(x)=3x^2+ax+b$ ($a$, $b$는 상수)라 하면 $f'(-2)=12-2a+b=4$, 즉 $2a-b=8$ ㉠, $f'(3)=27+3a+b=4$, 즉 $3a+b=-23$ ㉡. ㉠, ㉡을 연립하여 풀면 $a=-3$
      source_flow: 예시답안 p.47
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        같은 연립방정식에서 $b=-14$
      source_flow: 예시답안 p.47
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        $f'(x)=3x^2-3x-14$
      source_flow: 예시답안 p.47
      criteria:
      - 1.M4
    - id: 1b-5
      content: |
        곡선 $y=f(x)$ 위의 점 $(t,f(t))$에서의 접선의 기울기가 $g(t)$이므로 $g(t)=f'(t)$. 따라서 $g(4)=f'(4)=48-12-14=22$
      source_flow: 예시답안 p.47
      criteria:
      - 1.A1
  - id: S1-ALT
    audience: ALT
    method_no: 2
    steps:
    - id: 1alt-1
      content: |
        별해: 집합의 조건에서 $f'(-2)=4$, $f'(3)=4$이고 $f'(x)$는 최고차항의 계수가 $3$인 이차함수이므로 $f'(x)-4=3(x+2)(x-3)$, 즉 $f'(x)=3(x+2)(x-3)+4$. 따라서 $g(4)=f'(4)=3\times6\times1+4=22$
      source_flow: 예시답안 p.47
