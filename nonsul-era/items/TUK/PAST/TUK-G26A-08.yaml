stem: |
  [문제 8] [15점]
subparts:
- id: '1'
  stem: |
    함수 $f(x)=\dfrac{1}{3}x^3-x^2+\dfrac{5}{3}x-2$의 역함수를 $g(x)$라 하자. 두 함수 $y=g(x)$, $y=|x|$의 그래프로 둘러싸인 영역의 넓이를 구하고 그 과정을 서술하시오.
  points: 15
  depends_on: []
  answer:
    kind: value
    value: 13/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f'(x)=x^2-2x+\dfrac{5}{3}=(x-1)^2+\dfrac{2}{3}>0$이므로 $f(x)$는 실수 전체의 집합에서 증가한다. 따라서 $f(x)$의 역함수 $g(x)$가 존재한다.
      source_flow: 예시답안 p.50
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        두 함수 $y=g(x)$, $y=|x|$의 그래프로 둘러싸인 영역의 넓이는 곡선 $y=f(x)$와 두 직선 $y=x$, $y=-x$로 둘러싸인 영역의 넓이와 같다.
      source_flow: 예시답안 p.50
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        (ⅰ) 곡선 $y=f(x)$와 직선 $y=x$의 교점의 $x$좌표는 $\dfrac{1}{3}x^3-x^2+\dfrac{5}{3}x-2=x$에서 $x^3-3x^2+2x-6=(x-3)(x^2+2)=0$이므로 $x=3$
      source_flow: 예시답안 p.50
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        (ⅱ) 곡선 $y=f(x)$와 직선 $y=-x$의 교점의 $x$좌표는 $\dfrac{1}{3}x^3-x^2+\dfrac{5}{3}x-2=-x$에서 $x^3-3x^2+8x-6=(x-1)(x^2-2x+6)=0$이고 $x^2-2x+6=(x-1)^2+5>0$이므로 $x=1$
      source_flow: 예시답안 p.50
      criteria:
      - 1.M4
    - id: 1b-5
      content: |
        구하는 넓이를 $A$라 하면
        $$A=\int_0^1\{x-(-x)\}dx+\int_1^3\left\{x-\left(\dfrac{1}{3}x^3-x^2+\dfrac{5}{3}x-2\right)\right\}dx$$
      source_flow: 예시답안 p.50
      criteria:
      - 1.M5
    - id: 1b-6
      content: |
        $$=\int_0^12x\,dx+\int_1^3\left(-\dfrac{1}{3}x^3+x^2-\dfrac{2}{3}x+2\right)dx=\left[x^2\right]_0^1+\left[-\dfrac{1}{12}x^4+\dfrac{1}{3}x^3-\dfrac{1}{3}x^2+2x\right]_1^3=\dfrac{13}{3}$$
      source_flow: 예시답안 p.50
      criteria:
      - 1.A1
