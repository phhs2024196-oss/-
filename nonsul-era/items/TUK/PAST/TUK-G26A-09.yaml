stem: |
  [문제 9] [15점]
subparts:
- id: '1'
  stem: |
    시각 $t=0$일 때 출발하여 수직선 위를 움직이는 점 P가 있다. 시각 $t$ $(t\ge0)$에서 점 P의 위치 $x(t)$는
    $$x(t)=\dfrac{1}{4}t^4-\dfrac{5}{2}t^3+6t^2+kt$$
    이고, 점 P가 다음 조건을 만족시킨다.
    (가) 시각 $t=2$일 때 점 P의 속도는 $0$보다 작다.
    (나) 시각 $t=p$와 $t=q$ $(0<p<q)$일 때만 점 P의 속도가 $\dfrac{5}{2}$이다.
    시각 $t=q$일 때 점 P의 가속도를 구하고 그 과정을 서술하시오. (단, $k$, $p$, $q$는 상수이다.)
  points: 15
  depends_on: []
  answer:
    kind: value
    value: 81/4
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        시각 $t$에서 점 P의 속도를 $v(t)$라 하면 $v(t)=\dfrac{dx}{dt}=t^3-\dfrac{15}{2}t^2+12t+k$
      source_flow: 예시답안 p.54-55
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        조건 (가)에서 $v(2)=k+2<0$이므로 $k<-2$
      source_flow: 예시답안 p.54-55
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $f(t)=t^3-\dfrac{15}{2}t^2+12t+k$라 하면 $f'(t)=3t^2-15t+12=3(t-1)(t-4)=0$에서 $t=1$ 또는 $t=4$
      source_flow: 예시답안 p.54-55
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        $t>0$에서 $f(t)$의 증가와 감소를 표로 나타내면 $0<t<1$에서 증가, $t=1$에서 극댓값 $f(1)=k+\dfrac{11}{2}$, $1<t<4$에서 감소, $t=4$에서 극솟값 $f(4)=k-8$, $t>4$에서 증가이다.
      source_flow: 예시답안 p.54-55
      criteria:
      - 1.M4
    - id: 1b-5
      content: |
        점 P는 출발한 후 시각 $t=p$와 $t=q$ $(0<p<q)$일 때만 속도가 $\dfrac{5}{2}$이므로 $t>0$에서 곡선 $y=f(t)$와 직선 $y=\dfrac{5}{2}$는 서로 다른 두 점에서 만나야 한다. 이렇게 되려면 $f(1)=\dfrac{5}{2}$이어야 한다.
      source_flow: 예시답안 p.54-55
      criteria:
      - 1.M5
    - id: 1b-6
      content: |
        $f(1)=k+\dfrac{11}{2}=\dfrac{5}{2}$에서 $k=-3$. 따라서 $f(t)=t^3-\dfrac{15}{2}t^2+12t-3$
      source_flow: 예시답안 p.54-55
      criteria:
      - 1.M6
    - id: 1b-7
      content: |
        곡선 $y=f(t)$와 직선 $y=\dfrac{5}{2}$가 만나는 $t$의 값은 $t^3-\dfrac{15}{2}t^2+12t-3=\dfrac{5}{2}$, $2t^3-15t^2+24t-11=(t-1)^2(2t-11)=0$에서 $t=1$ 또는 $t=\dfrac{11}{2}$. $p<q$이므로 $p=1$, $q=\dfrac{11}{2}$
      source_flow: 예시답안 p.54-55
      criteria:
      - 1.M7
    - id: 1b-8
      content: |
        시각 $t$에서 점 P의 가속도를 $a(t)$라 하면 $a(t)=\dfrac{dv}{dt}=3t^2-15t+12$
      source_flow: 예시답안 p.54-55
      criteria:
      - 1.M8
    - id: 1b-9
      content: |
        따라서 시각 $t=q=\dfrac{11}{2}$일 때 점 P의 가속도는 $a\left(\dfrac{11}{2}\right)=3\times\left(\dfrac{11}{2}\right)^2-15\times\dfrac{11}{2}+12=\dfrac{81}{4}$
      source_flow: 예시답안 p.54-55
      criteria:
      - 1.A1
