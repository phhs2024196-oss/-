subparts:
- id: '1'
  stem: |
    $\dfrac{\pi}{2}<\theta<\pi$인 $\theta$에 대하여 $\cos\left(\dfrac{\pi}{2}-\theta\right)=\dfrac{4}{5}$일 때, $\cos\theta+\tan\theta$의 값을 구하고 그 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: -29/15
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\cos\left(\dfrac{\pi}{2}-\theta\right)=\sin\theta$이므로 $\sin\theta=\dfrac{4}{5}$
      source_flow: 예시답안 p.58
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $\dfrac{\pi}{2}<\theta<\pi$에서 $\cos\theta<0$
      source_flow: 예시답안 p.58
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $$\cos\theta=-\sqrt{1-\sin^2\theta}=-\sqrt{1-\left(\dfrac{4}{5}\right)^2}=-\dfrac{3}{5}$$
      source_flow: 예시답안 p.58
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        $$\tan\theta=\dfrac{\sin\theta}{\cos\theta}=\dfrac{\dfrac{4}{5}}{-\dfrac{3}{5}}=-\dfrac{4}{3}$$
      source_flow: 예시답안 p.58
      criteria:
      - 1.M4
    - id: 1b-5
      content: |
        따라서 $\cos\theta+\tan\theta=\left(-\dfrac{3}{5}\right)+\left(-\dfrac{4}{3}\right)=-\dfrac{29}{15}$이다.
      source_flow: 예시답안 p.58
      criteria:
      - 1.A1
  rubric:
