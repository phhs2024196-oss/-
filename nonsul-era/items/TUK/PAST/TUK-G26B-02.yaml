subparts:
- id: '1'
  stem: |
    닫힌구간 $[0,\pi]$에서 정의된 함수 $f(x)=4\sin2x$에 대하여 곡선 $y=f(x)$와 직선 $y=2$가 만나는 두 점의 $x$좌표를 $\alpha$, $\beta$ $(\alpha<\beta)$라 할 때, $\beta-\alpha$의 값을 구하고 그 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: pi/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        닫힌구간 $[0,\pi]$에서 함수 $y=4\sin2x$의 그래프와 직선 $y=2$가 만나는 두 점의 $x$좌표는 $4\sin2x=2$, 즉 $\sin2x=\dfrac{1}{2}$
      source_flow: 예시답안 p.61
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $0\le2x\le2\pi$에서 $2x=\dfrac{\pi}{6}$ 또는 $2x=\dfrac{5}{6}\pi$
      source_flow: 예시답안 p.61
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $x=\dfrac{\pi}{12}$ 또는 $x=\dfrac{5}{12}\pi$이므로 $\alpha=\dfrac{\pi}{12}$, $\beta=\dfrac{5}{12}\pi$
      source_flow: 예시답안 p.61
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        따라서 $\beta-\alpha=\dfrac{\pi}{3}$
      source_flow: 예시답안 p.61
      criteria:
      - 1.A1
