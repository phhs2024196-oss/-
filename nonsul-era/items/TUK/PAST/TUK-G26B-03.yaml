key_idea: 평행이동한 함수를 $y=3^{x-p}+q$로 쓰고 두 점의 좌표를 대입해 얻은 두 식을 연립한다. 두 식의 차에서 $\dfrac{8}{9}\times3^{-p}=8$이 되어 $p$를 먼저 구한다.
