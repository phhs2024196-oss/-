subparts:
- id: '1'
  stem: |
    함수 $y=3^x$의 그래프를 $x$축의 방향으로 $p$만큼, $y$축의 방향으로 $q$만큼 평행이동한 그래프가 두 점 $(-2,0)$과 $(0,8)$을 지날 때, 두 상수 $p$와 $q$의 값을 구하고 그 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: p=-2; q=-1
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        함수 $y=3^x$의 그래프를 $x$축의 방향으로 $p$만큼, $y$축의 방향으로 $q$만큼 평행이동한 그래프를 나타내는 함수는 $y=3^{x-p}+q$
      source_flow: 예시답안 p.64
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        점 $(-2,0)$을 지나므로 $3^{-2-p}+q=0$ ㉠
      source_flow: 예시답안 p.64
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        점 $(0,8)$을 지나므로 $3^{-p}+q=8$ ㉡
      source_flow: 예시답안 p.64
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        ㉠, ㉡을 연립하여 풀면 $\dfrac{8}{9}\times3^{-p}=8$
      source_flow: 예시답안 p.64
      criteria:
      - 1.M4
    - id: 1b-5
      content: |
        에서 $3^{-p}=9$, $p=-2$. 이때 $q=-1$
      source_flow: 예시답안 p.64
      criteria:
      - 1.A1
