subparts:
- id: '1'
  stem: |
    곡선 $y=\log_2(x-1)+2$가 직선 $y=2$와 만나는 점을 A, 곡선 $y=\log_2(x-1)+2$가 직선 $y=5$와 만나는 점을 B, 점 B에서 $x$축에 내린 수선의 발을 C라 하자. 삼각형 ACB의 넓이를 구하고 그 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 35/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        점 A의 $x$좌표는 $\log_2(x-1)+2=2$, $\log_2(x-1)=0$에서 $x=2$이므로 점 A의 좌표는 A$(2,2)$
      source_flow: 예시답안 p.67
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        점 B의 $x$좌표는 $\log_2(x-1)+2=5$, $\log_2(x-1)=3$에서 $x=9$이므로 점 B의 좌표는 B$(9,5)$
      source_flow: 예시답안 p.67
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        따라서 점 C의 좌표는 C$(9,0)$
      source_flow: 예시답안 p.67
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        삼각형 ACB의 넓이는 $\dfrac{1}{2}\times5\times(9-2)=\dfrac{35}{2}$
      source_flow: 예시답안 p.67
      criteria:
      - 1.A1
