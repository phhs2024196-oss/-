stem: |
  [문제 5] [10점]
subparts:
- id: '1'
  stem: |
    다항함수 $f(x)$가 모든 실수 $x$에 대하여
    $$\int_{-1}^xf(t)dt=x^3+ax^2+\int_{-1}^1f(t)dt$$
    를 만족시킨다. 함수 $g(x)$를 $g(x)=\displaystyle\int_{-1}^xf(t)dt$라 할 때, $g(3)$의 값을 구하고 그 과정을 서술하시오. (단, $a$는 상수이다.)
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '20'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\displaystyle\int_{-1}^xf(t)dt=x^3+ax^2+\int_{-1}^1f(t)dt$ ㉠의 양변에 $x=1$을 대입하면 $\displaystyle\int_{-1}^1f(t)dt=1+a+\int_{-1}^1f(t)dt$에서 $a=-1$
      source_flow: 예시답안 p.70
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        ㉠의 양변을 $x$에 대하여 미분하면 $f(x)=3x^2+2ax=3x^2-2x$
      source_flow: 예시답안 p.70
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $$g(3)=\int_{-1}^3f(t)dt=\int_{-1}^3\left(3t^2-2t\right)dt=\left[t^3-t^2\right]_{-1}^3$$
      source_flow: 예시답안 p.70
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        $$\left[t^3-t^2\right]_{-1}^3=20$$
      source_flow: 예시답안 p.70
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: $x=1$을 대입하여 $a=-1$을 구했다.
      steps:
