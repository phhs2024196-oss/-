    - id: 1.M2
      mark_type: M
      points: 3
      evidence: 양변을 미분하여 $f(x)=3x^2-2x$를 구했다.
      steps:
      - 1b-2
    - id: 1.M3
      mark_type: M
      points: 2
      evidence: $g(3)=\int_{-1}^3\left(3t^2-2t\right)dt$를 세웠다.
      steps:
      - 1b-3
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: $g(3)=20$을 구했다.
      depends_on:
      - 1.M3
      steps:
      - 1b-4
