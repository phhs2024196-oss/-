      points: 3
      evidence: 접선과 수직이고 P를 지나는 직선의 방정식 $y=-\dfrac{1}{2a}(x-a)+a^2$을 구했다.
      steps:
      - 1b-1
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: 점 Q의 좌표 Q$\left(0,a^2+\dfrac{1}{2}\right)$를 구했다.
      steps:
      - 1b-2
    - id: 1.M3
      mark_type: M
      points: 3
      evidence: 삼각형 OPQ의 넓이 $S(a)=\dfrac{a}{2}\left(a^2+\dfrac{1}{2}\right)$을 구했다.
