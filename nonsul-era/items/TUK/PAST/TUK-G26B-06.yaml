stem: |
  [문제 6] [10점]
subparts:
- id: '1'
  stem: |
    양수 $a$에 대하여 곡선 $y=x^2$ 위의 점 P$(a,a^2)$에서의 접선과 수직이고 점 P를 지나는 직선이 $y$축과 만나는 점을 Q라 하자. 삼각형 OPQ의 넓이를 $S(a)$라 할 때, $\displaystyle\lim_{a\to0+}\dfrac{S(a)}{a}$의 값을 구하고 그 과정을 서술하시오. (단, O는 원점이다.)
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 1/4
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)=x^2$이라 하면 $f'(x)=2x$, $f'(a)=2a$. 곡선 위의 점 P$(a,a^2)$에서의 접선과 수직이고 점 P를 지나는 직선의 방정식은 $y=-\dfrac{1}{2a}(x-a)+a^2$
      source_flow: 예시답안 p.73
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        이므로 점 Q의 좌표는 Q$\left(0,a^2+\dfrac{1}{2}\right)$
      source_flow: 예시답안 p.73
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        삼각형 OPQ의 넓이는 $S(a)=\dfrac{1}{2}\times\left(a^2+\dfrac{1}{2}\right)\times a=\dfrac{a}{2}\left(a^2+\dfrac{1}{2}\right)$
      source_flow: 예시답안 p.73
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        $$\lim_{a\to0+}\dfrac{S(a)}{a}=\lim_{a\to0+}\dfrac{\dfrac{a}{2}\left(a^2+\dfrac{1}{2}\right)}{a}=\lim_{a\to0+}\dfrac{1}{2}\left(a^2+\dfrac{1}{2}\right)=\dfrac{1}{4}$$
      source_flow: 예시답안 p.73
      criteria:
      - 1.A1
  rubric:
