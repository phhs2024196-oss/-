stem: |
  [문제 7] [10점]
subparts:
- id: '1'
  stem: |
    시각 $t=0$일 때 동시에 원점을 출발하여 수직선 위를 움직이는 두 점 P, Q가 있다. 시각 $t$ $(t\ge0)$에서 두 점 P, Q의 속도를 각각 $v_1(t)$, $v_2(t)$라 하면
    $$v_1(t)=3t^2+kt+k,\ v_2(t)=2t-4$$
    이다. 두 점 P, Q는 출발한 후 시각 $t=a$일 때 동시에 운동 방향을 바꾼다. 시각 $t=a$일 때 두 점 P, Q 사이의 거리를 구하고 그 과정을 서술하시오. (단, $k$, $a$는 상수이다.)
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '4'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        두 점 P, Q가 시각 $t=a$일 때 동시에 운동 방향을 바꾸므로 $v_1(a)=0$, $v_2(a)=0$. $v_2(a)=2a-4=0$에서 $a=2$
      source_flow: 예시답안 p.76
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $v_1(a)=v_1(2)=12+2k+k=0$에서 $k=-4$. 따라서 $v_1(t)=3t^2-4t-4$이다. 시각 $t=2$일 때 점 P의 위치는 $0+\displaystyle\int_0^2v_1(t)dt=\left[t^3-2t^2-4t\right]_0^2=-8$ ㉠
      source_flow: 예시답안 p.76
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        시각 $t=2$일 때 점 Q의 위치는 $0+\displaystyle\int_0^2v_2(t)dt=\left[t^2-4t\right]_0^2=-4$ ㉡
      source_flow: 예시답안 p.76
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        ㉠, ㉡에서 시각 $t=2$일 때 두 점 P, Q 사이의 거리는 $4$
      source_flow: 예시답안 p.76
      criteria:
      - 1.A1
