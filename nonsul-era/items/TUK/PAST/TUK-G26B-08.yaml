subparts:
- id: '1'
  stem: |
    함수 $f(x)=\dfrac{x^3}{4}+ax-a^2+3$이 다음 조건을 만족시킨다.
    (가) 임의의 두 실수 $x_1$, $x_2$에 대하여 $x_1<x_2$일 때 $f(x_1)<f(x_2)$이다.
    (나) $x$에 대한 방정식 $f(x)-x=0$의 실근은 $2$뿐이다.
    함수 $f(x)$의 역함수를 $g(x)$라 할 때, 두 곡선 $y=f(x)$, $y=g(x)$와 직선 $y=-x-16$으로 둘러싸인 영역의 넓이를 구하고 그 과정을 서술하시오. (단, $a$는 상수이다.)
  points: 15
  depends_on: []
  answer:
    kind: value
    value: '120'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)=\dfrac{x^3}{4}+ax-a^2+3$, $f'(x)=\dfrac{3}{4}x^2+a$이므로 조건 (가)에서 $a\ge0$ ㉠
      source_flow: 예시답안 p.79-80
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        조건 (나)에서 $f(2)-2=2+2a-a^2+3-2=0$이므로 $a=-1$ 또는 $a=3$ ㉡. ㉠, ㉡에서 $a=3$. 따라서 $f(x)=\dfrac{x^3}{4}+3x-6$
      source_flow: 예시답안 p.79-80
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        두 곡선 $y=f(x)$, $y=g(x)$와 직선 $y=-x-16$으로 둘러싸인 영역의 넓이는 곡선 $y=f(x)$와 두 직선 $y=-x-16$, $y=x$로 둘러싸인 영역의 넓이의 $2$배이다. (ⅰ) 곡선 $y=f(x)$와 직선 $y=-x-16$의 교점의 $x$좌표는 $\dfrac{x^3}{4}+3x-6=-x-16$에서 $\dfrac{x^3}{4}+4x+10=\dfrac{1}{4}(x+2)(x^2-2x+20)=0$. 이때 $x^2-2x+20=(x-1)^2+19>0$이므로 $x=-2$
      source_flow: 예시답안 p.79-80
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        (ⅱ) 곡선 $y=f(x)$와 직선 $y=x$의 교점의 $x$좌표는 조건 (나)에 의해 $x=2$
      source_flow: 예시답안 p.79-80
      criteria:
      - 1.M4
    - id: 1b-5
      content: |
        (ⅲ) 두 직선 $y=-x-16$과 $y=x$의 교점의 $x$좌표는 $-x-16=x$에서 $x=-8$
      source_flow: 예시답안 p.79-80
      criteria:
      - 1.M5
    - id: 1b-6
      content: |
        곡선 $y=f(x)$와 두 직선 $y=-x-16$, $y=x$로 둘러싸인 영역의 넓이를 $A$라 하면
        $$A=\int_{-8}^{-2}\{x-(-x-16)\}dx+\int_{-2}^2\left\{x-\left(\dfrac{x^3}{4}+3x-6\right)\right\}dx=\left[x^2+16x\right]_{-8}^{-2}+\left[-\dfrac{x^4}{16}-x^2+6x\right]_{-2}^2=60$$
      source_flow: 예시답안 p.79-80
      criteria:
      - 1.M6
    - id: 1b-7
      content: |
        따라서 두 곡선 $y=f(x)$, $y=g(x)$와 직선 $y=-x-16$으로 둘러싸인 영역의 넓이는 $120$이다.
      source_flow: 예시답안 p.79-80
      criteria:
      - 1.A1
