stem: |
  [문제 9] [15점]
subparts:
- id: '1'
  stem: |
    최고차항의 계수가 $1$이고 상수항이 $k$인 삼차함수 $f(x)$가 다음 조건을 만족시킨다.
    (가) 함수 $f(x)$는 $x=3$에서 극솟값을 갖는다.
    (나) 집합 $\left\{x\mid\lim_{h\to0}\dfrac{f(x+h)-f(x)}{h}=-12\right\}$의 원소의 개수는 $1$이다.
    곡선 $y=f(x)$가 $x$축과 서로 다른 세 점에서 만나도록 하는 정수 $k$의 최댓값을 구하고 그 과정을 서술하시오.
  points: 15
  depends_on: []
  answer:
    kind: value
    value: '26'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        조건 (가)에서 $f'(3)=0$. 삼차함수 $f(x)$가 극솟값을 가지므로 극댓값도 갖는다. $x=\alpha$에서 극댓값을 갖는다고 하면 $f'(\alpha)=0$이고, 최고차항의 계수가 양수이므로 $\alpha<3$이다.
      source_flow: 예시답안 p.83-84
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $f'(x)$는 최고차항의 계수가 $3$인 이차함수이므로 $f'(x)=3(x-\alpha)(x-3)$
      source_flow: 예시답안 p.83-84
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        조건 (나)에서 방정식 $f'(x)=-12$의 실근의 개수가 $1$이므로 방정식 $3(x-\alpha)(x-3)=-12$, $x^2-(3+\alpha)x+3\alpha+4=0$의 판별식을 $D$라 하면 $D=(3+\alpha)^2-4(3\alpha+4)=0$, $\alpha^2-6\alpha-7=(\alpha+1)(\alpha-7)=0$에서 $\alpha=-1$ 또는 $\alpha=7$, $\alpha<3$이므로 $\alpha=-1$
      source_flow: 예시답안 p.83-84
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        따라서 $f'(x)=3(x+1)(x-3)=3x^2-6x-9$
      source_flow: 예시답안 p.83-84
      criteria:
      - 1.M4
    - id: 1b-5
      content: |
        상수항이 $k$이므로 $f(x)=x^3-3x^2-9x+k$
      source_flow: 예시답안 p.83-84
      criteria:
      - 1.M5
    - id: 1b-6
      content: |
        함수 $f(x)$의 극댓값은 $f(-1)=5+k$, 극솟값은 $f(3)=-27+k$
      source_flow: 예시답안 p.83-84
      criteria:
      - 1.M6
    - id: 1b-7
      content: |
        곡선 $y=f(x)$가 $x$축과 서로 다른 세 점에서 만나려면 $f(-1)=5+k>0$, $f(3)=-27+k<0$이므로 $-5<k<27$
      source_flow: 예시답안 p.83-84
      criteria:
      - 1.M7
    - id: 1b-8
      content: |
        따라서 정수 $k$의 최댓값은 $26$이다.
      source_flow: 예시답안 p.83-84
      criteria:
      - 1.A1
  - id: S1-ALT
    audience: ALT
    method_no: 2
    steps:
    - id: 1alt-1
      content: |
        별해(예시답안 첫 풀이): $f(x)=x^3+ax^2+bx+k$ ($a$, $b$는 상수)라 하면 $f'(x)=3x^2+2ax+b$. 조건 (가)에서 $f'(3)=27+6a+b=0$, $b=-27-6a$ ㉠. 조건 (나)에서 방정식 $f'(x)=-12$의 실근의 개수가 $1$이므로 $3x^2+2ax+b+12=0$의 판별식을 $D$라 하면 $D=4a^2-12(b+12)=0$, $a^2-3(b+12)=0$ ㉡. ㉠, ㉡을 연립하여 풀면 $a^2+18a+45=(a+15)(a+3)=0$에서 $a=-15$ 또는 $a=-3$. (ⅰ) $a=-15$일 때 $b=63$, $f'(x)=3(x-3)(x-7)$이므로 $x=3$에서 극댓값을 가져 조건 (가)에 모순이다. (ⅱ) $a=-3$일 때 $b=-9$, $f'(x)=3(x+1)(x-3)$이므로 $x=3$에서 극솟값을 가져 조건 (가)를 만족시킨다. 따라서 $f(x)=x^3-3x^2-9x+k$이고 이후는 같다.
      source_flow: 예시답안 p.83-84
