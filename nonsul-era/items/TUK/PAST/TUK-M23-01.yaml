stimuli: []
stem: |
  문제 1 (45점)
  수열 $\{a_n\}$의 첫째항부터 제 $n$항까지의 합이 $S_n=\dfrac32(n+n^2)$이고
  수열 $\{c_n\}$의 일반[판독확인: 원문 "일반" 뒤 "항" 누락 오식, 원문 그대로 둠]$c_n=\left(\dfrac{a_{n+1}}{3}\right)^2-\left(\dfrac{a_n}{3}\right)^2-1$일 때, 다음 물음에 답하시오. ($n$은 자연수)
subparts:
- id: '1'
  stem: |
    1.(10점) 수열 $\{a_n\}$의 일반항을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: expression
    value: 3*n
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $n\ge2$일 때 $a_n=S_n-S_{n-1}=\dfrac32(n+n^2)-\dfrac32\{(n-1)+(n-1)^2\}=3n$
      source_flow: 2023학년도 한국공학대학교 모의 논술고사 답안 p.2
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $a_1=S_1=\dfrac32(1+1)=3$이므로 $n=1$일 때도 성립한다. 따라서 $a_n=3n$
      source_flow: 2023학년도 한국공학대학교 모의 논술고사 답안 p.2
      criteria:
      - 1.A1
  # 채점기준 미공개 — 단계별 추정
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 6
      evidence: $a_n=S_n-S_{n-1}$ ($n\ge2$)을 이용해 식을 세웠다.
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: $a_1=S_1=3$을 확인하고 $a_n=3n$을 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    2.(10점) 수열 $\{c_n\}$에 대하여 $\displaystyle\sum_{n=1}^{10}c_n$을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '110'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $a_n=3n$이므로 $c_n=\left(\dfrac{3(n+1)}{3}\right)^2-\left(\dfrac{3n}{3}\right)^2-1=(n+1)^2-n^2-1=2n$
      source_flow: 2023학년도 한국공학대학교 모의 논술고사 답안 p.2
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        $\displaystyle\sum_{n=1}^{10}c_n=\sum_{n=1}^{10}2n=2\cdot\dfrac{10\cdot11}{2}=110$
      source_flow: 2023학년도 한국공학대학교 모의 논술고사 답안 p.2
      criteria:
      - 2.A1
