- id: '4'
  stem: |
    4.(15점) 좌표평면 위의 직선 $x+3y=(a_n)^2$와 직선 $x-\dfrac1ny=1$이 만나는 점을 $\mathrm{A}_n$, 두 직선이 $y$축과 만나는 점을 각각 $\mathrm{B}_n$과 $\mathrm{C}_n$이라 하자. 삼각형 $\triangle\mathrm{A}_n\mathrm{B}_n\mathrm{C}_n$의 넓이를 $M_n$이라 할 때, $\displaystyle\sum_{n=1}^{5}\dfrac{M_n}{3}$을 구하시오.
  points: 15
  depends_on: []
  answer:
    kind: value
    value: '365'
    equivalents: []
    tolerance: null
  solutions:
  - id: S4-B
    audience: B
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        두 직선의 교점은 $\mathrm{A}_n(3n,\,3n^2-n)$이고, $y$축과 만나는 점은 $\mathrm{B}_n(0,\,3n^2)$, $\mathrm{C}_n(0,\,-n)$이다.
      source_flow: 2023학년도 한국공학대학교 모의 논술고사 답안 p.3
      criteria:
      - 4.M1
    - id: 4b-2
      content: |
        삼각형 $\mathrm{A}_n\mathrm{B}_n\mathrm{C}_n$의 넓이는 $M_n=\dfrac12(3n^2+n)\cdot3n=\dfrac12(9n^3+3n^2)$
      source_flow: 2023학년도 한국공학대학교 모의 논술고사 답안 p.3
      criteria:
      - 4.A1
    - id: 4b-3
      content: |
        $\displaystyle\sum_{n=1}^{5}\dfrac{M_n}{3}=\dfrac16\sum_{n=1}^{5}(9n^3+3n^2)=\dfrac16\left\{9\left(\dfrac{5\cdot6}{2}\right)^2+3\cdot\dfrac{5\cdot6\cdot11}{6}\right\}=365$
      source_flow: 2023학년도 한국공학대학교 모의 논술고사 답안 p.3
      criteria:
      - 4.A2
