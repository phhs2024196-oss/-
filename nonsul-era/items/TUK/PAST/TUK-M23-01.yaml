- id: '3'
  stem: |
    3.(10점) 함수 $f(x)=\displaystyle\sum_{n=1}^{7}\dfrac17(x-a_n)^2$의 최솟값을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '36'
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $f(x)=\displaystyle\sum_{n=1}^{7}\dfrac17(x-3n)^2=\sum_{n=1}^{7}\dfrac17(x^2-6nx+9n^2)=\dfrac17\left(7x^2-6x\cdot\dfrac{7\cdot8}{2}+9\cdot\dfrac{7\cdot8\cdot15}{6}\right)=x^2-24x+180$
      source_flow: 2023학년도 한국공학대학교 모의 논술고사 답안 p.2
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        $f'(x)=2x-24$이므로 $x=12$일 때 최솟값 $f(12)=36$
      source_flow: 2023학년도 한국공학대학교 모의 논술고사 답안 p.2
      criteria:
      - 3.A1
