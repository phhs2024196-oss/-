  misconceptions: []
- id: '4'
  stem: |
    4.(15점) 다음 정적분 값을 구하라.
    $$\int_0^3f(x)+\lvert f(x)\rvert dx$$
  points: 15
  depends_on: []
  answer:
    kind: value
    value: 4/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S4-B
    audience: B
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        $0\le x\le2$일 때 $f(x)\le0$, $2\le x\le3$일 때 $f(x)\ge0$이므로 부호에 따라 구간을 나눈다.
      source_flow: 2023학년도 한국공학대학교 모의 논술고사 답안 p.5
      criteria:
      - 4.M1
    - id: 4b-2
      content: |
        $\displaystyle\int_0^3f(x)+\lvert f(x)\rvert dx=\int_0^2\{f(x)-f(x)\}dx+\int_2^3\{f(x)+f(x)\}dx=0+2\int_2^3f(x)dx$
      source_flow: 2023학년도 한국공학대학교 모의 논술고사 답안 p.5
      criteria:
      - 4.A1
    - id: 4b-3
      content: |
        $=2\displaystyle\int_2^3(-x^2+6x-8)dx=\dfrac43$
      source_flow: 2023학년도 한국공학대학교 모의 논술고사 답안 p.5
      criteria:
      - 4.A2
