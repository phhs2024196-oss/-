stimuli: []
stem: |
  문제2 (45점)
  실수 전체에서 미분 가능한 함수 $f(x)$에 대하여 도함수 $f'(x)=\begin{cases}4&,\ x\le1\\6-2x&,\ x\ge1\end{cases}$이고, $f(2)=0$이다.
subparts:
- id: '1'
  stem: |
    1.(10점) $f(1)$ 값을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '-3'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $x\ge1$에서 $f(x)=6x-x^2+d$이고 $f(2)=0$이므로 $12-4+d=0$, $d=-8$
      source_flow: 2023학년도 한국공학대학교 모의 논술고사 답안 p.4
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $f(1)=6-1-8=-3$
      source_flow: 2023학년도 한국공학대학교 모의 논술고사 답안 p.4
      criteria:
      - 1.A1
  # 채점기준 미공개 — 단계별 추정
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: $f(2)=0$으로 $x\ge1$에서의 식의 적분상수를 구했다.
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: $f(1)=-3$을 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    2.(10점) $f(x)$의 최댓값을 구하시오..
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '1'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $f(1)=-3$이고 $x\le1$에서 $f(x)=4x+c$이므로 $4+c=-3$, $c=-7$이다. 따라서 $f(x)=\begin{cases}4x-7&(x\le1)\\-x^2+6x-8&(x\ge1)\end{cases}$
      source_flow: 2023학년도 한국공학대학교 모의 논술고사 답안 p.4
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        $x\le1$에서 $f(x)$는 증가하고 $x\ge1$에서 $f(x)=-(x-3)^2+1$이므로 $x=3$에서 최댓값 $f(3)=1$을 가진다.
      source_flow: 2023학년도 한국공학대학교 모의 논술고사 답안 p.4
      criteria:
      - 2.A1
  # 채점기준 미공개 — 단계별 추정
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
