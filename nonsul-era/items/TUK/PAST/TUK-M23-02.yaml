  misconceptions: []
- id: '3'
  stem: |
    3.(10점) 극한값 $\displaystyle\lim_{x\to3}\dfrac{3f(x)-xf(3)}{x^2-9}$ 의 값을 구하라.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: -1/6
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $\displaystyle\lim_{x\to3}\dfrac{3f(x)-xf(3)}{x^2-9}=\lim_{x\to3}\dfrac{3\{f(x)-f(3)\}+(3-x)f(3)}{(x-3)(x+3)}$
      source_flow: 2023학년도 한국공학대학교 모의 논술고사 답안 p.4
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        $=\dfrac36f'(3)-\dfrac{f(3)}{6}=-\dfrac16$ ($f'(3)=6-6=0$, $f(3)=1$)
      source_flow: 2023학년도 한국공학대학교 모의 논술고사 답안 p.4
      criteria:
      - 3.A1
  # 채점기준 미공개 — 단계별 추정
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
