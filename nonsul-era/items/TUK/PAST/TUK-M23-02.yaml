      mark_type: M
      points: 5
      evidence: 분자를 $f(x)-f(3)$과 $(3-x)f(3)$으로 나누어 미분계수 꼴로 정리했다.
      steps:
      - 3b-1
    - id: 3.A1
      mark_type: A
      points: 5
      evidence: $f'(3)=0$, $f(3)=1$을 대입해 $-\dfrac16$을 구했다.
      depends_on:
      - 3.M1
      steps:
      - 3b-2
  outcome_codes:
