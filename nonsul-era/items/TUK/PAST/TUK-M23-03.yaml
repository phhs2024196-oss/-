stimuli: []
stem: |
  문제3 (60점)
  3차 함수 $f(x)=3x^3+6\sin\theta\cos\theta\,x^2+\sin^2\theta\,x+\cos\theta$에 대하여 다음 물음에 답하시오.
subparts:
- id: '1'
  stem: |
    1.(10점) $\theta=\dfrac{\pi}{2}$일 때, 곡선 $y=f(x)$가 $x$축과 만나는 점의 $x$좌표를 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '0'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\theta=\dfrac\pi2$이면 $\sin\theta=1$, $\cos\theta=0$이므로 $f(x)=3x^3+x=x(3x^2+1)$
      source_flow: 2023학년도 한국공학대학교 모의 논술고사 답안 p.6
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $3x^2+1>0$이므로 $f(x)=0$의 실근은 $x=0$뿐이다. 따라서 구하는 $x$좌표는 $x=0$
      source_flow: 2023학년도 한국공학대학교 모의 논술고사 답안 p.6
      criteria:
      - 1.A1
  # 채점기준 미공개 — 단계별 추정
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
