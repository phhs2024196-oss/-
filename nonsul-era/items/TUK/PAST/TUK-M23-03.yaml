  misconceptions: []
- id: '3'
  stem: |
    3.(20점) 곡선 $y=f(x)$에 대하여 수평접선이 단 하나만 생기는 모든 $\theta$ 값을 구하시오.
    (단 $0<\theta<\pi$)
  points: 20
  depends_on: []
  answer:
    kind: set
    value: pi/3, 2*pi/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        수평접선이 단 하나만 생기는 것은 $f'(x)=9x^2+12\sin\theta\cos\theta\,x+\sin^2\theta=0$이 중근을 갖는 것과 같다.
      source_flow: 2023학년도 한국공학대학교 모의 논술고사 답안 p.6
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        $D=36\sin^2\theta\cos^2\theta-9\sin^2\theta=0\ \Rightarrow\ 36\sin^2\theta\left(\cos\theta-\dfrac12\right)\left(\cos\theta+\dfrac12\right)=0$ (판별식 $D$는 $\dfrac D4$로 계산)
      source_flow: 2023학년도 한국공학대학교 모의 논술고사 답안 p.6
      criteria:
      - 3.A1
    - id: 3b-3
      content: |
        $\cos\theta=\pm\dfrac12$ 또는 $\sin\theta=0$이고 $0<\theta<\pi$이므로 $\theta=\dfrac\pi3,\ \dfrac{2\pi}3$
      source_flow: 2023학년도 한국공학대학교 모의 논술고사 답안 p.6
      criteria:
      - 3.A2
  # 채점기준 미공개 — 단계별 추정
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 8
      evidence: 수평접선이 하나만 생길 조건을 $f'(x)=0$이 중근을 갖는 것으로 바꿨다.
      steps:
      - 3b-1
    - id: 3.A1
      mark_type: A
      points: 6
      evidence: 판별식을 $\sin^2\theta\left(\cos\theta-\dfrac12\right)\left(\cos\theta+\dfrac12\right)=0$ 꼴로 정리했다.
      depends_on:
      - 3.M1
      steps:
      - 3b-2
    - id: 3.A2
      mark_type: A
      points: 6
      evidence: $\theta=\dfrac\pi3,\dfrac{2\pi}3$을 구했다.
      depends_on:
      - 3.M1
      steps:
      - 3b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '4'
  stem: |
    4.(20점) $\theta=\dfrac{\pi}{3}$일 때, 곡선 $y=f(x)$와 이 곡선에 대한 $x=0$에서의 접선으로 둘러싸인 영역의 넓이를 구하시오.
  points: 20
  depends_on: []
  answer:
    kind: value
    value: 9/64
    equivalents: []
    tolerance: null
  solutions:
  - id: S4-B
    audience: B
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        $\theta=\dfrac\pi3$이면 $f(x)=3x^3+\dfrac{3\sqrt3}{2}x^2+\dfrac34x+\dfrac12$이고 $x=0$에서의 접선은 $y=\dfrac34x+\dfrac12$
      source_flow: 2023학년도 한국공학대학교 모의 논술고사 답안 p.7
      criteria:
      - 4.M1
    - id: 4b-2
      content: |
        접선과 곡선의 교점은 $3x^3+\dfrac{3\sqrt3}{2}x^2=0$에서 $x=0$, $x=-\dfrac{\sqrt3}{2}$
      source_flow: 2023학년도 한국공학대학교 모의 논술고사 답안 p.7
      criteria:
      - 4.A1
    - id: 4b-3
      content: |
        구하는 넓이는 $\displaystyle\int_{-\frac{\sqrt3}{2}}^{0}\left(3x^3+\dfrac{3\sqrt3}{2}x^2\right)dx=\left[\dfrac34x^4+\dfrac{\sqrt3}{2}x^3\right]_{-\frac{\sqrt3}{2}}^{0}=\dfrac9{64}$
      source_flow: 2023학년도 한국공학대학교 모의 논술고사 답안 p.7
      criteria:
      - 4.A2
  # 채점기준 미공개 — 단계별 추정
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
