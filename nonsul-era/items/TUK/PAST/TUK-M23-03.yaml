      mark_type: M
      points: 5
      evidence: $\theta=\dfrac\pi2$를 대입해 $f(x)=x(3x^2+1)$로 인수분해했다.
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: $x=0$을 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    2.(10점) $\theta=\pi$일 때, 곡선 $y=f(x)$에 대한 $x=1$에서의 접선을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: expression
    value: 9*x-7
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $\theta=\pi$이면 $\sin\theta=0$, $\cos\theta=-1$이므로 $f(x)=3x^3-1$, $f'(x)=9x^2$, $f'(1)=9$, $f(1)=2$
      source_flow: 2023학년도 한국공학대학교 모의 논술고사 답안 p.6
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        접선의 방정식은 $y=9(x-1)+2=9x-7$
      source_flow: 2023학년도 한국공학대학교 모의 논술고사 답안 p.6
      criteria:
      - 2.A1
  # 채점기준 미공개 — 단계별 추정
  rubric:
