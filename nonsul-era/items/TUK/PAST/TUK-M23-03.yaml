      points: 6
      evidence: $f(x)$와 $x=0$에서의 접선 $y=\dfrac34x+\dfrac12$을 구했다.
      steps:
      - 4b-1
    - id: 4.A1
      mark_type: A
      points: 6
      evidence: 교점의 $x$좌표 $0$, $-\dfrac{\sqrt3}2$를 구했다.
      depends_on:
      - 4.M1
      steps:
      - 4b-2
    - id: 4.A2
      mark_type: A
      points: 8
      evidence: 정적분으로 넓이 $\dfrac9{64}$를 구했다.
      depends_on:
      - 4.M1
      steps:
      - 4b-3
