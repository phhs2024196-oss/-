- id: 1-2
  stem: |
    [1-2] [10점]
    지수함수 $f(x)=a^x\ (a>0,\ a\neq1)$이 $2f(2)=7a-3$을 만족시킨다. 어떤 양수 $b$에 대하여 $f(b)>1$일 때, $f(2)$의 값을 구하는 과정을 서술하시오. (단, $a$는 상수이다.)
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '9'
    equivalents: []
    tolerance: null
  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        $2f(2)=7a-3$에서 $2a^2=7a-3$, $2a^2-7a+3=0$, $(2a-1)(a-3)=0$이므로 $a=\dfrac12$ 또는 $a=3$
      source_flow: 2024학년도 수시모집 모의논술고사 문제 답안 p.3
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: |
        $b>0$일 때 $f(b)>1$이므로 $f(x)$는 $x$의 값이 증가하면 $y$의 값도 증가한다. 따라서 $a=3$이고 $f(x)=3^x$이므로 $f(2)=9$
      source_flow: 2024학년도 수시모집 모의논술고사 문제 답안 p.3
      criteria:
      - 1-2.A1
  # 채점기준 미공개 — 단계별 추정
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-2.M1
      mark_type: M
      points: 5
      evidence: $a$에 대한 이차방정식을 세워 $a=\dfrac12$, $3$을 구했다.
      steps:
      - 12b-1
    - id: 1-2.A1
      mark_type: A
      points: 5
      evidence: $f(b)>1$ ($b>0$)에서 $a>1$임을 밝혀 $a=3$, $f(2)=9$를 구했다.
      depends_on:
      - 1-2.M1
      steps:
      - 12b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 1-3
  stem: |
    [1-3] [10점]
    $0\le x<2\pi$에서 함수 $y=-2\cos^2x+2\sin x+1$의 최댓값과 최솟값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: max=3; min=-3/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S13-B
    audience: B
    method_no: 1
    steps:
    - id: 13b-1
      content: |
        $y=-2\cos^2x+2\sin x+1=-2(1-\sin^2x)+2\sin x+1=2\sin^2x+2\sin x-1$
      source_flow: 2024학년도 수시모집 모의논술고사 문제 답안 p.3
      criteria:
      - 1-3.M1
    - id: 13b-2
      content: |
        $t=\sin x$라 하면 $-1\le t\le1$이고 $y=2t^2+2t-1=2\left(t+\dfrac12\right)^2-\dfrac32$
      source_flow: 2024학년도 수시모집 모의논술고사 문제 답안 p.3
      criteria:
      - 1-3.A1
    - id: 13b-3
      content: |
        $t=-\dfrac12$일 때 최솟값 $-\dfrac32$, $t=1$일 때 최댓값 $3$
      source_flow: 2024학년도 수시모집 모의논술고사 문제 답안 p.3
      criteria:
      - 1-3.A2
  # 채점기준 미공개 — 단계별 추정
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-3.M1
      mark_type: M
      points: 4
      evidence: $\cos^2x=1-\sin^2x$로 $\sin x$에 대한 식으로 바꿨다.
      steps:
      - 13b-1
    - id: 1-3.A1
      mark_type: A
      points: 3
      evidence: $t=\sin x$로 치환하고 범위 $-1\le t\le1$을 밝혀 완전제곱식으로 정리했다.
      depends_on:
      - 1-3.M1
      steps:
      - 13b-2
    - id: 1-3.A2
      mark_type: A
      points: 3
      evidence: 최댓값 $3$, 최솟값 $-\dfrac32$를 구했다.
      depends_on:
      - 1-3.M1
      steps:
      - 13b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
