subparts:
- id: 1-1
  stem: |
    [1-1] [10점]
    다음은 두 실수 $x,y$에 대하여
    $$2^x=5^{3y}=10$$
    일 때, $\log_3\left(\dfrac3x+\dfrac1y\right)$의 값을 구하는 과정을 서술한 것이다. (가)∼(마)에 알맞은 값을 구하시오.
    $2^x=10$에서 $10^{\frac3x}=$ [(가)]이고, $5^{3y}=10$에서 $10^{\frac1y}=$ [(나)]이다.
    $10^{\frac3x+\frac1y}=$ [(다)]이므로 $\dfrac3x+\dfrac1y=$ [(라)]
    따라서 $\log_3\left(\dfrac3x+\dfrac1y\right)=$ [(마)]이다.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 가=8; 나=125; 다=1000; 라=3; 마=1
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        $2^x=10$에서 $10^{\frac3x}=(2^x)^{\frac3x}=2^3$이므로 (가)는 $2^3$ 또는 $8$
      source_flow: 2024학년도 수시모집 모의논술고사 문제 답안 p.2
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        $5^{3y}=10$에서 $10^{\frac1y}=(5^{3y})^{\frac1y}=5^3$이므로 (나)는 $5^3$ 또는 $125$
      source_flow: 2024학년도 수시모집 모의논술고사 문제 답안 p.2
      criteria:
      - 1-1.M2
    - id: 11b-3
      content: |
        $10^{\frac3x+\frac1y}=10^{\frac3x}\times10^{\frac1y}=2^3\times5^3=10^3$이므로 (다)는 $10^3$ 또는 $1000$이고 $\dfrac3x+\dfrac1y=3$이므로 (라)는 $3$
      source_flow: 2024학년도 수시모집 모의논술고사 문제 답안 p.2
      criteria:
      - 1-1.A1
    - id: 11b-4
      content: |
        따라서 $\log_3\left(\dfrac3x+\dfrac1y\right)=\log_33=1$이므로 (마)는 $1$
      source_flow: 2024학년도 수시모집 모의논술고사 문제 답안 p.2
      criteria:
      - 1-1.A2
