subparts:
- id: 2-1
  stem: |
    [2-1] [10점]
    모든 항이 양수인 등비수열 $\{a_n\}$에 대하여 $a_1=\dfrac13$, $a_2+a_3=2$일 때, 부등식 $a_n>40$을 만족시키는 자연수 $n$의 최솟값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '8'
    equivalents: []
    tolerance: null
  solutions:
  - id: S21-B
    audience: B
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        공비를 $r\ (r>0)$이라 하면 $a_2+a_3=\dfrac13r+\dfrac13r^2=2$에서 $r^2+r-6=0$, $(r+3)(r-2)=0$이므로 $r=2$ ($r>0$)
      source_flow: 2024학년도 수시모집 모의논술고사 문제 답안 p.4
      criteria:
      - 2-1.M1
    - id: 21b-2
      content: |
        $a_n=\dfrac13\times2^{n-1}>40$에서 $2^{n-1}>120$이고 $2^6=64$, $2^7=128$이므로 $n-1=7$에서 $n=8$
      source_flow: 2024학년도 수시모집 모의논술고사 문제 답안 p.4
      criteria:
      - 2-1.A1
  # 채점기준 미공개 — 단계별 추정
  rubric:
