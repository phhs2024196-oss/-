      mark_type: M
      points: 4
      evidence: 미분계수의 정의로 두 극한을 $f'(0)$, $2f'(x)$로 나타냈다.
      steps:
      - 22b-1
    - id: 2-2.A1
      mark_type: A
      points: 3
      evidence: $f'(0)=3$과 $f'(x)=\dfrac{x^2}{3}+3$을 구했다.
      depends_on:
      - 2-2.M1
      steps:
      - 22b-2
    - id: 2-2.A2
      mark_type: A
      points: 3
      evidence: 적분상수를 정해 $f(x)=\dfrac{x^3}{9}+3x$를 구했다.
      depends_on:
      - 2-2.M1
      steps:
      - 22b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 2-3
  stem: |
    [2-3] [10점]
    시각 $t=0$일 때 동시에 원점을 출발하여 수직선 위를 움직이는 두 점 $\mathrm{P},\mathrm{Q}$의 시각 $t\ (t\ge0)$에서의 속도가 각각
    $$v_1(t)=3t^2-6t,\quad v_2(t)=4t$$
    이고, 출발한 후 두 점 $\mathrm{P},\mathrm{Q}$가 시각 $t=a$에서 만난다. 점 P가 시각 $t=0$에서 $t=a$까지 움직인 거리를 $s$라 할 때, $s$를 구하는 과정을 서술하시오. (단, $a>0$)
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '58'
    equivalents: []
    tolerance: null
  solutions:
  - id: S23-B
    audience: B
    method_no: 1
    steps:
    - id: 23b-1
      content: |
        시각 $t=a$에서 P의 위치는 $\displaystyle\int_0^a(3t^2-6t)dt=a^3-3a^2$, Q의 위치는 $\displaystyle\int_0^a4t\,dt=2a^2$이다.
      source_flow: 2024학년도 수시모집 모의논술고사 문제 답안 p.5
      criteria:
      - 2-3.M1
    - id: 23b-2
      content: |
        두 점이 만나므로 $a^3-3a^2=2a^2$, $a^2(a-5)=0$이고 $a>0$이므로 $a=5$
      source_flow: 2024학년도 수시모집 모의논술고사 문제 답안 p.5
      criteria:
      - 2-3.A1
    - id: 23b-3
      content: |
        $s=\displaystyle\int_0^5\lvert3t^2-6t\rvert dt=\int_0^2(-3t^2+6t)dt+\int_2^5(3t^2-6t)dt=4+54=58$
      source_flow: 2024학년도 수시모집 모의논술고사 문제 답안 p.5
      criteria:
      - 2-3.A2
