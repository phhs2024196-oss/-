    meaning: 만점
  misconceptions: []
- id: 2-2
  stem: |
    [2-2] [10점]
    다항함수 $f(x)$가 모든 실수 $x$에 대하여
    $$\lim_{h\to0}\dfrac{f(h)}{h}\times\lim_{h\to0}\dfrac{f(x+2h)-f(x)}{h}=2x^2+18$$
    를 만족시킨다. 함수 $y=f(x)$의 그래프 위의 점 $(0,0)$에서의 접선의 기울기가 양수일 때, 함수 $f(x)$를 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: expression
    value: x**3/9+3*x
    equivalents: []
    tolerance: null
  solutions:
  - id: S22-B
    audience: B
    method_no: 1
    steps:
    - id: 22b-1
      content: |
        $f(0)=0$, $f'(0)>0$이므로 $\displaystyle\lim_{h\to0}\dfrac{f(h)}{h}=f'(0)$, $\displaystyle\lim_{h\to0}\dfrac{f(x+2h)-f(x)}{h}=2f'(x)$이다.
      source_flow: 2024학년도 수시모집 모의논술고사 문제 답안 p.4-5
      criteria:
      - 2-2.M1
    - id: 22b-2
      content: |
        $f'(0)\times2f'(x)=2x^2+18$에서 $f'(0)f'(x)=x^2+9$이고 $x=0$을 대입하면 $f'(0)^2=9$, $f'(0)>0$이므로 $f'(0)=3$, $f'(x)=\dfrac{x^2}3+3$
      source_flow: 2024학년도 수시모집 모의논술고사 문제 답안 p.4-5
      criteria:
      - 2-2.A1
    - id: 22b-3
      content: |
        $f(x)=\dfrac{x^3}9+3x+C$이고 $f(0)=0$이므로 $C=0$, 따라서 $f(x)=\dfrac{x^3}9+3x$
      source_flow: 2024학년도 수시모집 모의논술고사 문제 답안 p.4-5
      criteria:
      - 2-2.A2
  # 채점기준 미공개 — 단계별 추정
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
