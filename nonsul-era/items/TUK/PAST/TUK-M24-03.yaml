stimuli: []
stem: |
  [문제3]
  함수 $f(x)$가 다음과 같다. 물음에 답하시오.
  $$f(x)=\begin{cases}-2x-5&(x<a)\\bx^2-4&(x\ge a)\end{cases}\quad(\text{단, }a,b\text{는 상수이다.})$$
subparts:
- id: 3-1
  stem: |
    [3-1] [10점]
    함수 $f(x)$가 실수 전체의 집합에서 미분가능할 때, 상수 $a$와 $b$의 값과 함수 $f(x)$를 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: a=-1; b=1
    equivalents: []
    tolerance: null
  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: |
        $f(x)$가 $x=a$에서 연속이어야 하므로 $\displaystyle\lim_{x\to a-}f(x)=\lim_{x\to a+}f(x)=f(a)$에서 $-2a-5=a^2b-4$
      source_flow: 2024학년도 수시모집 모의논술고사 문제 답안 p.6
      criteria:
      - 3-1.M1
    - id: 31b-2
      content: |
        $x=a$에서 미분가능하므로 좌·우미분계수가 같아야 한다. 좌미분계수는 $-2$, 우미분계수는 $2ab$이므로 $-2=2ab$, $ab=-1$
      source_flow: 2024학년도 수시모집 모의논술고사 문제 답안 p.6
      criteria:
      - 3-1.M2
    - id: 31b-3
      content: |
        $-2a-5=a(ab)-4$에서 $-2a-5=-a-4$, $a=-1$이고 $ab=-1$에서 $b=1$. 따라서 $f(x)=\begin{cases}-2x-5&(x<-1)\\x^2-4&(x\ge-1)\end{cases}$
      source_flow: 2024학년도 수시모집 모의논술고사 문제 답안 p.6
      criteria:
      - 3-1.A1
  # 채점기준 미공개 — 단계별 추정
  rubric:
