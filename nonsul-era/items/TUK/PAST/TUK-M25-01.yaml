stem: |
  문제1 (10점)
subparts:
- id: '1'
  stem: |
    함수 $f(x)=\log_2(2\sin x+a)+b$는 $0\le x<\pi$ 구간에서 최댓값 5, 최솟값 4를 갖는다. $f\left(\dfrac\pi6\right)$값을 구하시오. (단, $a$와 $b$는 상수이다.)
  points: 10
  depends_on: []
  answer:
    kind: expression
    value: 3+log(3)/log(2)
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)=\log_2(2\sin x+a)+b$는 $2\sin x+a$의 값이 증가하면 $f(x)$도 증가하므로 $0\le x<\pi$에서 $2\sin x+a$는 $x=0$에서 최솟값, $x=\dfrac\pi2$에서 최댓값을 갖는다. 따라서 $x=0$에서 $\log_2a+b=4$, $x=\dfrac\pi2$에서 $\log_2(2+a)+b=5$
      source_flow: 2025학년도 한국공학대학교 모의 논술고사 답안 p.2
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        두 식에서 $a=2$, $b=3$이므로 $f\left(\dfrac\pi6\right)=\log_2(1+2)+3=3+\log_23$
      source_flow: 2025학년도 한국공학대학교 모의 논술고사 답안 p.2
      criteria:
      - 1.A1
