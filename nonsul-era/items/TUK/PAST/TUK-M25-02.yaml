stem: |
  문제2 (10점)
subparts:
- id: '1'
  stem: |
    수열 $\{a_n\}$의 첫째항부터 제 $n$항까지 합을 $S_n$이라 하자.
    모든 자연수 $n$에 대하여 $S_n=\dfrac{n}{3n+1}$일 때, $\displaystyle\sum_{k=1}^{5}\dfrac{1-16a_k^2}{a_k}$를 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '435'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $a_1=S_1=\dfrac14$, $n\ge2$일 때 $a_n=S_n-S_{n-1}=\dfrac{n}{3n+1}-\dfrac{n-1}{3n-2}=\dfrac1{(3n+1)(3n-2)}$이고 $a_1=\dfrac1{4\cdot1}$도 이 식을 만족시킨다.
      source_flow: 2025학년도 한국공학대학교 모의 논술고사 답안 p.3
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $\displaystyle\sum_{k=1}^{5}\dfrac{1-16a_k^2}{a_k}=\sum_{k=1}^{5}\dfrac1{a_k}-16\sum_{k=1}^{5}a_k$이고 $\dfrac1{a_k}=(3k+1)(3k-2)=9k^2-3k-2$
      source_flow: 2025학년도 한국공학대학교 모의 논술고사 답안 p.3
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        $\displaystyle\sum_{k=1}^{5}(9k^2-3k-2)-16S_5=\left\{9\cdot\dfrac{5\cdot6\cdot11}{6}-3\cdot\dfrac{5\cdot6}{2}-2\cdot5\right\}-16\cdot\dfrac5{16}=440-5=435$
      source_flow: 2025학년도 한국공학대학교 모의 논술고사 답안 p.3
      criteria:
      - 1.A2
  # 채점기준 미공개 — 단계별 추정
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
