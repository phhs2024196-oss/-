    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: $a_n=S_n-S_{n-1}$로 일반항 $a_n=\dfrac1{(3n+1)(3n-2)}$을 구했다.
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: 식을 $\sum\dfrac1{a_k}-16\sum a_k$로 나누고 $\dfrac1{a_k}=9k^2-3k-2$를 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: $S_5=\dfrac5{16}$을 이용해 $435$를 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-3
