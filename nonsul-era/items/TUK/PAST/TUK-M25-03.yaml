stem: |
  문제3 (10점)
subparts:
- id: '1'
  stem: |
    함수 $f(x)=1+\sin3x$라 할 때, $0\le x\le\pi$에서 방정식
    $$2f\left(x-\dfrac\pi2\right)f\left(x+\dfrac\pi2\right)-f(x-\pi)=0$$을
    만족시키는 해를 모두 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: set
    value: pi/18, 5*pi/18, pi/2, 13*pi/18, 17*pi/18
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f\left(x-\dfrac\pi2\right)=1+\sin\left(3x-\dfrac{3\pi}2\right)=1+\cos3x$, $f\left(x+\dfrac\pi2\right)=1+\sin\left(3x+\dfrac{3\pi}2\right)=1-\cos3x$, $f(x-\pi)=1+\sin(3x-3\pi)=1-\sin3x$
      source_flow: 2025학년도 한국공학대학교 모의 논술고사 답안 p.4
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $2(1-\cos^23x)-1+\sin3x=2\sin^23x+\sin3x-1=(2\sin3x-1)(\sin3x+1)=0$
      source_flow: 2025학년도 한국공학대학교 모의 논술고사 답안 p.4
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        $0\le3x\le3\pi$에서 $\sin3x=-1$이면 $3x=\dfrac{3\pi}2$, $x=\dfrac\pi2$이고 $\sin3x=\dfrac12$이면 $3x=\dfrac\pi6,\dfrac{5\pi}6,\dfrac{13\pi}6,\dfrac{17\pi}6$, $x=\dfrac\pi{18},\dfrac{5\pi}{18},\dfrac{13\pi}{18},\dfrac{17\pi}{18}$
      source_flow: 2025학년도 한국공학대학교 모의 논술고사 답안 p.4
      criteria:
      - 1.A2
  # 채점기준 미공개 — 단계별 추정
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
