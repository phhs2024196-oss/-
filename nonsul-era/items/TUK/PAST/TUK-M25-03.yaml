      mark_type: M
      points: 4
      evidence: 세 함숫값을 $\cos3x$, $\sin3x$로 정리했다.
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: 방정식을 $(2\sin3x-1)(\sin3x+1)=0$으로 인수분해했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: $3x$의 범위 $0\le3x\le3\pi$를 확인해 해 5개를 모두 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-3
