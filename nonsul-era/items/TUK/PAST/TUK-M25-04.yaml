stem: |
  문제4 (10점)
subparts:
- id: '1'
  stem: |
    자연수 $n$에 대하여 수열 $A_n=\displaystyle\int_{n-1}^{n}-\dfrac1n(x-n+1)(x-n)dx$ 일 때,
    $\displaystyle\sum_{n=1}^{10}\dfrac1{A_n}$ 값을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '330'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $A_1=\displaystyle\int_0^1-x(x-1)dx=\left[\dfrac12x^2-\dfrac13x^3\right]_0^1=\dfrac16$이고 $x-n+1=u$로 치환하면 $A_n=\displaystyle\int_0^1-\dfrac1nu(u-1)du=\dfrac1n\times\dfrac16$
      source_flow: 2025학년도 한국공학대학교 모의 논술고사 답안 p.5
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $\displaystyle\sum_{n=1}^{10}\dfrac1{A_n}=6(1+2+\cdots+10)=6\times55=330$
      source_flow: 2025학년도 한국공학대학교 모의 논술고사 답안 p.5
      criteria:
      - 1.A1
