stem: |
  문제5 (10점)
subparts:
- id: '1'
  stem: |
    다항함수 $g(x)$에 대하여 곡선 $y=g(x)$ 위의 점 $(1,g(1))$에서의 접선 방정식은 $y=2x+2$이다. 함수 $f(x)=(x^2+1)g(x)$일 때,
    극한값 $\displaystyle\lim_{x\to1}\dfrac1{x-1}\int_1^xf(t)\,dt$의 값과 미분 계수 $f'(1)$값을
    각각 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 극한값=8; fprime=12
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        접선의 방정식이 $y=2x+2$이므로 $g(1)=4$, $g'(1)=2$
      source_flow: 2025학년도 한국공학대학교 모의 논술고사 답안 p.6
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $f(x)$의 한 원시함수를 $F(x)$라 하면 $\displaystyle\lim_{x\to1}\dfrac1{x-1}\int_1^xf(t)dt=\lim_{x\to1}\dfrac{F(x)-F(1)}{x-1}=f(1)=2g(1)=8$
      source_flow: 2025학년도 한국공학대학교 모의 논술고사 답안 p.6
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        $f'(x)=2xg(x)+(x^2+1)g'(x)$이므로 $f'(1)=2g(1)+2g'(1)=12$
      source_flow: 2025학년도 한국공학대학교 모의 논술고사 답안 p.6
      criteria:
      - 1.A2
