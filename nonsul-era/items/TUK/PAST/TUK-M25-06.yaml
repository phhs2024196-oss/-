stem: |
  문제 6 (15점)
subparts:
- id: '1'
  stem: |
    두 일차함수 $f(x)$와 $g(x)$에 대하여
    $$\lim_{x\to1}\dfrac{f(x)g(x)}{(x-1)^2}=-2,\ \lim_{x\to1}\dfrac{f(x)+g(x)}{x-1}=1$$ 일 때,
    $\{f(x)g(x)\}'$을 구하시오.
  points: 15
  depends_on: []
  answer:
    kind: expression
    value: -4*x+4
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        두 극한이 존재하려면 분모가 $0$이 되는 $x=1$에서 분자도 $0$이어야 하므로 $f(1)g(1)=0$, $f(1)+g(1)=0$이고 $f(1)=g(1)=0$
      source_flow: 2025학년도 한국공학대학교 모의 논술고사 답안 p.7
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        일차함수이므로 $f(x)=a(x-1)$, $g(x)=b(x-1)$이라 하면 $\displaystyle\lim_{x\to1}\dfrac{f(x)g(x)}{(x-1)^2}=ab=-2$, $\displaystyle\lim_{x\to1}\dfrac{f(x)+g(x)}{x-1}=a+b=1$
      source_flow: 2025학년도 한국공학대학교 모의 논술고사 답안 p.7
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        $f(x)g(x)=ab(x-1)^2=-2(x-1)^2$이므로 $\{f(x)g(x)\}'=-4(x-1)=-4x+4$
      source_flow: 2025학년도 한국공학대학교 모의 논술고사 답안 p.7
      criteria:
      - 1.A2
