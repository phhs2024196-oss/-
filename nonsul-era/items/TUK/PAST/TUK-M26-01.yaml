subparts:
- id: '1'
  stem: |
    두 직선 $y=(\log_32)x,\ y=(\log_4a)x$가 서로 수직이 되도록 하는 양수 $a$의 값을 구하고 그 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 1/9
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        두 직선이 서로 수직이므로 기울기의 곱이 $-1$이다. $\log_32\times\log_4a=-1$
      source_flow: 2026학년도 한국공학대학교 모의논술고사 답안 p.2
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $\log_32\times\log_{2^2}a=\log_32\times\dfrac12\log_2a=-1$에서 $\log_32\times\log_2a=-2$, 즉 $\log_3a=-2$
      source_flow: 2026학년도 한국공학대학교 모의논술고사 답안 p.2
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        따라서 $a=3^{-2}=\dfrac19$
      source_flow: 2026학년도 한국공학대학교 모의논술고사 답안 p.2
      criteria:
      - 1.A2
