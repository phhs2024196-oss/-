subparts:
- id: '1'
  stem: |
    $0\le\theta<2\pi$일 때, 부등식
    $$\cos^2\theta+3\sin^2\theta-3\cos\theta-1\ge0$$
    을 만족시키는 모든 $\theta$의 값의 범위가 $\alpha\le\theta\le\beta$이다. $\sin\left(\dfrac{\alpha+\beta}{6}\right)$의 값을 구하고 그 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: sqrt(3)/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\sin^2\theta=1-\cos^2\theta$를 대입하면 $-2\cos^2\theta-3\cos\theta+2\ge0$, $2\cos^2\theta+3\cos\theta-2\le0$, $(\cos\theta+2)(2\cos\theta-1)\le0$
      source_flow: 2026학년도 한국공학대학교 모의논술고사 답안 p.3
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $\cos\theta+2>0$이므로 $2\cos\theta-1\le0$, $\cos\theta\le\dfrac12$에서 $\dfrac\pi3\le\theta\le\dfrac{5\pi}3$이므로 $\alpha+\beta=2\pi$
      source_flow: 2026학년도 한국공학대학교 모의논술고사 답안 p.3
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        따라서 $\sin\left(\dfrac{\alpha+\beta}{6}\right)=\sin\dfrac\pi3=\dfrac{\sqrt3}2$
      source_flow: 2026학년도 한국공학대학교 모의논술고사 답안 p.3
      criteria:
      - 1.A2
