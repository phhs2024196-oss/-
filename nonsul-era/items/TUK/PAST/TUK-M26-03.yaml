stem: |
  [문제3] [10점]
subparts:
- id: '1'
  stem: |
    함수 $f(x)=-3x^2+3$에 대하여 곡선 $y=f(x)$ 위의 점 $\mathrm{P}(t,f(t))$에서의 접선이 $y$축과 만나는 점을 $\mathrm{Q}$라 할 때, 삼각형 OPQ의 넓이를 $g(t)$라 하자. $g'\left(\dfrac12\right)$의 값을 구하고 그 과정을 서술하시오. (단, $0<t<1$이고 O는 원점이다.)
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 21/8
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f'(x)=-6x$이므로 점 $(t,f(t))$에서의 접선은 $y-(-3t^2+3)=-6t(x-t)$이고 $y$축과 만나는 점은 $\mathrm{Q}(0,\,3t^2+3)$
      source_flow: 2026학년도 한국공학대학교 모의논술고사 답안 p.4
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        삼각형 OPQ의 넓이는 $g(t)=\dfrac12\cdot t\cdot(3t^2+3)=\dfrac32t^3+\dfrac32t$
      source_flow: 2026학년도 한국공학대학교 모의논술고사 답안 p.4
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        $g'(t)=\dfrac92t^2+\dfrac32$이므로 $g'\left(\dfrac12\right)=\dfrac98+\dfrac32=\dfrac{21}8$
      source_flow: 2026학년도 한국공학대학교 모의논술고사 답안 p.4
      criteria:
      - 1.A2
