stem: |
  [문제4] [10점]
subparts:
- id: '1'
  stem: |
    시각 $t=0$에서 원점을 출발하여 수직선 위를 움직이는 점 $\mathrm{P}$의 시각 $t\ (t\ge0)$에서의 속도 $v(t)$가 $v(t)=kt^2+t$이다. 시각 $t=3$에서 점 P의 위치가 9일 때, 시각 $t=4$에서 점 P의 가속도를 구하고 그 과정을 서술하시오. (단, $k$는 상수이다.)
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '5'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        시각 $t=3$에서 P의 위치는 $0+\displaystyle\int_0^3v(t)dt=\int_0^3(kt^2+t)dt=\left[\dfrac k3t^3+\dfrac12t^2\right]_0^3=9k+\dfrac92$
      source_flow: 2026학년도 한국공학대학교 모의논술고사 답안 p.5
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $9k+\dfrac92=9$에서 $k=\dfrac12$이고 $v(t)=\dfrac12t^2+t$
      source_flow: 2026학년도 한국공학대학교 모의논술고사 답안 p.5
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        가속도 $a(t)=\dfrac{d}{dt}v(t)=t+1$이므로 $a(4)=5$
      source_flow: 2026학년도 한국공학대학교 모의논술고사 답안 p.5
      criteria:
      - 1.A2
