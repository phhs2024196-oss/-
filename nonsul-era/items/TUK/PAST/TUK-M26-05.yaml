stem: |
  [문제5] [10점]
subparts:
- id: '1'
  stem: |
    함수 $f(x)=x^3-2x^2+2x$의 역함수를 $g(x)$라 하자. 두 곡선 $y=f(x),\ y=g(x)$로 둘러싸인 부분의 넓이를 구하고 그 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 1/6
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f'(x)=3x^2-4x+2$에서 $3x^2-4x+2=0$의 판별식 $D=16-24<0$이므로 모든 실수 $x$에 대하여 $f'(x)>0$이고 $f(x)$는 증가한다. 따라서 두 곡선 $y=f(x)$, $y=g(x)$의 교점은 $y=f(x)$와 $y=x$의 교점과 같다.
      source_flow: 2026학년도 한국공학대학교 모의논술고사 답안 p.6
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $x^3-2x^2+2x=x$에서 $x(x-1)^2=0$, $x=0$ 또는 $x=1$. 두 곡선은 직선 $y=x$에 대하여 대칭이므로 구하는 넓이는 $y=f(x)$와 $y=x$로 둘러싸인 부분의 넓이의 $2$배이다.
      source_flow: 2026학년도 한국공학대학교 모의논술고사 답안 p.6
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        $2\displaystyle\int_0^1\lvert f(x)-x\rvert dx=2\int_0^1(x^3-2x^2+x)dx=2\left[\dfrac14x^4-\dfrac23x^3+\dfrac12x^2\right]_0^1=2\times\dfrac1{12}=\dfrac16$
      source_flow: 2026학년도 한국공학대학교 모의논술고사 답안 p.6
      criteria:
      - 1.A2
