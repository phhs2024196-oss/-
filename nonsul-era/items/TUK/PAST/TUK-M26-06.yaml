stem: |
  [문제6] [15점]
subparts:
- id: '1'
  stem: |
    다항함수 $f(x)=x^3+2ax+b$가 다음 조건을 만족시킨다.
    (가) $\displaystyle\lim_{x\to0}\dfrac{f(1+x)-f(1)}{x}=\dfrac52$
    (나) $\displaystyle\int_0^2f(x)dx=3$
    함수 $g(x)=\displaystyle\int_0^xf(t)dt$의 극댓값과 극솟값을 모두 구하고 그 과정을 서술하시오.
    (단, $a,b$는 상수이다.)
  points: 15
  depends_on: []
  answer:
    kind: value
    value: max=0; min=-1/16
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        조건 (가)에서 $f'(1)=\dfrac52$이고 $f'(x)=3x^2+2a$이므로 $3+2a=\dfrac52$, $a=-\dfrac14$, $f(x)=x^3-\dfrac12x+b$
      source_flow: 2026학년도 한국공학대학교 모의논술고사 답안 p.7
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        조건 (나)에서 $\displaystyle\int_0^2\left(x^3-\dfrac12x+b\right)dx=\left[\dfrac14x^4-\dfrac14x^2+bx\right]_0^2=4-1+2b=3$이므로 $b=0$, $f(x)=x^3-\dfrac12x$
      source_flow: 2026학년도 한국공학대학교 모의논술고사 답안 p.7
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        $g'(x)=f(x)=x\left(x+\dfrac1{\sqrt2}\right)\left(x-\dfrac1{\sqrt2}\right)$이므로 $g'(x)=0$에서 $x=-\dfrac1{\sqrt2},0,\dfrac1{\sqrt2}$이고 증감표를 만들면 $x=-\dfrac1{\sqrt2}$, $x=\dfrac1{\sqrt2}$에서 극소, $x=0$에서 극대이다.
      source_flow: 2026학년도 한국공학대학교 모의논술고사 답안 p.7
      criteria:
      - 1.A2
    - id: 1b-4
      content: |
        $g(x)=\displaystyle\int_0^x\left(t^3-\dfrac12t\right)dt=\dfrac14(x^4-x^2)$이므로 $x=\pm\dfrac1{\sqrt2}$에서 극솟값 $g\left(\pm\dfrac1{\sqrt2}\right)=-\dfrac1{16}$, $x=0$에서 극댓값 $g(0)=0$
      source_flow: 2026학년도 한국공학대학교 모의논술고사 답안 p.7
      criteria:
      - 1.A3
