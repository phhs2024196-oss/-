subparts:
- id: '1'
  stem: |
    $0\le x<2\pi$일 때, 방정식 $2\sin^2x+\cos\left(\dfrac\pi2+x\right)-1=0$을 만족시키는 모든 실근의 합을 구하고 그 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: expression
    value: 7*pi/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\cos\left(\dfrac\pi2+x\right)=-\sin x$이므로 방정식은 $2\sin^2x-\sin x-1=0$이고 $(2\sin x+1)(\sin x-1)=0$
      source_flow: 2027학년도 한국공학대학교 모의논술고사 답안 p.2
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $\sin x=-\dfrac12$ 또는 $\sin x=1$이고 $0\le x<2\pi$이므로 $x=\dfrac76\pi,\ \dfrac{11}6\pi,\ \dfrac\pi2$
      source_flow: 2027학년도 한국공학대학교 모의논술고사 답안 p.2
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        모든 실근의 합은 $\dfrac76\pi+\dfrac{11}6\pi+\dfrac\pi2=3\pi+\dfrac\pi2=\dfrac72\pi$
      source_flow: 2027학년도 한국공학대학교 모의논술고사 답안 p.2
      criteria:
      - 1.A2
