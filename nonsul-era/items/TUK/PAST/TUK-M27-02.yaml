subparts:
- id: '1'
  stem: |
    직선 $x=k$가 두 함수 $y=2^{x-1},\ y=4^x+1$의 그래프와 만나는 점을 각각 $\mathrm{A},\ \mathrm{B}$라 하자. 점 $\mathrm{P}(k,0)$에 대하여 $\overline{\mathrm{PA}}:\overline{\mathrm{AB}}=1:4$가 되도록 하는 양수 $k$의 값을 구하고 그 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '1'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\overline{\mathrm{PA}}:\overline{\mathrm{AB}}=1:4$이므로 $\overline{\mathrm{PA}}:\overline{\mathrm{PB}}=1:5$이고 $\overline{\mathrm{PA}}=2^{k-1}$, $\overline{\mathrm{PB}}=4^k+1$
      source_flow: 2027학년도 한국공학대학교 모의논술고사 답안 p.3
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $2^{k-1}:4^k+1=1:5$에서 $4^k+1=5\times2^{k-1}$이고 $2^k=s$라 하면 $s^2-\dfrac52s+1=0$, $(2s-1)(s-2)=0$이므로 $s=\dfrac12$ 또는 $s=2$
      source_flow: 2027학년도 한국공학대학교 모의논술고사 답안 p.3
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        $2^k=\dfrac12$에서 $k=-1$, $2^k=2$에서 $k=1$이고 $k$는 양수이므로 $k=1$
      source_flow: 2027학년도 한국공학대학교 모의논술고사 답안 p.3
      criteria:
      - 1.A2
