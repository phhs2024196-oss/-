stem: |
  [문제3] [10점]
subparts:
- id: '1'
  stem: |
    두 양수 $a,b$에 대하여 직선 $y=2x+1$이 두 점 $\mathrm{A}(0,\log_3ab)$, $\mathrm{B}\left(1,\log_3\dfrac ba\right)$를 지날 때, $a,b$의 값을 구하고 그 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: a=1/3; b=9
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        점 $\mathrm{A}(0,\log_3ab)$가 직선 $y=2x+1$ 위에 있으므로 $\log_3ab=1$, $\log_3a+\log_3b=1\ \cdots\ ㉠$
      source_flow: 2027학년도 한국공학대학교 모의논술고사 답안 p.4
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        점 $\mathrm{B}\left(1,\log_3\dfrac ba\right)$가 직선 위에 있으므로 $\log_3\dfrac ba=3$, $\log_3b-\log_3a=3\ \cdots\ ㉡$
      source_flow: 2027학년도 한국공학대학교 모의논술고사 답안 p.4
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        ㉠과 ㉡을 변끼리 더하면 $2\log_3b=4$, $\log_3b=2$, $b=9$이고 이를 ㉠에 대입하면 $\log_3a=-1$, $a=\dfrac13$
      source_flow: 2027학년도 한국공학대학교 모의논술고사 답안 p.4
      criteria:
      - 1.A1
