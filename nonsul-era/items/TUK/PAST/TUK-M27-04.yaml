stem: |
  [문제4] [10점]
subparts:
- id: '1'
  stem: |
    시각 $t=0$일 때 원점을 출발하여 수직선 위를 움직이는 점 $\mathrm{P}$의 시각 $t\ (t\ge0)$에서의 속도 $v(t)$가 $v(t)=t^2+at$이다. 시각 $t=3$에서 점 P의 위치가 원점일 때, 시각 $t=0$에서 $t=3$까지 점 P가 움직인 거리를 구하고 그 과정을 서술하시오. (단, $a$는 상수이다.)
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 8/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        시각 $t=3$에서 P의 위치는 $0+\displaystyle\int_0^3v(t)dt=\left[\dfrac{t^3}3+\dfrac a2t^2\right]_0^3=9+\dfrac92a$이고 위치가 원점이므로 $9+\dfrac92a=0$, $a=-2$
      source_flow: 2027학년도 한국공학대학교 모의논술고사 답안 p.5
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $v(t)=t^2-2t=t(t-2)$이므로 $0\le t\le2$일 때 $v(t)\le0$, $2\le t\le3$일 때 $v(t)\ge0$
      source_flow: 2027학년도 한국공학대학교 모의논술고사 답안 p.5
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        움직인 거리는 $\displaystyle\int_0^3\lvert v(t)\rvert dt=-\int_0^2v(t)dt+\int_2^3v(t)dt=-\left[\dfrac{t^3}3-t^2\right]_0^2+\left[\dfrac{t^3}3-t^2\right]_2^3=\dfrac43+\dfrac43=\dfrac83$
      source_flow: 2027학년도 한국공학대학교 모의논술고사 답안 p.5
      criteria:
      - 1.A2
