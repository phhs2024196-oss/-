stem: |
  [문제5] [10점]
subparts:
- id: '1'
  stem: |
    함수 $f(x)=x^3+x+1$의 역함수를 $g(x)$라 할 때, $\displaystyle\int_1^3g(x)dx$의 값을 구하고 그 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 5/4
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f'(x)=3x^2+1>0$이므로 $f(x)$는 실수 전체에서 증가한다. $f(x)=1$에서 $x^3+x=0$, $x=0$이므로 $g(1)=0$이고 $f(x)=3$에서 $x^3+x-2=(x-1)(x^2+x+2)=0$, $x=1$이므로 $g(3)=1$
      source_flow: 2027학년도 한국공학대학교 모의논술고사 답안 p.6
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $\displaystyle\int_1^3g(x)dx$는 곡선 $y=f(x)$와 $y$축 방향 직선들로 둘러싸인 넓이이므로 $\displaystyle\int_1^3g(x)dx=3\cdot1-\int_0^1f(x)dx$
      source_flow: 2027학년도 한국공학대학교 모의논술고사 답안 p.6
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        $=3-\displaystyle\int_0^1(x^3+x+1)dx=3-\dfrac74=\dfrac54$
      source_flow: 2027학년도 한국공학대학교 모의논술고사 답안 p.6
      criteria:
      - 1.A2
