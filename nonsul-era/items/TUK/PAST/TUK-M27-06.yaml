stem: |
  [문제6] [15점]
subparts:
- id: '1'
  stem: |
    함수 $f(x)=x^2-4x+4$에 대하여 곡선 $y=f(x)$ 위의 점 $(t,f(t))$에서의 접선이 $x$축, $y$축과 만나는 점을 각각 $\mathrm{P},\ \mathrm{Q}$라 하자. 삼각형 OPQ의 넓이의 최댓값을 구하고 그 과정을 서술하시오. (단, $0<t<2$이고 O는 원점이다.)
  points: 15
  depends_on: []
  answer:
    kind: value
    value: 64/27
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f'(x)=2x-4$이므로 점 $(t,f(t))$에서의 접선은 $y-(t^2-4t+4)=(2t-4)(x-t)$이다. 접선이 $x$축과 만나는 점은 $\mathrm{P}\left(\dfrac{t+2}2,0\right)$, $y$축과 만나는 점은 $\mathrm{Q}(0,\,-t^2+4)$
      source_flow: 2027학년도 한국공학대학교 모의논술고사 답안 p.7
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        삼각형 OPQ의 넓이는 $g(t)=\dfrac12\cdot\dfrac{t+2}2\cdot(-t^2+4)=\dfrac14(-t^3-2t^2+4t+8)$
      source_flow: 2027학년도 한국공학대학교 모의논술고사 답안 p.7
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        $g'(t)=\dfrac14(-3t^2-4t+4)=-\dfrac14(t+2)(3t-2)$에서 $0<t<2$일 때 $t=\dfrac23$에서 극대(증감표: $g'>0\to g'<0$)이므로 최대
      source_flow: 2027학년도 한국공학대학교 모의논술고사 답안 p.7
      criteria:
      - 1.A2
    - id: 1b-4
      content: |
        따라서 넓이의 최댓값은 $g\left(\dfrac23\right)=\dfrac{64}{27}$
      source_flow: 2027학년도 한국공학대학교 모의논술고사 답안 p.7
      criteria:
      - 1.A3
