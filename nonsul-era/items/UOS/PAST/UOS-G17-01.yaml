  misconceptions: []
- id: 1-2
  stem: |
    (b) 직선 AB의 기울기가 1일 때, 삼각형 ABC의 넓이의 최댓값을 구하여라. (60점)
  points: 60
  depends_on: []
  answer:
    kind: value
    value: 3*sqrt(15)/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        점 C와 직선 $y=x+b$ 사이의 거리를 $d$라 하면 삼각형 ABC의 넓이는 $S=\dfrac12\cdot\overline{AB}\cdot d$이다. $y=x+b$를 $\dfrac{x^2}{5}+\dfrac{y^2}{4}=1$에 대입하여 정리하면 $9x^2+10bx+5b^2-20=0$이다. 이 이차방정식의 두 근을 $\alpha$, $\beta$로 놓으면 $\overline{AB}=\sqrt2\left|\alpha-\beta\right|$이다. $\left|\alpha-\beta\right|$를 근과 계수와의 관계를 이용하여 계산하면 $\left|\alpha-\beta\right|=\sqrt{(\alpha+\beta)^2-4\alpha\beta}=\sqrt{\left(\dfrac{-10b}{9}\right)^2-4\cdot\dfrac{5b^2-20}{9}}=\dfrac{4\sqrt5}{9}\sqrt{9-b^2}$이므로 $\overline{AB}=\sqrt2\left|\alpha-\beta\right|=\dfrac{4\sqrt{10}}{9}\sqrt{9-b^2}$이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: |
        일반성을 잃지 않고 $b\le0$이라 하자. 그러면 점 C의 좌표는 $\left(-\dfrac53,\dfrac43\right)$일 때 $S$가 최대가 되고, 이때 점 C와 직선 $y=x+b$ 사이의 거리는 $\dfrac{3-b}{\sqrt2}$이다. 이를 이용하여 $S$를 계산하면 $S=\dfrac12\cdot\overline{AB}\cdot d=\dfrac12\cdot\dfrac{4\sqrt{10}}{9}\sqrt{9-b^2}\cdot\dfrac{3-b}{\sqrt2}=\dfrac{2\sqrt5}{9}\sqrt{(3-b)^3(3+b)}$이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 1-2.M1
    - id: 12b-3
      content: |
        구간 $(-3,0]$에서 함수 $f(x)=(3-x)^3(3+x)$의 최댓값을 구하자. $f'(x)=-3(3-x)^2(3+x)+(3-x)^3=(3-x)^2(-6-4x)$이므로 $f(x)$는 $x=-\dfrac32$에서 극대가 되고 최대가 된다. 따라서 $S$의 최댓값은 $S=\dfrac{2\sqrt5}{9}\sqrt{\left(\dfrac92\right)^3\dfrac32}=\dfrac{2\sqrt5}{9}\cdot\dfrac{27\sqrt3}{4}=\dfrac32\sqrt{15}$이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 1-2.A1
