      points: 20
      evidence: 직선에서 가장 먼 타원 위의 점(기울기 1인 접선의 접점)을 찾아 $d=\dfrac{3}{\sqrt2}$, 최댓값 $2\sqrt5$를 구했다.
      depends_on:
      - 1-1.M1
      steps:
      - 11b-2
  outcome_codes:
