stimuli: []
stem: |
  [문제 1] (총 100점)
  타원 $\dfrac{x^2}{5}+\dfrac{y^2}{4}=1$에 내접하는 삼각형 ABC가 있다.
subparts:
- id: 1-1
  stem: |
    (a) 직선 AB의 방정식이 $y=x$일 때, 삼각형 ABC의 넓이의 최댓값을 구하여라. (40점)
  points: 40
  depends_on: []
  answer:
    kind: value
    value: 2*sqrt(5)
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        점 C와 직선 $y=x$ 사이의 거리를 $d$라 하면 삼각형 ABC의 넓이는 $S=\dfrac12\cdot\overline{AB}\cdot d$이다. $y=x$와 $\dfrac{x^2}{5}+\dfrac{y^2}{4}=1$을 연립하여 풀면 $(x,y)=\left(-\dfrac{2\sqrt5}{3},-\dfrac{2\sqrt5}{3}\right)$ 또는 $\left(\dfrac{2\sqrt5}{3},\dfrac{2\sqrt5}{3}\right)$이므로 $\overline{AB}=\dfrac{4\sqrt{10}}{3}$이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        점 C에서의 접선의 기울기가 1일 때 삼각형 ABC의 넓이가 최대가 된다. 이 접선의 방정식을 구하기 위해 $y=x+k$를 $\dfrac{x^2}{5}+\dfrac{y^2}{4}=1$에 대입하여 정리하면 $9x^2+10kx+5k^2-20=0$이고, 이 이차방정식의 판별식을 $D$라 할 때 $D=(10k)^2-4\cdot9\cdot(5k^2-20)=0$에서 $k=\pm3$이고 점 C의 좌표는 $\left(-\dfrac53,\dfrac43\right)$ 또는 $\left(\dfrac53,-\dfrac43\right)$이다. 따라서 $d$의 최댓값은 $\dfrac{3}{\sqrt2}$이므로 구하고자 하는 $S$의 최댓값은 $2\sqrt5$이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 1-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
