stimuli: []
stem: |
  [문제 3] (총 100점)
  예각삼각형 ABC의 두 꼭짓점 B, C에서 각각의 대변에 내린 두 수선의 교점을 P라 하고,
  $u=\overrightarrow{AB}\cdot\overrightarrow{AB},\quad v=\overrightarrow{AB}\cdot\overrightarrow{AC},\quad w=\overrightarrow{AC}\cdot\overrightarrow{AC}$
  라 하자.
subparts:
- id: 3-1
  stem: |
    이때 $\overrightarrow{AP}=x\overrightarrow{AB}+y\overrightarrow{AC}$를 만족시키는 두 실수 $x,\ y$의 값을 $u,\ v,\ w$를 사용하여 나타내어라.
  points: 100
  depends_on: []
  answer:
    kind: value
    value: x=(v^2-v*w)/(v^2-u*w); y=(v^2-u*v)/(v^2-u*w)
    equivalents: []
    tolerance: null
  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: |
        $\overrightarrow{BP}\perp\overrightarrow{AC}$이고 $\overrightarrow{CP}\perp\overrightarrow{AB}$이므로 $(\overrightarrow{AP}-\overrightarrow{AB})\cdot\overrightarrow{AC}=0$이고 $(\overrightarrow{AP}-\overrightarrow{AC})\cdot\overrightarrow{AB}=0$이다.
      source_flow: 해설지 p.9 예시 답안
      criteria:
      - 3-1.M1
    - id: 31b-2
      content: |
        즉 $(x\overrightarrow{AB}+y\overrightarrow{AC}-\overrightarrow{AB})\cdot\overrightarrow{AC}=xv+yw-v=0$, $(x\overrightarrow{AB}+y\overrightarrow{AC}-\overrightarrow{AC})\cdot\overrightarrow{AB}=xu+yv-v=0$이다.
      source_flow: 해설지 p.9 예시 답안
      criteria:
      - 3-1.M1
    - id: 31b-3
      content: |
        따라서 두 식을 연립하여 풀면 $x=\dfrac{v^2-vw}{v^2-uw},\quad y=\dfrac{v^2-uv}{v^2-uw}$이다.
      source_flow: 해설지 p.9 예시 답안
      criteria:
      - 3-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3-1.M1
      mark_type: M
      points: 80
      evidence: 벡터의 수직과 내적의 관계를 이용하여 연립방정식 $xv+yw-v=0$, $xu+yv-v=0$을 구했다.
      steps:
      - 31b-1
      - 31b-2
    - id: 3-1.A1
      mark_type: A
      points: 20
      evidence: 연립방정식을 풀어 $x,\ y$의 값을 구했다.
      depends_on:
      - 3-1.M1
      steps:
      - 31b-3
