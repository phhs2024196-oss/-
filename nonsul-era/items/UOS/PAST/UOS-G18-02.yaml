stimuli: []
stem: |
  그림과 같은 한 모서리의 길이가 2인 정팔면체 ABCDEF에서 다음 물음에 답하여라.
subparts:
- id: 2-1
  stem: |
    (a) 두 삼각형 ABC와 EDF의 무게중심을 각각 $\mathrm{G_1}$과 $\mathrm{G_2}$라 할 때, 내적 $\overrightarrow{\mathrm{AB}}\cdot\overrightarrow{\mathrm{G_1G_2}}$의 값을 구하여라. (30점)
  points: 30
  depends_on: []
  answer:
    kind: value
    value: '0'
    equivalents: []
    tolerance: null
  solutions:
  - id: S21-B
    audience: B
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        네 점 B, C, D, E가 $\mathrm{B}(-1,-1,0),\ \mathrm{C}(1,-1,0),\ \mathrm{D}(1,1,0),\ \mathrm{E}(-1,1,0)$이 되도록 좌표축을 정하자. 이때, $\mathrm{A}(0,0,a)\ (a>0)$라 하면 $\overline{\mathrm{AB}}=\sqrt{(-1)^2+(-1)^2+a^2}=\sqrt{a^2+2}=2$이므로 $\mathrm{A}(0,0,\sqrt2)$이고, $\mathrm{F}(0,0,-\sqrt2)$이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 2-1.M1
    - id: 21b-2
      content: |
        $\overrightarrow{\mathrm{AB}}=(-1,-1,-\sqrt2)$이고, $\mathrm{G_1}\left(0,-\dfrac23,\dfrac{\sqrt2}{3}\right),\ \mathrm{G_2}\left(0,\dfrac23,-\dfrac{\sqrt2}{3}\right)$이므로 $\overrightarrow{\mathrm{G_1G_2}}=\overrightarrow{\mathrm{OG_2}}-\overrightarrow{\mathrm{OG_1}}=\left(0,\dfrac43,-\dfrac{2\sqrt2}{3}\right)$이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 2-1.A1
    - id: 21b-3
      content: |
        따라서
        $$\overrightarrow{\mathrm{AB}}\cdot\overrightarrow{\mathrm{G_1G_2}}=(-1,-1,-\sqrt2)\cdot\left(0,\dfrac43,-\dfrac{2\sqrt2}{3}\right)=0$$
        이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 2-1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2-1.M1
      mark_type: M
      points: 10
      evidence: 정팔면체를 좌표공간에 놓고 꼭짓점의 좌표 $\mathrm{A}(0,0,\sqrt2),\ \mathrm{F}(0,0,-\sqrt2)$ 등을 정했다.
      depends_on: []
      steps:
      - 21b-1
    - id: 2-1.A1
      mark_type: A
      points: 10
      evidence: $\overrightarrow{\mathrm{AB}}$와 $\overrightarrow{\mathrm{G_1G_2}}=\left(0,\frac43,-\frac{2\sqrt2}{3}\right)$를 구했다.
      depends_on:
      - 2-1.M1
      steps:
      - 21b-2
    - id: 2-1.A2
      mark_type: A
      points: 10
      evidence: 내적의 값 $0$을 구했다.
      depends_on:
      - 2-1.A1
      steps:
      - 21b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 2-2
  stem: |
    (b) 벡터 $\overrightarrow{\mathrm{G_1G_2}}$와 수직이고 정팔면체와 만나지 않는 한 평면을 $\alpha$라 하자. 태양광선이 평면 $\alpha$에 수직으로 비추어 정팔면체의 그림자가 평면 $\alpha$에 생길 때, 이 그림자의 넓이를 구하여라. (70점)

    [그림 1: 정팔면체 ABCDEF와 평면 $\alpha$, 태양광선 방향을 나타내는 화살표]
  points: 70
  depends_on:
  - 2-1
  answer:
    kind: value
    value: 2*sqrt(3)
    equivalents: []
    tolerance: null
  solutions:
  - id: S22-B
    audience: B
    method_no: 1
    steps:
    - id: 22b-1
      content: |
        $\overrightarrow{\mathrm{AC}}\cdot\overrightarrow{\mathrm{G_1G_2}}=(1,-1,-\sqrt2)\cdot\left(0,\dfrac43,-\dfrac{2\sqrt2}{3}\right)=0$이므로 평면 ABC와 벡터 $\overrightarrow{\mathrm{G_1G_2}}$는 서로 수직이다. 마찬가지로 평면 DEF도 벡터 $\overrightarrow{\mathrm{G_1G_2}}$에 수직이다. 따라서 평면 $\alpha$는 평면 ABC와 평면 DEF에 각각 평행하다.
      source_flow: 해설지 p.2~3 예시 답안
      criteria:
      - 2-2.M1
    - id: 22b-2
      content: |
        벡터 $\overrightarrow{\mathrm{G_1G_2}}$와 평면 $\alpha$가 서로 수직이므로 두 점 $\mathrm{G_1},\ \mathrm{G_2}$의 평면 $\alpha$ 위로의 정사영은 일치한다. 여섯 점 A, B, C, D, E, F의 평면 $\alpha$ 위로의 정사영을 각각 A$'$, B$'$, C$'$, D$'$, E$'$, F$'$이라 하면, 두 삼각형 A$'$B$'$C$'$과 E$'$D$'$F$'$은 한 변의 길이가 2이고 무게중심이 일치하는 정삼각형이다.
      source_flow: 해설지 p.2~3 예시 답안
      criteria:
      - 2-2.M2
      - 2-2.M3
    - id: 22b-3
      content: |
        정사각형 BCDE의 정사영 B$'$C$'$D$'$E$'$은 마주보는 두 쌍의 변의 길이가 각각 같으므로 평행사변형이다. 따라서 다각형 A$'$E$'$B$'$F$'$C$'$D$'$은 정육각형이고 이것이 정팔면체의 그림자이다.
      source_flow: 해설지 p.2~3 예시 답안
      criteria:
      - 2-2.M4
    - id: 22b-4
      content: |
        삼각형 A$'$B$'$C$'$의 무게중심을 G라 하면 $\overline{\mathrm{A'B'}}=2$이므로 $\overline{\mathrm{A'G}}=\dfrac{2\sqrt3}{3}$이고, 정삼각형 GA$'$E$'$의 넓이는 $\dfrac{\sqrt3}{3}$이다. 그러므로 구하는 그림자의 넓이는 $2\sqrt3$이다.
      source_flow: 해설지 p.2~3 예시 답안
      criteria:
      - 2-2.A1
      - 2-2.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2-2.M1
      mark_type: M
      points: 15
      evidence: $\overrightarrow{\mathrm{AC}}\cdot\overrightarrow{\mathrm{G_1G_2}}=0$ 등으로 $\overrightarrow{\mathrm{G_1G_2}}$가 두 면 ABC, DEF에 수직(평면 $\alpha$는 두 면에 평행)임을 보였다.
      depends_on: []
      steps:
      - 22b-1
    - id: 2-2.M2
      mark_type: M
      points: 10
      evidence: 그림자가 평면 $\alpha$ 위로의 정사영이고, $\mathrm{G_1},\mathrm{G_2}$의 정사영이 일치함을 밝혔다.
      depends_on:
      - 2-2.M1
      steps:
      - 22b-2
    - id: 2-2.M3
      mark_type: M
      points: 15
      evidence: 두 면 ABC, DEF의 정사영이 한 변의 길이 2이고 무게중심이 일치하는 정삼각형임을 밝혔다.
      depends_on:
      - 2-2.M2
      steps:
      - 22b-2
    - id: 2-2.M4
      mark_type: M
      points: 15
      evidence: 정사각형 BCDE의 정사영이 평행사변형임을 이용해 그림자가 정육각형임을 보였다.
      depends_on:
      - 2-2.M3
      steps:
      - 22b-3
    - id: 2-2.A1
      mark_type: A
      points: 10
      evidence: 정육각형의 한 변의 길이 $\overline{\mathrm{A'G}}=\frac{2\sqrt3}{3}$을 구했다.
      depends_on:
      - 2-2.M4
      steps:
      - 22b-4
    - id: 2-2.A2
      mark_type: A
      points: 5
      evidence: 그림자의 넓이 $2\sqrt3$을 구했다.
      depends_on:
      - 2-2.A1
      steps:
      - 22b-4
