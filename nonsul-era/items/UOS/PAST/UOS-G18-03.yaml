stem: |
  주사위 100개를 동시에 던질 때, 1 또는 2의 눈이 나오는 주사위의 개수가 홀수이면 $a$점, 홀수가 아니면 $b$점을 받는다고 하자. 받는 점수를 확률변수 $X$라 할 때,
subparts:
- id: 3-1
  stem: |
    $\mathrm{E}(X)$의 값을 구하여라.
  points: 100
  depends_on: []
  answer:
    kind: expression
    value: (a+b)/2-(a-b)/(2*3**100)
    equivalents: []
    tolerance: null
  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: |
        주사위 100개를 동시에 던질 때, 1 또는 2의 눈이 나오는 주사위의 개수가 홀수일 확률 $p$와 홀수가 아닐 확률 $1-p$는 다음과 같다.
        $$p=\sum_{k=1}^{50}{}_{100}\mathrm{C}_{2k-1}\left(\frac13\right)^{2k-1}\left(\frac23\right)^{101-2k},\qquad 1-p=\sum_{k=0}^{50}{}_{100}\mathrm{C}_{2k}\left(\frac13\right)^{2k}\left(\frac23\right)^{100-2k}$$
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 3-1.M1
    - id: 31b-2
      content: |
        따라서
        $$(1-p)-p=\sum_{k=0}^{100}(-1)^k{}_{100}\mathrm{C}_k\left(\frac13\right)^k\left(\frac23\right)^{100-k}=\sum_{k=0}^{100}{}_{100}\mathrm{C}_k\left(-\frac13\right)^k\left(\frac23\right)^{100-k}$$
        이므로 이항정리에 의해
        $$1-2p=\sum_{k=0}^{100}{}_{100}\mathrm{C}_k\left(-\frac13\right)^k\left(\frac23\right)^{100-k}=\left(-\frac13+\frac23\right)^{100}=\frac{1}{3^{100}}$$
        이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 3-1.M2
      - 3-1.A1
    - id: 31b-3
      content: |
        그러므로 $p=\dfrac12-\dfrac{1}{2\cdot3^{100}}$이고, $\mathrm{E}(X)=ap+b(1-p)=\dfrac{a+b}{2}-\dfrac{a-b}{2\cdot3^{100}}$이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 3-1.M3
      - 3-1.A2
