    - id: 4-1.M2
      mark_type: M
      points: 20
      evidence: 두 곡선 $y=2^x,\ y=N/2^x$의 교점의 $x$좌표가 1008과 1009 사이임을 보이고(또는 $x\ge2018$에서 점이 없음을 보여) $x$의 범위를 나누었다.
      depends_on:
      - 4-1.M1
