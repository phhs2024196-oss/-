stimuli: []
stem: |
  자연수 $n$에 대하여 다음 조건을 모두 만족시키는 두 자연수 $x$와 $y$의 순서쌍 $(x,y)$의 개수를 $a_n$이라 하자.
subparts:
- id: 4-1
  stem: |
    $N=2^{2018}-1$일 때, $\displaystyle\sum_{k=1}^{N}a_k$의 값을 구하여라.

    (1) $y=\dfrac{n}{2^x}$
    (2) $y\le2^x$
  points: 100
  depends_on: []
  answer:
    kind: expression
    value: 3*2**1009-1013
    equivalents: []
    tolerance: null
  solutions:
  - id: S41-B
    audience: B
    method_no: 1
    steps:
    - id: 41b-1
      content: |
        좌표평면에서 연립부등식 $y\le\dfrac{N}{2^x},\ y\le2^x,\ y\ge1$의 영역을 $A$라 하자. $1\le n\le N$인 자연수 $n$에 대하여 $y=\dfrac{n}{2^x}$과 $y\le2^x$을 모두 만족시키는 점 $(x,y)\ (x,y$는 자연수$)$는 영역 $A$에 속하고, $m\ne n$이면 두 곡선 $y=\dfrac{m}{2^x},\ y=\dfrac{n}{2^x}$은 만나지 않는다. 한편 영역 $A$에 있는 점 $(p,q)\ (p,q$는 자연수$)$에 대하여 $r=q2^p$라 두면 $r\le N$이고 점 $(p,q)$는 곡선 $y=\dfrac{r}{2^x}$에 있으며 $q\le2^p$이다. 따라서 $\displaystyle\sum_{k=1}^{N}a_k$는 영역 $A$에 포함되는 점 $(x,y)\ (x,y$는 자연수$)$의 개수와 같으므로 그 점의 개수를 구하면 된다.
      source_flow: 해설지 p.5 예시 답안
      criteria:
      - 4-1.M1
    - id: 41b-2
      content: |
        $x\ge2018$이면 $y\le\dfrac{N}{2^x}\le\dfrac{2^{2018}-1}{2^{2018}}<1$이므로 $y\le\dfrac{N}{2^x}$을 만족시키는 두 자연수 $x,\ y$의 순서쌍 $(x,y)$가 존재하지 않는다. 또한 $\dfrac{N}{2^x}=2^x$이면 $2^{2017}<2^{2x}=N<2^{2018}$이므로 $1008<x<1009$이다. 따라서 두 곡선 $y=2^x,\ y=\dfrac{N}{2^x}$의 교점의 $x$좌표는 1008보다 크고 1009보다 작다.
      source_flow: 해설지 p.5 예시 답안
      criteria:
      - 4-1.M2
    - id: 41b-3
      content: |
        따라서 자연수 $x$에 대하여
        - $1\le x\le1008$이면 $1\le y\le2^x$인 자연수 $y$의 개수는 $2^x$이고,
        - $1009\le x\le2017$이면 $1\le y\le\dfrac{N}{2^x}=2^{2018-x}-2^{-x}$인 자연수 $y$의 개수는 $2^{2018-x}-1$이다.
      source_flow: 해설지 p.5 예시 답안
      criteria:
      - 4-1.A1
    - id: 41b-4
      content: |
        그러므로
        $$\sum_{k=1}^{N}a_k=\sum_{k=1}^{1008}2^k+\sum_{k=1009}^{2017}(2^{2018-k}-1)=\sum_{k=1}^{1008}2^k+\sum_{k=1}^{1009}(2^k-1)=3\cdot2^{1009}-1013$$
        이다.
      source_flow: 해설지 p.5 예시 답안
      criteria:
      - 4-1.M3
      - 4-1.A2
