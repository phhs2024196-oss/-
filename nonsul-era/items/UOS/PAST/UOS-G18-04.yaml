      - 41b-2
    - id: 4-1.A1
      mark_type: A
      points: 20
      evidence: $1\le x\le1008$에서 $2^x$개, $1009\le x\le2017$에서 $2^{2018-x}-1$개로 $y$의 개수를 구했다.
      depends_on:
      - 4-1.M2
      steps:
      - 41b-3
    - id: 4-1.M3
      mark_type: M
      points: 15
      evidence: $x$별 개수를 $\sum$으로 합하는 식을 세워 등비수열의 합으로 계산했다.
      depends_on:
      - 4-1.A1
      steps:
      - 41b-4
    - id: 4-1.A2
      mark_type: A
      points: 20
      evidence: 답 $3\cdot2^{1009}-1013$을 구했다.
      depends_on:
      - 4-1.M3
      steps:
      - 41b-4
