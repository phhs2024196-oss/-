stimuli: []
stem: |
  3개의 당첨 제비를 포함하여 $2n$개의 제비가 들어 있는 상자가 있다. 이 상자에서 A, B 두 사람이 A부터 시작하여 A와 B가 교대로 제비를 한 개씩 임의로 뽑는다. 당첨 제비가 처음 나오면 이 시행을 멈추기로 할 때,
subparts:
- id: 2-1
  stem: |
    A가 당첨 제비를 뽑을 확률을 구하여라. (단, $n$은 1보다 큰 자연수이고, 꺼낸 제비는 상자 안에 다시 넣지 않는다.)
  points: 100
  depends_on: []
  answer:
    kind: expression
    value: (4*n+1)/(4*(2*n-1))
    equivalents: []
    tolerance: null
  solutions:
  - id: S21-B
    audience: B
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        A는 최대 $n-1$회까지 제비를 뽑을 수 있다. 당첨 제비를 ○, 비당첨 제비를 ×로 나타내면 A가 당첨 제비를 뽑는 경우와 확률은 다음과 같다.
        - 1회째(A): ○ $\to\ \dfrac{3}{2n}$
        - 2회째(A): $\times\times\bigcirc$ $\to\ \dfrac{2n-3}{2n}\times\dfrac{2n-4}{2n-1}\times\dfrac{3}{2n-2}=\dfrac{3(n-2)(2n-3)}{2n(n-1)(2n-1)}$
        - 3회째(A): $\times\times\times\times\bigcirc$ $\to\ \dfrac{2n-3}{2n}\times\dfrac{2n-4}{2n-1}\times\dfrac{2n-5}{2n-2}\times\dfrac{2n-6}{2n-3}\times\dfrac{3}{2n-4}=\dfrac{3(n-3)(2n-5)}{2n(n-1)(2n-1)}$
        - $\vdots$
        - $(n-1)$회째(A): $\times\cdots\times\bigcirc$ $\to\ \dfrac{2n-3}{2n}\times\dfrac{2n-4}{2n-1}\times\cdots\times\dfrac36\times\dfrac25\times\dfrac34=\dfrac{9}{2n(n-1)(2n-1)}$
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 2-1.M1
    - id: 21b-2
      content: |
        A가 $k\ (1\le k\le n-1)$번 만에 당첨 제비를 뽑을 확률은
        $$\frac{3(n-k)(2n-2k+1)}{2n(n-1)(2n-1)}$$
        이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 2-1.A1
    - id: 21b-3
      content: |
        따라서 A가 당첨 제비를 뽑을 확률 $p$는
        $$p=\sum_{k=1}^{n-1}\left\{\frac{3(n-k)(2n-2k+1)}{2n(n-1)(2n-1)}\right\}=\frac{3}{2n(n-1)(2n-1)}\sum_{k=1}^{n-1}\left\{2k^2-(4n+1)k+n(2n+1)\right\}$$
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 2-1.M2
    - id: 21b-4
      content: |
        $$=\frac{4n+1}{4(2n-1)}$$
        이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 2-1.M3
      - 2-1.A2
