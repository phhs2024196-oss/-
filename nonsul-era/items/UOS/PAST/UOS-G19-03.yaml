stimuli: []
stem: |
  사면체 ABCD가 다음 조건을 모두 만족시킨다.

  (1) $\angle\mathrm{ACB}=\dfrac{\pi}{2}$
  (2) $\overline{\mathrm{AD}}=\overline{\mathrm{BD}}=5,\ \overline{\mathrm{CD}}=4$
subparts:
- id: 3-1
  stem: |
    평면 ABC의 법선벡터와 벡터 $\overrightarrow{\mathrm{CD}}$가 이루는 각의 크기를 $\theta$라 하자. $\overline{\mathrm{BC}}=a,\ \overline{\mathrm{AC}}=b$라 할 때, $\cos^2\theta$를 $a,\ b$를 사용하여 나타내어라.
  points: 100
  depends_on: []
  answer:
    kind: expression
    value: 1 - ((a**2-9)/(8*a))**2 - ((b**2-9)/(8*b))**2
    equivalents: []
    tolerance: null
  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: |
        사면체 ABCD를 점 C가 원점, 반직선 CA가 $x$축의 양의 방향, 반직선 CB가 $y$축의 양의 방향이 되도록 공간좌표에 놓고, 점 D에서 평면 ABC에 내린 수선의 발을 $\mathrm{H}(x,y,0)$이라고 하자. 이때 $\mathrm{A}(b,0,0)$이고 $\mathrm{B}(0,a,0)$이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 3-1.M1
    - id: 31b-2
      content: |
        직각삼각형 CDH에서 $\angle\mathrm{CDH}=\theta$이므로 $\overline{\mathrm{CH}}=4\sin\theta$이고 $\overline{\mathrm{DH}}=4\cos\theta$이다. 한편 $\overline{\mathrm{CH}}^2=x^2+y^2$이므로
        $$x^2+y^2=16\sin^2\theta\quad\cdots\cdots\ \text{㉠}$$
        이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 3-1.M2
    - id: 31b-3
      content: |
        $\overline{\mathrm{AH}}^2=(x-b)^2+y^2$, $\angle\mathrm{DHA}$가 직각이므로
        $$(x-b)^2+y^2=25-16\cos^2\theta\quad\cdots\cdots\ \text{㉡}$$
        이다. $\overline{\mathrm{BH}}^2=x^2+(y-a)^2$이고 $\angle\mathrm{DHB}$가 직각이므로
        $$x^2+(y-a)^2=25-16\cos^2\theta\quad\cdots\cdots\ \text{㉢}$$
        이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 3-1.M3
    - id: 31b-4
      content: |
        ㉠과 ㉡을 연립하여 풀면 $x=\dfrac{b^2-9}{2b}$이고, ㉠과 ㉢을 연립하여 풀면 $y=\dfrac{a^2-9}{2a}$이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 3-1.A1
    - id: 31b-5
      content: |
        따라서 점 D의 좌표는 $\mathrm{D}\left(\dfrac{b^2-9}{2b},\ \dfrac{a^2-9}{2a},\ 4\cos\theta\right)$이고, $\overline{\mathrm{CD}}^2=16$이므로
        $$\left(\frac{b^2-9}{2b}\right)^2+\left(\frac{a^2-9}{2a}\right)^2+16\cos^2\theta=16$$
        이다. 그러므로 $\cos^2\theta=1-\left(\dfrac{a^2-9}{8a}\right)^2-\left(\dfrac{b^2-9}{8b}\right)^2$이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 3-1.A2
