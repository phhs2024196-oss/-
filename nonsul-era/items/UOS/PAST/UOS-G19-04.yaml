      depends_on:
      - 4-1.M4
      steps:
      - 41b-4
    - id: 4-1.R1
      mark_type: R
      points: 10
      evidence: 등호가 성립하는 배치($R_1$의 왼쪽 변 $x=\frac1e$, $R_2$의 왼쪽 변 $x=1+\frac1e$)가 존재함을 보였다.
      depends_on:
