      depends_on:
      - 4-1.A1
      steps:
      - 41b-3
    - id: 4-1.M4
      mark_type: M
      points: 20
      evidence: $g(x)=e^x\left(2+\frac1e-x\right)$를 미분해 증감표로 $x=1+\frac1e$에서 최대임을 판정했다.
      depends_on:
