stimuli: []
stem: |
  그림과 같이 곡선 $y=e^x$과 $x$축 및 두 직선 $x=0,\ x=2$로 둘러싸인 영역에 한 변이 $x$축에 있고 내부가 서로 겹치지 않는 두 직사각형이 있다. 두 직사각형의 넓이를 각각 $S_1,\ S_2$라 할 때,

  [그림 1: 곡선 $y=e^x$, $x$축, 직선 $x=2$로 둘러싸인 영역 안에 한 변이 $x$축 위에 있는 두 직사각형 $S_1,\ S_2$가 나란히 놓여 있다]
subparts:
- id: 4-1
  stem: |
    $S_1+S_2$의 최댓값을 구하여라.
  points: 100
  depends_on: []
  answer:
    kind: expression
    value: exp(1+exp(-1))
    equivalents: []
    tolerance: null
  solutions:
  - id: S41-B
    audience: B
    method_no: 1
    steps:
    - id: 41b-1
      content: |
        그림과 같이 두 직사각형 $R_1,\ R_2$가 한 변에서 맞닿아 있고, 직사각형 $R_2$의 오른쪽 변이 직선 $x=2$에 있으며, 각 직사각형의 한 꼭짓점이 곡선 $y=e^x$에 있을 때 두 직사각형 넓이의 합이 최대가 될 수 있다. $0<a<2$인 실수 $a$에 대하여 두 직사각형이 직선 $x=a$에서 맞닿아 있다고 가정하자. $R_1$의 왼쪽 변이 놓인 직선의 $x$좌표를 $t\ (0\le t<a)$라 하면 $S_1=(a-t)e^t$이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 4-1.M1
    - id: 41b-2
      content: |
        실수 전체의 집합에서 정의된 함수 $f(x)$를 $f(x)=(a-x)e^x$이라 하자. 그러면 $f'(x)=(-1+a-x)e^x$이고 $f'(x)=0$의 해는 $x=a-1$이다. 증감표는 $x<a-1$에서 $f'(x)>0$(증가), $x=a-1$에서 $0$(최대), $x>a-1$에서 $f'(x)<0$(감소)이다. 따라서 $f(x)$의 최댓값은 $f(a-1)=e^{a-1}$이므로 $S_1\le e^{a-1}$이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 4-1.M2
      - 4-1.A1
    - id: 41b-3
      content: |
        한편 $S_2=(2-a)e^a$이므로
        $$S_1+S_2\le e^{a-1}+(2-a)e^a=e^a\left(2+\frac1e-a\right)$$
        이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 4-1.M3
    - id: 41b-4
      content: |
        실수 전체의 집합에서 정의된 함수 $g(x)$를 $g(x)=e^x\left(2+\dfrac1e-x\right)$라 하자. 그러면 $g'(x)=e^x\left(1+\dfrac1e-x\right)$이고 $g'(x)=0$의 해는 $x=1+\dfrac1e$이다. 증감표는 $x<1+\frac1e$에서 증가, $x=1+\frac1e$에서 최대, $x>1+\frac1e$에서 감소이다. 따라서 $g(x)$의 최댓값은 $g\left(1+\dfrac1e\right)=e^{1+\frac1e}$이므로
        $$S_1+S_2\le e^{1+\frac1e}$$
        이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 4-1.M4
      - 4-1.A2
    - id: 41b-5
      content: |
        한편 $R_1$의 왼쪽 변이 직선 $x=\dfrac1e$에 있고, $R_2$의 왼쪽 변이 직선 $x=1+\dfrac1e\left(0<1+\dfrac1e<2\right)$에 있을 때,
        $$S_1+S_2=\left(1+\frac1e-\frac1e\right)e^{\frac1e}+\left\{2-\left(1+\frac1e\right)\right\}e^{1+\frac1e}=e^{1+\frac1e}$$
        이다. 그러므로 $S_1+S_2$의 최댓값은 $e^{1+\frac1e}$이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 4-1.R1
      - 4-1.A3
