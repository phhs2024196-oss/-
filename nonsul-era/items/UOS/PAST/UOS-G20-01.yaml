stimuli: []
stem: |
  자연수 $n$에 대하여 방정식 $x+y+z=n+2$를 만족시키는 세 자연수 $x,\ y,\ z$의 순서쌍 $(x,y,z)$ 전체의 집합을
  $$\{(x_1,y_1,z_1),\ (x_2,y_2,z_2),\ \cdots,\ (x_m,y_m,z_m)\}$$
  이라 하자.
subparts:
- id: 1-1
  stem: |
    $\displaystyle\sum_{k=1}^{m}\left(x_k^2+y_k^2+z_k^2\right)$을 $n$에 대하여 인수분해된 식으로 나타내어라.
  points: 100
  depends_on: []
  answer:
    kind: expression
    value: n*(n+1)**2*(n+2)/4
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        $(a,b,c)$가 주어진 집합의 원소이면 $a,b,c$의 순서를 바꾸어도 주어진 집합의 원소가 되므로 $\displaystyle\sum_{k=1}^{m}x_k^2=\sum_{k=1}^{m}y_k^2=\sum_{k=1}^{m}z_k^2$이다. 따라서 $\displaystyle\sum_{k=1}^{m}\left(x_k^2+y_k^2+z_k^2\right)=3\sum_{k=1}^{m}x_k^2$이다.
      source_flow: 해설지 p.1 예시 답안
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        $x_k=l\ (l=1,2,3,\cdots,n)$일 때 가능한 $y_k,\ z_k$의 순서쌍 $(y_k,z_k)$는
        $$(1,\ n-l+1),\ (2,\ n-l),\ \cdots,\ (n-l+1,\ 1)$$
        로 총 $(n-l+1)$개이다. 따라서
        $$\sum_{k=1}^{m}x_k^2=\sum_{l=1}^{n}l^2(n-l+1)$$
      source_flow: 해설지 p.1 예시 답안
      criteria:
      - 1-1.M2
    - id: 11b-3
      content: |
        $$\sum_{l=1}^{n}l^2(n-l+1)=(n+1)\sum_{l=1}^{n}l^2-\sum_{l=1}^{n}l^3=\frac{(n+1)n(n+1)(2n+1)}{6}-\frac{n^2(n+1)^2}{4}=\frac{n(n+1)^2(n+2)}{12}$$
      source_flow: 해설지 p.1 예시 답안
      criteria:
      - 1-1.M3
      - 1-1.A1
    - id: 11b-4
      content: |
        이므로 $\displaystyle\sum_{k=1}^{m}\left(x_k^2+y_k^2+z_k^2\right)=3\sum_{k=1}^{m}x_k^2=\frac{n(n+1)^2(n+2)}{4}$이다.
      source_flow: 해설지 p.1 예시 답안
      criteria:
      - 1-1.A2
