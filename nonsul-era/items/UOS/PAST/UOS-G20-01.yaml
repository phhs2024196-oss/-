    - id: 1-1.M2
      mark_type: M
      points: 30
      evidence: $x_k=l$인 순서쌍이 $n-l+1$개임을 구해 $\sum x_k^2=\sum_{l=1}^{n}l^2(n-l+1)$로 바꾸었다.
      depends_on: []
      steps:
      - 11b-2
    - id: 1-1.M3
      mark_type: M
      points: 20
      evidence: $\sum l^2,\ \sum l^3$의 합 공식을 써서 $\sum_{l=1}^{n}l^2(n-l+1)$을 계산하는 식을 세웠다.
      depends_on:
      - 1-1.M2
      steps:
      - 11b-3
    - id: 1-1.A1
      mark_type: A
