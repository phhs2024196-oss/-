      evidence: 순서를 바꾸어도 집합이 같음을 이용해 $\sum x_k^2=\sum y_k^2=\sum z_k^2$이고 구하는 값이 $3\sum x_k^2$임을 밝혔다.
      depends_on: []
      steps:
