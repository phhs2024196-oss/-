stimuli: []
stem: |
  좌표평면에서 초점이 F인 포물선 $y=\dfrac14x^2$의 제1사분면에 있는 임의의 점을 P라 하고, $\theta=\angle\mathrm{OFP}$라 하자. 두 선분 FO, FP와 포물선으로 둘러싸인 도형의 넓이를 $S(\theta)$라 할 때,
subparts:
- id: 2-1
  stem: |
    $S'\left(\dfrac{\pi}{3}\right)$의 값을 구하여라. (단, O는 원점이다.)
  points: 100
  depends_on: []
  answer:
    kind: value
    value: 8/9
    equivalents: []
    tolerance: null
  solutions:
  - id: S21-B
    audience: B
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        포물선의 초점의 좌표는 $\mathrm{F}(0,1)$이다. 점 P를 $\left(t,\ \dfrac14t^2\right)\ (t>0)$라 하자. 점 P에서 $y$축에 내린 수선의 발을 Q라 하면, $\overline{\mathrm{PQ}}=t,\ \overline{\mathrm{FP}}=1+\dfrac14t^2$이므로,
        $$\sin\theta=\frac{\overline{\mathrm{PQ}}}{\overline{\mathrm{FP}}}=\frac{t}{1+\frac14t^2}=\frac{4t}{4+t^2},\quad\cos\theta=\frac{4-t^2}{4+t^2}$$
        이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 2-1.M1
    - id: 21b-2
      content: |
        이 식을 $t$에 관하여 풀면 $t=\dfrac{2(1-\cos\theta)}{\sin\theta}$이고 $\dfrac{dt}{d\theta}=\dfrac{2}{1+\cos\theta}$이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 2-1.A1
    - id: 21b-3
      content: |
        합성함수의 미분법에 의해 $\dfrac{dS}{d\theta}=\dfrac{dS}{dt}\cdot\dfrac{dt}{d\theta}$이다. $S(\theta)$를 $t$에 관한 식으로 나타내면
        $$S(\theta)=\frac12\left(1+\frac14t^2\right)t-\int_0^t\frac14x^2dx=\frac1{24}t^3+\frac12t$$
        이므로 $\dfrac{dS}{dt}=\dfrac18t^2+\dfrac12$이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 2-1.M2
      - 2-1.A2
      - 2-1.M3
    - id: 21b-4
      content: |
        $\theta=\dfrac{\pi}{3}$일 때 $t=\dfrac{2}{\sqrt3}$, $\dfrac{dt}{d\theta}=\dfrac43$, $\dfrac{dS}{dt}=\dfrac23$이므로 $S'\left(\dfrac{\pi}{3}\right)=\dfrac23\times\dfrac43=\dfrac89$이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 2-1.A3
