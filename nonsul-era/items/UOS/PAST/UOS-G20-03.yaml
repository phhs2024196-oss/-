stimuli: []
stem: |
  자연수 $n$에 대하여 닫힌 구간 $[0,\pi]$에서 곡선 $y=e^{-x}\sin nx$와 $x$축으로 둘러싸인 도형의 넓이를 $S_n$이라 할 때,
subparts:
- id: 3-1
  stem: |
    $\displaystyle\lim_{n\to\infty}S_n$의 값을 구하여라.
  points: 100
  depends_on: []
  answer:
    kind: expression
    value: 2*(1-exp(-pi))/pi
    equivalents: []
    tolerance: null
  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: |
        $S_n=\displaystyle\int_0^{\pi}\left|e^{-x}\sin nx\right|dx$이다. 닫힌 구간 $[0,\pi]$에서 방정식 $e^{-x}\sin nx=0$의 근은
        $$x=0,\ \frac{\pi}{n},\ \cdots,\ \frac{(n-1)\pi}{n},\ \pi$$
        이다. $k=1,\cdots,n$에 대해
        $$a_k=\int_{\frac{(k-1)\pi}{n}}^{\frac{k\pi}{n}}\left|e^{-x}\sin nx\right|dx=\left|\int_{\frac{(k-1)\pi}{n}}^{\frac{k\pi}{n}}e^{-x}\sin nx\,dx\right|$$
        라 하면 $S_n=a_1+a_2+\cdots+a_n$이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 3-1.M1
    - id: 31b-2
      content: |
        부분적분법을 이용하면
        $$\int e^{-x}\sin nx\,dx=-\frac{e^{-x}(\sin nx+n\cos nx)}{n^2+1}$$
        이다. 따라서 $\displaystyle a_k=\left|\int_{\frac{(k-1)\pi}{n}}^{\frac{k\pi}{n}}e^{-x}\sin nx\,dx\right|=\frac{n\,e^{-\frac{k\pi}{n}}}{n^2+1}\left(1+e^{\frac{\pi}{n}}\right)$이므로
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 3-1.M2
      - 3-1.A1
    - id: 31b-3
      content: |
        $$S_n=\frac{n}{n^2+1}\sum_{k=1}^{n}\left\{e^{-\frac{(k-1)\pi}{n}}+e^{-\frac{k\pi}{n}}\right\}=\frac{2n}{n^2+1}\sum_{k=1}^{n}e^{-\frac{k\pi}{n}}+\frac{n}{n^2+1}\left(1-e^{-\frac{\pi}{n}}\right)$$
        이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 3-1.A2
    - id: 31b-4
      content: |
        $0\le1-e^{-\frac{\pi}{n}}\le1$이므로 수열의 극한값의 대소 관계에 의해
        $$\lim_{n\to\infty}0\le\lim_{n\to\infty}\frac{n}{n^2+1}\left(1-e^{-\frac{\pi}{n}}\right)\le\lim_{n\to\infty}\frac{n}{n^2+1}=0$$
        이다. 따라서 $\displaystyle\lim_{n\to\infty}\frac{n}{n^2+1}\left(1-e^{-\frac{\pi}{n}}\right)=0,\ \lim_{n\to\infty}\frac{2n^2}{n^2+1}=2$이고, 정적분과 급수의 관계에 의해
        $$\lim_{n\to\infty}\frac1n\sum_{k=1}^{n}e^{-\frac{k\pi}{n}}=\int_0^1e^{-\pi x}dx=\frac{1-e^{-\pi}}{\pi}$$
        이므로
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 3-1.M3
    - id: 31b-5
      content: |
        $$\lim_{n\to\infty}S_n=\lim_{n\to\infty}\frac{2n^2}{n^2+1}\cdot\lim_{n\to\infty}\frac1n\sum_{k=1}^{n}e^{-\frac{k\pi}{n}}+\lim_{n\to\infty}\frac{n}{n^2+1}\left(1-e^{-\frac{\pi}{n}}\right)=\frac{2(1-e^{-\pi})}{\pi}$$
        이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 3-1.A3
