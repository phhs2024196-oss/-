subparts:
- id: 4-1
  stem: |
    (a) 한 변의 길이가 2인 정오각형의 대각선의 길이를 구하여라. (30점)

    [그림 1: 정오각형과 그 다섯 개의 대각선(별 모양)]
  points: 30
  depends_on: []
  answer:
    kind: expression
    value: 1+sqrt(5)
    equivalents: []
    tolerance: null
  solutions:
  - id: S41-B
    audience: B
    method_no: 1
    steps:
    - id: 41b-1
      content: |
        정오각형 ABCDE에서 대각선들의 교점을 F라 하자. 정오각형의 성질에 의해 $\triangle\mathrm{ACF},\ \triangle\mathrm{CDF}$는 각각 이등변삼각형이므로 $\overline{\mathrm{AF}}=\overline{\mathrm{CF}}=\overline{\mathrm{CD}}=2$이다. 대각선 AC의 길이를 $x$라 하면 $\overline{\mathrm{FD}}=x-2$이고, $\triangle\mathrm{ACD}$와 $\triangle\mathrm{CDF}$는 닮음이므로 $x:2=2:x-2$이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 4-1.M1
    - id: 41b-2
      content: |
        따라서 $x^2-2x-4=0$이고 대각선의 길이는 $x=1+\sqrt5$이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 4-1.A1
      - 4-1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 4-1.M1
      mark_type: M
      points: 10
      evidence: 대각선들의 교점 F를 잡아 이등변삼각형·닮은 삼각형을 찾고 $x:2=2:(x-2)$ 꼴의 비례식을 세웠다.
      depends_on: []
      steps:
      - 41b-1
    - id: 4-1.A1
      mark_type: A
      points: 10
      evidence: $x^2-2x-4=0$을 얻었다.
      depends_on:
      - 4-1.M1
      steps:
      - 41b-2
    - id: 4-1.A2
      mark_type: A
      points: 10
      evidence: 대각선의 길이 $1+\sqrt5$를 구했다.
      depends_on:
      - 4-1.A1
      steps:
      - 41b-2
  outcome_codes:
