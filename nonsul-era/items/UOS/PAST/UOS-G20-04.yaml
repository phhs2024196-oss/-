  misconceptions: []
- id: 4-2
  stem: |
    (b) 정오각형 ABCDE에서 두 대각선 AC와 AD를 따라 두 삼각형 ABC와 ADE를 두 선분 AB와 AE가 일치하도록 접고 두 점 B와 E가 만나는 점을 P라고 하자. 두 면 PAC와 PAD가 이루는 이면각의 크기를 $\theta$라고 하면 $\cos\theta=a+b\sqrt5$이다. $a+b$의 값을 구하여라. (단, $a$와 $b$는 유리수이다.) (70점)

    [그림 2: 정오각형 ABCDE. 대각선 AC, AD를 점선으로 그리고 삼각형 ABC, ADE를 안쪽으로 접는 방향을 호로 표시]
  points: 70
  depends_on:
  - 4-1
  answer:
    kind: value
    value: 1/5
    equivalents: []
    tolerance: null
  solutions:
  - id: S42-B
    audience: B
    method_no: 1
    steps:
    - id: 42b-1
      content: |
        $\overline{\mathrm{AB}}=2c$라 하자. 두 면 PAC와 PAD의 교선은 선분 AP이다. 면 PAC의 점 C에서 직선 AP에 내린 수선의 발을 Q라 하자. 이때 대칭성에 의하여 직선 AP는 두 직선 QC, QD와 수직이다. 그러므로 두 면 PAC와 PAD가 이루는 이면각의 크기는 $\theta=\angle\mathrm{CQD}$이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 4-2.M1
    - id: 42b-2
      content: |
        접기 전 평면에서 Q$_1$과 Q$_2$를 직선 AB와 AE에 내린 수선의 발이라 하면 $\overline{\mathrm{QC}}=\overline{\mathrm{Q_1C}}=\overline{\mathrm{Q_2D}}=\overline{\mathrm{QD}}$이다. 이등변삼각형 ABC에서 선분 AC의 길이가 $(1+\sqrt5)c$이므로 $\angle\mathrm{BAC}=\alpha$라 하면
        $$\cos\alpha=\frac{1+\sqrt5}{4},\quad\sin^2\alpha=\frac{5-\sqrt5}{8}$$
        이고 $\overline{\mathrm{Q_1C}}=(1+\sqrt5)c\sin\alpha$이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 4-2.M2
      - 4-2.A1
    - id: 42b-3
      content: |
        이등변삼각형 QCD에서 선분 CD의 중점을 점 M이라 하면 $\sin\dfrac{\theta}{2}=\dfrac{\overline{\mathrm{CM}}}{\overline{\mathrm{QC}}}=\dfrac{1}{(1+\sqrt5)\sin\alpha}$이다. 따라서
        $$\cos\theta=1-2\sin^2\frac{\theta}{2}=1-\frac{2}{(1+\sqrt5)^2\sin^2\alpha}=\frac{\sqrt5}{5}$$
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 4-2.M3
      - 4-2.A2
    - id: 42b-4
      content: |
        이므로 $a=0,\ b=\dfrac15,\ a+b=\dfrac15$이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 4-2.A3
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 4-2.M1
      mark_type: M
      points: 15
      evidence: 교선 AP에 C, D에서 내린 수선의 발이 같은 점 Q임을 대칭성으로 보이고 이면각이 $\angle\mathrm{CQD}$임을 밝혔다.
      depends_on: []
      steps:
      - 42b-1
    - id: 4-2.M2
      mark_type: M
      points: 15
      evidence: 펼친 평면에서 $\overline{\mathrm{QC}}=\overline{\mathrm{Q_1C}}$임을 이용해 $\overline{\mathrm{QC}}$를 $\overline{\mathrm{AC}}$와 $\sin\alpha$로 나타냈다.
      depends_on:
      - 4-2.M1
      steps:
      - 42b-2
    - id: 4-2.A1
      mark_type: A
      points: 10
      evidence: $\cos\alpha=\dfrac{1+\sqrt5}{4},\ \sin^2\alpha=\dfrac{5-\sqrt5}{8}$을 구했다.
      depends_on:
      - 4-2.M2
      steps:
      - 42b-2
    - id: 4-2.M3
      mark_type: M
      points: 10
      evidence: 이등변삼각형 QCD에서 밑변 CD의 중점 M을 잡아 $\sin\frac\theta2=\frac{\overline{\mathrm{CM}}}{\overline{\mathrm{QC}}}$ 등으로 $\cos\theta$를 구하는 식을 세웠다.
      depends_on:
      - 4-2.M1
      steps:
      - 42b-3
    - id: 4-2.A2
      mark_type: A
      points: 10
      evidence: $\cos\theta=\dfrac{\sqrt5}{5}$를 얻었다.
      depends_on:
      - 4-2.A1
      - 4-2.M3
      steps:
      - 42b-3
    - id: 4-2.A3
      mark_type: A
      points: 10
      evidence: $a=0,\ b=\frac15$로부터 $a+b=\frac15$를 구했다.
      depends_on:
      - 4-2.A2
      steps:
      - 42b-4
