stimuli: []
stem: |
  동전 5개가 앞면이 2개, 뒷면이 3개가 보이도록 놓여있다. 이 동전 5개 중에서 임의로 하나를 선택하여 뒤집는 시행을 한다. 이 시행을 반복하여 보이는 동전이 모두 같은 면이 되면 멈춘다. 멈출 때까지의 총 시행 횟수를 확률변수 $X$라 하고, $X$가 4 이하인 사건을 $A$라 하자. 첫 시행에서 앞면이 보이는 동전을 선택하는 사건을 $B$라 할 때, $\mathrm{P}(B\mid A)$를 구하여라.
