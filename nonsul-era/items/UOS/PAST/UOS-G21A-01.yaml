  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        5개의 동전 중 임의로 하나를 선택하여 뒤집는 시행에서, 앞면이 보이는 동전을 선택하는 사건을 H, 뒷면이 보이는 동전을 선택하는 사건을 T로 나타내자. 이 시행을 반복하여 동전이 모두 같은 면이 되면 멈추기로 할 때, 매 시행에서 어떤 동전이 선택되었는지를 연속된 H와 T로 나타내기로 하자. 사건 $A$는 다음과 같다.
        $$A=\{\mathrm{HH},\mathrm{TTT},\mathrm{HTHH},\mathrm{THHH}\}$$
      source_flow: 해설지 p.1 예시 답안
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        사건 $A$를 구성하는 각 사건들의 확률은 아래와 같다.
        $$\mathrm{P}(X=2)=\dfrac{2}{5}\times\dfrac{1}{5}=\dfrac{2}{25}$$
        $$\mathrm{P}(X=3)=\dfrac{3}{5}\times\dfrac{2}{5}\times\dfrac{1}{5}=\dfrac{6}{125}$$
      source_flow: 해설지 p.1 예시 답안
      criteria:
      - 1-1.B1
    - id: 11b-3
      content: |
        $$\mathrm{P}(X=4)=\dfrac{2}{5}\times\dfrac{4}{5}\times\dfrac{2}{5}\times\dfrac{1}{5}+\dfrac{3}{5}\times\dfrac{3}{5}\times\dfrac{2}{5}\times\dfrac{1}{5}=\dfrac{34}{625}$$
      source_flow: 해설지 p.1 예시 답안
      criteria:
      - 1-1.B2
    - id: 11b-4
      content: |
        확률의 덧셈정리에 의해, $\mathrm{P}(A)=\mathrm{P}(X=2)+\mathrm{P}(X=3)+\mathrm{P}(X=4)=\dfrac{114}{625}$이다.
      source_flow: 해설지 p.1 예시 답안
      criteria:
      - 1-1.A1
    - id: 11b-5
      content: |
        사건 $B$는 첫 시행에서 앞면이 보이는 동전을 선택하는 사건이므로 $A\cap B=\{\mathrm{HH},\mathrm{HTHH}\}$이며, 이 사건이 발생할 확률은
        $$\mathrm{P}(A\cap B)=\dfrac{2}{5}\times\dfrac{1}{5}+\dfrac{2}{5}\times\dfrac{4}{5}\times\dfrac{2}{5}\times\dfrac{1}{5}=\dfrac{66}{625}$$
        이다.
      source_flow: 해설지 p.1 예시 답안
      criteria:
      - 1-1.M2
    - id: 11b-6
      content: |
        따라서 $\mathrm{P}(B\mid A)=\dfrac{\mathrm{P}(A\cap B)}{\mathrm{P}(A)}=\dfrac{11}{19}$이다.
      source_flow: 해설지 p.1 예시 답안
      criteria:
      - 1-1.A2
