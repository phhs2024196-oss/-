stem: |
  다음을 모두 만족시키는 다항식 $f(x)$를 구하여라.

  (1) $f(0)=0$
  (2) 상수 $0<a<1$에 대하여 $\displaystyle\int_{1-a}^{1+a}\dfrac{\cos a-\cos1\cos x}{\sin^2x}\,dx=2\sin f(a)$이다.
subparts:
- id: 2-1
  stem: ''
