  solutions:
  - id: S21-B
    audience: B
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        $$\int_{1-a}^{1+a}\dfrac{\cos a-\cos1\cos x}{\sin^2x}\,dx=\cos a\int_{1-a}^{1+a}\dfrac{1}{\sin^2x}\,dx-\cos1\int_{1-a}^{1+a}\dfrac{\cos x}{\sin^2x}\,dx$$
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 2-1.M1
    - id: 21b-2
      content: |
        $$=\cos a\left[-\cot x\right]_{1-a}^{1+a}-\cos1\left[-\dfrac{1}{\sin x}\right]_{1-a}^{1+a}=-\cos a\{\cot(1+a)-\cot(1-a)\}-\cos1\left\{\dfrac{1}{\sin(1-a)}-\dfrac{1}{\sin(1+a)}\right\}$$
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 2-1.M2
    - id: 21b-3
      content: |
        삼각함수의 덧셈정리를 이용해 계산하면
        $$-\cos a\{\cot(1+a)-\cot(1-a)\}-\cos1\left\{\dfrac{1}{\sin(1-a)}-\dfrac{1}{\sin(1+a)}\right\}=\dfrac{\cos1-\cos a\cos(1+a)}{\sin(1+a)}-\dfrac{\cos1-\cos a\cos(1-a)}{\sin(1-a)}$$
        $$=\dfrac{\cos1(1-\cos^2a)+\cos a\sin1\sin a}{\sin(1+a)}-\dfrac{\cos1(1-\cos^2a)-\cos a\sin1\sin a}{\sin(1-a)}$$
        $$=\dfrac{\sin a(\cos1\sin a+\cos a\sin1)}{\cos1\sin a+\cos a\sin1}-\dfrac{\sin a(\cos1\sin a-\cos a\sin1)}{\sin1\cos a-\cos1\sin a}=2\sin a$$
        이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 2-1.M3
    - id: 21b-4
      content: |
        즉 $\displaystyle\int_{1-a}^{1+a}\dfrac{\cos a-\cos1\cos x}{\sin^2x}\,dx=2\sin a=2\sin f(a)$이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 2-1.A1
    - id: 21b-5
      content: |
        $f(x)$는 $f(0)=0$인 다항식이므로 $f(x)=x$이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 2-1.M4
