- id: 3-2
  stem: |
    (b) 함수 $f(x)$가 미분가능함을 보여라. (40점)
  points: 40
  depends_on:
  - 3-1
  answer:
    kind: proof
    value: proof
    equivalents: []
    tolerance: null
  solutions:
  - id: S32-B
    audience: B
    method_no: 1
    steps:
    - id: 32b-1
      content: |
        $0<x<1$과 $1<x<1+\sqrt{2}$에서 $f(x)$는 미분가능한 함수의 합과 곱으로 정의되었으므로 각 구간에서 미분가능하다. $x=1$에서의 미분가능성을 확인하자.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 3-2.M1
    - id: 32b-2
      content: |
        $$\lim_{h\to0-}\dfrac{f(1+h)-f(1)}{h}=\lim_{h\to0-}\dfrac{(1+h)\left\{3+2\sqrt{2}-\dfrac{1+(1+h)}{2}-\sqrt{1+h}\right\}-(1+2\sqrt{2})}{h}=2\sqrt{2}$$
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 3-2.M2
    - id: 32b-3
      content: |
        $$\lim_{h\to0+}\dfrac{f(1+h)-f(1)}{h}=\lim_{h\to0+}\dfrac{(1+h)\{2+2\sqrt{2}-(1+h)\}-(1+2\sqrt{2})}{h}=2\sqrt{2}$$
        이다. 따라서 $f(x)$는 $x=1$에서 미분가능하고, $f(x)$는 $0<x<1+\sqrt{2}$에서 미분가능하다. ■
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 3-2.M3
      - 3-2.A1
