stimuli: []
stem: |
  한 변의 길이가 $3+2\sqrt{2}$인 정사각형 ABCD와 그 내부에 원 $C_1$, 원 $C_2$, 직사각형 EBFG가 다음을 모두 만족시키도록 놓여있다.

  (1) $C_1$은 두 변 AB, AD와 각각 한 점에서만 만난다.
  (2) $C_2$는 중심이 $C_1$ 밖에 있고 $C_1$, 변 BC, 변 CD와 각각 한 점에서만 만난다.
  (3) 점 E는 변 AB에 있고, 점 F는 변 BC에 있다.
  (4) 직사각형 EBFG는 $C_1$, $C_2$와 각각 한 점에서만 만난다.
  (5) $\overline{\mathrm{BF}}<\overline{\mathrm{EB}}$

  변 BF의 길이를 $x$라 하고 직사각형 EBFG의 넓이를 $f(x)$라 하자.

  [그림: 정사각형 ABCD(A 왼쪽 위, B 왼쪽 아래, C 오른쪽 아래, D 오른쪽 위)의 꼭짓점 A 쪽에 작은 원 $C_1$이 변 AB, AD에 접하고, 꼭짓점 C 쪽에 큰 원 $C_2$가 변 BC, CD에 접해 있다. 변 AB 위의 점 E와 변 BC 위의 점 F, 점 G로 이루어진 직사각형 EBFG(음영)가 왼쪽 아래에 놓여 G는 $C_1$ 가까이에 있다]
subparts:
- id: 3-1
  stem: |
    (a) 함수 $f(x)$를 구하여라. (65점)
  points: 65
  depends_on: []
  answer:
    kind: expression
    value: Piecewise((x*(3+2*sqrt(2)-(1+x)/2-sqrt(x)), x<1), (x*(2+2*sqrt(2)-x), True))
    equivalents: []
    tolerance: null
  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: |
        $d=3+2\sqrt{2}$라 하자. $C_1$과 $C_2$의 반지름을 각각 $y$, $z$라 하자. $\overline{\mathrm{AC}}=\sqrt{2}y+y+z+\sqrt{2}z=\sqrt{2}d$이므로 $y+z=2+\sqrt{2}$이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 3-1.M1
    - id: 31b-2
      content: |
        $\overline{\mathrm{BF}}+\overline{\mathrm{FC}}=\overline{\mathrm{BC}}$이므로 $x+2z=d$이고 $z=\dfrac{d-x}{2}$이다. 따라서 $y=2+\sqrt{2}-z=\dfrac{1+x}{2}$이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 3-1.M2
    - id: 31b-3
      content: |
        (i) $x<y$일 경우: $y=\dfrac{1+x}{2}$이므로 $x<1$이다. $C_1$의 중심을 지나고 $\overline{\mathrm{AD}}$와 평행한 직선과 점 G 사이의 거리를 $w$라 하면
        $$w=\sqrt{y^2-(y-x)^2}=\sqrt{\left(\dfrac{1+x}{2}\right)^2-\left(\dfrac{1-x}{2}\right)^2}=\sqrt{x}$$
        이다. $\overline{\mathrm{EB}}=d-y-w=d-\dfrac{1+x}{2}-\sqrt{x}$이므로 $0<x<1$이고 $f(x)=\overline{\mathrm{BF}}\cdot\overline{\mathrm{EB}}=x\left(d-\dfrac{1+x}{2}-\sqrt{x}\right)$이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 3-1.M3
    - id: 31b-4
      content: |
        (ii) $x\ge y$일 경우: $y=\dfrac{1+x}{2}$이므로 $x\ge1$이다. 또한 $\overline{\mathrm{EG}}$가 $C_1$에 접하므로 $\overline{\mathrm{EB}}=d-2y=d-1-x$이다. 조건 (5)로부터 $x<d-1-x$이므로 $x<1+\sqrt{2}$이다. 따라서 $1\le x<1+\sqrt{2}$이고 $f(x)=\overline{\mathrm{BF}}\cdot\overline{\mathrm{EB}}=x(d-1-x)$이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 3-1.M4
    - id: 31b-5
      content: |
        (i)과 (ii)에 의해
        $$f(x)=\begin{cases}x\left(3+2\sqrt{2}-\dfrac{1+x}{2}-\sqrt{x}\right)&(0<x<1)\\x(2+2\sqrt{2}-x)&(1\le x<1+\sqrt{2})\end{cases}$$
        이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 3-1.A1
