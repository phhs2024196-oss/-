stimuli: []
stem: |
  자연수 $n$에 대하여 다음을 모두 만족시키는 세 자연수 $a$, $b$, $c$의 순서쌍 $(a,b,c)$의 개수를 구하여라.

  (1) $1\le a<b<c\le6n$
  (2) $a+c=2b$
  (3) $\sin\left(\dfrac{\pi a}{6n}\right)<\sin\left(\dfrac{\pi b}{6n}\right)<\sin\left(\dfrac{\pi c}{6n}\right)$
