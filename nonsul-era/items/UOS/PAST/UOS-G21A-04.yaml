  solutions:
  - id: S41-B
    audience: B
    method_no: 1
    steps:
    - id: 41b-1
      content: |
        $f(x)=\sin\left(\dfrac{\pi x}{6n}\right)$라 하자. 함수 $y=f(x)$의 그래프는 해설지 그림과 같다(구간 $[0,6n]$에서 위로 볼록하고 $x=3n$에 대해 대칭). $a$, $b$, $c$는 서로 다른 자연수이므로 $2\le b\le6n-1$이다.
      source_flow: 해설지 p.5 예시 답안
      criteria:
      - 4-1.M1
    - id: 41b-2
      content: |
        (i) $2\le b\le2n$일 경우: $a$는 자연수이므로 조건 (2)에 의해 $c<4n$이다. 따라서 함수 $y=f(x)$의 그래프에 의해서 $f(a)<f(b)<f(c)$을 만족시킨다. $b$에 대하여 $a$를 1부터 $b-1$까지 선택할 수 있으므로 세 자연수 $a$, $b$, $c$의 순서쌍 $(a,b,c)$의 개수는 $b-1$이다.
      source_flow: 해설지 p.5 예시 답안
      criteria:
      - 4-1.M2
    - id: 41b-3
      content: |
        (ii) $2n<b<3n$일 경우: $y=f(x)$는 $x=3n$에 대해서 대칭이므로 $f(b)<f(c)$를 만족시키기 위해서는 $b<c<6n-b$이어야 한다. 또한 $c$가 $b<c<6n-b$인 경우 $a$는 1과 $b$ 사이에 존재하고 $f(a)<f(b)$이다. $b$에 대하여 $c$는 $b+1$부터 $6n-b-1$까지 선택할 수 있으므로 세 자연수 $a$, $b$, $c$의 순서쌍 $(a,b,c)$의 개수는 $6n-2b-1$이다.
      source_flow: 해설지 p.5 예시 답안
      criteria:
      - 4-1.M3
    - id: 41b-4
      content: |
        (iii) $3n\le b\le6n-1$일 경우: 함수 $y=f(x)$의 그래프로부터 $f(b)>f(c)$이므로 주어진 조건을 만족시키는 순서쌍 $(a,b,c)$가 존재하지 않는다.
      source_flow: 해설지 p.5 예시 답안
      criteria:
      - 4-1.B1
    - id: 41b-5
      content: |
        (i), (ii), (iii)에 의해서 주어진 조건을 모두 만족시키는 세 자연수 $a$, $b$, $c$의 순서쌍 $(a,b,c)$의 개수는
        $$\sum_{b=2}^{2n}(b-1)+\sum_{b=2n+1}^{3n-1}(6n-2b-1)=3n^2-3n+1$$
        이다.
      source_flow: 해설지 p.5 예시 답안
      criteria:
      - 4-1.A1
