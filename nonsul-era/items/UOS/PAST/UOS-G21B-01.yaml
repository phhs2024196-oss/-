stimuli: []
stem: |
  $f(x)=x^4+2ax^3-3a^2x^2+4a^4-4a^3+1\ (a>0)$이다. 곡선 $y=f(x)$가 점 $(1, 1)$을 지나는 직선과 서로 다른 두 점에서 접할 때,
subparts:
- id: 1-1
  stem: |
    이 직선과 곡선 $y=f(x)$로 둘러싸인 도형의 넓이를 구하여라.
  points: 85
  depends_on: []
  answer:
    kind: expression
    value: 81*a**5/10
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        점 $(1,1)$을 지나며 기울기가 $m$인 직선의 방정식은 $y=m(x-1)+1$이다. 곡선 $y=f(x)$와 이 직선이 서로 다른 두 점에서 접할 때, 두 점의 $x$좌표를 $\alpha,\ \beta$ (단, $\alpha<\beta$)라 하면
        $$(x-\alpha)^2(x-\beta)^2=x^4+2ax^3-3a^2x^2+4a^4-4a^3+1-\{m(x-1)+1\}$$
        이다.
      source_flow: 해설지 p.1 예시 답안
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        $x^3,\ x^2,\ x$의 계수와 상수항을 비교하면
        $$-2(\alpha+\beta)=2a,\quad \alpha^2+4\alpha\beta+\beta^2=-3a^2,\quad -2\alpha\beta(\alpha+\beta)=-m,\quad \alpha^2\beta^2=4a^4-4a^3+m$$
        이므로 $m=4a^3$이고 $\alpha=-2a,\ \beta=a$이다.
      source_flow: 해설지 p.1 예시 답안
      criteria:
      - 1-1.M2
      - 1-1.A1
    - id: 11b-3
      content: |
        직선 $y=4a^3(x-1)+1$과 곡선 $y=f(x)$로 둘러싸인 도형의 넓이는
        $$\int_{-2a}^{a}\{(x^4+2ax^3-3a^2x^2+4a^4-4a^3+1)-(4a^3x-4a^3+1)\}dx=\left[\frac15x^5+\frac12ax^4-a^2x^3-2a^3x^2+4a^4x\right]_{-2a}^{a}=\frac{81}{10}a^5$$
        이다.
      source_flow: 해설지 p.1 예시 답안
      criteria:
      - 1-1.M3
      - 1-1.A2
