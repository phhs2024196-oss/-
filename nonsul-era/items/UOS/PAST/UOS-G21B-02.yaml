    - id: 2-1.M3
      mark_type: M
      points: 20
      evidence: 1이 놓이는 세 위치는 조건 (3)의 성립 여부에 영향을 주지 않음을 서술해 위치 선택의 경우의 수 ${}_n\mathrm{C}_3$을 곱하는 근거를 밝혔다.
      depends_on: []
