stimuli: []
stem: |
  자연수 $n\ (n\ge9)$에 대하여 $n$ 이하의 자연수 전체의 집합을 $A_n$이라 하자.
subparts:
- id: 2-1
  stem: |
    다음을 모두 만족시키는 함수 $f:A_n\to\{0,1,2\}$의 개수를 구하여라.

    (1) 집합 $\{k\mid f(k)=0,\ k\in A_n\}$의 원소의 개수는 3이다.
    (2) 집합 $\{k\mid f(k)=1,\ k\in A_n\}$의 원소의 개수는 3이다.
    (3) $n$ 이하의 모든 자연수 $k$에 대하여 $\sum_{i=1}^{k}f(i)\ge k$이다.
  points: 95
  depends_on: []
  answer:
    kind: expression
    value: n*(n-1)*(n-2)*(n-3)*(n-4)*(n-8)/36
    equivalents: []
    tolerance: null
  solutions:
  - id: S21-B
    audience: B
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        (i) $f(n-2)=f(n-1)=f(n)=1$일 경우를 생각하자. 그러면 조건 (1)과 (2)를 모두 만족시키지만 조건 (3)을 만족시키지 않는 함수의 개수는 다음과 같다.
        - $f(1)=0$의 경우 함수의 개수는 ${}_{n-4}\mathrm{C}_2$이다.
        - $f(1)=2,\ f(2)=0,\ f(3)=0$의 경우 함수의 개수는 ${}_{n-6}\mathrm{C}_1$이다.
        - $f(1)=2,\ f(2)=0,\ f(3)=2,\ f(4)=0,\ f(5)=0$의 경우 함수의 개수는 1이다.
        - $f(1)=2,\ f(2)=2,\ f(3)=0,\ f(4)=0,\ f(5)=0$의 경우 함수의 개수는 1이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 2-1.M1
      - 2-1.A1
    - id: 21b-2
      content: |
        따라서 이 경우에 문제의 조건을 모두 만족시키는 함수의 개수는 조건 (1)과 (2)를 모두 만족시키는 함수의 개수에서 위 네 가지 경우에 해당하는 함수의 개수를 뺀 것과 같다. 즉
        $${}_{n-3}\mathrm{C}_3-\left({}_{n-4}\mathrm{C}_2+{}_{n-6}\mathrm{C}_1+1+1\right)=\frac{(n-3)(n-4)(n-8)}{6}$$
        이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 2-1.M2
      - 2-1.A2
    - id: 21b-3
      content: |
        (ii) 일반적으로 $1\le a<b<c\le n$인 $a,b,c$에서 $f(a)=f(b)=f(c)=1$일 경우는 $a,b,c$의 선택이 조건 (3)의 부등식의 성립여부에 영향을 주지 않는다. 따라서 주어진 조건을 모두 만족시키는 함수의 개수도 $\dfrac{(n-3)(n-4)(n-8)}{6}$이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 2-1.M3
    - id: 21b-4
      content: |
        따라서 문제의 조건을 모두 만족시키는 함수의 개수는
        $${}_{n}\mathrm{C}_3\times\frac{(n-3)(n-4)(n-8)}{6}=\frac{n(n-1)(n-2)(n-3)(n-4)(n-8)}{36}$$
        이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 2-1.A3
