- id: 3-2
  stem: |
    (b) 곡선 $y=x^2$에서 움직이는 점 P와 곡선 $y=-(x-6)^2$에서 움직이는 점 Q에 대하여 $\overline{\mathrm{PQ}}$의 최솟값을 구하여라. (50점)
  points: 50
  depends_on:
