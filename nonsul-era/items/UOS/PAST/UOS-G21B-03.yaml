  answer:
    kind: value
    value: 2*sqrt(5)
    equivalents: []
    tolerance: null
  solutions:
  - id: S32-B
    audience: B
    method_no: 1
    steps:
    - id: 32b-1
      content: |
        $\overline{\mathrm{PQ}}$가 최소일 때 곡선 $y=x^2$의 점을 A$(a, a^2)$, 곡선 $y=-(x-6)^2$의 점을 B$(b, -(b-6)^2)$이라 하자. 그러면 (a)에 의해 다음을 모두 만족시킨다.
        ① 곡선 $y=x^2$의 점 A에서의 접선 $l_1$과 곡선 $y=-(x-6)^2$의 점 B에서의 접선 $l_2$가 서로 평행하다.
        ② 두 점 A, B를 지나는 직선은 두 접선 $l_1,\ l_2$와 동시에 수직이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 3-2.M1
    - id: 32b-2
      content: |
        조건 ①로부터 $a=-b+6$이다. $a=b$이면 $a=b=3$이고 조건 ②를 만족시키지 않으므로 $a\ne b$이다. 그러면 조건 ②로부터
        $$\frac{a^2+(b-6)^2}{a-b}\cdot 2a=-1,\qquad \frac{a^2+(b-6)^2}{a-b}\cdot\{-2(b-6)\}=-1$$
        이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 3-2.M2
    - id: 32b-3
      content: |
        $2a^3+a-3=(a-1)(2a^2+2a+3)=0$이므로, $a=1$이고 $b=5$이다. 따라서 $\overline{\mathrm{AB}}=2\sqrt5$이므로 최솟값은 $2\sqrt5$이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 3-2.M3
      - 3-2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3-2.M1
      mark_type: M
      points: 15
      evidence: (a)를 두 곡선 위의 점에 적용해 ① 접선이 서로 평행, ② $\overline{\mathrm{AB}}$가 두 접선에 수직이라는 조건을 세웠다.
      depends_on: []
      steps:
      - 32b-1
    - id: 3-2.M2
      mark_type: M
      points: 15
      evidence: ①로부터 $a=-b+6$을, ②로부터 $a,b$에 관한 식을 세웠다($a\ne b$ 확인 포함).
      depends_on:
      - 3-2.M1
      steps:
      - 32b-2
    - id: 3-2.M3
      mark_type: M
      points: 10
      evidence: 식을 정리해 $2a^3+a-3=0$ 등으로 $a,b$를 구하는 과정이 있다.
      depends_on:
      - 3-2.M2
      steps:
      - 32b-3
    - id: 3-2.A1
      mark_type: A
      points: 10
      evidence: $a=1,\ b=5$와 최솟값 $2\sqrt5$를 구했다.
      depends_on:
      - 3-2.M3
      steps:
      - 32b-3
