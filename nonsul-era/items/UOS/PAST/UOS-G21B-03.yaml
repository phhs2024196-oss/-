subparts:
- id: 3-1
  stem: |
    (a) 미분가능한 함수 $f(x)$에 대하여, 곡선 $y=f(x)$의 점 P와 이 곡선에 있지 않은 점 Q가 다음을 만족시킬 때, 곡선 $y=f(x)$의 점 P에서의 접선과 직선 PQ가 수직임을 보여라. (55점)

    곡선 $y=f(x)$의 모든 점 X에 대하여 $\overline{\mathrm{PQ}}\le\overline{\mathrm{XQ}}$이다.
  points: 55
  depends_on: []
  answer:
    kind: proof
    value: null
    equivalents: []
    tolerance: null
  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: |
        곡선 $y=f(x)$의 점 P의 좌표를 $(p, f(p))$라 하고, 점 Q$(a, b)$라 하자. 곡선 $y=f(x)$의 모든 점 X$(x,f(x))$에 대하여 $\overline{\mathrm{PQ}}\le\overline{\mathrm{XQ}}$이다. 함수 $g(x)=\overline{\mathrm{XQ}}^2=(x-a)^2+(f(x)-b)^2$는 미분가능한 함수이고, 최솟값은 $g(p)=\overline{\mathrm{PQ}}^2$이다. 따라서
        $$g'(p)=2(p-a)+2(f(p)-b)f'(p)=0$$
        이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 3-1.M1
      - 3-1.A1
    - id: 31b-2
      content: |
        $p\ne a$이면 $\dfrac{f(p)-b}{p-a}\cdot f'(p)=-1$이고, 곡선 $y=f(x)$의 점 P에서의 접선과 직선 PQ가 수직이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 3-1.M2
    - id: 31b-3
      content: |
        $p=a$이면 직선 PQ는 $y$축과 평행하고, 점 Q$(a, b)$가 곡선 $y=f(x)$에 있지 않으므로 $f(p)\ne b$이다. 따라서 $f'(p)=0$이므로 곡선 $y=f(x)$의 점 P에서의 접선은 $x$축과 평행하므로, 곡선 $y=f(x)$의 점 P에서의 접선과 직선 PQ가 수직이다. ■
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 3-1.M3
      - 3-1.R1
