stimuli: []
stem: |
  함수 $y=f(x)\ (x\ge1)$가 다음을 만족시킨다.

  모든 자연수 $m$에 대하여 $64^{m-1}\le x<64^m$이면 $f(x)=8^m$이다.

  자연수 $k$에 대하여 함수 $y=\dfrac{1}{k^3}x^2$의 그래프와 함수 $y=f(x)$의 그래프의 교점의 개수를 $a_k$라 하자.
subparts:
- id: 4-1
  stem: |
    $n=2^{300}$일 때, $\displaystyle\sum_{k=1}^{n}a_k$를 구하여라.
  points: 115
  depends_on: []
  answer:
    kind: expression
    value: (11*2**300-4)/7
    equivalents: []
    tolerance: null
  solutions:
  - id: S41-B
    audience: B
    method_no: 1
    steps:
    - id: 41b-1
      content: |
        자연수 $m$에 대하여 $64^{m-1}\le x<64^m$에서 포물선 $y=\dfrac1{k^3}x^2$과 직선 $y=8^m$의 교점의 개수는 0 혹은 1이다. 교점의 개수가 1일 필요충분조건은 $\dfrac{64^{2m-2}}{k^3}\le8^m<\dfrac{64^{2m}}{k^3}$이다. 즉
        $$2^{3m-4}\le k<2^{3m}\quad(1\le k\le2^{300})\qquad\cdots\ \text{①}$$
        이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 4-1.M1
      - 4-1.A1
    - id: 41b-2
      content: |
        $\displaystyle\sum_{k=1}^{2^{300}}a_k$는 ①을 만족시키는 자연수의 순서쌍 $(k,m)$의 개수와 같다. 따라서 각 $m$에 대하여 $b_m$을 ①을 만족시키는 $k$의 개수라 하면
        $$b_m=n\left(\{k\mid1\le k\le2^{300},\ 2^{3m-4}\le k<2^{3m}\}\right)=\begin{cases}7&(m=1)\\2^{3m}-2^{3m-4}&(2\le m\le100)\\2^{300}-2^{299}+1&(m=101)\\0&(m>101)\end{cases}$$
        이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 4-1.M2
      - 4-1.A2
    - id: 41b-3
      content: |
        이므로
        $$\sum_{k=1}^{2^{300}}a_k=\sum_{m=1}^{101}b_m=7+\sum_{m=2}^{100}(2^{3m}-2^{3m-4})+2^{300}-2^{299}+1=\frac{11\cdot2^{300}-4}{7}$$
        이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 4-1.M3
      - 4-1.A3
