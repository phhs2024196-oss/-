      mark_type: M
      points: 15
      evidence: $S_3=S_1+S_2$ 로 분할하고 (a)의 결과로 $S_3\le\dfrac{a^3-4a^2+4a}{8}$ 를 얻었다.
      steps:
      - 12b-1
    - id: 1-2.M2
      mark_type: M
      points: 15
      evidence: $f^{\prime}(x)=\dfrac{(3x-2)(x-2)}{8}$ 을 구하고 증감을 조사했다.
      depends_on:
      - 1-2.M1
      steps:
      - 12b-2
    - id: 1-2.A1
      mark_type: A
      points: 15
      evidence: $x=\dfrac{2}{3}$ 에서 극대(최대) $f\left(\dfrac{2}{3}\right)=\dfrac{4}{27}$ 를 구했다.
      depends_on:
      - 1-2.M2
      steps:
      - 12b-2
    - id: 1-2.A2
      mark_type: A
      points: 10
      evidence: 최댓값 $\dfrac{4}{27}$ 를 답으로 적었다.
      depends_on:
      - 1-2.A1
      steps:
      - 12b-3
    - id: 1-2.R1
      mark_type: R
      points: 5
      evidence: $a=\dfrac{2}{3}$, $b=\dfrac{1}{3}$ 에서 등호가 성립함을 확인했다.
      depends_on:
      - 1-2.A1
      steps:
      - 12b-3
