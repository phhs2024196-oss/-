stimuli: []
stem: |
  좌표평면에서 곡선 $y=x-x^2$의 네 점 $\mathrm{O}(0,0)$, $\mathrm{A}(a,a-a^2)$, $\mathrm{B}(b,b-b^2)$, $\mathrm{C}(1,0)$에 대하여 다음 물음에 답하여라. (단, $0<b<a<1$이다.)
subparts:
- id: 1-1
  stem: |
    (a) 점 B가 곡선에서 두 점 O와 A 사이를 움직일 때, 삼각형 OAB의 넓이의 최댓값을 $a$에 대한 식으로 나타내어라. (25점)
  points: 25
  depends_on: []
  answer:
    kind: expression
    value: a**3/8
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        삼각형 OAB, 삼각형 AOC, 사각형 ABOC의 넓이를 차례로 $S_1$, $S_2$, $S_3$이라 하자. 이때 $S_1=\dfrac{ab(a-b)}{2}$, $S_2=\dfrac{a-a^2}{2}$, $S_3=S_1+S_2$이다.
      source_flow: 해설지 p.1 예시 답안
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        $S_1=\dfrac{ab(a-b)}{2}=-\dfrac{a}{2}\left(b-\dfrac{a}{2}\right)^2+\dfrac{a^3}{8}$이므로 $S_1$의 최댓값은 $\dfrac{a^3}{8}$이다.
      source_flow: 해설지 p.1 예시 답안
      criteria:
      - 1-1.M2
      - 1-1.A1
