- id: 1-2
  stem: |
    (b) 두 점 A, B가 곡선에서 두 점 O와 C 사이를 움직일 때, 사각형 ABOC의 넓이의 최댓값을 구하여라. (60점)
  points: 60
  depends_on:
  - 1-1
  answer:
    kind: value
    value: 4/27
    equivalents: []
    tolerance: null
  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        $S_3=S_1+S_2$, $S_1\le\dfrac{a^3}{8}$, $S_2=\dfrac{a-a^2}{2}$이므로 $S_3\le\dfrac{a^3}{8}+\dfrac{a-a^2}{2}=\dfrac{a^3-4a^2+4a}{8}$이다.
      source_flow: 해설지 p.1 예시 답안
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: |
        $f(x)=\dfrac{x^3-4x^2+4x}{8}$라 하면 $f^{\prime}(x)=\dfrac{3x^2-8x+4}{8}=\dfrac{(3x-2)(x-2)}{8}$이다. 증감표는 $0<x<\dfrac{2}{3}$에서 $f^{\prime}(x)>0$(증가), $x=\dfrac{2}{3}$에서 $f^{\prime}(x)=0$, $\dfrac{2}{3}<x<1$에서 $f^{\prime}(x)<0$(감소)이고 $f\left(\dfrac{2}{3}\right)=\dfrac{4}{27}$이다.
      source_flow: 해설지 p.1 예시 답안
      criteria:
      - 1-2.M2
      - 1-2.A1
    - id: 12b-3
      content: |
        그러므로 열린구간 $(0,1)$에서 $f(x)$의 최댓값은 $\dfrac{4}{27}$이다. $S_3\le\dfrac{4}{27}$이고, $a=\dfrac{2}{3}$, $b=\dfrac{1}{3}$일 때 $S_3=\dfrac{4}{27}$이므로 $S_3$의 최댓값은 $\dfrac{4}{27}$이다.
      source_flow: 해설지 p.1 예시 답안
      criteria:
      - 1-2.A2
      - 1-2.R1
  # 채점기준 미공개 — 단계별 추정
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
