- id: 2-2
  stem: |
    (b) 적어도 한 번은 2 이하의 눈이 나왔을 때, 3의 배수의 눈이 연속해서 나오지 않을 확률을 기약분수로 나타내어라. (50점)
  points: 50
  depends_on:
