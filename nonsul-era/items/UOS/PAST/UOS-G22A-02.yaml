stem: |
  한 개의 주사위를 6번 던질 때, 다음 물음에 답하여라.
subparts:
- id: 2-1
  stem: |
    (a) 3의 배수의 눈이 연속해서 나오지 않을 확률을 기약분수로 나타내어라. (45점)
  points: 45
  depends_on: []
  answer:
    kind: value
    value: 448/729
    equivalents: []
    tolerance: null
  solutions:
  - id: S21-B
    audience: B
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        주사위를 한 번 던졌을 때 3의 배수의 눈이 나올 확률은 $\dfrac{1}{3}$이며, 주사위를 여러 번 던졌을 때 매번 3의 배수의 눈이 나오는 사건은 서로 독립이다. 3의 배수가 연속해서 나오지 않을 확률은 3의 배수가 나오는 횟수에 따라 다음과 같다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 2-1.M1
    - id: 21b-2
      content: |
        (i) 3의 배수가 한 번도 나오지 않을 확률은 $\left(\dfrac{2}{3}\right)^6=\dfrac{64}{729}$이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 2-1.B1
    - id: 21b-3
      content: |
        (ii) 3의 배수가 한 번 나올 확률은 $_6\mathrm{C}_1\times\dfrac{1}{3}\times\left(\dfrac{2}{3}\right)^5=\dfrac{192}{729}$이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 2-1.B2
    - id: 21b-4
      content: |
        (iii) 3의 배수가 두 번 나오고, 3의 배수가 연속해서 나오지 않을 확률은 $_5\mathrm{C}_2\times\left(\dfrac{1}{3}\right)^2\times\left(\dfrac{2}{3}\right)^4=\dfrac{160}{729}$이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 2-1.B3
    - id: 21b-5
      content: |
        (iv) 3의 배수가 세 번 나오고, 3의 배수가 연속해서 나오지 않을 확률은 $_4\mathrm{C}_3\times\left(\dfrac{1}{3}\right)^3\times\left(\dfrac{2}{3}\right)^3=\dfrac{32}{729}$이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 2-1.B4
    - id: 21b-6
      content: |
        (i)~(iv)에 의해서 구하는 확률은 $\dfrac{64+192+160+32}{729}=\dfrac{448}{729}$이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 2-1.A1
