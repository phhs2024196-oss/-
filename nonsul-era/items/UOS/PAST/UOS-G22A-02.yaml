      steps:
      - 22b-1
    - id: 2-2.B1
      mark_type: B
      points: 10
      evidence: $\mathrm{P}(B^{C})=\dfrac{64}{729}$, $\mathrm{P}(B)=\dfrac{665}{729}$ 를 구했다.
      steps:
      - 22b-2
    - id: 2-2.M2
      mark_type: M
      points: 10
      evidence: $B^{C}$ 에서는 모든 눈이 3 이상이므로 3의 배수 확률이 $\dfrac{1}{2}$ 임을 이용했다.
      steps:
      - 22b-3
    - id: 2-2.B2
      mark_type: B
      points: 10
      evidence: $\mathrm{P}(A\mid B^{C})=\dfrac{21}{64}$ 를 구했다.
      depends_on:
      - 2-2.M2
      steps:
      - 22b-3
    - id: 2-2.A1
      mark_type: A
      points: 10
      evidence: (a)의 $\dfrac{448}{729}$ 를 이월해 $\dfrac{61}{95}$ 를 구했다(기약분수).
      depends_on:
      - 2-2.M1
      - 2-2.B1
      - 2-2.B2
      steps:
      - 22b-4
