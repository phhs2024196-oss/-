  answer:
    kind: value
    value: 61/95
    equivalents: []
    tolerance: null
  solutions:
  - id: S22-B
    audience: B
    method_no: 1
    steps:
    - id: 22b-1
      content: |
        주사위를 6번 던질 때, 3의 배수의 눈이 연속해서 나오지 않는 사건을 $A$, 적어도 한 번은 2 이하의 눈이 나오는 사건을 $B$라고 하자. $\mathrm{P}(A)=\mathrm{P}(A\cap B)+\mathrm{P}(A\cap B^{C})$이므로
        $$\mathrm{P}(A\mid B)=\dfrac{\mathrm{P}(A\cap B)}{\mathrm{P}(B)}=\dfrac{\mathrm{P}(A)-\mathrm{P}(A\cap B^{C})}{\mathrm{P}(B)}=\dfrac{\mathrm{P}(A)-\mathrm{P}(B^{C})\mathrm{P}(A\mid B^{C})}{\mathrm{P}(B)}$$
        이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 2-2.M1
    - id: 22b-2
      content: |
        $\mathrm{P}(B^{C})=\left(\dfrac{2}{3}\right)^6=\dfrac{64}{729}$, $\mathrm{P}(B)=1-\left(\dfrac{2}{3}\right)^6=\dfrac{665}{729}$이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 2-2.B1
    - id: 22b-3
      content: |
        $\mathrm{P}(A\mid B^{C})$는 나온 눈의 개수가 모두 3 이상일 때, 3의 배수의 눈이 연속해서 나오지 않을 확률과 같다. 나온 눈의 개수가 모두 3 이상일 때, 3의 배수의 눈이 나올 확률은 $\dfrac{1}{2}$이므로, (a)와 같은 방법으로
        $$\mathrm{P}(A\mid B^{C})=\left(\dfrac{1}{2}\right)^6+{}_6\mathrm{C}_1\times\left(\dfrac{1}{2}\right)^6+{}_5\mathrm{C}_2\times\left(\dfrac{1}{2}\right)^6+{}_4\mathrm{C}_3\times\left(\dfrac{1}{2}\right)^6=\dfrac{21}{64}$$
        이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 2-2.M2
      - 2-2.B2
    - id: 22b-4
      content: |
        따라서 $\mathrm{P}(A\mid B)=\dfrac{\dfrac{448}{729}-\dfrac{64}{729}\times\dfrac{21}{64}}{\dfrac{665}{729}}=\dfrac{427}{665}=\dfrac{61}{95}$이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 2-2.A1
