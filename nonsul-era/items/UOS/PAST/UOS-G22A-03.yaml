stem: |
  다음 정적분의 값을 구하여라.
  $$\int_{-\frac{\pi}{2}}^{\frac{\pi}{2}}\left\lvert3\sqrt{2}\sin^3x-\cos x\right\rvert dx$$
subparts:
- id: 3-1
  stem: ''
  points: 105
  depends_on: []
  answer:
    kind: value
    value: 34*sqrt(3)/9
    equivalents: []
    tolerance: null
  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: |
        $f(x)=3\sqrt{2}\sin^3x-\cos x$라 하자. $-\dfrac{\pi}{2}\le x\le0$일 때 $\sin x\le0$, $\cos x\ge0$이므로 $f(x)\le0$이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 3-1.M1
    - id: 31b-2
      content: |
        닫힌구간 $\left[0,\dfrac{\pi}{2}\right]$에서 함수 $g(x)=3\sqrt{2}\sin^3x$는 증가함수이고, 함수 $h(x)=\cos x$는 감소함수이다. $f(x)=g(x)-h(x)$는 연속인 증가함수이고, $f(0)=-1<0$, $f\left(\dfrac{\pi}{2}\right)=3\sqrt{2}>0$이므로 사잇값 정리에 의해 방정식 $f(x)=0$은 구간 $\left[0,\dfrac{\pi}{2}\right]$에서 유일한 해를 갖는다. 이 해를 $a$라 하자. $-\dfrac{\pi}{2}\le x\le a$이면 $f(x)\le0$이고 $a\le x\le\dfrac{\pi}{2}$이면 $f(x)\ge0$이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 3-1.M2
    - id: 31b-3
      content: |
        또한 $3\sqrt{2}\sin^3a=\cos a$, $18\sin^6a=\cos^2a=1-\sin^2a$, $18\sin^6a+\sin^2a-1=(3\sin^2a-1)(6\sin^4a+2\sin^2a+1)=0$이므로 $3\sin^2a=1$, $\sin a=\dfrac{1}{\sqrt{3}}$이고 $\cos a=\sqrt{1-\sin^2a}=\dfrac{\sqrt{2}}{\sqrt{3}}$이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 3-1.M3
    - id: 31b-4
      content: |
        $\sin^3x=\sin^2x\sin x=(1-\cos^2x)\sin x=\sin x-\cos^2x\sin x$이므로
        $$\int\left(3\sqrt{2}\sin^3x-\cos x\right)dx=\int3\sqrt{2}\sin x\,dx-\int3\sqrt{2}\cos^2x\sin x\,dx-\int\cos x\,dx=-3\sqrt{2}\cos x+\sqrt{2}\cos^3x-\sin x+C$$
        이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 3-1.M4
    - id: 31b-5
      content: |
        $F(x)=\sqrt{2}\cos^3x-3\sqrt{2}\cos x-\sin x$라 하자. 이때 $F^{\prime}(x)=f(x)$이고 $F\left(-\dfrac{\pi}{2}\right)=1$, $F\left(\dfrac{\pi}{2}\right)=-1$이며,
        $$F(a)=\sqrt{2}\cos^3a-3\sqrt{2}\cos a-\sin a=\sqrt{2}\times\dfrac{2\sqrt{2}}{3\sqrt{3}}-3\sqrt{2}\times\dfrac{\sqrt{2}}{\sqrt{3}}-\dfrac{1}{\sqrt{3}}=-\dfrac{17\sqrt{3}}{9}$$
        이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 3-1.A1
    - id: 31b-6
      content: |
        따라서
        $$\int_{-\frac{\pi}{2}}^{\frac{\pi}{2}}\left\lvert3\sqrt{2}\sin^3x-\cos x\right\rvert dx=-\int_{-\frac{\pi}{2}}^{a}f(x)\,dx+\int_{a}^{\frac{\pi}{2}}f(x)\,dx=-F(a)+F\left(-\dfrac{\pi}{2}\right)+F\left(\dfrac{\pi}{2}\right)-F(a)=\dfrac{34\sqrt{3}}{9}$$
        이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 3-1.A2
