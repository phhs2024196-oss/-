  solutions:
  - id: S41-B
    audience: B
    method_no: 1
    steps:
    - id: 41b-1
      content: |
        $a_{n+1}-4=\dfrac{3}{4}(a_n-4)+\dfrac{2}{\sqrt{a_n}}-1$이다. 양수 $a$에 대하여
        $$1-\dfrac{2}{\sqrt{a}}=\dfrac{\sqrt{a}-2}{\sqrt{a}}=\dfrac{(\sqrt{a}-2)(\sqrt{a}+2)}{\sqrt{a}(\sqrt{a}+2)}=\dfrac{a-4}{\sqrt{a}(\sqrt{a}+2)}$$
        이므로, $a>4$일 때 $0<1-\dfrac{2}{\sqrt{a}}<\dfrac{a-4}{8}$이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 4-1.M1
      - 4-1.M2
    - id: 41b-2
      content: |
        따라서 $a>4$일 때 $(a-4)\left(\dfrac{3}{4}-\dfrac{1}{8}\right)=\dfrac{3}{4}(a-4)-\dfrac{1}{8}(a-4)<\dfrac{3}{4}(a-4)-\left(1-\dfrac{2}{\sqrt{a}}\right)<\dfrac{3}{4}(a-4)$이므로
        $$0<\dfrac{3}{4}(a-4)+\dfrac{2}{\sqrt{a}}-1<\dfrac{3}{4}(a-4)\qquad\cdots\cdots\ ①$$
        이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 4-1.M3
    - id: 41b-3
      content: |
        모든 자연수 $n$에 대하여 $0<a_n-4\le\left(\dfrac{3}{4}\right)^{n-1}$이 성립함을 보이면 된다. 이를 수학적 귀납법을 이용해서 보이자. $n=1$일 때, $0<5-4\le\left(\dfrac{3}{4}\right)^0=1$이므로 성립한다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 4-1.B1
    - id: 41b-4
      content: |
        $n=k$일 때, 성립한다고 가정하면 $0<a_k-4\le\left(\dfrac{3}{4}\right)^{k-1}\ \cdots\cdots\ ②$이므로 $a_k>4$이다. ①, ②에 의해
        $$0<a_{k+1}-4=\dfrac{3}{4}(a_k-4)+\dfrac{2}{\sqrt{a_k}}-1<\dfrac{3}{4}(a_k-4)\le\left(\dfrac{3}{4}\right)^k$$
        이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 4-1.M4
    - id: 41b-5
      content: |
        따라서 $n=k+1$일 때도 성립하므로 모든 자연수 $n$에 대하여 $0<a_n-4\le\left(\dfrac{3}{4}\right)^{n-1}$이 성립한다. ■
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 4-1.R1
