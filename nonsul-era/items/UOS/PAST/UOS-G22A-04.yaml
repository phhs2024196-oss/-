stem: |
  수열 $\{a_n\}$의 귀납적 정의가
  $$a_1=5,\qquad a_{n+1}=\dfrac{3}{4}a_n+\dfrac{2}{\sqrt{a_n}}\qquad(n=1,2,3,\cdots)$$
  일 때, 다음 부등식이 성립함을 보여라.
  $$4<a_n\le\left(\dfrac{3}{4}\right)^{n-1}+4\qquad(n=1,2,3,\cdots)$$
