stem: |
  어느 김밥집에서 파는 김밥의 종류는 4가지다. 이 김밥집에서 서울이와 시립이가 다음을 모두 만족시키도록 김밥을 사는 경우의 수를 구하여라. (단, 모든 종류의 김밥은 충분하다.)

  (1) 서울이와 시립이는 각각 김밥 5줄을 산다.
  (2) 서울이가 산 김밥의 종류와 시립이가 산 김밥의 종류는 겹치지 않는다.
