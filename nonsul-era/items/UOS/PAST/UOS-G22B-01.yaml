    steps:
    - id: 11b-1
      content: |
        서울이가 산 김밥의 종류의 가짓수에 따라 다음과 같이 경우를 나누자.
      source_flow: 해설지 p.1 예시 답안
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        (i) 서울이가 1종류의 김밥을 샀을 때, 김밥의 종류를 선택하는 경우의 수는 $_4\mathrm{C}_1$이고, 선택한 1종류의 김밥에서 5줄을 사는 경우의 수는 1이다. 시립이가 나머지 3종류의 김밥에서 5줄을 사는 경우의 수는 $_3\mathrm{H}_5$이다. 이러한 경우의 수는 $_4\mathrm{C}_1\times1\times{}_3\mathrm{H}_5={}_4\mathrm{C}_1\times1\times{}_7\mathrm{C}_5=84$이다.
      source_flow: 해설지 p.1 예시 답안
      criteria:
      - 1-1.B1
    - id: 11b-3
      content: |
        (ii) 서울이가 2종류의 김밥을 샀을 때, 김밥의 종류를 선택하는 경우의 수는 $_4\mathrm{C}_2$이고, 선택한 2종류의 김밥에서 5줄의 김밥을 사는 경우의 수는 $_2\mathrm{H}_3$이다. 시립이가 나머지 2종류의 김밥에서 5줄을 사는 경우의 수는 $_2\mathrm{H}_5$이다. 이러한 경우의 수는 $_4\mathrm{C}_2\times{}_2\mathrm{H}_3\times{}_2\mathrm{H}_5={}_4\mathrm{C}_2\times{}_4\mathrm{C}_3\times{}_6\mathrm{C}_5=144$이다.
      source_flow: 해설지 p.1 예시 답안
      criteria:
      - 1-1.B2
    - id: 11b-4
      content: |
        (iii) 서울이가 3종류의 김밥을 샀을 때, 김밥의 종류를 선택하는 경우의 수는 $_4\mathrm{C}_3$이고, 선택한 3종류의 김밥에서 5줄의 김밥을 사는 경우의 수는 $_3\mathrm{H}_2$이다. 시립이가 나머지 1종류의 김밥에서 5줄을 사는 경우의 수는 1이다. 이러한 경우의 수는 $_4\mathrm{C}_3\times{}_3\mathrm{H}_2\times1={}_4\mathrm{C}_3\times{}_4\mathrm{C}_2\times1=24$이다.
      source_flow: 해설지 p.1 예시 답안
      criteria:
      - 1-1.B3
    - id: 11b-5
      content: |
        (i), (ii), (iii)에서 모든 경우의 수는 $84+144+24=252$이다.
      source_flow: 해설지 p.1 예시 답안
      criteria:
      - 1-1.A1
