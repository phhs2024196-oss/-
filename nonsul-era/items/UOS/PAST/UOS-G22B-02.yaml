stimuli: []
stem: |
  함수
  $$f(x)=\begin{cases}x^3-2x+11&(x\le-2)\\\dfrac{5}{2}x-2\cos\left(\dfrac{\pi}{3}x\right)+11&(x>-2)\end{cases}$$
  의 역함수의 그래프와 직선 $y=\dfrac{1}{5}x-1$의 모든 교점의 $y$좌표의 합을 $a$라 할 때, $a$의 정수 부분을 구하여라.
