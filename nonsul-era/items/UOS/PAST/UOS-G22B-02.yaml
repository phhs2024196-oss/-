  solutions:
  - id: S21-B
    audience: B
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        함수 $y=\dfrac{1}{5}x-1$의 역함수는 $y=5x+5$이다. 그러므로 구하는 교점의 $y$좌표는 곡선 $y=f(x)$와 직선 $y=5x+5$의 교점의 $x$좌표와 같다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 2-1.M1
    - id: 21b-2
      content: |
        (i) $x\le-2$일 때 $x^3-2x+11=5x+5$를 정리하면 $(x-1)(x-2)(x+3)=0$이다. 그러므로 $x\le-2$일 때의 근은 $-3$뿐이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 2-1.B1
    - id: 21b-3
      content: |
        (ii) $x>-2$일 때 $\dfrac{5}{2}x-2\cos\left(\dfrac{\pi}{3}x\right)+11=5x+5$를 정리하면 $\dfrac{5}{2}x+2\cos\left(\dfrac{\pi}{3}x\right)-6=0$이다. $h(x)=\dfrac{5}{2}x+2\cos\left(\dfrac{\pi}{3}x\right)-6$이라 하자. $h^{\prime}(x)=\dfrac{5}{2}-\dfrac{2\pi}{3}\sin\left(\dfrac{\pi}{3}x\right)\ge\dfrac{5}{2}-\dfrac{2\pi}{3}=\dfrac{15-4\pi}{6}>0$이므로 $h(x)$는 증가함수이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 2-1.M2
    - id: 21b-4
      content: |
        따라서 방정식 $h(x)=0$의 근의 개수는 0 또는 1이다. $h(x)$는 연속함수이고, $h(3)=-\dfrac{1}{2}<0$이고 $h(4)=3>0$이므로, 사잇값 정리에 의해 주어진 방정식은 열린구간 $(3,4)$에서 오직 1개의 근을 갖는다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 2-1.M3
    - id: 21b-5
      content: |
        (i), (ii)에 의해 $a$의 정수 부분은 0이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 2-1.A1
