stem: |
  자연수 $n$에 대하여 다음을 모두 만족시키는 두 자연수 $k$, $m$의 순서쌍 $(k,m)$의 개수를 $a_n$이라 하자. 이때, $\displaystyle\sum_{n=1}^{p}a_n\le2022$를 만족시키는 자연수 $p$의 최댓값을 구하여라.

  (1) $k^2m^3=2^{9n}$
  (2) $m\le8^n\le m^2$
