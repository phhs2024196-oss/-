  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: |
        조건 (1)에 의해서 자연수 $k$, $m$은 적당한 음이 아닌 두 정수 $s$, $t$에 대하여 $k=2^s$, $m=2^t$이다. 조건 (1)로부터 $2s=9n-3t$이므로, $0\le s\le\dfrac{9n}{2}$이고 $\dfrac{s}{3}$는 음이 아닌 정수이다. $\cdots\cdots$ ①
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 3-1.M1
    - id: 31b-2
      content: |
        조건 (2)에서 $m^3\le2^{9n}\le m^6$이고, 이 부등식에 $m^3=\dfrac{2^{9n}}{k^2}$와 $k=2^s$를 대입하여 정리하면 $0\le s\le\dfrac{9n}{4}$이다. $\cdots\cdots$ ②
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 3-1.M2
    - id: 31b-3
      content: |
        ①과 ②로부터 $a_n$은 닫힌구간 $\left[0,\dfrac{3n}{4}\right]$에 속하는 정수의 개수이다. 자연수 $q$에 대해서 (i) $n=4q-3$일 때 $a_n=3q-2$, (ii) $n=4q-2$일 때 $a_n=3q-1$, (iii) $n=4q-1$일 때 $a_n=3q$, (iv) $n=4q$일 때 $a_n=3q+1$이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 3-1.A1
    - id: 31b-4
      content: |
        따라서 자연수 $N$에 대하여
        $$\sum_{n=1}^{4N}a_n=\sum_{q=1}^{N}(a_{4q-3}+a_{4q-2}+a_{4q-1}+a_{4q})=\sum_{q=1}^{N}(12q-2)=6N^2+4N$$
        이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 3-1.M3
    - id: 31b-5
      content: |
        $N=18$일 때 $\displaystyle\sum_{n=1}^{72}a_n=6\times18^2+4\times18=2016$이고, $\displaystyle\sum_{n=1}^{73}a_n=\sum_{n=1}^{72}a_n+a_{73}=2071$이므로 $p=72$이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 3-1.A2
