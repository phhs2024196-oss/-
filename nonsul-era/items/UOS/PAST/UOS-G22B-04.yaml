    - id: 4-2.M3
      mark_type: M
      points: 20
      evidence: $-2<x<0$ 에서 $x=1-\sqrt{7}$ 이 극대(최대)임을 증감으로 보였다.
      depends_on:
      - 4-2.M2
      steps:
      - 42b-3
    - id: 4-2.A1
      mark_type: A
      points: 15
      evidence: $\overline{\mathrm{AB}}=a=-t^3+6t^2$ 에 $t=1-\sqrt{7}$ 을 대입해 $26-2\sqrt{7}$ 을 구했다.
      depends_on:
      - 4-2.M3
      steps:
      - 42b-4
