- id: 4-2
  stem: |
    (b) 좌표평면에서 직사각형 ABCD의 두 꼭짓점 A, D는 곡선 $y=-x^3+6x^2$에 있는 제1사분면의 점이고, 두 꼭짓점 B, C는 $x$축에 있다. 직사각형 ABCD의 넓이가 최대일 때, 변 AB의 길이를 구하여라. (90점)
  points: 90
  depends_on:
  - 4-1
  answer:
    kind: value
    value: 26-2*sqrt(7)
    equivalents: []
    tolerance: null
  solutions:
  - id: S42-B
    audience: B
    method_no: 1
    steps:
    - id: 42b-1
      content: |
        $\mathrm{B}(x_1,0)$, $\mathrm{C}(x_2,0)$, $\overline{\mathrm{AB}}=a$라 하자. $x_1$, $x_2$는 방정식 $-x^3+6x^2=a$의 해이다. 방정식 $-x^3+6x^2=a$의 $x_1$, $x_2$가 아닌 다른 해를 $t$라 하자. $-2<t<0$이고 (a)에 의해
        $$x_1=\dfrac{6-t-\sqrt{-3t^2+12t+36}}{2},\qquad x_2=\dfrac{6-t+\sqrt{-3t^2+12t+36}}{2}$$
        이므로 직사각형 ABCD의 넓이는 $a(x_2-x_1)=(-t^3+6t^2)\sqrt{-3t^2+12t+36}$이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 4-2.M1
    - id: 42b-2
      content: |
        $f(x)=(-x^3+6x^2)\sqrt{-3x^2+12x+36}$, $g(x)=\ln\lvert f(x)\rvert=2\ln\lvert x\rvert+\ln\lvert x-6\rvert+\dfrac{1}{2}\ln\lvert3x^2-12x-36\rvert$라 하자.
        $$g^{\prime}(x)=\dfrac{f^{\prime}(x)}{f(x)}=\dfrac{2}{x}+\dfrac{1}{x-6}+\dfrac{6x-12}{2(3x^2-12x-36)}=\dfrac{4(x^2-2x-6)}{x(x-6)(x+2)}$$
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 4-2.M2
    - id: 42b-3
      content: |
        이고 방정식 $x^2-2x-6=0$의 근 중에서 $-2<x<0$인 것은 $x=1-\sqrt{7}$이다. 증감표: $-2<x<1-\sqrt{7}$에서 $f^{\prime}(x)>0$(증가), $x=1-\sqrt{7}$에서 $f^{\prime}(x)=0$(극대), $1-\sqrt{7}<x<0$에서 $f^{\prime}(x)<0$(감소)이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 4-2.M3
    - id: 42b-4
      content: |
        따라서 $t=1-\sqrt{7}$에서 직사각형 ABCD는 최대 넓이를 갖고, 이때 변 AB의 길이는 $-(1-\sqrt{7})^3+6(1-\sqrt{7})^2=26-2\sqrt{7}$이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 4-2.A1
