subparts:
- id: 4-1
  stem: |
    (a) 상수 $a$에 대하여 방정식 $x^3-6x^2+a=0$의 한 근이 $t$일 때, 나머지 두 근을 $t$에 대한 식으로 나타내어라. (25점)
  points: 25
  depends_on: []
  answer:
    kind: expression
    value: r1=(6-t-sqrt(-3*t**2+12*t+36))/2; r2=(6-t+sqrt(-3*t**2+12*t+36))/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S41-B
    audience: B
    method_no: 1
    steps:
    - id: 41b-1
      content: |
        $t$가 방정식 $x^3-6x^2+a=0$의 근이므로 $t^3-6t^2+a=0$, $a=6t^2-t^3$이다. 따라서
        $$x^3-6x^2+a=x^3-6x^2+6t^2-t^3=(x-t)\left\{x^2-(6-t)x+t^2-6t\right\}=0$$
        이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 4-1.M1
    - id: 41b-2
      content: |
        그러므로 나머지 두 근은 $\dfrac{6-t\pm\sqrt{(6-t)^2-4(t^2-6t)}}{2}=\dfrac{6-t\pm\sqrt{-3t^2+12t+36}}{2}$이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 4-1.A1
  # 채점기준 미공개 — 단계별 추정
