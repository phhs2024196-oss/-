- id: 1-2
  stem: |
    (b) 시립이가 주사위를 4번 던져서 게임이 끝났을 때 주머니에 있는 공의 개수가 6일 확률 $\dfrac{s}{r}$를 구하여라. (단, $r$과 $s$는 서로소인 자연수이다.) (40점)
  points: 40
  depends_on:
  - 1-1
  answer:
    kind: value
    value: 2/11
    equivalents: []
    tolerance: null
  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        게임이 끝났을 때 주머니에 있는 공의 개수가 6인 사건을 $A$라 하고 주사위를 4번 던져서 게임이 끝나는 사건을 $B$라 하자. 구하는 확률은 조건부확률 $\mathrm{P}(A\mid B)=\dfrac{\mathrm{P}(A\cap B)}{\mathrm{P}(B)}$이다.
      source_flow: 해설지 p.1 예시답안
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: |
        (a)와 마찬가지로 $3\le n\le5$에 대하여 주사위를 3번 던져서 주머니에 있는 공의 개수가 $n$이 되는 경우의 수는 ${}_3\mathrm{H}_{n-3}$이다. 따라서 주사위를 3번 던져서 주머니에 있는 공의 개수가 $n$이 될 확률은 $\dfrac{{}_3\mathrm{H}_{n-3}}{6^3}=\dfrac{{}_{n-1}\mathrm{C}_{2}}{6^3}$이다. 주사위를 3번 던져서 주머니에 있는 공의 개수가 $n\ (3\le n\le5)$일 때, 다음 주사위를 던져 나오는 눈의 수가 $6-n$ 이상이면 게임이 끝나고 주사위를 던진 횟수가 4가 된다.
      source_flow: 해설지 p.1 예시답안
      criteria:
      - 1-2.M2
    - id: 12b-3
      content: |
        따라서 사건 $B$가 일어날 확률은
        $$\mathrm{P}(B)=\dfrac{{}_2\mathrm{C}_2}{6^3}\times\dfrac46+\dfrac{{}_3\mathrm{C}_2}{6^3}\times\dfrac56+\dfrac{{}_4\mathrm{C}_2}{6^3}\times\dfrac66=\dfrac{55}{6^4}$$
        이다.
      source_flow: 해설지 p.1 예시답안
      criteria:
      - 1-2.A1
    - id: 12b-4
      content: |
        $\mathrm{P}(A\cap B)$는 주사위를 4번 던져서 주머니에 있는 공의 개수가 6일 확률이므로 $\mathrm{P}(A\cap B)=\dfrac{{}_4\mathrm{H}_2}{6^4}=\dfrac{10}{6^4}$이다.
      source_flow: 해설지 p.1 예시답안
      criteria:
      - 1-2.A2
    - id: 12b-5
      content: |
        따라서 $\mathrm{P}(A\mid B)=\dfrac{\mathrm{P}(A\cap B)}{\mathrm{P}(B)}=\dfrac{2}{11}$이다.
      source_flow: 해설지 p.1 예시답안
      criteria:
      - 1-2.A3
  # 채점기준 미공개 — 단계별 추정
