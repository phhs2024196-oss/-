stimuli: []
stem: |
  시립이는 아래와 같은 규칙으로 주사위를 반복해 던져서 나오는 눈의 수만큼 주머니에 공을 넣는 게임을 한다. 게임을 시작할 때 주머니에 있는 공의 개수는 0이다.
  (1) 주머니에 있는 공의 개수가 5 이하이면 시립이는 주사위를 새로 던져서 나오는 눈의 수만큼 공을 넣는다.
  (2) 주머니에 있는 공의 개수가 6 이상이면 시립이는 주사위를 던지는 것을 멈추고 게임을 끝낸다.
subparts:
- id: 1-1
  stem: |
    (a) 게임이 끝났을 때 주머니에 있는 공의 개수가 6일 확률 $\dfrac{q}{p}$를 구하여라. (단, $p$와 $q$는 서로소인 자연수이다.) (45점)
  points: 45
  depends_on: []
  answer:
    kind: value
    value: 16807/46656
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        $1\le k\le6$에 대하여 주사위를 $k$번 던져서 주머니에 있는 공의 개수가 6이 되는 경우의 수는 방정식 $a_1+a_2+\cdots+a_k=6$에서 $a_1,\ a_2,\ \cdots,\ a_k$가 모두 6 이하의 자연수인 해의 개수와 같다. 이는 방정식 $z_1+z_2+\cdots+z_k=6-k$에서 $z_1,\ z_2,\ \cdots,\ z_k$가 모두 음이 아닌 정수인 해의 개수와 같으므로 ${}_k\mathrm{H}_{6-k}$이다.
      source_flow: 해설지 p.1 예시답안
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        따라서 주사위를 $k$번 던져서 주머니에 있는 공의 개수가 6일 확률은 $\dfrac{{}_k\mathrm{H}_{6-k}}{6^k}=\dfrac{{}_5\mathrm{C}_{6-k}}{6^k}=\dfrac{{}_5\mathrm{C}_{k-1}}{6^k}$이다.
      source_flow: 해설지 p.1 예시답안
      criteria:
      - 1-1.A1
    - id: 11b-3
      content: |
        그러므로 게임이 끝났을 때 주머니에 있는 공의 개수가 6일 확률은
        $$\sum_{k=1}^{6}\dfrac{{}_5\mathrm{C}_{k-1}}{6^k}=\dfrac16\sum_{k=0}^{5}\dfrac{{}_5\mathrm{C}_{k}}{6^k}=\dfrac16\left(1+\dfrac16\right)^5=\dfrac{7^5}{6^6}$$
        이다.
      source_flow: 해설지 p.1 예시답안
      criteria:
      - 1-1.M2
      - 1-1.A2
  # 채점기준 미공개 — 단계별 추정
