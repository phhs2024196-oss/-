stimuli: []
stem: |
  함수 $f(x)=-x^3-x+3$의 역함수 $g(x)$에 대하여 연속함수 $h(x)$가 다음 조건을 모두 만족시킨다.
  (1) $h(x)=\begin{cases}3x & (0\le x<1)\\ 4g'(x)+4 & (1\le x<3)\end{cases}$
  (2) 모든 실수 $x$에 대하여 $h(x+3)=h(x)$이다.
  정적분 $\displaystyle\int_0^6xh(x)\,dx$의 값을 구하여라.
subparts:
- id: 2-1
  stem: ''
  points: 95
  depends_on: []
  answer:
    kind: value
    value: 65/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S21-B
    audience: B
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        주어진 정적분을 조건 (2)를 이용해서 정리하면
        $$\int_0^6xh(x)\,dx=\int_0^3xh(x)\,dx+\int_3^6xh(x)\,dx=\int_0^3xh(x)\,dx+\int_0^3(x+3)h(x)\,dx=2\int_0^3xh(x)\,dx+3\int_0^3h(x)\,dx$$
        이다.
      source_flow: 해설지 p.2 예시답안
      criteria:
      - 2-1.M1
    - id: 21b-2
      content: |
        $f(1)=1$이므로 $g(1)=1$이고 $f(0)=3$이므로 $g(3)=0$이다. 함수 $f(x)$와 함수 $g(x)$가 서로 역함수 관계이므로
        $$\int_1^3g(x)\,dx=\int_0^1f(x)\,dx-1=\dfrac54$$
        이고
      source_flow: 해설지 p.2 예시답안
      criteria:
      - 2-1.M2
      - 2-1.A1
    - id: 21b-3
      content: |
        $$\int_1^3xg'(x)\,dx=\left[xg(x)\right]_1^3-\int_1^3g(x)\,dx=-\dfrac94$$
        이다.
      source_flow: 해설지 p.2 예시답안
      criteria:
      - 2-1.M3
      - 2-1.A2
    - id: 21b-4
      content: |
        따라서
        $$\int_0^3xh(x)\,dx=\int_0^13x^2\,dx+\int_1^3x\{4g'(x)+4\}\,dx=8$$
        이고
      source_flow: 해설지 p.2 예시답안
      criteria:
      - 2-1.A3
    - id: 21b-5
      content: |
        $$\int_0^3h(x)\,dx=\int_0^13x\,dx+\int_1^3\{4g'(x)+4\}\,dx=\dfrac32+4\{g(3)-g(1)\}+8=\dfrac{11}{2}$$
        이다.
      source_flow: 해설지 p.2 예시답안
      criteria:
      - 2-1.A4
    - id: 21b-6
      content: |
        구하는 정적분의 값은
        $$\int_0^6xh(x)\,dx=2\cdot8+3\cdot\dfrac{11}{2}=\dfrac{65}{2}$$
        이다.
      source_flow: 해설지 p.2 예시답안
      criteria:
      - 2-1.A5
