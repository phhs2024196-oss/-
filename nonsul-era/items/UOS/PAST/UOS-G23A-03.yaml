  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: |
        조건에서 주어진 식을 정리하면 $(a+4b)c^2=3\cdot2^{100}$ ……①이다. 따라서 $c=2^r\ (r=0,\ 1,\ \cdots,\ 49)$이다. $r=0,\ 1,\ \cdots,\ 49$에 대해 $a=4\cdot(3\cdot2^{98-2r}-b)$이므로 ①을 만족시키는 순서쌍의 개수는 $3\cdot2^{98-2r}-1$이다.
      source_flow: 해설지 p.3 예시답안
      criteria:
      - 3-1.M1
    - id: 31b-2
      content: |
        따라서 ①을 만족시키는 자연수의 모든 순서쌍의 개수는 $\displaystyle\sum_{r=0}^{49}(3\cdot2^{98-2r}-1)=2^{100}-51$이다. $a,\ b,\ c$는 서로 다른 자연수이므로 아래 (i), (ii), (iii), (iv)를 생각해야 한다.
      source_flow: 해설지 p.3 예시답안
      criteria:
      - 3-1.A1
    - id: 31b-3
      content: |
        (i) $a=b$인 경우: $a+4b=5a$이므로 ①의 좌변은 5의 배수이지만 우변은 5의 배수가 아니다. 따라서 ①을 만족시키는 자연수의 순서쌍은 없다.
        (iv) $a=b=c$인 경우: (i)에 의해서 ①을 만족시키는 자연수의 순서쌍은 없다.
      source_flow: 해설지 p.3 예시답안
      criteria:
      - 3-1.M2
      - 3-1.A2
    - id: 31b-4
      content: |
        (ii) $a=c$인 경우: $(a+4b)a^2=3\cdot2^{100}$이므로 $a^3<3\cdot2^{100}$이고 $a=2^r\ (r=0,\ 1,\ \cdots,\ 33)$이다. 이때 $b=3\cdot2^{98-2r}-2^{r-2}$이고 $b$는 자연수이므로 $r=2,\ 3,\ \cdots,\ 33$이다. 따라서 구하는 순서쌍의 개수는 32이다.
      source_flow: 해설지 p.3 예시답안
      criteria:
      - 3-1.M2
      - 3-1.A3
    - id: 31b-5
      content: |
        (iii) $b=c$인 경우: $(a+4b)b^2=3\cdot2^{100}$이므로 $4b^3<3\cdot2^{100}$이고 $b=2^r\ (r=0,\ 1,\ \cdots,\ 33)$이다. 이때 $a=3\cdot2^{100-2r}-2^{r+2}$이고 $a$는 자연수이므로 $r=0,\ 1,\ 2,\ \cdots,\ 33$이다. 따라서 구하는 순서쌍의 개수는 34이다.
      source_flow: 해설지 p.3 예시답안
      criteria:
      - 3-1.M2
      - 3-1.A4
    - id: 31b-6
      content: |
        따라서 구하는 순서쌍 $(a,b,c)$의 개수는 $2^{100}-51-32-34=2^{100}-117$이다.
      source_flow: 해설지 p.3 예시답안
      criteria:
      - 3-1.A5
