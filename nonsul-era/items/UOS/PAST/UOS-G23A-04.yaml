- id: 4-2
  stem: |
    (b) $\angle\mathrm{FPF'}=\dfrac{\pi}{3}$일 때, $\dfrac{\overline{\mathrm{PF}}}{\overline{\mathrm{PF'}}}$의 값을 구하여라. (40점)
  points: 40
  depends_on:
  - 4-1
  answer:
    kind: value
    value: 3-2*sqrt(2)
    equivalents: []
    tolerance: null
  solutions:
  - id: S42-B
    audience: B
    method_no: 1
    steps:
    - id: 42b-1
      content: |
        $\overline{\mathrm{FF'}}=10$이므로 코사인법칙에 의하여 $100=\overline{\mathrm{PF}}^2+\overline{\mathrm{PF'}}^2-2\overline{\mathrm{PF}}\times\overline{\mathrm{PF'}}\times\cos\dfrac{\pi}{3}=\overline{\mathrm{PF}}^2+\overline{\mathrm{PF'}}^2-20=(a-c)^2+(a+c)^2-20$이다. 위 식을 정리하면 $a^2+c^2=60$이다.
      source_flow: 해설지 p.4 예시답안
      criteria:
      - 4-2.M1
      - 4-2.A1
    - id: 42b-2
      content: |
        $a^2=c^2+20$이므로 $a^2=40,\ c^2=20$이다. 따라서 $\dfrac{\overline{\mathrm{PF}}}{\overline{\mathrm{PF'}}}=\dfrac{a-c}{a+c}=\dfrac{2\sqrt{10}-2\sqrt5}{2\sqrt{10}+2\sqrt5}=3-2\sqrt2$이다.
      source_flow: 해설지 p.4 예시답안
      criteria:
      - 4-2.A2
