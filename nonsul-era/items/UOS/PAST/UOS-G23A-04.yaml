stimuli: []
stem: |
  좌표평면 위의 두 점 F$(5,0)$, F'$(-5,0)$을 초점으로 하는 타원 $C_1$과 두 점 F, F'을 초점으로 하는 쌍곡선 $C_2$가 있다. 두 곡선 $C_1,\ C_2$의 제1사분면 위의 교점 P에 대하여 $\overline{\mathrm{PF}}\times\overline{\mathrm{PF'}}=20$일 때, 다음에 답하여라.
subparts:
- id: 4-1
  stem: |
    (a) $\dfrac{\overline{\mathrm{PF}}}{\overline{\mathrm{PF'}}}$의 값의 범위를 구하여라. (75점)
  points: 75
  depends_on: []
  answer:
    kind: set
    value: lo=(7-3*sqrt(5))/2; hi=(3-sqrt(5))/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S41-B
    audience: B
    method_no: 1
    steps:
    - id: 41b-1
      content: |
        두 점 F, F'을 초점으로 하는 타원 $C_1$의 방정식을 $\dfrac{x^2}{a^2}+\dfrac{y^2}{b^2}=1$ (단, $a>5,\ b^2=a^2-25$), 쌍곡선 $C_2$의 방정식을 $\dfrac{x^2}{c^2}-\dfrac{y^2}{d^2}=1$ (단, $5>c>0,\ d^2=25-c^2$)이라 하자. 타원과 쌍곡선의 정의로부터 $\overline{\mathrm{PF'}}+\overline{\mathrm{PF}}=2a$이고 $\overline{\mathrm{PF'}}-\overline{\mathrm{PF}}=2c$이므로 $\overline{\mathrm{PF}}=a-c$이고 $\overline{\mathrm{PF'}}=a+c$이다. $\overline{\mathrm{PF}}\times\overline{\mathrm{PF'}}=20$이므로 $a^2=c^2+20$이다. 또한, 타원 $C_1$에서 $a>5$이고 쌍곡선 $C_2$에서 $0<c<5$이므로 $\sqrt5<c<5$이다.
      source_flow: 해설지 p.4 예시답안
      criteria:
      - 4-1.M1
      - 4-1.A1
    - id: 41b-2
      content: |
        $a^2=c^2+20$이므로
        $$\dfrac{\overline{\mathrm{PF}}}{\overline{\mathrm{PF'}}}=\dfrac{\overline{\mathrm{PF}}^2}{\overline{\mathrm{PF}}\times\overline{\mathrm{PF'}}}=\dfrac{(a-c)^2}{20}=\dfrac{(\sqrt{c^2+20}-c)^2}{20}$$
        이다.
      source_flow: 해설지 p.4 예시답안
      criteria:
      - 4-1.M2
    - id: 41b-3
      content: |
        $f(t)=\sqrt{t^2+20}-t$라 하면 $f(t)>0$이고 $f'(t)=\dfrac{t}{\sqrt{t^2+20}}-1<0$이다. 따라서 $\dfrac{\{f(t)\}^2}{20}$은 감소함수이다.
      source_flow: 해설지 p.4 예시답안
      criteria:
      - 4-1.M3
    - id: 41b-4
      content: |
        $\sqrt5<c<5$일 때 $\dfrac{\{f(5)\}^2}{20}<\dfrac{\overline{\mathrm{PF}}}{\overline{\mathrm{PF'}}}<\dfrac{\{f(\sqrt5)\}^2}{20}$이므로 $\dfrac{\overline{\mathrm{PF}}}{\overline{\mathrm{PF'}}}$의 범위는
        $$\dfrac{7-3\sqrt5}{2}<\dfrac{\overline{\mathrm{PF}}}{\overline{\mathrm{PF'}}}<\dfrac{3-\sqrt5}{2}$$
        이다.
      source_flow: 해설지 p.4 예시답안
      criteria:
      - 4-1.A2
