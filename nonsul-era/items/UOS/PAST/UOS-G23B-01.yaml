stem: |
  함수 $f(x)=x^3+ax^2+bx+1$일 때, 모든 실수 $x$에 대하여 $f^{\prime}(x)\neq0$이면서 다음을 만족시키는 곡선 $y=f(x)$ 위의 점 P의 개수가 2가 되도록 하는 실수 $a$, $b$의 조건을 구하여라.

  곡선 $y=f(x)$ 위의 점 $\mathrm{P}(p,q)$에서의 접선을 $l_1$이라 하고, 점 P를 지나고 직선 $l_1$에 수직인 직선을 $l_2$라 하자. 직선 $l_2$와 $y$축의 교점을 Q라 할 때, $\overline{\mathrm{PQ}}=2\lvert p\rvert>0$이다.
subparts:
- id: 1-1
  stem: ''
  points: 85
  depends_on: []
  answer:
    kind: expression
    value: -sqrt(3) < a**2-3*b, a**2-3*b < 0, b != 1/sqrt(3)
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        $f^{\prime}(x)=3x^2+2ax+b$가 모든 실수 $x$에서 $0$이 아니고 최고차항 계수가 양수이므로 모든 $x$에 대하여 $f^{\prime}(x)>0$이다. 따라서 판별식 $a^2-3b<0$이다.
      source_flow: 해설지 p.1 예시 답안
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        점 P에서의 접선의 기울기를 $m=f^{\prime}(p)=3p^2+2ap+b\,(>0)$이라 하면 $l_2:\ y=-\dfrac{1}{3p^2+2ap+b}(x-p)+q$이고, $l_2$와 $y$축의 교점은 $\mathrm{Q}\left(0,\ \dfrac{p}{3p^2+2ap+b}+q\right)$이다.
      source_flow: 해설지 p.1 예시 답안
      criteria:
      - 1-1.M2
    - id: 11b-3
      content: |
        $\overline{\mathrm{PQ}}=2\lvert p\rvert$이므로 $\sqrt{p^2+\dfrac{p^2}{(3p^2+2ap+b)^2}}=2\lvert p\rvert$이다. $p\neq0$이므로 정리하면 $3p^2+2ap+b=\pm\dfrac{1}{\sqrt{3}}$이고, $f^{\prime}(p)=3p^2+2ap+b>0$이므로 $3p^2+2ap+b=\dfrac{1}{\sqrt{3}}$이다.
      source_flow: 해설지 p.1 예시 답안
      criteria:
      - 1-1.A2
    - id: 11b-4
      content: |
        점 P는 $p$에 의해 하나씩 정해지므로, 점 P가 2개이려면 이차방정식 $3p^2+2ap+b-\dfrac{1}{\sqrt{3}}=0$이 서로 다른 두 실근을 가져야 한다. 판별식 $a^2-3\left(b-\dfrac{1}{\sqrt{3}}\right)>0$, 즉 $a^2-3b>-\sqrt{3}$이다.
      source_flow: 해설지 p.1 예시 답안
      criteria:
      - 1-1.M3
    - id: 11b-5
      content: |
        한편 $b=\dfrac{1}{\sqrt{3}}$이면 이차방정식의 한 근이 $p=0$인데 $\overline{\mathrm{PQ}}>0$에서 $p\neq0$이어야 하므로 조건을 만족시키는 점 P는 하나만 존재한다. 따라서 $b\neq\dfrac{1}{\sqrt{3}}$이다.
      source_flow: 해설지 p.1 예시 답안
      criteria:
      - 1-1.M4
    - id: 11b-6
      content: |
        구하는 조건은 $-\sqrt{3}<a^2-3b<0,\ b\neq\dfrac{1}{\sqrt{3}}$이다.
      source_flow: 해설지 p.1 예시 답안
      criteria:
      - 1-1.A1
