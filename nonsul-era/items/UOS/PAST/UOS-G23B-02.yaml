stem: |
  세 점 P, Q, R은 한 변의 길이가 1인 정삼각형의 세 변 위를 시계 반대 방향으로 움직인다. 세 점 P, Q, R은 시각 $t=0$일 때 한 꼭짓점에서 동시에 출발하며 순서대로 $1,\sqrt{2},2$의 일정한 속력으로 움직인다. 시각 $t=\sqrt{2}$에서 시각 $t=2$까지 세 점 P, Q, R이 움직일 때, 삼각형 PQR의 넓이가 최대가 되는 시각과 최소가 되는 시각을 각각 구하여라.
subparts:
- id: 2-1
  stem: ''
  points: 95
  depends_on: []
  answer:
    kind: expression
    value: max = 2; min = (1+16*sqrt(2))/14
    equivalents: []
    tolerance: null
  solutions:
  - id: S21-B
    audience: B
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        $\sqrt{2}\le t\le2$에서 삼각형 PQR의 넓이를 $S(t)$라 하자. $t=\dfrac{3}{2}$일 때 점 R이 삼각형의 한 꼭짓점에 있으므로 $\sqrt{2}\le t\le\dfrac{3}{2}$와 $\dfrac{3}{2}\le t\le2$로 나누어 $S(t)$를 구한다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 2-1.M1
    - id: 21b-2
      content: |
        (i) $\sqrt{2}\le t\le\dfrac{3}{2}$일 때 세 점 P, Q, R의 위치는 해설지 그림 (i)와 같고 삼각형 PQR의 넓이는
        $$S(t)=\dfrac{1}{2}(2t-\sqrt{2}t)(2-t)\sin\dfrac{\pi}{3}=\dfrac{\sqrt{3}(2-\sqrt{2})}{4}(-t^2+2t)$$
        이다. 따라서 주어진 구간에서 $S(t)$는 감소한다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 2-1.M2
      - 2-1.A2
    - id: 21b-3
      content: |
        (ii) $\dfrac{3}{2}\le t\le2$일 때 세 점의 위치는 해설지 그림 (ii)와 같고 삼각형 PQR의 넓이는
        $$S(t)=\dfrac{1}{2}\sin\dfrac{\pi}{3}-\dfrac{1}{2}(2t-3)(3-\sqrt{2}t)\sin\dfrac{\pi}{3}-\dfrac{1}{2}(4-2t)(t-1)\sin\dfrac{\pi}{3}-\dfrac{1}{2}(\sqrt{2}t-2)(2-t)\sin\dfrac{\pi}{3}=\dfrac{\sqrt{3}}{4}\left\{(2+3\sqrt{2})t^2-(14+5\sqrt{2})t+18\right\}$$
        이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 2-1.M3
    - id: 21b-4
      content: |
        이차함수 $f(t)=\dfrac{\sqrt{3}}{4}\left\{(2+3\sqrt{2})t^2-(14+5\sqrt{2})t+18\right\}$는 $t=t_0=\dfrac{14+5\sqrt{2}}{2(2+3\sqrt{2})}=\dfrac{1+16\sqrt{2}}{14}$일 때 최솟값을 갖는다. $\dfrac{3}{2}<t_0<2$이므로 $S(t)$는 $\dfrac{3}{2}\le t\le t_0$에서 감소하고 $t_0\le t\le2$에서 증가한다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 2-1.A3
    - id: 21b-5
      content: |
        (i)과 (ii)에 의하여 $S(t)$는 $\sqrt{2}\le t\le2$에서 $t=t_0$일 때 최솟값을 갖고 $t=\sqrt{2}$ 또는 $2$일 때 최댓값을 갖는다.
        $$S(2)-S(\sqrt{2})=\dfrac{\sqrt{3}}{2}(\sqrt{2}-1)-\dfrac{\sqrt{3}}{2}(3\sqrt{2}-4)=\dfrac{\sqrt{3}}{2}(3-2\sqrt{2})>0$$
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 2-1.M4
    - id: 21b-6
      content: |
        따라서 $S(t)$가 최대가 되는 시각은 $2$이고 최소가 되는 시각은 $\dfrac{1+16\sqrt{2}}{14}$이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 2-1.A1
