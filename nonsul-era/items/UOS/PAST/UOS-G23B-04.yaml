stimuli: []
stem: |
  모든 자연수 $n$에 대하여 다음 부등식이 성립함을 보여라.
  $$\sum_{k=1}^{n}\left\{\dfrac{1}{k+1}+\dfrac{1}{2(k+1)^2}\right\}\le\ln(n+1)\le\sum_{k=1}^{n}\dfrac{1}{2}\left(\dfrac{1}{k}+\dfrac{1}{k+1}\right)$$
