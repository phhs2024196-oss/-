  solutions:
  - id: S41-B
    audience: B
    method_no: 1
    steps:
    - id: 41b-1
      content: |
        자연수 $k$에 대해 닫힌구간 $[k,k+1]$을 생각한다. $y=f(x)$를 곡선 $y=\dfrac{1}{x}$ 위의 점 $\left(k+1,\dfrac{1}{k+1}\right)$에서의 접선이라 하고, $y=g(x)$를 곡선 $y=\dfrac{1}{x}$ 위의 두 점 $\left(k,\dfrac{1}{k}\right)$와 $\left(k+1,\dfrac{1}{k+1}\right)$을 지나는 직선이라 하자. 그러면
        $$f(x)=-\dfrac{1}{(k+1)^2}\{x-(k+1)\}+\dfrac{1}{k+1},\qquad g(x)=-\dfrac{1}{k(k+1)}(x-k)+\dfrac{1}{k}$$
        이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 4-1.M1
    - id: 41b-2
      content: |
        이때 닫힌구간 $[k,k+1]$에서
        $$\dfrac{1}{x}-f(x)=\dfrac{(x-k-1)^2}{x(k+1)^2}\ge0,\qquad g(x)-\dfrac{1}{x}=-\dfrac{(x-k)(x-k-1)}{xk(k+1)}\ge0$$
        이다. 즉 닫힌구간 $[k,k+1]$에서 $f(x)\le\dfrac{1}{x}\le g(x)$이므로 $\displaystyle\int_k^{k+1}f(x)\,dx\le\int_k^{k+1}\dfrac{1}{x}\,dx\le\int_k^{k+1}g(x)\,dx$이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 4-1.M2
    - id: 41b-3
      content: |
        이때
        $$\int_k^{k+1}f(x)\,dx=\int_k^{k+1}\left[-\dfrac{1}{(k+1)^2}\{x-(k+1)\}+\dfrac{1}{k+1}\right]dx=\dfrac{1}{k+1}+\dfrac{1}{2(k+1)^2}$$
        $$\int_k^{k+1}g(x)\,dx=\int_k^{k+1}\left\{-\dfrac{1}{k(k+1)}(x-k)+\dfrac{1}{k}\right\}dx=\dfrac{1}{2}\left(\dfrac{1}{k}+\dfrac{1}{k+1}\right)$$
        $$\int_k^{k+1}\dfrac{1}{x}\,dx=\ln(k+1)-\ln k$$
        이므로 $\dfrac{1}{k+1}+\dfrac{1}{2(k+1)^2}\le\ln(k+1)-\ln k\le\dfrac{1}{2}\left(\dfrac{1}{k}+\dfrac{1}{k+1}\right)$이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 4-1.M3
      - 4-1.A1
    - id: 41b-4
      content: |
        위의 부등식을 $k=1,2,\cdots,n$에 대하여 변끼리 더하면 가운데 항이 $\sum_{k=1}^{n}\{\ln(k+1)-\ln k\}=\ln(n+1)$이므로
        $$\sum_{k=1}^{n}\left\{\dfrac{1}{k+1}+\dfrac{1}{2(k+1)^2}\right\}\le\ln(n+1)\le\sum_{k=1}^{n}\dfrac{1}{2}\left(\dfrac{1}{k}+\dfrac{1}{k+1}\right)$$
        이 성립한다. ■
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 4-1.R1
