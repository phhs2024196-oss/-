    method_no: 1
    steps:
    - id: 11b-1
      content: |
        $y=x^4-2x^2+1$과 $y=-x^2+x+2$를 연립하면 $x^4-x^2-x-1=(x+1)(x^3-x^2-1)=0$이므로 점 P의 좌표는 $(-1,0)$이다.
      source_flow: 해설지 p.1 예시답안
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        또한 $f(x)=x^3-x^2-1$이라 두면 $f'(x)=3x^2-2x$이다. 함수 $f(x)$는 $x=0$에서 극댓값 $-1$을 가지므로 $f(x)=0$은 단 하나의 실근을 가진다. 그 실근을 $a$라 하면 점 Q의 좌표는 $(a,-a^2+a+2)$이다. $y=x^4-2x^2+1$과 $y=-x^2+x+2$의 그래프로부터 $a$의 범위는 $1<a<2$이다.
      source_flow: 해설지 p.1 예시답안
      criteria:
      - 1-1.M1
      - 1-1.M2
    - id: 11b-3
      content: |
        한편, 주어진 내적은
        $$\overrightarrow{\mathrm{PQ}}\cdot\overrightarrow{\mathrm{PA}}=(\overrightarrow{\mathrm{OQ}}-\overrightarrow{\mathrm{OP}})\cdot(\overrightarrow{\mathrm{OA}}-\overrightarrow{\mathrm{OP}})=(a+1,\ -a^2+a+2)\cdot(1,\ -1)=a^2-1$$
        이다. 따라서 $0<\overrightarrow{\mathrm{PQ}}\cdot\overrightarrow{\mathrm{PA}}<3$이고 구하는 정수 $k$는 0, 1, 2 중 하나이다.
      source_flow: 해설지 p.1 예시답안
      criteria:
      - 1-1.A1
    - id: 11b-4
      content: |
        $f(\sqrt2)=2\sqrt2-3=\sqrt8-\sqrt9<0$이고 $f(\sqrt3)=3\sqrt3-4=\sqrt{27}-\sqrt{16}>0$이므로 사잇값 정리에 의해 $\sqrt2<a<\sqrt3$이다. 따라서 $1\le\overrightarrow{\mathrm{PQ}}\cdot\overrightarrow{\mathrm{PA}}<2$이고 $k=1$이다.
      source_flow: 해설지 p.1 예시답안
      criteria:
      - 1-1.M2
      - 1-1.A2
