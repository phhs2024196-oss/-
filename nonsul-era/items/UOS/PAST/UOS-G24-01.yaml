stem: |
  두 곡선 $y=x^4-2x^2+1$과 $y=-x^2+x+2$가 만나는 두 점 중 $x$좌표가 음수인 점을 P, $x$좌표가 양수인 점을 Q라 하자. 점 A$(0,-1)$에 대하여 $k\le\overrightarrow{\mathrm{PQ}}\cdot\overrightarrow{\mathrm{PA}}<k+1$을 만족시키는 정수 $k$를 구하여라.
