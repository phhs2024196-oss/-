stimuli: []
stem: |
  서울이, 시립이, 대학이는 과일가게에서 사과와 배를 사려고 한다. 세 사람 중 과일을 사지 않은 사람이 있을 수도 있을 때, 다음 경우의 수를 구하여라. (단, 사과와 배는 각각 11개 이상이고, 같은 종류의 과일은 서로 구별하지 않는다.)
subparts:
- id: 2-1
  stem: |
    (a) 서울이, 시립이, 대학이가 모두 합해서 11개의 과일을 사는 경우의 수를 구하여라. (40점)
  points: 40
  depends_on: []
  answer:
    kind: value
    value: '4368'
    equivalents: []
    tolerance: null
  solutions:
  - id: S21-B
    audience: B
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        서울이, 시립이, 대학이가 산 사과의 수를 차례로 $x_1,\ y_1,\ z_1$이라 하자. 또한, 서울이, 시립이, 대학이가 산 배의 수를 차례로 $x_2,\ y_2,\ z_2$라 하자. 구하는 경우의 수는 방정식 $x_1+y_1+z_1+x_2+y_2+z_2=11$의 음이 아닌 정수해의 개수와 같으며 그 값은 ${}_6\mathrm{H}_{11}=4368$이다.
      source_flow: 해설지 p.2 예시답안
      criteria:
      - 2-1.M1
      - 2-1.A1
