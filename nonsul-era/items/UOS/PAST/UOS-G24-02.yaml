- id: 2-2
  stem: |
    (b) 서울이, 시립이, 대학이가 산 과일의 수를 차례로 $x,\ y,\ z$라 하자. 이때 (a)의 경우 중 $x\le y\le z$를 만족시키는 경우의 수를 구하여라. (55점)
  points: 55
  depends_on:
  - 2-1
  answer:
    kind: value
    value: '924'
    equivalents: []
    tolerance: null
  solutions:
  - id: S22-B
    audience: B
    method_no: 1
    steps:
    - id: 22b-1
      content: |
        어떤 사람이 사과와 배 중에서 $m$개의 과일을 사는 경우의 수는 ${}_2\mathrm{H}_m$이다. (a)의 경우 중 서울이, 시립이, 대학이가 산 과일의 수가 차례로 $x,\ y,\ z$인 경우의 수는 ${}_2\mathrm{H}_x\times{}_2\mathrm{H}_y\times{}_2\mathrm{H}_z=(x+1)(y+1)(z+1)$이다. 다음과 같이 $x,\ y,\ z$가 $x\le y\le z$를 만족시키는 경우를 나눈다.
      source_flow: 해설지 p.2 예시답안
      criteria:
      - 2-2.M1
      - 2-2.A1
    - id: 22b-2
      content: |
        (i) $x=y=z$인 경우는 없다.
      source_flow: 해설지 p.2 예시답안
      criteria:
      - 2-2.M1
      - 2-2.A1
    - id: 22b-3
      content: |
        (ii) $x=y<z$일 때, $(x,y,z)$의 경우를 모두 찾으면 $(0,0,11),\ (1,1,9),\ (2,2,7),\ (3,3,5)$이다. (a)의 경우 중 $(x,y,z)$가 이들을 만족시키는 경우의 수는 차례로 12, 40, 72, 96이다.
      source_flow: 해설지 p.2 예시답안
      criteria:
      - 2-2.M1
      - 2-2.A1
    - id: 22b-4
      content: |
        (iii) $x<y=z$일 때, $(x,y,z)$의 경우를 모두 찾으면 $(1,5,5),\ (3,4,4)$이다. (a)의 경우 중 $(x,y,z)$가 $(1,5,5),\ (3,4,4)$를 만족시키는 경우의 수는 차례로 72, 100이다.
      source_flow: 해설지 p.2 예시답안
      criteria:
      - 2-2.M1
      - 2-2.A1
    - id: 22b-5
      content: |
        (iv) $x<y<z$일 때, (a)의 경우 중 이 조건을 만족시키는 경우의 수는 $x,\ y,\ z$가 서로 다른 경우를 모두 찾아 $3!=6$으로 나눈 값과 같다. $x,\ y,\ z$ 중 세 개가 같은 경우의 수는 (i)에 의해 0이고, 두 개가 같은 경우의 수는 (ii), (iii)에 의해 392이므로, (a)의 경우 중에서 $x,\ y,\ z$가 모두 다른 경우의 수는 $4368-0\times1-392\times3=3192$이다. 따라서, (a)의 경우 중 $x<y<z$를 만족시키는 경우의 수는 532이다.
      source_flow: 해설지 p.2 예시답안
      criteria:
      - 2-2.M1
      - 2-2.A1
    - id: 22b-6
      content: |
        (i), (ii), (iii), (iv)로부터 구하는 경우의 수는 $0+220+172+532=924$이다.
      source_flow: 해설지 p.2 예시답안
      criteria:
      - 2-2.A1
