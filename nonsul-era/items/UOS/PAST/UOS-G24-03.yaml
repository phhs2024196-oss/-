  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: |
        주어진 조건으로부터 $x\ge2n$일 때, $\dfrac{-(x-2)}{x}\le\dfrac{ax+b}{x}\le\dfrac{(x-2n)+5}{x}$이다. 함수의 극한의 대소관계에 따라
        $$-1=\lim_{x\to\infty}\left(\dfrac{-(x-2)}{x}\right)\le a=\lim_{x\to\infty}\left(\dfrac{ax+b}{x}\right)\le\lim_{x\to\infty}\left(\dfrac{(x-2n)+5}{x}\right)=1$$
        이므로 $-1\le a\le1$이다. 즉 가능한 정수 $a$는 $-1,\ 0,\ 1$뿐이다.
      source_flow: 해설지 p.3 예시답안
      criteria:
      - 3-1.M1
    - id: 31b-2
      content: |
        (i) $a=0$인 경우: 함수 $y=-|x-2|$의 최댓값은 0이고, 함수 $y=|x-2n|+5$의 최솟값은 5이므로 $0\le b\le5$이다. 모든 실수 $x$에 대하여 $-|x-2|\le b\le|x-2n|+5$가 성립하는 정수 $b$의 개수는 6이다.
      source_flow: 해설지 p.3 예시답안
      criteria:
      - 3-1.A1
    - id: 31b-3
      content: |
        (ii) $a=-1$인 경우: 모든 실수 $x$에 대하여 $x-|x-2|\le b\le x+|x-2n|+5$를 만족시키는 정수 $b$를 찾자. $x\ge2$이면 $x-|x-2|=2$이고, $x<2$이면 $x-|x-2|=2x-2$이므로 함수 $y=x-|x-2|$의 최댓값은 2이다. 마찬가지로 $x\ge2n$인 경우와 $x<2n$인 경우로 나누어서 생각하면 함수 $y=x+|x-2n|+5$의 최솟값은 $2n+5$이다. 따라서 $2\le b\le2n+5$이고 모든 실수 $x$에 대하여 $x-|x-2|\le b\le x+|x-2n|+5$를 만족시키는 정수 $b$의 개수는 $2n+4$이다.
      source_flow: 해설지 p.3 예시답안
      criteria:
      - 3-1.A2
    - id: 31b-4
      content: |
        (iii) $a=1$인 경우: 마찬가지로 함수 $y=-x-|x-2|$의 최댓값은 $-2$이고, 함수 $y=-x+|x-2n|+5$의 최솟값은 $5-2n$이다. 모든 실수 $x$에 대하여 $-x-|x-2|\le b\le-x+|x-2n|+5$를 만족시키는 정수 $b$의 개수를 $n$의 값에 따라 구해보면 $n=1,\ 2,\ 3$일 때 각각 $6,\ 4,\ 2$이고 $n\ge4$일 때 $0$이다.
      source_flow: 해설지 p.3 예시답안
      criteria:
      - 3-1.A3
    - id: 31b-5
      content: |
        그러므로
        $$\sum_{n=1}^{100}A_n=\sum_{n=1}^{100}6+\sum_{n=1}^{100}(2n+4)+(6+4+2)=11112$$
        이다.
      source_flow: 해설지 p.3 예시답안
      criteria:
      - 3-1.A1
      - 3-1.A2
      - 3-1.A4
