stem: |
  자연수 $n$에 대하여 다음 조건을 만족시키는 두 정수의 순서쌍 $(a,b)$의 개수를 $A_n$이라 하자.
  모든 실수 $x$에 대하여 $-|x-2|\le ax+b\le|x-2n|+5$이다.
  이때 $\displaystyle\sum_{n=1}^{100}A_n$의 값을 구하여라.
