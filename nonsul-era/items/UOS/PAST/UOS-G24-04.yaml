stimuli: []
stem: |
  2 이상의 자연수 $n$에 대하여 점 $\mathrm{A}_k$의 좌표를 $\left(\cos\left(\dfrac{k-1}{n}\pi\right),\ \sin\left(\dfrac{k-1}{n}\pi\right)\right)$라 하자. (단, $k=1,\ 2,\ \cdots,\ 2n$)
  점 $\mathrm{A}_1,\ \mathrm{A}_2,\ \cdots,\ \mathrm{A}_{2n}$을 꼭짓점으로 하는 정$2n$각형의 변 위를 두 점 P, Q가 시계 반대 방향으로 움직인다.
  두 점 P, Q가 다음 조건을 모두 만족시킬 때, 다음 물음에 답하여라.
  (1) 두 점 P, Q는 시각 $t=0$일 때 점 $\mathrm{A}_1(1,0)$을 출발하여 정$2n$각형을 한 바퀴 돌아 점 $\mathrm{A}_1$에 동시에 도착한다.
  (2) 점 P는 변 $\mathrm{A}_k\mathrm{A}_{k+1}$ 위를 속력 $\sqrt{2-\dfrac{k}{2n}}$로 움직이고, 변 $\mathrm{A}_{2n}\mathrm{A}_1$ 위를 속력 1로 움직인다. (단, $k=1,\ 2,\ \cdots,\ 2n-1$)
  (3) 점 Q의 속력은 일정하다.
subparts:
- id: 4-1
  stem: |
    (a) 점 P가 출발한 후 점 $\mathrm{A}_1$에 처음으로 도착하는 시각을 $b_n$이라 할 때, $\displaystyle\lim_{n\to\infty}b_n$의 값을 구하여라. (50점)
  points: 50
  depends_on: []
  answer:
    kind: value
    value: 4*(sqrt(2)-1)*pi
    equivalents: []
    tolerance: null
  solutions:
  - id: S41-B
    audience: B
    method_no: 1
    steps:
    - id: 41b-1
      content: |
        정$2n$각형의 한 변의 길이를 $l_n$이라 하자. 점 P가 $k$번째 변 위를 움직이는 데 걸리는 시간은 $\dfrac{l_n}{\sqrt{2-\frac{k}{2n}}}$이므로 $b_n=\displaystyle\sum_{k=1}^{2n}\dfrac{l_n}{\sqrt{2-\frac{k}{2n}}}$이다.
      source_flow: 해설지 p.4 예시답안
      criteria:
      - 4-1.M1
    - id: 41b-2
      content: |
        따라서 $\displaystyle\lim_{n\to\infty}b_n=\lim_{n\to\infty}\sum_{k=1}^{2n}\dfrac{l_n}{\sqrt{2-\frac{k}{2n}}}=\lim_{n\to\infty}\left(2nl_n\sum_{k=1}^{2n}\dfrac{1}{\sqrt{2-\frac{k}{2n}}}\dfrac{1}{2n}\right)$이다. 한편, $l_n=2\sin\left(\dfrac{\pi}{2n}\right)$이므로 $\displaystyle\lim_{n\to\infty}2nl_n=\lim_{n\to\infty}2\pi\dfrac{\sin\left(\frac{\pi}{2n}\right)}{\frac{\pi}{2n}}=2\pi$이다. 또한 정적분과 급수의 합 사이의 관계로부터 $\displaystyle\lim_{n\to\infty}\sum_{k=1}^{2n}\dfrac{1}{\sqrt{2-\frac{k}{2n}}}\dfrac{1}{2n}=\int_0^1\dfrac{1}{\sqrt{2-x}}\,dx=2(\sqrt2-1)$이다. 따라서 $\displaystyle\lim_{n\to\infty}b_n=4(\sqrt2-1)\pi$이다.
      source_flow: 해설지 p.4 예시답안
      criteria:
      - 4-1.A1
