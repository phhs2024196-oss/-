- id: 4-2
  stem: |
    (b) 점 P가 출발한 후 점 $\mathrm{A}_{n+1}(-1,0)$에 처음으로 도착하는 시각을 $c_n$이라 하자. 시각 $t=0$에서 $t=c_n$까지 점 P와 점 Q가 움직인 거리의 차를 $d_n$이라 할 때, $\displaystyle\lim_{n\to\infty}d_n$의 값을 구하여라. (65점)
  points: 65
  depends_on:
  - 4-1
  answer:
    kind: value
    value: (sqrt(6)+2*sqrt(3)-2*sqrt(2)-3)*pi
    equivalents: []
    tolerance: null
  solutions:
  - id: S42-B
    audience: B
    method_no: 1
    steps:
    - id: 42b-1
      content: |
        시각 $t=c_n$까지 점 P가 움직인 거리는 $nl_n$이다. 점 Q의 속력은 $\dfrac{2nl_n}{b_n}$이므로, 시각 $t=c_n$까지 점 Q가 움직인 거리는 $\dfrac{2nl_nc_n}{b_n}$이다. 따라서 $d_n=nl_n-\dfrac{2nl_nc_n}{b_n}$이다. 한편 (a)에서 $\displaystyle\lim_{n\to\infty}2nl_n=2\pi$이고, $\displaystyle\lim_{n\to\infty}b_n=4(\sqrt2-1)\pi$이다.
      source_flow: 해설지 p.4 예시답안
      criteria:
      - 4-2.M1
    - id: 42b-2
      content: |
        정적분과 급수의 합 사이의 관계로부터 $\displaystyle\lim_{n\to\infty}c_n=\lim_{n\to\infty}\sum_{k=1}^{n}\dfrac{l_n}{\sqrt{2-\frac{k}{2n}}}=\lim_{n\to\infty}nl_n\sum_{k=1}^{n}\dfrac{1}{\sqrt{2-\frac{k}{2n}}}\dfrac1n=\pi\int_0^1\dfrac{1}{\sqrt{2-\frac{x}{2}}}\,dx=2(2\sqrt2-\sqrt6)\pi$이다.
      source_flow: 해설지 p.4 예시답안
      criteria:
      - 4-2.A1
    - id: 42b-3
      content: |
        따라서
        $$\lim_{n\to\infty}d_n=\pi-\dfrac{4(2\sqrt2-\sqrt6)\pi^2}{4(\sqrt2-1)\pi}=\pi-\dfrac{(2\sqrt2-\sqrt6)\pi}{\sqrt2-1}=\dfrac{\sqrt6-1-\sqrt2}{\sqrt2-1}\pi=(\sqrt6+2\sqrt3-2\sqrt2-3)\pi$$
        이다.
      source_flow: 해설지 p.4 예시답안
      criteria:
      - 4-2.A2
