stem: |
  12보다 큰 자연수 중에서 12와 서로소인 수를 작은 수부터 차례로 나열할 때, $k$번째 값을 $a_k$라 하자.
subparts:
- id: 1-1
  stem: |
    (a) $a_k\ge100$을 만족하는 자연수 $k$의 최솟값을 구하여라. (30점)
  points: 30
  depends_on: []
  answer:
    kind: value
    value: '30'
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        $12=2^2\times3$이므로 12와 서로소인 수는 2의 배수도 아니고 3의 배수도 아니다. 임의의 자연수 $n$이 2 또는 3의 배수가 아니면 어떤 자연수 $m$에 대하여 $n=6m+1$ 또는 $n=6m+5$의 형태로 표현된다.
      source_flow: 해설지 p.1 풀이
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        12보다 큰 자연수만을 고려하므로 $a_1=13,\ a_2=17$이다. 따라서 $a_{2m-1}=6(m+1)+1,\ a_{2m}=6(m+1)+5$이다.
      source_flow: 해설지 p.1 풀이
      criteria:
      - 1-1.A1
    - id: 11b-3
      content: |
        $a_{2m-1}=6m+7\ge100$ 또는 $a_{2m}=6m+11\ge100$을 만족하려면 $m\ge15$이다. $a_{29}=6\times15+7=97,\ a_{30}=6\times15+11=101$이므로 $a_k\ge100$을 만족하는 $k$의 최솟값은 30이다.
      source_flow: 해설지 p.1 풀이
      criteria:
      - 1-1.A2
  # 채점기준 미공개 — 단계별 추정
