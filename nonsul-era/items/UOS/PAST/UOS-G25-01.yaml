- id: 1-2
  stem: |
    (b) 자연수 $n$에 대하여 $\displaystyle\sum_{k=1}^{2n}(a_ka_{k+1}-a_{k+2})$를 구하여라. (55점)
  points: 55
  depends_on:
  - 1-1
  answer:
    kind: value
    value: 2*n*(12*n**2+78*n+161)
    equivalents: []
    tolerance: null
  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        (a)에 의하여 $a_{2m-1}=6m+7,\ a_{2m}=6m+11$이므로
        $$\sum_{k=1}^{2n}(a_ka_{k+1}-a_{k+2})=\sum_{m=1}^{n}\{(a_{2m-1}a_{2m}-a_{2m+1})+(a_{2m}a_{2m+1}-a_{2m+2})\}$$
      source_flow: 해설지 p.1 풀이
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: |
        $$=\sum_{m=1}^{n}\{(6m+7)(6m+11)-(6m+13)+(6m+11)(6m+13)-(6m+17)\}=\sum_{m=1}^{n}(72m^2+240m+190)$$
      source_flow: 해설지 p.1 풀이
      criteria:
      - 1-2.A1
    - id: 12b-3
      content: |
        $$=72\sum_{m=1}^{n}m^2+240\sum_{m=1}^{n}m+190n=72\times\dfrac{n(n+1)(2n+1)}{6}+240\times\dfrac{n(n+1)}{2}+190n$$
      source_flow: 해설지 p.1 풀이
      criteria:
      - 1-2.M2
    - id: 12b-4
      content: |
        $$=2n(12n^2+78n+161)$$
        이다.
      source_flow: 해설지 p.1 풀이
      criteria:
      - 1-2.A2
  # 채점기준 미공개 — 단계별 추정
