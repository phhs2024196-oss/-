stem: |
  밑면이 정사각형인 사각뿔을 밑면과 평행한 평면으로 잘라서 오른쪽 그림과 같은 육면체를 얻었다. [그림 1: 육면체. 위쪽의 작은 정사각형 ABCD와 아래쪽의 큰 정사각형 EFGH를 모서리 AE, BF, CG, DH로 이은 모양이며, 점 H와 그에 이어지는 모서리는 점선] 육면체에서 두 정사각형 ABCD와 EFGH의 한 변의 길이는 각각 $a$와 $a+2$이다. 또한 두 선분 AE와 DH의 길이는 모두 $b$이며, 두 선분 BF와 CG의 길이는 모두 $c$이다. 사각형 AEHD의 평면 BFGC 위로의 정사영의 넓이를 $a,\ b,\ c$에 대한 식으로 나타내어라. (단, $a>0,\ b>1,\ c>1$이고 $b^2+c^2\ge6$이다.)
subparts:
- id: 2-1
  stem: ''
