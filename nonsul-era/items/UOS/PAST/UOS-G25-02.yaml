  solutions:
  - id: S21-B
    audience: B
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        선분 AD의 중점을 P, 선분 EH의 중점을 Q라 할 때, 선분 PQ의 길이를 $p$라 하면 $p^2+\left\{\dfrac{(a+2)-a}{2}\right\}^2=b^2$이므로 $p=\sqrt{b^2-1}$이다.
      source_flow: 해설지 p.2 풀이
      criteria:
      - 2-1.M1
    - id: 21b-2
      content: |
        선분 BC의 중점을 R, 선분 FG의 중점을 S라 할 때, 선분 RS의 길이를 $q$라 하면 $q^2+\left\{\dfrac{(a+2)-a}{2}\right\}^2=c^2$이므로 $q=\sqrt{c^2-1}$이다.
      source_flow: 해설지 p.2 풀이
      criteria:
      - 2-1.M1
    - id: 21b-3
      content: |
        선분 AD를 포함하고 평면 BFGC와 평행한 평면 AF'G'D를 생각하자. 이때 선분 F'G'의 중점을 S'이라 하고 각 QPS'의 크기를 $\theta$라 하자. 각 APQ와 각 APS'은 직각이므로 두 평면 AEHD와 BFGC가 이루는 각의 크기는 $\theta$와 같다.
      source_flow: 해설지 p.2 풀이
      criteria:
      - 2-1.M2
    - id: 21b-4
      content: |
        삼각형 PQS'에서 코사인법칙에 의해 $\{(a+2)-a\}^2=p^2+q^2-2pq\cos\theta$이므로 $\cos\theta=\dfrac{p^2+q^2-4}{2pq}=\dfrac{b^2+c^2-6}{2pq}\ge0$이다. 따라서 $0<\theta\le\dfrac{\pi}{2}$이다.
      source_flow: 해설지 p.2 풀이
      criteria:
      - 2-1.A1
    - id: 21b-5
      content: |
        사각형 AEHD는 사다리꼴이므로 넓이는 $\dfrac12p(a+a+2)=p(a+1)$이다. 따라서 사각형 AEHD의 평면 BFGC 위로의 정사영의 넓이는
        $$(\text{사각형 AEHD의 넓이})\times\cos\theta=p(a+1)\times\dfrac{b^2+c^2-6}{2pq}=\dfrac{(a+1)(b^2+c^2-6)}{2\sqrt{c^2-1}}$$
        이다.
      source_flow: 해설지 p.2 풀이
      criteria:
      - 2-1.M3
      - 2-1.A2
