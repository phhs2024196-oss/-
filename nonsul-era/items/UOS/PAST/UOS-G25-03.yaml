stimuli: []
stem: |
  그림과 같이 $n^2$개의 영역으로 이루어진 한 개의 전광판이 있다. 이 전광판에 연결된 버튼을 이용하여 서울이와 시립이가 다음과 같은 규칙으로 게임을 하려고 한다. (단, $n$은 3 이상의 자연수이다.)
  (1) 게임을 시작할 때, 전광판의 모든 영역은 불이 꺼져있다.
  (2) 게임이 끝날 때까지 두 사람이 버튼을 번갈아 누른다.
  (3) 한 사람이 버튼을 누르면 불이 꺼져있는 영역 중 임의의 한 영역에 불이 켜지며, 이때 불이 켜진 영역은 버튼을 누른 사람의 소유가 된다.
  (4) 한 사람이 버튼을 눌렀을 때, 상대방이 소유한 영역과 한 모서리를 공유하는 영역에 불이 켜지면, 이때 버튼을 누른 사람이 승리하고 게임이 끝난다.
  [그림 1: 가로 $n$개, 세로 $n$개의 정사각형 영역으로 이루어진 전광판(격자)과 그 아래에 연결된 버튼]
  서울이부터 게임을 시작하여 진행할 때, 다음 물음에 답하여라.
subparts:
- id: 3-1
  stem: |
    (a) 시립이가 버튼을 한 번 눌러서 승리할 확률을 구하여라. (40점)
  points: 40
  depends_on: []
  answer:
    kind: value
    value: 4/(n*(n+1))
    equivalents: []
    tolerance: null
  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: |
        시립이가 버튼을 한 번 눌러서 승리하는 경우는 서울이가 소유한 영역과 한 모서리를 공유하는 영역이 2개인 경우, 3개인 경우, 4개인 경우로 나누어 생각할 수 있다.
      source_flow: 해설지 p.3 풀이
      criteria:
      - 3-1.M1
    - id: 31b-2
      content: |
        (i) 2개인 경우(전광판의 모서리 4칸): 조건을 만족하는 영역은 4개이므로 시립이가 승리할 경우의 수는 $4\times2=8$이다.
        (ii) 3개인 경우: 조건을 만족하는 영역은 $4\times(n-2)$개이므로 경우의 수는 $4(n-2)\times3$이다.
        (iii) 4개인 경우: 조건을 만족하는 영역은 $(n-2)^2$개이므로 경우의 수는 $(n-2)^2\times4$이다.
      source_flow: 해설지 p.3 풀이
      criteria:
      - 3-1.A1
    - id: 31b-3
      content: |
        따라서 확률의 덧셈정리에 의해 구하는 확률은 $\dfrac{8}{n^2(n^2-1)}+\dfrac{12(n-2)}{n^2(n^2-1)}+\dfrac{4(n-2)^2}{n^2(n^2-1)}=\dfrac{4}{n(n+1)}$이다.
      source_flow: 해설지 p.3 풀이
      criteria:
      - 3-1.A2
  # 채점기준 미공개 — 단계별 추정
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
