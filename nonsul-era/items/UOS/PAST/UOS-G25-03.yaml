      steps:
      - 31b-1
    - id: 3-1.A1
      mark_type: A
      points: 15
      evidence: 각 경우의 경우의 수 $8,\ 12(n-2),\ 4(n-2)^2$을 구했다.
      depends_on:
      - 3-1.M1
      steps:
      - 31b-2
    - id: 3-1.A2
      mark_type: A
      points: 10
      evidence: 전체 경우의 수 $n^2(n^2-1)$로 나누어 합하고 $\dfrac{4}{n(n+1)}$을 구했다.
      depends_on:
      - 3-1.M1
      - 3-1.A1
      steps:
      - 31b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 3-2
  stem: |
    (b) 서울이가 버튼을 두 번 눌러서 승리할 확률을 구하여라. (65점)
  points: 65
  depends_on:
  - 3-1
  answer:
    kind: value
    value: 4*(n**4-n**3-5*n**2+8*n-2)/(n**2*(n**2-1)*(n**2-2))
    equivalents: []
    tolerance: null
  solutions:
  - id: S32-B
    audience: B
    method_no: 1
    steps:
    - id: 32b-1
      content: |
        서울이가 버튼을 두 번 눌러서 승리하려면, 시립이가 버튼을 한 번 눌러서 승리하지 않아야 한다. (a)와 같은 방법으로 시립이가 소유한 영역과 한 모서리를 공유하는 영역의 개수 $d$에 따라 경우를 나눈다. 이때 서울이가 첫 번째로 소유한 영역은 시립이가 소유한 영역이 아니면서 시립이가 소유한 영역과 모서리를 공유하지 않는 $n^2-1-d$개의 영역 중 하나여야 하고, 서울이가 두 번째로 소유하는 영역은 시립이가 소유한 영역과 한 모서리를 공유하는 $d$개의 영역 중 하나여야 한다.
      source_flow: 해설지 p.3 풀이
      criteria:
      - 3-2.M1
    - id: 32b-2
      content: |
        (i) $d=2$인 경우: 위 조건을 만족하는 영역은 4개이고, 서울이가 첫 번째로 소유할 수 있는 영역은 $n^2-3$개이므로 경우의 수는 $4\times(n^2-3)\times2=8(n^2-3)$이다.
      source_flow: 해설지 p.3 풀이
      criteria:
      - 3-2.A1
    - id: 32b-3
      content: |
        (ii) $d=3$인 경우: 경우의 수는 $4(n-2)\times(n^2-4)\times3=12(n-2)^2(n+2)$이다.
      source_flow: 해설지 p.3 풀이
      criteria:
      - 3-2.A2
    - id: 32b-4
      content: |
        (iii) $d=4$인 경우: 경우의 수는 $(n-2)^2\times(n^2-5)\times4=4(n-2)^2(n^2-5)$이다.
      source_flow: 해설지 p.3 풀이
      criteria:
      - 3-2.A3
    - id: 32b-5
      content: |
        따라서 확률의 덧셈정리에 의해 구하는 확률은
        $$\dfrac{8(n^2-3)}{n^2(n^2-1)(n^2-2)}+\dfrac{12(n-2)^2(n+2)}{n^2(n^2-1)(n^2-2)}+\dfrac{4(n-2)^2(n^2-5)}{n^2(n^2-1)(n^2-2)}=\dfrac{4(n^4-n^3-5n^2+8n-2)}{n^2(n^2-1)(n^2-2)}$$
        이다.
      source_flow: 해설지 p.3 풀이
      criteria:
      - 3-2.A4
  # 채점기준 미공개 — 단계별 추정
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3-2.M1
      mark_type: M
      points: 20
      evidence: 시립이가 승리하지 않는 조건을 반영해 이웃 칸 수 $d$별로 (서울의 첫 영역)$\times$(서울의 둘째 영역) 구조로 경우를 세는 방법을 세웠다.
      steps:
      - 32b-1
    - id: 3-2.A1
      mark_type: A
      points: 10
      evidence: (i) $8(n^2-3)$을 구했다.
      depends_on:
      - 3-2.M1
      steps:
      - 32b-2
    - id: 3-2.A2
      mark_type: A
      points: 10
      evidence: (ii) $12(n-2)^2(n+2)$를 구했다.
      depends_on:
      - 3-2.M1
      steps:
      - 32b-3
    - id: 3-2.A3
      mark_type: A
      points: 10
      evidence: (iii) $4(n-2)^2(n^2-5)$를 구했다.
      depends_on:
      - 3-2.M1
      steps:
      - 32b-4
    - id: 3-2.A4
      mark_type: A
      points: 15
      evidence: 전체 경우의 수 $n^2(n^2-1)(n^2-2)$로 나누어 합하고 최종 확률을 구했다.
      depends_on:
      - 3-2.M1
      - 3-2.A1
      - 3-2.A2
      - 3-2.A3
      steps:
      - 32b-5
