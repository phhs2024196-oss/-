stimuli: []
stem: |
  자연수 $n$에 대하여
  $$T_n=\sum_{k=1}^{3n}\dfrac{1}{n^2}\int_0^{k\pi}\left|\sin\dfrac{x}{2n}\right|dx$$
  라 할 때, $\displaystyle\lim_{n\to\infty}T_n$의 값을 구하여라.
subparts:
- id: 4-1
  stem: ''
  points: 115
  depends_on: []
  answer:
    kind: value
    value: 10-4/pi
    equivalents: []
    tolerance: null
  solutions:
  - id: S41-B
    audience: B
    method_no: 1
    steps:
    - id: 41b-1
      content: |
        먼저 자연수 $k=1,\ 2,\ \cdots,\ 3n$에 대해 적분값 $\displaystyle\int_0^{k\pi}\left|\sin\dfrac{x}{2n}\right|dx$를 구하자.
        (i) $k=1,\ 2,\ \cdots,\ 2n$인 경우: $0\le x\le2n\pi$에서 $\sin\dfrac{x}{2n}\ge0$이므로
        $$\int_0^{k\pi}\left|\sin\dfrac{x}{2n}\right|dx=\int_0^{k\pi}\sin\dfrac{x}{2n}\,dx=\left[-2n\cos\dfrac{x}{2n}\right]_0^{k\pi}=2n\left(1-\cos\dfrac{k\pi}{2n}\right)$$
        이다.
      source_flow: 해설지 p.4 풀이
      criteria:
      - 4-1.M1
    - id: 41b-2
      content: |
        (ii) $k=2n+1,\ 2n+2,\ \cdots,\ 3n$인 경우: $0\le x<2n\pi$에서 $\sin\dfrac{x}{2n}\ge0$이고, $2n\pi\le x\le3n\pi$에서 $\sin\dfrac{x}{2n}\le0$이므로
        $$\int_0^{k\pi}\left|\sin\dfrac{x}{2n}\right|dx=\int_0^{2n\pi}\sin\dfrac{x}{2n}\,dx+\int_{2n\pi}^{k\pi}\left(-\sin\dfrac{x}{2n}\right)dx=\left[-2n\cos\dfrac{x}{2n}\right]_0^{2n\pi}+\left[2n\cos\dfrac{x}{2n}\right]_{2n\pi}^{k\pi}=2n\left(3+\cos\dfrac{k\pi}{2n}\right)$$
        이다.
      source_flow: 해설지 p.4 풀이
      criteria:
      - 4-1.M2
    - id: 41b-3
      content: |
        위 (i)과 (ii)에 의해
        $$T_n=\sum_{k=1}^{n}\dfrac{1}{n^2}\left\{\int_0^{k\pi}\left|\sin\dfrac{x}{2n}\right|dx+\int_0^{(n+k)\pi}\left|\sin\dfrac{x}{2n}\right|dx+\int_0^{(2n+k)\pi}\left|\sin\dfrac{x}{2n}\right|dx\right\}$$
      source_flow: 해설지 p.4 풀이
      criteria:
      - 4-1.M3
    - id: 41b-4
      content: |
        $$=\sum_{k=1}^{n}\dfrac1n\left[2\left(1-\cos\dfrac{k\pi}{2n}\right)+2\left\{1-\cos\dfrac{(n+k)\pi}{2n}\right\}+2\left\{3+\cos\dfrac{(2n+k)\pi}{2n}\right\}\right]=10+\dfrac1n\sum_{k=1}^{n}\left(-4\cos\dfrac{k\pi}{2n}+2\sin\dfrac{k\pi}{2n}\right)$$
        이다.
      source_flow: 해설지 p.4 풀이
      criteria:
      - 4-1.A1
    - id: 41b-5
      content: |
        따라서 정적분과 급수의 합 사이의 관계로부터
        $$\lim_{n\to\infty}T_n=10+\lim_{n\to\infty}\dfrac1n\sum_{k=1}^{n}\left(-4\cos\dfrac{k\pi}{2n}+2\sin\dfrac{k\pi}{2n}\right)=10+\int_0^1\left(-4\cos\dfrac{\pi}{2}x+2\sin\dfrac{\pi}{2}x\right)dx=10+\left[-\dfrac8\pi\sin\dfrac\pi2x-\dfrac4\pi\cos\dfrac\pi2x\right]_0^1=10-\dfrac4\pi$$
        이다.
      source_flow: 해설지 p.4 풀이
      criteria:
      - 4-1.M4
      - 4-1.A2
