      evidence: $|\sin x-a|$의 주기 $2\pi$를 이용해 $[0,3\pi]$의 적분을 $2\int_0^\pi+\int_\pi^{2\pi}$로 바꾸었다.
      steps:
      - 11b-1
    - id: 1-1.M2
      mark_type: M
      points: 15
      evidence: 교점 $\sin\theta=a$를 잡고 부호에 따라 구간을 나누었다.
      steps:
      - 11b-2
    - id: 1-1.A1
      mark_type: A
      points: 20
      evidence: $\int_0^\pi|f|\,dx=(4\theta-\pi)\sin\theta+4\cos\theta-2$를 구했다.
      depends_on:
      - 1-1.M2
      steps:
      - 11b-3
    - id: 1-1.A2
      mark_type: A
      points: 10
      evidence: $\int_\pi^{2\pi}|f|\,dx=\pi\sin\theta+2$를 구했다.
      depends_on:
      - 1-1.M2
      steps:
      - 11b-4
    - id: 1-1.A3
      mark_type: A
      points: 5
      evidence: $g(\theta)=(8\theta-\pi)\sin\theta+8\cos\theta-2$로 정리했다.
      depends_on:
      - 1-1.M2
      - 1-1.A1
      - 1-1.A2
      steps:
      - 11b-5
    - id: 1-1.M3
      mark_type: M
      points: 10
      evidence: $g'(\theta)=(8\theta-\pi)\cos\theta$를 구하고 증감을 조사했다.
      steps:
      - 11b-6
    - id: 1-1.A4
      mark_type: A
      points: 15
      evidence: $\theta=\dfrac{\pi}{8}$에서의 최소, 즉 $a=\sin\dfrac{\pi}{8}$와 최솟값 $8\cos\dfrac{\pi}{8}-2$를 구했다.
      depends_on:
      - 1-1.M3
      - 1-1.A3
      steps:
      - 11b-7
