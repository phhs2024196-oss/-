stem: |
  $0\le a\le 1$일 때, 정적분 $\displaystyle\int_0^{3\pi}|\sin x-a|\,dx$의 값이 최소가 되는 $a$의 값과 정적분의 최솟값을 구하여라.
subparts:
- id: 1-1
  stem: ''
  points: 85
  depends_on: []
  answer:
    kind: value
    value: a=sin(pi/8); min=8*cos(pi/8)-2
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        $f(x)=\sin x-a$는 주기가 $2\pi$이므로
        $$\int_0^{3\pi}|f(x)|\,dx=2\int_0^{\pi}|f(x)|\,dx+\int_{\pi}^{2\pi}|f(x)|\,dx$$
        이다.
      source_flow: 해설지 p.1 예시 답안
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        $0\le a\le1$이므로 구간 $\left[0,\dfrac{\pi}{2}\right]$에서 곡선 $y=\sin x$와 직선 $y=a$의 교점은 하나뿐이다. 그 교점의 $x$좌표를 $\theta$라 하면 $\sin\theta=a$이다. 구간 $[0,\theta]$와 $[\pi-\theta,\pi]$에서 $f(x)\le0$이고, 구간 $[\theta,\pi-\theta]$에서 $f(x)\ge0$이다.
      source_flow: 해설지 p.1 예시 답안
      criteria:
      - 1-1.M2
    - id: 11b-3
      content: |
        $$\int_0^{\pi}|f(x)|\,dx=\int_0^{\theta}(\sin\theta-\sin x)\,dx+\int_{\theta}^{\pi-\theta}(\sin x-\sin\theta)\,dx+\int_{\pi-\theta}^{\pi}(\sin\theta-\sin x)\,dx=(4\theta-\pi)\sin\theta+4\cos\theta-2$$
      source_flow: 해설지 p.1 예시 답안
      criteria:
      - 1-1.A1
    - id: 11b-4
      content: |
        구간 $[\pi,2\pi]$에서 $f(x)\le0$이므로
        $$\int_{\pi}^{2\pi}|f(x)|\,dx=\int_{\pi}^{2\pi}(\sin\theta-\sin x)\,dx=\pi\sin\theta+2$$
      source_flow: 해설지 p.1 예시 답안
      criteria:
      - 1-1.A2
    - id: 11b-5
      content: |
        따라서
        $$\int_0^{3\pi}|f(x)|\,dx=2\{(4\theta-\pi)\sin\theta+4\cos\theta-2\}+\pi\sin\theta+2=(8\theta-\pi)\sin\theta+8\cos\theta-2$$
        이다.
      source_flow: 해설지 p.1 예시 답안
      criteria:
      - 1-1.A3
    - id: 11b-6
      content: |
        $g(\theta)=(8\theta-\pi)\sin\theta+8\cos\theta-2$라 하면 $g'(\theta)=(8\theta-\pi)\cos\theta$이다. $0\le\theta\le\dfrac{\pi}{2}$에서 $\cos\theta\ge0$이므로 증감표는 $\theta=0$에서 $g=6$, $\theta=\dfrac{\pi}{8}$에서 $g'=0$($0<\theta<\dfrac{\pi}{8}$에서 $-$, $\dfrac{\pi}{8}<\theta<\dfrac{\pi}{2}$에서 $+$), $\theta=\dfrac{\pi}{2}$에서 $g=3\pi-2$이다.
      source_flow: 해설지 p.1 예시 답안
      criteria:
      - 1-1.M3
    - id: 11b-7
      content: |
        따라서 $g(\theta)$는 $\theta=\dfrac{\pi}{8}$에서 최솟값을 갖는다. 그러므로 $a=\sin\dfrac{\pi}{8}$일 때 정적분의 최솟값은 $8\cos\dfrac{\pi}{8}-2$이다.
      source_flow: 해설지 p.1 예시 답안
      criteria:
      - 1-1.A4
  # 채점기준 미공개 — 단계별 추정
