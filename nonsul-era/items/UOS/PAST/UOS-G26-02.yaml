stem: |
  타원 $\dfrac{x^2}{64}+y^2=1$과 제1사분면에서 접하는 접선을 $l$이라 하자. 직선 $l$과 직선 $y=-1$의 교점을 A, 직선 $l$과 $y$축의 교점을 B라 하자. 점 C$(0,-1)$일 때, $\triangle$ABC의 넓이의 최솟값을 구하여라.
