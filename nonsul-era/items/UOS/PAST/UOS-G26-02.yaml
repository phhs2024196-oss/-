  solutions:
  - id: S21-B
    audience: B
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        타원 $\dfrac{x^2}{64}+y^2=1$ 위의 제1사분면의 점 $(x_1,y_1)$에서의 접선 $l$의 방정식은 $x_1x+64y_1y=64$이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 2-1.M1
    - id: 21b-2
      content: |
        직선 $l$과 직선 $y=-1$의 교점 A의 좌표는 $\left(\dfrac{64(y_1+1)}{x_1},-1\right)$이고, 직선 $l$과 $y$축의 교점 B의 좌표는 $\left(0,\dfrac{1}{y_1}\right)$이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 2-1.A1
    - id: 21b-3
      content: |
        따라서 $\triangle$ABC의 넓이는 $S=\dfrac{32(y_1+1)^2}{x_1y_1}$이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 2-1.A2
    - id: 21b-4
      content: |
        $\dfrac{x_1^2}{64}+y_1^2=1$이므로
        $$S^2=\dfrac{32^2(y_1+1)^4}{(x_1y_1)^2}=\dfrac{16(y_1+1)^3}{(1-y_1)y_1^2}\quad(0<y_1<1)$$
        이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 2-1.M2
    - id: 21b-5
      content: |
        구간 $(0,1)$에서 함수 $f(x)=\dfrac{16(x+1)^3}{(1-x)x^2}$이라 하면
        $$f'(x)=16\times\dfrac{3(x+1)^2(x^2-x^3)-(x+1)^3(2x-3x^2)}{(1-x)^2x^4}=16(x+1)^2\times\dfrac{2x(2x-1)}{(1-x)^2x^4}$$
        이고, $f(x)$는 $0<x<\dfrac12$에서 감소, $x=\dfrac12$에서 $f'=0$, $\dfrac12<x<1$에서 증가하며 $f\left(\dfrac12\right)=432$이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 2-1.M3
    - id: 21b-6
      content: |
        따라서 구간 $(0,1)$에서 $x=\dfrac12$일 때 $f(x)$는 최솟값을 갖는다. 그러므로 $y_1=\dfrac12$일 때 $\triangle$ABC의 넓이가 최소가 되고, 그 최솟값은 $12\sqrt3$이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 2-1.A3
