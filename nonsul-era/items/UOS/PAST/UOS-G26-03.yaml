stem: |
  모든 양수 $a$에 대하여, 중심의 좌표가 $(a,a^2)$이고 반지름의 길이가 $a$인 모든 원 위의 점들로 이루어진 영역을 $S$라 하자. 영역 $S$에 있는 $x$좌표가 $t\ (t>0)$인 점 중에서 $y$좌표가 가장 작은 점을 지나는 원을 $(x-r)^2+(y-r^2)^2=r^2$이라 할 때, $t$와 $r$ 사이의 관계식을 구하고 $t=\dfrac12$에서 미분계수 $\dfrac{dr}{dt}$의 값을 구하여라.
subparts:
- id: 3-1
  stem: ''
