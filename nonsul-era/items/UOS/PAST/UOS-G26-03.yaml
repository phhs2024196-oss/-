  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: |
        원 $(x-r)^2+(y-r^2)^2=r^2$과 직선 $x=t$는 $0<r<\dfrac t2$일 때는 만나지 않고, $r\ge\dfrac t2$일 때에만 만나며 교점의 $y$좌표는 $y=r^2\pm\sqrt{2rt-t^2}$이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 3-1.M1
    - id: 31b-2
      content: |
        이 중 작은 값에서 최소가 될 수 있으므로 $y=r^2-\sqrt{2rt-t^2}$이 최소가 되는 $r$을 구하면 된다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 3-1.M2
    - id: 31b-3
      content: |
        $f(x)=x^2-\sqrt{2xt-t^2}$라 하면 $f'(x)=2x-\dfrac{t}{\sqrt{2xt-t^2}}$이고 $x>\dfrac t2$에서 $f''(x)=2+t^2(2xt-t^2)^{-\frac32}>0$이다. $f'(x)$는 연속인 증가함수이고, $\displaystyle\lim_{x\to\frac t2+}f'(x)=-\infty$이며 $\displaystyle\lim_{x\to\infty}f'(x)=\infty$이므로 $f'(x)=0$을 만족시키는 $x$는 오직 하나 존재한다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 3-1.R1
    - id: 31b-4
      content: |
        $f'(x)=0$에서 $t>0$이므로 $4x^2=\dfrac{t^2}{2xt-t^2}=\dfrac{t}{2x-t}$이다. 정리하면 $t=\dfrac{8x^3}{4x^2+1}$을 만족하는 $x$의 값(이 값을 $r$이라 하자)에 대하여 $f(x)$는 최솟값을 갖는다. 따라서 구하는 관계식은 $8r^3-t(4r^2+1)=0$이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 3-1.A1
    - id: 31b-5
      content: |
        $t=\dfrac12$일 때 $\dfrac12=\dfrac{8r^3}{4r^2+1}$에서 $(2r-1)(8r^2+2r+1)=0$이므로 $r=\dfrac12$이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 3-1.A2
    - id: 31b-6
      content: |
        음함수의 미분법에 의하여 $24r^2\dfrac{dr}{dt}-(4r^2+1)-8rt\dfrac{dr}{dt}=0$이므로 $t=\dfrac12$일 때 $\dfrac{dr}{dt}=\dfrac12$이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 3-1.A3
