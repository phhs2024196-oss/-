stimuli: []
stem: |
  1부터 $n\ (n\ge3)$까지의 자연수를 좌표로 갖는 서로 다른 $n$개의 점이 수직선 위에 있다. 이 중에서 서로 다른 세 점을 임의로 선택할 때, 그 세 점을 선택한 순서대로 각각 A, B, C라 하자. 수직선에서 두 선분 AB와 AC가 겹치는 부분의 길이를 확률변수 $X$라 할 때, 다음 물음에 답하여라.
subparts:
- id: 4-1
  stem: |
    (a) $X=1$일 확률을 구하여라. (40점)
  points: 40
  depends_on: []
  answer:
    kind: value
    value: 2/n
    equivalents: []
    tolerance: null
  solutions:
  - id: S41-B
    audience: B
    method_no: 1
    steps:
    - id: 41b-1
      content: |
        확률변수 $X$가 $1$인 경우는 다음과 같이 나뉜다.
        (i) 점 A의 좌표가 $k\ (k=1,\cdots,n-2)$일 때, 점 B의 좌표가 $(k+1)$이고 점 C의 좌표가 $(k+2),\cdots,n$ 중 하나이거나, 점 C의 좌표가 $(k+1)$이고 점 B의 좌표가 $(k+2),\cdots,n$ 중 하나인 경우. 이에 해당하는 경우의 수는 $2\displaystyle\sum_{k=1}^{n-2}(n-k-1)=(n-1)(n-2)$이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 4-1.M1
      - 4-1.A1
    - id: 41b-2
      content: |
        (ii) 점 A의 좌표가 $k\ (k=3,\cdots,n)$일 때, 점 B의 좌표가 $(k-1)$이고 점 C의 좌표가 $1,\cdots,(k-2)$ 중 하나이거나, 점 C의 좌표가 $(k-1)$이고 점 B의 좌표가 $1,\cdots,(k-2)$ 중 하나인 경우. 이에 해당하는 경우의 수는 $2\displaystyle\sum_{k=3}^{n}(k-2)=2\sum_{k=1}^{n-2}k=(n-1)(n-2)$이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 4-1.M1
      - 4-1.A1
    - id: 41b-3
      content: |
        따라서 $X=1$인 경우의 수는 $2(n-1)(n-2)$이다. $n$개의 점에서 서로 다른 세 점을 순서대로 선택하는 경우의 수는 ${}_n\mathrm{P}_3=n(n-1)(n-2)$이므로 $X=1$일 확률은 $\dfrac{2(n-1)(n-2)}{n(n-1)(n-2)}=\dfrac2n$이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 4-1.A2
  # 채점기준 미공개 — 단계별 추정
