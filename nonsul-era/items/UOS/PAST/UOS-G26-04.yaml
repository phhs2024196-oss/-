- id: 4-2
  stem: |
    (b) $X$의 평균을 구하여라. (75점)
  points: 75
  depends_on:
  - 4-1
  answer:
    kind: value
    value: (n+1)/6
    equivalents: []
    tolerance: null
  solutions:
  - id: S42-B
    audience: B
    method_no: 1
    steps:
    - id: 42b-1
      content: |
        확률변수 $X$가 $(n-1)$ 또는 $n$일 확률은 $0$이다. $X$가 $k\ (k=1,\cdots,n-2)$인 경우는 다음과 같이 나뉜다.
        (i) 점 A의 좌표가 $m\ (m=1,\cdots,n-k-1)$일 때, 점 B의 좌표가 $(m+k)$이고 점 C의 좌표가 $(m+k+1),\cdots,n$ 중 하나이거나, 점 C의 좌표가 $(m+k)$이고 점 B의 좌표가 $(m+k+1),\cdots,n$ 중 하나인 경우. 이에 해당하는 경우의 수는 $2\displaystyle\sum_{m=1}^{n-k-1}(n-m-k)=(n-k)(n-k-1)$이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 4-2.M1
      - 4-2.A1
    - id: 42b-2
      content: |
        (ii) 점 A의 좌표가 $m\ (m=k+2,\cdots,n)$일 때, 점 B의 좌표가 $(m-k)$이고 점 C의 좌표가 $1,\cdots,(m-k-1)$ 중 하나이거나, 점 C의 좌표가 $(m-k)$이고 점 B의 좌표가 $1,\cdots,(m-k-1)$ 중 하나인 경우. 이에 해당하는 경우의 수는 $2\displaystyle\sum_{m=k+2}^{n}(m-k-1)=2\sum_{m=1}^{n-k-1}m=(n-k)(n-k-1)$이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 4-2.M1
      - 4-2.A1
    - id: 42b-3
      content: |
        따라서 $X=k$인 경우의 수는 $2(n-k)(n-k-1)$이다. $n$개의 점에서 서로 다른 세 점을 순서대로 선택하는 경우의 수는 ${}_n\mathrm{P}_3=n(n-1)(n-2)$이므로 $X$의 평균은
        $$\sum_{k=1}^{n-2}\left[k\times\dfrac{2(n-k)(n-k-1)}{n(n-1)(n-2)}\right]=\dfrac{2}{n(n-1)(n-2)}\sum_{k=1}^{n-2}k(n-k)(n-k-1)$$
        $$=\dfrac{2}{n(n-1)(n-2)}\sum_{k=1}^{n-2}\left[k^3-(2n-1)k^2+n(n-1)k\right]=\dfrac{2}{n(n-1)(n-2)}\times\dfrac{n(n+1)(n-1)(n-2)}{12}=\dfrac{n+1}{6}$$
        이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 4-2.A1
      - 4-2.M2
      - 4-2.A2
