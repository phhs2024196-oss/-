        $p,q$의 홀짝이 같아야 함과 $p,q,\dfrac{p+q}2$가 모두 $S_n$에 속하는 경우를 (i) 같은 구간, (ii) 양 끝 구간으로 분류했다.
      steps:
      - 11b-2
    - id: 1-1.A2
      mark_type: A
      points: 5
      evidence: |
        세 구간 각각에 홀수 $n$개, 짝수 $n-1$개가 있음을 밝혔다.
