      points: 10
      evidence: |
        삼각함수의 합성 $\sqrt2\sin\left(\dfrac{\pi x}{4n}-\dfrac\pi4\right)<1$로 바꾸어 $0<x<2n$ 또는 $4n<x<10n$을 구했다.
      steps:
      - 11b-1
    - id: 1-1.M2
      mark_type: M
      points: 5
      evidence: |
        이차부등식 $(x-6n)(x-8n)>0$을 풀어 $0<x<6n$ 또는 $8n<x<10n$을 구했다.
      steps:
      - 11b-1
    - id: 1-1.A1
      mark_type: A
      points: 10
      evidence: |
        $S_n=(0,2n)\cup(4n,6n)\cup(8n,10n)$을 구했다.
      steps:
