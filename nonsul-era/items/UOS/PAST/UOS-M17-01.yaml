- id: 1-2
  stem: |
    (b) $\sum_{k=2}^{n}\dfrac{k^2-k}{a_ka_{k+1}-2a_k-2a_{k+1}+4}$의 값을 구하여라. (30점)
  points: 30
  depends_on:
  - 1-1
  answer:
    kind: expression
    value: (n-1)/(28*(5*n+2))
    equivalents:
    - $\dfrac{n-1}{28(5n+2)}$
    tolerance: null
  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        자연수 $k$에 대해서 $a_k-2=2(5k-3)(k-1)$이므로 $a_ka_{k+1}-2a_k-2a_{k+1}+4=(a_k-2)(a_{k+1}-2)=4(5k-3)(k-1)(5k+2)k$이다.
      source_flow: 해설지 예시 답안
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: |
        따라서 문제의 식은 $\sum_{k=2}^{n}\dfrac{k^2-k}{a_ka_{k+1}-2a_k-2a_{k+1}+4}=\dfrac14\sum_{k=2}^{n}\dfrac1{(5k-3)(5k+2)}=\dfrac1{20}\sum_{k=2}^{n}\left(\dfrac1{5k-3}-\dfrac1{5k+2}\right)$이다.
      source_flow: 해설지 예시 답안
      criteria:
      - 1-2.M2
    - id: 12b-3
      content: |
        $=\dfrac1{20}\left(\dfrac17-\dfrac1{5n+2}\right)=\dfrac{n-1}{28(5n+2)}$이다.
      source_flow: 해설지 예시 답안
      criteria:
      - 1-2.A1
