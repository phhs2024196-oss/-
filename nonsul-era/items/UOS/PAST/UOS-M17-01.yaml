stimuli: []
stem: |
  [문제 1] (100점)
  자연수 $n$에 대하여 연립부등식
  $$\begin{cases}0<x<10n\\x^{2}-14nx+48n^{2}>0\\\sin\dfrac{\pi x}{4n}-\cos\dfrac{\pi x}{4n}<1\end{cases}$$
  을 만족하는 $x$의 집합을 $S_n$이라 하고, 다음 조건을 만족하는 순서쌍 $(p,q)$의 개수를 $a_n$이라 하자.
  $p$, $q$, $\dfrac{p+q}{2}$는 모두 집합 $S_n$에 속하는 서로 다른 자연수이다.
subparts:
- id: 1-1
  stem: |
    (a) 일반항 $a_n$을 구하여라. (70점)
  points: 70
  depends_on: []
  answer:
    kind: expression
    value: 10*n**2-16*n+8
    equivalents:
    - $10n^2-16n+8$
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        삼각함수의 덧셈정리에 의해 $\sin\dfrac{\pi x}{4n}-\cos\dfrac{\pi x}{4n}=\sqrt2\sin\left(\dfrac{\pi x}{4n}-\dfrac\pi4\right)<1$이므로 $0<x<10n$의 범위에서 이를 풀면 $0<x<2n$ 또는 $4n<x<10n$이다. 또한 $0<x<10n$의 범위에서 $x^2-14nx+48n^2=(x-6n)(x-8n)>0$의 해는 $0<x<6n$ 또는 $8n<x<10n$이다. 따라서 $S_n=(0,2n)\cup(4n,6n)\cup(8n,10n)$이다.
      source_flow: 해설지 예시 답안
      criteria:
      - 1-1.M1
      - 1-1.M2
      - 1-1.A1
    - id: 11b-2
      content: |
        순서쌍 $(p,q)$가 문제의 조건을 만족하면, $p$와 $q$가 모두 홀수 혹은 모두 짝수이고, 또한 다음의 두 가지 경우 중 하나이다.
        (i) $p$와 $q$가 모두 $(0,2n)$ 또는 $(4n,6n)$ 또는 $(8n,10n)$에 포함되는 경우
        (ii) $p\in(0,2n)$이고 $q\in(8n,10n)$ 또는 $p\in(8n,10n)$이고 $q\in(0,2n)$인 경우
        한편 $(0,2n)$, $(4n,6n)$, $(8n,10n)$에는 각각 $n$개의 홀수와 $n-1$개의 짝수가 있다.
      source_flow: 해설지 예시 답안
      criteria:
      - 1-1.M3
      - 1-1.A2
    - id: 11b-3
      content: |
        따라서 (i)인 경우 순서쌍 $(p,q)$의 개수는 각 세 집합에서 동시에 두 홀수를 선택하거나 혹은 동시에 두 짝수를 선택하는 경우의 수인데 $p<q$와 $p>q$ 두 가지 경우가 있으므로 전체 경우의 수는 $2\cdot3\cdot\left({}_n\mathrm{C}_2+{}_{n-1}\mathrm{C}_2\right)$이다.
      source_flow: 해설지 예시 답안
      criteria:
      - 1-1.A3
    - id: 11b-4
      content: |
        (ii)인 경우 순서쌍 $(p,q)$의 개수는 $p\in(0,2n)$이고 $q\in(8n,10n)$인 경우 동시에 홀수 혹은 짝수를 선택하는 경우의 수와 $p\in(8n,10n)$이고 $q\in(0,2n)$인 경우 동시에 홀수 혹은 짝수를 선택하는 경우의 수의 합이므로 전체 경우의 수는 $2\cdot\left(n^2+(n-1)^2\right)$이다.
      source_flow: 해설지 예시 답안
      criteria:
      - 1-1.A4
    - id: 11b-5
      content: |
        그러므로 $a_n=3\left\{n(n-1)+(n-1)(n-2)\right\}+2\left\{n^2+(n-1)^2\right\}=10n^2-16n+8$이다.
      source_flow: 해설지 예시 답안
      criteria:
      - 1-1.A5
  # 채점기준 미공개 — 단계별 추정
