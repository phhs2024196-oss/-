key_idea: |
  직선 OA에 수직인 직선이 타원과 만나는 두 점 B, C는 원점 대칭이므로 $k=\overrightarrow{\mathrm{AB}}\cdot\overrightarrow{\mathrm{AC}}=|\overrightarrow{\mathrm{OA}}|^2-|\overrightarrow{\mathrm{OB}}|^2$이다. $k=0$이면 $|\mathrm{OA}|=|\mathrm{OB}|$, 최댓값·최솟값은 A, B가 장축·단축 위에 놓일 때이다.
