stimuli: []
stem: |
  [문제 2] (100점)
  좌표평면 위에 타원 $\dfrac{x^{2}}{a^{2}}+\dfrac{y^{2}}{b^{2}}=1$ $(a>b>0)$이 주어져 있다. 원점 $\mathrm{O}$와 타원 위의 점 $\mathrm{A}$에 대하여 벡터 $\overrightarrow{\mathrm{OA}}$와 수직이고 원점을 지나는 직선이 주어진 타원과 만나는 점을 $\mathrm{B},\ \mathrm{C}$라 하자. $k=\overrightarrow{\mathrm{AB}}\cdot\overrightarrow{\mathrm{AC}}$라 할 때 다음 물음에 답하여라.
subparts:
- id: 2-1
  stem: |
    (a) $k=0$이 되는 점 $\mathrm{A}$를 구하여라. (60점)
  points: 60
  depends_on: []
  answer:
    kind: set
    value: c=a*b/sqrt(a**2+b**2); A=(c,c),(-c,-c),(c,-c),(-c,c)
    equivalents:
    - $\left(\dfrac{ab}{\sqrt{a^2+b^2}},\dfrac{ab}{\sqrt{a^2+b^2}}\right),\ \left(-\dfrac{ab}{\sqrt{a^2+b^2}},-\dfrac{ab}{\sqrt{a^2+b^2}}\right),\ \left(\dfrac{ab}{\sqrt{a^2+b^2}},-\dfrac{ab}{\sqrt{a^2+b^2}}\right),\ \left(-\dfrac{ab}{\sqrt{a^2+b^2}},\dfrac{ab}{\sqrt{a^2+b^2}}\right)$
    tolerance: null
  solutions:
  - id: S21-B
    audience: B
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        $\overrightarrow{\mathrm{AB}}\cdot\overrightarrow{\mathrm{AC}}=\left(\overrightarrow{\mathrm{OB}}-\overrightarrow{\mathrm{OA}}\right)\cdot\left(\overrightarrow{\mathrm{OC}}-\overrightarrow{\mathrm{OA}}\right)=\overrightarrow{\mathrm{OA}}\cdot\overrightarrow{\mathrm{OA}}-\overrightarrow{\mathrm{OA}}\cdot\left(\overrightarrow{\mathrm{OB}}+\overrightarrow{\mathrm{OC}}\right)+\overrightarrow{\mathrm{OB}}\cdot\overrightarrow{\mathrm{OC}}=\left|\overrightarrow{\mathrm{OA}}\right|^2-\left|\overrightarrow{\mathrm{OB}}\right|^2$이므로 $k=\left|\overrightarrow{\mathrm{OA}}\right|^2-\left|\overrightarrow{\mathrm{OB}}\right|^2$이다.
      source_flow: 해설지 예시 답안
      criteria:
      - 2-1.M1
    - id: 21b-2
      content: |
        (a) $k=0$에서 $\overline{\mathrm{OA}}=\overline{\mathrm{OB}}$이므로 타원의 대칭성으로부터 점 $\mathrm{A}$와 점 $\mathrm{B}$는 $x$축 또는 $y$축 대칭이다. 따라서 점 $\mathrm{A}$와 점 $\mathrm{B}$는 $x$축 또는 $y$축 대칭이고, 직선 $\mathrm{OA}$와 직선 $\mathrm{OB}$가 서로 수직이므로 직선 $\mathrm{OA}$와 직선 $\mathrm{OB}$의 기울기 중 하나는 $1$이고 다른 하나는 $-1$이다.
      source_flow: 해설지 예시 답안
      criteria:
      - 2-1.M2
    - id: 21b-3
      content: |
        그러므로 점 $\mathrm{A}$는 주어진 타원과 직선 $y=x$의 교점인 $\left(\dfrac{ab}{\sqrt{a^2+b^2}},\dfrac{ab}{\sqrt{a^2+b^2}}\right)$, $\left(-\dfrac{ab}{\sqrt{a^2+b^2}},-\dfrac{ab}{\sqrt{a^2+b^2}}\right)$ 또는 주어진 타원과 직선 $y=-x$의 교점인 $\left(\dfrac{ab}{\sqrt{a^2+b^2}},-\dfrac{ab}{\sqrt{a^2+b^2}}\right)$, $\left(-\dfrac{ab}{\sqrt{a^2+b^2}},\dfrac{ab}{\sqrt{a^2+b^2}}\right)$이다.
      source_flow: 해설지 예시 답안
      criteria:
      - 2-1.A1
  # 채점기준 미공개 — 단계별 추정
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2-1.M1
      mark_type: M
      points: 20
      evidence: |
        $\overrightarrow{\mathrm{OC}}=-\overrightarrow{\mathrm{OB}}$ 또는 $\overrightarrow{\mathrm{OA}}\cdot\left(\overrightarrow{\mathrm{OB}}+\overrightarrow{\mathrm{OC}}\right)=0$ 등을 이용해 $k=|\overrightarrow{\mathrm{OA}}|^2-|\overrightarrow{\mathrm{OB}}|^2$를 얻었다.
      steps:
      - 21b-1
    - id: 2-1.M2
      mark_type: M
      points: 20
      evidence: |
        $k=0\Rightarrow|\mathrm{OA}|=|\mathrm{OB}|$와 수직 조건, 타원의 대칭성으로 직선 OA의 기울기가 $\pm1$임을 이끌었다.
      steps:
      - 21b-2
    - id: 2-1.A1
      mark_type: A
      points: 20
      evidence: |
        점 $\mathrm{A}$의 네 좌표 $\left(\pm\dfrac{ab}{\sqrt{a^2+b^2}},\pm\dfrac{ab}{\sqrt{a^2+b^2}}\right)$(복부호 임의)를 모두 구했다.
      steps:
      - 21b-3
      depends_on:
      - 2-1.M2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 2-2
  stem: |
    (b) $k$의 최솟값과 최댓값을 구하여라. (40점)
  points: 40
  depends_on:
  - 2-1
  answer:
    kind: value
    value: min=b**2-a**2; max=a**2-b**2
    equivalents:
    - 최솟값 $b^2-a^2$, 최댓값 $a^2-b^2$
    tolerance: null
  solutions:
  - id: S22-B
    audience: B
    method_no: 1
    steps:
    - id: 22b-1
      content: |
        $k$가 최대가 되려면 $\left|\overrightarrow{\mathrm{OA}}\right|$의 길이가 최대이고, $\left|\overrightarrow{\mathrm{OB}}\right|$의 길이가 최소가 되며 두 벡터가 수직이어야 한다.
      source_flow: 해설지 예시 답안
      criteria:
      - 2-2.M1
    - id: 22b-2
      content: |
        점 $\mathrm{A}$가 장축에 있고 점 $\mathrm{B}$가 단축에 있을 때, 조건을 만족하며 최댓값 $a^2-b^2$을 가진다. 같은 이유로 점 $\mathrm{A}$가 단축에 있고 점 $\mathrm{B}$가 장축에 있을 때, 조건을 만족하며 최솟값은 $b^2-a^2$을 가진다.
      source_flow: 해설지 예시 답안
      criteria:
      - 2-2.A1
      - 2-2.A2
