- id: 3-2
  stem: |
    (b) 곡선 $y=f(x)$와 직선 $y=g(x)$으로 둘러싸인 두 영역의 넓이가 같고 교점의 $x$ 좌표가 $0$, $\alpha$, $\beta$ $(0<\alpha<\beta)$일 때 $\dfrac{\beta}{\alpha}$의 값을 구하여라. (60점)
  points: 60
  depends_on: []
  answer:
    kind: value
    value: '2'
    equivalents: []
    tolerance: null
  solutions:
  - id: S32-B
    audience: B
    method_no: 1
    steps:
    - id: 32b-1
      content: |
        함수 $h(x)=f(x)-g(x)$라 하면, $h(x)=x^3+ax^2+bx-9x=x(x-\alpha)(x-\beta)$이다. [그래프에서 $0<x<\alpha$에서는 곡선이 직선 위에, $\alpha<x<\beta$에서는 직선이 곡선 위에 있다.]
      source_flow: 해설지 예시 답안
      criteria:
      - 3-2.M1
    - id: 32b-2
      content: |
        삼차함수와 직선으로 둘러싸인 두 영역의 넓이가 같으므로 다음 식이 성립한다. $\int_0^{\alpha}h(x)\,dx=\int_{\alpha}^{\beta}\left(-h(x)\right)dx$. 즉 $\int_0^{\alpha}h(x)\,dx+\int_{\alpha}^{\beta}h(x)\,dx=\int_0^{\beta}h(x)\,dx=0$이다.
      source_flow: 해설지 예시 답안
      criteria:
      - 3-2.M2
    - id: 32b-3
      content: |
        함수 $h(x)$의 한 부정적분 함수를 $H(x)$라 하자. $H(x)=\dfrac14x^4-\dfrac13(\alpha+\beta)x^3+\dfrac12\alpha\beta x^2$. 그러면 $\int_0^{\beta}h(x)\,dx=H(\beta)-H(0)=0$이다. 따라서 $H(\beta)=H(0)=0$.
      source_flow: 해설지 예시 답안
      criteria:
      - 3-2.A1
    - id: 32b-4
      content: |
        $H(\beta)=\dfrac14\beta^4-\dfrac13(\alpha+\beta)\beta^3+\dfrac12\alpha\beta^3=\dfrac1{12}\beta^3\left\{3\beta-4(\alpha+\beta)+6\alpha\right\}=\dfrac1{12}\beta^3(2\alpha-\beta)=0$. 여기서 $\dfrac1{12}\beta^3\ne0$이므로 $\beta=2\alpha$이다.
      source_flow: 해설지 예시 답안
      criteria:
      - 3-2.A2
    - id: 32b-5
      content: |
        따라서 $\dfrac\beta\alpha=\dfrac{2\alpha}{\alpha}=2$이다.
      source_flow: 해설지 예시 답안
      criteria:
      - 3-2.A3
  # 채점기준 미공개 — 단계별 추정
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3-2.M1
      mark_type: M
      points: 10
      evidence: |
        $h(x)=f(x)-g(x)=x(x-\alpha)(x-\beta)$로 놓고 두 영역의 위치(부호)를 파악했다.
      steps:
      - 32b-1
    - id: 3-2.M2
      mark_type: M
      points: 15
      evidence: |
        두 넓이가 같다는 조건을 $\int_0^{\alpha}h\,dx=-\int_{\alpha}^{\beta}h\,dx$, 즉 $\int_0^{\beta}h(x)\,dx=0$으로 바꾸었다.
      steps:
      - 32b-2
    - id: 3-2.A1
      mark_type: A
      points: 15
      evidence: |
        부정적분 $H(x)=\dfrac14x^4-\dfrac13(\alpha+\beta)x^3+\dfrac12\alpha\beta x^2$을 구하고 $H(\beta)=0$으로 정리했다.
      steps:
      - 32b-3
      depends_on:
      - 3-2.M2
    - id: 3-2.A2
      mark_type: A
      points: 10
      evidence: |
        $H(\beta)=\dfrac1{12}\beta^3(2\alpha-\beta)=0$에서 $\beta=2\alpha$를 얻었다.
      steps:
      - 32b-4
      depends_on:
      - 3-2.M2
    - id: 3-2.A3
      mark_type: A
      points: 10
      evidence: |
        $\dfrac\beta\alpha=2$를 적었다.
      steps:
      - 32b-5
      depends_on:
      - 3-2.M2
