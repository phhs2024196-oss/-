stem: |
  [문제 3] (총 100점)
  함수 $f(x)=x^{3}+ax^{2}+bx$와 $g(x)=9x$에 대하여 다음 물음에 답하여라.
subparts:
- id: 3-1
  stem: |
    (a) 곡선 $y=f(x)$와 직선 $y=g(x)$가 $x=c$ $(c>0)$에서 접할 때, $\left|\dfrac{b}{a+c}\right|$의 최솟값을 구하여라. (40점)
  points: 40
  depends_on: []
  answer:
    kind: value
    value: '6'
    equivalents: []
    tolerance: null
  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: |
        함수 $h(x)=f(x)-g(x)$라 하면 $h(x)=x^3+ax^2+bx-9x=x\left(x^2+ax+b-9\right)=x(x-c)^2$이다.
      source_flow: 해설지 예시 답안
      criteria:
      - 3-1.M1
    - id: 31b-2
      content: |
        곡선 $y=f(x)$와 직선 $y=g(x)$가 $x=c$ $(c>0)$에서 접하므로 $a=-2c$이고 $b=c^2+9$이다.
      source_flow: 해설지 예시 답안
      criteria:
      - 3-1.A1
    - id: 31b-3
      content: |
        따라서 $\left|\dfrac{b}{a+c}\right|=\left|\dfrac{c^2+9}{-2c+c}\right|=\left|c+\dfrac9c\right|\ge2\sqrt{c\cdot\dfrac9c}=2\sqrt9=6$
      source_flow: 해설지 예시 답안
      criteria:
      - 3-1.M2
      - 3-1.A2
    - id: 31b-4
      content: |
        따라서 구하는 최솟값은 $a=-6$, $b=18$, $c=3$일 때 $6$이다.
      source_flow: 해설지 예시 답안
      criteria:
      - 3-1.A2
