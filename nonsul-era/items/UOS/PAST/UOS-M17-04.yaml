stem: |
  [문제 4] (100점)
  $0<x<\dfrac{\pi}{2}$에서 부등식 $(1+\sin x)^{1+\cos x}>(1+\cos x)^{1+\sin x}$을 만족하는 $x$의 범위를 구하여라.
subparts:
- id: 4-1
  points: 100
  depends_on: []
  answer:
    kind: expression
    value: lo=pi/4; hi=pi/2
    equivalents:
    - $\dfrac\pi4<x<\dfrac\pi2$
    tolerance: null
  solutions:
  - id: S41-B
    audience: B
    method_no: 1
    steps:
    - id: 41b-1
      content: |
        $X=1+\sin x$, $Y=1+\cos x$라고 하자. $0<x<\dfrac\pi2$이므로 $1<X<2<e$이고 $Y$의 범위도 $1<Y<e$이다. 주어진 부등식은 $X^Y>Y^X$가 된다.
      source_flow: 해설지 예시 답안
      criteria:
      - 4-1.M1
    - id: 41b-2
      content: |
        함수 $y=\ln x$가 증가함수이므로 이 부등식의 양변에 자연로그를 취하여도 부등호의 방향은 변하지 않는다. 그러므로 주어진 부등식은 $Y\ln X>X\ln Y$와 동치이다. $X>1$이고 $Y>1$이므로 위 부등식을 $XY$로 나누어도 부등호의 방향은 변하지 않는다. 그러므로 주어진 부등식은 $\dfrac{\ln X}{X}>\dfrac{\ln Y}{Y}$ ······ (1)과 동치이다.
      source_flow: 해설지 예시 답안
      criteria:
      - 4-1.M2
    - id: 41b-3
      content: |
        이 부등식을 풀기 위하여 함수 $f(x)=\dfrac{\ln x}{x}$ $(x>1)$를 생각하자. 이때, 부등식 (1)은 $f(X)>f(Y)$ ······ (2)와 같다. $f(x)$를 미분하면 $f'(x)=\dfrac{1-\ln x}{x^2}$이다. $1<x<e$에서 $f'(x)>0$이므로 $f(x)$는 $1<x<e$에서 증가한다.
      source_flow: 해설지 예시 답안
      criteria:
      - 4-1.M3
    - id: 41b-4
      content: |
        그러므로 주어진 $X$, $Y$의 범위에서($1<X<e$, $1<Y<e$) 부등식 (2)는 $X>Y$와 동치이다.
      source_flow: 해설지 예시 답안
      criteria:
      - 4-1.R1
    - id: 41b-5
      content: |
        $0<x<\dfrac\pi2$에서 부등식 $X=1+\sin x>Y=1+\cos x$를 풀면 구하는 범위는 $\dfrac\pi4<x<\dfrac\pi2$이다.
      source_flow: 해설지 예시 답안
      criteria:
      - 4-1.A1
  # 채점기준 미공개 — 단계별 추정
