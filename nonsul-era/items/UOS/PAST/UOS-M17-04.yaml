key_idea: |
  $X=1+\sin x$, $Y=1+\cos x$라 두면 $X^Y>Y^X\iff\dfrac{\ln X}{X}>\dfrac{\ln Y}{Y}$이고, $f(x)=\dfrac{\ln x}{x}$가 $1<x<e$에서 증가하므로 $X>Y$, 즉 $\sin x>\cos x$와 같다.
