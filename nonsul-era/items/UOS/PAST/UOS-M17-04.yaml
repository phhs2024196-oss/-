      steps:
      - 41b-1
    - id: 4-1.M2
      mark_type: M
      points: 20
      evidence: |
        양변에 자연로그를 취하고 $XY$로 나누어 $\dfrac{\ln X}{X}>\dfrac{\ln Y}{Y}$와 동치임을 보였다.
      steps:
      - 41b-2
    - id: 4-1.M3
      mark_type: M
      points: 20
      evidence: |
        $f(x)=\dfrac{\ln x}{x}$를 미분해 $f'(x)=\dfrac{1-\ln x}{x^2}$를 구하고 $1<x<e$에서 증가함을 보였다.
      steps:
      - 41b-3
    - id: 4-1.R1
      mark_type: R
      points: 20
      evidence: |
        $X,Y$가 모두 $(1,e)$에 있음을 근거로 $f(X)>f(Y)\iff X>Y$임을 이끌었다.
      steps:
      - 41b-4
    - id: 4-1.A1
      mark_type: A
      points: 25
      evidence: |
        $\sin x>\cos x$를 풀어 $\dfrac\pi4<x<\dfrac\pi2$를 얻었다.
      steps:
