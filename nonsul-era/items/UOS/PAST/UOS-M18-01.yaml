    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 20
      evidence: |
        $\overline{\mathrm{AP}}=x$로 두고 $x\sin\theta=\sin\alpha$, $x\cos\theta+\cos\alpha=3$ 등으로 $x$와 $\theta$의 관계식(예: $(3-x\cos\theta)^2+(x\sin\theta)^2=1$)을 세웠다.
      steps:
      - 11b-1
    - id: 1-1.M2
      mark_type: M
      points: 20
      evidence: |
        관계식을 정리해 $x$에 대한 이차방정식 $x^2-6\cos\theta\,x+8=0$을 얻었다.
      steps:
      - 11b-2
    - id: 1-1.A1
      mark_type: A
      points: 10
      evidence: |
        근 $x=3\cos\theta\pm\sqrt{9\cos^2\theta-8}$를 구했다.
      steps:
      - 11b-2
      depends_on:
      - 1-1.M2
    - id: 1-1.R1
      mark_type: R
      points: 15
      evidence: |
        접하는 경우의 각($\cos\theta>\dfrac{2\sqrt2}{3}$)과 $\lim_{\theta\to0+}x=2$를 근거로 근호 앞의 부호를 $-$로 정했다.
      steps:
      - 11b-3
    - id: 1-1.M3
      mark_type: M
      points: 15
      evidence: |
        분자를 유리화해 $\dfrac{12(1-\cos\theta)}{\theta^2(\cdots)}$ 꼴로 바꾸었다.
      steps:
      - 11b-4
    - id: 1-1.A2
      mark_type: A
      points: 10
      evidence: |
        $\lim\dfrac{1-\cos\theta}{\theta^2}=\dfrac12$와 나머지 인수의 극한값 6을 구했다.
      steps:
      - 11b-4
      depends_on:
      - 1-1.M3
    - id: 1-1.A3
      mark_type: A
      points: 10
      evidence: 최종 값 3을 적었다.
      steps:
      - 11b-4
      depends_on:
      - 1-1.M3
