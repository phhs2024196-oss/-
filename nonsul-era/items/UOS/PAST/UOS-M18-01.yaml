stem: |
  [문제 1] (100점)
  좌표평면에서 점 $\mathrm{A}(-2,0)$을 지나는 직선이 원 $(x-1)^2+y^2=1$과 제1사분면의 서로 다른 두 점에서 만날 때, 두 점 중에서 점 $\mathrm{A}$에 가까운 점을 $\mathrm{P}$라 하자. $\angle\mathrm{PAO}=\theta$라 할 때, $\lim_{\theta\to0+}\dfrac{\overline{\mathrm{AP}}-2}{\theta^{2}}$의 값을 구하여라. (단, $\mathrm{O}$는 원점이다.)
subparts:
- id: 1-1
  points: 100
  depends_on: []
  answer:
    kind: value
    value: '3'
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        점 $\mathrm{P}$에서 $x$축에 내린 수선의 발을 $\mathrm{H}$라 하고, $\angle\mathrm{PO'H}=\alpha$라 하자. (단, $\mathrm{O'}(1,0)$이다.) 이제 $\overline{\mathrm{AP}}=x$라 하자. 그러면 두 직각삼각형 $\mathrm{PAH}$와 $\mathrm{PHO'}$으로부터 $\overline{\mathrm{PH}}=x\sin\theta=\sin\alpha$이고 $\overline{\mathrm{AO'}}=x\cos\theta+\cos\alpha$인데, $\overline{\mathrm{AO'}}=3$이므로
        $$1=\cos^2\alpha+\sin^2\alpha=(3-x\cos\theta)^2+(x\sin\theta)^2$$
        이다.
      source_flow: 해설지 예시 답안
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        그리고 이차방정식 $x^2-6\cos\theta\,x+8=0$을 풀면 $x=3\cos\theta\pm\sqrt{9\cos^2\theta-8}$이다.
      source_flow: 해설지 예시 답안
      criteria:
      - 1-1.M2
      - 1-1.A1
    - id: 11b-3
      content: |
        그런데 직선은 원과 두 점에서 만나야 하므로 $\theta$의 값은 직선이 원에 접할 때의 각보다 작아야 한다. 원의 반지름이 $1$이고 $\overline{\mathrm{AO'}}=3$이므로 $\dfrac{2\sqrt2}{3}<\cos\theta<1$이다. 따라서 $9\cos^2\theta-8>0$이고, $\lim_{\theta\to0+}x=2$이므로 $x=3\cos\theta-\sqrt{9\cos^2\theta-8}$이다.
      source_flow: 해설지 예시 답안
      criteria:
      - 1-1.R1
    - id: 11b-4
      content: |
        그러므로
        $$\lim_{\theta\to0+}\dfrac{x-2}{\theta^2}=\lim_{\theta\to0+}\dfrac{(3\cos\theta-2)-\sqrt{9\cos^2\theta-8}}{\theta^2}=\lim_{\theta\to0+}\dfrac{12(1-\cos\theta)}{\theta^2\left((3\cos\theta-2)+\sqrt{9\cos^2\theta-8}\right)}$$
        이고, $\lim_{\theta\to0+}\dfrac{1-\cos\theta}{\theta^2}=\lim_{\theta\to0+}\dfrac{1-\cos^2\theta}{\theta^2(1+\cos\theta)}=\lim_{\theta\to0+}\dfrac{\sin^2\theta}{\theta^2(1+\cos\theta)}=\dfrac12$, $\lim_{\theta\to0+}\dfrac{12}{(3\cos\theta-2)+\sqrt{9\cos^2\theta-8}}=6$이므로 $\lim_{\theta\to0+}\dfrac{x-2}{\theta^2}=3$이다.
      source_flow: 해설지 예시 답안
      criteria:
      - 1-1.M3
      - 1-1.A2
      - 1-1.A3
  # 채점기준 미공개 — 단계별 추정
