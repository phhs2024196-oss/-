        두 무게중심 $\mathrm{P}(x,x-2,1)$, $\mathrm{Q}(x+2,x,1)$을 구했다.
      steps:
      - 21b-2
      depends_on:
      - 2-1.M2
    - id: 2-1.M2
      mark_type: M
      points: 20
      evidence: |
        내적 $2x^2+1$과 두 벡터의 크기를 이용해 $\cos(\angle\mathrm{POQ})$를 $x$의 식으로 나타냈다.
      steps:
      - 21b-2
    - id: 2-1.M3
      mark_type: M
      points: 20
      evidence: |
        $\cos^2(\angle\mathrm{POQ})=\dfrac{4x^4+4x^2+1}{4x^4+4x^2+25}=1-\dfrac{24}t$로 정리하고 $t$의 범위 $25\le t\le33$을 구했다.
      steps:
      - 21b-3
    - id: 2-1.R1
      mark_type: R
      points: 10
      evidence: |
        $\cos(\angle\mathrm{POQ})>0$임과 $t=25$일 때 제곱의 최솟값 $\dfrac1{25}$를 근거로 들었다.
      steps:
      - 21b-4
    - id: 2-1.A2
      mark_type: A
      points: 15
      evidence: |
        최솟값 $\dfrac15$을 적었다.
      steps:
      - 21b-4
      depends_on:
      - 2-1.R1
