stem: |
  [문제 2] (100점)
  한 변의 길이가 $6$인 정사각형 $\mathrm{ABCD}$를 밑면으로 하고 높이가 $3$인 사각뿔 $\mathrm{V}$-$\mathrm{ABCD}$에서 밑면의 중심을 $\mathrm{O}$라 하고, 삼각형 $\mathrm{VAB}$, $\mathrm{VBC}$의 무게중심을 각각 $\mathrm{P}$, $\mathrm{Q}$라 하자. 꼭짓점 $\mathrm{V}$의 밑면 위로의 정사영이 선분 $\mathrm{AC}$에 있다고 할 때, $\cos(\angle\mathrm{POQ})$의 최솟값을 구하여라.
