  solutions:
  - id: S21-B
    audience: B
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        $\mathrm{A}(-3,-3,0)$, $\mathrm{B}(3,-3,0)$, $\mathrm{C}(3,3,0)$, $\mathrm{D}(-3,3,0)$이고, 꼭짓점 $\mathrm{V}$의 $z$좌표가 $3$이 되도록 좌표축을 정하자. 그러면 $\mathrm{O}(0,0,0)$이고, 두 점 $\mathrm{A}$, $\mathrm{C}$를 지나는 직선의 방정식은 $y=x$, $z=0$이므로 $\mathrm{V}(3x,3x,3)$($|x|\le1$)로 나타낼 수 있다.
      source_flow: 해설지 예시 답안
      criteria:
      - 2-1.M1
    - id: 21b-2
      content: |
        한편, $\mathrm{P}(x,x-2,1)$, $\mathrm{Q}(x+2,x,1)$이므로 $\overrightarrow{\mathrm{OP}}\cdot\overrightarrow{\mathrm{OQ}}=2x^2+1$이다. 그리고 $\left|\overrightarrow{\mathrm{OP}}\right|=\sqrt{2x^2-4x+5}$, $\left|\overrightarrow{\mathrm{OQ}}\right|=\sqrt{2x^2+4x+5}$이므로 내적의 정의에 의해
        $$\cos(\angle\mathrm{POQ})=\dfrac{2x^2+1}{\sqrt{2x^2-4x+5}\sqrt{2x^2+4x+5}}$$
        이고, $\cos(\angle\mathrm{POQ})>0$이다.
      source_flow: 해설지 예시 답안
      criteria:
      - 2-1.A1
      - 2-1.M2
    - id: 21b-3
      content: |
        이제 $t=4x^4+4x^2+25$라 하면 $|x|\le1$이므로 $25\le t\le33$이고
        $$\left(\dfrac{2x^2+1}{\sqrt{2x^2-4x+5}\sqrt{2x^2+4x+5}}\right)^2=\dfrac{4x^4+4x^2+1}{4x^4+4x^2+25}=1-\dfrac{24}t$$
        이다.
      source_flow: 해설지 예시 답안
      criteria:
      - 2-1.M3
    - id: 21b-4
      content: |
        따라서 $\left(\dfrac{2x^2+1}{\sqrt{2x^2-4x+5}\sqrt{2x^2+4x+5}}\right)^2$의 최솟값이 $\dfrac1{25}$이므로 $\cos(\angle\mathrm{POQ})$의 최솟값은 $\dfrac15$이다.
      source_flow: 해설지 예시 답안
      criteria:
      - 2-1.R1
      - 2-1.A2
  # 채점기준 미공개 — 단계별 추정
