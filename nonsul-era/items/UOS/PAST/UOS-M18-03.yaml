stimuli: []
stem: |
  [문제 3] (총 100점)
  흰 공과 빨간 공이 각각 $1$개씩 들어 있는 주머니가 있다. 세 명의 학생 A, B, C가 A, B, C 순서로 주머니에서 $1$개의 공을 임의로 꺼내고, 공을 꺼낼 때마다 바로 공 $1$개를 다시 채워 넣는다. 이때 A, B, C가 채워 넣는 공이 빨간색일 확률은 $p$이고, 흰색일 확률은 $1-p$이다.
subparts:
- id: 3-1
  stem: (a) B가 공을 채워 넣은 후 주머니에 흰 공과 빨간 공이 각각 1개일 확률을 구하여라. (50점)
  points: 50
  depends_on: []
  answer:
    kind: expression
    value: 1/4 + p*(1-p)
    equivalents:
    - $\dfrac14+p(1-p)$
    tolerance: null
  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: |
        A가 공을 채워 넣은 후 주머니에 빨간 공이 2개일 확률은, 흰 공을 꺼내고 빨간 공을 넣어야 하므로 $\dfrac p2$이고, 흰 공과 빨간 공이 각각 1개일 확률은, 빨간 공을 꺼내고 빨간 공을 넣거나 흰 공을 꺼내고 흰 공을 넣어야 하므로 $\dfrac p2+\dfrac{1-p}2=\dfrac12$이며, 흰 공이 2개일 확률은 빨간 공을 꺼내고 흰 공을 넣어야 하므로 $\dfrac{1-p}2$이다.
      source_flow: 해설지 예시 답안
      criteria:
      - 3-1.M1
    - id: 31b-2
      content: |
        B가 공을 채워 넣은 후 주머니에 흰 공과 빨간 공이 각각 1개인 경우는, A가 공을 채워 넣은 후 주머니에 있는 흰 공의 개수 $n$에 따라 다음의 3가지 경우가 있다.
        (i) $n=0$인 경우: 흰 공을 넣어야 하므로 확률은 $\dfrac p2\cdot(1-p)$이다.
        (ii) $n=1$일 경우: 빨간 공을 꺼내고 빨간 공을 넣거나, 흰 공을 꺼내고 흰 공을 넣어야 하므로 확률은 $\dfrac12\cdot\left\{\dfrac12\cdot p+\dfrac12\cdot(1-p)\right\}=\dfrac14$이다.
        (iii) $n=2$일 경우: 빨간 공을 넣어야 하므로 확률은 $\dfrac{1-p}2\cdot p$이다.
      source_flow: 해설지 예시 답안
      criteria:
      - 3-1.M2
      - 3-1.A1
    - id: 31b-3
      content: |
        따라서 구하는 값은 $\dfrac14+p(1-p)$이다.
      source_flow: 해설지 예시 답안
      criteria:
      - 3-1.A2
  # 채점기준 미공개 — 단계별 추정
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3-1.M1
      mark_type: M
      points: 15
      evidence: |
        A가 채운 후의 세 상태(빨간 공 2개, 각 1개, 흰 공 2개)의 확률 $\dfrac p2$, $\dfrac12$, $\dfrac{1-p}2$를 구했다.
      steps:
      - 31b-1
    - id: 3-1.M2
      mark_type: M
      points: 15
      evidence: |
        B가 채운 후 각 1개가 되는 경우를 A 후의 흰 공 개수 $n=0,1,2$에 따라 세 가지로 나누었다.
      steps:
      - 31b-2
    - id: 3-1.A1
      mark_type: A
      points: 10
      evidence: |
        세 경우의 확률 $\dfrac p2(1-p)$, $\dfrac14$, $\dfrac{1-p}2p$를 구했다.
      steps:
      - 31b-2
      depends_on:
      - 3-1.M2
    - id: 3-1.A2
      mark_type: A
      points: 10
      evidence: |
        합 $\dfrac14+p(1-p)$를 적었다.
      steps:
      - 31b-3
      depends_on:
      - 3-1.M2
