  solutions:
  - id: S32-B
    audience: B
    method_no: 1
    steps:
    - id: 32b-1
      content: |
        같은 방법으로 B가 공을 채워 넣은 후 주머니에 빨간 공이 2개일 확률은 $\dfrac p2\cdot p+\dfrac12\cdot\dfrac12\cdot p=\dfrac p4+\dfrac{p^2}2$이다.
      source_flow: 해설지 예시 답안
      criteria:
      - 3-2.M1
      - 3-2.A1
    - id: 32b-2
      content: |
        따라서 구하는 값은 $\dfrac12\cdot\left\{\dfrac14+p(1-p)\right\}+\dfrac p4+\dfrac{p^2}2=\dfrac18+\dfrac{3p}4$이다.
      source_flow: 해설지 예시 답안
      criteria:
      - 3-2.M2
      - 3-2.A2
