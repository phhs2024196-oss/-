stimuli: []
stem: |
  [문제 4] (총 100점)
  자연수 $n$과 세 함수
  $f(x)=x2^{x}$, $g(x)=x-[x]$, $h(x)=\begin{cases}\dfrac xn&(x\ge0)\\-x&(x<0)\end{cases}$
  에 대하여, 합성함수 $y=g\circ f(x)$의 그래프와 함수 $y=h(x)$의 그래프와의 교점의 개수를 $a_n$이라 하자. (단, $[x]$는 $x$를 넘지 않는 최대 정수이다.)
subparts:
- id: 4-1
  stem: |
    (a) 필요하면 $\lim_{x\to-\infty}x2^x=0$을 이용해서, 함수 $y=f(x)$의 그래프의 개형을 그려라. (40점)
  points: 40
  depends_on: []
  answer:
    kind: expression
    value: xmin=-1/log(2); fmin=-1/(E*log(2)); xinf=-2/log(2); finf=-2/(E**2*log(2))
    equivalents:
    - 극솟값 $f\left(-\dfrac1{\ln2}\right)=-\dfrac1{e\ln2}$, 변곡점 $x=-\dfrac2{\ln2}$, $x\to-\infty$에서 $0$에 접근, $x\to\infty$에서 $\infty$
    tolerance: null
  solutions:
  - id: S41-B
    audience: B
    method_no: 1
    steps:
    - id: 41b-1
      content: |
        $f'(x)=2^x(1+x\ln2)$이고 $f''(x)=2^x(2+x\ln2)\ln2$이다. 따라서 $x=-\dfrac1{\ln2}$일 때 $f'(x)=0$이고 $f\left(-\dfrac1{\ln2}\right)=-\dfrac1{\ln2}2^{-\frac1{\ln2}}=-\dfrac1{2^{\log_2e}\ln2}=-\dfrac1{e\ln2}$이므로, 함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다.
        $x<-\dfrac2{\ln2}$: $f'<0$, $f''<0$ / $x=-\dfrac2{\ln2}$: $f''=0$, $f=-\dfrac2{e^2\ln2}$ / $-\dfrac2{\ln2}<x<-\dfrac1{\ln2}$: $f'<0$, $f''>0$ / $x=-\dfrac1{\ln2}$: $f'=0$, $f=-\dfrac1{e\ln2}$ / $-\dfrac1{\ln2}<x<0$: $f'>0$, $f''>0$ / $x=0$: $f'(0)=1$, $f(0)=0$ / $x>0$: $f'>0$, $f''>0$
      source_flow: 해설지 예시 답안
      criteria:
      - 4-1.M1
      - 4-1.A1
    - id: 41b-2
      content: |
        그런데 $2<e<4$이므로 $1<\log_2e=\dfrac1{\ln2}<2$이고 $0<\dfrac1{e\ln2}<1$이다. 또한 $\lim_{x\to-\infty}f(x)=0$이고 $\lim_{x\to\infty}f(x)=\infty$이므로, 함수 $y=f(x)$의 그래프의 개형은 $x\to-\infty$에서 $0$에 접근하며 내려가 $x=-\dfrac1{\ln2}$에서 극솟값 $-\dfrac1{e\ln2}$를 갖고, 원점을 지나 증가하며 아래로 볼록한 모양이다.
      source_flow: 해설지 예시 답안
      criteria:
      - 4-1.M2
      - 4-1.R1
