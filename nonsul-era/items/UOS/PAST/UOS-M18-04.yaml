- id: 4-2
  stem: |
    (b) $\sum_{k=1}^{n}\dfrac{a_{k+1}^{2}}{a_ka_{k+2}}$을 구하여라. (60점)
  points: 60
  depends_on:
  - 4-1
  answer:
    kind: expression
    value: n + 3/4 - (2*n+3)/(2*(n+1)*(n+2))
    equivalents:
    - $\dfrac34+n-\dfrac{2n+3}{2(n+1)(n+2)}$
    tolerance: null
  solutions:
  - id: S42-B
    audience: B
    method_no: 1
    steps:
    - id: 42b-1
      content: |
        고정된 정수 $k$에 대해서 어떤 구간에 포함되는 모든 $x$가 $k\le f(x)<k+1$을 만족시키면 $g\circ f(x)=f(x)-[f(x)]=f(x)-k$이므로, 주어진 그 구간에서 $y=g\circ f(x)$의 그래프는 $y=f(x)$의 그래프를 $y$축으로 $-k$만큼 평행이동한 그래프와 같다. 따라서 함수 $y=g\circ f(x)$의 그래프의 개형은 $f$의 그래프를 정수 높이마다 잘라 아래로 옮긴 톱니 모양이다.
      source_flow: 해설지 예시 답안
      criteria:
      - 4-2.M1
    - id: 42b-2
      content: |
        (i) $x<0$일 때, $g\circ f(x)=f(x)+1$이므로 $x<0$에서 $y=g\circ f(x)$의 그래프와 $y=-x$의 그래프와의 교점의 개수는 1이다.
      source_flow: 해설지 예시 답안
      criteria:
      - 4-2.R1
    - id: 42b-3
      content: |
        (ii) $x\ge0$일 때, $f(0)=0$, $f(n)=n2^n$, $f'(0)=1$이므로 $x\ge0$에서 $y=g\circ f(x)$의 그래프와 $y=\dfrac xn$의 그래프와의 교점의 개수는 $f(n)-1=n2^n-1$이다.
      source_flow: 해설지 예시 답안
      criteria:
      - 4-2.R2
    - id: 42b-4
      content: |
        따라서 $a_n=n2^n$이므로
        $$\sum_{k=1}^{n}\dfrac{a_{k+1}^2}{a_ka_{k+2}}=\sum_{k=1}^{n}\dfrac{(k+1)^2}{k(k+2)}=\sum_{k=1}^{n}\left(1+\dfrac1{k(k+2)}\right)=n+\dfrac12\sum_{k=1}^{n}\left(\dfrac1k-\dfrac1{k+2}\right)=\dfrac34+n-\dfrac{2n+3}{2(n+1)(n+2)}$$
        이다.
      source_flow: 해설지 예시 답안
      criteria:
      - 4-2.A1
      - 4-2.M2
      - 4-2.A2
  # 채점기준 미공개 — 단계별 추정
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 4-2.M1
      mark_type: M
      points: 15
      evidence: |
        $k\le f(x)<k+1$인 구간에서 $g\circ f=f-k$임을 이용해 $y=g\circ f(x)$의 그래프를 $f$의 그래프를 평행이동한 톱니 꼴로 파악했다.
      steps:
      - 42b-1
    - id: 4-2.R1
      mark_type: R
      points: 10
      evidence: |
        $x<0$에서 $g\circ f=f+1$이고 $y=-x$와 교점이 1개임을 근거와 함께 밝혔다.
      steps:
      - 42b-2
    - id: 4-2.R2
      mark_type: R
      points: 10
      evidence: |
        $x\ge0$에서 $f(0)=0$, $f'(0)=1$, $f(n)=n2^n$으로 교점의 개수 $n2^n-1$을 근거와 함께 구했다.
      steps:
      - 42b-3
    - id: 4-2.A1
      mark_type: A
      points: 5
      evidence: |
        $a_n=n2^n$을 구했다.
      steps:
      - 42b-4
      depends_on:
      - 4-2.M2
    - id: 4-2.M2
      mark_type: M
      points: 10
      evidence: |
        $\dfrac{a_{k+1}^2}{a_ka_{k+2}}=\dfrac{(k+1)^2}{k(k+2)}=1+\dfrac1{k(k+2)}$로 정리하고 부분분수로 분해했다.
      steps:
      - 42b-4
    - id: 4-2.A2
      mark_type: A
      points: 10
      evidence: |
        합 $\dfrac34+n-\dfrac{2n+3}{2(n+1)(n+2)}$를 구했다.
      steps:
      - 42b-4
      depends_on:
      - 4-2.M2
