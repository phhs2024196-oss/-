stimuli: []
stem: |
  [문제 2] (100점)
  자연수 $n$에 대하여 $a_n=\sum_{k=1}^{2n}\dfrac{(-1)^{k+1}}{k}$라 할 때, 다음 물음에 답하여라.
subparts:
- id: 2-1
  stem: |
    (a) $0\le x\le1$일 때, 다음 부등식이 성립함을 보여라. (40점)
    $$1+\sum_{k=1}^{2n-1}(-x)^{k}\le\dfrac1{1+x}\le1+\sum_{k=1}^{2n}(-x)^{k}$$
  points: 40
  depends_on: []
  answer:
    kind: proof
    value: null
    equivalents: []
    tolerance: null
  solutions:
  - id: S21-B
    audience: B
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        $x\ne-1$이므로
        $$1+\sum_{k=1}^{2n-1}(-x)^k=1+\dfrac{-x\left(1-(-x)^{2n-1}\right)}{1-(-x)}=\dfrac{1+x-x-x^{2n}}{1+x}=\dfrac{1-x^{2n}}{1+x}$$
        이고
        $$1+\sum_{k=1}^{2n}(-x)^k=1+\dfrac{-x\left(1-(-x)^{2n}\right)}{1-(-x)}=\dfrac{1+x-x+x^{2n+1}}{1+x}=\dfrac{1+x^{2n+1}}{1+x}$$
        이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 2-1.M1
      - 2-1.A1
    - id: 21b-2
      content: |
        한편 $0\le x\le1$이면, $1-x^{2n}\le1\le1+x^{2n+1}$이고 $1+x>0$이므로 다음이 성립한다.
        $$\dfrac{1-x^{2n}}{1+x}\le\dfrac1{1+x}\le\dfrac{1+x^{2n+1}}{1+x}$$
        따라서 $1+\sum_{k=1}^{2n-1}(-x)^k\le\dfrac1{1+x}\le1+\sum_{k=1}^{2n}(-x)^k$이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 2-1.R1
  # 채점기준 미공개 — 단계별 추정
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2-1.M1
      mark_type: M
      points: 10
      evidence: |
        $1+\sum(-x)^k$를 등비수열의 합 공식으로 닫힌 꼴로 나타내려는 식이 있다($x\ne-1$ 언급 포함).
      steps:
      - 21b-1
    - id: 2-1.A1
      mark_type: A
      points: 15
      evidence: |
        두 합을 각각 $\dfrac{1-x^{2n}}{1+x}$, $\dfrac{1+x^{2n+1}}{1+x}$로 바르게 정리했다.
      steps:
      - 21b-1
      depends_on:
      - 2-1.M1
    - id: 2-1.R1
      mark_type: R
      points: 15
      evidence: |
        $0\le x\le1$에서 $1-x^{2n}\le1\le1+x^{2n+1}$, $1+x>0$을 근거로 부등식을 이끌었다.
      steps:
      - 21b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 2-2
  stem: |
    (b) $\lim_{n\to\infty}a_n$의 값을 구하여라. (60점)
  points: 60
  depends_on:
  - 2-1
  answer:
    kind: value
    value: log(2)
    equivalents:
    - $\ln2$
    tolerance: null
  solutions:
  - id: S22-B
    audience: B
    method_no: 1
    steps:
    - id: 22b-1
      content: |
        $a_n$은 적분을 이용하여 다음과 같이 표현할 수 있다.
        $$a_n=\sum_{k=1}^{2n}\dfrac{(-1)^{k+1}}{k}=\sum_{k=1}^{2n}\int_0^1(-x)^{k-1}\,dx=\int_0^1\left(1+\sum_{k=1}^{2n-1}(-x)^k\right)dx$$
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 2-2.M1
    - id: 22b-2
      content: |
        따라서 문항 (a)의 첫 번째 부등식에 의해 $a_n\le\int_0^1\dfrac1{x+1}\,dx=\ln2$이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 2-2.M2
    - id: 22b-3
      content: |
        또한
        $$a_n=\int_0^1\left(1+\sum_{k=1}^{2n}(-x)^k\right)dx-\int_0^1x^{2n}\,dx=\int_0^1\left(1+\sum_{k=1}^{2n}(-x)^k\right)dx-\dfrac1{2n+1}$$
        이므로, 문항 (a)의 두 번째 부등식에 의해 $a_n\ge\int_0^1\dfrac1{x+1}\,dx-\dfrac1{2n+1}=\ln2-\dfrac1{2n+1}$이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 2-2.M3
    - id: 22b-4
      content: |
        따라서 $\ln2-\dfrac1{2n+1}\le a_n\le\ln2$이므로 수열의 극한값의 대소 관계에 의해 $\lim_{n\to\infty}a_n=\ln2$이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 2-2.R1
  # 채점기준 미공개 — 단계별 추정
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2-2.M1
      mark_type: M
      points: 15
      evidence: |
        $\dfrac{(-1)^{k+1}}{k}=\int_0^1(-x)^{k-1}dx$를 이용해 $a_n=\int_0^1\left(1+\sum_{k=1}^{2n-1}(-x)^k\right)dx$로 나타냈다.
      steps:
      - 22b-1
    - id: 2-2.M2
      mark_type: M
      points: 15
      evidence: |
        (a)의 부등식을 적분해 $a_n\le\int_0^1\dfrac1{1+x}dx=\ln2$를 얻었다.
      steps:
      - 22b-2
    - id: 2-2.M3
      mark_type: M
      points: 20
      evidence: |
        $\int_0^1x^{2n}dx=\dfrac1{2n+1}$을 분리하고 (a)의 다른 부등식으로 $a_n\ge\ln2-\dfrac1{2n+1}$을 얻었다.
      steps:
      - 22b-3
    - id: 2-2.R1
      mark_type: R
      points: 10
      evidence: |
        두 부등식과 극한의 대소 관계(조임정리)로 $\lim a_n=\ln2$임을 결론지었다.
      steps:
      - 22b-4
