key_idea: |
  등비급수의 합으로 $1+\sum(-x)^k$를 닫힌 꼴로 쓰면 $\dfrac{1-x^{2n}}{1+x}\le\dfrac1{1+x}\le\dfrac{1+x^{2n+1}}{1+x}$이고, $a_n$을 $\int_0^1\left(1+\sum_{k=1}^{2n-1}(-x)^k\right)dx$로 쓴 뒤 (a)로 $\ln2-\dfrac1{2n+1}\le a_n\le\ln2$를 얻는다.
