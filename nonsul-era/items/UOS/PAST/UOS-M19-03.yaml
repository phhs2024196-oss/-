stimuli: []
stem: |
  [문제 3] (총 100점)
  주사위를 $k$번 던져서 나온 눈의 최솟값을 $a$, 최댓값을 $b$라 할 때, 다음 물음에 답하여라. (단, $k\ge2$이다.)
subparts:
- id: 3-1
  stem: |
    (a) $b-a=3$인 경우의 수를 구하여라. (50점)
  points: 50
  depends_on: []
  answer:
    kind: expression
    value: 3*(4**k-2*3**k+2**k)
    equivalents:
    - $3\left(4^k-2\cdot3^k+2^k\right)$
    tolerance: null
  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: |
        $b-a=3$인 순서쌍 $(a,b)$는 $(1,4),(2,5),(3,6)$으로 3개이며, 그 사건을 각각 $A_1,A_2,A_3$이라 하자. $n(A)$를 사건 $A$가 일어나는 경우의 수라 할 때, $b-a=3$인 경우의 수는 $n(A_1)+n(A_2)+n(A_3)$이다. $(a,b)=(1,4)$인 경우에, 모든 주사위의 눈이 1씩 더 나온다면 $(a,b)=(2,5)$인 경우가 된다. 즉, $n(A_1)=n(A_2)$이다. 같은 방법으로 $n(A_2)=n(A_3)$이다. 따라서 $b-a=3$인 경우의 수는 $3\cdot n(A_1)$ ······ ①이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 3-1.M1
    - id: 31b-2
      content: |
        $n(A_1)$을 구하기 위해 다음의 사건을 정의하자. $B$=주사위를 $k$번 던져서 나온 모든 눈이 1 이상 4 이하인 사건, $C$=모든 눈이 2 이상 4 이하인 사건, $D$=모든 눈이 1 이상 3 이하인 사건. 이때 $A_1=B-(C\cup D)$, $C\cup D\subset B$이므로 $n(A_1)=n(B)-n(C\cup D)$이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 3-1.M2
    - id: 31b-3
      content: |
        또한 $n(B)=4^k$, $n(C)=3^k$, $n(D)=3^k$이고 $C\cap D$는 주사위를 $k$번 던져서 나온 모든 눈이 2 또는 3인 사건이므로 $n(C\cap D)=2^k$이다. 따라서 $n(C\cup D)=n(C)+n(D)-n(C\cap D)=3^k+3^k-2^k$이므로 $n(A_1)=4^k-2\cdot3^k+2^k$이다. 그러므로 식 ①에 대입하면 $b-a=3$인 경우의 수는 $3\cdot(4^k-2\cdot3^k+2^k)$이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 3-1.A1
      - 3-1.A2
  # 채점기준 미공개 — 단계별 추정
  rubric:
    rules:
      ft_scope: cross_subpart_only
