      mark_type: M
      points: 15
      evidence: |
        $(a,b)=(1,4),(2,5),(3,6)$의 세 경우로 나누고 세 경우의 수가 서로 같음을 근거로 $3\cdot n(A_1)$으로 정리했다.
      steps:
      - 31b-1
    - id: 3-1.M2
      mark_type: M
      points: 10
      evidence: |
        $(a,b)=(1,4)$인 경우를 눈이 1~4인 경우에서 (2~4인 경우)와 (1~3인 경우)를 제외하는 포함배제 식으로 세웠다.
      steps:
      - 31b-2
    - id: 3-1.A1
      mark_type: A
      points: 15
      evidence: |
        $n(B)=4^k$, $n(C)=n(D)=3^k$, $n(C\cap D)=2^k$로 $n(A_1)=4^k-2\cdot3^k+2^k$을 구했다.
      steps:
      - 31b-3
      depends_on:
      - 3-1.M2
    - id: 3-1.A2
      mark_type: A
      points: 10
      evidence: |
        최종 값 $3\left(4^k-2\cdot3^k+2^k\right)$을 적었다.
      steps:
      - 31b-3
      depends_on:
      - 3-1.M2
