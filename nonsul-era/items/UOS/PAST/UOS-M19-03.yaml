  misconceptions: []
- id: 3-2
  stem: |
    (b) 처음 던진 주사위의 눈이 5가 나왔을 때, $b-a=3$일 확률을 구하여라. (50점)
  points: 50
  depends_on:
  - 3-1
  answer:
    kind: expression
    value: (2*4**(k-1)-3**k+2**(k-1))/6**(k-1)
    equivalents:
    - $\dfrac{2\cdot4^{k-1}-3^{k}+2^{k-1}}{6^{k-1}}$
    tolerance: null
  solutions:
  - id: S32-B
    audience: B
    method_no: 1
    steps:
    - id: 32b-1
      content: |
        $b-a=3$인 사건을 $E$, 처음 던진 주사위의 눈이 5가 나온 사건을 $F$라 하자. $\mathrm{P}(E\cap F)=\dfrac{n(E\cap F)}{6^k}$이고 $\mathrm{P}(F)=\dfrac16$이므로, 처음 던진 주사위의 눈이 5가 나왔을 때, $b-a=3$일 확률은 $\mathrm{P}(E|F)=\dfrac{\mathrm{P}(E\cap F)}{\mathrm{P}(F)}=\dfrac{n(E\cap F)}{6^{k-1}}$이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 3-2.M1
    - id: 32b-2
      content: |
        처음 던진 주사위의 눈이 5가 나왔을 때, $b-a=3$인 순서쌍 $(a,b)$는 $(2,5)$ 또는 $(3,6)$이어야 한다. 즉, 사건 $E\cap F$가 일어나는 경우는 첫 번째 주사위를 던진 이후에 주사위를 $k-1$번 던져 나온 눈의 최솟값과 최댓값의 순서쌍이 $(2,2),(2,3),(2,4),(2,5),(3,6)$일 때이다. 이 때, 각각의 사건을 $G_1,G_2,G_3,G_4,G_5$라 하자. 그러면 $n(E\cap F)=n(G_1)+n(G_2)+n(G_3)+n(G_4)+n(G_5)$이므로 $\mathrm{P}(E|F)=\dfrac{n(G_1)+n(G_2)+n(G_3)+n(G_4)+n(G_5)}{6^{k-1}}$이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 3-2.M2
    - id: 32b-3
      content: |
        $G_1$은 $k-1$번 던져 나온 모든 주사위의 눈이 2가 나오는 사건이므로 $n(G_1)=1$이다. $n(G_2),\cdots,n(G_5)$를 문항 (a)와 같은 방법으로 구하면, $n(G_2)=2^{k-1}-2$, $n(G_3)=3^{k-1}-2\cdot2^{k-1}+1$, $n(G_4)=n(G_5)=4^{k-1}-2\cdot3^{k-1}+2^{k-1}$이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 3-2.A1
    - id: 32b-4
      content: |
        따라서 처음 던진 주사위의 눈이 5가 나왔을 때, $b-a=3$일 확률은 $\dfrac{2\cdot4^{k-1}-3^{k}+2^{k-1}}{6^{k-1}}$이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 3-2.A2
  # 채점기준 미공개 — 단계별 추정
  rubric:
    rules:
      ft_scope: cross_subpart_only
