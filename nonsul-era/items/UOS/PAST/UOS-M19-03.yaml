      evidence: |
        조건부확률을 $\dfrac{\mathrm{P}(E\cap F)}{\mathrm{P}(F)}=\dfrac{n(E\cap F)}{6^{k-1}}$ 꼴로 세웠다.
      steps:
      - 32b-1
    - id: 3-2.M2
      mark_type: M
      points: 15
      evidence: |
        첫 눈이 5일 때 $(a,b)$가 $(2,5)$ 또는 $(3,6)$이어야 함을 보이고 나머지 $k-1$번의 (최솟값, 최댓값) 경우로 나누었다.
      steps:
      - 32b-2
    - id: 3-2.A1
      mark_type: A
      points: 15
      evidence: |
        나눈 각 경우의 수 $n(G_i)$를 포함배제로 바르게 구했다.
      steps:
      - 32b-3
      depends_on:
      - 3-2.M2
    - id: 3-2.A2
      mark_type: A
      points: 10
      evidence: |
        최종 확률 $\dfrac{2\cdot4^{k-1}-3^{k}+2^{k-1}}{6^{k-1}}$을 적었다.
      steps:
      - 32b-4
      depends_on:
      - 3-2.M2
