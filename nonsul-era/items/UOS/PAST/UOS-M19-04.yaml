    meaning: 만점
  misconceptions: []
- id: 4-2
  stem: |
    (b) 곡선 BP의 길이를 $f(\theta)$라 할 때, 도함수 $\dfrac{df}{d\theta}$가 최소가 되는 $\theta$의 값을 구하여라. (40점)
  points: 40
  depends_on:
  - 4-1
  answer:
    kind: value
    value: 4*pi/3
    equivalents:
    - $\dfrac{4\pi}{3}$
    tolerance: null
  solutions:
  - id: S42-B
    audience: B
    method_no: 1
    steps:
    - id: 42b-1
      content: |
        문항 (a)에 의하여 $f(\theta)=\dfrac{8\sin\frac\theta4}{\sin\left(\frac{5\pi}6-\frac\theta4\right)}$이다. 이를 $\theta$에 대하여 미분하면 다음을 얻는다.
        $$\dfrac{df}{d\theta}=\dfrac{2\left(\cos\frac\theta4\sin\left(\frac{5\pi}6-\frac\theta4\right)+\sin\frac\theta4\cos\left(\frac{5\pi}6-\frac\theta4\right)\right)}{\sin^2\left(\frac{5\pi}6-\frac\theta4\right)}=\dfrac{2\sin\left(\frac\theta4+\frac{5\pi}6-\frac\theta4\right)}{\sin^2\left(\frac{5\pi}6-\frac\theta4\right)}=\dfrac1{\sin^2\left(\frac{5\pi}6-\frac\theta4\right)}$$
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 4-2.M1
      - 4-2.A1
    - id: 42b-2
      content: |
        $0\le\theta\le2\pi$이므로 $\dfrac\pi3\le\dfrac{5\pi}6-\dfrac\theta4\le\dfrac{5\pi}6$이다. 이 범위에서 $\dfrac{5\pi}6-\dfrac\theta4=\dfrac\pi2$일 때 즉, $\theta=\dfrac{4\pi}3$일 때 $\sin^2\left(\frac{5\pi}6-\frac\theta4\right)$는 최댓값 1을 갖고, 이때 $\dfrac{df}{d\theta}$는 최솟값 1을 갖는다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 4-2.R1
      - 4-2.A2
  # 채점기준 미공개 — 단계별 추정
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 4-2.M1
      mark_type: M
      points: 15
      evidence: |
        $f(\theta)$를 몫의 미분법(또는 동치인 방법)으로 미분했다.
      steps:
      - 42b-1
    - id: 4-2.A1
      mark_type: A
      points: 15
      evidence: |
        $\dfrac{df}{d\theta}=\dfrac1{\sin^2\left(\frac{5\pi}6-\frac\theta4\right)}$ 또는 동치식을 얻었다.
      steps:
      - 42b-1
      depends_on:
      - 4-2.M1
    - id: 4-2.R1
      mark_type: R
      points: 5
      evidence: |
        $0\le\theta\le2\pi$에서 $\dfrac{5\pi}6-\dfrac\theta4$의 범위 $\left[\dfrac\pi3,\dfrac{5\pi}6\right]$를 구하고 $\sin^2$의 최댓값이 1임을 근거로 했다.
      steps:
      - 42b-2
    - id: 4-2.A2
      mark_type: A
      points: 5
      evidence: |
        $\theta=\dfrac{4\pi}3$을 적었다.
      steps:
      - 42b-2
      depends_on:
      - 4-2.R1
