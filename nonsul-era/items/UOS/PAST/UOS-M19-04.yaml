stimuli: []
stem: |
  [문제 4] (총 100점)
  중심이 점 O, 반지름의 길이가 2인 원을 밑면으로 하고, 모선의 길이가 8인 직원뿔이 있다. 이 원뿔의 꼭짓점을 A, 밑면의 경계인 원에 있는 임의의 점을 B, $\overline{AC}=\dfrac{8\sqrt3}{3}$을 만족하는 선분 AB의 점을 C라 하자. 점 P는 점 B에서 점 C까지 원뿔을 한 바퀴 감는 최단거리 곡선에서 움직이고 있다. 직선 AP가 밑면과 만나는 점을 D라 하고, $\angle\mathrm{BOD}=\theta$라 할 때, 다음 물음에 답하여라.
  [그림 1: 꼭짓점 A, 밑면의 중심 O, 밑면의 경계 위의 점 B, D, 모선 AB 위의 점 C가 표시된 원뿔. 곡선 BC가 원뿔을 한 바퀴 감고 있으며 그 위의 점 P가 직선 AD 위에 있다.]
subparts:
- id: 4-1
  stem: |
    (a) 곡선 BP의 길이를 $\theta$에 관한 식으로 나타내어라. (60점)
  points: 60
  depends_on: []
  answer:
    kind: expression
    value: 8*sin(theta/4)/sin(5*pi/6-theta/4)
    equivalents:
    - $\dfrac{8\sin\frac{\theta}{4}}{\sin\left(\frac{5\pi}{6}-\frac{\theta}{4}\right)}$
    tolerance: null
  solutions:
  - id: S41-B
    audience: B
    method_no: 1
    steps:
    - id: 41b-1
      content: |
        원뿔을 모서리 AB를 따라서 전개하면 부채꼴이 된다. 원뿔에서 점 P가 점 B에서 점 C까지의 최단거리 곡선에 있으므로, 점 P는 전개도에서 선분 BC에 있다. $\alpha=\angle\mathrm{ABC}$, $\beta=\angle\mathrm{BAC}$, $\gamma=\angle\mathrm{BPA}$라 하자. 부채꼴의 호의 길이와 밑면인 원의 둘레의 길이가 같으므로 $8\times\beta=2\pi\times2$가 성립한다. 그러므로 $\beta=\dfrac\pi2$이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 4-1.M1
    - id: 41b-2
      content: |
        또한, $\tan\alpha=\dfrac{\mathrm{AC}}{\mathrm{AB}}=\dfrac{\frac{8\sqrt3}3}{8}=\dfrac{\sqrt3}3$이므로 $\alpha=\dfrac\pi6$이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 4-1.M2
    - id: 41b-3
      content: |
        $\theta$가 0에서 $2\pi$까지 변할 때, $\angle\mathrm{BAP}$는 0에서 $\dfrac\pi2$까지 변하므로, 비례식에 의하여 $\angle\mathrm{BAP}=\dfrac\theta4$이다. 이때 $\gamma=\pi-\alpha-\dfrac\theta4=\dfrac{5\pi}6-\dfrac\theta4$이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 4-1.M3
    - id: 41b-4
      content: |
        이제 선분 BP의 길이를 구하기 위하여 점 B에서 직선 AP에 수선을 내리고 그 수선의 발을 Q라 하자. 직각삼각형 AQB에서 $\sin\dfrac\theta4=\dfrac{\overline{BQ}}{\overline{AB}}=\dfrac{\overline{BQ}}8$이므로 $\overline{BQ}=8\sin\dfrac\theta4$이다. 그리고 직각삼각형 BQP에서 $\sin\gamma=\sin(\pi-\gamma)=\dfrac{\overline{BQ}}{\overline{BP}}$이므로 $\overline{BP}=\dfrac{\overline{BQ}}{\sin\gamma}=\dfrac{8\sin\frac\theta4}{\sin\left(\frac{5\pi}6-\frac\theta4\right)}$이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 4-1.M4
      - 4-1.A1
  # 채점기준 미공개 — 단계별 추정
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 4-1.M1
      mark_type: M
      points: 10
      evidence: |
        전개도의 부채꼴의 호의 길이와 밑면의 둘레가 같음($8\beta=2\pi\times2$)으로 중심각 $\beta=\dfrac\pi2$를 구했다.
      steps:
      - 41b-1
    - id: 4-1.M2
      mark_type: M
      points: 10
      evidence: |
        $\tan\alpha=\dfrac{\mathrm{AC}}{\mathrm{AB}}=\dfrac{\sqrt3}3$으로 $\alpha=\dfrac\pi6$를 구했다.
      steps:
      - 41b-2
    - id: 4-1.M3
      mark_type: M
      points: 10
      evidence: |
        $\angle\mathrm{BAP}=\dfrac\theta4$(비례)와 $\gamma=\dfrac{5\pi}6-\dfrac\theta4$를 구했다.
      steps:
      - 41b-3
    - id: 4-1.M4
      mark_type: M
      points: 15
      evidence: |
        점 B에서 직선 AP에 내린 수선의 발을 이용(또는 사인법칙)해 $\overline{BQ}=8\sin\dfrac\theta4$, $\overline{BP}=\dfrac{\overline{BQ}}{\sin\gamma}$를 세웠다.
      steps:
      - 41b-4
    - id: 4-1.A1
      mark_type: A
      points: 15
      evidence: |
        $f(\theta)=\dfrac{8\sin\frac\theta4}{\sin\left(\frac{5\pi}6-\frac\theta4\right)}$를 적었다.
      steps:
      - 41b-4
      depends_on:
      - 4-1.M4
  outcome_codes:
