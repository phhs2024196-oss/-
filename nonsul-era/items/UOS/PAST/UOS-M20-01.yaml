stimuli: []
stem: |
  [문제 1] (100점)
  $1\le k\le n$인 두 자연수 $k$, $n$과 양수 $a$에 대하여 $a_k=\sum_{l=1}^{2n}\lvert k-l\rvert^{a}$, $S_n=\sum_{k=1}^{n}a_k$라 할 때, $\lim_{n\to\infty}\dfrac{S_n}{n^{a+2}}$의 값을 구하여라.
subparts:
- id: 1-1
  points: 100
  depends_on: []
  answer:
    kind: expression
    value: 2**(a+2)/((a+1)*(a+2))
    equivalents:
    - $\dfrac{2^{a+2}}{(a+1)(a+2)}$
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        $a_1=0+1+2^a+3^a+\cdots+(2n-1)^a$, $a_2=1+0+1+2^a+\cdots+(2n-2)^a$, $\cdots$, $a_n=(n-1)^a+\cdots+1+0+1+2^a+\cdots+n^a$이다.
        따라서 $1\le k\le n$, $1\le l\le 2n$, $0\le m\le 2n-1$에 대해 $\lvert k-l\rvert=m$인 두 자연수의 순서쌍 $(k,l)$의 개수는 다음과 같다.
        [1] $m=0$인 것은 $(1,1),(2,2),\cdots,(n,n)$으로 모두 $n$개이다.
        [2] $1\le m\le n-1$인 것은 $(m+1,1),(m+2,2),\cdots,(n,n-m),(1,m+1),\cdots,(n,n+m)$의 $2n-m$개이다.
        [3] $n\le m\le 2n-1$인 것은 $(1,m+1),(2,m+2),\cdots,(2n-m,2n)$의 $2n-m$개이다.
      source_flow: 해설지 p.1 예시 답안
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        따라서 $S_n=\sum_{m=1}^{2n-1}(2n-m)m^a=\sum_{m=1}^{2n}(2n-m)m^a$이므로
        $$\dfrac{S_n}{n^{a+2}}=\sum_{m=1}^{2n}\dfrac{(2n-m)m^a}{n^{a+2}}=2\sum_{m=1}^{2n}\left(\dfrac mn\right)^{a}\dfrac1n-\sum_{m=1}^{2n}\left(\dfrac mn\right)^{a+1}\dfrac1n$$
        이다.
      source_flow: 해설지 p.1 예시 답안
      criteria:
      - 1-1.A1
      - 1-1.M2
    - id: 11b-3
      content: |
        정적분과 무한급수의 관계에 의해 $[0,1]$에서 연속인 함수 $f(x)$에 대하여 $\lim_{n\to\infty}\sum_{m=1}^{n}f\left(\dfrac mn\right)\dfrac1n=\int_0^1 f(x)\,dx$이므로 치환적분에 의해
        $$\lim_{n\to\infty}\sum_{m=n+1}^{2n}f\left(\dfrac mn\right)\dfrac1n=\lim_{n\to\infty}\sum_{m=1}^{n}f\left(1+\dfrac mn\right)\dfrac1n=\int_0^1 f(1+x)\,dx=\int_1^2 f(x)\,dx$$
        이고,
        $$\lim_{n\to\infty}\sum_{m=1}^{2n}f\left(\dfrac mn\right)\dfrac1n=\int_0^1 f(x)\,dx+\int_1^2 f(x)\,dx=\int_0^2 f(x)\,dx$$
        이다.
      source_flow: 해설지 p.1 예시 답안
      criteria:
      - 1-1.M3
    - id: 11b-4
      content: |
        따라서 $\displaystyle\lim_{n\to\infty}\dfrac{S_n}{n^{a+2}}=2\int_0^2 x^{a}\,dx-\int_0^2 x^{a+1}\,dx=\dfrac{2^{a+2}}{(a+1)(a+2)}$이다.
      source_flow: 해설지 p.1 예시 답안
      criteria:
      - 1-1.A2
      - 1-1.A3
  # 채점기준 미공개 — 단계별 추정
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 30
      evidence: |
        $\lvert k-l\rvert=m$인 순서쌍 $(k,l)$의 개수를 $m$에 대해 센 식(예: $1\le m\le 2n-1$일 때 $2n-m$개)이 있다.
      steps:
      - 11b-1
    - id: 1-1.A1
      mark_type: A
      points: 10
      evidence: |
        $S_n=\sum_{m=1}^{2n}(2n-m)m^a$ 또는 이와 같은 단일 합이 있다.
      steps:
      - 11b-2
      depends_on:
      - 1-1.M2
    - id: 1-1.M2
      mark_type: M
      points: 15
      evidence: |
        $S_n/n^{a+2}$를 $\left(\dfrac mn\right)^{a}\dfrac1n$ 꼴의 합(구분구적법 꼴)으로 변형한 식이 있다.
      steps:
      - 11b-2
    - id: 1-1.M3
      mark_type: M
      points: 20
      evidence: |
        $\sum_{m=1}^{2n}f\left(\dfrac mn\right)\dfrac1n\to\int_0^2 f(x)\,dx$(구간이 $[0,2]$임)를 정적분과 급수의 관계로 근거를 들어 사용했다.
      steps:
      - 11b-3
    - id: 1-1.A2
      mark_type: A
      points: 15
      evidence: |
        $2\int_0^2 x^{a}\,dx-\int_0^2 x^{a+1}\,dx$ 꼴의 적분식을 세우고 값을 계산했다.
      steps:
      - 11b-4
      depends_on:
      - 1-1.M3
    - id: 1-1.A3
      mark_type: A
      points: 10
      evidence: |
        최종 값 $\dfrac{2^{a+2}}{(a+1)(a+2)}$를 적었다.
      steps:
      - 11b-4
      depends_on:
      - 1-1.M3
