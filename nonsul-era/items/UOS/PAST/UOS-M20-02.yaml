stem: |
  [문제 2] (100점)
  좌표평면에서 반지름의 길이가 1이고 중심이 원점 O인 원에서 두 점 P, Q가 움직인다. 시각 $t$일 때 P, Q가 $x$축의 양의 방향과 이루는 각은 각각 $4\cos4t$, $8\cos2t$이다. 삼각형 OPQ의 넓이가 최대가 되는 $t$의 개수를 구하여라. (단, $0\le t\le2\pi$)
subparts:
- id: 2-1
  points: 100
  depends_on: []
  answer:
    kind: value
    value: '28'
    equivalents: []
    tolerance: null
  solutions:
  - id: S21-B
    audience: B
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        시각 $t$일 때 삼각형 OPQ의 넓이는 $\dfrac12\lvert\sin(4\cos4t-8\cos2t)\rvert$이다. $f(t)=4\cos4t-8\cos2t$라 하면 넓이는 $\lvert\sin f(t)\rvert=1$, 즉 $f(t)=\dfrac{(2n+1)\pi}{2}$($n$은 정수)일 때 최대이다.
      source_flow: 해설지 p.2~3 예시 답안
      criteria:
      - 2-1.M1
    - id: 21b-2
      content: |
        $f'(t)=-16\sin4t+16\sin2t=-16\sin2t(2\cos2t-1)$이므로 $f'(t)=0$이면 $\sin2t=0$이거나 $\cos2t=\dfrac12$이다. $t=0,\dfrac\pi2,\pi,\dfrac{3\pi}2,2\pi$와 $t=\dfrac\pi6,\dfrac{5\pi}6,\dfrac{7\pi}6,\dfrac{11\pi}6$에서 증감을 조사하면 $f(0)=-4$, $f\left(\dfrac\pi6\right)=-6$, $f\left(\dfrac\pi2\right)=12$, $f\left(\dfrac{5\pi}6\right)=-6$, $f(\pi)=-4$, $f\left(\dfrac{7\pi}6\right)=-6$, $f\left(\dfrac{3\pi}2\right)=12$, $f\left(\dfrac{11\pi}6\right)=-6$, $f(2\pi)=-4$이다. 그래프의 개형에서 $y=\dfrac{(2n+1)\pi}{2}$($n=-2,-1,0,1,2,3$)와의 교점의 개수를 세면 총 28개이다.
      source_flow: 해설지 p.2~3 예시 답안
      criteria:
      - 2-1.M2
      - 2-1.A1
      - 2-1.A2
    - id: 21b-3
      content: |
        또 $0\le t\le2\pi$에서 $\lvert a\rvert<1$에 대해 $\cos2t=a$인 $t$는 모두 4개이다. 따라서 구하는 값은 $7\times4=28$이다.
      source_flow: 해설지 p.2~3 예시 답안
      criteria:
      - 2-1.R1
      - 2-1.A3
  - id: S21-ALT
    audience: ALT
    method_no: 2
    steps:
    - id: 21alt-1
      content: |
        $x=\cos2t$라 하면 $\cos4t=2x^2-1$이므로 $4\cos4t-8\cos2t=8x^2-8x-4$이다. $h(x)=8x^2-8x-4=8\left(x-\dfrac12\right)^2-6$이라 하면 $h(-1)=12$, $h(1)=-4$이고 $\dfrac{7\pi}2<12<\dfrac{9\pi}2$, $4<\dfrac{3\pi}2<5$, $7<\dfrac{5\pi}2<8$이므로 $[-1,1]$에서 함수 $y=h(x)$의 그래프와 $y=\dfrac{(2n+1)\pi}{2}$가 만나도록 하는 정수 $n$의 값과 교점의 개수는 $n=-2$일 때 2이고, $n=-1,0,1,2,3$일 때 각각 1로, 교점은 모두 7개이고 교점의 $x$좌표의 절댓값은 1보다 작다.
      source_flow: 해설지 p.2~3 예시 답안
      criteria:
      - 2-1.M2
      - 2-1.A1
      - 2-1.A2
    - id: 21alt-2
      content: |
        또 $0\le t\le2\pi$에서 $\lvert a\rvert<1$에 대해 $\cos2t=a$인 $t$는 모두 4개이다. 따라서 구하는 값은 $7\times4=28$이다.
      source_flow: 해설지 p.2~3 예시 답안
      criteria:
      - 2-1.R1
      - 2-1.A3
