    - id: 2-1.M2
      mark_type: M
      points: 25
      evidence: |
        $x=\cos2t$ 치환($8x^2-8x-4$) 또는 도함수 $f'(t)=-16\sin2t(2\cos2t-1)$와 증감표로 $f$의 값의 범위($-6\le f\le12$)와 변화를 구했다.
      steps:
      - 21b-2
    - id: 2-1.A1
      mark_type: A
      points: 20
      evidence: |
        조건을 만족하는 정수 $n$의 범위($n=-2,\dots,3$)를 구했다.
