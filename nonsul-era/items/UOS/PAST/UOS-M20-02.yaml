      evidence: |
        각 $n$에 대한 교점의 개수(합 7개, $n=-2$일 때 2개)를 구했다.
      steps:
      - 21b-2
      depends_on:
      - 2-1.M2
    - id: 2-1.R1
      mark_type: R
      points: 10
      evidence: |
        교점의 $x$좌표(또는 $\cos2t$의 값)의 절댓값이 1보다 작아 각각에 대해 $t$가 4개씩 대응함을 밝혔다.
      steps:
      - 21b-3
    - id: 2-1.A3
      mark_type: A
      points: 10
      evidence: |
        $7\times4=28$을 적었다.
      steps:
      - 21b-3
      depends_on:
      - 2-1.R1
