        넓이를 $\dfrac12\lvert\sin(4\cos4t-8\cos2t)\rvert$로 나타내고 최대 조건을 $\lvert\sin(\cdot)\rvert=1$, 즉 $f(t)=\dfrac{(2n+1)\pi}{2}$로 바꾼 식이 있다.
      steps:
