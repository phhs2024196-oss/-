stimuli: []
stem: |
  [문제 4] (총 100점)
  한 변의 길이가 1인 정삼각형 ABC의 세 변 및 내부에 포함되는 직사각형 PQRS의 넓이의 최댓값을 구하여라.
subparts:
- id: 4-1
  points: 100
  depends_on: []
  answer:
    kind: value
    value: sqrt(3)/8
    equivalents:
    - $\dfrac{\sqrt3}{8}$
    tolerance: null
  solutions:
  - id: S41-B
    audience: B
    method_no: 1
    steps:
    - id: 41b-1
      content: |
        직사각형의 네 꼭짓점 중 많아야 한 개가 정삼각형의 변에 있으면 직사각형이 정삼각형 내부에 포함되도록 직사각형의 가로와 세로의 길이를 키울 수 있다. 또 직사각형의 네 꼭짓점 중 2개만이 정삼각형의 변에 있으면, 직사각형의 네 꼭짓점 중 많아야 한 개가 정삼각형의 변에 있도록 평행이동 할 수 있다. 따라서 직사각형의 네 꼭짓점 중 적어도 3개가 정삼각형의 변에 있을 때, 직사각형 넓이의 최댓값을 구하면 된다. 두 꼭짓점이 한 변에 있는 경우 다른 두 꼭짓점은 이미 삼각형의 다른 두 변에 있거나 다른 두 변에 있도록 키울 수 있다.
      source_flow: 해설지 p.5 예시 답안
      criteria:
      - 4-1.M1
    - id: 41b-2
      content: |
        따라서 P는 선분 AB, Q는 선분 BC, R은 선분 CA에 있다고 하여도 무방하다. P에서 선분 BC에 내린 수선의 발을 점 H, $a=\overline{BQ}$, $\theta=\angle PQB$라 하자. 꼭짓점 S는 삼각형 ABC의 변 또는 내부에 있으므로 $\angle APQ=\angle PBQ+\angle PQB=\dfrac\pi3+\theta\ge\dfrac\pi2$, $\angle ARQ=\angle RCQ+\angle RQC=\dfrac\pi3+\left(\dfrac\pi2-\theta\right)\ge\dfrac\pi2$이다. 따라서 $\dfrac\pi6\le\theta\le\dfrac\pi3$이다.
      source_flow: 해설지 p.5 예시 답안
      criteria:
      - 4-1.M2
    - id: 41b-3
      content: |
        $\overline{BP}\sin\dfrac\pi3=\overline{PH}=\overline{PQ}\sin\theta$이므로 $\overline{BP}=\overline{PQ}\sin\theta\times\dfrac2{\sqrt3}$이다. $a=\overline{BQ}=\overline{BH}+\overline{HQ}=\overline{BP}\cos\dfrac\pi3+\overline{PQ}\cos\theta$이므로 $\overline{PQ}\left(\dfrac{\sin\theta}{\sqrt3}+\cos\theta\right)=a$이다.
      source_flow: 해설지 p.5 예시 답안
      criteria:
      - 4-1.A1
    - id: 41b-4
      content: |
        같은 방법으로 $\overline{QR}\left(\dfrac{\sin\left(\frac\pi2-\theta\right)}{\sqrt3}+\cos\left(\dfrac\pi2-\theta\right)\right)=\overline{QR}\left(\dfrac{\cos\theta}{\sqrt3}+\sin\theta\right)=1-a$이다. 따라서
        $\overline{PQ}\left(\dfrac{\sin\theta}{\sqrt3}+\cos\theta\right)\times\overline{QR}\left(\dfrac{\cos\theta}{\sqrt3}+\sin\theta\right)=a(1-a)$이고
        $\left(\dfrac{\sin\theta}{\sqrt3}+\cos\theta\right)\times\left(\dfrac{\cos\theta}{\sqrt3}+\sin\theta\right)=\dfrac1{\sqrt3}+\dfrac{4\sin\theta\cos\theta}{3}=\dfrac1{\sqrt3}+\dfrac{2\sin2\theta}{3}$이므로 $\overline{PQ}\times\overline{QR}=\dfrac{3a(1-a)}{\sqrt3+2\sin2\theta}$이다.
      source_flow: 해설지 p.5 예시 답안
      criteria:
      - 4-1.M3
      - 4-1.A2
    - id: 41b-5
      content: |
        또 $a(1-a)=-\left(a-\dfrac12\right)^2+\dfrac14$이고, $\dfrac\pi6\le\theta\le\dfrac\pi3$이므로 $2\sqrt3\le\sqrt3+2\sin2\theta\le\sqrt3+2$이다. 따라서 $\overline{PQ}\times\overline{QR}\le\dfrac34\times\dfrac1{2\sqrt3}=\dfrac{\sqrt3}8$이고 등호는 $a=\dfrac12$, $\theta=\dfrac\pi6$ 또는 $a=\dfrac12$, $\theta=\dfrac\pi3$일 때 성립한다. 그러므로 구하는 최댓값은 $\dfrac{\sqrt3}8$이다.
      source_flow: 해설지 p.5 예시 답안
      criteria:
      - 4-1.R1
      - 4-1.A3
  # 채점기준 미공개 — 단계별 추정
  rubric:
    rules:
