      isw: true
    criteria:
    - id: 4-1.M1
      mark_type: M
      points: 15
      evidence: |
        직사각형의 꼭짓점 중 적어도 3개가 삼각형의 변 위에 있는 경우만 보면 됨을 (확대·평행이동 논리로) 밝혔다.
      steps:
      - 41b-1
    - id: 4-1.M2
      mark_type: M
      points: 15
      evidence: |
        P, Q, R를 세 변 위에 놓고 $a=\overline{BQ}$, $\theta=\angle PQB$로 매개화했으며 $S$가 삼각형 안에 있을 조건으로 $\dfrac\pi6\le\theta\le\dfrac\pi3$를 얻었다.
      steps:
      - 41b-2
    - id: 4-1.A1
      mark_type: A
      points: 15
      evidence: |
        $\overline{PQ}\left(\dfrac{\sin\theta}{\sqrt3}+\cos\theta\right)=a$ 또는 이와 같은 길이 관계를 구했다.
      steps:
      - 41b-3
      depends_on:
      - 4-1.M2
    - id: 4-1.M3
      mark_type: M
      points: 15
      evidence: |
        같은 방법으로 $\overline{QR}\left(\dfrac{\cos\theta}{\sqrt3}+\sin\theta\right)=1-a$를 구해 $\overline{PQ}$, $\overline{QR}$를 $a$, $\theta$로 나타냈다.
      steps:
      - 41b-4
    - id: 4-1.A2
      mark_type: A
      points: 15
      evidence: |
        $\overline{PQ}\times\overline{QR}=\dfrac{3a(1-a)}{\sqrt3+2\sin2\theta}$ 또는 이와 같은 넓이식을 구했다.
      steps:
      - 41b-4
      depends_on:
      - 4-1.M3
    - id: 4-1.R1
      mark_type: R
      points: 15
      evidence: |
        $a(1-a)\le\dfrac14$과 $\sqrt3+2\sin2\theta\ge2\sqrt3$(범위 $\dfrac\pi6\le\theta\le\dfrac\pi3$ 사용)를 근거로 최댓값을 평가하고 등호 조건을 밝혔다.
      steps:
      - 41b-5
    - id: 4-1.A3
      mark_type: A
      points: 10
      evidence: |
        최댓값 $\dfrac{\sqrt3}{8}$을 적었다.
      steps:
      - 41b-5
      depends_on:
      - 4-1.R1
