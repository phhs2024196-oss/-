subparts:
- id: 1-1
  stem: |
    포물선 $y=x^2$의 서로 다른 두 점 $\mathrm{A}$와 $\mathrm{B}$에 대하여 점 $\mathrm{A}$에서의 접선과 점 $\mathrm{B}$에서의 접선의 교점을 점 $\mathrm{C}$라 하자. 포물선 $y=x^2$과 선분 $\mathrm{AB}$로 둘러싸인 도형의 넓이가 60일 때, 삼각형 $\mathrm{ABC}$의 넓이를 구하여라.
  points: 85
  depends_on: []
  answer:
    kind: value
    value: '90'
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        포물선 $y=x^2$의 점 $\mathrm{A}(a,a^2)$, $\mathrm{B}(b,b^2)$에서의 접선의 방정식은 차례로 $y=2ax-a^2$, $y=2bx-b^2$이고, 두 접선의 교점 $\mathrm{C}$는 $\mathrm{C}\left(\dfrac{a+b}{2},\,ab\right)$이며 직선 $\mathrm{AB}$의 방정식은 $y=(a+b)x-ab$이다. $b>a$라 하자.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        이때 포물선 $y=x^2$과 선분 $\mathrm{AB}$로 둘러싸인 도형의 넓이는 $\displaystyle\int_a^b\{(a+b)x-ab-x^2\}\,dx=\left[\dfrac{a+b}{2}x^2-abx-\dfrac{x^3}{3}\right]_a^b=\dfrac{(b-a)^3}{6}=60$이므로 $(b-a)^3=360$이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 1-1.M2
    - id: 11b-3
      content: |
        직선 $\mathrm{AB}$의 방정식은 $y-(a+b)x+ab=0$이고 점 $\mathrm{C}\left(\dfrac{a+b}{2},\,ab\right)$와 직선 $y-(a+b)x+ab=0$ 사이의 거리 $d$는 $d=\dfrac{\left\lvert ab-\dfrac{(a+b)^2}{2}+ab\right\rvert}{\sqrt{1^2+(a+b)^2}}=\dfrac{(b-a)^2}{2\sqrt{1^2+(a+b)^2}}$이며, $\overline{\mathrm{AB}}=\sqrt{(b-a)^2+(b^2-a^2)^2}=(b-a)\sqrt{1^2+(b+a)^2}$이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 1-1.M3
    - id: 11b-4
      content: |
        그러므로 $\triangle\mathrm{ABC}=\dfrac{\overline{\mathrm{AB}}\times d}{2}=\dfrac{(b-a)^3}{4}=\dfrac{360}{4}=90$이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 1-1.A1
