      isw: true
    criteria:
    - id: 2-1.M1
      mark_type: M
      points: 15
      evidence: 피적분함수를 $\dfrac{3x^4-4x^3+3x^2+4x+4}{x^2-2x+2}+4x\ln x$로 나누고 유리식을 $3x^2+2x+1+\dfrac{2x-2}{x^2-2x+2}+\dfrac{4}{x^2-2x+2}$로 나누었다.
      steps:
      - 21b-1
    - id: 2-1.M2
      mark_type: M
      points: 25
      evidence: $\displaystyle\int_1^2\left(3x^2+2x+1+\dfrac{2x-2}{x^2-2x+2}\right)dx=11+\ln 2$를 구했다.
      depends_on:
      - 2-1.M1
      steps:
      - 21b-2
    - id: 2-1.M3
      mark_type: M
      points: 25
      evidence: 치환적분으로 $\displaystyle\int_1^2\dfrac{4}{x^2-2x+2}\,dx=\pi$를 구했다.
      depends_on:
      - 2-1.M1
      steps:
      - 21b-3
    - id: 2-1.M4
      mark_type: M
      points: 15
      evidence: 부분적분으로 $\displaystyle\int_1^2 4x\ln x\,dx=8\ln 2-3$을 구했다.
      depends_on:
      - 2-1.M1
      steps:
      - 21b-4
    - id: 2-1.A1
      mark_type: A
      points: 15
