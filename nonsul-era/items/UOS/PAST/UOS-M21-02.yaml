subparts:
- id: 2-1
  stem: |
    다음 정적분의 값을 구하여라.

    $$\int_1^2\dfrac{3x^4+4x^3\ln x-4x^3-8x^2\ln x+3x^2+8x\ln x+4x+4}{x^2-2x+2}\,dx$$
  points: 95
  depends_on: []
  answer:
    kind: value
    value: 8 + pi + 9*log(2)
    equivalents:
    - $8+\pi+9\ln 2$
    tolerance: null
  solutions:
  - id: S21-B
    audience: B
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        $\dfrac{3x^4+4x^3\ln x-4x^3-8x^2\ln x+3x^2+8x\ln x+4x+4}{x^2-2x+2}=\dfrac{3x^4-4x^3+3x^2+4x+4}{x^2-2x+2}+4x\ln x$이고 $\dfrac{3x^4-4x^3+3x^2+4x+4}{x^2-2x+2}=3x^2+2x+1+\dfrac{2x-2}{x^2-2x+2}+\dfrac{4}{x^2-2x+2}$이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 2-1.M1
    - id: 21b-2
      content: |
        $\displaystyle\int_1^2\left(3x^2+2x+1+\dfrac{2x-2}{x^2-2x+2}\right)dx=\Bigl[x^3+x^2+x+\ln\lvert x^2-2x+2\rvert\Bigr]_1^2=11+\ln 2$이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 2-1.M2
    - id: 21b-3
      content: |
        $\displaystyle\int_1^2\dfrac{4}{x^2-2x+2}\,dx=4\int_1^2\dfrac{1}{(x-1)^2+1}\,dx=4\int_0^1\dfrac{1}{x^2+1}\,dx=4\int_0^{\frac{\pi}{4}}\dfrac{\sec^2\theta}{\tan^2\theta+1}\,d\theta=4\int_0^{\frac{\pi}{4}}1\,d\theta=\pi$이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 2-1.M3
    - id: 21b-4
      content: |
        $\displaystyle\int_1^2 4x\ln x\,dx=\Bigl[2x^2\ln x\Bigr]_1^2-\int_1^2 2x\,dx=8\ln 2-3$이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 2-1.M4
    - id: 21b-5
      content: |
        따라서 구하는 정적분의 값은 $(11+\ln 2)+\pi+(8\ln 2-3)=8+\pi+9\ln 2$이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 2-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
