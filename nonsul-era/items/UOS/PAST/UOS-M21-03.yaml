stimuli: []
stem: |
  아래의 그림과 같은 도로망에서 A 또는 B에서 출발하여 출발점을 포함한 각 교차로에서 다음 규칙을 따라 이동한다.

  > (1) 동전을 던져 앞면이 나오면 위로(↑), 뒷면이 나오면 오른쪽(→)으로 각각 한 칸 이동한다.
  > (2) 위로 이동할 수 없는 경우에는 오른쪽으로 이동하고, 오른쪽으로 이동할 수 없는 경우에는 위로 이동한다.
  > (3) C 또는 D에 도착하면 이동을 멈춘다.

  [그림 1: 격자 모양 도로망. 맨 아래 줄은 오른쪽 4칸, 가운데 세 줄은 5칸, 맨 위 줄은 왼쪽 2칸이다. 왼쪽 끝의 교차로 A는 맨 아래 줄 바로 위쪽 끝, B는 맨 아래 줄의 왼쪽 끝이다. 오른쪽 끝의 D는 맨 위 줄 바로 아래쪽 끝, C는 맨 위 줄의 오른쪽 끝이다. 좌표로 쓰면 교차로는 y=0에서 x=1~5, y=1~4에서 x=0~5, y=5에서 x=0~2이고 A(0,1), B(1,0), C(2,5), D(5,4)이다.]
subparts:
- id: 3-1
  stem: |
    (a) B에서 출발하였을 때, D에 도착할 확률을 구하여라.
  points: 45
  depends_on: []
  answer:
    kind: value
    value: 57/64
    equivalents:
    - $\dfrac{57}{64}$
    tolerance: null
  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: |
        B에서 출발하였을 때, D에 도착할 확률을 $p_{BD}$라 하고, C에 도착할 확률을 $p_{BC}$라 하자. 그러면 $p_{BD}=1-p_{BC}$이다. (출발하면 C 또는 D에서 멈춘다.)
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 3-1.M1
    - id: 31b-2
      content: |
        B를 출발하여, C에 도착하기 위해서는 E나 F를 지나야 한다. (E는 C의 바로 왼쪽 교차로 (1,5), F는 C의 바로 아래 교차로 (2,4)이다.) $\mathrm{B}\to\mathrm{E}\to\mathrm{C}$의 경우는 E에 도달한 후, 반드시 C에 도착한다. 이러한 사건이 발생할 확률은 $\dfrac{1}{2^5}$이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 3-1.M2
    - id: 31b-3
      content: |
        또한, $\mathrm{B}\to\mathrm{F}\to\mathrm{C}$의 경우는 F에 도달한 후, 동전의 앞면이 나와야 한다. 이러한 사건이 발생할 확률은 $\dfrac{5}{2^5}\times\dfrac{1}{2}$이다.
      source_flow: 해설지 p.5 예시 답안
      criteria:
      - 3-1.M3
    - id: 31b-4
      content: |
        따라서 $p_{BC}=\dfrac{1}{2^5}+\dfrac{5}{2^6}=\dfrac{7}{64}$, $p_{BD}=1-p_{BC}=\dfrac{57}{64}$이다.
      source_flow: 해설지 p.5 예시 답안
      criteria:
      - 3-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3-1.M1
      mark_type: M
      points: 10
      evidence: $p_{BD}=1-p_{BC}$로 바꾸고 C에 도착하는 경로를 E, F 경유로 분류했다.
      steps:
      - 31b-1
    - id: 3-1.M2
      mark_type: M
      points: 10
      evidence: $\mathrm{B}\to\mathrm{E}\to\mathrm{C}$의 확률 $\dfrac{1}{2^5}$을 구했다.
      depends_on:
      - 3-1.M1
      steps:
      - 31b-2
    - id: 3-1.M3
      mark_type: M
      points: 15
      evidence: $\mathrm{B}\to\mathrm{F}\to\mathrm{C}$의 확률 $\dfrac{5}{2^5}\times\dfrac{1}{2}$을 구했다.
      depends_on:
      - 3-1.M1
      steps:
      - 31b-3
    - id: 3-1.A1
      mark_type: A
      points: 10
      evidence: $p_{BC}=\dfrac{7}{64}$를 거쳐 $p_{BD}=\dfrac{57}{64}$를 구했다.
      depends_on:
      - 3-1.M2
      - 3-1.M3
      steps:
      - 31b-4
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 3-2
  stem: |
    (b) 시립이는 동전을 던져 앞면이 나오면 A에서 출발하고, 뒷면이 나오면 B에서 출발한다. 시립이가 C에 도착했을 때, 시립이가 A에서 출발하였을 확률을 구하여라.
  points: 60
  depends_on:
  - 3-1
  answer:
    kind: value
    value: 22/29
    equivalents:
    - $\dfrac{22}{29}$
    tolerance: null
  solutions:
  - id: S32-B
    audience: B
    method_no: 1
    steps:
    - id: 32b-1
      content: |
        A를 출발하였을 때, C에 도착할 확률을 $p_{AC}$라 하자. A를 출발하였을 때, C에 도착하기 위해서는 E나 F를 지나야 한다. A를 출발하였을 때, E에 도달할 확률은 (a)번 문제와 같은 방법으로 계산하면 $\dfrac{1}{2^4}+\dfrac{4}{2^5}$이다. E에 도달한 후에는 반드시 C에 도착하므로, $\mathrm{A}\to\mathrm{E}\to\mathrm{C}$의 경우가 발생할 확률은 $\dfrac{6}{32}$이다.
      source_flow: 해설지 p.5 예시 답안
      criteria:
      - 3-2.M1
    - id: 32b-2
      content: |
        또한, $\mathrm{A}\to\mathrm{F}\to\mathrm{C}$의 경우는 F에 도달한 후, 동전의 앞면이 나와야 한다. A를 출발했을 때, F에 도달할 확률은 ${}_5\mathrm{C}_2\dfrac{1}{2^5}$이므로, $\mathrm{A}\to\mathrm{F}\to\mathrm{C}$의 경우가 발생할 확률은 ${}_5\mathrm{C}_2\dfrac{1}{2^6}=\dfrac{10}{64}$이다.
      source_flow: 해설지 p.5 예시 답안
      criteria:
      - 3-2.M2
    - id: 32b-3
      content: |
        따라서 $p_{AC}=\dfrac{6}{32}+\dfrac{10}{64}=\dfrac{22}{64}$이다. 또한, 문제 (a)의 풀이에서 $p_{BC}=\dfrac{7}{64}$이다.
      source_flow: 해설지 p.5 예시 답안
      criteria:
      - 3-2.M3
    - id: 32b-4
      content: |
        A, B에서 출발했을 확률이 각각 $\dfrac{1}{2}$이므로 C에 도착했을 확률 $p_C$는 $p_C=\dfrac{1}{2}p_{AC}+\dfrac{1}{2}p_{BC}=\dfrac{29}{128}$이다.
      source_flow: 해설지 p.5 예시 답안
      criteria:
      - 3-2.M4
    - id: 32b-5
      content: |
        C에 도착했을 때, A에서 출발했을 확률은 $\dfrac{1}{2}\cdot\dfrac{p_{AC}}{p_C}$이므로, 구하는 확률은 $\dfrac{22}{29}$이다.
      source_flow: 해설지 p.5 예시 답안
      criteria:
      - 3-2.A1
