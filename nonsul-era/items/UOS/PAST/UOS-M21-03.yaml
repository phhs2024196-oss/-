      points: 10
      evidence: $\mathrm{A}\to\mathrm{E}\to\mathrm{C}$의 확률 $\dfrac{6}{32}$을 구했다.
      steps:
      - 32b-1
    - id: 3-2.M2
      mark_type: M
      points: 15
      evidence: $\mathrm{A}\to\mathrm{F}\to\mathrm{C}$의 확률 $\dfrac{10}{64}$을 구했다.
      steps:
      - 32b-2
    - id: 3-2.M3
      mark_type: M
      points: 10
      evidence: $p_{AC}=\dfrac{22}{64}$를 구하고 (a)의 $p_{BC}=\dfrac{7}{64}$를 가져왔다.
      depends_on:
      - 3-2.M1
      - 3-2.M2
      steps:
      - 32b-3
    - id: 3-2.M4
      mark_type: M
      points: 10
      evidence: 전확률로 $p_C=\dfrac{1}{2}p_{AC}+\dfrac{1}{2}p_{BC}=\dfrac{29}{128}$를 구했다.
      depends_on:
      - 3-2.M3
      steps:
      - 32b-4
    - id: 3-2.A1
      mark_type: A
      points: 15
      evidence: 조건부확률 $\dfrac{1}{2}\cdot\dfrac{p_{AC}}{p_C}=\dfrac{22}{29}$를 구했다.
      depends_on:
      - 3-2.M4
      steps:
      - 32b-5
