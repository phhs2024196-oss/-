subparts:
- id: 4-1
  stem: |
    좌표평면에서 $x$좌표와 $y$좌표가 모두 정수인 점을 격자점이라 하자. 자연수 $k$에 대하여, 아래 함수의 그래프로 둘러싸인 영역의 둘레와 내부에 있는 격자점의 개수를 $a_k$라 할 때, $\displaystyle\sum_{k=1}^{n}a_k$을 구하여라.

    $$y=-2\lvert x\rvert+3\cdot 4^k,\qquad y=\begin{cases}\dfrac{x^2}{4^k} & (x\ge 0)\\2^k\sqrt{-x} & (x<0)\end{cases}$$
  points: 115
  depends_on: []
  answer:
    kind: expression
    value: 16**(n+1)/5 + 4**(n+1)/3 + 2**(n+1) + n - 98/15
    equivalents:
    - $\dfrac{1}{5}\cdot 16^{n+1}+\dfrac{1}{3}\cdot 4^{n+1}+2^{n+1}+n-\dfrac{98}{15}$
    tolerance: null
  solutions:
  - id: S41-B
    audience: B
    method_no: 1
    steps:
    - id: 41b-1
      content: |
        주어진 함수의 그래프는 두 곡선과 꺾인 직선이 $(\pm 4^k,4^k)$에서 만나므로, 그래프로 둘러싸인 영역은 꺾인 직선 아래, 직선 $y=4^k$ 위쪽의 두 삼각형 영역 A, B와, 직선 $y=4^k$ 아래에서 곡선 위쪽의 영역 C(왼쪽), E(오른쪽)를 합친 A∪B∪C∪E이다. 영역 D는 왼쪽 곡선 $y=2^k\sqrt{-x}\ (-4^k\le x\le 0)$ 아래, $x$축 위쪽의 영역이다. 그런데 $y=2^k\sqrt{-x}\ (x<0)$는 $y=\dfrac{x^2}{4^k}\ (x>0)$의 역함수 $y=2^k\sqrt{x}\ (x>0)$의 $y$축 대칭이므로, E 내부에 있는 격자점의 개수와 D 내부에 있는 격자점의 개수는 같다.
      source_flow: 해설지 p.6 예시 답안
      criteria:
      - 4-1.M1
    - id: 41b-2
      content: |
        따라서 영역 A∪B∪C∪D(단, D의 왼쪽 경계와 아래 경계를 제외한 나머지 경계와 점 $(-4^k,4^k)$를 포함)에 있는 격자점의 개수를 $b_k$라 하고, 함수 $y=\dfrac{x^2}{4^k}\ (0\le x<4^k)$의 그래프 위에 있는 격자점의 개수를 $c_k$라 하면 $a_k=b_k+c_k$이다.
      source_flow: 해설지 p.6 예시 답안
      criteria:
      - 4-1.M2
    - id: 41b-3
      content: |
        $b_k$를 점 $(-4^k,4^k)$와 영역 A∪C∪D(D의 왼쪽 경계와 아래 경계는 제외한 나머지 경계는 포함)와 영역 B(B의 왼쪽 경계를 제외한 나머지 경계 포함)에 있는 점들로 나누어서 생각하면 $b_k=1+\displaystyle\sum_{i=0}^{4^k-1}(3\cdot 4^k-2i)+\sum_{i=1}^{4^k}(2\cdot 4^k-2i+1)=3\cdot 16^k+4^k+1$이다.
      source_flow: 해설지 p.6 예시 답안
      criteria:
      - 4-1.M3
    - id: 41b-4
      content: |
        $c_k$는 $0\le x<4^k$인 정수 중에서 $2^k$로 나누어떨어지는 정수의 개수와 같다. 즉 $c_k$는 집합 $\{x\mid 0\le x<2^k,\ x\text{는 정수}\}$의 원소의 개수이다. 따라서 $c_k=2^k$이고 $a_k=3\cdot 16^k+4^k+2^k+1$이다.
      source_flow: 해설지 p.6 예시 답안
      criteria:
      - 4-1.M4
    - id: 41b-5
      content: |
        $\displaystyle\sum_{k=1}^{n}a_k=\sum_{k=1}^{n}(3\cdot 16^k+4^k+2^k+1)=\dfrac{1}{5}\cdot 16^{n+1}+\dfrac{1}{3}\cdot 4^{n+1}+2^{n+1}+n-\dfrac{98}{15}$이다.
      source_flow: 해설지 p.6 예시 답안
      criteria:
      - 4-1.A1
