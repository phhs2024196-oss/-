stimuli: []
stem: |
  자연수 $n$에 대해여

  $$f(x)=4(\log_2 n)\cos x+4(\log_4 n)^2-12,\qquad g(x)=\begin{cases}4\sin^2 x & (\lvert x\rvert\le 2n\pi)\\-17 & (\lvert x\rvert>2n\pi)\end{cases}$$
subparts:
- id: 2-1
  stem: |
    라 하자. 두 함수 $y=f(x)$와 $y=g(x)$의 그래프의 교점의 개수를 $a_n$이라 할 때, $\displaystyle\sum_{k=1}^{2022}a_k$의 값을 구하여라.
  points: 95
  depends_on: []
  answer:
    kind: value
    value: '8161'
    equivalents: []
    tolerance: null
  solutions:
  - id: S21-B
    audience: B
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        자연수 $n$에 대해서 $\log_2 n\ge 0$이므로 $f(x)\ge 4(\log_2 n)(-1)+(\log_2 n)^2-12=(\log_2 n-2)^2-16>-17$이다. 따라서 $\lvert x\rvert>2n\pi$에서 두 함수 $y=f(x)$와 $y=g(x)$의 그래프는 만나지 않는다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 2-1.M1
    - id: 21b-2
      content: |
        $\lvert x\rvert\le 2n\pi$에서 방정식 $f(x)=g(x)$를 정리하면 $\left(\cos x+2+\dfrac{\log_2 n}{2}\right)\left(\cos x-2+\dfrac{\log_2 n}{2}\right)=0$이다. 자연수 $n$에 대하여 $-2-\dfrac{1}{2}\log_2 n\le -2$이고 $-1\le\cos x\le 1$이므로 $\cos x=2-\dfrac{1}{2}\log_2 n$이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 2-1.M2
    - id: 21b-3
      content: |
        위 방정식은 $4\le n\le 64$일 때에만 해를 가지므로, $1\le n\le 3$ 또는 $n\ge 65$이면 $a_n=0$이고 $4\le n\le 64$이면 $a_n$은 다음과 같다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 2-1.M2
    - id: 21b-4
      content: |
        (i) $n=4$일 때, $\lvert x\rvert\le 8\pi$에서 방정식 $\cos x=1$의 해의 개수는 9이므로 $a_4=9$이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 2-1.B1
    - id: 21b-5
      content: |
        (ii) $5\le n\le 63$일 때, $\lvert x\rvert\le 2n\pi$에서 방정식 $\cos x=2-\dfrac{1}{2}\log_2 n$의 해의 개수는 $4n$이므로 $a_n=4n$이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 2-1.B2
    - id: 21b-6
      content: |
        (iii) $n=64$일 때, $\lvert x\rvert\le 128\pi$에서 방정식 $\cos x=-1$의 해의 개수는 128이므로 $a_{64}=128$이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 2-1.B3
    - id: 21b-7
      content: |
        그러므로 $\displaystyle\sum_{k=1}^{2022}a_k=9+\sum_{k=5}^{63}4k+128=8161$이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 2-1.A1
