stimuli: []
stem: |
  아래와 같이 화살표 8개가 처음 4개는 위(↑)로 향하고, 나머지 4개는 아래(↓)로 향하도록 놓여있다.

  ↑ ↑ ↑ ↑ ↓ ↓ ↓ ↓

  위와 같이 놓여있는 8개의 화살표 중 2개를 임의로 선택하여 화살표의 방향을 반대로 바꾼 후, 이 8개의 화살표 중 다시 2개를 임의로 선택하여 방향을 반대로 바꾸는 시행을 하였다. 이 시행을 마쳤을 때, 위로 향하는 화살표가 4개인 사건을 $A$, 마지막 2개의 화살표가 위로 향하는 사건을 $B$라고 하자. 다음 물음에 답하여라.
subparts:
- id: 3-1
  stem: |
    (a) 확률 $\mathrm{P}(A)$를 구하여라.
  points: 50
  depends_on: []
  answer:
    kind: value
    value: 109/196
    equivalents:
    - $\dfrac{109}{196}$
    tolerance: null
  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: |
        첫 번째로 2개의 화살표를 선택하여 방향을 바꾼 후에 8개의 화살표 중 위로 향하는 화살표의 개수를 $X_1$이라 하고, 시행을 마친 후에 8개의 화살표 중 위로 향하는 화살표의 개수를 $X_2$라 하자. 그러면 $A$는 $X_2=4$인 사건이다. 사건 $A$가 일어났을 때, $X_1$이 가질 수 있는 값은 2, 4, 6이다. 따라서 $\mathrm{P}(A)=\mathrm{P}(X_2=4)=\displaystyle\sum_{k=1}^{3}\mathrm{P}(X_1=2k)\,\mathrm{P}(X_2=4\mid X_1=2k)$이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 3-1.M1
    - id: 31b-2
      content: |
        $\mathrm{P}(X_1=2)=\mathrm{P}(X_1=6)=\dfrac{{}_4\mathrm{C}_2}{{}_8\mathrm{C}_2}=\dfrac{3}{14}$, $\mathrm{P}(X_1=4)=\dfrac{{}_4\mathrm{C}_1\times{}_4\mathrm{C}_1}{{}_8\mathrm{C}_2}=\dfrac{8}{14}$이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 3-1.M2
    - id: 31b-3
      content: |
        $\mathrm{P}(X_2=4\mid X_1=2)=\mathrm{P}(X_2=4\mid X_1=6)=\dfrac{{}_6\mathrm{C}_2}{{}_8\mathrm{C}_2}=\dfrac{15}{28}$, $\mathrm{P}(X_2=4\mid X_1=4)=\dfrac{{}_4\mathrm{C}_1\times{}_4\mathrm{C}_1}{{}_8\mathrm{C}_2}=\dfrac{16}{28}$이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 3-1.M3
    - id: 31b-4
      content: |
        따라서 $\mathrm{P}(A)=\dfrac{3}{14}\cdot\dfrac{15}{28}+\dfrac{8}{14}\cdot\dfrac{16}{28}+\dfrac{3}{14}\cdot\dfrac{15}{28}=\dfrac{109}{196}$이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 3-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3-1.M1
      mark_type: M
      points: 15
      evidence: $X_1$, $X_2$를 정의하고 $X_1\in\{2,4,6\}$로 나누어 $\mathrm{P}(A)=\displaystyle\sum\mathrm{P}(X_1=2k)\mathrm{P}(X_2=4\mid X_1=2k)$의 꼴로 세웠다.
      steps:
      - 31b-1
    - id: 3-1.M2
      mark_type: M
      points: 15
      evidence: $\mathrm{P}(X_1=2)=\mathrm{P}(X_1=6)=\dfrac{3}{14}$, $\mathrm{P}(X_1=4)=\dfrac{8}{14}$을 구했다.
      steps:
      - 31b-2
    - id: 3-1.M3
      mark_type: M
      points: 10
      evidence: 조건부확률 $\dfrac{15}{28}$, $\dfrac{16}{28}$, $\dfrac{15}{28}$을 구했다.
      steps:
      - 31b-3
    - id: 3-1.A1
      mark_type: A
      points: 10
      evidence: $\mathrm{P}(A)=\dfrac{109}{196}$를 구했다.
      depends_on:
      - 3-1.M1
      - 3-1.M2
      - 3-1.M3
      steps:
      - 31b-4
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 3-2
  stem: |
    (b) 조건부 확률 $\mathrm{P}(B\mid A)$를 구하여라.
  points: 55
  depends_on:
  - 3-1
  answer:
    kind: value
    value: 9/109
    equivalents:
    - $\dfrac{9}{109}$
    tolerance: null
  solutions:
  - id: S32-B
    audience: B
    method_no: 1
    steps:
    - id: 32b-1
      content: |
        사건 $A\cap B$가 일어나기 위해서는 7, 8번째 화살표가 각각 단 한 번씩 선택되어야 하며 1~4번째 화살표 중 두 개가 선택되어야 한다. 첫 번째 선택에서 7, 8번째 화살표가 선택되어 사건 $A\cap B$가 일어나는 경우의 수는 ${}_4\mathrm{C}_2$이다. 마찬가지로 두 번째 선택에서 7, 8번째 화살표가 선택되어 사건 $A\cap B$가 일어나는 경우의 수는 ${}_4\mathrm{C}_2$이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 3-2.M1
    - id: 32b-2
      content: |
        그리고 첫 번째 선택에서 7번째 화살표가 선택되고, 두 번째 선택에서 8번째 화살표가 선택되어 사건 $A\cap B$가 일어나는 경우의 수는 ${}_4\mathrm{C}_1\times{}_3\mathrm{C}_1$이고 그 반대의 경우의 수도 ${}_4\mathrm{C}_1\times{}_3\mathrm{C}_1$이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 3-2.M1
    - id: 32b-3
      content: |
        따라서 $\mathrm{P}(A\cap B)=\dfrac{2\times{}_4\mathrm{C}_2+2\times{}_4\mathrm{C}_1\times{}_3\mathrm{C}_1}{{}_8\mathrm{C}_2\times{}_8\mathrm{C}_2}=\dfrac{9}{196}$이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 3-2.M2
    - id: 32b-4
      content: |
        (a)에서 $\mathrm{P}(A)=\dfrac{109}{196}$이므로 $\mathrm{P}(B\mid A)=\dfrac{\mathrm{P}(A\cap B)}{\mathrm{P}(A)}=\dfrac{9}{109}$이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 3-2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3-2.M1
      mark_type: M
      points: 25
      evidence: 7, 8번 화살표가 각각 한 번씩만 선택되는 경우를 분류하고 경우의 수 $2\times{}_4\mathrm{C}_2+2\times{}_4\mathrm{C}_1\times{}_3\mathrm{C}_1=36$을 구했다.
      steps:
      - 32b-1
      - 32b-2
    - id: 3-2.M2
      mark_type: M
      points: 15
      evidence: $\mathrm{P}(A\cap B)=\dfrac{36}{784}=\dfrac{9}{196}$를 구했다.
      depends_on:
      - 3-2.M1
      steps:
      - 32b-3
    - id: 3-2.A1
      mark_type: A
      points: 15
      evidence: $\mathrm{P}(B\mid A)=\dfrac{9}{109}$를 구했다.
      depends_on:
      - 3-2.M2
      steps:
      - 32b-4
