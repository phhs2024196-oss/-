    - id: 4-1.M3
      mark_type: M
      points: 20
      evidence: $f^{\prime}(x)=2\ln\left(1+\dfrac{1}{x}\right)-\dfrac{2x+1}{x^2+x}$를 구하고 $\displaystyle\lim_{x\to\infty}f^{\prime}(x)=0$을 보였다.
      steps:
      - 41b-3
    - id: 4-1.M4
      mark_type: M
      points: 30
      evidence: $f^{\prime\prime}(x)>0$으로 $f^{\prime}$이 증가함을 보이고 $f^{\prime}\le 0$이므로 $f$가 감소함을 이끌었다.
      depends_on:
