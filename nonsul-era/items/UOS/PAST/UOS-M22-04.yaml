subparts:
- id: 4-1
  stem: |
    자연수 $n$에 대하여 다음 부등식이 성립함을 보여라.

    $$e^2\le\left(1+\dfrac{1}{n}\right)^{2n+1}$$
  points: 115
  depends_on: []
  answer:
    kind: proof
    value: null
    equivalents: []
    tolerance: null
  solutions:
  - id: S41-B
    audience: B
    method_no: 1
    steps:
    - id: 41b-1
      content: |
        로그함수가 구간 $(0,\infty)$에서 증가함수이므로 자연수 $n$에 대하여 $2\le(2n+1)\ln\left(1+\dfrac{1}{n}\right)$가 성립함을 보이면 충분하다. 구간 $(0,\infty)$에서 함수 $f(x)=(2x+1)\ln\left(1+\dfrac{1}{x}\right)$라 하자.
      source_flow: 해설지 p.5 예시 답안
      criteria:
      - 4-1.M1
    - id: 41b-2
      content: |
        $\displaystyle\lim_{x\to\infty}f(x)=\lim_{x\to\infty}(2x+1)\ln\left(1+\dfrac{1}{x}\right)=\lim_{x\to\infty}2\ln\left(1+\dfrac{1}{x}\right)^{x}+\lim_{x\to\infty}\ln\left(1+\dfrac{1}{x}\right)=2$이다.
      source_flow: 해설지 p.5 예시 답안
      criteria:
      - 4-1.M2
    - id: 41b-3
      content: |
        구간 $(0,\infty)$에서 함수 $f(x)$는 미분가능하고 $f^{\prime}(x)=2\ln\left(1+\dfrac{1}{x}\right)-\dfrac{2x+1}{x^2+x}$이므로 $\displaystyle\lim_{x\to\infty}f^{\prime}(x)=0$이다.
      source_flow: 해설지 p.5 예시 답안
      criteria:
      - 4-1.M3
    - id: 41b-4
      content: |
        구간 $(0,\infty)$에서 $f^{\prime\prime}(x)=\dfrac{1}{(x^2+x)^2}>0$이므로 $f^{\prime}(x)$는 증가함수이다. 따라서 구간 $(0,\infty)$에서 $f^{\prime}(x)\le\displaystyle\lim_{t\to\infty}f^{\prime}(t)=0$이므로 $f(x)$는 감소함수이다.
      source_flow: 해설지 p.5 예시 답안
      criteria:
      - 4-1.M4
    - id: 41b-5
      content: |
        그러므로 자연수 $n$에 대하여 $f(n)\ge\displaystyle\lim_{x\to\infty}f(x)=2$이다. ■
      source_flow: 해설지 p.5 예시 답안
      criteria:
      - 4-1.R1
