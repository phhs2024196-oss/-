subparts:
- id: 1-1
  stem: |
    쌍곡선 $\dfrac{x^2}{9}-\dfrac{y^2}{16}=1$ 위의 점 $\mathrm{P}$와 이 쌍곡선의 두 초점 $\mathrm{F_1}$, $\mathrm{F_2}$에 대하여 $\dfrac{\overline{\mathrm{PF_2}}}{\overline{\mathrm{PF_1}}}=\dfrac{29}{11}$일 때, 세 점 $\mathrm{P}$, $\mathrm{F_1}$, $\mathrm{F_2}$를 지나는 이차함수의 그래프와 선분 $\overline{\mathrm{PF_2}}$로 둘러싸인 부분의 넓이를 구하여라. (단, 점 $\mathrm{P}$는 제1사분면 위의 점이다.)
  points: 85
  depends_on: []
  answer:
    kind: value
    value: 18*sqrt(7)
    equivalents:
    - $18\sqrt{7}$
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        $\dfrac{\overline{\mathrm{PF_2}}}{\overline{\mathrm{PF_1}}}=\dfrac{29}{11}>1$로부터 $\overline{\mathrm{PF_2}}>\overline{\mathrm{PF_1}}$이므로 $\mathrm{F_1}(5,0)$, $\mathrm{F_2}(-5,0)$이다. 쌍곡선의 정의에 의하여 $\overline{\mathrm{PF_2}}-\overline{\mathrm{PF_1}}=2\cdot 3=6$이므로 $\dfrac{\overline{\mathrm{PF_2}}}{\overline{\mathrm{PF_1}}}=\dfrac{29}{11}$과 연립하여 풀면 $\overline{\mathrm{PF_1}}=\dfrac{11}{3}$이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        $\overline{\mathrm{PF_1}}=\sqrt{(x-5)^2+(y-0)^2}=\dfrac{11}{3}$에서 $y^2=-x^2+10x-\dfrac{104}{9}$이고, 점 $\mathrm{P}(x,y)$는 쌍곡선 위의 점이므로 $\dfrac{x^2}{9}-\dfrac{y^2}{16}=1$로부터 $5x^2-18x-8=(5x+2)(x-4)=0$이다. 점 $\mathrm{P}$는 제1사분면 위의 점이므로 $x=4$이고 $y=\dfrac{4}{3}\sqrt{7}$이다. 따라서 점 $\mathrm{P}$의 좌표는 $\left(4,\dfrac{4}{3}\sqrt{7}\right)$이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 1-1.M2
    - id: 11b-3
      content: |
        세 점 $\mathrm{P}$, $\mathrm{F_1}$, $\mathrm{F_2}$를 지나는 이차함수는 $y=-\dfrac{4}{27}\sqrt{7}(x^2-25)$이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 1-1.M3
    - id: 11b-4
      content: |
        구하고자 하는 부분의 영역의 넓이는 $\displaystyle\int_{-5}^{4}-\dfrac{4}{27}\sqrt{7}(x^2-25)\,dx-\dfrac{1}{2}\cdot(4-(-5))\cdot\dfrac{4}{3}\sqrt{7}=18\sqrt{7}$이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 1-1.A1
