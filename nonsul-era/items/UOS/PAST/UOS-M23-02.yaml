      points: 15
      evidence: 여사건 $B$(적어도 한 번 흰 공이 나머지보다 적음)를 설정하고 첫 시행의 색으로 경우를 나누었다.
      steps:
      - 22b-1
    - id: 2-2.M2
      mark_type: M
      points: 20
      evidence: 사건 $A\cap B$가 일어나는 순열의 수 $6+6+2=14$를 구했다.
      depends_on:
      - 2-2.M1
      steps:
      - 22b-2
    - id: 2-2.A1
      mark_type: A
      points: 10
      evidence: $\mathrm{P}(A\cap B)=\dfrac{1}{60}$과 $\mathrm{P}(A\cap B^{C})=\dfrac{1}{30}$을 구했다.
      depends_on:
      - 2-2.M2
      steps:
      - 22b-3
    - id: 2-2.A2
      mark_type: A
      points: 10
      evidence: 조건부확률 $\mathrm{P}(B^{C}\mid A)=\dfrac{2}{3}$를 구했다.
      depends_on:
      - 2-2.A1
      steps:
      - 22b-4
