subparts:
- id: 3-1
  stem: |
    실수 전체의 집합에서 미분가능한 두 함수 $f(x)$와 $g(x)$가 다음 조건을 모두 만족시킬 때, $\{f(1)\}^2+\{g(1)\}^2$의 값을 구하여라.

    (1) $\displaystyle\int_0^x e^t f(t)\,dt=\dfrac{e^x\{f(x)-g(x)\}+1}{2}$

    (2) $\displaystyle\int_0^x e^t g(t)\,dt=\dfrac{e^x\{f(x)+g(x)\}-1}{2}$
  points: 105
  depends_on: []
  answer:
    kind: value
    value: '1'
    equivalents: []
    tolerance: null
  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: |
        조건 (1)과 (2)에 $x=0$을 대입하여 정리하면 $f(0)=0$이고 $g(0)=1$이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 3-1.M1
    - id: 31b-2
      content: |
        부분적분법에 의해 $\displaystyle\int_0^x e^t f(t)\,dt=e^x f(x)-\int_0^x e^t f^{\prime}(t)\,dt$이므로 조건 (1)과 (2)에 의해 $\displaystyle\int_0^x e^t f^{\prime}(t)\,dt=\dfrac{e^x\{f(x)+g(x)\}-1}{2}=\int_0^x e^t g(t)\,dt$이다. 모든 실수 $x$에 대해 $\displaystyle\int_0^x e^t\{f^{\prime}(t)-g(t)\}\,dt=0$이므로 정적분과 미분의 관계에 의해 $e^x\{f^{\prime}(x)-g(x)\}=0$이다. 따라서 모든 실수 $x$에 대해 $f^{\prime}(x)=g(x)$이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 3-1.M2
    - id: 31b-3
      content: |
        마찬가지로 $\displaystyle\int_0^x e^t g(t)\,dt=\{e^x g(x)-1\}-\int_0^x e^t g^{\prime}(t)\,dt$이므로 모든 실수 $x$에 대해 $g^{\prime}(x)=-f(x)$이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 3-1.M2
    - id: 31b-4
      content: |
        함수 $h(x)=\{f(x)\}^2+\{g(x)\}^2$라 하면, $h(x)$는 모든 실수 $x$에 대하여 미분가능하고 $h^{\prime}(x)=2f^{\prime}(x)f(x)+2g^{\prime}(x)g(x)=2g(x)f(x)-2f(x)g(x)=0$이므로 $h(x)$는 상수함수이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 3-1.M3
    - id: 31b-5
      content: |
        $f(0)=0$이고 $g(0)=1$이므로 $h(0)=\{f(0)\}^2+\{g(0)\}^2=1$이다. 따라서 모든 실수 $x$에 대해 $\{f(x)\}^2+\{g(x)\}^2=h(x)=h(0)=1$이고 $\{f(1)\}^2+\{g(1)\}^2=1$이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 3-1.A1
