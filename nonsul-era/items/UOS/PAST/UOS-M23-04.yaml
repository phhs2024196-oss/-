    - id: 4-1.M2
      mark_type: M
      points: 25
      evidence: 사인법칙으로 $\overline{\mathrm{RA}}=\dfrac{2\sin 3\theta}{\sin 4\theta}$, $\overline{\mathrm{BR}}=\dfrac{2\sin\theta}{\sin 4\theta}$를 구했다.
      steps:
      - 41b-2
    - id: 4-1.M3
      mark_type: M
      points: 20
      evidence: 삼각형 BAR의 넓이를 두 가지로 나타내 $s(\theta)=\dfrac{2\sin 3\theta\sin\theta}{\sin 4\theta+\sin\theta+\sin 3\theta}$를 구했다.
      depends_on:
      - 4-1.M2
      steps:
      - 41b-3
    - id: 4-1.M4
      mark_type: M
      points: 15
      evidence: $\overline{\mathrm{AP}}=2\cos\theta$, $\overline{\mathrm{RP}}=2\cos\theta-\overline{\mathrm{RA}}$로 $r(\theta)$를 $\theta$의 식으로 나타냈다.
      depends_on:
      - 4-1.M1
      - 4-1.M3
      steps:
      - 41b-4
    - id: 4-1.A1
      mark_type: A
      points: 30
      evidence: 삼각함수의 극한으로 $\displaystyle\lim_{\theta\to 0+}\dfrac{r(\theta)}{\theta}=\dfrac{3}{4}$을 구했다.
      depends_on:
