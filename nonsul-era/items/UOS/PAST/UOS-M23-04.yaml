subparts:
- id: 4-1
  stem: |
    그림과 같이 길이가 2인 선분 $\mathrm{AB}$를 지름으로 하는 반원이 있다. 호 $\mathrm{AB}$ 위에 두 점 $\mathrm{P}$, $\mathrm{Q}$를 $\angle\mathrm{PAB}=\theta$, $\angle\mathrm{QBA}=3\theta$가 되도록 잡고, 두 선분 $\mathrm{AP}$, $\mathrm{BQ}$의 교점을 $\mathrm{R}$이라 하자. 삼각형 $\mathrm{PQR}$의 내접원의 반지름의 길이를 $r(\theta)$라 할 때, $\displaystyle\lim_{\theta\to 0+}\dfrac{r(\theta)}{\theta}$의 값을 구하여라. (단, $0<\theta<\dfrac{\pi}{8}$이다.)

    [그림 1: 선분 AB를 지름으로 하는 반원. 호 위의 점 P, Q와 두 선분 AP, BQ의 교점 R. 각 PAB는 θ, 각 QBA는 3θ로 표시되고 삼각형 PQR에 색칠되어 있다.]
  points: 115
  depends_on: []
  answer:
    kind: value
    value: 3/4
    equivalents:
    - $\dfrac{3}{4}$
    tolerance: null
  solutions:
  - id: S41-B
    audience: B
    method_no: 1
    steps:
    - id: 41b-1
      content: |
        원주각의 성질로부터 $\angle\mathrm{PAB}=\angle\mathrm{PQB}$, $\angle\mathrm{QBA}=\angle\mathrm{QPA}$이므로 $\triangle\mathrm{BAR}$과 $\triangle\mathrm{PQR}$은 서로 닮았고, 이때 닮음비는 $\overline{\mathrm{BR}}:\overline{\mathrm{RP}}$이다. $\triangle\mathrm{BAR}$의 내접원의 반지름의 길이를 $s(\theta)$라 하면 $\triangle\mathrm{BAR}$의 넓이는 $\dfrac{s(\theta)}{2}(\overline{\mathrm{AB}}+\overline{\mathrm{BR}}+\overline{\mathrm{RA}})$이고 $\triangle\mathrm{PQR}$의 넓이는 $\dfrac{r(\theta)}{2}(\overline{\mathrm{QR}}+\overline{\mathrm{RP}}+\overline{\mathrm{PQ}})$이므로 $\dfrac{s(\theta)}{2}(\overline{\mathrm{AB}}+\overline{\mathrm{BR}}+\overline{\mathrm{RA}}):\dfrac{r(\theta)}{2}(\overline{\mathrm{QR}}+\overline{\mathrm{RP}}+\overline{\mathrm{PQ}})=\overline{\mathrm{BR}}^{2}:\overline{\mathrm{RP}}^{2}$이다. 즉 $r(\theta)=s(\theta)\dfrac{\overline{\mathrm{RP}}}{\overline{\mathrm{BR}}}$이다.
      source_flow: 해설지 p.5 예시 답안
      criteria:
      - 4-1.M1
    - id: 41b-2
      content: |
        $\triangle\mathrm{BAR}$에서 사인법칙에 의해 $\dfrac{2}{\sin(\pi-4\theta)}=\dfrac{\overline{\mathrm{RA}}}{\sin 3\theta}=\dfrac{\overline{\mathrm{BR}}}{\sin\theta}$이므로 $\overline{\mathrm{RA}}=\dfrac{2\sin 3\theta}{\sin 4\theta}$, $\overline{\mathrm{BR}}=\dfrac{2\sin\theta}{\sin 4\theta}$이다.
      source_flow: 해설지 p.5 예시 답안
      criteria:
      - 4-1.M2
    - id: 41b-3
      content: |
        $\triangle\mathrm{BAR}$의 넓이는 $\dfrac{s(\theta)}{2}(\overline{\mathrm{AB}}+\overline{\mathrm{BR}}+\overline{\mathrm{RA}})=\dfrac{1}{2}\overline{\mathrm{AB}}\,\overline{\mathrm{RA}}\sin\theta$이고 $\overline{\mathrm{AB}}=2$이므로 $s(\theta)=\dfrac{2\sin 3\theta\sin\theta}{\sin 4\theta+\sin\theta+\sin 3\theta}$이다.
      source_flow: 해설지 p.5 예시 답안
      criteria:
      - 4-1.M3
    - id: 41b-4
      content: |
        $\triangle\mathrm{ABP}$는 $\angle\mathrm{APB}$가 직각인 직각삼각형이므로 $\overline{\mathrm{AP}}=2\cos\theta$이고, $\overline{\mathrm{RP}}=\overline{\mathrm{AP}}-\overline{\mathrm{RA}}=2\cos\theta-\dfrac{2\sin 3\theta}{\sin 4\theta}$이다. 따라서 $r(\theta)=s(\theta)\dfrac{\overline{\mathrm{RP}}}{\overline{\mathrm{BR}}}=\dfrac{2\sin 3\theta\sin\theta}{\sin 4\theta+\sin\theta+\sin 3\theta}\cdot\left(2\cos\theta-\dfrac{2\sin 3\theta}{\sin 4\theta}\right)\cdot\dfrac{\sin 4\theta}{2\sin\theta}$이다.
      source_flow: 해설지 p.5 예시 답안
      criteria:
      - 4-1.M4
    - id: 41b-5
      content: |
        $\displaystyle\lim_{\theta\to 0+}\dfrac{r(\theta)}{\theta}=\lim_{\theta\to 0+}\left(2\cdot\dfrac{\sin 3\theta}{\theta}\cdot\dfrac{1}{\dfrac{\sin 4\theta}{\sin\theta}+1+\dfrac{\sin 3\theta}{\sin\theta}}\cdot\left(2\cos\theta-\dfrac{2\sin 3\theta}{\sin 4\theta}\right)\cdot\dfrac{\sin 4\theta}{2\sin\theta}\right)=\dfrac{3}{4}$이다.
      source_flow: 해설지 p.5 예시 답안
      criteria:
      - 4-1.A1
