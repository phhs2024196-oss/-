stimuli: []
stem: |
  연속함수 $f(x)$가 다음 조건을 만족시킨다.

  $$f(x+2\pi)=f(x)+\lvert\cos 3x\rvert+\left\lvert\sin\dfrac{x}{2}\right\rvert$$
subparts:
- id: 1-1
  stem: |
    자연수 $n$에 대하여 $a_n=\dfrac{(-1)^n}{2n}\displaystyle\int_0^{2n\pi}f(x)\,dx$라 할 때, $\displaystyle\sum_{n=1}^{2024}a_n$의 값을 구하여라.
  points: 85
  depends_on: []
  answer:
    kind: value
    value: '2024'
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        $g(x)=\lvert\cos 3x\rvert+\left\lvert\sin\dfrac{x}{2}\right\rvert$라 하면 $\lvert\cos 3x\rvert$의 주기는 $\dfrac{\pi}{3}$, $\left\lvert\sin\dfrac{x}{2}\right\rvert$의 주기는 $2\pi$이므로 $g$는 주기 $2\pi$인 함수이다. 따라서 $f(x+2\pi)=f(x)+g(x)$를 여러 번 적용하면 자연수 $k$에 대하여 $f(x+2k\pi)=f(x)+kg(x)$이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        $A=\displaystyle\int_0^{2\pi}f(x)\,dx$라 두면, $\displaystyle\int_0^{2\pi}g(x)\,dx=\int_0^{2\pi}\lvert\cos 3x\rvert\,dx+\int_0^{2\pi}\left\lvert\sin\dfrac{x}{2}\right\rvert dx=4+4=8$이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 1-1.B1
    - id: 11b-3
      content: |
        $\displaystyle\int_0^{2n\pi}f(x)\,dx=\sum_{k=1}^{n}\int_{2\pi(k-1)}^{2\pi k}f(x)\,dx=\sum_{k=1}^{n}\int_0^{2\pi}f(x+2\pi(k-1))\,dx=\sum_{k=1}^{n}\bigl(A+8(k-1)\bigr)=nA+4n(n-1)$이므로 $a_n=(-1)^n\left(\dfrac{A}{2}+2(n-1)\right)$이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 1-1.M2
    - id: 11b-4
      content: |
        $\displaystyle\sum_{n=1}^{2024}a_n=\sum_{n=1}^{1012}\bigl(a_{2n}+a_{2n-1}\bigr)=\sum_{n=1}^{1012}\left\{\left(\dfrac{A}{2}+2(2n-1)\right)-\left(\dfrac{A}{2}+2(2n-2)\right)\right\}=\sum_{n=1}^{1012}2=2024$이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 1-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
