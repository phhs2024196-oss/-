stem: |
  빨간 공 6개와 파란 공 4개를 서로 다른 세 상자에 나누어 넣으려고 한다. (단, 빨간 공들은 서로 구별할 수 없고 파란 공들도 서로 구별할 수 없다.)
subparts:
- id: 2-1
  stem: |
    (a) 나누어 넣는 경우의 수를 구하여라.
  points: 40
  depends_on: []
  answer:
    kind: value
    value: '420'
    equivalents: []
    tolerance: null
  solutions:
  - id: S21-B
    audience: B
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        상자 $i$에 넣은 빨간 공의 수를 $x_i$라 하면 $x_1+x_2+x_3=6$의 음이 아닌 정수해의 개수가 빨간 공을 넣는 경우의 수이므로 ${}_3\mathrm{H}_6={}_8\mathrm{C}_6=28$이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 2-1.M1
    - id: 21b-2
      content: |
        상자 $i$에 넣은 파란 공의 수를 $y_i$라 하면 $y_1+y_2+y_3=4$의 음이 아닌 정수해의 개수이므로 ${}_3\mathrm{H}_4={}_6\mathrm{C}_4=15$이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 2-1.M2
    - id: 21b-3
      content: |
        두 경우는 서로 독립이므로 구하는 경우의 수는 ${}_3\mathrm{H}_6\cdot{}_3\mathrm{H}_4=28\cdot 15=420$이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 2-1.A1
