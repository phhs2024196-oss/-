- id: 2-2
  stem: |
    (b) 모든 상자에서 빨간 공의 개수가 파란 공의 개수보다 같거나 많도록 나누어 넣는 경우의 수를 구하여라.
  points: 55
  depends_on: []
  answer:
    kind: value
    value: '90'
    equivalents: []
    tolerance: null
  solutions:
  - id: S22-B
    audience: B
    method_no: 1
    steps:
    - id: 22b-1
      content: |
        $z_i=x_i-y_i$라 하면 모든 상자에서 빨간 공이 파란 공보다 같거나 많을 조건은 $z_i\ge 0\ (i=1,2,3)$이다. 따라서 구하는 경우의 수는 $y_1+y_2+y_3=4$와 $z_1+z_2+z_3=2$를 동시에 만족시키는 음이 아닌 정수해의 개수와 같다. ($x_1+x_2+x_3=6$이므로 $z_1+z_2+z_3=6-4=2$이다.)
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 2-2.M1
    - id: 22b-2
      content: |
        첫 번째 방정식의 해의 개수는 ${}_3\mathrm{H}_4=15$, 두 번째 방정식의 해의 개수는 ${}_3\mathrm{H}_2=6$이므로 구하는 경우의 수는 ${}_3\mathrm{H}_4\cdot{}_3\mathrm{H}_2=15\cdot 6=90$이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 2-2.A1
