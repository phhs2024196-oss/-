subparts:
- id: 3-1
  stem: |
    함수 $f(t)=e^{t}\ln\left(e^{3t}-2e^{t}+e^{-t}\right)$의 정의역을 구하고, 정적분 $\displaystyle\int_{\ln 2}^{\ln 3}f(t)\,dt$의 값을 구하여라.
  points: 105
  depends_on: []
  answer:
    kind: value
    value: domain = Union(Interval.open(-oo,0),Interval.open(0,oo)); integral = 22*log(2) - 9*log(3) - 3
    equivalents:
    - 정의역 $(-\infty,0)\cup(0,\infty)$, 정적분 $22\ln 2-9\ln 3-3$
    tolerance: null
  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: |
        $t\ne 0$이면 $e^{3t}-2e^{t}+e^{-t}=e^{-t}\left(e^{4t}-2e^{2t}+1\right)=e^{-t}\left(e^{2t}-1\right)^2>0$이고, $t=0$이면 $1-2+1=0$이므로 진수가 0이다. 따라서 정의역은 $(-\infty,0)\cup(0,\infty)$이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 3-1.M1
    - id: 31b-2
      content: |
        $x=e^t$으로 치환하면 $dx=e^t\,dt$이고 $t:\ln 2\to\ln 3$일 때 $x:2\to 3$이므로 $\displaystyle\int_{\ln 2}^{\ln 3}f(t)\,dt=\int_2^3\ln\left(x^3-2x+x^{-1}\right)dx$이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 3-1.M2
    - id: 31b-3
      content: |
        $x^3-2x+x^{-1}=x^{-1}\left(x^4-2x^2+1\right)=x^{-1}(x-1)^2(x+1)^2$이므로 $\displaystyle\int_2^3\ln\left(x^3-2x+x^{-1}\right)dx=\int_2^3\left\{\ln x^{-1}+2\ln(x-1)+2\ln(x+1)\right\}dx$이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 3-1.M3
    - id: 31b-4
      content: |
        부분적분으로 $\displaystyle\int_2^3\ln x^{-1}dx=-\Bigl[x\ln x\Bigr]_2^3+\int_2^3 1\,dx=-3\ln 3+2\ln 2+1$, $\displaystyle\int_2^3\ln(x-1)\,dx=\Bigl[(x-1)\ln(x-1)\Bigr]_2^3-\int_2^3 1\,dx=2\ln 2-1$, $\displaystyle\int_2^3\ln(x+1)\,dx=\Bigl[(x+1)\ln(x+1)\Bigr]_2^3-\int_2^3 1\,dx=8\ln 2-3\ln 3-1$이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 3-1.A1
    - id: 31b-5
      content: |
        따라서 $\displaystyle\int_{\ln 2}^{\ln 3}f(t)\,dt=(-3\ln 3+2\ln 2+1)+2(2\ln 2-1)+2(8\ln 2-3\ln 3-1)=22\ln 2-9\ln 3-3$이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 3-1.A1
