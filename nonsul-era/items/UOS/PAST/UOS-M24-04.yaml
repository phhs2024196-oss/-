stimuli: []
stem: |
  쌍곡선 $\dfrac{x^2}{2}-y^2=-1$의 두 초점 $\mathrm{F_1}$, $\mathrm{F_2}$와 이 쌍곡선 위의 점 $\mathrm{P}(x,y)$에 대하여, 두 평면벡터 $\overrightarrow{\mathrm{PF_1}}$과 $\overrightarrow{\mathrm{PF_2}}$가 이루는 각의 크기를 $\theta(x)$라고 하자. (단, 점 $\mathrm{P}$는 제1사분면에 있다.)
subparts:
- id: 4-1
  stem: |
    (a) $\cos(\theta(x))=\dfrac{f(x)}{g(x)}$을 만족시키는 다항식 $f(x)$와 $g(x)$를 구하여라.
  points: 40
  depends_on: []
  answer:
    kind: expression
    value: f = 3*x**2 - 4; g = 3*x**2 + 4
    equivalents:
    - $f(x)=3x^2-4,\ g(x)=3x^2+4$
    tolerance: null
  solutions:
  - id: S41-B
    audience: B
    method_no: 1
    steps:
    - id: 41b-1
      content: |
        두 초점은 $\mathrm{F_1}=(0,\sqrt{3})$, $\mathrm{F_2}=(0,-\sqrt{3})$이고, 제1사분면 위의 점은 $\mathrm{P}\left(x,\sqrt{\dfrac{x^2}{2}+1}\right)$이므로 $\overrightarrow{\mathrm{PF_1}}=\left(-x,\,-\sqrt{\dfrac{x^2}{2}+1}+\sqrt{3}\right)$, $\overrightarrow{\mathrm{PF_2}}=\left(-x,\,-\sqrt{\dfrac{x^2}{2}+1}-\sqrt{3}\right)$이다.
      source_flow: 해설지 p.5 예시 답안
      criteria:
      - 4-1.M1
    - id: 41b-2
      content: |
        $\overrightarrow{\mathrm{PF_1}}\cdot\overrightarrow{\mathrm{PF_2}}=x^2+\left(\dfrac{x^2}{2}+1\right)-3=\dfrac{3}{2}x^2-2$이고 $\lvert\overrightarrow{\mathrm{PF_1}}\rvert\lvert\overrightarrow{\mathrm{PF_2}}\rvert=\sqrt{\left(\dfrac{3}{2}x^2+4\right)^2-12\left(\dfrac{x^2}{2}+1\right)}=\sqrt{\dfrac{9}{4}x^4+6x^2+4}=\dfrac{3}{2}x^2+2$이다.
      source_flow: 해설지 p.5 예시 답안
      criteria:
      - 4-1.M2
    - id: 41b-3
      content: |
        $\overrightarrow{\mathrm{PF_1}}\cdot\overrightarrow{\mathrm{PF_2}}=\lvert\overrightarrow{\mathrm{PF_1}}\rvert\lvert\overrightarrow{\mathrm{PF_2}}\rvert\cos(\theta(x))$로부터 $\cos(\theta(x))=\dfrac{3x^2-4}{3x^2+4}\ \cdots\cdots\ (*)$이므로 $f(x)=3x^2-4$, $g(x)=3x^2+4$로 두면 된다.
      source_flow: 해설지 p.5 예시 답안
      criteria:
      - 4-1.M2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 4-1.M1
      mark_type: M
      points: 10
      evidence: 두 초점 $(0,\pm\sqrt{3})$을 구하고 $\overrightarrow{\mathrm{PF_1}}$, $\overrightarrow{\mathrm{PF_2}}$의 성분을 구했다.
      steps:
      - 41b-1
    - id: 4-1.M2
      mark_type: M
      points: 30
      evidence: 내적과 크기의 곱을 이용해 $\cos(\theta(x))=\dfrac{3x^2-4}{3x^2+4}$를 유도했다.
      depends_on:
      - 4-1.M1
      steps:
      - 41b-2
      - 41b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 4-2
  stem: |
    (b) $\lvert\overrightarrow{\mathrm{PF_1}}\rvert+\lvert\overrightarrow{\mathrm{PF_2}}\rvert=8$을 만족시키는 $x$에 대하여, $\theta^{\prime}(x)$의 값을 구하여라.
  points: 75
  depends_on:
  - 4-1
  answer:
    kind: value
    value: -2/(5*sqrt(3))
    equivalents:
    - $-\dfrac{2}{5\sqrt{3}}$ ($x=\dfrac{\sqrt{26}}{\sqrt{3}}$일 때)
    tolerance: null
  solutions:
  - id: S42-B
    audience: B
    method_no: 1
    steps:
    - id: 42b-1
      content: |
        $\lvert\overrightarrow{\mathrm{PF_1}}\rvert+\lvert\overrightarrow{\mathrm{PF_2}}\rvert=8$이고 쌍곡선의 성질에 의해 $\lvert\overrightarrow{\mathrm{PF_2}}\rvert-\lvert\overrightarrow{\mathrm{PF_1}}\rvert=2$이므로 $\lvert\overrightarrow{\mathrm{PF_1}}\rvert=3$, $\lvert\overrightarrow{\mathrm{PF_2}}\rvert=5$이다.
      source_flow: 해설지 p.5 예시 답안
      criteria:
      - 4-2.M1
    - id: 42b-2
      content: |
        $\lvert\overrightarrow{\mathrm{PF_1}}\rvert\lvert\overrightarrow{\mathrm{PF_2}}\rvert=\dfrac{3}{2}x^2+2$로부터 $\dfrac{3}{2}x^2+2=15$이다. 점 $\mathrm{P}$가 제1사분면에 있으므로 $x=\dfrac{\sqrt{26}}{\sqrt{3}}$이다.
      source_flow: 해설지 p.5 예시 답안
      criteria:
      - 4-2.B1
    - id: 42b-3
      content: |
        $(*)$로부터 $\cos\left(\theta\left(\dfrac{\sqrt{26}}{\sqrt{3}}\right)\right)=\dfrac{11}{15}$이고 $\sin\left(\theta\left(\dfrac{\sqrt{26}}{\sqrt{3}}\right)\right)=\dfrac{2\sqrt{26}}{15}$이다. $(*)$의 양변을 $x$에 대해 미분하면 $-\sin(\theta(x))\cdot\theta^{\prime}(x)=\dfrac{48x}{(3x^2+4)^2}$이므로 $\theta^{\prime}\left(\dfrac{\sqrt{26}}{\sqrt{3}}\right)=\dfrac{-2}{5\sqrt{3}}$이다.
      source_flow: 해설지 p.5 예시 답안
      criteria:
      - 4-2.M2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 4-2.M1
      mark_type: M
      points: 15
      evidence: 쌍곡선의 성질을 이용해 $\lvert\overrightarrow{\mathrm{PF_1}}\rvert=3$, $\lvert\overrightarrow{\mathrm{PF_2}}\rvert=5$를 구했다.
      steps:
      - 42b-1
    - id: 4-2.B1
      mark_type: B
      points: 20
      evidence: 조건을 만족하는 $x=\dfrac{\sqrt{26}}{\sqrt{3}}$을 구했다.
      depends_on:
      - 4-2.M1
      steps:
      - 42b-2
    - id: 4-2.M2
      mark_type: M
      points: 40
      evidence: $(*)$의 양변을 미분하고 합성함수의 미분법으로 $\theta^{\prime}\left(\dfrac{\sqrt{26}}{\sqrt{3}}\right)=-\dfrac{2}{5\sqrt{3}}$를 계산했다.
      depends_on:
      - 4-2.B1
      steps:
      - 42b-3
