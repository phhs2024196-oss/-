stimuli: []
stem: |
  [문제 1] (85점)
  좌표공간에서 네 점 $\mathrm{A}(0,\ 0,\ 0)$, $\mathrm{B}(a,\ a,\ 0)$, $\mathrm{C}\left(\dfrac{3a}{4},\ \dfrac{a}{4},\ a\right)$, $\mathrm{D}\left(\dfrac{a}{4},\ \dfrac{3a}{4},\ a\right)$를 꼭짓점으로 하는 사면체가 있다.
subparts:
- id: 1-1
  stem: |
    이 사면체에서 두 평면 $z=0$과 $z=b$ 사이에 있는 부분의 부피를 구하여라. (단, $0\le b\le a$이다.)
  points: 85
  depends_on: []
  answer:
    kind: expression
    value: a*b**2/2-b**3/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        $z=t\ (0\le t\le b)$인 평면과 사면체가 만나서 이루어지는 단면은 $z=0$인 꼭짓점과 $z=a$인 꼭짓점을 $t:(a-t)$로 내분하는 점들로 이루어져 있으며, 이 점들은 다음과 같다. $\mathrm{P}\left(\dfrac{3t}{4},\dfrac t4,t\right)$, $\mathrm{Q}\left(\dfrac t4,\dfrac{3t}{4},t\right)$, $\mathrm{R}\left(\dfrac{3t}{4}+a-t,\dfrac t4+a-t,t\right)$, $\mathrm{S}\left(\dfrac t4+a-t,\dfrac{3t}{4}+a-t,t\right)$ 그리고 단면을 이루는 네 꼭짓점들의 $z$좌표가 서로 같으므로, $z$좌표 없이 평면 좌표의 값으로 이해할 수 있다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        $\overrightarrow{PQ}\cdot\overrightarrow{PR}=\left(-\dfrac t2,\dfrac t2\right)\cdot(a-t,\ a-t)=0$이므로 $\angle\mathrm{QPR}=\dfrac\pi2$이다. 마찬가지로 단면의 나머지 세 내각도 직각임을 보일 수 있고, 따라서 단면은 직사각형이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 1-1.M2
    - id: 11b-3
      content: |
        이 직사각형 변의 길이는 $\overline{PQ}=\overline{RS}=\sqrt{\left(-\dfrac t2\right)^2+\left(\dfrac t2\right)^2}=\dfrac{t}{\sqrt2}$, $\overline{PR}=\overline{QS}=\sqrt{(a-t)^2+(a-t)^2}=\sqrt2(a-t)$이다. 따라서 높이 $z=t$에서 단면의 면적은 $t(a-t)$이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 1-1.M3
    - id: 11b-4
      content: |
        정적분의 원리에 의하여 원하는 부분의 부피는 다음과 같다. $\displaystyle\int_0^bt(a-t)dt=\left.\dfrac{at^2}{2}-\dfrac{t^3}{3}\right|_0^b=\dfrac{ab^2}{2}-\dfrac{b^3}{3}$
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 1-1.A1
