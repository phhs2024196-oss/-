stimuli: []
stem: |
  [문제 3] (105점)
  좌표평면에서 제$1$사분면에 있는 점 $\mathrm{P}$가 점 $\mathrm{A}(-1,\ 0)$, $\mathrm{B}(1,\ 0)$을 지름의 양 끝점으로 하는 원 위에 있다. 이때, 점 $\mathrm{Q}$의 좌표를 $(-2,\ 0)$이라 하고, $\angle\mathrm{PQB}=\theta$라 하자.
subparts:
- id: 3-1
  stem: |
    선분 PQ와 선분 QB와 호 BP로 둘러싸인 도형의 넓이를 $S(\theta)$라 할 때, $\displaystyle\lim_{\theta\to0+}\dfrac{S(\theta)}{\theta}$의 값을 구하여라.
  points: 105
  depends_on: []
  answer:
    kind: value
    value: 9/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: |
        선분 PQ가 주어진 원과 만나는 제$2$사분면 점을 T, $\angle\mathrm{TOQ}=\alpha$라 하고, 점 P에서 $x$축에 내린 수선의 발을 H라 하자. 그러면 $\angle\mathrm{PTO}=\angle\mathrm{OPT}=\theta+\alpha$이므로 $\angle\mathrm{POH}=2\theta+\alpha$이고, $\overline{PH}=\sin(2\theta+\alpha)$이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 3-1.M1
    - id: 31b-2
      content: |
        $S(\theta)=\triangle\mathrm{PQO}$의 넓이$+$부채꼴 $\mathrm{OBP}$의 넓이$=\dfrac12\times\overline{QO}\times\overline{PH}+\dfrac12\times\overline{OB}^2\times\angle\mathrm{POB}=\sin(2\theta+\alpha)+\theta+\dfrac\alpha2=\sin(2\theta)\cos\alpha+\cos(2\theta)\sin\alpha+\theta+\dfrac\alpha2$이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 3-1.M2
    - id: 31b-3
      content: |
        $\triangle\mathrm{TQO}$에 사인법칙을 적용하면 $\dfrac{\overline{QT}}{\sin\alpha}=\dfrac{1}{\sin\theta}$를 얻으므로 $\sin\alpha=\overline{QT}\times\sin\theta$이다. $\dfrac{S(\theta)}{\theta}=\dfrac{\sin(2\theta)}{\theta}\times\cos\alpha+\cos(2\theta)\times\dfrac{\sin\alpha}{\theta}+1+\dfrac{\alpha}{2\theta}$이고, $\dfrac{\sin\alpha}{\theta}=\dfrac{\overline{QT}\times\sin\theta}{\theta}=\overline{QT}\times\dfrac{\sin\theta}{\theta}$, $\dfrac\alpha\theta=\dfrac{\alpha}{\sin\alpha}\times\dfrac{\sin\alpha}{\theta}=\dfrac{\alpha}{\sin\alpha}\times\overline{QT}\times\dfrac{\sin\theta}{\theta}$이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 3-1.M3
    - id: 31b-4
      content: |
        한편 $\theta\to0+$이면 $\alpha\to0+$이고 $\overline{QT}\to1$이므로, $\displaystyle\lim_{\theta\to0+}\dfrac{S(\theta)}{\theta}=2+1+1+\dfrac12=\dfrac92$이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 3-1.A1
