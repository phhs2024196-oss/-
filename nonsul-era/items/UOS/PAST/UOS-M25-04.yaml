      content: |
        $g(x)=20(a-1)x-(4+a)+(4+a)\cos x$라 하면, $\sin x\le1$이며 $a$는 $2$ 이상의 자연수이므로 $g'(x)=20(a-1)-(4+a)\sin x\ge20(a-1)-(4+a)\ge19a-24\ge14$가 성립한다.
      source_flow: 해설지 p.5 예시 답안
      criteria:
