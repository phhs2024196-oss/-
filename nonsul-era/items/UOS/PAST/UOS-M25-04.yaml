- id: 4-2
  stem: |
    (b) 다음 조건을 만족시키는 두 자연수 $a,\ b$의 순서쌍 $(a,\ b)$를 모두 구하여라. (90점)

    두 함수 $y=-b\sin x$와 $y=10(a-1)x^2-(4+a)x$의 그래프의 교점의 개수는 $1$개이다.
  points: 90
  depends_on: []
  answer:
    kind: set
    value: (1,1),(1,2),(1,3),(1,4),(1,5),(k,k+4) (k>=2)
    equivalents: []
    tolerance: null
  solutions:
  - id: S42-B
    audience: B
    method_no: 1
    steps:
    - id: 42b-1
      content: |
        (i) $a=1$인 경우: 사인함수의 개형을 활용하면, $x>0$일 때 $\sin x<x$이고 $x<0$일 때 $\sin x>x$ $\cdots$ (1)이 성립한다. 자연수 $b$가 $5$ 이하일 때, $x>0$일 때 $-b\sin x>-bx\ge-5x$이고 $x<0$일 때 $-b\sin x<-bx\le-5x$이므로, 두 함수 $y=-b\sin x$와 $y=-5x$의 그래프의 교점은 원점뿐이다. 따라서 자연수 $b$가 $5$ 이하일 때 문제의 조건을 만족한다. 한편 자연수 $b$가 $6$ 이상일 때, $y=-b\sin x$의 $0$에서의 기울기가 $-b$이므로 사인함수의 개형을 활용하면 교점이 세 개 이상임을 알 수 있다. 그러므로 조건을 만족하는 $(a,\ b)$는 $(1,1),(1,2),(1,3),(1,4),(1,5)$이다.
      source_flow: 해설지 p.5 예시 답안
      criteria:
      - 4-2.M1
    - id: 42b-2
      content: |
        (ii) $a$가 $2$ 이상의 자연수인 경우: $f(x)=10(a-1)x^2-(4+a)x+b\sin x$라 정의하면 두 함수 $y=-b\sin x$와 $y=10(a-1)x^2-(4+a)x$의 그래프의 교점의 개수는 $f(x)=0$의 해의 개수와 같다. 한편, $\displaystyle\lim_{x\to+\infty}f(x)=\lim_{x\to-\infty}f(x)=\infty$이다. 그러므로 만약 $f(k)<0$인 $k$가 존재한다면 $f(x)$의 연속성에 의해 열린구간 $(-\infty,k)$와 $(k,\infty)$에서 $f(x)=0$의 해가 각각 존재한다. 따라서 조건을 만족하는 $f(x)$는 항상 $0$보다 크거나 같다. $f(0)=0$이므로, $f(x)$는 $x=0$에서 극소이고 $f'(0)=0$이다. 이를 활용하면 $b=4+a$를 얻을 수 있고,
      source_flow: 해설지 p.5 예시 답안
      criteria:
      - 4-2.M2
    - id: 42b-3
      content: |
        따라서 $f(x)=10(a-1)x^2+(4+a)(\sin x-x)$이다. $x<0$일 때, (1)에 의해 $f(x)>0$이다. $x>0$일 때, 평균값 정리에 의해 $\dfrac{f(x)-f(0)}{x-0}=f'(c)$인 $c$가 $0$과 $x$ 사이에 존재한다. (a)에 의해 $f'(c)=g(c)>0$이다. 그러므로 $x>0$이면 $f(x)>0$이다. 따라서 조건을 만족하는 $(a,\ b)$는 $(k,\ 4+k)$이다. (단, $k$는 $2$ 이상의 자연수)
      source_flow: 해설지 p.5 예시 답안
      criteria:
      - 4-2.R1
    - id: 42b-4
      content: |
        (i), (ii)에 의해 조건을 만족하는 $(a,\ b)$는 $(1,1),(1,2),(1,3),(1,4),(1,5),(k,\ 4+k)$이다. (단, $k$는 $2$ 이상의 자연수)
      source_flow: 해설지 p.5 예시 답안
      criteria:
      - 4-2.A1
