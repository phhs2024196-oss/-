stem: |
  [문제 1] (85점)
  $1$보다 큰 실수 $a$에 대하여, 다음 조건을 만족하는 $f(x)$를 구하여라.
subparts:
- id: 1-1
  stem: |
    (1) $f(x)$는 최고차항의 계수가 $1$인 삼차식이다.
    (2) $f(0)=0,\ f(a)=a^2,\ f(a^2)=a^4$이다.
    (3) 두 곡선 $y=f(x)$와 $y=x^2$으로 둘러싸인 두 영역의 넓이가 같다.
  points: 85
  depends_on: []
  answer:
    kind: expression
    value: x**3-5*x**2+8*x
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        조건으로부터 $0,\ a,\ a^2$은 $f(x)-x^2=0$을 만족하는 서로 다른 세 개의 근이고, $f(x)$의 최고차항이 $1$이므로 $f(x)-x^2=x(x-a)(x-a^2)$이다. $f(x)$의 최고차항이 양수이고 $0<a<a^2$이므로 $y=f(x)$와 $y=x^2$로 둘러싸인 두 영역의 넓이는 각각 $\displaystyle\int_0^{a}\{f(x)-x^2\}dx$와 $\displaystyle\int_a^{a^2}\{x^2-f(x)\}dx$이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        $\displaystyle\int_0^{a}\{f(x)-x^2\}dx=\int_a^{a^2}\{x^2-f(x)\}dx$이므로 $\displaystyle\int_0^{a}\{f(x)-x^2\}dx+\int_a^{a^2}\{f(x)-x^2\}dx=\int_0^{a^2}\{f(x)-x^2\}dx=\int_0^{a^2}x(x-a)(x-a^2)dx=0$이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 1-1.M2
    - id: 11b-3
      content: |
        이를 계산하면 $\displaystyle\int_0^{a^2}x(x-a)(x-a^2)dx=\int_0^{a^2}\{x^3-(a+a^2)x^2+a^3x\}dx=\left[\dfrac14x^4-\dfrac{a+a^2}{3}x^3+\dfrac{a^3}{2}x^2\right]_0^{a^2}=\dfrac14a^8-\dfrac{a+a^2}{3}a^6+\dfrac12a^7=\dfrac{1}{12}(3a^8-4a^7-4a^8+6a^7)=\dfrac{a^7(-a+2)}{12}=0$이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 1-1.A1
    - id: 11b-4
      content: |
        따라서 $a=2$이고, $f(x)=x(x-2)(x-4)+x^2=x^3-5x^2+8x$이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 1-1.A2
