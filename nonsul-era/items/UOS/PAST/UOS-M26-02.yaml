stimuli: []
stem: |
  [문제 2] (95점)
  $1$부터 $2^n$까지의 자연수가 각각 하나씩 적힌 $2^n$개의 카드가 들어있는 상자가 있다.
subparts:
- id: 2-1
  stem: |
    이 상자에서 임의로 $3$장의 카드를 동시에 꺼냈을 때, 꺼낸 카드에 적힌 세 숫자가 공비가 $2^k$꼴($k$는 자연수)인 등비수열을 이룰 확률을 구하여라. (단, $n$은 $2$ 이상의 자연수이다.)
  points: 95
  depends_on: []
  answer:
    kind: expression
    value: even=1/(2**n*(2**(n-1)-1)); odd=1/(2**(n-1)*(2**n-1))
    equivalents: []
    tolerance: null
  solutions:
  - id: S21-B
    audience: B
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        이 상자에서 임의로 $3$장의 카드를 동시에 꺼냈을 때, 가능한 모든 경우의 수는 ${}_{2^n}\mathrm{C}_{3}=\dfrac{2^n(2^n-1)(2^n-2)}{6}$이다. 한편, 꺼낸 카드 $3$장에 적힌 세 숫자가 등비수열일 때 초항이 $a$이고 공비가 $2^k$이면, 세 숫자는 $a,\ 2^ka,\ 2^{2k}a$이다. 상자 안의 카드에는 각각 $1$부터 $2^n$까지의 자연수가 적혀 있으므로 $a\ge1$이고 $2^{2k}a\le2^n$, 즉, $1\le a\le2^{n-2k}$이다. 따라서 꺼낸 $3$장의 카드에 적힌 세 숫자가 공비가 $2^k$인 등비수열을 이루는 경우의 수는 $2^{n-2k}$이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 2-1.M1
    - id: 21b-2
      content: |
        (i) $n$이 $2$ 이상의 짝수인 경우
        $n$을 어떤 자연수 $m$에 대하여 $n=2m$으로 나타낼 수 있다. 이때, $2k\le n=2m$, 즉, $1\le k\le m$이어야 한다. 따라서 문제의 조건을 만족하는 경우의 수는 $\displaystyle\sum_{k=1}^{m}2^{n-2k}=\sum_{k=1}^{m}2^{2m-2k}=\dfrac{4^m-1}{3}=\dfrac{2^n-1}{3}$이고, 구하는 확률은 $\dfrac{\dfrac{2^n-1}{3}}{\dfrac{2^n(2^n-1)(2^n-2)}{6}}=\dfrac{2}{2^n(2^n-2)}=\dfrac{1}{2^n(2^{n-1}-1)}$이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 2-1.M2
      - 2-1.A1
    - id: 21b-3
      content: |
        (ii) $n$이 $2$ 이상의 홀수인 경우
        $n$을 어떤 자연수 $m$에 대하여 $n=2m+1$로 나타낼 수 있다. 이때, $2k\le n=2m+1$, 즉, $1\le k\le m+\dfrac12$이어야 한다. 따라서 문제의 조건을 만족하는 경우의 수는 $\displaystyle\sum_{k=1}^{m}2^{n-2k}=\sum_{k=1}^{m}2^{2m+1-2k}=\dfrac{2(4^m-1)}{3}=\dfrac{2(2^{n-1}-1)}{3}$이고, 구하는 확률은 $\dfrac{\dfrac{2(2^{n-1}-1)}{3}}{\dfrac{2^n(2^n-1)(2^n-2)}{6}}=\dfrac{4(2^{n-1}-1)}{2^n(2^n-1)(2^n-2)}=\dfrac{1}{2^{n-1}(2^n-1)}$이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 2-1.M2
      - 2-1.A2
