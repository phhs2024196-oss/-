stimuli: []
stem: |
  [문제 3] (105점)
  자연수 $n$에 대하여
  $a_n=\left\{n\ln n-2\ln\dfrac{(2n)!}{n!}\right\}\times\ln n,\quad b_n=\displaystyle\sum_{k=n+1}^{2n}(\ln k)^2$
subparts:
- id: 3-1
  stem: |
    이라 할 때, $\displaystyle\lim_{n\to\infty}\left(\dfrac{a_n+b_n}{n}\right)$의 값을 구하여라.
  points: 105
  depends_on: []
  answer:
    kind: expression
    value: 2*log(2)**2-4*log(2)+2
    equivalents: []
    tolerance: null
  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: |
        자연수 $n$에 대하여 자연로그의 성질을 이용하면 $a_n=n(\ln n)^2-2\ln n\displaystyle\sum_{k=n+1}^{2n}\ln k=\sum_{k=n+1}^{2n}\{(\ln n)^2-2(\ln n)(\ln k)\}$이므로,
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 3-1.M1
    - id: 31b-2
      content: |
        $a_n+b_n=\displaystyle\sum_{k=n+1}^{2n}(\ln k-\ln n)^2=\sum_{k=n+1}^{2n}\left\{\ln\left(\dfrac kn\right)\right\}^2=\sum_{k=1}^{n}\left\{\ln\left(1+\dfrac kn\right)\right\}^2$이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 3-1.M2
    - id: 31b-3
      content: |
        정적분과 급수의 합 사이의 관계로부터 $\displaystyle\lim_{n\to\infty}\left(\dfrac{a_n+b_n}{n}\right)=\lim_{n\to\infty}\dfrac1n\sum_{k=1}^{n}\left\{\ln\left(1+\dfrac kn\right)\right\}^2=\int_0^1\{\ln(1+x)\}^2dx$이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 3-1.M3
    - id: 31b-4
      content: |
        한편 부분적분법을 이용하면 $\displaystyle\int_0^1\{\ln(1+x)\}^2dx=\int_1^2(\ln x)^2dx=\left[x(\ln x)^2\right]_1^2-\int_1^2\left(x\times\dfrac{2\ln x}{x}\right)dx=2(\ln2)^2-2\int_1^2\ln x\,dx$이고 $\displaystyle\int_1^2\ln x\,dx=\left[x\ln x-x\right]_1^2=(2\ln2-2)-(-1)=2\ln2-1$이므로 $\displaystyle\int_0^1\{\ln(1+x)\}^2dx=2(\ln2)^2-4\ln2+2$이다. 따라서 $\displaystyle\lim_{n\to\infty}\left(\dfrac{a_n+b_n}{n}\right)=\int_0^1\{\ln(1+x)\}^2dx=2(\ln2)^2-4\ln2+2$이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 3-1.A1
