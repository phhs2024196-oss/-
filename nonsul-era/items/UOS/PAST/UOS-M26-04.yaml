stimuli: []
stem: |
  [문제 4] (115점)
  한 변의 길이가 $2$인 정삼각형 ABC에 타원이 세 점에서 접하고 있다. 타원의 장축은 선분 BC와 평행하고, 장축의 길이는 $\sqrt2$이다. 두 선분 AB, AC 위에 있는 접점을 각각 P, Q라 하고, 타원의 중심을 O라 하자.
subparts:
- id: 4-1
  stem: |
    세 점 P, O, Q를 지나는 포물선이 정삼각형 ABC를 나눈 두 영역의 넓이 중에서 작은 값을 구하여라.
  points: 115
  depends_on: []
  answer:
    kind: value
    value: 13*sqrt(3)/27
    equivalents: []
    tolerance: null
  solutions:
  - id: S41-B
    audience: B
    method_no: 1
    steps:
    - id: 41b-1
      content: |
        장축의 길이가 $\sqrt2$이므로 $a=\dfrac{\sqrt2}{2}$, 단축의 길이를 $2b$, 타원의 중심을 원점으로 하여 평면좌표를 도입하면 $\mathrm{O}(0,0)$, $\mathrm{A}(0,\sqrt3-b)$, $\mathrm{B}(-1,-b)$, $\mathrm{C}(1,-b)$이고 타원의 방정식은 $\dfrac{x^2}{a^2}+\dfrac{y^2}{b^2}=1$이다.
      source_flow: 해설지 p.5 예시 답안
      criteria:
      - 4-1.M1
    - id: 41b-2
      content: |
        접점 Q의 좌표를 $(x_1,y_1)$이라 하면 Q에서의 접선의 방정식 $\dfrac{x_1x}{a^2}+\dfrac{y_1y}{b^2}=1$은 직선 AC의 방정식 $y=-\sqrt3x+\sqrt3-b$와 일치한다. 그러므로 $x_1=\dfrac{\sqrt3a^2}{\sqrt3-b}=\dfrac{\sqrt3}{2(\sqrt3-b)}$, $y_1=\dfrac{b^2}{\sqrt3-b}$이다. 점 Q는 타원 위의 점이므로 $\dfrac{x_1^2}{a^2}+\dfrac{y_1^2}{b^2}=1$이다. 따라서, $b=\dfrac{\sqrt3}{4}$이다. 이때, $x_1=\dfrac23$, $y_1=\dfrac{\sqrt3}{12}$이다. 도형이 $y$축에 대하여 대칭이므로 $\mathrm{P}\left(-\dfrac23,\dfrac{\sqrt3}{12}\right)$이다.
      source_flow: 해설지 p.5 예시 답안
      criteria:
      - 4-1.M2
    - id: 41b-3
      content: |
        세 점 P, O, Q를 지나는 포물선의 방정식은 $y=\dfrac{3\sqrt3}{16}x^2$이다.
      source_flow: 해설지 p.5 예시 답안
      criteria:
      - 4-1.M3
    - id: 41b-4
      content: |
        포물선 위에 있는 삼각형 내부의 넓이 $S$는 삼각형 APQ의 넓이 $\dfrac12\times\dfrac43\times\dfrac{2\sqrt3}{3}=\dfrac{4\sqrt3}{9}$과 직선 PQ와 포물선으로 둘러싸인 영역의 넓이 $\displaystyle\int_{-\frac23}^{\frac23}\left(\dfrac{\sqrt3}{12}-\dfrac{3\sqrt3}{16}x^2\right)dx=\dfrac{2\sqrt3}{27}$의 합이다. 그러므로 $S=\dfrac{14\sqrt3}{27}$이다. 삼각형 ABC의 넓이는 $\sqrt3$이므로 포물선 아래에 있는 삼각형 내부의 넓이는 $\sqrt3-S=\dfrac{13\sqrt3}{27}$이다. 그러므로 두 영역의 넓이 중에서 작은 값은 $\dfrac{13\sqrt3}{27}$이다.
      source_flow: 해설지 p.5 예시 답안
      criteria:
      - 4-1.A1
