stimuli: []
stem: |
  [문제 1] (총 85점)
  실수 $a$에 대하여 함수 $f(x)$를
  $f(x)=3^{3x}+3^{-3x}-3(3^{2x}+3^{-2x})-2(3^{1+x}+3^{1-x})+a\quad(x\ge0)$
  라 할 때, 다음 물음에 답하여라.
subparts:
- id: 1-1
  stem: |
    (a) 함수 $f(x)$가 최소가 되도록 하는 $x$의 값을 모두 구하여라. (30점)
  points: 30
  depends_on: []
  answer:
    kind: value
    value: log((3+sqrt(5))/2)/log(3)
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        $3^x+3^{-x}=t$로 치환하면 $t\ge2$이고, 함수 $f(x)=h(t)=t^3-3t^2-9t+6+a$이다. (이는 $3^{3x}+3^{-3x}=t^3-3t$, $3^{2x}+3^{-2x}=t^2-2$, $3^{1+x}+3^{1-x}=3t$로부터 얻는다.)
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        이때 $h'(t)=3(t-3)(t+1)$이고, 함수 $h(t)$의 증가와 감소를 나타내면 $t=2$에서 $h(2)=a-16$, $2<t<3$에서 $h'(t)<0$이므로 감소, $t=3$에서 $h'(3)=0$이고 $h(3)=a-21$, $t>3$에서 $h'(t)>0$이므로 증가이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 1-1.M1
    - id: 11b-3
      content: |
        따라서 $h(t)$는 $t=3$에서 최솟값 $a-21$을 갖는다. 이때 $x$는 $3^x+3^{-x}=3$을 만족해야 하므로 $x=\log_3\left(\dfrac{3+\sqrt5}{2}\right)$이다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 1-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 15
      evidence: 치환 $t=3^x+3^{-x}$ $(t\ge2)$로 $f(x)=h(t)=t^3-3t^2-9t+6+a$를 얻고 증감을 조사했다.
      steps:
      - 11b-1
      - 11b-2
    - id: 1-1.A1
      mark_type: A
      points: 15
      evidence: $t=3$에서 최소임을 보이고 $3^x+3^{-x}=3$에서 $x=\log_3\dfrac{3+\sqrt5}{2}$를 구했다.
      depends_on:
      - 1-1.M1
      steps:
      - 11b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 1-2
  stem: |
    (b) 함수 $y=f(x)$의 그래프가 $x$축과 한 점에서만 만나도록 하는 $a$의 값을 모두 구하여라. (55점)
  points: 55
  depends_on: []
  answer:
    kind: set
    value: a<16 or a=21
    equivalents: []
    tolerance: null
  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        $x>0$일 때 $\dfrac{dt}{dx}=3^x\ln3-3^{-x}\ln3=(3^x-3^{-x})\ln3>0$이므로, $t=3^x+3^{-x}$는 $x\ge0$에서 증가한다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: |
        함수 $y=h(t)$의 그래프가 $t$축과 한 점에서만 만나기 위해서는 $a<16$이거나 $a=21$이어야 한다. 따라서 함수 $y=f(x)$의 그래프가 $x$축과 한 점에서만 만나려면 $a<16$이거나 $a=21$이어야 한다.
      source_flow: 해설지 p.2 예시 답안
      criteria:
      - 1-2.A1
