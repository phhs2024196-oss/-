  misconceptions: []
- id: 2-2
  stem: |
    (b) $\angle\mathrm{QPR}$가 직각이 되는 점 P를 모두 구하여라. (25점)
  points: 25
  depends_on: []
  answer:
    kind: set
    value: alpha=-1
    equivalents: []
    tolerance: null
  solutions:
  - id: S22-B
    audience: B
    method_no: 1
    steps:
    - id: 22b-1
      content: |
        $\angle\mathrm{QPR}$가 직각이 되기 위해서는 $\overrightarrow{PQ}\cdot\overrightarrow{PR}=0$이어야 한다. (a)에 의하여 $\overrightarrow{PQ}\cdot\overrightarrow{PR}=4\alpha^2+(4-\beta^2)\alpha-\beta^2=(\alpha+1)(4\alpha-\beta^2)=0$이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 2-2.M1
    - id: 22b-2
      content: |
        (a)의 답안에서 $\beta^2-4\alpha>0$이므로 $\alpha=-1$이다. 따라서 정답은 직선 $x=-1$ 위의 모든 점이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 2-2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2-2.M1
      mark_type: M
      points: 10
      evidence: 직각 조건을 내적 $=0$으로 바꾸고 $(\alpha+1)(4\alpha-\beta^2)=0$으로 인수분해했다.
      steps:
      - 22b-1
    - id: 2-2.A1
      mark_type: A
      points: 15
      evidence: $\beta^2-4\alpha>0$을 이용해 $\alpha=-1$, 즉 직선 $x=-1$ 위의 모든 점을 구했다.
      depends_on:
      - 2-2.M1
      steps:
      - 22b-2
