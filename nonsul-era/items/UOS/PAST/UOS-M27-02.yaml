stimuli: []
stem: |
  [문제 2] (총 95점)
  점 $\mathrm{P}(\alpha,\beta)$를 지나는 두 직선이 포물선 $y^2=4x$ 위의 서로 다른 두 점 Q, R에서 각각 접한다.
subparts:
- id: 2-1
  stem: |
    (a) 두 벡터 $\overrightarrow{PQ}$와 $\overrightarrow{PR}$의 내적을 $\alpha$와 $\beta$에 대한 식으로 표현하여라. (70점)
  points: 70
  depends_on: []
  answer:
    kind: expression
    value: 4*alpha**2+4*alpha-alpha*beta**2-beta**2
    equivalents: []
    tolerance: null
  solutions:
  - id: S21-B
    audience: B
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        점 $\mathrm{P}(\alpha,\beta)$를 지나는 직선 $y=mx+\beta-m\alpha$가 포물선과 접한다고 하자. 이 접선의 방정식을 포물선의 방정식에 대입하여 얻은 이차방정식 $m^2x^2+2\{m(\beta-\alpha m)-2\}x+(\beta-\alpha m)^2=0$의 판별식이 $0$이어야 하므로 $\alpha m^2-\beta m+1=0$이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 2-1.M1
    - id: 21b-2
      content: |
        점 P를 지나며 서로 다른 두 점에서 각각 접하는 두 접선의 기울기는 서로 달라야 하므로 이 $m$에 관한 이차방정식은 서로 다른 두 실근을 가져야 한다. 따라서 $\beta^2-4\alpha>0$이어야 한다. 또한 두 접선의 기울기 $m_1$과 $m_2$는 $m_1m_2=\dfrac1\alpha$과 $m_1+m_2=\dfrac\beta\alpha$를 만족한다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 2-1.M1
    - id: 21b-3
      content: |
        포물선 위의 점 $(x_1,y_1)$에서 접선의 기울기는 $\dfrac{2}{y_1}$이므로 두 접점은 $\mathrm{Q}\left(\dfrac{1}{m_1^2},\dfrac{2}{m_1}\right)$와 $\mathrm{R}\left(\dfrac{1}{m_2^2},\dfrac{2}{m_2}\right)$이고
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 2-1.M2
    - id: 21b-4
      content: |
        $\overrightarrow{PQ}\cdot\overrightarrow{PR}=\left(\dfrac{1}{m_1^2}-\alpha,\dfrac{2}{m_1}-\beta\right)\cdot\left(\dfrac{1}{m_2^2}-\alpha,\dfrac{2}{m_2}-\beta\right)=4\alpha^2+4\alpha-\alpha\beta^2-\beta^2$이다.
      source_flow: 해설지 p.3 예시 답안
      criteria:
      - 2-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2-1.M1
      mark_type: M
      points: 25
      evidence: 접선 조건에서 $m$에 관한 이차방정식 $\alpha m^2-\beta m+1=0$을 얻고, 서로 다른 두 실근 조건 $\beta^2-4\alpha>0$과
        근과 계수의 관계를 썼다.
      steps:
      - 21b-1
      - 21b-2
    - id: 2-1.M2
      mark_type: M
      points: 20
      evidence: 접점 Q, R의 좌표를 $m_1,m_2$로 나타냈다.
      steps:
      - 21b-3
    - id: 2-1.A1
      mark_type: A
      points: 25
      evidence: 내적을 $4\alpha^2+4\alpha-\alpha\beta^2-\beta^2$으로 구했다.
      depends_on:
      - 2-1.M1
      - 2-1.M2
      steps:
      - 21b-4
  outcome_codes:
  - code: '20'
