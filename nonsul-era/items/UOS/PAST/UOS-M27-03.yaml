  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: |
        함수 $f(x)=\cos x-1+\dfrac{x^2}{2}$의 그래프는 $y$축 대칭이므로 $x\ge0$일 때 $f(x)\ge0$임을 보이면 된다. $f'(x)=-\sin x+x$이고 $f''(x)=-\cos x+1\ge0$이므로, $f'(0)=0$이며 $f'(x)$는 $x\ge0$일 때 증가하므로 $f'(x)\ge0$이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 3-1.M1
    - id: 31b-2
      content: |
        그러므로 $x\ge0$일 때 $f(x)$는 증가한다. $f(0)=0$이므로 $f(x)\ge0$이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 3-1.R1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
