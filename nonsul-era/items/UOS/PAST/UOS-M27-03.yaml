      evidence: $f(x)=\cos x-1+\dfrac{x^2}{2}$를 두고 우함수임을 이용해 $x\ge0$으로 줄였으며 $f'$, $f''$을 구했다.
      steps:
      - 31b-1
    - id: 3-1.R1
