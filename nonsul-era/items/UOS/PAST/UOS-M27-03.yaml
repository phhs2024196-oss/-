- id: 3-2
  stem: |
    (b) 곡선 $y=\cos x\ \left(-\dfrac{\pi}{2}\le x\le\dfrac{\pi}{2}\right)$와 $x$축으로 둘러싸인 영역(경계 포함)을 $S$라 하자. 영역 $S$에 포함되는 원의 반지름의 길이의 최댓값을 구하여라. (70점)
  points: 70
  depends_on: []
  answer:
    kind: value
    value: 1/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S32-B
    audience: B
    method_no: 1
    steps:
    - id: 32b-1
      content: |
        원 $x^2+\left(y-\dfrac12\right)^2=\dfrac14$이 곡선 $y=\cos x$와 직선 $y=0$에 동시에 접하면서 최대의 반지름을 갖는다. 따라서 $-\dfrac12\le x\le\dfrac12$일 때 $\cos x\ge\dfrac12+\sqrt{\dfrac14-x^2}$임을 보이면 반지름의 최댓값이 $\dfrac12$이 된다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 3-2.M1
    - id: 32b-2
      content: |
        이 원이 영역 $S$에 포함됨을 보이자. (a)에 의해서 모든 실수 $x$에 대하여 $\cos x\ge1-\dfrac{x^2}{2}$이므로, $-\dfrac12\le x\le\dfrac12$일 때 $\dfrac12+\sqrt{\dfrac14-x^2}\le1-\dfrac{x^2}{2}$임을 보이면 된다. 이는 $\dfrac12+\sqrt{\dfrac14-x^2}\le1-\dfrac{x^2}{2}\iff\sqrt{\dfrac14-x^2}\le\dfrac12-\dfrac{x^2}{2}$와 같다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 3-2.M2
    - id: 32b-3
      content: |
        $-\dfrac12\le x\le\dfrac12$일 때 $\left(\dfrac12-\dfrac{x^2}{2}\right)^2-\left(\sqrt{\dfrac14-x^2}\right)^2=\dfrac{x^4+2x^2}{4}\ge0$이므로 $\dfrac12+\sqrt{\dfrac14-x^2}\le1-\dfrac{x^2}{2}\le\cos x$이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 3-2.A1
    - id: 32b-4
      content: |
        따라서 구하는 반지름의 길이의 최댓값은 $\dfrac12$이다.
      source_flow: 해설지 p.4 예시 답안
      criteria:
      - 3-2.A1
