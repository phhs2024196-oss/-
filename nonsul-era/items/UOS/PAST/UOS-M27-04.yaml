stimuli: []
stem: |
  [문제 4] (총 115점)
  $4$ 이상의 자연수 $n$에 대하여 $1,\ 2,\ \cdots,\ n$ 중 서로 다른 네 수를 임의로 선택한 후, 두 개씩 두 묶음으로 나누어 각 묶음의 합을 서로 같게 만들 수 있을 때, 이 선택을 균형 선택이라고 하자.
subparts:
- id: 4-1
  stem: |
    (a) 네 수를 임의로 고르는 선택이 균형 선택일 확률을 구하여라. (55점)
  points: 55
  depends_on: []
  answer:
    kind: expression
    value: even=(2*n-5)/((n-1)*(n-3)); odd=(2*n-1)/(n*(n-2))
    equivalents: []
    tolerance: null
  solutions:
  - id: S41-B
    audience: B
    method_no: 1
    steps:
    - id: 41b-1
      content: |
        선택된 네 수를 $a,b,c,d$ $(a<b<c<d)$라 하자. 이 선택이 균형 선택이려면 $a+d=b+c$이어야 한다. 이때 $b-a=d-c=l$이라 하면 네 수는 $a,\ a+l,\ c,\ c+l$이므로, $a+l<c$, $c+l\le n$이다. 즉, $1\le a<c-l\le n-2l$이다. 이 경우는 $1,2,\cdots,(n-2l)$ 중에서 서로 다른 두 수를 골라 작은 수를 $a$로, 큰 수를 $(c-l)$로 정한 경우와 같다. 따라서 경우의 수는 ${}_{n-2l}\mathrm{C}_{2}$이다. (단, $n-2l\ge2$이다.)
      source_flow: 해설지 p.5 예시 답안
      criteria:
      - 4-1.M1
      - 4-1.M2
    - id: 41b-2
      content: |
        (i) $n=2k$($k$는 $2$ 이상의 자연수)인 경우, 균형 선택의 개수는 $\displaystyle\sum_{l=1}^{k-1}{}_{2k-2l}\mathrm{C}_{2}=\sum_{j=1}^{k-1}{}_{2j}\mathrm{C}_{2}=\sum_{j=1}^{k-1}j(2j-1)=\dfrac{(k-1)k(4k-5)}{6}$이다. 전체 경우의 수는 ${}_{2k}\mathrm{C}_{4}$이므로, 균형 선택일 확률은 $\dfrac{\dfrac{(k-1)k(4k-5)}{6}}{{}_{2k}\mathrm{C}_{4}}=\dfrac{4k-5}{(2k-1)(2k-3)}=\dfrac{2n-5}{(n-1)(n-3)}$이다.
      source_flow: 해설지 p.5 예시 답안
      criteria:
      - 4-1.A1
    - id: 41b-3
      content: |
        (ii) $n=2k+1$($k$는 $2$ 이상의 자연수)인 경우, 균형 선택의 개수는 $\displaystyle\sum_{l=1}^{k-1}{}_{2k+1-2l}\mathrm{C}_{2}=\sum_{j=1}^{k-1}{}_{2j+1}\mathrm{C}_{2}=\sum_{j=1}^{k-1}j(2j+1)=\dfrac{(k-1)k(4k+1)}{6}$이다. 전체 경우의 수는 ${}_{2k+1}\mathrm{C}_{4}$이므로, 균형 선택일 확률은 $\dfrac{\dfrac{(k-1)k(4k+1)}{6}}{{}_{2k+1}\mathrm{C}_{4}}=\dfrac{4k+1}{(2k+1)(2k-1)}=\dfrac{2n-1}{n(n-2)}$이다.
      source_flow: 해설지 p.5 예시 답안
      criteria:
      - 4-1.A1
