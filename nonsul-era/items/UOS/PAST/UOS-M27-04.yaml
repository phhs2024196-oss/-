- id: 4-2
  stem: |
    (b) 네 수를 임의로 고르는 선택이 균형 선택인 경우, 그 네 수 중에서 두 번째로 작은 수와 세 번째로 작은 수가 연속한 자연수일 확률을 구하여라. (60점)
  points: 60
  depends_on: []
  answer:
    kind: expression
    value: even=6*(n-2)/(n*(2*n-5)); odd=6/(2*n-1)
    equivalents: []
    tolerance: null
  solutions:
  - id: S42-B
    audience: B
    method_no: 1
    steps:
    - id: 42b-1
      content: |
        문제의 조건은 $c=b+1$이므로, 균형 선택인 네 수는 $a,\ a+l,\ a+l+1,\ a+2l+1$이다. $1\le a<a+2l+1\le n$이므로, $1\le a\le n-2l-1$이다. 따라서 가능한 경우의 수는 $(n-2l-1)$이다. (단, $n-2l-1\ge1$이다.)
      source_flow: 해설지 p.5 예시 답안
      criteria:
      - 4-2.M1
      - 4-2.M2
    - id: 42b-2
      content: |
        (i) $n=2k$($k$는 $2$ 이상의 자연수)인 경우, $c=b+1$인 균형 선택의 개수는 $\displaystyle\sum_{l=1}^{k-1}(2k-2l-1)=(k-1)^2$이다. 따라서 구하는 확률은 $\dfrac{(k-1)^2}{\dfrac{(k-1)k(4k-5)}{6}}=\dfrac{6(k-1)}{k(4k-5)}=\dfrac{6(n-2)}{n(2n-5)}$이다.
      source_flow: 해설지 p.5 예시 답안
      criteria:
      - 4-2.A1
    - id: 42b-3
      content: |
        (ii) $n=2k+1$($k$는 $2$ 이상의 자연수)인 경우, $c=b+1$인 균형 선택의 개수는 $\displaystyle\sum_{l=1}^{k-1}(2k-2l)=k(k-1)$이다. 따라서 구하는 확률은 $\dfrac{k(k-1)}{\dfrac{(k-1)k(4k+1)}{6}}=\dfrac{6}{4k+1}=\dfrac{6}{2n-1}$이다.
      source_flow: 해설지 p.5 예시 답안
      criteria:
      - 4-2.A1
