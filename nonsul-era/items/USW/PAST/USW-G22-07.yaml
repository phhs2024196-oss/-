stem: 방정식 $4^{x+2}=\left(\dfrac14\right)^{-x}+30$ 의 해를 구하는 과정을 논술하시오.
subparts:
- id: '1'
  stem: 답과 풀이
  points: 10
  depends_on: []
  answer:
    kind: value
    value: x=1/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    source_flow: G22_A.pdf p.19 모범답안
    method_no: 1
    steps:
    - id: 1b-1
      content: $4^{x+2}=16\times4^x$, $\left(\dfrac14\right)^{-x}=\left(4^{-1}\right)^{-x}=4^x$이므로 준 식은 $16\times4^x=4^x+30$이다. 즉 $(16-1)\times4^x=30$이므로 $15\times4^x=30$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: $4^x=2$이므로 $2^{2x}=2$(또는 $x\log4=\log2$)이다. 그러므로 $x=\dfrac12$(또는 $x=\log_42$)이다.
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
