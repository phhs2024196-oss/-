stem: |-
  (단답형 문제) 다음은 반지름의 길이가 $\sqrt3$인 원에 내접하는 삼각형 ABC에서
  $$3\sin(A+B)\sin C=2$$
  일 때, 선분 AB의 길이를 구하는 과정을 논술한 것입니다. 빈칸 ①, ②, ③을 채우시오.

  [풀이 과정 상자] 삼각형의 내각의 합 $A+B+C=\pi$이므로 $3\sin(A+B)\sin C=3\sin(\pi-C)\sin C=2$인데, $0<C<\pi$이므로 $\sin C=\boxed{\ ①\ }$이다. 외접원의 반지름의 길이가 $\sqrt3$이므로 사인법칙에 의하여 $\dfrac{\overline{AB}}{\sin C}=\boxed{\ ②\ }$이므로 $\overline{AB}=\sin C\times\boxed{\ ②\ }=\boxed{\ ③\ }$.
subparts:
- id: '1'
  stem: 빈칸 채우기
  points: 10
  depends_on: []
  answer:
    kind: value
    value: c1=sqrt(2/3); c2=2*sqrt(3); c3=2*sqrt(2)
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    source_flow: G22_A.pdf p.21 모범답안
    method_no: 1
    steps:
    - id: 1b-1
      content: $3\sin(A+B)\sin C=3\sin(\pi-C)\sin C=3\sin^2C=2$이므로 $\sin^2C=\dfrac23$. $0<C<\pi$이므로 $\sin C=\sqrt{\dfrac23}$(또는 $\dfrac{\sqrt2}{\sqrt3}$, $\dfrac{\sqrt6}{3}$). (① $\sqrt{\dfrac23}$)
      criteria:
      - 1.A1
    - id: 1b-2
      content: 외접원의 반지름이 $\sqrt3$이므로 사인법칙에 의하여 $\dfrac{\overline{AB}}{\sin C}=2\sqrt3$. (② $2\sqrt3$)
      criteria:
      - 1.A2
    - id: 1b-3
      content: $\overline{AB}=2\sqrt3\times\sin C=2\sqrt3\times\sqrt{\dfrac23}=2\sqrt2$. (③ $2\sqrt2$)
      criteria:
      - 1.A3
