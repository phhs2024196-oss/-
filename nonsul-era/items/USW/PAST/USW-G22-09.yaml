stem: 첫째항이 $3$이고 공차가 $4$인 등차수열 $\{a_n\}$에 대하여, $\displaystyle\sum_{n=1}^{32}\dfrac{1}{(a_n-1)(a_{n+1}-1)}$의 값을 구하는 과정을 논술하시오.
subparts:
- id: '1'
  stem: 답과 풀이
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 8/65
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    source_flow: G22_A.pdf p.23 모범답안
    method_no: 1
    steps:
    - id: 1b-1
      content: 일반항은 $a_n=4n-1$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: $\dfrac{1}{(a_n-1)(a_{n+1}-1)}=\dfrac{1}{(4n-2)(4n+2)}=\dfrac14\left(\dfrac1{4n-2}-\dfrac1{4n+2}\right)$
      criteria:
      - 1.M2
    - id: 1b-3
      content: $\displaystyle\sum_{n=1}^{32}\dfrac14\left(\dfrac1{4n-2}-\dfrac1{4n+2}\right)=\dfrac14\left(\dfrac12-\dfrac16+\dfrac16-\dfrac1{10}+\cdots-\dfrac1{130}\right)=\dfrac18\left(1-\dfrac1{65}\right)=\dfrac8{65}$
      criteria:
      - 1.A1
  - id: S1-ALT1
    audience: ALT
    source_flow: G22_A.pdf p.23 모범답안
    method_no: 2
    steps:
    - id: 1c-1
      content: (채점기준 (B) 방법, 4·3·3점) $a_n$은 공차가 $4$이므로 $\displaystyle\sum_{n=1}^{32}\dfrac1{(a_n-1)(a_{n+1}-1)}=\sum_{n=1}^{32}\dfrac14\left(\dfrac1{a_n-1}-\dfrac1{a_{n+1}-1}\right)$ [4점]
      criteria: []
    - id: 1c-2
      content: $=\dfrac14\left(\dfrac1{a_1-1}-\dfrac1{a_{33}-1}\right)$ [3점]
      criteria: []
    - id: 1c-3
      content: $=\dfrac14\left(\dfrac12-\dfrac1{130}\right)=\dfrac8{65}$ ($a_{33}=131$ 이용) [3점]
      criteria: []
