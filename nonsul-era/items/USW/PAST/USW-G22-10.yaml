stem: 두 함수 $f(x)=\begin{cases}x-1&(x<1)\\x+a&(x\ge1)\end{cases}$ 와 $g(x)=\begin{cases}x^3-x&(x<1)\\2x^2+6&(x\ge1)\end{cases}$ 에 대하여, 함수 $\dfrac{g(x)}{f(x)}$가 $x=1$에서 연속이 되도록 실수 $a$의 값을 구하는 과정을 논술하시오.
subparts:
- id: '1'
  stem: 답과 풀이
  points: 10
  depends_on: []
  answer:
    kind: value
    value: a=3
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    source_flow: G22_A.pdf p.25 모범답안
    method_no: 1
    steps:
    - id: 1b-1
      content: $\displaystyle\lim_{x\to1-}\dfrac{g(x)}{f(x)}=\lim_{x\to1-}\dfrac{x^3-x}{x-1}=\lim_{x\to1-}x(x+1)=2$
      criteria:
      - 1.M1
    - id: 1b-2
      content: $\displaystyle\lim_{x\to1+}\dfrac{g(x)}{f(x)}=\lim_{x\to1+}\dfrac{2x^2+6}{x+a}=\dfrac8{1+a}$ (또는 $\dfrac{g(1)}{f(1)}=\dfrac8{1+a}$)
      criteria:
      - 1.M2
    - id: 1b-3
      content: $\dfrac{g(x)}{f(x)}$가 $x=1$에서 연속이므로 $\displaystyle\lim_{x\to1-}\dfrac{g(x)}{f(x)}=\dfrac{g(1)}{f(1)}\ \left(=\lim_{x\to1+}\dfrac{g(x)}{f(x)}\right)$이어야 한다. 그래서 $2=\dfrac8{1+a}$에서 $a=3$.
      criteria:
      - 1.A1
