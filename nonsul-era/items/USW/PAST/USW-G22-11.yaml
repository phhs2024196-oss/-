stem: 함수 $f(x)=x^3-2x^2-3x+1$에 대하여 곡선 $y=f(x)$ 위의 $x=1$일 때의 점에서의 접선의 방정식을 구하는 과정을 논술하시오.
subparts:
- id: '1'
  stem: 답과 풀이
  points: 10
  depends_on: []
  answer:
    kind: value
    value: y=-4*x+1
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    source_flow: G22_A.pdf p.27 모범답안
    method_no: 1
    steps:
    - id: 1b-1
      content: $y=f(1)=1^3-2\cdot1^2-3\cdot1+1=-3$이므로 접점은 $(1,-3)$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: $f'(x)=3x^2-4x-3$이므로 접선의 기울기는 $f'(1)=3-4-3=-4$이다.
      criteria:
      - 1.M2
    - id: 1b-3
      content: 곡선 위의 점 $(1,-3)$에서의 접선의 식은 $y+3=f'(1)(x-1)$이므로 접선의 방정식은 $y=-4(x-1)-3=-4x+1$이다.
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
