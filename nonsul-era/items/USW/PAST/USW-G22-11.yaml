    - id: 1.A1
      mark_type: A
      points: 4
      evidence: 접선의 식 $y-f(1)=f'(1)(x-1)$을 쓰고 $y=-4x+1$(채점기준 (3) 4점).
      depends_on:
      - 1.M1
      - 1.M2
      steps:
      - 1b-3
