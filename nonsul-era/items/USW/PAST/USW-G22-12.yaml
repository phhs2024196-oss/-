    method_no: 1
    steps:
    - id: 1b-1
      content: $f$가 일대일대응이려면 $f$는 증가함수(또는 모든 $x$에 대하여 $f'(x)\ge0$)이어야 한다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: $f'(x)=x^2+2ax+2-a$
      criteria:
      - 1.M2
    - id: 1b-3
      content: $f'(x)=(x+a)^2+(2-a-a^2)$이므로 모든 $x$에 대하여 $f'(x)\ge0$이기 위해서는 $2-a-a^2\ge0$이어야 한다. (또는 판별식 $\dfrac D4=a^2-(2-a)\le0$)
      criteria:
      - 1.M3
    - id: 1b-4
      content: $a^2+a-2=(a-1)(a+2)\le0$이므로 $-2\le a\le1$.
      criteria:
      - 1.A1
