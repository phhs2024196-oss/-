    value: x**3-3*x**2+2
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    source_flow: G22_A.pdf p.31 모범답안
    method_no: 1
    steps:
    - id: 1b-1
      content: $f'(x)=ax(x-2)=ax^2-2ax$라 두자.
      criteria:
      - 1.M1
    - id: 1b-2
      content: $f(x)=\dfrac{ax^3}3-ax^2+C$
      criteria:
      - 1.M2
    - id: 1b-3
      content: 미분계수의 부호가 $+$에서 $-$로 바뀌는 $x=0$이 극대이고 $-$에서 $+$로 바뀌는 $x=2$가 극소점이므로 $2=f(0)=C$, $-2=f(2)=\dfrac{8a}3-4a+2$.
      criteria:
      - 1.M3
    - id: 1b-4
      content: 따라서 $a=3$이고 $f(x)=x^3-3x^2+2$.
      criteria:
      - 1.A1
