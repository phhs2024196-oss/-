stem: |-
  삼차함수 $f(x)$의 도함수 $y=f'(x)$의 그래프가 그림과 같고, 함수 $f(x)$의 극솟값이 $-2$, 극댓값이 $2$일 때, 삼차함수 $f(x)$를 구하는 과정을 논술하시오.

  [그림 1: 아래로 볼록한 포물선 $y=f'(x)$가 원점 O와 $x=2$에서 $x$축과 만난다]
subparts:
- id: '1'
  stem: 답과 풀이
  points: 10
