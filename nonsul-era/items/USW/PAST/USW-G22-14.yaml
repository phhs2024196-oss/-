    method_no: 1
    steps:
    - id: 1b-1
      content: $f(0)=0$, $f(1)=6$
      criteria:
      - 1.M1
    - id: 1b-2
      content: '그림(채점기준 그림: 곡선 $y=f(x)$와 $0\le x\le1$, $y=6$으로 이루어진 직사각형)에서 오른쪽 아래 영역이 $\displaystyle\int_0^1f(x)dx$이고 왼쪽 위 영역이 $\displaystyle\int_0^6g(x)dx$이다. $1\times6=\displaystyle\int_0^1f(x)dx+\int_0^6g(x)dx$'
      criteria:
      - 1.M2
    - id: 1b-3
      content: $\displaystyle\int_0^1(4x^3+2x)dx=\Big[x^4+x^2\Big]_{x=0}^{1}=2$이므로 $\displaystyle\int_0^6g(x)dx=4$
      criteria:
      - 1.A1
