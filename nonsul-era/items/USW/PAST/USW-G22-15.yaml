    method_no: 1
    steps:
    - id: 1b-1
      content: $v(t)=-3t(t-2)$이므로 $t=2$일 때 방향을 바꾼다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: 원점을 출발하여 다시 원점으로 돌아올 때까지 걸린 시간을 $s$라 하면 $0=\displaystyle\int_0^s(-3t^2+6t)dt=\Big[-t^3+3t^2\Big]_{t=0}^{s}=-s^3+3s^2$, $s=3$
      criteria:
      - 1.M2
    - id: 1b-3
      content: 걸린 시간은 $3-2=1$
      criteria:
      - 1.A1
