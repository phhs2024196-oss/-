stem: 원점을 출발하여 수직선 위를 움직이는 점 P의 시각 $t$에서의 속도 $v(t)$는 $v(t)=-3t^2+6t$이다. 점 P가 움직이는 방향을 바꾼 후부터 다시 원점으로 돌아오는 데 걸린 시간을 구하는 과정을 논술하시오.
