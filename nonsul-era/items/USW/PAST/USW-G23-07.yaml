  solutions:
  - id: S1-B
    audience: B
    source_flow: G23_A.pdf p.18 모범답안
    method_no: 1
    steps:
    - id: 1b-1
      content: $\log_abc=2$, $2\log_ab-\log_ac=\log_a\dfrac{b^2}{c}=0$에서 $bc=a^2$, $\dfrac{b^2}{c}=1$을 얻는다. 그래서 $c=b^2$, $b^3=a^2$, $c^3=a^4$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: $\log_ba+\log_ca=\log_bb^{3/2}+\log_cc^{3/4}=\dfrac32+\dfrac34=\dfrac94$
      criteria:
      - 1.A1
  - id: S1-ALT1
    audience: ALT
    source_flow: G23_A.pdf p.18 모범답안
    method_no: 2
    steps:
    - id: 1c-1
      content: (별해) $\log_abc=2=\log_ab+\log_ac$와 $2\log_ab-\log_ac=0$을 비교하여 계산하면 $\log_ab=\dfrac23$, $\log_ac=\dfrac43$을 얻는다. [5점]
      criteria:
      - 1.M1
    - id: 1c-2
      content: 그래서 $\log_ba+\log_ca=\dfrac1{\log_ab}+\dfrac1{\log_ac}=\dfrac32+\dfrac34=\dfrac94$ [5점]
      criteria:
      - 1.A1
