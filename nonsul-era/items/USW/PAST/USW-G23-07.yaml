stem: $1$이 아닌 세 양의 실수 $a,\ b,\ c$가 $\log_abc=2$, $2\log_ab-\log_ac=0$을 만족시킬 때, $\log_ba+\log_ca$의 값을 구하는 과정을 논술하시오.
