    steps:
    - id: 1b-1
      content: 코사인법칙 $\overline{BC}^2=\overline{AB}^2+\overline{AC}^2-2\overline{AB}\,\overline{AC}\cos\dfrac\pi3$를 이용하면, $\overline{BC}^2=25+64-40=49$
      criteria:
      - 1.M1
    - id: 1b-2
      content: 사인법칙 $\dfrac{\overline{BC}}{\sin\frac\pi3}=2R$을 이용하면 외접원의 반지름의 길이는 $R=\dfrac7{\sqrt3}=\dfrac73\sqrt3$이다.
      criteria:
      - 1.A1
