stem: |-
  그림과 같이 $\angle\mathrm{A}=\dfrac\pi3$이고 $\overline{\mathrm{AB}}=5$, $\overline{\mathrm{AC}}=8$인 삼각형 ABC의 외접원의 반지름의 길이를 구하는 과정을 논술하시오.

  [그림 1: 원에 내접하는 삼각형 ABC. 변 AC에 8, 변 AB에 5, 꼭짓점 A에 각 $\dfrac\pi3$가 표시되어 있다]
