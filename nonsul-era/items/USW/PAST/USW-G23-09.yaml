  solutions:
  - id: S1-B
    audience: B
    source_flow: G23_A.pdf p.22 모범답안
    method_no: 1
    steps:
    - id: 1b-1
      content: $\{a_n\}$이 등차수열이므로 $\{a_9,a_{19},a_{29},a_{39},a_{49}\}$도 등차수열이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: 즉 등차중항 $a_{19}=\dfrac{a_9+a_{29}}2$, 즉 $a_9+a_{19}+a_{29}=3a_{19}=12$. 그러므로 $a_{19}=4$. 마찬가지로 $a_{29}+a_{39}+a_{49}=3a_{39}=21$, $a_{39}=7$.
      criteria:
      - 1.M2
    - id: 1b-3
      content: 그러므로 $a_{29}=\dfrac{a_{19}+a_{39}}2=\dfrac{4+7}2=\dfrac{11}2$
      criteria:
      - 1.A1
  - id: S1-ALT1
    audience: ALT
    source_flow: G23_A.pdf p.22 모범답안
    method_no: 2
    steps:
    - id: 1c-1
      content: (방법2) $\{a_n\}$이 등차수열이므로 $\{a_9,a_{19},a_{29},a_{39},a_{49}\}$도 등차수열 [4점]
      criteria:
      - 1.M1
    - id: 1c-2
      content: 등차중항을 이용하여 $a_9+a_{19}+a_{29}+a_{39}+a_{49}=5a_{29}$. 그러므로 $(a_9+a_{19}+a_{29})+(a_{29}+a_{39}+a_{49})=6a_{29}$ [3점]
      criteria:
      - 1.M2
    - id: 1c-3
      content: 그러므로 $a_{29}=\dfrac{12+21}6=\dfrac{11}2$ [3점]
      criteria:
      - 1.A1
  - id: S1-ALT2
    audience: ALT
    source_flow: G23_A.pdf p.22 모범답안
    method_no: 3
    steps:
    - id: 1d-1
      content: (방법3) $a_9+a_{19}+a_{29}=(a+8d)+(a+18d)+(a+28d)=3a+54d=12$, $a_{29}+a_{39}+a_{49}=(a+28d)+(a+38d)+(a+48d)=3a+114d=21$ [4점]
      criteria:
      - 1.M1
    - id: 1d-2
      content: 연립하면 $d=\dfrac3{20}$. 그래서 $a=\dfrac{13}{10}$ [3점]
      criteria:
      - 1.M2
    - id: 1d-3
      content: $a_{29}=\dfrac{13}{10}+28\times\dfrac3{20}=\dfrac{110}{20}=\dfrac{11}2$ [3점]
      criteria:
      - 1.A1
