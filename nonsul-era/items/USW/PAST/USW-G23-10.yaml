stem: |-
  (단답형 문제) 아래는 $\displaystyle\lim_{x\to\infty}\dfrac{(f(x)+x)(f(x)-x^2+2x)}{x^2+2}=3$을 만족시키는 다항함수 $f(x)$를 구하는 과정을 논술한 것이다. 빈칸 ①, ②, ③, ④를 알맞게 채우시오.

  [풀이 과정 상자] 다항함수 $f(x)$의 차수에 따라 상수함수, 일차함수, 이차함수, $\cdots$ 순으로 생각해본다.
  (i) $f(x)=c$ ($c$는 상수)인 경우, 분자 $(f(x)+x)(f(x)-x^2+2x)$는 $\boxed{\ ①\ }$이(가) 되어 극한 $\displaystyle\lim_{x\to\infty}\dfrac{\boxed{\ ①\ }}{2\text{차다항식}}$이 존재하지 않는다.
  (ii) $f(x)=ax+b$ ($a$와 $b$는 상수)인 경우, 극한이 존재하기 위하여 분자 $(f(x)+x)(f(x)-x^2+2x)$가 $\boxed{\ ②\ }$이(가) 되려면 $(f(x)+x)$가 상수가 되어야 한다. 그러므로 $a=-1$이다. $f(x)=-x+b$를 $\displaystyle\lim_{x\to\infty}\dfrac{(f(x)+x)(f(x)-x^2+2x)}{x^2+2}=3$에 대입하여 풀면 $b=\boxed{\ ③\ }$이다.
  (iii) $f(x)$가 $\boxed{\ ②\ }$인 경우, 극한이 존재하기 위해 분자 $(f(x)+x)(f(x)-x^2+2x)$가 $\boxed{\ ②\ }$이(가) 되어야 한다. 그래서 $f(x)-x^2+2x=c$ ($c$는 상수)이다. 이것을 $\displaystyle\lim_{x\to\infty}\dfrac{(f(x)+x)(f(x)-x^2+2x)}{x^2+2}=3$에 대입하여 풀면 $c=\boxed{\ ④\ }$이다.
  (iv) $f(x)$의 차수가 $3$차 이상이면, 극한값이 존재하지 않는다.
  그래서 (i)~(iv)에 의하여, 문제의 극한 식을 만족시키는 다항함수 $f(x)$는 $f(x)=-x+\boxed{\ ③\ }$과(와) $f(x)=x^2-2x+\boxed{\ ④\ }$이다.
