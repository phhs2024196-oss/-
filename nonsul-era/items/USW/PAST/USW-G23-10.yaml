  solutions:
  - id: S1-B
    audience: B
    source_flow: G23_A.pdf p.24 모범답안
    method_no: 1
    steps:
    - id: 1b-1
      content: $f(x)=c$이면 분자 $(c+x)(c-x^2+2x)$는 3차식이므로 극한은 존재하지 않는다. (① 3차식)
      criteria:
      - 1.A1
    - id: 1b-2
      content: $f(x)=ax+b$이면 극한이 존재하려면 분자가 2차식이어야 한다. (② 2차식)
      criteria:
      - 1.A2
    - id: 1b-3
      content: $a=-1$, $f(x)=-x+b$를 대입하면 $\displaystyle\lim_{x\to\infty}\dfrac{b(-x^2+x+b)}{x^2+2}=-b=3$이므로 $b=-3$. (③ $-3$)
      criteria:
      - 1.A3
    - id: 1b-4
      content: $f(x)$가 이차식이면 분자가 2차식이 되도록 $f(x)-x^2+2x=c$, 즉 $f(x)=x^2-2x+c$. 이때 $\displaystyle\lim_{x\to\infty}\dfrac{(x^2-x+c)c}{x^2+2}=c=3$. (④ $3$)
      criteria:
      - 1.A4
