    source_flow: G23_A.pdf p.26 모범답안
    method_no: 1
    steps:
    - id: 1b-1
      content: $h=\dfrac1t$라 놓자. $\displaystyle\lim_{t\to\infty}t\left(f\left(1+\dfrac1t\right)-f\left(1-\dfrac1t\right)\right)=\lim_{h\to0}\dfrac{f(1+h)-f(1-h)}h$
      criteria:
      - 1.M1
    - id: 1b-2
      content: $=\displaystyle\lim_{h\to0}\dfrac{f(1+h)-f(1)-f(1-h)+f(1)}h=\lim_{h\to0}\dfrac{f(1+h)-f(1)}h+\lim_{h\to0}\dfrac{f(1-h)-f(1)}{-h}=2f'(1)$
      criteria:
      - 1.M2
    - id: 1b-3
      content: 미분하면 $f'(x)=3x^2-4x+3$이다.
      criteria:
      - 1.M3
    - id: 1b-4
      content: $2f'(1)=2\times(3-4+3)=4$
      criteria:
      - 1.A1
