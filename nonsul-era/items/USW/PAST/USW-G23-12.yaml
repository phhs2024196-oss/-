stem: |-
  함수 $f(x)=x^2-2x+1$의 그래프 위의 점 $(a,f(a))$ $(0<a<1)$에서의 접선이 $x$축 및 $y$축과 만나는 점을 각각 P, Q라 할 때, 삼각형 OPQ의 넓이가 최대가 되도록 하는 $a$를 구하는 과정을 논술하시오. (단, O는 원점)

  [그림 1: 아래로 볼록한 포물선 $y=f(x)$와 그 접선. 접선이 $x$축과 만나는 점이 P, $y$축과 만나는 점이 Q이고 원점이 O이다]
subparts:
- id: '1'
  stem: 답과 풀이
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 1/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    source_flow: G23_A.pdf p.28 모범답안
    method_no: 1
    steps:
    - id: 1b-1
      content: 접선의 방정식은 $y-(a^2-2a+1)=(2a-2)(x-a)$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: $x=0$을 대입해서 $y=a^2-2a+1-2a^2+2a=-a^2+1$을 얻고
      criteria:
      - 1.M2
    - id: 1b-3
      content: $y=0$을 대입해서 $x=a-\dfrac{a-1}2=\dfrac{a+1}2$을 얻는다.
      criteria:
      - 1.M3
    - id: 1b-4
      content: 삼각형 OPQ의 넓이는 $s=\dfrac12(-a^2+1)\left(\dfrac{a+1}2\right)=\dfrac14(-a^3-a^2+a+1)$이다.
      criteria:
      - 1.M4
    - id: 1b-5
      content: 미분하면 $s'=\dfrac14(-3a^2-2a+1)$이다.
      criteria:
      - 1.M5
    - id: 1b-6
      content: 인수분해하면 $\dfrac14(-3a+1)(a+1)$이므로 $a=\dfrac13$에서 넓이가 최대가 된다.
      criteria:
      - 1.A1
