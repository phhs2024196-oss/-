stimuli: []
stem: |-
  모든 실수 $x$에 대하여
  $$xf(x)=\int_1^xf(t)dt+2x^3-3x^2$$
  을 만족시키는 다항함수 $f(x)$를 구하는 과정을 논술하시오.
subparts:
- id: '1'
  stem: 답과 풀이
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 3*x**2-6*x+2
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    source_flow: G23_A.pdf p.32 모범답안
    method_no: 1
    steps:
    - id: 1b-1
      content: $xf(x)=\displaystyle\int_1^xf(t)dt+2x^3-3x^2$ ……①. ①의 양변을 미분하면 $f(x)+xf'(x)=f(x)+6x^2-6x$, $xf'(x)=x(6x-6)$. $f(x)$가 다항함수이므로 $f'(x)=6x-6$
      criteria:
      - 1.M1
    - id: 1b-2
      content: $f(x)=\displaystyle\int(6x-6)dx=3x^2-6x+C$ ($C$는 적분상수) ……②. ①의 양변에 $x=1$을 대입하면 $1\times f(1)=2\times1^3-3\times1^2=-1$. ②에서 $f(1)=3-6+C=-1$로부터 $C=2$. 따라서 $f(x)=3x^2-6x+2$
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: 양변을 미분하여 $f'(x)=6x-6$(채점기준 (1) 5점).
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: 적분하고 $x=1$ 대입으로 $C=2$, $f(x)=3x^2-6x+2$(채점기준 (2) 5점).
      depends_on:
      - 1.M1
      steps:
      - 1b-2
