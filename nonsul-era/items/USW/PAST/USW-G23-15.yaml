stem: 곡선 $y=x^4-(6+k)x^3+6kx^2$과 $x$축으로 둘러싸인 두 부분의 넓이가 서로 같을 때, 상수 $k$의 값을 구하는 과정을 논술하시오. (단, $k>6$)
