  - id: S1-B
    audience: B
    source_flow: G23_A.pdf p.34 모범답안
    method_no: 1
    steps:
    - id: 1b-1
      content: $y=x^4-(6+k)x^3+6kx^2=x^2(x-6)(x-k)$
      criteria:
      - 1.M1
    - id: 1b-2
      content: 곡선 $y=x^2(x-6)(x-k)$의 그래프는 $0\le x\le6$에서 $x$축 위쪽, $6\le x\le k$에서 아래쪽에 있다. $k>6$이고 주어진 곡선과 $x$축으로 둘러싸인 두 부분의 넓이가 서로 같으므로 $\displaystyle\int_0^k\{x^4-(6+k)x^3+6kx^2\}dx=0$
      criteria:
      - 1.M2
    - id: 1b-3
      content: $\displaystyle\int_0^k\{x^4-(6+k)x^3+6kx^2\}dx=\left[\dfrac15x^5-\dfrac{6+k}4x^4+2kx^3\right]_0^k=\dfrac15k^5-\dfrac32k^4-\dfrac14k^5+2k^4=-\dfrac1{20}k^5+\dfrac12k^4=\dfrac12k^4\left(-\dfrac1{10}k+1\right)=0$. $k>6$이므로 $k=10$
      criteria:
      - 1.A1
