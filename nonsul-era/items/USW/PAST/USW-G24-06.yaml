    method_no: 1
    steps:
    - id: 1b-1
      content: $\dfrac1a=\log_38$이므로 $3^{\frac1a}=8$, 또한 $3^{\frac1{3a}}=2$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: $\dfrac1b=\log_3\dfrac15=-\log_35$이므로 $3^{-\frac1b}=5$이다.
      criteria:
      - 1.M2
    - id: 1b-3
      content: $3^{\frac1a-\frac3b}=3^{\frac1a}\left(3^{-\frac1b}\right)^3=8\cdot5^3=1000$
      criteria:
      - 1.M3
    - id: 1b-4
      content: $\sqrt[3a]{3^{10}}=\left(3^{\frac1{3a}}\right)^{10}=2^{10}=1024$
      criteria:
      - 1.M4
    - id: 1b-5
      content: 따라서 $3^{\frac1a-\frac3b}+\sqrt[3a]{3^{10}}=1000+1024=2024$
      criteria:
      - 1.A1
