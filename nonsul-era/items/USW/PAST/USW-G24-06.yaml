stem: 실수 $a$와 $b$가 $a\log_3 8=b\log_3\dfrac15=1$을 만족시킬 때, $3^{\frac1a-\frac3b}+\sqrt[3a]{3^{10}}$의 값을 구하는 과정을 논술하시오.
