stem: 함수 $y=\log_2x$의 그래프 위의 두 점 A와 B, 그리고 원점 O를 꼭짓점으로 하는 삼각형 AOB의 $\angle$AOB가 직각이고 점 A의 $y$좌표가 2일 때, 직각삼각형 AOB의 넓이를 구하는 과정을 논술하시오.
