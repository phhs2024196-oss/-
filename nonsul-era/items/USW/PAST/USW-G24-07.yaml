  - id: S1-B
    audience: B
    source_flow: G24_A.pdf p.5 모범답안
    method_no: 1
    steps:
    - id: 1b-1
      content: 점 A는 $y=\log_2x$ 위의 점이므로 $2=\log_2x$에서 $x=4$. 그래서 A$(4,2)$.
      criteria:
      - 1.M1
    - id: 1b-2
      content: 선분 OA의 기울기는 $\dfrac12$. 그래서 선분 OB의 기울기는 $-2$.
      criteria:
      - 1.M2
    - id: 1b-3
      content: 그래서 B$(b,\log_2b)$의 좌표는 $(b,-2b)$. $\log_2b=-2b$에서 $b=\dfrac12$. 그래서 B$\left(\dfrac12,-1\right)$.
      criteria:
      - 1.M3
    - id: 1b-4
      content: $\triangle$AOB$=\dfrac12\times\overline{OA}\times\overline{OB}=\dfrac12\sqrt{4^2+2^2}\sqrt{\left(\dfrac12\right)^2+(-1)^2}=\dfrac12\sqrt{4\cdot5}\sqrt{\dfrac54}=\dfrac52$
      criteria:
      - 1.A1
