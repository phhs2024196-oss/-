stimuli: []
stem: 방정식 $\dfrac{\sqrt2}{2}\cos\left(\dfrac\pi2+x\right)+\cos^2x-2\cos\left(\dfrac\pi2-x\right)=1+\sqrt2$의 모든 해 $x$를 구하는 과정을 논술하시오. (단, $0\le x\le2\pi$)
subparts:
- id: '1'
  stem: '[편집: 단일 논제 — 발문은 위 문항 전체와 같다]'
  points: 10
  depends_on: []
  answer:
    kind: value
    value: x1 = 5*pi/4; x2 = 7*pi/4
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    source_flow: G24_A.pdf p.6 모범답안
    method_no: 1
    steps:
    - id: 1b-1
      content: 준식 $\Rightarrow\ \dfrac{\sqrt2}{2}(-\sin x)+1-\sin^2x-2\sin x=1+\sqrt2$
      criteria:
      - 1.M1
    - id: 1b-2
      content: $\sin^2x+\left(2+\dfrac{\sqrt2}{2}\right)\sin x+\sqrt2=0$ 또는 $(\sin x+2)\left(\sin x+\dfrac{\sqrt2}{2}\right)=0$
      criteria:
      - 1.M2
    - id: 1b-3
      content: $\sin x+2>0$이므로 $\sin x=-\dfrac{\sqrt2}{2}$
      criteria:
      - 1.M3
    - id: 1b-4
      content: 즉, $x=\dfrac54\pi,\ \dfrac74\pi$
      criteria:
      - 1.A1
