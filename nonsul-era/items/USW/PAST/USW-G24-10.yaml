stimuli: []
stem: |
  다항함수 $f(x)$가 두 조건
  $$\lim_{x\to\infty}\dfrac{f(x)-x^2}{x-1}=2,\quad\lim_{x\to1}\dfrac{f(x)-2}{x-1}=a$$
  를 만족시킬 때, 상수 $a$의 값을 구하는 과정을 논술하시오.
subparts:
- id: '1'
  stem: '[편집: 단일 논제 — 발문은 위 문항 전체와 같다]'
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '4'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    source_flow: G24_A.pdf p.7 모범답안
    method_no: 1
    steps:
    - id: 1b-1
      content: $\displaystyle\lim_{x\to\infty}\dfrac{f(x)-x^2}{x-1}=2$를 만족시키는 다항함수 $f(x)-x^2$은 최고차항의 계수가 2인 일차함수이므로 $f(x)=x^2+2x+b$ (단, $b$는 상수) ---(1)
      criteria:
      - 1.M1
    - id: 1b-2
      content: 또한 $\displaystyle\lim_{x\to1}\dfrac{f(x)-2}{x-1}=a$에서 $x\to1$일 때 분모$\to0$이고 극한값이 존재하므로 분자$\to0$이다. $\displaystyle\lim_{x\to1}f(x)-2=f(1)-2=0$. 즉 $f(1)=2$
      criteria:
      - 1.M2
    - id: 1b-3
      content: (1)에서 $f(1)=1+2+b=2$. 따라서 $b=-1$. $a=\displaystyle\lim_{x\to1}\dfrac{f(x)-2}{x-1}=\lim_{x\to1}\dfrac{(x^2+2x-1)-2}{x-1}=\lim_{x\to1}\dfrac{(x+3)(x-1)}{x-1}=\lim_{x\to1}(x+3)=4$ (또는 $a=f'(1)=2x+2\big|_{x=1}=4$)
      criteria:
      - 1.A1
