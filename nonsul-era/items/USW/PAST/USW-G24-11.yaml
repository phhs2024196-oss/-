stimuli: []
stem: 다항함수 $y=f(x)$의 $x=1$에서의 접선의 방정식이 $y=3x-1$일 때, 함수 $y=\{f(x)\}^2-2f(x)$의 $x=1$에서의 접선의 방정식을 구하는 과정을 논술하시오.
subparts:
- id: '1'
  stem: '[편집: 단일 논제 — 발문은 위 문항 전체와 같다]'
  points: 10
  depends_on: []
  answer:
    kind: value
    value: m = 6; c = -6
    equivalents:
    - y=6x-6
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    source_flow: G24_A.pdf p.7 모범답안
    method_no: 1
    steps:
    - id: 1b-1
      content: $f(1)=3\times1-1=2$이고 $f'(1)=3$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: $y=(f(x))^2-2f(x)$를 미분하면 $y'=2f(x)f'(x)-2f'(x)$이다.
      criteria:
      - 1.M2
    - id: 1b-3
      content: $x=1$을 대입하면 $y'(1)=2\times2\times3-2\times3=6$이다.
      criteria:
      - 1.M3
    - id: 1b-4
      content: $y=(f(x))^2-2f(x)$의 $x=1$에서의 값은 $2^2-2\times2=0$이다.
      criteria:
      - 1.M4
    - id: 1b-5
      content: 접선의 방정식은 $y-0=6(x-1)$, 즉 $y=6x-6$이다.
      criteria:
      - 1.A1
