stem: |
  그림과 같이 반지름의 길이가 3인 구에 내접하는 원뿔 중에 그 부피가 최대가 되도록 하는 원뿔의 높이를 구하는 과정을 논술하시오.

  [그림 1: 반지름의 길이가 3인 구에 원뿔이 내접한 그림, 구의 중심에서 원뿔의 꼭짓점까지 길이 3 표시]
