    - id: 1b-1
      content: 피타고라스 정리 $9=r^2+(h-3)^2$으로부터 $r^2=6h-h^2$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: 원뿔 부피공식에 대입하면 $V=\dfrac13\pi r^2h=\dfrac13\pi(6h-h^2)h=\dfrac13\pi(6h^2-h^3)$이다.
      criteria:
      - 1.M2
    - id: 1b-3
      content: 미분하면 $\dfrac{dV}{dh}=\dfrac13\pi(12h-3h^2)=\pi(4-h)h$이다.
      criteria:
      - 1.M3
    - id: 1b-4
      content: 높이 $h=4$일 때 원뿔의 부피가 최대이다.
      criteria:
      - 1.A1
