stimuli: []
stem: |
  다항함수 $f(x)$가 다음 두 조건을 만족시킨다.

  [편집: 조건 상자] (가) 곡선 $y=f(x)$ 위의 임의의 점 $(x,f(x))$에서의 접선의 기울기가 $x^2-kx$이다.
  (나) 함수 $f(x)$의 극댓값과 극솟값의 차이가 $\dfrac43$이다.

  이때 $\displaystyle\int_{-k}^{k}(x^2-kx)\,dx$를 구하는 과정을 논술하시오. (단, $k$는 양의 상수)
subparts:
- id: '1'
  stem: '[편집: 단일 논제 — 발문은 위 문항 전체와 같다]'
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 16/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    source_flow: G24_A.pdf p.8 모범답안
    method_no: 1
    steps:
    - id: 1b-1
      content: (가)에서 $f'(x)=x^2-kx$이므로 $f(x)=\dfrac13x^3-\dfrac k2x^2+C$.
      criteria:
      - 1.M1
    - id: 1b-2
      content: (나)에서 $|f(0)-f(k)|=\dfrac43$이므로 $\dfrac{k^3}{6}=\dfrac43$.
      criteria:
      - 1.M2
    - id: 1b-3
      content: 그래서 $k=2$.
      criteria:
      - 1.M3
    - id: 1b-4
      content: $\displaystyle\int_{-k}^{k}(x^2-kx)\,dx=\int_{-2}^{2}f'(x)\,dx=f(2)-f(-2)=\dfrac{16}{3}$. (또는 $\displaystyle\int_{-k}^{k}(x^2-kx)\,dx=2\int_0^2x^2\,dx=\dfrac{16}{3}$)
      criteria:
      - 1.A1
