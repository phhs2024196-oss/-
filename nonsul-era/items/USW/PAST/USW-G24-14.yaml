stem: |
  다항함수 $f(x)$가 모든 실수 $x$에 대하여
  $$(x^2+1)f(x)=(x^2+1)^2+2\int_0^xtf(t)\,dt$$
  를 만족시킬 때, $f(x)$를 구하는 과정을 논술하시오.
