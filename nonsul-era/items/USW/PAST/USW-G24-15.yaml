stem: 자연수 $n=2,3,4,\ldots$에 대하여 두 곡선 $y=x-x^2$과 $y=\dfrac xn-\left(\dfrac xn\right)^2$으로 둘러싸인 부분의 넓이를 $S_n$이라 할 때, $S_n=\dfrac5{54}$인 자연수 $n$의 값을 구하는 과정을 논술하시오.
subparts:
- id: '1'
  stem: '[편집: 단일 논제 — 발문은 위 문항 전체와 같다]'
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '5'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    source_flow: G24_A.pdf p.9 모범답안
    method_no: 1
    steps:
    - id: 1b-1
      content: $y=x-x^2=\dfrac xn-\left(\dfrac xn\right)^2$에서 교점의 $x$좌표는 $x=0,\ \dfrac n{n+1}$.
      criteria:
      - 1.M1
    - id: 1b-2
      content: $S_n=\displaystyle\int_0^{\frac n{n+1}}\left(x-x^2-\dfrac1nx+\dfrac1{n^2}x^2\right)dx$
      criteria:
      - 1.M2
    - id: 1b-3
      content: $=\dfrac{n-1}{2n}x^2-\dfrac{n^2-1}{3n^2}x^3\Big|_0^{\frac n{n+1}}=\dfrac{n(n-1)}{2(n+1)^2}-\dfrac{n(n^2-1)}{3(n+1)^3}=\dfrac16\dfrac{n(n-1)}{(n+1)^2}$
      criteria:
      - 1.M3
    - id: 1b-4
      content: $S_n=\dfrac5{54}$이려면 $\dfrac{n(n-1)}{(n+1)^2}=\dfrac59$. 즉, $4n^2-19n-5=(4n+1)(n-5)=0$
      criteria:
      - 1.M4
    - id: 1b-5
      content: $n=5$
      criteria:
      - 1.A1
