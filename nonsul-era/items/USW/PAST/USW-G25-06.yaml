stimuli: []
stem: 곡선 $y=9^{x-2}$을 $y$축에 대하여 대칭이동한 후에 $x$축의 방향으로 $a$만큼 평행이동한 곡선을 $y=f(x)$라 하자. 그리고 곡선 $y=\left(\dfrac13\right)^{2x+8}$을 $x$축의 방향으로 $a^2$만큼 평행이동한 곡선을 $y=g(x)$라 하자. 모든 실수 $x$에 대하여 $f(x)=g(x)$일 때 양수 $a$의 값을 구하는 과정을 논술하시오.
