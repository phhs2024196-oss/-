  solutions:
  - id: S1-B
    audience: B
    source_flow: G25_A.pdf p.7 모범답안
    method_no: 1
    steps:
    - id: 1b-1
      content: 곡선 $y=9^{x-2}$을 $y$축에 대하여 대칭이동한 곡선은 $y=9^{-x-2}$이고, 이 곡선을 $x$축의 방향으로 $a$만큼 평행이동한 곡선은 $y=9^{-(x-a)-2}$ $\Rightarrow f(x)=9^{-(x-a)-2}$
      criteria:
      - 1.M1
    - id: 1b-2
      content: $y=\left(\dfrac13\right)^{2x+8}$을 $x$축의 방향으로 $a^2$만큼 평행이동한 곡선은 $y=\left(\dfrac13\right)^{2(x-a^2)+8}$ $\Rightarrow g(x)=\left(\dfrac13\right)^{2(x-a^2)+8}$
      criteria:
      - 1.M2
    - id: 1b-3
      content: 모든 실수 $x$에 대하여 $f(x)=g(x)$이므로 $9^{-(x-a)-2}=\left(\dfrac13\right)^{2(x-a^2)+8}$, 즉 $\left(\dfrac19\right)^{(x-a)+2}=\left(\dfrac19\right)^{x-a^2+4}$. 그러므로 $x-a+2=x-a^2+4$ 또는 $a^2-a-2=(a-2)(a+1)=0$. $a>0$이므로 $a=2$
      criteria:
      - 1.A1
