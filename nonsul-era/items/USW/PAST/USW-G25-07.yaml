    source_flow: G25_A.pdf p.8 모범답안
    method_no: 1
    steps:
    - id: 1b-1
      content: 두 직선 $y=(\log_32)x$, $y=(\log_8a)x$가 서로 수직이므로 $\log_32\times\log_8a=-1$
      criteria:
      - 1.M1
    - id: 1b-2
      content: '$\log_32\times\log_{2^3}a=-1$, $\dfrac{\log2}{\log3}\times\dfrac{\log a}{3\log2}=-1$, $\dfrac{\log a}{\log3}=\log_3a=-3$ (별해: $\log_8a=-\dfrac1{\log_32}\Rightarrow\dfrac13\log_2a=-\log_23$)'
      criteria:
      - 1.M2
    - id: 1b-3
      content: '그러므로 $a=3^{-3}=\dfrac1{27}$ (별해: $a^{\frac13}=3^{-1}\Rightarrow a=3^{-3}=\dfrac1{27}$)'
      criteria:
      - 1.A1
