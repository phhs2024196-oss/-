stem: |
  그림에서 $\triangle$ABC는 한 변의 길이가 1인 정삼각형이고 점 C는 선분 AD의 1 : 4 내분점이다. 선분 AE의 길이를 구하는 과정을 논술하시오.

  [그림 1: 원 위의 점 A, B, D, E. 선분 AD와 선분 BE가 점 C에서 만나고, 선분 AB는 실선, 선분 AE는 점선]
subparts:
- id: '1'
  stem: '[편집: 단일 논제 — 발문은 위 문항 전체와 같다]'
  points: 10
  depends_on: []
  answer:
    kind: value
    value: sqrt(21)
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    source_flow: G25_A.pdf p.9 모범답안
    method_no: 1
    steps:
    - id: 1b-1
      content: '$\overline{AC}=1$. 점 C가 선분 AD의 1 : 4 내분점이므로 $\overline{CD}=4$.'
      criteria:
      - 1.M1
    - id: 1b-2
      content: $\triangle$ABC가 정삼각형이므로 $\triangle$DEC도 정삼각형이다. [$\because\ \angle$DCE$=\angle$ACB$=\dfrac\pi3$, $\angle$CDE$=\angle$ADE$=\angle$ABE$=\dfrac\pi3$, 그래서 $\triangle$DEC는 정삼각형이다.] 그러므로 $\overline{CE}=4$.
      criteria:
      - 1.M2
    - id: 1b-3
      content: '$\triangle$ACE에 코사인법칙을 적용하면 $\overline{AE}^2=\overline{AC}^2+\overline{CE}^2-2\,\overline{AC}\,\overline{CE}\cos(\angle$ACE$)=1^2+4^2-2\cdot1\cdot4\cdot\cos\dfrac{2\pi}3=21$ ($\because\cos\dfrac{2\pi}3=-\dfrac12$). 그러므로 $\overline{AE}=\sqrt{21}$. (또는 $\triangle$ABE에 코사인법칙, $\overline{BE}=5$: $\overline{AE}^2=1^2+5^2-2\cdot1\cdot5\cos\dfrac\pi3=21$)'
      criteria:
      - 1.A1
