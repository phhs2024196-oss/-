stem: 자연수 $n$에 대하여 이차방정식 $x^2+\dfrac xn-n-1=0$의 두 근을 $a_n$과 $b_n$이라고 할 때, $\displaystyle\sum_{n=1}^{10}\left(\dfrac1{a_n}+\dfrac1{b_n}\right)$의 값을 구하는 과정을 논술하시오.
