    source_flow: G25_A.pdf p.11 모범답안
    method_no: 1
    steps:
    - id: 1b-1
      content: 직선 OP의 기울기는 $\dfrac{t^2}{t}=t$. 직선 $l$의 방정식은 $y-t^2=-\dfrac1t(x-t)$
      criteria:
      - 1.M1
    - id: 1b-2
      content: $x=0$을 대입하면 $\overline{OA}=t^2+1$
      criteria:
      - 1.M2
    - id: 1b-3
      content: $\displaystyle\lim_{t\to\infty}(\overline{OA}-\overline{OP})=\lim_{t\to\infty}\left(t^2+1-\sqrt{t^2+t^4}\right)=\lim_{t\to\infty}\dfrac{(t^2+1)^2-(t^2+t^4)}{t^2+1+\sqrt{t^2+t^4}}$
      criteria:
      - 1.M3
    - id: 1b-4
      content: $=\displaystyle\lim_{t\to\infty}\dfrac{t^2+1}{t^2+1+\sqrt{t^2+t^4}}=\dfrac12$
      criteria:
      - 1.A1
