stem: |
  아래 그림과 같이 곡선 $y=x^2$ 위의 점 P$(t,t^2)$을 지나고 직선 OP에 수직인 직선 $l$이 $y$축과 만나는 점을 A라고 할 때, $\displaystyle\lim_{t\to\infty}(\overline{OA}-\overline{OP})$의 값을 구하는 과정을 논술하시오. (단, $t>0$)

  [그림 1: 곡선 $y=x^2$, 원점 O, 점 P, 점 P를 지나고 직선 OP에 수직인 직선 $l$, $l$과 $y$축의 교점 A]
