stimuli: []
stem: |
  두 다항함수 $f(x)$와 $g(x)$에 대하여 두 조건
  $$f(x)g(x)=x^4+x^3+6x^2+4x+8,\quad\lim_{x\to1}\dfrac{f(x)-5}{x-1}=\dfrac12g(1)$$
  이 성립할 때, 미분계수 $g'(1)$의 값을 구하는 과정을 논술하시오.
subparts:
- id: '1'
  stem: '[편집: 단일 논제 — 발문은 위 문항 전체와 같다]'
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '3'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    source_flow: G25_A.pdf p.12 모범답안
    method_no: 1
    steps:
    - id: 1b-1
      content: $\displaystyle\lim_{x\to1}\dfrac{f(x)-5}{x-1}=\dfrac12g(1)$에서 $x\to1$일 때 분모$\to0$이므로 분자$\to0$이어야 해서 $f(1)=5$.
      criteria:
      - 1.M1
    - id: 1b-2
      content: $\displaystyle\lim_{x\to1}\dfrac{f(x)-5}{x-1}=\lim_{x\to1}\dfrac{f(x)-f(1)}{x-1}=f'(1)=\dfrac12g(1)$.
      criteria:
      - 1.M2
    - id: 1b-3
      content: $f(x)g(x)=x^4+x^3+6x^2+4x+8$에서 $f(1)g(1)=20$이므로 $g(1)=4$, $f'(1)=2$.
      criteria:
      - 1.M3
    - id: 1b-4
      content: $f(x)g(x)=x^4+x^3+6x^2+4x+8$을 미분하면 $f'(x)g(x)+f(x)g'(x)=4x^3+3x^2+12x+4$
      criteria:
      - 1.M4
    - id: 1b-5
      content: $f'(1)g(1)+f(1)g'(1)=8+5g'(1)=23$, 즉 $g'(1)=3$이다.
      criteria:
      - 1.A1
