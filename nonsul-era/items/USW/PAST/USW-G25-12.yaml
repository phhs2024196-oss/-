  solutions:
  - id: S1-B
    audience: B
    source_flow: G25_A.pdf p.13 모범답안
    method_no: 1
    steps:
    - id: 1b-1
      content: $f(x)$가 $x=0,\ k,\ 2k$일 때 극값을 가지므로 $f'(x)=x^3-6x^2+2ax+b=x(x-k)(x-2k)$
      criteria:
      - 1.M1
    - id: 1b-2
      content: $b=0$
      criteria:
      - 1.M2
    - id: 1b-3
      content: $x^2-6x+2a=(x-k)(x-2k)$에서 $6=3k$, 즉 $k=2$. $a=k^2=4$. $f'(x)=x(x-2)(x-4)$이고 $f(x)=\dfrac14x^4-2x^3+4x^2$
      criteria:
      - 1.M3
    - id: 1b-4
      content: 극솟값은 $f(0)=0$, $f(4)=4^3-2\times4^3+4^3=0$, 극댓값은 $f(2)=4-16+16=4$
      criteria:
      - 1.A1
