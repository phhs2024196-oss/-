stimuli: []
stem: 함수 $f(x)=\dfrac14x^4-2x^3+ax^2+bx$가 $x=0,\ k,\ 2k$에서 극값을 가질 때, 함수 $f(x)$의 극댓값과 극솟값을 구하는 과정을 논술하시오. (단, $a,\ b,\ k$는 실수, $k\neq0$)
subparts:
- id: '1'
  stem: '[편집: 단일 논제 — 발문은 위 문항 전체와 같다]'
  points: 10
  depends_on: []
  answer:
    kind: value
    value: max = 4; min = 0
