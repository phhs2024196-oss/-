stimuli: []
stem: 곡선 $y=x^3-2x^2$의 $x=1$에서의 접선이 $x=-1$에서 곡선 $y=x^2+ax+b$에 접할 때, 실수 $a$와 $b$의 값을 구하는 과정을 논술하시오.
subparts:
- id: '1'
  stem: '[편집: 단일 논제 — 발문은 위 문항 전체와 같다]'
  points: 10
  depends_on: []
  answer:
    kind: value
    value: a = 1; b = 1
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    source_flow: G25_A.pdf p.14 모범답안
    method_no: 1
    steps:
    - id: 1b-1
      content: 곡선 $y=x^3-2x^2$의 $x=1$에서의 접선은 접점이 $(1,-1)$이고 기울기가 $y'\big|_{x=1}=3x^2-4x\big|_{x=1}=-1$이므로 $y-(-1)=(-1)(x-1)$, 즉 $y=-x$.
      criteria:
      - 1.M1
    - id: 1b-2
      content: 접선 $y=-x$가 $x=-1$에서 곡선 $y=x^2+ax+b$에 접하므로 기울기 $y'\big|_{x=-1}=2x+a\big|_{x=-1}=-2+a=-1$. 그래서 $a=1$.
      criteria:
      - 1.M2
    - id: 1b-3
      content: 접점은 $(-1,1)=(-1,1-a+b)$여야 하므로 $1=1-a+b=b$이다.
      criteria:
      - 1.A1
