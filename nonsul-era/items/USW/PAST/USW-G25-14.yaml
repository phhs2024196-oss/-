stimuli: []
stem: |
  그림에서 두 곡선 $y=(x-1)^2$과 $y=kx^2+1$로 둘러싸인 부분의 넓이 $S_1$이 $y=(x-1)^2$과 $x$축, $y$축이 둘러싼 부분의 넓이 $S_2$의 9배일 때, 실수 $k$의 값을 구하는 과정을 논술하시오. (단, $0<k<1$)

  [그림 1: 곡선 $y=(x-1)^2$과 곡선 $y=kx^2+1$, 두 곡선으로 둘러싸인 부분 $S_1$, 곡선 $y=(x-1)^2$과 $x$축, $y$축으로 둘러싸인 부분 $S_2$]
subparts:
- id: '1'
  stem: '[편집: 단일 논제 — 발문은 위 문항 전체와 같다]'
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 1/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    source_flow: G25_A.pdf p.15 모범답안
    method_no: 1
    steps:
    - id: 1b-1
      content: $S_2=\displaystyle\int_0^1(x-1)^2\,dx=\dfrac13(x-1)^3\Big|_0^1=\dfrac13$
      criteria:
      - 1.M1
    - id: 1b-2
      content: $(x-1)^2=kx^2+1$, 즉 $(1-k)x^2=2x$. 그러므로 두 곡선의 교점의 $x$좌표는 $x=0,\ \dfrac2{1-k}$.
      criteria:
      - 1.M2
    - id: 1b-3
      content: $S_1=\displaystyle\int_0^{\frac2{1-k}}\left[(kx^2+1)-(x-1)^2\right]dx=\int_0^{\frac2{1-k}}\left[-(1-k)x^2+2x\right]dx=-\dfrac13(1-k)x^3+x^2\Big|_0^{\frac2{1-k}}=-\dfrac13(1-k)\dfrac8{(1-k)^3}+\dfrac4{(1-k)^2}=\dfrac4{3(1-k)^2}$
      criteria:
      - 1.M3
    - id: 1b-4
      content: $S_1=9S_2$이므로 $\dfrac4{3(1-k)^2}=9\times\dfrac13=3$, 즉 $4=9(1-k)^2$. 그래서 $9k^2-18k+5=(3k-5)(3k-1)=0$. 그래서 $k=\dfrac13,\ \dfrac53$. 그런데 $0<k<1$이므로 $k=\dfrac13$.
      criteria:
      - 1.A1
