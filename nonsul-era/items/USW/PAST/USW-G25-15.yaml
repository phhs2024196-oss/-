stimuli: []
stem: |
  다항함수 $f(x)$가 모든 실수 $x$에 대하여
  $$\int_1^x(x^2-t^2)f(t)\,dt=x^4+2ax^3+bx^2$$
  을 만족시킬 때, $\displaystyle\int_0^1f(x)\,dx$의 값을 구하는 과정을 논술하시오. (단, $a$와 $b$는 상수)
subparts:
- id: '1'
  stem: '[편집: 단일 논제 — 발문은 위 문항 전체와 같다]'
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '-1'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    source_flow: G25_A.pdf p.16 모범답안
    method_no: 1
    steps:
    - id: 1b-1
      content: $x=1$을 대입하면 $0=\displaystyle\int_1^1(1-t^2)f(t)\,dt=1+2a+b$, 그래서 $b=-1-2a$ 또는 $2a+b+1=0$
      criteria:
      - 1.M1
    - id: 1b-2
      content: 준식 $x^2\displaystyle\int_1^xf(t)\,dt-\int_1^xt^2f(t)\,dt=x^4+2ax^3+bx^2$을 미분하면 $2x\displaystyle\int_1^xf(t)\,dt+x^2f(x)-x^2f(x)=4x^3+6ax^2+2bx$, 또는 $\displaystyle\int_1^xf(t)\,dt=2x^2+3ax+b$
      criteria:
      - 1.M2
    - id: 1b-3
      content: 위의 식에 $x=1$을 대입하면 $4+6a+2b=0$ 또는 $2+3a+b=0$. 그래서 (1)에서 구한 식과 연립하여 풀면 $a=-1$, $b=1$. 그러므로 $\displaystyle\int_1^xf(t)\,dt=2x^2-3x+1$, 또는 $f(x)=4x-3$
      criteria:
      - 1.M3
    - id: 1b-4
      content: $x=0$을 대입하면 $\displaystyle\int_1^0f(t)\,dt=1$, 그래서 $\displaystyle\int_0^1f(x)\,dx=-1$. 또는 $f(x)=4x-3$에서 $\displaystyle\int_0^1(4x-3)\,dx=2x^2-3x\Big|_0^1=-1$
      criteria:
      - 1.A1
