stem: 등식 $9^a=6^{\log_{\sqrt2}3}\div b^{\log_23}$이 성립하도록 하는 두 자연수 $a$와 $b$의 값을 구하는 과정을 논술하시오.
subparts:
- id: '1'
  stem: 답과 풀이
  points: 10
  depends_on: []
  answer:
    kind: value
    value: a=1; b=9
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    source_flow: G26_A.pdf p.7 모범답안
    method_no: 1
    steps:
    - id: 1b-1
      content: 로그의 성질 $\log_{\sqrt2}3=2\log_23=\log_29$와 $a^{\log_bc}=c^{\log_ba}$를 이용하면 $3^{2a}=9^a=6^{\log_{\sqrt2}3}\div b^{\log_23}=9^{\log_26}\div3^{\log_2b}=3^{2\log_26-\log_2b}=3^{\log_2\frac{36}{b}}$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: 따라서 $2a=\log_2\dfrac{36}{b}$, 즉 $2^{2a}=\dfrac{36}{b}$이다.
      criteria:
      - 1.M2
    - id: 1b-3
      content: $36=4\times9=4^a\times b$가 성립하기 위한 두 자연수는 $a=1$, $b=9$이다.
      criteria:
      - 1.A1
