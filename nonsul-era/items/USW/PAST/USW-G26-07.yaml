stem: '그림과 같이 직선 $y=x$ 위의 점 A$(a,a)$를 지나고 $x$축에 수직인 직선이 곡선 $y=\log_8x$와 만나는 점을 P, 점 A를 지나고 $y$축에 수직인 직선이 곡선 $y=2^x$와 만나는 점을 Q라 하자. $|\overline{\mathrm{AP}}-\overline{\mathrm{AQ}}|$의 값이 자연수가 되도록 하는 최소의 자연수 $a$에 대하여 선분 PQ의 길이를 구하는 과정을 논술하시오. (단, $a>1$)


  [그림 1: 직선 $y=x$, 곡선 $y=2^x$, 곡선 $y=\log_8x$. 점 A$(a,a)$에서 $x$축에 수직인 직선이 $y=\log_8x$와 만나는 점 P, 점 A에서 $y$축에 수직인 직선이 $y=2^x$와 만나는 점 Q]'
subparts:
- id: '1'
  stem: 답과 풀이
  points: 10
  depends_on: []
  answer:
    kind: value
    value: PQ=sqrt(74)
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    source_flow: G26_A.pdf p.8 모범답안
    method_no: 1
    steps:
    - id: 1b-1
      content: 두 점의 좌표는 $\mathrm{P}=\mathrm{P}(a,\log_8a)$, $\mathrm{Q}=\mathrm{Q}(\log_2a,a)$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: $\overline{\mathrm{AP}}=a-\log_8a$, $\overline{\mathrm{AQ}}=a-\log_2a$이므로 $|\overline{\mathrm{AP}}-\overline{\mathrm{AQ}}|=\log_2a-\log_8a=\dfrac23\log_2a$.
      criteria:
      - 1.M2
    - id: 1b-3
      content: $\dfrac23\log_2a$가 자연수이려면 $\log_2a=\dfrac32k$ ($k=1,2,3,\cdots$) 꼴이고, $a=2^{\frac{3k}{2}}=\sqrt{8^k}$가 최소의 자연수이려면 $k=2$일 때 $a=8$이다.
      criteria:
      - 1.M3
    - id: 1b-4
      content: 그래서 $\mathrm{P}(8,1)$, $\mathrm{Q}(3,8)$에 대하여 $\overline{\mathrm{PQ}}=\sqrt{25+49}=\sqrt{74}$.
      criteria:
      - 1.A1
