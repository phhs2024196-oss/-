key_idea: $\sin(\pi-\theta)=\sin\theta$, $\cos\left(\dfrac{\pi}{2}+\theta\right)=-\sin\theta$로 바꿔 통분하면 $-\dfrac{2\sin\theta}{\cos^2\theta}=4\dfrac{\sin\theta}{\cos\theta}$이므로 $\sin\theta=0$ 또는 $\cos\theta=-\dfrac12$.
stuck: 좌변의 두 분수를 통분한 뒤 $\sin\theta$로 묶어 두 경우로 나누는 것.
