    - id: 1.M2
      mark_type: M
      points: 2
      evidence: 준식을 $-\dfrac{2\sin\theta}{\cos^2\theta}=4\dfrac{\sin\theta}{\cos\theta}$로 정리(채점기준 2점).
      depends_on:
      - 1.M1
      steps:
      - 1b-2
    - id: 1.M3
      mark_type: M
      points: 2
      evidence: $\sin\theta=0$ 또는 $\cos\theta=-\dfrac12$(채점기준 2점).
      depends_on:
      - 1.M2
      steps:
      - 1b-3
    - id: 1.A1
