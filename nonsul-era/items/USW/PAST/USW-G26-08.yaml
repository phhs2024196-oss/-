stimuli: []
stem: $\dfrac{1}{1+\sin(\pi-\theta)}-\dfrac{1}{1+\cos\left(\dfrac{\pi}{2}+\theta\right)}=4\tan\theta$를 만족시키는 $\theta$의 값과 그때의 $\sin\theta$의 값을 구하는 과정을 논술하시오. (단, $-\pi<\theta<\pi$)
subparts:
- id: '1'
  stem: 답과 풀이
  points: 10
  depends_on: []
  answer:
    kind: value
    value: t1=0; s1=0; t2=2*pi/3; s2=sqrt(3)/2; t3=-2*pi/3; s3=-sqrt(3)/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    source_flow: G26_A.pdf p.9 모범답안
    method_no: 1
    steps:
    - id: 1b-1
      content: $\sin(\pi-\theta)=\sin\theta$, $\cos\left(\dfrac{\pi}{2}+\theta\right)=-\sin\theta$이므로
      criteria:
      - 1.M1
    - id: 1b-2
      content: 준식은 $\dfrac{1}{1+\sin\theta}-\dfrac{1}{1-\sin\theta}=-\dfrac{2\sin\theta}{1-\sin^2\theta}=-\dfrac{2\sin\theta}{\cos^2\theta}=4\tan\theta=4\dfrac{\sin\theta}{\cos\theta}$가 된다.
      criteria:
      - 1.M2
    - id: 1b-3
      content: 그래서 $\sin\theta=0$ 또는 $\cos\theta=-\dfrac12$.
      criteria:
      - 1.M3
    - id: 1b-4
      content: $\cos\theta=-\dfrac12$에서 $\theta=\dfrac23\pi$ 또는 $\theta=-\dfrac23\pi$. (또는 $\cos\theta=-\dfrac12$에서 $\sin^2\theta=1-\cos^2\theta=1-\left(-\dfrac12\right)^2=\dfrac34$, $\sin\theta=\pm\dfrac{\sqrt3}{2}$.)
      criteria:
      - 1.A1
    - id: 1b-5
      content: 그러므로 $\theta=0$일 때 $\sin0=0$, $\theta=\dfrac23\pi$일 때 $\sin\dfrac23\pi=\dfrac{\sqrt3}{2}$, $\theta=-\dfrac23\pi$일 때 $\sin\left(-\dfrac23\pi\right)=-\dfrac{\sqrt3}{2}$.
      criteria:
      - 1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
