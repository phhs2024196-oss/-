stimuli: []
stem: $\displaystyle\lim_{x\to1}\dfrac{\sqrt{ax+1}-\sqrt3}{\sqrt x-1}=b$일 때, 실수 $a$와 $b$의 값을 구하는 과정을 논술하시오.
subparts:
- id: '1'
  stem: 답과 풀이
  points: 10
  depends_on: []
  answer:
    kind: value
    value: a=2; b=2*sqrt(3)/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    source_flow: G26_A.pdf p.10 모범답안
    method_no: 1
    steps:
    - id: 1b-1
      content: 극한값 $b\,(\neq0)$을 가지므로 $x\to1$일 때 분모 $\to0$이어서 분자 $\to0$이어야 한다. 그래서 $\sqrt{a+1}-\sqrt3=0$, 즉 $a=2$.
      criteria:
      - 1.M1
    - id: 1b-2
      content: $\displaystyle\lim_{x\to1}\dfrac{\sqrt{ax+1}-\sqrt3}{\sqrt x-1}=\lim_{x\to1}\dfrac{\sqrt{2x+1}-\sqrt3}{\sqrt x-1}=\lim_{x\to1}\dfrac{\sqrt{2x+1}-\sqrt3}{\sqrt x-1}\cdot\dfrac{\sqrt x+1}{\sqrt x+1}\cdot\dfrac{\sqrt{2x+1}+\sqrt3}{\sqrt{2x+1}+\sqrt3}$
      criteria:
      - 1.M2
    - id: 1b-3
      content: $\displaystyle=\lim_{x\to1}\dfrac{2x+1-3}{x-1}\cdot\dfrac{\sqrt x+1}{\sqrt{2x+1}+\sqrt3}$
      criteria:
      - 1.A1
    - id: 1b-4
      content: $\displaystyle=2\cdot\dfrac{2}{2\sqrt3}=\dfrac23\sqrt3$. 즉 $b=\dfrac23\sqrt3$.
      criteria:
      - 1.A2
