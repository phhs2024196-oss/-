stem: 첫째항 $a_1=1$인 등차수열 $\{a_n\}$에 대하여 $b_n=\dfrac{1}{\sqrt{a_n}+\sqrt{a_{n+1}}}$로 주어진 수열 $\{b_n\}$의 부분합 $S_{2025}=b_1+b_2+\cdots+b_{2024}+b_{2025}=50$일 때, 등차수열 $\{a_n\}$의 공차를 구하는 과정을 논술하시오.
subparts:
- id: '1'
  stem: 답과 풀이
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 77/100
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    source_flow: G26_A.pdf p.11 모범답안
    method_no: 1
    steps:
    - id: 1b-1
      content: 공차를 $d$라고 하면 $a_n=1+(n-1)d$이다. 그러므로 $S_{2025}=\dfrac{1}{\sqrt1+\sqrt{1+d}}+\dfrac{1}{\sqrt{1+d}+\sqrt{1+2d}}+\cdots+\dfrac{1}{\sqrt{1+2024d}+\sqrt{1+2025d}}$.
      criteria:
      - 1.M1
    - id: 1b-2
      content: $=\dfrac{\sqrt1-\sqrt{1+d}}{1-(1+d)}+\dfrac{\sqrt{1+d}-\sqrt{1+2d}}{(1+d)-(1+2d)}+\cdots+\dfrac{\sqrt{1+2024d}-\sqrt{1+2025d}}{1+2024d-(1+2025d)}$
      criteria:
      - 1.M2
    - id: 1b-3
      content: $=-\dfrac1d\left(\sqrt1-\sqrt{1+2025d}\right)=50$
      criteria:
      - 1.M3
    - id: 1b-4
      content: 그러면 $1+2025d=(50d+1)^2=2500d^2+100d+1$.
      criteria:
      - 1.A1
    - id: 1b-5
      content: 즉 $d=\dfrac{2025-100}{2500}=\dfrac{81-4}{100}=\dfrac{77}{100}=0.77$.
      criteria:
      - 1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: $a_n=1+(n-1)d$로 $S_{2025}$를 항별로 씀(채점기준 2점).
      steps:
      - 1b-1
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: 각 항을 유리화(채점기준 3점).
      depends_on:
      - 1.M1
      steps:
      - 1b-2
    - id: 1.M3
      mark_type: M
      points: 2
      evidence: 소거하여 $-\dfrac1d\left(\sqrt1-\sqrt{1+2025d}\right)=50$(채점기준 2점).
      depends_on:
      - 1.M2
      steps:
      - 1b-3
    - id: 1.A1
