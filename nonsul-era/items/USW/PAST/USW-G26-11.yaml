  solutions:
  - id: S1-B
    audience: B
    source_flow: G26_A.pdf p.12 모범답안
    method_no: 1
    steps:
    - id: 1b-1
      content: $\displaystyle\lim_{x\to2}\dfrac{g(x)-5}{x-2}=22$에서 분모가 $0$으로 수렴하는데 극한이 존재하므로 분자도 $0$으로 수렴한다. 따라서 $g(2)=5$.
      criteria:
      - 1.M1
    - id: 1b-2
      content: $g(x)=(x^3-3)f(x)$ 식에 $x=2$를 대입하면 $f(2)=1$.
      criteria:
      - 1.M2
    - id: 1b-3
      content: $g\,'(2)=\displaystyle\lim_{x\to2}\dfrac{g(x)-g(2)}{x-2}=\lim_{x\to2}\dfrac{g(x)-5}{x-2}=22$.
      criteria:
      - 1.M3
    - id: 1b-4
      content: $g(x)=(x^3-3)f(x)$에서 $g\,'(x)=3x^2f(x)+(x^3-3)f\,'(x)$이고,
      criteria:
      - 1.M4
    - id: 1b-5
      content: $x=2$를 대입하면 $g\,'(2)=12f(2)+5f\,'(2)$이므로 $f\,'(2)=2$.
      criteria:
      - 1.A1
    - id: 1b-6
      content: 따라서 $f(2)\times f\,'(2)=2$.
      criteria:
      - 1.A2
