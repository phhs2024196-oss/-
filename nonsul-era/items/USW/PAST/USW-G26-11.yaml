stem: 다항함수 $f(x)$에 대하여 함수 $g(x)=(x^3-3)f(x)$이고 $\displaystyle\lim_{x\to2}\dfrac{g(x)-5}{x-2}=22$일 때, $f(2)\times f'(2)$의 값을 구하는 과정을 논술하시오.
