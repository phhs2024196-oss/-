stem: '최고차항의 계수가 $2$인 삼차함수 $f(x)$에 대하여 함수 $y=f\,''(x)$의 그래프가 그림과 같다. $-1\le x\le1$인 모든 실수 $x$에 대하여 부등식 $f(x)f\,''(x)\le0$이 성립할 때, $f(3)$의 최솟값을 구하는 과정을 논술하시오.


  [그림 1: 함수 $y=f\,''(x)$의 그래프. 아래로 볼록한 포물선이며 $x$축과 $x=-1$, $x=1$에서 만나고 $y$축과는 $x$축 아래에서 만난다]'
