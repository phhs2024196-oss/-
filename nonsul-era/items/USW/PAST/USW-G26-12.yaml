  solutions:
  - id: S1-B
    audience: B
    source_flow: G26_A.pdf p.13 모범답안
    method_no: 1
    steps:
    - id: 1b-1
      content: 최고차항의 계수가 $2$인 삼차함수는 $f(x)=2x^3+ax^2+bx+c$로 표현할 수 있고 이를 미분하면 $f\,'(x)=6x^2+2ax+b$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: 그래프를 이용하면 $y=f\,'(x)=k(x-1)(x+1)=kx^2-k$로 표현되므로 $k=6$, $a=0$, $b=-6$이다.
      criteria:
      - 1.M2
    - id: 1b-3
      content: 이때 $-1\le x\le1$인 구간에서 $y=f\,'(x)\le0$이므로 $f(x)f\,'(x)\le0$ 조건이 성립하기 위해 $f(-1)\ge0$이고 $f(1)\ge0$의 조건을 만족해야 한다.
      criteria:
      - 1.M3
    - id: 1b-4
      content: 따라서 $f(x)=2x^3-6x+c$에서 $f(-1)=4+c\ge0$과 $f(1)=-4+c\ge0$을 동시에 만족하는 최소의 $c$는 $4$이다.
      criteria:
      - 1.A1
    - id: 1b-5
      content: 따라서 $f(3)$의 최솟값은 $f(3)=54-18+4=40$.
      criteria:
      - 1.A2
