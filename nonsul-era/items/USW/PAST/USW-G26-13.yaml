stem: 시각 $t$에서의 위치가 $x(t)=at^3+bt^2-9t$인 수직선 위를 움직이는 점 P가 시각 $t=1$일 때 운동 방향을 바꾸며 시각 $t=5$에서 $-18$의 가속도를 갖는다고 하자. 점 P가 운동 방향을 다시 바꾸는 시각을 구하는 과정을 논술하시오. (단, $a$와 $b$는 상수)
