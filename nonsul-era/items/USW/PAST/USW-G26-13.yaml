  solutions:
  - id: S1-B
    audience: B
    source_flow: G26_A.pdf p.14 모범답안
    method_no: 1
    steps:
    - id: 1b-1
      content: 운동 방향을 바꾸는 순간의 속도는 $0$임을 이용한다. $x\,'(t)=3at^2+2bt-9$에서 $x\,'(1)=3a+2b-9=0$.
      criteria:
      - 1.M1
    - id: 1b-2
      content: $x\,''(t)=6at+2b$에서 $x\,''(5)=30a+2b=-18$.
      criteria:
      - 1.M2
    - id: 1b-3
      content: 두 식을 연립하여 풀면 $a=-1$, $b=6$.
      criteria:
      - 1.A1
    - id: 1b-4
      content: 그러므로 $x\,'(t)=-3t^2+12t-9=-3(t-1)(t-3)$.
      criteria:
      - 1.A2
    - id: 1b-5
      content: 그러므로 P가 운동 방향을 다시 바꾸는 시각은 $t=3$.
      criteria:
      - 1.A3
