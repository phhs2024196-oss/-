  solutions:
  - id: S1-B
    audience: B
    source_flow: G26_A.pdf p.15 모범답안
    method_no: 1
    steps:
    - id: 1b-1
      content: $f(x)=3\displaystyle\int_{-x}^{x}(t^2-3t-4)\,dt=3\int_{-x}^{x}(t^2-4)\,dt=6\int_0^x(t^2-4)\,dt$.
      criteria:
      - 1.M1
    - id: 1b-2
      content: 미적분의 기본정리에 의해 $f\,'(x)=6(x^2-4)=6(x-2)(x+2)$. 극점은 $x=\pm2$.
      criteria:
      - 1.M2
    - id: 1b-3
      content: $f(2)=6\displaystyle\int_0^2(t^2-4)\,dt=\left[2t^3-24t\right]_0^2=-32$, $f(-2)=\displaystyle\int_{2}^{-2}3(t+1)(t-4)\,dt=\int_{-2}^{2}3(t+1)(t-4)\,dt=-f(2)=32$. 극댓값은 $32$, 극솟값은 $-32$.
      criteria:
      - 1.A1
