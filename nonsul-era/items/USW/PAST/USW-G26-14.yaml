key_idea: $3(t+1)(t-4)=3t^2-9t-12$에서 홀수차항이 구간 $[-x,x]$에서 소거되어 $f(x)=6\displaystyle\int_0^x(t^2-4)\,dt$이고, 미적분의 기본정리로 $f\,\prime(x)=6(x^2-4)$를 구해 극점을 찾는다.
stuck: 대칭구간 적분에서 $t$의 홀수차항이 사라진다는 것(또는 $-x$를 아래끝으로 하는 미분).
