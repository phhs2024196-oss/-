  solutions:
  - id: S1-B
    audience: B
    source_flow: G26_A.pdf p.16 모범답안
    method_no: 1
    steps:
    - id: 1b-1
      content: 접점의 $x$좌표를 $t$라 하면 접선의 방정식은 $y=2t(x-t)+t^2+a$이다. 원점을 지나므로 $0=-2t^2+t^2+a$로부터 $t=\pm\sqrt a$.
      criteria:
      - 1.M1
    - id: 1b-2
      content: 접선은 $y=\pm2\sqrt a\,x$.
      criteria:
      - 1.M2
    - id: 1b-3
      content: $S_1=2\displaystyle\int_0^{\sqrt a}\left(x^2+a-2\sqrt a\,x\right)dx=2\left[\dfrac13x^3+ax-\sqrt a\,x^2\right]_0^{\sqrt a}=\dfrac23a\sqrt a$.
      criteria:
      - 1.M3
    - id: 1b-4
      content: $x$축과 평행한 직선은 $y=2a$. $S_2=2\displaystyle\int_0^{\sqrt a}\left(2a-(x^2+a)\right)dx=2\int_0^{\sqrt a}(a-x^2)\,dx=\left[2ax-\dfrac23x^3\right]_0^{\sqrt a}=2a\sqrt a-\dfrac23a\sqrt a=\dfrac43a\sqrt a$. (또는 삼각형의 넓이 $\dfrac12\times2\sqrt a\times2a=2a\sqrt a$를 구한 후 $S_2=2a\sqrt a-S_1=\dfrac43a\sqrt a$.) 따라서 $S_2=2S_1$.
      criteria:
      - 1.A1
