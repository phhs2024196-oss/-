stem: '양수 $a$에 대하여 곡선 $y=x^2+a$와 원점에서 곡선에 그은 두 접선으로 둘러싸인 도형의 넓이를 $S_1$이라 하고, 곡선과 두 접점을 지나며 $x$축과 평행한 직선에 둘러싸인 도형의 넓이를 $S_2$라 하자. $S_2$는 $S_1$의 $2$배가 됨을 보이는 과정을 논술하시오.


  [그림 1: 곡선 $y=x^2+a$, 원점에서 곡선에 그은 두 접선, 두 접점을 지나며 $x$축과 평행한 직선. 곡선과 두 접선으로 둘러싸인 부분이 $S_1$, 곡선과 직선으로 둘러싸인 부분이 $S_2$]'
subparts:
- id: '1'
  stem: 답과 풀이
  points: 10
  depends_on: []
  answer:
