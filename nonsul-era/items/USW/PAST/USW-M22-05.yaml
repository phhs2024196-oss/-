stem: 공비가 양수인 등비수열 $\{a_n\}$에 대하여 $a_3+a_4+a_5=8$, $a_5+a_6+a_7=\dfrac12(a_4+a_5+a_6)+12$일 때, $a_6+a_7+a_8$의 값을 구하고 그 과정을 서술하시오.
