  solutions:
  - id: S1-B
    audience: B
    source_flow: GB22.pdf p.17 모범답안
    method_no: 1
    steps:
    - id: 1b-1
      content: $\{a_n\}$의 공비를 $r$이라 하면 $a_5+a_6+a_7=r^2(a_3+a_4+a_5)=8r^2$, $a_4+a_5+a_6=r(a_3+a_4+a_5)=8r$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: 그러므로 $r$이 만족시키는 방정식은 $8r^2=\dfrac12\times8r+12=4r+12$이다. $8r^2-4r-12=4(2r-3)(r+1)=0$이므로 $r=\dfrac32$ 또는 $r=-1$이다. $r>0$이므로 $r=\dfrac32$이다.
      criteria:
      - 1.M2
    - id: 1b-3
      content: 따라서 $a_6+a_7+a_8=r^3(a_3+a_4+a_5)=8r^3=8\times\left(\dfrac32\right)^3=27$이다.
      criteria:
      - 1.A1
