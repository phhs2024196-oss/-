stem: 함수 $f(x)=x^2-6x+11$과 함수 $g(x)=\log_3x$가 있다. 구간 $\{x|1\le x\le7\}$에서 합성함수 $(g\circ f)(x)=g(f(x))$의 최댓값과 최솟값의 차를 구하여 간단히 나타내고 그 과정을 서술하시오.
subparts:
- id: '1'
  stem: 답과 풀이
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '2'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    source_flow: GB22.pdf p.18 모범답안
    method_no: 1
    steps:
    - id: 1b-1
      content: $f(x)=x^2-6x+11=(x-3)^2+2$이므로 $\{x|1\le x\le7\}$에서 $f(x)$의 최솟값은 $f(3)=2$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: 구간의 양 끝점에서 $f(1)<f(7)$이므로 $f(x)$의 최댓값은 $f(7)=18$이다.
      criteria:
      - 1.M2
    - id: 1b-3
      content: 한편 $g(x)=\log_3x$는 $x$의 값이 증가하면 $g(x)$의 값도 증가하므로 함수 $(g\circ f)(x)=g(f(x))$의 최솟값은 $g(f(3))=g(2)=\log_32$이고, 최댓값은 $g(f(7))=g(18)=\log_318$이다.
      criteria:
      - 1.M3
    - id: 1b-4
      content: 따라서 $(g\circ f)(x)=g(f(x))$의 최댓값과 최솟값의 차는 $\log_318-\log_32=\log_39=2$이다.
      criteria:
      - 1.A1
