key_idea: $f(x)=(x-3)^2+2$로 $f$의 최솟값·최댓값을 구하고, $g(x)=\log_3x$가 증가함수이므로 $g(f(x))$의 최솟값·최댓값을 $g$에 대입해 구한다.
