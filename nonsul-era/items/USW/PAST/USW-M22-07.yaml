stem: 다항함수 $f(x)$에 대하여 함수 $g(x)$를 $g(x)=x^3f(x)$라 하자. 함수 $g(x)$가 $x=2$에서 극값 $16$을 가질 때, $f\,'(2)$의 값을 구하고 그 과정을 서술하시오.
