stem: 두 곡선 $y=2x^2-4x+3$과 $y=-x^2+8x-6$으로 둘러싸인 부분의 넓이를 구하고 그 과정을 서술하시오.
subparts:
- id: '1'
  stem: 답과 풀이
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '4'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    source_flow: GB22.pdf p.20 모범답안
    method_no: 1
    steps:
    - id: 1b-1
      content: $0=(-x^2+8x-6)-(2x^2-4x+3)=-3x^2+12x-9=-3(x-1)(x-3)$이므로 두 곡선은 $x=1$과 $x=3$에서 만난다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: 닫힌구간 $[1,3]$에서 $-x^2+8x-6\ge2x^2-4x+3$이므로 두 곡선으로 둘러싸인 부분의 넓이는 정적분 $\displaystyle\int_1^3(-3x^2+12x-9)\,dx$로 주어진다.
      criteria:
      - 1.M2
    - id: 1b-3
      content: 정적분을 계산하면 $\left[-x^3+6x^2-9x\right]_{x=1}^{x=3}=4$이다.
      criteria:
      - 1.A1
