stem: 방정식 $\log_2(3x+2)=1+2\log_2(x-1)$의 해를 구하는 과정을 논술하시오.
subparts:
- id: '1'
  stem: 답과 풀이
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 7/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    source_flow: GB23.pdf p.17 모범답안
    method_no: 1
    steps:
    - id: 1b-1
      content: $1=\log_22$이므로 $\log_2(3x+2)=\log_22+\log_2(x-1)^2=\log_22(x-1)^2$ (또는 $\log_2(3x+2)-\log_2(x-1)^2=1$).
      criteria:
      - 1.M1
    - id: 1b-2
      content: $3x+2=2(x-1)^2$ (또는 $\dfrac{3x+2}{(x-1)^2}=2$)이므로 $2x^2-4x+2=3x+2$, 즉 $2x^2-7x=0$이다. 그러므로 $x=0$, $x=\dfrac72$이다.
      criteria:
      - 1.M2
    - id: 1b-3
      content: 진수 $3x+2>0$, $x-1>0$이어야 하므로 $x>1$이어야 한다. 따라서 $x=\dfrac72$이다.
      criteria:
      - 1.A1
