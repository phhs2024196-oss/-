stimuli: []
stem: '(단답형 문제) 다음은 $0$이 아닌 두 실수 $a,\ b$에 대하여 세 수 $4a,\ 2a+b,\ a+2b$가 순서대로 등비수열을 이룰 때 이 수열의 공비를 구하는 과정을 논술한 것입니다. 빈칸 ①, ②, ③을 알맞게 채우시오.


  [풀이 과정 상자] $4a,\ 2a+b,\ a+2b$가 순서대로 등비수열을 이루므로, 공비는 $r=\dfrac{\boxed{\ ①\ }}{4a}=\dfrac{a+2b}{\boxed{\ ①\ }}$이다. 그래서 $\boxed{\ ①\ }^2=4a(a+2b)$이고, 이를 정리하면 $b(b-\boxed{\ ②\ })=0$이다. 이때 $b\neq0$이므로 $b=\boxed{\ ②\ }$이다. 그래서 공비는 $r=\dfrac{\boxed{\ ①\ }}{4a}=\boxed{\ ③\ }$이다.'
