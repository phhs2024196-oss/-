    steps:
    - id: 1b-1
      content: $0=x^2-ax=x(x-a)$이므로 $\dfrac43=\displaystyle\int_0^a(-x^2+ax)\,dx$.
      criteria:
      - 1.M1
    - id: 1b-2
      content: $=\left[-\dfrac13x^3+\dfrac a2x^2\right]_{x=0}^{a}=-\dfrac{a^3}{3}+\dfrac{a^3}{2}=\dfrac{a^3}{6}$.
      criteria:
      - 1.M2
    - id: 1b-3
      content: $8=a^3$으로부터 $a=2$.
      criteria:
      - 1.A1
