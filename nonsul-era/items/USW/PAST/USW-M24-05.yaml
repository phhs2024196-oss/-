stem: 부등식 $\log_2(x+2)+\log_{\frac14}(2x+5)<\dfrac12$을 만족시키는 정수 $x$의 개수를 구하는 과정을 논술하시오.
subparts:
- id: '1'
  stem: '[편집: 단일 논제 — 발문은 위 문항 전체와 같다]'
  points: 10
  depends_on: []
