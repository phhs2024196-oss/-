    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    source_flow: GB24.pdf p.15 모범답안
    method_no: 1
    steps:
    - id: 1b-1
      content: $\log_2(x+2)$에서 $x+2>0$, 마찬가지로 $2x+5>0$, 그래서 $x>-2$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: 주어진 식을 $\log_2(x+2)-\dfrac12\log_2(2x+5)<\dfrac12$로 쓰고, $2$를 곱하고 간단히 하면 $\log_2(x+2)^2-\log_2(2x+5)=\log_2\dfrac{(x+2)^2}{2x+5}<1$. 즉, $\dfrac{(x+2)^2}{2x+5}<2$이다.
      criteria:
      - 1.M2
    - id: 1b-3
      content: 정리하면 $x^2+4x+4<4x+10$, 즉 $x^2<6$을 얻는다. 이 식을 만족시키는 정수 $x$는 $x=0,\ 1,\ -1,\ 2,\ -2$.
      criteria:
      - 1.M3
    - id: 1b-4
      content: $x+2>0$이므로 $x=-2$는 제외되고 조건을 만족시키는 정수는 $4$개이다.
      criteria:
      - 1.A1
