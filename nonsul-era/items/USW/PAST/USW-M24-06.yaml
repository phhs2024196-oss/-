stem: |-
  (단답형 문제) 아래는 수열 $\{a_n\}$이 $a_1=\sqrt2-1$이고, 모든 자연수 $n$에 대하여
  $$a_{n+1}-\sqrt2a_n+(1-\sqrt2)n+1=0$$
  일 때, $a_{16}$의 값을 구하는 과정이다. 빈칸 $\boxed{\ ①\ }$, $\boxed{\ ②\ }$, $\boxed{\ ③\ }$, $\boxed{\ ④\ }$를 알맞게 채우시오.

  [풀이 과정 상자] 주어진 식 $a_{n+1}-\sqrt2a_n+(1-\sqrt2)n+1=0$을 정리하면, $a_{n+1}+(n+1)=\boxed{\ ①\ }$으로 쓸 수 있다. 그러므로 수열 $\{a_n+n\}$은 공비가 $\boxed{\ ②\ }$인 등비수열임을 알 수 있다. 일반항을 구하면 $a_n+n=\boxed{\ ③\ }$이다. 따라서 $a_{16}+16=\boxed{\ ④\ }$이고, $a_{16}=\boxed{\ ④\ }-16$이다.
