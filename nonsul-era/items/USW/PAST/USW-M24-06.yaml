      content: 주어진 식을 정리하면 $a_{n+1}+(n+1)=\sqrt2a_n+\sqrt2n=\sqrt2(a_n+n)$. (① $\sqrt2(a_n+n)$)
      criteria:
      - 1.M1
    - id: 1b-2
      content: 따라서 수열 $\{a_n+n\}$은 공비가 $\sqrt2$인 등비수열이다. (② $\sqrt2$)
      criteria:
      - 1.M2
    - id: 1b-3
      content: $a_1+1=\sqrt2$이므로 $a_n+n=(\sqrt2)^{n-1}(a_1+1)=(\sqrt2)^n$. (③ $(\sqrt2)^n$)
      criteria:
