    source_flow: GB24.pdf p.16 모범답안
    method_no: 1
    steps:
    - id: 1b-1
      content: 극한이 존재하는데 $\displaystyle\lim_{x\to-2}(x^2-(a-2)x-2a)=\lim_{x\to-2}(x+2)(x-a)=0$이므로 $\displaystyle\lim_{x\to-2}(\sqrt{a-2x}-3)=0$이어야 해서 $\sqrt{a+4}-3=0$, 즉 $a=5$.
      criteria:
      - 1.M1
    - id: 1b-2
      content: 그러므로 $\displaystyle\lim_{x\to-2}\dfrac{\sqrt{a-2x}-3}{x^2-(a-2)x-2a}=\lim_{x\to-2}\dfrac{\sqrt{5-2x}-3}{(x+2)(x-5)}=\lim_{x\to-2}\dfrac{\sqrt{5-2x}-3}{(x+2)(x-5)}\cdot\dfrac{\sqrt{5-2x}+3}{\sqrt{5-2x}+3}=\lim_{x\to-2}\dfrac{-2(x+2)}{(x+2)(x-5)(\sqrt{5-2x}+3)}=\dfrac1{21}$
      criteria:
      - 1.A1
