stem: 상수 $a$에 대하여 극한 $\displaystyle\lim_{x\to-2}\dfrac{\sqrt{a-2x}-3}{x^2-(a-2)x-2a}$이 존재할 때, 극한값을 구하는 과정을 논술하시오.
