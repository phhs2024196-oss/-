stem: 다항함수 $f(x)$에 대하여 $f\,'(x)=3x^2-12x$이고 $f(0)=0$일 때, 곡선 $y=f(x)$와 $x$축으로 둘러싸인 부분의 넓이를 구하는 과정을 논술하시오.
