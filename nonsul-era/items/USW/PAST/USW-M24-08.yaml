    source_flow: GB24.pdf p.16 모범답안
    method_no: 1
    steps:
    - id: 1b-1
      content: $f\,'(x)=3x^2-12x$이므로 $f(x)=x^3-6x^2+C$ (단, $C$는 적분상수). $f(0)=0$이므로 $C=0$.
      criteria:
      - 1.M1
    - id: 1b-2
      content: $f(x)=x^3-6x^2=x^2(x-6)$이므로 $f(x)=0$에서 $x=0$ 또는 $x=6$.
      criteria:
      - 1.M2
    - id: 1b-3
      content: $0<x<6$에서 $f(x)=x^2(x-6)<0$이므로 $y=f(x)$와 $x$축으로 둘러싸인 부분의 넓이는 $\displaystyle\int_0^6|f(x)|dx=\int_0^6|x^2(x-6)|dx=-\int_0^6x^2(x-6)dx=-\left[\dfrac14x^4-2x^3\right]_0^6=\dfrac12\times6^3=108$
      criteria:
      - 1.A1
