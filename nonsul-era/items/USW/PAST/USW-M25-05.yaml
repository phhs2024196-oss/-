    - id: 1b-2
      content: $\log_{\frac12}(11-x)\left(\dfrac12x-4\right)\ge0=\log_{\frac12}1$.
      criteria:
      - 1.M2
    - id: 1b-3
      content: 밑이 $1$보다 작으므로 $(11-x)\left(\dfrac12x-4\right)\le1$.
      criteria:
      - 1.M3
    - id: 1b-4
      content: $(x-11)(x-8)\ge-2$, $x^2-19x+90=(x-9)(x-10)\ge0$. $x\le9,\ x\ge10$.
      criteria:
      - 1.M4
    - id: 1b-5
      content: 따라서 $8<x\le9,\ 10\le x<11$.
      criteria:
