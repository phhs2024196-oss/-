stem: |-
  등비수열 $\{a_n\}$의 첫째항부터 제 $n$항까지의 합을 $S_n$이라 하자.
  $$\dfrac{S_{12}-S_9}{S_8-S_5}=3,\qquad \dfrac{S_8}{S_4}=a_1^2$$
  일 때, $a_2\times a_8$의 값을 구하는 과정을 논술하시오.
