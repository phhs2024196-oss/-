    source_flow: GB25.pdf p.15 모범답안
    method_no: 1
    steps:
    - id: 1b-1
      content: 등비수열 $\{a_n\}$의 공비를 $r$이라 하자. $\dfrac{S_{12}-S_9}{S_8-S_5}=\dfrac{a_{10}+a_{11}+a_{12}}{a_6+a_7+a_8}=r^4=3$.
      criteria:
      - 1.M1
    - id: 1b-2
      content: $\dfrac{S_8}{S_4}=\dfrac{a_1(r^8-1)/(r-1)}{a_1(r^4-1)/(r-1)}=r^4+1=4=a_1^2$.
      criteria:
      - 1.M2
    - id: 1b-3
      content: $a_2\times a_8=(a_1r)\times(a_1r^7)=a_1^2\times r^8=a_1^2\times(r^4)^2=4\times3^2=36$.
      criteria:
      - 1.A1
