stem: |-
  그림과 같이 밑면의 반지름의 길이가 $5$이고 높이가 $10$인 원뿔 모양의 그릇이 있다. 비어 있는 이 그릇에 매초 $2$의 속도로 수면의 높이가 상승하도록 물을 부을 때, $2$초 후 그릇에 담긴 물의 부피의 변화율을 구하는 과정을 논술하시오.

  [그림 1: 꼭짓점이 아래인 원뿔 모양의 그릇. 밑면 반지름 $5$, 높이 $10$이 표시되어 있고 아래쪽에 물이 담겨 수면이 보인다]
