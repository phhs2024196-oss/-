    method_no: 1
    steps:
    - id: 1b-1
      content: 반지름과 높이의 비율이 $1:2$이므로 $2r=h$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: 원뿔의 부피는 $V=\dfrac13\pi r^2h=\dfrac1{12}\pi h^3$이다.
      criteria:
      - 1.M2
    - id: 1b-3
      content: 시간 $t$로 미분하면 $\dfrac{dV}{dt}=\dfrac14\pi h^2\dfrac{dh}{dt}$이다.
      criteria:
      - 1.M3
    - id: 1b-4
      content: $\dfrac{dh}{dt}=2$, $h=2\times2=4$를 대입하면 $\dfrac{dV}{dt}=\dfrac14\pi\times4^2\times2=8\pi$이다.
      criteria:
      - 1.A1
