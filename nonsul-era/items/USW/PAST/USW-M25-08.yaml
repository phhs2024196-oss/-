stem: |-
  양수 $a$에 대하여 곡선 $y=x^2-ax$와 직선 $y=\dfrac a2x$로 둘러싸인 부분의 넓이를 $S_1$이라 하자. 또 그림과 같이 곡선과 직선의 두 교점 O와 P, 그리고 P에서 $x$축에 내린 수선이 $x$축과 만나는 점 Q가 만드는 직각삼각형 OPQ의 넓이를 $S_2$라 할 때, $S_1=S_2$를 보이는 과정을 논술하시오.

  [그림 1: 아래로 볼록한 곡선 $y=x^2-ax$와 직선 $y=\dfrac a2x$가 원점 O와 점 P에서 만나고, P에서 $x$축에 내린 수선의 발이 Q이다]
