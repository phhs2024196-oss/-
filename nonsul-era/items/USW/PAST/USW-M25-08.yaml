    method_no: 1
    steps:
    - id: 1b-1
      content: $x^2-ax=\dfrac a2x$에서 교점 P, 즉 Q의 $x$좌표는 $\dfrac32a$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: $S_1=S_2$를 보이기 위해서 곡선과 직선으로 둘러싸인 부분과 직각삼각형의 공통부분을 제외한 나머지 부분의 넓이가 같음을 보이면 된다. 즉, 아래 정적분이 $0$임을 보이면 된다.
      criteria:
      - 1.M2
    - id: 1b-3
      content: $\displaystyle\int_0^{\frac32a}(x^2-ax)\,dx=\left[\dfrac13x^3-\dfrac a2x^2\right]_0^{\frac32a}=\dfrac98a^3-\dfrac98a^3=0$.
      criteria:
      - 1.A1
