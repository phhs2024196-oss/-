    - id: 1b-2
      content: $0=f\,'(1)=3+2a-a^2=-(a+1)(a-3)$. $a$는 양수이므로 $a=3$.
      criteria:
      - 1.M2
    - id: 1b-3
      content: $f\,'(x)=3x^2+6x-9=3(x^2+2x-3)=3(x+3)(x-1)$. 극댓점은 $x=-3$.
      criteria:
      - 1.M3
    - id: 1b-4
      content: $3=f(1)=1+3-9+b$로부터 $b=8$.
      criteria:
      - 1.M4
    - id: 1b-5
      content: 극댓값은 $f(-3)=-27+27+27+8=35$.
      criteria:
      - 1.A1
