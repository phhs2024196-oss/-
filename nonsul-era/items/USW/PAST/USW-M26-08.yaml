stem: |-
  그림처럼 곡선 $y=x^3-kx^2$과 직선 $y=(k+1)x$의 교점을 A라 하고, 점 A에서 $x$축에 내린 수선의 발을 B라고 할 때, $x\ge0$인 영역에서 주어진 곡선과 직선으로 둘러싸인 부분의 넓이가 원점 O를 꼭짓점으로 한 삼각형 OAB의 넓이와 같게 되는 실수 $k$의 값을 구하는 과정을 논술하시오. (단, $k\ge0$)

  [그림 1: 곡선 $y=x^3-kx^2$과 직선 $y=(k+1)x$가 원점 O와 점 A에서 만나고, A에서 $x$축에 내린 수선의 발이 B이다]
