    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    source_flow: GB26.pdf p.17 모범답안
    method_no: 1
    steps:
    - id: 1b-1
      content: $x^3-kx^2=(k+1)x$에서 $0=x^3-kx^2-(k+1)x=x(x^2-kx-(k+1))=x(x-k-1)(x+1)$. B의 $x$좌표는 $k+1$.
      criteria:
      - 1.M1
    - id: 1b-2
      content: 곡선의 아래쪽 영역의 넓이와 위쪽 영역의 넓이는 같다. 따라서 $0=\displaystyle\int_0^{k+1}(x^3-kx^2)\,dx$.
      criteria:
      - 1.M2
    - id: 1b-3
      content: $\left[\dfrac14x^4-\dfrac k3x^3\right]_0^{k+1}=\dfrac{(k+1)^4}4-\dfrac{k(k+1)^3}3=(k+1)^3\left(\dfrac{k+1}4-\dfrac k3\right)=(k+1)^3\left(\dfrac{3-k}{12}\right)$. $k=3$.
      criteria:
      - 1.A1
