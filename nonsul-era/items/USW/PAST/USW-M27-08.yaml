    steps:
    - id: 1b-1
      content: $y=\sqrt[n]x$는 $y=x^n$의 역함수이므로 그래프가 $y=x$에 대하여 대칭이다. 따라서 두 곡선으로 둘러싸인 도형의 넓이는 $y=x$와 $y=x^n$으로 둘러싸인 도형의 넓이의 $2$배이다. 넓이는 $S_n=2\displaystyle\int_0^1(x-x^n)\,dx$.
      criteria:
      - 1.M1
    - id: 1b-2
      content: $=\left[x^2-\dfrac2{n+1}x^{n+1}\right]_0^1=1-\dfrac2{n+1}=\dfrac{n-1}{n+1}$
      criteria:
      - 1.M2
    - id: 1b-3
      content: $S_2\times S_4\times S_6\times S_8\times S_{10}=\dfrac13\times\dfrac35\times\dfrac57\times\dfrac79\times\dfrac9{11}=\dfrac1{11}$
      criteria:
      - 1.A1
