stem: 자연수 $n$에 대하여, $x\ge0$일 때 두 곡선 $y=x^n$과 $y=\sqrt[n]x$로 둘러싸인 도형의 넓이를 $S_n$이라고 하자. $S_2\times S_4\times S_6\times S_8\times S_{10}$의 값을 구하는 과정을 논술하시오.
