stimuli: []
stem: |-
  【문제 1】아래의 제시문을 읽고 문항별로 풀이와 함께 답하시오. (30점)

  (가) 함수 $f(x)$가 $a,b$를 포함하는 열린구간에서 연속이고, $f(x)$의 한 부정적분이 $F(x)$일 때, 일정한 값 $F(b)-F(a)$를 함수 $f(x)$의 $a$에서 $b$까지의 정적분이라고 하며, 이것을 기호로 $\displaystyle\int_a^bf(x)dx$와 같이 나타낸다.

  (나) 두 집합 $X,Y$에서 함수 $f:X\to Y$가 일대일대응이면 $Y$의 각 원소 $y$에 대응하는 $X$의 원소 $x$는 단 하나 존재한다. 이때 $Y$의 각 원소 $y$에 $y=f(x)$인 $X$의 원소 $x$가 대응하면 $Y$를 정의역으로 하고 $X$를 공역으로 하는 새로운 함수를 정의할 수 있으며 이 함수를 역함수라고 한다.

  (다) 함수 $f(x)$와 $g(x)$를 다음과 같이 정의한다. (단, $a,b$는 상수)

  $$f(x)=\begin{cases}2x^2,&x<-1\\-x+a,&-1\le x<1\\-\dfrac13x+b,&1\le x\end{cases},\qquad g(x)=\displaystyle\int_0^x\dfrac{1}{1+t^2}dt$$
subparts:
- id: 1-1
  stem: '[문제 1-1] 제시문 (다)에서 주어진 함수 $f(x)$는 정의역과 공역이 실수 전체의 집합이다. $f(x)$는 역함수 $h(x)$가 존재하고 $h(h(8))=c$을 만족시킬 때, $a+b+c$의 값을 구하시오. (10점)'
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 25/3
    equivalents:
    - $\dfrac{25}{3}$
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: $f(x)$의 역함수가 존재하므로 $f(x)$는 일대일대응이다. $x=-1$에서 오직 하나의 값을 가져야 하므로 $f(-1)=2$이어야 한다. 즉 $f(-1)=-(-1)+a=2$, $a=1$이다.
      source_flow: 모범답안 p.2
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: $x=1$에서 오직 하나의 값을 가져야 하므로 $f(1)=0$이어야 한다. 즉 $f(1)=-\dfrac13+b=0$, $b=\dfrac13$이다. 따라서 $y=f(x)$의 그래프는 [그림 1]과 같다.
      source_flow: 모범답안 p.2
      criteria:
      - 1-1.M1
    - id: 11b-3
      content: $h(8)=t$라 하면 $f(t)=8$이고, 그래프에서 $t<-1$이므로 $f(t)=2t^2=8$, $t=-2$ $(t<-1)$이다.
      source_flow: 모범답안 p.2
      criteria:
      - 1-1.M2
    - id: 11b-4
      content: $h(h(8))=h(-2)=c$에서 $f(c)=-2$이고 $c>1$이므로 $f(c)=-\dfrac13c+\dfrac13=-2$이다. 따라서 $c=7$이고 $a+b+c=1+\dfrac13+7=\dfrac{25}{3}$이다.
      source_flow: 모범답안 p.2
      criteria:
      - 1-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 4
      evidence: '일대일대응 조건에서 $f(-1)=2$, $f(1)=0$을 이용해 $a=1$, $b=\dfrac13$을 구했다. # 채점기준 미공개 — 단계별 추정'
      steps:
      - 11b-1
      - 11b-2
    - id: 1-1.M2
      mark_type: M
      points: 3
      evidence: '$h(8)=t$로 놓고 $f(t)=8$, $t<-1$에서 $t=-2$를 구했다. # 채점기준 미공개 — 단계별 추정'
      depends_on:
      - 1-1.M1
      steps:
      - 11b-3
    - id: 1-1.A1
      mark_type: A
      points: 3
      evidence: '$f(c)=-2$에서 $c=7$을 구하고 $a+b+c=\dfrac{25}{3}$을 얻었다. # 채점기준 미공개 — 단계별 추정'
      depends_on:
      - 1-1.M2
      steps:
      - 11b-4
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 1-2
  stem: '[문제 1-2] 제시문 (다)에서 주어진 함수 $f(x)$에 대하여 $\displaystyle\lim_{n\to\infty}\sum_{k=1}^{n}f\left(-2+\dfrac{4k}{n}\right)\dfrac1n$의 값을 구하시오. (10점)'
  points: 10
  depends_on:
  - 1-1
  answer:
    kind: value
    value: 13/8
    equivalents:
    - $\dfrac{13}{8}$
    tolerance: null
  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: $\displaystyle\lim_{n\to\infty}\sum_{k=1}^{n}f\left(-2+\dfrac{4k}{n}\right)\dfrac1n=\lim_{n\to\infty}\dfrac14\sum_{k=1}^{n}f\left(-2+\dfrac{4k}{n}\right)\dfrac4n=\dfrac14\int_{-2}^{2}f(x)dx$이다.
      source_flow: 모범답안 p.3
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: $\displaystyle\dfrac14\left(\int_{-2}^{-1}f(x)dx+\int_{-1}^{1}f(x)dx+\int_{1}^{2}f(x)dx\right)=\dfrac14\left(\int_{-2}^{-1}2x^2dx+\int_{-1}^{1}(-x+1)dx+\int_{1}^{2}\left(-\dfrac13x+\dfrac13\right)dx\right)=\dfrac{13}{8}$이다. (이때 $a=1$, $b=\dfrac13$은 문제 1-1에서 구한 값이다.)
      source_flow: 모범답안 p.3
      criteria:
      - 1-2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-2.M1
      mark_type: M
      points: 5
      evidence: '급수를 $\dfrac14\displaystyle\int_{-2}^{2}f(x)dx$ 꼴의 정적분으로 바꾸었다. # 채점기준 미공개 — 단계별 추정'
      steps:
      - 12b-1
    - id: 1-2.A1
      mark_type: A
      points: 5
      evidence: '구간을 나누어 계산해 $\dfrac{13}{8}$을 얻었다. # 채점기준 미공개 — 단계별 추정'
      depends_on:
      - 1-2.M1
      steps:
      - 12b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 1-3
  stem: |-
    [문제 1-3] 제시문 (다)에서 주어진 함수 $g(x)$가 $g(\alpha)=\dfrac\pi3$를 만족할 때, $\displaystyle\int_0^\alpha\dfrac{\sin^3(g(x))}{1+x^2}dx$의 값을 구하시오.
    (단, $\alpha$는 상수) (10점)
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 5/24
    equivalents:
    - $\dfrac{5}{24}$
    tolerance: null
  solutions:
  - id: S13-B
    audience: B
    method_no: 1
    steps:
    - id: 13b-1
      content: $g(x)=\displaystyle\int_0^x\dfrac{1}{1+t^2}dt$의 양변을 $x$에 대해서 미분하면 $g^{\prime}(x)=\dfrac{1}{1+x^2}$이므로 $\displaystyle\int_0^\alpha\dfrac{\sin^3(g(x))}{1+x^2}dx=\int_0^\alpha g^{\prime}(x)\sin^3(g(x))dx$ (1)이다.
      source_flow: 모범답안 p.3
      criteria:
      - 1-3.M1
    - id: 13b-2
      content: $g(x)=u$로 치환하면 $g^{\prime}(x)=\dfrac{du}{dx}$이므로 (1)은 $\displaystyle\int_0^{\frac\pi3}\sin^3u\,du=\int_0^{\frac\pi3}\sin^2u\sin u\,du$이다.
      source_flow: 모범답안 p.3
      criteria:
      - 1-3.M2
    - id: 13b-3
      content: $\sin^2\theta+\cos^2\theta=1$에 의하여 $\displaystyle\int_0^{\frac\pi3}(1-\cos^2u)\sin u\,du$ (2)이다. 이제 $\cos u=t$로 치환하면 $-\sin u=\dfrac{dt}{du}$이므로 (2)는 $\displaystyle\int_1^{\frac12}-(1-t^2)dt=\left[\dfrac13t^3-t\right]_1^{\frac12}=\dfrac{5}{24}$이다.
      source_flow: 모범답안 p.3
      criteria:
      - 1-3.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-3.M1
      mark_type: M
      points: 3
      evidence: '$g^{\prime}(x)=\dfrac{1}{1+x^2}$를 이용해 피적분함수를 $g^{\prime}(x)\sin^3(g(x))$로 나타냈다. # 채점기준 미공개 — 단계별 추정'
      steps:
      - 13b-1
    - id: 1-3.M2
      mark_type: M
      points: 3
      evidence: '$g(x)=u$로 치환해 $\displaystyle\int_0^{\frac\pi3}\sin^3u\,du$를 얻었다. # 채점기준 미공개 — 단계별 추정'
      depends_on:
      - 1-3.M1
      steps:
      - 13b-2
    - id: 1-3.A1
      mark_type: A
      points: 4
      evidence: '$\cos u=t$로 치환해 계산하여 $\dfrac{5}{24}$를 얻었다. # 채점기준 미공개 — 단계별 추정'
      depends_on:
      - 1-3.M2
      steps:
      - 13b-3
