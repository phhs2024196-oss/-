stem: |-
  【문제 2】아래의 제시문을 읽고 문항별로 풀이와 함께 답하시오. (35점)

  (가) 중심이 원점 O이고 반지름의 길이가 $r$인 원의 방정식은 $x^2+y^2=r^2$이다. 각 $\theta$를 나타내는 동경과 원의 교점의 좌표를 $(x,y)$라고 하면 $\tan\theta=\dfrac yx$ $(x\neq0)$이다.

  (나) 1 보다 큰 실수 $r$에 대해서 $\mathrm{C}(r)$은 좌표평면에서 중심이 $\mathrm{A}_r(a_r,0)$이고 반지름의 길이가 $r$인 원을 나타낸다. 두 원 $\mathrm{C}(r)$과 $\mathrm{C}(r+1)$의 한 교점을 $\mathrm{P}_r$이라 할 때 $\theta_r$은 점 $\mathrm{P}_r$과 원 $\mathrm{C}(r+1)$의 중심과 원점이 이루는 각 $\angle\mathrm{P}_r\mathrm{A}_{r+1}\mathrm{O}$를 나타낸다. (단, $\mathrm{P}_r$의 $y$좌표는 양수)

  $\mathrm{S}$는 두 무리함수 $y=\sqrt{2x}$와 $y=-\sqrt{2x}$으로 만들어지는 곡선이다. 원 $\mathrm{C}(r)$과 곡선 $\mathrm{S}$는 서로 다른 두 점에서 접한다.

  [그림: 좌표평면에서 원점 O를 꼭짓점으로 오른쪽으로 열린 곡선 S(포물선 모양)가 있고, 두 원 C(r)과 C(r+1)이 곡선 S에 접하며 서로 만나 교점 P_r이 위쪽에 있다. 점 P_r에서 원 C(r+1)의 중심 A_{r+1}을 잇고 O와 A_{r+1}을 잇는 선분이 있으며, 두 선분이 이루는 각이 θ_r이다.]
subparts:
- id: 2-1
  stem: '[문제 2-1] 제시문 (나)의 $\mathrm{A}_r(a_r,0)$에 대해서 $a_r$을 $r$로 나타내시오. (10점)'
  points: 10
  depends_on: []
  answer:
    kind: value
    value: (r**2+1)/2
    equivalents:
    - $a_r=\dfrac{r^2+1}{2}$
    tolerance: null
  solutions:
  - id: S21-B
    audience: B
    method_no: 1
    steps:
    - id: 21b-1
      content: 원 $\mathrm{C}(r)$과 곡선 $\mathrm{S}$의 식을 연립한다. $x=\dfrac12y^2$ (1), $(x-a_r)^2+y^2=r^2$ (2)
      source_flow: 모범답안 p.5
      criteria:
      - 2-1.M1
    - id: 21b-2
      content: (1)을 (2)에 대입하여 정리하면 $(x-a_r)^2+2x-r^2=0$이다. 이 이차방정식의 판별식이 $D=0$이어야 하므로 $\dfrac D4=(a_r-1)^2-(a_r^2-r^2)=0$이고 정리하면 $a_r=\dfrac{r^2+1}{2}$이다.
      source_flow: 모범답안 p.5
      criteria:
      - 2-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2-1.M1
      mark_type: M
      points: 5
      evidence: '원과 곡선 $x=\dfrac12y^2$의 연립방정식을 세워 $x$에 대한 이차방정식 $(x-a_r)^2+2x-r^2=0$을 얻었다. # 채점기준 미공개 — 단계별 추정'
      steps:
      - 21b-1
    - id: 2-1.A1
      mark_type: A
      points: 5
      evidence: '접하는 조건 $D=0$에서 $a_r=\dfrac{r^2+1}{2}$을 구했다. # 채점기준 미공개 — 단계별 추정'
      depends_on:
      - 2-1.M1
      steps:
      - 21b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 2-2
  stem: '[문제 2-2] 제시문 (나)의 $\mathrm{A}_r(a_r,0)$에 대해서, 1 보다 큰 모든 실수 $r$에 대한 방정식 $\left(a_{2r}-\dfrac12\right)e^{-r}+k=0$가 서로 다른 두 실근을 갖도록 하는 실수 $k$의 범위를 구하시오. (단, $\displaystyle\lim_{x\to\infty}\left(\dfrac{2x^2}{e^x}\right)=0$) (13점)'
  points: 13
  depends_on:
  - 2-1
  answer:
    kind: expression
    value: -8*exp(-2)<k<-2*exp(-1)
    equivalents:
    - $-\dfrac{8}{e^2}<k<-\dfrac{2}{e}$
    tolerance: null
  solutions:
  - id: S22-B
    audience: B
    method_no: 1
    steps:
    - id: 22b-1
      content: $\left(\dfrac{4r^2+1}{2}-\dfrac12\right)e^{-r}+k=0$, 즉 $2r^2e^{-r}=-k$이다. 1보다 큰 모든 실수 $x$에 대해 $f(x)=2x^2e^{-x}$ (또는 $r$에 대해 $f(r)=2r^2e^{-r}$)이라 한다.
      source_flow: 모범답안 p.5~6
      criteria:
      - 2-2.M1
    - id: 22b-2
      content: $f^{\prime}(x)=2e^{-x}(2x-x^2)$이므로 $f^{\prime}(x)=0$에서 $x=0$ 또는 $x=2$이다. $f^{\prime\prime}(x)=2e^{-x}(x^2-4x+2)$에서 $f^{\prime\prime}(0)=4>0$, $f^{\prime\prime}(2)=-4e^{-2}<0$이므로 함수 $f(x)$의 극솟값은 $f(0)=0$, 극댓값은 $f(2)=8e^{-2}$이다.
      source_flow: 모범답안 p.5~6
      criteria:
      - 2-2.M2
    - id: 22b-3
      content: $\displaystyle\lim_{x\to-\infty}f(x)=\lim_{x\to-\infty}\left(\dfrac{2x^2}{e^x}\right)=\infty$, $\displaystyle\lim_{x\to\infty}f(x)=\lim_{x\to\infty}\left(\dfrac{2x^2}{e^x}\right)=0$이므로 함수 $f(x)=2x^2e^{-x}$의 그래프의 개형은 [그림 2]와 같다.
      source_flow: 모범답안 p.5~6
      criteria:
      - 2-2.M3
    - id: 22b-4
      content: 곡선 $f(x)=2x^2e^{-x}$ $(x>1)$과 직선 $y=-k$가 서로 다른 두 점에서 만나야 하므로 구하는 $k$값의 범위는 $-\dfrac{8}{e^2}<k<-\dfrac{2}{e}$이다.
      source_flow: 모범답안 p.5~6
      criteria:
      - 2-2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2-2.M1
      mark_type: M
      points: 3
      evidence: '방정식을 $2r^2e^{-r}=-k$로 정리하고 함수 $f(x)=2x^2e^{-x}$를 만들었다. # 채점기준 미공개 — 단계별 추정'
      steps:
      - 22b-1
    - id: 2-2.M2
      mark_type: M
      points: 4
      evidence: '$f^{\prime}(x)$, $f^{\prime\prime}(x)$를 구해 극솟값 $0$, 극댓값 $8e^{-2}$을 구했다. # 채점기준 미공개 — 단계별 추정'
      depends_on:
      - 2-2.M1
      steps:
      - 22b-2
    - id: 2-2.M3
      mark_type: M
      points: 3
      evidence: '극한값을 이용해 그래프의 개형을 그렸다. # 채점기준 미공개 — 단계별 추정'
      depends_on:
      - 2-2.M2
      steps:
      - 22b-3
    - id: 2-2.A1
      mark_type: A
      points: 3
      evidence: '$x>1$에서 직선 $y=-k$와 두 점에서 만날 조건으로 $-\dfrac{8}{e^2}<k<-\dfrac{2}{e}$를 구했다. # 채점기준 미공개 — 단계별 추정'
      depends_on:
      - 2-2.M3
      steps:
      - 22b-4
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 2-3
  stem: '[문제 2-3] 제시문 (나)의 $\theta_r$에 대해서 $\displaystyle\lim_{r\to\infty}\tan(\theta_r)$을 구하시오. (12점)'
  points: 12
  depends_on:
  - 2-1
  answer:
    kind: value
    value: sqrt(3)
    equivalents:
    - $\sqrt3$
    tolerance: null
  solutions:
  - id: S23-B
    audience: B
    method_no: 1
    steps:
    - id: 23b-1
      content: 연립이차방정식 $(x-a_r)^2+y^2=r^2$ (1), $(x-a_{r+1})^2+y^2=(r+1)^2$ (2)에서 (1)에서 $y^2=r^2-(x-a_r)^2$ (3)이다.
      source_flow: 모범답안 p.6~7
      criteria:
      - 2-3.M1
    - id: 23b-2
      content: (3)을 (2)에 대입하면 $(x-a_{r+1})^2-(x-a_r)^2=(r+1)^2-r^2$, $x=\dfrac{r^2+r-1}{2}$이고 (1)에 대입하면 $y=\pm\dfrac{\sqrt{3r^2+4r-4}}{2}$이다.
      source_flow: 모범답안 p.6~7
      criteria:
      - 2-3.M2
    - id: 23b-3
      content: 따라서 점 $\mathrm{P}_r$은 $\left(\dfrac{r^2+r-1}{2},\dfrac{\sqrt{3r^2+4r-4}}{2}\right)$이다. [그림 3]에서 $t=a_{r+1}-x=\dfrac{r+3}{2}$이고 $s=\dfrac{\sqrt{3r^2+4r-4}}{2}$이다.
      source_flow: 모범답안 p.6~7
      criteria:
      - 2-3.M3
    - id: 23b-4
      content: 그러므로 $\displaystyle\lim_{r\to\infty}\tan(\theta_r)=\lim_{r\to\infty}\dfrac st=\lim_{r\to\infty}\dfrac{\dfrac{\sqrt{3r^2+4r-4}}{2}}{\dfrac{r+3}{2}}=\sqrt3$이다.
      source_flow: 모범답안 p.6~7
      criteria:
      - 2-3.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2-3.M1
      mark_type: M
      points: 3
      evidence: '두 원의 방정식을 연립해 $x$좌표를 구했다. # 채점기준 미공개 — 단계별 추정'
      steps:
      - 23b-1
    - id: 2-3.M2
      mark_type: M
      points: 3
      evidence: '$y$좌표를 구해 $\mathrm{P}_r$의 좌표를 얻었다. # 채점기준 미공개 — 단계별 추정'
      depends_on:
      - 2-3.M1
      steps:
      - 23b-2
    - id: 2-3.M3
      mark_type: M
      points: 3
      evidence: '$\tan\theta_r=\dfrac st$로 $s$, $t$를 나타냈다. # 채점기준 미공개 — 단계별 추정'
      depends_on:
      - 2-3.M2
      steps:
      - 23b-3
    - id: 2-3.A1
      mark_type: A
      points: 3
      evidence: '극한값 $\sqrt3$을 구했다. # 채점기준 미공개 — 단계별 추정'
      depends_on:
      - 2-3.M3
      steps:
      - 23b-4
