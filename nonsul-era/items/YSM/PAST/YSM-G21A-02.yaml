key_idea: 접하는 조건은 연립한 이차방정식의 판별식 $D=0$이고, $a_{2r}$을 대입하면 $2r^2e^{-r}=-k$가 되어 $x>1$에서 $2x^2e^{-x}$의 극값·극한으로 개형을 그려 교점의 수를 센다. 점 $\mathrm{P}_r$은 두 원의 연립으로 구하고 $\tan\theta_r$은 높이를 밑변으로 나눈 값이다.
