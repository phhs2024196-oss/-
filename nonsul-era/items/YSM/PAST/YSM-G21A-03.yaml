stem: |-
  【문제 3】아래의 제시문을 읽고 문항별로 풀이와 함께 답하시오. (35점)

  (가) 이산확률변수 $X$의 확률질량함수가 $\mathrm{P}(X=x_i)=p_i$ $(i=1,2,3,\cdots,n)$일 때, $X$의 기댓값(평균)은

  $$\mathrm{E}(X)=m=x_1p_1+x_2p_2+\cdots+x_np_n$$

  이다. 그리고 이산확률변수 $X$와 임의의 두 상수 $a,b(a\neq0)$에 대하여 $\mathrm{E}(aX+b)=a\mathrm{E}(X)+b$이다.

  (나) 아래의 그림과 같이 곡선 $y=49-(x-7)^2$이 $x$축과 만나는 점은 $\mathrm{A}(0,0)$, $\mathrm{B}(14,0)$이다. 두 개의 주사위를 던져서 나오는 눈의 수 중 큰 수를 확률변수 $X$라 하고, 그 값을 $k$라고 할 때, 곡선이 직선 $x=k$, $x=14-k$와 만나는 점은 각각 $\mathrm{D},\mathrm{C}$이다. 그러면, 이 때 만들어지는 사각형 ABCD의 넓이 $S$는 이산확률변수가 된다.

  [그림: 위로 볼록한 포물선 $y=49-(x-7)^2$이 $x$축과 A(0,0), B(14,0)에서 만나고, 직선 $x=k$, $x=14-k$가 포물선과 만나는 점 D, C가 있으며 사각형 ABCD(사다리꼴)에 색이 칠해져 있다. $x$축에 $0,1,\cdots,k,\cdots,14-k,\cdots,13,14$가 표시되어 있다.]

  (다) 제시문 (나)에서 정의된 확률변수 $X$의 값을 $k$라 하자. 제시문 (나)에서 주어진 사각형 ABCD를 밑면으로 하는 입체도형 R이 있다. 다음 그림과 같이 두 점 $\mathrm{P}(x,0)$, $\mathrm{Q}(x,y)$를 지나고 $x$축에 수직인 평면으로 입체도형 R을 자르면, 그 단면이 높이가 $e^{-x}$, 밑변의 길이가 $y$인 직사각형이 된다.

  [그림: 밑면 사각형 ABCD 위에 $x$축에 수직인 평면으로 자른 직사각형 단면(높이 $e^{-x}$, 밑변의 길이 $y$)이 $xy$평면의 점 P(x,0), Q(x,y)를 지나도록 그려진 입체도형 R의 그림.]
subparts:
- id: 3-1
  stem: '[문제 3-1] 제시문 (나)에서 정의된 확률변수 $X$에 대해서 $Y=36X-150$일 때 $Y$의 기댓값 $\mathrm{E}(Y)$를 구하시오. 그리고 $\mathrm{P}(S\ge400)=\dfrac qp$일 때 $p+q$를 구하시오. (단, $p$와 $q$는 서로소인 자연수) (12점)'
  points: 12
  depends_on: []
  answer:
    kind: value
    value: E=18; sum=22
    equivalents:
    - $\mathrm{E}(Y)=18$, $p+q=22$
    tolerance: null
  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: 주사위를 두 번 던져서 나오는 두 눈 중에서 큰 값이 결정될 수 있는 경우는 $(1,2),(1,3),\cdots,(6,5)$로 경우의 수가 30이다. $X=2$가 되는 경우는 $(1,2)$와 $(2,1)$로 2가지로 $\mathrm{P}(X=2)=\dfrac{2}{30}$이다. 마찬가지로 $X=3,4,5,6$에 대해서도 확률을 구하면 $X$가 $2,3,4,5,6$일 때 확률이 각각 $\dfrac{2}{30},\dfrac{4}{30},\dfrac{6}{30},\dfrac{8}{30},\dfrac{10}{30}$이다.
      source_flow: 모범답안 p.9~10
      criteria:
      - 3-1.M1
    - id: 31b-2
      content: $\mathrm{E}(X)=2\times\dfrac{2}{30}+3\times\dfrac{4}{30}+4\times\dfrac{6}{30}+5\times\dfrac{8}{30}+6\times\dfrac{10}{30}=\dfrac{140}{30}$이다. 따라서 $\mathrm{E}(36X)=36\mathrm{E}(X)=168$이고 $\mathrm{E}(Y)=\mathrm{E}(36X-150)=168-150=18$이다.
      source_flow: 모범답안 p.9~10
      criteria:
      - 3-1.A1
    - id: 31b-3
      content: 사각형 ABCD는 사다리꼴이므로 $S=\dfrac12\{14+(14-2k)\}\{49-(k-7)^2\}$이다. $k=2,3,\cdots,6$일 때 $S$는 각각 $288,363,400,405,384$이고 각 값이 나올 확률은 $\dfrac{2}{30},\dfrac{4}{30},\dfrac{6}{30},\dfrac{8}{30},\dfrac{10}{30}$이다.
      source_flow: 모범답안 p.9~10
      criteria:
      - 3-1.M2
    - id: 31b-4
      content: '따라서 $\mathrm{P}(S\ge400)=\mathrm{P}(S=400)+\mathrm{P}(S=405)=\dfrac{3}{15}+\dfrac{4}{15}=\dfrac{7}{15}$이다. 여기서 $p=15$, $q=7$이므로 $p+q=15+7=22$이다. (참고: 주사위 눈이 $(3,3)$과 같이 큰 수가 없는 경우에도 3을 큰 수로 취급하여 풀면 $\mathrm{E}(Y)=161-150=11$, $\mathrm{P}(S\ge400)=\dfrac{9}{15}$, $p+q=24$가 된다는 공식 Note가 있다.)'
      source_flow: 모범답안 p.9~10
      criteria:
      - 3-1.A2
  rubric:
