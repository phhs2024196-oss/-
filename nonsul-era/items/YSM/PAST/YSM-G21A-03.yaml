- id: 3-2
  stem: '[문제 3-2] 제시문 (나)에서 곡선과 $x$축으로 둘러싸인 부분에서 사각형 ABCD를 제외한 넓이를 $T$라고 할 때, $T$를 최소로 하는 $k$값을 찾고, 그 때의 $3T$ 값을 구하시오. (8점)'
  points: 8
  depends_on:
  - 3-1
  answer:
    kind: value
    value: k=5; 3T=157
    equivalents:
    - $k=5$, $3T=157$
    tolerance: null
  solutions:
  - id: S32-B
    audience: B
    method_no: 1
    steps:
    - id: 32b-1
      content: 포물선의 면적은 $\displaystyle\int_0^{14}\{49-(x-7)^2\}dx=\dfrac{1372}{3}$이다.
      source_flow: 모범답안 p.10
      criteria:
      - 3-2.M1
    - id: 32b-2
      content: 문제 3-1의 표에서 $k=5$일 때 $S$가 최대가 되므로 $T$는 $k=5$일 때 최소가 되며, 이때 $3T=3\left(\dfrac{1372}{3}-405\right)=1372-1215=157$이다.
      source_flow: 모범답안 p.10
      criteria:
      - 3-2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3-2.M1
      mark_type: M
      points: 3
      evidence: '정적분으로 곡선과 $x$축으로 둘러싸인 넓이 $\dfrac{1372}{3}$을 구했다. # 채점기준 미공개 — 단계별 추정'
      steps:
      - 32b-1
    - id: 3-2.A1
      mark_type: A
      points: 5
      evidence: '$S$가 최대인 $k=5$에서 $T$가 최소임을 알고 $3T=157$을 구했다. # 채점기준 미공개 — 단계별 추정'
      depends_on:
      - 3-2.M1
      steps:
      - 32b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 3-3
  stem: '[문제 3-3] 두 개의 주사위를 한 번 던져 나온 눈이 2와 6이다. 이때 제시문 (다)에서 주어진 입체도형 R의 부피를 $a+be^{-6}+ce^{-8}+de^{-14}$로 나타낼 때 $a,b,c,d$의 값을 구하시오. (단, $a,b,c,d$는 유리수) (15점)'
  points: 15
  depends_on: []
  answer:
    kind: value
    value: a=8; b=-8; c=-8; d=8
    equivalents:
    - $a=8$, $b=-8$, $c=-8$, $d=8$
    tolerance: null
  solutions:
  - id: S33-B
    audience: B
    method_no: 1
    steps:
    - id: 33b-1
      content: $k=6$에 대해서 $x$의 범위가 $[0,6]$, $[6,8]$, $[8,14]$일 때에 단면인 직사각형의 높이(밑변의 길이 $y$)는 각각 $y=8x$ $(x\in[0,6])$, $y=48$ $(x\in[6,8])$, $y=-8x+112$ $(x\in[8,14])$이다.
      source_flow: 모범답안 p.11
      criteria:
      - 3-3.M1
    - id: 33b-2
      content: 입체도형 R의 부피 $V$는 단면의 넓이를 적분하여 얻으므로 $V=\displaystyle\int_0^6(8x)e^{-x}dx+\int_6^8 48e^{-x}dx+\int_8^{14}(-8x+112)e^{-x}dx$이다.
      source_flow: 모범답안 p.11
      criteria:
      - 3-3.M2
    - id: 33b-3
      content: 부분적분을 시행하면 $V=8\left(\left[-xe^{-x}\right]_0^6+\displaystyle\int_0^6e^{-x}dx\right)-48\left[e^{-x}\right]_6^8-8\left(\left[-xe^{-x}\right]_8^{14}+\int_8^{14}e^{-x}dx\right)-112\left[e^{-x}\right]_8^{14}$ $=8-8e^{-6}-8e^{-8}+8e^{-14}$이다.
      source_flow: 모범답안 p.11
      criteria:
      - 3-3.M3
    - id: 33b-4
      content: 그러므로 $a=8$, $b=-8$, $c=-8$, $d=8$이다.
      source_flow: 모범답안 p.11
      criteria:
      - 3-3.A1
