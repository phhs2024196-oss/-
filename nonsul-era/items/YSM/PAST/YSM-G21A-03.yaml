      points: 3
      evidence: '사다리꼴의 넓이 $S$를 $k$로 나타내고 $k=2,\cdots,6$에서의 값과 확률을 구했다. # 채점기준 미공개 — 단계별 추정'
      depends_on:
      - 3-1.A1
      steps:
      - 31b-3
    - id: 3-1.A2
      mark_type: A
      points: 3
      evidence: '$\mathrm{P}(S\ge400)=\dfrac{7}{15}$에서 $p+q=22$를 구했다. # 채점기준 미공개 — 단계별 추정'
      depends_on:
      - 3-1.M2
      steps:
