intent: 주사위를 던져 나오는 경우의 수를 나열해 확률변수의 확률분포를 구하고 기댓값의 성질을 활용할 수 있는지, 정적분으로 곡선으로 둘러싸인 넓이를 구해 최솟값 조건을 해석할 수 있는지, 단면 넓이를 구간별로 적분하고 부분적분으로 입체도형의 부피를 계산할 수 있는지 알아본다.
