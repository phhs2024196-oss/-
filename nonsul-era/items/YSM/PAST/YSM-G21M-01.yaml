stimuli: []
stem: |-
  【문제 1】아래의 제시문을 읽고 문항별로 풀이와 함께 답하시오.(25점)

  (가) COVID-19와 같은 전염병과 관련하여 시각 $t$에서 $f(t)$는 감염 가능한 사람의 수, $g(t)$는 감염자 수, $h(t)$는 치료된 사람의 수라고 할 때, 전염병의 전파 양상을 설명하는 간단한 전염병 모형은 다음과 같다. (단, 치료된 사람은 재감염 되지 않는다.)

  $$\begin{aligned}f'(t)&=-\dfrac aNg(t)f(t)\\g'(t)&=\dfrac aNg(t)f(t)-bg(t)\\h'(t)&=bg(t)\end{aligned}$$

  이 모형에서 $a$는 감염률, $b$는 회복율로 모두 양의 실수값을 가지며, $N$은 총 인구수로 상수이다. (단, $f(t)>0$, $g(t)>0$)

  (나) 어떤 도시에서 확산되고 있는 전염병에 대한 역학조사 결과, 이 전염병에 감염될 수 있는 사람이 1명부터 100명이었다. 감염자 수를 확률변수 $X$로 할 때, $X$의 확률질량함수 $\mathrm{P}(X=x)$ $(x=1,2,\cdots,99,100)$는 다음과 같은 성질을 가지고 있다고 한다.

  $$\mathrm{P}(X\ge k+1)=\dfrac{k}{k+2}\mathrm{P}(X\ge k)\ (k=1,2,\cdots,99)$$

  방역당국에서는 $\mathrm{P}(X\le k)$의 값이 $\dfrac{49}{50}$ 보다 크면 전염병 경보단계를 최고단계로 격상한다.
subparts:
- id: 1-1
  stem: '[문제 1-1] 제시문 (가)에서 $a=0.5$, $b=0.05$, $N=100$일 때, 감염 가능한 사람의 수를 $A$라고 하자. 감염자 수가 감소하는 $A$의 범위를 구하시오. (단, $A>0$) (5점)'
  points: 5
  depends_on: []
  answer:
    kind: expression
    value: A<10
    equivalents:
    - $0<A<10$
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: 감염된 사람의 수 $g(t)$가 감소한다는 것은 $g'(t)<0$인 경우이다. 주어진 식으로부터 $g'(t)=\dfrac{ag(t)f(t)}{N}-bg(t)=\left(\dfrac ab\dfrac{f(t)}{N}-1\right)bg(t)$이므로 $g'(t)<0\iff\left(\dfrac ab\dfrac{f(t)}{N}-1\right)bg(t)<0$이다.
      source_flow: 모범답안 p.2
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: $a>0$, $g(t)>0$이므로 $g'(t)<0\iff\dfrac ab\dfrac{f(t)}{N}<1\iff f(t)<bN/a=100/10=10$이다. 그러므로 $A<10$이다.
      source_flow: 모범답안 p.2
      criteria:
      - 1-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 3
      evidence: '$g''(t)=\left(\dfrac ab\dfrac{f(t)}{N}-1\right)bg(t)$로 정리하고 $g''(t)<0$ 조건을 세웠다. # 채점기준 미공개 — 단계별 추정'
      steps:
      - 11b-1
    - id: 1-1.A1
      mark_type: A
      points: 2
      evidence: '$f(t)<bN/a=10$에서 $A<10$을 구했다. # 채점기준 미공개 — 단계별 추정'
      depends_on:
      - 1-1.M1
      steps:
      - 11b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 1-2
  stem: '[문제 1-2] 제시문 (가)에서 $a=0.5$, $b=0.1$, $N=100$, $f(0)=99$, $g(0)=1$, $h(0)=0$이고, 어떤 실수 $t^*$에 대해서 $h(t^*)=20$일 때, $f(t^*)$의 값을 구하시오. (12점)'
  points: 12
  depends_on: []
  answer:
    kind: value
    value: 99*exp(-1)
    equivalents:
    - $\dfrac{99}{e}$
    tolerance: null
  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: 주어진 식으로부터 $f'(t)=-\dfrac aNg(t)f(t)$, $h'(t)=bg(t)$이므로 $\dfrac{f'(t)}{h'(t)}=-\dfrac{ag(t)f(t)/N}{bg(t)}=-\dfrac{af(t)}{bN}$이다.
      source_flow: 모범답안 p.2~3
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: 양변을 $f(t)$로 나누고 $h'(t)$를 곱하면 $\dfrac{f'(t)}{f(t)}=-\dfrac{a}{bN}h'(t)$이다.
      source_flow: 모범답안 p.2~3
      criteria:
      - 1-2.M2
    - id: 12b-3
      content: 양변을 $t$에 대해 적분하면 $\ln f(t)=-(a/(bN))h(t)+C$이다. 여기에서 $C$는 적분상수이다. 자연상수 $e$를 밑으로 하는 지수함수로 표현하면 $f(t)=e^Ce^{-ah(t)/(bN)}$이다.
      source_flow: 모범답안 p.2~3
      criteria:
      - 1-2.M2
    - id: 12b-4
      content: 적분상수 $C$를 정하기 위해 $t=0$을 대입하면 $f(0)=e^Ce^{-ah(0)/(bN)}\Rightarrow f(0)e^{ah(0)/(bN)}=e^C$이다. 그러므로 $f(t)=f(0)e^{-a(h(t)-h(0))/(bN)}=99e^{-\frac1{20}h(t)}$이다.
      source_flow: 모범답안 p.2~3
      criteria:
      - 1-2.M3
    - id: 12b-5
      content: 문제에서 주어진 $h(t^*)=20$이므로 $f(t^*)=99e^{-\frac1{20}20}=99/e$이다.
      source_flow: 모범답안 p.2~3
      criteria:
      - 1-2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-2.M1
      mark_type: M
      points: 3
      evidence: '$\dfrac{f''(t)}{h''(t)}=-\dfrac{af(t)}{bN}$를 얻었다. # 채점기준 미공개 — 단계별 추정'
      steps:
      - 12b-1
    - id: 1-2.M2
      mark_type: M
      points: 3
      evidence: '$\dfrac{f''(t)}{f(t)}=-\dfrac{a}{bN}h''(t)$를 적분해 $\ln f(t)=-\dfrac{a}{bN}h(t)+C$를 얻었다. # 채점기준 미공개 — 단계별 추정'
      depends_on:
      - 1-2.M1
      steps:
      - 12b-2
      - 12b-3
    - id: 1-2.M3
      mark_type: M
      points: 3
      evidence: '$t=0$의 조건으로 적분상수를 정해 $f(t)=99e^{-\frac{1}{20}h(t)}$을 얻었다. # 채점기준 미공개 — 단계별 추정'
      depends_on:
      - 1-2.M2
      steps:
      - 12b-4
    - id: 1-2.A1
      mark_type: A
      points: 3
      evidence: '$h(t^*)=20$을 대입해 $f(t^*)=\dfrac{99}{e}$를 구했다. # 채점기준 미공개 — 단계별 추정'
      depends_on:
      - 1-2.M3
      steps:
      - 12b-5
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 1-3
  stem: '[문제 1-3] 제시문 (나)에서 $\dfrac{\mathrm{P}(1\le X\le3)}{\mathrm{P}(6\le X\le19)}$의 값을 구하시오. 그리고 방역당국이 전염병 경보단계를 최고단계로 격상시키는 최소 감염자 수 $k$를 구하시오. (8점)'
  points: 8
  depends_on: []
  answer:
    kind: value
    value: ratio=21; k=9
    equivalents:
    - $\dfrac{\mathrm{P}(1\le X\le3)}{\mathrm{P}(6\le X\le19)}=21$, $k=9$
    tolerance: null
  solutions:
  - id: S13-B
    audience: B
    method_no: 1
    steps:
    - id: 13b-1
      content: 제시문 (나)에서 $\mathrm{P}(X\ge k+1)=\dfrac{k}{k+2}\mathrm{P}(X\ge k)$이므로 $\dfrac{\mathrm{P}(X\ge k+1)}{\mathrm{P}(X\ge k)}=\dfrac{k}{k+2}$ $(k=1,2,\cdots,99)$이다. $\mathrm{P}(X\ge k)=P_k$로 나타내면 $\dfrac{P_{k+1}}{P_k}=\dfrac{k}{k+2}$이고, 확률의 기본성질에 의해서 $\mathrm{P}(X\ge1)=P_1=\displaystyle\sum_{x=1}^{100}\mathrm{P}(X=x)=1$이다.
      source_flow: 모범답안 p.3~5
      criteria:
      - 1-3.M1
    - id: 13b-2
      content: $P_2=\dfrac13P_1=\dfrac13$, $P_3=\dfrac24P_2=\dfrac23\times\dfrac14$, $P_4=\dfrac35P_3=\dfrac24\times\dfrac15$, $\cdots$, $P_6=\dfrac57P_5=\dfrac26\times\dfrac17$이고, 같은 방법으로 계산하면 $P_{20}=\dfrac{2}{20\cdot21}$이다.
      source_flow: 모범답안 p.3~5
      criteria:
      - 1-3.M1
    - id: 13b-3
      content: $\mathrm{P}(6\le X\le19)=\mathrm{P}(X\le19)-\mathrm{P}(X\le5)=1-\mathrm{P}(X\ge20)-\{1-\mathrm{P}(X\ge6)\}=P_6-P_{20}=\dfrac{2}{6\cdot7}-\dfrac{2}{20\cdot21}=\dfrac{3}{70}$이다.
      source_flow: 모범답안 p.3~5
      criteria:
      - 1-3.M2
    - id: 13b-4
      content: $\mathrm{P}(1\le X\le3)=1-\mathrm{P}(X\ge4)=1-P_4$이며 $P_4=\dfrac{2}{4\cdot5}$이다. 따라서 $\mathrm{P}(1\le X\le3)=1-\dfrac1{10}=\dfrac9{10}$이고 구하고자 하는 값은 $\dfrac{9/10}{3/70}=21$이다.
      source_flow: 모범답안 p.3~5
      criteria:
      - 1-3.A1
    - id: 13b-5
      content: $k=8$일 때 $\mathrm{P}(X\le8)=1-P_9=1-\dfrac{2}{9\cdot10}=44/45$이다. $k=9$일 때 $\mathrm{P}(X\le9)=1-P_{10}=1-\dfrac{2}{10\cdot11}=54/55$로 최고단계의 조건($\dfrac{49}{50}$ 초과)을 만족한다. 따라서 전염병 경보단계를 격상시키는 최소 감염자수는 $k=9$이다.
      source_flow: 모범답안 p.3~5
      criteria:
      - 1-3.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
