intent: 주어진 식으로부터 $g'(t)<0$ 조건을 이용해 부등식을 만들 수 있는지, $\dfrac{f'}{f}$ 형태의 식을 적분하고 적분상수를 초기조건으로 정해 $f$와 $h$의 관계식을 얻을 수 있는지, 확률질량함수의 성질을 $\mathrm{P}(X\ge k)$ 꼴로 바꿔 구간 확률을 계산할 수 있는지 알아본다. (공식 문항해설 요약)
