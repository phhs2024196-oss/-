key_idea: $g'(t)<0$을 $f(t)$에 대한 부등식으로 바꾸고, $\dfrac{f'}{f}=-\dfrac{a}{bN}h'$을 적분해 $f$와 $h$의 관계식을 얻으며, $\mathrm{P}(X\ge k)=P_k$로 놓은 점화식 $P_{k+1}=\dfrac{k}{k+2}P_k$에서 $P_k=\dfrac{2}{k(k+1)}$을 얻어 구간 확률을 $P_k$의 차로 나타낸다.
stuck: 연립 미분방정식에서 $g$를 소거해 $f$와 $h$만의 관계로 바꾸는 단계(적분상수를 $t=0$ 조건으로 정하기)와, $\mathrm{P}(6\le X\le19)$를 $\mathrm{P}(X\ge k)$ 꼴로 바꿔 $P_6-P_{20}$로 나타내는 단계.
