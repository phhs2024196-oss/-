      isw: true
    criteria:
    - id: 1-3.M1
      mark_type: M
      points: 2
      evidence: '$\mathrm{P}(X\ge k)=P_k$로 놓고 $\dfrac{P_{k+1}}{P_k}=\dfrac{k}{k+2}$, $P_1=1$을 이용해 $P_k=\dfrac{2}{k(k+1)}$ 꼴을 구했다. # 채점기준 미공개 — 단계별 추정'
      steps:
      - 13b-1
      - 13b-2
    - id: 1-3.M2
      mark_type: M
      points: 2
      evidence: '$\mathrm{P}(6\le X\le19)=P_6-P_{20}=\dfrac{3}{70}$을 구했다. # 채점기준 미공개 — 단계별 추정'
      depends_on:
      - 1-3.M1
      steps:
      - 13b-3
    - id: 1-3.A1
      mark_type: A
      points: 2
      evidence: '$\mathrm{P}(1\le X\le3)=\dfrac{9}{10}$과 비 $21$을 구했다. # 채점기준 미공개 — 단계별 추정'
      depends_on:
      - 1-3.M2
      steps:
      - 13b-4
    - id: 1-3.A2
      mark_type: A
      points: 2
      evidence: '$\mathrm{P}(X\le k)>\dfrac{49}{50}$인 최소 $k=9$를 구했다. # 채점기준 미공개 — 단계별 추정'
      depends_on:
      - 1-3.A1
      steps:
      - 13b-5
