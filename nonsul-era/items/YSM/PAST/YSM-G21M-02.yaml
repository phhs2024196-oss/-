stimuli: []
stem: |-
  【문제 2】아래의 제시문을 읽고 문항별로 풀이와 함께 답하시오.(35점)

  (가) 삼각함수의 덧셈정리를 사용하면 $\alpha$, $\beta$의 삼각함수 값으로부터 $\alpha+\beta$와 $\alpha-\beta$의 삼각함수 값을 알 수 있다.

  $$\sin(\alpha+\beta)=\sin\alpha\cos\beta+\cos\alpha\sin\beta,\quad\sin(\alpha-\beta)=\sin\alpha\cos\beta-\cos\alpha\sin\beta$$

  $$\cos(\alpha+\beta)=\cos\alpha\cos\beta-\sin\alpha\sin\beta,\quad\cos(\alpha-\beta)=\cos\alpha\cos\beta+\sin\alpha\sin\beta$$

  $$\tan(\alpha+\beta)=\dfrac{\tan\alpha+\tan\beta}{1-\tan\alpha\tan\beta},\qquad\tan(\alpha-\beta)=\dfrac{\tan\alpha-\tan\beta}{1+\tan\alpha\tan\beta}$$

  (나) 해변가에 있는 세진이와 세연이가 바다 위에 떠 있는 배를 관찰하고 있다. 다음 그림에서 세진이는 A에, 세연이는 B에, 그리고 배는 C에 있다고 하자.

  [그림: 수평 선분 AB(길이 $\ell$)의 왼쪽 끝이 A, 오른쪽 끝이 B이고, 위쪽에 점 C가 있어 삼각형 ABC를 이룬다. A에서의 각 $\angle\mathrm{BAC}$는 $\alpha$, B에서의 각 $\angle\mathrm{ABC}$는 $\beta$로 표시되어 있다.]

  위의 그림과 같이 두 학생은 $\ell$만큼 떨어져 있고, 세진이와 세연이가 배를 바라보는 각도를 각각 $\angle\mathrm{BAC}=\alpha$와 $\angle\mathrm{ABC}=\beta$라고 하자. 관찰에 따른 $\ell$, $\alpha$, $\beta$가 주어지면 삼각함수를 사용하여 배의 위치와 움직임을 알아낼 수 있다. 선분 $\overline{\mathrm{AB}}$의 중점이 원점인 경우, 점 C의 위치는 $(c_x,c_y)$, 속도는 $(v_x,v_y)$로 나타내기로 하자.
subparts:
- id: 2-1
  stem: '[문제 2-1] 제시문 (나)에서 $\ell=6$, $\alpha+\beta=\dfrac{5\pi}{12}$, $\alpha>\dfrac{\pi}{12}$, $\beta>\dfrac{\pi}{6}$일 때 배의 자취의 길이를 구하시오. (10점)'
  points: 10
  depends_on: []
  answer:
    kind: value
    value: pi*(sqrt(6)-sqrt(2))
    equivalents:
    - $\pi(\sqrt6-\sqrt2)$
    tolerance: null
  solutions:
  - id: S21-B
    audience: B
    method_no: 1
    steps:
    - id: 21b-1
      content: $\alpha+\beta=5\pi/12$이므로 $\angle\mathrm{ACB}=\varphi=7\pi/12$이다. 이는 원주각이 $7\pi/12$인 원으로 볼 수 있으므로 점 C는 삼각형 ABC의 외접원 위의 점이 된다. $\alpha$가 최소값 $\pi/12$일 때 C의 위치를 $C_1$, $\beta$가 최소값 $\pi/6$일 때 C의 위치를 $C_2$라 하자.
      source_flow: 모범답안 p.7~8
      criteria:
      - 2-1.M1
    - id: 21b-2
      content: 호 $\widehat{C_1C_2}$의 중심각의 크기 $\angle C_1OC_2$는 원주각 $\angle C_1BC_2$의 2배이고, 각 $\angle C_1BC_2$는 삼각형 $C_1BA$로부터 $\pi/6$이다. 그러므로 호 $\widehat{C_1C_2}$의 중심각의 크기 $\gamma$는 $\pi/3$이다.
      source_flow: 모범답안 p.7~8
      criteria:
      - 2-1.M2
    - id: 21b-3
      content: 외접원의 반지름의 길이 $R$은 사인법칙에 의해 $2R=\dfrac{\ell}{\sin(\pi-\theta)}=\dfrac{6}{\sin(5\pi/12)}=\dfrac{6}{\sin(\pi/6)\cos(\pi/4)+\sin(\pi/4)\cos(\pi/6)}=\dfrac{24}{\sqrt2+\sqrt6}$이다.
      source_flow: 모범답안 p.7~8
      criteria:
      - 2-1.M3
    - id: 21b-4
      content: 그러므로 점 C의 자취의 길이인 호 $\widehat{C_1C_2}$의 길이 $L$은 $L=$ 반지름$\cdot$각도 $=\dfrac{12}{\sqrt2+\sqrt6}\cdot\dfrac\pi3=\pi(\sqrt6-\sqrt2)$이다.
      source_flow: 모범답안 p.7~8
      criteria:
      - 2-1.A1
  rubric:
