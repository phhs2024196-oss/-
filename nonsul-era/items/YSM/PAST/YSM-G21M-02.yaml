- id: 2-2
  stem: |-
    [문제 2-2] 제시문 (나)에서 $\ell=6$이고, 각도 $\angle\mathrm{CAB}=\alpha$와 $\angle\mathrm{CBA}=\beta$는 매개변수 $t$ $\left(0<t<\dfrac\pi9\right)$에 대한 함수로 다음과 같이 주어졌다.

    $$\alpha=\dfrac\pi{12}+3t,\ \beta=\dfrac\pi3-3t$$

    $t=\dfrac\pi{36}$일 때, 배의 위치 $(c_x,c_y)$와 속도 $(v_x,v_y)$를 구하시오. (12점)
  points: 12
  depends_on: []
  answer:
    kind: value
    value: cx=6-3*sqrt(3); cy=3*sqrt(3)-3; vx=-18; vy=18*(2-sqrt(3))
    equivalents:
    - 위치 $(c_x,c_y)=(6-3\sqrt3,\ 3\sqrt3-3)$, 속도 $(v_x,v_y)=(-18,\ 18(2-\sqrt3))$
    tolerance: null
  solutions:
  - id: S22-B
    audience: B
    method_no: 1
    steps:
    - id: 22b-1
      content: $\mathrm{A}(-3,0)$, $\mathrm{B}(3,0)$로 놓으면 $\alpha$와 $\beta$의 탄젠트 값을 보고 $\tan\left(\dfrac\pi{12}+3t\right)=c_y/(3+c_x)$, $\tan\left(\dfrac\pi3-3t\right)=c_y/(3-c_x)$ (1)을 구할 수 있다.
      source_flow: 모범답안 p.8~10
      criteria:
      - 2-2.M1
    - id: 22b-2
      content: $t=\pi/36$이므로 $\alpha=\pi/6$, $\beta=\pi/4$이고 그 탄젠트 값을 보면 $\tan(\pi/6)=1/\sqrt3=c_y/(3+c_x)$, $\tan(\pi/4)=1=c_y/(3-c_x)$이다. 이 두 식을 연립하여 풀면 $c_x=6-3\sqrt3$, $c_y=3(\sqrt3-1)$ (2)이다.
      source_flow: 모범답안 p.8~10
      criteria:
      - 2-2.A1
    - id: 22b-3
      content: 속도를 계산하기 위해 식 (1)을 미분하면 $3\sec^2(\pi/12+3t)=\dfrac{v_y(3+c_x)-v_xc_y}{(3+c_x)^2}$, $-3\sec^2(\pi/3-3t)=\dfrac{v_y(3-c_x)+v_xc_y}{(3-c_x)^2}$이다.
      source_flow: 모범답안 p.8~10
      criteria:
      - 2-2.M2
    - id: 22b-4
      content: $t=\pi/36$과 식 (2)의 $c_x$, $c_y$를 대입하면 $3\sec^2(\pi/6)=4=\dfrac{(9-3\sqrt3)v_y-(3\sqrt3-3)v_x}{(9-3\sqrt3)^2}$, $-3\sec^2(\pi/4)=-6=\dfrac{(3\sqrt3-3)v_y+(3\sqrt3-3)v_x}{(3\sqrt3-3)^2}$이다. 이 두 식을 연립하여 풀면 $v_x=-18$, $v_y=18(2-\sqrt3)$ (3)이다.
      source_flow: 모범답안 p.8~10
      criteria:
      - 2-2.A2
    - id: 22b-5
      content: '식 (2), (3)에 의해서 위치 $c_x=6-3\sqrt3$, $c_y=3\sqrt3-3$, 속도 $v_x=-18$, $v_y=18(2-\sqrt3)$이다. (풀이 2: 수선의 발을 H라 할 때 $\ell=h/\tan\alpha+h/\tan\beta$에서 $c_x=\ell\cdot\dfrac{\cos\alpha\sin\beta}{\sin(\alpha+\beta)}-\dfrac\ell2$, $c_y=\ell\cdot\dfrac{\sin\alpha\sin\beta}{\sin(\alpha+\beta)}$를 얻고 $t$로 미분하여 $\alpha''=3$, $\beta''=-3$을 넣으면 $v_x=-18\dfrac{\cos(\alpha-\beta)}{\sin(\alpha+\beta)}$, $v_y=-18\dfrac{\sin(\alpha-\beta)}{\sin(\alpha+\beta)}$가 되어 같은 값을 얻는다.)'
      source_flow: 모범답안 p.8~10
      criteria:
      - 2-2.A2
