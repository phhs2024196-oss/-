- id: 2-3
  stem: |-
    [문제 2-3] 제시문 (나)에서 각도 $\angle\mathrm{CAB}=\alpha$가 가질 수 있는 값은 $\alpha=\dfrac\pi6,\ \dfrac\pi4,\ \dfrac\pi3$이다. 각도 $\alpha$가 가질 수 있는 값을 확률변수 $X$라 할 때, 확률변수 $X$는 다음과 같은 확률분포를 가진다.

    | $X$ | $\dfrac\pi6$ | $\dfrac\pi4$ | $\dfrac\pi3$ |
    |---|---|---|---|
    | $\mathrm{P}(X=\alpha)$ | $\dfrac16$ | $\dfrac12$ | $\dfrac13$ |

    $\ell=6$이고 각도 $\angle\mathrm{CBA}=\beta=\dfrac{5\pi}{12}-\alpha$인 경우, 배의 위치 $(c_x,c_y)$의 기댓값 $\mathrm{E}(c_x)$와 $\mathrm{E}(c_y)$를 구하시오. (13점)
  points: 13
  depends_on: []
  answer:
    kind: value
    value: Ecx=-1; Ecy=-5+4*sqrt(3)
    equivalents:
    - $\mathrm{E}(c_x)=-1$, $\mathrm{E}(c_y)=-5+4\sqrt3$
    tolerance: null
  solutions:
  - id: S23-B
    audience: B
    method_no: 1
    steps:
    - id: 23b-1
      content: $\tan\alpha=c_y/(3+c_x)$, $\tan\beta=c_y/(3-c_x)$를 $c_x$, $c_y$에 대한 연립방정식으로 쓰면 $\tan\alpha\cdot c_x-c_y=-3\tan\alpha$, $\tan\beta\cdot c_x+c_y=3\tan\beta$이다. 이를 풀어 $\alpha$, $\beta$로 나타내면 $c_x=\dfrac{-3(\tan\alpha-\tan\beta)}{\tan\alpha+\tan\beta}$, $c_y=\dfrac{6\tan\alpha\tan\beta}{\tan\alpha+\tan\beta}$이다.
      source_flow: 모범답안 p.11~13
      criteria:
      - 2-3.M1
    - id: 23b-2
      content: $\alpha=\dfrac\pi6,\dfrac\pi4,\dfrac\pi3$에 대응하는 $\beta=\dfrac{5\pi}{12}-\alpha$는 $\beta=\dfrac\pi4,\dfrac\pi6,\dfrac\pi{12}$이다. $\tan(\pi/6)=\tan(\pi/12+\pi/12)=\dfrac{2\tan(\pi/12)}{1-\tan^2(\pi/12)}$에서 $\tan^2(\pi/12)+2\sqrt3\tan(\pi/12)-1=0$, $\tan(\pi/12)=2-\sqrt3$이다. 따라서 $\tan\alpha=1/\sqrt3,1,\sqrt3$이고 $\tan\beta=1,1/\sqrt3,2-\sqrt3$이다.
      source_flow: 모범답안 p.11~13
      criteria:
      - 2-3.M2
    - id: 23b-3
      content: 이를 대입하면 $\alpha=\pi/6,\pi/4,\pi/3$일 때 $c_x$는 각각 $3(2-\sqrt3)$, $-3(2-\sqrt3)$, $3(1-\sqrt3)$이고 $c_y$는 각각 $3(-1+\sqrt3)$, $3(-1+\sqrt3)$, $3(-3+2\sqrt3)$이다. (공식 풀이 1의 표에는 $c_x$ 값이 $-3(1+\sqrt3)$, $-3(3+\sqrt2-\sqrt6/2)$, $-3(2+\sqrt3)$로 적혀 있으나 풀이 2의 표·최종 답과 맞지 않아 풀이 2의 값을 쓴다.)
      source_flow: 모범답안 p.11~13
      criteria:
      - 2-3.M3
    - id: 23b-4
      content: 따라서 $\mathrm{E}(c_x)=\dfrac16\cdot3(2-\sqrt3)+\dfrac12\cdot(-3(2-\sqrt3))+\dfrac13\cdot3(1-\sqrt3)=-1$, $\mathrm{E}(c_y)=\dfrac16\cdot3(-1+\sqrt3)+\dfrac12\cdot3(-1+\sqrt3)+\dfrac13\cdot3(-3+2\sqrt3)=-5+4\sqrt3$이다.
      source_flow: 모범답안 p.11~13
      criteria:
      - 2-3.A1
