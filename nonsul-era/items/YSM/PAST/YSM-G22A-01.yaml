- id: 1-3
  stem: '[문제 1-3] 몇 회의 반복 실험에서 뽑힌 공이 모두 1번 공일 때, 주머니 C를 선택했다는 주장이 사실일 확률이 0.9 이상이라고 할 수 있는지 근거와 함께 결과를 제시하시오. (15점)'
  points: 15
  depends_on:
  - 1-2
  answer:
    kind: value
    value: n=4
    equivalents:
    - 4회(또는 4회 이상)의 반복 실험
    tolerance: null
  solutions:
  - id: S13-B
    audience: B
    method_no: 1
    steps:
    - id: 13b-1
      content: '$n=1$: $\mathrm{P}(C|D_n)=\dfrac47=0.57\cdots<0.9$, $n=2$: $\mathrm{P}(C|D_n)=\dfrac{16}{1+4+16}=\dfrac{16}{21}=0.76\cdots<0.9$이다.'
      source_flow: 문제해설·채점기준 p.2
      criteria:
      - 1-3.M1
    - id: 13b-2
      content: '$n=3$: $\mathrm{P}(C|D_n)=\dfrac{64}{1+8+64}=\dfrac{64}{73}=0.87\cdots<0.9$, $n=4$: $\mathrm{P}(C|D_n)=\dfrac{256}{1+16+256}=\dfrac{256}{273}=0.93\cdots\ge0.9$이다.'
      source_flow: 문제해설·채점기준 p.2
      criteria:
      - 1-3.M2
    - id: 13b-3
      content: '따라서 4회의 반복 실험에서 모두 1번 공이 뽑힐 때, 주머니 C가 선택되었을 확률이 0.9 이상(동일한 의미로, 주머니 C를 선택했다는 주장이 사실일 확률이 0.9 이상)이다. (참고: $n$에 따라 $\mathrm{P}(C|D_n)$의 값이 증가한다는 사실에 대한 설명 여부를 채점에 반영할 수 있음)'
      source_flow: 문제해설·채점기준 p.2
      criteria:
      - 1-3.A1
