  misconceptions: []
- id: 1-2
  stem: '[문제 1-2] 선택된 주머니에서 $n$번 모두 1번 공이 뽑혔다. 주머니 C가 선택되었을 확률을 구하시오. (10점)'
  points: 10
  depends_on:
  - 1-1
  answer:
    kind: value
    value: 4**n/(1+2**n+4**n)
    equivalents:
    - $\mathrm{P}(C|D_n)=\dfrac{4^n}{1+2^n+4^n}$
    tolerance: null
  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: 사건 $D_n=\{n$번 모두 1번 공$\}$을 정의한다. $\mathrm{P}(D_n)=\mathrm{P}(A)\mathrm{P}(D_n|A)+\mathrm{P}(B)\mathrm{P}(D_n|B)+\mathrm{P}(C)\mathrm{P}(D_n|C)=\dfrac13\left(\dfrac14\right)^n+\dfrac13\left(\dfrac12\right)^n+\dfrac13\cdot1$이다.
      source_flow: 문제해설·채점기준 p.2
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: $\mathrm{P}(C|D_n)=\dfrac{\mathrm{P}(C\cap D_n)}{\mathrm{P}(D_n)}=\dfrac{1/3}{\frac13\left(\frac14\right)^n+\frac13\left(\frac12\right)^n+\frac13}=\dfrac{4^n}{1+2^n+4^n}$이다.
      source_flow: 문제해설·채점기준 p.2
      criteria:
      - 1-2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-2.M1
      mark_type: M
      points: 5
      evidence: '$\mathrm{P}(D_n)$을 전체확률의 법칙으로 나타냈다. # 채점기준 미공개 — 단계별 추정'
      steps:
      - 12b-1
    - id: 1-2.A1
      mark_type: A
      points: 5
      evidence: '$\mathrm{P}(C|D_n)=\dfrac{4^n}{1+2^n+4^n}$을 구했다. # 채점기준 미공개 — 단계별 추정'
      depends_on:
