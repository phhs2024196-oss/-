      mark_type: M
      points: 4
      evidence: '전체확률의 법칙으로 $\mathrm{P}(D_1)=\dfrac{7}{12}$를 구했다. # 채점기준 미공개 — 단계별 추정'
      steps:
      - 11b-1
      - 11b-2
    - id: 1-1.A1
      mark_type: A
      points: 6
      evidence: '조건부확률로 $\mathrm{P}(C|D_1)=\dfrac47$을 구했다. # 채점기준 미공개 — 단계별 추정'
      depends_on:
      - 1-1.M1
      steps:
      - 11b-3
  outcome_codes:
