stem: |-
  【문제 1】아래의 제시문을 읽고 문항별로 풀이와 함께 답하시오. (35점)

  세 개의 주머니 A, B, C가 있다. 주머니 A에는 번호 1, 2, 3, 4가 새겨진 4개의 공이 들어있다. 주머니 B에는 번호 1, 1, 2, 3이 새겨진 4개의 공이 있고, 주머니 C에는 번호 1이 새겨진 4개의 공이 들어있다.

  [그림: 세 개의 주머니 A, B, C가 나란히 있다. 주머니 A 안에는 번호 1, 2, 3, 4의 공, 주머니 B 안에는 번호 1, 1, 2, 3의 공, 주머니 C 안에는 번호 1, 1, 1, 1의 공이 그려져 있다.]

  주머니 세 개에서 한 개의 주머니를 임의로 선택하고, 선택한 주머니에서만 임의로 $n$번 공을 꺼내는 실험을 시행한다. 단, 매번 꺼낸 공의 번호를 확인하고 다시 되돌려 넣은 뒤 다음 공을 꺼내는 것을 가정한다.
subparts:
- id: 1-1
  stem: '[문제 1-1] 선택된 주머니에서 공을 꺼내는 실험을 1번 시행할 때 1번 공이 뽑힐 확률을 구하시오. 그리고 이렇게 꺼낸 공이 1번 공일 때 선택된 주머니가 C일 확률을 계산하시오. (10점)'
  points: 10
  depends_on: []
  answer:
    kind: value
    value: P=7/12; Q=4/7
    equivalents:
    - $\mathrm{P}(D_1)=\dfrac{7}{12}$, $\mathrm{P}(C|D_1)=\dfrac47$
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: 사건을 $A=\{$주머니 A 선택$\}$, $B=\{$주머니 B 선택$\}$, $C=\{$주머니 C 선택$\}$, $D_1=\{$1번 꺼낸 공이 1번 공$\}$으로 정의한다.
      source_flow: 문제해설·채점기준 p.2
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: '(i) 1번 공이 뽑힐 확률: $\mathrm{P}(D_1)=\mathrm{P}(A)\mathrm{P}(D_1|A)+\mathrm{P}(B)\mathrm{P}(D_1|B)+\mathrm{P}(C)\mathrm{P}(D_1|C)=\dfrac13\cdot\dfrac14+\dfrac13\cdot\dfrac12+\dfrac13\cdot1=\dfrac{7}{12}$이다.'
      source_flow: 문제해설·채점기준 p.2
      criteria:
      - 1-1.M1
    - id: 11b-3
      content: '(ii) 꺼낸 공이 1번 공일 때 주머니 C가 선택될 확률: $\mathrm{P}(C|D_1)=\dfrac{\mathrm{P}(C\cap D_1)}{\mathrm{P}(D_1)}=\dfrac{1/3}{7/12}=\dfrac47$이다. (또 다른 풀이: 주머니를 임의로 선택해 공을 한 개 뽑는 실험은 전체 12개에서 1개의 공을 임의로 뽑는 실험과 동일하므로 1번 공이 뽑힐 확률은 $\dfrac7{12}$이고, 꺼낸 공이 1번 공인 경우는 1번 공 7개 중 1개가 선택된 경우로 이 중 주머니 C의 공이 4개이니까 $\dfrac47$이다.)'
      source_flow: 문제해설·채점기준 p.2
      criteria:
      - 1-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
