key_idea: 선택된 주머니를 사건 $A,B,C$로 두고 전체확률의 법칙으로 $\mathrm{P}(D_n)$을 구한 뒤 베이즈(조건부확률) 정리로 $\mathrm{P}(C|D_n)=\dfrac{4^n}{1+2^n+4^n}$를 얻고, $n$을 1부터 늘려 $0.9$ 이상이 되는 최소의 $n$을 찾는다.
