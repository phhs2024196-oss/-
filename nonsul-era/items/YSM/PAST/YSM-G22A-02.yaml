stem: |-
  【문제 2】아래의 제시문을 읽고 문항별로 풀이와 함께 답하시오. (25점)

  (가) 두 실수 $a,b$에 대해서 $0\le a<b$ 라고 하자. 이차함수 $y=x^2$의 그래프 위의 두 점 $\mathrm{A}(a,a^2)$와 $\mathrm{B}(b,b^2)$에서 그은 두 접선의 교점을 $\mathrm{C}(c,d)$라 하자.

  (나) 두 실수 $a,b$에 대해서 $a=\dfrac{-t+\sqrt{t^2+16t}}{8}$, $b=\dfrac{-3t+3\sqrt{t^2+4t}}{8}$ $(t>0)$라고 하자. 이차함수 $y=x^2$의 그래프 위의 두 점 $\mathrm{A}(a,a^2)$와 $\mathrm{B}(b,b^2)$에 대하여 선분 AB를 $m:n(m>0,n>0)$으로 내분하는 점 $\mathrm{P}$의 좌표를 $(f(t),g(t))$라고 하자.

  (다) 좌표평면 위의 두 점 $\mathrm{A}(x_1,y_1)$와 $\mathrm{B}(x_2,y_2)$에 대하여 선분 AB를 $m:n(m>0,n>0)$으로 내분하는 점의 좌표는 $\left(\dfrac{mx_2+nx_1}{m+n},\dfrac{my_2+ny_1}{m+n}\right)$이다.
subparts:
- id: 2-1
  stem: '[문제 2-1] 제시문 (가)에서 이차함수 $y=x^2$과 두 접선에 의해 둘러싸인 도형의 넓이를 구하시오. (10점)'
  points: 10
  depends_on: []
  answer:
    kind: value
    value: (b-a)**3/12
    equivalents:
    - $\dfrac{(b-a)^3}{12}$
    tolerance: null
  solutions:
  - id: S21-B
    audience: B
    method_no: 1
    steps:
    - id: 21b-1
      content: $f(x)=x^2$이라고 하면 $f'(x)=2x$이다. $\mathrm{A}(a,a^2)$에서의 접선의 기울기는 $f'(a)=2a$이고 $\mathrm{B}(b,b^2)$에서의 접선의 기울기는 $f'(b)=2b$이다. 따라서 점 A에서 접선의 방정식은 $y=2ax-a^2$이고 점 B에서 접선의 방정식은 $y=2bx-b^2$이다.
      source_flow: 문제해설·채점기준 p.4
      criteria:
      - 2-1.M1
    - id: 21b-2
      content: 두 접선의 교점의 $x$좌표는 $2ax-a^2=2bx-b^2$에서 $x=\dfrac{a+b}{2}$이다.
      source_flow: 문제해설·채점기준 p.4
      criteria:
      - 2-1.M1
    - id: 21b-3
      content: 따라서 넓이는 $\displaystyle\int_a^{\frac{a+b}{2}}\{x^2-(2ax-a^2)\}dx+\int_{\frac{a+b}{2}}^{b}\{x^2-(2bx-b^2)\}dx=\int_a^{\frac{a+b}{2}}(x-a)^2dx+\int_{\frac{a+b}{2}}^{b}(x-b)^2dx$
      source_flow: 문제해설·채점기준 p.4
      criteria:
      - 2-1.M2
    - id: 21b-4
      content: $\displaystyle=\left[\dfrac13(x-a)^3\right]_a^{\frac{a+b}{2}}+\left[\dfrac13(x-b)^3\right]_{\frac{a+b}{2}}^{b}=\dfrac23\left(\dfrac{b-a}{2}\right)^3=\dfrac{(b-a)^3}{12}$이다.
      source_flow: 문제해설·채점기준 p.4
      criteria:
      - 2-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2-1.M1
      mark_type: M
      points: 3
      evidence: '두 접선의 방정식 $y=2ax-a^2$, $y=2bx-b^2$과 교점의 $x$좌표 $\dfrac{a+b}{2}$를 구했다. # 채점기준 미공개 — 단계별 추정'
      steps:
      - 21b-1
      - 21b-2
    - id: 2-1.M2
      mark_type: M
      points: 3
      evidence: '넓이를 구간 $\left[a,\dfrac{a+b}{2}\right]$, $\left[\dfrac{a+b}{2},b\right]$로 나눈 정적분 식으로 세웠다. # 채점기준 미공개 — 단계별 추정'
      depends_on:
      - 2-1.M1
      steps:
      - 21b-3
    - id: 2-1.A1
      mark_type: A
      points: 4
      evidence: '넓이 $\dfrac{(b-a)^3}{12}$을 구했다. # 채점기준 미공개 — 단계별 추정'
      depends_on:
      - 2-1.M2
      steps:
      - 21b-4
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 2-2
  stem: '[문제 2-2] 제시문 (나)에서 주어진 점 $\mathrm{P}$의 $x$좌표 $f(t)$에 대해서 $\displaystyle\lim_{t\to\infty}f(t)$를 구하고 그 이유를 명확히 설명하시오. (15점)'
  points: 15
  depends_on: []
  answer:
    kind: value
    value: (3*m+4*n)/(4*(m+n))
    equivalents:
    - $\displaystyle\lim_{t\to\infty}f(t)=\dfrac{3m+4n}{4(m+n)}$
    tolerance: null
  solutions:
  - id: S22-B
    audience: B
    method_no: 1
    steps:
    - id: 22b-1
      content: $f(t)=\dfrac{mb+na}{m+n}=\dfrac{1}{8(m+n)}\left\{-3\left(t-\sqrt{t^2+4t}\right)m-\left(t-\sqrt{t^2+16t}\right)n\right\}$이므로 극한을 두 부분으로 나누어 구한다.
      source_flow: 문제해설·채점기준 p.4
      criteria:
      - 2-2.M1
    - id: 22b-2
      content: (i) $\displaystyle\lim_{t\to\infty}\left(t-\sqrt{t^2+4t}\right)=\lim_{t\to\infty}\dfrac{\left(t-\sqrt{t^2+4t}\right)\left(t+\sqrt{t^2+4t}\right)}{t+\sqrt{t^2+4t}}=\lim_{t\to\infty}\dfrac{-4t}{t+\sqrt{t^2+4t}}=\lim_{t\to\infty}\dfrac{-4}{1+\sqrt{1+\frac4t}}=-2$이다.
      source_flow: 문제해설·채점기준 p.4
      criteria:
      - 2-2.M2
    - id: 22b-3
      content: (ii) $\displaystyle\lim_{t\to\infty}\left(t-\sqrt{t^2+16t}\right)=\lim_{t\to\infty}\dfrac{-16t}{t+\sqrt{t^2+16t}}=\lim_{t\to\infty}\dfrac{-16}{1+\sqrt{1+\frac{16}t}}=-8$이다.
      source_flow: 문제해설·채점기준 p.4
      criteria:
      - 2-2.M2
    - id: 22b-4
      content: 따라서 $\displaystyle\lim_{t\to\infty}f(t)=\dfrac{1}{8(m+n)}\lim_{t\to\infty}\left\{(-3)\left(t-\sqrt{t^2+4t}\right)m-\left(t-\sqrt{t^2+16t}\right)n\right\}=\dfrac{1}{8(m+n)}\{(-3)m\times(-2)+(-n)\times(-8)\}=\dfrac{3m+4n}{4(m+n)}$이다.
      source_flow: 문제해설·채점기준 p.4
      criteria:
      - 2-2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2-2.M1
      mark_type: M
      points: 4
      evidence: '내분점의 공식으로 $f(t)=\dfrac{mb+na}{m+n}$을 $t$의 식으로 나타냈다. # 채점기준 미공개 — 단계별 추정'
      steps:
      - 22b-1
    - id: 2-2.M2
      mark_type: M
      points: 6
      evidence: '분자의 유리화로 $\displaystyle\lim_{t\to\infty}\left(t-\sqrt{t^2+4t}\right)=-2$, $\displaystyle\lim_{t\to\infty}\left(t-\sqrt{t^2+16t}\right)=-8$을 구했다. # 채점기준 미공개 — 단계별 추정'
      depends_on:
      - 2-2.M1
      steps:
      - 22b-2
      - 22b-3
    - id: 2-2.A1
      mark_type: A
      points: 5
      evidence: '극한의 성질로 $\dfrac{3m+4n}{4(m+n)}$을 구하고 이유를 설명했다. # 채점기준 미공개 — 단계별 추정'
      depends_on:
      - 2-2.M2
      steps:
      - 22b-4
