intent: 함수의 극한값을 구하는 문제 해결 능력, 수학 기호와 문제 풀이에 대한 표현을 정확하게 사용하고 있는지 평가하고자 하였다. 도함수의 활용인 접선의 방정식을 구하는 것과 정적분의 활용인 곡선으로 둘러싸인 도형의 넓이를 구하는 것에 대한 문제 해결 능력과 수학적 의사소통 능력을 갖추고 있는지 평가하고자 하였다.
