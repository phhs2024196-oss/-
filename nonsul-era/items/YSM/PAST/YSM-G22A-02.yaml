key_idea: 포물선 위의 두 점에서의 접선은 $y=2ax-a^2$, $y=2bx-b^2$이고 교점의 $x$좌표가 $\dfrac{a+b}{2}$이므로 넓이는 두 구간의 $(x-a)^2$, $(x-b)^2$의 정적분이다. 내분점의 $x$좌표는 $\dfrac{mb+na}{m+n}$이고 $\sqrt{}$ 꼴 극한은 유리화로 구한다.
stuck: 교점의 $x$좌표 $\dfrac{a+b}{2}$를 경계로 넓이를 두 구간으로 나누는 단계와, $t-\sqrt{t^2+4t}$ 같은 $\infty-\infty$ 꼴을 유리화하는 단계.
