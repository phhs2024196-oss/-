- id: 3-3
  stem: '[문제 3-3] 제시문 (나)에서 주어진 함수 $f(t)$에서 변곡점의 좌표를 $(a,b)$라고 할 때 $a$를 구하고 그 이유를 명확히 설명하시오. (15점)'
  points: 15
  depends_on: []
  answer:
    kind: value
    value: (49+sqrt(1241))/20
    equivalents:
    - $a=\dfrac{49+\sqrt{1241}}{20}$
    tolerance: null
  solutions:
  - id: S33-B
    audience: B
    method_no: 1
    steps:
    - id: 33b-1
      content: 함수 $f(t)=(10t^2-9t-9)e^{-t}$ $(t\ge1.5)$에서 $f'(t)=(20t-9)e^{-t}-(10t^2-9t-9)e^{-t}=(-10t^2+29t)e^{-t}$이고 $f''(t)=(-20t+29)e^{-t}-(-10t^2+29t)e^{-t}=(10t^2-49t+29)e^{-t}$이다.
      source_flow: 문제해설·채점기준 p.7
      criteria:
      - 3-3.M1
    - id: 33b-2
      content: $f''(t)=0$에서 $t=\dfrac{49-\sqrt{49^2-40\times29}}{20}=\dfrac{49-\sqrt{1241}}{20}$ 또는 $t=\dfrac{49+\sqrt{1241}}{20}$이다.
      source_flow: 문제해설·채점기준 p.7
      criteria:
      - 3-3.M2
    - id: 33b-3
      content: $t>1.5$이므로 $t=\dfrac{49+\sqrt{1241}}{20}$의 좌우에서 $f''(t)$의 부호를 조사하여 표로 나타내면 $t=1.5$에서 $f''(t)=-22e^{1.5}$(공식 풀이의 표기), 구간 $\left(1.5,\dfrac{49+\sqrt{1241}}{20}\right)$에서 $-$, $t=\dfrac{49+\sqrt{1241}}{20}$에서 $0$, 그 뒤에서 $+$이다.
      source_flow: 문제해설·채점기준 p.7
      criteria:
      - 3-3.A1
    - id: 33b-4
      content: $f''(t)=0$인 점 $t=\dfrac{49+\sqrt{1241}}{20}$의 좌우에서 $f''(t)$의 부호가 바뀌므로 $a=\dfrac{49+\sqrt{1241}}{20}$이다.
      source_flow: 문제해설·채점기준 p.7
      criteria:
      - 3-3.A1
