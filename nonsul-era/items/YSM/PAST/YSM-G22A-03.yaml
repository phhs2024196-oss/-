stem: |-
  【문제 3】아래의 제시문을 읽고 문항별로 풀이와 함께 답하시오. (40점)

  (가) 어느 플라스틱 쓰레기 수집 업체에서는 매달 플라스틱 쓰레기 1500톤을 수거하여 재활용 가능한 플라스틱으로 재생산한다고 한다. 매달 플라스틱 쓰레기의 65%가 선별 과정을 통과하고 그중 80%가 재활용된다고 한다. 또 재생산된 플라스틱 쓰레기의 65%가 선별 과정을 통과하고 그중 80%가 재활용된다고 한다.

  (나) 어느 지역에서 시각 $t$ $(t\ge1.5)$에서의 재활용되는 플라스틱 쓰레기의 양 $f(t)$톤은 $f(t)=(10t^2-9t-9)e^{-t}$ 라고 한다.
