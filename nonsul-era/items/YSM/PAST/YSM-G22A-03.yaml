  stem: '[문제 3-1] 제시문 (가)에서 이번 달에 수거한 플라스틱 쓰레기 1500톤에 대해서 재생산과 재활용 과정을 매달 한없이 반복할 때, 재활용하게 되는 플라스틱의 양은 모두 몇 톤인지 구하시오. (10점)'
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '1625'
    equivalents:
    - 1625톤
    tolerance: null
  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: 플라스틱 쓰레기 1500톤을 재활용하게 되는 플라스틱의 양을 모두 구하면 $1500\times(0.65\times0.8)+1500\times(0.65\times0.8)^2+1500\times(0.65\times0.8)^3+\cdots$이다.
      source_flow: 문제해설·채점기준 p.6
      criteria:
      - 3-1.M1
    - id: 31b-2
      content: $=\displaystyle\sum_{n=1}^{\infty}(1500\times0.52^n)=\dfrac{1500\times0.52}{1-0.52}=1625$이다. 그러므로 답은 1625톤이다.
      source_flow: 문제해설·채점기준 p.6
      criteria:
      - 3-1.A1
