- id: 3-2
  stem: '[문제 3-2] 제시문 (나)에서 시각 $t$가 1.5에서 $x$가 될 때까지 $(1.5\le t\le x)$ 재활용하게 되는 플라스틱의 양을 $A(x)$라고 하자. 이때 $\displaystyle\lim_{x\to\infty}A(x)$을 구하시오. (단, $\displaystyle\lim_{x\to\infty}x^2e^{-x}=0$) (15점)'
  points: 15
  depends_on: []
  answer:
    kind: value
    value: 41*exp(-3/2)
    equivalents:
    - $41e^{-1.5}$
    tolerance: null
  solutions:
  - id: S32-B
    audience: B
    method_no: 1
    steps:
    - id: 32b-1
      content: (i) $A(x)=\displaystyle\int_{1.5}^{x}(10t^2-9t-9)e^{-t}dt$이고 두 함수의 곱의 정적분이므로 부분적분법을 이용한다. $\alpha(t)=10t^2-9t-9$, $\beta'(t)=e^{-t}$로 놓으면 $\alpha'(t)=20t-9$, $\beta(t)=-e^{-t}$이므로
      source_flow: 문제해설·채점기준 p.6
      criteria:
      - 3-2.M1
    - id: 32b-2
      content: $A(x)=\displaystyle\int_{1.5}^{x}(10t^2-9t-9)e^{-t}dt=\left[-(10t^2-9t-9)e^{-t}\right]_{1.5}^{x}-\int_{1.5}^{x}(20t-9)(-e^{-t})dt=-(10x^2-9x-9)e^{-x}+\int_{1.5}^{x}(20t-9)e^{-t}dt$이다.
      source_flow: 문제해설·채점기준 p.6
      criteria:
      - 3-2.M2
    - id: 32b-3
      content: 같은 방법으로 $\displaystyle\int_{1.5}^{x}(20t-9)e^{-t}dt$에서 $\alpha(t)=20t-9$, $\beta'(t)=e^{-t}$로 놓으면 $\alpha'(t)=20$, $\beta(t)=-e^{-t}$이므로 $\displaystyle\int_{1.5}^{x}(20t-9)e^{-t}dt=\left[-(20t-9)e^{-t}\right]_{1.5}^{x}-\int_{1.5}^{x}20(-e^{-t})dt=-(20x+11)e^{-x}+41e^{-1.5}$이다.
      source_flow: 문제해설·채점기준 p.6
      criteria:
      - 3-2.M2
    - id: 32b-4
      content: 따라서 $A(x)=(-10x^2+9x+9)e^{-x}+\displaystyle\int_{1.5}^{x}(20t-9)e^{-t}dt=(-10x^2-11x-2)e^{-x}+41e^{-1.5}$이다.
      source_flow: 문제해설·채점기준 p.6
      criteria:
      - 3-2.A1
    - id: 32b-5
      content: (ii) $\displaystyle\lim_{x\to\infty}A(x)$를 구하면 $\displaystyle\lim_{x\to\infty}\left\{(-10x^2-11x-2)e^{-x}+41e^{-1.5}\right\}=41e^{-1.5}$이다.
      source_flow: 문제해설·채점기준 p.6
      criteria:
      - 3-2.A2
