key_idea: 매달 재활용량은 첫째항 $1500\times0.52$, 공비 $0.52$인 등비수열이므로 무한등비급수의 합으로 구하고, $\displaystyle\int(10t^2-9t-9)e^{-t}dt$는 부분적분을 두 번 쓰며, 변곡점은 이계도함수의 부호가 바뀌는 점이므로 정의역 $t\ge1.5$를 확인해 $f''(t)=0$의 두 근 중 하나를 고른다.
