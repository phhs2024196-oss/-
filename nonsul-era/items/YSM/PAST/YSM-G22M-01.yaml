    meaning: 만점
  misconceptions: []
- id: 1-2
  stem: |-
    [문제 1-2] 전체 다리를 건너는 제한시간이 112초로 주어졌고 한 줄의 징검다리를 건너 뛰는 데 걸리는 시간이 2초이다. 출발한 참가자들은 동시에 한 줄의 징검다리를 건너 뛴다. 유리를 관찰하여 강화유리를 찾을 확률 $p$는 오른쪽 그래프와 같이 주어졌다. 이 그래프에서 관찰시간이 0.1초 증가할 때마다 $p$는 $q$만큼 커지며, $q$는 상수이다. 전체 참가자 중 17번째 사람이 시간 초과로 탈락하였을 때, 14, 15, 16번째 사람만 생존할 확률이 $\dfrac{2^{b_1}\cdot3^{b_2}\cdot5^{b_3}\cdot7^{b_4}\cdot11^{b_5}\cdot13^{b_6}\cdot17^{b_7}\cdot19^{b_8}}{10^{20}}$이다. 이 때, $b_1-\displaystyle\sum_{j=2}^{8}b_j$의 값을 구하시오. (단, 게임이 진행되는 중 유리를 관찰하는 시간은 바뀌지 않으며, $b_i$는 음이 아닌 정수이다. $(i=1,2,\ldots,8)$) (15점)

    [그림: 가로축이 관찰시간(초), 세로축이 강화유리를 찾을 확률인 계단형 그래프이다. 관찰시간이 $0$일 때 $\dfrac12$, $0.1$초까지 $\dfrac12+q$, $0.2$초까지 $\dfrac12+2q$, $0.3$초까지 $\dfrac12+3q$로 $0.1$초마다 $q$씩 커지고, $9.8$초와 $9.9$초 부근을 거쳐 $9.9$초를 넘으면 $1$이다.]
  points: 15
  depends_on: []
  answer:
    kind: value
    value: '26'
    equivalents:
    - $26\ (=37-8-1-1-1)$
    tolerance: null
  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: 먼저 그래프를 통해 $q$값을 구하자. 관찰 시간이 0.1초 늘어날 때마다 강화유리를 찾을 확률이 $q$만큼 증가하므로 관찰시간이 9.9초보다 클 때 강화유리를 찾을 확률은 $1/2+100q=1$이다. 따라서 $q=1/200$이다.
      source_flow: 문제해설·채점기준 p.3~4
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: $i$번째 사람이 목적지에 도달하는 시간을 $T_i$, 한 줄의 징검다리를 건너 뛰는데 걸리는 시간을 $k$초라고 하자. 그러면, $T_i$는 $m$개의 유리줄을 관찰하는 시간 $mt$, $i$번째 사람이 $m$개의 징검다리를 건너 도착지에 도착하는데 걸리는 시간 $(m+1)k$, 그리고 $i$번째 사람의 앞 사람들 $i-1$명이 징검다리를 건너는데 필요한 시간 $(i-1)k$의 합이다. 즉, $T_i=mt+(m+1)k+(i-1)k$이다.
      source_flow: 문제해설·채점기준 p.3~4
      criteria:
      - 1-2.M2
    - id: 12b-3
      content: 전체 참가자 중 17번째 사람이 시간 초과로 탈락하였고 16번째 사람은 통과하였으므로 $T_{16}\le112$, $T_{17}>112$이다. 따라서 $20t+21\cdot2+15\cdot2=T_{16}\le112<T_{17}=20t+21\cdot2+16\cdot2$이다. 이를 통해 $t$의 범위를 정하면 $1.9<t\le2$이다. 이 범위의 시간에서 강화유리를 찾을 확률은 $1/2+20q=1/2+20/200=5/10+1/10=6/10=0.6$이다.
      source_flow: 문제해설·채점기준 p.3~4
      criteria:
      - 1-2.M2
    - id: 12b-4
      content: 17번째 사람이 시간 초과로 탈락하는 경우에 강화유리를 찾을 확률 $p=0.6$을 사용하자. 14, 15, 16번째 사람이 생존할 확률은 13번째 사람이 탈락하고 14번째 사람이 생존할 확률을 구하면 된다. 13번째 사람이 탈락하고 14번째 사람이 생존할 확률은 20개의 강화유리 중 13개는 구분하기에 실패하고 나머지 7개는 성공해야 하는 확률이므로 그 값은 ${}_{20}\mathrm{C}_{13}0.6^70.4^{13}$이다.
      source_flow: 문제해설·채점기준 p.3~4
      criteria:
      - 1-2.M3
    - id: 12b-5
      content: 이를 계산하면 ${}_{20}\mathrm{C}_{13}0.6^70.4^{13}={}_{20}\mathrm{C}_7\cdot6^7\cdot4^{13}/10^{20}=\dfrac{20\cdot19\cdot18\cdot17\cdot16\cdot15\cdot14}{7\cdot6\cdot5\cdot4\cdot3\cdot2\cdot1}\cdot2^7\cdot3^7\cdot2^{26}\cdot\dfrac{1}{10^{20}}=\dfrac{(19\cdot17\cdot2^4\cdot3\cdot5)\cdot(2^7\cdot3^7\cdot2^{26})}{10^{20}}=\dfrac{2^{37}\cdot3^8\cdot5^1\cdot17^1\cdot19^1}{10^{20}}$이다. 그러므로 $b_1=37$, $b_2=8$, $b_3=1$, $b_4=b_5=b_6=0$, $b_7=1$, $b_8=1$이다. 따라서 답은 26 $(=37-8-1-1-1)$이다.
      source_flow: 문제해설·채점기준 p.3~4
      criteria:
      - 1-2.A1
