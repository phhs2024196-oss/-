    - id: 13b-2
      content: $g(x)=e^{-x}f(x)$라 하고 $g(x)$를 미분하면 $g'(x)=-e^{-x}f(x)+e^{-x}f'(x)=-e^{-x}(f(x)-f'(x))=\cos x$이므로 $g(x)=\sin x+C$ ($C$는 적분상수)이다. 따라서 $f(x)=e^x(\sin x+C)$이다.
