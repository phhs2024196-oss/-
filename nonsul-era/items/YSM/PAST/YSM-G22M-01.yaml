stimuli: []
stem: |-
  【문제 1】아래의 제시문을 읽고 문항별로 풀이와 함께 답하시오. (35점)

  (가) 징검다리 건너기 게임은 모든 참가자가 출발지점에서 시작하여 정해진 순서대로 징검다리를 건너서 도착지점까지 가는 게임이다.

  [그림: 왼쪽 출발지점, 오른쪽 도착지점 사이에 빈 공간을 사이에 둔 유리발판이 1줄, 2줄, 3줄, $\cdots$, 20줄로 놓여 있고, 각 줄은 위아래 2칸의 유리로 이루어져 있다.]

  (나) 위 그림과 같이 징검다리는 빈 공간을 사이에 둔 20줄, 2칸짜리 유리발판으로 만들어졌으며, 출발지점 및 도착지점과 유리발판 사이에도 빈 공간이 있다. 한 줄의 유리발판은 강화유리와 일반유리가 임의로 하나씩 총 2칸으로 이루어져 있다.

  (다) 참가자는 정해진 순서대로 빈 공간을 뛰어 넘어서 다음 줄의 유리발판 2칸 중 한 곳으로 점프하여 이동한다. 이 때, 참가자는 한 번에 한 개의 빈 공간만 뛰어 넘을 수 있으며, 참가자들은 다음 줄의 2칸의 유리발판 중 어느 것이 강화유리인지 일반유리인지 모른다.

  (라) 출발지점과 도착지점은 튼튼한 바닥이어서 모든 참가자가 올라가도 무너지지 않는다. 강화유리는 한 사람이 올라가도 깨지지 않으며, 한 사람이 점프하고 착지할 때에도 깨지지 않는다. 일반유리는 한 사람만 올라가도 깨지며, 이 경우 그 사람은 탈락된다.

  (마) 한 사람이 어느 줄의 강화유리에 서 있는 경우, 그 사람의 모든 뒷사람들은 그 줄의 유리발판 중 어느 칸이 강화유리인지 안다. 또한, 한 사람이 어느 줄의 일반유리로 건너뛰어 일반유리가 깨지는 경우, 그 줄에는 강화유리만 남게 되어 그 사람의 모든 뒷사람들은 그 줄의 유리발판 중 어느 것이 강화유리인지 알게 된다.

  (바) 단순한 점프 실패, 어느 칸이 강화유리인지 알면서도 실수로 일반유리 밟기, 참가자들간 불화 등 다른 변수를 제외하고 모든 참가자가 규칙을 지키며 정해진 순서대로 게임을 진행한다.

  (사) 이 게임의 참가자 수는 18명이고, 징검다리 줄의 수가 20줄이다.
subparts:
- id: 1-1
  stem: '[문제 1-1] 강화유리와 일반유리를 구분하여 강화유리를 찾을 확률이 $\dfrac34$이라고 할 때, 마지막 참가자가 생존할 확률은 $1-\dfrac{a}{2^{40}}$이다. 이 때, 상수 $a$의 값을 구하시오. (10점)'
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '1771'
    equivalents:
    - $a=1771$
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: 건너야 할 유리줄의 개수를 $m$, 강화유리를 찾을 확률을 $p$라고 하면, 1번째 사람이 생존할 확률은 $p^m$이다. ($m$개의 강화유리를 찾아야 함) 2번째 사람이 생존할 확률은 $p^m+{}_m\mathrm{C}_1p^{m-1}(1-p)^1$이다. (1번째 사람이 생존하여 2번째 사람이 공짜로 생존할 확률 + 1번째 사람이 탈락하고 2번째 사람이 생존할 확률. 후자는 $m$개의 강화유리 중 1개는 구분하기에 실패하고 나머지 $m-1$개는 성공해야 함)
      source_flow: 문제해설·채점기준 p.3
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: 3번째 사람이 생존할 확률은 $p^m+{}_m\mathrm{C}_1p^{m-1}(1-p)^1+{}_m\mathrm{C}_2p^{m-2}(1-p)^2$이다. $i$번째 사람이 생존할 확률은 $\displaystyle\sum_{r=0}^{i-1}{}_m\mathrm{C}_rp^{m-r}(1-p)^r$이다.
      source_flow: 문제해설·채점기준 p.3
      criteria:
      - 1-1.M1
    - id: 11b-3
      content: 따라서 20개의 징검다리에서 마지막 참가자인 18번째 사람이 생존할 확률은 $\displaystyle\sum_{r=0}^{17}{}_{20}\mathrm{C}_r(3/4)^{20-r}(1/4)^r$이고 이를 계산하면 $\displaystyle=1-(1/4^{20})\sum_{r=18}^{20}{}_{20}\mathrm{C}_r3^{20-r}=1-\left({}_{20}\mathrm{C}_{18}3^2+{}_{20}\mathrm{C}_{19}3^1+{}_{20}\mathrm{C}_{20}3^0\right)/2^{40}=1-\left(\dfrac{20\cdot19}{2\cdot1}\cdot9+\dfrac{20}{1}\cdot3+1\cdot1\right)/2^{40}=1-(1710+60+1)/2^{40}=1-\dfrac{1771}{2^{40}}$이다. 그러므로 정답은 1771이다.
      source_flow: 문제해설·채점기준 p.3
      criteria:
      - 1-1.A1
