key_idea: $m$개의 줄에서 실패 횟수가 $i-1$ 이하이면 $i$번째 사람이 생존하므로 이항분포 누적확률 $\displaystyle\sum_{r=0}^{i-1}{}_m\mathrm{C}_rp^{m-r}(1-p)^r$이고, 제한시간에서 관찰시간의 범위 $1.9<t\le2$를 구해 $p=0.6$을 얻으며, 적분방정식은 미분하여 $f-f'=-e^x\cos x$로 만들고 $e^{-x}f$를 미분해 푼다.
stuck: '''$i$번째 사람이 생존한다''는 사건을 ''실패한 줄이 $i-1$개 이하''로 바꾸는 단계, 시간제한에서 관찰시간 $t$의 범위를 부등식으로 구하는 단계, 그리고 $f-f''$ 꼴에서 $e^{-x}f$를 미분하는 단계.'
