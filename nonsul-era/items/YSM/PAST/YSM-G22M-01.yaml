    - id: 13b-3
      content: 적분상수 $C$를 정하기 위해 조건 (가)를 사용하자. 조건 (가)에 의해서 $f(0)=1/2$이다. 따라서 $f(0)=1\cdot(0+C)=1/2$이므로 $C=1/2$이다.
      source_flow: 문제해설·채점기준 p.4~5
      criteria:
