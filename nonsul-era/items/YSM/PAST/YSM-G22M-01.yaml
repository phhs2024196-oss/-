      content: 조건 (다)의 식 $\displaystyle\int_a^xf(t)dt=-\dfrac{\sin x+\cos x}{2}e^x+f(x)$를 미분하면 $f(x)=-\dfrac{\cos x-\sin x}{2}e^x-\dfrac{\sin x+\cos x}{2}e^x+f'(x)=-e^x\cos x+f'(x)\Rightarrow f(x)-f'(x)=-e^x\cos x\Rightarrow e^{-x}(f(x)-f'(x))=-\cos x$이다.
