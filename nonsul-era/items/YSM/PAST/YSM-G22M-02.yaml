stimuli: []
stem: |-
  【문제 2】아래의 제시문을 읽고 문항별로 풀이와 함께 답하시오. (25점)

  (가) 함수 $f(x)$의 정의역은 $\{x\mid x\ge0\}$이고, 아래와 같이 $f(x)$를 정의한다.

  $$f(x)=\cos(\pi x)$$

  (나) 함수 $h(x)$의 정의역은 $\{x\mid0\le x\le1\}$이고, 다음 집합 $S$의 원소의 개수로 $h(x)$를 정의한다.

  $$S=\left\{y\ \middle|\ f'(x)=\dfrac{f(x)-f(y)}{x-y},\ y\text{는 }x\text{보다 큰 실수}\right\}$$
subparts:
- id: 2-1
  stem: '[문제 2-1] $\displaystyle\lim_{x\to a-}h(x)\ne h(a)$이고 $\displaystyle\lim_{x\to a+}h(x)=h(a)$인 상수 $a$값을 모두 구하시오. (10점)'
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 1/2
    equivalents:
    - $a=\dfrac12$
    tolerance: null
  solutions:
  - id: S21-B
    audience: B
    method_no: 1
    steps:
    - id: 21b-1
      content: 제시문 (나)에 의해서 $h(x)$는 점 $(x,f(x))$에서 함수 $f(x)$에 접하는 직선이 함수 $f(x)$와 만나는 점의 개수이다.
      source_flow: 문제해설·채점기준 p.7
      criteria:
      - 2-1.M1
    - id: 21b-2
      content: $x=0$인 경우, 접선은 $x$축에 평행하며 함수 $f(x)$와 무수히 많은 점($x=2,4,6,\cdots$)에서 만난다. $x$의 값이 점점 커지며 $\dfrac12$에 가까워질수록 접선의 기울기는 점점 작아지며(기울기는 음수) 함수 $f(x)$와 만나는 점의 개수도 점점 작아진다.
      source_flow: 문제해설·채점기준 p.7
      criteria:
      - 2-1.M2
    - id: 21b-3
      content: $0<x<\dfrac12$인 경우, 접선은 함수 $f(x)$와 유한개의 점에서 만난다. 여기에서 접선이 $(x,f(x))$ 이외의 점에서 $f(x)$와 접하는 경우 전체 만나는 점의 개수는 짝수개이며 접선이 $(x,f(x))$ 이외의 점에서 $f(x)$와 접하지 않는 경우 전체 만나는 점의 개수는 홀수개이다.
      source_flow: 문제해설·채점기준 p.7
      criteria:
      - 2-1.M2
    - id: 21b-4
      content: $x=\dfrac12$인 경우를 보면, 점 $\left(\dfrac12,0\right)$에서 함수 $f(x)$에 접하는 직선은 함수 $f(x)$와 접점 외에 만나는 점이 없다. 그러므로 $h\left(\dfrac12\right)=0$이다. $x=1$인 경우, 접선은 $x$축에 평행하며 함수 $f(x)$와 무수히 많은 점($x=3,5,7,\cdots$)에서 만난다. $x$의 값이 점점 작아지며 $\dfrac12$에 가까워지는 경우, 접선의 기울기는 점점 작아지며(기울기는 음수) 함수 $f(x)$와 만나는 점의 개수는 0개이다.
      source_flow: 문제해설·채점기준 p.7
      criteria:
      - 2-1.M2
    - id: 21b-5
      content: 그러므로 $h(x)$를 그래프로 나타내면 (공식 풀이의 계단형 그래프) $\dfrac12$ 왼쪽에서는 $h$의 값이 1, 2, 3, $\cdots$으로 커지며 $x=\dfrac12$에서 $h=0$이고 $\dfrac12<x<1$에서 $h(x)=0$이다. 좌극한이 불연속이며 우극한이 연속인 점은 $\dfrac12$이 유일하다.
      source_flow: 문제해설·채점기준 p.7
      criteria:
      - 2-1.A1
