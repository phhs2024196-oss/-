key_idea: $h(x)$는 점 $(x,\cos\pi x)$에서의 접선이 $y=\cos\pi x$와 $x$보다 오른쪽에서 만나는 점의 개수이므로 계단 함수이고, $\left[\dfrac12,1\right)$에서만 $0$이다. 좌극한만 불연속인 점은 $\dfrac12$이며, $h(b)=8$이면 접선이 다른 점 $c=9-b$에서 접하므로 평균변화율$=$순간변화율에서 $b\pi+\cot b\pi=\dfrac{9\pi}{2}$이다.
stuck: $S$의 원소의 개수를 '접선과 곡선의 교점의 개수'로 해석하는 단계, 그리고 $h(b)=8$이라는 조건을 '접선이 다른 곳에서 접한다'(접점의 짝 $c=9-b$)로 바꾸는 발상.
