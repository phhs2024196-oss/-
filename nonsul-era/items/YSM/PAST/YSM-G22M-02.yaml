    meaning: 만점
  misconceptions: []
- id: 2-2
  stem: '[문제 2-2] $0\le x\le1$에 대해서 $h(x)=0$인 $x$의 범위가 $[u,v)$일 때, $[u,v]$에서 정의된 함수 $p(x)=ke^xf(x)$가 확률밀도함수가 되도록 하는 상수 $k$의 값을 구하시오. (5점)'
  points: 5
  depends_on:
  - 2-1
  answer:
    kind: value
    value: -(1+pi**2)/(E+pi*sqrt(E))
    equivalents:
    - $k=-\dfrac{1+\pi^2}{e+\pi\sqrt e}$
    tolerance: null
  solutions:
  - id: S22-B
    audience: B
    method_no: 1
    steps:
    - id: 22b-1
      content: 함수 $h(x)$의 그래프(2-1)에서 $h(x)=0$인 $x$의 범위는 $\left[\dfrac12,1\right)$이다. 구간 $\left[\dfrac12,1\right]$에서 $p(x)=ke^xf(x)$가 확률밀도함수가 되기 위해서 $\displaystyle\int_{1/2}^{1}ke^x\cos(\pi x)dx=1$을 만족해야 한다.
      source_flow: 문제해설·채점기준 p.8
      criteria:
      - 2-2.M1
    - id: 22b-2
      content: 부분적분을 사용하여 $I=\displaystyle\int_{1/2}^1e^x\cos(\pi x)dx$를 적분하면 $I=\left[e^x\cos(\pi x)\right]_{1/2}^1-\displaystyle\int_{1/2}^1(-\pi)e^x\sin(\pi x)dx=(-e)+\pi\left(\left[e^x\sin(\pi x)\right]_{1/2}^1-\int_{1/2}^1\pi e^x\cos(\pi x)dx\right)=-e-\pi\sqrt e-\pi^2I$이므로 $I=-\dfrac{e+\pi\sqrt e}{1+\pi^2}$이다.
      source_flow: 문제해설·채점기준 p.8
      criteria:
      - 2-2.A1
    - id: 22b-3
      content: 그러므로 문제의 조건 $\displaystyle\int_{1/2}^1e^x\cos(\pi x)dx=\dfrac1k$에 의해서 $k=-\dfrac{1+\pi^2}{e+\pi\sqrt e}$이다.
      source_flow: 문제해설·채점기준 p.8
      criteria:
      - 2-2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2-2.M1
      mark_type: M
      points: 2
      evidence: '$h(x)=0$인 구간 $\left[\dfrac12,1\right)$과 확률밀도함수 조건 $\displaystyle\int_{1/2}^1ke^x\cos(\pi x)dx=1$을 세웠다. # 채점기준 미공개 — 단계별 추정'
      steps:
      - 22b-1
    - id: 2-2.A1
      mark_type: A
      points: 3
      evidence: '부분적분을 두 번 적용해 $I$를 구하고 $k=-\dfrac{1+\pi^2}{e+\pi\sqrt e}$를 얻었다. # 채점기준 미공개 — 단계별 추정'
      depends_on:
      - 2-2.M1
      steps:
      - 22b-2
      - 22b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 2-3
  stem: '[문제 2-3] 실수 $b$에 대하여, $b$가 $h(b)=8$를 만족시킬 때, $b\pi+\cot(b\pi)$의 값을 구하시오. (10점)'
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 9*pi/2
    equivalents:
    - $\dfrac{9\pi}{2}$
    tolerance: null
  solutions:
  - id: S23-B
    audience: B
    method_no: 1
    steps:
    - id: 23b-1
      content: $b$가 $h(b)=8$를 만족시키므로 점 $(b,f(b))$에서의 접선이 $(b,f(b))$ 이외의 점 $(c,f(c))$에서 $f(x)$와 접한다. $(c>b)$ 이 경우 코사인 함수 $f(x)=\cos(\pi x)$와 접선의 그래프로부터 $f'(b)=f'(c)$, $c=9-b$임을 알 수 있다.
      source_flow: 문제해설·채점기준 p.9
      criteria:
      - 2-3.M1
    - id: 23b-2
      content: 두 점 $(b,f(b))$, $(c,f(c))$ 사이의 평균변화율과 점 $(b,f(b))$에서의 순간변화율이 같으므로 $\dfrac{\cos(b\pi)-\cos(c\pi)}{b-c}=-\pi\sin(b\pi)$이다.
      source_flow: 문제해설·채점기준 p.9
      criteria:
      - 2-3.M2
    - id: 23b-3
      content: $\cos(c\pi)=-\cos(b\pi)$와 $c=9-b$를 대입하면 $\dfrac{2\cos(b\pi)}{2b-9}=-\pi\sin(b\pi)\Rightarrow\dfrac{\cos(b\pi)}{\sin(b\pi)}=-\pi\dfrac{2b-9}{2}\Rightarrow\cot(b\pi)=-\pi(b-9/2)\Rightarrow b\pi+\cot(b\pi)=9\pi/2$이다.
      source_flow: 문제해설·채점기준 p.9
      criteria:
      - 2-3.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2-3.M1
      mark_type: M
      points: 4
      evidence: '$h(b)=8$을 접선이 다른 점 $(c,f(c))$에서 접하는 경우로 해석하고 $f''(b)=f''(c)$, $c=9-b$를 구했다. # 채점기준 미공개 — 단계별 추정'
      steps:
      - 23b-1
    - id: 2-3.M2
      mark_type: M
      points: 4
      evidence: '평균변화율과 순간변화율이 같다는 식 $\dfrac{\cos(b\pi)-\cos(c\pi)}{b-c}=-\pi\sin(b\pi)$를 세웠다. # 채점기준 미공개 — 단계별 추정'
      depends_on:
      - 2-3.M1
      steps:
      - 23b-2
    - id: 2-3.A1
      mark_type: A
      points: 2
      evidence: '정리해 $b\pi+\cot(b\pi)=\dfrac{9\pi}{2}$를 구했다. # 채점기준 미공개 — 단계별 추정'
      depends_on:
      - 2-3.M2
      steps:
      - 23b-3
