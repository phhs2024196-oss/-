intent: 공식 출제의도 미게재(해당 쪽에 없음). 접선과 곡선의 교점의 개수로 정의된 계단 함수를 해석해 극한과 연속을 판단할 수 있는지, 부분적분으로 확률밀도함수의 상수를 구할 수 있는지, 접선이 다른 점에서 접하는 조건을 평균변화율과 순간변화율의 관계로 바꿀 수 있는지 알아본다.
