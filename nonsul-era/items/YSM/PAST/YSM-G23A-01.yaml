stimuli: []
stem: |
  【문제 1】 아래의 제시문을 읽고 문항별로 풀이와 함께 답하시오. (30점)

  (가) 두 수열 $\{x_n\}$, $\{z_n\}$에 대하여 $\displaystyle\lim_{n\to\infty}x_n=\lim_{n\to\infty}z_n=\alpha$ ($\alpha$는 상수)일 때, 수열 $\{y_n\}$이 모든 자연수 $n$에 대하여 $x_n\le y_n\le z_n$이면, $\displaystyle\lim_{n\to\infty}y_n=\alpha$이다.

  (나) 무한급수 $\displaystyle\sum_{n=1}^{\infty}x_n=x_1+x_2+\cdots+x_n+\cdots$의 수렴, 발산은 급수의 $n$항까지의 부분합 $S_n=\displaystyle\sum_{k=1}^{n}x_k$의 수열 $\{S_n\}$의 수렴, 발산으로 정의한다.
subparts:
- id: 1-1
  stem: |
    [문제 1-1] 제시문 (가)를 이용하여, 극한값 $\displaystyle\lim_{n\to\infty}\left(\dfrac{1}{n^2+1}+\dfrac{2}{n^2+2}+\cdots+\dfrac{n}{n^2+n}\right)$을 구하시오.(15점)
  points: 15
  depends_on: []
  answer:
    kind: value
    value: 1/2
    equivalents:
    - $\dfrac12$
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: 자연수 $n$에 대하여 $\dfrac{k}{n^2+n}\le\dfrac{k}{n^2+k}\le\dfrac{k}{n^2+1}$ ($1\le k\le n$)이 성립한다.
      source_flow: 문항해설·예시답안 p.2
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: $k=1,2,\dots,n$에 대해 변변 더하면 $\dfrac{1+2+\cdots+n}{n^2+n}\le\dfrac{1}{n^2+1}+\dfrac{2}{n^2+2}+\cdots+\dfrac{n}{n^2+n}\le\dfrac{1+2+\cdots+n}{n^2+1}$이다.
      source_flow: 문항해설·예시답안 p.2
      criteria:
      - 1-1.M2
    - id: 11b-3
      content: $\displaystyle\lim_{n\to\infty}\dfrac{1+2+\cdots+n}{n^2+n}=\lim_{n\to\infty}\dfrac{\frac{n(n+1)}{2}}{n^2+n}=\dfrac12$, $\displaystyle\lim_{n\to\infty}\dfrac{1+2+\cdots+n}{n^2+1}=\dfrac12$이므로 제시문 (가)에 의하여 구하는 극한값은 $\dfrac12$이다.
      source_flow: 문항해설·예시답안 p.2
      criteria:
      - 1-1.A1
  # 채점기준 미공개 — 단계별 추정
