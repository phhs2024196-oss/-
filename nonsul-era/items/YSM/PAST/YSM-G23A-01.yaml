- id: 1-2
  stem: |
    [문제 1-2] 제시문 (나)를 이용하여, 급수 $\displaystyle\sum_{n=1}^{\infty}\dfrac{2}{(2n-1)(2n+3)}$의 수렴, 발산을 조사하고, 수렴하면 극한값을 구하시오.(15점)
  points: 15
  depends_on: []
  answer:
    kind: value
    value: 2/3
    equivalents:
    - 수렴, $\dfrac23$
    tolerance: null
  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: 자연수 $n$에 대하여 $\dfrac{2}{(2n-1)(2n+3)}=\dfrac12\left(\dfrac{1}{2n-1}-\dfrac{1}{2n+3}\right)$이다.
      source_flow: 문항해설·예시답안 pp.2~3
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: 부분합 $S_n=\displaystyle\sum_{k=1}^{n}\dfrac12\left(\dfrac{1}{2k-1}-\dfrac{1}{2k+3}\right)=\dfrac12\left(\dfrac11-\dfrac15+\dfrac13-\dfrac17+\dfrac15-\dfrac19+\cdots+\dfrac{1}{2n-1}-\dfrac{1}{2n+3}\right)=\dfrac12\left(1+\dfrac13-\dfrac{1}{2n+1}-\dfrac{1}{2n+3}\right)$이다.
      source_flow: 문항해설·예시답안 pp.2~3
      criteria:
      - 1-2.M2
    - id: 12b-3
      content: 제시문 (나)에 의하여 $\displaystyle\lim_{n\to\infty}S_n=\dfrac12\left(1+\dfrac13\right)=\dfrac23$이므로 급수는 수렴하고 그 값은 $\dfrac23$이다.
      source_flow: 문항해설·예시답안 pp.2~3
      criteria:
      - 1-2.A1
