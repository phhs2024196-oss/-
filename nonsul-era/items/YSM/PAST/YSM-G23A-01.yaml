key_idea: $\dfrac{k}{n^2+n}\le\dfrac{k}{n^2+k}\le\dfrac{k}{n^2+1}$ ($1\le k\le n$)을 더해 $\dfrac{1+2+\cdots+n}{n^2+n}\le(\text{주어진 합})\le\dfrac{1+2+\cdots+n}{n^2+1}$로 놓고 두 극한이 모두 $\dfrac12$임을 써서 제시문 (가)(수열의 극한의 대소·샌드위치)를 적용한다. 급수는 $\dfrac{2}{(2k-1)(2k+3)}=\dfrac12\left(\dfrac1{2k-1}-\dfrac1{2k+3}\right)$로 부분분수 분해해 부분합을 소거(간격 4)로 구하고 제시문 (나)(부분합의 극한)로 수렴·합을 정한다.
stuck: 각 항 $\dfrac{k}{n^2+k}$의 분모를 가장 작은 $n^2+1$, 가장 큰 $n^2+n$으로 바꿔 상·하계를 세우는 단계, 그리고 부분분수의 두 분모 차가 $4$여서 소거 후 앞 두 항($1,\dfrac13$)과 뒤 두 항이 남는 부분합 $S_n$을 정확히 쓰는 단계.
