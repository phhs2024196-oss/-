      steps:
      - 11b-2
    - id: 1-1.A1
      mark_type: A
      points: 5
      evidence: 양쪽 극한이 $\dfrac12$임을 보이고 제시문 (가)로 극한값 $\dfrac12$을 구했다.
      depends_on:
      - 1-1.M2
      steps:
      - 11b-3
