- id: 2-2
  stem: |
    [문제 2-2] 위의 [문제 2-1]에서 구한 $a$, $b$, $c$, $d$, $k$에 대해서, 두 함수 $f(x)$, $g(x)$의 그래프와 직선 $y=0$으로 둘러싸인 영역의 넓이를 구하시오.(20점)
  points: 20
  depends_on:
  - 2-1
  answer:
    kind: value
    value: 20/3
    equivalents:
    - $\dfrac{20}{3}$
    tolerance: null
  solutions:
  - id: S22-B
    audience: B
    method_no: 1
    steps:
    - id: 22b-1
      content: '$f(x)$와 직선 $y=0$의 교점: $-x^2+9=0$에서 $x=-3$. $g(x)=2x+10$과 직선 $y=0$의 교점: $2x+10=0$에서 $x=-5$.'
      source_flow: 문항해설·예시답안 p.6
      criteria:
      - 2-2.M1
    - id: 22b-2
      content: '$f(x)$와 $g(x)$의 접점의 $x$좌표: $2x+10=-x^2+9$에서 $x^2+2x+1=0$, $x=-1$.'
      source_flow: 문항해설·예시답안 p.6
      criteria:
      - 2-2.M2
    - id: 22b-3
      content: 넓이 $=\displaystyle\int_{-5}^{-3}\{g(x)-0\}dx+\int_{-3}^{-1}\{g(x)-f(x)\}dx=\int_{-5}^{-3}(2x+10)dx+\int_{-3}^{-1}\{(2x+10)-(-x^2+9)\}dx$.
      source_flow: 문항해설·예시답안 p.6
      criteria:
      - 2-2.M3
    - id: 22b-4
      content: $\displaystyle\int_{-5}^{-3}(2x+10)dx=\Big[x^2+10x\Big]_{-5}^{-3}=4$.
      source_flow: 문항해설·예시답안 p.6
      criteria:
      - 2-2.A1
    - id: 22b-5
      content: $\displaystyle\int_{-3}^{-1}(x^2+2x+1)dx=\Big[\dfrac13x^3+x^2+x\Big]_{-3}^{-1}=\dfrac83$.
      source_flow: 문항해설·예시답안 p.6
      criteria:
      - 2-2.A2
    - id: 22b-6
      content: 따라서 구하는 넓이는 $4+\dfrac83=\dfrac{20}{3}$이다.
      source_flow: 문항해설·예시답안 p.6
      criteria:
      - 2-2.A3
