stuck: $x=-3$, $x=0$ 각각에서 함수값의 연속과 도함수의 연속을 모두 써서 $a,b,c,d$의 연립을 세우는 단계, 그리고 둘러싸인 영역을 $x=-5\sim-3$($g$와 $x$축), $x=-3\sim-1$($g$와 $f$)로 나누어 위·아래 함수를 구분하는 단계.
