stem: |
  【문제 2】 아래의 제시문을 읽고 문항별로 풀이와 함께 답하시오. (35점)

  (가) 일반적으로 함수 $h(x)$와 실수 $x_0$에 대하여

  (1) 함수 $h(x)$가 $x=x_0$에서 정의되어 있고

  (2) $\displaystyle\lim_{x\to x_0}h(x)$가 존재하며

  (3) $\displaystyle\lim_{x\to x_0}h(x)=h(x_0)$

  일 때, 함수 $h(x)$는 $x=x_0$에서 연속이라고 한다.

  (나) 함수 $h(x)$가 어떤 열린구간의 모든 점에서 연속일 때, 함수 $h(x)$는 그 열린구간에서 연속이라고 한다. 또, 어떤 열린구간에서 연속인 함수를 그 열린구간에서의 연속함수라고 한다.

  (다) 실수 $a$, $b$, $c$, $d$와 양수 $k>0$에 대해서, 두 함수 $f(x)$와 $g(x)$를 다음과 같이 정의하자.

  $$f(x)=\begin{cases}ax+b&(x<-3)\\-x^2+9&(-3\le x<0)\\cx+d&(0\le x)\end{cases},\qquad g(x)=k(x-1)+12$$
subparts:
- id: 2-1
  stem: |
    [문제 2-1] 제시문 (다)에서 주어진 함수 $f(x)$와 그 도함수 $f'(x)$가 모든 실수에서 연속인 함수가 되도록 하는 상수 $a$, $b$, $c$, $d$의 값을 구하고, 제시문 (다)에서 주어진 함수 $f(x)$와 $g(x)$가 접하도록 하는 상수 $k$의 값을 구하시오.(15점)
  points: 15
  depends_on: []
  answer:
    kind: value
    value: a=6; b=18; c=0; d=9; k=2
    equivalents:
    - $a=6$, $b=18$, $c=0$, $d=9$, $k=2$
    tolerance: null
  solutions:
  - id: S21-B
    audience: B
    method_no: 1
    steps:
    - id: 21b-1
      content: $x=-3$에서 $f'(x)$가 연속이므로 $\displaystyle\lim_{x\to-3+}f'(x)=-2\cdot(-3)=6=\lim_{x\to-3-}f'(x)=a$이고, $f(x)$가 연속이므로 $\displaystyle\lim_{x\to-3+}f(x)=0=\lim_{x\to-3-}f(x)=-3a+b$이다.
      source_flow: 문항해설·예시답안 p.5
      criteria:
      - 2-1.M1
    - id: 21b-2
      content: 따라서 $a=6$, $b=18$이다.
      source_flow: 문항해설·예시답안 p.5
      criteria:
      - 2-1.A1
    - id: 21b-3
      content: $x=0$에서 $f'(x)$가 연속이므로 $\displaystyle\lim_{x\to0+}f'(x)=c=\lim_{x\to0-}f'(x)=0$이고, $f(x)$가 연속이므로 $\displaystyle\lim_{x\to0+}f(x)=d=\lim_{x\to0-}f(x)=9$이다.
      source_flow: 문항해설·예시답안 p.5
      criteria:
      - 2-1.M2
    - id: 21b-4
      content: 따라서 $c=0$, $d=9$이다.
      source_flow: 문항해설·예시답안 p.5
      criteria:
      - 2-1.A2
    - id: 21b-5
      content: 두 함수가 접하므로 $y=-x^2+9$와 $y=kx+12-k$가 한 점에서 만난다. $-x^2+9=kx+12-k$에서 $x^2+kx+3-k=0$이고 판별식 $D=k^2+4k-12=0$이다.
      source_flow: 문항해설·예시답안 p.5
      criteria:
      - 2-1.M3
    - id: 21b-6
      content: $(k-2)(k+6)=0$이고 $k$는 양수이므로 $k=2$이다.
      source_flow: 문항해설·예시답안 p.5
      criteria:
      - 2-1.A3
