- id: 3-2
  stem: |
    [문제 3-2] 제시문 (라)에서 주어진 함수 $g(x)$가 극값을 갖는 $x$의 값은 $\alpha$개이다. 이때 $g(x)$의 극솟값을 모두 더한 값을 $\beta$라고 하자. $\alpha\beta$의 값을 구하시오.(18점)
  points: 18
  depends_on: []
  answer:
    kind: value
    value: alpha=3; beta=5; ab=15
    equivalents:
    - $\alpha\beta=15$ ($\alpha=3$, $\beta=5$)
    tolerance: null
  solutions:
  - id: S32-B
    audience: B
    method_no: 1
    steps:
    - id: 32b-1
      content: $f'(x)=3x^2-4x=x(3x-4)$이므로 $f'(x)=0$에서 $x=0$ 또는 $x=\dfrac43$이다. 증감표에 의해 $f(x)$는 $x=0$에서 극댓값 $f(0)=-5$, $x=\dfrac43$에서 극솟값 $f\left(\dfrac43\right)=-\dfrac{167}{27}$을 갖는다.
      source_flow: 문항해설·예시답안 pp.8~9
      criteria:
      - 3-2.M1
    - id: 32b-2
      content: $y=f(x-1)+3$의 그래프는 $y=f(x)$를 $x$축으로 $1$, $y$축으로 $3$만큼 평행이동한 것이므로 $x=1$에서 극댓값 $f(0)+3=-2$, $x=\dfrac43+1=\dfrac73$에서 극솟값 $-\dfrac{167}{27}+3=-\dfrac{86}{27}$을 갖고, $x$절편은 하나($x=\mathrm{C}$)이다.
      source_flow: 문항해설·예시답안 pp.8~9
      criteria:
      - 3-2.M2
    - id: 32b-3
      content: $|f(x-1)+3|$은 $x\ge\mathrm{C}$에서 $f(x-1)+3$, $x<\mathrm{C}$에서 $-(f(x-1)+3)$이므로 $x<\mathrm{C}$ 부분이 $x$축에 대칭된다. 따라서 $g(x)$는 $x=1$(값 $\dfrac52\cdot2=5$)에서 극소, $x=\dfrac73$에서 극대, $x=\mathrm{C}$(값 $0$)에서 극소를 갖는다.
      source_flow: 문항해설·예시답안 pp.8~9
      criteria:
      - 3-2.M3
    - id: 32b-4
      content: $g(x)$가 극값을 갖는 $x$는 $1,\dfrac73,\mathrm{C}$의 $3$개이므로 $\alpha=3$이다.
      source_flow: 문항해설·예시답안 pp.8~9
      criteria:
      - 3-2.A1
    - id: 32b-5
      content: 극솟값은 $g(1)=\dfrac52|f(0)+3|=5$, $g(\mathrm{C})=0$이므로 $\beta=5$이다.
      source_flow: 문항해설·예시답안 pp.8~9
      criteria:
      - 3-2.A2
    - id: 32b-6
      content: 따라서 $\alpha\beta=3\times5=15$이다.
      source_flow: 문항해설·예시답안 pp.8~9
      criteria:
      - 3-2.A3
