key_idea: $t=2\sin\dfrac x5+3\in[1,5]$이므로 $y=f(t)$의 $[1,5]$에서의 최댓값·최솟값을 증감표로 구하면 $M=f(5)=70$, $m=f\left(\dfrac43\right)=-\dfrac{167}{27}$이다. $g(x)=\dfrac52|f(x-1)+3|$는 $y=f(x)$를 평행이동한 $y=f(x-1)+3$에 절댓값을 씌운 그래프로, 평행이동한 극대(값 $-2$)는 절댓값을 쓰면 극소($x=1$)로, 극소(값 $-\dfrac{86}{27}$)는 극대로 바뀌고 $x$절편 C에서 극소가 하나 더 생긴다.
stuck: $2\sin\dfrac x5+3$이 취하는 값의 범위를 $[1,5]$로 바꿔 $f$의 구간 최대·최소 문제로 환원하는 단계, 그리고 절댓값을 씌웠을 때 부호가 바뀌는 점(C)과 극대·극소가 뒤바뀌는 점을 모두 찾아 극값의 개수 $\alpha$와 극솟값의 합 $\beta$를 정하는 단계.
