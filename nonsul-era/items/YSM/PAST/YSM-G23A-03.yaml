stimuli: []
stem: |
  【문제 3】 아래의 제시문을 읽고 문항별로 풀이와 함께 답하시오. (35점)

  (가) 방정식 $h(x,y)=0$이 나타내는 도형을 $x$축의 방향으로 $a$만큼, $y$축의 방향으로 $b$만큼 평행이동한 도형의 방정식은 $h(x-a,y-b)=0$이 된다.

  (나) 실수 $x$의 절댓값 $|x|$는 수직선 위의 원점에서 $x$에 대응하는 점까지 거리를 나타낸다. 즉,
  $$|x|=\begin{cases}x&(x\ge0)\\-x&(x<0)\end{cases}$$

  (다) 함수 $y=h(x)$가 $x=a$를 포함하는 어떤 열린구간에 속하는 모든 $x$에 대하여 $h(x)\ge h(a)$일 때, 함수 $h(x)$는 $x=a$에서 극소라 하며, $h(a)$를 극솟값이라고 한다. 또, $x=a$를 포함하는 어떤 열린구간에 속하는 모든 $x$에 대하여 $h(x)\le h(a)$일 때, 함수 $h(x)$는 $x=a$에서 극대라 하며, $h(a)$를 극댓값이라고 한다. 극댓값과 극솟값을 통틀어 극값이라고 한다.

  (라) 두 함수 $f(x)$와 $g(x)$를 다음과 같이 정의하자.
  $$f(x)=x^3-2x^2-5,\qquad g(x)=\dfrac52\left|f(x-1)+3\right|$$
subparts:
- id: 3-1
  stem: |
    [문제 3-1] 제시문 (라)에서 주어진 함수 $f(x)$에 대해서 $y=f\left(2\sin\dfrac{x}{5}+3\right)$의 최댓값을 $M$, 최솟값을 $m$이라고 하자. $27m+M$의 값을 구하시오.(17점)
  points: 17
  depends_on: []
  answer:
    kind: value
    value: m=-167/27; M=70; ans=-97
    equivalents:
    - $27m+M=-97$ ($M=70$, $m=-\dfrac{167}{27}$)
    tolerance: null
  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: $t=2\sin\dfrac x5+3$이라 하면 모든 실수 $x$에 대해서 $-2+3\le t\le2+3$, 즉 $1\le t\le5$이다. $f\left(2\sin\dfrac x5+3\right)=f(t)$이므로 닫힌구간 $[1,5]$에서 $f(t)$의 최댓값과 최솟값을 구하면 된다.
      source_flow: 문항해설·예시답안 p.8
      criteria:
      - 3-1.M1
    - id: 31b-2
      content: '$f''(t)=3t^2-4t=t(3t-4)$이므로 $1\le t\le5$에서 $f''(t)=0$이면 $t=\dfrac43$이다. 증감표: $1\le t<\dfrac43$에서 $f''(t)<0$(감소), $\dfrac43<t\le5$에서 $f''(t)>0$(증가)이므로 $f(t)$는 $t=\dfrac43$에서 극솟값을 갖는다.'
      source_flow: 문항해설·예시답안 p.8
      criteria:
      - 3-1.M2
    - id: 31b-3
      content: $f(1)=-6$, $f\left(\dfrac43\right)=-\dfrac{167}{27}$, $f(5)=70$이다.
      source_flow: 문항해설·예시답안 p.8
      criteria:
      - 3-1.A1
    - id: 31b-4
      content: 최대·최소 정리에 의하여 $[1,5]$에서 $f(t)$는 $t=\dfrac43$에서 최솟값 $m=-\dfrac{167}{27}$, $t=5$에서 최댓값 $M=70$을 갖는다.
      source_flow: 문항해설·예시답안 p.8
      criteria:
      - 3-1.A2
    - id: 31b-5
      content: 따라서 $27m+M=27\left(-\dfrac{167}{27}\right)+70=-97$이다.
      source_flow: 문항해설·예시답안 p.8
      criteria:
      - 3-1.A3
