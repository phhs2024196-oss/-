    meaning: 만점
  misconceptions: []
- id: 1-2
  stem: |
    [문제 1-2] 포물선 $y^2=12x$ 위의 점 $(a,b)$에서의 접선과 제시문 (나)에서 주어진 함수 $f(x)$의 점 $\mathrm{Q}'$에서의 접선이 서로 수직이다. 삼각형 $\mathrm{OP}'\mathrm{Q}'$의 넓이를 $S$라고 하자. $S\sqrt{ab}$의 값을 구하시오.(15점)

    [판독확인: 원본 1쪽 하단에 문제 1과 무관해 보이는 아래 제시문 박스 (가)~(라)가 그대로 실려 있다. 아래는 원문 그대로이다.]

    (가) 참가자가 고민없이 0초만에 강화유리와 일반유리를 구분할 확률은 $1/2$이다.

    (나) $f(t)=1$을 만족시키는 $t$ 값 중 가장 작은 값을 $t^*$라고 하자.

    (다) $x\le t^*$와 어떤 상수 $a$에 대해서 $\displaystyle\int_a^xf(t)dt=-\dfrac{\sin x+\cos x}{2}e^x+f(x)$가 성립한다.

    (라) $x>t^*$에 대해서 $f(x)=1$이다.
  points: 15
  depends_on:
  - 1-1
  answer:
    kind: expression
    value: 24*sqrt(2)*log(1+sqrt(2))
    equivalents:
    - $S\sqrt{ab}=24\sqrt2\ln\left(1+\sqrt2\right)$
    tolerance: null
  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: 점 P의 $x$좌표는 $a_n=\dfrac1n\ln(1+\sqrt2)$이고 $y$좌표는 $f(a_n)=(1+\sqrt2)+(\sqrt2-1)=2\sqrt2$이다. 점 Q는 P와 $y$축 대칭이므로 $x$좌표는 $b_n=-\dfrac1n\ln(1+\sqrt2)$, $y$좌표는 $2\sqrt2$이다.
      source_flow: 문항해설·예시답안 p.3
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: 삼각형 OPQ의 넓이는 $\dfrac12\cdot\dfrac2n\ln(1+\sqrt2)\cdot2\sqrt2=2\sqrt2\ln(1+\sqrt2)\cdot\dfrac1n$이고 $n=1,2,3,\dots$이므로 넓이가 최대인 경우는 $n=1$이다. 이때 $\mathrm{P}'\left(\ln(1+\sqrt2),2\sqrt2\right)$, $\mathrm{Q}'\left(-\ln(1+\sqrt2),2\sqrt2\right)$이다.
      source_flow: 문항해설·예시답안 p.3
      criteria:
      - 1-2.M2
    - id: 12b-3
      content: $\mathrm{P}'$에서의 접선의 기울기는 $2$이고 $\mathrm{Q}'$에서의 접선은 이를 $y$축 대칭한 것이므로 기울기는 $-2$이다.
      source_flow: 문항해설·예시답안 p.3
      criteria:
      - 1-2.M3
    - id: 12b-4
      content: 포물선 $y^2=12x$ 위의 점 $(a,b)$에서의 접선은 $y=\dfrac6bx+\dfrac{6a}b$이고 이 접선이 $\mathrm{Q}'$에서의 접선과 수직이므로 $\dfrac6b\cdot(-2)=-1$에서 $b=12$이다. $b^2=12a$에 대입하면 $a=12$이다.
      source_flow: 문항해설·예시답안 p.3
      criteria:
      - 1-2.M4
    - id: 12b-5
      content: 삼각형 $\mathrm{OP}'\mathrm{Q}'$의 넓이는 $S=2\sqrt2\ln(1+\sqrt2)$이므로 $S\sqrt{ab}=2\sqrt2\ln(1+\sqrt2)\times12=24\sqrt2\ln\left(1+\sqrt2\right)$이다.
      source_flow: 문항해설·예시답안 p.3
      criteria:
      - 1-2.A1
