      mark_type: M
      points: 3
      evidence: $\alpha=e^{1/\ln(1+\sqrt2)}$를 구했다.
      steps:
      - 11b-2
    - id: 1-1.M3
      mark_type: M
      points: 3
      evidence: $g'(x)$가 증가함을 보여 최댓값이 $g'(k)$임을 서술했다.
      steps:
      - 11b-3
    - id: 1-1.M4
      mark_type: M
      points: 3
      evidence: $g'(k)=\dfrac{1+\sqrt2}{3}$로 놓고 $\dfrac{e^{-nk}}{e^{nk}+e^{-nk}}=\dfrac{2-\sqrt2}{6}$를 얻었다.
      steps:
      - 11b-4
    - id: 1-1.A1
      mark_type: A
      points: 3
      evidence: $e^{2nk}=5+3\sqrt2$, $k=\dfrac1{2n}\ln(5+3\sqrt2)$를 구했다.
      depends_on:
      - 1-1.M4
      steps:
      - 11b-5
