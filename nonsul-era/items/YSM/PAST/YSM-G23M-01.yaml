key_idea: $f(x)=e^{nx}+e^{-nx}$에서 $f'(x)=2n$이면 $e^{nx}-e^{-nx}=2$이고 $e^{nx}=X$로 놓은 $X^2-2X-1=0$에서 $e^{nx}=1+\sqrt2$, $a_n=\dfrac1n\ln(1+\sqrt2)$를 얻는다. 극한 $\alpha=e^{1/\ln(1+\sqrt2)}$를 구하고, $g'(x)=\dfrac{e^{nx}-e^{-nx}}{e^{nx}+e^{-nx}}$가 증가함수임을 이용해 $[0,k]$의 최댓값을 $g'(k)$로 놓고 $e^{2nk}=5+3\sqrt2$를 푼다. 삼각형 OPQ의 넓이 $\dfrac{2\sqrt2}{n}\ln(1+\sqrt2)$가 $n=1$에서 최대이고, 포물선 접선과 $Q'$에서의 접선이 수직이면 $b=12$, $a=12$이다.
stuck: $e^{nx}$를 새 변수 $X$로 치환해 $X^2-2X-1=0$을 푸는 단계, $\displaystyle\lim_{n\to0}\left(\dfrac1{a_n}+1\right)^{1/n}$을 $a_n\to\infty$ 꼴의 $e$의 정의로 바꾸는 단계, 그리고 $g'(x)$가 증가함을 보여 최댓값을 $x=k$에서 잡는 단계.
