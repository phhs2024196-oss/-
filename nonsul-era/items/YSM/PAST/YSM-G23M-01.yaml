stimuli: []
stem: |
  【문제 1】 아래의 제시문을 읽고 문항별로 풀이와 함께 답하시오.(30점)

  (가) $e$는 무리수이고, 그 값은 $e=2.71828182845904\cdots$이다.

  (나) 함수 $f(x)=e^{nx}+e^{-nx}$ ($n=1,2,3,\cdots$)의 그래프 위의 점 $\mathrm{P}(x,y)$에서의 접선의 기울기는 $2n$이라고 하자. 점 $\mathrm{P}(x,y)$를 $y$축에 대하여 대칭이동한 점의 좌표를 Q라고 할 때 원점 $\mathrm{O}(0,0)$와 두 점 P, Q에 대하여 삼각형 OPQ의 넓이가 최대일 때의 P와 Q를 각각 $\mathrm{P}'$와 $\mathrm{Q}'$라고 하자.

  (다) 제시문 (나)에서 주어진 함수 $f(x)$에 대해서 함수 $g(x)=\dfrac1n\ln f(x)$ ($n=1,2,3,\cdots$)라고 하자.
subparts:
- id: 1-1
  stem: |
    [문제 1-1] 제시문 (나)에서 주어진 함수 $f(x)$와 점 P의 $x$좌표를 $a_n$이라고 할 때 $\displaystyle\lim_{n\to0}\left(\dfrac{1}{a_n}+1\right)^{\frac1n}=\alpha$라고 하자. 제시문 (다)에서 주어진 함수 $g(x)$에 대해서 닫힌 구간 $[0,k]$에서 $g'(x)$의 최댓값이 $\dfrac13e^{\frac{1}{\ln\alpha}}$일 때, $k$의 값을 구하시오.(15점)
  points: 15
  depends_on: []
  answer:
    kind: expression
    value: log(5+3*sqrt(2))/(2*n)
    equivalents:
    - $k=\dfrac{1}{2n}\ln\left(5+3\sqrt2\right)$
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: $f'(x)=n\left(e^{nx}-e^{-nx}\right)=2n$이므로 $e^{nx}-e^{-nx}=2$, 즉 $e^{2nx}-2e^{nx}-1=0$이다. $e^{nx}=X$ ($X>0$)로 놓으면 $X^2-2X-1=0$이고 $X=1\pm\sqrt2$인데 $X>0$이므로 $e^{nx}=1+\sqrt2$, $a_n=\dfrac1n\ln(1+\sqrt2)$이다.
      source_flow: 문항해설·예시답안 pp.2~3
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: $\displaystyle\lim_{n\to0}\left(\dfrac1{a_n}+1\right)^{\frac1n}=\lim_{a_n\to\infty}\left\{\left(\dfrac1{a_n}+1\right)^{a_n}\right\}^{\frac{1}{\ln(1+\sqrt2)}}=e^{\frac1{\ln(1+\sqrt2)}}$이므로 $\alpha=e^{\frac{1}{\ln(1+\sqrt2)}}$이고 $e^{\frac1{\ln\alpha}}=1+\sqrt2$이다.
      source_flow: 문항해설·예시답안 pp.2~3
      criteria:
      - 1-1.M2
    - id: 11b-3
      content: $g'(x)=\dfrac{f'(x)}{nf(x)}=\dfrac{e^{nx}-e^{-nx}}{e^{nx}+e^{-nx}}=1-\dfrac{2e^{-nx}}{e^{nx}+e^{-nx}}$이고, $x$가 증가하면 $e^{nx}+e^{-nx}$는 증가하므로 $\dfrac{2}{e^{nx}+e^{-nx}}$는 감소하고 $e^{-nx}$도 감소하므로 $g'(x)$는 증가한다. 따라서 $[0,k]$에서 $g'(x)$의 최댓값은 $g'(k)$이다.
      source_flow: 문항해설·예시답안 pp.2~3
      criteria:
      - 1-1.M3
    - id: 11b-4
      content: $g'(k)=1-\dfrac{2e^{-nk}}{e^{nk}+e^{-nk}}=\dfrac13e^{\frac1{\ln\alpha}}=\dfrac{1+\sqrt2}{3}$이므로 $\dfrac{e^{-nk}}{e^{nk}+e^{-nk}}=\dfrac{2-\sqrt2}{6}$이다.
      source_flow: 문항해설·예시답안 pp.2~3
      criteria:
      - 1-1.M4
    - id: 11b-5
      content: $t=\dfrac{2-\sqrt2}{6}$이라 하면 $t=\dfrac{e^{-nk}}{e^{nk}+e^{-nk}}$에서 $e^{2nk}=\dfrac{1-t}{t}=\dfrac{1-\frac{2-\sqrt2}{6}}{\frac{2-\sqrt2}{6}}=5+3\sqrt2$이다. 따라서 $k=\dfrac{1}{2n}\ln\left(5+3\sqrt2\right)$이다.
      source_flow: 문항해설·예시답안 pp.2~3
      criteria:
      - 1-1.A1
