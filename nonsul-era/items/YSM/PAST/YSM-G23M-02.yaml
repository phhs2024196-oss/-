- id: 2-2
  stem: |
    [문제 2-2] 영역 $S_1$에 물을 뿌리기 위해 점 C에 새로운 급수 노즐을 놓는다고 하자. 이 노즐의 살수반경의 최솟값을 $r$이라 할 때, $r^2$을 구하시오. (15점)
  points: 15
  depends_on:
  - 2-1
  answer:
    kind: value
    value: 13+3*sqrt(13)
    equivalents:
    - $r^2=13+3\sqrt{13}$
    tolerance: null
  solutions:
  - id: S22-B
    audience: B
    method_no: 1
    steps:
    - id: 22b-1
      content: 살수반경의 최솟값 $r$은 $\overline{\mathrm{CP_1}}$과 $\overline{\mathrm{CD}}$ 중 큰 값이다.
      source_flow: 문항해설·예시답안 pp.6~7
      criteria:
      - 2-2.M1
    - id: 22b-2
      content: $\overline{\mathrm{CP_1}}$은 정삼각형의 한 변의 길이에서 원 $\mathrm{O_1}$의 반지름을 뺀 값이므로 $\overline{\mathrm{CP_1}}=\sqrt{13}+1$, $\overline{\mathrm{CP_1}}^2=14+2\sqrt{13}$이다.
      source_flow: 문항해설·예시답안 pp.6~7
      criteria:
      - 2-2.M2
    - id: 22b-3
      content: 삼각형 $\mathrm{O_2CD}$에서 $\overline{\mathrm{O_2C}}=\sqrt{13}+1$, $\overline{\mathrm{O_2D}}=2$, $\angle\mathrm{CO_2D}=\theta+\dfrac\pi3$이므로 $\overline{\mathrm{CD}}^2=(\sqrt{13}+1)^2+2^2-2\times(\sqrt{13}+1)\times2\times\cos\left(\theta+\dfrac\pi3\right)$이다. 덧셈정리와 $\sin\theta=\dfrac{\sqrt3}4$, $\cos\theta=\dfrac{\sqrt{13}}4$에서 $\cos\left(\theta+\dfrac\pi3\right)=\dfrac{\cos\theta-\sqrt3\sin\theta}2=\dfrac{\sqrt{13}-3}{8}$이다.
      source_flow: 문항해설·예시답안 pp.6~7
      criteria:
      - 2-2.M3
    - id: 22b-4
      content: $\overline{\mathrm{CD}}^2=(18+2\sqrt{13})-4(\sqrt{13}+1)\cdot\dfrac{\sqrt{13}-3}{8}=13+3\sqrt{13}$이다.
      source_flow: 문항해설·예시답안 pp.6~7
      criteria:
      - 2-2.A1
    - id: 22b-5
      content: $\overline{\mathrm{CD}}^2-\overline{\mathrm{CP_1}}^2=(13+3\sqrt{13})-(14+2\sqrt{13})=\sqrt{13}-1>0$이므로 $r^2=\overline{\mathrm{CD}}^2=13+3\sqrt{13}$이다.
      source_flow: 문항해설·예시답안 pp.6~7
      criteria:
      - 2-2.A2
