key_idea: 삼각형 $\mathrm{O_1BO_2}$에서 $\overline{\mathrm{O_1O_2}}=4$, $\overline{\mathrm{O_2B}}=2$, $\angle\mathrm B=\dfrac\pi3$에 코사인법칙을 쓰면 $\overline{\mathrm{O_1B}}=\sqrt{13}+1$이고 정삼각형의 한 변은 $\sqrt{13}+3$이다. $S_1+S_2$는 정삼각형에서 한 변이 2인 정삼각형 두 개와 중심각 $\dfrac{2\pi}3$인 부채꼴 두 개를 뺀 넓이이고, $S_2$는 직각삼각형 $\mathrm{HO_1O_2}$에서 삼각형 $\mathrm{HO_2P_2}$와 두 부채꼴(중심각 $\theta$, $\dfrac\pi3-\theta$)을 뺀 넓이이다. 노즐 반지름의 최솟값은 $\overline{\mathrm{CP_1}}$과 $\overline{\mathrm{CD}}$ 중 큰 값이고, $\overline{\mathrm{CD}}^2$은 삼각형 $\mathrm{O_2CD}$의 코사인법칙과 덧셈정리로 구한다.
stuck: 두 원이 접하는 조건으로 $\overline{\mathrm{O_1O_2}}=4$를 쓰고 삼각형 $\mathrm{O_1BO_2}$에서 $\overline{\mathrm{O_1B}}$를 코사인법칙으로 구하는 단계, 그리고 $S_2$를 $\theta$와 $\dfrac\pi3-\theta$인 두 부채꼴의 합 $\dfrac12\cdot2^2\cdot\dfrac\pi3$으로 정리하는 단계, $\angle\mathrm{CO_2D}=\theta+\dfrac\pi3$에서 $\cos\left(\theta+\dfrac\pi3\right)$을 덧셈정리로 계산하는 단계.
