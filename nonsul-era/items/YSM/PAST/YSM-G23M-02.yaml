stimuli: []
stem: |
  【문제 2】 아래의 제시문을 읽고 문항별로 풀이와 함께 답하시오.(30점)

  (가) 잔디에 물을 주는 스프링클러(sprinkler)는 급수 노즐에서 물을 분산하여, 노즐로부터 일정한 거리 이내의 영역에 물을 뿌려주는 장치이다. 물이 뿌려지는 살수 범위는 노즐을 중심으로 하는 원의 내부이며, 이 원의 반지름을 살수반경이라 부른다.

  (나) 오른쪽 그림과 같이 평평한 땅에 정삼각형 모양의 잔디밭이 있다. 이 잔디밭이 만드는 정삼각형을 삼각형 ABC라고 하자.

  [그림 1: 정삼각형 ABC. 꼭짓점 C가 위, 변 AB가 아래에 있다. 변 AB 위에 점 $\mathrm{O_1}$이 있고 $\mathrm{O_1}$을 중심으로 하는 원이 점 A를 지난다. 변 BC 위에 점 $\mathrm{O_2}$가 있고 $\mathrm{O_2}$를 중심으로 하는 원이 점 B를 지난다. 두 원은 서로 접한다. 삼각형 위쪽에서 두 원과 변으로 둘러싸인 큰 회색 영역이 $S_1$이고, 변 AB 근처에서 두 원 사이에 있는 작은 영역이 $S_2$이다.]

  (다) 살수반경이 2m인 스프링클러 2개를 이용하여 제시문 (나)에 있는 삼각형 모양의 잔디밭에 물을 뿌리고자 한다. 2개의 급수 노즐은 각각 선분 AB, 선분 BC 위에 있고, 이 2개의 스프링클러가 만드는 살수 범위는 각각 중심이 $\mathrm{O_1}$인 원의 내부와 중심이 $\mathrm{O_2}$인 원의 내부이다.

  (라) 제시문 (다)에서 주어진 중심이 $\mathrm{O_1}$인 원은 점 A를 지나고, 중심이 $\mathrm{O_2}$인 원은 점 B를 지난다. 그리고 두 원은 서로 접한다.

  (마) 잔디밭에서 물이 뿌려지지 않는 두 영역 중 큰 영역을 $S_1$, 작은 영역을 $S_2$라고 하자.
subparts:
- id: 2-1
  stem: |
    [문제 2-1] 영역 $S_1$과 $S_2$의 넓이를 구하시오. (15점)
  points: 15
  depends_on: []
  answer:
    kind: value
    value: S1=4*sqrt(3)+sqrt(39)-2*pi; S2=sqrt(39)/2-sqrt(3)/2-2*pi/3
    equivalents:
    - $S_1=4\sqrt3+\sqrt{39}-2\pi$, $S_2=\dfrac{\sqrt{39}}2-\dfrac{\sqrt3}2-\dfrac{2\pi}3$
    tolerance: null
  solutions:
  - id: S21-B
    audience: B
    method_no: 1
    steps:
    - id: 21b-1
      content: 삼각형 $\mathrm{O_1BO_2}$에서 $\overline{\mathrm{O_1B}}=x$라 하면 $\overline{\mathrm{O_1O_2}}=4$, $\overline{\mathrm{O_2B}}=2$, $\angle\mathrm B=\dfrac\pi3$이므로 코사인법칙에서 $4^2=x^2+2^2-4x\cos\dfrac\pi3$이다. $0<x=\sqrt{13}+1$이고 정삼각형 ABC의 한 변의 길이는 $\sqrt{13}+3$이다.
      source_flow: 문항해설·예시답안 pp.5~6
      criteria:
      - 2-1.M1
    - id: 21b-2
      content: 영역 $S_1+S_2$는 정삼각형 ABC에서 삼각형 $\mathrm{AO_1P_1}$, 삼각형 $\mathrm{BO_2P_2}$(모두 한 변의 길이가 2인 정삼각형), 부채꼴 $\mathrm{O_1P_1Q_1}$, 부채꼴 $\mathrm{O_2P_2Q_2}$(모두 중심각 $\dfrac{2\pi}3$)을 뺀 영역이다.
      source_flow: 문항해설·예시답안 pp.5~6
      criteria:
      - 2-1.M2
    - id: 21b-3
      content: $S_1+S_2=\dfrac{(\sqrt{13}+3)^2\sqrt3}{4}-2\times\dfrac{2^2\sqrt3}{4}-2\times\left(\dfrac12\times2^2\times\dfrac{2\pi}3\right)=\dfrac{7\sqrt3}{2}+\dfrac{3\sqrt{39}}{2}-\dfrac{8\pi}{3}$이다.
      source_flow: 문항해설·예시답안 pp.5~6
      criteria:
      - 2-1.A1
    - id: 21b-4
      content: $S_2$는 직각삼각형 $\mathrm{HO_1O_2}$에서 삼각형 $\mathrm{HO_2P_2}$, 부채꼴 $\mathrm{O_1Q_1D}$, 부채꼴 $\mathrm{O_2P_2D}$를 뺀 영역이다. $\overline{\mathrm{O_1H}}=\sqrt{13}$, $\overline{\mathrm{O_2H}}=\sqrt3$, $\overline{\mathrm{HP_2}}=1$이고 부채꼴 $\mathrm{O_1Q_1D}$의 중심각이 $\theta$이면 부채꼴 $\mathrm{O_2P_2D}$의 중심각은 $\dfrac\pi3-\theta$이다.
      source_flow: 문항해설·예시답안 pp.5~6
      criteria:
      - 2-1.M3
    - id: 21b-5
      content: $S_2=\dfrac12\times\sqrt{13}\times\sqrt3-\dfrac12\times1\times\sqrt3-\dfrac12\times2^2\times\theta-\dfrac12\times2^2\times\left(\dfrac\pi3-\theta\right)=\dfrac{\sqrt{39}}2-\dfrac{\sqrt3}2-\dfrac{2\pi}3$이다.
      source_flow: 문항해설·예시답안 pp.5~6
      criteria:
      - 2-1.A2
    - id: 21b-6
      content: $S_1=(S_1+S_2)-S_2=\left(\dfrac{7\sqrt3}2+\dfrac{3\sqrt{39}}2-\dfrac{8\pi}3\right)-\left(\dfrac{\sqrt{39}}2-\dfrac{\sqrt3}2-\dfrac{2\pi}3\right)=4\sqrt3+\sqrt{39}-2\pi$이다.
      source_flow: 문항해설·예시답안 pp.5~6
      criteria:
      - 2-1.A3
