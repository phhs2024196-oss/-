stuck: C의 $x$좌표가 $p+q$임을 써서 $q=2\sqrt{3p}$와 $q=2\sqrt{p+q}$의 두 식을 세우는 단계, 그리고 단면의 한 변이 두 곡선 사이가 아니라 직선 $y=q$와 곡선 $y=2\sqrt x$ 사이의 길이 $6-2\sqrt x$임을 파악하는 단계.
