  solutions:
  - id: S12-B
    audience: *id031
    method_no: *id009
    steps:
    - *id012: &id035 12b-1
      *id013: |
        닫힌구간 $[p,p+q]=[3,9]$의 임의의 점 $x$에서 입체도형의 단면을 이루는 정삼각형의 한 변의 길이는 $\ell(x)=q-2\sqrt x=6-2\sqrt x$이다.
      *id014: &id032 예시답안 p.2~3
      *id016:
      - 1-2.M1
    - *id012: &id036 12b-2
      *id013: |
        단면의 넓이는 $S(x)=\dfrac{\sqrt3}{4}\ell(x)^2=\dfrac{\sqrt3}{4}(6-2\sqrt x)^2$이고, $S(x)$는 $[3,9]$에서 연속이다.
      *id014: *id032
      *id016:
      - 1-2.M2
    - *id012: &id037 12b-3
      *id013: |
        제시문 (가)에 의해 $V=\displaystyle\int_p^{p+q}S(x)dx=\int_3^9\dfrac{\sqrt3}{4}(6-2\sqrt x)^2dx=\dfrac{\sqrt3}{4}\int_3^9(36-24\sqrt x+4x)dx$이다.
      *id014: *id032
      *id016:
      - 1-2.M3
    - *id012: &id039 12b-4
      *id013: |
        $=\sqrt3\left[9x-4x^{3/2}+\dfrac{x^2}{2}\right]_3^9=\sqrt3\left\{9(9-3)-4(27-3\sqrt3)+\dfrac{81-9}{2}\right\}=\sqrt3(12\sqrt3-18)=36-18\sqrt3$이다.
      *id014: *id032
      *id016:
      - 1-2.A1
    - *id012: &id040 12b-5
      *id013: |
        따라서 $m=36$, $n=-18$이므로 $m+n=18$이다.
      *id014: *id032
      *id016:
      - 1-2.A2
