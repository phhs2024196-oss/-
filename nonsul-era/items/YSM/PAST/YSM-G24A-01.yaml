stimuli: []
stem: |
  【문제 1】아래의 제시문을 읽고 문항별로 풀이와 함께 답하시오. (30점)

  (가) 닫힌구간 $[a,b]$의 임의의 점 $x$에서 $x$축에 수직인 평면으로 자른 단면의 넓이가 $S(x)$인 입체도형의 부피 $V$는 다음과 같다. 단, $S(x)$는 닫힌구간 $[a,b]$에서 연속이다.

  $$V=\int_a^b S(x)dx$$

  (나) 함수 $y=f(x)$에서 $f(x)$가 $x$에 대한 무리식일 때, 이 함수를 무리함수라고 한다. 예를 들어 함수 $y=2\sqrt{3x}$와 $y=2\sqrt{x}$는 모두 무리함수이다.

  (다) 두 무리함수 $y=2\sqrt{3x}$, $y=2\sqrt{x}$의 그래프가 다음 그림과 같다.

  [그림: $xy$평면에 두 무리함수 $y=2\sqrt{3x}$(위쪽 곡선)와 $y=2\sqrt{x}$(아래쪽 곡선)의 그래프. $x$축 위에 점 A, B가 있고, 정사각형 ABCD가 그려져 있다. D는 곡선 $y=2\sqrt{3x}$ 위, C는 곡선 $y=2\sqrt{x}$ 위에 있으며, 선분 AD 위에 곡선 $y=2\sqrt{x}$와 만나는 점 E가 있다.]

  (라) 점 $\mathrm{A}(p,0)$에서 $x$축에 수직인 직선을 그어 함수 $y=2\sqrt{3x}$와 만나는 점을 D라 하고, 선분 AD를 한 변으로 하는 정사각형 ABCD를 만들면 점 C는 함수 $y=2\sqrt{x}$의 그래프 위에 있다.

  (마) 도형 CDE를 밑면으로 하는 입체도형이 있다. 이 입체도형을 선분 CD에 수직인 평면으로 자른 단면은 정삼각형이다.
