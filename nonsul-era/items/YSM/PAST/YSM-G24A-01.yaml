  stem: |
    [문제 1-1] 제시문 (라)의 양수 $p$의 값을 구하시오. (15점)
  points: *id010
  depends_on: []
  answer:
    &id028 kind: &id011 value
    *id011: p=3; q=6
    &id029 equivalents:
    - $p=3$ (정사각형의 한 변 $q=6$)
    &id030 tolerance: *id001
  solutions:
  - id: S11-B
    audience: &id031 B
    method_no: *id009
    steps:
    - &id012 id: &id017 11b-1
      &id013 content: |
        정사각형 ABCD의 한 변의 길이를 $q$라 하면 점 B의 좌표는 $(p+q,0)$이다. 정사각형의 변의 길이가 모두 같으므로 점 D의 $y$좌표는 $q$이고, 점 D는 $y=2\sqrt{3x}$ 위의 점이므로 $q=2\sqrt{3p}$이다.
      &id014 source_flow: &id015 예시답안 p.2
      &id016 criteria:
      - 1-1.M1
    - *id012: &id024 11b-2
      *id013: |
        같은 방법으로 점 C의 $x$좌표가 $p+q$, $y$좌표가 $q$이고 점 C는 $y=2\sqrt{x}$ 위의 점이므로 $q=2\sqrt{p+q}$이다.
      *id014: *id015
      *id016:
      - 1-1.M2
    - *id012: &id025 11b-3
      *id013: |
        $2\sqrt{3p}=2\sqrt{p+q}$의 양변을 제곱하면 $12p=4(p+q)$, $8p=4q$이므로 $p=\dfrac q2$이다.
      *id014: *id015
      *id016:
      - 1-1.M3
    - *id012: &id027 11b-4
      *id013: |
        $p=\dfrac q2$를 $q=2\sqrt{3p}$에 대입하면 $q=2\sqrt{\dfrac{3q}2}$이고 양변을 제곱하면 $q^2=\dfrac{12q}2$이므로 $q=6$이다. 따라서 $p=\dfrac q2=3$이다.
      *id014: *id015
      *id016:
      - 1-1.A1
