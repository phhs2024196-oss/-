stimuli: []
stem: |
  【문제 2】아래의 제시문을 읽고 문항별로 풀이와 함께 답하시오. (30점)

  (가) 극한값 $\displaystyle\lim_{h\to0}\dfrac{\sin h}{h}=1$과 $\displaystyle\lim_{h\to0}\dfrac{\cos h-1}{h}=0$이 성립한다.

  (나) 함수 $y=f(x)$의 $x=a$에서의 미분계수는

  $$f'(a)=\lim_{h\to0}\dfrac{f(a+h)-f(a)}{h}=\lim_{x\to a}\dfrac{f(x)-f(a)}{x-a}$$

  이다. 또한 미분가능한 함수 $f(x)$의 도함수는 다음과 같다.

  $$f'(x)=\lim_{h\to0}\dfrac{f(x+h)-f(x)}{h}$$
subparts:
- id: 2-1
  stem: |
    [문제 2-1] 도함수의 정의를 이용하여, 함수 $y=\cos2x$의 도함수를 유도하시오. (15점)
  points: *id012
  depends_on: []
  answer:
    &id032 kind: expression
    &id033 value: -2*sin(2*x)
    &id034 equivalents:
    - $y'=-2\sin2x$
    &id035 tolerance: *id001
  solutions:
  - id: S21-B
    audience: &id036 B
    method_no: *id013
    steps:
    - &id014 id: &id020 21b-1
      &id015 content: |
        도함수의 정의에 의하여 $y'=\displaystyle\lim_{h\to0}\dfrac{\cos2(x+h)-\cos2x}{h}$이다.
      &id016 source_flow: &id017 예시답안 p.5~6
      &id018 criteria:
      - 2-1.M1
    - *id014: &id026 21b-2
      *id015: |
        덧셈정리로 $\cos2(x+h)=\cos2x\cos2h-\sin2x\sin2h$이므로 $y'=\displaystyle\lim_{h\to0}\dfrac{\cos2x\cos2h-\sin2x\sin2h-\cos2x}{h}=\lim_{h\to0}\dfrac{\cos2x(\cos2h-1)}{h}-\lim_{h\to0}\dfrac{\sin2x\sin2h}{h}$이다.
      *id016: *id017
      *id018:
      - 2-1.M2
    - *id014: &id028 21b-3
      *id015: |
        $=\cos2x\left(\displaystyle\lim_{h\to0}\dfrac{\cos2h-1}{h}\right)-\sin2x\left(\lim_{h\to0}\dfrac{\sin2h}{h}\right)$이고, $\displaystyle\lim_{h\to0}\dfrac{\cos2h-1}{h}=\lim_{h\to0}\dfrac{\cos2h-1}{2h}\times2=0$, $\displaystyle\lim_{h\to0}\dfrac{\sin2h}{h}=\lim_{h\to0}\dfrac{\sin2h}{2h}\times2=2$이다.
      *id016: *id017
      *id018:
      - 2-1.A1
    - *id014: &id031 21b-4
      *id015: |
        따라서 $y'=-2\sin2x$이다.
      *id016: *id017
      *id018:
      - 2-1.A2
