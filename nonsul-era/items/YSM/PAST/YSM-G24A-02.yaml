- id: 2-2
  stem: |
    [문제 2-2] 함수가 $f(x)=e^{-x}\cos2x$일 때, 도함수의 정의를 이용하여, 극한값

    $$\lim_{x\to0}\dfrac1x\left[f(x)+f(2x)+f(3x)+\cdots+f(2023x)-2023\right]$$

    을 구하시오. (15점)
  points: *id012
  depends_on: []
  answer:
    *id032: *id033
    *id033: '-2047276'
    *id034:
    - $-\dfrac{2023\times2024}{2}=-2{,}047{,}276$
    *id035: *id001
  solutions:
  - id: S22-B
    audience: *id036
    method_no: *id013
    steps:
    - *id014: &id038 22b-1
      *id015: |
        $f(x)=e^{-x}\cos2x$에서 $f(0)=1$이다. 또한 $f'(x)=-e^{-x}\cos2x-2e^{-x}\sin2x$이므로 $f'(0)=-1$이다.
      *id016: &id037 예시답안 p.6
      *id018:
      - 2-2.M1
    - *id014: &id040 22b-2
      *id015: |
        도함수의 정의를 이용하여 $\displaystyle\lim_{x\to0}\dfrac1x[f(kx)-f(0)]=\lim_{x\to0}\dfrac{f(kx)-f(0)}{kx-0}\times k=kf'(0)$이다.
      *id016: *id037
      *id018:
      - 2-2.M2
    - *id014: &id041 22b-3
      *id015: |
        $2023=\underbrace{f(0)+f(0)+\cdots+f(0)}_{2023}$이므로 $\displaystyle\lim_{x\to0}\dfrac1x[f(x)+f(2x)+\cdots+f(2023x)-2023]=\lim_{x\to0}\dfrac1x\{(f(x)-f(0))+(f(2x)-f(0))+\cdots+(f(2023x)-f(0))\}$이다.
      *id016: *id037
      *id018:
      - 2-2.M3
    - *id014: &id042 22b-4
      *id015: |
        $=(1+2+\cdots+2023)f'(0)$이다.
      *id016: *id037
      *id018:
      - 2-2.A1
    - *id014: &id043 22b-5
      *id015: |
        $=-(1+2+\cdots+2023)=-\dfrac{2023(2023+1)}{2}=-2{,}047{,}276$이다.
      *id016: *id037
      *id018:
      - 2-2.A2
