key_idea: 도함수의 정의에 덧셈정리와 $\lim\dfrac{\sin h}{h}=1$, $\lim\dfrac{\cos h-1}{h}=0$을 써서 $(\cos2x)'=-2\sin2x$를 유도하고, $\displaystyle\lim_{x\to0}\dfrac{f(kx)-f(0)}{x}=kf'(0)$를 각 항에 적용해 $\displaystyle\lim_{x\to0}\dfrac1x\left\{\sum_{k=1}^{2023}f(kx)-2023\right\}=f'(0)\sum_{k=1}^{2023}k$를 구한다.
stuck: $\cos2(x+h)$를 덧셈정리로 전개하고 $\dfrac{\cos2h-1}{h}$, $\dfrac{\sin2h}{h}$를 $2h$ 꼴로 바꾸어 제시문 (가)를 쓰는 단계, 그리고 $-2023$을 항마다 $f(0)=1$씩 나누어 $\dfrac{f(kx)-f(0)}{x}=k\cdot\dfrac{f(kx)-f(0)}{kx-0}$ 꼴로 만드는 단계.
