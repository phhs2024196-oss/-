- id: 3-3
  stem: |
    [문제 3-3] 삼각형의 세 변의 길이 $x_1$, $x_2$, $x_3$가 자연수일 때, 다음을 만족시키는 삼각형의 개수를 구하시오. (15점)

    $$x_1\ge x_2\ge x_3,\quad x_1+x_2+x_3=36$$
  points: *id012
  depends_on: []
  answer:
    *id032: *id033
    *id033: '27'
    *id034:
    - 27개
    *id035: *id001
  solutions:
  - id: S33-B
    audience: *id036
    method_no: *id014
    steps:
    - *id015: &id045 33b-1
      *id016: |
        $x_1\ge x_2\ge x_3\ge1$이므로 $3x_1\ge36$, 즉 $x_1\ge12$이다.
      *id017: &id044 예시답안 p.8~9
      *id019:
      - 3-3.M1
    - *id015: &id046 33b-2
      *id016: |
        삼각형의 두 변의 길이의 합은 다른 한 변의 길이보다 길어야 하므로 $x_1<x_2+x_3=36-x_1$, 즉 $x_1<18$이다. 따라서 $12\le x_1<18$이다.
      *id017: *id044
      *id019:
      - 3-3.M2
    - *id015: &id047 33b-3
      *id016: |
        각 $x_1$에 대하여 $x_2+x_3=36-x_1$ ($x_1\ge x_2\ge x_3$)인 자연수 순서쌍 $(x_1,x_2,x_3)$를 센다. $x_1=12$이면 $(12,12,12)$로 1개, $x_1=13$이면 $(13,13,10),(13,12,11)$로 2개, $x_1=14$이면 $(14,14,8),(14,13,9),(14,12,10),(14,11,11)$로 4개이다.
      *id017: *id044
      *id019:
      - 3-3.M3
    - *id015: &id048 33b-4
      *id016: |
        $x_1=15$이면 $(15,15,6),(15,14,7),(15,13,8),(15,12,9),(15,11,10)$로 5개, $x_1=16$이면 $(16,16,4),(16,15,5),(16,14,6),(16,13,7),(16,12,8),(16,11,9),(16,10,10)$로 7개, $x_1=17$이면 $(17,17,2),(17,16,3),(17,15,4),(17,14,5),(17,13,6),(17,12,7),(17,11,8),(17,10,9)$로 8개이다.
      *id017: *id044
      *id019:
      - 3-3.A1
    - *id015: &id049 33b-5
      *id016: |
        따라서 구하는 삼각형의 개수는 $1+2+4+5+7+8=27$이다.
      *id017: *id044
      *id019:
      - 3-3.A2
