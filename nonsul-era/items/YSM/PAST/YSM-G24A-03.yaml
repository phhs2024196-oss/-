stimuli: []
stem: |
  【문제 3】아래의 제시문을 읽고 문항별로 풀이와 함께 답하시오(40점)

  (가) 참 또는 거짓을 명확하게 판별할 수 있는 문장이나 식을 명제라고 한다. 예를 들어, 문장

  ‘$a,b$가 실수일 때, $a^2+b^2=0$이면 $a=0$이고 $b=0$이다.’ --- (＊)

  는 명제이다.

  용어의 뜻을 명확하게 정한 문장을 정의라고 한다. 한편 정의 또는 이미 옳다고 밝혀진 성질을 이용하여 어떤 명제가 참임을 설명하는 것을 증명이라고 한다.

  (나) 함수 $f:X\to Y$에서 다음 두 조건을 모두 만족시킬 때, 함수 $f$를 일대일대응이라고 한다.

  ① 일대일함수이다. ② 치역과 공역이 같다

  (다) 다음 합의 법칙과 곱의 법칙을 이용하여 경우의 수를 구할 수 있다.

  ① 두 사건 $A$, $B$가 일어나는 경우의 수가 각각 $m$, $n$이고 두 사건 $A$, $B$가 동시에는 일어나지 않을 때, 사건 $A$ 또는 사건 $B$가 일어나는 경우의 수는 $m+n$이다.

  ② 두 사건 $A$, $B$에서 사건 $A$가 일어나는 경우의 수가 $m$이고, 그 각각의 경우에 대하여 사건 $B$가 일어나는 경우의 수가 $n$일 때, 사건 $A$에 잇달아 사건 $B$가 일어나는 경우의 수는 $m\times n$이다.
subparts:
- id: 3-1
  stem: |
    [문제 3-1] 다음은 제시문 (가)에서 제시한 명제 (＊)가 참임을 귀류법을 이용하여 증명하는 과정이다. (Ⅰ), (Ⅱ), (Ⅲ), (Ⅳ)를 증명 순서대로 나열하고 빈칸에 알맞은 것을 써넣어 증명을 완성하시오.(10점)

    (Ⅰ) 이때 세 가지 경우 모두 $a^2+b^2=0$이라는 가정에 모순이다.

    (Ⅱ) 따라서 $a,b$가 실수일 때, $a^2+b^2=0$이면 $a=0$이고 $b=0$이다.

    (Ⅲ) 결론을 부정하여 [편집: 빈칸] 이라고 하자.

    (Ⅳ) ① $a\ne0,b=0$이면 $a^2>0,b^2=0$이므로 $a^2+b^2>0$, 즉 $a^2+b^2\ne0$

    ② $a=0,b\ne0$이면 $a^2=0,b^2>0$이므로 [편집: 빈칸] , 즉 [편집: 빈칸]

    ③ [편집: 빈칸]
