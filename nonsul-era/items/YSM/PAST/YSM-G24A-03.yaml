- id: 3-2
  stem: |
    [문제 3-2] 제시문 (나)에서 주어진 어떤 일대일대응 $f:X\to Y$가 다음과 같이 주어질 때, $\dfrac qp$의 값을 모두 구하시오. (단, $p$, $q$는 실수) (15점)

    $$X=\{x\mid-c\le x\le c,\ c>0\},\quad Y=\{y\mid-8\le y\le0\},\quad f(x)=px+q$$
  points: *id012
  depends_on: []
  answer:
    *id032: *id033
    *id033: c, -c
    *id034:
    - $\dfrac qp=\pm c$
    *id035: *id001
  solutions:
  - id: S32-B
    audience: *id036
    method_no: *id014
    steps:
    - *id015: &id038 32b-1
      *id016: |
        일차함수 $f(x)=px+q$가 $X$에서 $Y$로의 일대일대응이므로 $p\ne0$이고 직선의 양 끝점이 대응한다. 따라서 직선은 두 점 $(c,0),(-c,-8)$을 지나거나 두 점 $(-c,0),(c,-8)$을 지난다.
      *id017: *id018
      *id019:
      - 3-2.M1
    - *id015: &id039 32b-2
      *id016: |
        ① 두 점 $(c,0),(-c,-8)$을 지나는 직선의 기울기는 $\dfrac{-8-0}{-c-c}=\dfrac4c$이고 점 $(c,0)$을 지나므로 $y-0=\dfrac8{2c}(x-c)$, 즉 $y=\dfrac4cx-4$이다.
      *id017: *id018
      *id019:
      - 3-2.M2
    - *id015: &id041 32b-3
      *id016: |
        ② 두 점 $(-c,0),(c,-8)$을 지나는 직선의 기울기는 $\dfrac{-8-0}{c-(-c)}=-\dfrac4c$이고 점 $(-c,0)$을 지나므로 $y-0=\dfrac{-8}{2c}(x+c)$, 즉 $y=-\dfrac4cx-4$이다.
      *id017: *id018
      *id019:
      - 3-2.M3
    - *id015: &id042 32b-4
      *id016: |
        ①에서 $p=\dfrac4c$, $q=-4$이므로 $\dfrac qp=-c$, ②에서 $p=-\dfrac4c$, $q=-4$이므로 $\dfrac qp=c$이다.
      *id017: *id018
      *id019:
      - 3-2.A1
    - *id015: &id043 32b-5
      *id016: |
        따라서 $\dfrac qp=\pm c$이다.
      *id017: *id018
      *id019:
      - 3-2.A2
