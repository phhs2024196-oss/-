key_idea: $a^2+b^2=0$이면 $a=b=0$임을 결론의 부정 $a\ne0$ 또는 $b\ne0$의 세 경우로 나누어 귀류법으로 증명하고, 일대일대응인 일차함수는 양 끝점이 서로 대응하므로 기울기의 부호 두 경우로 $\dfrac qp=\pm c$를 얻으며, $x_1\ge x_2\ge x_3$, $x_1+x_2+x_3=36$과 삼각형 조건으로 $12\le x_1<18$을 구해 $x_1$마다 세어 합하면 27이다.
stuck: 귀류법에서 "$a=0$이고 $b=0$"의 부정이 "$a\ne0$ 또는 $b\ne0$"이라는 점과 세 경우 분류, 일대일대응 일차함수에서 기울기가 양일 때와 음일 때 양 끝점의 대응이 달라진다는 점, 그리고 삼각형 조건 $x_1<x_2+x_3$에서 $x_1<18$을 이끌어 $x_1$별로 빠짐없이 세는 단계.
