stimuli: []
stem: |
  【문제 1】아래의 제시문을 읽고 문항별로 풀이와 함께 답하시오.(30점)

  (가) 주어진 집합에 대하여 그 부분집합을 생각할 때, 처음에 주어진 집합을 전체집합이라 한다. 집합 $A$의 원소의 개수를 기호 $n(A)$로 나타낸다. 자연수 $k$에 대해서 경우의 수는 다음과 같다.

  ① 전체집합 $U_{k+1}=\{1,2,\dots,k+1\}$의 두 부분집합 $A$와 $B$에 대해서 두 조건 $A\cup B=U_{k+1}$과 $n(A)=2$를 만족시키는 $A$와 $B$를 기호 $(A,B)$로 나타낸다. 이때 $(A,B)$의 개수를 $a_k$라 하자.

  ② 전체집합 $U_{k+1}=\{1,2,\dots,k+1\}$의 두 부분집합 $A$와 $B$에 대해서 두 조건 $A\cup B=U_{k+1}$과 $n(A)=3$을 만족시키는 $A$와 $B$를 기호 $<A,B>$로 나타낸다. 이때 $<A,B>$의 개수를 $b_k$라 하자.

  예를 들어 $b_3$을 구하는 데 사용한 $<A,B>$의 어떤 $A$, $B$는 아래 표와 같이 나타낼 수 있다.

  | | $A$ | $B$ |
  |---|---|---|
  | $<A,B>$ | $\{1,2,3\}$ | $\{4\}$ |
  | | $\vdots$ | $\vdots$ |

  (나) 다음 식이 성립하는 양수 $c_1,c_2,\dots,c_k$가 존재한다.

  $$b_1=0,\quad b_{k+1}=c_1a_1+c_2a_2+\cdots+c_ka_k\quad(k=1,2,\dots)$$
subparts:
- id: 1-1
  stem: |
    [문제 1-1] 제시문 (나)에서 주어진 $c_2$를 구하고, $b_3$을 구하는 데 사용된 $<A,B>$를 모두 찾으시오. (15점)
  points: *id012
  depends_on: []
  answer:
    &id032 kind: &id013 value
    *id013: c2=2; a2=12; b3=32
    &id033 equivalents:
    - $c_2=2$
    - '$b_3$을 구하는 데 사용된 $<A,B>$: $A\in\{\{1,2,3\},\{1,2,4\},\{1,3,4\},\{2,3,4\}\}$이고 $B\supseteq U_4\setminus A$인 모든 $B$ (각 $A$마다 8개, 모두 32개: 예시답안 <표 2>)'
    &id034 tolerance: *id001
  solutions:
  - id: S11-B
    audience: &id035 B
    method_no: *id011
    steps:
    - &id014 id: &id019 11b-1
      &id015 content: |
        (ⅰ) $a_2$는 $U_3=\{1,2,3\}$의 두 부분집합 $A$, $B$가 $A\cup B=U_3$, $n(A)=2$를 만족시키는 $(A,B)$의 개수이다. $A$는 ${}_3\mathrm{C}_2=3$가지($\{1,2\},\{1,3\},\{2,3\}$)이고, $A^c$의 원소는 반드시 $B$에 속해야 한다. 예를 들어 $A=\{1,2\}$이면 3은 $B$에 속해야 하고 1, 2는 각각 $B$에 속할 수도 있고 속하지 않을 수도 있으므로 $B$는 $2\times2=2^2$가지($\{3\},\{1,3\},\{2,3\},\{1,2,3\}$)이다. 따라서 $a_2=3\times2^2=12$이다.
      &id016 source_flow: &id017 예시답안 p.2~3
      &id018 criteria:
      - 1-1.M1
    - *id014: &id026 11b-2
      *id015: |
        (ⅱ) $b_3$은 $U_4=\{1,2,3,4\}$의 두 부분집합 $A$, $B$가 $A\cup B=U_4$, $n(A)=3$을 만족시키는 $<A,B>$의 개수이다. $A$는 ${}_4\mathrm{C}_3=4$가지($\{1,2,3\},\{1,2,4\},\{1,3,4\},\{2,3,4\}$)이고, 각 $A$에 대해 $A^c$의 원소(1개)는 반드시 $B$에 속하고 $A$의 세 원소는 각각 속할 수도 있으므로 $B$는 $2^3$가지이다. 따라서 $b_3=4\times2^3=32$이다.
      *id016: *id017
      *id018:
      - 1-1.M2
    - *id014: &id027 11b-3
      *id015: |
        (ⅲ) $a_1$은 $U_2=\{1,2\}$에서 $n(A)=2$이면 $A=U_2$ 1가지이고 $B$는 $A$의 모든 부분집합이 가능하므로 $a_1=2^2=4$이다. $b_2$는 $U_3$에서 $n(A)=3$이면 $A=U_3$ 1가지이고 $B$는 $A$의 모든 부분집합이 가능하므로 $b_2=2^3=8$이다. 따라서 $b_2=2a_1$이고 $c_1=2$이다.
      *id016: *id017
      *id018:
      - 1-1.M3
    - *id014: &id028 11b-4
      *id015: |
        (ⅰ), (ⅱ), (ⅲ)에 의해 $b_3=32=c_1a_1+c_2a_2=2\times4+12c_2$, 즉 $b_3=2a_1+2a_2$이므로 $c_2=2$이다.
      *id016: *id017
      *id018:
      - 1-1.A1
    - *id014: &id031 11b-5
      *id015: |
        $b_3$을 구하는 데 사용된 $<A,B>$는 $A$가 $\{1,2,3\},\{1,2,4\},\{1,3,4\},\{2,3,4\}$일 때 각각 $B$가 $A^c$를 포함하는 8개($A=\{1,2,3\}$이면 $B=\{4\},\{1,4\},\{2,4\},\{3,4\},\{1,2,4\},\{1,3,4\},\{2,3,4\},\{1,2,3,4\}$)씩 모두 32개이다(<표 2>).
      *id016: *id017
      *id018:
      - 1-1.A2
