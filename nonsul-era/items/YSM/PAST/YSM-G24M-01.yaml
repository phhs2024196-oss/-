      *id015: |
        (ⅰ) $a_k$는 $U_{k+1}$의 원소 중 2개를 택하는 경우의 수 ${}_{k+1}\mathrm{C}_2$에, $A\cup B=U_{k+1}$인 $B$의 개수 4를 곱한 것이므로 $a_k={}_{k+1}\mathrm{C}_2\times4=2k(k+1)$ ($k=1,2,\dots$)이다.
      *id016: &id036 예시답안 p.3~4
      *id018:
      - 1-2.M1
    - *id014: &id039 12b-2
      *id015: |
        비슷한 방법으로 $b_k={}_{k+1}\mathrm{C}_3\times8=\dfrac43(k-1)k(k+1)$ ($k=1,2,\dots$)이다.
      *id016: *id036
      *id018:
      - 1-2.M2
    - *id014: &id040 12b-3
      *id015: |
        (ⅱ) $\displaystyle\sum_{i=1}^{k}a_i=\sum_{i=1}^{k}2i(i+1)=2\sum_{i=1}^{k}(i^2+i)=2\left\{\dfrac{k(k+1)(2k+1)}6+\dfrac{k(k+1)}2\right\}=\dfrac23k(k+1)(k+2)$이다.
      *id016: *id036
      *id018:
      - 1-2.M3
    - *id014: &id041 12b-4
      *id015: |
        $\dfrac23k(k+1)(k+2)=\dfrac12b_{k+1}$이므로 $b_{k+1}=2\displaystyle\sum_{i=1}^{k}a_i$ ($k=1,2,3,\dots$)이다. 따라서 $c_1=c_2=\cdots=c_k=2$이다.
      *id016: *id036
      *id018:
      - 1-2.A1
    - *id014: &id042 12b-5
      *id015: |
        (ⅰ)과 (ⅱ)에 의해 $c_1c_2\cdots c_k=2^k$이다.
      *id016: *id036
      *id018:
