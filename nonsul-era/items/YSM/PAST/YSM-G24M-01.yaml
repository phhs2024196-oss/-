key_idea: $A\cup B=U_{k+1}$이면 $B$는 $A^c$를 반드시 포함하고 $A$의 원소는 자유로우므로 $B$는 $2^{n(A)}$가지이다. 따라서 $a_k={}_{k+1}\mathrm{C}_2\times4=2k(k+1)$, $b_k={}_{k+1}\mathrm{C}_3\times8=\dfrac43(k-1)k(k+1)$이고, $\sum_{i=1}^{k}a_i=\dfrac23k(k+1)(k+2)=\dfrac12b_{k+1}$에서 $c_i=2$, $c_1c_2\cdots c_k=2^k$를 얻는다.
stuck: $A\cup B=U$에서 $A$를 고른 뒤 $B$는 $A^c$의 모든 원소를 포함하고 $A$의 원소는 임의이므로 $2^{n(A)}$가지라는 세는 방법, 그리고 $b_{k+1}=\sum c_ia_i$를 $a_i$, $b_k$ 일반항으로 비교해 $c_i$가 모두 같은 값 2임을 일반적으로 보이는 단계.
