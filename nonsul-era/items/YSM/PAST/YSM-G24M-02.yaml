stimuli: []
stem: |
  【문제 2】아래의 제시문을 읽고 문항별로 풀이와 함께 답하시오.(30점)

  (가) 원주시에서 아래의 규칙 (나) - (사)를 만족하도록 평평한 땅 위에 직사각형 모양의 공원을 만든다.

  (나) 아래의 그림과 같이 공원을 이루는 직사각형을 ABCD라 하자.

  [그림: 직사각형 ABCD. 왼쪽 위가 C, 오른쪽 위가 B, 왼쪽 아래가 D, 오른쪽 아래가 A이다. 아래 변 DA 위에 D에 가까운 쪽에 점 Q, A에 가까운 쪽에 점 P가 찍혀 있다.]

  (다) 선분 DA의 길이는 180 m이고, 선분 DA 위에 $\overline{\mathrm{PA}}=\overline{\mathrm{QD}}$가 되는 지점 P, Q에 각각 국기게양대가 있다.

  (라) 공원 내에 두 국기게양대로부터의 거리의 합이 180 m인 모든 곳에 황토를 깔아 황톳길 산책로를 만든다.

  (마) 공원 내에 두 국기게양대로부터의 거리의 차가 60 m인 모든 곳에 꽃을 심어 꽃길을 만든다. 이 때, 꽃이 Q 지점의 국기게양대보다 P 지점의 국기게양대에 더 가깝다면 파란색 꽃을 심고, 꽃이 P 지점의 국기게양대보다 Q 지점의 국기게양대에 더 가깝다면 빨간색 꽃을 심는다.

  (바) 파란 꽃길은 선분 DA 위의 한 지점에서 시작하여 점 B에서 종료한다.

  (사) 황톳길과 파란 꽃길이 만나는 지점에 음수대를 만든다. 이 때, 음수대와 두 국기게양대가 만드는 삼각형은 $\overline{\mathrm{PQ}}$를 빗변으로 하는 직각삼각형을 이룬다.
subparts:
- id: 2-1
  stem: |
    [문제 2-1] 두 국기게양대 사이의 거리와 공원의 세로 길이를 각각 구하시오. (15점)
  points: *id011
  depends_on: []
  answer:
    &id033 kind: &id012 value
    *id012: d=60*sqrt(5); h=120*sqrt(2)
    &id034 equivalents:
    - 두 국기게양대 사이의 거리 $2c=60\sqrt5$ m, 공원의 세로 길이 $\overline{\mathrm{AB}}=120\sqrt2$ m
    &id035 tolerance: *id001
  solutions:
  - id: S21-B
    audience: &id036 B
    method_no: *id013
    steps:
    - &id014 id: &id020 21b-1
      &id015 content: |
        제시문 (라)에 의해 산책로는 게양대를 초점으로 하고 장축의 길이가 $2a=180$인 타원이고, 선분 DA가 장축이므로 D, A는 장축의 양 끝점이다. 제시문 (마)에 의해 꽃길은 게양대를 초점으로 하고 주축의 길이가 $2a'=60$인 쌍곡선이며, 파란 꽃길은 점 B에서 끝난다. 선분 DA의 중심을 원점, 선분 DA를 $x$축 위에 두면 타원은 $\dfrac{x^2}{a^2}+\dfrac{y^2}{b^2}=1$, 쌍곡선은 $\dfrac{x^2}{a'^2}-\dfrac{y^2}{b'^2}=1$이고, 초점 $(-c,0),(c,0)$에 대해 $c^2=a^2-b^2$, $c^2=a'^2+b'^2$, $\overline{\mathrm{PQ}}=2c$이다.
      &id016 source_flow: &id017 예시답안 p.6~7
      &id018 criteria:
      - 2-1.M1
    - *id014: &id027 21b-2
      *id015: |
        제시문 (사)의 음수대를 R, $\overline{\mathrm{PR}}=u$, $\overline{\mathrm{QR}}=v$라 하면 직각삼각형 PQR에서 $(2c)^2=u^2+v^2$이고, R이 타원과 쌍곡선 위의 점이므로 $v+u=2a$, $v-u=2a'$이다. 따라서 $u=a-a'$, $v=a+a'$이고 $4c^2=(a-a')^2+(a+a')^2$, 즉 $c^2=\dfrac{a^2+a'^2}2$, $c=\dfrac{\sqrt{a^2+a'^2}}{\sqrt2}$이다.
      *id016: *id017
      *id018:
      - 2-1.M2
    - *id014: &id029 21b-3
      *id015: |
        $a=90$, $a'=30$을 대입하면 $c=\dfrac{\sqrt{90^2+30^2}}{\sqrt2}=30\dfrac{\sqrt{10}}{\sqrt2}=30\sqrt5$이므로 두 국기게양대 사이의 거리는 $2c=60\sqrt5$이다.
      *id016: *id017
      *id018:
      - 2-1.A1
    - *id014: &id031 21b-4
      *id015: |
        $b=\sqrt{a^2-c^2}=\sqrt{90^2-30^2\cdot5}=30\sqrt{9-5}=60$, $b'=\sqrt{c^2-a'^2}=\sqrt{30^2\cdot5-30^2}=30\sqrt{5-1}=60$이다.
      *id016: *id017
      *id018:
      - 2-1.A2
    - *id014: &id032 21b-5
      *id015: |
        선분 AB의 길이는 $x=a=90$일 때의 쌍곡선의 $y$좌표이다. $\dfrac{x^2}{a'^2}-\dfrac{y^2}{b'^2}=1$에서 $y>0$이므로 $y=b'\sqrt{\dfrac{x^2}{a'^2}-1}$에 $x=90$을 대입하면 $y=60\sqrt{\dfrac{90^2}{30^2}-1}=60\sqrt{3^2-1}=120\sqrt2$이다. 따라서 공원의 세로 길이 $\overline{\mathrm{AB}}=120\sqrt2$이다.
      *id016: *id017
      *id018:
      - 2-1.M3
      - 2-1.A3
