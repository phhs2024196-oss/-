key_idea: 초점이 같은 타원($2a=180$)과 쌍곡선($2a'=60$)의 교점 R에서 $\overline{\mathrm{PR}}+\overline{\mathrm{QR}}=180$, 두 거리의 차 $=60$, $\angle\mathrm{PRQ}=90^\circ$로 $c^2=\dfrac{a^2+a'^2}{2}$, $c=30\sqrt5$, $b=b'=60$을 얻고 B$(90,y)$를 쌍곡선에 대입해 $\overline{\mathrm{AB}}=120\sqrt2$를 구한다. 이어 $h^2=\tan^215^\circ\cdot\overline{\mathrm{BP}}^2$에 $\tan15^\circ=2-\sqrt3$와 $\overline{\mathrm{BP}}^2=\overline{\mathrm{PA}}^2+\overline{\mathrm{AB}}^2$을 쓴다.
