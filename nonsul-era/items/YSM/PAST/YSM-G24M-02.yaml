- id: 2-2
  stem: |
    [문제 2-2] B 지점의 지면에서 P 지점의 국기게양대의 꼭대기를 바라본 각도가 $15^\circ$이고, 국기게양대의 높이를 $h$라고 할 때, 유리수 $h_1$, $h_2$, $h_3$, $h_4$에 대해서

    $$h^2=1800\left(h_1+h_2\sqrt3+h_3\sqrt5+h_4\sqrt{15}\right)$$

    이다. 이 때 $h_1+h_2+h_3+h_4$의 값을 구하시오. (15점)
  points: *id011
  depends_on: []
  answer:
    *id033: *id012
    *id012: '60'
    *id034:
    - $h_1=161$, $h_2=-92$, $h_3=-21$, $h_4=12$이므로 $h_1+h_2+h_3+h_4=60$
    *id035: *id001
  solutions:
  - id: S22-B
    audience: *id036
    method_no: *id013
    steps:
    - *id014: &id038 22b-1
      *id015: |
        P 지점 국기게양대의 꼭대기를 H, $\angle\mathrm{PBH}=15^\circ=\theta$라 하면 삼각형 PBH에서 $\tan\theta=\dfrac{\overline{\mathrm{HP}}}{\overline{\mathrm{BP}}}$이므로 $h^2=\tan^2\theta\cdot\overline{\mathrm{BP}}^2$이다.
      *id016: &id037 예시답안 p.7~8
      *id018:
      - 2-2.M1
    - *id014: &id039 22b-2
      *id015: |
        탄젠트의 덧셈정리로 $\tan15^\circ=\tan(45^\circ-30^\circ)=\dfrac{\tan45^\circ-\tan30^\circ}{1+\tan45^\circ\tan30^\circ}=\dfrac{1-1/\sqrt3}{1+1\cdot1/\sqrt3}=\dfrac{\sqrt3-1}{\sqrt3+1}=\dfrac{3+1-2\sqrt3}{3-1}=2-\sqrt3$이다.
      *id016: *id037
      *id018:
      - 2-2.M2
    - *id014: &id040 22b-3
      *id015: |
        삼각형 PAB는 $\angle\mathrm{PAB}=90^\circ$인 직각삼각형이고 $\overline{\mathrm{PA}}=a-c=90-30\sqrt5$, $\overline{\mathrm{AB}}=120\sqrt2$이므로 $\overline{\mathrm{BP}}^2=(90-30\sqrt5)^2+(120\sqrt2)^2=30^2(3^2+5-2\cdot3\sqrt5+4^2\cdot2)=1800(23-3\sqrt5)$이다.
      *id016: *id037
      *id018:
      - 2-2.M3
      - 2-2.A1
    - *id014: &id041 22b-4
      *id015: |
        $h^2=\tan^2\theta\cdot\overline{\mathrm{BP}}^2=(2-\sqrt3)^2\cdot1800(23-3\sqrt5)=1800(161-92\sqrt3-21\sqrt5+12\sqrt{15})$이다.
      *id016: *id037
      *id018:
      - 2-2.A2
    - *id014: &id042 22b-5
      *id015: |
        그러므로 $h_1=161$, $h_2=-92$, $h_3=-21$, $h_4=12$이므로 $h_1+h_2+h_3+h_4=161-92-21+12=60$이다.
      *id016: *id037
      *id018:
      - 2-2.A3
