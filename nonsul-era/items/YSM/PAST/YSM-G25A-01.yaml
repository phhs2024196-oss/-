- id: 1-3
  stem: |
    [문제 1-3] 닫힌구간 $\left[0,\sqrt{\dfrac{\pi}{2}}\right]$에서 곡선 $y=x\cos(x^2)$과 $x$축으로 둘러싸인 도형의 넓이를 정적분을 이용하여 구하시오. (10점)
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 1/2
    equivalents:
    - $\dfrac12$
    tolerance: null
  solutions:
  - id: S13-B
    audience: B
    method_no: 1
    steps:
    - id: 13b-1
      content: 제시문에 주어진 바와 같이 넓이는 정적분으로 구할 수 있으므로 넓이 $=\displaystyle\int_0^{\sqrt{\frac{\pi}{2}}}x\cos(x^2)dx$이다.
      source_flow: 문항해설·예시답안 pp.14~15
      criteria:
      - 1-3.M1
    - id: 13b-2
      content: $x^2=t$로 치환하면 $2x\,dx=dt$이고 $x:0\to\sqrt{\frac{\pi}{2}}$일 때 $t:0\to\dfrac{\pi}{2}$이므로 $\displaystyle\int_0^{\frac{\pi}{2}}\cos t\,\dfrac{dt}{2}$가 된다.
      source_flow: 문항해설·예시답안 pp.14~15
      criteria:
      - 1-3.M2
    - id: 13b-3
      content: $\dfrac12\Big[\sin t\Big]_0^{\frac{\pi}{2}}=\dfrac12\left(\sin\dfrac{\pi}{2}-\sin0\right)=\dfrac12$이다.
      source_flow: 문항해설·예시답안 pp.14~15
      criteria:
      - 1-3.A1
  rubric:
