stimuli: []
stem: |
  【문제 1】 아래의 제시문을 읽고 문항별로 풀이와 함께 답하시오. (30점)

  (가) 그림과 같이 곡선 $y=x^2$과 $x$축 및 $x=1$로 둘러싸인 도형의 넓이를 $S$라고 하자. <그림 1>은 닫힌구간 $[0,1]$을 $n$등분한 소구간의 오른쪽 끝점의 함수값을 높이로 하는 직사각형을 그린 그림이다. <그림 2>는 닫힌구간 $[0,1]$을 $n$등분한 소구간의 왼쪽 끝점의 함수값을 높이로 하는 직사각형을 그린 그림이다.

  일반적으로 함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이면 극한값 $\displaystyle\lim_{n\to\infty}\sum_{k=1}^{n}f(x_k)\Delta x$는 항상 존재함이 알려져 있고, 이 극한값은 $f(x)$의 $a$에서 $b$까지의 정적분 $\displaystyle\int_a^b f(x)dx$와 같다.

  (단, $\Delta x=\dfrac{b-a}{n}$, $x_k=a+k\Delta x$)

  [그림 1: 곡선 $y=x^2$ 아래 $[0,1]$을 $n$등분한 소구간의 오른쪽 끝점의 함수값을 높이로 하는 직사각형들. 가로축 0.0~1.0, 세로축 0.0~1.5. 맨 왼쪽의 작은 직사각형부터 맨 오른쪽의 높이 1.0 직사각형까지 이어지며 가운데는 ……로 생략]

  [그림 2: 곡선 $y=x^2$ 아래 $[0,1]$을 $n$등분한 소구간의 왼쪽 끝점의 함수값을 높이로 하는 직사각형들. 맨 왼쪽 직사각형의 높이는 0이고 맨 오른쪽 직사각형의 높이는 1보다 작으며 가운데는 ……로 생략]
subparts:
- id: 1-1
  stem: |
    [문제 1-1] $n=5$일 때 제시문 (가)의 <그림 1>과 같은 방법으로 만든 직사각형들의 넓이의 합과 <그림 2>와 같은 방법으로 만든 직사각형들의 넓이의 합을 각각 구하시오. (10점)
  points: 10
  depends_on: []
  answer:
    kind: value
    value: A1=55/125; A2=30/125
    equivalents:
    - $\dfrac{55}{125}\ (=0.44)$, $\dfrac{30}{125}\ (=0.24)$
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: <그림 1>에서 $[0,1]$을 5등분하면 $\Delta x=\dfrac15$이고 직사각형의 높이는 각각 $\left(\dfrac15\right)^2,\left(\dfrac25\right)^2,\left(\dfrac35\right)^2,\left(\dfrac45\right)^2,\left(\dfrac55\right)^2$이므로 넓이는 $\dfrac{1}{125},\dfrac{4}{125},\dfrac{9}{125},\dfrac{16}{125},\dfrac{25}{125}$이다.
      source_flow: 문항해설·예시답안 pp.14~15
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: 각 직사각형의 넓이의 합 $A_1=\dfrac{1+4+9+16+25}{125}=\dfrac{55}{125}$ (또는 $0.44$)이다.
      source_flow: 문항해설·예시답안 pp.14~15
      criteria:
      - 1-1.A1
    - id: 11b-3
      content: <그림 2>에서는 왼쪽 끝점 $0,\dfrac15,\dfrac25,\dfrac35,\dfrac45$의 함수값이 높이이므로 직사각형 4개의 넓이는 $\dfrac{1}{125},\dfrac{4}{125},\dfrac{9}{125},\dfrac{16}{125}$이다. (높이 0인 첫 직사각형은 넓이 0)
      source_flow: 문항해설·예시답안 pp.14~15
      criteria:
      - 1-1.M2
    - id: 11b-4
      content: $A_2=\dfrac{1+4+9+16}{125}=\dfrac{30}{125}$ (또는 $0.24$)이다.
      source_flow: 문항해설·예시답안 pp.14~15
      criteria:
      - 1-1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 3
      evidence: <그림 1>의 직사각형 5개의 밑변 $\dfrac15$와 높이 $\left(\dfrac k5\right)^2$ ($k=1,\dots,5$)를 썼다.
      steps:
      - 11b-1
    - id: 1-1.A1
      mark_type: A
      points: 2
      evidence: $A_1=\dfrac{55}{125}$(또는 $0.44$)를 구했다.
      depends_on:
      - 1-1.M1
      steps:
      - 11b-2
    - id: 1-1.M2
      mark_type: M
      points: 3
      evidence: <그림 2>의 높이를 $\left(\dfrac k5\right)^2$ ($k=0,\dots,4$)로 놓았다.
      steps:
      - 11b-3
    - id: 1-1.A2
      mark_type: A
      points: 2
      evidence: $A_2=\dfrac{30}{125}$(또는 $0.24$)를 구했다.
      depends_on:
      - 1-1.M2
      steps:
      - 11b-4
