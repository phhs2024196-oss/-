      steps:
      - 12b-1
    - id: 1-2.A1
      mark_type: A
      points: 2
      evidence: $\dfrac{338350}{100^3}$(또는 $0.33835$)를 구했다.
      depends_on:
      - 1-2.M1
      steps:
      - 12b-2
    - id: 1-2.M2
      mark_type: M
      points: 3
      evidence: <그림 2>의 넓이의 합을 $\dfrac1{n^3}\sum_{k=1}^{n-1}k^2$ 꼴로 세웠다($k$의 범위 $0\sim n-1$).
      steps:
      - 12b-3
    - id: 1-2.A2
      mark_type: A
      points: 2
      evidence: $\dfrac{328350}{100^3}$(또는 $0.32835$)를 구했다.
      depends_on:
      - 1-2.M2
      steps:
      - 12b-4
