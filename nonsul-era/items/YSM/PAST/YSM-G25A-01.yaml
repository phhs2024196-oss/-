    meaning: 만점
  misconceptions: []
- id: 1-2
  stem: |
    [문제 1-2] $n=100$일 때 제시문 (가)의 <그림 1>과 같은 방법으로 만든 직사각형들의 넓이의 합과 <그림 2>와 같은 방법으로 만든 직사각형들의 넓이의 합을 각각 구하시오. (10점)
  points: 10
  depends_on: []
  answer:
    kind: value
    value: A1=338350/100**3; A2=328350/100**3
    equivalents:
    - $\dfrac{338350}{100^3}\ (=0.33835)$, $\dfrac{328350}{100^3}\ (=0.32835)$
    tolerance: null
  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: <그림 1>에서 $[0,1]$을 $n$등분한 각 소구간의 오른쪽 끝점의 $x$좌표는 $\dfrac kn$ ($k=1,2,\dots,n$), $y$좌표는 $\left(\dfrac kn\right)^2$이고 각 직사각형의 넓이는 $\left(\dfrac kn\right)^2\dfrac1n$이므로 넓이의 합은 $\dfrac1n\sum_{k=1}^{n}\left(\dfrac kn\right)^2=\dfrac1{n^3}\sum_{k=1}^{n}k^2=\dfrac{1}{n^3}\dfrac{n(n+1)(2n+1)}{6}$이다.
      source_flow: 문항해설·예시답안 pp.14~15
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: $n=100$이면 $\dfrac{1}{100^3}\cdot\dfrac{100\times101\times201}{6}=\dfrac{338350}{100^3}$ (또는 $0.33835$)이다.
      source_flow: 문항해설·예시답안 pp.14~15
      criteria:
      - 1-2.A1
    - id: 12b-3
      content: <그림 2>에서 각 소구간의 왼쪽 끝점의 $x$좌표는 $\dfrac kn$ ($k=0,1,\dots,n-1$), $y$좌표는 $\left(\dfrac kn\right)^2$이고 각 직사각형의 넓이는 $\left(\dfrac kn\right)^2\dfrac1n$이므로 넓이의 합은 $\dfrac1n\sum_{k=0}^{n-1}\left(\dfrac kn\right)^2=\dfrac1{n^3}\sum_{k=1}^{n-1}k^2=\dfrac{1}{n^3}\dfrac{(n-1)n(2n-1)}{6}$이다.
      source_flow: 문항해설·예시답안 pp.14~15
      criteria:
      - 1-2.M2
    - id: 12b-4
      content: $n=100$이면 $\dfrac{1}{100^3}\cdot\dfrac{99\times100\times199}{6}=\dfrac{328350}{100^3}$ (또는 $0.32835$)이다.
      source_flow: 문항해설·예시답안 pp.14~15
      criteria:
      - 1-2.A2
