stimuli: []
stem: |
  【문제 2】 아래의 제시문을 읽고 문항별로 풀이와 함께 답하시오. (30점)

  (가) 최고차 항의 계수가 1인 삼차방정식 $x^3+ax^2+bx-4=0$의 한 개의 허근이 $1+i$이다. (단, $a$, $b$는 실수)

  (나) 최고차 항의 계수가 1인 삼차방정식 $x^3+cx^2+100x+100=0$의 계수 $c$는 양의 정수이다.
subparts:
- id: 2-1
  stem: |
    [문제 2-1] 제시문 (가)의 $y=x^3+ax^2+bx-4$와 $x$축, $y$축으로 둘러싸인 도형의 넓이를 구하시오. (20점)
  points: 20
  depends_on: []
  answer:
    kind: value
    value: 8/3
    equivalents:
    - $\dfrac83$
    tolerance: null
  solutions:
  - id: S21-B
    audience: B
    method_no: 1
    steps:
    - id: 21b-1
      content: 삼차방정식 $x^3+ax^2+bx-4=0$ (식 1)의 한 개의 허근이 $1+i$이면 다른 허근은 $1-i$이다. 나머지 실근을 $x_1$이라고 하면 삼차방정식은 $(x-(1+i))(x-(1-i))(x-x_1)=0$이다.
      source_flow: 문항해설·예시답안 p.17
      criteria:
      - 2-1.M1
    - id: 21b-2
      content: 이를 정리하면 $x^3-(x_1+2)x^2+(2x_1+2)x-2x_1=0$이므로 (식 1)과 비교한다.
      source_flow: 문항해설·예시답안 p.17
      criteria:
      - 2-1.M2
    - id: 21b-3
      content: $-2x_1=-4$이므로 한 개의 실근은 $x_1=2$이다. 따라서 $a=-(x_1+2)=-(2+2)=-4$, $b=2x_1+2=2\times2+2=6$이다.
      source_flow: 문항해설·예시답안 p.17
      criteria:
      - 2-1.A1
    - id: 21b-4
      content: $x$절편은 $x=2$이고 $0\le x\le2$에서 $x^3-4x^2+6x-4\le0$이므로 주어진 곡선과 $x$축, $y$축으로 둘러싸인 도형의 넓이는 $\displaystyle\int_0^2\left|x^3-4x^2+6x-4\right|dx=\int_0^2\left(-x^3+4x^2-6x+4\right)dx$이다.
      source_flow: 문항해설·예시답안 p.17
      criteria:
      - 2-1.M3
    - id: 21b-5
      content: $\displaystyle\int_0^2\left(-x^3+4x^2-6x+4\right)dx=\dfrac83$이다.
      source_flow: 문항해설·예시답안 p.17
      criteria:
      - 2-1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2-1.M1
      mark_type: M
      points: 4
      evidence: 켤레근 $1-i$를 쓰고 실근 $x_1$을 두어 $(x-(1+i))(x-(1-i))(x-x_1)=0$으로 놓았다.
      steps:
      - 21b-1
    - id: 2-1.M2
      mark_type: M
      points: 4
      evidence: 전개한 식 $x^3-(x_1+2)x^2+(2x_1+2)x-2x_1$을 (식 1)과 계수 비교했다.
      steps:
      - 21b-2
    - id: 2-1.A1
      mark_type: A
      points: 4
      evidence: $x_1=2$, $a=-4$, $b=6$을 구했다.
      depends_on:
      - 2-1.M2
      steps:
      - 21b-3
    - id: 2-1.M3
      mark_type: M
      points: 4
      evidence: $x$절편 $x=2$, 구간에서 $y\le0$임을 쓰고 부호를 바꾼 적분식을 세웠다.
      steps:
      - 21b-4
    - id: 2-1.A2
      mark_type: A
      points: 4
      evidence: 넓이 $\dfrac83$을 구했다.
      depends_on:
      - 2-1.M3
      steps:
      - 21b-5
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 2-2
  stem: |
    [문제 2-2] 제시문 (나)의 $y=x^3+cx^2+100x+100$이 극댓값과 극솟값을 모두 가질 때 $c$의 최솟값을 구하시오. (10점)
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '18'
    equivalents:
    - $18$
    tolerance: null
  solutions:
  - id: S22-B
    audience: B
    method_no: 1
    steps:
    - id: 22b-1
      content: 삼차함수가 극댓값, 극솟값을 모두 가지려면 이차방정식 $y'=0$이 서로 다른 두 개의 실근을 가져야 한다. $y=x^3+cx^2+100x+100$을 미분하면 $y'=3x^2+2cx+100$이다.
      source_flow: 문항해설·예시답안 p.17
      criteria:
      - 2-2.M1
    - id: 22b-2
      content: $D=4c^2-4\times3\times100>0$, 즉 $c^2>300$이다.
      source_flow: 문항해설·예시답안 p.17
      criteria:
      - 2-2.A1
    - id: 22b-3
      content: $c^2>300$을 만족하는 양의 정수 $c$의 최솟값은 $18$이다. ($\because 17^2=289,\ 18^2=324$)
      source_flow: 문항해설·예시답안 p.17
      criteria:
      - 2-2.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2-2.M1
      mark_type: M
      points: 4
      evidence: $y'=3x^2+2cx+100$과 "$y'=0$이 서로 다른 두 실근"을 썼다.
      steps:
      - 22b-1
    - id: 2-2.A1
      mark_type: A
      points: 3
      evidence: 판별식 조건 $c^2>300$을 구했다.
      depends_on:
      - 2-2.M1
      steps:
      - 22b-2
    - id: 2-2.A2
      mark_type: A
      points: 3
      evidence: $17^2<300<18^2$를 이용해 $c=18$을 구했다.
      depends_on:
      - 2-2.A1
      steps:
      - 22b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
