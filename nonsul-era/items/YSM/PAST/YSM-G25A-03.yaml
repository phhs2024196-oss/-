stimuli: []
stem: |
  【문제 3】 아래의 제시문을 읽고 문항별로 풀이와 함께 답하시오. (40점)

  (가) 좌표평면 위를 움직이는 점 $\mathrm{P}_1$의 시각 $t$에서의 위치 $(x_1(t),y_1(t))$는 다음과 같다. $(t\ge0)$

  $$x_1(t)=\int_0^t\theta\sin\theta\,d\theta,\ y_1(t)=\int_0^t\theta\cos\theta\,d\theta$$

  (나) 좌표평면 위를 움직이는 또 다른 점 $\mathrm{P}_2$의 시각 $t$에서의 위치 $(x_2(t),y_2(t))$는 다음과 같다. $(t\ge0)$

  $$x_2(t)=-t\cos t,\ y_2(t)=t\sin t$$
subparts:
- id: 3-1
  stem: |
    [문제 3-1] 점 $\mathrm{P}_1$과 원점 $(0,0)$ 사이의 거리를 구하시오. (10점)
  points: 10
  depends_on: []
  answer:
    kind: expression
    value: sqrt(t**2+2-2*t*sin(t)-2*cos(t))
    equivalents:
    - $\sqrt{t^2+2-2t\sin t-2\cos t}$
    tolerance: null
  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: 부분적분법을 이용하여 $x_1(t)=\displaystyle\int_0^t\theta\sin\theta\,d\theta=\Big[-\theta\cos\theta\Big]_0^t+\int_0^t\cos\theta\,d\theta=\Big[-\theta\cos\theta\Big]_0^t+\Big[\sin\theta\Big]_0^t$이다.
      source_flow: 문항해설·예시답안 p.19
      criteria:
      - 3-1.M1
    - id: 31b-2
      content: $\therefore\ x_1(t)=-t\cos t+\sin t$
      source_flow: 문항해설·예시답안 p.19
      criteria:
      - 3-1.A1
    - id: 31b-3
      content: $y_1(t)=\displaystyle\int_0^t\theta\cos\theta\,d\theta=\Big[\theta\sin\theta\Big]_0^t-\int_0^t\sin\theta\,d\theta=\Big[\theta\sin\theta\Big]_0^t+\Big[\cos\theta\Big]_0^t$, $\therefore\ y_1(t)=t\sin t+\cos t-1$이다.
      source_flow: 문항해설·예시답안 p.19
      criteria:
      - 3-1.A2
    - id: 31b-4
      content: 원점과의 거리는 $s(t)=\sqrt{(-t\cos t+\sin t)^2+(t\sin t+\cos t-1)^2}$이다.
      source_flow: 문항해설·예시답안 p.19
      criteria:
      - 3-1.M2
    - id: 31b-5
      content: 전개하면 $s(t)=\sqrt{t^2\cos^2t-2t\cos t\sin t+\sin^2t+t^2\sin^2t+2t\sin t\cos t+\cos^2t-2t\sin t-2\cos t+1}=\sqrt{t^2+2-2t\sin t-2\cos t}$이다.
      source_flow: 문항해설·예시답안 p.19
      criteria:
      - 3-1.A3
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3-1.M1
      mark_type: M
      points: 3
      evidence: $\theta\sin\theta$, $\theta\cos\theta$에 부분적분을 적용한 식을 썼다.
      steps:
      - 31b-1
    - id: 3-1.A1
      mark_type: A
      points: 2
      evidence: $x_1(t)=-t\cos t+\sin t$를 구했다.
      depends_on:
      - 3-1.M1
      steps:
      - 31b-2
    - id: 3-1.A2
      mark_type: A
      points: 2
      evidence: $y_1(t)=t\sin t+\cos t-1$을 구했다.
      depends_on:
      - 3-1.M1
      steps:
      - 31b-3
    - id: 3-1.M2
      mark_type: M
      points: 1
      evidence: 거리를 $\sqrt{x_1^2+y_1^2}$로 썼다.
      steps:
      - 31b-4
    - id: 3-1.A3
      mark_type: A
      points: 2
      evidence: $s(t)=\sqrt{t^2+2-2t\sin t-2\cos t}$를 구했다.
      depends_on:
      - 3-1.M2
      steps:
      - 31b-5
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 3-2
  stem: |
    [문제 3-2] 점 $\mathrm{P}_1$과 원점 $(0,0)$ 사이의 거리의 순간변화율이 0이 되는 시각 $t$를 구하시오. (10점)
  points: 10
  depends_on:
  - 3-1
  answer:
    kind: value
    value: t_0=0; t_n=2*n*pi
    equivalents:
    - $t=0$ 또는 $t=2n\pi$ ($n=1,2,\cdots$)
    tolerance: null
  solutions:
  - id: S32-B
    audience: B
    method_no: 1
    steps:
    - id: 32b-1
      content: $\dfrac{ds}{dt}=\dfrac{d}{dt}\left(\sqrt{t^2+2-2t\sin t-2\cos t}\right)$를 구한다.
      source_flow: 문항해설·예시답안 pp.19~20
      criteria:
      - 3-2.M1
    - id: 32b-2
      content: $=\dfrac12\cdot\dfrac{2t-2\sin t-2t\cos t+2\sin t}{\sqrt{t^2+2-2t\sin t-2\cos t}}=\dfrac12\cdot\dfrac{2t-2t\cos t}{\sqrt{t^2+2-2t\sin t-2\cos t}}=0$이다.
      source_flow: 문항해설·예시답안 pp.19~20
      criteria:
      - 3-2.A1
    - id: 32b-3
      content: $t(1-\cos t)=0$이므로 $t=0$ 또는 $t=2n\pi$ (단, $n=1,2,\cdots$)이다.
      source_flow: 문항해설·예시답안 pp.19~20
      criteria:
      - 3-2.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3-2.M1
      mark_type: M
      points: 3
      evidence: 3-1의 거리 $s(t)$를 $t$로 미분하는 식을 세웠다.
      steps:
      - 32b-1
    - id: 3-2.A1
      mark_type: A
      points: 3
      evidence: 분자 $2t-2t\cos t$를 얻었다.
      depends_on:
      - 3-2.M1
      steps:
      - 32b-2
    - id: 3-2.A2
      mark_type: A
      points: 4
      evidence: $t=0$, $t=2n\pi$ ($n=1,2,\cdots$)를 구했다.
      depends_on:
      - 3-2.A1
      steps:
      - 32b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 3-3
  stem: |
    [문제 3-3] 시각 $t=0$에서 시각 $t=2\pi$까지 점 $\mathrm{P}_1$이 움직인 거리를 구하시오. (10점)
  points: 10
  depends_on:
  - 3-1
  answer:
    kind: expression
    value: 2*pi**2
    equivalents:
    - $2\pi^2$
    tolerance: null
  solutions:
  - id: S33-B
    audience: B
    method_no: 1
    steps:
    - id: 33b-1
      content: 매개변수 방정식의 곡선의 길이는 $l(t)=\displaystyle\int_0^t\sqrt{\left(\dfrac{dx}{dt}\right)^2+\left(\dfrac{dy}{dt}\right)^2}\,dt$이다.
      source_flow: 문항해설·예시답안 p.20
      criteria:
      - 3-3.M1
    - id: 33b-2
      content: $x_1(t)=-t\cos t+\sin t$에서 $\dfrac{dx}{dt}=-\cos t+t\sin t+\cos t=t\sin t$, $y_1(t)=t\sin t+\cos t-1$에서 $\dfrac{dy}{dt}=\sin t+t\cos t-\sin t=t\cos t$이다.
      source_flow: 문항해설·예시답안 p.20
      criteria:
      - 3-3.A1
    - id: 33b-3
      content: $l(2\pi)=\displaystyle\int_0^{2\pi}\sqrt{(t\sin t)^2+(t\cos t)^2}\,dt=\int_0^{2\pi}t\,dt=\Big[\dfrac{t^2}{2}\Big]_0^{2\pi}=2\pi^2$이다.
      source_flow: 문항해설·예시답안 p.20
      criteria:
      - 3-3.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3-3.M1
      mark_type: M
      points: 3
      evidence: 이동거리를 $\int\sqrt{(dx/dt)^2+(dy/dt)^2}\,dt$로 세웠다.
      steps:
      - 33b-1
    - id: 3-3.A1
      mark_type: A
      points: 3
      evidence: $\dfrac{dx}{dt}=t\sin t$, $\dfrac{dy}{dt}=t\cos t$를 구했다.
      depends_on:
      - 3-3.M1
      steps:
      - 33b-2
    - id: 3-3.A2
      mark_type: A
      points: 4
      evidence: $\int_0^{2\pi}t\,dt=2\pi^2$을 구했다.
      depends_on:
      - 3-3.A1
      steps:
      - 33b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 3-4
  stem: |
    [문제 3-4] 시각 $t=0$에서 시각 $t=2\pi$ 사이에, 두 점 $\mathrm{P}_1$, $\mathrm{P}_2$ 사이의 거리가 최대가 되는 시각과 이 시각에서 두 점 사이의 거리를 각각 구하시오. (10점)
  points: 10
  depends_on:
  - 3-1
  answer:
    kind: value
    value: t=pi; d=2
    equivalents:
    - 시각 $t=\pi$, 거리 $2$
    tolerance: null
  solutions:
  - id: S34-B
    audience: B
    method_no: 1
    steps:
    - id: 34b-1
      content: 두 점 사이의 거리는 $\sqrt{(x_1-x_2)^2+(y_1-y_2)^2}$이므로 $\sqrt{(-t\cos t+\sin t+t\cos t)^2+(t\sin t+\cos t-1-t\sin t)^2}=\sqrt{(\sin t)^2+(\cos t-1)^2}$이다.
      source_flow: 문항해설·예시답안 pp.20~21
      criteria:
      - 3-4.M1
    - id: 34b-2
      content: $=\sqrt{\sin^2t+\cos^2t-2\cos t+1}=\sqrt{2-2\cos t}$이다.
      source_flow: 문항해설·예시답안 pp.20~21
      criteria:
      - 3-4.A1
    - id: 34b-3
      content: $\dfrac{d}{dt}\left(\sqrt{2-2\cos t}\right)=\dfrac{2\sin t}{2\sqrt{2-2\cos t}}=0$이다. (또는 $\sqrt{2-2\cos t}=\sqrt{4\sin^2\dfrac t2}=2\sin\dfrac t2$이므로 $\dfrac{d}{dt}\left(2\sin\dfrac t2\right)=\cos\dfrac t2=0$일 때 극값을 갖는다.)
      source_flow: 문항해설·예시답안 pp.20~21
      criteria:
      - 3-4.M2
    - id: 34b-4
      content: $0<t\le2\pi$에서는 $t=\pi$일 때 극값을 갖는다.
      source_flow: 문항해설·예시답안 pp.20~21
      criteria:
      - 3-4.A2
    - id: 34b-5
      content: 최대·최소를 판별하기 위해 이계도함수를 구하면 $\dfrac{d}{dt}\left(\dfrac{\sin t}{\sqrt{2-2\cos t}}\right)=\dfrac{2\cos t-2\cos^2t-2\sin^2t}{(2-2\cos t)\sqrt{2-2\cos t}}$이고 $t=\pi$에서 $\dfrac{2\cos\pi-2}{(2-2\cos\pi)\sqrt{2-2\cos\pi}}=-\dfrac12<0$ (또는 $\dfrac{d}{dt}\cos\dfrac t2\to-\sin\dfrac\pi2\cdot\dfrac12=-\dfrac12<0$)이므로 극댓값을 갖는다. 구간 내에서 두 점 사이의 거리가 최대일 때의 시각은 $t=\pi$이고, 이때 두 점 사이의 거리는 $\sqrt{2-2\cos\pi}=2$이다.
      source_flow: 문항해설·예시답안 pp.20~21
      criteria:
      - 3-4.A3
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3-4.M1
      mark_type: M
      points: 2
      evidence: $x_1-x_2=\sin t$, $y_1-y_2=\cos t-1$을 구했다.
      steps:
      - 34b-1
    - id: 3-4.A1
      mark_type: A
      points: 2
      evidence: 거리 $\sqrt{2-2\cos t}$를 얻었다.
      depends_on:
      - 3-4.M1
      steps:
      - 34b-2
    - id: 3-4.M2
      mark_type: M
      points: 2
      evidence: 거리함수의 도함수 $\dfrac{\sin t}{\sqrt{2-2\cos t}}=0$ 또는 $\cos\dfrac t2=0$을 세웠다.
      steps:
      - 34b-3
    - id: 3-4.A2
      mark_type: A
      points: 2
      evidence: $t=\pi$를 구했다.
      depends_on:
      - 3-4.M2
      steps:
      - 34b-4
    - id: 3-4.A3
      mark_type: A
      points: 2
      evidence: 이계도함수 부호로 극대임을 확인하고 최대 거리 $2$를 구했다.
      depends_on:
      - 3-4.A2
      steps:
      - 34b-5
