stuck: $\int_0^t\theta\sin\theta\,d\theta$의 부분적분과 원점까지의 거리를 정리해 $\sqrt{t^2+2-2t\sin t-2\cos t}$로 만드는 단계, 그리고 $x_1-x_2$, $y_1-y_2$에서 $t$ 항이 소거되어 거리가 $\sqrt{2-2\cos t}$로 단순해짐을 알아채는 단계.
