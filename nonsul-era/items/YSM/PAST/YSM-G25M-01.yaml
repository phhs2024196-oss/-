stimuli: []
stem: |
  【문제 1】 아래의 제시문을 읽고 문항별로 풀이와 함께 답하시오. (30점)

  (가) 두 초점 $\mathrm{F},\mathrm{F}'$ 사이의 거리가 14이고 주축의 길이가 10인 쌍곡선이 있다.

  (나) 다음 그림과 같이 쌍곡선 위의 점 $\mathrm{P}$에서 그은 직선 $\ell$이 $x$축과 만나는 점을 $\mathrm{Q}$라 하자. 이때 점 $\mathrm{Q}$의 $x$좌표는 양수이고 직선 $\ell$은 $\angle\mathrm{FPF}'$을 이등분한다. 선분 $\mathrm{PF}'$위에 $\overline{\mathrm{F}'\mathrm{R}}=10$을 만족시키는 점을 $\mathrm{R}$이라고 하면 $\overline{\mathrm{F}'\mathrm{R}}$을 지름으로 하는 원이 점 $\mathrm{Q}$를 지난다. (단, 점 $\mathrm{P}$는 좌표평면의 제 1사분면 위에 놓인다.)

  [그림: $xy$평면 위에 좌우로 열린 쌍곡선의 두 가지가 그려져 있다. $x$축 위에 왼쪽부터 $\mathrm{F}'$, 원점 $\mathrm{O}$, $\mathrm{Q}$, $\mathrm{F}$가 있고, $y$축 위에 점 $\mathrm{R}$이 있다. 제 1사분면의 쌍곡선 위 점 $\mathrm{P}$에서 $\mathrm{F}'$, $\mathrm{F}$로 선분을 그었고, 점 $\mathrm{Q}$를 지나 $\mathrm{P}$까지 이어지는 직선 $\ell$이 있다. $\mathrm{F}'$, $\mathrm{R}$, $\mathrm{Q}$를 지나는 원이 그려져 있다.]
subparts:
- id: 1-1
  stem: |
    [문제 1-1] 제시문에서 주어진 $\angle\mathrm{FPF}'=\theta$라 하자. 함수 $f(x)=\dfrac{5}{\theta}(5x-2)^3$에 대하여 다음 정적분의 값을 구하시오. (15점)

    $$\int_0^{\theta}x\cos x\,f'(\sin x)dx+\int_{\frac{\pi}{2}-\theta}^{\frac{\pi}{2}}f(\cos x)dx$$
  points: 15
  depends_on: []
  answer:
    kind: value
    value: -27/25
    equivalents:
    - $-\dfrac{27}{25}$
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: '두 초점 $\mathrm{F},\mathrm{F}''$ 사이의 거리가 14이고 주축의 길이가 10인 쌍곡선의 방정식은 $\dfrac{x^2}{25}-\dfrac{y^2}{24}=1$이다. (이유: 초점 $\mathrm{F}(7,0),\mathrm{F}''(-7,0)$이고 $25+24=7^2$)'
      source_flow: 문항해설·예시답안 pp.23~24
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: ① $\mathrm{P}$가 쌍곡선 위의 점이므로 쌍곡선의 정의에 의해 $\overline{\mathrm{F'P}}-\overline{\mathrm{FP}}=10$이다. 이때 $\overline{\mathrm{F'R}}=10$이므로 $\overline{\mathrm{PR}}=\overline{\mathrm{PF}}$가 성립한다. 그러면 $\triangle\mathrm{PRF}$는 이등변삼각형이다. ② $\mathrm{Q}$가 선분 $\mathrm{F'R}$을 지름으로 하는 원 위에 있으므로 $\angle\mathrm{F'QR}=\dfrac\pi2$이 되고 결과적으로 $\angle\mathrm{FQR}=\dfrac\pi2$가 된다.
      source_flow: 문항해설·예시답안 pp.23~24
      criteria:
      - 1-1.M2
    - id: 11b-3
      content: '$\triangle\mathrm{PQR}\equiv\triangle\mathrm{PQF}$ (이유: $\overline{\mathrm{PQ}}$는 공통, $\overline{\mathrm{PR}}=\overline{\mathrm{PF}}$, $\angle\mathrm{RPQ}=\angle\mathrm{FPQ}$이므로 SAS 합동)이므로 (i) $\overline{\mathrm{RQ}}=\overline{\mathrm{FQ}}$, (ii) $\angle\mathrm{PQR}=\angle\mathrm{PQF}$이고 $\angle\mathrm{FQR}=\dfrac\pi2$이므로 $\angle\mathrm{PQR}=\angle\mathrm{PQF}=\dfrac\pi4$이며 결과적으로 접선 $\ell$의 기울기는 $\tan\dfrac\pi4=1$이다.'
      source_flow: 문항해설·예시답안 pp.23~24
      criteria:
      - 1-1.M3
    - id: 11b-4
      content: $\mathrm{Q}(1,0)$을 보인다. $\mathrm{Q}$를 $(k,0)$ ($k>0$)라 하면 $\overline{\mathrm{F'Q}}=7+k$, $\overline{\mathrm{FQ}}=7-k$이고 (i)에 의해 $\overline{\mathrm{RQ}}=7-k$가 된다. 그러면 삼각형 $\triangle\mathrm{RQF'}$은 직각삼각형이므로 $10^2=(7+k)^2+(7-k)^2$을 만족한다. 따라서 $k=1$이다.
      source_flow: 문항해설·예시답안 pp.23~24
      criteria:
      - 1-1.A1
    - id: 11b-5
      content: 직선 $\ell$의 방정식은 $y=x-1$이다. 이 식을 쌍곡선 $\dfrac{x^2}{25}-\dfrac{y^2}{24}=1$에 대입하여 풀면 점 $\mathrm{P}$의 좌표는 $(25,24)$이다.
      source_flow: 문항해설·예시답안 pp.23~24
      criteria:
      - 1-1.A2
    - id: 11b-6
      content: $\overline{\mathrm{FP}}=\sqrt{(25-7)^2+24^2}=30$, $\overline{\mathrm{F'P}}=\sqrt{(25+7)^2+24^2}=40$, $\overline{\mathrm{FF'}}=14$이므로 $\cos\theta=\dfrac{30^2+40^2-14^2}{2\times30\times40}=\dfrac{24}{25}$이다.
      source_flow: 문항해설·예시답안 pp.23~24
      criteria:
      - 1-1.A3
    - id: 11b-7
      content: (i) $[xf(\sin x)]'=f(\sin x)+x\cos x\,f'(\sin x)$이므로 $\displaystyle\int_0^\theta x\cos x\,f'(\sin x)dx$에 부분적분법을 적용하면 $\displaystyle\int_0^\theta x\cos x\,f'(\sin x)dx=\Big[xf(\sin x)\Big]_0^\theta-\int_0^\theta f(\sin x)dx=\theta f(\sin\theta)-\int_0^\theta f(\sin x)dx$이다.
      source_flow: 문항해설·예시답안 pp.23~24
      criteria:
      - 1-1.M4
    - id: 11b-8
      content: (ii) $\displaystyle\int_{\frac\pi2-\theta}^{\frac\pi2}f(\cos x)dx$에서 $x=\dfrac\pi2-t$로 치환하면 $\displaystyle\int_{\frac\pi2-\theta}^{\frac\pi2}f(\cos x)dx=-\int_\theta^0f\left(\cos\left(\dfrac\pi2-t\right)\right)dt=-\int_\theta^0f(\sin t)dt=\int_0^\theta f(\sin t)dt$이다.
      source_flow: 문항해설·예시답안 pp.23~24
      criteria:
      - 1-1.M5
    - id: 11b-9
      content: '따라서 (i)과 (ii)를 사용하여 주어진 식을 구하면 $\theta f(\sin\theta)-\displaystyle\int_0^\theta f(\sin x)dx+\int_0^\theta f(\sin t)dt=\theta f(\sin\theta)=\theta f\left(\dfrac7{25}\right)$ (이유: $\cos\theta=\dfrac{24}{25}$, $\sin^2\theta+\cos^2\theta=1$, $\sin\theta>0$이므로) $=5\left(-\dfrac35\right)^3=-\dfrac{27}{25}$ (이유: $f(x)=\dfrac5\theta(5x-2)^3$이므로)이다.'
      source_flow: 문항해설·예시답안 pp.23~24
      criteria:
      - 1-1.A4
