      - 11b-1
    - id: 1-1.M2
      mark_type: M
      points: 2
      evidence: $\overline{\mathrm{PR}}=\overline{\mathrm{PF}}$와 $\angle\mathrm{FQR}=\dfrac\pi2$를 썼다.
      steps:
      - 11b-2
    - id: 1-1.M3
      mark_type: M
      points: 2
      evidence: 합동으로 $\overline{\mathrm{RQ}}=\overline{\mathrm{FQ}}$와 $\ell$의 기울기 1을 얻었다.
      steps:
      - 11b-3
    - id: 1-1.A1
      mark_type: A
      points: 2
      evidence: $\mathrm{Q}(1,0)$을 구했다.
      depends_on:
      - 1-1.M3
      steps:
      - 11b-4
    - id: 1-1.A2
      mark_type: A
      points: 1
      evidence: $\mathrm{P}(25,24)$를 구했다.
      depends_on:
      - 1-1.A1
      steps:
      - 11b-5
    - id: 1-1.A3
      mark_type: A
      points: 1
      evidence: 코사인법칙으로 $\cos\theta=\dfrac{24}{25}$를 구했다.
      depends_on:
      - 1-1.A2
      steps:
      - 11b-6
    - id: 1-1.M4
      mark_type: M
      points: 2
      evidence: $\displaystyle\int_0^\theta x\cos x\,f'(\sin x)dx=\theta f(\sin\theta)-\int_0^\theta f(\sin x)dx$를 얻었다.
      steps:
      - 11b-7
    - id: 1-1.M5
      mark_type: M
      points: 1
      evidence: $x=\dfrac\pi2-t$ 치환으로 $\displaystyle\int_0^\theta f(\sin t)dt$를 얻었다.
      steps:
      - 11b-8
    - id: 1-1.A4
      mark_type: A
      points: 2
      evidence: $\theta f(\sin\theta)$로 정리하고 $\sin\theta=\dfrac7{25}$를 넣어 $-\dfrac{27}{25}$를 구했다.
      depends_on:
      - 1-1.M4
      - 1-1.M5
      steps:
      - 11b-9
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 1-2
  stem: |
    [문제 1-2] 제시문에서 선분 $\mathrm{RF}$를 $2:1$로 내분하는 점을 $\mathrm{D}$라 하자. 직선 $\mathrm{PR}$에 대한 점 $\mathrm{D}$의 대칭점을 $\mathrm{E}$라 하자. 두 벡터 $\overrightarrow{\mathrm{PR}}=\vec a$, $\overrightarrow{\mathrm{PF}}=\vec b$에 대하여 $\overrightarrow{\mathrm{PE}}=k\vec a+l\vec b$일 때, $k+l$의 값을 구하시오. (단, $k,l$은 실수이다) (15점)
  points: 15
  depends_on:
  - 1-1
  answer:
    kind: value
    value: 71/75
    equivalents:
    - $\dfrac{71}{75}$ ($k=\dfrac{121}{75},\ l=-\dfrac23$)
    tolerance: null
  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: ① $\overrightarrow{\mathrm{PD}}=\dfrac{\overrightarrow{\mathrm{PR}}+2\overrightarrow{\mathrm{PF}}}{3}=\dfrac{\vec a+2\vec b}{3}$이다.
      source_flow: 문항해설·예시답안 p.25
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: ② $l=-\dfrac23$을 보인다. $\angle\mathrm{DPR}=\angle\mathrm{EPR}$이므로 $\overrightarrow{\mathrm{PD}}+\overrightarrow{\mathrm{PE}}=m\overrightarrow{\mathrm{PR}}$ ($m$은 0이 아닌 실수)로 쓸 수 있으므로 $\dfrac{\vec a+2\vec b}{3}+(k\vec a+l\vec b)=m\vec a$, 즉 $\left(\dfrac13+k-m\right)\vec a+\left(\dfrac23+l\right)\vec b=\vec 0$이 성립한다.
      source_flow: 문항해설·예시답안 p.25
      criteria:
      - 1-2.M2
    - id: 12b-3
      content: 두 벡터 $\vec a$와 $\vec b$가 서로 평행이 아니므로 위 식이 성립하려면 $\dfrac13+k-m=0,\ \dfrac23+l=0$이다. 즉, $k\ne-\dfrac13,\ l=-\dfrac23$이다.
      source_flow: 문항해설·예시답안 p.25
      criteria:
      - 1-2.A1
    - id: 12b-4
      content: ③ $k=\dfrac{121}{75}$을 보인다. $\overline{\mathrm{PD}}=\overline{\mathrm{PE}}$이므로 $\overrightarrow{\mathrm{PD}}=\dfrac{\vec a+2\vec b}{3}$와 $\overrightarrow{\mathrm{PE}}=k\vec a-\dfrac23\vec b$에 대해서 $\overrightarrow{\mathrm{PD}}\cdot\overrightarrow{\mathrm{PD}}=\overrightarrow{\mathrm{PE}}\cdot\overrightarrow{\mathrm{PE}}$가 성립한다. 따라서 $\dfrac19|\vec a|^2+\dfrac49|\vec b|^2+\dfrac49\vec a\cdot\vec b=k^2|\vec a|^2+\dfrac49|\vec b|^2-\dfrac43k\vec a\cdot\vec b$ $\cdots$(*)
      source_flow: 문항해설·예시답안 p.25
      criteria:
      - 1-2.M3
    - id: 12b-5
      content: '$|\vec a|=|\vec b|$이고 $\cos\theta=\dfrac{24}{25}$이므로 (이유: [문제 1-1] 풀이에서 계산) 식 (*)는 $225k^2-288k-121=0$, 즉 $(3k+1)(75k-121)=0$이다. 따라서 $k=\dfrac{121}{75}$ (이유: ②에서 $k\ne-\dfrac13$이므로)이다.'
      source_flow: 문항해설·예시답안 p.25
      criteria:
      - 1-2.A2
    - id: 12b-6
      content: $k+l=\dfrac{121}{75}-\dfrac23=\dfrac{71}{75}$이다.
      source_flow: 문항해설·예시답안 p.25
      criteria:
      - 1-2.A3
  - id: S12-ALT
    audience: ALT
    method_no: 2
    steps:
    - id: 12a-1
      content: 점들의 좌표를 구한다. $\mathrm{P}(25,24)$, $\mathrm{F}(7,0)$, $\mathrm{R}(1,6)$, $\mathrm{D}(5,2)$, $\mathrm{E}\left(-\dfrac{43}{25},\dfrac{274}{25}\right)$
      source_flow: 문항해설·예시답안 p.25(다른 풀이)
      criteria: []
