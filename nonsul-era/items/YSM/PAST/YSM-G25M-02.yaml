      mark_type: M
      points: 2
      evidence: 보조선 H, G, J를 긋고 사각형 HGJP가 직사각형이어서 $\overline{\mathrm{HG}}=\overline{\mathrm{PJ}}$임을 썼다.
      steps:
      - 21b-2
    - id: 2-1.A1
      mark_type: A
      points: 1
      evidence: $g(\theta)=R\theta$를 구했다.
      depends_on:
      - 2-1.M1
      steps:
      - 21b-3
    - id: 2-1.A2
      mark_type: A
      points: 2
      evidence: $f(\theta)=\overline{\mathrm{PQ}}=2t\sin\theta$와 $L(\theta)=\dfrac{2t\sin\theta}{R\theta}$를 썼다.
      depends_on:
      - 2-1.M2
      steps:
      - 21b-4
    - id: 2-1.M3
      mark_type: M
      points: 3
      evidence: $\overline{\mathrm{HG}}=(R-t\cos\theta)/\sqrt3$와 $\overline{\mathrm{PJ}}=\sqrt3(R-t)$를 구했다.
      steps:
      - 21b-5
    - id: 2-1.A3
      mark_type: A
      points: 2
      evidence: $t=\dfrac{2R}{3-\cos\theta}$와 $L(\theta)=\dfrac{4\sin\theta}{\theta(3-\cos\theta)}$를 구했다.
      depends_on:
      - 2-1.A2
      - 2-1.M3
      steps:
      - 21b-6
    - id: 2-1.A4
      mark_type: A
      points: 2
      evidence: $\lim\dfrac{\sin\theta}{\theta}=1$을 이용해 극한 $2$를 구했다.
      depends_on:
      - 2-1.A3
      steps:
      - 21b-7
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 2-2
  stem: |
    [문제 2-2] 제시문 (라)를 만족하는 구의 반지름은 $n$에 대한 함수로 나타낼 수 있다. 이때 구의 반지름을 최대로 하는 $n$의 값을 구하시오. (15점)
  points: 15
  depends_on: []
  answer:
    kind: value
    value: n=6; r=R*sin(pi/n)/(1+sin(pi/n))
    equivalents:
    - $n=6$ (구의 반지름 $r=\dfrac{R\sin(\pi/n)}{1+\sin(\pi/n)}$)
    tolerance: null
  solutions:
  - id: S22-B
    audience: B
    method_no: 1
    steps:
    - id: 22b-1
      content: 삼각형 OAB에서 $\overline{\mathrm{AC}}\perp\overline{\mathrm{OB}}$이고 $\overline{\mathrm{OC}}=\overline{\mathrm{BC}}$이므로 $\triangle\mathrm{OAB}$는 $\overline{\mathrm{AO}}=\overline{\mathrm{AB}}$인 이등변삼각형이다. 또한 원뿔에서 $\overline{\mathrm{OA}}=\overline{\mathrm{OB}}=l$이므로 $\triangle\mathrm{OAB}$는 정삼각형이다. 원뿔의 밑면을 이루는 원의 반지름의 길이를 $R$이라고 하자. $\triangle\mathrm{OAB}$는 정삼각형이므로 $\overline{\mathrm{AB}}=2R=l$이다.
      source_flow: 문항해설·예시답안 pp.29~30
      criteria:
      - 2-2.M1
    - id: 22b-2
      content: 모든 구의 중심을 지나는 평면은 원뿔의 밑면과 평행하다. 이 평면에 의해 원기둥이 잘린 단면은 원이다. 이 원을 $\mathrm{O}_1$이라 하자. 원 $\mathrm{O}_1$의 반지름은 $R$이다. 이 평면에 의해 구가 잘린 단면은 원이다. 이 원을 $\mathrm{O}_2$라 하자. 원 $\mathrm{O}_2$의 반지름을 $r$이라 하자. $n$개의 원 $\mathrm{O}_2$의 중심은 한 변의 길이가 $2r$인 정 $n$각형을 이룬다. 이 정 $n$각형의 중심과 각 꼭짓점을 이은 삼각형은 이등변삼각형이 되며, 원 $\mathrm{O}_2$의 중심이 되는 꼭짓점에서의 각도는 $2\pi/n$이다. 원 $\mathrm{O}_1$의 중심에서 원 $\mathrm{O}_2$에 접선을 긋자. 이 접선과 두 원 $\mathrm{O}_1$, $\mathrm{O}_2$의 중심을 이은 직선이 이루는 각을 $\theta_2$라 하자. $\theta_2=\pi/n$이다.
      source_flow: 문항해설·예시답안 pp.29~30
      criteria:
      - 2-2.M2
    - id: 22b-3
      content: 사잇각이 $\theta_2$인 직각삼각형에서 각 $\theta_2$의 대변의 길이가 $r$이므로 빗변의 길이는 $r/\sin\theta_2$이다. 원 $\mathrm{O}_1$의 반지름의 길이는 $R$이므로 $R=\dfrac{r}{\sin\theta_2}+r=\left(1+\dfrac{1}{\sin(\pi/n)}\right)r=\dfrac{1+\sin(\pi/n)}{\sin(\pi/n)}r\ \Rightarrow\ r=\dfrac{R\sin(\pi/n)}{1+\sin(\pi/n)}$이다.
      source_flow: 문항해설·예시답안 pp.29~30
      criteria:
      - 2-2.A1
    - id: 22b-4
      content: 원뿔과 원기둥에 모두 접하는 구가 평면 $\beta$ 아래에 있기 위한 조건을 구하자. 구와 원뿔의 교점, 구와 원기둥의 접점, 구의 중심을 지나는 평면을 $\gamma$라 하자. 주어진 입체도형을 평면 $\gamma$로 자른 단면을 고려하자. 구와 원뿔의 접점 V와 직선 OM에 수직인 직선이 원기둥의 옆면과 만나는 점을 Y라 하자. 구의 중심 U에서 직선 VY에 내린 수선의 발을 W라 하자. 직각삼각형 UVW에서 $\angle\mathrm{UVW}=\pi/6$, $\overline{\mathrm{UV}}=r$, $\angle\mathrm{UWV}=\pi/2$이므로 $\overline{\mathrm{VW}}=\sqrt3r/2$, $\overline{\mathrm{UW}}=r/2$이다. 직각삼각형 VXY에서 $\angle\mathrm{VXY}=\pi/6$, $\overline{\mathrm{VY}}=r+r\sqrt3/2$, $\angle\mathrm{XYV}=\pi/2$이므로 $\overline{\mathrm{XY}}=r\sqrt3(1+\sqrt3/2)$이다. 그러므로 $\overline{\mathrm{U_2W_2}}=\overline{\mathrm{U_2U}}+\overline{\mathrm{UW}}+\overline{\mathrm{WW_2}}=r+r/2+r\sqrt3(1+\sqrt3/2)=(3+\sqrt3)r$이다.
      source_flow: 문항해설·예시답안 pp.29~30
      criteria:
      - 2-2.M3
    - id: 22b-5
      content: 구가 평면 $\beta$와 만나지 않기 위해서는 $\overline{\mathrm{OM}}>\overline{\mathrm{U_2W_2}}$이어야 한다. $\sqrt3R=\overline{\mathrm{OM}}>\overline{\mathrm{U_2W_2}}=(3+\sqrt3)r=\dfrac{R(3+\sqrt3)\sin(\pi/n)}{1+\sin(\pi/n)}$
      source_flow: 문항해설·예시답안 pp.29~30
      criteria:
      - 2-2.M4
    - id: 22b-6
      content: '$\Leftrightarrow\ \sqrt3>\dfrac{(3+\sqrt3)\sin(\pi/n)}{1+\sin(\pi/n)}\ \Leftrightarrow\ \dfrac{\sqrt3}{3+\sqrt3}>\dfrac{\sin(\pi/n)}{1+\sin(\pi/n)}\ \Leftrightarrow\ \dfrac{3+\sqrt3}{\sqrt3}<\dfrac{1+\sin(\pi/n)}{\sin(\pi/n)}\ \Leftrightarrow\ \sqrt3+1<\dfrac{1}{\sin(\pi/n)}+1\ \Leftrightarrow\ \dfrac1{\sqrt3}>\sin(\pi/n)$이다. 제시문 (마)의 표에 의해서 $1/\sqrt3\approx0.5774$이고, $\sin(\pi/5)\approx0.5878$, $\sin(\pi/6)=0.5000$이므로 $n=6$이다. [보충: 반지름 $r$은 $n$이 커질수록 작아지므로 조건을 만족하는 가장 작은 $n$이 반지름을 최대로 한다.]'
      source_flow: 문항해설·예시답안 pp.29~30
      criteria:
      - 2-2.A2
