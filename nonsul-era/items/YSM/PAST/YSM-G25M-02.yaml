key_idea: $\triangle\mathrm{OAB}$가 정삼각형임을 찾고, 점 P에서 밑면·평면 ABC·밑면의 수선의 발을 이용한 삼수선 구성으로 $\overline{\mathrm{HG}}=\overline{\mathrm{PJ}}$를 세워 $\overline{\mathrm{PQ}}=2t\sin\theta$, $t=\dfrac{2R}{3-\cos\theta}$를 얻어 $L(\theta)=\dfrac{4\sin\theta}{\theta(3-\cos\theta)}$, 극한 2를 구한다. 2-2는 구의 중심을 지나는 평면의 단면에서 $r=\dfrac{R\sin(\pi/n)}{1+\sin(\pi/n)}$, 구가 평면 $\beta$와 만나지 않을 조건 $\sin\dfrac\pi n<\dfrac1{\sqrt3}$로 $n=6$을 정한다.
stuck: 원뿔 위 점 P에서 삼수선의 정리로 수직 관계를 세우고 직사각형 HGJP에서 $\overline{\mathrm{HG}}=\overline{\mathrm{PJ}}$로 $t$를 구하는 단계, 그리고 구·원뿔·원기둥의 접촉 조건을 구의 중심을 지나는 평면의 단면(정 $n$각형 배치)과 입체도형의 단면으로 나누어 $\overline{\mathrm{U_2W_2}}=(3+\sqrt3)r$를 얻는 단계.
