stem: |
  【문제 2】 아래의 제시문을 읽고 문항별로 풀이와 함께 답하시오. (30점)

  (가) 아래의 <그림 1>과 같이 모선의 길이가 $l$, 밑면인 원의 중심이 M인 원뿔이 있다. 원뿔의 밑면인 원의 둘레 위의 두 점 A, B를 잇는 선분 AB는 점 M을 지난다. 점 A를 지나고 직선 OB에 수직인 평면 $\alpha$가 선분 OB와 만나는 점을 C라 하자. 점 C는 선분 OB를 이등분한다. 평면 $\alpha$와 원뿔이 만나는 교선 위에 점 P가 있다. 직선 AC에 대한 점 P의 대칭점을 Q라 하자.

  (나) 아래의 <그림 2>와 같이 원기둥이 있다. 이 원기둥의 밑면의 반지름은 제시문 (가)의 원뿔의 밑면의 반지름과 같고, 이 원기둥의 높이는 제시문 (가)의 원뿔의 높이와 같다.

  (다) 아래의 <그림 3>과 같이 제시문 (나)의 원기둥 안에 제시문 (가)의 원뿔이 있다. 점 O를 포함하는 원기둥의 밑면을 포함하는 평면을 $\beta$라 하자.

  (라) 제시문 (다)에서 만든 도형에서 원뿔의 위쪽에 $n$개의 구가 있다. 모든 구는 평면 $\beta$와 만나지 않고, 모든 구의 중심은 한 평면 위에 있다. 모든 구는 양옆에 있는 구와 서로 한 점에서 만난다. 모든 구는 원뿔의 모선과 접하고, 원기둥과 한 점에서 만난다. (단, $n$은 짝수이다.)

  [그림 1: 꼭짓점 O, 모선의 길이 $l$인 원뿔. 밑면의 중심 M과 밑면 둘레 위의 점 A, B(선분 AB는 M을 지남). 점 A를 지나는 평면 $\alpha$(회색)가 선분 OB와 점 C에서 만나고, 평면 $\alpha$와 원뿔의 교선(빨간 곡선) 위에 점 P, 그 근처에 점 Q가 표시되어 있다.]

  [그림 2: 밑면이 아래에 점선으로 그려진 원기둥.]

  [그림 3: 원기둥 안에 원뿔이 들어 있고 꼭짓점 O를 포함하는 윗면을 포함한 평면 $\beta$(회색)가 그려져 있으며, 원뿔과 원기둥 사이의 오른쪽 위에 구 하나가 표시되어 있다.]

  (마) 자연수 $x=3,4,\ldots,10$에 대해서, $\sin(\pi/x)$와 $1/\sqrt{x}$의 근사값은 다음의 표와 같다.

  | $x$ | 3 | 4 | 5 | 6 | 7 | 8 | 9 | 10 |
  |---|---|---|---|---|---|---|---|---|
  | $\sin(\pi/x)$ | 0.8660 | 0.7071 | 0.5878 | 0.5000 | 0.4339 | 0.3827 | 0.3420 | 0.3090 |
  | $1/\sqrt{x}$ | 0.5774 | 0.5000 | 0.4472 | 0.4082 | 0.3780 | 0.3536 | 0.3333 | 0.3162 |
subparts:
- id: 2-1
  stem: |
    [문제 2-1] 제시문 (가)에서 직선 OP가 원뿔의 밑면과 만나는 점을 K, $\angle\mathrm{AMK}=\theta$, 선분 PQ의 길이를 $f(\theta)$, 호 AK의 길이를 $g(\theta)$라고 하자. 이때 $L(\theta)=\dfrac{f(\theta)}{g(\theta)}$와 극한 $\displaystyle\lim_{\theta\to0+}L(\theta)$을 각각 구하시오. (15점)
  points: 15
  depends_on: []
  answer:
    kind: value
    value: L=4*sin(theta)/(theta*(3-cos(theta))); lim=2
    equivalents:
    - $L(\theta)=\dfrac{4\sin\theta}{\theta(3-\cos\theta)}$, $\displaystyle\lim_{\theta\to0+}L(\theta)=2$
    tolerance: null
  solutions:
  - id: S21-B
    audience: B
    method_no: 1
    steps:
    - id: 21b-1
      content: 삼각형 OAB에서 $\overline{\mathrm{AC}}\perp\overline{\mathrm{OB}}$이고 $\overline{\mathrm{OC}}=\overline{\mathrm{BC}}$이므로 $\triangle\mathrm{OAB}$는 $\overline{\mathrm{AO}}=\overline{\mathrm{AB}}$인 이등변삼각형이다. 또한 원뿔에서 $\overline{\mathrm{OA}}=\overline{\mathrm{OB}}=l$이므로 $\triangle\mathrm{OAB}$는 정삼각형이다. 원뿔의 밑면을 이루는 원의 반지름의 길이를 $R$이라고 하자. $\triangle\mathrm{OAB}$는 정삼각형이므로 $\overline{\mathrm{AB}}=2R=l$이고 $\angle\mathrm{CAB}=\pi/6$이다.
      source_flow: 문항해설·예시답안 pp.27~29
      criteria:
      - 2-1.M1
    - id: 21b-2
      content: 다음과 같이 보조선을 긋는다. (1) 점 P에서 삼각형 ABC가 만드는 평면에 내린 수선의 발 H (2) 점 H에서 원뿔의 밑면에 내린 수선의 발 G (3) 점 P에서 원뿔의 밑면에 내린 수선의 발 J. (1)에 의해 $\overline{\mathrm{PH}}\perp\overline{\mathrm{HA}}$, (1)과 (2)에 의해 $\overline{\mathrm{PH}}\perp\overline{\mathrm{HG}}$, (2)에 의해 $\overline{\mathrm{HG}}\perp\overline{\mathrm{GJ}}$, (3)에 의해 $\overline{\mathrm{PJ}}\perp\overline{\mathrm{JM}}$, $\overline{\mathrm{PJ}}\perp\overline{\mathrm{JG}}$이다. 사각형 HGJP에서 $\overline{\mathrm{PH}}\perp\overline{\mathrm{HG}}$, $\overline{\mathrm{HG}}\perp\overline{\mathrm{GJ}}$, $\overline{\mathrm{PJ}}\perp\overline{\mathrm{JG}}$이므로 $\overline{\mathrm{HP}}\perp\overline{\mathrm{PJ}}$이다. 그러므로 사각형 HGJP는 직사각형이고, $\overline{\mathrm{HG}}=\overline{\mathrm{PJ}}$이다.
      source_flow: 문항해설·예시답안 pp.27~29
      criteria:
      - 2-1.M2
    - id: 21b-3
      content: 삼각형 GMJ에서 $\angle\mathrm{AMK}=\theta$, $\overline{\mathrm{MJ}}=t$라고 하자. 호 AK에서 중심각의 크기가 $\angle\mathrm{AMK}=\theta$이고 반지름의 길이가 $\overline{\mathrm{AM}}=R=l/2$이므로 $g(\theta)=R\theta$이다.
      source_flow: 문항해설·예시답안 pp.27~29
      criteria:
      - 2-1.A1
    - id: 21b-4
      content: 직각삼각형 MGJ에서 $\angle\mathrm{GMJ}=\theta$, $\overline{\mathrm{MJ}}=t$, $\angle\mathrm{MGJ}=\pi/2$이므로 $\overline{\mathrm{JG}}=t\sin\theta$이다. 직사각형 HGJP에서 $\overline{\mathrm{JG}}=\overline{\mathrm{PH}}$이므로 $\overline{\mathrm{JG}}=\overline{\mathrm{PH}}=t\sin\theta$이다. 점 Q는 점 P의 직선 AC에 대한 대칭점이고 점 H는 점 P의 선분 AC 위로의 수선의 발이므로 $\overline{\mathrm{PQ}}=2\overline{\mathrm{PH}}=2t\sin\theta$이다. 그러므로 $L(\theta)=\dfrac{f(\theta)}{g(\theta)}=\dfrac{2t\sin\theta}{R\theta}$이다.
      source_flow: 문항해설·예시답안 pp.27~29
      criteria:
      - 2-1.A2
    - id: 21b-5
      content: 직각삼각형 MGJ에서 $\overline{\mathrm{GM}}=t\cos\theta$, $\overline{\mathrm{MJ}}=t$, 반지름 $\overline{\mathrm{MA}}=\overline{\mathrm{MK}}=R$이므로 $\overline{\mathrm{GA}}=R-t\cos\theta$, $\overline{\mathrm{JK}}=R-t$이다. 직각삼각형 AGH에서 $\overline{\mathrm{AG}}=R-t\cos\theta$, $\angle\mathrm{AGH}=\pi/2$이므로 $\overline{\mathrm{HG}}=(R-t\cos\theta)/\sqrt3$이다. 직각삼각형 KJP에서 $\overline{\mathrm{KJ}}=R-t$, $\angle\mathrm{KJP}=\pi/2$이므로 $\overline{\mathrm{PJ}}=\sqrt3(R-t)$이다.
      source_flow: 문항해설·예시답안 pp.27~29
      criteria:
      - 2-1.M3
    - id: 21b-6
      content: 직사각형 HGJP에서 $\overline{\mathrm{HG}}=(R-t\cos\theta)/\sqrt3=\overline{\mathrm{PJ}}=\sqrt3(R-t)$ $\Rightarrow$ $t=\dfrac{2R}{3-\cos\theta}$이다. 그러므로 $L(\theta)=\dfrac{2t\sin\theta}{R\theta}=\dfrac{4\sin\theta}{\theta(3-\cos\theta)}$이다.
      source_flow: 문항해설·예시답안 pp.27~29
      criteria:
      - 2-1.A3
    - id: 21b-7
      content: $\displaystyle\lim_{\theta\to0+}L(\theta)=\lim_{\theta\to0+}\dfrac{4\sin\theta}{\theta(3-\cos\theta)}=\lim_{\theta\to0+}\dfrac{\sin\theta}{\theta}\dfrac{4}{3-\cos\theta}=2$이다.
      source_flow: 문항해설·예시답안 pp.27~29
      criteria:
      - 2-1.A4
