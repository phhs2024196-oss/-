key_idea: 조각별 함수 $f$가 $x=2$에서 미분가능하려면 연속이고 좌·우미분계수가 같아야 하므로 $ae^{2b}=1$, $2=ae^{2b}(1+2b)$에서 $a=\dfrac1e$, $b=\dfrac12$를 얻고, $g(x)=|(x-1)(x-3)|-5$를 $x=1,3$에서 구간별로 나눈 뒤 $xe^{(x-2)/2}$는 부분적분하여 $f$와 $g$ 사이 넓이 $4e+16$을 구한다.
stuck: $x=2$에서 $axe^{bx}$의 우미분계수를 $\lim_{h\to0+}\dfrac{e^{bh}-1}{h}=b$로 계산하는 단계, 그리고 절댓값 함수 $g$를 $x<1$, $1<x<3$, $x>3$으로 나누고 $f$의 정의 구간(2에서 바뀜)과 겹쳐 적분구간을 4개로 나누는 단계.
