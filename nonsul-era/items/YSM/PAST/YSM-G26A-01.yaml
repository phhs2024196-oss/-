stimuli: []
stem: |
  【문제 1】 아래의 제시문을 읽고 문항별로 풀이와 함께 답하시오. (30점)

  두 개의 함수 $f(x)$, $g(x)$를 다음과 같이 정의한다.

  (가) $f(x)=\begin{cases}2x-2&(0\le x<2)\\axe^{bx}&(2\le x\le4)\end{cases}$

  (나) $g(x)=|(x-1)(x-3)|-5\quad(0\le x\le4)$

  (다) $a,b$는 상수이다.
subparts:
- id: 1-1
  stem: |
    [문제 1-1] 함수 $f(x)$가 구간 $(0,4)$에서 미분가능할 때 $a$, $b$를 구하시오. (10점)
  points: 10
  depends_on: []
  answer:
    kind: value
    value: a=exp(-1); b=1/2
    equivalents:
    - $a=\dfrac1e$, $b=\dfrac12$
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: 구간 $(0,4)$에서 미분가능하려면 $x=2$에서 연속이어야 한다. $2\times2-2=a\times2\times e^{2b}$, $1=ae^{2b}$
      source_flow: 문항해설·예시답안 pp.14~16
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: $x=2$에서 좌미분계수는 $\displaystyle\lim_{h\to0-}\dfrac{f(2+h)-f(2)}{h}=\lim_{h\to0-}\dfrac{(2\times(2+h)-2)-(2\times2-2)}{h}=\lim_{h\to0-}\dfrac{2h}{h}=2$
      source_flow: 문항해설·예시답안 pp.14~16
      criteria:
      - 1-1.M2
    - id: 11b-3
      content: 우미분계수는 $\displaystyle\lim_{h\to0+}\dfrac{f(2+h)-f(2)}{h}=\lim_{h\to0+}\dfrac{a(2+h)e^{b(2+h)}-a(2)e^{b(2)}}{h}=\lim_{h\to0+}\dfrac{2ae^{b(2+h)}+ahe^{b(2+h)}-2ae^{2b}}{h}=\lim_{h\to0+}\dfrac{2ae^{2b}(e^{bh}-1)+ahe^{2b}e^{bh}}{h}=2ae^{2b}\lim_{h\to0+}\dfrac{e^{bh}-1}{h}+\lim_{h\to0+}ae^{2b}e^{bh}=2abe^{2b}+ae^{2b}$ $\left(\because\displaystyle\lim_{h\to0+}\dfrac{e^{bh}-1}{bh}b=b\right)$이다.
      source_flow: 문항해설·예시답안 pp.14~16
      criteria:
      - 1-1.M3
    - id: 11b-4
      content: 구간 $(0,4)$에서 미분가능하려면 좌미분계수와 우미분계수가 같아야 하므로 $2=ae^{2b}+2abe^{2b}$이다. $a$, $b$값을 구하면 $2=1(1+2b)$이므로 $b=\dfrac12$, $1=ae^{2\times\frac12}$이므로 $a=\dfrac1e$이다.
      source_flow: 문항해설·예시답안 pp.14~16
      criteria:
      - 1-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 2
      evidence: $x=2$에서의 연속 조건 $1=ae^{2b}$를 세웠다.
      steps:
      - 11b-1
    - id: 1-1.M2
      mark_type: M
      points: 2
      evidence: 좌미분계수 $2$를 구했다.
      steps:
      - 11b-2
    - id: 1-1.M3
      mark_type: M
      points: 3
      evidence: 우미분계수 $2abe^{2b}+ae^{2b}$를 구했다($\lim\dfrac{e^{bh}-1}{h}=b$ 이용).
      steps:
      - 11b-3
    - id: 1-1.A1
      mark_type: A
      points: 3
      evidence: $b=\dfrac12$, $a=\dfrac1e$를 구했다.
      depends_on:
      - 1-1.M1
      - 1-1.M2
      - 1-1.M3
      steps:
      - 11b-4
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 1-2
  stem: |
    [문제 1-2] (문제 1-1)에서 구한 $a$, $b$에 대하여 두 함수 $y=f(x)$, $y=g(x)$의 그래프와 직선 $x=4$로 둘러싸인 도형의 넓이를 구하시오. (20점)
  points: 20
  depends_on:
  - 1-1
  answer:
    kind: expression
    value: 4*E+16
    equivalents:
    - $4e+16$
    tolerance: null
  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: $x<1$, $x>3$인 경우, $g(x)=(x-1)(x-3)-5$이므로 $g(x)=x^2-4x+3-5=x^2-4x-2$, $1<x<3$인 경우, $g(x)=-(x-1)(x-3)-5$이므로 $g(x)=-x^2+4x-3-5=-x^2+4x-8$이다.
      source_flow: 문항해설·예시답안 pp.14~17
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: 적분구간을 4개로 나누어 표현하면 $\displaystyle\int_0^4(f(x)-g(x))dx=\int_0^1((2x-2)-(x^2-4x-2))dx+\int_1^2((2x-2)-(-x^2+4x-8))dx+\int_2^3\left(\left(xe^{\frac12(x-2)}\right)-(-x^2+4x-8)\right)dx+\int_3^4\left(\left(xe^{\frac12(x-2)}\right)-(x^2-4x-2)\right)dx$
      source_flow: 문항해설·예시답안 pp.14~17
      criteria:
      - 1-2.M2
    - id: 12b-3
      content: $=\displaystyle\int_0^1(-x^2+6x)dx+\int_1^2(x^2-2x+6)dx+\int_2^3\left(\left(xe^{\frac12(x-2)}\right)+x^2-4x+8\right)dx+\int_3^4\left(\left(xe^{\frac12(x-2)}\right)-x^2+4x+2\right)dx$
      source_flow: 문항해설·예시답안 pp.14~17
      criteria:
      - 1-2.A1
    - id: 12b-4
      content: $=\left[-\dfrac{x^3}{3}+3x^2\right]_0^1+\left[\dfrac{x^3}{3}-x^2+6x\right]_1^2+\left[2xe^{\frac12(x-2)}\right]_2^3-\displaystyle\int_2^32e^{\frac12(x-2)}dx+\left[\dfrac{x^3}{3}-2x^2+8x\right]_2^3+\left[2xe^{\frac12(x-2)}\right]_3^4-\int_3^42e^{\frac12(x-2)}dx+\left[-\dfrac{x^3}{3}+2x^2+2x\right]_3^4$ (부분적분)이고 $\displaystyle\int2e^{\frac12(x-2)}dx=4e^{\frac12(x-2)}$이므로 $-\left[4e^{\frac12(x-2)}\right]_2^3$, $-\left[4e^{\frac12(x-2)}\right]_3^4$가 된다.
      source_flow: 문항해설·예시답안 pp.14~17
      criteria:
      - 1-2.M3
    - id: 12b-5
      content: $=\left(-\dfrac13+3\right)+\left(\dfrac83-4+12-\left(\dfrac13-1+6\right)\right)+\left(6e^{0.5}-4-(4e^{0.5}-4)+\dfrac{27}{3}-18+24-\left(\dfrac83-8+16\right)\right)+\left(8e-6e^{0.5}-(4e-4e^{0.5})-\dfrac{64}{3}+32+8-\left(-\dfrac{27}{3}+18+6\right)\right)$
      source_flow: 문항해설·예시답안 pp.14~17
      criteria:
      - 1-2.A2
    - id: 12b-6
      content: $=4e+16$
      source_flow: 문항해설·예시답안 pp.14~17
      criteria:
      - 1-2.A3
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-2.M1
      mark_type: M
      points: 3
      evidence: $g(x)$를 구간별로 $x^2-4x-2$, $-x^2+4x-8$로 나타냈다.
      steps:
      - 12b-1
    - id: 1-2.M2
      mark_type: M
      points: 4
      evidence: 구간 $[0,1],[1,2],[2,3],[3,4]$로 나눈 $\int(f-g)dx$ 식을 세웠다.
      steps:
      - 12b-2
    - id: 1-2.A1
      mark_type: A
      points: 3
      evidence: 피적분함수를 정리한 식을 얻었다.
      depends_on:
      - 1-2.M2
      steps:
      - 12b-3
    - id: 1-2.M3
      mark_type: M
      points: 3
      evidence: $xe^{\frac12(x-2)}$를 부분적분해 $2xe^{\frac12(x-2)}-4e^{\frac12(x-2)}$로 적분했다.
      steps:
      - 12b-4
    - id: 1-2.A2
      mark_type: A
      points: 3
      evidence: 구간별 정적분 값을 대입해 계산했다.
      depends_on:
      - 1-2.A1
      - 1-2.M3
      steps:
      - 12b-5
    - id: 1-2.A3
      mark_type: A
      points: 4
      evidence: 넓이 $4e+16$을 구했다.
      depends_on:
      - 1-2.A2
      steps:
      - 12b-6
