stimuli: []
stem: |
  【문제 2】 아래의 제시문을 읽고 문항별로 풀이와 함께 답하시오. (45점)

  (가) 점 $\mathrm{A}_1(a_1,0)$을 지나고 $x$축에 수직인 직선이 곡선 $f(x)=e^{cx}$ $(c>0)$과 만나는 점을 $\mathrm{B}_1$이라고 하고, 이 곡선 위의 점 $\mathrm{B}_1$에서의 접선이 $x$축과 만나는 점을 $\mathrm{A}_2(a_2,0)$라고 하자.

  (나) 다음 그림과 같이, 모든 자연수 $n$에 대하여, 점 $\mathrm{A}_n(a_n,0)$을 지나고 $x$축에 수직인 직선이 곡선 $f(x)=e^{cx}$ $(c>0)$와 만나는 점을 $\mathrm{B}_n(a_n,f(a_n))$이라고 하고, 이 곡선 위의 점 $\mathrm{B}_n$에서의 접선이 $x$축과 만나는 점을 $\mathrm{A}_{n+1}(a_{n+1},0)$이라고 하자.

  (다) 자연수 $N>1$에 대하여 $a_1=N$이다.

  (라) $S_n$은 삼각형 $\mathrm{A}_n\mathrm{B}_n\mathrm{A}_{n+1}$의 넓이이다.

  [그림: $xy$평면에서 곡선 $f(x)=e^{cx}$가 $x$가 커질수록 가파르게 증가한다. 곡선 위의 점 $\mathrm{B}_n(a_n,f(a_n))$에서의 접선 $y=f'(a_n)(x-a_n)+f(a_n)$이 $x$축과 만나는 점 $\mathrm{A}_{n+1}(a_{n+1},0)$이 $\mathrm{A}_n(a_n,0)$의 왼쪽에 있다. $\mathrm{A}_n$에서 $x$축에 수직인 선분이 $\mathrm{B}_n$까지 그려져 직각 표시가 있고, 삼각형 $\mathrm{A}_{n+1}\mathrm{A}_n\mathrm{B}_n$ 안쪽에 $S_n$이라 쓰고 빗금이 있다.]
subparts:
- id: 2-1
  stem: |
    (문제 2-1) $S_1$을 구하시오. (10점)
  points: 10
  depends_on: []
  answer:
    kind: expression
    value: exp(c*N)/(2*c)
    equivalents:
    - $S_1=\dfrac{e^{cN}}{2c}$
    tolerance: null
  solutions:
  - id: S21-B
    audience: B
    method_no: 1
    steps:
    - id: 21b-1
      content: 제시문으로부터 $f(x)=e^{cx}$이므로 $f'(x)=ce^{cx}$이다. $\mathrm{A}_n(a_n,0)$에서 접선의 방정식은 $y=f'(a_n)(x-a_n)+f(a_n)$이다. 이 함수의 $x$절편은 $0=f'(a_n)(a_{n+1}-a_n)+f(a_n)$로부터 $a_{n+1}=a_n-\dfrac{f(a_n)}{f'(a_n)}$이다.
      source_flow: 문항해설·예시답안 pp.19~21
      criteria:
      - 2-1.M1
    - id: 21b-2
      content: 따라서 $a_2=a_1-\dfrac{f(a_1)}{f'(a_1)}=N-\dfrac{e^{cN}}{ce^{cN}}=N-\dfrac1c$이다.
      source_flow: 문항해설·예시답안 pp.19~21
      criteria:
      - 2-1.A1
    - id: 21b-3
      content: 삼각형 $\mathrm{A}_1\mathrm{B}_1\mathrm{A}_2$의 밑변의 길이는 $|a_2-a_1|=\left|N-\dfrac1c-N\right|=\dfrac1c$이고, 높이는 $f(a_1)=f(N)=e^{cN}$이므로
      source_flow: 문항해설·예시답안 pp.19~21
      criteria:
      - 2-1.M2
    - id: 21b-4
      content: $\mathrm{A}_1\mathrm{B}_1\mathrm{A}_2$의 넓이($S_1$)는 $\dfrac12\dfrac1ce^{cN}=\dfrac{e^{cN}}{2c}$이다.
      source_flow: 문항해설·예시답안 pp.19~21
      criteria:
      - 2-1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2-1.M1
      mark_type: M
      points: 3
      evidence: $f'(x)=ce^{cx}$와 접선의 $x$절편 $a_{n+1}=a_n-\dfrac{f(a_n)}{f'(a_n)}$을 구했다.
      steps:
      - 21b-1
    - id: 2-1.A1
      mark_type: A
      points: 2
      evidence: $a_2=N-\dfrac1c$를 구했다.
      depends_on:
      - 2-1.M1
      steps:
      - 21b-2
    - id: 2-1.M2
      mark_type: M
      points: 2
      evidence: 밑변 $\dfrac1c$, 높이 $e^{cN}$을 구했다.
      depends_on:
      - 2-1.M1
      steps:
      - 21b-3
    - id: 2-1.A2
      mark_type: A
      points: 3
      evidence: $S_1=\dfrac{e^{cN}}{2c}$를 구했다.
      depends_on:
      - 2-1.M2
      steps:
      - 21b-4
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 2-2
  stem: |
    (문제 2-2) $S_n$을 구하시오. (10점)
  points: 10
  depends_on:
  - 2-1
  answer:
    kind: expression
    value: exp(c*N-n+1)/(2*c)
    equivalents:
    - $S_n=\dfrac{e^{cN-(n-1)}}{2c}$
    tolerance: null
  solutions:
  - id: S22-B
    audience: B
    method_no: 1
    steps:
    - id: 22b-1
      content: $a_2=N-\dfrac1c$, $f(a_2)=f\left(N-\dfrac1c\right)=e^{c\left(N-\frac1c\right)}$, $a_3=a_2-\dfrac{f(a_2)}{f'(a_2)}=\left(N-\dfrac1c\right)-\dfrac{e^{c\left(N-\frac1c\right)}}{ce^{c\left(N-\frac1c\right)}}=N-\dfrac1c-\dfrac1c=N-\dfrac2c$, $f(a_3)=f\left(N-\dfrac2c\right)=e^{c\left(N-\frac2c\right)}$, $a_4=a_3-\dfrac{f(a_3)}{f'(a_3)}=N-\dfrac2c-\dfrac1c=N-\dfrac3c$, $f(a_4)=f\left(N-\dfrac3c\right)=e^{c\left(N-\frac3c\right)}$ $\cdots$
      source_flow: 문항해설·예시답안 pp.19~21
      criteria:
      - 2-2.M1
    - id: 22b-2
      content: $a_{n+1}=a_n-\dfrac{f(a_n)}{f'(a_n)}=\left(N-\dfrac{n-1}{c}\right)-\dfrac{e^{c\left(N-\frac{n-1}{c}\right)}}{ce^{c\left(N-\frac{n-1}{c}\right)}}=N-\dfrac{n-1}{c}-\dfrac1c=N-\dfrac nc$, $a_{n+1}=\left(N-\dfrac nc\right)$, $a_n=\left(N-\dfrac{n-1}{c}\right)$
      source_flow: 문항해설·예시답안 pp.19~21
      criteria:
      - 2-2.A1
    - id: 22b-3
      content: 삼각형 밑변의 길이는 $|a_{n+1}-a_n|=\left|\left(N-\dfrac nc\right)-\left(N-\dfrac{n-1}{c}\right)\right|=\dfrac1c$, 높이는 $f(a_n)=e^{c\left(N-\frac{n-1}{c}\right)}$
      source_flow: 문항해설·예시답안 pp.19~21
      criteria:
      - 2-2.M2
    - id: 22b-4
      content: 삼각형의 넓이는 $S_n=\dfrac12|a_{n+1}-a_n|f(a_n)=\dfrac12\dfrac1ce^{c\left(N-\frac{n-1}{c}\right)}=\dfrac{e^{cN-n+1}}{2c}$이다.
      source_flow: 문항해설·예시답안 pp.19~21
      criteria:
      - 2-2.A2
