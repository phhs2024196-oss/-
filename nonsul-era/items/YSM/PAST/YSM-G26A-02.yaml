    - id: 2-4.M2
      mark_type: M
      points: 4
      evidence: $f(a_{n+1})=\dfrac1ef(a_n)$과 $f(a_{N+1})=1$을 이용해 항을 하나씩 구했다.
      depends_on:
      - 2-4.M1
      steps:
      - 24b-2
    - id: 2-4.A1
      mark_type: A
      points: 4
      evidence: $f(a_{N+2})\approx0.370$, $f(a_{N+3})\approx0.137$이 모두 $0.1$보다 큼을 보였다.
      depends_on:
      - 2-4.M2
      steps:
      - 24b-3
    - id: 2-4.A2
      mark_type: A
