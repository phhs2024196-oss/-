key_idea: 곡선 $y=e^{cx}$ 위의 $\mathrm{B}_n$에서의 접선의 $x$절편은 $a_{n+1}=a_n-\dfrac{f(a_n)}{f'(a_n)}=a_n-\dfrac1c$이므로 $a_n=N-\dfrac{n-1}{c}$이고, $S_n=\dfrac12\cdot\dfrac1c\cdot e^{ca_n}=\dfrac{e^{cN-n+1}}{2c}$이며 공비 $e^{-1}$인 등비급수로 합을 구하고, $c=1$에서 $f(a_n)=e^{N-n+1}$이 매 항 $\dfrac1e$배가 됨을 이용해 $0.1$ 미만이 되는 최소의 $n$을 찾는다.
stuck: 접선의 $x$절편에서 점화식 $a_{n+1}=a_n-\dfrac{f(a_n)}{f'(a_n)}$을 세우고 $a_n=N-\dfrac{n-1}{c}$로 항 번호를 맞추는 단계, 그리고 $f(a_{N+1})=1$에서 시작해 $e=2.7$로 어림하며 $0.1$과 비교해 $N+4$를 정하는 단계.
