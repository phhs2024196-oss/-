    - id: 2-3.A1
      mark_type: A
      points: 3
      evidence: 등비급수의 합 $\dfrac{e^{-1}}{1-e^{-1}}$를 이용해 $\dfrac{e^{cN+1}}{2c(e-1)}$을 구했다.
      depends_on:
      - 2-3.M1
      steps:
      - 23b-2
