- id: 2-3
  stem: |
    (문제 2-3) $\displaystyle\sum_{n=1}^{\infty}S_n$을 구하시오. (5점)
  points: 5
  depends_on:
  - 2-2
  answer:
    kind: expression
    value: exp(c*N+1)/(2*c*(exp(1)-1))
    equivalents:
    - $\dfrac{e^{cN+1}}{2c(e-1)}$
    tolerance: null
  solutions:
  - id: S23-B
    audience: B
    method_no: 1
    steps:
    - id: 23b-1
      content: 넓이의 합 $\displaystyle\sum_{n=1}^\infty S_n=\sum_{n=1}^\infty\dfrac{e^{cN-n+1}}{2c}=\dfrac{e^{cN+1}}{2c}\sum_{n=1}^\infty e^{-n}$
      source_flow: 문항해설·예시답안 pp.20~21
      criteria:
      - 2-3.M1
    - id: 23b-2
      content: $\displaystyle\sum_{n=1}^\infty e^{-n}$은 첫 번째 항이 $e^{-1}$이고, 공비가 $e^{-1}$인 등비수열의 합이므로 $\displaystyle\sum_{n=1}^\infty e^{-n}=\dfrac{e^{-1}}{1-e^{-1}}$이다. 등비수열의 합을 이용해 면적의 합을 구하면 $\displaystyle\sum_{n=1}^\infty S_n=\dfrac{e^{cN+1}}{2c}\sum_{n=1}^\infty e^{-n}=\dfrac{e^{cN+1}}{2c}\dfrac{e^{-1}}{1-e^{-1}}=\dfrac{e^{cN+1}}{2c(e-1)}$
      source_flow: 문항해설·예시답안 pp.20~21
      criteria:
      - 2-3.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
