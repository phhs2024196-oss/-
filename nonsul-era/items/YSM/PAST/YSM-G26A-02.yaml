      evidence: 밑변 $\dfrac1c$, 높이 $e^{c\left(N-\frac{n-1}{c}\right)}$를 구했다.
      depends_on:
      - 2-2.A1
      steps:
      - 22b-3
    - id: 2-2.A2
      mark_type: A
      points: 2
      evidence: $S_n=\dfrac{e^{cN-n+1}}{2c}$를 구했다.
      depends_on:
      - 2-2.M2
      steps:
      - 22b-4
