- id: 2-4
  stem: |
    (문제 2-4) $c=1$인 경우, $f(a_n)<0.1$인 자연수 $n$의 최솟값을 $N$에 관한 식으로 표현하시오. (20점) (단, 자연상수 $e$는 2.7로 계산한다.)
  points: 20
  depends_on:
  - 2-2
  answer:
    kind: expression
    value: N+4
    equivalents:
    - $N+4$
    tolerance: null
  solutions:
  - id: S24-B
    audience: B
    method_no: 1
    steps:
    - id: 24b-1
      content: $f(a_n)=e^{c\left(N-\frac{n-1}{c}\right)}$에서 $c=1$이면 $f(a_n)=e^{(N-n+1)}$이고, $f(a_{n+1})=e^{(N-(n+1)+1)}=e^{(N-n)}$이다.
      source_flow: 문항해설·예시답안 pp.20~22
      criteria:
      - 2-4.M1
    - id: 24b-2
      content: 이때 $n=N+1$이면 $f(a_{N+1})=e^{(N-(N+1)+1)}=e^0=1$이다. $\dfrac{f(a_{n+1})}{f(a_n)}=\dfrac{e^{(N-n)}}{e^{(N-n+1)}}=\dfrac1e$이므로 $f(a_{n+1})=\dfrac1ef(a_n)$이다. 따라서 $\dfrac{f(a_{N+2})}{f(a_{N+1})}=\dfrac1e$이고, $f(a_{N+2})=\dfrac1ef(a_{N+1})=\dfrac1e$이다.
      source_flow: 문항해설·예시답안 pp.20~22
      criteria:
      - 2-4.M2
    - id: 24b-3
      content: $f(a_{N+2})=\dfrac1ef(a_{N+1})=\dfrac1e\approx\dfrac1{2.7}\approx.370\ (>0.1)$, $f(a_{N+3})=\dfrac1ef(a_{N+2})=\dfrac1e\dfrac1ef(a_{N+1})=\dfrac1{e^2}\approx\dfrac1{2.7^2}\approx0.137\ (>0.1)$
      source_flow: 문항해설·예시답안 pp.20~22
      criteria:
      - 2-4.A1
    - id: 24b-4
      content: $f(a_{N+4})=\dfrac1{e^3}\approx\dfrac1{2.7^3}=0.051\ (<0.1)$
      source_flow: 문항해설·예시답안 pp.20~22
      criteria:
      - 2-4.A2
    - id: 24b-5
      content: $n$이 증가할수록 $f(a_n)$은 점점 작아지므로 $f(a_n)<0.1$인 자연수 $n$의 최솟값은 $N+4$이다.
      source_flow: 문항해설·예시답안 pp.20~22
      criteria:
      - 2-4.A3
  rubric:
    rules:
      ft_scope: cross_subpart_only
