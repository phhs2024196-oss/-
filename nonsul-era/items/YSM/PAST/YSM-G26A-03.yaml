key_idea: 삼차방정식이 세 실근을 가질 조건은 극댓값 $\ge0\ge$ 극솟값이므로 $f(3)=54-k\ge0$, $f(5)=50-k\le0$에서 $50\le k\le54$이고, 근과 계수의 관계 $a+b+c=12$, $ab+bc+ca=45$를 만족하는 양의 정수 근은 $(2,5,5)$, $(3,3,6)$뿐($k=abc=50,54$)이며, 삼각형을 이루는 $(2,5,5)$에서 코사인법칙으로 $ab\cos C+bc\cos A+ca\cos B=\dfrac{a^2+b^2+c^2}2=27$을 얻는다.
stuck: 세 실근 조건을 극댓값·극솟값의 부호 조건 $f(3)\ge0\ge f(5)$로 바꾸는 단계(등호 포함), 그리고 $a+b+c=12$, $ab+bc+ca=45$를 만족하는 양의 정수 순서쌍을 빠짐없이 찾고 삼각형 부등식으로 $(3,3,6)$을 제외하는 단계.
