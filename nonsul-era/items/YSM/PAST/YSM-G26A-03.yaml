stimuli: []
stem: |
  【문제 3】 아래의 제시문을 읽고 문항별로 풀이와 함께 답하시오. (25점)

  (가) 삼차방정식 $x^3-12x^2+45x-k=0$의 세 근을 $a$, $b$, $c$라고 하자. (단, $k$는 실수이다.)
subparts:
- id: 3-1
  stem: |
    (문제 3-1) 제시문 (가)의 세 근 $a$, $b$, $c$를 모두 실수가 되게 하는 $k$값의 범위를 구하시오. (10점)
  points: 10
  depends_on: []
  answer:
    kind: value
    value: k_lo=50; k_hi=54
    equivalents:
    - $50\le k\le54$
    tolerance: null
  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: $x^3-12x^2+45x-k=0$ 방정식의 실수해 3개가 존재하기 위해서는 함수 $f(x)=x^3-12x^2+45x-k$의 극댓값이 0보다 크거나 같고, 극솟값이 0보다 작거나 같아야 한다.
      source_flow: 문항해설·예시답안 pp.24~25
      criteria:
      - 3-1.M1
    - id: 31b-2
      content: 극댓값 극솟값을 구하기 위해서 $f(x)$를 미분하면, $f'(x)=3x^2-24x+45=3(x-3)(x-5)$이므로 $x=3,x=5$에서 극값을 갖는다.
      source_flow: 문항해설·예시답안 pp.24~25
      criteria:
      - 3-1.M2
    - id: 31b-3
      content: 다시 한 번 미분하면 $f''(x)=6x-24$이고, $x=3$이면 $6\times3-24=-6<0$이므로 극댓값, $x=5$이면 $6\times5-24=6>0$이므로 극솟값을 갖는다.
      source_flow: 문항해설·예시답안 pp.24~25
      criteria:
      - 3-1.A1
    - id: 31b-4
      content: 따라서, $f(3)=27-108+135-k=54-k\ge0$, $f(5)=125-300+225-k=50-k\le0$이고, $50\le k\le54$이다.
      source_flow: 문항해설·예시답안 pp.24~25
      criteria:
      - 3-1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3-1.M1
      mark_type: M
      points: 3
      evidence: 세 실근 조건을 "극댓값 $\ge0\ge$ 극솟값"으로 나타냈다.
      steps:
      - 31b-1
    - id: 3-1.M2
      mark_type: M
      points: 2
      evidence: $f'(x)=3(x-3)(x-5)$와 $x=3,5$를 구했다.
      steps:
      - 31b-2
    - id: 3-1.A1
      mark_type: A
      points: 2
      evidence: 이계도함수로 $x=3$ 극대, $x=5$ 극소임을 확인했다.
      depends_on:
      - 3-1.M2
      steps:
      - 31b-3
    - id: 3-1.A2
      mark_type: A
      points: 3
      evidence: $f(3)\ge0$, $f(5)\le0$에서 $50\le k\le54$를 구했다.
      depends_on:
      - 3-1.M1
      - 3-1.A1
      steps:
      - 31b-4
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 3-2
  stem: |
    (문제 3-2) 제시문 (가)의 세 근 $a$, $b$, $c$가 모두 양의 정수일 때, $k$값을 모두 구하시오. (5점)
  points: 5
  depends_on:
  - 3-1
  answer:
    kind: value
    value: k1=50; k2=54
    equivalents:
    - $k=50,\ 54$
    tolerance: null
  solutions:
  - id: S32-B
    audience: B
    method_no: 1
    steps:
    - id: 32b-1
      content: $x^3-12x^2+45x-k=0$과 $a,b,c$ 근으로 갖는 삼차방정식 $(x-a)(x-b)(x-c)=0$을 전개한 $x^3-(a+b+c)x^2+(ab+bc+ca)x-abc=0$를 비교하면 $a+b+c=12$ (1), $ab+bc+ca=45$ (2), $abc=k$ (3)이다.
      source_flow: 문항해설·예시답안 pp.24~25
      criteria:
      - 3-2.M1
    - id: 32b-2
      content: $a,b,c$가 모두 정수이면, $k=abc$도 정수이므로 (문제 3-1) 범위에서 가능한 $k$는 50, 51, 52, 53, 54이다.
      source_flow: 문항해설·예시답안 pp.24~25
      criteria:
      - 3-2.M2
    - id: 32b-3
      content: 이중 $a+b+c=12$이고, $ab+bc+ca=45$인 양의 정수 $(a,b,c)$는 $(3,3,6)$과 $(2,5,5)$만 가능하다.
      source_flow: 문항해설·예시답안 pp.24~25
      criteria:
      - 3-2.A1
    - id: 32b-4
      content: $(2,5,5)$인 경우 $k=2\times5\times5=50$이고, $(3,3,6)$인 경우 $k=3\times3\times6=54$이다.
      source_flow: 문항해설·예시답안 pp.24~25
      criteria:
      - 3-2.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3-2.M1
      mark_type: M
      points: 2
      evidence: 근과 계수의 관계 $a+b+c=12$, $ab+bc+ca=45$, $abc=k$를 썼다.
      steps:
      - 32b-1
    - id: 3-2.M2
      mark_type: M
      points: 1
      evidence: $k=abc$가 정수이고 $50\le k\le54$임을 썼다.
      steps:
      - 32b-2
    - id: 3-2.A1
      mark_type: A
      points: 1
      evidence: $(a,b,c)=(3,3,6),(2,5,5)$를 구했다.
      depends_on:
      - 3-2.M1
      - 3-2.M2
      steps:
      - 32b-3
    - id: 3-2.A2
      mark_type: A
      points: 1
      evidence: $k=50,54$를 구했다.
      depends_on:
      - 3-2.A1
      steps:
      - 32b-4
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 3-3
  stem: |
    (문제 3-3) 삼각형 ABC의 세 각 $\angle\mathrm{A}$, $\angle\mathrm{B}$, $\angle\mathrm{C}$의 크기는 각각 $A$, $B$, $C$로 나타낸다. (문제 3-2)에서 구한 $a$, $b$, $c$가 각 $\angle\mathrm{A}$, $\angle\mathrm{B}$, $\angle\mathrm{C}$의 대변의 길이인 경우 이 삼각형 ABC에 대해서, $ab\cos C+bc\cos A+ca\cos B$를 구하시오. (10점)
  points: 10
  depends_on:
  - 3-2
  answer:
    kind: value
    value: '27'
    equivalents:
    - $27$
    tolerance: null
  solutions:
  - id: S33-B
    audience: B
    method_no: 1
    steps:
    - id: 33b-1
      content: 삼각형의 가장 긴 변의 길이는 나머지 두 변의 합보다 작아야 한다. $2+5>5$, $3+3=6$이므로 (문제 3-2)에서 구한 $a,b,c$ 중 삼각형을 이루는 조합은 $(2,5,5)$이다.
      source_flow: 문항해설·예시답안 pp.24~26
      criteria:
      - 3-3.M1
    - id: 33b-2
      content: 삼각형 ABC에서의 코사인 법칙을 적용하면 $a^2=b^2+c^2-2bc\cos A$, $b^2=c^2+a^2-2ca\cos B$, $c^2=a^2+b^2-2ab\cos C$, $\cos A=\dfrac{b^2+c^2-a^2}{2bc}$, $\cos B=\dfrac{c^2+a^2-b^2}{2ca}$, $\cos C=\dfrac{a^2+b^2-c^2}{2ab}$
      source_flow: 문항해설·예시답안 pp.24~26
      criteria:
      - 3-3.M2
    - id: 33b-3
      content: $ab\cos C+bc\cos A+ca\cos B=\dfrac{b^2+c^2-a^2}{2}+\dfrac{c^2+a^2-b^2}{2}+\dfrac{a^2+b^2-c^2}{2}=\dfrac{a^2+b^2+c^2}{2}=\dfrac{2^2+5^2+5^2}{2}=27$
      source_flow: 문항해설·예시답안 pp.24~26
      criteria:
      - 3-3.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3-3.M1
      mark_type: M
      points: 3
      evidence: 삼각형 성립 조건으로 $(3,3,6)$을 제외하고 $(2,5,5)$를 택했다.
      steps:
      - 33b-1
    - id: 3-3.M2
      mark_type: M
      points: 3
      evidence: 세 각에 대한 코사인법칙을 썼다.
      steps:
      - 33b-2
    - id: 3-3.A1
      mark_type: A
      points: 4
      evidence: $\dfrac{a^2+b^2+c^2}{2}$로 정리해 $27$을 구했다.
      depends_on:
      - 3-3.M1
      - 3-3.M2
      steps:
      - 33b-3
