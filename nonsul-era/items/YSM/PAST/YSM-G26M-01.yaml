    - id: 13b-3
      content: $\mathrm{P}(X\ge80)=\mathrm{P}\left(\dfrac{X-75}{\sqrt{18.75}}\ge\dfrac{80-75}{\sqrt{18.75}}\right)\fallingdotseq\mathrm{P}\left(Z\ge\dfrac2{\sqrt3}\right)=\mathrm{P}(Z\ge1.16)$
      source_flow: 문항해설·예시답안 p.29
      criteria:
      - 1-3.M3
    - id: 13b-4
      content: $=0.5-0.3770=0.123$이다. 따라서 3승 2패의 팀이 80번 이상 최종 승리할 확률은 $0.123$이다.
