    - 마진 $2$ 또는 $3$ (마진이 2 이상)
    tolerance: null
  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: '(i) 마진이 1인 승패 상황의 최종 승리 확률 1승 : $\left(\dfrac12\right)^3+{}_3\mathrm{C}_2\cdot\left(\dfrac12\right)^2\cdot\left(\dfrac12\right)+{}_4\mathrm{C}_2\cdot\left(\dfrac12\right)^2\cdot\left(\dfrac12\right)^2\cdot\left(\dfrac12\right)+{}_5\mathrm{C}_2\cdot\left(\dfrac12\right)^2\cdot\left(\dfrac12\right)^3\cdot\left(\dfrac12\right)=\dfrac{21}{32}=0.65625$, 2승 1패 : $\left(\dfrac12\right)^2+{}_2\mathrm{C}_1\cdot\left(\dfrac12\right)\cdot\left(\dfrac12\right)\cdot\left(\dfrac12\right)+{}_3\mathrm{C}_1\cdot\left(\dfrac12\right)\cdot\left(\dfrac12\right)^2\cdot\left(\dfrac12\right)=\dfrac{11}{16}=0.6875$, 3승 2패 : $\left(\dfrac12\right)+\left(\dfrac12\right)\cdot\left(\dfrac12\right)=\dfrac34=0.75$'
      source_flow: 문항해설·예시답안 p.29
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: '(ii) 마진이 2인 상황의 승리 확률 2승 : $\left(\dfrac12\right)^2+{}_2\mathrm{C}_1\cdot\left(\dfrac12\right)\cdot\left(\dfrac12\right)\cdot\left(\dfrac12\right)+{}_3\mathrm{C}_1\cdot\left(\dfrac12\right)\cdot\left(\dfrac12\right)^2\cdot\left(\dfrac12\right)+{}_4\mathrm{C}_1\cdot\left(\dfrac12\right)\cdot\left(\dfrac12\right)^3\cdot\left(\dfrac12\right)=\dfrac{13}{16}=0.8125$, 3승 1패 : $\left(\dfrac12\right)+\left(\dfrac12\right)\cdot\left(\dfrac12\right)+\left(\dfrac12\right)^2\cdot\left(\dfrac12\right)=\dfrac78=0.875$'
      source_flow: 문항해설·예시답안 p.29
      criteria:
      - 1-2.M2
    - id: 12b-3
      content: '(iii) 마진이 3인 경우의 승리 확률 3승 : $\left(\dfrac12\right)+\left(\dfrac12\right)\cdot\left(\dfrac12\right)+\left(\dfrac12\right)^2\cdot\left(\dfrac12\right)+\left(\dfrac12\right)^3\cdot\left(\dfrac12\right)=\dfrac{15}{16}=0.9375$'
      source_flow: 문항해설·예시답안 p.29
      criteria:
      - 1-2.M3
    - id: 12b-4
      content: 마진이 2 또는 3이면(또는 2 이상) 최종 승리 확률이 80% 이상
      source_flow: 문항해설·예시답안 p.29
      criteria:
      - 1-2.A1
