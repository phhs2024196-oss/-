    method_no: 1
    steps:
    - id: 13b-1
      content: 100번의 7전 4선승제 경기에서 3승 2패의 팀이 최종 승리하는 횟수를 확률변수 $X$로 정의한다. 3승 2패의 팀이 최종 승리할 확률은 $\dfrac34$이므로 $X$는 횟수 $100$, 확률 $0.75$의 이항분포 $\mathrm{B}(100,0.75)$를 따른다.
      source_flow: 문항해설·예시답안 p.29
