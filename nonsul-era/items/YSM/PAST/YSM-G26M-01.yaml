stem: |
  【문제 1】 아래의 제시문을 읽고 문항별로 풀이와 함께 답하시오. (30점)

  (가) 두 팀이 여러 번 시합을 해서 $n$번 먼저 이기는 팀이 최종 승리하는 경기 방식을 $n$선승제라고 한다. 최종 승리하는 팀이 정해지기까지 최대 $(2n-1)$번의 시합을 하기 때문에 $(2n-1)$전 $n$선승제 경기라고도 한다. 단판승부의 방식은 $n=1$에 해당하는 경우이다.

  (나) 승리한 시합 수에서 패배한 시합 수를 뺀 값을 마진(margin)이라고 한다. 가령 3승 1패의 상황은 마진이 2이다.

  (다) 매 시합에서 무승부는 없고 모든 시합의 결과는 서로 독립임을 가정한다.

  (라) 별도의 언급이 없으면 매 시합에서 두 팀의 승률은 같다.

  (마) 표준정규분포를 따르는 확률변수 $Z$에 대하여

  $P(0\le Z\le1)=0.3413$, $P(0\le Z\le1.14)=0.3729$, $P(0\le Z\le1.15)=0.3749$,

  $P(0\le Z\le1.16)=0.3770$

  이다. 그리고, $\dfrac{1}{\sqrt2}=0.71$, $\dfrac{1}{\sqrt3}=0.58$, $\dfrac{1}{\sqrt5}=0.45$ 값을 사용한다.
subparts:
- id: 1-1
  stem: |
    [문제 1-1] 7전 4선승제 경기에서 최종 승리 팀을 정할 때까지 치르는 시합 수의 평균(기댓값)을 구하시오. (5점)
  points: 5
  depends_on: []
  answer:
    kind: value
    value: 93/16
    equivalents:
    - $\dfrac{93}{16}\ (=5.8125)$
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: 두 팀이 7전 4선승제 경기에서 치르게 되는 시합 수를 확률변수 $N$으로 정의한다. $N$이 가능한 값은 $4,5,6,7$이다. $\mathrm{P}(N=4)=\mathrm{P}$(4승으로 경기 마침)$=\left(\dfrac12\right)^4\times2=\left(\dfrac12\right)^3$, $\mathrm{P}(N=5)=\mathrm{P}$(4승 1패로 경기 마침)$={}_4\mathrm{C}_3\cdot\left(\dfrac12\right)^3\cdot\left(\dfrac12\right)\times\left(\dfrac12\right)\times2=4\cdot\left(\dfrac12\right)^5\times2=\left(\dfrac12\right)^2$, $\mathrm{P}(N=6)=\mathrm{P}$(4승 2패로 경기 마침)$={}_5\mathrm{C}_3\cdot\left(\dfrac12\right)^3\cdot\left(\dfrac12\right)^2\times\left(\dfrac12\right)\times2=10\cdot\left(\dfrac12\right)^6\times2=5\times\left(\dfrac12\right)^4$, $\mathrm{P}(N=7)=\mathrm{P}$(4승 3패로 경기 마침)$={}_6\mathrm{C}_3\cdot\left(\dfrac12\right)^3\cdot\left(\dfrac12\right)^3\times\left(\dfrac12\right)\times2=20\cdot\left(\dfrac12\right)^7\times2=5\times\left(\dfrac12\right)^4$
      source_flow: 문항해설·예시답안 pp.28~29
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: $N$의 확률분포표는 $\mathrm{P}(N=4)=\dfrac2{16}$, $\mathrm{P}(N=5)=\dfrac4{16}$, $\mathrm{P}(N=6)=\dfrac5{16}$, $\mathrm{P}(N=7)=\dfrac5{16}$, 합계 $1$이다.
      source_flow: 문항해설·예시답안 pp.28~29
      criteria:
      - 1-1.A1
    - id: 11b-3
      content: 시합 수의 평균 $\mathrm{E}(N)=4\times\dfrac2{16}+5\times\dfrac4{16}+6\times\dfrac5{16}+7\times\dfrac5{16}=\dfrac{93}{16}=5.8125$
      source_flow: 문항해설·예시답안 pp.28~29
      criteria:
      - 1-1.A2
