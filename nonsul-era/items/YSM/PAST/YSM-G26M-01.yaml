- id: 1-2
  stem: |
    [문제 1-2] 7전 4선승제 경기에서 최종 승리 확률이 80% 이상이 되는 마진을 모두 구하시오. (10점)
  points: 10
  depends_on: []
  answer:
    kind: value
    value: m_min=2; m_max=3
