key_idea: 7전 4선승제의 시합 수 $N\in\{4,5,6,7\}$의 분포를 독립시행으로 구해 평균 $\dfrac{93}{16}$을 얻고, 마진별(승패 상황별) 최종 승리 확률을 구해 80% 이상인 마진 2, 3을 찾으며, $B(100,0.75)$를 $N(75,18.75)$로 근사해 $P(X\ge80)$을 표준정규분포표로 구하고, 승률 $\dfrac35$인 팀의 단판과 5전 3선승제의 승리 확률을 비교한다.
stuck: 승패 상황(마진)별로 남은 시합의 경우를 빠짐없이 세어 최종 승리 확률을 구하는 단계, 그리고 $B(100,0.75)$의 정규근사에서 표준편차 $\sqrt{18.75}$로 표준화해 $\dfrac{2}{\sqrt3}\approx1.16$을 표에서 읽는 단계.
