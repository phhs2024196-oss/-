  misconceptions: []
- id: 2-2
  stem: |
    (문제 2-2) 제시문 (나)에 주어진 함수 $P(x)$에 대하여 방정식 $|P(x)|=\dfrac{1}{2^{11}}$의 서로 다른 실근의 개수를 구하시오. (15점)
  points: 15
  depends_on: []
  answer:
    kind: value
    value: '4094'
    equivalents:
    - $2^{12}-2=4094$
    tolerance: null
  solutions:
  - id: S22-B
    audience: B
    method_no: 1
    steps:
    - id: 22b-1
      content: $\sin(2x)=2\sin x\cos x$이므로 $\sin(2^2x)=2\sin(2x)\cos(2x)=2^2\sin x\cos x\cos(2x)$를 얻을 수 있고, 이를 반복하여 $\sin(2^3x)=2\sin(2^2x)\cos(2^2x)=2^3\sin x\cos x\cos(2x)\cos(2^2x)$를 얻을 수 있다. 이를 계속 반복하면 $\sin(2^{11}x)=2^{11}\sin x\cos x\cos(2x)\cos(2^2x)\cdots\cos(2^{10}x)$가 된다. 이를 정리하면 $P(x)=\dfrac{\sin(2^{11}x)}{2^{11}\sin x}$ [4점]
      source_flow: 문항해설·예시답안 p.32
      criteria:
      - 2-2.M1
    - id: 22b-2
      content: '$0<x<\pi$에서 $\sin x>0$이므로 문제 (2-2)의 조건에 의해 $|P(x)|=\dfrac{|\sin(2^{11}x)|}{2^{11}\sin x}=\dfrac1{2^{11}}\Leftrightarrow|\sin(2^{11}x)|=\sin x$ 즉, $\sin(2^{11}x)$와 $\sin x$가 크기가 같고 부호만 같거나 반대이다. 따라서 두 가지 경우로 나눌 수 있다: ① $\sin(2^{11}x)=\sin x$ ② $\sin(2^{11}x)=-\sin x$ [2점]'
      source_flow: 문항해설·예시답안 p.32
      criteria:
      - 2-2.M2
    - id: 22b-3
      content: ①의 경우, $\sin(2^{11}x)=\sin x$이면, 다음 두 가지 경우가 생긴다. ㉠ $2^{11}x=x+2k\pi\Rightarrow x=\dfrac{2k\pi}{2^{11}-1}$, $k=1,2,3,\cdots,2^{11-1}-1$ ㉡ $2^{11}x=\pi-x+2m\pi\Rightarrow x=\dfrac{(2m+1)\pi}{2^{11}+1}$, $m=0,1,2,\cdots,2^{11-1}-1$ ㉠과 ㉡을 동시에 만족하는 $x$가 존재하는지 알아보기 위해 $\dfrac{2k\pi}{2^{11}-1}=\dfrac{(2m+1)\pi}{2^{11}+1}$, $k=1,2,3,\ldots,2^{11-1}-1$, $m=0,1,2,\cdots,2^{11-1}-1$을 살펴보면, $2k(2^{11}+1)=(2m+1)(2^{11}-1)$을 만족해야 한다. 하지만 여기에서 좌변은 짝수이고 우변은 홀수이므로 ㉠과 ㉡을 동시에 만족하는 $x$는 존재하지 않는다. 따라서 ①의 경우 실근의 개수는 $2^{11}-1$개이다. [4점]
      source_flow: 문항해설·예시답안 p.32
      criteria:
      - 2-2.A1
    - id: 22b-4
      content: ②의 경우, $\sin(2^{11}x)=-\sin x$이면, 마찬가지로 다음 두 가지 경우가 생긴다. ㉢ $2^{11}x=-x+2k\pi\Rightarrow x=\dfrac{2k\pi}{2^{11}+1}$, $k=1,2,3,\cdots,2^{11-1}-1$ ㉣ $2^{11}x=\pi+x+2m\pi\Rightarrow x=\dfrac{(2m+1)\pi}{2^{11}-1}$, $m=0,1,2,\cdots,2^{11-1}-2$ 이제 ㉢과 ㉣을 동시에 만족하는 $x$가 존재하는지 알아보기 위해 $\dfrac{2k\pi}{2^{11}+1}=\dfrac{(2m+1)\pi}{2^{11}-1}$, $k=1,2,3,\cdots,2^{11-1}-1$, $m=0,1,2,\cdots,2^{11-1}-2$를 살펴보면, $2k(2^{11}-1)=(2m+1)(2^{11}+1)$을 만족해야 한다. 하지만 여기에서 좌변은 짝수이고 우변은 홀수이므로 ㉢과 ㉣을 동시에 만족하는 $x$는 존재하지 않는다. 따라서 ②의 경우 실근의 개수는 $2^{11}-1$개이다. [4점]
      source_flow: 문항해설·예시답안 p.32
      criteria:
      - 2-2.A2
    - id: 22b-5
      content: ①과 ②를 동시에 만족하기 위해서는 $\sin x=0$이어야 하지만 $0<x<\pi$이므로 그런 $x$는 존재하지 않는다. 따라서 서로 다른 실근의 개수는 ①의 $2^{11}-1$개와 ②의 $2^{11}-1$개를 합친 개수인 $2^{12}-2=4094$개다. [1점]
      source_flow: 문항해설·예시답안 p.32
      criteria:
      - 2-2.A3
