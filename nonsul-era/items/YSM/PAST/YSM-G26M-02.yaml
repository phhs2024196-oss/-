stimuli: []
stem: |
  【문제 2】 아래의 제시문을 읽고 문항별로 풀이와 함께 답하시오. (35점)

  (가) 수열 $\{S_n\}$을 다음과 같이 정의한다.

  $$S_n=\sum_{k=1}^{n}\dfrac{2k-1}{k(k+1)(k+2)}$$

  (나) $0<x<\pi$일 때, 함수 $P(x)$를 다음과 같이 정의한다.

  $$P(x)=\cos(2^0x)\times\cos(2^1x)\times\cos(2^2x)\times\cos(2^3x)\times\cos(2^4x)\times\cos(2^5x)\times\cos(2^6x)\times\cos(2^7x)\times\cos(2^8x)\times\cos(2^9x)\times\cos(2^{10}x)$$

  (다) 수열 $\{C_n\}$과 $\{\theta_n\}$을 다음과 같이 정의한다.

  $$C_n=\sum_{k=1}^{n}(2k-1)(\cos(k\theta_n)-\cos((k+1)\theta_n)),\qquad\theta_n=\dfrac{\pi}{2n+1}$$

  (라) 다음의 코사인함수의 덧셈정리 식 (1)과 (2)를 이용하여 식 (3)을 얻을 수 있다.

  (1) $\cos(A+B)=\cos A\cos B-\sin A\sin B$

  (2) $\cos(A-B)=\cos A\cos B+\sin A\sin B$

  (3) $\cos(A-B)-\cos(A+B)=2\sin A\sin B$
subparts:
- id: 2-1
  stem: |
    (문제 2-1) 제시문 (가)에 주어진 수열 $\{S_n\}$에 대하여 $\alpha=\displaystyle\lim_{n\to\infty}S_n$이라 하자. 급수 $\displaystyle\sum_{n=1}^{\infty}\left(\dfrac{1}{\alpha^n}S_n\right)$의 수렴, 발산을 조사하고, 수렴하면 그 합을 구하시오. (5점)
  points: 5
  depends_on: []
  answer:
    kind: value
    value: alpha=3/4
    equivalents:
    - $\alpha=\dfrac34$이고 급수 $\displaystyle\sum\dfrac{S_n}{\alpha^n}$은 발산한다
    tolerance: null
  solutions:
  - id: S21-B
    audience: B
    method_no: 1
    steps:
    - id: 21b-1
      content: $S_n=\displaystyle\sum_{k=1}^n\left(\dfrac{2k-1}{k(k+1)(k+2)}\right)=\sum_{k=1}^n\dfrac{2k}{k(k+1)(k+2)}-\sum_{k=1}^n\dfrac1{k(k+1)(k+2)}=\sum_{k=1}^n\dfrac{2}{(k+1)(k+2)}-\sum_{k=1}^n\dfrac1{k(k+1)(k+2)}=2\sum_{k=1}^n\left(\dfrac1{k+1}-\dfrac1{k+2}\right)-\sum_{k=1}^n\dfrac1{(k+1)}\dfrac12\left(\dfrac1k-\dfrac1{k+2}\right)=2\sum_{k=1}^n\left(\dfrac1{k+1}-\dfrac1{k+2}\right)-\sum_{k=1}^n\dfrac12\left(\dfrac1{k(k+1)}-\dfrac1{(k+1)(k+2)}\right)=2\left(\dfrac12-\dfrac1{n+2}\right)-\dfrac12\left(\dfrac1{1\cdot2}-\dfrac1{(n+1)(n+2)}\right)$ 따라서 $\alpha=\displaystyle\lim_{n\to\infty}S_n=\lim_{n\to\infty}\left[2\left(\dfrac12-\dfrac1{n+2}\right)-\dfrac12\left(\dfrac1{1\cdot2}-\dfrac1{(n+1)(n+2)}\right)\right]=\dfrac34$ [3점]
      source_flow: 문항해설·예시답안 p.31
      criteria:
      - 2-1.B1
    - id: 21b-2
      content: 이제 $\displaystyle\lim_{n\to\infty}\dfrac1{\alpha^n}=\lim_{n\to\infty}\left(\dfrac43\right)^n=\infty$이고 $\displaystyle\lim_{n\to\infty}S_n=\lim_{n\to\infty}\dfrac{3+\frac1n}{4+\frac{12}n+\frac8{n^2}}=\dfrac34>0$이므로 $\displaystyle\lim_{n\to\infty}\dfrac{S_n}{\alpha^n}=\lim_{n\to\infty}\left(\dfrac43\right)^n\dfrac{n(3n+1)}{4(n+1)(n+2)}\ne0$ 따라서 $\displaystyle\sum_{n=1}^{\infty}\dfrac{S_n}{\alpha^n}$은 발산한다. [2점]
      source_flow: 문항해설·예시답안 p.31
      criteria:
      - 2-1.B2
