key_idea: $S_n$을 부분분수로 망원 합하여 $\alpha=\dfrac34$이고 $\dfrac{S_n}{\alpha^n}\not\to0$이므로 급수가 발산하며, 사인 배각 공식을 반복해 $P(x)=\dfrac{\sin(2^{11}x)}{2^{11}\sin x}$로 만들어 $|\sin(2^{11}x)|=\sin x$의 해를 $\pm$ 두 경우로 세어 $2^{12}-2$개를 얻고, $C_n$은 제시문 (라)의 식 (3)으로 곱 형태로 바꿔 정적분과 급수의 합의 관계(구간 $[0,\tfrac12]$, $\int_0^{1/2}2x\sin\pi x\,dx$)와 조임정리로 극한 $\dfrac{16}{\pi^2}$을 구한다.
stuck: $\dfrac{2k-1}{k(k+1)(k+2)}$를 두 번 부분분수로 분해해 망원급수로 만드는 단계, $|\sin(2^{11}x)|=\sin x$에서 $x+2k\pi$형·$\pi-x+2m\pi$형 해를 각각 세고 홀짝으로 중복이 없음을 보이는 단계, 그리고 $\dfrac{C_n}{n^2\sin(\theta_n/2)}$를 $\dfrac{2(2n+1)^2}{n^2}\sum\dfrac1{2n+1}[\cdots]$ 꼴로 만들어 리만합으로 읽는 단계.
