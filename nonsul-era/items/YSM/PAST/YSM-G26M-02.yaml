  solutions:
  - id: S23-B
    audience: B
    method_no: 1
    steps:
    - id: 23b-1
      content: $C_n=\displaystyle\sum_{k=1}^n(2k-1)(\cos(k\theta_n)-\cos((k+1)\theta_n))=\sum_{k=1}^n(2k-1)\left[\cos\left(k\theta_n+\dfrac{\theta_n}2-\dfrac{\theta_n}2\right)-\cos\left(k\theta_n+\dfrac{\theta_n}2+\dfrac{\theta_n}2\right)\right]$ 이므로 $A=k\theta_n+\dfrac{\theta_n}2$, $B=\dfrac{\theta_n}2$이라 하면, 제시문 (라)에 의해 $C_n=\displaystyle\sum_{k=1}^n(2k-1)2\left[\sin\left(k\theta_n+\dfrac{\theta_n}2\right)\sin\dfrac{\theta_n}2\right]$ [3점]
      source_flow: 문항해설·예시답안 pp.32~34
      criteria:
      - 2-3.M1
    - id: 23b-2
      content: $\displaystyle\lim_{n\to\infty}\dfrac{C_n}{n^2\sin\frac{\theta_n}2}=\lim_{n\to\infty}\sum_{k=1}^n\dfrac{2(2k-1)\sin\left(k\theta_n+\frac{\theta_n}2\right)\sin\frac{\theta_n}2}{n^2\sin\frac{\theta_n}2}=\lim_{n\to\infty}\sum_{k=1}^n\dfrac{2(2k-1)}{n^2}\sin\left(k\theta_n+\dfrac{\theta_n}2\right)=\lim_{n\to\infty}\sum_{k=1}^n\dfrac{2(2k-1)}{n^2}\sin\left(\dfrac{\left(k+\frac12\right)\pi}{2n+1}\right)=\lim_{n\to\infty}\left[\dfrac{2(2n+1)^2}{n^2}\right]\sum_{k=1}^n\dfrac1{2n+1}\left[2\dfrac{\left(k+\frac12\right)}{2n+1}\sin\left(\dfrac{\left(k+\frac12\right)\pi}{2n+1}\right)-\dfrac2{2n+1}\sin\left(\dfrac{\left(k+\frac12\right)\pi}{2n+1}\right)\right]$ 이 된다. [3점]
      source_flow: 문항해설·예시답안 pp.32~34
      criteria:
      - 2-3.M2
    - id: 23b-3
      content: 이제 $x_k=\dfrac{\left(k+\frac12\right)}{2n+1}$, $\Delta x=\dfrac1{2n+1}$이라 하자. 적분구간 $[a,b]=[0,1/2]$이 된다. 일단 $\displaystyle\lim_{n\to\infty}\dfrac{2(2n+1)^2}{n^2}=\lim_{n\to\infty}\dfrac{8n^2+8n+1}{n^2}=8$이므로, $\displaystyle\lim_{n\to\infty}\sum_{k=1}^n\dfrac1{2n+1}\left[2\dfrac{\left(k+\frac12\right)}{2n+1}\sin\left(\dfrac{\left(k+\frac12\right)\pi}{2n+1}\right)\right]=\int_0^{1/2}2x\sin(\pi x)dx$이고, $\displaystyle\lim_{n\to\infty}\sum_{k=1}^n\dfrac2{2n+1}\left[\dfrac1{2n+1}\sin\left(\dfrac{\left(k+\frac12\right)\pi}{2n+1}\right)\right]=\lim_{n\to\infty}\dfrac2{(2n+1)^2}\sum_{k=1}^n\sin\left(\dfrac{\left(k+\frac12\right)\pi}{2n+1}\right)$ 이제 $-n\le\displaystyle\sum_{k=1}^n\sin\left(\dfrac{\left(k+\frac12\right)\pi}{2n+1}\right)\le n$이므로, $\dfrac{-n}{(2n+1)^2}\le\displaystyle\sum_{k=1}^n\sin\left(\dfrac{\left(k+\frac12\right)\pi}{2n+1}\right)\le\dfrac n{(2n+1)^2}$ 조임정리를 이용해 $\displaystyle\lim_{n\to\infty}\sum_{k=1}^n\sin\left(\dfrac{\left(k+\frac12\right)\pi}{2n+1}\right)=0$임을
        알 수 있다. [3점]
      source_flow: 문항해설·예시답안 pp.32~34
      criteria:
      - 2-3.A1
    - id: 23b-4
      content: 따라서, 각각의 극한값이 존재하므로 $\displaystyle\lim_{n\to\infty}\sum_{k=1}^n\dfrac1{2n+1}\left[2\dfrac{\left(k+\frac12\right)}{2n+1}\sin\left(\dfrac{\left(k+\frac12\right)\pi}{2n+1}\right)-\dfrac2{2n+1}\sin\left(\dfrac{\left(k+\frac12\right)\pi}{2n+1}\right)\right]=\lim_{n\to\infty}\sum_{k=1}^n\dfrac1{2n+1}\left[2\dfrac{\left(k+\frac12\right)}{2n+1}\sin\left(\dfrac{\left(k+\frac12\right)\pi}{2n+1}\right)\right]-\lim_{n\to\infty}\sum_{k=1}^n\dfrac2{2n+1}\left[\dfrac1{2n+1}\sin\left(\dfrac{\left(k+\frac12\right)\pi}{2n+1}\right)\right]$ 이 된다. [3점]
      source_flow: 문항해설·예시답안 pp.32~34
      criteria:
      - 2-3.A2
    - id: 23b-5
      content: $\displaystyle\lim_{n\to\infty}\dfrac{C_n}{n^2\sin\frac{\theta_n}2}=\lim_{n\to\infty}\left[\dfrac{2(2n+1)^2}{n^2}\right]\lim_{n\to\infty}\sum_{k=1}^n\dfrac1{2n+1}\left[\cdots\right]=8\int_0^{1/2}2x\sin(\pi x)dx$ 이제 부분적분을 이용하면, $\displaystyle\lim_{n\to\infty}\dfrac{C_n}{n^2\sin\frac{\theta_n}2}=8\int_0^{1/2}2x\sin(\pi x)dx=\dfrac{16}{\pi^2}$ [3점]
      source_flow: 문항해설·예시답안 pp.32~34
      criteria:
      - 2-3.A3
