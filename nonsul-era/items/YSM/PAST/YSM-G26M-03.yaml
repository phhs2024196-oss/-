stem: |
  【문제 3】 아래의 제시문을 읽고 문항별로 풀이와 함께 답하시오. (35점)

  (가) 좌표평면 위의 두 점 $\mathrm{A}(-1,0)$, $\mathrm{B}(1,0)$에 대하여 선분 AB를 지름으로 하는 반원의 호 $x^2+y^2=1$ ($y\ge0$)가 있다.

  (나) 점 $\mathrm{D}(0,1)$에 대하여 호 BD 위를 움직이는 점 C가 있다.

  (다) 원점 O에 대하여 $\angle\mathrm{BOC}=\theta$의 시각 $t$에 대한 변화율은 $\dfrac{d\theta}{dt}=\sqrt2$이다.

  (라) 선분 OC, 선분 OB, 호 BC에 동시에 접하는 원이 있다. 이 원을 $O_1$이라 하자.

  (마) 원 $O_1$과 선분 OC의 접점을 F라 하고, 원 $O_1$과 선분 OB의 접점을 H라 하자.

  (바) 점 F를 지나고 선분 OC에 수직인 직선이 $x$축과 만나는 점을 I, $y$축과 만나는 점을 J라 하자.

  (사) 선분 AB를 장축, 점 H를 한 초점으로 하는 타원을 $T$라 하자.

  (아) 삼각함수의 덧셈정리에 의해서 $\cos(2\gamma)=1-2\sin^2\gamma$이다. 이로부터 $\sin^2\gamma=\dfrac{1-\cos(2\gamma)}{2}$임을 알 수 있다.

  [그림: 좌표평면에 $x$축 위의 $\mathrm{A}(-1,0)$, 원점 O, 점 H, I, B와 $y$축 위의 점 D, J가 있고, 단위 반원의 호가 A에서 D를 지나 B까지 그려져 있다. 호 BD 위의 점 C에 대하여 선분 OC가 그려져 있고 $\angle\mathrm{BOC}=\theta$로 표시되어 있다. 선분 OC, 선분 OB, 호 BC에 접하는 원이 있으며 선분 OC와의 접점이 F, 선분 OB와의 접점이 H이다. 점 F를 지나 OC에 수직인 직선이 $x$축과 점 I, $y$축 위의 점 J(점 D 위쪽)에서 만난다.]
subparts:
- id: 3-1
  stem: |
    (문제 3-1) 타원 $T$의 단축의 길이가 $2\overline{\mathrm{OF}}$일 때, 시각 $t$에 대한 원 $O_1$의 넓이의 변화율을 구하시오. (10점)
  points: 10
  depends_on: []
  answer:
    kind: expression
    value: 3*pi/16
    equivalents:
    - $\dfrac{3\pi}{16}$
    tolerance: null
  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: 해설의 편의를 위해 $\alpha=\theta/2$, 원 $O_1$의 반지름을 $g$, 원 $O_1$의 중심을 G, $\overline{\mathrm{OH}}=k$라 하자. 선분 OE에서 $\overline{\mathrm{OE}}-\overline{\mathrm{GE}}=1-g$이고 삼각형 HOG에서 $\sin\alpha=\dfrac g{1-g}$이다. 그러므로 $g(\alpha)=\dfrac{\sin\alpha}{1+\sin\alpha}$이고 삼각형 HOG에서 $k(\alpha)=\dfrac{\cos\alpha}{1+\sin\alpha}$이다.
      source_flow: 문항해설·예시답안 pp.36~37
      criteria:
      - 3-1.M1
    - id: 31b-2
      content: 타원 $T$의 단축의 길이를 $2b$라 할 때, $b^2=1^2-k^2=1-\dfrac{\cos^2\alpha}{(1+\sin\alpha)^2}$이다. $\overline{\mathrm{OH}}=\overline{\mathrm{OF}}=k(\alpha)=\dfrac{\cos\alpha}{1+\sin\alpha}$이므로 $1-\dfrac{\cos^2\alpha}{(1+\sin\alpha)^2}=\dfrac{\cos^2\alpha}{(1+\sin\alpha)^2}\Rightarrow\sin\alpha=\dfrac13$
      source_flow: 문항해설·예시답안 pp.36~37
      criteria:
      - 3-1.A1
    - id: 31b-3
      content: 원 $O_1$의 넓이를 $S$라 하면, $S(\alpha)=\pi g^2=\dfrac{\pi\sin^2\alpha}{(1+\sin\alpha)^2}$이므로, $\dfrac d{dt}S(\alpha)=\dfrac d{dt}\dfrac{\pi\sin^2\alpha}{(1+\sin\alpha)^2}=\pi\left(\dfrac{2\sin\alpha\cos\alpha\,\alpha'\cdot(1+\sin\alpha)^2-\sin^2\alpha\cdot2(1+\sin\alpha)\cos\alpha\,\alpha'}{(1+\sin\alpha)^4}\right)$ $\left(\alpha'=\dfrac{d\alpha}{dt}=\dfrac{d(\theta/2)}{dt}=\dfrac12\dfrac{d\theta}{dt}=\dfrac{\sqrt2}2\text{이므로}\right)$ $=\pi\dfrac{\sqrt2}2\left(\dfrac{2\sin\alpha\cos\alpha\cdot(1+\sin\alpha)-\sin^2\alpha\cdot2\cos\alpha}{(1+\sin\alpha)^3}\right)=\pi\dfrac{\sqrt2}2\dfrac{2\sin\alpha\cos\alpha}{(1+\sin\alpha)^3}=\pi\sqrt2\dfrac{\sin\alpha\cos\alpha}{(1+\sin\alpha)^3}$
      source_flow: 문항해설·예시답안 pp.36~37
      criteria:
      - 3-1.M2
    - id: 31b-4
      content: 점 C는 호 BD 위의 점이므로 $\alpha=\theta/2$는 예각이고 $\sin\alpha=\dfrac13$이므로 $\cos\alpha=\dfrac{2\sqrt2}3$이다. 그러므로 $\dfrac d{dt}S(\alpha)=\pi\sqrt2\dfrac{\sin\alpha\cos\alpha}{(1+\sin\alpha)^3}=\pi\sqrt2\dfrac{(1/3)(2\sqrt2/3)}{(1+(1/3))^3}=\pi\sqrt2\dfrac{3\sqrt2}{32}=\dfrac{3\pi}{16}$
      source_flow: 문항해설·예시답안 pp.36~37
      criteria:
      - 3-1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3-1.M1
      mark_type: M
      points: 3
      evidence: 원 $O_1$의 반지름 $g=\dfrac{\sin\alpha}{1+\sin\alpha}$와 $\overline{\mathrm{OH}}=k=\dfrac{\cos\alpha}{1+\sin\alpha}$를 구했다.
      steps:
      - 31b-1
    - id: 3-1.A1
      mark_type: A
      points: 2
      evidence: 타원의 단축 조건 $b=\overline{\mathrm{OF}}$에서 $\sin\alpha=\dfrac13$을 구했다.
      depends_on:
      - 3-1.M1
      steps:
      - 31b-2
    - id: 3-1.M2
      mark_type: M
      points: 2
      evidence: $S=\pi g^2$을 $t$로 미분해 $\dfrac{dS}{dt}=\pi\sqrt2\dfrac{\sin\alpha\cos\alpha}{(1+\sin\alpha)^3}$을 얻었다($\alpha'=\dfrac{\sqrt2}2$ 이용).
      steps:
      - 31b-3
    - id: 3-1.A2
      mark_type: A
      points: 3
      evidence: $\sin\alpha=\dfrac13$, $\cos\alpha=\dfrac{2\sqrt2}3$을 넣어 $\dfrac{3\pi}{16}$을 구했다.
      depends_on:
      - 3-1.A1
      - 3-1.M2
      steps:
      - 31b-4
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 3-2
  stem: |
    (문제 3-2) $\overrightarrow{\mathrm{JI}}\cdot\overrightarrow{\mathrm{JO}}\ge\overrightarrow{\mathrm{IJ}}\cdot\overrightarrow{\mathrm{IF}}$일 때, $\overrightarrow{\mathrm{OQ}}\perp\overrightarrow{\mathrm{AQ}}$, $\overrightarrow{\mathrm{OQ}}\perp\overrightarrow{\mathrm{CQ}}$를 만족하는 점 Q에 대하여 $\left|\overrightarrow{\mathrm{OQ}}\right|^2$의 최댓값을 구하시오. (단, 기호 $\cdot$은 내적을 나타낸다.) (10점)
  points: 10
  depends_on: []
  answer:
    kind: expression
    value: (2-sqrt(2))/4
    equivalents:
    - $\dfrac{2-\sqrt2}{4}$
    tolerance: null
  solutions:
  - id: S32-B
    audience: B
    method_no: 1
    steps:
    - id: 32b-1
      content: 점 Q가 $\overrightarrow{\mathrm{OQ}}\perp\overrightarrow{\mathrm{AQ}}$이므로 선분 AO를 지름으로 하는 원 위에 있고, 점 Q가 $\overrightarrow{\mathrm{OQ}}\perp\overrightarrow{\mathrm{CQ}}$이므로 선분 CO를 지름으로 하는 원 위에 있다. 그러므로 점 Q는 점 O에서 선분 AC에 내린 수선의 발이다. 점 Q는 점 O에서 선분 AC에 내린 수선의 발이므로 $\overline{\mathrm{OQ}}=\sin\alpha$이다. 점 C는 호 BD 위의 점이므로 $\alpha=\theta/2$는 예각이다. 그러므로 $\overline{\mathrm{OQ}}=\sin\alpha$가 최댓값을 갖기 위해서는 $\alpha$가 최댓값을 가져야 한다.
      source_flow: 문항해설·예시답안 pp.38~39
      criteria:
      - 3-2.M1
    - id: 32b-2
      content: 주어진 조건 $\overrightarrow{\mathrm{JI}}\cdot\overrightarrow{\mathrm{JO}}\ge\overrightarrow{\mathrm{IJ}}\cdot\overrightarrow{\mathrm{IF}}\Leftrightarrow\overrightarrow{\mathrm{JI}}\cdot\overrightarrow{\mathrm{JO}}\ge-\overrightarrow{\mathrm{JI}}\cdot\overrightarrow{\mathrm{IF}}\Leftrightarrow\overrightarrow{\mathrm{JI}}\cdot\overrightarrow{\mathrm{JO}}+\overrightarrow{\mathrm{JI}}\cdot\overrightarrow{\mathrm{IF}}\ge0$ ($\overrightarrow{\mathrm{JI}}\perp\overrightarrow{\mathrm{FO}}$이므로 $\overrightarrow{\mathrm{JI}}\cdot\overrightarrow{\mathrm{FO}}=0$) $\overrightarrow{\mathrm{JI}}\cdot\overrightarrow{\mathrm{JO}}+\overrightarrow{\mathrm{JI}}\cdot\overrightarrow{\mathrm{FO}}+\overrightarrow{\mathrm{JI}}\cdot\overrightarrow{\mathrm{IF}}\ge0\Leftrightarrow\overrightarrow{\mathrm{JI}}\cdot\left(\overrightarrow{\mathrm{JO}}+\overrightarrow{\mathrm{FO}}+\overrightarrow{\mathrm{IF}}\right)\ge0\Leftrightarrow\overrightarrow{\mathrm{JI}}\cdot\left(\overrightarrow{\mathrm{JO}}+\overrightarrow{\mathrm{IO}}\right)\ge0\Leftrightarrow\overrightarrow{\mathrm{JO}}\cdot\overrightarrow{\mathrm{JI}}\ge\overrightarrow{\mathrm{IO}}\cdot\overrightarrow{\mathrm{IJ}}$
        여기에서 $\overrightarrow{\mathrm{JO}}\cdot\overrightarrow{\mathrm{JI}}$와 $\overrightarrow{\mathrm{IO}}\cdot\overrightarrow{\mathrm{IJ}}$는 각각 다음과 같다. $\overrightarrow{\mathrm{JO}}\cdot\overrightarrow{\mathrm{JI}}=\overline{\mathrm{JO}}\times\overline{\mathrm{JI}}\times\cos(\angle\mathrm{OJI})=\overline{\mathrm{JO}}\times\overline{\mathrm{JI}}\times\dfrac{\overline{\mathrm{JF}}}{\overline{\mathrm{JO}}}=\overline{\mathrm{JI}}\times\overline{\mathrm{JF}}$, $\overrightarrow{\mathrm{IO}}\cdot\overrightarrow{\mathrm{IJ}}=\overline{\mathrm{IO}}\times\overline{\mathrm{IJ}}\times\cos(\angle\mathrm{OIJ})=\overline{\mathrm{IO}}\times\overline{\mathrm{IJ}}\times\dfrac{\overline{\mathrm{IF}}}{\overline{\mathrm{IO}}}=\overline{\mathrm{IJ}}\times\overline{\mathrm{IF}}$ $a=\overline{\mathrm{IF}}$, $b=\overline{\mathrm{JF}}$라 하면, $b\times\overline{\mathrm{JI}}=\overrightarrow{\mathrm{JO}}\cdot\overrightarrow{\mathrm{JI}}\ge\overrightarrow{\mathrm{IO}}\cdot\overrightarrow{\mathrm{IJ}}=a\times\overline{\mathrm{IJ}}$이므로
        $a$와 $b$ 사이에 다음의 부등식이 성립한다. $b\ge a$
      source_flow: 문항해설·예시답안 pp.38~39
      criteria:
      - 3-2.M2
    - id: 32b-3
      content: 직각삼각형 IOF에서 $\tan\theta=a/k$이고, 직각삼각형 OJF에서 $\tan\theta=k/b$이므로 $b=k/\tan\theta\ge k\tan\theta=a\Rightarrow\tan^2\theta\le1\Rightarrow\theta\le\pi/4$
      source_flow: 문항해설·예시답안 pp.38~39
      criteria:
      - 3-2.A1
    - id: 32b-4
      content: 그러므로 $\left|\overrightarrow{\mathrm{OQ}}\right|^2=\sin^2\alpha$의 최댓값은 $\alpha=\theta/2=\pi/8$일 때 발생한다. $\sin^2(\pi/8)=\dfrac{1-\cos(\pi/4)}2=\dfrac{1-\sqrt2/2}2=\dfrac{2-\sqrt2}4$
      source_flow: 문항해설·예시답안 pp.38~39
      criteria:
      - 3-2.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
