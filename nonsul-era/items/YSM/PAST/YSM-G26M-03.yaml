    audience: B
    method_no: 1
    steps:
    - id: 33b-1
      content: 해설의 편의를 위해 $\overline{\mathrm{OH}}=k$, $\overline{\mathrm{OI}}=x$라 하자. 삼각형 IOF에서 $\cos\theta=k/x$이다. $\Rightarrow x=\dfrac k{\cos\theta}=\dfrac k{\cos(2\alpha)}=\dfrac{\cos\alpha}{\cos(2\alpha)(1+\sin\alpha)}$이다.
      source_flow: 문항해설·예시답안 pp.40~42
      criteria:
      - 3-3.M1
    - id: 33b-2
      content: 원 $O_2$의 반지름을 $f$, 선분 OK의 길이를 $h$라 하자. 직각삼각형 KOL에서 $(1-f)^2=h^2+f^2$이고 삼각형 KAL에서 $\tan(\alpha/2)=\dfrac f{1+h}\Rightarrow h=\dfrac f{\tan(\alpha/2)}-1$ 그러므로 $(1-f)^2=\left(\dfrac f{\tan(\alpha/2)}-1\right)^2+f^2\Rightarrow1-2f+f^2=\left(\dfrac f{\tan(\alpha/2)}\right)^2-\dfrac{2f}{\tan(\alpha/2)}+1+f^2\Rightarrow-2=\dfrac f{\tan^2(\alpha/2)}-\dfrac2{\tan(\alpha/2)}\Rightarrow f=2\tan(\alpha/2)-2\tan^2(\alpha/2)\Rightarrow h(\alpha)=1-2\tan\left(\dfrac\alpha2\right)$
      source_flow: 문항해설·예시답안 pp.40~42
      criteria:
      - 3-3.M2
    - id: 33b-3
      content: 원 $O_2$가 선분 OD에 접하므로 $h=f$이다. 즉, $2\tan\left(\dfrac\alpha2\right)-2\tan^2\left(\dfrac\alpha2\right)=1-2\tan\left(\dfrac\alpha2\right)\Rightarrow2\tan^2\left(\dfrac\alpha2\right)-4\tan\left(\dfrac\alpha2\right)+1=0\Rightarrow\tan\left(\dfrac\alpha2\right)=\dfrac{2\pm\sqrt2}2$
      source_flow: 문항해설·예시답안 pp.40~42
      criteria:
      - 3-3.A1
    - id: 33b-4
      content: 여기에서 $\tan\left(\dfrac\alpha2\right)=\dfrac{2+\sqrt2}2>1$인 경우, $\alpha/2>\pi/4\Rightarrow\alpha>\pi/2\Rightarrow\theta=2\alpha>\pi$가 되어 제시문 (나)에 위배된다. 그러므로 $\tan\left(\dfrac\alpha2\right)=\dfrac{2-\sqrt2}2$
      source_flow: 문항해설·예시답안 pp.40~42
      criteria:
      - 3-3.A2
    - id: 33b-5
      content: 한 각이 $\alpha/2$이고 두 변의 길이가 각각 $2$, $2-\sqrt2$인 직각삼각형에서 빗변의 길이를 $\lambda$라고 하면, $\lambda^2=2^2+(2-\sqrt2)^2=10-4\sqrt2$이다. 삼각함수의 덧셈정리에 의해서 다음과 같이 $\sin\alpha$와 $\cos\alpha$를 구할 수 있다. $\sin\alpha=\sin(2\alpha/2)=2\sin(\alpha/2)\cos(\alpha/2)=2\dfrac{2-\sqrt2}\lambda\dfrac2\lambda=\dfrac{4(2-\sqrt2)}{\lambda^2}=\dfrac{4(2-\sqrt2)}{10-4\sqrt2}=\dfrac{4-2\sqrt2}{5-2\sqrt2}$, $\cos\alpha=\cos(2\alpha/2)=2\cos^2(\alpha/2)-1=2\dfrac4{\lambda^2}-1=\dfrac{8-\lambda^2}{\lambda^2}=\dfrac{8-(10-4\sqrt2)}{10-4\sqrt2}=\dfrac{-1+2\sqrt2}{5-2\sqrt2}$, $\cos^2\alpha=\left(\dfrac{-1+2\sqrt2}{5-2\sqrt2}\right)^2=\dfrac{9-4\sqrt2}{33-20\sqrt2}$
      source_flow: 문항해설·예시답안 pp.40~42
      criteria:
      - 3-3.A3
    - id: 33b-6
      content: 그러므로 $\overline{\mathrm{OI}}=x=\dfrac{\cos\alpha}{(2\cos^2\alpha-1)(1+\sin\alpha)}=\dfrac{\frac{-1+2\sqrt2}{5-2\sqrt2}}{\left(2\frac{9-4\sqrt2}{33-20\sqrt2}-1\right)\left(1+\frac{4-2\sqrt2}{5-2\sqrt2}\right)}=\dfrac{-1+2\sqrt2}{\left(\frac{18-8\sqrt2}{33-20\sqrt2}-\frac{33-20\sqrt2}{33-20\sqrt2}\right)((5-2\sqrt2)+(4-2\sqrt2))}=\dfrac{(-1+2\sqrt2)(33-20\sqrt2)}{(-15+12\sqrt2)(9-4\sqrt2)}=\dfrac{-113+86\sqrt2}{-231+168\sqrt2}=\dfrac{-113+86\sqrt2}{-21(11-8\sqrt2)}=\dfrac{113-86\sqrt2}{21(11-8\sqrt2)}=\dfrac{(113-86\sqrt2)(11+8\sqrt2)}{21(11-8\sqrt2)(11+8\sqrt2)}=\dfrac{(113-86\sqrt2)(11+8\sqrt2)}{21(121-128)}=\dfrac{-133-42\sqrt2}{21\times(-7)}=\dfrac{19+6\sqrt2}{21}$ 그러므로 $\overline{\mathrm{OI}}=\dfrac{u+v\sqrt2}w=\dfrac{19+6\sqrt2}{21}$이다. 그러므로 $u+v+w=19+6+21=46$이다.
      source_flow: 문항해설·예시답안 pp.40~42
      criteria:
      - 3-3.A4
