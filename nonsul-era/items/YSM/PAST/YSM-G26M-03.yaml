      isw: true
    criteria:
    - id: 3-2.M1
      mark_type: M
      points: 3
      evidence: 점 Q가 O에서 AC에 내린 수선의 발이므로 $\overline{\mathrm{OQ}}=\sin\alpha$이고 $\alpha$의 최댓값을 구하면 됨을 썼다.
      steps:
      - 32b-1
    - id: 3-2.M2
      mark_type: M
      points: 3
      evidence: 벡터 부등식을 내적 계산으로 $\overline{\mathrm{JF}}\ge\overline{\mathrm{IF}}$ ($b\ge a$)로 바꿨다.
      steps:
      - 32b-2
    - id: 3-2.A1
      mark_type: A
      points: 2
      evidence: $\tan\theta=\dfrac ak=\dfrac kb$에서 $\theta\le\dfrac\pi4$를 얻었다.
      depends_on:
      - 3-2.M2
      steps:
      - 32b-3
    - id: 3-2.A2
      mark_type: A
      points: 2
      evidence: $\alpha=\dfrac\pi8$에서 최댓값 $\dfrac{2-\sqrt2}4$를 구했다.
      depends_on:
      - 3-2.M1
      - 3-2.A1
      steps:
      - 32b-4
