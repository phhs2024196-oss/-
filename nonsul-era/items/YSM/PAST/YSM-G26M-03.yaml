key_idea: 단위 반원의 부채꼴 BOC에 내접하는 원 $O_1$의 반지름 $g=\dfrac{\sin\alpha}{1+\sin\alpha}$, $\overline{OH}=\dfrac{\cos\alpha}{1+\sin\alpha}$ ($\alpha=\theta/2$)로 타원 조건에서 $\sin\alpha=\dfrac13$을 얻고 $\dfrac{d}{dt}(\pi g^2)$를 합성함수 미분으로 구하며, 벡터 내적 조건을 $\overline{JF}\ge\overline{IF}$로 바꿔 $\theta\le\dfrac\pi4$에서 $|OQ|^2=\sin^2\alpha$의 최댓값을, 원 $O_2$의 접촉 조건 $2\tan^2\dfrac\alpha2-4\tan\dfrac\alpha2+1=0$으로 $\overline{OI}=\dfrac{19+6\sqrt2}{21}$을 구한다.
stuck: 원 $O_1$의 반지름·$\overline{OH}$를 $\sin\alpha$로 표현해 타원의 단축 조건을 방정식으로 세우는 단계, 벡터 부등식 $\overrightarrow{JI}\cdot\overrightarrow{JO}\ge\overrightarrow{IJ}\cdot\overrightarrow{IF}$를 $\overline{JF}\ge\overline{IF}$로 바꾸는 단계, 그리고 $\tan\dfrac\alpha2$의 두 근 중 $\theta<\pi$ 조건에 맞는 것을 고르고 $\sqrt2$를 포함한 분수를 유리화하는 단계.
