key_idea: 접점 $(k,f(k))$에서의 접선과 $x$축의 교점은 $P_k=(k+1,0)$이므로 삼각형은 밑변 1, 높이 $3e^{-k}$이고 $A_k=\dfrac{3}{2e^k}$는 공비 $e^{-1}$인 등비수열이다. 부분합 $S_n$을 등비수열의 합으로 구하고 $n\to\infty$로 보내 급수의 수렴과 합을 판정한다.
