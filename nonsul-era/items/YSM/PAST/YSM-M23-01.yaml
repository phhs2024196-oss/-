- id: 1-2
  stem: |
    [문제 1-2] 곡선 $f(x)=\dfrac{3}{e^x}$ 위의 점 $\left(k,\dfrac{3}{e^k}\right)$에서 접하는 접선과 $x$축이 만나는 점을 $\mathrm{P}_k$라 하자. 세 점 $\left(k,\dfrac{3}{e^k}\right)$, $(k,0)$, $\mathrm{P}_k$를 꼭짓점으로 하는 삼각형의 넓이를 $\mathrm{A}_k$ ($k=1,2,\cdots,n$)라고 할 때, $\displaystyle\sum_{k=1}^{n}\mathrm{A}_k$를 구하시오.

    [그림 2: 곡선 $y=f(x)$와 점 $\left(k,\dfrac{3}{e^k}\right)$에서의 접선. 접선이 $x$축과 만나는 점이 $\mathrm{P}_k$이고, 점 $(k,0)$, $\mathrm{P}_k$와 접점으로 이루어진 작은 삼각형이 $\mathrm{A}_k$로 표시되어 있다.]
  points: 10
  depends_on: []
  answer:
    kind: expression
    value: 3*(1-exp(-n))/(2*(exp(1)-1))
    equivalents:
    - $\dfrac{3\left(1-e^{-n}\right)}{2(e-1)}$
    tolerance: null
  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: $f'(k)=-3e^{-k}$이므로 접선은 $y-3e^{-k}=-3e^{-k}(x-k)$이고, $y=0$이면 $x=k+1$이므로 $\mathrm{P}_k=(k+1,0)$이다.
      source_flow: 공식 해설 미공개 — 자체 풀이
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: 삼각형은 밑변 $1$, 높이 $\dfrac{3}{e^k}$이므로 $\mathrm{A}_k=\dfrac{3}{2e^k}$이다. 이는 첫째항 $\dfrac{3}{2e}$, 공비 $\dfrac1e$인 등비수열이다.
      source_flow: 공식 해설 미공개 — 자체 풀이
      criteria:
      - 1-2.M2
    - id: 12b-3
      content: $\displaystyle\sum_{k=1}^{n}\mathrm{A}_k=\dfrac{\frac{3}{2e}\left(1-e^{-n}\right)}{1-\frac1e}=\dfrac{3\left(1-e^{-n}\right)}{2(e-1)}$이다.
      source_flow: 공식 해설 미공개 — 자체 풀이
      criteria:
      - 1-2.A1
