    audience: B
    method_no: 1
    steps:
    - id: 13b-1
      content: '급수 $\displaystyle\sum_{k=1}^{\infty}\mathrm{A}_k$의 부분합은 $S_n=\displaystyle\sum_{k=1}^{n}\mathrm{A}_k=\dfrac{3\left(1-e^{-n}\right)}{2(e-1)}$이다. (제시문: 급수의 수렴은 부분합 수열 $\{S_n\}$의 수렴으로 정의)'
      source_flow: 공식 해설 미공개 — 자체 풀이
