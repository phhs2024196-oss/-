stem: |
  【문제 1】 아래의 제시문을 읽고 문항별로 풀이와 함께 답하시오.

  수열 $\{a_n\}$의 각 항을 차례로 덧셈기호 $+$로 연결한 식
  $$a_1+a_2+a_3+\cdots+a_n+\cdots$$
  을 급수라고 하며, 이것을 $\sum$를 사용하여 기호로
  $$\sum_{n=1}^{\infty}a_n$$
  과 같이 나타낸다.

  급수 $\displaystyle\sum_{n=1}^{\infty}a_n$에서 첫째항부터 제 $n$항까지의 합
  $$S_n=a_1+a_2+a_3+\cdots+a_n=\sum_{k=1}^{n}a_k$$
  를 이 급수의 제 $n$항까지의 부분합이라고 한다.

  급수 $\displaystyle\sum_{n=1}^{\infty}a_n$의 부분합으로 이루어진 수열 $\{S_n\}$이 일정한 값 $S$에 수렴할 때, 급수 $\displaystyle\sum_{n=1}^{\infty}a_n$은 $S$에 수렴한다고 하고 수열 $\{S_n\}$이 발산할 때, 이 급수는 발산한다고 한다.
subparts:
- id: 1-1
  stem: |
    [문제 1-1] 곡선 $f(x)=\dfrac{3}{e^x}$ 위의 점 $\left(1,\dfrac3e\right)$에서 접하는 접선과 $x$축이 만나는 점을 P라 할 때, 세 점 $\left(1,\dfrac3e\right)$, $(1,0)$, P를 꼭짓점으로 하는 삼각형의 넓이를 구하시오.

    [그림 1: $xy$평면에서 $y$절편 3에서 시작해 아래로 볼록하게 감소하며 $x$축에 한없이 가까워지는 곡선 $y=f(x)$. $x=1$ 위의 곡선 위의 점에서 $x$축으로 수선이 내려져 있고, 그 점에서의 접선이 $x$축과 만나는 점이 P이다. 수선의 발 $x=1$ 오른쪽에 P가 있다.]
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 3/(2*exp(1))
    equivalents:
    - $\dfrac{3}{2e}$
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: $f(x)=3e^{-x}$이므로 $f'(x)=-3e^{-x}$이고 $f'(1)=-\dfrac3e$이다. 접선의 방정식은 $y-\dfrac3e=-\dfrac3e(x-1)$이다.
      source_flow: 공식 해설 미공개 — 자체 풀이
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: $y=0$을 대입하면 $x-1=1$이므로 $x=2$, 즉 $\mathrm{P}(2,0)$이다.
      source_flow: 공식 해설 미공개 — 자체 풀이
      criteria:
      - 1-1.A1
    - id: 11b-3
      content: 세 점 $\left(1,\dfrac3e\right)$, $(1,0)$, $(2,0)$을 꼭짓점으로 하는 삼각형은 밑변 $1$, 높이 $\dfrac3e$인 직각삼각형이므로 넓이는 $\dfrac12\cdot1\cdot\dfrac3e=\dfrac{3}{2e}$이다.
      source_flow: 공식 해설 미공개 — 자체 풀이
      criteria:
      - 1-1.A2
