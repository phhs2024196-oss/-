  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 2-3
  stem: |
    [문제 2-3] 위 그림과 같이 두 곡선이 접할 때, 두 곡선으로 둘러싸인 도형 A의 넓이를 구하시오.
  points: 10
  depends_on:
  - 2-1
  answer:
    kind: value
    value: 4*pi
    equivalents:
    - $4\pi$
    tolerance: null
  solutions:
  - id: S23-B
    audience: B
    method_no: 1
    steps:
    - id: 23b-1
      content: 도형 A는 두 접점 $x=-\dfrac\pi6$과 $x=\dfrac{11\pi}6$ 사이에서 $f(x)\ge g_a(x)$인 부분이다. 따라서 넓이는 $\displaystyle\int_{-\pi/6}^{11\pi/6}\{f(x)-g_a(x)\}dx$이다.
      source_flow: 공식 해설 미공개 — 자체 풀이
      criteria:
      - 2-3.M1
    - id: 23b-2
      content: $f(x)-g_a(x)=2\sin\left(x-\dfrac\pi3\right)+2$이므로 $\displaystyle\int_{-\pi/6}^{11\pi/6}\left\{2\sin\left(x-\dfrac\pi3\right)+2\right\}dx$이다.
      source_flow: 공식 해설 미공개 — 자체 풀이
      criteria:
      - 2-3.M2
    - id: 23b-3
      content: 한 주기 동안 $\sin$의 적분은 $0$이므로 값은 $2\times2\pi=4\pi$이다.
      source_flow: 공식 해설 미공개 — 자체 풀이
      criteria:
      - 2-3.A1
