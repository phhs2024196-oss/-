key_idea: $f(x)-g(x)$를 삼각함수의 합성으로 정리하면 $f(x)-g(x)=2\sqrt{2-2\sin a}\,\sin(x+\varphi)+2$이고, 두 곡선이 접하는 것은 이 함수의 최솟값이 $0$인 것이므로 진폭이 $2$, 곧 $\sin a=\dfrac12$이다. 접점에서의 접선은 $f'(x_0)$와 $f(x_0)$로, 넓이는 한 주기 구간에서 $f-g=2\sin\left(x-\dfrac\pi3\right)+2$를 적분하여 구한다.
stuck: $g$를 평행이동한 $2\cos(x-a)$를 $\sin x$, $\cos x$의 일차결합으로 전개해 $f-g$를 합성하는 단계, 그리고 접점이 $f-g$의 최솟값 $0$이 되는 $x$($x=-\dfrac\pi6$)임을 찾고 넓이의 적분구간을 접점 사이 한 주기($x_0\sim x_0+2\pi$)로 잡는 단계.
