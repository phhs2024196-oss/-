      mark_type: M
      points: 4
      evidence: 접점의 $x$좌표 $-\dfrac\pi6$을 구했다.
      steps:
      - 22b-1
    - id: 2-2.M2
      mark_type: M
      points: 3
      evidence: 접점에서의 기울기 $\sqrt3$과 $y$좌표 $1$을 구했다.
      steps:
      - 22b-2
    - id: 2-2.A1
      mark_type: A
      points: 3
      evidence: 접선의 방정식을 구했다.
      depends_on:
      - 2-2.M2
      steps:
