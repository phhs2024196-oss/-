stimuli: []
stem: |
  【문제 2】 아래의 제시문을 읽고 문항별로 풀이와 함께 답하시오.

  사인함수 $y=\sin x$와 코사인함수 $y=\cos x$는 주기가 $2\pi$인 주기함수이며 그 그래프는 다음과 같다.

  [그림 1: $-2\pi\le x\le2\pi$에서 $y=\sin x$(실선)와 $y=\cos x$(점선)의 그래프. $x$축에 $-2\pi$, $-\pi$, $\pi$, $2\pi$, $y$축에 $1$, $-1$이 표시되어 있다.]

  함수 $y=\cos x$의 그래프를 $x$축의 방향으로 $a$만큼 평행이동하면 함수 $y=\cos(x-a)$의 그래프가 되고 $y$축의 방향으로 $b$만큼 평행이동하면 함수 $y=\cos x+b$의 그래프가 된다. 위의 그림에서 $y=\cos x$의 그래프를 $x$축의 방향으로 $\dfrac\pi2$만큼 평행이동하면 함수 $y=\sin x$의 그래프와 겹쳐지므로 임의의 실수 $x$에 대하여 $\cos\left(x-\dfrac\pi2\right)=\sin x$가 성립한다.
subparts:
- id: 2-1
  stem: |
    [문제 2-1] $f(x)=2\sin x+2$, $g(x)=2\cos x$ 라 하자. 함수 $g(x)$의 그래프를 $x$축을 따라 $a$만큼 평행이동 시킬 때, 오른편 그림과 같이 두 곡선이 접하게 되는 $a$값을 구하시오.

    [그림 2: $f(x)=2\sin x+2$의 그래프와 $g(x)$를 $x$축 방향으로 $a$만큼 평행이동한 곡선이 접하는 그림. $y$축에 $4$, $2$, $-2$, $x$축에 $\pi$, $2\pi$가 표시되어 있고 두 곡선 사이의 도형이 회색으로 칠해져 있으며 그 도형을 A라 표시했다. 접점은 $y$축 왼쪽 가까이에 있다.]
  points: 10
  depends_on: []
  answer:
    kind: value
    value: pi/6
    equivalents:
    - $a=\dfrac\pi6$ (그림에서 $0<a<\dfrac\pi2$로 읽은 값, $2\pi$의 정수배는 제외)
    tolerance: null
  solutions:
  - id: S21-B
    audience: B
    method_no: 1
    steps:
    - id: 21b-1
      content: 평행이동한 곡선은 $y=2\cos(x-a)=2\cos a\cos x+2\sin a\sin x$이므로 $f(x)-2\cos(x-a)=2(1-\sin a)\sin x-2\cos a\cos x+2$이다.
      source_flow: 공식 해설 미공개 — 자체 풀이
      criteria:
      - 2-1.M1
    - id: 21b-2
      content: 이 식은 $2\sqrt{(1-\sin a)^2+\cos^2a}\,\sin(x+\varphi)+2=2\sqrt{2-2\sin a}\,\sin(x+\varphi)+2$로 합성되고, 두 곡선이 접하려면 최솟값이 $0$이어야 하므로 $2\sqrt{2-2\sin a}=2$, 즉 $\sin a=\dfrac12$이다.
      source_flow: 공식 해설 미공개 — 자체 풀이
      criteria:
      - 2-1.M2
    - id: 21b-3
      content: 그림에서 $g$의 그래프는 오른쪽으로 $\dfrac\pi2$보다 작게 이동하므로 $a=\dfrac\pi6$이다. ($\sin a=\dfrac12$의 다른 해 $a=\dfrac{5\pi}6$은 대수적으로도 접하지만 그림의 위치와 맞지 않는다.)
      source_flow: 공식 해설 미공개 — 자체 풀이
      criteria:
      - 2-1.A1
  # 배점 미공개 — 임의 10점 · 채점기준 미공개 — 단계별 추정
