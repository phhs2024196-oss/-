      steps:
      - 21b-1
    - id: 2-1.M2
      mark_type: M
      points: 3
      evidence: 접할 조건을 $f-g_a$의 최솟값 $0$(진폭 $2$)으로 세워 $\sin a=\dfrac12$을 얻었다.
      steps:
      - 21b-2
    - id: 2-1.A1
      mark_type: A
      points: 3
      evidence: 그림에서 $a=\dfrac\pi6$을 택해 구했다.
      depends_on:
      - 2-1.M2
      steps:
      - 21b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 2-2
  stem: |
    [문제 2-2] 오른쪽 그림과 같이 두 곡선이 접할 때, 구간 $[-\pi,0]$ 사이의 접점에서 곡선 $f(x)=2\sin x+2$의 접선의 방정식을 구하시오.
  points: 10
  depends_on:
  - 2-1
  answer:
    kind: expression
    value: sqrt(3)*(x+pi/6)+1
    equivalents:
    - $y=\sqrt3\left(x+\dfrac\pi6\right)+1$
    tolerance: null
  solutions:
  - id: S22-B
    audience: B
    method_no: 1
    steps:
    - id: 22b-1
      content: $a=\dfrac\pi6$일 때 $f(x)-g_a(x)=\sin x-\sqrt3\cos x+2=2\sin\left(x-\dfrac\pi3\right)+2$이다. 이 값이 $0$이 되는 것은 $\sin\left(x-\dfrac\pi3\right)=-1$, 즉 $x=-\dfrac\pi6+2m\pi$이므로 구간 $[-\pi,0]$의 접점의 $x$좌표는 $-\dfrac\pi6$이다.
      source_flow: 공식 해설 미공개 — 자체 풀이
      criteria:
      - 2-2.M1
    - id: 22b-2
      content: $f(x)=2\sin x+2$에서 $f'(x)=2\cos x$이므로 $f'\left(-\dfrac\pi6\right)=\sqrt3$이고 $f\left(-\dfrac\pi6\right)=1$이다.
      source_flow: 공식 해설 미공개 — 자체 풀이
      criteria:
      - 2-2.M2
    - id: 22b-3
      content: 따라서 접선의 방정식은 $y=\sqrt3\left(x+\dfrac\pi6\right)+1$이다.
      source_flow: 공식 해설 미공개 — 자체 풀이
      criteria:
      - 2-2.A1
  # 배점 미공개 — 임의 10점 · 채점기준 미공개 — 단계별 추정
  rubric:
