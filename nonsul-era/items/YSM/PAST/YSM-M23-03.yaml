stimuli: []
stem: |
  【문제 3】 아래 물음에 답하시오.
subparts:
- id: 3-1
  stem: |
    [문제 3-1] 한 변의 길이가 4인 정사각형이 좌표평면의 제 1사분면에 오른편 그림과 같이 있다. 점 (0, 4)를 꼭짓점으로 갖고 점 (4, 0)을 지나는 아래로 오목한 포물선을 그렸을 때, 포물선과 $x$축, $y$축으로 둘러싸인 도형의 넓이를 구하시오.

    [그림 1: 꼭짓점이 $(0,4)$이고 $(4,0)$을 지나는 포물선이 한 변의 길이 4인 정사각형 안에 그려져 있다. 정사각형의 왼쪽 아래 꼭짓점이 원점 O이고 $x$축 위 $4$, $y$축 위 $4$가 표시되어 있다.]
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 32/3
    equivalents:
    - $\dfrac{32}{3}$
    tolerance: null
  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: 꼭짓점이 $(0,4)$이고 아래로 오목한 포물선이므로 $y=-cx^2+4$ ($c>0$)이고 $(4,0)$을 지나므로 $16c=4$, $c=\dfrac14$이다. 따라서 $y=4-\dfrac{x^2}{4}$이다.
      source_flow: 공식 해설 미공개 — 자체 풀이
      criteria:
      - 3-1.M1
    - id: 31b-2
      content: 도형의 넓이는 $\displaystyle\int_0^4\left(4-\dfrac{x^2}{4}\right)dx$이다.
      source_flow: 공식 해설 미공개 — 자체 풀이
      criteria:
      - 3-1.M2
    - id: 31b-3
      content: $\displaystyle\left[4x-\dfrac{x^3}{12}\right]_0^4=16-\dfrac{16}{3}=\dfrac{32}{3}$이다.
      source_flow: 공식 해설 미공개 — 자체 풀이
      criteria:
      - 3-1.A1
