  misconceptions: []
- id: 3-2
  stem: |
    [문제 3-2] 포물선과 $x$축, $y$축으로 둘러싸인 도형을 오른편 그림과 같이 포물선 위의 점 P를 지나는 수평선을 사용하여 A와 B로 나눌 때, A와 B의 넓이가 같아지도록 하는 점 P의 좌표를 구하시오.

    [그림 2: 3-1의 포물선과 $x$축, $y$축으로 둘러싸인 도형이 포물선 위의 점 P를 지나는 수평선으로 위쪽 도형 A와 아래쪽 도형 B로 나뉘어 있다. 정사각형의 꼭짓점 $(0,4)$, $(4,0)$이 표시되어 있다.]
  points: 10
  depends_on:
  - 3-1
  answer:
    kind: value
    value: p=2*2**(2/3); y=4-2*2**(1/3)
    equivalents:
    - $\mathrm{P}\left(2\sqrt[3]{4},\ 4-2\sqrt[3]{2}\right)$
    tolerance: null
  solutions:
  - id: S32-B
    audience: B
    method_no: 1
    steps:
    - id: 32b-1
      content: 점 P의 $x$좌표를 $p$ ($0<p<4$)라 하면 $\mathrm{P}\left(p,4-\dfrac{p^2}{4}\right)$이고 수평선은 $y=4-\dfrac{p^2}{4}$이다.
      source_flow: 공식 해설 미공개 — 자체 풀이
      criteria:
      - 3-2.M1
    - id: 32b-2
      content: 도형 A는 $0\le x\le p$에서 포물선과 수평선 사이이므로 넓이는 $\displaystyle\int_0^p\left\{\left(4-\dfrac{x^2}{4}\right)-\left(4-\dfrac{p^2}{4}\right)\right\}dx=\int_0^p\dfrac{p^2-x^2}{4}dx=\dfrac{p^3}{6}$이다.
      source_flow: 공식 해설 미공개 — 자체 풀이
      criteria:
      - 3-2.M2
    - id: 32b-3
      content: A와 B의 넓이가 같으면 A의 넓이는 전체의 절반 $\dfrac{16}{3}$이므로 $\dfrac{p^3}{6}=\dfrac{16}{3}$, $p^3=32$이다.
      source_flow: 공식 해설 미공개 — 자체 풀이
      criteria:
      - 3-2.M3
    - id: 32b-4
      content: $p=\sqrt[3]{32}=2\sqrt[3]{4}$이고 $y=4-\dfrac{p^2}{4}=4-\dfrac{(2\sqrt[3]{4})^2}{4}=4-2\sqrt[3]{2}$이다. 따라서 $\mathrm{P}\left(2\sqrt[3]{4},\ 4-2\sqrt[3]{2}\right)$이다.
      source_flow: 공식 해설 미공개 — 자체 풀이
      criteria:
      - 3-2.A1
