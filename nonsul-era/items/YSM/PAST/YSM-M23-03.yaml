key_idea: 꼭짓점이 $(0,4)$이고 $(4,0)$을 지나는 위로 볼록한(아래로 오목한) 포물선은 $y=4-\dfrac{x^2}{4}$이다. 넓이는 정적분으로 구하고, 점 $\mathrm{P}(p,4-\dfrac{p^2}{4})$를 지나는 수평선 위쪽 도형 A의 넓이 $\int_0^p\left(\dfrac{p^2}{4}-\dfrac{x^2}{4}\right)dx=\dfrac{p^3}{6}$이 전체 넓이의 절반이 되는 $p$를 구한다.
stuck: 포물선의 식 $y=4-\dfrac{x^2}{4}$을 세우는 단계(꼭짓점·통과점), 그리고 수평선으로 나뉜 도형 A의 넓이를 $x$에 대한 적분 $\int_0^p\{(4-\tfrac{x^2}{4})-(4-\tfrac{p^2}{4})\}dx$로 정확히 세우는 단계.
