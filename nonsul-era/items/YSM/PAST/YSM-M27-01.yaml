stimuli: []
stem: |-
  【문제 1】아래의 제시문을 읽고 문항별로 풀이와 함께 답하시오. (10점)

  양의 실수 $k$에 대하여 두 이차함수 $f_1(x)=2kx(1-x)$와 $f_2(x)=x(k-x)$를 정의한다. 동전을 던져서 앞면이 나오면 $f_1(x)$와 $x$축으로 둘러싸인 부분의 넓이 $S_1$을 계산하고, 뒷면이 나오면 $f_2(x)$와 $x$축으로 둘러싸인 부분의 넓이 $S_2$를 계산한다.
subparts:
- id: 1-1
  stem: '[문제 1-1] $S_1$과 $S_2$의 값을 구하여라. (5점)'
  points: 5
  depends_on: []
  answer:
    kind: value
    value: S1=k/3; S2=k**3/6
    equivalents:
    - $S_1=\dfrac k3$, $S_2=\dfrac{k^3}{6}$
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: $S_1=\displaystyle\int_0^12kx(1-x)dx=2k\left[\dfrac x2-\dfrac{x^2}3\right]_0^1=\dfrac k3$이다.
      source_flow: 예시답안 및 채점기준 p.18
      criteria:
      - 1-1.A1
    - id: 11b-2
      content: $S_2=\displaystyle\int_0^kx(k-x)dx=\left[\dfrac{kx^2}2-\dfrac{x^3}3\right]_0^k=\dfrac{k^3}6$이다.
      source_flow: 예시답안 및 채점기준 p.18
      criteria:
      - 1-1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-1.A1
      mark_type: A
      points: 3
      evidence: '$S_1=\dfrac k3$을 정적분으로 구했다. # 채점기준 미공개 — 단계별 추정'
      steps:
      - 11b-1
    - id: 1-1.A2
      mark_type: A
      points: 2
      evidence: '$S_2=\dfrac{k^3}6$을 정적분으로 구했다. # 채점기준 미공개 — 단계별 추정'
      depends_on:
      - 1-1.A1
      steps:
      - 11b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 1-2
  stem: '[문제 1-2] 동전 던지기의 결과와 관계없이 $S_1$과 $S_2$의 값이 같기 위한 $k$의 값을 구하고 이때의 넓이를 구하여라. (5점)'
  points: 5
  depends_on:
  - 1-1
  answer:
    kind: value
    value: k=sqrt(2); S=sqrt(2)/3
    equivalents:
    - $k=\sqrt2$, 넓이 $\dfrac{\sqrt2}{3}$
    tolerance: null
  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: $S_1$과 $S_2$의 값이 같기 위해서는 $\dfrac k3=\dfrac{k^3}6$ 식이 성립해야 한다. 따라서 $k(k^2-2)=0$ 식이 성립하고 $k$의 값이 양수이므로 $k=\sqrt2$의 결과를 얻을 수 있다.
      source_flow: 예시답안 및 채점기준 p.18
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: 이 결과를 대입하면 넓이 $S_1$, $S_2$의 값은 $\dfrac{\sqrt2}3$이다.
      source_flow: 예시답안 및 채점기준 p.18
      criteria:
      - 1-2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
