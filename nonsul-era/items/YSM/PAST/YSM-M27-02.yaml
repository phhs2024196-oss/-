stem: |-
  【문제 2】아래의 제시문을 읽고 문항별로 풀이와 함께 답하시오. (10점)

  자연수 $n\ge1$에 대하여 곡선

  $$y=1-x^n\ (0\le x\le1)$$

  과 $x$축, $y$축으로 둘러싸인 영역의 넓이를 $D_n$이라고 하자.
subparts:
- id: 2-1
  stem: '[문제 2-1] 영역 $D_n$의 넓이를 $n$에 대한 식으로 나타내시오. (4점)'
  points: 4
  depends_on: []
  answer:
    kind: value
    value: n/(n+1)
    equivalents:
    - $\dfrac{n}{n+1}$
    tolerance: null
  solutions:
  - id: S21-B
    audience: B
    method_no: 1
    steps:
    - id: 21b-1
      content: '$D_n$의 넓이: $\displaystyle\int_0^1(1-x^n)dx=\left[x-\dfrac{x^{n+1}}{n+1}\right]_0^1=1-\dfrac1{n+1}=\dfrac n{n+1}$이다.'
      source_flow: 예시답안 및 채점기준 p.18
      criteria:
      - 2-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2-1.A1
      mark_type: A
      points: 4
      evidence: '$D_n$의 넓이 $\dfrac n{n+1}$을 정적분으로 구했다. # 채점기준 미공개 — 단계별 추정'
      steps:
      - 21b-1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 2-2
  stem: '[문제 2-2] 5보다 같거나 작은 자연수 $a<b<c$에 대하여, $D_a$와 $D_b$로 둘러싸인 영역의 넓이와 $D_b$와 $D_c$로 둘러싸인 넓이가 서로 같도록 하는 자연수 $(a,\ b,\ c)$ 쌍을 모두 구하여라. (6점)'
  points: 6
  depends_on:
  - 2-1
  answer:
    kind: value
    value: (1,2,5); (2,3,5)
    equivalents:
    - $(a,b,c)=(1,2,5),(2,3,5)$
    tolerance: null
  solutions:
  - id: S22-B
    audience: B
    method_no: 1
    steps:
    - id: 22b-1
      content: $0\le x\le1$에서 $a<b$일 때 $D_a$와 $D_b$로 둘러싸인 영역의 넓이는 $\displaystyle\int_0^1\{(1-x^b)-(1-x^a)\}dx=\int_0^1(x^a-x^b)dx=\left[\dfrac{x^{a+1}}{a+1}-\dfrac{x^{b+1}}{b+1}\right]_0^1=\dfrac1{a+1}-\dfrac1{b+1}$이다. 마찬가지로 $b<c$일 때 $D_b$와 $D_c$로 둘러싸인 넓이는 $\dfrac1{b+1}-\dfrac1{c+1}$이 된다.
      source_flow: 예시답안 및 채점기준 p.18~19
      criteria:
      - 2-2.M1
    - id: 22b-2
      content: 따라서 두 넓이가 같다면 $\dfrac1{a+1}-\dfrac1{b+1}=\dfrac1{b+1}-\dfrac1{c+1}$이고, 이를 정리하면 $\dfrac1{a+1}+\dfrac1{c+1}=\dfrac2{b+1}$이 된다. 우선 $A=a+1$, $B=b+1$, $C=c+1$이라고 두면 $B=\dfrac{2AC}{A+C}$ $(2<A<B<C\le6)$이다. (공식 풀이에는 $2<A$로 적혀 있으나 $a\ge1$이므로 $A\ge2$이고 아래에서 $A=2$를 사용한다.)
      source_flow: 예시답안 및 채점기준 p.18~19
      criteria:
      - 2-2.M2
    - id: 22b-3
      content: $B$가 자연수가 되도록 하는 자연수 $A$와 $C$의 조합은 다음과 같이 구해진다. $(A=2,\ C=6)$일 때 $B=\dfrac{2\times2\times6}{2+6}=3$으로 만족한다. $(A=3,\ C=6)$일 때 $B=\dfrac{2\times3\times6}{2+6}=4$로 만족한다. 따라서 가능한 $(a,\ b,\ c)$ 조합은 $(1,\ 2,\ 5)$, $(2,\ 3,\ 5)$이다.
      source_flow: 예시답안 및 채점기준 p.18~19
      criteria:
      - 2-2.A1
