stem: |-
  【문제 3】아래의 제시문을 읽고 풀이와 함께 답하시오. (10점)

  방정식 $\left(\log_{\frac12}x^3\right)\left(\log_{\frac12}5x\right)=17$의 두 근을 $\alpha,\ \beta$라고 할 때, $\alpha\beta$의 값을 구하시오.
subparts:
- id: '3'
  stem: 방정식 $\left(\log_{\frac12}x^3\right)\left(\log_{\frac12}5x\right)=17$의 두 근을 $\alpha,\ \beta$라고 할 때, $\alpha\beta$의 값을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 1/5
    equivalents:
    - $\dfrac15$
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: $\log_{\frac12}x=t$라 하면 주어진 식 $\left(\log_{\frac12}x^3\right)\left(\log_{\frac12}5x\right)=17$에 의해 $\left(\log_{\frac12}x^3\right)\left(\log_{\frac12}5x\right)=\left(3\log_{\frac12}x\right)\left(\log_{\frac12}5+\log_{\frac12}x\right)=3t\left(\log_{\frac12}5+t\right)=17$이므로 이차방정식 $3t^2+3\left(\log_{\frac12}5\right)t-17=0$을 얻는다.
      source_flow: 예시답안 및 채점기준 p.19
      criteria:
      - 3.M1
    - id: 3b-2
      content: 이차방정식의 두 근을 $t_1,\ t_2$라 하면 이차방정식의 근과 계수의 관계로부터 $t_1+t_2=-\dfrac{3\log_{\frac12}5}{3}=-\log_{\frac12}5$ (1)이므로 $t_1+t_2=\log_{\frac12}\alpha+\log_{\frac12}\beta=\log_{\frac12}\alpha\beta$이고 $-\log_{\frac12}5=\log_{\frac12}\dfrac15$이 된다.
      source_flow: 예시답안 및 채점기준 p.19
      criteria:
      - 3.M2
    - id: 3b-3
      content: 이제 (1)식에 의해 다음 방정식을 풀면 된다. $\log_{\frac12}\alpha\beta=\log_{\frac12}\dfrac15$ 로그의 진수는 양수이므로 $\alpha\beta>0$이고 로그함수의 성질에 따라 $\alpha\beta=\dfrac15$이다. 이때 $\alpha\beta$가 양수이므로 주어진 방정식의 해가 된다.
      source_flow: 예시답안 및 채점기준 p.19
      criteria:
      - 3.A1
