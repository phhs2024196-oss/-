key_idea: $f'(x)=3(x-1)(x+1)$로 증감표를 그리고, $a\ge-1$이면 $f$가 $[a,1]$에서 감소하여 $m(a)=f(1)=0$, $a<-1$이면 $f(a)$와 $f(1)=0$ 중 작은 값이며 $f(a)=(a-1)^2(a+2)$의 부호로 $a<-2$를 가른다.
