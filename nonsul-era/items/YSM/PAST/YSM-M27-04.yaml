stem: |-
  【문제 4】아래의 제시문을 읽고 문항별로 풀이와 함께 답하시오. (10점)

  $a<1$인 실수 $a$에 대하여 닫힌구간 $[a,\ 1]$ 에서 함수 $f(x)=x^3-3x+2$의 최솟값을 $m(a)$라 할 때 다음 물음에 답하시오.
subparts:
- id: 4-1
  stem: '[문제 4-1] 함수 $m(a)$를 구하시오. (6점)'
  points: 6
  depends_on: []
  answer:
    kind: expression
    value: m1=a**3-3*a+2; m2=0
    equivalents:
    - $m(a)=\begin{cases}a^3-3a+2&(a<-2)\\0&(-2\le a<1)\end{cases}$
    tolerance: null
  solutions:
  - id: S41-B
    audience: B
    method_no: 1
    steps:
    - id: 41b-1
      content: $f'(x)=3x^2-3=3(x-1)(x+1)$이고 $f'(x)=0$에서 $x=-1$ 또는 $x=1$이다. 따라서 닫힌구간 $[a,\ 1]$에서 함수 $f(x)=x^3-3x+2$의 증가와 감소를 표로 나타내면 $f'(x)$는 $x=-1$ 앞에서 $+$, $x=-1$에서 $0$ $(f=4)$, 이후 $-$, $x=1$에서 $0$ $(f=0)$이다.
      source_flow: 예시답안 및 채점기준 p.20
      criteria:
      - 4-1.M1
    - id: 41b-2
      content: '(경우 1) $a\ge-1$: 구간 $[a,\ 1]$에서 함수 $f$는 감소하므로 최솟값 $m(a)=f(1)=0$ $(-1\le a<1)$이다.'
      source_flow: 예시답안 및 채점기준 p.20
      criteria:
      - 4-1.M2
    - id: 41b-3
      content: '(경우 2) $a<-1$: 구간 $[a,\ 1]$을 두 부분으로 나누면, $[a,\ -1]$에서 $f$는 증가하고 $[-1,\ 1]$에서 $f$는 감소하므로, $[a,\ -1]$에서 최솟값은 $f(a)$이고 $[-1,\ 1]$에서 최솟값은 $f(1)=0$이다. 따라서 $m(a)$는 $f(a)$와 $f(1)=0$ 중 작은 값이다. 이제 $f(a)<0$인 $a$를 구하면 $f(a)=a^3-3a+2=(a-1)^2(a+2)<0$이고 $(a-1)^2>0$이므로 $a+2<0\iff a<-2$이다.'
      source_flow: 예시답안 및 채점기준 p.20
      criteria:
      - 4-1.M2
    - id: 41b-4
      content: 따라서 $m(a)=\begin{cases}a^3-3a+2&(a<-2)\\0&(-2\le a<1)\end{cases}$이다.
      source_flow: 예시답안 및 채점기준 p.20
      criteria:
      - 4-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
