stimuli: []
stem: |-
  【문제 5】아래의 제시문을 읽고 풀이와 함께 답하시오. (10점)

  다음은 도함수의 정의에 따라 함수 $f(x)=|x|$의 도함수를 구하는 과정이다. 틀린 부분을 찾아서 그 이유를 쓰고, 올바르게 고치시오.

  $$\begin{aligned}f'(x)&=\lim_{h\to0}\dfrac{f(x+h)-f(x)}{h}&&\cdots\ ①\\&=\lim_{h\to0}\dfrac{|x+h|-|x|}{h}&&\cdots\ ②\\&=\lim_{h\to0}\dfrac hh&&\cdots\ ③\\&=1&&\cdots\ ④\end{aligned}$$
subparts:
- id: '5'
  stem: |-
    다음은 도함수의 정의에 따라 함수 $f(x)=|x|$의 도함수를 구하는 과정이다. 틀린 부분을 찾아서 그 이유를 쓰고, 올바르게 고치시오.

    $$\begin{aligned}f'(x)&=\lim_{h\to0}\dfrac{f(x+h)-f(x)}{h}&&\cdots\ ①\\&=\lim_{h\to0}\dfrac{|x+h|-|x|}{h}&&\cdots\ ②\\&=\lim_{h\to0}\dfrac hh&&\cdots\ ③\\&=1&&\cdots\ ④\end{aligned}$$
  points: 10
  depends_on: []
  answer:
    kind: value
    value: wrong=3; pos=1; neg=-1
    equivalents:
    - 틀린 부분 ③, $f^{\prime}(x)=1$ $(x>0)$, $-1$ $(x<0)$, $x=0$에서 미분 불가능
    tolerance: null
  solutions:
  - id: S5-B
    audience: B
    method_no: 1
    steps:
    - id: 5b-1
      content: 틀린 부분은 ③이다. ②에서 ③으로 넘어가기 위해서는 $|x+h|-|x|=h$가 성립해야 한다. 하지만 이는 일반적으로 성립하지 않으므로 틀렸다. 절댓값은 내부 값의 부호에 따라 $|t|=\begin{cases}t&(t\ge0)\\-t&(t<0)\end{cases}$로 정의되므로 $x>0$ 또는 $x<0$ 또는 $x=0$에 따라 경우를 나누어야 한다.
      source_flow: 예시답안 및 채점기준 p.21~22
      criteria:
      - 5.M1
    - id: 5b-2
      content: (1) $x>0$인 경우 $h$가 충분히 0에 가까우면 $x+h>0$이므로 $|x|=x$, $|x+h|=x+h$이고 $f'(x)=\displaystyle\lim_{h\to0}\dfrac{(x+h)-x}h=1$이다.
      source_flow: 예시답안 및 채점기준 p.21~22
      criteria:
      - 5.M2
    - id: 5b-3
      content: (2) $x<0$인 경우 $h$가 충분히 0에 가까우면 $x+h<0$이므로 $|x|=-x$, $|x+h|=-x-h$이고 $f'(x)=\displaystyle\lim_{h\to0}\dfrac{-x-h-(-x)}h=-1$이다.
      source_flow: 예시답안 및 채점기준 p.21~22
      criteria:
      - 5.M3
    - id: 5b-4
      content: '(3) $x=0$인 경우 $f''(0)=\displaystyle\lim_{h\to0}\dfrac{|h|}h$에서 좌우극한이 다르므로 미분 불가능하다. $\displaystyle\lim_{h\to0+}\dfrac{|h|}h=1\ne\lim_{h\to0-}\dfrac{|h|}h=-1$이다. (수정된 ③: $x>0$이면 $\displaystyle\lim_{h\to0}\dfrac hh$, $x\le0$이면 $\displaystyle\lim_{h\to0}\dfrac{-h}h$, 수정된 ④: $x>0$이면 $+1$, $x\le0$이면 $-1$이라는 공식 풀이 표기가 있다.)'
      source_flow: 예시답안 및 채점기준 p.21~22
      criteria:
      - 5.A1
