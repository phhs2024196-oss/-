stem: |-
  【문제 6】아래의 제시문을 읽고 풀이와 함께 답하시오. (10점)

  첫째항이 5인 등차수열 $\{a_n\}$의 첫째항으로부터 제 $n$항까지의 합을 $\{S_n\}$이라고 하자. $S_8=S_4+64$일 때, $a_{16}$을 구하시오.
subparts:
- id: '6'
  stem: 첫째항이 5인 등차수열 $\{a_n\}$의 첫째항으로부터 제 $n$항까지의 합을 $\{S_n\}$이라고 하자. $S_8=S_4+64$일 때, $a_{16}$을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '35'
    equivalents:
    - $a_{16}=35$
    tolerance: null
  solutions:
  - id: S6-B
    audience: B
    method_no: 1
    steps:
    - id: 6b-1
      content: 첫째항이 5인 등차수열 $\{a_n\}$에서 공차를 $d$라 두면 $a_n=5+(n-1)d$이다. 또, 첫째항부터 $n$항까지의 합 $\{S_n\}$은 $S_n=\dfrac n2\{2a_1+(n-1)d\}=\dfrac n2\{10+(n-1)d\}$이다.
      source_flow: 예시답안 및 채점기준 p.22~23
      criteria:
      - 6.M1
    - id: 6b-2
      content: 이제 조건 $S_8=S_4+64$를 이용한다. $S_8=\dfrac82(10+7d)=4(10+7d)=40+28d$이고, $S_4=\dfrac42(10+3d)=2(10+3d)=20+6d$이다.
      source_flow: 예시답안 및 채점기준 p.22~23
      criteria:
      - 6.M2
    - id: 6b-3
      content: 따라서 $40+28d=(20+6d)+64$이고, 다시 정리하면 $40+28d=84+6d$가 된다. 그러므로 $22d=44\Rightarrow d=2$이다.
      source_flow: 예시답안 및 채점기준 p.22~23
      criteria:
      - 6.A1
    - id: 6b-4
      content: $a_{16}=5+(16-1)d=5+15\cdot2=35$가 된다.
      source_flow: 예시답안 및 채점기준 p.22~23
      criteria:
      - 6.A2
