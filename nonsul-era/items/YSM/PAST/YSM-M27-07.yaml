stem: |-
  【문제 7】아래의 제시문을 읽고 풀이와 함께 답하시오. (10점)

  함수 $f(x)$는 닫힌 구간 $[1,\ 4]$에서

  $$f(x)=\begin{cases}x^2-2x+2&(1\le x\le2)\\a(x-2)^3+b&(2<x\le4)\end{cases}$$

  로 정의된다. 모든 실수 $x$에 대하여 $f(x)=f(x-3)$을 만족시키는 함수 $f(x)$가 실수 전체의 집합에서 연속일 때, $f(2026)$의 값을 구하시오. (단, $a$, $b$는 상수)
subparts:
- id: '7'
  stem: |-
    함수 $f(x)$는 닫힌 구간 $[1,\ 4]$에서

    $$f(x)=\begin{cases}x^2-2x+2&(1\le x\le2)\\a(x-2)^3+b&(2<x\le4)\end{cases}$$

    로 정의된다. 모든 실수 $x$에 대하여 $f(x)=f(x-3)$을 만족시키는 함수 $f(x)$가 실수 전체의 집합에서 연속일 때, $f(2026)$의 값을 구하시오. (단, $a$, $b$는 상수)
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '1'
    equivalents:
    - $f(2026)=1$ ($b=2$, $a=-\dfrac18$)
    tolerance: null
  solutions:
  - id: S7-B
    audience: B
    method_no: 1
    steps:
    - id: 7b-1
      content: 모든 실수 $x$에 대하여 $f(x)=f(x-3)$이므로 함수 $f(x)$는 주기가 3인 함수이다. 또한 함수 $f(x)$는 실수 전체의 집합에서 연속이므로 $x=2$에서 연속이다.
      source_flow: 예시답안 및 채점기준 p.23~24
      criteria:
      - 7.M1
    - id: 7b-2
      content: (1) $x=2$에서 연속이므로 $f(2)=\displaystyle\lim_{x\to2+}f(x)=\lim_{x\to2-}f(x)$이다. $f(2)=2^2-2\cdot2+2=2$이고 $\displaystyle\lim_{x\to2+}f(x)=\lim_{x\to2+}\{a(x-2)^3+b\}=b$이므로 $b=2$이다.
      source_flow: 예시답안 및 채점기준 p.23~24
      criteria:
      - 7.A1
    - id: 7b-3
      content: 또한, 함수 $f(x)$는 주기가 3이므로 $f(4)=f(1)$이 된다. $f(1)=1-2\cdot1+2=1$이고 $f(4)=2^3a+b=8a+b=8a+2$이므로, $8a+2=1$이고 $a=-\dfrac18$이 된다.
      source_flow: 예시답안 및 채점기준 p.23~24
      criteria:
      - 7.A2
    - id: 7b-4
      content: 이제, $2026=3\cdot675+1$이고 함수 $f(x)$는 주기 3을 갖기 때문에 $f(2026)=f(1)=1$이다.
      source_flow: 예시답안 및 채점기준 p.23~24
      criteria:
      - 7.A3
