stem: |-
  【문제 8】아래의 제시문을 읽고 풀이와 함께 답하시오. (10점)

  실수 $x\in[-\pi/2,\ \pi/2]$에 대하여 점 A를 $\mathrm{A}(x,\ 0)$라 하자. 점 A를 지나고 $x$축에 수직인 직선이 곡선 $y=\sin x$와 만나는 점을 D라 하자. 또 점 A와 D를 각각 $y$축에 대하여 대칭이동한 점을 각각 B, C라 할 때 사각형 ABCD는 직사각형이 된다. 이 직사각형 ABCD의 넓이를 $S(x)$라 할 때 다음에 주어진 정적분의 값을 구하시오.

  $$\int_{-\pi/2}^{\pi/2}S(x)\,dx$$
subparts:
- id: '8'
  stem: |-
    실수 $x\in[-\pi/2,\ \pi/2]$에 대하여 점 A를 $\mathrm{A}(x,\ 0)$라 하자. 점 A를 지나고 $x$축에 수직인 직선이 곡선 $y=\sin x$와 만나는 점을 D라 하자. 또 점 A와 D를 각각 $y$축에 대하여 대칭이동한 점을 각각 B, C라 할 때 사각형 ABCD는 직사각형이 된다. 이 직사각형 ABCD의 넓이를 $S(x)$라 할 때 다음에 주어진 정적분의 값을 구하시오.

    $$\int_{-\pi/2}^{\pi/2}S(x)\,dx$$
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '4'
    equivalents:
    - $4$
    tolerance: null
  solutions:
  - id: S8-B
    audience: B
    method_no: 1
    steps:
    - id: 8b-1
      content: 점 A의 좌표는 $\mathrm{A}(x,\ 0)$이고, 점 A를 지나고 $x$축에 수직인 직선이 곡선 $y=\sin x$와 만나는 점은 $\mathrm{D}(x,\ \sin x)$이다. 점 A와 D를 각각 $y$축에 대하여 대칭이동한 점 B, C는 각각 $\mathrm{B}(-x,\ 0)$, $\mathrm{C}(-x,\ \sin x)$이다.
      source_flow: 예시답안 및 채점기준 p.24~26
      criteria:
      - 8.M1
    - id: 8b-2
      content: 따라서 직사각형 ABCD의 가로와 세로 길이는 각각 $|x-(-x)|=2|x|$, $|\sin x-0|=|\sin x|$이다. 그러므로 넓이 $S(x)$는 $S(x)=2|x||\sin x|$이다.
      source_flow: 예시답안 및 채점기준 p.24~26
      criteria:
      - 8.M2
    - id: 8b-3
      content: 그런데 $x\in\left[-\dfrac\pi2,\ \dfrac\pi2\right]$에서 $x$와 $\sin x$는 항상 부호가 같으므로 $|x||\sin x|=x\sin x$이다. 따라서 넓이 $S(x)=2x\sin x$로 나타낼 수 있고, $S(-x)=2(-x)\sin(-x)=2x\sin x=S(x)$이므로 $S(x)$는 우함수이다.
      source_flow: 예시답안 및 채점기준 p.24~26
      criteria:
      - 8.M3
    - id: 8b-4
      content: 따라서 $\displaystyle\int_{-\pi/2}^{\pi/2}S(x)dx=2\int_0^{\pi/2}S(x)dx=2\int_0^{\pi/2}2x\sin x\,dx=4\int_0^{\pi/2}x\sin x\,dx$이다.
      source_flow: 예시답안 및 채점기준 p.24~26
      criteria:
      - 8.A1
    - id: 8b-5
      content: 부분적분을 이용하면 $\displaystyle\int x\sin x\,dx=-x\cos x+\sin x$이므로 $4\left[-x\cos x+\sin x\right]_0^{\pi/2}=4\left\{\left(-\dfrac\pi2\cos\dfrac\pi2+\sin\dfrac\pi2\right)-(0\cdot\cos0+\sin0)\right\}=4(1-0)=4$이다. 따라서 구하는 값은 4이다.
      source_flow: 예시답안 및 채점기준 p.24~26
      criteria:
      - 8.A2
