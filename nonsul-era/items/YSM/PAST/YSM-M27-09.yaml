stem: |-
  【문제 9】아래의 제시문을 읽고 문제에 답하시오. (10점)

  김연세 연구원은 미래생명공학연구원에서 세포의 분화를 연구하기 위해 다양한 동물세포주를 개발하고 배양을 진행하는 프로젝트에 참여 중이다. 김 연구원은 피부 조직에서 유래한 상피세포주를 개발 중인데, 이 과정에서 2일에 1회 세포분열이 이루어지는 A type의 세포와 1일에 1회씩 세포분열이 이루어지는 B type의 세포가 각각 80%와 20%씩 섞여 있는 100,000개의 세포들을 획득하였다. 이 세포들을 배양하여 A type 세포가 20%, B type 세포가 80%가 될 때까지 배양하기 위해서는 며칠이 걸리고, 이때 각각 몇 개의 세포들이 얻어질 수 있을지 설명하시오.
