  answer:
    kind: value
    value: day7_A=640000; day7_B=2560000; day8_A=1280000; day8_B=5120000
    equivalents:
    - 7일차(A 640,000개, B 2,560,000개)와 8일차(A 1,280,000개, B 5,120,000개) 모두 A:B=20:80
    tolerance: null
  solutions:
  - id: S9-B
    audience: B
    method_no: 1
    steps:
    - id: 9b-1
      content: A type은 2일에 1회, B type은 1일에 1회 분열하므로 세포수가 2배가 된다는 것을 이해하고 날짜별로 계산한다. 처음 A 80,000개, B 20,000개이다.
      source_flow: 예시답안 및 채점기준 p.26~27
      criteria:
      - 9.M1
    - id: 9b-2
      content: '(테이블 풀이) DAY1: A 80,000 / B 40,000, DAY2: A 160,000 / B 80,000, DAY3: A 160,000 / B 160,000, DAY4: A 320,000 / B 320,000, DAY5: A 320,000 / B 640,000, DAY6: A 640,000 / B 1,280,000, DAY7: A 640,000 / B 2,560,000, DAY8: A 1,280,000 / B 5,120,000이고 DAY7, DAY8에서 A세포:B세포 $=20:80$이다.'
      source_flow: 예시답안 및 채점기준 p.26~27
      criteria:
      - 9.M2
    - id: 9b-3
      content: (식 풀이) 경과일 수를 $N$이라 하면 A 세포수 $=80000\times2^{\frac N2}$ ($\frac N2$가 정수가 아닐 때는 분열 안 하는 것으로 간주), B 세포수 $=20000\times2^N$이다. 따라서 $\dfrac{B\text{세포수}}{A\text{세포수}}=\dfrac{20000\times2^N}{80000\times2^{\frac N2}}=\dfrac{80}{20}=4$이고 정리하면 $2^N=2^{\frac N2}\cdot16=2^{\frac N2+4}\Rightarrow N=\dfrac N2+4\Rightarrow2N=N+8\therefore N=8$이다.
      source_flow: 예시답안 및 채점기준 p.26~27
      criteria:
      - 9.A1
    - id: 9b-4
      content: (최상) 위의 결과에서 7일 째도 해당됨을 캐치하고 근거를 제시한다. A는 2일에 1회, B는 1일에 1회 분열하므로, 7일차와 8일차에 두 세포의 비율이 $20:80$이 된다.
      source_flow: 예시답안 및 채점기준 p.26~27
      criteria:
      - 9.A2
