    tolerance: null
  solutions:
  - id: S1023-B
    audience: B
    method_no: 1
    steps:
    - id: 1023b-1
      content: 우주 공간에서는 외부 기준점이 거의 없고, 미세한 추진력과 자세 제어에 의해 움직임이 조절된다. 따라서 변화율이 특정 구간에서 크게 증가하는 경우, 제어 부담이 특정 시점에 집중될 수 있다.
      source_flow: 예시답안 및 채점기준 p.28~29
      criteria:
