- id: 10-2-2
  stem: 2) 우주선이 어느 시간 구간에서 더 많은 거리를 이동하는지 그래프의 면적을 이용하여 설명하시오. (3점)
  points: 3
  depends_on: []
  answer:
    kind: value
    value: 0<t<3 속도 증가, 3<t<6 감소 → 중간(t=3 부근)에 이동 집중
    equivalents:
    - 누적량 $A(t)=\int_0^tf(s)ds$, $A^{\prime}(t)=f(t)$
    tolerance: null
  solutions:
  - id: S1022-B
    audience: B
    method_no: 1
    steps:
    - id: 1022b-1
      content: '누적 변위를 $A(t)=\displaystyle\int_0^tf(s)ds$라고 하면, $A''(t)=f(t)$이다. 따라서, 누적량의 증가 속도는 속도 함수 $f(t)$의 값에 의해 결정된다. $0<t<3$: $f(t)$ 증가 $\Rightarrow$ 누적량 $A(t)$ 점점 빠르게 증가, $3<t<6$: $f(t)$ 감소 $\Rightarrow$ 누적량 여전히 증가하지만, 증가 속도 감소이다.'
      source_flow: 예시답안 및 채점기준 p.28
      criteria:
      - 10-2-2.M1
    - id: 1022b-2
      content: 또한 $f(0)=f(6)=0$이므로 누적량 그래프의 기울기는 시작점과 끝점에서 0이 된다. 즉, 누적량은 전체적으로 증가하지만, $t=3$ 부근에서 가장 빠르게 증가하며, 움직임은 중간 시간대에 상대적으로 집중되는 분포를 가진다고 해석할 수 있다.
      source_flow: 예시답안 및 채점기준 p.28
      criteria:
      - 10-2-2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
