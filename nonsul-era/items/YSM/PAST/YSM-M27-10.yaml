stimuli: []
stem: |-
  【문제 10】아래의 제시문을 읽고 문항별로 답하시오. (10점)

  인류는 화성 탐사를 위해 새로운 소형 탐사 우주선을 개발하였다. 이 우주선은 화성 대기권 진입 후 일정 시간 동안 추진기를 이용해 속도를 조절하며 이동한다. 연구팀은 우주선의 속도가 시간에 따라 다음과 같은 함수로 표현된다는 것을 알아냈다.

  $$f(t)=-t^2+6t\qquad(0\le t\le6)$$

  여기서, $t$: 시간 (초), $f(t)$: 우주선의 속도 (m/s)

  이 속도 모델을 이용하여 우주선의 이동을 분석하려 한다.
subparts:
- id: 10-1
  stem: '[문제 10-1] 우주선이 $t=0$초부터 $t=6$초까지 이동한 변위를 정적분을 이용하여 구하여라. (2점)'
  points: 2
  depends_on: []
  answer:
    kind: value
    value: '36'
    equivalents:
    - $36$
    tolerance: null
  solutions:
  - id: S101-B
    audience: B
    method_no: 1
    steps:
    - id: 101b-1
      content: 우주선의 변위는 속도의 정적분으로 구한다. $\displaystyle\int_0^6f(t)dt=\int_0^6(-t^2+6t)dt=\left[-\dfrac{t^3}{3}+3t^2\right]_0^6=\left(-\dfrac{216}{3}+3\cdot36\right)-0=(-72+108)=36$이다. 따라서, 전체 변위는 36이다.
      source_flow: 예시답안 및 채점기준 p.27
      criteria:
      - 10-1.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
