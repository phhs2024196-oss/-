    - id: 1023b-2
      content: 누적량 $A(t)$가 시간에 따라 보다 일정한 속도로 증가하려면 $A'(t)=f(t)$이므로, 속도 함수 $f(t)$가 시간 전체에 걸쳐 비교적 균등한 값을 갖는 것이 바람직하다.
      source_flow: 예시답안 및 채점기준 p.28~29
      criteria:
      - 10-2-3.M2
    - id: 1023b-3
      content: 현재 함수는 중앙에서 큰 피크를 갖는 포물선 형태이므로, 움직임이 중간 구간에 집중되는 특성을 가진다. 보다 안정적인 제어를 위해서는 최고점(피크)을 낮추고, 증가와 감소를 완만하게 하여, 시간 전반에 걸쳐 움직임이 분산되도록 그래프 형태를 조정하는 것이 바람직하다.
      source_flow: 예시답안 및 채점기준 p.28~29
