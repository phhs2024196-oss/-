- id: 10-2-1
  stem: |-
    [문제 10-2] 함수 $f(t)$의 그래프를 바탕으로 다음을 설명하시오.

    1) 시간이 증가함에 따라 우주선의 속도가 어떻게 변하는지 설명하시오. (2점)
  points: 2
  depends_on: []
  answer:
    kind: value
    value: 꼭짓점 (3,9), 속도 0→최대 9→0
    equivalents:
    - $t=0$에서 $0$, $t=3$까지 증가, 3초에 최대속도 $9$, 이후 감소해 $t=6$에서 $0$
    tolerance: null
  solutions:
  - id: S1021-B
    audience: B
    method_no: 1
    steps:
    - id: 1021b-1
      content: 이 함수는 아래로 열린 포물선이다. $f(t)=-(t-3)^2+9$이므로 꼭짓점은 $(t,\ f(t))=(3,\ 9)$이다. 또한 $f(0)=0$, $f(6)=0$이므로 속도는 $t=0$에서 0으로 시작하여, $t=3$까지 증가하고, 3초 최대속도, 이후 감소하여 $t=6$에서 속도가 다시 0이 된다. 따라서, 움직임은 시간 전체에 균등하게 분포되지 않고, 속도 함수가 $t=3$에서 최대값을 가지므로, 누적 변위는 $t=3$ 부근에서 가장 빠르게 증가한다.
      source_flow: 예시답안 및 채점기준 p.27~28
      criteria:
      - 10-2-1.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
