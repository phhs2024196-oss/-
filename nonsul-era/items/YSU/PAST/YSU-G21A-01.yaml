intent: |
  「수학」 조합의 기본 개념과 원리를 묻는다. 조합의 수로 경우의 수 $f(k)$를 세우고, 이웃한 항의 비를 비교해 최대가 되는 $k$를 찾는 논리적 사고력을 평가한다(문항카드 출제 의도 요지).
key_idea: |
  $f(k)={}_{100}\mathrm{C}_k\times{}_k\mathrm{C}_2\times{}_{k-2}\mathrm{C}_5=\dfrac{100!}{2!\,5!\,(100-k)!\,(k-7)!}$의 연속한 항의 비 $\dfrac{f(k)}{f(k+1)}=\dfrac{k-6}{100-k}$를 1과 비교한다.
stuck: |
  계승이 얽힌 식을 그대로 비교하지 않고 이웃한 항의 비로 바꾸는 발상, 그리고 비가 정확히 1이 되는 경우 최댓값이 두 곳에서 나온다는 점
