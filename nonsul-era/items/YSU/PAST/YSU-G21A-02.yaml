intent: |
  「수학Ⅰ」·「미적분」의 사인함수·코사인함수, 주기, 치환적분법의 기본 개념과 원리를 묻는다. 함수방정식에 적절한 값을 대입해 주기성과 $g(x)$의 꼴을 이끌어 내는 논리적 사고력을 평가한다(문항카드 출제 의도 요지).
key_idea: |
  $b=\tfrac12$를 대입하면 $g(a+1)=-g(a)$로 주기 2, 따라서 $g(0)=g(2020)=1$. $a=0$, $b=x$에서 $g(x)+g(-x)=2\cos\pi x$, 세 대입식을 조합하면 $g(x)=\cos\pi x+g\!\left(\tfrac12\right)\sin\pi x$.
stuck: |
  조건 (가)의 $g(2020)$을 $g(0)$으로 옮기는 주기성 발견, 그리고 (2-2)에서 세 대입식을 조합해 $g(x)$를 결정하는 발상
