stem: |
  함수 $f(x)=ax^2+bx+c$ ($a$, $b$, $c$는 정수)에 대하여, 닫힌구간 $[2019,2021]$에서 $|f(x)|$의 최댓값이 $1$이 되도록 하는 함수 $f(x)$의 개수를 구하시오. [12점]

subparts:
- id: '1'
  stem: |
    위 물음에 답하시오.
  points: 12
  depends_on: []
  answer: {kind: value, value: '10', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $[-1,1]$로 옮긴 뒤 $a\in\{-2,\dots,2\}$, $b',c'\in\{-1,0,1\}$ 안에서 조건을 만족하는 $p(t)$를 센다.
    steps:
    - {id: 1a, content: '$p(t)=-2t^2+1,\ -t^2+1,\ -t^2,\ -t,\ -1,\ 1,\ t,\ t^2-1,\ t^2,\ 2t^2-1$의 $10$개', criteria: [1.M1, 1.M2, 1.R1, 1.A1]}
    hint_ladder:
    - 구간의 가운데 $2020$을 원점으로 옮겨 보자. 계수는 여전히 정수인가?
    - $t=-1,0,1$에서의 값으로 계수의 범위를 묶어 보자.
  - id: S1-B
    audience: B
    source_flow: 2021 선행학습 영향평가 결과보고서 문항카드 7 문항 해설
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $ax^2+bx+c=a(x-2020)^2+(4040a+b)(x-2020)+a(2020)^2+b(2020)+c$.
        $b'=b+4040a$, $c'=c+2020b+4080400a$라 하자. $t=x-2020$이라 하고 $p(t)=at^2+b't+c'$이라 하면, 닫힌 구간 $[-1,1]$에서 $|p(t)|$의 최댓값이 $1$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        따라서 $-1\le p(-1)=a-b'+c'\le1$, $-1\le p(1)=a+b'+c'\le1$, $-1\le p(0)=c'\le1$이어야 하므로 $-2\le 2a+2c'\le2$, $-2\le2b'\le2$이다.
        그러므로 $-2\le a\le2$, $-1\le b'\le1$, $-1\le c'\le1$이 필요조건이고, $a$, $b'$, $c'$이 정수이므로 $a=-2,-1,0,1,2$, $b'=-1,0,1$, $c'=-1,0,1$이 가능한 모든 경우이다.
      criteria: [1.M2]
    - id: 1b-3
      content: |
        1. $a=-2$인 경우: $b'=-1$이면 $p(t)=-2t^2-t+c'$은 $[-1,1]$에서 최댓값 $\dfrac18+c'$와 최솟값 $-3+c'$을 가지므로 $|p(t)|$의 최댓값이 $1$일 수 없다. 마찬가지로 $b'=1$도 불가능하다. $b'=0$이면 $p(t)=-2t^2+1$이 조건을 만족한다.
        2. $a=-1$인 경우: $b'=-1$이면 $p(t)=-t^2-t+c'$은 최댓값 $\dfrac14+c'$와 최솟값 $-2+c'$을 가지므로 불가능하다. 마찬가지로 $b'=1$도 불가능하다. $b'=0$이면 $p(t)=-t^2+1$과 $p(t)=-t^2$이 조건을 만족한다.
        3. $a=0$인 경우: $b'=-1$이면 $p(t)=-t$, $b'=0$이면 $p(t)=-1$과 $p(t)=1$, $b'=1$이면 $p(t)=t$가 조건을 만족한다.
        4. $a=1$ 또는 $a=2$인 경우: 1, 2의 경우와 마찬가지로 $p(t)=t^2-1$, $p(t)=2t^2-1$, $p(t)=t^2$이 각각 조건을 만족한다.
      criteria: [1.R1]
    - id: 1b-4
      content: |
        따라서 $p(t)=-2t^2+1$, $-t^2+1$, $-t^2$, $-t$, $-1$, $1$, $t$, $t^2-1$, $t^2$, $2t^2-1$로 $10$개이고, 주어진 조건을 만족하는 함수 $f(x)$는 $10$개다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
