intent: |
  「수학」 이차함수의 최대·최소, 직선의 방정식, 평행이동의 기본 개념과 원리를 묻는다. 구간을 $[-1,1]$로 평행이동해 정수 계수 조건을 유지한 채 필요조건으로 범위를 좁히고 경우를 나누어 세는 능력을 평가한다(문항카드 출제 의도 요지).
key_idea: |
  $t=x-2020$으로 평행이동하면 $p(t)=at^2+b't+c'$ ($a,b',c'$ 정수)이고 $[-1,1]$에서 $|p|\le1$이려면 $p(-1)$, $p(0)$, $p(1)$로부터 $-2\le a\le2$, $-1\le b'\le1$, $-1\le c'\le1$.
stuck: |
  큰 구간 $[2019,2021]$을 $[-1,1]$로 옮기면서 정수 계수가 유지됨을 알아차리는 것, 그리고 세 점의 값으로 계수 범위를 묶는 필요조건
