      evidence: |
        $t=x-2020$으로 평행이동하여 정수 계수 $p(t)=at^2+b't+c'$의 $[-1,1]$ 문제로 바꿨다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: |
        $p(-1)$, $p(0)$, $p(1)$의 범위로 $-2\le a\le2$, $|b'|\le1$, $|c'|\le1$의 필요조건을 얻었다.
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-2]
    - id: 1.R1
      mark_type: R
      points: 4
      evidence: |
        $a$(와 $b'$)에 따라 경우를 나누어 각 경우에 조건을 만족하는 함수를 빠짐없이 판정했다(특히 $a=\pm1,\pm2$에서 $b'=\pm1$ 불가).
      depends_on: [1.M2]
      steps: [1b-3]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        개수 $10$을 답했다.
      depends_on: [1.R1]
      steps: [1b-4]
