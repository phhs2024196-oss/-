intent: |
  「수학」·「확률과 통계」의 합의 법칙과 조건부확률의 기본 개념과 원리를 묻는다. 소인수분해 지수의 합과 곱이 같아지는 조건을 소인수의 개수별로 분류해 빠짐없이 세고 조건부확률로 연결하는 능력을 평가한다(문항카드 출제 의도 요지).
key_idea: |
  지수 $n_1,\dots,n_r$에 대해 $\sum n_i=\prod n_i$인 경우는 $r=1$(모든 소수 거듭제곱), $r=2$일 때 $(2,2)$, $r=3$일 때 $\{1,2,3\}$, $r=4$일 때 $\{1,1,2,4\}$뿐이고, $2021$ 이하라는 크기 제한으로 소수 $p_i$를 센다.
stuck: |
  지수 방정식 $n_1+\cdots+n_r=n_1\cdots n_r$의 해를 소인수 개수별로 정리하는 것, 그리고 $r=3$에서 지수 배치마다 $2021$ 이하를 만족하는 소수 조합을 빠짐없이 세는 것
