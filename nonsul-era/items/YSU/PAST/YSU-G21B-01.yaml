stimuli: []

stem: |
  한 개의 주사위를 3번 던져 나온 눈의 수를 차례로 $a,b,c$라 하자. 이차방정식 $x^2+y^2+ax+by+6=0$이 원을 나타낼 때, 방정식 $x+2y+c=0$이 나타내는 직선이 이 원의 넓이를 이등분할 확률을 구하시오. [10점]

subparts:
- id: '1'
  stem: |
    위 확률을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '1/23', equivalents: ['6/138'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 원이 될 $(a,b)$는 23쌍, 표본공간 138가지 중 $c=\dfrac a2+b$인 경우 6가지.
    steps:
    - {id: 1a, content: '$a^2+b^2>24$인 $(a,b)$ 23쌍, $c=\tfrac a2+b$인 $(a,b,c)$ 6가지 $\Rightarrow \tfrac{6}{138}=\tfrac1{23}$', criteria: ['1.M1', '1.A1', '1.M2', '1.A2']}
    hint_ladder:
    - 원의 방정식을 표준형으로 바꾸면 원이 될 조건은 무엇인가?
    - 원의 넓이를 이등분하는 직선은 어느 점을 지나야 하는가?
  - id: S1-B
    audience: B
    source_flow: 2021 선행학습 영향평가 결과보고서 문항카드 9 문항 해설
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\left(x+\dfrac a2\right)^2+\left(y+\dfrac b2\right)^2=\dfrac{a^2+b^2-24}{4}$이므로 이차방정식이 원을 나타내려면 $\dfrac{a^2+b^2-24}{4}>0$, 즉 $a^2+b^2>24$를 만족해야 한다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $a=1$일 때 $b=5,6$; $a=2$일 때 $b=5,6$; $a=3$일 때 $b=4,5,6$; $a=4$일 때 $b=3,4,5,6$; $a=5$일 때 $b=1,\dots,6$; $a=6$일 때 $b=1,\dots,6$. 순서쌍 $(a,b)$는 모두 23가지이고, 이때 $c$는 모든 수가 가능하므로 전체 경우의 수는 $23\times6=138$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        직선이 이 원의 넓이를 이등분하려면 원의 중심 $\left(-\dfrac a2,-\dfrac b2\right)$를 지나야 하므로 $c=\dfrac a2+b$를 만족해야 한다.
      criteria: ['1.M2']
    - id: 1b-4
      content: |
        $c=\dfrac a2+b$와 $a^2+b^2>24$를 동시에 만족하는 경우는 $a=2$일 때 $(b,c)=(5,6)$; $a=4$일 때 $(3,5),(4,6)$; $a=6$일 때 $(1,4),(2,5),(3,6)$으로 모두 6가지이다. 따라서 구하는 확률은 $\dfrac{6}{138}=\dfrac1{23}$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        완전제곱식으로 바꾸어 원이 될 조건 $a^2+b^2>24$를 적었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        조건을 만족하는 $(a,b)$ 23쌍과 표본공간 $138$가지를 구했다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: |
        넓이 이등분 조건을 중심 $\left(-\dfrac a2,-\dfrac b2\right)$ 통과, 즉 $c=\dfrac a2+b$로 나타냈다.
      depends_on: []
      implied_ok: false
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: |
        두 조건을 모두 만족하는 6가지를 나열하고 확률 $\dfrac1{23}$을 얻었다.
      depends_on: [1.M2, 1.A1]
      steps: [1b-4]
    deductions: []
