  원이 될 조건 $a^2+b^2>24$로 표본공간을 제한하고, 넓이 이등분은 직선이 원의 중심 $\left(-\dfrac a2,-\dfrac b2\right)$를 지나는 것($c=\dfrac a2+b$)과 같다.
