stimuli:
- label: 제시문
  body: |
    어떤 삼각형 $\mathrm{ABC}$가 있을 때, 사각형 $\mathrm{PQRS}$가 직사각형이 되도록 삼각형 $\mathrm{ABC}$의 세 변 위의 네 점 $\mathrm{P},\mathrm{Q},\mathrm{R},\mathrm{S}$를 선택한다. 다음 물음에 답하시오.

stem: |
  [제시문]의 삼각형 $\mathrm{ABC}$와 직사각형 $\mathrm{PQRS}$에 대하여 다음 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    [문제 3-1] 사각형 $\mathrm{PQRS}$의 넓이가 최대일 때, 삼각형 $\mathrm{ABC}$의 넓이와 사각형 $\mathrm{PQRS}$의 넓이의 차가 $43$이라 하자. 이 때, 삼각형 $\mathrm{ABC}$의 넓이를 구하시오. [5점]
  points: 5
  depends_on: []
  answer: {kind: value, value: '86', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 직사각형 넓이 $t(1-t)ah$의 최댓값 $\dfrac14ah$는 삼각형 넓이의 절반이므로 삼각형 넓이 $=2\times43$.
    steps:
    - {id: 1a, content: '$S(t)=t(1-t)ah\le\tfrac14ah=\tfrac12\cdot\tfrac{ah}{2}\Rightarrow \tfrac{ah}{2}=86$', criteria: ['1.M1', '1.A1', '1.A2']}
    hint_ladder:
    - 직사각형의 윗변이 꼭짓점 A로부터 어느 비율의 위치에 있는지를 변수로 두자.
  - id: S1-B
    audience: B
    source_flow: 2021 선행학습 영향평가 결과보고서 문항카드 11 문항 해설 [문제 3-1]
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        꼭짓점 $\mathrm{A}$에서 밑변 $\mathrm{BC}$에 수선의 발을 내릴 수 없으면 사각형이 내접할 수 없으므로, 일반성을 잃지 않고 $\mathrm{Q},\mathrm{R}$이 변 $\mathrm{BC}$ 위에, $\mathrm{P}$가 변 $\mathrm{AB}$ 위에, $\mathrm{S}$가 변 $\mathrm{AC}$ 위에 있다고 하자(각 $\mathrm{ABC}$나 $\mathrm{ACB}$가 직각인 경우도 포함). [그림] 밑변 BC 위에 Q, R, 변 AB 위에 P, 변 AC 위에 S가 있는 내접 직사각형.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        삼각형 $\mathrm{ABC}$의 밑변의 길이를 $a$, 높이를 $h$라 하자. 삼각형 $\mathrm{ABC}$와 삼각형 $\mathrm{APS}$는 닮음이므로 닮음비를 $1:t\ (0<t<1)$라 하면, 사각형 $\mathrm{PQRS}$의 가로의 길이는 $ta$, 세로의 길이는 $(1-t)h$이다.
      criteria: ['1.M1']
    - id: 1b-3
      content: |
        사각형 $\mathrm{PQRS}$의 넓이는 $S(t)=ta\times(1-t)h=t(1-t)ah$이고 $t=\dfrac12$에서 최댓값 $\dfrac14ah$를 갖는다. 이때 가로와 세로의 길이는 각각 $\dfrac a2,\dfrac h2$이다.
      criteria: ['1.A1']
    - id: 1b-4
      content: |
        따라서 최대가 되는 직사각형의 넓이는 삼각형 넓이의 $\dfrac12$이므로 삼각형의 넓이는 $43\times2=86$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        닮음비 $t$로 직사각형의 가로 $ta$, 세로 $(1-t)h$를 나타냈다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        $S(t)=t(1-t)ah$의 최댓값 $\dfrac14ah$(삼각형 넓이의 $\dfrac12$)를 구했다.
      depends_on: [1.M1]
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 1
      evidence: |
        삼각형의 넓이 $86$을 얻었다.
      depends_on: [1.M1, 1.A1]
      steps: [1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    [문제 3-2] 사각형 $\mathrm{P'Q'R'S'}$가 다음 조건을 만족시킬 때, 삼각형 $\mathrm{ABC}$의 넓이를 구하시오. [15점]

    (가) 사각형 $\mathrm{P'Q'R'S'}$는 직사각형이고 네 꼭짓점은 삼각형 $\mathrm{ABC}$와 사각형 $\mathrm{PQRS}$의 변 위에 있다. 그리고 두 사각형 $\mathrm{PQRS}$와 $\mathrm{P'Q'R'S'}$의 내부가 서로 겹치는 부분은 없다.

    (나) 두 사각형 $\mathrm{PQRS}$와 $\mathrm{P'Q'R'S'}$의 넓이의 합이 최대일 때, 삼각형 $\mathrm{ABC}$의 넓이에서 두 사각형 $\mathrm{PQRS}$와 $\mathrm{P'Q'R'S'}$의 넓이의 합을 뺀 값은 $47$이다.
  points: 15
  depends_on: ['1']
  answer: {kind: value, value: '141', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 두 번째 직사각형은 삼각형 $\mathrm{APS}$ 안에서 최대 $\dfrac{aht^2}{4}$, 합 $ah\left(t-\dfrac34t^2\right)$은 $t=\dfrac23$에서 $\dfrac{ah}{3}$.
    steps:
    - {id: 2a, content: '$\tfrac{ah}{2}-\tfrac{ah}{3}=\tfrac{ah}{6}=47\Rightarrow\tfrac{ah}{2}=141$', criteria: ['2.M1', '2.M2', '2.A1', '2.A2']}
    hint_ladder:
    - 두 번째 직사각형은 어느 삼각형에 내접하는가?
    - 그 삼각형에 [문제 3-1]의 결과를 적용하자.
  - id: S2-B
    audience: B
    source_flow: 2021 선행학습 영향평가 결과보고서 문항카드 11 문항 해설 [문제 3-2]
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        일반성을 잃지 않고 삼각형 $\mathrm{ABC}$와 사각형 $\mathrm{PQRS}$, $\mathrm{P'Q'R'S'}$가 다음과 같이 내접한다고 가정할 수 있다. [그림] 밑변 BC 위에 직사각형 PQRS, 그 윗변 PS 위에 Q′, R′이 있고 P′은 변 AB, S′은 변 AC 위에 있는 직사각형 P′Q′R′S′.
        밑변의 길이를 $a$, 높이를 $h$, 삼각형 $\mathrm{ABC}$와 $\mathrm{APS}$의 닮음비를 $1:t\ (0<t<1)$라 하면 사각형 $\mathrm{PQRS}$의 가로는 $ta$, 세로는 $(1-t)h$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        사각형 $\mathrm{P'Q'R'S'}$는 삼각형 $\mathrm{APS}$에 내접해야 한다. 이때 그 넓이가 최대가 되도록 하면 [문제 3-1]에 의해 $\dfrac12\left(\dfrac{ta\times th}{2}\right)=\dfrac{aht^2}{4}$이다.
      criteria: ['2.M1']
    - id: 2b-3
      content: |
        따라서 두 사각형의 넓이의 합은 $S(t)=aht(1-t)+\dfrac{aht^2}{4}=ah\left(t-\dfrac34t^2\right)$이고 $t=\dfrac23$일 때 최댓값 $\dfrac{ah}{3}$을 갖는다.
      criteria: ['2.M2', '2.A1']
    - id: 2b-4
      content: |
        이때 삼각형 $\mathrm{ABC}$에서 두 사각형을 제외한 부분의 넓이는 $\dfrac{ah}{2}-\dfrac{ah}{3}=\dfrac{ah}{6}=47$이므로 삼각형 $\mathrm{ABC}$의 넓이는 $\dfrac{ah}{2}=\dfrac{6\times47}{2}=141$이다.
      criteria: ['2.A2']
  - id: S2-ALT
    audience: ALT
    method_no: 2
    key_idea: |
      두 번째 직사각형을 아래 모서리 삼각형(예: 직각삼각형 $\mathrm{BPQ}$, 밑변 비율 $\lambda$)에 넣는 경우도 확인하면 합은 $ah\left(t-t^2+\dfrac{\lambda(1-t)^2}{4}\right)\le\dfrac{ah}{3}$이고 $\lambda=1$(직각삼각형), $t=\dfrac13$일 때 같은 최댓값 $\dfrac{ah}{3}$이므로 답은 $141$로 변하지 않는다.
    steps:
    - id: 2c-1
      content: |
        $\lambda=1$일 때 $\dfrac{d}{dt}\left(t-t^2+\dfrac{(1-t)^2}{4}\right)=\dfrac12-\dfrac32t=0\Rightarrow t=\dfrac13$, 값 $\dfrac13$. 따라서 최대 넓이 합은 어느 배치에서도 $\dfrac{ah}{3}$이고 $\dfrac{ah}{6}=47$에서 넓이 $141$.
      criteria: ['2.M2', '2.A1', '2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: |
        두 번째 직사각형이 삼각형 $\mathrm{APS}$에 내접함을 보고 [문제 3-1]을 적용해 그 최대 넓이 $\dfrac{aht^2}{4}$를 적었다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 5}
      steps: [2b-1, 2b-2]
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: |
        넓이의 합 $S(t)=ah\left(t-\dfrac34t^2\right)$ 또는 동치식을 세웠다.
      depends_on: [2.M1]
      steps: [2b-3, 2c-1]
    - id: 2.A1
      mark_type: A
      points: 4
      evidence: |
        $t=\dfrac23$에서 최댓값 $\dfrac{ah}{3}$을 구했다.
      depends_on: [2.M2]
      steps: [2b-3, 2c-1]
    - id: 2.A2
      mark_type: A
      points: 3
      evidence: |
        $\dfrac{ah}{6}=47$에서 삼각형의 넓이 $141$을 얻었다.
      depends_on: [2.M2, 2.A1]
      steps: [2b-4, 2c-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

