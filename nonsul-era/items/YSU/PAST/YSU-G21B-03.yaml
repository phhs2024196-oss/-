  함수의 최대·최소에 관한 기본 개념과 원리를 바탕으로 제시된 조건과 상황을 정확히 분석하여 논리적 사고력과 창의적 문제 해결 능력을 평가한다.
key_idea: |
  닮음비 $t$로 내접 직사각형 넓이를 $t(1-t)ah$로 나타내면 최대는 삼각형 넓이의 $\dfrac12$이고, 두 번째 직사각형은 위쪽 삼각형 $\mathrm{APS}$에 같은 결과를 적용해 합 $ah\left(t-\dfrac34t^2\right)$을 최대화한다.
