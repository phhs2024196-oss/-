stem: |
  한 개의 주사위를 던져서 나오는 눈의 수를 $a$라 하자. $x$축, $y$축 및 직선 $x+y=a$로 둘러싸인 직각이등변삼각형에 대하여 다음 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    직각이등변삼각형의 빗변 위의 점들 중 $x$좌표와 $y$좌표가 모두 음이 아닌 정수인 점들의 개수를 확률변수 $X$라 할 때, $\mathrm{E}(X)$의 값을 구하시오.
  points: 4
  depends_on: []
  answer: {kind: value, value: '9/2', equivalents: ['4.5'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 빗변 위 격자점은 $(0,a),(1,a-1),\ldots,(a,0)$의 $a+1$개이므로 $X=a+1$.
    steps:
    - {id: 1a, content: '$X=a+1\in\{2,\ldots,7\}$, 각 확률 $\tfrac16$, $\mathrm{E}(X)=\tfrac{27}{6}=\tfrac92$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - $a=3$일 때 빗변 위 격자점을 모두 적어 보자.
  - id: S1-B
    audience: B
    source_flow: 2022학년도 선행학습 영향평가 결과보고서 문항카드 3 문항 해설
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        눈의 수가 $a$일 때 빗변 위의 점들 중 $x$, $y$좌표가 모두 음이 아닌 정수인 점들의 개수는 $a+1$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        따라서 $X$의 확률분포는 $X=2,3,4,5,6,7$에 대하여 각각 $\mathrm{P}(X=x)=\dfrac16$이고, $\mathrm{E}(X)=\dfrac{2+3+4+5+6+7}{6}=\dfrac92$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        빗변 위 격자점의 개수를 $a+1$로 나타냈다(또는 확률분포표의 값 $2\sim7$을 적었다).
      depends_on: []
      implied_ok: true
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        확률분포를 쓰고 $\mathrm{E}(X)=\dfrac92$를 얻었다.
      depends_on: [1.M1]
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    직각이등변삼각형의 둘레 또는 내부에 있는 점들 중 $x$좌표와 $y$좌표가 모두 음이 아닌 정수인 점들의 개수를 확률변수 $Y$라 할 때, $\mathrm{E}(Y)$의 값을 구하시오.
  points: 4
  depends_on: []
  answer: {kind: value, value: '83/6', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 직선 $x=k$ $(k=0,\ldots,a)$ 위 격자점이 $a-k+1$개이므로 합은 $\tfrac{(a+1)(a+2)}{2}$.
    steps:
    - {id: 2a, content: '$Y\in\{3,6,10,15,21,28\}$, $\mathrm{E}(Y)=\tfrac{83}{6}$', criteria: ['2.M1', '2.A1']}
    hint_ladder:
    - $x=0,1,\ldots,a$인 세로줄마다 격자점이 몇 개인가?
  - id: S2-B
    audience: B
    source_flow: 2022학년도 선행학습 영향평가 결과보고서 문항카드 3 문항 해설
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        눈의 수가 $a$일 때 둘레 또는 내부에 있는 점 중 $x$, $y$좌표가 모두 음이 아닌 정수인 점들의 개수는 $(a+1)+a+\cdots+1=\dfrac{(a+1)(a+2)}{2}$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        따라서 $Y$의 확률분포는 $Y=3,6,10,15,21,28$에 대하여 각각 $\mathrm{P}(Y=y)=\dfrac16$이고, $\mathrm{E}(Y)=\dfrac{3+6+10+15+21+28}{6}=\dfrac{83}{6}$이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: |
        격자점 개수를 $\dfrac{(a+1)(a+2)}{2}$로 나타냈다(또는 $3,6,10,15,21,28$을 적었다).
      depends_on: []
      implied_ok: true
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: |
        확률분포를 쓰고 $\mathrm{E}(Y)=\dfrac{83}{6}$을 얻었다.
      depends_on: [2.M1]
      steps: [2b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

