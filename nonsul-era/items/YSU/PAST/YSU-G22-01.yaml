intent: |
  「확률과 통계」의 기댓값에 관한 기본 개념과 원리를 묻는다. 주어진 조건과 상황을 정확히 분석해 이산확률변수의 확률분포를 세우고 기댓값을 구하는 능력을 본다.
key_idea: |
  눈의 수가 $a$일 때 빗변 위 격자점은 $a+1$개, 둘레·내부의 격자점은 $\dfrac{(a+1)(a+2)}{2}$개이고, $a$는 $1\sim6$이 각각 확률 $\dfrac16$이다.
stuck: |
  삼각형 둘레·내부의 격자점 개수를 $a$에 대한 식 $1+2+\cdots+(a+1)$로 세는 것
