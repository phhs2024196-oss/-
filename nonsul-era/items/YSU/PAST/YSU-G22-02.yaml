intent: |
  「수학Ⅰ」·「수학Ⅱ」·「미적분」·「기하」에서 수열, 연속함수의 성질, 로그함수, 쌍곡선에 관한 기본 개념과 원리를 묻는다. 주어진 조건과 상황을 정확히 분석해 사잇값 정리로 교점의 위치를 판정하고 수열의 극한을 구하는 능력을 본다.
key_idea: |
  $f(x)=\ln(1+x)-\dfrac{1}{a_{n+1}}\sqrt{x^2-(a_{n+1})^2}$의 부호를 $x=a_{n+1}$, $x=a_n$에서 비교해 사잇값 정리를 쓰고, (2-2)는 제시문 2로 (2-1)의 조건을 확인한 뒤 $b_n$을 $a_{n+1}$, $a_n$ 사이에 끼운다.
stuck: |
  교점의 $x$좌표 $b_n$을 두 곡선의 차 $f(x)$의 영점으로 보고, $f(a_n)<0$을 제시문 1과 주어진 부등식으로 보이는 것
