intent: |
  「수학Ⅰ」에서 등차수열과 수열의 합에 관한 기본 개념과 원리를 묻는다. 주어진 조건과 상황을 정확히 분석해 첫째항의 범위를 나머지로 표현하고, 합의 순서를 바꾸어 $\sum f(N)$을 계산하는 능력을 본다.
key_idea: |
  첫째항 $a$, 공차 $1$인 등차수열의 첫 $m$항의 합은 $am+\dfrac{m(m-1)}{2}$이므로 $a\le\dfrac{N-r}{m}-\dfrac{m-1}{2}$이고, $\displaystyle\sum_{N=1}^{200}f(N)=\sum_{m\ \text{홀수}}m\,g_{200}(m)$이다.
stuck: |
  $\sum_{N}f(N)$을 $N$별로 세지 않고 홀수 $m$별로 바꾸어 $m\times g_{200}(m)$의 합으로 보는 것
idea_tags: [IDEA-DOUBLE-COUNT-SWAP-SUM, IDEA-FLOOR-BY-REMAINDER]
