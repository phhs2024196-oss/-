stimuli: []

stem: |
  자연수 $N$에 대하여 다음 조건을 만족시키는 모든 홀수 $m$의 값의 합을 $f(N)$이라 하자.

  (가) 등차수열 $\{a_n\}$은 첫째항이 자연수이고 공차가 $1$이다.

  (나1) $\displaystyle\sum_{k=1}^{m}a_k=N$이다.

  예를 들어, $N=21$인 경우에 아래의 두 가지만 가능하므로 $f(21)=1+3=4$이다.
  $$21=21=\sum_{k=1}^{1}(20+k),\qquad 21=6+7+8=\sum_{k=1}^{3}(5+k)$$

  자연수 $N$과 홀수 $m$에 대하여 다음 조건을 만족시키는 수열 $\{a_n\}$의 첫째항이 될 수 있는 자연수의 개수를 $g_N(m)$이라 할 때, 다음 물음에 답하시오.

  (가) 등차수열 $\{a_n\}$은 첫째항이 자연수이고 공차가 $1$이다.

  (나2) $\displaystyle\sum_{k=1}^{m}a_k\le N$이다.

subparts:
- id: '1'
  stem: |
    $N$을 $m$으로 나눈 나머지가 $r$일 때, $g_N(m)$을 $N$, $m$, $r$를 이용하여 나타내시오.
  points: 7
  depends_on: []
  answer: {kind: expression, value: '(N - r)/m - (m - 1)/2', equivalents: ['Max(0, (N - r)/m - (m - 1)/2)'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $am+\tfrac{m(m-1)}2\le N\iff a\le\tfrac Nm-\tfrac{m-1}2$, 그리고 $\tfrac{m-1}2$은 정수이므로 최대 자연수는 $\tfrac{N-r}m-\tfrac{m-1}2$.
    steps:
    - {id: 1a, content: '$g_N(m)=\tfrac{N-r}{m}-\tfrac{m-1}{2}$', criteria: ['1.M1', '1.M2', '1.A1']}
    hint_ladder:
    - 첫째항을 $a$라 하고 합을 $a$, $m$으로 나타내 보자.
    - $m$이 홀수이면 $\tfrac{m-1}{2}$은 어떤 수인가?
  - id: S1-B
    audience: B
    source_flow: 2022학년도 선행학습 영향평가 결과보고서 문항카드 5 문항 해설
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        첫째항이 $a$이고 공차가 $1$인 수열 $\{a_n\}$에 대하여 $\displaystyle\sum_{k=1}^{m}a_k=\sum_{k=1}^{m}(a+k-1)=am+\dfrac{m(m-1)}{2}$이고, 이 합이 $N$보다 작거나 같아야 하므로 $am+\dfrac{m(m-1)}{2}\le N$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        따라서 $a\le\dfrac Nm-\dfrac{m-1}{2}$을 만족시켜야 하고, $a$는 $\dfrac Nm-\dfrac{m-1}{2}$보다 작거나 같은 자연수가 될 수 있다.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        $N$을 $m$으로 나눈 나머지는 $r$이고 $m$은 홀수이므로($\dfrac{m-1}{2}$은 정수), $\dfrac Nm-\dfrac{m-1}{2}$보다 작거나 같은 최대의 자연수는 $\dfrac{N-r}{m}-\dfrac{m-1}{2}$이다. 따라서 $g_N(m)=\dfrac{N-r}{m}-\dfrac{m-1}{2}$이다.
        (참고: 공식 해설에는 없으나, 이 값이 음수가 되는 경우(예: $N<\tfrac{m(m-1)}{2}$)에는 $g_N(m)=0$이다.)
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        첫 $m$항의 합을 $am+\dfrac{m(m-1)}{2}$로 나타내고 $\le N$인 부등식을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: |
        $a\le\dfrac Nm-\dfrac{m-1}{2}$로 첫째항의 범위를 구했다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $m$이 홀수라 $\dfrac{m-1}{2}$이 정수임과 나머지 $r$을 이용해 $g_N(m)=\dfrac{N-r}{m}-\dfrac{m-1}{2}$을 얻었다.
      depends_on: [1.M2]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    $\displaystyle\sum_{N=1}^{200}f(N)$의 값을 구하시오.
  points: 10
  depends_on: ['1']
  answer: {kind: value, value: '1342', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 홀수 $m$마다 $f(N)$에 $m$이 더해지는 $N\le200$의 개수는 $g_{200}(m)$이므로 $\sum f(N)=\sum_{m\le19}m\,g_{200}(m)$.
    steps:
    - {id: 2a, content: '$\sum_{k=1}^{10}(2k-1)g_{200}(2k-1)=1990-770+165-43=1342$', criteria: ['2.M1', '2.M2', '2.A1', '2.A2']}
    hint_ladder:
    - 홀수 $m$을 고정하면, $f(N)$에 $m$이 들어가는 $N$은 몇 개인가?
  - id: S2-B
    audience: B
    source_flow: 2022학년도 선행학습 영향평가 결과보고서 문항카드 5 문항 해설
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $1$부터 홀수 $m$까지의 자연수의 합이 $200$ 이하가 되려면 $1+2+\cdots+m=\dfrac{m(m+1)}{2}\le200$이므로 $m\le19$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        따라서 $\displaystyle\sum_{N=1}^{200}f(N)$은 $19$ 이하인 홀수 $m$에 대해 각각 $g_{200}(m)$을 구하여 $m\times g_{200}(m)$을 모두 더한 값과 같으므로
        $$\sum_{N=1}^{200}f(N)=\sum_{k=1}^{10}\{(2k-1)\times g_{200}(2k-1)\}$$
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        $200$을 $m$으로 나눈 나머지를 $r_m$이라 두면
        $$\sum_{k=1}^{10}\{(2k-1)\times g_{200}(2k-1)\}=\sum_{k=1}^{10}\{200-r_{2k-1}-(k-1)(2k-1)\}=1990-\sum_{k=1}^{10}r_{2k-1}-2\sum_{k=1}^{10}k^2+3\sum_{k=1}^{10}k$$
      criteria: ['2.A1']
    - id: 2b-4
      content: |
        $200$을 $19$ 이하의 홀수 $m=1,3,5,\ldots,19$로 나눈 나머지 $r_m$은 차례로 $0,2,0,4,2,2,5,5,13,10$이고, 이들의 합은 $43$이다. 따라서
        $$\sum_{k=1}^{10}(2k-1)\times g_{200}(2k-1)=1990-\dfrac{10\times11\times21}{3}+3\times55-43=1342$$
        이다.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: |
        $\dfrac{m(m+1)}{2}\le200$에서 가능한 홀수 $m$이 $19$ 이하임을 밝혔다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: |
        합의 순서를 바꾸어 $\displaystyle\sum_{N=1}^{200}f(N)=\sum_{m}m\times g_{200}(m)$으로 나타냈다.
      depends_on: []
      implied_ok: false
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: |
        (3-1)의 식을 대입해 $\sum\{200-r_{2k-1}-(k-1)(2k-1)\}$ 꼴로 정리했다.
      depends_on: [2.M2]
      ft: {allowed: true, from: [1.A1], max_points: 2}
      steps: [2b-3]
    - id: 2.A2
      mark_type: A
      points: 3
      evidence: |
        나머지의 합 $43$을 구하고 최종값 $1342$를 얻었다.
      depends_on: [2.M2, 2.A1]
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

