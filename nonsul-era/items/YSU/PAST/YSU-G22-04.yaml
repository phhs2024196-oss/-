intent: |
  「기하」에서 평면벡터에 관한 기본 개념과 원리를 묻는다. 주어진 조건과 상황을 정확히 분석해 내부 꼭짓점에서의 방향벡터 조합을 분류하고, 벡터의 합을 두 가지로 세어 경계벡터의 합과 변별 다각형 개수의 관계를 논증하는 능력을 본다.
key_idea: |
  내부 꼭짓점마다 세 방향벡터의 합이 $\vec0$이므로 이를 모두 더한 $\overrightarrow{u_{total}}=\vec0$이고, 내부끼리 잇는 선분의 두 벡터는 상쇄되어 $\overrightarrow{u_{total}}$은 경계벡터의 합과 같다. 경계벡터는 각 변에 수직인 $(0,-1)$, $(-1,0)$, $(1,1)$뿐이다.
stuck: |
  모든 내부 꼭짓점의 벡터를 한꺼번에 더하고, 내부 선분의 양 끝 벡터가 상쇄됨을 보는 것(이중세기)
