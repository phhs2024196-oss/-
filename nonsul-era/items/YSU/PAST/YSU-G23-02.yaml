  제시문의 내용을 수학적으로 명확히 해석할 수 있는지를 묻고, 미분적분학의 기본 내용인 그래프의 개형, 최대 최소, 넓이와 정적분과의 관계등을 활용할 수 있는지를 평가한다. 또한 여러가지 경우를 나누어 문제를 해결할 수 있는 능력을 평가한다.
key_idea: |
  $g(t)$는 $y=f(x)$의 그래프에서 높이 $t$보다 위에 있는 부분의 $x$ 길이이므로, 꺾인 점·최솟값 위치로 경우를 나누고, $\int_0^{\infty}g(t)\,dt$는 $y=f(x)$ 아래 넓이 $\int_0^1f(x)\,dx$와 같다.
stuck: |
