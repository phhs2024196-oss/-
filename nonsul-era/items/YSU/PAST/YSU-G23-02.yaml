stem: |
  [제시문 2] 구간 $[a,b]$, $(a,b)$, $[a,b)$, $(a,b]$의 길이를 모두 $b-a$로 정의한다. 집합 $S$가 구간 $[0,1]$의 부분집합이고 서로 겹치지 않는 구간들의 합집합으로 나타날 때, 집합 $S$의 길이는 각 구간의 길이의 합으로 정의한다. 공집합의 길이는 $0$이라 한다.
  예를 들어 $S=\left(\dfrac{1}{9},\dfrac{2}{9}\right)\cup\left(\dfrac{1}{2},1\right]$일 때, 집합 $S$의 길이는 $\left(\dfrac{2}{9}-\dfrac{1}{9}\right)+\left(1-\dfrac{1}{2}\right)=\dfrac{1}{9}+\dfrac{1}{2}=\dfrac{11}{18}$이다. 아래의 문제에서 주어진 함수 $f(x)$와 실수 $t$에 대하여 집합 $S=\{x\mid f(x)>t,\ 0\le x\le1\}$의 길이를 $g(t)$라고 하자. 두 실수 $a$, $b$에 대하여 $\min(a,b)=\begin{cases}a&(a<b)\\b&(a\ge b)\end{cases}$으로 정의한다.
  다음 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    [문제 2-1] $f(x)=36x^3-27x^2-4x+9$일 때, $g(6)$을 구하시오. [3점]
  points: 3
  depends_on: []
  answer: {kind: value, value: '7/12', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f(x)>6\iff(4x-3)(3x-1)(3x+1)>0$이고 $[0,1]$에서 해집합의 길이를 더한다.
    steps:
    - {id: 1a, content: '$S=\left[0,\tfrac13\right)\cup\left(\tfrac34,1\right]$, $g(6)=\tfrac13+\tfrac14=\tfrac{7}{12}$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - $f(x)-6$을 인수분해해 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2023 선행학습 영향평가 결과보고서 문항카드 4 문항 해설 [문제 2-1]
    steps:
    - id: 1b-1
      content: |
        부등식 $36x^3-27x^2-4x+9>6$을 정리하면 $(4x-3)(3x-1)(3x+1)>0$이다. 구간 $[0,1]$에서 이를 만족하는 $x$의 집합은 $S=\left[0,\dfrac13\right)\cup\left(\dfrac34,1\right]$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        따라서 $g(6)=\left(\dfrac13-0\right)+\left(1-\dfrac34\right)=\dfrac{7}{12}$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        $(4x-3)(3x-1)(3x+1)>0$으로 인수분해하고 $[0,1]$에서의 해집합 $\left[0,\frac13\right)\cup\left(\frac34,1\right]$을 구했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 1
      evidence: |
        $g(6)=\dfrac{7}{12}$을 답했다.
      depends_on: [1.M1]
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    [문제 2-2] $f(x)=8x^3-11x^2+3x+5$일 때, $g(t)=1$을 만족하는 $t$의 값의 범위를 구하시오. [3점]
  points: 3
  depends_on: []
  answer: {kind: set, value: 'Interval(-oo, 71/16)', equivalents: ['t <= 71/16'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $g(t)=1\iff t\le\min_{[0,1]}f$이다(최솟값과 같을 때 빠지는 점은 길이에 영향 없음).
    steps:
    - {id: 2a, content: '$\min_{[0,1]}f=f\left(\tfrac34\right)=\tfrac{71}{16}$, 따라서 $t\le\tfrac{71}{16}$', criteria: ['2.M1', '2.A1']}
    hint_ladder:
    - $g(t)=1$이 되려면 $[0,1]$의 거의 모든 점에서 $f(x)>t$여야 한다.
    - $[0,1]$에서 $f$의 최솟값을 구하자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2023 선행학습 영향평가 결과보고서 문항카드 4 문항 해설 [문제 2-2]
    steps:
    - id: 2b-1
      content: |
        $f'(x)=24x^2-22x+3=24\left(x-\dfrac16\right)\left(x-\dfrac34\right)$이므로, 구간 $[0,1]$에서 $f(x)$의 최솟값은 $x=\dfrac34$ 또는 끝점인 $x=0$에서 발생한다. $f(0)=5$이고, $f\left(\dfrac34\right)=\dfrac{71}{16}$이므로, 최솟값은 $\dfrac{71}{16}$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        따라서 $g(t)=1$이려면 $t\le\dfrac{71}{16}$이어야 한다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: |
        $f'(x)$로 극값을 찾고 끝값과 비교해 $[0,1]$에서의 최솟값 $\dfrac{71}{16}$을 구했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 1
      evidence: |
        $t\le\dfrac{71}{16}$(등호 포함)을 답했다.
      depends_on: [2.M1]
      not_penalized:
      - 등호가 포함되는 이유(한 점은 길이 0)를 따로 설명하지 않음
      steps: [2b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    [문제 2-3] $f(x)=\min(ax,bx+c)$ ($a,b,c$는 상수이고 $a>0$, $b<0$)일 때, $g(t)$를 구하고 그래프를 그리시오. [9점]
  points: 9
  depends_on: []
  answer:
    kind: expression
    value: 'c<=0: Piecewise((1, t<=b+c), ((t-c)/b, t<=c), (0, True)); c>=a-b: Piecewise((1, t<=0), (1-t/a, t<=a), (0, True)); (c>=-b)&(c<a-b): Piecewise((1, t<=0), (1-t/a, t<=b+c), ((1/b-1/a)*t-c/b, t<=a*c/(a-b)), (0, True)); (c>0)&(c<-b): Piecewise((1, t<=b+c), ((t-c)/b, t<=0), ((1/b-1/a)*t-c/b, t<=a*c/(a-b)), (0, True))'
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 두 직선의 교점(꼭짓점) $\left(\frac{c}{a-b},\frac{ac}{a-b}\right)$이 $[0,1]$의 왼쪽·오른쪽·안쪽 중 어디 있는지, 안쪽이면 $f(0)=0$과 $f(1)=b+c$의 대소로 4가지 경우를 나눈다.
    steps:
    - {id: 3a, content: '$c\le0$, $c\ge a-b$, $-b\le c<a-b$, $0<c<-b$의 네 경우마다 $\{f>t\}$의 길이를 구간별 일차식으로 쓴다.', criteria: ['3.M1', '3.A1', '3.A2', '3.C1']}
    hint_ladder:
    - $f$의 그래프는 꼭짓점에서 꺾이는 꺾은선이다. 꼭짓점의 $x$좌표는?
    - 꼭짓점이 $[0,1]$ 안에 있을 때, $f(0)$과 $f(1)$ 중 어느 것이 작은지가 왜 중요한가?
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 2023 선행학습 영향평가 결과보고서 문항카드 4 문항 해설 [문제 2-3]
    steps:
    - id: 3b-1
      content: |
        직선 $y=ax$와 $y=bx+c$의 교점 $\left(\dfrac{c}{a-b},\dfrac{ac}{a-b}\right)$은 $f(x)$가 최댓값을 가지는 꼭짓점이다. 꼭짓점의 $x$좌표가 $0$ 이하인 경우($c\le0$), $1$ 이상인 경우($c\ge a-b$), 구간 $(0,1)$에 속하는 경우($0<c<a-b$)를 각각 나누어 생각하자. 세 번째 경우는 $f(0)$과 $f(1)$의 대소에 따라 $b+c\ge0$과 $b+c<0$인 두 경우로 세분한다. 즉, 총 4가지 경우가 있다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        (1) $c\le0$인 경우: 구간 $[0,1]$에서 $f(x)=bx+c$이고 $g(t)=\begin{cases}1&(t\le b+c)\\\dfrac{t-c}{b}&(b+c\le t\le c)\\0&(c\le t)\end{cases}$.
        그래프는 $t\le b+c$에서 높이 1, $b+c\le t\le c$에서 1에서 0으로 내려가는 선분, $t\ge c$에서 0이다. [그림]
      criteria: ['3.A1', '3.C1']
    - id: 3b-3
      content: |
        (2) $c\ge a-b$인 경우: 구간 $[0,1]$에서 $f(x)=ax$이고 $g(t)=\begin{cases}1&(t\le0)\\1-\dfrac{t}{a}&(0\le t\le a)\\0&(a\le t)\end{cases}$.
        그래프는 $t\le0$에서 1, $0\le t\le a$에서 1에서 0으로 내려가는 선분, $t\ge a$에서 0이다. [그림]
      criteria: ['3.A1', '3.C1']
    - id: 3b-4
      content: |
        (3) $0<c<a-b$, $b+c\ge0$ (즉 $-b\le c<a-b$)인 경우: $f(x)=\begin{cases}ax&\left(0\le x\le\dfrac{c}{a-b}\right)\\bx+c&\left(\dfrac{c}{a-b}\le x\le1\right)\end{cases}$,
        $g(t)=\begin{cases}1&(t\le0)\\1-\dfrac{t}{a}&(0\le t\le b+c)\\\left(\dfrac1b-\dfrac1a\right)t-\dfrac{c}{b}&\left(b+c\le t\le\dfrac{ac}{a-b}\right)\\0&\left(\dfrac{ac}{a-b}\le t\right)\end{cases}$.
        그래프는 $t=0$에서 1, $t=b+c$에서 $1-\dfrac{b+c}{a}$로 꺾이고 $t=\dfrac{ac}{a-b}$에서 0이 되는 꺾은선이다. [그림]
      criteria: ['3.A2', '3.C1']
    - id: 3b-5
      content: |
        (4) $0<c<a-b$, $b+c<0$ (즉 $0<c<-b$)인 경우: $f(x)$는 (3)과 같고,
        $g(t)=\begin{cases}1&(t\le b+c)\\\dfrac{t-c}{b}&(b+c\le t\le0)\\\left(\dfrac1b-\dfrac1a\right)t-\dfrac{c}{b}&\left(0\le t\le\dfrac{ac}{a-b}\right)\\0&\left(\dfrac{ac}{a-b}\le t\right)\end{cases}$.
        그래프는 $t=b+c$에서 1, $t=0$에서 $-\dfrac{c}{b}$로 꺾이고 $t=\dfrac{ac}{a-b}$에서 0이 되는 꺾은선이다. [그림]
      criteria: ['3.A2', '3.C1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 2
      evidence: |
        꼭짓점 $x=\dfrac{c}{a-b}$의 위치($\le0$, $\ge1$, $(0,1)$)와 $b+c$의 부호로 4가지 경우를 나누었다.
      depends_on: []
      implied_ok: false
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 2
      evidence: |
        $c\le0$, $c\ge a-b$ 두 경우의 $g(t)$를 바르게 구했다.
      depends_on: [3.M1]
      steps: [3b-2, 3b-3]
    - id: 3.A2
      mark_type: A
      points: 3
      evidence: |
        $-b\le c<a-b$, $0<c<-b$ 두 경우의 $g(t)$(꺾이는 점 $t=b+c$ 또는 $t=0$, 끝점 $t=\dfrac{ac}{a-b}$ 포함)를 바르게 구했다.
      depends_on: [3.M1]
      steps: [3b-4, 3b-5]
    - id: 3.C1
      mark_type: C
      points: 2
      evidence: |
        각 경우 $g(t)$의 그래프(높이 1, 꺾이는 점, 0이 되는 점 표시)를 그렸다.
      depends_on: [3.A1, 3.A2]
      steps: [3b-2, 3b-3, 3b-4, 3b-5]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '4'
  stem: |
    [문제 2-4] $f(x)=\lvert a(x-b)(x-c)\rvert$ ($-10<a<0$, $-10<b<0$, $0<c<1$인 상수)일 때, $\displaystyle\int_0^{2023}g(t)\,dt$의 값을 구하시오. [9점]
  points: 9
  depends_on: []
  answer: {kind: expression, value: '-a*(c**3/3 - b*c**2 + b*c - b/2 - c/2 + 1/3)', equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: $[0,1]$에서 $f<2023$이므로 $\int_0^{2023}g(t)\,dt$는 $y=f(x)$ 아래 넓이 $\int_0^1f(x)\,dx$이고, $x=c$에서 절댓값 부호가 바뀐다.
    steps:
    - {id: 4a, content: '$\int_0^ca(x-b)(x-c)dx+\int_c^1-a(x-b)(x-c)dx=-a\left(\tfrac13c^3-bc^2+bc-\tfrac12b-\tfrac12c+\tfrac13\right)$', criteria: ['4.M1', '4.M2', '4.M3', '4.A1']}
    hint_ladder:
    - $g(t)$를 $t$에 대해 적분하는 것은 그래프에서 어떤 넓이를 가로 방향으로 쌓는 것인가?
    - $[0,1]$에서 $f$의 최댓값이 2023보다 작은지 확인하자.
  - id: S4-B
    audience: B
    method_no: 1
    source_flow: 2023 선행학습 영향평가 결과보고서 문항카드 4 문항 해설 [문제 2-4]
    steps:
    - id: 4b-1
      content: |
        구간 $[0,1]$에서 $f(x)$의 최댓값은 $x=0$, $x=\dfrac{b+c}{2}$, $x=1$ 중 한 곳에서 발생한다. 따라서 최댓값은 $f(0)=abc$, $f\left(\dfrac{b+c}{2}\right)=-a\left(\dfrac{c-b}{2}\right)^2$, $f(1)=a(1-b)(1-c)$보다 클 수 없고, 조건 $-10<a<0$, $-10<b<0$, $0<c<1$에서는 최댓값은 항상 2023보다 작다.
      criteria: ['4.M1']
    - id: 4b-2
      content: |
        함수 $g_1(t)$를 집합 $\{x\mid f(x)>t,\ 0\le x\le c\}$의 길이로 정의하고, $g_2(t)$를 집합 $\{x\mid f(x)>t,\ c<x\le1\}$의 길이로 정의하면 $g(t)=g_1(t)+g_2(t)$이다.
      criteria: ['4.M2']
    - id: 4b-3
      content: |
        (1) $b+c\le0$인 경우: $t>f(0)$이면 $g_1(t)$의 값은 $0$이다. 따라서 $\displaystyle\int_0^{2023}g_1(t)dt=\int_0^{f(0)}g_1(t)dt$은 $y=f(x)$, $x$축 및 $x=0$, $x=c$로 둘러싸인 도형의 넓이이다. 또한 $t>f(1)$이면 $g_2(t)$의 값은 $0$이다. 따라서 $\displaystyle\int_0^{2023}g_2(t)dt=\int_0^{f(1)}g_2(t)dt$는 $y=f(x)$, $x$축 및 $x=c$, $x=1$로 둘러싸인 도형의 넓이이다. 그러므로 $\displaystyle\int_0^{2023}g(t)dt=\int_0^cf(x)dx+\int_c^1f(x)dx$의 값과 같다.
        (2) $b+c>0$인 경우: $t>f\left(\dfrac{b+c}{2}\right)$이면 $g_1(t)$의 값은 $0$이므로 $\displaystyle\int_0^{2023}g_1(t)dt=\int_0^{f\left(\frac{b+c}{2}\right)}g_1(t)dt$는 $y=f(x)$, $x$축 및 $x=0$, $x=c$로 둘러싸인 도형의 넓이이고, $g_2$는 (1)과 같다. 따라서 $\displaystyle\int_0^{2023}g(t)dt=\int_0^cf(x)dx+\int_c^1f(x)dx$의 값과 같다.
      criteria: ['4.M2']
    - id: 4b-4
      content: |
        (1), (2) 경우 모두 답은 $\displaystyle\int_0^1f(x)dx=\int_0^cf(x)dx+\int_c^1f(x)dx$이고, $[0,c]$에서 $a(x-b)(x-c)\ge0$, $[c,1]$에서 $a(x-b)(x-c)\le0$이므로 계산을 하면
        $\displaystyle\int_0^ca(x-b)(x-c)\,dx+\int_c^1-a(x-b)(x-c)\,dx=-a\left(\dfrac13c^3-bc^2+bc-\dfrac12b-\dfrac12c+\dfrac13\right)$이다.
      criteria: ['4.M3', '4.A1']
