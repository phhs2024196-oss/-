stimuli: []

stem: |
  [제시문 3] 좌표평면의 원점 $\mathrm{O}$를 지나고 기울기가 $m$과 $-m$인 (단, $m\ge1$) 직선을 각각 $\ell_1$과 $\ell_2$라 하자. 직선 $\ell_1$ 위의 점 $\mathrm{P}(x_1,y_1)$과 직선 $\ell_2$ 위의 점 $\mathrm{Q}(x_2,y_2)$가 조건 $x_1\ge0$, $x_2\ge0$, $\overline{\mathrm{PQ}}=1$을 모두 만족하며 움직인다. 다음 물음에 답하시오.
  [그림] 좌표평면에 원점 $\mathrm{O}$를 지나는 $\ell_1$(제1사분면 쪽으로 올라감)과 $\ell_2$(제4사분면 쪽으로 내려감), $\ell_1$ 위의 점 $\mathrm{P}$, $\ell_2$ 위의 점 $\mathrm{Q}$, 선분 $\mathrm{PQ}$의 중점 $\mathrm{M}$, 삼각형 $\mathrm{POQ}$에 내접하는 원 $C_1$, 원점 근처의 작은 원 $C_2$, $y$축 바로 오른쪽의 수직선 $\ell_3$가 그려져 있다.

subparts:
- id: '1'
  stem: |
    [문제 3-1] 선분 $\mathrm{PQ}$의 중점 $\mathrm{M}(x,y)$가 나타내는 도형의 방정식을 구하시오. [4점]
  points: 4
  depends_on: []
  answer: {kind: expression, value: '4*m**2*x**2 + 4*y**2/m**2 - 1 = 0; y <= m*x; y >= -m*x', equivalents: ['4*m**2*x**2 + 4*y**2/m**2 = 1, x >= 1/(2*sqrt(m**2+1))'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $x_1,x_2$를 $x,y$로 나타내 $\overline{\mathrm{PQ}}^2=1$에 대입하면 타원, $x_1,x_2\ge0$이 범위를 준다.
    steps:
    - {id: 1a, content: '$x_1-x_2=\tfrac{2y}{m}$, $y_1-y_2=2mx$ $\Rightarrow$ $4m^2x^2+\tfrac{4}{m^2}y^2=1$, $-mx\le y\le mx$', criteria: ['1.M1', '1.A1', '1.B1']}
    hint_ladder:
    - $y_1=mx_1$, $y_2=-mx_2$를 이용해 $x$, $y$를 $x_1$, $x_2$로 나타내자.
    - 거꾸로 $x_1$, $x_2$를 $x$, $y$로 나타낼 수 있는가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2023 선행학습 영향평가 결과보고서 문항카드 5 문항 해설 [문제 3-1]
    steps:
    - id: 1b-1
      content: |
        점 $\mathrm{P}(x_1,y_1)$와 $\mathrm{Q}(x_2,y_2)$에 대하여, 조건 $y_1=mx_1$, $y_2=-mx_2$, $(x_1-x_2)^2+(y_1-y_2)^2=1$, $x_1\ge0$, $x_2\ge0$을 모두 만족해야 한다.
        $x=\dfrac{x_1+x_2}{2}$, $y=\dfrac{y_1+y_2}{2}$이므로, $y=\dfrac{m(x_1-x_2)}{2}$, $x=\dfrac{y_1-y_2}{2m}$이고, $x_1=x+\dfrac1my$, $x_2=x-\dfrac1my$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        이를 조건 $(x_1-x_2)^2+(y_1-y_2)^2=1$, $x_1\ge0$, $x_2\ge0$에 대입하면 정답 $4m^2x^2+\dfrac{4}{m^2}y^2=1$, $y\le mx$, $y\ge-mx$를 얻는다.
      criteria: ['1.A1', '1.B1']
    - id: 1b-3
      content: |
        타원과 직선들의 교점을 계산하면 $4m^2x^2+\dfrac{4}{m^2}y^2=1$, $x\ge\dfrac{1}{2\sqrt{m^2+1}}$도 정답이다.
      criteria: ['1.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        $x_1=x+\dfrac{y}{m}$, $x_2=x-\dfrac{y}{m}$ (또는 $x_1-x_2=\dfrac{2y}{m}$, $y_1-y_2=2mx$)로 중점 좌표와 연결했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 1
      evidence: |
        $4m^2x^2+\dfrac{4}{m^2}y^2=1$을 얻었다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.B1
      mark_type: B
      points: 1
      evidence: |
        $x_1\ge0$, $x_2\ge0$에서 범위 $-mx\le y\le mx$ (또는 $x\ge\dfrac{1}{2\sqrt{m^2+1}}$)를 밝혔다.
      depends_on: []
      steps: [1b-2, 1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    [문제 3-2] 점 $\mathrm{Q}$가 원점 $\mathrm{O}$에서 출발하여 일정한 속도 $(1,-m)$으로 직선 $\ell_2$ 위를 움직일 때, $\overline{\mathrm{OQ}}=\dfrac12$이 되는 순간에 점 $\mathrm{P}$의 속도를 구하시오. [6점]
  points: 6
  depends_on: []
  answer: {kind: expression, value: '((1 - m**2 - 2*m**2/sqrt(1 + m**2 + m**4))/(1 + m**2), m*(1 - m**2 - 2*m**2/sqrt(1 + m**2 + m**4))/(1 + m**2))', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{Q}(t,-mt)$, $\mathrm{P}(s,ms)$로 두고 $\overline{\mathrm{PQ}}=1$에서 $s\ge0$인 근 $s(t)$를 구해 미분한다.
    steps:
    - {id: 2a, content: '$t=\tfrac{1}{2\sqrt{1+m^2}}$에서 $\tfrac{ds}{dt}=\tfrac{1}{1+m^2}\left(1-m^2-\tfrac{2m^2}{\sqrt{1+m^2+m^4}}\right)$, 속도 $=\left(\tfrac{ds}{dt},m\tfrac{ds}{dt}\right)$', criteria: ['2.M1', '2.M2', '2.A1']}
    hint_ladder:
    - 시각 $t$에서 $\mathrm{Q}$의 좌표는?
    - $\overline{\mathrm{PQ}}=1$을 $\mathrm{P}$의 $x$좌표 $s$에 대한 이차방정식으로 보자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2023 선행학습 영향평가 결과보고서 문항카드 5 문항 해설 [문제 3-2]
    steps:
    - id: 2b-1
      content: |
        $\mathrm{Q}(t,-mt)$라 하자. $\overline{\mathrm{OQ}}=\sqrt{1+m^2}\,t=\dfrac12$이 되는 순간의 시각은 $t=\dfrac{1}{2\sqrt{1+m^2}}$이다.
        $\mathrm{P}(s,ms)$라 하면 $\overline{\mathrm{PQ}}=1$로부터 $(s-t)^2+m^2(s+t)^2=1$을 얻고 이를 $s$에 관한 식으로 정리하면 $(1+m^2)s^2+2(m^2-1)ts+(1+m^2)t^2-1=0$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        근의 공식을 이용하여 정리하고, $s\ge0$을 고려하면 $s=\dfrac{(1-m^2)t+\sqrt{(1+m^2)-4m^2t^2}}{1+m^2}$이다.
        따라서, $\dfrac{ds}{dt}=\dfrac{1}{1+m^2}\left(1-m^2-\dfrac{4m^2t}{\sqrt{(1+m^2)-4m^2t^2}}\right)$이고 여기에 $t=\dfrac{1}{2\sqrt{1+m^2}}$을 대입하면, $\dfrac{1}{1+m^2}\left(1-m^2-\dfrac{2m^2}{\sqrt{1+m^2+m^4}}\right)$이다.
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        그러므로 $\mathrm{P}$의 속도는 $\left(\dfrac{1}{1+m^2}\left(1-m^2-\dfrac{2m^2}{\sqrt{1+m^2+m^4}}\right),\ \dfrac{m}{1+m^2}\left(1-m^2-\dfrac{2m^2}{\sqrt{1+m^2+m^4}}\right)\right)$이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: |
        $\mathrm{Q}(t,-mt)$, $t=\dfrac{1}{2\sqrt{1+m^2}}$을 구하고, $\mathrm{P}(s,ms)$에 대해 $\overline{\mathrm{PQ}}=1$을 $s$의 이차방정식으로 세웠다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 2
      evidence: |
        $s\ge0$인 근을 골라 $s(t)$를 쓰고 $\dfrac{ds}{dt}$를 계산했다(음함수 미분도 인정).
      depends_on: [2.M1]
      implied_ok: false
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: |
        $t=\dfrac{1}{2\sqrt{1+m^2}}$에서 속도 $\left(\dfrac{ds}{dt},\,m\dfrac{ds}{dt}\right)$를 위 식 또는 동치식으로 답했다.
      depends_on: [2.M2]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    [문제 3-3] $m=\dfrac{\sqrt{15}}{3}$이고 $\overline{\mathrm{OQ}}=\dfrac12$일 때, 삼각형 $\mathrm{POQ}$에 내접하는 원을 $C_1$이라 하자. 이때, 원 $C_1$과 $x$축이 만나는 두 점 중 원점에 더 가까운 점을 지나고 $y$축과 평행한 직선을 $\ell_3$이라 하자. 이때, 직선 $\ell_1$, $\ell_2$, $\ell_3$이 만드는 삼각형에 내접하는 원을 $C_2$라고 하자. 원 $C_1$의 중심과 원 $C_2$의 중심 사이의 거리를 구하시오. [9점]
  points: 9
  depends_on: ['2']
  answer: {kind: value, value: '2*sqrt(15)/9 - 5*sqrt(6)/18', equivalents: ['(4*sqrt(15) - 5*sqrt(6))/18'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 두 내접원의 중심은 모두 각 $\mathrm{POQ}$의 이등분선($x$축) 위에 있고 $\ell_3$에서 서로 접하므로 거리는 $R+r$이고, 공통접선 $\ell_1$까지의 거리 차로 $\dfrac{R-r}{R+r}=\sin\theta$.
    steps:
    - {id: 3a, content: '$\overline{\mathrm{OP}}=\tfrac34$, $R=\tfrac{\sqrt{15}}{24}$, $\tfrac rR=\tfrac{4-\sqrt{10}}{4+\sqrt{10}}$, $R+r=\tfrac29\sqrt{15}-\tfrac{5}{18}\sqrt6$', criteria: ['3.M1', '3.M2', '3.M3', '3.A1']}
    hint_ladder:
    - 두 원의 중심은 어떤 직선 위에 있는가?
    - 두 원은 $\ell_3$와 어디에서 접하는가?
    - 두 중심에서 $\ell_1$까지의 거리 차를 $\theta$로 나타내자.
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 2023 선행학습 영향평가 결과보고서 문항카드 5 문항 해설 [문제 3-3]
    steps:
    - id: 3b-1
      content: |
        원 $C_1$과 $C_2$의 반지름의 길이를 각각 $R$와 $r$라 하자. $\mathrm{Q}\left(t,-\dfrac{\sqrt{15}}{3}t\right)$라 할 때, 조건 $\overline{\mathrm{OQ}}=\dfrac{2\sqrt6}{3}t=\dfrac12$에서 $t=\dfrac{\sqrt6}{8}$을 얻는다.
        [문제 3-2]의 풀이처럼 $\mathrm{P}\left(s,\dfrac{\sqrt{15}}{3}s\right)$로 두면 조건 $1=\left(s-\dfrac{\sqrt6}{8}\right)^2+\dfrac{15}{9}\left(s+\dfrac{\sqrt6}{8}\right)^2$에서 $s=\dfrac{3}{16}\sqrt6$을 얻는다. 따라서 $\overline{\mathrm{OP}}=\dfrac23\sqrt6\,s=\dfrac34$이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        또한 직선 $\ell_1$과 $x$축이 이루는 각을 $\theta$라 할 때, $\tan\theta=\dfrac{\sqrt{15}}{3}$이다. 삼각비로부터 $\cos\theta=\dfrac{\sqrt6}{4}$, $\sin\theta=\dfrac{\sqrt{10}}{4}$을 찾는다. 따라서 $\sin2\theta=2\sin\theta\cos\theta=\dfrac{\sqrt{15}}{4}$이다.
        삼각형 $\mathrm{OPQ}$의 넓이에 대한 두 가지 공식을 이용하여 등식 $\dfrac12\overline{\mathrm{OP}}\times\overline{\mathrm{OQ}}\times\sin2\theta=\dfrac12\left(\overline{\mathrm{OP}}+\overline{\mathrm{OQ}}+\overline{\mathrm{PQ}}\right)\times R$을 얻고, 이로부터 $R=\dfrac{\sqrt{15}}{24}$을 얻는다.
      criteria: ['3.M2']
    - id: 3b-3
      content: |
        원 $C_1$의 중심을 지나고 직선 $\ell_1$에 수직인 직선을 $\ell'$이라고 하자(문항카드에는 이 직선도 $\ell_3$로 적혀 있으나 문제의 $\ell_3$와 구별해 $\ell'$로 쓴다). 원 $C_2$의 중심에서 $\ell'$에 내린 수선의 발을 $\mathrm{S}$라고 하고, $\mathrm{S}$와 두 원의 중심을 꼭짓점으로 하는 직각삼각형을 생각하면 등식 $\dfrac{R-r}{R+r}=\sin\theta=\dfrac{\sqrt{10}}{4}$에서 $\dfrac rR=\dfrac{4-\sqrt{10}}{4+\sqrt{10}}$을 구할 수 있다. [그림]
      criteria: ['3.M3']
    - id: 3b-4
      content: |
