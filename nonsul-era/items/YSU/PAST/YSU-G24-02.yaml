stimuli: []

stem: |
  모든 자연수 $n$에 대하여 $a_n=n!$이다. 모든 항이 자연수인 두 수열 $\{b_n\}$, $\{c_n\}$은 $1$보다 큰 모든 자연수 $n$에 대하여 아래의 성질을 만족시킨다.

  (가) $b_n$의 모든 소인수는 $n$ 이하이다.
  (나) $3\log_2n\le c_n\le4\log_2n$
  (다) $b_n$은 $a_n^{\,c_n}$의 약수가 아니다.

  다음 수열의 수렴 및 발산을 조사하고 수렴한다면 극한값을 구하시오.

subparts:
- id: '1'
  stem: |
    [문제 2-1] $\left\{\dfrac1n\ln a_{2n}-\dfrac1n\ln a_n-\ln2n\right\}$ [5점]
  points: 5
  depends_on: []
  answer: {kind: value, value: 'log(2)-1', equivalents: ['-1+ln2'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 일반항 $=\dfrac1n\sum_{k=1}^{n}\ln\left(\dfrac12+\dfrac{k}{2n}\right)\to\int_0^1\ln\left(\dfrac12+\dfrac x2\right)dx$.
    steps:
    - {id: 1a, content: '수렴, 극한값 $\int_0^1\ln\left(\tfrac12+\tfrac x2\right)dx=-1+\ln2$', criteria: [1.M1, 1.M2, 1.A1]}
    hint_ladder:
    - $\dfrac{(2n)!}{n!}$을 곱의 꼴로 쓰고 로그를 취해 보자.
    - $\ln2n$을 합 안으로 넣으면 $\dfrac kn$의 함수가 보이는가?
  - id: S1-B
    audience: B
    source_flow: 2024 선행학습 영향평가 결과보고서 문항카드 4 문항 해설 [문제 2-1]
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $$\frac1n\ln a_{2n}-\frac1n\ln a_n-\ln2n=\frac1n\ln\frac{(2n)!}{n!}-\ln2n=\frac1n\sum_{k=1}^{n}\ln(n+k)-\ln2n=\frac1n\sum_{k=1}^{n}\{\ln(n+k)-\ln2n\}$$
      criteria: [1.M1]
    - id: 1b-2
      content: |
        정적분과 급수와의 관계에 의하여
        $$\lim_{n\to\infty}\frac1n\sum_{k=1}^{n}\{\ln(n+k)-\ln2n\}=\lim_{n\to\infty}\frac1n\sum_{k=1}^{n}\ln\left(\frac12+\frac{k}{2n}\right)=\int_0^1\ln\left(\frac12+\frac x2\right)dx$$
      criteria: [1.M2]
    - id: 1b-3
      content: |
        부분적분법으로 계산하면 $\displaystyle\int_0^1\ln\left(\frac12+\frac x2\right)dx=\Big[(x+1)\ln\tfrac{x+1}{2}-x\Big]_0^1=-1+\ln2$. 따라서 수열은 수렴하고 극한값은 $-1+\ln2$이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        일반항을 $\dfrac1n\sum_{k=1}^{n}\{\ln(n+k)-\ln2n\}$ 또는 동치인 합의 꼴로 바꾸었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: |
        정적분과 급수의 관계로 극한을 $\int_0^1\ln\left(\frac12+\frac x2\right)dx$ 또는 동치인 정적분으로 나타냈다.
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 1
      evidence: |
        정적분을 계산해 수렴하고 극한값이 $-1+\ln2$임을 적었다.
      depends_on: [1.M2]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    [문제 2-2] $\left\{\dfrac{b_n}{n^2}\right\}$ [10점]
  points: 10
  depends_on: []
  answer: {kind: value, value: 'oo', equivalents: ['양의 무한대로 발산'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: (다)이므로 어떤 소수 $p_n\le n$에 대해 $p_n^{c_n+1}\mid b_n$이고, $b_n\ge p_n^{c_n+1}>2^{3\log_2n}=n^3$.
    steps:
    - {id: 2a, content: '$\dfrac{b_n}{n^2}>n\to\infty$이므로 양의 무한대로 발산', criteria: [2.M1, 2.R1, 2.A1, 2.A2]}
    hint_ladder:
    - $b_n$이 $a_n^{c_n}$의 약수가 아니면 어떤 소인수의 지수가 너무 커야 하는가?
    - $n$ 이하의 소수 $p$는 $n!$에 적어도 몇 번 들어 있는가?
  - id: S2-B
    audience: B
    source_flow: 2024 선행학습 영향평가 결과보고서 문항카드 4 문항 해설 [문제 2-2]
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        조건 (가), (다)에 의하여 각 소인수가 $n$ 이하인 $b_n$이 $a_n^{\,c_n}$의 약수가 아니므로, 적어도 하나의 소인수 $p_n$이 존재하여 $p_n^{\,c_n+1}$이 $b_n$의 약수이다. (소수 $p_n\le n$은 $n!$을 나누므로 $a_n^{\,c_n}$에서 $p_n$의 지수는 $c_n$ 이상이다.)
      criteria: [2.M1, 2.R1]
    - id: 2b-2
      content: |
        따라서 조건 (나)에 의하여 $b_n\ge p_n^{\,c_n+1}>p_n^{\,3\log_2n}\ge2^{3\log_2n}=n^3$이다.
      criteria: [2.A1]
    - id: 2b-3
      content: |
        그러므로 $\dfrac{b_n}{n^2}>\dfrac{n^3}{n^2}=n$이고, 수열의 극한의 대소 관계에 의하여 $\displaystyle\lim_{n\to\infty}\frac{b_n}{n^2}=\infty$이다(양의 무한대로 발산).
      criteria: [2.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        (가)(다)로부터 어떤 소인수 $p_n\le n$에 대해 $p_n^{\,c_n+1}\mid b_n$임을 적었다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.R1
      mark_type: R
      points: 2
      evidence: |
        $p_n\le n$이 $n!$을 나누어 $a_n^{\,c_n}$ 안의 $p_n$의 지수가 $c_n$ 이상이라는 근거를 밝혔다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        (나)와 $p_n\ge2$로 $b_n>n^3$(또는 $b_n\ge n^3$)을 얻었다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.A2
      mark_type: A
      points: 2
      evidence: |
        대소 관계로 $\dfrac{b_n}{n^2}\to\infty$, 즉 발산함을 결론지었다.
      depends_on: [2.M1, 2.A1]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

