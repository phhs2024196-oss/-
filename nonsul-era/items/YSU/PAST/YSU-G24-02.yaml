intent: |
  정적분과 급수와의 관계를 이해하고 있는지를 묻고, 부분적분법을 이용하여 정적분의 값을 구할 수 있는지를 평가한다. 또한, 수열의 극한의 대소 관계를 적절히 활용할 수 있는지를 평가한다.
key_idea: |
  $\dfrac1n\ln\dfrac{(2n)!}{n!}-\ln2n=\dfrac1n\sum_{k=1}^{n}\ln\left(\dfrac12+\dfrac{k}{2n}\right)$을 정적분으로 바꾸고, (가)(다)에서 $p^{c_n+1}\mid b_n$인 소수 $p\le n$을 찾아 $b_n>2^{3\log_2n}=n^3$을 얻는다.
stuck: |
  (2-2)에서 「$b_n$이 $a_n^{c_n}$의 약수가 아님」을 소인수 $p_n$의 지수가 $c_n$보다 크다는 부등식으로 바꾸는 단계
