stimuli: []

stem: |
  $0$을 제외하고 $-20$부터 $20$까지 $40$개의 정수가 하나씩 적혀 있는 $40$장의 카드들을 두 장씩 짝지어 $20$쌍을 만들었다. 이 중 임의로 고른 하나의 쌍에서 두 카드에 적힌 숫자의 합을 확률변수 $X$라 하자. 다음 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    [문제 3-1] 확률변수 $X$의 평균 $\mathrm{E}(X)$의 값을 구하고, 그 값이 $20$쌍을 만드는 방법과 상관없이 일정함을 보이시오. [5점]
  points: 5
  depends_on: []
  answer: {kind: value, value: '0', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{E}(X)=\dfrac1{20}\sum_{i=1}^{20}(a_i+b_i)$이고 $\sum(a_i+b_i)$는 카드 $40$장 숫자의 총합 $0$이다.
    steps:
    - {id: 1a, content: '$\mathrm{E}(X)=\tfrac1{20}\times0=0$ (짝짓는 방법과 무관)', criteria: [1.M1, 1.R1]}
    hint_ladder:
    - 모든 쌍의 합을 더하면 무엇이 되는가?
  - id: S1-B
    audience: B
    source_flow: 2024 선행학습 영향평가 결과보고서 문항카드 5 문항 해설 [문제 3-1]
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $20$개의 카드쌍에 적힌 숫자를 각각 $(a_i,b_i)$ ($i$는 $1\le i\le20$인 자연수)라 하자. $20$개의 카드쌍 중 임의로 한 개의 카드쌍을 고를 확률은 $\dfrac1{20}$이므로
        $$\mathrm{E}(X)=\sum_{i=1}^{20}\frac1{20}(a_i+b_i)=\frac1{20}\sum_{i=1}^{20}(a_i+b_i)$$
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $\sum_{i=1}^{20}(a_i+b_i)$는 $40$장의 카드에 적힌 수의 총합이므로 $0$이고 $\mathrm{E}(X)=\dfrac1{20}\times0=0$이다. 따라서 $a_i,b_i$의 선택과 상관없이 $\mathrm{E}(X)$의 값은 $0$이다.
      criteria: [1.R1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        $\mathrm{E}(X)=\dfrac1{20}\sum_{i=1}^{20}(a_i+b_i)$를 세웠다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.R1
      mark_type: R
      points: 3
      evidence: |
        $\sum(a_i+b_i)$가 카드 전체 숫자의 합 $0$이어서 짝짓는 방법과 무관함을 밝히고 $\mathrm{E}(X)=0$을 적었다.
      depends_on: [1.M1]
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    [문제 3-2] 확률변수 $X$의 분산 $\mathrm{V}(X)$의 값이 최대가 되도록 $20$쌍을 만드는 방법을 찾고, 이때의 $\mathrm{V}(X)$의 값을 구하시오. [10점]
  points: 10
  depends_on: ['1']
  answer: {kind: value, value: '573', equivalents: ['쌍 (20,19),(18,17),...,(2,1),(-1,-2),...,(-19,-20) 에서 V(X)=573'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{V}(X)=\mathrm{E}(X^2)$에서 제곱합은 고정이므로 $\sum a_ib_i$ 최대 — 교환 논법으로 크기 순으로 이웃한 두 수끼리 짝짓는다.
    steps:
    - {id: 2a, content: '$(20,19),(18,17),\dots,(2,1),(-1,-2),\dots,(-19,-20)$, $\mathrm{V}(X)=\tfrac1{10}\sum_{k=1}^{10}(4k-1)^2=573$', criteria: [2.M1, 2.M2, 2.R1, 2.A1]}
    hint_ladder:
    - $\mathrm{E}(X)=0$이면 $\mathrm{V}(X)$는 무엇과 같은가?
    - $(a_i+b_i)^2$을 전개하면 짝짓는 방법과 무관한 부분이 있는가?
    - 가장 큰 수 $20$의 짝이 $19$가 아니라면, 짝을 바꿔서 더 크게 만들 수 있는가?
  - id: S2-B
    audience: B
    source_flow: 2024 선행학습 영향평가 결과보고서 문항카드 5 문항 해설 [문제 3-2]
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $\mathrm{V}(X)=\mathrm{E}(X^2)-\{\mathrm{E}(X)\}^2=\mathrm{E}(X^2)$이고
        $$\mathrm{E}(X^2)=\sum_{i=1}^{20}\frac1{20}(a_i+b_i)^2=\sum_{i=1}^{20}\frac1{20}(a_i^2+b_i^2+2a_ib_i)=\frac1{20}\sum_{i=1}^{20}(a_i^2+b_i^2)+\frac1{10}\sum_{i=1}^{20}a_ib_i\quad\cdots\ ㉠$$
      criteria: [2.M1]
    - id: 2b-2
      content: |
        ㉠에서 $\sum_{i=1}^{20}(a_i^2+b_i^2)$의 값은 카드를 두 장씩 짝짓는 방법에 상관없이 일정하므로 $\sum_{i=1}^{20}a_ib_i$의 값이 최대가 될 때 $\mathrm{V}(X)$의 값이 최대가 된다.
      criteria: [2.M2]
    - id: 2b-3
      content: |
        $\sum a_ib_i$의 값이 최대가 되도록 하는 카드쌍 $T$에서 $20$과 $19$가 짝이 아니라고 하고 $a_1=20$, $b_1=x$, $a_2=19$, $b_2=y$ ($-20\le x\le18$, $-20\le y\le18$)라 하면
        $$\sum_{i=1}^{20}a_ib_i=(20x+19y)+\sum_{i=3}^{20}a_ib_i\quad\cdots\ ㉡$$
        $T$에서 $a_1=20$, $b_1=19$, $a_2=x$, $b_2=y$가 되도록 바꾼 카드쌍 $S$에 대하여
        $$\sum_{i=1}^{20}a_ib_i=(20\times19+xy)+\sum_{i=3}^{20}a_ib_i\quad\cdots\ ㉢$$
        ㉢$-$㉡$=xy-20x-19y+20\times19=(x-19)(y-20)>0$이므로 $T$에서 $\sum a_ib_i$가 최대라는 것에 모순이다. 따라서 최대가 되는 카드쌍에서 $20$과 $19$가 쌍을 이룬다.
      criteria: [2.R1]
    - id: 2b-4
      content: |
        이와 같은 과정을 반복하면 $(20,19),(18,17),\dots,(2,1),(-1,-2),\dots,(-17,-18),(-19,-20)$과 같이 $20$쌍을 만들 때 $\sum a_ib_i$, 즉 $\mathrm{V}(X)$의 값이 최대이다. 따라서
        $$\mathrm{V}(X)=\frac1{20}\times2\times(39^2+35^2+\cdots+3^2)=\frac1{10}\sum_{k=1}^{10}(4k-1)^2=\frac1{10}\left(\sum_{k=1}^{10}16k^2-\sum_{k=1}^{10}8k+10\right)=573$$
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: |
        $\mathrm{V}(X)=\mathrm{E}(X^2)$를 쓰고 $\dfrac1{20}\sum(a_i^2+b_i^2)+\dfrac1{10}\sum a_ib_i$로 전개했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.R1], max_points: 2}
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 2
      evidence: |
        제곱합이 짝짓는 방법과 무관하므로 $\sum a_ib_i$의 최대화로 바꾸었다.
      depends_on: [2.M1]
      implied_ok: false
      steps: [2b-2]
    - id: 2.R1
      mark_type: R
      points: 4
      evidence: |
        짝 바꾸기(교환) 논법 등으로 이웃한 수끼리 짝짓는 방법 $(20,19),(18,17),\dots,(-19,-20)$이 최대임을 근거와 함께 보였다.
      depends_on: [2.M2]
      implied_ok: false
      steps: [2b-3, 2b-4]
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: |
        $\mathrm{V}(X)=573$을 얻었다.
      depends_on: [2.M1]
      steps: [2b-4]
    deductions:
    - code: D3-1
      condition: 최대가 되는 짝짓기를 근거 없이 제시하고 값만 계산함
      effect: cap
      value: 6
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

