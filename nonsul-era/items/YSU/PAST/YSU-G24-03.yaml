intent: |
  확률변수의 평균과 분산을 수열의 합을 활용하여 계산하고 추론할 수 있는지 묻는다.
key_idea: |
  $\mathrm{E}(X)=\dfrac1{20}\sum(a_i+b_i)=0$이고 $\mathrm{V}(X)=\dfrac1{20}\sum(a_i^2+b_i^2)+\dfrac1{10}\sum a_ib_i$에서 앞 합은 고정이므로 $\sum a_ib_i$ 최대화 — 교환 논법으로 $20$과 $19$가 짝임을 보이고 반복해 $(20,19),(18,17),\dots,(-19,-20)$을 얻는다.
stuck: |
  $\sum a_ib_i$를 최대로 하는 짝에서 $20$의 짝이 $19$여야 함을 교환(바꿔치기) 후 차이 $(x-19)(y-20)>0$로 보이는 단계
