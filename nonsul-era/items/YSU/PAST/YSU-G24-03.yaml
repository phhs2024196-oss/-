  - '$(a_i+b_i)^2=a_i^2+b_i^2+2a_ib_i$ 전개로 고정 부분 분리'
  - '짝 바꾸기 후 차이 $(x-19)(y-20)>0$ (귀류)'
  - '$\sum_{k=1}^{10}(4k-1)^2$ 계산'
  conditions:
