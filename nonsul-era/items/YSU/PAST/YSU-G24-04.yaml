stimuli:
- label: 제시문
  body: |
    두 개의 반직선이 만났을 때, 양의 실수 $a$에 대하여 다음 규칙을 따라 새로운 반직선들이 생성된다고 하자.
    (가) 서로 다른 두 반직선 $l_i$, $l_j$ $(1\le i,j\le4)$가 시작점 $\mathrm{P}_i$ 또는 $\mathrm{P}_j$가 아닌 점 $\mathrm{P}$에서 만날 때, $\overrightarrow{\mathrm{OR}}=\overrightarrow{\mathrm{OP}}+t\left(a\vec{v_i}+\vec{v_j}\right)$ $(t\ge0)$을 만족시키는 점 $\mathrm{R}$이 그리는 반직선과 $\overrightarrow{\mathrm{OS}}=\overrightarrow{\mathrm{OP}}+t\left(\vec{v_i}+a\vec{v_j}\right)$ $(t\ge0)$을 만족시키는 점 $\mathrm{S}$가 그리는 반직선이 각각 생성된다.
    (나) 새로 생성된 반직선들을 포함하여 임의의 서로 다른 두 반직선이 시작점이 아닌 점에서 만날 때에도 (가)의 규칙이 계속 적용된다.

stem: |
  좌표평면 위의 점 $\mathrm{P}$와 평면벡터 $\vec v$에 대하여, $\overrightarrow{\mathrm{OQ}}=\overrightarrow{\mathrm{OP}}+t\vec v$ $(t\ge0)$을 만족하는 점 $\mathrm{Q}$가 그리는 반직선을 생각하자. 네 점 $\mathrm{P}_1(6,\,4)$, $\mathrm{P}_2(1,\,5)$, $\mathrm{P}_3(0,\,3)$, $\mathrm{P}_4(0,\,-1)$과 네 벡터 $\vec{v_1}=(-1,\,0)$, $\vec{v_2}=(0,\,-1)$, $\vec{v_3}=(1,\,-1)$, $\vec{v_4}=(1,\,1)$에 대하여
  $$\overrightarrow{\mathrm{OQ_i}}=\overrightarrow{\mathrm{OP_i}}+t\vec{v_i}\ (i=1,\,2,\,3,\,4)$$
  를 만족시키는 점 $\mathrm{Q}_i$가 그리는 반직선 $l_i$가 주어져 있다. 다음 제시문을 참고하여 물음에 답하시오.

  ※아래는 위 과정을 통해 생성된 일부 반직선들을 나타낸 그림이다. [그림: $\mathrm{P}_1$에서 왼쪽으로 뻗는 수평 반직선 $l_1$, $\mathrm{P}_2$에서 아래로 뻗는 수직 반직선 $l_2$, $\mathrm{P}_3$에서 오른쪽 아래로 뻗는 반직선 $l_3$이 실선으로 그려져 있고, $l_1$과 $l_2$의 교점 및 $l_2$와 $l_3$의 교점에서 왼쪽 아래·아래쪽으로 뻗는 새 반직선 몇 개가 점선으로 그려져 있다. $l_4$와 점 $\mathrm{P}_4$는 그림에 없다.]

subparts:
- id: '1'
  stem: |
    [문제 4-1] 두 반직선 $l_1$, $l_2$에 대하여 [제시문]의 (가)에 따라 새로운 반직선들이 생성될 때, 점 $\mathrm{A}(2,\,2)$를 지나는 반직선이 생성될 수 있는 양의 실수 $a$가 존재하면 그 값을 찾으시오. 만약 존재하지 않으면 그 이유를 설명하시오. [5점]
  points: 5
  depends_on: []
  answer: {kind: set, value: 'EmptySet', equivalents: ['존재하지 않음'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 교점 $\mathrm{P}(1,4)$에서 생성되는 방향은 $(-a,-1)$, $(-1,-a)$이고 각각의 $\vec w$에 대해 $\vec w\cdot\overrightarrow{\mathrm{PA}}=1+2a$, $a+2$로 양수이다.
    steps:
    - {id: 1a, content: '$\vec w\cdot\overrightarrow{\mathrm{PA}}>0$이므로 $\mathrm{A}$를 지나는 반직선은 생성되지 않는다 — 그런 $a$는 없다', criteria: [1.M1, 1.R1, 1.A1]}
    hint_ladder:
    - $l_1$과 $l_2$는 어디서 만나는가?
    - 방향벡터에 수직인 벡터와 $\overrightarrow{\mathrm{PA}}$의 내적이 $0$이 아니면 무엇을 뜻하는가?
  - id: S1-B
    audience: B
    source_flow: 2024 선행학습 영향평가 결과보고서 문항카드 6 문항 해설 [문제 4-1]
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        두 반직선 $l_1$과 $l_2$가 점 $\mathrm{P}(1,4)$에서 만나 생성한 새로운 반직선 $l$ 위의 점 $\mathrm{R}$은 방정식 $\overrightarrow{\mathrm{OR}}=\overrightarrow{\mathrm{OP}}+t\vec v$ $(t\ge0)$을 만족시킨다. $\vec v=(c,d)$에 대하여 $\vec w=(-d,c)$라 하자.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        반직선 $l$ 위의 점 $\mathrm{R}$에 대하여 $\overrightarrow{\mathrm{PR}}=\overrightarrow{\mathrm{OR}}-\overrightarrow{\mathrm{OP}}=t\vec v$이고 $\vec v\cdot\vec w=0$이므로 점 $\mathrm{R}$은 $\vec w\cdot\overrightarrow{\mathrm{PR}}=0$을 만족시킨다. 즉, 모든 양의 실수 $a$에 대하여 $\vec w\cdot\overrightarrow{\mathrm{PA}}>0$이면 반직선 $l$은 점 $\mathrm{A}$를 지나지 않는다.
      criteria: [1.R1]
    - id: 1b-3
      content: |
        조건 (가)에 의하여 $\vec v=(-a,-1)$ 또는 $\vec v=(-1,-a)$이다.
        (ⅰ) $\vec v=(-a,-1)$인 경우: $c=-a$, $d=-1$이므로 $\vec w=(1,-a)$이고 $\vec w\cdot\overrightarrow{\mathrm{PA}}=(1,-a)\cdot(1,-2)=1+2a>0$.
        (ⅱ) $\vec v=(-1,-a)$인 경우: $c=-1$, $d=-a$이므로 $\vec w=(a,-1)$이고 $\vec w\cdot\overrightarrow{\mathrm{PA}}=(a,-1)\cdot(1,-2)=a+2>0$.
        (ⅰ), (ⅱ)에 의하여 $\vec w\cdot\overrightarrow{\mathrm{PA}}>0$이다. 따라서 문제의 조건을 만족시키는 양의 실수 $a$가 존재하지 않는다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 1
      evidence: |
        교점 $\mathrm{P}(1,4)$와 생성되는 두 방향벡터 $(-a,-1)$, $(-1,-a)$를 구했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-3]
    - id: 1.R1
      mark_type: R
      points: 2
      evidence: |
        A가 반직선 위에 있으려면 $\overrightarrow{\mathrm{PA}}$가 방향벡터와 평행해야 함(또는 $\vec w\cdot\overrightarrow{\mathrm{PA}}=0$)을 판정 기준으로 세웠다.
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        두 경우 모두 $\vec w\cdot\overrightarrow{\mathrm{PA}}=1+2a$, $a+2$가 양수(또는 평행 조건이 $a>0$에서 불가능)임을 보이고 그런 $a$가 없다고 결론지었다.
      depends_on: [1.M1, 1.R1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    [문제 4-2] 네 반직선 $l_1$, $l_2$, $l_3$, $l_4$에 대하여 [제시문]의 (가), (나)에 따라 새로운 반직선들이 생성될 때, 점 $\mathrm{A}(2,\,2)$를 지나는 반직선이 생성될 수 있는 양의 실수 $a$가 존재하면 그 값을 찾으시오. 만약 존재하지 않으면 그 이유를 설명하시오. [10점]
  points: 10
  depends_on: ['1']
  answer: {kind: set, value: 'EmptySet', equivalents: ['존재하지 않음'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 모든 반직선이 $\vec w\cdot\overrightarrow{\mathrm{(시작점)A}}>0$을 만족하고, 이 성질은 생성 규칙으로 보존된다($\vec w=a\vec w_1+\vec w_2$ 등).
    steps:
    - {id: 2a, content: '$l_1,\dots,l_4$에서 값 $2,1,1,1>0$, 생성 시 $\vec w\cdot\overrightarrow{\mathrm{PA}}=a\,\vec w_1\cdot\overrightarrow{\mathrm{PA}}+\vec w_2\cdot\overrightarrow{\mathrm{PA}}>0$ → 그런 $a$는 없다', criteria: [2.B1, 2.M1, 2.R1, 2.R2]}
    hint_ladder:
    - (4-1)에서 쓴 $\vec w\cdot\overrightarrow{\mathrm{PA}}$를 처음 네 반직선에 대해 계산해 보자.
    - 두 반직선의 교점 $\mathrm{P}$에서 $\vec w_k\cdot\overrightarrow{\mathrm{PA}}$는 $\vec w_k\cdot\overrightarrow{\mathrm{R}_k\mathrm{A}}$와 같은가?
    - 새 방향벡터 $a\vec u_1+\vec u_2$에 수직인 벡터를 $\vec w_1$, $\vec w_2$로 나타내 보자.
  - id: S2-B
    audience: B
    source_flow: 2024 선행학습 영향평가 결과보고서 문항카드 6 문항 해설 [문제 4-2]
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        4-1 풀이의 반직선 $l$을 $l_i$로 대체하여 같은 계산을 해 보면 똑같이 $\vec w\cdot\overrightarrow{\mathrm{P}_i\mathrm{A}}>0$이 성립함을 확인할 수 있다(이 값은 $i=1,2,3,4$일 때 각각 $2,1,1,1$이다). 시작점이 아닌 교점 $\mathrm{P}$를 갖는 두 반직선 $l_i$, $l_j$에 대하여 4-1의 풀이에서처럼 확인해보면 두 반직선 $l_i$, $l_j$가 생성한 모든 반직선은 $\vec w\cdot\overrightarrow{\mathrm{PA}}>0$을 만족한다.
      criteria: [2.B1]
    - id: 2b-2
      content: |
        네 반직선 $l_1,l_2,l_3,l_4$ 및 이들로부터 생성된 모든 반직선 중 교점을 갖는 임의의 서로 다른 두 반직선을 각각 $m_1$, $m_2$라 하고, 그 방정식을 각각 $\overrightarrow{\mathrm{OX_1}}=\overrightarrow{\mathrm{OR_1}}+t\vec{u_1}$, $\overrightarrow{\mathrm{OX_2}}=\overrightarrow{\mathrm{OR_2}}+t\vec{u_2}$ $(t\ge0)$이라 하자. 두 반직선 $m_1$, $m_2$가 $\mathrm{P}$에서 만나 생성한 반직선 $m$을 $\overrightarrow{\mathrm{OX}}=\overrightarrow{\mathrm{OP}}+t\vec v$라 하면 $\vec v=a\vec{u_1}+\vec{u_2}$ 또는 $\vec v=\vec{u_1}+a\vec{u_2}$이다. $\vec v=(c,d)$라 하면 $\vec w=(-d,c)$에 대하여 $\vec w\cdot\overrightarrow{\mathrm{PA}}>0$을 보일 경우 $\mathrm{A}$가 이 반직선 위에 있지 않음을 확인할 수 있다.
      criteria: [2.M1]
    - id: 2b-3
      content: |
        $\vec{u_1}=(c_1,d_1)$, $\vec{u_2}=(c_2,d_2)$에 대하여 $\vec{w_1}=(-d_1,c_1)$, $\vec{w_2}=(-d_2,c_2)$이고 4-1의 풀이에서와 마찬가지로 $\vec{w_1}\cdot\overrightarrow{\mathrm{R_1A}}>0$, $\vec{w_2}\cdot\overrightarrow{\mathrm{R_2A}}>0$ ⋯ ㉠ 이다. 또한 교점 $\mathrm{P}$에 대하여 $\vec{w_1}\cdot\overrightarrow{\mathrm{R_1P}}=0$, $\vec{w_2}\cdot\overrightarrow{\mathrm{R_2P}}=0$ ⋯ ㉡ 이다. ㉠, ㉡에서 $\vec{w_1}\cdot\overrightarrow{\mathrm{PA}}>0$, $\vec{w_2}\cdot\overrightarrow{\mathrm{PA}}>0$ ⋯ ㉢ 이다.
      criteria: [2.R1]
    - id: 2b-4
      content: |
        (ⅰ) $\vec v=a\vec{u_1}+\vec{u_2}$인 경우: $a\vec{u_1}+\vec{u_2}=(ac_1+c_2,\,ad_1+d_2)$이므로 $\vec w=(-ad_1-d_2,\,ac_1+c_2)=a\vec{w_1}+\vec{w_2}$가 되고, $a>0$이므로 ㉢에 의하여 $\vec w\cdot\overrightarrow{\mathrm{PA}}=a\vec{w_1}\cdot\overrightarrow{\mathrm{PA}}+\vec{w_2}\cdot\overrightarrow{\mathrm{PA}}>0$.
        (ⅱ) $\vec v=\vec{u_1}+a\vec{u_2}$인 경우: (ⅰ)과 마찬가지로 $\vec w\cdot\overrightarrow{\mathrm{PA}}=\vec{w_1}\cdot\overrightarrow{\mathrm{PA}}+a\vec{w_2}\cdot\overrightarrow{\mathrm{PA}}>0$.
        (ⅰ), (ⅱ)에 의하여 $\vec w\cdot\overrightarrow{\mathrm{PA}}>0$이므로 $\mathrm{A}$가 이 반직선 위에 있지 않다. 이를 반복해서 적용하면 새로 생성된 모든 반직선은 점 $\mathrm{A}$를 지날 수 없음을 알 수 있다. 따라서 그러한 양의 실수 $a$는 존재하지 않는다.
      criteria: [2.R2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 2
      evidence: |
        처음 네 반직선에 대해 $\vec w\cdot\overrightarrow{\mathrm{P}_i\mathrm{A}}$를 계산해 모두 양수($2,1,1,1$)임을 보였다.
      depends_on: []
      steps: [2b-1]
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: |
        일반적인 두 반직선 $m_1,m_2$와 생성 방향 $a\vec u_1+\vec u_2$, $\vec u_1+a\vec u_2$를 놓고 $\vec w\cdot\overrightarrow{\mathrm{PA}}>0$을 보이면 됨을 세웠다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.R1], max_points: 2}
      steps: [2b-2]
    - id: 2.R1
      mark_type: R
