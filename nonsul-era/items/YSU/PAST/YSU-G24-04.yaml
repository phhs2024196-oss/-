  벡터의 정의와 벡터의 합과 실수배의 의미를 정확히 이해하고, 직선과 평면벡터의 내적 간의 관계를 파악할 수 있는지 묻는다.
key_idea: |
  방향벡터 $\vec v=(c,d)$를 $90^\circ$ 돌린 $\vec w=(-d,c)$에 대해 반직선 위 모든 점 $\mathrm{R}$은 $\vec w\cdot\overrightarrow{\mathrm{PR}}=0$이므로 $\vec w\cdot\overrightarrow{\mathrm{PA}}>0$이면 $\mathrm{A}$를 지나지 않는다. 이 양수 성질이 생성 규칙 아래에서 보존된다(불변량).
stuck: |
  「점 A를 지나지 않음」을 법선 방향 내적 $\vec w\cdot\overrightarrow{\mathrm{PA}}>0$으로 바꾸고, 새 반직선의 $\vec w$가 $a\vec w_1+\vec w_2$(또는 $\vec w_1+a\vec w_2$)임을 이용해 양수성이 유지됨을 보이는 단계
