stimuli: []

stem: |
  [문제 1, 단답형] 아래 그림과 같은 바둑판 모양의 도로망과 하나의 주머니가 있다. 도로망의 $\mathrm{A}$ 지점에 자동차가 있고, 주머니에는 숫자 $1,\ 3,\ 5$가 적힌 공이 각각 $1$개씩, 숫자 $2,\ 4,\ 6$이 적힌 공이 각각 $2$개씩 들어있다. 아래 도로망과 이 주머니를 사용하여 다음 시행을 한다.

  [그림] 가로 $4$칸, 세로 $2$칸인 정사각형 격자 모양의 도로망. 왼쪽 아래 꼭짓점이 $\mathrm{A}$이고, 위쪽 화살표에 「북」, 오른쪽 화살표에 「동」이 표시되어 있다.

  [상자] 주머니에서 공을 꺼내서 공에 적혀있는 수를 확인한 후 다시 넣는다.
  이때, 확인한 수가 홀수이면 북쪽으로, 짝수이면 동쪽으로 자동차를 나온 수만큼 이동시킨다. [상자 끝]

  위의 시행을 반복하다가 자동차가 동쪽이나 북쪽 경계에 처음으로 도달할 경우, 그곳에서 자동차를 멈추고 시행을 종료한다. 예를 들어, 처음 시행에서 $3$이 적힌 공을 꺼낸 경우, 북쪽으로 $2$칸만 이동시킨 후 북쪽 경계에서 자동차를 멈추고 시행을 종료한다.

subparts:
- id: '1'
  stem: |
    자동차가 북쪽 경계에 도달하여 시행을 종료하였을 때, 두 번째 시행에서 종료하였을 확률을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '21/79', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 북쪽 종료 지점은 C1$(0,2)$, C2$(2,2)$뿐이다. $P(\text{북쪽 종료})=\tfrac{79}{243}$, $P(\text{북쪽 종료이고 두 번째에 종료})=\tfrac{7}{81}$.
    steps:
    - {id: 1a, content: '$\dfrac{7/81}{79/243}=\dfrac{21}{79}$', criteria: ['1.M1', '1.A1', '1.M2', '1.A2']}
    hint_ladder:
    - 동쪽으로는 한 번에 최소 몇 칸 움직이는가?
    - 북쪽 경계의 어느 지점에서 멈출 수 있는지 먼저 정하자.
  - id: S1-B
    audience: B
    source_flow: 2025 선행학습 영향평가 결과보고서 문항카드 03 문항 해설
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        동쪽 이동은 $2,4,6$칸이므로 자동차가 북쪽 경계에서 멈추는 경우는 C1$(x=0)$, C2$(x=2)$에서 멈추는 두 가지 경우밖에 없다. 각 홀수 공이 나올 확률은 $\dfrac19$, 각 짝수 공이 나올 확률은 $\dfrac29$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        (i) C1에서 멈추는 경우: 공이 $(1,1),(1,3),(1,5),(3),(5)$ 순서로 나오는 경우이므로 확률은 $3\times\left(\dfrac19\right)^2+2\times\dfrac19=\dfrac{7}{27}$.
        (ii) C2에서 멈추는 경우: $(1,2,1),(1,2,3),(1,2,5),(2,1,1),(2,1,3),(2,1,5),(2,3),(2,5)$이므로 확률은 $6\times\dfrac29\times\left(\dfrac19\right)^2+2\times\dfrac19\times\dfrac29=\dfrac{16}{243}$.
        따라서 북쪽 경계에 도달하여 종료할 확률은 $\dfrac{7}{27}+\dfrac{16}{243}=\dfrac{79}{243}$ …… ㉠
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        시행을 두 번 하였을 때 북쪽 경계에 도달하여 멈추는 경우는 $(1,1),(1,3),(1,5),(2,3),(2,5)$이므로 확률은 $3\times\left(\dfrac19\right)^2+2\times\dfrac19\times\dfrac29=\dfrac{7}{81}$ …… ㉡
      criteria: ['1.M2']
    - id: 1b-4
      content: |
        ㉠, ㉡으로부터 구하는 확률은 $\dfrac{7/81}{79/243}=\dfrac{21}{79}$.
      criteria: ['1.A2']
