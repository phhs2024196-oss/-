stem: |
  [문제 2, 단답형] $x\ge1$인 실수 $x$에 대하여 함수 $f(x)$를 $f(x)=\displaystyle\int_1^x\dfrac{t^{2025}+t^{2024}+1}{t^{2025}+t^{1885}+1}dt$라 할 때, 다음 극한값을 구하시오.

subparts:
- id: '1'
  stem: |
    $$\lim_{n\to\infty}\sum_{k=2}^{10}\dfrac{f(n+2k)-f(n)}{(k-1)k(k+1)}$$
  points: 10
  depends_on: []
  answer: {kind: value, value: '72/55', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 평균값 정리로 $f(n+2k)-f(n)=2k\,f'(n+c_k)$, $f'(n+c_k)\to1$이므로 극한은 $\sum_{k=2}^{10}\dfrac{2}{(k-1)(k+1)}=\dfrac{72}{55}$.
    steps:
    - {id: 1a, content: '$\sum_{k=2}^{10}\left(\dfrac{1}{k-1}-\dfrac{1}{k+1}\right)=1+\dfrac12-\dfrac1{10}-\dfrac1{11}=\dfrac{72}{55}$', criteria: ['1.M1', '1.A1', '1.M2', '1.A2']}
    hint_ladder:
    - 적분을 직접 계산할 수 있는가? 그렇지 않다면 차 $f(n+2k)-f(n)$을 무엇으로 바꿀 수 있을까?
    - $f'(x)$의 $x\to\infty$ 극한은?
  - id: S1-B
    audience: B
    source_flow: 2025 선행학습 영향평가 결과보고서 문항카드 04 문항 해설
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        함수 $f(x)$는 닫힌구간 $[n,n+2k]$에서 연속이고 열린구간 $(n,n+2k)$에서 미분가능하므로 평균값 정리에 의하여 $0<c_k<2k$인 어떤 $c_k$에 대하여 $\dfrac{f(n+2k)-f(n)}{n+2k-n}=f'(n+c_k)$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        한편 $f'(x)=\dfrac{x^{2025}+x^{2024}+1}{x^{2025}+x^{1885}+1}$이고 $\displaystyle\lim_{n\to\infty}f'(n+c_k)=\lim_{n\to\infty}\dfrac{(n+c_k)^{2025}+(n+c_k)^{2024}+1}{(n+c_k)^{2025}+(n+c_k)^{1885}+1}=1$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $\displaystyle\lim_{n\to\infty}\sum_{k=2}^{10}\dfrac{f(n+2k)-f(n)}{(k-1)k(k+1)}=\lim_{n\to\infty}\sum_{k=2}^{10}\dfrac{2f'(n+c_k)}{(k-1)(k+1)}=\sum_{k=2}^{10}\lim_{n\to\infty}\dfrac{2f'(n+c_k)}{(k-1)(k+1)}=\sum_{k=2}^{10}\dfrac{2}{(k-1)(k+1)}$
      criteria: ['1.M2']
    - id: 1b-4
      content: |
        $\displaystyle=\sum_{k=2}^{10}\left(\dfrac{1}{k-1}-\dfrac{1}{k+1}\right)=1+\dfrac12-\dfrac1{10}-\dfrac1{11}=\dfrac{72}{55}$
      criteria: ['1.A2']
