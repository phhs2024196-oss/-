intent: |
  함수의 뜻과 함수의 합성을 이해하고 합의 법칙을 이용하여 조건을 만족시키는 자연수의 개수를 구할 수 있는지를 평가한다. [문제 3-1] 함수의 개념을 이해하고 조건을 만족시키는 경우의 수를 구하는 문제이다. [문제 3-2] 함수의 합성을 이해하고 조건을 만족시키는 경우의 수를 구하는 문제이다.
key_idea: |
  $2025=3^4\times5^2$이므로 $f(n)=\dfrac{2025}{\gcd(n,2025)}$이다. 3-1은 $\gcd(n,2025)=\gcd(n^2,2025)$인 경우, 3-2는 $n$이 2025의 약수인지로 나눈다.
stuck: |
  $f(n)$이 $n$의 $3$, $5$ 지수에만 의존한다는 것을 알아차리고, $n^2$에서 지수가 두 배가 되어도 $\gcd$가 변하지 않는 경우(서로소이거나 $3^4$·$5^2$로 이미 포화)를 정확히 분류하는 것
