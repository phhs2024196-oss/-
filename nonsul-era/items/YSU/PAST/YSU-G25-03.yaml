stimuli: []

stem: |
  [문제 3, 단답형] 자연수 $n$에 대하여 $nk$가 $2025$의 배수가 되도록 하는 자연수 $k$ 중에서 가장 작은 수를 $f(n)$이라 하자.
  함수 $f(n)$에 대하여 다음 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    [문제 3-1] $f(n)=f(n^2)$이 되도록 하는 $2025$ 이하의 자연수 $n$의 개수를 구하시오.
  points: 8
  depends_on: []
  answer: {kind: value, value: '1155', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $n$이 $2025$와 서로소인 경우 $1080$개, 아닌 경우는 $3^4$의 배수(5의 배수 아님) $20$개, $5^2$의 배수(3의 배수 아님) $54$개, $2025$ 자신 $1$개.
    steps:
    - {id: 1a, content: '$1080+20+54+1=1155$', criteria: ['1.M1', '1.A1', '1.M2', '1.A2']}
    hint_ladder:
    - $2025$를 소인수분해하자.
    - $n$이 $3$의 배수이지만 $81$의 배수가 아니면 $f(n)$과 $f(n^2)$은 같을까?
  - id: S1-B
    audience: B
    source_flow: 2025 선행학습 영향평가 결과보고서 문항카드 05 문항 해설 [문제 3-1]
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $2025=3^4\times5^2$이므로 다음과 같이 나누어 생각한다.
        (i) $n$이 $2025$와 서로소인 경우: $f(n)=f(n^2)=2025$를 만족시킨다. $2025$ 이하의 자연수 중 $3$의 배수는 $675$개, $5$의 배수는 $405$개, $15$의 배수는 $135$개이므로 $3$의 배수 또는 $5$의 배수인 자연수는 $675+405-135=945$개이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        그러므로 (i)의 경우의 수는 $2025-945=1080$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        (ii) $n$이 $2025$와 서로소가 아닌 경우: 다음 경우가 $f(n)=f(n^2)$을 만족시킨다.
        ① $n$이 $3^4$의 배수이지만 $5$의 배수가 아닌 경우: $2025=3^4\times25$이고 $1\times3^4,2\times3^4,\cdots,25\times3^4$ 중 $5$의 배수가 아닌 수의 개수는 $25-5=20$.
        ② $n$이 $5^2$의 배수이지만 $3$의 배수가 아닌 경우: $2025=5^2\times81$이고 $1\times5^2,2\times5^2,\cdots,81\times5^2$ 중 $3$의 배수가 아닌 수의 개수는 $81-27=54$.
        ③ $n$이 $3^4$의 배수이면서 $5^2$의 배수인 경우: $n=2025$이므로 개수는 $1$.
      criteria: ['1.M2']
    - id: 1b-4
      content: |
        그러므로 (ii)의 경우의 수는 $20+54+1=75$이고, (i), (ii)에 의해 구하는 경우의 수는 $1080+75=1155$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        $2025=3^4\times5^2$으로 분해하고 $2025$와 서로소인 $n$이 조건을 만족함을 밝혔다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        포함배제로 서로소인 $n$의 개수 $1080$을 구했다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: |
        서로소가 아닌 경우를 $3^4$의 배수(5의 배수 아님), $5^2$의 배수(3의 배수 아님), $2025$로 분류했다.
      depends_on: []
      implied_ok: false
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: |
        $20+54+1=75$를 더해 $1155$를 얻었다.
      depends_on: [1.A1, 1.M2]
      steps: [1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []
- id: '2'
  stem: |
    [문제 3-2] $f(f(n))<n$이 되도록 하는 $2025$ 이하의 자연수 $n$의 개수를 구하시오.
  points: 7
  depends_on: []
  answer: {kind: value, value: '2010', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $n$이 $2025$의 약수이면 $f(f(n))=n$, 아니면 $f(f(n))=\dfrac{n}{m}<n$ ($m\ge2$)이므로 $2025-15=2010$.
    steps:
    - {id: 2a, content: '$2025-(2025의\ 약수의\ 개수)=2025-15=2010$', criteria: ['2.M1', '2.A1', '2.M2', '2.A2']}
    hint_ladder:
    - $f(n)$은 항상 $2025$의 약수이다.
    - $n$이 $2025$의 약수일 때 $f(f(n))$은?
  - id: S2-B
    audience: B
    source_flow: 2025 선행학습 영향평가 결과보고서 문항카드 05 문항 해설 [문제 3-2]
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $f(n)\le2025$이므로 다음과 같이 나누어 생각한다.
        (i) $n$이 $2025$의 약수인 경우: $f(n)=\dfrac{2025}{n}$, $f(f(n))=f\!\left(\dfrac{2025}{n}\right)=n$이므로 $f(f(n))<n$을 만족시키지 못한다.
      criteria: ['2.M1', '2.A1']
    - id: 2b-2
      content: |
        (ii) $n$이 $2025$의 약수가 아닌 경우: $n=m\times3^k\times5^l$이라 하자(단, $k=0,1,2,3,4$, $l=0,1,2$이고 $m$은 $15$와 서로소인 $2$ 이상의 자연수). $f(n)=3^{4-k}\times5^{2-l}$, $f(f(n))=f(3^{4-k}\times5^{2-l})=3^k\times5^l=\dfrac{n}{m}<n$.
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        따라서 (i), (ii)에 의해 구하는 경우의 수는 $2025-(2025$의 약수의 개수$)=2025-15=2010$이다.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: |
        $n$이 $2025$의 약수인 경우와 아닌 경우로 나누었다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 1
      evidence: |
        $n$이 $2025$의 약수이면 $f(f(n))=n$이라 조건을 만족하지 않음을 보였다.
      depends_on: [2.M1]
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 2
      evidence: |
        약수가 아닌 $n=m\times3^k\times5^l$에 대해 $f(f(n))=3^k5^l=\dfrac nm<n$임을 보였다.
      depends_on: []
      implied_ok: false
      steps: [2b-2]
    - id: 2.A2
      mark_type: A
      points: 2
      evidence: |
        약수의 개수 $15$를 빼서 $2010$을 얻었다.
      depends_on: [2.A1, 2.M2]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

