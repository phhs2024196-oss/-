stimuli: []

stem: |
  [문제 4, 단답형] $2$ 이상의 자연수 $\alpha$에 대하여 두 수열 $\{a_n\}$, $\{b_n\}$의 일반항이 다음과 같다.
  $$a_n=\ln\left(\dfrac{n+1}{n}\right)-\dfrac{1}{n+1},\qquad b_n=\dfrac{1}{1-\alpha}\left(\dfrac{1}{(n+1)^{\alpha-1}}-\dfrac{1}{n^{\alpha-1}}\right)-\dfrac{1}{(n+1)^{\alpha}}$$
  다음 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    [문제 4-1] 다음 수열의 극한값을 구하시오.
    $$\left\{n(3n+1)^3a_n^{\,2}\right\}$$
  points: 5
  depends_on: []
  answer: {kind: value, value: '27/4', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\dfrac{1}{2(n+1)(n+2)}\le a_n\le\dfrac{1}{2n(n+1)}$이므로 $n(3n+1)^3a_n^2\to\dfrac{27}{4}$.
    steps:
    - {id: 1a, content: '$\dfrac{n(3n+1)^3}{4(n+1)^2(n+2)^2}\le n(3n+1)^3a_n^2\le\dfrac{n(3n+1)^3}{4n^2(n+1)^2}$', criteria: ['1.M1', '1.A1', '1.A2']}
    hint_ladder:
    - $a_n$을 $y=\frac1x$ 아래 넓이와 직사각형 넓이의 차로 보자.
    - 그 차를 삼각형 넓이로 위아래에서 누를 수 있는가?
  - id: S1-B
    audience: B
    source_flow: 2025 선행학습 영향평가 결과보고서 문항카드 06 문항 해설 (공통 부등식 + [문제 4-1])
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $c_n=\displaystyle\int_n^{n+1}\dfrac{1}{x^\alpha}dx-\dfrac{1}{(n+1)^\alpha}$이라 하면 $c_n=a_n$ $(\alpha=1)$, $c_n=b_n$ $(\alpha\ne1)$이 성립한다. $f(x)=\dfrac{1}{x^\alpha}$는 $(0,\infty)$에서 감소하고 아래로 볼록하다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        세 점 $(n+1,f(n+1))$, $(n+1,f(n+2))$, $(n+2,f(n+2))$를 꼭짓점으로 하는 삼각형의 넓이는 $\dfrac12\left\{\dfrac{1}{(n+1)^\alpha}-\dfrac{1}{(n+2)^\alpha}\right\}$이다. 평균값 정리에 의하여 $0<\theta<1$인 어떤 $\theta$에 대하여 $\dfrac{1}{(n+1)^\alpha}-\dfrac{1}{(n+2)^\alpha}=\dfrac{\alpha(n+1+\theta)^{\alpha-1}}{(n+1)^\alpha(n+2)^\alpha}\le\dfrac{\alpha}{(n+1)^{\alpha+1}}$, 즉 $\dfrac{1}{(n+2)^\alpha}-\dfrac{1}{(n+1)^\alpha}\ge-\dfrac{\alpha}{(n+1)^{\alpha+1}}=f'(n+1)$이므로 (그림) $\dfrac12\left\{\dfrac{1}{(n+1)^\alpha}-\dfrac{1}{(n+2)^\alpha}\right\}\le c_n$이다. 한편 $c_n$은 세 점 $(n,f(n))$, $(n,f(n+1))$, $(n+1,f(n+1))$이 이루는 삼각형의 넓이보다 작다. 따라서
        $$\dfrac12\left\{\dfrac{1}{(n+1)^\alpha}-\dfrac{1}{(n+2)^\alpha}\right\}\le c_n\le\dfrac12\left\{\dfrac{1}{n^\alpha}-\dfrac{1}{(n+1)^\alpha}\right\}$$
      criteria: ['1.M1']
    - id: 1b-3
      content: |
        $\alpha=1$이면 $\dfrac{1}{2(n+1)(n+2)}\le a_n\le\dfrac{1}{2n(n+1)}$이므로 $\dfrac{n(3n+1)^3}{4(n+1)^2(n+2)^2}\le n(3n+1)^3a_n^{\,2}\le\dfrac{n(3n+1)^3}{4n^2(n+1)^2}$.
      criteria: ['1.A1']
    - id: 1b-4
      content: |
        따라서 수열의 극한의 대소 관계에 의하여 $\displaystyle\lim_{n\to\infty}n(3n+1)^3a_n^{\,2}=\dfrac{27}{4}$.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        $a_n$을 위아래에서 $n^{-2}$ 차수의 식으로 누르는 부등식(삼각형 넓이 또는 평균값 정리)을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2]
    - id: 1.A1
      mark_type: A
      points: 1
      evidence: |
        $\dfrac{1}{2(n+1)(n+2)}\le a_n\le\dfrac{1}{2n(n+1)}$ 또는 동등한 양쪽 부등식을 얻었다.
      depends_on: [1.M1]
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: |
        극한의 대소 관계로 $\dfrac{27}{4}$를 얻었다.
      depends_on: [1.M1, 1.A1]
      steps: [1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []
- id: '2'
  stem: |
    [문제 4-2] $\displaystyle\lim_{n\to\infty}n^pb_n=L\,(L\ne0)$일 때, $p+L$을 $\alpha$에 관한 식으로 나타내시오.
  points: 10
  depends_on: []
  answer: {kind: expression, value: '3*alpha/2 + 1', equivalents: ['(3*alpha+2)/2'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 공통 부등식과 평균값 정리로 $\dfrac{\alpha}{2}\dfrac{n^{p-(\alpha+1)}}{(1+2/n)^{\alpha+1}}\le n^pb_n\le\dfrac{\alpha}{2}n^{p-(\alpha+1)}$, 따라서 $p=\alpha+1$, $L=\dfrac\alpha2$.
    steps:
    - {id: 2a, content: '$p+L=\alpha+1+\dfrac{\alpha}{2}=\dfrac{3\alpha}{2}+1$', criteria: ['2.M1', '2.A1', '2.R1', '2.A2']}
    hint_ladder:
    - 4-1에서 쓴 위아래 부등식을 $b_n$에도 쓸 수 있다.
    - $\frac{1}{n^\alpha}-\frac{1}{(n+1)^\alpha}$을 평균값 정리로 $n^{-(\alpha+1)}$ 차수의 식으로 누르자.
  - id: S2-B
    audience: B
    source_flow: 2025 선행학습 영향평가 결과보고서 문항카드 06 문항 해설 [문제 4-2]
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        공통 부등식 $\dfrac12\left\{\dfrac{1}{(n+1)^\alpha}-\dfrac{1}{(n+2)^\alpha}\right\}\le b_n\le\dfrac12\left\{\dfrac{1}{n^\alpha}-\dfrac{1}{(n+1)^\alpha}\right\}$에서 출발한다. 평균값 정리에 의하여 $0<\theta<1$인 어떤 $\theta$에 대하여 $\dfrac{1}{(n+1)^\alpha}-\dfrac{1}{(n+2)^\alpha}=\dfrac{\alpha(n+1+\theta)^{\alpha-1}}{(n+1)^\alpha(n+2)^\alpha}\ge\dfrac{\alpha}{(n+2)^{\alpha+1}}$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        같은 방식으로 $\dfrac{1}{n^\alpha}-\dfrac{1}{(n+1)^\alpha}\le\dfrac{\alpha}{n^{\alpha+1}}$을 얻는다. 따라서
        $$\dfrac{\alpha}{2}\dfrac{n^{p-(\alpha+1)}}{\left(1+\dfrac2n\right)^{\alpha+1}}=\dfrac12\dfrac{\alpha n^p}{(n+2)^{\alpha+1}}\le n^pb_n\le\dfrac12\dfrac{\alpha n^p}{n^{\alpha+1}}=\dfrac{\alpha}{2}n^{p-(\alpha+1)}$$
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        수열의 극한의 대소 관계에 의하여 수열 $\{n^pb_n\}$의 극한이 $0$이 아니기 위해서는 $p=\alpha+1$이어야 하고 이때의 극한값은 $L=\dfrac{\alpha}{2}$이다.
      criteria: ['2.R1']
    - id: 2b-4
      content: |
        그러므로 $p+L=\dfrac{3\alpha}{2}+1$이다.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        $b_n$에 대한 위아래 부등식을 세우고 평균값 정리로 차 $\frac{1}{(n+1)^\alpha}-\frac{1}{(n+2)^\alpha}$를 아래에서 평가했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        $\dfrac{\alpha}{2}\dfrac{n^{p-(\alpha+1)}}{(1+2/n)^{\alpha+1}}\le n^pb_n\le\dfrac{\alpha}{2}n^{p-(\alpha+1)}$ 또는 동등한 부등식을 얻었다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.R1
      mark_type: R
      points: 2
      evidence: |
        극한이 $0$이 아닌 실수가 되려면 $p=\alpha+1$이어야 함을 근거와 함께 밝혔다.
      depends_on: [2.A1]
      steps: [2b-3]
    - id: 2.A2
      mark_type: A
      points: 2
      evidence: |
        $L=\dfrac\alpha2$, $p+L=\dfrac{3\alpha}{2}+1$을 얻었다.
      depends_on: [2.R1]
      steps: [2b-4]
    deductions: []
