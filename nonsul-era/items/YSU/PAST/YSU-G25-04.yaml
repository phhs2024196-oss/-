intent: |
  평균값 정리, 수열의 극한의 기본 성질을 이해하고 함수의 그래프의 개형을 바탕으로 곡선으로 둘러싸인 도형의 넓이와 관련된 문제를 해결할 수 있는지 평가한다. [문제 4-1] 수열의 극한의 대소 관계를 이용하여 수열의 극한값을 구하는 문제이다. [문제 4-2] 평균값의 정리와 수열의 극한의 성질을 이용하여 수열의 극한값을 구하는 문제이다.
key_idea: |
  $c_n=\int_n^{n+1}\frac{1}{x^\alpha}dx-\frac{1}{(n+1)^\alpha}$로 두면 $a_n$($\alpha=1$), $b_n$($\alpha\ne1$)이 되고, 볼록성과 평균값 정리로 $\frac12\left\{\frac{1}{(n+1)^\alpha}-\frac{1}{(n+2)^\alpha}\right\}\le c_n\le\frac12\left\{\frac1{n^\alpha}-\frac{1}{(n+1)^\alpha}\right\}$를 얻어 샌드위치한다.
stuck: |
  $a_n$, $b_n$을 곡선 $y=\frac1{x^\alpha}$ 아래 넓이와 직사각형 넓이의 차로 해석하고, 그 차를 두 삼각형 넓이로 위·아래에서 누르는 발상
