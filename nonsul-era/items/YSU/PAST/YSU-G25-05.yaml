intent: |
  접선의 방정식을 구하여 등비급수와 관련된 문제를 해결하는 과정 및 정적분과 급수의 합 사이의 관계를 이해하여 극한값을 구할 수 있는지 평가한다. [문제 5-1] 접선의 방정식을 구하고 등비급수를 구하는 문제이다. [문제 5-2] 정적분과 급수의 합 사이의 관계를 이해하여 극한값을 구하는 문제이다.
key_idea: |
  접선의 $x$절편 점화식 $x_{n+1}=\frac12x_n$으로 $a_k=2k$를 얻고, 법선의 $x$절편 $b_k=16k^3+2k$에서 $b_m-a_m=16m^3$. 곱의 로그를 취하면 구분구적법 $\int_0^14x^2\ln\left(\frac{x^3}{2}+1\right)dx$가 된다.
stuck: |
  곱의 극한에 로그를 취해 $\sum\frac{4k^2}{m^3}\ln\left\{\frac12\left(\frac km\right)^3+1\right\}$을 정적분으로 바꾸는 발상
