stimuli: []

stem: |
  [문제 5, 서술형] 수열 $\{x_n\}$이 다음 조건을 만족시킬 때, 물음에 답하시오.

  (Ⅰ) $x_1=k$(단, $k$는 자연수)
  (Ⅱ) 모든 자연수 $n$에 대하여 $x_{n+1}$은 곡선 $y=x^2$ 위의 점 $(x_n,\ x_n^{\,2})$에서의 접선의 $x$절편이다.

subparts:
- id: '1'
  stem: |
    [문제 5-1] $a_k=\displaystyle\sum_{n=1}^{\infty}x_n$이라고 할 때, $a_{2025}$의 값을 구하시오.
  points: 5
  depends_on: []
  answer: {kind: value, value: '4050', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 접선의 $x$절편은 $x_{n+1}=\frac12x_n$이므로 $a_k=\dfrac{k}{1-\frac12}=2k$.
    steps:
    - {id: 1a, content: '$a_{2025}=2\times2025=4050$', criteria: ['1.M1', '1.A1', '1.A2']}
    hint_ladder:
    - 접선의 방정식에 $y=0$을 넣어 보자.
  - id: S1-B
    audience: B
    source_flow: 2025 선행학습 영향평가 결과보고서 문항카드 07 문항 해설 [문제 5-1]
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)=x^2$이라 하자. $(x_n,x_n^{\,2})$에서 곡선 $y=x^2$에 접하는 직선의 방정식은 $y-f(x_n)=f'(x_n)(x-x_n)$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $f'(x)=2x$이므로 $x_{n+1}=-\dfrac{f(x_n)}{f'(x_n)}+x_n$에서 $x_{n+1}=\dfrac12x_n$이다. 수열 $\{x_n\}$은 첫째항이 $k$이고 공비가 $\dfrac12$인 등비수열이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $a_k=\displaystyle\sum_{n=1}^{\infty}x_n=\sum_{n=1}^{\infty}k\times\left(\dfrac12\right)^{n-1}=\dfrac{k}{1-\frac12}=2k$이다. 따라서 $a_{2025}=4050$.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        점 $(x_n,x_n^2)$에서의 접선의 방정식을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 1
      evidence: |
        $x_{n+1}=\dfrac12x_n$을 얻었다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: |
        등비급수 합 $a_k=2k$와 $a_{2025}=4050$을 얻었다.
      depends_on: [1.M1, 1.A1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []
- id: '2'
  stem: |
    [문제 5-2] [문제 5-1] 에서 주어진 $a_k$에 대하여 곡선 $y=x^2$ 위의 점 $(a_k,\ a_k^{\,2})$에서의 접선을 $l$이라 하자. 점 $(a_k,\ a_k^{\,2})$을 지나고 직선 $l$에 수직인 직선의 $x$절편을 $b_k$라고 할 때, 다음 극한값을 구하시오.
    $$\lim_{m\to\infty}\left\{\left(\dfrac{a_1^{\,3}}{b_m-a_m}+1\right)^{\frac{a_1^{\,2}}{m^3}}\times\left(\dfrac{a_2^{\,3}}{b_m-a_m}+1\right)^{\frac{a_2^{\,2}}{m^3}}\times\cdots\times\left(\dfrac{a_m^{\,3}}{b_m-a_m}+1\right)^{\frac{a_m^{\,2}}{m^3}}\right\}$$
  points: 15
  depends_on: ['1']
  answer: {kind: expression, value: '81*exp(-4/3)/16', equivalents: ['exp(4*log(3/2) - 4/3)'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $b_m-a_m=16m^3$이므로 로그를 취하면 $\sum_{k=1}^m\frac{4k^2}{m^3}\ln\left\{\frac12\left(\frac km\right)^3+1\right\}\to\int_0^14x^2\ln\left(\frac{x^3}{2}+1\right)dx=4\ln\frac32-\frac43$.
    steps:
    - {id: 2a, content: '극한값 $=e^{4\ln\frac32-\frac43}=\dfrac{81}{16}e^{-\frac43}$', criteria: ['2.M1', '2.A1', '2.M2', '2.A2', '2.A3']}
    hint_ladder:
    - $b_m-a_m$을 $m$으로 나타내 보자.
    - 곱의 극한은 로그를 취하면 합의 극한이 된다.
  - id: S2-B
    audience: B
    source_flow: 2025 선행학습 영향평가 결과보고서 문항카드 07 문항 해설 [문제 5-2]
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $a_k=2k$이고 접선 $l$의 기울기는 $4k$이므로 주어진 $l$에 수직인 직선의 방정식은 $y=-\dfrac{1}{4k}(x-2k)+4k^2$이고 $b_k=16k^3+2k$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $c_m=\left(\dfrac{a_1^{\,3}}{b_m-a_m}+1\right)^{\frac{a_1^{\,2}}{m^3}}\times\cdots\times\left(\dfrac{a_m^{\,3}}{b_m-a_m}+1\right)^{\frac{a_m^{\,2}}{m^3}}$이라 하자. $b_m-a_m=16m^3$이므로
        $c_m=\left(\dfrac{1^3}{2\times m^3}+1\right)^{\frac{4\times1^2}{m^3}}\times\left(\dfrac{2^3}{2\times m^3}+1\right)^{\frac{4\times2^2}{m^3}}\times\cdots\times\left(\dfrac{m^3}{2\times m^3}+1\right)^{\frac{4\times m^2}{m^3}}$.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        $\displaystyle\lim_{m\to\infty}c_m=\alpha$라 하자. $\ln c_m=\sum_{k=1}^{m}\dfrac{4k^2}{m^3}\ln\left\{\dfrac12\left(\dfrac km\right)^3+1\right\}$이므로
        $\displaystyle\lim_{m\to\infty}\ln c_m=\lim_{m\to\infty}\sum_{k=1}^{m}\dfrac{4k^2}{m^3}\ln\left\{\dfrac12\left(\dfrac km\right)^3+1\right\}=\int_0^1 4x^2\ln\left(\dfrac{x^3}{2}+1\right)dx$.
      criteria: ['2.M2']
    - id: 2b-4
      content: |
        $\displaystyle\int_0^1 4x^2\ln\left(\dfrac{x^3}{2}+1\right)dx=4\ln\dfrac32-\dfrac43$.
      criteria: ['2.A2']
    - id: 2b-5
      content: |
        $\ln\alpha=4\ln\dfrac32-\dfrac43$이므로 $\alpha=e^{4\ln\frac32-\frac43}=\dfrac{81}{16}e^{-\frac43}$.
      criteria: ['2.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        $l$에 수직인 직선의 방정식을 세워 $b_k=16k^3+2k$를 구했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A2], max_points: 3}
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: |
        $b_m-a_m=16m^3$을 대입해 각 인수를 $\dfrac{k^3}{2m^3}+1$, 지수를 $\dfrac{4k^2}{m^3}$으로 정리했다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.M2
      mark_type: M
      points: 4
      evidence: |
        로그를 취해 합으로 바꾸고 정적분 $\displaystyle\int_0^14x^2\ln\left(\dfrac{x^3}{2}+1\right)dx$로 나타냈다.
      depends_on: []
      implied_ok: false
      steps: [2b-3]
    - id: 2.A2
      mark_type: A
      points: 4
      evidence: |
        정적분 값 $4\ln\dfrac32-\dfrac43$을 구했다.
      depends_on: [2.M2]
      steps: [2b-4]
    - id: 2.A3
      mark_type: A
      points: 2
      evidence: |
        극한값 $\dfrac{81}{16}e^{-\frac43}$을 얻었다.
      depends_on: [2.M2, 2.A2]
      steps: [2b-5]
    deductions: []
