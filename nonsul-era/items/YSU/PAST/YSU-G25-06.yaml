stimuli: []

stem: |
  [문제 6, 서술형] 좌표평면 위의 점 $\mathrm{A}(-2,0)$에 대하여 두 점 $\mathrm{P},\mathrm{Q}$가 다음 조건을 만족시킬 때, 물음에 답하시오.

  (Ⅰ) $\overrightarrow{\mathrm{AP}}$와 $\overrightarrow{\mathrm{AQ}}$는 서로 평행하다.
  (Ⅱ) $\overrightarrow{\mathrm{AP}}\cdot\overrightarrow{\mathrm{AQ}}=9$

subparts:
- id: '1'
  stem: |
    [문제 6-1] 점 $\mathrm{P}$가 원 $C_1:x^2+y^2=1$ 위를 움직이는 점일 때, 점 $\mathrm{Q}$가 나타내는 도형의 식을 구하시오.
  points: 15
  depends_on: []
  answer: {kind: expression, value: '(x-4)**2 + y**2 = 9', equivalents: ['x**2 + y**2 - 8*x + 7 = 0'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{P}(\cos\theta,\sin\theta)$이면 $\mathrm{Q}\left(\frac{8+\cos\theta}{5+4\cos\theta},\frac{9\sin\theta}{5+4\cos\theta}\right)$이고, $\theta$를 소거하면 $(x-4)^2+y^2=9$.
    steps:
    - {id: 1a, content: '$\cos\theta=\dfrac{8-5X}{4X-1}$을 $Y$에 대입해 $(X-4)^2+Y^2=9$', criteria: ['1.M1', '1.A1', '1.M2', '1.A2']}
    hint_ladder:
    - 내적이 양수이면 두 평행한 벡터의 방향은?
    - $\mathrm{Q}$를 직선 $\mathrm{AP}$ 위의 점으로 두고 $x$좌표를 미지수로 잡아 보자.
  - id: S1-B
    audience: B
    source_flow: 2025 선행학습 영향평가 결과보고서 문항카드 08 문항 해설 [문제 6-1]
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\mathrm{P}(\cos\theta,\sin\theta)$라고 하면 직선 $\mathrm{AP}$의 방정식은 $y=\dfrac{\sin\theta}{\cos\theta+2}(x+2)$이다. 두 조건 (Ⅰ), (Ⅱ)에서 두 벡터 $\overrightarrow{\mathrm{AP}}$, $\overrightarrow{\mathrm{AQ}}$는 방향이 같은 벡터이므로 점 $\mathrm{Q}$의 $x$좌표를 $t\,(t\ge-2)$라 하면 $\mathrm{Q}\left(t,\dfrac{\sin\theta}{\cos\theta+2}(t+2)\right)$이고
        $\lvert\overrightarrow{\mathrm{AP}}\rvert=\sqrt{(\cos\theta+2)^2+(\sin\theta)^2}$, $\lvert\overrightarrow{\mathrm{AQ}}\rvert=(t+2)\times\dfrac{\sqrt{(\cos\theta+2)^2+(\sin\theta)^2}}{\cos\theta+2}$.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        조건 (Ⅱ)에서 $\overrightarrow{\mathrm{AP}}\cdot\overrightarrow{\mathrm{AQ}}=(t+2)\times\dfrac{(\cos\theta+2)^2+(\sin\theta)^2}{\cos\theta+2}=9$이고
        $t=\dfrac{9(\cos\theta+2)}{(\cos\theta+2)^2+(\sin\theta)^2}-2=\dfrac{8+\cos\theta}{5+4\cos\theta}$이므로 $\mathrm{Q}\left(\dfrac{8+\cos\theta}{5+4\cos\theta},\dfrac{9\sin\theta}{5+4\cos\theta}\right)$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        점 $\mathrm{Q}$의 좌표를 $\mathrm{Q}(X,Y)$라 하면 $X=\dfrac{8+\cos\theta}{5+4\cos\theta}$, $Y=\dfrac{9\sin\theta}{5+4\cos\theta}$이고 $\cos\theta=\dfrac{8-5X}{4X-1}$, $\sin\theta=\pm\dfrac{\sqrt{72X-63-9X^2}}{4X-1}$.
      criteria: ['1.M2']
    - id: 1b-4
      content: |
        $Y=\dfrac{9\sin\theta}{5+4\cos\theta}=\pm\dfrac13\sqrt{72X-63-9X^2}$이므로 $(X-4)^2+Y^2=9$이다. 따라서 점 $\mathrm{Q}$가 나타내는 도형의 식은 $(x-4)^2+y^2=9$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        $\mathrm{P}$를 매개변수로 나타내고 $\overrightarrow{\mathrm{AQ}}$가 $\overrightarrow{\mathrm{AP}}$와 같은 방향임을 이용해 $\mathrm{Q}$를 한 변수로 표현했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        조건 (Ⅱ)로 $\mathrm{Q}\left(\dfrac{8+\cos\theta}{5+4\cos\theta},\dfrac{9\sin\theta}{5+4\cos\theta}\right)$을 얻었다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: |
        $\cos\theta$, $\sin\theta$를 $X$로 나타내어 매개변수를 소거하려 했다.
      depends_on: []
      implied_ok: true
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: |
        $(x-4)^2+y^2=9$를 얻었다.
      depends_on: [1.A1, 1.M2]
      steps: [1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []
- id: '2'
  stem: |
    [문제 6-2] 아래 그림과 같이 두 원 $C_1:x^2+y^2=1$, $C_2:(x+1)^2+y^2=1$의 서로 다른 두 교점을 $\mathrm{R_1}$, $\mathrm{R_2}$라 하자. 원 $C_1$에서 점 $\mathrm{O^{\prime}}(-1,\ 0)$을 포함하는 호 $\mathrm{R_1O^{\prime}R_2}$와 원 $C_2$에서 점 $\mathrm{O}(0,\ 0)$을 포함하는 호 $\mathrm{R_1OR_2}$로 이루어진 도형을 $R$ (아래 그림에서 굵게 표시된 도형)이라 하자. 점 $\mathrm{P}$가 도형 $R$ 위를 움직이는 점일 때, 점 $\mathrm{Q}$가 나타내는 도형의 길이를 구하시오.

    [그림] 원 $C_1$(중심 $\mathrm{O}(0,0)$, 반지름 $1$)과 원 $C_2$(중심 $\mathrm{O^{\prime}}(-1,0)$, 반지름 $1$)가 위쪽 교점 $\mathrm{R_1}$, 아래쪽 교점 $\mathrm{R_2}$에서 만난다. $C_2$는 $\mathrm{A}(-2,0)$을 지난다. 두 원의 공통 부분(렌즈 모양)의 경계, 즉 $C_1$의 왼쪽 호 $\mathrm{R_1O^{\prime}R_2}$와 $C_2$의 오른쪽 호 $\mathrm{R_1OR_2}$가 굵게 표시되어 있다.
  points: 15
  depends_on: ['1']
  answer: {kind: expression, value: '3*sqrt(3) + 4*pi', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $C_2$ 위 호의 상은 직선 $x=\frac52$ 위 선분 $\mathrm{MN}$(길이 $3\sqrt3$), $C_1$ 위 호의 상은 원 $(x-4)^2+y^2=9$의 중심각 $\frac43\pi$인 호(길이 $4\pi$).
    steps:
    - {id: 2a, content: '$2\times\dfrac{3\sqrt3}{2}+3\times\dfrac43\pi=3\sqrt3+4\pi$', criteria: ['2.M1', '2.A1', '2.M2', '2.A2', '2.A3']}
    hint_ladder:
    - $C_2$ 위의 점 $\mathrm{P}$는 $(\cos\theta-1,\sin\theta)$로 둘 수 있다. 이때 $\overrightarrow{\mathrm{AP}}\cdot\overrightarrow{\mathrm{AQ}}$를 계산해 보자.
    - $C_1$ 위의 부분은 6-1의 결과를 쓰고, 점 $\mathrm{O^{\prime}}$이 옮겨지는 점을 찾자.
  - id: S2-B
    audience: B
    source_flow: 2025 선행학습 영향평가 결과보고서 문항카드 08 문항 해설 [문제 6-2]
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        (i) 점 $\mathrm{P}$가 호 $\mathrm{R_1OR_2}$ 위의 점인 경우: $-\dfrac\pi3\le\theta\le\dfrac\pi3$인 $\theta$에 대하여 $\mathrm{P}(\cos\theta-1,\sin\theta)$라고 하면 [문제 6-1]의 풀이와 같이 $\mathrm{Q}\left(t,\dfrac{\sin\theta}{\cos\theta+1}\times(t+2)\right)$에 대해 주어진 조건 (Ⅱ)를 이용하여
        $\overrightarrow{\mathrm{AP}}\cdot\overrightarrow{\mathrm{AQ}}=\sqrt{(\cos\theta+1)^2+\sin^2\theta}\times(t+2)\times\dfrac{\sqrt{(\cos\theta+1)^2+\sin^2\theta}}{\cos\theta+1}=2(t+2)=9$를 얻는다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $t=\dfrac52$이므로 원 $C_3:(x-4)^2+y^2=9$와 직선 $x=\dfrac52$의 두 교점을 $\mathrm{M}$, $\mathrm{N}$이라 할 때, 점 $\mathrm{Q}$가 나타내는 도형은 선분 $\mathrm{MN}$이다.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        (ii) 점 $\mathrm{P}$가 호 $\mathrm{R_1O^{\prime}R_2}$ 위의 점인 경우: [문제 6-1]의 풀이와 같이 생각하면 점 $\mathrm{T}(7,0)$에 대하여 [문제 6-2]의 조건을 만족하는 점 $\mathrm{Q}$가 나타내는 도형은 중심각의 크기가 $\dfrac43\pi$이고 반지름의 길이가 $3$인 부채꼴의 호 $\mathrm{MTN}$이다.
      criteria: ['2.M2']
    - id: 2b-4
      content: |
        (i), (ii)에 의하여 점 $\mathrm{Q}$가 나타내는 도형은 선분 $\mathrm{MN}$과 호 $\mathrm{MTN}$으로 이루어진 도형이다. $\mathrm{M}\left(\dfrac52,\dfrac{3\sqrt3}{2}\right)$, $\mathrm{N}\left(\dfrac52,-\dfrac{3\sqrt3}{2}\right)$이다.
      criteria: ['2.A2']
    - id: 2b-5
      content: |
        따라서 점 $\mathrm{Q}$가 이루는 도형의 길이는 선분 $\mathrm{MN}$의 길이와 호 $\mathrm{MTN}$의 길이의 합이므로 $2\times\dfrac{3\sqrt3}{2}+3\times\dfrac43\pi=3\sqrt3+4\pi$이다.
      criteria: ['2.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        $C_2$ 위의 점을 $\mathrm{P}(\cos\theta-1,\sin\theta)$로 두고 조건 (Ⅱ)를 $2(t+2)=9$ 꼴로 정리했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        호 $\mathrm{R_1OR_2}$의 상이 직선 $x=\dfrac52$ 위의 선분 $\mathrm{MN}$임을 밝혔다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: |
        호 $\mathrm{R_1O^{\prime}R_2}$의 상이 원 $(x-4)^2+y^2=9$의 호이며 $\mathrm{O^{\prime}}$이 $\mathrm{T}(7,0)$으로 옮겨짐을 이용해 호 $\mathrm{MTN}$을 정했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A2], max_points: 3}
      steps: [2b-3]
    - id: 2.A2
      mark_type: A
      points: 3
      evidence: |
        $\mathrm{M}\left(\dfrac52,\dfrac{3\sqrt3}{2}\right)$, $\mathrm{N}\left(\dfrac52,-\dfrac{3\sqrt3}{2}\right)$과 호의 중심각 $\dfrac43\pi$를 구했다.
      depends_on: [2.A1, 2.M2]
      steps: [2b-4]
    - id: 2.A3
      mark_type: A
      points: 3
      evidence: |
        길이 $3\sqrt3+4\pi$를 얻었다.
      depends_on: [2.M2, 2.A2]
      steps: [2b-5]
    deductions: []
