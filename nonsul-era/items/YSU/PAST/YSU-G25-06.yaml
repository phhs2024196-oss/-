  좌표평면에서 위치벡터와 평면벡터의 내적을 이용하여 벡터와 관련된 문제를 해결할 수 있는지 평가한다. [문제 6-1] 평면벡터의 내적을 이용하여 원의 방정식을 구하는 문제이다. [문제 6-2] 좌표평면에서 위치벡터와 평면벡터의 내적을 이용하여 도형의 길이를 구하는 문제이다.
key_idea: |
  $\overrightarrow{\mathrm{AQ}}$는 $\overrightarrow{\mathrm{AP}}$와 같은 방향이고 $\lvert\overrightarrow{\mathrm{AP}}\rvert\lvert\overrightarrow{\mathrm{AQ}}\rvert=9$이다. $\mathrm{P}$를 매개변수 $\theta$로 두고 $\mathrm{Q}$의 좌표를 구해 소거한다. 6-2에서 $\mathrm{A}$를 지나는 원 $C_2$의 호는 직선 $x=\frac52$ 위 선분으로, $C_1$의 호는 원 $(x-4)^2+y^2=9$의 호로 옮겨진다.
stuck: |
  6-2에서 $C_2$가 점 $\mathrm{A}$를 지나므로 그 호의 상이 원이 아니라 직선 $x=\frac52$ 위의 선분이 된다는 것, 그리고 $C_1$ 호의 상이 중심각 $\frac43\pi$인 호라는 것을 판단하는 것
