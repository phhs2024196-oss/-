  수학, 확률과 통계, 미적분 과목에서 출제. 규칙성을 이용해 주어진 확률값을 정확하게 계산하여 기댓값을 계산하는 과정을 통해 창의력과 논리적 사고력을 평가한다. [문제 1-1] 여러 수학적 방법을 이용하여 확률변수의 기댓값을 구하고, [문제 1-2] 약수와 배수, 확률 등을 이용하여 확률변수의 기댓값을 구한다.
key_idea: |
  (1-1) 부분적분으로 $X=m(e-1)-n(e-2)$로 바꾸고 $m$, $n$이 각 값을 29번씩 가짐을 쓴다. (1-2) 서로소 조건 때문에 각 소인수의 거듭제곱 $p_i^{a_i}$는 $x,y,z$ 중 하나에만 통째로 들어가므로 순서쌍 수는 $3^k$, 여기서 $(1,1,N)$형 3개를 빼고 $3!$로 나누어 $Y=\dfrac{3^k-3}{6}$이다.
stuck: |
  $Y$가 $\dfrac{30!}{mn}$의 서로 다른 소인수의 개수 $k$에만 의존한다는 관찰과, $k=8,9,10$이 되는 $(m,n)$의 개수 세기(지수 1인 소수 17, 19, 23, 29와 지수 2인 13)
