stimuli: []

stem: |
  아래의 [문제 2-1], [문제 2-2]에서 주어진 함수 $f(x)$는 정의역에 속하는 모든 실수 $x$에 대하여 미분가능하고 $f'(x)\neq0$이다. 이때 곡선 $y=f(x)$ 위의 점 $\mathrm{P}$에서의 접선이 $x$축, $y$축과 만나는 점을 각각 $\mathrm{A}$, $\mathrm{B}$라 하자.
  $\overrightarrow{\mathrm{OA}}+\overrightarrow{\mathrm{OB}}=\overrightarrow{\mathrm{OP}}+\overrightarrow{\mathrm{OQ}}$를 만족시키는 점 $\mathrm{Q}$의 $x$좌표, $y$좌표를 각각 $X$, $Y$라 할 때, 다음 물음에 답하시오. (단, $\mathrm{O}$는 원점이다.)

subparts:
- id: '1'
  stem: |
    [문제 2-1] 두 양수 $a$, $b$에 대하여 $f(x)=\sqrt{b^2\left(1-\dfrac{x^2}{a^2}\right)}\ (0<x<a)$일 때, $XY$의 최댓값을 구하시오. [15점]
  points: 15
  depends_on: []
  answer: {kind: expression, value: 'a*b/2', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $XY=\alpha f(\alpha)=b\alpha\sqrt{1-\alpha^2/a^2}$이고 $\alpha=\dfrac{a}{\sqrt2}$에서 최대 $\dfrac{ab}{2}$.
    steps:
    - {id: 1a, content: '$XY=\alpha f(\alpha)$, $F(x)=bx\sqrt{1-x^2/a^2}$, $F(a/\sqrt2)=ab/2$', criteria: ['1.M1', '1.A1', '1.M2', '1.A2']}
    hint_ladder:
    - 접선의 $x$절편과 $y$절편을 $\alpha$, $f(\alpha)$, $f'(\alpha)$로 나타내 보자.
    - $\overrightarrow{\mathrm{OQ}}=\overrightarrow{\mathrm{OA}}+\overrightarrow{\mathrm{OB}}-\overrightarrow{\mathrm{OP}}$이다.
  - id: S1-B
    audience: B
    source_flow: 2025 선행학습 영향평가 결과보고서 문항카드 10 문항 해설
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\mathrm{P}(\alpha,f(\alpha))$라 하면 접선은 $y=f'(\alpha)(x-\alpha)+f(\alpha)$이며 점 $\mathrm{A}$의 $x$좌표는 $-\dfrac{f(\alpha)}{f'(\alpha)}+\alpha$, 점 $\mathrm{B}$의 $y$좌표는 $-\alpha f'(\alpha)+f(\alpha)$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $\overrightarrow{\mathrm{OA}}+\overrightarrow{\mathrm{OB}}=\overrightarrow{\mathrm{OP}}+\overrightarrow{\mathrm{OQ}}$에서 $X=-\dfrac{f(\alpha)}{f'(\alpha)}$, $Y=-\alpha f'(\alpha)$이며 $XY=\alpha f(\alpha)$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $F(x)=xf(x)=x\sqrt{b^2\left(1-\dfrac{x^2}{a^2}\right)}=bx\sqrt{1-\dfrac{x^2}{a^2}}$라 하면 $F'(x)=\dfrac{b}{\sqrt{1-\frac{x^2}{a^2}}}\left(1-\dfrac{2x^2}{a^2}\right)$.
      criteria: ['1.M2']
    - id: 1b-4
      content: |
        $x=\dfrac{a}{\sqrt2}$일 때 $F'(x)=0$이고 이때 $F(x)$가 최댓값을 갖는다. 따라서 $XY$는 최댓값 $F\left(\dfrac{a}{\sqrt2}\right)=\dfrac{ab}{2}$를 갖는다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        점 $\mathrm{P}$에서의 접선을 세우고 $\mathrm{A}$, $\mathrm{B}$의 좌표(절편)를 구했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        $X=-\dfrac{f(\alpha)}{f'(\alpha)}$, $Y=-\alpha f'(\alpha)$, $XY=\alpha f(\alpha)$를 얻었다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: |
        $F(x)=xf(x)$를 미분해 $F'(x)=0$인 점을 찾았다.
      depends_on: []
      implied_ok: false
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: |
        $x=\dfrac{a}{\sqrt2}$에서 최대이고 최댓값 $\dfrac{ab}{2}$임을 밝혔다.
      depends_on: [1.M2]
      steps: [1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    [문제 2-2] 구간 $(0,\ \infty)$에서 정의된 함수 $f(x)$는 다음 조건을 만족시킨다. (단, 구간 $(0,\ \infty)$에서 $f(x)>0$이다.)

    (Ⅰ) $f(1)=3$
    (Ⅱ) 곡선 $y=f(x)$ 위의 임의의 점 $\mathrm{P}$에 대하여 $XY=c$ ($c$는 상수)이다.

    함수 $\{f(x)\}^2+\dfrac{1}{f(x)}$이 $x=k$에서 최솟값을 가질 때, 실수 $k$의 값을 구하시오. [15점]
  points: 15
  depends_on: []
  answer: {kind: value, value: '54**(1/3)', equivalents: ['3*2**(1/3)'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $XY=\alpha f(\alpha)=c$, $f(1)=3$에서 $f(x)=\dfrac3x$이고 $h(x)=\dfrac{9}{x^2}+\dfrac{x}{3}$은 $x=\sqrt[3]{54}$에서 최소.
    steps:
    - {id: 2a, content: '$f(x)=3/x$, $h''(x)=\dfrac{x^3-54}{3x^3}$, $k=\sqrt[3]{54}$', criteria: ['2.M1', '2.A1', '2.M2', '2.A2']}
    hint_ladder:
    - 공통 발문에서 $XY$를 $\alpha$와 $f(\alpha)$로 나타내 보자.
    - $xf(x)$가 상수이면 $f$는 어떤 함수인가?
  - id: S2-B
    audience: B
    source_flow: 2025 선행학습 영향평가 결과보고서 문항카드 10 문항 해설
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $\mathrm{P}(\alpha,f(\alpha))$라 하면 접선은 $y=f'(\alpha)(x-\alpha)+f(\alpha)$이며 점 $\mathrm{A}$의 $x$좌표는 $-\dfrac{f(\alpha)}{f'(\alpha)}+\alpha$, 점 $\mathrm{B}$의 $y$좌표는 $-\alpha f'(\alpha)+f(\alpha)$이다. 따라서 $X=-\dfrac{f(\alpha)}{f'(\alpha)}$, $Y=-\alpha f'(\alpha)$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $XY=\alpha f(\alpha)$는 $\alpha$의 값과 무관하게 상수 $c$가 되는데, $XY=1\times f(1)=3$이므로 $c=3$이다. 따라서 $f(x)=\dfrac3x\ (x>0)$.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        $h(x)=\{f(x)\}^2+\dfrac{1}{f(x)}$로 놓으면 $h(x)=\dfrac{9}{x^2}+\dfrac{x}{3}$, $h'(x)=\dfrac{x^3-54}{3x^3}$이다.
      criteria: ['2.M2']
    - id: 2b-4
      content: |
        $h(x)$는 $x=\sqrt[3]{54}$에서 최솟값을 가지므로 $k=\sqrt[3]{54}$이다.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: |
        접선의 절편으로 $X$, $Y$를 표현해 $XY=\alpha f(\alpha)$를 얻었다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 4
      evidence: |
        $c=3$, $f(x)=\dfrac3x$를 얻었다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.M2
      mark_type: M
      points: 4
      evidence: |
        $h(x)=\dfrac{9}{x^2}+\dfrac{x}{3}$을 미분해 증감을 조사했다.
      depends_on: []
      implied_ok: false
      steps: [2b-3]
    - id: 2.A2
      mark_type: A
      points: 3
      evidence: |
        $k=\sqrt[3]{54}$를 얻었다.
      depends_on: [2.M2]
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

