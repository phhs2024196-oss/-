intent: |
  수학Ⅱ, 기하, 미적분 과목에서 출제. 주어진 곡선의 접선의 방정식을 구하고 이를 통해 최댓값, 최솟값을 미적분을 이용하여 계산하는 능력을 평가한다. [문제 2-1] 접선의 방정식을 구하고 이를 통해 식의 최댓값을 구하고, [문제 2-2] 미분법을 이용하여 최솟값을 갖는 $x$의 값을 구한다.
key_idea: |
  접점 $\mathrm{P}(\alpha,f(\alpha))$에서 접선의 절편으로 $X=-\dfrac{f(\alpha)}{f'(\alpha)}$, $Y=-\alpha f'(\alpha)$이므로 $XY=\alpha f(\alpha)$이다.
stuck: |
