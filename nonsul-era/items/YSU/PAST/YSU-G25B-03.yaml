intent: |
  수학Ⅱ, 기하, 미적분 과목에서 출제. 좌표평면에서 위치벡터와 평면벡터의 내적을 이용하여 벡터와 관련된 문제를 미적분을 이용하여 해결할 수 있는지 평가한다. [문제 3-1] 위치벡터와 평면벡터의 내적을 이용하여 정적분을 구하고, [문제 3-2] 내적의 최댓값을 구하며, [문제 3-3] 내적을 이용하여 부등식을 증명한다.
key_idea: |
  조건 (Ⅰ)에서 $\overrightarrow{\mathrm{PQ}}=-a\overrightarrow{\mathrm{OP}}$, (Ⅱ)에서 $\overrightarrow{\mathrm{PR}}=\alpha(g'(t),-f'(t))$ 꼴(부호는 $\overrightarrow{\mathrm{PR}}\cdot\overrightarrow{\mathrm{PQ}}>0$, 크기는 $|\overrightarrow{\mathrm{PR}}|=|\overrightarrow{\mathrm{PQ}}|$로 결정), (Ⅲ)에서 $\overrightarrow{\mathrm{PS}}=-b\overrightarrow{\mathrm{PR}}$로 놓고 성분 계산한다.
stuck: |
  $\overrightarrow{\mathrm{PR}}\perp\overrightarrow{\mathrm{OP'}}$을 $\overrightarrow{\mathrm{PR}}=\alpha(\cdot,\cdot)$로 매개화하고 $\alpha$의 부호·크기를 두 조건으로 정하는 단계, (3-3)에서 $\alpha=a\dfrac{f(t)}{f'(t)}$로 정리되는 것
