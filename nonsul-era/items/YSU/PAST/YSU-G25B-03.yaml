stimuli: []

stem: |
  아래의 [문제 3-1], [문제 3-2], [문제 3-3]에서 주어진 함수 $f(t)$, $g(t)$는 각각 실수 전체의 집합에서 정의된 미분가능한 함수이다. 실수 $t$에 대하여 점 $\mathrm{P}$를 $\mathrm{P}(f(t),\ g(t))$, 점 $\mathrm{P'}$을 $\mathrm{P'}(f'(t),\ g'(t))$라 할 때, 세 점 $\mathrm{Q}$, $\mathrm{R}$, $\mathrm{S}$가 다음 조건을 만족시킨다.
  (단, $\mathrm{O}$는 원점이다.)

  (Ⅰ) $\overrightarrow{\mathrm{OP}}\,/\!/\,\overrightarrow{\mathrm{OQ}}$, $\overrightarrow{\mathrm{OP}}\cdot\overrightarrow{\mathrm{PQ}}<0$, $a|\overrightarrow{\mathrm{OP}}|=|\overrightarrow{\mathrm{PQ}}|$ (단, $a$는 $1$보다 큰 실수이다.)
  (Ⅱ) $\overrightarrow{\mathrm{PR}}\cdot\overrightarrow{\mathrm{OP'}}=0$, $\overrightarrow{\mathrm{PR}}\cdot\overrightarrow{\mathrm{PQ}}>0$, $|\overrightarrow{\mathrm{PR}}|=|\overrightarrow{\mathrm{PQ}}|$
  (Ⅲ) $\overrightarrow{\mathrm{PR}}\,/\!/\,\overrightarrow{\mathrm{PS}}$, $\overrightarrow{\mathrm{PR}}\cdot\overrightarrow{\mathrm{PS}}<0$, $b|\overrightarrow{\mathrm{PR}}|=|\overrightarrow{\mathrm{PS}}|$ (단, $b$는 양의 실수이다.)

  다음 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    [문제 3-1] $a=2$, $b=5$이고 $f(t)=t$, $g(t)=4-2t$일 때, $\displaystyle\int_0^2\left(\overrightarrow{\mathrm{OP}}\cdot\overrightarrow{\mathrm{PS}}\right)^2dt$의 값을 구하시오. [10점]
  points: 10
  depends_on: []
  answer: {kind: value, value: '12800/3', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\overrightarrow{\mathrm{PR}}=\alpha(2,1)$, $\alpha=-\dfrac{2}{\sqrt5}\sqrt{5t^2-16t+16}$, $\overrightarrow{\mathrm{OP}}\cdot\overrightarrow{\mathrm{PS}}=-20\alpha$.
    steps:
    - {id: 1a, content: '$(\overrightarrow{\mathrm{OP}}\cdot\overrightarrow{\mathrm{PS}})^2=320(5t^2-16t+16)$, 적분값 $\tfrac{12800}{3}$', criteria: ['1.M1', '1.A1', '1.A2']}
    hint_ladder:
    - $\overrightarrow{\mathrm{OP'}}=(1,-2)$에 수직인 벡터는 무엇의 실수배인가?
    - $\overrightarrow{\mathrm{PS}}$는 $\overrightarrow{\mathrm{PR}}$의 몇 배인가?
  - id: S1-B
    audience: B
    source_flow: 2025 선행학습 영향평가 결과보고서 문항카드 11 문항 해설
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\overrightarrow{\mathrm{OP}}=(t,4-2t)$, $\overrightarrow{\mathrm{OP'}}=(1,-2)$. $a=2$이므로 조건 (Ⅰ)에서 $\overrightarrow{\mathrm{PQ}}=-2\overrightarrow{\mathrm{OP}}=(-2t,4t-8)$.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        조건 (Ⅱ)에서 $\overrightarrow{\mathrm{PR}}=\alpha(2,1)$ ($\alpha$는 실수)이므로 $\overrightarrow{\mathrm{PQ}}\cdot\overrightarrow{\mathrm{PR}}=-8\alpha>0$, 즉 $\alpha<0$이다.
        $|\overrightarrow{\mathrm{PQ}}|=|\overrightarrow{\mathrm{PR}}|$이므로 $2\sqrt{5t^2-16t+16}=-\alpha\sqrt5$에서 $\alpha=-\dfrac{2}{\sqrt5}\times\sqrt{5t^2-16t+16}$.
      criteria: ['1.M1', '1.A1']
    - id: 1b-3
      content: |
        조건 (Ⅲ)에서 $\overrightarrow{\mathrm{PS}}=-5\overrightarrow{\mathrm{PR}}=-5\alpha(2,1)$. 따라서 $\overrightarrow{\mathrm{OP}}\cdot\overrightarrow{\mathrm{PS}}=-20\alpha$, $(\overrightarrow{\mathrm{OP}}\cdot\overrightarrow{\mathrm{PS}})^2=320(5t^2-16t+16)$이므로
        $\displaystyle\int_0^2(\overrightarrow{\mathrm{OP}}\cdot\overrightarrow{\mathrm{PS}})^2dt=320\int_0^2(5t^2-16t+16)dt=\dfrac{12800}{3}$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        $\overrightarrow{\mathrm{PQ}}=-2\overrightarrow{\mathrm{OP}}$와 $\overrightarrow{\mathrm{PR}}=\alpha(2,1)$로 놓았다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $\alpha<0$과 $\alpha=-\dfrac{2}{\sqrt5}\sqrt{5t^2-16t+16}$을 구했다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: |
        $(\overrightarrow{\mathrm{OP}}\cdot\overrightarrow{\mathrm{PS}})^2=320(5t^2-16t+16)$로 적분해 $\dfrac{12800}{3}$을 얻었다.
      depends_on: [1.M1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    [문제 3-2] $a=5$이고 $f(t)=2\cos t$, $g(t)=\sin t$일 때, 점 $\mathrm{T}(0,\ 1)$에 대하여 $0\le t\le\dfrac{\pi}{2}$에서 $\left(\overrightarrow{\mathrm{OT}}\cdot\overrightarrow{\mathrm{PR}}\right)^2$의 최댓값을 구하시오. [15점]
  points: 15
  depends_on: []
  answer: {kind: value, value: '200*(3-sqrt(5))/3', equivalents: ['200 - 200*sqrt(5)/3'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\overrightarrow{\mathrm{PR}}=\alpha(\cos t,2\sin t)$, $\alpha^2=25\cdot\dfrac{4-3\sin^2t}{1+3\sin^2t}$이고 $s=\sin^2t$로 $h(s)=\dfrac{4s-3s^2}{1+3s}$의 최댓값을 구한다.
    steps:
    - {id: 2a, content: '$(\overrightarrow{\mathrm{OT}}\cdot\overrightarrow{\mathrm{PR}})^2=100h(s)$, $h_{\max}=h\left(\tfrac{-1+\sqrt5}{3}\right)=\tfrac{6-2\sqrt5}{3}$', criteria: ['2.M1', '2.A1', '2.M2', '2.A2']}
    hint_ladder:
    - $\overrightarrow{\mathrm{OP'}}=(-2\sin t,\cos t)$에 수직인 벡터를 써 보자.
    - $\sin^2t$를 한 문자로 치환하면 유리함수가 된다.
  - id: S2-B
    audience: B
    source_flow: 2025 선행학습 영향평가 결과보고서 문항카드 11 문항 해설
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $\overrightarrow{\mathrm{OP}}=(2\cos t,\sin t)$, $\overrightarrow{\mathrm{OP'}}=(-2\sin t,\cos t)$, $\overrightarrow{\mathrm{OT}}=(0,1)$. $a=5$이므로 조건 (Ⅰ)에서 $\overrightarrow{\mathrm{PQ}}=-5\overrightarrow{\mathrm{OP}}=(-10\cos t,-5\sin t)$.
        조건 (Ⅱ)에서 $\overrightarrow{\mathrm{PR}}=\alpha(\cos t,2\sin t)$ ($\alpha$는 실수)이므로 $\overrightarrow{\mathrm{PQ}}\cdot\overrightarrow{\mathrm{PR}}=-10\alpha>0$, 즉 $\alpha<0$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $|\overrightarrow{\mathrm{PQ}}|=|\overrightarrow{\mathrm{PR}}|$이므로 $5\sqrt{4\cos^2t+\sin^2t}=-\alpha\sqrt{\cos^2t+4\sin^2t}$에서 $\alpha=-5\sqrt{\dfrac{4-3\sin^2t}{1+3\sin^2t}}$.
        따라서 $\overrightarrow{\mathrm{OT}}\cdot\overrightarrow{\mathrm{PR}}=2\alpha\sin t$, $(\overrightarrow{\mathrm{OT}}\cdot\overrightarrow{\mathrm{PR}})^2=4\alpha^2\sin^2t=100\times\dfrac{4\sin^2t-3\sin^4t}{1+3\sin^2t}$.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        $\sin^2t=s\ (0\le s\le1)$, $h(s)=\dfrac{4s-3s^2}{1+3s}$이라 하면 $h'(s)=-\dfrac{9s^2+6s-4}{(3s+1)^2}$.
      criteria: ['2.M2']
    - id: 2b-4
      content: |
        $h(s)$는 $s=\dfrac{-1+\sqrt5}{3}$에서 최댓값을 갖고 $h\left(\dfrac{-1+\sqrt5}{3}\right)=\dfrac{(\sqrt5-1)^2}{3}=\dfrac{6-2\sqrt5}{3}$이다.
        따라서 $0\le t\le\dfrac{\pi}{2}$에서 $(\overrightarrow{\mathrm{OT}}\cdot\overrightarrow{\mathrm{PR}})^2$의 최댓값은 $\dfrac{200}{3}(3-\sqrt5)$이다.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: |
        $\overrightarrow{\mathrm{PQ}}=-5\overrightarrow{\mathrm{OP}}$, $\overrightarrow{\mathrm{PR}}=\alpha(\cos t,2\sin t)$로 놓고 $\alpha<0$을 밝혔다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 4
      evidence: |
        $(\overrightarrow{\mathrm{OT}}\cdot\overrightarrow{\mathrm{PR}})^2=100\times\dfrac{4\sin^2t-3\sin^4t}{1+3\sin^2t}$을 얻었다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: |
        $\sin^2t=s$로 치환하고 $h(s)$를 미분해 증감을 조사했다.
      depends_on: []
      implied_ok: false
      steps: [2b-3]
    - id: 2.A2
      mark_type: A
      points: 4
      evidence: |
        최댓값 $\dfrac{200}{3}(3-\sqrt5)$를 얻었다.
      depends_on: [2.M1, 2.M2]
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    [문제 3-3] $a>2$이고 모든 실수 $t$에 대하여 $f(t)g(t)=1$, $f(t)>a$, $f'(t)>0$일 때, 모든 실수 $t$에 대하여 $\overrightarrow{\mathrm{OP}}\cdot\overrightarrow{\mathrm{OR}}>0$임을 보이시오. [15점]
  points: 15
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $\overrightarrow{\mathrm{PR}}=\alpha(g',-f')$, $\alpha=a\dfrac{f}{f'}>0$이고 $\overrightarrow{\mathrm{OP}}\cdot\overrightarrow{\mathrm{OR}}=f^2+\dfrac{1}{f^2}-2a>a^2-2a>0$.
    steps:
    - {id: 3a, content: '$\overrightarrow{\mathrm{OP}}\cdot\overrightarrow{\mathrm{PR}}=-2\alpha\tfrac{f''}{f}=-2a$', criteria: ['3.M1', '3.A1', '3.R1']}
    hint_ladder:
    - $g=\dfrac1f$이므로 $g'$을 $f$, $f'$로 나타내자.
    - $\overrightarrow{\mathrm{OR}}=\overrightarrow{\mathrm{OP}}+\overrightarrow{\mathrm{PR}}$로 나누어 보자.
  - id: S3-B
    audience: B
    source_flow: 2025 선행학습 영향평가 결과보고서 문항카드 11 문항 해설
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $\overrightarrow{\mathrm{OP}}=(f(t),g(t))$, $\overrightarrow{\mathrm{OP'}}=(f'(t),g'(t))$이고 $g(t)=\dfrac{1}{f(t)}$, $g'(t)=-\dfrac{f'(t)}{\{f(t)\}^2}$.
        $a>2$이므로 조건 (Ⅰ)에서 $\overrightarrow{\mathrm{PQ}}=-a\overrightarrow{\mathrm{OP}}=(-af(t),-ag(t))$. 조건 (Ⅱ)에서 $\overrightarrow{\mathrm{PR}}=\alpha(g'(t),-f'(t))$ ($\alpha$는 실수).
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $\overrightarrow{\mathrm{PQ}}\cdot\overrightarrow{\mathrm{PR}}=a\alpha\{f'(t)g(t)-f(t)g'(t)\}=2a\alpha\dfrac{f'(t)}{f(t)}>0$이므로 $\alpha>0$.
        $|\overrightarrow{\mathrm{PQ}}|=|\overrightarrow{\mathrm{PR}}|$이므로 $a\sqrt{\{f(t)\}^2+\{g(t)\}^2}=\alpha\sqrt{\{f'(t)\}^2+\{g'(t)\}^2}$에서
        $\alpha=a\sqrt{\dfrac{\{f(t)\}^2+\{g(t)\}^2}{\{f'(t)\}^2+\{g'(t)\}^2}}=a\sqrt{\dfrac{\{f(t)\}^2\left(1+\frac{1}{\{f(t)\}^4}\right)}{\{f'(t)\}^2\left(1+\frac{1}{\{f(t)\}^4}\right)}}=a\dfrac{f(t)}{f'(t)}$.
      criteria: ['3.A1']
    - id: 3b-3
      content: |
        따라서 $\overrightarrow{\mathrm{OP}}\cdot\overrightarrow{\mathrm{OR}}=\overrightarrow{\mathrm{OP}}\cdot(\overrightarrow{\mathrm{OP}}+\overrightarrow{\mathrm{PR}})=|\overrightarrow{\mathrm{OP}}|^2+\alpha\{f(t)g'(t)-f'(t)g(t)\}=\{f(t)\}^2+\dfrac{1}{\{f(t)\}^2}-2\alpha\dfrac{f'(t)}{f(t)}=\{f(t)\}^2+\dfrac{1}{\{f(t)\}^2}-2a$.
      criteria: ['3.M2', '3.A2']
    - id: 3b-4
      content: |
        $\{f(t)\}^2+\dfrac{1}{\{f(t)\}^2}-2a>\{f(t)\}^2-2a>a^2-2a>0$ ($\because f(t)>a>2$)이므로 모든 실수 $t$에 대하여 $\overrightarrow{\mathrm{OP}}\cdot\overrightarrow{\mathrm{OR}}>0$이다. ■
      criteria: ['3.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 3
      evidence: |
        $g=\dfrac1f$, $g'=-\dfrac{f'}{f^2}$을 쓰고 $\overrightarrow{\mathrm{PQ}}=-a\overrightarrow{\mathrm{OP}}$, $\overrightarrow{\mathrm{PR}}=\alpha(g',-f')$로 놓았다.
      depends_on: []
      implied_ok: false
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 4
      evidence: |
        $\alpha>0$을 밝히고 $\alpha=a\dfrac{f(t)}{f'(t)}$를 얻었다.
      depends_on: [3.M1]
      steps: [3b-2]
    - id: 3.M2
      mark_type: M
      points: 2
      evidence: |
        $\overrightarrow{\mathrm{OR}}=\overrightarrow{\mathrm{OP}}+\overrightarrow{\mathrm{PR}}$로 나누어 내적을 전개했다.
      depends_on: []
      implied_ok: true
      steps: [3b-3]
    - id: 3.A2
      mark_type: A
      points: 3
      evidence: |
        $\overrightarrow{\mathrm{OP}}\cdot\overrightarrow{\mathrm{OR}}=\{f(t)\}^2+\dfrac{1}{\{f(t)\}^2}-2a$를 얻었다.
      depends_on: [3.M1, 3.M2]
      steps: [3b-3]
    - id: 3.R1
      mark_type: R
      points: 3
      evidence: |
        $f(t)>a>2$를 근거로 $\{f(t)\}^2-2a>a^2-2a>0$을 이끌어 결론을 적었다.
      depends_on: []
      steps: [3b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

