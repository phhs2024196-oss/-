      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2]
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: |
        각 경우 전체에서 $3$을 제외한 각 자연수가 같은 횟수만큼 더해진다는 사실(또는 동등한 세기)을 이용해 합을 구하려 했다.
      depends_on: []
      implied_ok: false
      steps: [1b-3]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        $\sum C_n=3\times126+52\times56\,(=3290)$, $\sum D_n=52\times70\,(=3640)$을 구했다.
      depends_on: [1.M2]
      steps: [1b-3, 1b-4]
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: |
        $\mathrm{E}(X)=\dfrac{965}{18}$을 얻었다.
      depends_on: [1.M1, 1.A1]
      steps: [1b-5]
    deductions: []
