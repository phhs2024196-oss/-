stimuli: []

stem: |
  앞면에는 $1$부터 $10$까지의 자연수가 하나씩 적혀 있고 뒷면에는 모두 $0$이 하나씩 적혀 있는 $10$장의 카드가 있다. 처음에 이 $10$장의 카드는 모두 $0$이 보이도록 놓여 있다. 이 $10$장의 카드 중 임의로 서로 다른 $5$장의 카드를 택하여, 택한 카드들을 각각 한 번 뒤집은 후 $10$장의 카드에 보이는 모든 수의 집합을 $A$라 하고, 집합 $A$의 모든 원소의 합을 $S$라 하자. 이산확률변수 $X$를

  $$X=\begin{cases}3S & (3\in A\text{인 경우})\\ S & (3\notin A\text{인 경우})\end{cases}$$

  라 할 때, $\mathrm{E}(X)$의 값을 구하시오.

subparts:
- id: '1'
  stem: |
    $\mathrm{E}(X)$의 값을 구하시오. [16점]
  points: 16
  depends_on: []
  answer: {kind: value, value: '965/18', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $3\in A$인 $126$가지와 $3\notin A$인 $126$가지 각각에서 각 자연수가 몇 번 더해지는지 세어 합을 구한다.
    steps:
    - {id: 1a, content: '$\sum C_n=3\cdot126+52\cdot56$, $\sum D_n=52\cdot70$, $\mathrm{E}(X)=\tfrac{3(3\cdot126+52\cdot56)+52\cdot70}{252}=\tfrac{965}{18}$', criteria: ['1.M1', '1.M2', '1.A1', '1.A2']}
    hint_ladder:
    - $3$이 보이는 경우와 보이지 않는 경우는 각각 몇 가지인가?
    - 각 경우 전체에서 $1$은 모두 몇 번 더해지는가? $2$는? 대칭성을 생각해 보자.
  - id: S1-B
    audience: B
    source_flow: 2026 선행학습 영향평가 결과보고서 문항카드 03 문항 해설(예시답안)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $10$장 중 서로 다른 $5$장을 택하는 방법의 수는 ${}_{10}\mathrm{C}_5=252$이다. $3\in A$인 집합 $A$의 개수는 ${}_9\mathrm{C}_4=126$이고 이들 각각의 모든 원소의 합을 $C_1,C_2,\cdots,C_{126}$, $3\notin A$인 집합 $A$의 개수는 ${}_9\mathrm{C}_5=126$이고 이들 각각의 모든 원소의 합을 $D_1,D_2,\cdots,D_{126}$이라 하자.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $X$가 $3C_1,\cdots,3C_{126},D_1,\cdots,D_{126}$의 각 값을 가질 확률은 각각 $\dfrac{1}{252}$이므로
        $$\mathrm{E}(X)=\sum_{n=1}^{126}3C_n\times\frac{1}{252}+\sum_{n=1}^{126}D_n\times\frac{1}{252}.$$
      criteria: ['1.M1']
    - id: 1b-3
      content: |
        $C_1,\cdots,C_{126}$을 구할 때 더해진 $0$이 아닌 $126\times5=630$개의 수 중 $3$의 개수는 $126$, $3$을 제외한 $1$부터 $10$까지 자연수의 개수는 각각 $\dfrac{630-126}{9}=56$이므로
        $$\sum_{n=1}^{126}C_n=3\times126+\left(\sum_{n=1}^{10}n-3\right)\times56=3\times126+52\times56.$$
      criteria: ['1.M2', '1.A1']
    - id: 1b-4
      content: |
        같은 방법으로 $D_1,\cdots,D_{126}$을 구할 때 더해진 $630$개의 수 중 $3$을 제외한 각 자연수의 개수는 $\dfrac{630}{9}=70$이므로 $\displaystyle\sum_{n=1}^{126}D_n=52\times70$.
      criteria: ['1.A1']
    - id: 1b-5
      content: |
        따라서 $\mathrm{E}(X)=\dfrac{3\times(3\times126+52\times56)+52\times70}{252}=\dfrac{965}{18}$.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
