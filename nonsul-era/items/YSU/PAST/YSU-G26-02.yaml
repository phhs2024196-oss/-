stimuli: []

stem: |
  앞면에는 $1$부터 $n$까지의 자연수가 하나씩 적혀 있고 뒷면에는 모두 $0$이 하나씩 적혀 있는 $n$장의 카드가 있다. 이 $n$장의 카드를 사용하여 다음 시행을 한다.

  > $n$장의 카드 중 임의로 $1$장의 카드를 택하여 한 번 뒤집는다.

  처음에 이 $n$장의 카드는 모두 $0$이 보이도록 놓여 있을 때, 이 시행을 $n$번 반복한 후 $n$장의 카드에 보이는 모든 수의 합의 기댓값을 $a_n$이라 하자. $\displaystyle\lim_{n\to\infty}\frac{a_n}{n^2}$의 값을 구하시오.

  (단, 시행을 반복할 때 같은 카드가 여러 번 뒤집힐 수 있고, $\displaystyle\lim_{n\to\infty}\left(1+\frac1n\right)^n=e$이다.)

subparts:
- id: '1'
  stem: |
    $\displaystyle\lim_{n\to\infty}\frac{a_n}{n^2}$의 값을 구하시오. [20점]
  points: 20
  depends_on: []
  answer: {kind: value, value: '(e**2-1)/(4*e**2)', equivalents: ['(1-exp(-2))/4'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 카드 $a$가 보일 확률은 홀수 번 뒤집힐 확률 $\dfrac{1-(1-\frac2n)^n}{2}$로 $a$에 무관하므로 $a_n=\dfrac{n(n+1)}{2}\cdot\dfrac{1-(1-\frac2n)^n}{2}$.
    steps:
    - {id: 1a, content: '$\lim\tfrac{a_n}{n^2}=\tfrac12\cdot\tfrac{1-e^{-2}}{2}=\tfrac{e^2-1}{4e^2}$', criteria: ['1.M1', '1.M2', '1.A1', '1.M3', '1.A2']}
    hint_ladder:
    - 숫자 $a$가 보이려면 카드 $a$가 몇 번 뒤집혀야 하는가?
    - 홀수 번째 항만 더하려면 $(q+p)^n$과 $(q-p)^n$을 어떻게 쓰면 될까?
  - id: S1-B
    audience: B
    source_flow: 2026 선행학습 영향평가 결과보고서 문항카드 04 문항 해설(예시답안)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        어떤 자연수 $a\,(1\le a\le n)$에 대하여 $n$번의 시행 후 자연수 $a$가 보이게 뒤집어져 있을 확률을 $\mathrm{P}(a)$라 하면
        $$\mathrm{P}(a)={}_n\mathrm{C}_1\left(\frac1n\right)^1\left(1-\frac1n\right)^{n-1}+{}_n\mathrm{C}_3\left(\frac1n\right)^3\left(1-\frac1n\right)^{n-3}+\cdots+{}_n\mathrm{C}_m\left(\frac1n\right)^m\left(1-\frac1n\right)^{n-m}$$
        (단, $m$은 $n$ 이하의 자연수 중 최대인 홀수)이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        이항정리에 의하여
        $$\mathrm{P}(a)=\frac{\displaystyle\sum_{k=0}^{n}{}_n\mathrm{C}_k\left(\frac1n\right)^k\left(1-\frac1n\right)^{n-k}-\sum_{k=0}^{n}(-1)^k{}_n\mathrm{C}_k\left(\frac1n\right)^k\left(1-\frac1n\right)^{n-k}}{2}$$
        이고 $\displaystyle\sum_{k=0}^{n}{}_n\mathrm{C}_k\left(\frac1n\right)^k\left(1-\frac1n\right)^{n-k}=\left(\frac1n+1-\frac1n\right)^n=1$, $\displaystyle\sum_{k=0}^{n}(-1)^k{}_n\mathrm{C}_k\left(\frac1n\right)^k\left(1-\frac1n\right)^{n-k}=\left(-\frac1n+1-\frac1n\right)^n=\left(1-\frac2n\right)^n$이므로 $\mathrm{P}(a)=\dfrac{1-\left(1-\frac2n\right)^n}{2}$.
      criteria: ['1.M2', '1.A1']
    - id: 1b-3
      content: |
        따라서 $a_n=\displaystyle\sum_{a=1}^{n}\left\{a\times\frac{1-\left(1-\frac2n\right)^n}{2}\right\}=\frac{n(n+1)}{2}\times\frac{1-\left(1-\frac2n\right)^n}{2}$.
      criteria: ['1.A1']
    - id: 1b-4
      content: |
        $\displaystyle\lim_{n\to\infty}\left(1-\frac2n\right)^n=e^{-2}$이므로
        $$\lim_{n\to\infty}\frac{a_n}{n^2}=\lim_{n\to\infty}\left\{\frac{n(n+1)}{2n^2}\times\frac{1-\left(1-\frac2n\right)^n}{2}\right\}=\frac{e^2-1}{4e^2}.$$
      criteria: ['1.M3', '1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        숫자 $a$가 보이는 사건을 카드 $a$가 홀수 번 뒤집히는 사건으로 보고 이항분포(독립시행)의 홀수 항 합으로 $\mathrm{P}(a)$를 나타냈다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: |
        이항정리로 홀수 항 합을 $\dfrac{(q+p)^n-(q-p)^n}{2}$ 꼴로 정리하려 했다.
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: |
        $\mathrm{P}(a)=\dfrac{1-(1-\frac2n)^n}{2}$와 $a_n=\dfrac{n(n+1)}{2}\cdot\dfrac{1-(1-\frac2n)^n}{2}$를 얻었다.
      depends_on: [1.M1, 1.M2]
      steps: [1b-2, 1b-3]
    - id: 1.M3
      mark_type: M
      points: 3
      evidence: |
        $\displaystyle\lim_{n\to\infty}\left(1-\frac2n\right)^n=e^{-2}$을 주어진 극한 $\left(1+\frac1n\right)^n\to e$로부터 이끌어 썼다.
      depends_on: []
      implied_ok: true
      steps: [1b-4]
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: |
        $\dfrac{e^2-1}{4e^2}$을 얻었다.
      depends_on: [1.A1, 1.M3]
      steps: [1b-4]
    deductions: []
