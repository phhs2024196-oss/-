stimuli: []

stem: |
  $7$개의 함수

  $f(x)=ax^2+bx+c$, $g_1(x)=ax+b$, $g_2(x)=ax+c$, $g_3(x)=bx+a$, $g_4(x)=bx+c$, $g_5(x)=cx+a$, $g_6(x)=cx+b$

  가 다음 조건을 만족시키도록 하는 세 실수 $a$, $b$, $c$에 대하여 아래의 물음에 답하시오.

  > (Ⅰ) $f(x)>0$인 실수 $x$가 존재한다.
  >
  > (Ⅱ) $1\le i\le6$인 모든 자연수 $i$와 $s<t$인 모든 실수 $s$, $t$에 대하여 $\displaystyle\int_s^tg_i(x)dx\le\int_s^tf(x)dx$가 성립한다.

subparts:
- id: '1'
  stem: |
    [문제 3-1] $\dfrac{2f'(26)}{f''(26)}$의 값을 구하시오. [7점]
  points: 7
  depends_on: []
  answer: {kind: value, value: '53', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f-g_4=ax^2$로 $a\ge0$, $a=0$이면 모두 $0$이 되어 (Ⅰ) 위배, $a>0$이면 $f-g_2=ax^2+(b-a)x\ge0$이어야 하므로 $b=a$.
    steps:
    - {id: 1a, content: '$a=b>0$이므로 $\tfrac{2f''(26)}{f''''(26)}=\tfrac{2(52a+a)}{2a}=53$', criteria: ['1.M1', '1.R1', '1.M2', '1.A1']}
    hint_ladder:
    - 적분 부등식이 모든 구간에서 성립하면 피적분함수에 대해 무엇을 알 수 있는가?
    - $f-g_4$, $f-g_2$를 직접 계산해 보자.
  - id: S1-B
    audience: B
    source_flow: 2026 선행학습 영향평가 결과보고서 문항카드 05 문항 해설 [문제 3-1](예시답안)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        조건 (Ⅱ)에서 $s<t$인 모든 실수 $s$, $t$에 대하여 $\displaystyle\int_s^t\{f(x)-g_i(x)\}dx\ge0$이 성립하므로 $\displaystyle\int_0^3\{f(x)-g_4(x)\}dx=a\int_0^3x^2dx=9a\ge0$에서 $a\ge0$이다. ……㉠
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        (ⅰ) $a=0$인 경우: $\displaystyle\int_0^2\{f(x)-g_2(x)\}dx=b\int_0^2xdx=2b\ge0$, $\displaystyle\int_{-2}^0\{f(x)-g_2(x)\}dx=b\int_{-2}^0xdx=-2b\ge0$이므로 $b=0$이다. $\displaystyle\int_{-1}^1\{f(x)-g_5(x)\}dx=c\int_{-1}^1(1-x)dx=2c\ge0$, $\displaystyle\int_1^3\{f(x)-g_5(x)\}dx=c\int_1^3(1-x)dx=-2c\ge0$이므로 $a=b=c=0$이 되어 조건 (Ⅰ)을 만족시키지 못한다.
      criteria: ['1.R1']
    - id: 1b-3
      content: |
        (ⅱ) $a>0$인 경우: $m=\dfrac{b-a}{2a}$라 하면 $f(x)-g_2(x)=ax^2+(b-a)x=a(x^2+2mx)=a\{(x+m)^2-m^2\}$이다. $m\ne0$이면
        $$\int_{-m-|m|}^{-m+|m|}\{f(x)-g_2(x)\}dx=a\int_{-m-|m|}^{-m+|m|}\{(x+m)^2-m^2\}dx=-\frac43a|m|^3\ge0$$
        이므로 $|m|<0$이 되어 모순이다. 따라서 $m=0$이다.
      criteria: ['1.M2']
    - id: 1b-4
      content: |
        (ⅰ), (ⅱ)에서 $a>0$, $a=b$이므로 $f(x)=ax^2+ax+c$, $f'(x)=2ax+a$, $f''(x)=2a$이고
        $$\frac{2f'(26)}{f''(26)}=\frac{2\times(52a+a)}{2a}=53.$$
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        적분 부등식을 $\int_s^t\{f-g_i\}dx\ge0$으로 바꾸고 $f-g_4=ax^2$ 등을 이용해 $a\ge0$을 보였다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.R1
      mark_type: R
      points: 1
      evidence: |
        $a=0$이면 $a=b=c=0$이 되어 조건 (Ⅰ)에 모순임을 보였다.
      depends_on: []
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: |
        $a>0$일 때 $f-g_2=ax^2+(b-a)x$가 음이 되는 구간이 없어야 함(두 근 사이 적분 또는 판별식)으로 $b=a$를 이끌었다.
      depends_on: []
      implied_ok: false
      steps: [1b-3]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        $f'(x)=2ax+a$, $f''(x)=2a$로 값 $53$을 얻었다.
      depends_on: [1.M2]
      steps: [1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []
- id: '2'
  stem: |
    [문제 3-2] $b=26$인 모든 $f(-1)$의 값의 범위는 $\alpha\le f(-1)\le\beta$이다. $\alpha+\beta$의 값을 구하시오. [7점]
  points: 7
  depends_on: ['1']
  answer: {kind: value, value: '156', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $a=b=26$이면 결정적인 조건은 $f-g_5=26x^2+(26-c)x+c-26\ge0$이고 판별식 $(c-26)(c-130)\le0$, $f(-1)=c$.
    steps:
    - {id: 2a, content: '$26\le c=f(-1)\le130$, $\alpha+\beta=156$', criteria: ['2.M1', '2.A1', '2.R1', '2.A2']}
    hint_ladder:
    - $b=26$이면 [문제 3-1]에서 $a$는 얼마인가?
    - 여섯 개의 $f-g_i$ 가운데 실제로 서로 다른 것은 몇 개인가?
  - id: S2-B
    audience: B
    source_flow: 2026 선행학습 영향평가 결과보고서 문항카드 05 문항 해설 [문제 3-2](예시답안)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $b=26$이면 [문제 3-1]에서 $f(x)=26x^2+26x+c$이고
        $g_1(x)=g_3(x)=26x+26$, $g_2(x)=g_4(x)=26x+c$, $g_5(x)=g_6(x)=cx+26$ ……㉠ 이다.
        이차방정식 $f(x)-g_5(x)=0$의 판별식을 $D$라 하자.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        (ⅰ) $D>0$인 경우: 이차방정식 $f(x)-g_5(x)=0$의 서로 다른 두 실근을 $p$, $q\,(p<q)$라 하면 $\displaystyle\int_p^q\{f(x)-g_5(x)\}dx=-\frac{13(q-p)^3}{3}<0$이므로 조건 (Ⅱ)를 만족시키지 못한다.
      criteria: ['2.M1']
    - id: 2b-3
      content: |
        (ⅱ) $D\le0$인 경우: $D=(26-c)^2+4\times26\times(26-c)=(c-26)(c-130)\le0$이므로 $26\le c\le130$이다.
      criteria: ['2.A1']
    - id: 2b-4
      content: |
        (ⅰ), (ⅱ)에서 $f(x)-g_5(x)\ge0$을 만족시키는 모든 $c$의 범위는 $26\le c\le130$이다. 이때 $f(x)-g_1(x)\ge0$, $f(x)-g_2(x)\ge0$, $f(x)-g_5(x)\ge0$이 되므로 ㉠에 의하여 $1\le i\le6$인 모든 자연수 $i$에 대하여 $f(x)-g_i(x)\ge0$이다. 또한 모든 $i$와 모든 실수 $s$에 대하여 $\dfrac{d}{dx}\displaystyle\int_s^x\{f(t)-g_i(t)\}dt\ge0$이 되어 함수 $\displaystyle\int_s^x\{f(t)-g_i(t)\}dt$는 증가함수이고 $\displaystyle\int_s^s\{f(x)-g_i(x)\}dx=0$이므로 $s<t$인 모든 실수 $s$, $t$에 대하여 $\displaystyle\int_s^t\{f(x)-g_i(x)\}dx\ge0$이 되어 조건 (Ⅱ)를 만족시킨다.
      criteria: ['2.R1']
    - id: 2b-5
      content: |
        따라서 $26\le c\le130$이고 $f(-1)=c$이므로 $26\le f(-1)\le130$, $\alpha=26$, $\beta=130$이므로 $\alpha+\beta=156$.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: |
        $a=b=26$을 쓰고 $f-g_5$가 음이 되는 구간이 없어야 함(판별식 $D\le0$)을 조건으로 세웠다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: ['1.M2'], max_points: 2}
      steps: [2b-1, 2b-2]
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: |
        $(c-26)(c-130)\le0$, 즉 $26\le c\le130$을 얻었다.
      depends_on: [2.M1]
      steps: [2b-3]
    - id: 2.R1
      mark_type: R
      points: 2
      evidence: |
        이 범위에서 나머지 $f-g_i\ge0$도 성립하여 조건 (Ⅱ)가 실제로 만족됨(충분조건)을 확인했다.
      depends_on: []
      steps: [2b-4]
    - id: 2.A2
      mark_type: A
      points: 1
      evidence: |
        $f(-1)=c$에서 $\alpha+\beta=156$을 얻었다.
      depends_on: [2.M1, 2.A1]
      steps: [2b-5]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

