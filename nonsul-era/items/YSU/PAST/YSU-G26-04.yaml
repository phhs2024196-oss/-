stimuli: []

stem: |
  곡선 $C_1:\dfrac{x^2}{4}-y^2=1\,(x>0)$ 위를 움직이는 점 $\mathrm{P}$에 대하여 점 $\mathrm{P}$를 지나고 반지름의 길이가 $1$인 원을 $C_2$라 하자. 원 $C_2$의 중심이 $\mathrm{Q}$이고 $C_2$ 위의 점 $\mathrm{P}$에서의 접선이 곡선 $C_1$ 위의 점 $\mathrm{P}$에서의 접선과 일치할 때, 아래의 물음에 답하시오. (단, 점 $\mathrm{Q}$의 $x$좌표는 점 $\mathrm{P}$의 $x$좌표보다 작다.)

  [그림] 좌표평면에 쌍곡선 $C_1$의 오른쪽 가지(꼭짓점 $(2,0)$)가 그려져 있고, 제1사분면의 $C_1$ 위의 점 $\mathrm{P}$에서 $C_1$에 접하는 원 $C_2$가 곡선의 볼록한 바깥쪽(위·왼쪽)에 놓여 그 중심이 $\mathrm{Q}$로 표시되어 있다. $y$축의 음의 부분 위에 점 $\mathrm{R}$이 표시되어 있다.

subparts:
- id: '1'
  stem: |
    [문제 4-1] 실수 전체의 집합에서 미분가능한 두 함수 $f(t)$, $g(t)$에 대하여 점 $\mathrm{P}$의 좌표가 $(f(t),g(t))$이고 $g(0)=0$, $g'(0)=2026$일 때, 점 $\mathrm{Q}$의 좌표를 $(\alpha(t),\beta(t))$라 하자. $\beta'(0)$의 값을 구하시오. [10점]
  points: 10
  depends_on: []
  answer: {kind: value, value: '6078', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\beta(t)=g(t)\left(1+\dfrac{4}{\sqrt{f^2+16g^2}}\right)$을 미분하고 $f(0)=2$, $g(0)=0$을 대입한다.
    steps:
    - {id: 1a, content: '$\beta''(0)=g''(0)\left(1+\tfrac{4f(0)^2}{f(0)^3}\right)=2026\times3=6078$', criteria: ['1.M1', '1.A1', '1.M2', '1.A2']}
    hint_ladder:
    - $\mathrm{P}$에서의 접선에 수직인 방향은? 그 방향으로 길이 $1$만큼 가면 $\mathrm{Q}$이다.
    - $g(0)=0$이면 $f(0)$은 얼마인가?
  - id: S1-B
    audience: B
    source_flow: 2026 선행학습 영향평가 결과보고서 문항카드 06 문항 해설 [문제 4-1](예시답안)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        곡선 $C_1$ 위의 점 $(f(t),g(t))$에서의 접선의 기울기는 $\dfrac{f(t)}{4g(t)}$이고 $\overline{\mathrm{PQ}}=1$이므로
        $(\mathrm{Q}\text{의 }x\text{좌표})-(\mathrm{P}\text{의 }x\text{좌표})=\dfrac{-f(t)}{\sqrt{\{f(t)\}^2+16\{g(t)\}^2}}$,
        $(\mathrm{Q}\text{의 }y\text{좌표})-(\mathrm{P}\text{의 }y\text{좌표})=\dfrac{4g(t)}{\sqrt{\{f(t)\}^2+16\{g(t)\}^2}}$.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        즉 $\alpha(t)=f(t)\left(1-\dfrac{1}{\sqrt{\{f(t)\}^2+16\{g(t)\}^2}}\right)$, $\beta(t)=g(t)\left(1+\dfrac{4}{\sqrt{\{f(t)\}^2+16\{g(t)\}^2}}\right)$ ……㉠
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        점 $\mathrm{P}$는 곡선 $C_1$ 위의 점이므로 $\dfrac{\{f(t)\}^2}{4}-\{g(t)\}^2=1$ ……㉡이고, ㉡의 양변을 $t$로 미분하면 $\dfrac{f(t)f'(t)}{2}-2g(t)g'(t)=0$ ……㉢.
      criteria: ['1.M2']
    - id: 1b-4
      content: |
        ㉠, ㉡, ㉢에 의하여
        $$\beta'(t)=g'(t)\left(1+\frac{4\{f(t)\}^2-16\{g(t)\}^2}{\left(\sqrt{\{f(t)\}^2+16\{g(t)\}^2}\right)^3}\right)$$
        이고, $g(0)=0$, $g'(0)=2026$이므로 $f(0)=2$. 따라서 $\beta'(0)=6078$.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        $\mathrm{Q}$가 $\mathrm{P}$에서 접선에 수직인 방향(곡선 안쪽 반대, $x$좌표 감소 방향)으로 거리 $1$인 점임을 식으로 나타냈다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        $\beta(t)=g(t)\left(1+\dfrac{4}{\sqrt{f^2+16g^2}}\right)$ 또는 동치식을 얻었다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: |
        곱·몫(합성) 미분으로 $\beta'(t)$를 구하고 곡선의 방정식(또는 그 미분)을 이용해 정리했다.
      depends_on: []
      implied_ok: true
      steps: [1b-3, 1b-4]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: |
        $f(0)=2$를 쓰고 $\beta'(0)=6078$을 얻었다.
      depends_on: [1.A1, 1.M2]
      steps: [1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []
- id: '2'
  stem: |
    [문제 4-2] 점 $\mathrm{R}\left(0,-\dfrac{\sqrt5}{2}\right)$가 있다. 모든 직선 $\mathrm{QR}$의 기울기의 집합을 구하시오. [20점]
  points: 20
  depends_on: []
  answer: {kind: set, value: '(-1/2, sqrt(89)/6]', equivalents: ['{m | -1/2 < m <= sqrt(89)/6}'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 기울기 최대일 때 직선 $\mathrm{QR}$은 $C_1$의 접선과 평행하고 그 접선과 $\mathrm{R}$ 사이 거리가 $1$이다. 아래쪽 한계는 $\mathrm{R}$에서 거리 $1$인 점근선 $y=-\tfrac12x$로 정해지고 달성되지 않는다.
    steps:
    - {id: 2a, content: '$\tfrac{\lvert\frac{\sqrt5}{2}-\sqrt{4b^2-1}\rvert}{\sqrt{b^2+1}}=1\Rightarrow b=\tfrac{\sqrt{89}}{6}$, 집합 $\left\{m\mid -\tfrac12<m\le\tfrac{\sqrt{89}}{6}\right\}$', criteria: ['2.M1', '2.A1', '2.M2', '2.R1', '2.A2']}
    hint_ladder:
    - $\mathrm{Q}$는 곡선 $C_1$에서 거리 $1$만큼 떨어진 곡선 위를 움직인다. 기울기가 가장 클 때 $\mathrm{QR}$은 $C_1$의 접선과 어떤 관계인가?
    - $\mathrm{R}$과 점근선 $y=-\frac12x$ 사이의 거리를 구해 보자.
  - id: S2-B
    audience: B
    source_flow: 2026 선행학습 영향평가 결과보고서 문항카드 06 문항 해설 [문제 4-2](예시답안)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        직선 $\mathrm{QR}$의 기울기를 $m$이라 하자. 점 $\mathrm{P}$가 곡선 $C_1$ 위를 움직이므로 모든 $m$의 값의 집합은 하나의 구간을 이룬다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $m$의 최댓값을 $b$라 하면 $b$는 양수이고, 기울기가 $b$인 곡선 $C_1$의 접선을 $l_1$이라 할 때 $l_1:\,y=bx-\sqrt{4b^2-1}\ \left(b^2>\dfrac14\right)$이다. 이때 점 $\mathrm{R}\left(0,-\dfrac{\sqrt5}{2}\right)$와 직선 $l_1$ 사이의 거리는 $1$이므로
        $$\frac{\left\lvert\frac{\sqrt5}{2}-\sqrt{4b^2-1}\right\rvert}{\sqrt{b^2+1}}=1.$$
      criteria: ['2.M1']
    - id: 2b-3
      content: |
        $b^2>\dfrac14$이므로 $b^2=\dfrac{89}{36}$, $b=\dfrac{\sqrt{89}}{6}$.
      criteria: ['2.A1']
    - id: 2b-4
      content: |
        곡선 $C_1$ 위에 있는 제$4$사분면 위의 임의의 점 $\mathrm{P}$에 대하여 직선 $\mathrm{OP}$의 기울기는 $-\dfrac12$보다 크다. 점 $\mathrm{R}$과 직선 $y=-\dfrac12x$ 사이의 거리는 $1$이므로 점 $\mathrm{R}$을 지나고 기울기가 $-\dfrac12$인 직선을 $l_2$라 하면 점 $\mathrm{P}$와 직선 $l_2$ 사이의 거리는 $1$보다 크므로 직선 $\mathrm{QR}$의 기울기는 $-\dfrac12$보다 크다.
      criteria: ['2.M2']
    - id: 2b-5
      content: |
        한편, $-\dfrac12$보다 큰 임의의 음수 $k$에 대하여 점 $\mathrm{R}$을 지나고 기울기가 $k$인 직선을 $l_3$이라 하면 $l_3$은 직선 $y=-\dfrac12x$와 만난다. 이 점을 $\mathrm{T}$라 하면, 선분 $\mathrm{RT}$ 위의 점 중 원 $C_2$의 중심이 되는 점이 존재하므로, $k$는 모든 직선 $\mathrm{QR}$의 기울기의 집합의 원소이다.
      criteria: ['2.R1']
    - id: 2b-6
      content: |
        따라서 모든 직선 $\mathrm{QR}$의 기울기의 집합은 $\left\{m\,\middle|\,-\dfrac12<m\le\dfrac{\sqrt{89}}{6},\ m\text{은 실수}\right\}$이다.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: |
        기울기 최댓값 $b$에서 기울기 $b$인 $C_1$의 접선 $y=bx-\sqrt{4b^2-1}$과 $\mathrm{R}$ 사이 거리가 $1$이라는 식을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2b-2]
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: |
        $b^2>\dfrac14$인 해를 골라 $b=\dfrac{\sqrt{89}}{6}$을 얻었다.
      depends_on: [2.M1]
      steps: [2b-3]
    - id: 2.M2
      mark_type: M
      points: 4
      evidence: |
        $\mathrm{R}$과 점근선 $y=-\dfrac12x$ 사이 거리가 $1$임을 이용해 기울기가 $-\dfrac12$보다 큼(등호 불성립)을 보였다.
      depends_on: []
      implied_ok: false
      steps: [2b-4]
    - id: 2.R1
      mark_type: R
      points: 3
      evidence: |
        $-\dfrac12$와 최댓값 사이의 모든 값이 실제 기울기로 나타남(연속성 또는 선분 $\mathrm{RT}$ 논증)을 밝혔다.
      depends_on: []
      steps: [2b-5]
    - id: 2.A2
      mark_type: A
      points: 3
      evidence: |
        집합 $\left\{m\mid -\dfrac12<m\le\dfrac{\sqrt{89}}{6}\right\}$을 끝점 포함 여부까지 바르게 적었다.
      depends_on: [2.A1, 2.M2]
      steps: [2b-6]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

