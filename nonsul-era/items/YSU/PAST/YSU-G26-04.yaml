intent: |
  쌍곡선의 뜻을 알고 쌍곡선의 접선의 방정식을 이해하여 조건에 맞는 문제를 해결할 수 있는지 평가한다.
key_idea: |
  $\mathrm{Q}$는 $\mathrm{P}$에서 접선에 수직인 방향으로 거리 $1$인 점이고, 직선 $\mathrm{QR}$의 기울기의 최댓값은 $\mathrm{R}$와의 거리가 $1$인 $C_1$의 접선의 기울기, 하한은 점근선 기울기 $-\tfrac12$이다.
stuck: |
  (4-1) 법선 방향 단위벡터 없이 기울기로 $\mathrm{Q}$를 표현하는 것과 $f(0)=2$를 읽는 것, (4-2) 기울기의 최댓값을 「$\mathrm{R}$에서 거리 $1$인 접선」으로 바꾸고 하한이 점근선 $y=-\tfrac12x$로 정해지며 달성되지 않음을 밝히는 것
