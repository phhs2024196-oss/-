intent: |
  복잡한 함수를 치환을 이용하여 간단히 정리하고 사잇값 정리와 미분을 이용하여 함수의 최댓값과 최솟값을 구할 수 있는지 평가한다.
key_idea: |
  분모가 $A^2+B^2$($A$, $B$는 분자의 두 인수)이므로 $\dfrac{1}{f}=\dfrac{A}{B}+\dfrac{B}{A}$, $h=\dfrac AB$에 대해 $p(t)=t+\dfrac1t$의 최솟값 $2$를 쓰고, $h(\alpha)=1$인 $\alpha$의 존재를 사잇값 정리로 보인다.
stuck: |
