subparts:
- id: '1'
  stem: |
    [문제 5-1] 실수 전체의 집합에서 정의된 함수 $f(x)=\dfrac{(e^x+x)(1-xe^x)}{(e^{2x}+1)(x^2+1)}$의 최솟값을 구하시오. [11점]
  points: 11
  depends_on: []
  answer: {kind: value, value: '-1/2', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 분모 $=(e^x+x)^2+(1-xe^x)^2$이므로 분자가 음일 때 $-\dfrac1f=h+\dfrac1h\ge2$ ($h=\dfrac{e^x+x}{xe^x-1}>0$), 등호는 $h(\alpha)=1$인 $\alpha\in(1,2)$에서.
    steps:
    - {id: 1a, content: '$-\tfrac1f\ge2\Rightarrow f\ge-\tfrac12$, $q(x)=xe^x-e^x-x-1$의 근 $\alpha\in(1,2)$에서 등호', criteria: ['1.M1', '1.M2', '1.A1', '1.R1', '1.A2']}
    hint_ladder:
    - 분모를 전개해서 분자의 두 인수와 비교해 보자.
    - $\dfrac{A^2+B^2}{AB}$는 어떤 꼴로 쓸 수 있는가?
  - id: S1-B
    audience: B
    source_flow: 2026 선행학습 영향평가 결과보고서 문항카드 07 문항 해설 [문제 5-1](예시답안)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $(e^x+x)(1-xe^x)\ne0$인 경우 $(e^{2x}+1)(x^2+1)=x^2e^{2x}+e^{2x}+x^2+1=(e^x+x)^2+(1-xe^x)^2>0$이고, $(e^x+x)(1-xe^x)=0$인 경우 $f(x)=0$이므로, 함수 $f(x)$는 $(e^x+x)(1-xe^x)<0$일 때 최솟값을 갖는다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        이때 $-\dfrac{1}{f(x)}=\dfrac{e^x+x}{xe^x-1}+\dfrac{xe^x-1}{e^x+x}$이고, $\dfrac{e^x+x}{xe^x-1}>0$이다.
      criteria: ['1.M1']
    - id: 1b-3
      content: |
        $h(x)=\dfrac{e^x+x}{xe^x-1}$, $p(t)=t+\dfrac1t\ (t>0)$이라 하면 $-\dfrac{1}{f(x)}=p(h(x))$이다. $p'(t)=\dfrac{t^2-1}{t^2}$이므로 함수 $p(t)$는 구간 $(0,\infty)$에서 $t=1$일 때 최솟값 $2$를 갖는다.
      criteria: ['1.M2', '1.A1']
    - id: 1b-4
      content: |
        따라서 $h(\alpha)=1$인 실수 $\alpha$가 존재한다면 함수 $f(x)$는 $x=\alpha$에서 최솟값 $-\dfrac12$를 갖는다.
      criteria: ['1.A1']
    - id: 1b-5
      content: |
        방정식 $h(x)=1$에서 $\dfrac{e^x+x}{xe^x-1}=1$, $xe^x-e^x-x-1=0$이므로 $q(x)=xe^x-e^x-x-1$이라 하면 $q(x)$는 연속함수이고 $q(1)=-2<0$, $q(2)=e^2-3>0$이므로 사잇값 정리에 의하여 $q(\alpha)=0$, 즉 $h(\alpha)=1$인 $\alpha$가 열린구간 $(1,2)$에 적어도 하나 존재한다.
      criteria: ['1.R1']
    - id: 1b-6
      content: |
        따라서 $x=\alpha$일 때 $f(x)$는 최솟값 $-\dfrac12$을 갖는다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        분모를 $(e^x+x)^2+(1-xe^x)^2$으로 다시 쓰고, 분자가 음인 경우에 $-\dfrac1f=h+\dfrac1h$ ($h>0$) 꼴로 나타냈다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2]
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: |
        $p(t)=t+\dfrac1t\ (t>0)$의 최솟값을 미분(또는 산술·기하평균)으로 구하려 했다.
      depends_on: []
      implied_ok: true
      steps: [1b-3]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        $f(x)\ge-\dfrac12$ (등호는 $h=1$일 때)를 얻었다.
      depends_on: [1.M1, 1.M2]
      steps: [1b-3, 1b-4]
    - id: 1.R1
      mark_type: R
      points: 3
      evidence: |
        $q(x)=xe^x-e^x-x-1$에 대해 $q(1)<0<q(2)$ (단서 $e>2$ 사용)와 사잇값 정리로 $h(\alpha)=1$인 $\alpha$의 존재를 보였다.
      depends_on: []
      steps: [1b-5]
    - id: 1.A2
      mark_type: A
      points: 1
      evidence: |
        최솟값 $-\dfrac12$을 결론으로 적었다.
      depends_on: [1.A1, 1.R1]
      steps: [1b-6]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []
- id: '2'
  stem: |
    [문제 5-2] 실수 전체의 집합에서 정의된 함수 $f(x)=\dfrac{(2e^x+\cos x)(2-e^x\cos x)}{(e^{2x}+1)(\cos^2x+4)}$의 최댓값을 구하시오. [9점]
  points: 9
  depends_on: []
  answer: {kind: value, value: '1/2', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 분모 $=(2e^x+\cos x)^2+(2-e^x\cos x)^2$이므로 분자가 양일 때 $\dfrac1f=h+\dfrac1h\ge2$, 등호는 $h(\alpha)=1$인 $\alpha\in(-\tfrac\pi2,0)$에서.
    steps:
    - {id: 2a, content: '$\tfrac1f\ge2\Rightarrow f\le\tfrac12$, $q(x)=e^x\cos x+2e^x+\cos x-2$의 근 $\alpha\in(-\tfrac\pi2,0)$에서 등호', criteria: ['2.M1', '2.A1', '2.R1', '2.A2']}
    hint_ladder:
    - '[문제 5-1]과 같은 방법으로 분모를 두 제곱의 합으로 써 보자.'
  - id: S2-B
    audience: B
    source_flow: 2026 선행학습 영향평가 결과보고서 문항카드 07 문항 해설 [문제 5-2](예시답안)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $(2e^x+\cos x)(2-e^x\cos x)\ne0$인 경우 $(e^{2x}+1)(\cos^2x+4)=e^{2x}\cos^2x+4e^{2x}+\cos^2x+4=(2e^x+\cos x)^2+(2-e^x\cos x)^2>0$이고, $(2e^x+\cos x)(2-e^x\cos x)=0$인 경우 $f(x)=0$이므로 함수 $f(x)$는 $(2e^x+\cos x)(2-e^x\cos x)>0$일 때 최댓값을 갖는다. 이때 $\dfrac{1}{f(x)}=\dfrac{2e^x+\cos x}{2-e^x\cos x}+\dfrac{2-e^x\cos x}{2e^x+\cos x}$이고 $\dfrac{2e^x+\cos x}{2-e^x\cos x}>0$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $h(x)=\dfrac{2e^x+\cos x}{2-e^x\cos x}$, $p(t)=t+\dfrac1t\ (t>0)$이라 하면 $\dfrac{1}{f(x)}=p(h(x))$이고, $p'(t)=\dfrac{t^2-1}{t^2}$이므로 $p(t)$는 $(0,\infty)$에서 $t=1$일 때 최솟값 $2$를 갖는다. 따라서 $h(\alpha)=1$인 실수 $\alpha$가 존재한다면 $f(x)$는 $x=\alpha$에서 최댓값 $\dfrac12$을 갖는다.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        방정식 $h(x)=1$에서 $e^x\cos x+2e^x+\cos x-2=0$이므로 $q(x)=e^x\cos x+2e^x+\cos x-2$라 하면 $q(x)$는 연속함수이고 $q(0)=2>0$, $q\left(-\dfrac\pi2\right)=2e^{-\frac\pi2}-2=2\left(e^{-\frac\pi2}-e^0\right)<0$이므로, 사잇값 정리에 의하여 $q(\alpha)=0$, 즉 $h(\alpha)=1$인 $\alpha$가 열린구간 $\left(-\dfrac\pi2,0\right)$에 적어도 하나 존재한다.
      criteria: ['2.R1']
    - id: 2b-4
      content: |
        따라서 $x=\alpha$일 때 $f(x)$는 최댓값 $\dfrac12$을 갖는다.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
