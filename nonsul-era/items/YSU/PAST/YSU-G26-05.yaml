      points: 3
      evidence: |
        분모를 $(2e^x+\cos x)^2+(2-e^x\cos x)^2$으로 다시 쓰고 분자가 양인 경우 $\dfrac1f=h+\dfrac1h$ ($h>0$)로 나타냈다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: |
        $p(t)=t+\dfrac1t$의 최솟값 $2$로 $f(x)\le\dfrac12$를 얻었다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.R1
      mark_type: R
      points: 3
      evidence: |
        $q(0)>0>q\left(-\dfrac\pi2\right)$와 사잇값 정리로 $h(\alpha)=1$인 $\alpha$의 존재를 보였다.
      depends_on: []
      steps: [2b-3]
    - id: 2.A2
      mark_type: A
      points: 1
      evidence: |
        최댓값 $\dfrac12$을 결론으로 적었다.
      depends_on: [2.A1, 2.R1]
      steps: [2b-4]
    deductions: []
