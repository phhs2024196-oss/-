# 아주대 2021학년도 실전 논술(자연 오전 A·오후 B·저녁 C, 의학과 M 수학) — 오개념 후보 (공용 카탈로그 반영 전 제안)
# ID 구간 MC-*-4101~4149 (2021 모의 담당 4151~4199 와 분리). 문항 파일에는 misconceptions: [] 로 두었음.
misconceptions:
- {id: MC-CAL-4101, name: 절댓값 합의 최솟값을 양 끝 점에서 찾음, concepts: [CON-CAL-ABS-SUM-MEDIAN], used_in: 'AJOU-G21A-01#1-1', outcome_code: '71', wrong_work: '$B(1)$ 또는 $B(401)$을 최솟값으로 계산', detect_cue: '답이 $80200$', feedback: '기울기가 음에서 양으로 바뀌는 가운데 점(중앙값) $x=201$에서 최소입니다.'}
- {id: MC-CAL-4102, name: 기울기 집합 원소 수를 n개로 셈, concepts: [CON-CAL-ABS-SUM-MEDIAN], used_in: 'AJOU-G21A-01#1-2', outcome_code: '71', wrong_work: '$S=\{-n+2i\mid i=1,\ldots,n\}$ 등 한 원소 누락', detect_cue: '$a_n$의 식이 $\frac{n(n+1)(n+2)}{3}$와 다름(극한은 같을 수 있음)', feedback: '양 끝 구간 포함 $n+1$개의 구간이 있으므로 기울기는 $n+1$개입니다.'}
- {id: MC-STA-4103, name: 0인 개수가 있는 경우를 빠뜨림, concepts: [CON-STA-CASE-SPLIT], used_in: 'AJOU-G21A-01#1-3', outcome_code: '71', wrong_work: '모두 양수인 경우 $\left(\frac n2-1\right)^2$만 답함', detect_cue: '$\frac{3n}{2}-3$ 항이 없음', feedback: '$a_1,a_2,a_3$ 중 하나가 0이면 $S$의 원소가 3개로 줄어 곱이 양수일 수 있습니다.'}
- {id: MC-CAL-4104, name: B(±1)을 계산하지 않고 그래프 개형만으로 판정, concepts: [CON-CAL-IVT], used_in: 'AJOU-G21A-01#1-4', outcome_code: '71', wrong_work: '「최솟값이 $n$보다 작으니 해가 있다」처럼 근거 없이 결론', detect_cue: '$B(1)+B(-1)=2n$이 없음', feedback: '$\lvert x_k\rvert<1$로 $B(\pm1)$을 구하면 합이 $2n$이므로 사잇값 정리를 쓸 수 있습니다.'}
- {id: MC-CAL-4105, name: sec x tan x 적분을 tan으로 착각, concepts: [CON-CAL-TRIG-INTEGRAL], used_in: 'AJOU-G21A-01#2-1', outcome_code: '71', wrong_work: '$\int\sec x\tan x\,dx=\frac{\sec^2x}{2}$', detect_cue: '$-6\sec x$ 항 대신 $-3\sec^2x$ 등', feedback: '$(\sec x)^{\prime}=\sec x\tan x$입니다.'}
- {id: MC-CAL-4106, name: x1·x2 미지라 풀 수 없다고 판단, concepts: [CON-CAL-LIMIT-EXIST-COND], used_in: 'AJOU-G21A-01#2-2', outcome_code: '71', wrong_work: '$x_1,x_2$를 임의로 0 등으로 두고 계산', detect_cue: '$f(1)=f(x_1)=f(x_2)$ 유도가 없음', feedback: '분모 $\to0$이므로 $C(1)=0$, 제시문 (나)에서 $f(x_1)=f(x_2)=f(1)$이 나옵니다.'}
- {id: MC-STA-4107, name: 삼색기 양 끝 색도 달라야 한다고 봄, concepts: [CON-STA-PRODUCT-RULE], used_in: 'AJOU-G21A-02#1-1', outcome_code: '71', wrong_work: '$r(k)=k(k-1)(k-2)$', detect_cue: '$r(3)=6$', feedback: '인접한 영역만 다르면 되므로 양 끝은 같은 색이어도 됩니다: $k(k-1)^2$.'}
- {id: MC-STA-4108, name: 2색·2색 경우의 중복 미보정, concepts: [CON-STA-PRODUCT-RULE], used_in: 'AJOU-G21A-02#1-2', outcome_code: '71', wrong_work: '①을 $120$으로 셈($\frac12$ 누락)', detect_cue: '확률 $\frac{240}{3160}$', feedback: '두 깃발을 순서 없이 고르므로 같은 유형끼리는 2로 나눕니다.'}
- {id: MC-STA-4109, name: 격자 색칠을 곱의 법칙으로 단순 곱함, concepts: [CON-STA-PRODUCT-RULE], used_in: 'AJOU-G21A-02#1-3', outcome_code: '71', wrong_work: '각 칸에 $3\cdot2\cdot2\cdots$를 단순히 곱해 $A=3\cdot2^5$', detect_cue: '$A=96$', feedback: '두 이웃(왼쪽·위)이 같은 색인지 다른 색인지에 따라 남는 색 수가 달라집니다.'}
- {id: MC-CAL-4110, name: 극한을 (1-1/(n+1))^(n+1)→1/e로만 처리, concepts: [CON-CAL-E-DEF], used_in: 'AJOU-G21A-02#2', outcome_code: '71', wrong_work: '$\lim(b_n)^{2n+2}=\frac1e$ 또는 $1$', detect_cue: '답 $e^{-1}$ 또는 $1$', feedback: '지수가 $2(n+1)$이므로 $e^{-2}$입니다. $1^\infty$꼴은 바로 1이 아닙니다.'}
- {id: MC-CAL-4111, name: 넓이 등분을 정적분 0으로 바꾸지 못함, concepts: [CON-CAL-AREA-BOUNDARY], used_in: 'AJOU-G21A-02#3-1', outcome_code: '71', wrong_work: '$\int_{-1}^1f=0$을 기함수 조건으로 오해해 $a=0$', detect_cue: '답 $a=0$', feedback: '오른쪽 반에서 위·아래 넓이가 같다는 것은 $\int_0^1f(x)dx=0$입니다.'}
- {id: MC-CAL-4112, name: 정사각형 밖으로 나간 부분까지 적분, concepts: [CON-CAL-AREA-BOUNDARY], used_in: 'AJOU-G21A-02#3-2', outcome_code: '71', wrong_work: '$\int_0^{\sqrt{3/b}}(2-bx^2+1)dx=1$', detect_cue: '$\frac2{\sqrt b}$ 직사각형 보정 없음', feedback: '$0\le x\le\frac1{\sqrt b}$에서는 포물선이 윗변 위에 있으므로 높이가 2인 직사각형입니다.'}
- {id: MC-CAL-4113, name: 부드럽게 만남을 함숫값 조건만으로 판단, concepts: [CON-CAL-TANGENT-COND], used_in: 'AJOU-G21B-01#1-1', outcome_code: '71', wrong_work: '$f(a)=g(a)$만 세워 $c$를 $a$로 남김', detect_cue: '미분계수 조건식이 없음', feedback: '부드럽게 만나려면 함숫값과 미분계수가 모두 같아야 합니다.'}
- {id: MC-CAL-4114, name: 미분계수 조건의 근을 함숫값 조건으로 거르지 않음, concepts: [CON-CAL-TANGENT-COND], used_in: 'AJOU-G21B-01#1-2', outcome_code: '71', wrong_work: '$a=\frac12$ 또는 $-\frac32$로 갈아탐', detect_cue: '적분 구간이 $1$이 아닌 점에서 나뉨', feedback: '$f^{\prime}(a)=g^{\prime}(a)$의 근 중 $f(a)=g(a)$도 만족하는 것만 남깁니다.'}
- {id: MC-CAL-4115, name: 지수함수 미분에서 ln2 누락, concepts: [CON-CAL-EXP-DERIV], used_in: 'AJOU-G21B-01#2-1', outcome_code: '71', wrong_work: '$a_n=n2^{n-1}$ 또는 $2^n$', detect_cue: '답에 $\ln2$가 없음', feedback: '$(2^x)^{\prime}=2^x\ln2$입니다.'}
- {id: MC-CAL-4116, name: 두 직선의 예각에서 절댓값 누락, concepts: [CON-CAL-TRIG-ADDITION], used_in: 'AJOU-G21B-01#2-2', outcome_code: '71', wrong_work: '$\tan\theta=\frac{m_2-m_1}{1+m_1m_2}$로 음수 답', detect_cue: '답이 $-\frac{2}{(e^2-1)^2}$', feedback: '예각이므로 $\tan\theta=\left\lvert\frac{m_1-m_2}{1+m_1m_2}\right\rvert$입니다.'}
- {id: MC-CAL-4117, name: 갈아타는 함수의 최댓값을 g 쪽에서 찾음, concepts: [CON-CAL-MAX-MIN], used_in: 'AJOU-G21B-01#3-1', outcome_code: '71', wrong_work: '$g$의 극값이나 $f(1)$을 최댓값 20으로 둠', detect_cue: '$b\ne20$', feedback: '$x>1$에서 $g$는 감소하므로 최댓값은 $(-\infty,1]$에서 $f$의 최댓값 $f(0)=b$입니다.'}
- {id: MC-CAL-4118, name: 꺾인 점 양쪽의 기울기를 구분하지 않음, concepts: [CON-CAL-TANGENT-COND], used_in: 'AJOU-G21B-01#3-2', outcome_code: '71', wrong_work: '$2\cos2a=1$만 풀어 $a=\frac\pi6$에서 $d$를 답함', detect_cue: '답 $d=-\frac{\sqrt3}{2}-\frac\pi3$', feedback: '$a>\frac\pi2$이면 $g^{\prime}(a)=-1$이므로 $2\cos2a=-1$도 따져야 합니다.'}
- {id: MC-STA-4119, name: 두 번째 시행 확률을 첫 시행과 독립으로 계산, concepts: [CON-STA-TOTAL-PROB], used_in: 'AJOU-G21B-02#1-1', outcome_code: '71', wrong_work: '$\frac{r+1}{r+b+1}$만 답함', detect_cue: '경우 분리 없음', feedback: '첫 공의 색에 따라 주머니 구성이 달라지므로 두 경우를 더합니다.'}
- {id: MC-STA-4120, name: 조건부확률의 분모를 전체 1로 둠, concepts: [CON-STA-COND-PROB], used_in: 'AJOU-G21B-02#1-2', outcome_code: '71', wrong_work: '$①+②=\frac{30}{60}=\frac12$', detect_cue: '답 $\frac12$', feedback: '세 번째가 빨강이라는 조건의 확률 $①+②+③+④$로 나눕니다.'}
- {id: MC-STA-4121, name: 이항계수 누락(한 경로만 셈), concepts: [CON-STA-POLYA-URN], used_in: 'AJOU-G21B-02#1-3', outcome_code: '71', wrong_work: '한 경로의 확률만 답함', detect_cue: '${}_{2021}\mathrm{C}_{1010}$ 없음', feedback: '빨강 1010번의 위치를 고르는 방법 수를 곱해야 합니다. 각 경로 확률은 모두 같습니다.'}
- {id: MC-STA-4122, name: 분산을 E(X^2)로 답함, concepts: [CON-STA-VARIANCE], used_in: 'AJOU-G21B-02#2-1', outcome_code: '71', wrong_work: '$\mathrm{V}(X)=\frac{137}{10}$', detect_cue: '$\mathrm{E}(X)^2$을 빼지 않음', feedback: '$\mathrm{V}(X)=\mathrm{E}(X^2)-\{\mathrm{E}(X)\}^2$입니다.'}
- {id: MC-STA-4123, name: a_n을 3^n으로 잘못 결정, concepts: [CON-STA-SEQ-SUM-DIFF], used_in: 'AJOU-G21B-02#2-2', outcome_code: '71', wrong_work: '$a_n=3^n$ 또는 $3^{n-1}$', detect_cue: '흰 공 수가 홀짝이 안 맞음', feedback: '$a_n=(3^n+2)-(3^{n-1}+2)=2\cdot3^{n-1}$입니다.'}
- {id: MC-STA-4124, name: a_1=0인 시행을 파란 공 횟수에 넣지 못함, concepts: [CON-STA-CASE-SPLIT], used_in: 'AJOU-G21B-02#2-3', outcome_code: '71', wrong_work: '$m=1,2,3$만 답함', detect_cue: '$m=4$ 누락', feedback: '$a_1=0$이므로 1번째 시행에 파란 공을 꺼내도 개수는 변하지 않지만 횟수는 셉니다.'}
- {id: MC-CAL-4125, name: 꺾인 점을 지나는 경우만 셈, concepts: [CON-CAL-ABS-GRAPH-FOLD], used_in: 'AJOU-G21C-01#1-1', outcome_code: '71', wrong_work: '$k=1$만 답함', detect_cue: '접하는 경우 없음', feedback: '뒤집힌 부분 $2-(x-2)^2$에 접할 때도 세 점에서 만납니다.'}
- {id: MC-CAL-4126, name: 접힌 뒤 극대가 되는 점 누락, concepts: [CON-CAL-ABS-GRAPH-FOLD], used_in: 'AJOU-G21C-01#1-2', outcome_code: '71', wrong_work: '$p=1-\frac{\sqrt3}{3}$만 극대로 답함', detect_cue: '$f$의 극소점이 접혀 극대가 된 것을 놓침', feedback: '$y=b$ 아래에 있던 극소는 접으면 극대가 됩니다.'}
- {id: MC-CAL-4127, name: 미분가능 조건을 f(a)=1에서 f'(a)=0만으로 끝냄, concepts: [CON-CAL-DIFFERENTIABILITY], used_in: 'AJOU-G21C-01#1-3', outcome_code: '71', wrong_work: '$f(x)=(x-a)^2(x-s)+1$ 꼴을 허용', detect_cue: '변곡점 조건 없음', feedback: '$f(x)=1$의 다른 단순근에서 꺾이므로 삼중근이어야 합니다.'}
- {id: MC-CAL-4128, name: 접어 올린 뒤 대칭성 대신 원함수 적분, concepts: [CON-CAL-ODD-EVEN-INTEGRAL], used_in: 'AJOU-G21C-01#1-4', outcome_code: '71', wrong_work: '$\int_{-1}^1a\tan^3\left(\frac{\pi x}{4}\right)dx=0$이라 하여 모순', detect_cue: '절댓값 무시', feedback: '접어 올린 함수는 우함수이므로 $2\int_0^1$입니다.'}
- {id: MC-CAL-4129, name: S_k 원소 수를 2k로 셈, concepts: [CON-CAL-ABS-GRAPH-FOLD], used_in: 'AJOU-G21C-01#2-1', outcome_code: '71', wrong_work: '$a=20$, $b=140$', detect_cue: '$S_{k-2}$가 그대로 남는다는 점 누락', feedback: '$S_k=S_{k-2}\cup\{x\mid\lvert f(x)\rvert=k\}$이므로 원소는 $k+1$개입니다.'}
- {id: MC-CAL-4130, name: p_n을 S_n의 새 원소 곱으로만 둠, concepts: [CON-CAL-GEOM-SERIES], used_in: 'AJOU-G21C-01#2-2', outcome_code: '71', wrong_work: '$p_n=\frac19$ (모든 $n\ge1$)', detect_cue: '급수가 발산한다고 답함', feedback: '$S_n$은 $S_{n-2}$를 포함하므로 $p_n=p_{n-2}\cdot\frac19$입니다.'}
- {id: MC-STA-4131, name: 원점에 없을 때 규칙 ㉢도 작동한다고 봄, concepts: [CON-STA-STATE-TRANSITION], used_in: 'AJOU-G21C-02#1-1', outcome_code: '71', wrong_work: '㉠-㉢-㉢ 등을 버려지는 경우로 셈', detect_cue: '$p>\frac{14}{27}$', feedback: '㉢은 원점에 있는 돌만 버립니다.'}
- {id: MC-STA-4132, name: A의 여사건 분해 누락, concepts: [CON-STA-COND-PROB], used_in: 'AJOU-G21C-02#1-2', outcome_code: '71', wrong_work: '$\mathrm{P}(\mathrm{A})=\mathrm{P}(\mathrm{A}\cap\mathrm{B})$로 둬 조건부확률 1', detect_cue: '$\mathrm{P}(\mathrm{A}\cap\mathrm{B}^C)$ 계산 없음', feedback: '이미 버려진 경우도 사건 A에 포함됩니다.'}
- {id: MC-STA-4133, name: X=2 경우에서 ㉠-㉠-㉢ 누락, concepts: [CON-STA-STATE-TRANSITION], used_in: 'AJOU-G21C-02#1-3', outcome_code: '71', wrong_work: '$X=2$를 8가지로 셈', detect_cue: '$\mathrm{E}(X)=\frac{29}{27}$', feedback: '두 돌이 모두 $x=1$로 옮겨진 뒤의 ㉢은 아무것도 버리지 않습니다.'}
- {id: MC-STA-4134, name: 흰 돌 위치를 홀수 횟수로 바로 둠, concepts: [CON-STA-BINOMIAL], used_in: 'AJOU-G21C-02#2-1', outcome_code: '71', wrong_work: '위치 $=X$로 두어 $\mathrm{E}(X^2)$를 답함', detect_cue: '답 $\frac{n^2+n}{4}$', feedback: '홀수 $m$번이면 위치는 $n-2m$입니다.'}
- {id: MC-STA-4135, name: 흰 돌 위치 수를 2n+1로 셈, concepts: [CON-STA-BINOMIAL], used_in: 'AJOU-G21C-02#2-2', outcome_code: '71', wrong_work: '$10(2n+1)$', detect_cue: '위치 홀짝 제약 무시', feedback: '$n$회 후 위치는 $n$과 홀짝이 같은 $-n,\ldots,n$의 $n+1$가지입니다.'}
- {id: MC-STA-4136, name: x13 후보를 6만 셈, concepts: [CON-STA-CASE-SPLIT], used_in: 'AJOU-G21C-02#2-3', outcome_code: '71', wrong_work: '$2\cdot6^3=432$', detect_cue: '(ii)에서 $x_{13}=4$ 누락', feedback: '모두 $x=1$에 있으면 ㉠(눈 4)도 아무 일 없으므로 가능합니다.'}
- {id: MC-STA-4137, name: 5번째 버려지는 경로를 *자리 미전개로 7가지로 셈, concepts: [CON-STA-STATE-TRANSITION], used_in: 'AJOU-G21M-01#1-1', outcome_code: '71', wrong_work: '$k=5$ 경로 수를 7로 두어 $p=\frac{148}{243}$', detect_cue: '$*$ 자리의 3가지를 곱하지 않음', feedback: '$*$는 아무 규칙이나 되므로 3가지씩입니다(총 13가지).'}
- {id: MC-STA-4138, name: 홀수 n에서 Σ(p_k+p_-k)=1 근거 누락, concepts: [CON-STA-BINOMIAL], used_in: 'AJOU-G21M-01#2-1', outcome_code: '71', wrong_work: '$\sum(k^2+1)(p_k+p_{-k})=n$ 또는 $n+1-p_0$', detect_cue: '$+1$ 항 처리 없음', feedback: '$n$이 홀수이면 원점에 올 수 없으므로 $\sum(p_k+p_{-k})=1$입니다.'}
