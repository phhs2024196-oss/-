# 아주대 2021학년도 모의논술(자연) — 오개념 후보 (공용 카탈로그 반영 전 제안). ID 구간 MC-*-4151~4199 (2021 실전 담당과 분리)
misconceptions:
- {id: MC-CAL-4151, name: 삼각형 넓이 뺄셈에서 사다리꼴로 오인, concepts: [CON-CAL-AREA-SUBTRACT], used_in: 'AJOU-M21-01#1-1', outcome_code: '71', wrong_work: '$\triangle\mathrm{A}_0\mathrm{B}_0\mathrm{P}$의 넓이를 $\dfrac{(1-x)(k+kx^2)}{2}$로 둠', detect_cue: '$\mathrm{A}_0\mathrm{B}_0$을 밑변으로 한 높이 $1-x$를 쓰지 않음', feedback: '$\triangle\mathrm{A}_0\mathrm{B}_0\mathrm{P}$는 밑변 $\mathrm{A}_0\mathrm{B}_0=k$, 높이 $1-x$인 삼각형입니다.'}
- {id: MC-CAL-4152, name: 등비급수 첫째항 오류, concepts: [CON-CAL-GEOM-SERIES], used_in: 'AJOU-M21-01#1-2', outcome_code: '72', wrong_work: '$s_n=k\left(\tfrac18\right)^{n-1}$로 두고 합 $\dfrac{8k}{7}$', detect_cue: '답이 $\dfrac{8k}{7}$', feedback: '$s_1=\dfrac k8$입니다. 첫째항을 $n=1$에서 확인하세요.'}
- {id: MC-CAL-4153, name: 치환적분 계수 누락, concepts: [CON-CAL-SUBST-INT], used_in: 'AJOU-M21-01#1-3', outcome_code: '73', wrong_work: '원시함수를 $-(\cos\pi x^2+\sin\pi x^2)$로 둠', detect_cue: '답이 $\dfrac{1-\sqrt3}{2}$', feedback: '$u=\pi x^2$이면 $du=2\pi x\,dx$이므로 $\dfrac1{2\pi}$이 붙습니다.'}
- {id: MC-CAL-4154, name: 극한을 t_n 크기로 판단해 발산으로 답함, concepts: [CON-CAL-LOG-LIMIT], used_in: 'AJOU-M21-01#2-1', outcome_code: '71', wrong_work: '$t_n\to\infty$이므로 $(t_n+1)^{\frac1n}\to\infty$', detect_cue: '지수 $\frac1n\to0$을 고려하지 않음', feedback: '로그를 취하면 $\dfrac{\ln(t_n+1)}{n}\to0$이므로 극한은 $1$입니다.'}
- {id: MC-CAL-4155, name: 극값 부호만 보고 x→-∞ 행동 누락, concepts: [CON-CAL-ROOT-EXISTENCE], used_in: 'AJOU-M21-01#2-2', outcome_code: '72', wrong_work: '$g(0)<0$, $g(1)=0$만 확인하고 근이 하나라고 결론', detect_cue: '$x<-3$ 구간과 극댓값 $g(-3)$의 부호 검토가 없음', feedback: '증감표 전 구간에서 함숫값의 부호를 확인해야 다른 근이 없음을 보일 수 있습니다.'}
- {id: MC-CAL-4156, name: x≠1 조건 무시하고 약분 전 해 포함, concepts: [CON-CAL-ROOT-EXISTENCE], used_in: 'AJOU-M21-01#2-3', outcome_code: '73', wrong_work: '$x=1$도 해로 보고 범위를 다르게 판단하거나 $k>0$만 답함', detect_cue: '$k$의 부호로 경우를 나눔', feedback: '$x\ne1$에서 $1-x$로 나누면 $3kx=-3k$, $x=-1$이 $k\ne0$인 모든 실수에서 근입니다.'}
- {id: MC-STA-4157, name: 커버 순서를 무시하고 색 조합만 셈, concepts: [CON-STA-ORDERED-CASES], used_in: 'AJOU-M21-02#1-1', outcome_code: '71', wrong_work: '노+노, 노+흰 두 경우로 확률 $\dfrac{2}{6}$ 또는 $\dfrac29$', detect_cue: '답이 $\dfrac13$이 아니고 흰+노를 따로 세지 않음', feedback: '안쪽·바깥쪽이 구별되므로 (노,흰)과 (흰,노)는 다른 경우입니다.'}
- {id: MC-STA-4158, name: 벗긴 뒤 남는 커버를 바깥쪽으로 착각, concepts: [CON-STA-COND-PROB], used_in: 'AJOU-M21-02#1-2', outcome_code: '72', wrong_work: '바깥쪽이 노란색인 경우 $P_{yy}+P_{wy}$를 셈', detect_cue: '세는 경우가 (노,노),(흰,노)', feedback: '바깥쪽을 벗기면 안쪽 커버만 남습니다.'}
- {id: MC-STA-4159, name: A·B 조건을 무시하고 9가지 전체 확률 계산, concepts: [CON-STA-COND-PROB], used_in: 'AJOU-M21-02#1-3', outcome_code: '73', wrong_work: '두 장씩 81가지 전부에서 셈', detect_cue: '분모가 81', feedback: 'A는 노란색, B는 파란색이라는 조건 아래 각각 3가지(동확률)만 남습니다.'}
- {id: MC-STA-4160, name: k번째 이전 흰색만 오는 경우 포함, concepts: [CON-STA-FIRST-HIT-COUNT], used_in: 'AJOU-M21-02#2-1', outcome_code: '71', wrong_work: '$E_k=2^{k-1}\times3^{10-k}$ (첫 장 노란색 조건 누락)', detect_cue: '$\sum\log_{10}E_k$에 $\log_{10}2$가 9번 더 나옴', feedback: '첫 장은 노란색으로 고정되므로 2번째~$(k-1)$번째만 $2$가지씩입니다.'}
- {id: MC-STA-4161, name: 노/파 두 방향 중 하나만 셈, concepts: [CON-STA-FIRST-HIT-COUNT], used_in: 'AJOU-M21-02#2-2', outcome_code: '72', wrong_work: '$F_k={}_n\mathrm{C}_k(2^{k-1}-1)3^{n-k}$로 두어 합의 절반', detect_cue: '답이 $\dfrac{5^n+3^n}{2}-4^n$ 꼴', feedback: '파란색에서 초록색으로 바뀌는 경우도 같은 수만큼 있으므로 2를 곱합니다.'}
- {id: MC-STA-4162, name: 이항정리 적용 시 빠진 항 보정 누락, concepts: [CON-STA-BINOM-THEOREM], used_in: 'AJOU-M21-02#2-2', outcome_code: '73', wrong_work: '$\sum_{k=2}^n$을 그대로 $5^n-2\cdot4^n$으로 씀', detect_cue: '$+3^n$ 항이 없음', feedback: '$k=0,1$ 항을 더하고 빼서 범위를 맞추세요($k=0$ 항이 $-3^n$).'}
