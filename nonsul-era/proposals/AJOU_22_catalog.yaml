# 아주대 2022학년도 실전(자연 오전·오후·의학과 수학)·모의(자연) — 오개념 후보 (공용 카탈로그 반영 전 제안). ID 구간 MC-*-4201~4299
misconceptions:
- {id: MC-TRI-4201, name: 반사지점 동경 각을 θ의 배수로 둠, concepts: [CON-TRI-REFLECT-ROTATION], used_in: 'AJOU-G22A-01#1-1', outcome_code: '71', wrong_work: '$k$번째 반사지점의 동경 각을 $2k\theta$로 둠', detect_cue: '$\alpha=\pi-2\theta$가 없고 범위가 $\tfrac{\pi}{4}<\theta<\tfrac{\pi}{3}$이 아님', feedback: 'O·I·첫 반사지점은 두 변이 반지름인 이등변삼각형이라 밑각이 $\theta$이고 중심각은 $\pi-2\theta$입니다.'}
- {id: MC-TRI-4202, name: 사인법칙에서 P의 각을 잘못 잡음, concepts: [CON-TRI-SINE-LAW], used_in: 'AJOU-G22A-01#1-1', outcome_code: '72', wrong_work: '$\dfrac{-x}{\sin\theta}=\dfrac{1}{\sin5\theta}$로 두어 $x=-\tfrac{\sin\theta}{\sin5\theta}$', detect_cue: 'P의 $x$좌표가 양수로 나옴', feedback: 'P에서의 각은 $2\pi-5\theta$이고 $\sin(2\pi-5\theta)=-\sin5\theta$입니다.'}
- {id: MC-TRI-4203, name: sin(35π/24) 부호 오류, concepts: [CON-TRI-ADDITION], used_in: 'AJOU-G22A-01#1-2', outcome_code: '71', wrong_work: '$\sin\tfrac{35\pi}{24}=a$', detect_cue: '거리가 음수이거나 P가 원 밖', feedback: '$\tfrac{35\pi}{24}=\tfrac{3\pi}{2}-\tfrac{\pi}{24}$는 제3사분면 각이므로 사인값은 $-\cos\tfrac{\pi}{24}=-a$입니다.'}
- {id: MC-TRI-4204, name: 첫 만남을 두 번째 만남으로 셈, concepts: [CON-TRI-REFLECT-ROTATION], used_in: 'AJOU-G22A-01#2', outcome_code: '71', wrong_work: '$p=0$에서 $n=4$를 답으로 씀', detect_cue: '답 4', feedback: '「2번째로 만난다」이므로 $p=0$의 첫 만남 다음, $p=1$에는 해가 없으니 $p=2$까지 봐야 합니다.'}
- {id: MC-PRF-4205, name: 귀류법 가정 없이 식만 제시, concepts: [CON-PRF-IRRATIONAL-CONTRA], used_in: 'AJOU-G22A-01#3', outcome_code: '71', wrong_work: '$n\alpha\ne2p\pi$이므로 돌아오지 않는다', detect_cue: '왜 등식이 불가능한지($\sqrt6$이 유리수가 됨) 근거가 없음', feedback: '등식이 성립한다고 가정하고 $\sqrt6=\tfrac{2n}{n-2p}$로 바꾸어 무리수성과 모순임을 보이세요.'}
- {id: MC-CAL-4206, name: θ→π/2를 sinθ→1만으로 끝냄, concepts: [CON-CAL-CONTINUITY-INVERSE], used_in: 'AJOU-G22A-02#1', outcome_code: '71', wrong_work: '$\sin\theta\to1$이므로 $\theta\to\tfrac{\pi}{2}$ (범위·연속성 언급 없음)', detect_cue: '$0<\theta<\tfrac{\pi}{2}$와 사인함수의 연속성 근거가 없음', feedback: '$\sin\theta=1$인 각은 여럿이므로 $0<\theta<\tfrac{\pi}{2}$와 연속성을 함께 밝혀야 합니다.'}
- {id: MC-CAL-4207, name: 반지름을 a-s로 둠, concepts: [CON-CAL-TANGENT-CIRCLE-PARAM], used_in: 'AJOU-G22A-02#2-1', outcome_code: '71', wrong_work: '$r=a-s=2s^3$', detect_cue: '$r$에 $t$ 성분이 빠짐', feedback: '$r$은 $(a,0)$과 $(s,t)$ 사이의 거리 $\sqrt{(a-s)^2+t^2}=s^2\sqrt{4s^2+1}$입니다.'}
- {id: MC-CAL-4208, name: n=0을 빠뜨리거나 ∞를 정수로 봄, concepts: [CON-CAL-LIMIT-ORDER], used_in: 'AJOU-G22A-02#2-2', outcome_code: '71', wrong_work: '답을 $n=2$만 또는 $n\ge1$로 씀', detect_cue: '$n\ge3$에서 극한 0을 정수로 인정하지 않거나 $n=1$을 포함', feedback: '$\tfrac{a^n}{r}=\tfrac{(2s^2+1)^ns^{n-2}}{\sqrt{4s^2+1}}$에서 $s^{n-2}$의 지수로 경우를 나누세요. 0도 정수입니다.'}
- {id: MC-CAL-4209, name: 넓이를 한쪽만 계산, concepts: [CON-CAL-AREA-BOUNDARY], used_in: 'AJOU-G22A-02#3-1', outcome_code: '71', wrong_work: '$S=\int_0^sx^2dx+\tfrac12(a-s)t$', detect_cue: '답이 $s^5+\tfrac13s^3$', feedback: '$x$축 아래 대칭 부분까지 포함하므로 2배입니다.'}
- {id: MC-CAL-4210, name: 부채꼴 중심각을 θ로 둠, concepts: [CON-CAL-SECTOR-AREA], used_in: 'AJOU-G22A-02#3-2', outcome_code: '71', wrong_work: '$T=\tfrac12r^2\theta$', detect_cue: '$T$가 $r^2\theta$의 절반', feedback: '$\ell_1$과 $\ell_2$ 사이의 중심각은 $2\theta$입니다(극한값 0은 같지만 식이 틀림).'}
- {id: MC-PRF-4211, name: 귀납 단계에서 아래쪽 부등식 누락, concepts: [CON-PRF-INDUCTION-TWO-SIDED], used_in: 'AJOU-G22B-01#1-1', outcome_code: '71', wrong_work: '$a_{k+1}\le2a_k\le2^{k+1}$만 보이고 끝냄', detect_cue: '$a_{k+1}\ge\tfrac32a_k$ 유도가 없음', feedback: '양쪽 부등식을 모두 귀납 단계에서 보여야 합니다. $3a_k\le2a_k+2a_{k-1}=2a_{k+1}$을 이용하세요.'}
- {id: MC-CAL-4212, name: 음의 근을 버리는 근거 누락, concepts: [CON-CAL-RATIO-LIMIT], used_in: 'AJOU-G22B-01#1-2', outcome_code: '71', wrong_work: '$A=\tfrac{1\pm\sqrt5}{2}$', detect_cue: '두 근을 모두 답으로 씀', feedback: '$a_{n+1}\ge a_n>0$이므로 $A\ge1$입니다.'}
- {id: MC-STA-4213, name: LL로 시작하는 경우 셋째 신호 미고정, concepts: [CON-STA-FIRST-STEP-RECURSION], used_in: 'AJOU-G22B-01#2-1', outcome_code: '71', wrong_work: '$b_{n+3}=b_{n+2}+b_{n+1}+b_{n+1}$', detect_cue: 'LL 다음 길이를 $n+1$로 셈', feedback: 'LL 다음 신호는 반드시 S이므로 남은 길이는 $n$, 개수는 $b_n$입니다.'}
- {id: MC-CAL-4214, name: 근의 위치만 보고 유일성 미증명, concepts: [CON-CAL-IVT-UNIQUE-ROOT], used_in: 'AJOU-G22B-01#2-2', outcome_code: '71', wrong_work: '$f(\tfrac32)<0<f(2)$이므로 $\tfrac32<B<2$', detect_cue: '$f$의 실근이 하나뿐임을 보이지 않음', feedback: '$B$가 다른 실근일 가능성을 없애려면 증감표로 실근이 하나임을 먼저 보여야 합니다.'}
- {id: MC-CAL-4215, name: sin(nx) 적분에서 1/n 누락, concepts: [CON-CAL-TRIG-INTEGRAL], used_in: 'AJOU-G22B-02#1-1', outcome_code: '71', wrong_work: '$S_n=\tfrac{2}{n+1}$', detect_cue: '분모에 $n$이 없음', feedback: '$\int\sin(nx)dx=-\tfrac1n\cos(nx)+C$입니다.'}
- {id: MC-CAL-4216, name: 급수 합에서 2배 누락, concepts: [CON-CAL-TELESCOPING], used_in: 'AJOU-G22B-02#1-2', outcome_code: '71', wrong_work: '$\sum S_n=1$', detect_cue: '답 1', feedback: '$S_n=2\left(\tfrac1n-\tfrac1{n+1}\right)$이므로 합은 2입니다.'}
- {id: MC-CAL-4217, name: 이차함수를 꼭짓점 P로 가정, concepts: [CON-CAL-QUADRATIC-INTERP], used_in: 'AJOU-G22B-02#2-1', outcome_code: '71', wrong_work: 'P를 꼭짓점으로 두고 $g(x)=c(x-\alpha)^2+f(\alpha)$', detect_cue: 'Q를 지나는 조건을 쓰지 않음', feedback: '세 점 O, P, Q를 지나므로 $g(x)=cx\left(x-\tfrac{\pi}{n}\right)$로 두고 P로 $c$를 정합니다.'}
- {id: MC-CAL-4218, name: sin(nα)/α→1로 처리, concepts: [CON-CAL-TRIG-LIMIT], used_in: 'AJOU-G22B-02#2-2', outcome_code: '71', wrong_work: '$\lim T_n=\tfrac{\pi^2}{6n^2(n+1)}$', detect_cue: '분모 $n$의 지수가 2', feedback: '$\tfrac{\sin(n\alpha)}{\alpha}\to n$입니다. $\tfrac{\sin(n\alpha)}{n\alpha}\to1$로 맞추세요.'}
- {id: MC-PRF-4219, name: k(x)≥0을 끝점 값만으로 결론, concepts: [CON-PRF-ROLLE-AUX], used_in: 'AJOU-G22B-02#2-3', outcome_code: '71', wrong_work: '$k(0)=k(\tfrac{\pi}{2})=0$, $k''(0)>0$이므로 $k\ge0$', detect_cue: '$k''''=0$의 근 개수·롤의 정리 논증이 없음', feedback: '중간에서 음수가 될 수 있으므로, 그렇다면 $k''$의 근이 2개 이상이 되어 $k''''$의 근이 2개 이상이라는 모순을 이끌어야 합니다.'}
- {id: MC-CAL-4220, name: 치환 후 최대점을 α=π/2로 씀, concepts: [CON-CAL-SUBSTITUTION-MAX], used_in: 'AJOU-G22B-02#2-4', outcome_code: '71', wrong_work: '$\alpha=\tfrac{\pi}{2}$에서 최대, $\max T_n=\tfrac{\pi}{3}$', detect_cue: '$n$에 의존하지 않는 답', feedback: '$y=n\alpha=\tfrac{\pi}{2}$이므로 $\alpha=\tfrac{\pi}{2n}$이고 $\max T_n=\tfrac{2\pi}{3n(n+1)}$입니다.'}
- {id: MC-CAL-4221, name: cos² 적분을 πn²/l²로 바로 씀, concepts: [CON-CAL-TRIG-INTEGRAL], used_in: 'AJOU-G22M-01#1-1', outcome_code: '71', wrong_work: '$E=\left(\tfrac nl\right)^2\pi$', detect_cue: '$\sin\tfrac{4n\pi}{l}$ 항이 없음', feedback: '적분 구간 $[0,2\pi]$가 $\cos\tfrac{2n}{l}t$의 주기의 정수배가 아닐 수 있으니 사인 항을 남겨야 합니다.'}
- {id: MC-CAL-4222, name: n/l≥1이면 바로 E≥π로 단정, concepts: [CON-CAL-CASE-BOUND], used_in: 'AJOU-G22M-01#1-2', outcome_code: '71', wrong_work: '$\tfrac nl\ge1$이면 $E\ge\pi$ (사인 항이 음수일 수 있음을 무시)', detect_cue: '$(4,3)$, $(5,3)$, $(6,5)$ 확인이 없음', feedback: '사인 항이 음수인 경우는 $-1\le\sin$으로 직접 어림해 $E>\pi$를 확인해야 합니다.'}
- {id: MC-CAL-4223, name: 이동거리를 변위로 계산, concepts: [CON-CAL-ARC-LENGTH], used_in: 'AJOU-G22M-01#2-1', outcome_code: '71', wrong_work: '$L=G(\sin\tfrac{2n\pi}{l})$ (처음과 끝 위치 사이 곡선 길이만)', detect_cue: '$k$에 비례하는 항이 없음', feedback: '왕복한 구간마다 $\tfrac{e-e^{-1}}{2}$씩 더해야 총 이동거리입니다.'}
- {id: MC-CAL-4224, name: 경계 n/l=1/2 제외, concepts: [CON-CAL-ARC-LENGTH], used_in: 'AJOU-G22M-01#2-2', outcome_code: '71', wrong_work: '$2n>l$', detect_cue: '$(1,2)$, $(2,4)$, $(3,6)$ 누락', feedback: '$\tfrac nl=\tfrac12$이면 $L=e-e^{-1}$로 등호가 성립합니다.'}
- {id: MC-ALG-4225, name: 분자 대신 분모의 홀짝을 봄, concepts: [CON-ALG-CONT-FRACTION-REC], used_in: 'AJOU-M22-01#1', outcome_code: '71', wrong_work: '$b_n=\tfrac{4n}{2n-1}$의 분모 $2n-1$이 홀수라 끝항 홀수', detect_cue: '$c_n$을 분모로 정의', feedback: '제2유도수열은 기약분수의 분자를 모은 것입니다.'}
- {id: MC-PRF-4226, name: 귀납 단계에서 기약분수 확인 누락, concepts: [CON-PRF-INDUCTION-TWO-SIDED], used_in: 'AJOU-M22-01#2', outcome_code: '71', wrong_work: '$b_k=\tfrac{k+1}{k}$을 추측만 하고 $k=1$·귀납 단계 없음', detect_cue: '귀납 가정이 없음', feedback: '$k=1$ 확인과 $b_{k-1}=\tfrac{k}{k-1}\Rightarrow b_k=\tfrac{k+1}{k}$를 모두 적어야 합니다.'}
- {id: MC-ALG-4227, name: a_n을 25/4의 내림으로 고름, concepts: [CON-ALG-CONT-FRACTION-REC], used_in: 'AJOU-M22-01#3', outcome_code: '71', wrong_work: '$a_4=6$, $b_3=-4$', detect_cue: '1 이하 또는 음수인 $b_k$가 나옴', feedback: '$b_k>1$이므로 $0<\tfrac1{b_{k-1}}<1$, 따라서 $a_n$은 $\tfrac{25}{4}$의 올림 7입니다.'}
- {id: MC-PRF-4228, name: 역추적 종료성 미언급, concepts: [CON-PRF-DESCENT], used_in: 'AJOU-M22-01#4', outcome_code: '71', wrong_work: '같은 과정을 반복하면 기본수열을 얻는다(끝난다는 근거 없음)', detect_cue: '분자 감소·유한번 종료 언급이 없음', feedback: '각 단계에서 기약분수의 분자가 줄어드는 자연수이므로 유한번에 끝남을 밝혀야 합니다.'}
- {id: MC-PRF-4229, name: k(α)≠0 확인 누락, concepts: [CON-ALG-ROOT-MULTIPLICITY], used_in: 'AJOU-M22-02#1-1', outcome_code: '71', wrong_work: '$g=(x-\alpha)^{m-1}k(x)$이므로 $(m-1)$중근', detect_cue: '$k(\alpha)=mh(\alpha)\ne0$ 확인이 없음', feedback: '$k(\alpha)=0$이면 중복도가 더 커지므로 $k(\alpha)\ne0$을 보여야 정확히 $(m-1)$중근입니다.'}
- {id: MC-PRF-4230, name: f>0 한 경우만 증명, concepts: [CON-PRF-CASE-SYMMETRY], used_in: 'AJOU-M22-02#1-2', outcome_code: '71', wrong_work: '$f>0$인 경우만 다루고 끝냄', detect_cue: '$f<0$ 경우 언급이 없음', feedback: '$f<0$인 경우도 부호를 바꾸어 같은 논리가 성립함을 적어야 합니다.'}
- {id: MC-PRF-4231, name: 중근 끝점에서 g(β) 부호 사용, concepts: [CON-PRF-ROLLE-AUX], used_in: 'AJOU-M22-02#1-3', outcome_code: '71', wrong_work: '$g(\beta)=f''(\beta)<0$이라 두고 사잇값 정리', detect_cue: '$\beta$가 중근이면 $f''(\beta)=0$임을 무시', feedback: '$g(\beta)=0$이므로 롤의 정리로 $f''(\gamma)=0$인 내부 점을 잡아 $g(\gamma)=-f(\gamma)$와 비교하세요.'}
- {id: MC-PRF-4232, name: (라)를 f에 두 번 적용, concepts: [CON-PRF-OPERATOR-FACTOR], used_in: 'AJOU-M22-02#2', outcome_code: '71', wrong_work: '$f''-af$와 $f''-bf$가 각각 $n$개 실근이므로 $h$도 $n$개', detect_cue: '$h=g''-bg$ 분해가 없음', feedback: '$h=(f''-af)''-b(f''-af)$로 써서 $g=f''-af$에 다시 (라)를 적용해야 합니다.'}
- {id: MC-ALG-4233, name: 조건 2 확인 없이 예만 제시, concepts: [CON-PRF-COUNTEREXAMPLE], used_in: 'AJOU-M22-02#3', outcome_code: '71', wrong_work: '$f=x^2+1$, $c=d=1$ (h 계산 없음)', detect_cue: '$h(x)$를 계산하지 않음', feedback: '$h(x)=x^2-4x+3$을 계산해 두 실근을 가짐을 보여야 합니다.'}
