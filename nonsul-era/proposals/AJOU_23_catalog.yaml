# 아주대 2023학년도(실전 오전·오후·의학과 수학 + 모의) 흔한 오답 후보 — 공용 카탈로그 반영 전 제안
# ID 구간 MC-*-4301~4399 (다른 학교·연도와 충돌 방지). 반영 시 db/misconceptions.yaml·db/concepts.yaml 에 먼저 추가 후 문항에 연결.
misconceptions:
- id: MC-SEQ-4301
  name: 등비수열에 0인 항 허용
  concepts:
  - CON-SEQ-GP-NONZERO
  used_in: AJOU-G23A-01#1-1
  outcome_code: '71'
  wrong_work: $c=20$, $d=0$, $b=0$을 그대로 두어 합을 다르게 계산
  detect_cue: 셋째 세로수열에 0이 들어 있다
  feedback: 등비수열은 0인 항을 가질 수 없으므로 $c=20$인 경우는 모순입니다.
- id: MC-CNT-4302
  name: 유리수 공비 등비수열 누락
  concepts:
  - CON-SEQ-GP-NONZERO
  - CON-CNT-EXHAUSTIVE
  used_in: AJOU-G23A-01#1-2
  outcome_code: '72'
  wrong_work: 첫 가로수열을 $1,2,4$만 찾고 $9,6,4$(공비 $\tfrac32$)를 빠뜨려 4개라 답함
  detect_cue: 첫째항이 9인 표가 없다
  feedback: 공비가 정수가 아닐 수도 있습니다. $ar^2\le9$인 모든 경우를 확인하세요.
- id: MC-ALG-4303
  name: 서로 다른 두 실근 조건에서 판별식 등호 포함
  concepts:
  - CON-ALG-DISCRIMINANT
  used_in: AJOU-G23A-01#1-3
  outcome_code: '71'
  wrong_work: $p\le\tfrac{25}{4}$
  detect_cue: 범위에 등호가 있다
  feedback: 서로 다른 두 실근이면 판별식은 0보다 커야 합니다.
- id: MC-SEQ-4304
  name: 로그 변환 후 등차를 원래도 등차로 착각
  concepts:
  - CON-SEQ-LOG-AP-GP
  used_in: AJOU-G23A-01#2-1
  outcome_code: '71'
  wrong_work: $4,8,\dots,40$을 그대로 더해 220이라 답함
  detect_cue: 등비수열의 합 공식이 없다
  feedback: $\log_2x$가 등차이면 $x$는 등비수열입니다.
- id: MC-CAL-4305
  name: 교점 개수를 그래프 직관만으로 판단
  concepts:
  - CON-CAL-IVT-ROOT
  used_in: AJOU-G23A-01#2-2
  outcome_code: '72'
  wrong_work: $x<0$에서 교점이 없다고 보고 1이라 답함
  detect_cue: $h(-\tfrac23)$ 등 함숫값 부호 확인이 없다
  feedback: 음수 구간에서 $h(x)=g(x)-f(x)$의 부호를 몇 점에서 계산해 사잇값 정리를 쓰세요.
- id: MC-ALG-4306
  name: 산술기하평균 부등식의 양수 조건 누락
  concepts:
  - CON-ALG-AM-GM
  used_in: AJOU-G23A-02#1-1
  outcome_code: '71'
  wrong_work: $1+r_1>0$ 언급 없이 $\ge2\sqrt2$를 씀
  detect_cue: 양수 조건이 없다
  feedback: 산술·기하평균 관계는 두 수가 양수일 때만 쓸 수 있습니다.
- id: MC-CAL-4307
  name: 반지름을 반각이 아닌 각으로 잡음
  concepts:
  - CON-CAL-HALF-ANGLE-RADIUS
  used_in: AJOU-G23A-02#1-2
  outcome_code: '71'
  wrong_work: $r_k=\tan\theta_k$로 두어 극한을 $\tfrac{\pi}{4}$로 얻음
  detect_cue: 답이 정답의 2배다
  feedback: 접점까지 거리 1인 직각삼각형에서 중심은 각의 이등분선 위에 있으므로 $r_k=\tan\tfrac{\theta_k}{2}$입니다.
- id: MC-CAL-4308
  name: 양 끝 각의 탄젠트 처리 오류
  concepts:
  - CON-CAL-TAN-ADDITION
  used_in: AJOU-G23A-02#1-3
  outcome_code: '72'
  wrong_work: $\tan\theta_{n+1}=n$으로 두어 $\tfrac1n$ 대신 $n$을 더함
  detect_cue: 마지막 항의 역수가 $\tfrac1n$이다
  feedback: $\theta_{n+1}$은 직선과 $y$축 사이 각이므로 $\tan\theta_{n+1}=\tfrac{1}{p_n}$입니다.
- id: MC-ALG-4309
  name: 대칭축 위의 근 누락
  concepts:
  - CON-ALG-SYMMETRIC-ROOTS
  used_in: AJOU-G23A-02#2-1
  outcome_code: '71'
  wrong_work: 근이 쌍으로만 있다고 보고 $34\div2=17$쌍, 34개라 답함
  detect_cue: 근 2의 존재 논의가 없다
  feedback: 대칭인 두 근의 합은 4이고, 34가 4의 배수가 아니므로 2도 근이어야 합니다.
- id: MC-CAL-4310
  name: 절댓값 무시한 적분
  concepts:
  - CON-CAL-SYMMETRY-INTEGRAL
  used_in: AJOU-G23A-02#2-2
  outcome_code: '71'
  wrong_work: $\lvert\cos x\rvert$를 $\cos x$로 두어 $\int_0^\pi f=0$
  detect_cue: 적분값이 0이다
  feedback: $\lvert\cos x\rvert$이므로 $[0,\tfrac{\pi}{2}]$에서의 적분의 2배로 계산하세요.
- id: MC-CAL-4311
  name: 중근 조건 누락으로 사차함수 꼴 오류
  concepts:
  - CON-CAL-FACTOR-DOUBLE-ROOT
  used_in: AJOU-G23B-01#1-1
  outcome_code: '71'
  wrong_work: $f(x)=ax(x-1)(x-\beta)(x-\gamma)$로 두고 미정
  detect_cue: $x^2(x-1)^2$ 인수가 없다
  feedback: $f(0)=f'(0)=0$이면 $x=0$은 중근입니다.
- id: MC-CAL-4312
  name: 평균값 정리를 한 구간에만 적용
  concepts:
  - CON-CAL-MVT
  used_in: AJOU-G23B-01#1-2
  outcome_code: '72'
  wrong_work: $f''(a)=\tfrac{2023}{p}$만 구하고 $b$의 존재를 보이지 않음
  detect_cue: 구간 $[p,1]$ 논의가 없다
  feedback: $[0,p]$와 $[p,1]$에서 각각 평균값 정리를 써야 두 점이 생깁니다.
- id: MC-CAL-4313
  name: 평행이동 적분 구간 오류
  concepts:
  - CON-CAL-SUBSTITUTION
  used_in: AJOU-G23B-01#2-1
  outcome_code: '71'
  wrong_work: $\int_1^2h(x-1)dx=\int_1^2h(t)dt$
  detect_cue: 치환 후 구간이 그대로다
  feedback: $t=x-1$이면 구간도 $[0,1]$로 바뀝니다.
- id: MC-CAL-4314
  name: 이어 붙인 함수의 미분가능 조건 누락
  concepts:
  - CON-CAL-PIECEWISE-DIFF
  used_in: AJOU-G23B-01#2-2
  outcome_code: '72'
  wrong_work: $ad=24$만 쓰고 $(c+2)e=24$를 빠뜨려 경우의 수를 과대 계산
  detect_cue: $e$에 대한 조건이 없다
  feedback: $S(x)$는 $x=1$에서 미분가능해야 하므로 $G'(1)=H'(0)=24$입니다.
- id: MC-CAL-4315
  name: 닫힌구간 끝점 조건 누락
  concepts:
  - CON-CAL-ROOT-COUNT-INTERVAL
  used_in: AJOU-G23B-02#1-1
  outcome_code: '71'
  wrong_work: $a>\tfrac14$만 답함
  detect_cue: $f(-2)\le0$ 조건이 없다
  feedback: 세 근이 모두 $[-2,2]$ 안에 있으려면 끝값의 부호도 확인해야 합니다.
- id: MC-CAL-4316
  name: 최솟값 최대화에서 한 경우만 확인
  concepts:
  - CON-CAL-MINIMAX
  used_in: AJOU-G23B-02#1-2
  outcome_code: '72'
  wrong_work: $a=1$에서 최댓값 4만 계산하고 다른 $a$와 비교하지 않음
  detect_cue: $a\ne1$인 경우 논의가 없다
  feedback: 다른 모든 $a$에서 최댓값이 4보다 큼을 보여야 최소임이 보장됩니다.
- id: MC-ALG-4317
  name: 근과 계수 관계에서 부호 오류
  concepts:
  - CON-ALG-VIETA
  used_in: AJOU-G23B-02#2-1
  outcome_code: '71'
  wrong_work: $a>2A^2$
  detect_cue: $-a$ 대신 $a$다
  feedback: 두 근의 합은 $-a$입니다.
- id: MC-CAL-4318
  name: 우함수 적분을 0으로 처리
  concepts:
  - CON-CAL-SYMMETRY-INTEGRAL
  used_in: AJOU-G23B-02#2-2
  outcome_code: '71'
  wrong_work: $\int_{-s}^{s}F(x)dx=0$이 항상 성립한다고 봄
  detect_cue: 적분식이 계산되지 않았다
  feedback: $F$는 우함수이므로 $\int_{-s}^{s}F=2\int_0^sF$입니다.
- id: MC-ALG-4319
  name: 계수 비교에서 상수항 분리 실패
  concepts:
  - CON-ALG-IDENTITY
  used_in: AJOU-G23B-02#2-3
  outcome_code: '72'
  wrong_work: $b$와 $L$의 상수항을 동시에 정하려다 $b+d=\tfrac12$만 남김
  detect_cue: 조건 ③을 쓰지 않았다
  feedback: 계수 비교로는 $b+d$만 정해집니다. 조건 ③으로 $b$를 결정하세요.
- id: MC-GEO-4320
  name: 중점연결정리 길이 오류
  concepts:
  - CON-GEO-MIDPOINT-THEOREM
  used_in: AJOU-G23M-01#1-1
  outcome_code: '71'
  wrong_work: $\overline{\mathrm{PR}}=b$로 둠
  detect_cue: $\overline{\mathrm{PR}}=2b$가 아니다
  feedback: 두 변의 중점을 이은 선분은 나머지 변 길이의 절반입니다.
- id: MC-SEQ-4321
  name: 깎인 넓이 공비 오류
  concepts:
  - CON-SEQ-GP-SUM
  used_in: AJOU-G23M-01#1-2
  outcome_code: '71'
  wrong_work: 공비를 $\tfrac12$로 둠
  detect_cue: 넓이 비가 $\tfrac12$이다
  feedback: 밑변과 높이가 모두 절반이 되므로 넓이는 $\tfrac14$배입니다.
- id: MC-SEQ-4322
  name: 기울기 점화식을 귀납 없이 추측
  concepts:
  - CON-SEQ-RECURRENCE
  used_in: AJOU-G23M-01#1-3
  outcome_code: '72'
  wrong_work: $n=1,2,3$에서 $-1,-2,-3$을 확인하고 「따라서 $-n$」
  detect_cue: $p_{n+1}$과 $p_n$의 관계식이 없다
  feedback: 일반 $n$에서 $p_{n+1}=p_n-1$을 유도해야 증명이 됩니다.
- id: MC-CAL-4323
  name: 절댓값 그래프에서 원점 통과 경우 누락
  concepts:
  - CON-CAL-ABS-GRAPH-TANGENT
  used_in: AJOU-G23M-01#2-1
  outcome_code: '72'
  wrong_work: 접하는 경우만 찾아 $r=\tfrac{13}{2}$라 답함
  detect_cue: 기울기 1인 직선 논의가 없다
  feedback: $y=\lvert f(x)\rvert$는 원점에서 꺾이므로 직선이 원점을 지나는 경우도 교점이 3개입니다.
- id: MC-CAL-4324
  name: 최솟값 위치를 k 최소로 착각
  concepts:
  - CON-CAL-ABS-GRAPH-TANGENT
  used_in: AJOU-G23M-01#2-2
  outcome_code: '72'
  wrong_work: $k=1$(원점 통과)일 때를 최소로 봄
  detect_cue: 접선 기울기 조건이 없다
  feedback: 적분값은 교점의 $x$좌표 $p$가 작을수록 작고, $p$가 가장 작은 경우는 접할 때입니다.
- id: MC-CAL-4325
  name: 이동 구간 최솟값 경우 분류 누락
  concepts:
  - CON-CAL-QUADRATIC-INTERVAL-MIN
  used_in: AJOU-M23-01#1-1
  outcome_code: '71'
  wrong_work: 꼭짓점에서만 최솟값을 구해 $a=22$라 답함
  detect_cue: 구간에 꼭짓점이 포함되는지 확인이 없다
  feedback: $a=22$이면 구간에 $x=1$이 없습니다. 구간 위치에 따라 경우를 나누세요.
- id: MC-CAL-4326
  name: 극솟값과 끝값 비교 누락
  concepts:
  - CON-CAL-EXTREMA-ENDPOINT
  used_in: AJOU-M23-01#1-2
  outcome_code: '72'
  wrong_work: 극솟값 $f(\theta_2)$를 최솟값으로 답함
  detect_cue: $f(0)$과의 비교가 없다
  feedback: 닫힌구간의 최솟값은 극솟값과 끝값을 비교해야 합니다.
- id: MC-CAL-4327
  name: 접선 넓이에서 구간 미분할
  concepts:
  - CON-CAL-AREA-BOUNDARY
  used_in: AJOU-M23-01#2-1
  outcome_code: '71'
  wrong_work: $\int_{-2}^{0}$ 한 번에 한 접선만 빼서 계산
  detect_cue: $x=-1$에서 나누지 않았다
  feedback: 아래 경계가 $x=-1$에서 다른 접선으로 바뀝니다.
- id: MC-PRF-4328
  name: 평균값 정리 적용 조건 누락
  concepts:
  - CON-CAL-MVT
  used_in: AJOU-M23-01#2-2
  outcome_code: '72'
  wrong_work: 「$f''$이 이차함수라서 두 점에서만 같다」만 쓰고 세 번째 점 $c$를 만들지 않음
  detect_cue: 평균값 정리가 없다
  feedback: (다)의 식과 평균값 정리로 세 번째 점 $c$를 만들어야 모순이 생깁니다.
- id: MC-CAL-4329
  name: 접선 개수와 접점 개수 동일시 근거 누락
  concepts:
  - CON-CAL-TANGENT-COUNT
  used_in: AJOU-M23-01#2-3
  outcome_code: '72'
  wrong_work: $g(t)=0$의 세 근을 바로 세 접선이라 함
  detect_cue: (2)의 결과 인용이 없다
  feedback: 삼차함수에서 접점이 다르면 접선도 다르다는 (2)의 결과를 근거로 쓰세요.
- id: MC-CNT-4330
  name: 거듭제곱 합 공식 혼동
  concepts:
  - CON-SEQ-POWER-SUM
  used_in: AJOU-M23-02#1-1
  outcome_code: '71'
  wrong_work: $\sum n^3=\tfrac{n(n+1)(2n+1)}{6}$으로 계산
  detect_cue: 답이 4900이다
  feedback: $\sum_{k=1}^nk^3=\left(\tfrac{n(n+1)}{2}\right)^2$입니다.
- id: MC-CNT-4331
  name: 인수와 구조 대응 오류
  concepts:
  - CON-CNT-FUNCTION-COUNT
  used_in: AJOU-M23-02#1-2
  outcome_code: '71'
  wrong_work: $S=\{(1,2),(2,3),(3,4),(1,4)\}$를 제시
  detect_cue: 원소가 4개다
  feedback: 이 $S$의 $g(n)$은 $n(n-1)(n^2-3n+3)$입니다. $f(4)$의 선택지가 $n-2$개가 되게 하세요.
- id: MC-CNT-4332
  name: 합성함수 조건에서 f2 개수 오산
  concepts:
  - CON-CNT-FUNCTION-COUNT
  used_in: AJOU-M23-02#1-3
  outcome_code: '72'
  wrong_work: $f_2$를 $A$ 안의 임의 함수 $2^4$개로 셈
  detect_cue: $S_2$ 조건 미적용
  feedback: $S_2$ 조건 때문에 $f_2$는 1에서의 값으로 결정되어 2개뿐입니다.
- id: MC-PRF-4333
  name: 계수 절댓값 무시
  concepts:
  - CON-SEQ-AP-GENERAL
  used_in: AJOU-M23-02#2-1
  outcome_code: '71'
  wrong_work: $c_m$이 음수일 수 있다며 증명을 포기
  detect_cue: 차 $d^2$ 계산이 없다
  feedback: (1)은 등차수열 $c_n$ 자체에 대한 부등식이므로 $c_m^2-c_{m-1}c_{m+1}=d^2$만 보이면 됩니다.
- id: MC-PRF-4334
  name: 계수 절댓값을 쓰지 않고 비교
  concepts:
  - CON-SEQ-AP-GENERAL
  used_in: AJOU-M23-02#2-2
  outcome_code: '72'
  wrong_work: $c_2=-1$, $c_1=-2$, $c_3=2$로 두어 $c_1c_3=-4<1$이라 (*) 성립으로 결론
  detect_cue: 계수의 절댓값을 취하지 않았다
  feedback: $c_m$은 계수의 절댓값입니다. $c_1c_3=4>1=c_2^2$입니다.
