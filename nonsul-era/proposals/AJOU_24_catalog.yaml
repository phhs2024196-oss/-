# 아주대 2024학년도(실전 G24A·G24B·G24M, 모의 M24) 소문항별 흔한 오답 후보 — 공용 카탈로그 반영 전 제안
# ID 구간: MC-*-4401 ~ 4499 (2024학년도 아주대 전용). outcome_code 는 소문항 안에서 겹치지 않게 70~78
misconceptions:
- {id: MC-CAL-4401, name: 최대 함수의 값을 한 함수로만 계산, concepts: [CON-CAL-MAXFN], used_in: 'AJOU-G24A-01#1-1', outcome_code: '71', wrong_work: '최솟값을 $h(2)=f(2)=0$으로 답함', detect_cue: '$x=2$에서 $f(2)<g(2)$ 비교가 없다', feedback: '$h$는 두 값 중 작지 않은 값이므로 각 점에서 $f$와 $g$를 비교해야 합니다.'}
- {id: MC-CAL-4402, name: 최대 함수의 극소를 각 함수의 극소로 착각, concepts: [CON-CAL-MAXFN], used_in: 'AJOU-G24A-01#1-2', outcome_code: '71', wrong_work: '$\sin2x$의 극소점 $x=\tfrac{3\pi}{4}$를 $\alpha$로 둠', detect_cue: '교점 방정식이 없고 $\tan\alpha=-1$', feedback: '$h$의 극소는 위쪽 그래프가 바뀌는 교점에서 생길 수 있습니다. 그래프를 함께 그려 보세요.'}
- {id: MC-TRG-4403, name: 사분면 무시 부호 오류, concepts: [CON-TRG-QUADRANT-SIGN], used_in: 'AJOU-G24A-01#1-2', outcome_code: '72', wrong_work: '$\tan\alpha=\tfrac{3\sqrt{55}}{55}$', detect_cue: '$\tfrac{\pi}{2}<\alpha<\pi$ 언급 없이 양수 답', feedback: '$\alpha$가 제2사분면이면 $\cos\alpha<0$이므로 $\tan\alpha<0$입니다.'}
- {id: MC-TRG-4404, name: 중심각을 반각으로 혼동, concepts: [CON-TRG-SECTOR-AREA], used_in: 'AJOU-G24A-01#2-1', outcome_code: '71', wrong_work: '$\cos\theta=\tfrac13$으로 두어 $\sin\theta=\tfrac{2\sqrt2}{3}$', detect_cue: '답이 $\tfrac{2\sqrt2}{3}$', feedback: '$t=\tfrac13$은 $\cos\tfrac{\theta}{2}$입니다. 각 POQ 전체가 $\theta$입니다.'}
- {id: MC-CAL-4405, name: 활꼴 넓이에서 삼각형 부호 오류, concepts: [CON-TRG-SECTOR-AREA], used_in: 'AJOU-G24A-01#2-2', outcome_code: '71', wrong_work: '$A(\theta)=\tfrac{\theta+\sin\theta}{2}$', detect_cue: '적분값 $\tfrac{\pi^2}{4}+1$', feedback: '윗부분 활꼴은 부채꼴에서 삼각형 OPQ를 뺀 것입니다.'}
- {id: MC-CAL-4406, name: 둘레에서 현 누락, concepts: [CON-CAL-TRIG-LIMIT], used_in: 'AJOU-G24A-01#2-3', outcome_code: '71', wrong_work: '$B(\theta)=\theta$로 두어 극한 $1$', detect_cue: '답이 $1$', feedback: '둘레는 호 $\mathrm{PQ}$와 선분 $\mathrm{PQ}$의 합입니다.'}
- {id: MC-FUN-4407, name: 2-상수함수의 상수값 미확정, concepts: [CON-FUN-COMPOSITION], used_in: 'AJOU-G24A-02#1-1', outcome_code: '71', wrong_work: '$a_n=(f\circ f)(f(n))$의 값을 $f(n)$에 따라 다르다고 둠', detect_cue: '$(f\circ f)(3)=3$을 쓰지 않음', feedback: '$f\circ f$가 상수함수이면 그 값은 $(f\circ f)(3)$으로 정해집니다.'}
- {id: MC-FUN-4408, name: 구간 경계 k 포함 여부 오류, concepts: [CON-FUN-COMPOSITION], used_in: 'AJOU-G24A-02#1-2', outcome_code: '71', wrong_work: '$k=4$ 또는 $k=8$을 포함', detect_cue: '답 집합에 4 또는 8', feedback: '$(f\circ f)(1)=f(4)$가 $k+3$이 되는 조건은 $4\ge k$입니다. 등호를 따져 보세요.'}
- {id: MC-FUN-4409, name: 다른 고정점 배제 누락, concepts: [CON-FUN-FIXED-POINT], used_in: 'AJOU-G24A-02#2', outcome_code: '71', wrong_work: '$(1,2,3,4)$ 등 고정점이 둘 이상인 함수 포함', detect_cue: '$f(x)=x$인 $x\ne4$가 있는 함수가 답에 있다', feedback: '고정점이 $4$ 외에 있으면 $f^4$의 치역에 두 값이 남아 상수함수가 아닙니다.'}
- {id: MC-CNT-4410, name: 치역 크기 2에서 순환·고정 경우 포함, concepts: [CON-FUN-FIXED-POINT], used_in: 'AJOU-G24A-02#3', outcome_code: '71', wrong_work: '치역 크기 2인 함수 18개를 모두 셈', detect_cue: '답이 $21$ 또는 $9$가 아닌 큰 수', feedback: '치역 $\{a,b\}$에서 $g(a)\ne g(b)$이면 몇 번 합성해도 두 값이 남습니다.'}
- {id: MC-CAL-4411, name: 법선 기울기를 접선 기울기로 사용, concepts: [CON-CAL-NORMAL-LINE], used_in: 'AJOU-G24B-01#1-1', outcome_code: '71', wrong_work: '$L_{\mathrm{P}}$의 기울기를 $2t$로 둠', detect_cue: '직선식 $y=2tx-t^2-1$', feedback: '법선은 접선에 수직이므로 기울기는 $-\tfrac{1}{2t}$입니다.'}
- {id: MC-CAL-4412, name: θ에 대한 변화율을 t에 대한 변화율로 답함, concepts: [CON-CAL-CHAIN-RULE], used_in: 'AJOU-G24B-01#1-2', outcome_code: '71', wrong_work: '$S''(1)=\tfrac94$을 답함', detect_cue: '$\tfrac{dt}{d\theta}$ 인수가 없다', feedback: '$\theta$에 대한 순간변화율은 $S''(t)\tfrac{dt}{d\theta}$입니다.'}
- {id: MC-CAL-4413, name: x좌표 차를 선분 길이로 사용, concepts: [CON-CAL-OPTIMIZATION], used_in: 'AJOU-G24B-01#1-3', outcome_code: '71', wrong_work: '$2t+\tfrac{1}{2t}$의 최솟값 $2$를 답함', detect_cue: '답이 $2$', feedback: '$\overline{\mathrm{PQ}}$는 $x$좌표 차를 $\cos\theta$로 나눈 값입니다.'}
- {id: MC-CAL-4414, name: 법선 위 이동 방향 오류, concepts: [CON-CAL-NORMAL-LINE], used_in: 'AJOU-G24B-01#2-1', outcome_code: '71', wrong_work: '$x(t)=t+\tfrac{2t}{\sqrt{4t^2+1}}$', detect_cue: '$a>0$으로 선택', feedback: '$\mathrm{R}$은 선분 $\mathrm{PQ}$ 위이므로 $x$좌표가 $t$보다 작습니다.'}
- {id: MC-CAL-4415, name: s^2-4 인수 1/(s+2) 누락, concepts: [CON-CAL-FTC], used_in: 'AJOU-G24B-01#2-2', outcome_code: '71', wrong_work: '극한값을 $l''(2)=\sqrt{17}-\tfrac{2}{17}$로 답함', detect_cue: '$\tfrac14$ 인수가 없다', feedback: '$\tfrac{l(s)-l(2)}{s^2-4}=\tfrac{1}{s+2}\cdot\tfrac{l(s)-l(2)}{s-2}$입니다.'}
- {id: MC-CNT-4416, name: 순열 대신 조합 사용, concepts: [CON-CNT-PERM-COMB], used_in: 'AJOU-G24B-02#1-1', outcome_code: '71', wrong_work: '${}_7\mathrm{C}_3=35$', detect_cue: '답 $35$', feedback: '세 카드가 서로 다르므로 자리를 고른 뒤 배열하는 순열입니다.'}
- {id: MC-CNT-4417, name: 순서 고정인데 순열 사용, concepts: [CON-CNT-PERM-COMB], used_in: 'AJOU-G24B-02#1-2', outcome_code: '71', wrong_work: '${}_9\mathrm{P}_3=504$', detect_cue: '답 $504$', feedback: '자리 번호의 대소가 정해져 있으므로 자리만 고르면 됩니다.'}
- {id: MC-CNT-4418, name: 이웃한 두 카드 순서 누락, concepts: [CON-CNT-PERM-COMB], used_in: 'AJOU-G24B-02#1-3', outcome_code: '71', wrong_work: '$10\times9=90$', detect_cue: '답 $90$', feedback: '가위/보와 보/가위는 서로 다른 배열입니다.'}
- {id: MC-LOG-4419, name: 이기는 카드 방향 반대로 해석, concepts: [CON-LOG-RULE-READING], used_in: 'AJOU-G24B-02#2-1', outcome_code: '71', wrong_work: '1번 카드가 이기는 카드를 2번 자리에 둠: (가위/보/바위) 등', detect_cue: '답에 (가위/보/바위)가 있다', feedback: '규칙은 1번 자리 카드를 "이기는" 카드의 자리 번호를 제한합니다.'}
- {id: MC-LOG-4420, name: g(3) 값 제한 오판, concepts: [CON-LOG-RULE-READING], used_in: 'AJOU-G24B-02#2-2', outcome_code: '71', wrong_work: '$g(3)=3$인 함수 하나만 답함', detect_cue: '답이 하나', feedback: '3번 자리 카드를 이기는 카드가 1번 자리이면 $g(3)$은 무엇이든 됩니다.'}
- {id: MC-LOG-4421, name: h(3)=1 반례 미확인, concepts: [CON-LOG-RULE-READING], used_in: 'AJOU-G24B-02#2-3', outcome_code: '71', wrong_work: '$h(3)=1,2,3$ 세 함수를 답함', detect_cue: '$(3,3,1)$이 답에 있다', feedback: '(보/바위/가위)에서 가위를 이기는 바위는 2번 자리이므로 $h(3)\ge2$여야 합니다.'}
- {id: MC-CAL-4422, name: 부등식 풀이에서 반올림, concepts: [CON-CAL-AREA-BETWEEN], used_in: 'AJOU-G24M-01#1-1', outcome_code: '71', wrong_work: '$n\le2812.5$에서 $2813$', detect_cue: '답 $2813$', feedback: '넓이가 $100$ 이하여야 하므로 $n\le2812.5$인 최대 자연수입니다.'}
- {id: MC-CNT-4423, name: 교점 정수점 경우 분류 누락, concepts: [CON-CNT-LATTICE], used_in: 'AJOU-G24M-01#1-2', outcome_code: '71', wrong_work: '$25\le n<36$ 모두(32 포함), $n=18$ 누락', detect_cue: '답에 32 포함 또는 18 없음', feedback: '$\sqrt{2n}$이 정수이면 $(\pm\sqrt{2n},2)$도 정수점입니다.'}
- {id: MC-SEQ-4424, name: 등비수열 항 수 오류, concepts: [CON-SEQ-GEOMETRIC-SUM], used_in: 'AJOU-G24M-01#2-1', outcome_code: '71', wrong_work: '$p=2^0,\dots,2^{20}$만 합해 $2^{21}-1$', detect_cue: '음의 지수 누락', feedback: '$\lvert\log_2p\rvert\le20$이므로 $-20$부터 $20$까지 41개입니다.'}
- {id: MC-CAL-4425, name: 미분가능 조건에서 f'(0)=f'(1) 누락, concepts: [CON-CAL-DIFFERENTIABILITY], used_in: 'AJOU-G24M-01#2-2', outcome_code: '71', wrong_work: '$a$를 정하지 못하거나 $f(0)=f(1)$만 사용', detect_cue: '$f''(0)=f''(1)$ 식이 없다', feedback: '이어 붙인 점에서 미분가능하려면 미분계수도 같아야 합니다.'}
- {id: MC-CAL-4426, name: 경계 구간의 접함·두 점 교차 누락, concepts: [CON-CAL-ROOT-COUNT], used_in: 'AJOU-G24M-01#2-3', outcome_code: '71', wrong_work: '$4046$, $4049$만 답함', detect_cue: '4048, 4050 없음', feedback: '$-2024<x<-2023$에서 직선과 곡선이 접하거나 두 점에서 만날 수 있습니다.'}
- {id: MC-SET-4427, name: 5 제외 누락, concepts: [CON-SET-SEMIGROUP], used_in: 'AJOU-M24-01#1-1', outcome_code: '71', wrong_work: '$5$의 배수 전부를 세어 $405$', detect_cue: '답 $405$', feedback: '$S(2,3)$에 $1$이 없으므로 $5\notin S(10,15)$입니다.'}
- {id: MC-SET-4428, name: 연속 세 원소 논리 부재, concepts: [CON-SET-SEMIGROUP], used_in: 'AJOU-M24-01#1-2', outcome_code: '71', wrong_work: '몇 개 예시만 확인하고 $a=6$', detect_cue: '6 이상 전체가 들어감을 보이는 근거가 없다', feedback: '$6,7,8$이 원소이면 $3$씩 더해 모든 수를 얻을 수 있음을 밝히세요.'}
- {id: MC-PRF-4429, name: 명제의 부정 오류, concepts: [CON-PRF-NEGATION], used_in: 'AJOU-M24-01#1-3', outcome_code: '71', wrong_work: '부정을 "어떤 7의 배수는 원소이다"로 두어 $b$를 많이 답함', detect_cue: '답에 짝수 또는 $b\ge9$', feedback: '"어떤 ~가 아니다"의 부정은 "모든 ~이다"입니다.'}
- {id: MC-PRF-4430, name: 한쪽 포함만 증명, concepts: [CON-PRF-SET-EQUALITY], used_in: 'AJOU-M24-01#2-1', outcome_code: '71', wrong_work: '치역 $\subset$ 고정점 집합만 보이고 끝냄', detect_cue: '역방향 포함 언급 없음', feedback: '두 집합이 같음은 서로의 부분집합임을 모두 보여야 합니다.'}
- {id: MC-CNT-4431, name: 항등·상수함수만 셈, concepts: [CON-FUN-FIXED-POINT], used_in: 'AJOU-M24-01#2-2', outcome_code: '71', wrong_work: '$1+3=4$', detect_cue: '치역 크기 2 경우 누락', feedback: '치역이 두 원소인 경우도 고정점 조건을 만족하는 함수가 있습니다.'}
- {id: MC-SEQ-4432, name: 앞면 배율을 3배로 해석, concepts: [CON-SEQ-RECURRENCE], used_in: 'AJOU-M24-02#1-1', outcome_code: '71', wrong_work: '$x_{2n-1}=3x_{2n-2}$', detect_cue: '$x_{50}=100\cdot(3/2)^{25}$', feedback: '전부 제시하고 제시한 만큼 더 얻으면 2배가 됩니다(제시문 예시 확인).'}
- {id: MC-SEQ-4433, name: 제시분과 보유분 혼동, concepts: [CON-SEQ-RECURRENCE], used_in: 'AJOU-M24-02#1-2', outcome_code: '71', wrong_work: '$\tfrac{y_{2n}}{y_{2n-1}}=\tfrac12$', detect_cue: '제시하지 않은 반을 빠뜨림', feedback: '제시하지 않은 반은 그대로 남습니다.'}
- {id: MC-SEQ-4434, name: 묶음 횟수 오류, concepts: [CON-SEQ-RECURRENCE], used_in: 'AJOU-M24-02#1-3', outcome_code: '71', wrong_work: '$y_{50}=100\left(\tfrac98\right)^{50}$', detect_cue: '지수 50', feedback: '두 게임이 한 묶음이므로 $\tfrac98$은 25번 곱해집니다.'}
- {id: MC-CAL-4435, name: 경계값 비교 누락, concepts: [CON-CAL-OPTIMIZATION], used_in: 'AJOU-M24-02#1-4', outcome_code: '71', wrong_work: '$\alpha=1$(전부 제시)이 최대라고 답함', detect_cue: '$f(\alpha)$ 식 없이 직관', feedback: '$f(\alpha)=(1+\alpha)(1-\tfrac12\alpha)$를 구간 $[0,1]$에서 최대화하세요.'}
- {id: MC-LOG-4436, name: 산술평균 수익률 사용, concepts: [CON-LOG-COMMON-LOG], used_in: 'AJOU-M24-02#2', outcome_code: '71', wrong_work: '$(0.5-0.25)/2=0.125$', detect_cue: '로그 계산이 없다', feedback: '제시문 (나)의 실제 평균 수익률은 $(1+r)^{50}=\tfrac{y_{50}}{Y}$를 만족합니다.'}
