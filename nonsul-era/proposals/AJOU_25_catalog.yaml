# ID 구간: MC-*-4501 ~ 4599 (2025학년도 아주대 전용). outcome_code 는 소문항 안에서 겹치지 않게 70~78
misconceptions:
- {id: MC-CAL-4501, name: 분자 인수분해 없이 항별 분리 실패, concepts: [CON-CAL-SUBST-INTEGRAL], used_in: 'AJOU-G25A-01#1-1', outcome_code: '71', wrong_work: '$\int\frac{1}{\cos^4x}dx$ 등으로 항마다 나누어 적분 불능', detect_cue: '$\cos^2x(1+\sin x+\sin^2x)$ 인수분해가 없다', feedback: '분자를 $1-\sin^4x$와 $\sin x-\sin^3x$로 묶으면 $\cos^2x$가 공통인수로 나옵니다.'}
