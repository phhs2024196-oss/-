- {id: MC-CAL-4643, name: 망원 합 끝항 처리 오류, concepts: [CON-CAL-TELESCOPING], used_in: 'AJOU-M26-02#1-3', outcome_code: '73', wrong_work: '$2\left(1-\tfrac1{2027}\right)$', detect_cue: '마지막 항을 $\tfrac1{2027}$로 씀', feedback: '$n=2026$에서 마지막으로 남는 항은 $-\tfrac1{2026}$입니다.'}
- {id: MC-CAL-4644, name: 기함수 판정 없이 직접 적분 시도, concepts: [CON-CAL-ODD-EVEN-INTEGRAL], used_in: 'AJOU-M26-02#2-1', outcome_code: '79', wrong_work: '$\int f\,dx$를 치환으로 직접 계산하다 실패', detect_cue: '$f_O$, $f_E$ 분해 없음', feedback: '$f=f_O+f_E$로 나누면 대칭 구간에서 $f_O$ 적분은 $0$입니다.'}
- {id: MC-CAL-4645, name: 극한에서 3^(t-1) 계수 누락, concepts: [CON-CAL-TRIG-LIMIT], used_in: 'AJOU-M26-02#2-2', outcome_code: '72', wrong_work: '$g(t)=\sin\tfrac{\pi}{3^t}\to0$', detect_cue: '치환 계수 누락', feedback: '$u=\tfrac{x}{3^{t-1}}$로 치환하면 $dx=3^{t-1}du$이므로 $g(t)=3^{t-1}\sin\tfrac{\pi}{3^t}$입니다.'}
