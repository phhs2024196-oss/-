# 아주대 2026학년도 실전(오전 A·오후 B·의학과 M·약학과 P) + 모의(M26) — 오개념 후보 (공용 카탈로그 반영 전 제안). ID 구간 MC-*-4601~4699
misconceptions:
- {id: MC-CAL-4601, name: 구간별 함수의 접선에서 한쪽 식만 사용, concepts: [CON-CAL-PIECEWISE-TANGENT], used_in: 'AJOU-G26A-01#1-1', outcome_code: '71', wrong_work: '$\ell_1$도 $f(x)=x^2(x+1)$의 도함수로 구함', detect_cue: '$x<-1$의 점에서 기울기 부호가 반대', feedback: '점 $(-1-t,\cdot)$은 $x<-1$이므로 $f(x)=-x^2(x+1)$, $f^{\prime}(x)=-3x^2-2x$를 써야 합니다.'}
