- {id: MC-CAL-4641, name: 변환 직사각형 밑변에 g 값을 사용, concepts: [CON-CAL-SUBST-INT], used_in: 'AJOU-M26-02#1-1', outcome_code: '71', wrong_work: '밑변을 $g\left(\tfrac{2k}{n}\right)$로 둠', detect_cue: '$a_n$이 $n^3$ 차수 합', feedback: '변환 직사각형 밑변은 $\tfrac cn g^{\prime}\left(\tfrac{kc}{n}\right)$입니다.'}
