# 아주대 2027학년도 모의논술(자연) — 오개념 후보 (공용 카탈로그 반영 전 제안). ID 구간 MC-*-4701~4799
misconceptions:
- {id: MC-CAL-4701, name: 변곡점을 f'=0에서 찾음, concepts: [CON-CAL-INFLECTION], used_in: 'AJOU-M27-01#1-1', outcome_code: '71', wrong_work: '$f^{\prime}(x)=0$의 근 $x=n$을 변곡점으로 둠', detect_cue: '이계도함수 계산이 없고 $a_n=b_n$ 또는 $a_n=0$', feedback: '변곡점은 $f^{\prime\prime}$의 부호가 바뀌는 점입니다. 이차식 $x^2-2nx+n(n-1)$의 근을 구하세요.'}
- {id: MC-CAL-4702, name: 위로 볼록 구간에서 현이 곡선 위에 있다고 판단, concepts: [CON-CAL-CONCAVITY-CHORD], used_in: 'AJOU-M27-01#1-2', outcome_code: '72', wrong_work: '선분 AC가 곡선 위에 있으므로 넓이 비교 방향을 반대로 씀', detect_cue: '위로 볼록과 현·접선의 위치 관계를 뒤바꿈', feedback: '위로 볼록인 구간에서 현(할선)은 곡선 아래, 아래로 볼록인 구간에서 접선은 곡선 아래에 있습니다.'}
- {id: MC-CAL-4703, name: 발산 판정에서 f(c_n)만 보고 수렴으로 착각, concepts: [CON-CAL-SEQ-DIVERGE], used_in: 'AJOU-M27-01#1-2', outcome_code: '73', wrong_work: '$e^{-n}\to0$이므로 $S_n\to0$', detect_cue: '$n^n$의 증가를 무시하고 지수 감소만 근거로 듦', feedback: '$f(c_n)=\left(\dfrac ne\right)^n$이므로 $n>e$이면 밑이 1보다 커 발산합니다.'}
- {id: MC-CAL-4704, name: a_n 단조성 없이 a_3만 계산, concepts: [CON-PRF-MONOTONE-SEQ], used_in: 'AJOU-M27-01#1-3', outcome_code: '74', wrong_work: '$a_3=3-\sqrt3\ge1$이므로 $n\ge3$에서 $a_n\ge1$', detect_cue: '$a_n$이 증가함을 보이는 근거가 없음', feedback: '$a_n=\left(\sqrt n-\tfrac12\right)^2-\tfrac14$로 증가함을 먼저 보여야 첫 항 비교로 결론낼 수 있습니다.'}
- {id: MC-CAL-4705, name: 접선 x절편 부호 오류, concepts: [CON-CAL-TANGENT-LINE], used_in: 'AJOU-M27-01#1-4', outcome_code: '71', wrong_work: '$d_n=a_n+\dfrac{f(a_n)}{f^{\prime}(a_n)}=n+1$', detect_cue: '$d_n>a_n$', feedback: '$0=f(a_n)+f^{\prime}(a_n)(x-a_n)$에서 $x=a_n-\dfrac{f(a_n)}{f^{\prime}(a_n)}$입니다.'}
- {id: MC-CAL-4706, name: f(a_n) 하한을 n에 의존하는 값으로 둠, concepts: [CON-CAL-SEQ-DIVERGE], used_in: 'AJOU-M27-01#1-5', outcome_code: '72', wrong_work: '$f(a_n)\to0$이라 $T_n$이 수렴한다고 판단', detect_cue: '(3)의 $a_n\ge1$과 증가성을 쓰지 않음', feedback: '$1\le a_n<c_n$이고 $f$가 $(0,c_n)$에서 증가하므로 $f(a_n)\ge f(1)=e^{-1}$입니다.'}
- {id: MC-STA-4707, name: 기록값을 -n~n의 모든 정수로 봄, concepts: [CON-STA-PARITY-SUM], used_in: 'AJOU-M27-01#2-1', outcome_code: '71', wrong_work: '$m=-n,-n+1,\cdots,n$ ($2n+1$개)', detect_cue: '$m$과 $n$의 홀짝이 다른 값 포함', feedback: '1이 $k$칸이면 $m=2k-n$이므로 $m$은 $n$과 홀짝이 같습니다.'}
- {id: MC-STA-4708, name: 판별식 조건 부등호 방향 오류, concepts: [CON-STA-BINOM-RATIO-LIMIT], used_in: 'AJOU-M27-01#2-2', outcome_code: '72', wrong_work: '$m^2-4n\ge0$으로 두고 가장 큰 $m=n$', detect_cue: '$p_n=1$', feedback: '중근 또는 허근이면 판별식 $m^2-4n\le0$, 즉 $\lvert m\rvert\le4l$입니다.'}
- {id: MC-STA-4709, name: 분수 곱 상하한을 같은 인수로 묶음, concepts: [CON-STA-BINOM-RATIO-LIMIT], used_in: 'AJOU-M27-01#2-2', outcome_code: '73', wrong_work: '$\dfrac{p_n}{q_n}=\left(1-\dfrac1l\right)^{2l}$이라 단정', detect_cue: '부등식 없이 등식으로 근사', feedback: '각 인수가 다르므로 가장 작은 인수와 가장 큰 인수의 $2l$제곱으로 위아래를 묶어야 합니다.'}
- {id: MC-ALG-4710, name: g(x)>k와 g(x)≤k 경계 처리 오류, concepts: [CON-ALG-LATTICE-LEVEL-COUNT], used_in: 'AJOU-M27-02#1-1', outcome_code: '71', wrong_work: '$k=g(x)$인 점을 $b_k$에 넣어 구간 경계를 $1\le k\le9$로 씀', detect_cue: '구간을 $(\,]$ 대신 $[\,)$ 반대로 나눔, 합이 174가 아님', feedback: '$g(x)\le k$이면 $c_k$입니다. $k=g(x)$에서 그 점은 $c_k$로 넘어갑니다.'}
- {id: MC-ALG-4711, name: 최대 조건을 g(20)>25로 둠, concepts: [CON-ALG-LATTICE-LEVEL-COUNT], used_in: 'AJOU-M27-02#1-2', outcome_code: '72', wrong_work: '$p>25$만으로 최대라 판단, $p=26$', detect_cue: '$k$가 30까지임을 놓침', feedback: '$1\le k\le30$ 모두에서 $b_k=21$이려면 $g(20)>30$이어야 합니다.'}
- {id: MC-ALG-4712, name: c_30≥11 조건을 구간 길이만으로 판단, concepts: [CON-ALG-LATTICE-LEVEL-COUNT], used_in: 'AJOU-M27-02#2-1', outcome_code: '73', wrong_work: '구간 길이 $2\sqrt{55}>14$이므로 모든 $p$에서 $a_{30}<0$', detect_cue: '$[0,20]$ 밖으로 나가는 경우를 고려하지 않음', feedback: '구간 $[p-\sqrt{55},p+\sqrt{55}]$이 $[0,20]$ 안에 정수점 11개 이상을 가지려면 $x=10$을 포함해야 합니다.'}
- {id: MC-CAL-4713, name: 덮개 개수를 39-max h로 셈, concepts: [CON-CAL-RIEMANN-SUM], used_in: 'AJOU-M27-02#2-2', outcome_code: '71', wrong_work: '각 칸에서 $39-\max(h(i),h(i+1))$', detect_cue: '답이 295보다 작음(이 방식이면 $216$)', feedback: 'S와 조금이라도 겹치면 색칠하므로 칸의 가장 낮은 높이 $\min h$까지 포함됩니다.'}
- {id: MC-CAL-4714, name: 리만 합 극한 적분 구간 오류, concepts: [CON-CAL-RIEMANN-SUM], used_in: 'AJOU-M27-02#2-3', outcome_code: '72', wrong_work: '$\int_{-5}^{11}(39-h)\,dx$', detect_cue: '제1사분면 제한을 무시', feedback: '덮개는 제1사분면의 정사각형만이므로 $x\ge0$, 적분 구간은 $[0,11]$입니다.'}
