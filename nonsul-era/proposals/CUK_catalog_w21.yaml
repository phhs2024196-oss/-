- id: MC-CAL-12101
  name: 이동 순서·부호를 거꾸로 적용
  concepts: 도형의 대칭이동; 평행이동
  used_in: CUK-G21A-01#1
  outcome_code: '71'
  wrong_work: 원점 대칭을 하지 않고 $y=ax^2+bx+2$를 $x\to x+1$, $y\to y-6$으로 이동하거나, 평행이동 방향의 부호를 반대로 적용해 $a=-1$ 등을 얻음
  detect_cue: $x$축 방향 $1$만큼 이동을 $x-1$이 아니라 $x+1$로 치환했다
  feedback: $x$축 방향으로 $p$만큼, $y$축 방향으로 $q$만큼 평행이동하면 $x\to x-p$, $y\to y-q$이다. 원점 대칭은 $(x,y)\to(-x,-y)$이다.
- id: MC-CAL-12102
  name: 공통접선을 한 포물선의 접선으로만 처리
  concepts: 접선의 방정식; 판별식
  used_in: CUK-G21A-01#2
  outcome_code: '71'
  wrong_work: $y=x^2+2x+2$의 접선만 구하고 $y=-x^2+4x-11$에도 접해야 한다는 조건을 쓰지 않아 $l_1$, $l_2$를 임의의 접점으로 정함
  detect_cue: 접점 $t$를 하나 정하는 식이 한 개뿐이고 판별식 $\frac D4=0$이 없다
  feedback: 접선이 두 곡선에 모두 접하려면 접선의 방정식과 두 번째 곡선의 연립방정식이 중근을 가져야 한다($\frac D4=0$).
- id: MC-CAL-12103
  name: 켤레복소수 조건 없이 허근을 임의로 설정
  concepts: 켤레복소수; 실계수 방정식의 허근
  used_in: CUK-G21A-02#1
  outcome_code: '71'
  wrong_work: $z=\alpha+\beta i$에서 $2z+9$와 $-z-\frac34i$가 서로 켤레라는 조건을 쓰지 않고 두 식이 같다고 놓음
  detect_cue: 실수 계수 삼차함수의 허근이 켤레쌍이라는 언급 없이 $\alpha$, $\beta$를 구했다
  feedback: 실계수 방정식의 서로 다른 두 허근은 서로 켤레이므로 $\overline{2z+9}=-z-\frac34i$로 $\alpha=-3$, $\beta=\frac34$를 구한다.
- id: MC-CAL-12104
  name: 합성함수의 최댓값을 정의역 끝점에서만 찾음
  concepts: 합성함수; 함수의 증가와 감소
  used_in: CUK-G21A-02#2
  outcome_code: '71'
  wrong_work: $g(x)$의 최댓값, 최솟값을 $x=1,2$에서의 $g(1)$, $g(2)$로만 비교해 $f(\frac32)=\frac{27}{4}$인 극대를 놓침
  detect_cue: $f'(x)=0$의 해 $x=\frac32$를 구간 $[1,2]$ 안에서 확인하지 않았다
  feedback: 먼저 $[1,2]$에서 $f$의 치역 $[\frac{25}{4},\frac{27}{4}]$를 구한 뒤, $h(t)=t+\frac{36}{t}$가 그 구간에서 증가함을 이용해 $M$, $m$을 구한다.
- id: MC-PRB-12105
  name: 짝수·홀수 가정을 나누지 않고 $a_5$를 홀수로만 처리
  concepts: 귀납적 정의; 경우 분류
  used_in: CUK-G21A-03#2
  outcome_code: '71'
  wrong_work: $a_5$가 홀수인 경우만 풀어 $a_1=11$을 얻고 $a_5$가 짝수인 경우를 배제하는 근거를 쓰지 않음
  detect_cue: $3a_5=26$ 또는 $4a_4+14=0$ 같은 모순 서술이 없다
  feedback: $a_5$가 짝수이면 $a_4$의 홀짝으로 나눠 각각 양의 정수해가 없음을 보여야 $A=\{11\}$이 유일하다는 근거가 된다.
- id: MC-PRB-12106
  name: '시합 종료 경로를 독립시행으로 처리'
  concepts: 조건부확률; 확률의 덧셈정리
  used_in: CUK-G21B-01
  outcome_code: '71'
  wrong_work: 매 게임 수아가 이길 확률을 $\frac35$로 고정해 $p=\sum(\frac35)^{2}\left(\frac25\cdot\frac35\right)^{n-1}$ 꼴로 계산
  detect_cue: 은우가 이긴 다음 게임의 확률 $\frac13$, $\frac23$을 쓰지 않았다
  feedback: 직전 게임의 승자에 따라 다음 게임의 승률이 달라지므로 ○×○×…○○ 경로마다 표의 확률을 차례로 곱해야 한다.
- id: MC-CAL-12107
  name: 조건부확률의 분모에 수아 승리만 사용
  concepts: 조건부확률
  used_in: CUK-G21B-01
  outcome_code: '71'
  wrong_work: $q$를 $\frac{9}{25}(\frac{2}{15})^{1009}$ 자체로 두거나 분모에 $2020$번째에 끝나는 은우의 승리 확률을 넣지 않음
  detect_cue: $q$가 $\frac{27}{47}$ 형태의 비가 아니다
  feedback: $q=\frac{P(\text{수아 승, }2020\text{번째 종료})}{P(2020\text{번째 종료})}$이므로 분모는 수아의 승리와 은우의 승리 확률의 합이다.
- id: MC-ALG-12108
  name: 극한 함수의 $x=1$ 값을 빠뜨리고 $x=\pm1$ 처리 누락
  concepts: 수열의 극한; 극한으로 정의된 함수
  used_in: CUK-G21B-02
  outcome_code: '71'
  wrong_work: $\lvert x\rvert<1$, $\lvert x\rvert>1$만 구하고 $x=1$에서 $f(1)=6$을 구하지 않거나 $x=-1$을 정의역에 포함시킴
  detect_cue: 그래프에 $(1,6)$ 점이 없고 접점의 범위를 $-1<t\le1$이 아닌 $\lvert t\rvert<1$ 등으로 씀
  feedback: $f$는 $x=\pm1$에서 불연속이다. $x=1$일 때 $f(1)=6$이고 $x=-1$은 정의되지 않으므로 접점은 $-1<x\le1$에서 찾는다.
- id: MC-CAL-12109
  name: 교점의 개수를 그래프 그림만으로 판단
  concepts: 무리함수; 교점의 개수
  used_in: CUK-G21B-02
  outcome_code: '71'
  wrong_work: $y=\sqrt{2b(x+a)}+\frac52$를 대략 그려 교점이 $3$개라고 서술하되 $x=\pm1$에서의 함숫값 범위를 부등식으로 확인하지 않음
  detect_cue: $4<\cdot<5$, $5<\cdot<6$ 같은 함숫값 평가가 없다
  feedback: $x=-1$, $x=1$에서 무리함수의 값이 각각 $f$의 극한값 $4$, $5$ 사이 또는 $5$, $6$ 사이에 있음을 $a=8-4b$로 평가해야 조각별 교점이 확정된다.
- id: MC-ALG-12110
  name: $k_1$을 임의의 값으로 놓고 약분 구조를 확인하지 않음
  concepts: 분수식의 변형; 약분
  used_in: CUK-G21B-03
  outcome_code: '71'
  wrong_work: 조건 $50<k_1<100$ 중 임의의 값을 대입하고 $\frac{A}{m_1}$이 $n$에 대한 간단한 분수가 되는지 검증하지 않음
  detect_cue: 양변에 $2^n+k_1$을 곱해 정리하는 과정 없이 값만 제시했다
  feedback: $k_1=60$일 때 $(2^n+60)\left(1+\frac{63}{2^n-2}\right)=\frac{2^n+60}{2^n-2}(2^n+61)$이 되어 $\frac{A}{m_1}=\frac{31}{2^{n-1}-1}$로 약분됨을 보여야 한다.
- id: MC-CAL-12111
  name: $a_n$을 구하지 않고 배각 공식 적용
  concepts: 치환적분; 삼각함수의 배각 공식
  used_in: CUK-G21B-04
  outcome_code: '71'
  wrong_work: $f(x)=\tan^2x+1$을 $\sec^2x$로 정리하지 않고 $a_n$에 바로 급수를 취해 부분합을 소거하지 못함
  detect_cue: $\frac{1}{4^n\cos^2\frac{\pi}{2^{n+2}}}$ 꼴의 일반항이 없다
  feedback: $f(x)=\frac{1}{\cos^2x}$이므로 $a_n=\frac{1}{4^n\cos^2\frac{\pi}{2^{n+2}}}$이고 $\frac{1}{4^{n-1}\sin^2\frac{\pi}{2^{n+1}}}-\frac{1}{4^n\sin^2\frac{\pi}{2^{n+2}}}=a_n$으로 소거한다.
- id: MC-CAL-12112
  name: 극한 $\frac{1}{4^n\sin^2}$을 $0$으로 처리
  concepts: 삼각함수의 극한; 급수의 합
  used_in: CUK-G21B-04
  outcome_code: '71'
  wrong_work: $\lim 4^n\sin^2\frac{\pi}{2^{n+2}}$의 거동을 보지 않고 $\sin\to0$이므로 마지막 항이 $\infty$ 또는 $0$이라 하여 $S=2$로 답함
  detect_cue: $\lim_{x\to0}\frac{\sin x}{x}=1$을 쓰지 않고 $S=2$ 또는 발산이라고 결론지었다
  feedback: $4^n\sin^2\frac{\pi}{2^{n+2}}=\frac{\pi^2}{16}\left(\frac{\sin x}{x}\right)^2$ ($x=\frac{\pi}{2^{n+2}}$)로 $\frac{\pi^2}{16}$에 수렴하므로 $S=2-\frac{16}{\pi^2}$이다.
