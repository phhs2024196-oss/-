- id: MC-ALG-12301
  name: 켤레복소수 조건에서 허수부 부호 처리 실수
  concepts: 켤레복소수; 복소수 상등
  used_in: CUK-G23A-01#1
  outcome_code: '71'
  wrong_work: $\overline{3z-1}=3\alpha-1+3\beta i$로 써서 $\beta$를 구하지 못하거나 $\beta=-\frac53$ 등 잘못된 값을 얻음
  detect_cue: $\overline{3z-1}$의 허수부를 $+3\beta$로 씀
  feedback: $\overline{3z-1}=3\alpha-1-3\beta i$이므로 허수부 $-3\beta=2\beta-\frac53$에서 $\beta=\frac13$이다.
- id: MC-ALG-12302
  name: 허근을 방정식에 대입할 때 이차 인수만 확인
  concepts: 인수분해; 허근
  used_in: CUK-G23A-01#1
  outcome_code: '71'
  wrong_work: $f(x)=(x-2)(\cdots)$에서 $x=2$를 허근으로 착각하거나 $2x^2-2kx+k^2-6$에 $2+i$를 대입하지 않고 $k$를 구함
  detect_cue: 허근 $2+i$를 이차 인수가 아닌 곳에 대입
  feedback: $2+i$는 실근 $x=2$가 아닌 이차 인수 $2x^2-2kx+k^2-6$의 근이므로 그 인수에 대입한다.
- id: MC-ALG-12303
  name: 절댓값 부등식에서 f'(x) 부호 확인 누락
  concepts: 절댓값 부등식; 도함수의 부호
  used_in: CUK-G23A-01#2
  outcome_code: '71'
  wrong_work: $|f'(x)|=f'(x)$임을 보이지 않고 $-\frac{f'(x)}2\le\cdots\le\frac{f'(x)}2$로 바로 풂
  detect_cue: $f'(x)>0$이라는 문장이 없다
  feedback: $f'(x)=6(x-2)^2+2>0$임을 보인 뒤 $|f'(x)|=f'(x)$로 놓는다.
- id: MC-ALG-12304
  name: 이차부등식 항상 성립 조건에서 a=3 또는 a=-3 경우 누락
  concepts: 이차부등식; 경우 분류
  used_in: CUK-G23A-01#2
  outcome_code: '71'
  wrong_work: 최고차항 계수가 $0$인 경우를 보지 않고 판별식 조건만으로 $S=\varnothing$ 또는 $a=3$을 놓침
  detect_cue: $a=3$일 때 $(3-a)x^2-2(3-a)x+2=2$인 경우를 검토하지 않았다
  feedback: 최고차항 계수가 $0$이 되는 $a=3$, $a=-3$을 따로 검토하고, 나머지는 계수>0과 판별식 $\le0$으로 판정한다.
- id: MC-CAL-12305
  name: 우함수 판정 후 g(x)의 홀수차항 제거 누락
  concepts: 정적분과 미분; 대칭
  used_in: CUK-G23A-02#1
  outcome_code: '71'
  wrong_work: $f(5+t)=f(5-t)$를 얻고도 $g(x)=f(x+5)$의 $x^3$, $x$ 항을 남겨 $f$를 결정하지 못함
  detect_cue: $c_3=c_1=0$을 보이지 않았다
  feedback: $g(t)=g(-t)$이므로 홀수차항 계수가 모두 $0$이다.
- id: MC-CAL-12306
  name: 평행이동 방향 혼동
  concepts: 그래프의 평행이동; 극값
  used_in: CUK-G23A-02#1
  outcome_code: '71'
  wrong_work: $g(x)=f(x+5)$를 $x$축 방향 $+5$ 평행이동으로 보아 $g(5)=0$, $g'(-5)=0$으로 둠
  detect_cue: $g(-5)=0$, $g'(5)=0$이 아닌 조건을 사용
  feedback: $g(x)=f(x+5)$는 $f$를 $-5$만큼 이동한 것이므로 $f(0)=0$에서 $g(-5)=0$, $f'(10)=0$에서 $g'(5)=0$이다.
- id: MC-GEO-12307
  name: 세 점이 한 직선 위에 있는 경우 제외 누락
  concepts: 원의 접선; 삼각형의 성립 조건
  used_in: CUK-G23A-03#2
  outcome_code: '71'
  wrong_work: $-3\le c\le3$에서 $c=-\frac95$를 제외하지 않았거나, $|5c+9|$의 최댓값 후보를 $c=-3$으로 착각
  detect_cue: 제외 조건 $c\ne-\frac95$ 언급이 없다
  feedback: $c=-\frac95$이면 $A,P,Q$가 한 직선 위에 있으므로 제외하고, $|5c+9|$의 최댓값은 $c=3$에서 $24$이다.
- id: MC-GEO-12308
  name: 현 PQ의 중점에서 OR 길이 도출 오류
  concepts: 현의 수직이등분선; 피타고라스 정리
  used_in: CUK-G23A-03#2
  outcome_code: '71'
  wrong_work: $\overline{OR}^2+\overline{RP}^2=18$ 대신 $\overline{OR}=\sqrt{18}$ 또는 $6$으로 계산하여 직선 $PQ$를 $x^2+y^2=18$의 접선으로 오인
  detect_cue: $\overline{OR}=3$이 나오지 않았다
  feedback: 현 $PQ=6$이므로 $\overline{RP}=3$, $\overline{OR}=\sqrt{18-9}=3$이다.
- id: MC-ALG-12310
  name: 로그 진수 조건에서 k=11 경우 누락
  concepts: 로그의 정의; 이차부등식
  used_in: CUK-G23B-01#1
  outcome_code: '71'
  wrong_work: 판별식 조건만으로 $3<k<11$로 두어 $A=\{k\mid10<k<11\}$로 구함
  detect_cue: $k=11$일 때 진수 $2>0$ 확인이 없다
  feedback: $k=11$이면 이차항이 사라져 진수가 상수 $2>0$이므로 포함되어 $A=\{k\mid10<k\le11\}$이다.
- id: MC-ALG-12311
  name: 밑 조건에서 k≠12 확인 누락 또는 과다 제외
  concepts: 로그의 밑 조건
  used_in: CUK-G23B-01#1
  outcome_code: '71'
  wrong_work: 밑 $\frac12k-5\ne1$을 반영하지 않거나 $k>10$ 범위 밖의 $k=12$를 별도로 제외해 혼동
  detect_cue: 밑 조건(양수, 1이 아님)을 두 개 모두 쓰지 않았다
  feedback: 밑은 $\frac12k-5>0$이고 $\ne1$이므로 $k>10$, $k\ne12$이며, 진수 조건의 $3<k\le11$과 겹쳐 $10<k\le11$이다.
- id: MC-PRB-12312
  name: 짝수 n제곱근의 실수 존재 조건 오류
  concepts: n제곱근; 경우 분류
  used_in: CUK-G23B-01#1
  outcome_code: '71'
  wrong_work: $n$이 짝수일 때 $m<0$인 순서쌍(예 $(-5,2)$)이나 $m=0$을 잘못 포함 또는 제외하여 개수가 $8$이 아님
  detect_cue: $(-5,2)$, $(-3,8)$, $(-1,10)$을 $C$에 포함
  feedback: $n$이 짝수이면 $m>0$일 때만 실수 $n$제곱근이 있고, $n$이 홀수이거나 $m=0$이면 항상 있다.
- id: MC-PRB-12313
  name: 집합 B의 원소를 m의 범위에서 일부만 나열
  concepts: 집합의 원소 나열; 부등식의 정수해
  used_in: CUK-G23B-01#1
  outcome_code: '71'
  wrong_work: $m=\pm1,\dots,\pm5$에서 한쪽 부호만 세거나 $m=0$의 $n=11$ 누락
  detect_cue: $B$의 원소 수가 $11$이 아님
  feedback: $10-\frac13m^2<n\le11-\frac13m^2$의 정수 $n>1$을 $m=0,\pm1,\dots,\pm5$마다 구하면 $B$는 $11$개이다.
- id: MC-GEO-12314
  name: 공통접선의 조건식에서 절댓값 부호 경우 누락
  concepts: 점과 직선 사이의 거리; 공통접선
  used_in: CUK-G23B-02#1
  outcome_code: '71'
  wrong_work: $2|a+b|=|-2a+b+3|$에서 두 부호 경우 중 하나만 풀어 접선 두 개만 구해 $l$, $m$을 잘못 정함
  detect_cue: 공통접선이 $4$개가 아니다
  feedback: 부호 두 경우로 나누면 $a=\frac{45\pm\sqrt{89}}{44}$와 $a=2,\frac12$의 접선 $4$개가 나오고 그중 기울기 최대·최소가 $l$, $m$이다.
- id: MC-GEO-12315
  name: 사인법칙의 외접원 반지름 혼동
  concepts: 사인법칙; 현의 길이
  used_in: CUK-G23B-02#1
  outcome_code: '71'
  wrong_work: $\sin\angle P_1A_1Q_1=\frac{\overline{P_1Q_1}}{r}$로 놓아 $f(t)$, $g(t)$에 $2$배가 어긋남
  detect_cue: $f(t)=\sqrt{t-t^2}$ 또는 $g(t)=\sqrt{4t-t^2}$ 형태가 나옴
  feedback: $\frac{\overline{PQ}}{\sin\angle PAQ}=2r$이므로 $\sin\angle=\frac{\overline{PQ}}{2r}$이며 $C_1$은 $r=\frac1{\sqrt5}$, $C_2$는 $r=\frac2{\sqrt5}$이다.
- id: MC-CAL-12316
  name: 최댓값 위치에서 정의역 밖 근 선택
  concepts: 도함수; 극값; 정의역
  used_in: CUK-G23B-02#1
  outcome_code: '71'
  wrong_work: $8t-15t^2+4t^3=0$의 근 $\frac{15\pm\sqrt{97}}8$ 중 $\frac{15+\sqrt{97}}8>1$을 택하거나 $t=0$을 최댓값 위치로 답함
  detect_cue: $M=\frac{15+\sqrt{97}}8$
  feedback: 정의역이 $(0,1)$이므로 $\frac{15-\sqrt{97}}8$만 해당하고 증감표로 최댓값임을 확인한다.
- id: MC-CAL-12317
  name: 부분적분 후 두 적분이 상쇄됨을 놓침
  concepts: 부분적분법
  used_in: CUK-G23B-03#1
  outcome_code: '71'
  wrong_work: $f(t)$를 정의 그대로 계산하려다 닫힌 꼴을 얻지 못하고 $s$를 수치로 근사
  detect_cue: $\int_0^t\frac{1}{(1+x^4)^{1/4}}dx$를 직접 적분하려 함
  feedback: $F=x$, $G=(1+x^4)^{-1/4}$로 부분적분하면 $\frac{x^4}{(1+x^4)^{5/4}}$ 항이 생겨 정의식의 둘째 항과 상쇄되어 $f(t)=\frac{t}{(1+t^4)^{1/4}}$이다.
- id: MC-CAL-12318
  name: 치환적분에서 적분 구간 변환 오류
  concepts: 치환적분법; 정적분
  used_in: CUK-G23B-03#1
  outcome_code: '71'
  wrong_work: $u=1+t^4$ 치환 후 구간을 $0\to1$로 그대로 두어 $\left[u^{3/4}\right]_0^1$로 계산
  detect_cue: $s=2^{3/4}$가 아닌 값
  feedback: $t=0\to1$이면 $u=1\to2$이고 $3t^3dt=\frac34du$이므로 $\frac34\int_1^2u^{-1/4}du=2^{3/4}-1$이다.
- id: MC-CAL-12319
  name: 이동 거리에 속도의 부호 확인 누락
  concepts: 속도와 움직인 거리
  used_in: CUK-G23B-03#1
  outcome_code: '71'
  wrong_work: $s=\int_0^1|v(t)|dt$에서 $f(t)\ge0$임을 보이지 않고 위치 변화로만 계산
  detect_cue: $f(t)\ge0$ 언급이 없다
  feedback: $f(t)=\frac{t}{(1+t^4)^{1/4}}\ge0$이므로 $v(t)\ge0$이고 거리는 $\int_0^1v(t)dt$이다.
- id: MC-ALG-12320
  name: 조건 (다)를 증가 후 감소 형태로 해석하지 못함
  concepts: 로그; 수열의 정의; 최댓값
  used_in: CUK-G23B-04#1
  outcome_code: '71'
  wrong_work: $\frac1k\ln\frac kx$의 최댓값이 $k=n$이라는 것에서 $k=n$ 한 점만 비교하여 $a_n=n^n/(n+1)^{n-1}$ 등 틀린 경계를 얻음
  detect_cue: 인접 항의 차(식 (*))를 쓰지 않았다
  feedback: $\frac1k\ln\frac kx-\frac1{k+1}\ln\frac{k+1}x=\frac1{k(k+1)}\ln\frac{k^{k+1}}{(k+1)^kx}$로 부호 변화 지점이 $x=\frac{k^{k+1}}{(k+1)^k}$임을 이용한다.
- id: MC-ALG-12321
  name: a_n과 a_{n+1}의 경계 대응 어긋남
  concepts: 수열의 정의; 부등식
  used_in: CUK-G23B-04#1
  outcome_code: '71'
  wrong_work: $a_n<x\le a_{n+1}$에서 $k=n$이 최대일 조건을 $k=n$과 $k=n+1$ 비교만으로 얻어 하한($k=n-1$ 비교)을 빠뜨림
  detect_cue: $k=n-1$을 대입하지 않았다
  feedback: 상한은 $k=n$ vs $k=n+1$에서 $x\le\frac{n^{n+1}}{(n+1)^n}$, 하한은 $k=n-1$ vs $k=n$에서 $x>\frac{(n-1)^n}{n^{n-1}}$이다.
- id: MC-CAL-12322
  name: 망원급수의 항 정리 실수
  concepts: 급수의 합; 망원급수
  used_in: CUK-G23B-04#1
  outcome_code: '71'
  wrong_work: $\left(\frac{a_{n+1}}n\right)^{1/n}=\frac{n}{n+1}$, $\left(\frac{a_n}n\right)^{1/n}=\frac{n-1}n$인데 $\frac{n+1}n-\frac{n-1}{n-1}$ 등으로 정리해 합을 틀림
  detect_cue: $\frac1n-\frac1{n+1}$ 꼴이 나오지 않음
  feedback: 항은 $\frac n{n+1}-\frac{n-1}n=\frac1n-\frac1{n+1}$이므로 부분합 $1-\frac1{N+1}\to1$이다.
