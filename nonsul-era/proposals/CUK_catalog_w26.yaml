# w26 오개념 후보 (CUK 2026 실전) — 공용 카탈로그 미수정, 병합은 사람이
- {id: MC-CAL-12601, name: 접점을 두 번 근으로 보지 않고 삼중근 경우를 버리지 않음, concepts: [삼차방정식의 근, 접선], used_in: 'CUK-G26A-01#2', outcome_code: '71', wrong_work: '$p=2$일 때 $f(x)-h(x)=(x-2)^3$으로 실근이 1개뿐인데도 $m=-12$를 답에 포함', detect_cue: '답이 $m=-12$ 또는 두 값', feedback: '삼중근이면 서로 다른 실근이 1개뿐이므로 조건에 모순입니다. 접점 후보마다 근의 개수를 확인하세요.'}
- {id: MC-CAL-12602, name: 우극한을 구간 구분 없이 g(x)로 놓음, concepts: [우극한, 구간별 함수], used_in: 'CUK-G26A-02#1', outcome_code: '71', wrong_work: '$\lim_{t\to0+}g(x+t)=g(x)$로 두고 $h(x)=g(x)g(x+3)$에서 경계점 극한을 구하지 않음', detect_cue: 경계 $x=-3,0,3$에서 좌·우극한 비교가 없다, feedback: '$x$가 경계일 때 우극한이 어느 식에서 오는지 구간별로 구하세요.'}
- {id: MC-CAL-12603, name: 치환적분에서 적분구간을 바꾸지 않음, concepts: [치환적분], used_in: 'CUK-G26A-02#2', outcome_code: '72', wrong_work: '$\int_{-3}^03xf(x+3)dx$에서 $t=x+3$으로 두고 구간을 $[-3,0]$ 그대로 둠', detect_cue: '치환 후 구간이 [-3,0] 그대로', feedback: '$x=-3\to t=0$, $x=0\to t=3$이므로 구간은 $[0,3]$입니다.'}
- {id: MC-GEO-12604, name: 이등변삼각형 경우에서 가장 짧은 변을 잘못 지정, concepts: [삼각형의 변과 각의 대소, 사인법칙], used_in: 'CUK-G26A-03#2', outcome_code: '71', wrong_work: '$\frac{S_1}{S_2}<1$이면서 $B=C$인 경우에도 $\overline{BC}=3$으로 둠', detect_cue: '$B<A$인데 BC를 최단변으로 사용', feedback: '$B=C<A$이면 가장 짧은 변은 $AB=AC$이고, $\overline{BC}=2\overline{AB}\cos B$입니다.'}
- {id: MC-GEO-12605, name: 조건 (나)에서 B+C=pi/2 외의 경우(2B=2pi-2C)를 빠뜨리거나 포함, concepts: [삼각함수의 성질], used_in: 'CUK-G26A-03#1', outcome_code: '72', wrong_work: '$2B=2\pi-2C$를 가능하다고 보거나 $B=C$만 고려', detect_cue: '직각삼각형 경우가 빠짐', feedback: '$A+B+C=\pi$이므로 $2B=2\pi-2C$는 불가능하고 $B+C=\frac\pi2$ 또는 $B=C$입니다.'}
- {id: MC-ALG-12606, name: 부호가 바뀌는 항의 증감 경우를 나누지 않고 K와 d2 범위를 정함, concepts: [등차수열, 경우 분류], used_in: 'CUK-G26B-01#1', outcome_code: '71', wrong_work: '$K\le8$ 또는 $d_2<0$인 경우를 배제하는 근거 없이 $d_1=-5$, $d_2>0$으로 가정', detect_cue: '증감 4가지 경우 분석이 없다', feedback: '$d_2,d_3$의 부호에 따른 증감 구조로 부호 변화가 두 번 가능한지 확인하세요.'}
- {id: MC-CAL-12607, name: b>=0 경우를 빠뜨림, concepts: [구간 최댓값 함수, 미분가능성], used_in: 'CUK-G26B-02#1', outcome_code: '71', wrong_work: '$b<0$만 가정하고 $b\ge0$에서 $c=\frac12$인 경우의 (ㄷ) 불만족을 확인하지 않음', detect_cue: 'b 부호 분류 없음', feedback: '$b$의 부호에 따라 $g(t)$의 꺾이는 점이 달라지므로 두 경우를 모두 조사해야 합니다.'}
- {id: MC-CAL-12608, name: g(t)의 최댓값 전환점을 극값 비교 없이 가정, concepts: [구간 최대·최소], used_in: 'CUK-G26B-03#1', outcome_code: '71', wrong_work: '$[x,4\pi]$에서 최댓값을 항상 $2\pi$로 두어 $h(x)=3\pi$', detect_cue: '$h(x)$가 상수 하나', feedback: '$g(4\pi-\frac{3\pi}{2k})=1>g(4\pi)=0$이므로 $x\ge4\pi-\frac{2\pi}{k}$에서는 최댓값이 $g(x)$입니다.'}
- {id: MC-PRB-12609, name: 최소가 겹치는 경우를 중복해서 세거나 빠뜨림, concepts: [경우의 수, 확률분포], used_in: 'CUK-G26B-04#1', outcome_code: '71', wrong_work: '$X=k$인 경우의 수를 $3(n-3k+2)$ 등으로 중복 계산', detect_cue: '3(n-3k+1)이 아님', feedback: '$i=k$는 $n-3k+2$개, $j=n-k+1$은 $i=k$ 중복 1개를 빼 $n-3k+1$개, $j-i=k$는 양끝 중복 2개를 빼 $n-3k$개입니다.'}
