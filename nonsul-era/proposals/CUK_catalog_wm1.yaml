# 가톨릭대 모의논술 오개념 후보 (wm1) — 2027→12751~, 2026→12651~, 2025→12551~
- {id: MC-CAL-12751, name: '극값 구간 밖 포함/끝값 누락', concepts: [닫힌구간의 최대·최소], used_in: 'CUK-M27A-01#2', outcome_code: '71', wrong_work: '극댓값 $f(\beta)$만 보고 최솟값을 $f(0)=-4$ 등 구간 밖 극솟값으로 답함', detect_cue: '$m=-4$ 또는 $m=f(0)$', feedback: '극솟값 $x=0$은 구간 $[1,2026]$ 밖입니다. 구간의 끝값 $f(1)$, $f(2026)$과 구간 안의 극값을 비교하세요.'}
- {id: MC-CAL-12752, name: '근과 계수 대신 근을 직접 대입해 계산 실수', concepts: [이차방정식의 근과 계수의 관계], used_in: 'CUK-M27A-01#1', outcome_code: '72', wrong_work: '$\alpha=1-\sqrt7$, $\beta=1+\sqrt7$를 $f(\alpha)f(\beta)$에 직접 대입하다 무리식 계산이 틀리거나 $e^{\alpha}e^{\beta}$를 $e^{\alpha\beta}$로 처리', detect_cue: '분모가 $e^{-6}$', feedback: '$e^{\alpha}e^{\beta}=e^{\alpha+\beta}=e^2$입니다. $\alpha+\beta=2$, $\alpha\beta=-6$을 이용해 대칭식으로 바꾸세요.'}
- {id: MC-ALG-12753, name: '합성함수 방정식에서 중근/무근 경우 미검토', concepts: [합성함수, 이차함수의 대칭축], used_in: 'CUK-M27A-02#1', outcome_code: '71', wrong_work: '$f(t)=4$의 두 근 $t_1<t_2$에 대해 $f(x)=t_1$과 $f(x)=t_2$ 모두 실근을 가진다고 보아 실근 4개로 계산', detect_cue: '$f(f(x))=4$의 실근을 4개로 셈', feedback: '이차항의 계수가 양수이면 $f(x)=t_1$($t_1$이 최솟값보다 작을 때)은 실근이 없습니다. 근의 개수 2개 조건과 맞춰 보세요.'}
- {id: MC-ALG-12754, name: '$2^x>0$ 조건 누락', concepts: [지수함수의 치역, 이차방정식의 근의 부호], used_in: 'CUK-M27A-02#2', outcome_code: '71', wrong_work: '$g(2^x)=2$의 실근이 1개라는 조건을 $g(t)=2$가 중근이라는 뜻으로 해석', detect_cue: '$g(t)=2$의 판별식=0 으로 $a$를 결정', feedback: '$t=2^x>0$이므로 $g(t)=2$의 두 근 중 양근이 정확히 하나여야 합니다(다른 근은 0 이하).'}
- {id: MC-GEO-12755, name: '이등변삼각형이 되는 이유 누락(sin A 분해)', concepts: [사인법칙, 코사인법칙], used_in: 'CUK-M27A-03#1', outcome_code: '71', wrong_work: '$\sin A=2\sin B\cos C$에서 바로 $B=C$ 또는 $A=B$라고 단정', detect_cue: '근거 없이 이등변삼각형이라고 서술', feedback: '사인법칙으로 $\sin A=\frac{a}{2R}$ 등으로 바꾸고 코사인법칙을 대입하면 $b=c$를 증명할 수 있습니다.'}
- {id: MC-GEO-12756, name: '$\mathrm{DM}$ 두 경우 중 하나만 답함', concepts: [직각삼각형의 닮음, 이차방정식], used_in: 'CUK-M27A-03#2', outcome_code: '72', wrong_work: '$x^2-25x+144=0$의 두 근 9, 16 중 하나만 택해 $l=15$ 또는 $20$ 한 개만 답함', detect_cue: '$l$의 값이 하나뿐', feedback: 'A가 BC의 중심 쪽/반대쪽 어디에 있느냐에 따라 $\mathrm{DM}=9$ 또는 $16$ 모두 가능합니다. 값을 모두 구하세요.'}
- {id: MC-CAL-12651, name: '역함수 대칭 조건 해석 오류', concepts: [역함수, 로그·지수함수], used_in: 'CUK-M26A-01#1', outcome_code: '71', wrong_work: '$\mathrm{A}(a,b)$, $\mathrm{B}(b,a)$ 조건을 $f(x)=g(x)$의 교점으로 풀어 $\ln\frac{x+3}{4}=e^{2x}$를 세움', detect_cue: '방정식 $f(x)=g(x)$ 사용', feedback: '$\mathrm{B}(b,a)$는 $y=f^{-1}(x)=4e^x-3$ 위의 점이므로 $e^{2x}=4e^x-3$을 풀어야 합니다.'}
- {id: MC-CAL-12652, name: '넓이 적분에서 위아래 함수 순서/구간 오류', concepts: [정적분과 넓이], used_in: 'CUK-M26A-01#2', outcome_code: '72', wrong_work: '$\int_0^{\ln3}(e^{2x}-h(x))dx$ 로 계산해 부호가 반대($4-5\ln3$)', detect_cue: '$S<0$', feedback: '$[0,\ln3]$에서 $h(x)\ge g(x)$이므로 위쪽 함수 $h$에서 아래쪽 $g$를 빼야 합니다.'}
- {id: MC-CAL-12653, name: '접선이 지나는 점에서 접점 대신 접선 개수를 세는 오류', concepts: [접선의 방정식, 방정식의 실근], used_in: 'CUK-M26A-02#1', outcome_code: '71', wrong_work: '$f''(b)$ 조건 없이 $f(b)=a$ 의 해 개수로 $K$의 원소 수를 셈', detect_cue: '접점 방정식 $2p^3-9p^2+16+a=0$을 세우지 않음', feedback: '접점 $(p,f(p))$에서의 접선이 $(0,a)$를 지나므로 $pf''(p)-f(p)+a=0$을 세워 실근의 개수를 보세요.'}
- {id: MC-CAL-12654, name: '삼차방정식 실근 1개 조건을 극값 하나만 확인', concepts: [삼차함수의 극값, 실근의 개수], used_in: 'CUK-M26A-02#1', outcome_code: '72', wrong_work: '극댓값 $<0$ 만 쓰거나 $0<a<$ 등으로 범위를 구함(극솟값$>0$ 경우 누락)', detect_cue: '$a>11$ 또는 $a<-16$ 중 한쪽만 답함', feedback: '실근이 하나이려면 (극댓값 $<0$) 또는 (극솟값 $>0$) 두 경우 모두 확인해야 합니다.'}
- {id: MC-ALG-12655, name: '모든 n에서 성립하는 등식을 특정 n으로만 풀기', concepts: [항등식, 점화식], used_in: 'CUK-M26A-03#1', outcome_code: '71', wrong_work: '$n=3,4$ 두 값만 대입해 $a,b$를 구하고 모든 $n\ge3$에서 성립함을 확인하지 않음', detect_cue: '일반 $n$에 대한 정리 없이 연립방정식만 풂', feedback: '$(3-a)n!(n+1)!=(a+b)a_n$을 모든 $n\ge3$에서 성립시켜야 하므로 $a\ne3$이면 불가능함을 부등식으로 보이세요.'}
- {id: MC-ALG-12656, name: '부분분수 합에서 남는 항 계산 오류', concepts: [부분분수, 급수의 합], used_in: 'CUK-M26A-03#2', outcome_code: '72', wrong_work: '$\sum_{n=3}^{25}(\frac1{n+2}-\frac1{n+1})$에서 첫 항·끝 항을 $\frac1{27}-\frac15$ 등으로 잘못 남김', detect_cue: '$A\ne-\frac{23}{108}$', feedback: '소거 후 남는 것은 마지막 $\frac1{27}$과 처음 $-\frac1{4}$입니다.'}
- {id: MC-CAL-12551, name: '미분가능 조건에서 연속 조건만 사용', concepts: [연속, 미분가능성], used_in: 'CUK-M25A-01#2', outcome_code: '71', wrong_work: '연속 조건만 쓰고 $f''(b)=k$를 세우지 않아 $k$와 $b$의 관계를 구하지 못함', detect_cue: '$k=3(b+2)^2-9$ 가 나타나지 않음', feedback: '$x=b$에서 미분가능이면 좌미분계수 $3b^2+12b+3$과 우미분계수 $k$가 같아야 합니다.'}
- {id: MC-CAL-12552, name: '$k$ 값마다 $b$의 개수를 일괄 2개로 셈', concepts: [이차방정식의 실근 개수, 경우의 수], used_in: 'CUK-M25A-01#2', outcome_code: '72', wrong_work: '$k=-1,\dots,-9$ 모두 $b$가 2개라 보고 $18$ 또는 $k=-9$의 중근을 빠뜨림', detect_cue: '함수의 개수 18', feedback: '$k=-9$이면 $3(b+2)^2=0$으로 $b=-2$ 하나뿐입니다.'}
- {id: MC-CAL-12553, name: '두 도형 넓이가 같다는 조건을 각 도형 넓이 따로 계산 후 비교 실패', concepts: [정적분과 넓이], used_in: 'CUK-M25A-02#1', outcome_code: '71', wrong_work: '교점 위치를 확인하지 않고 B의 넓이를 $\int_3^a$ 등 잘못된 구간으로 설정', detect_cue: '적분 구간 시작점이 3 또는 0', feedback: '교점의 $x$좌표 $\sqrt[3]{256/25}<3<a$를 먼저 구하고 $\int_0^a(x\sqrt x-\frac{16}5)dx=0$으로 나타내세요.'}
- {id: MC-CAL-12554, name: '둘레 합에서 겹치는 선분 이중 계산', concepts: [곡선의 길이, 둘레], used_in: 'CUK-M25A-02#1', outcome_code: '72', wrong_work: '두 도형의 둘레를 각각 구해 더하면서 경계가 겹치는 $y=\frac{16}5$ 선분을 상쇄하지 않고 $l$에 포함', detect_cue: '$l$ 에 $2x_0$ 같은 항이 남음', feedback: '두 도형이 공유하지 않는 경계만 합 $l$에 들어갑니다: 곡선의 길이와 $m+m\sqrt m$.'}
- {id: MC-PRB-12555, name: '겹침 개수 범위를 0부터 센다', concepts: [조합, 경우의 수], used_in: 'CUK-M25A-03#1', outcome_code: '71', wrong_work: '6개를 모두 겹치지 않게 고를 수 있다고 보아 $k=0,\dots,5$로 두고 네 번째로 큰 값을 $6\pi-3b$로 계산', detect_cue: '$a=6\pi-3b$', feedback: '10개 중 6개이면 비어 있는 이웃이 부족해 겹침 쌍이 최소 1개 생깁니다. $k=1,\dots,5$입니다.'}
- {id: MC-PRB-12556, name: '그룹 위치를 세지 않고 크기 조합만 셈', concepts: [조합], used_in: 'CUK-M25A-03#2', outcome_code: '72', wrong_work: '크기 조합 5가지만 세고 위치 선택 $\binom52$를 곱하지 않아 5 또는 답 오류', detect_cue: '경우의 수 5', feedback: '그룹 크기가 정해져도 두 그룹의 시작 위치를 $\binom52=10$가지로 고를 수 있습니다.'}
