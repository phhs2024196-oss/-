# 가톨릭대 모의논술 오개념 후보 (wm2)
- id: MC-GEO-12451
  name: 넓이 3배 조건을 변의 길이 3배로 오해
  concepts: [삼각형의 넓이, 원에 내접하는 삼각형]
  used_in: CUK-M24A-01#1
  outcome_code: '71'
  wrong_work: 삼각형 $\mathrm{ACD}$의 넓이가 $\mathrm{AOC}$의 $3$배라는 조건을 $\overline{AD}$ 또는 $\overline{CD}$가 $3$배라는 뜻으로 읽어 $L$을 잘못 구함
  detect_cue: 높이 $3$ 대신 변의 길이를 쓰거나 $L$이 $2\sqrt3$의 정수배로만 나옴
  feedback: 공통 밑변 $\overline{AC}$에서 넓이가 3배이면 높이가 3배입니다. $\overline{OH}=1$이므로 점 $\mathrm D$의 높이는 $3$입니다.
- id: MC-GEO-12452
  name: $\sin B=\dfrac{\sqrt3}{2}$에서 $B$를 하나로만 정하거나 $\overline{AC}$ 계산에 실수
  concepts: [사인법칙]
  used_in: CUK-M24A-01#1
  outcome_code: '72'
  wrong_work: $B=60^\circ$만 가정해 풀거나 $\overline{AC}=2R\sin B$ 대신 $R\sin B$로 계산
  detect_cue: $\overline{AC}=\sqrt3$ 또는 $B=120^\circ$를 배제
  feedback: 사인법칙은 $\dfrac{\overline{AC}}{\sin B}=2R$입니다. $B=60^\circ$, $120^\circ$ 모두 $\overline{AC}=2\sqrt3$입니다.
- id: MC-CAL-12453
  name: $h(x)=x(x-\alpha)^2$ 경우를 빠뜨림
  concepts: [삼차함수의 인수분해, 극값]
  used_in: CUK-M24A-02#1
  outcome_code: '71'
  wrong_work: $f(x)-x$의 실근이 $2$개인 경우를 $x^2(x-\alpha)$ 꼴만으로 두고 $f(x)=x^3-\dfrac32x^2+x$를 답으로 냄
  detect_cue: 극값 조건(다)을 검사하지 않음
  feedback: 서로 다른 두 실근이면 중근이 $0$인 꼴과 $\alpha$인 꼴 두 가지입니다. 조건 (다)(극값을 가짐)로 하나만 남습니다.
- id: MC-CAL-12454
  name: 극값을 갖지 않을 조건을 $f'(x)=0$의 중근으로만 판단
  concepts: [도함수, 판별식]
  used_in: CUK-M24A-02#1
  outcome_code: '72'
  wrong_work: $f'(x)$의 판별식이 $0$ 이하인 경우를 구별하지 않고 $\alpha=1$도 극값을 가진다고 처리
  detect_cue: $\alpha=1$과 $\alpha=3$을 모두 답으로 제시
  feedback: $f'$의 판별식이 양수이면 극값을 가집니다. 판별식 $\le0$이면 극값이 없습니다.
- id: MC-CAL-12455
  name: 미분가능 조건에서 연속 조건만 사용
  concepts: [연속, 미분가능성]
  used_in: CUK-M24A-02#2
  outcome_code: '71'
  wrong_work: $f(a)=f(a+b)$만 세우고 $f'(a)=f'(a+b)$를 쓰지 않아 $a$, $b$를 하나의 식으로만 연결
  detect_cue: $a,b$를 구하지 못하고 한 식에서 멈춤
  feedback: $x=a$에서 미분가능이면 좌미분계수 $f'(a)$와 우미분계수 $f'(a+b)$가 같아야 합니다.
- id: MC-ALG-12456
  name: $a+b$가 근이라는 조건에서 $a<2$ 조건 누락
  concepts: [근과 계수의 관계]
  used_in: CUK-M24A-02#2
  outcome_code: '72'
  wrong_work: $a^2-4a+2=0$의 두 근 $2\pm\sqrt2$를 모두 답으로 제시
  detect_cue: $a=2+\sqrt2$, $b=-2\sqrt2<0$ 포함
  feedback: $b>0$이므로 $b=4-2a>0$, 즉 $a<2$입니다. $a=2-\sqrt2$만 가능합니다.
- id: MC-ALG-12457
  name: $S_n$ 최대 위치에서 $d_1>0$, $d_2\le0$ 근거 누락
  concepts: [등차수열의 합, 부호]
  used_in: CUK-M24A-03#1
  outcome_code: '71'
  wrong_work: $c_{16}=c_{17}+6$만으로 $d_2=-6$을 얻고 $d_1$을 $S_{11}=0$에 바로 대입해 $K$의 위치를 확인하지 않음
  detect_cue: $K\le11$ 경우를 배제하지 않음
  feedback: $c_n$의 식이 $K$ 앞뒤로 달라지므로 $K\le11$이면 $S_{11}$에 $d_2$가 섞입니다. $K>11$임을 먼저 보이세요.
- id: MC-ALG-12458
  name: $K$를 부등식에서 정수로 확정하지 않음
  concepts: [부등식, 정수 조건]
  used_in: CUK-M24A-03#2
  outcome_code: '72'
  wrong_work: $13.8\le K\le14.4$에서 $K=14$ 대신 $K=13.8$ 등을 쓰거나 $S_{19}$를 구간별로 나누지 않음
  detect_cue: $S_{19}=S_{13}+(S_{19}-S_{13})$ 형태로 분할하지 않음
  feedback: $K$는 자연수이므로 $K=14$입니다. $S_{19}$는 $K$ 앞(13항 합)과 뒤(6항 합)로 나누어 구하세요.
- id: MC-ALG-12351
  name: 대칭축의 교점이 점근선의 교점임을 모름
  concepts: [유리함수의 그래프, 그래프의 대칭]
  used_in: CUK-M23A-01#1
  outcome_code: '71'
  wrong_work: $f(x)=\dfrac{bx+c}{x+a}$에 세 조건을 연립하려다 대칭 조건을 식으로 세우지 못함
  detect_cue: 점근선 $x=4$, $y=1$이 나타나지 않음
  feedback: 유리함수 그래프는 점근선의 교점에 대하여 대칭이고 두 대칭축은 이 교점에서 만납니다. 두 직선의 교점이 $(4,1)$입니다.
- id: MC-CAL-12352
  name: $\overline{PQ}+\overline{PR}$의 최솟값에서 등호조건 누락
  concepts: [절대부등식]
  used_in: CUK-M23A-01#2
  outcome_code: '71'
  wrong_work: $|x-4|+\dfrac9{|x-4|}\ge6$만 쓰고 등호 성립 점이 곡선 위에 있음을 확인하지 않음
  detect_cue: '"등호조건" 서술 없음'
  feedback: $|x-4|=3$이면 $|y-1|=3$이 되어 곡선 위의 점입니다. 최솟값이 실제로 도달됨을 보이세요.
- id: MC-CAL-12353
  name: $(-1)^n$ 때문에 극대 위치가 바뀌는 것을 놓침
  concepts: [삼차함수의 극대, 도함수]
  used_in: CUK-M23A-02#1
  outcome_code: '71'
  wrong_work: 모든 $n$에서 큰 근 $1+2n^2$를 극대 위치로 답해 $a_n=1+2n^2$
  detect_cue: $a_n=1+2n^2$
  feedback: 최고차항 계수가 $(-1)^n$입니다. 홀수이면 음수라 큰 근이 극대, 짝수이면 양수라 작은 근이 극대입니다.
- id: MC-ALG-12354
  name: 홀수·짝수 항을 나누어 합할 때 항 수 오류
  concepts: [시그마, 수열의 합]
  used_in: CUK-M23A-02#2
  outcome_code: '72'
  wrong_work: $\sum_{n=1}^{10}$을 홀수 항 $5$개·짝수 항 $5$개로 나누고 $(2k-1)^2-(2k)^2=-4k+1$ 계산에서 부호나 합 $\sum_{k=1}^5k=15$를 틀림
  detect_cue: $S\ne-100$
  feedback: $(2k-1)^2-(2k)^2=-4k+1$이고 $\sum_{k=1}^5(-4k+1)=-55$이므로 $S=10-110=-100$입니다.
- id: MC-ALG-12355
  name: $a=\dfrac{10}{3}$ 제외 누락
  concepts: [삼차방정식의 근, 인수정리]
  used_in: CUK-M23A-03#1
  outcome_code: '71'
  wrong_work: $k(x)=0$의 판별식 $>0$만 풀어 $a<-2$ 또는 $a>3$을 답으로 제시
  detect_cue: $a=\dfrac{10}{3}$을 포함
  feedback: $a=\dfrac{10}{3}$이면 $k(1)=0$이어서 $h(x)=(x-1)^2(\cdots)$로 $1$이 중근이 됩니다. 서로 다른 세 실근이 안 됩니다.
- id: MC-CAL-12356
  name: 중근 경우 세 값 중 적분 최솟값 비교를 구간 길이만으로 판단
  concepts: [절댓값 함수의 정적분, 이차함수의 대칭성]
  used_in: CUK-M23A-03#2
  outcome_code: '71'
  wrong_work: $a=3$의 $[1,2]$만 계산하고 $a=-2$의 $[-3,1]$이 더 큰 이유(대칭성)를 보이지 않음
  detect_cue: $a=-2$ 경우 서술 없음
  feedback: $|g|$는 $x=-\dfrac12$ 기준 대칭이므로 $[-3,-\frac12]$의 적분이 $[1,2]$보다 큽니다. 세 경우를 모두 비교하세요.
- id: MC-ALG-12251
  name: $c>0$, $b>0$ 확인 없이 등호조건 사용
  concepts: [절대부등식]
  used_in: CUK-M22A-01#1
  outcome_code: '71'
  wrong_work: $\dfrac{2\pi}{a}=\dfrac a{2\pi}$에서 $a=2\pi$를 얻고 $c=8-a>0$을 확인하지 않음
  detect_cue: $c=8-2\pi>0$ 확인 없음
  feedback: $a,b,c$가 모두 양수여야 하므로 $c=8-2\pi>0$, $b=2\pi+1>0$을 확인해야 합니다.
- id: MC-ALG-12252
  name: 사인·코사인 함수의 최댓값을 진폭만으로 처리
  concepts: [삼각함수의 최댓값]
  used_in: CUK-M22A-01#1
  outcome_code: '72'
  wrong_work: $y=a\cos(bx)+c$의 최댓값을 $a+c$ 대신 $a$로 보거나 $y=c\sin(ax)+b$의 최댓값을 $c$로 봄
  detect_cue: $c=9$ 또는 $a=8$
  feedback: 최댓값은 $|\text{진폭}|+\text{평행이동}$입니다. $c+b=9$, $a+c=8$입니다.
- id: MC-GEO-12253
  name: 탄젠트 점근선을 $x=\dfrac\pi2+n\pi$ 형태로 그대로 사용
  concepts: [탄젠트 함수의 점근선]
  used_in: CUK-M22A-01#2
  outcome_code: '71'
  wrong_work: $\tan(\alpha x-\beta)$에서 $\alpha x-\beta=\dfrac\pi2+n\pi$를 $x$에 대해 풀지 않음
  detect_cue: 점근선 간격을 $\pi$로 서술
  feedback: $2\pi x-2\pi-1=\dfrac\pi2+k\pi$를 풀면 $x=\dfrac k2+\dfrac14+\dfrac1{2\pi}+1$로 간격은 $\dfrac12$입니다.
- id: MC-CAL-12254
  name: $|p|$ 최소 점근선을 $n=0$으로만 판단
  concepts: [절댓값, 점근선]
  used_in: CUK-M22A-01#2
  outcome_code: '72'
  wrong_work: $n=0$일 때 $x=\dfrac14+\dfrac1{2\pi}$를 $p$로 답함
  detect_cue: $p=\dfrac14+\dfrac1{2\pi}$
  feedback: $n=-1$의 점근선 $-\dfrac14+\dfrac1{2\pi}$의 절댓값이 더 작습니다. 양수·음수 쪽을 모두 비교하세요.
- id: MC-CAL-12255
  name: 좌극한에서 부호 $-1$ 처리 오류
  concepts: [좌극한과 우극한, 미분계수]
  used_in: CUK-M22A-02#1
  outcome_code: '71'
  wrong_work: $f(|x|)=f(-x)$로 바꾼 뒤 $\dfrac{f(-x)-f(0)}{x}$를 $f'(0)$로 곧바로 써서 좌극한도 $f'(0)$이라고 함
  detect_cue: 결론이 $f'(0)$ 임의의 값
  feedback: $\dfrac{f(-x)-f(0)}{x}=-\dfrac{f(-x)-f(0)}{-x}$이므로 좌극한은 $-f'(0)$입니다.
- id: MC-CAL-12256
  name: $y=g(|x|)$의 극솟값 조건을 $g(3)=6$만 사용
  concepts: [극값, 절댓값 함수]
  used_in: CUK-M22A-02#2
  outcome_code: '71'
  wrong_work: $g'(3)=0$ 조건을 쓰지 않거나 $x=0$ 조건과 섞음
  detect_cue: $a$를 정하지 못함
  feedback: $x>0$에서 $g(|x|)=g(x)$이므로 $x=3$이 극솟값이면 $g'(3)=0$, $g(3)=6$입니다. $g'(0)=0$은 별도 조건입니다.
- id: MC-ALG-12257
  name: 귀납법 (ii)에서 귀납가정을 적용할 적분의 $m$을 바꾸지 않음
  concepts: [수학적 귀납법, 정적분]
  used_in: CUK-M22A-03#1
  outcome_code: '71'
  wrong_work: $\int x^{m+1}(1-x)^k dx$에 $m$ 대신 $m+1$을 넣어야 함을 놓쳐 $\dfrac{(m)!k!}{\cdots}$로 계산
  detect_cue: 결과가 $\dfrac{m!(k+1)!}{(m+k+2)!}$과 불일치
  feedback: 귀납가정은 모든 자연수 $m$에 대한 명제이므로 $m$을 $m+1$로 바꿔 쓸 수 있습니다.
- id: MC-ALG-12258
  name: 판별식 부호만 보고 $n<3$ 대신 $n\le3$
  concepts: [이차식이 항상 양수일 조건]
  used_in: CUK-M22A-03#2
  outcome_code: '72'
  wrong_work: 모든 $c$에서 $>0$이면 판별식 $<0$인데 $\le0$으로 처리해 $A=\{1,2,3\}$
  detect_cue: $A$에 $3$ 포함
  feedback: $n=3$이면 판별식이 $0$이어서 어떤 $c$에서 식의 값이 $0$이 됩니다. 부등식이 엄격하므로 $n<3$입니다.
- id: MC-GEO-12151
  name: 조건식에서 $b$를 약분하지 않고 변의 관계를 단정
  concepts: [사인법칙, 코사인법칙]
  used_in: CUK-M21A-01#1
  outcome_code: '71'
  wrong_work: 조건식에서 $b$를 약분하지 않고 $a=b$ 또는 $b=c$라고 단정
  detect_cue: 이등변삼각형의 꼭지각이 $B$가 아니라 $A$ 또는 $C$로 서술
  feedback: 정리하면 $a^2=c^2$이고 $a,c>0$이므로 $a=c$, 즉 $A=C$입니다.
- id: MC-CAL-12152
  name: $\dfrac{S}{AB^2}$에서 $\overline{AB}$를 $a$가 아닌 $b$로 둠
  concepts: [삼각형의 넓이]
  used_in: CUK-M21A-01#2
  outcome_code: '72'
  wrong_work: $\overline{AB}=c$인데 $b$를 쓰거나 $S=\dfrac12ab\sin C$로 두고 최댓값을 구하지 못함
  detect_cue: $M\ne\dfrac12$
  feedback: $\overline{AB}=c=a$이므로 $S=\dfrac12ac\sin B=\dfrac12a^2\sin B$입니다.
- id: MC-PRB-12153
  name: $\mathrm P(X=1)$과 $\mathrm P(X=2)$를 바꿔 씀
  concepts: [이산확률변수의 기댓값]
  used_in: CUK-M21A-02#1
  outcome_code: '71'
  wrong_work: $\mathrm E(X)=1\cdot p+2(1-p)$에서 $p$를 $\mathrm P(X=2)$로 둠
  detect_cue: 분포가 $\dfrac34,\dfrac14$
  feedback: $p=\mathrm P(X=1)$일 때 $\mathrm E(X)=2-p$이고 $2-p=\dfrac74$이므로 $p=\dfrac14$입니다.
- id: MC-PRB-12154
  name: '"2가 적힌 붉은 공"을 $A\cap B$로 번역'
  concepts: [사건의 독립, 여사건]
  used_in: CUK-M21A-02#2
  outcome_code: '71'
  wrong_work: $B$가 "적힌 수가 $1$"인 사건임을 놓쳐 $\mathrm P(A)\mathrm P(B)=\dfrac3{20}$을 답함
  detect_cue: 답이 $\dfrac3{20}$
  feedback: 적힌 수가 $2$인 사건은 $B^c$입니다. $\mathrm P(A\cap B^c)=\mathrm P(A)(1-\mathrm P(B))$입니다.
- id: MC-CAL-12155
  name: $\ln\left(1+\dfrac1n\right)$의 상하계에서 직사각형 높이를 반대로 잡음
  concepts: [정적분과 넓이, 감소함수]
  used_in: CUK-M21A-03#1
  outcome_code: '71'
  wrong_work: $g(t)=\dfrac1t$가 감소함수임을 쓰지 않고 좌우 높이를 구별하지 않아 부등호 방향이 반대
  detect_cue: $\dfrac1n<\ln(1+\dfrac1n)<\dfrac1{n+1}$
  feedback: 감소함수이므로 구간의 오른쪽 끝 높이 $\dfrac1{1+\frac1n}$이 최솟값, 왼쪽 끝 높이 $1$이 최댓값입니다.
- id: MC-CAL-12156
  name: 사잇값 정리 적용 구간·부호 확인 누락
  concepts: [사잇값 정리]
  used_in: CUK-M21A-03#2
  outcome_code: '71'
  wrong_work: $f\left(\left(1+\dfrac1n\right)^n\right)<0$을 보이지 않고 "연속이므로 근이 존재"라고만 서술
  detect_cue: 양 끝 값의 부호 비교 없음
  feedback: $f(\alpha)<0<f(e)$를 보여야 구간 안에 근이 존재합니다.
- id: MC-CAL-12157
  name: $x>e$에서 근이 없음을 보이지 않고 $a_n<e$로 단정
  concepts: [함수의 증가]
  used_in: CUK-M21A-03#2
  outcome_code: '72'
  wrong_work: $a_n$이 가장 큰 근이라는 점을 놓쳐 구간 $(e,\infty)$의 실근을 배제하지 않음
  detect_cue: $f'(x)>0$ 서술 없음
  feedback: $x>e$에서 $f'(x)>0$이므로 $f(x)\ge f(e)>0$이어서 근이 없습니다. 그래서 $a_n<e$입니다.
