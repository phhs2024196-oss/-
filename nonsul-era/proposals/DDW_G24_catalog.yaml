# DDW-G24 오개념 후보(공용 db/misconceptions.yaml 에는 사람이 검토 후 반영). 번호대 8741xx.
misconceptions:
- id: MC-CAL-874101
  name: 몫의 미분법에서 분자의 부호·항 순서를 틀려 도함수 분자를 잘못 정리함
  concepts: [CON-CAL-DIFF-QUOTIENT]
  from: DDW-G24-01 (1)
- id: MC-CAL-874102
  name: 극값 조건을 하나만 구하고 끝점값 $f(0)$, $f(2\pi)$와 비교하지 않고 최솟값을 정함
  from: DDW-G24-01 (1)
- id: MC-CAL-874103
  name: $f\left(x-\dfrac{\pi}{2}\right)$가 0이 아닌 구간을 $\left[\dfrac{\pi}{2},\dfrac{3\pi}{2}\right]$로 옮기지 못하고 $[0,\pi]$ 그대로 적분함
  from: DDW-G24-01 (2)
- id: MC-CAL-874104
  name: 곱 $f(x)f\left(x-\dfrac{\pi}{2}\right)$의 정적분에서 겹치는 구간만 남기지 않고 전체 구간 $[0,\pi]$에서 계산함
  from: DDW-G24-01 (2)
- id: MC-CAL-874105
  name: $\sin\left(x-\dfrac{\pi}{2}\right)$를 $\cos x$로 부호 없이 처리함
  from: DDW-G24-01 (2)
- id: MC-CAL-874106
  name: 절댓값 속 $2t-x$의 부호 전환점 $t=\dfrac{x}{2}$를 구간 $[0,1]$ 안에 있다고만 가정해 $x>2$ 경우를 빠뜨림
  from: DDW-G24-02 (1)
- id: MC-CAL-874107
  name: 절댓값을 $t$의 범위를 나누지 않고 한 부호로 적분해 $f(x)=x-1$ 또는 $1-x$로 답함
  from: DDW-G24-02 (1)
- id: MC-PRB-874108
  name: '"리스트에 기록됨"을 $\mathrm{P}(A\cup B)$로 읽지 않고 $\mathrm{P}(A\cap B)$나 $\mathrm{P}(A)$를 분모로 사용함'
  from: DDW-G24-03 (1)
- id: MC-PRB-874109
  name: 덧셈정리에서 $\mathrm{P}(A\cap B)$를 빼지 않거나 두 번 빼서 $\mathrm{P}(A\cup B)$를 틀림
  from: DDW-G24-03 (1)
- id: MC-PRB-874110
  name: 표본 25개의 총 횟수를 표본평균으로 바꾸지 않고 $X$의 분포에서 $\mathrm{P}(X\ge525)$로 계산함
  from: DDW-G24-03 (2)
- id: MC-PRB-874111
  name: 표본평균의 표준편차를 $\sigma$(=5) 그대로 쓰고 $\dfrac{\sigma}{\sqrt{25}}$로 나누지 않음
  from: DDW-G24-03 (2)
