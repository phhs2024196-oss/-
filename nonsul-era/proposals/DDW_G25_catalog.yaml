# DDW-G25 오개념 후보 (공용 db/misconceptions.yaml 에는 사람이 병합. 문항 YAML 에는 병합 후 연결)
misconceptions:
- id: MC-CAL-874201
  name: 삼차방정식이 서로 다른 두 실근을 갖는 조건을 극솟값=0 또는 극값 곱<0 으로만 처리하여 극댓값=0 경우 판별을 빠뜨림(극솟값 $f(0)=-a<0$ 배제 누락)
  item: DDW-G25-01 / 1-1
  concepts: []
- id: MC-CAL-874202
  name: 교점이 $x=-1$(중근)과 $x=\dfrac12$일 때 두 곡선의 위아래 관계를 확인하지 않고 $\int\lvert\cdot\rvert$ 구간을 잘못 잡음
  item: DDW-G25-01 / 1-2
  concepts: []
- id: MC-CAL-874203
  name: $\displaystyle\int\dfrac{a}{x+3a}dx$ 를 $a\ln x+3a$ 또는 유리식 거듭제곱 공식으로 적분(합성 선형식의 로그 적분 오류)
  item: DDW-G25-01 / 1-2
  concepts: []
- id: MC-ALG-874204
  name: 삼각형 $\mathrm{PO}_n\mathrm{O}_{n+1}$ 의 높이 최댓값을 반지름 $r_n$ 이 아니라 $2r_n$ 또는 중심 사이 거리 5로 착각
  item: DDW-G25-02
  concepts: []
- id: MC-ALG-874205
  name: $\sum_{k=1}^{n}T_k$ 에서 등차수열 합 공식의 첫째항·공차를 $T_n$ 식의 계수로 잘못 읽음(첫째항 $\dfrac{15}{4}$ 대신 $\dfrac52$ 사용)
  item: DDW-G25-02
  concepts: []
- id: MC-CAL-874206
  name: 합성함수 $g(f(t))$ 에서 $f(t)\ge0$ 조건을 $t\ge0$ 으로 착각하여 적분 구간을 $t=4$ 가 아닌 $t=0$ 에서 분할
  item: DDW-G25-03
  concepts: []
- id: MC-CAL-874207
  name: $2<x\le4$ 구간에서 적분 상한을 $x+2$ 그대로 두어 $t>4$ 의 $g(f(t))=0$ 부분을 $e^{-t}-e^{-4}$ 로 계속 적분(음수 영역 포함)
  item: DDW-G25-03
  concepts: []
