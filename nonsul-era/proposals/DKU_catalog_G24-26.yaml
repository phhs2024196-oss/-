# 단국대 실전 2024~2026 자연계열 — 오개념 카탈로그 추가 제안 (공용 db/misconceptions.yaml 은 수정하지 않음)
- {id: MC-CAL-1151, name: "g=fp 의 미분가능성에서 p 가 f 의 모든 미분불가점에서 0 이어야 함을 놓침", concepts: [미분가능성, 곱함수의 미분], used_in: "DKU-G24A-01#2", outcome_code: '71', wrong_work: "p(0)=0 만 쓰거나 p(±π/4)=0 만 쓰고 삼차 p 를 한 근만으로 정한다.", detect_cue: "p(x)=ax(x-π/4)(x+π/4) 가 아닌 꼴이다.", feedback: "f 는 x=0, ±π/4 에서 좌우미분계수가 서로 달라 g=fp 가 미분가능하려면 p 가 세 점에서 모두 0 이어야 한다. 삼차함수이므로 p=ax(x²-π²/16)."}
- {id: MC-CAL-1152, name: "h=|tan x+p| 의 x=0 미분가능 조건을 h'(0)=0 이 아닌 p'(0)=0 으로 둠", concepts: [절댓값 함수, 미분가능성], used_in: "DKU-G24A-01#2", outcome_code: '71', wrong_work: "h(0)=0 에서 p'(0)=0 으로 두어.", detect_cue: "1+p'(0)=0 이 쓰여 있지 않다.", feedback: "u=tan x+p(x), u(0)=0 이고 |u| 가 x=0 에서 미분가능하려면 u'(0)=0 이어야 하므로 1+p'(0)=0, a=16/π²."}
- {id: MC-CAL-1153, name: "직선 AC 와 곡선의 교점 3개 조건에서 기울기 비교를 반대로 함(k<2)", concepts: [그래프 개형, 접선의 기울기, 교점의 개수], used_in: "DKU-G24A-02#1", outcome_code: '71', wrong_work: "1/(2k)<1/4 를 k<2 로 푼다.", detect_cue: "답이 0<k<2 이다.", feedback: "k>0 이므로 1/(2k)<1/4 ⇔ k>2. 직선이 변곡점에서의 접선보다 완만해야 S자 곡선과 세 점에서 만난다."}
- {id: MC-CAL-1154, name: "g(α)>g(β) 를 α 에서 극소·β 에서 극대로 해석함", concepts: [극대·극소, 도함수의 그래프], used_in: "DKU-G24B-01#2", outcome_code: '71', wrong_work: "x축이 y=a 와 y=a+1 사이에 있다고 보아 -1<a<0 을 답한다.", detect_cue: "답이 -1<a<0 이거나 a 의 범위에 음수가 포함된다.", feedback: "α<β 이고 극값이 둘뿐이므로 g(α)>g(β) 는 α 에서 극대, β 에서 극소와 같다. g' 의 개형에서 x축이 y=a-1 과 y=a 사이에 있어야 하므로 0<a<1."}
- {id: MC-CAL-1155, name: "g'≤2 (x>0) 를 a<0 인 상태에서 부등호 방향을 바꾸지 않고 정리", concepts: [부등식, 최솟값], used_in: "DKU-G24B-02#1", outcome_code: '71', wrong_work: "a(x²+2x-7)e^x≤2 를 a 로 나눌 때 방향을 유지해 (x²+2x-7)e^x≤2/a 로 쓴다.", detect_cue: "f(1) 의 최댓값이 구해지지 않거나 부호가 틀린다.", feedback: "a<0 이므로 양변을 a 로 나누면 부등호가 바뀌어 (x²+2x-7)e^x≥2/a. m(x)=(x²+2x-7)e^x 의 최솟값 -4e 에서 2/a≤-4e."}
- {id: MC-CAL-1156, name: "k'=h'(h-1)e^h 의 근 중 h=1 의 근을 극값점 후보에서 빠뜨림", concepts: [극값, 합성함수의 미분, 경우 분류], used_in: "DKU-G24B-02#2", outcome_code: '71', wrong_work: "h'(x)=0 의 근만 극값점으로 보아 r,0,2 를 h' 의 근 세 개로 둔다.", detect_cue: "삼차함수 h' 의 근을 세 개로 둔 식이 있다.", feedback: "k'=h'(h-1)e^h 이므로 h'=0 과 h=1 의 근 모두가 후보이다. h' 의 근은 두 개뿐이므로 나머지 극값점은 h=1 에서 나온다(h-1=ax(x-2)²)."}
- {id: MC-CAL-1161, name: "g(-2)=∫_1^{-2} f 를 정리할 때 적분 구간의 방향(부호)을 틀림", concepts: [정적분의 성질, 기함수], used_in: "DKU-G25A-01#1", outcome_code: '71', wrong_work: "∫_0^2 f=∫_{-2}^0 f 로 두거나 ∫_0^{-2} 를 g(0)-g(-2) 로 쓴다.", detect_cue: "g(-2)=+2 이거나 g(-2)=-2-2g(0) 꼴이다.", feedback: "f 가 기함수이므로 ∫_0^2 f=∫_0^{-2} f=g(-2)-g(0). 양변의 g(0) 이 소거되어 g(-2)=-2."}
- {id: MC-CAL-1162, name: "점 P 에서 그은 접선이 두 개뿐이라는 조건을 P 가 변곡점의 접선 위에 있는 것으로 보지 않고 P(a,f(a)) 로 가정", concepts: [접선의 방정식, 삼차함수], used_in: "DKU-G25A-01#3", outcome_code: '71', wrong_work: "P 를 곡선 위의 점으로 놓고 두 접선이 서로 수직이라는 식만 세운다.", detect_cue: "P 의 좌표가 (2,0) 으로 나오지 않는다.", feedback: "P 는 x축 위의 점이고 접선이 두 개이므로 접점 방정식의 판별식이 0, 즉 P(2,0) 이며 다른 접점은 x=-1 이다. 그 뒤 f'(-1)f'(2)=-1."}
- {id: MC-CAL-1163, name: "|3f-k|=1 에서 f=(k-1)/3, (k+1)/3 두 수평선의 교점 합을 하나씩만 셈", concepts: [절댓값 방정식, 그래프 개형, 교점의 개수], used_in: "DKU-G25A-02#2", outcome_code: '71', wrong_work: "f=(k+1)/3 의 교점 개수만 2 로 두거나 경계값 k=1-√3 을 빠뜨린다.", detect_cue: "답에 k=1-√3 또는 5/2≤k<1+√3 이 없다.", feedback: "두 수평선 사이 거리는 2/3 로 극값 폭 2√3/3 보다 작지 않다는 점을 이용해 교점 개수의 합을 구간별로 분류한다. 접하는 경계(극솟값 -√3/3)와 끝점 f(2π)=1/2 를 따로 처리한다."}
- {id: MC-CAL-1164, name: "x≤t 구간 최솟값을 꼭짓점 x=1/2 로 두고 t 와의 대소를 확인하지 않음", concepts: [절댓값 함수, 이차함수의 최솟값], used_in: "DKU-G25B-01#1", outcome_code: '71', wrong_work: "|t|<1/2 에서도 x=1/2 를 꼭짓점으로 보아 g(t)=t-1/4 로 답한다.", detect_cue: "g(t)=t-1/4 가 모든 t 에 쓰여 있다.", feedback: "x≥t 에서 f=x²+x-t, x≤t 에서 f=x²-x+t. 꼭짓점 -1/2, 1/2 이 구간 안에 있는지 t 와 비교해야 한다. |t|<1/2 이면 두 구간 모두 x=t 에서 최소 t²."}
- {id: MC-CAL-1165, name: "n(k) 의 불연속점을 극값의 값이 아니라 극값을 갖는 x 로 착각", concepts: [교점의 개수, 극값, 연속], used_in: "DKU-G25B-01#3", outcome_code: '71', wrong_work: "k=0, 1 에서 극값을 갖는다고 보아 h 의 극점이 x=0,1 이라 놓는다.", detect_cue: "h(x)=x²(x-1)² 꼴이다.", feedback: "n(k) 는 k 가 h 의 극값(함숫값)일 때 불연속이다. 극솟값 0 두 개와 극댓값 1 이므로 h=(x-1)²(x-s)², 극댓값 ((s-1)/2)⁴=1."}
- {id: MC-CAL-1166, name: "구간 [0,10) 의 근 개수를 1+2+3+4+5 로 세지 않거나 k=0 을 누락", concepts: [정적분, 삼각함수, 방정식의 근의 개수], used_in: "DKU-G25B-02#2", outcome_code: '71', wrong_work: "구간마다 근을 n-1 개로 세거나 k=0 을 제외하여 m 의 범위가 어긋난다.", detect_cue: "답이 31/3≤m<32/3 등 한 칸 어긋난 범위이다.", feedback: "[2(n-1),2n) 에서 ∫f=0 인 k 는 cos(nπk)=1, 즉 k=2j/n 의 n 개(구간 시작점 포함). 0≤k<10 에서 15 개이므로 10≤k 에서 3 개 더: 10, 31/3, 32/3 까지 포함해야 18 개."}
- {id: MC-CAL-1171, name: "x=g(u) 치환에서 적분구간을 x 의 구간 [0,m] 그대로 둠", concepts: [치환적분, 역함수], used_in: "DKU-G26A-01#2", outcome_code: '71', wrong_work: "∫_0^m F'(h(x))dx 를 ∫_0^m F'(u)g'(u)du 로 쓴다.", detect_cue: "적분구간이 [0,3-e²] 이다.", feedback: "x=g(u) 이면 x=0 → u=h(0)=0, x=m → u=h(m)=2 이므로 구간은 [0,2]."}
- {id: MC-CAL-1172, name: "정삼각형 무게중심에서 윗꼭짓점까지의 높이를 1 로 둠(2:1 내분 방향 오류)", concepts: [무게중심, 정삼각형의 넓이], used_in: "DKU-G26A-01#3", outcome_code: '71', wrong_work: "무게중심과 위 꼭짓점의 거리를 1 로 보아 c=k+1 로 둔다.", detect_cue: "k(x)=-1+√(…) 꼴이다.", feedback: "높이 3 인 정삼각형에서 무게중심은 꼭짓점에서 2, 밑변에서 1 만큼 떨어져 있다. 위 꼭짓점의 y좌표는 k+2."}
- {id: MC-CAL-1173, name: "일대일 구간 [b,c] 에서 b<0<c 조건을 쓰지 않아 a 의 범위에 |a|≥1 을 포함", concepts: [일대일함수, 그래프 개형], used_in: "DKU-G26A-02#1", outcome_code: '71', wrong_work: "f 가 단조인 세 구간을 모두 허용해 a∈(-∞,-1]∪[-1,1]∪[1,∞) 등으로 쓴다.", detect_cue: "답이 -1≤a≤1 이거나 a 범위가 열린구간이 아니다.", feedback: "b<0<c 이므로 [b,c] 는 0 을 포함하고, b<a<c 이므로 a=±1 이면 b<-1 또는 c>1 이 필요해져 일대일이 깨진다. 따라서 열린구간 (-1,1)."}
- {id: MC-CAL-1174, name: "0≤x<1 에서 A(x) 를 구할 때 부호가 바뀌는 점 g(x) 를 쓰지 않고 한 식으로 적분", concepts: [절댓값 적분, 역함수], used_in: "DKU-G26A-02#2", outcome_code: '71', wrong_work: "|f(t)-x| 를 구간 나누지 않고 A(x)=ln2-x 로 둔다.", detect_cue: "A 가 극값을 갖지 않아 c 를 구하지 못한다.", feedback: "0≤x<1 에서는 f(t)=x 가 되는 t=g(x) 에서 부호가 바뀐다. A'(x)=2g(x)-1 이므로 g(x)=1/2, x=f(1/2)=4/5."}
- {id: MC-CAL-1175, name: "극한 (1/x)∫_1^{x+1} 을 미분계수 K'(1) 로 읽지 못하고 정적분 값을 직접 계산하려 함", concepts: [미분계수의 정의, 정적분과 미분], used_in: "DKU-G26B-01#1", outcome_code: '71', wrong_work: "피적분함수의 원시함수를 구하려다 막히거나 x→0 일 때 ∫_1^1=0 이라 하여 극한이 항상 0 이라고 결론한다.", detect_cue: "e^{-a²}f(a)=0 이 쓰여 있지 않다.", feedback: "K(x)=∫_1^x k(t)dt 로 두면 극한은 {K(x+1)-K(1)}/x 이므로 K'(1)=k(1)=e^{-a²}f(a)."}
- {id: MC-CAL-1176, name: "'만나는 모든 점에서 접선 일치'를 g=h 한 식만으로 처리", concepts: [접선, 교점], used_in: "DKU-G26B-01#2", outcome_code: '71', wrong_work: "cos p - sin p = b 만 쓰고 b 를 임의의 값으로 둔다.", detect_cue: "g'(p)=h'(p) 에서 얻는 2cos p=b 가 없다.", feedback: "접선이 일치하려면 g(p)=h(p) 와 g'(p)=h'(p) 를 동시에 만족해야 한다. 두 식에서 tan p=-1, b=2cos p>0 이므로 b=√2, p=7π/4+2jπ."}
- {id: MC-CAL-1177, name: "A_k 사이의 관계 A_{k+2}=A_k e^{-2π} 를 A_k e^{-π} 로 착각(주기 π 와 혼동)", concepts: [삼각함수의 주기, 치환적분, 넓이], used_in: "DKU-G26B-01#3", outcome_code: '71', wrong_work: "x→x+π 이동으로 A_{k+1}=A_k e^{-π} 라 쓰고 부호를 무시한다.", detect_cue: "A_6/A_3=e^{-3π} 가 아닌 값이다.", feedback: "cos(x+π)-sin(x+π)=-(cos x - sin x) 이므로 π 이동은 부호가 바뀌고 크기는 e^{-π} 배, 넓이는 절댓값이다. A_k 는 모두 A_1 e^{-(k-1)π} 이고 A_6/A_3=e^{-3π}."}
- {id: MC-CAL-1178, name: "t=6 의 좌극한·우극한을 같은 가지의 근으로 둠", concepts: [좌극한·우극한, 삼차함수의 그래프], used_in: "DKU-G26B-02#1", outcome_code: '71', wrong_work: "g(6)=1 이므로 양쪽 극한을 모두 1 로 답한다.", detect_cue: "좌우극한이 같거나 중간 근 1 이 쓰인다.", feedback: "g 는 t=6 에서 불연속이므로 t<6 에서 연속인 가지(가장 작은 근 1-√7)와 t>6 에서 연속인 가지(가장 큰 근 1+√7)로 나뉜다. 1 은 g(6) 의 값이지 극한이 아니다."}
- {id: MC-CAL-1179, name: "연속인 h 의 존재 조건 m≤n 과 k 의 비존재 조건 m>n-1 을 하나만 사용", concepts: [연속함수의 성질, 극솟값, 합성함수의 미분], used_in: "DKU-G26B-02#2", outcome_code: '71', wrong_work: "m≤n 만 쓰고 n 이 자연수라는 조건과 c=2n+2 만으로 n 을 정하지 못해 n=1 등을 택한다.", detect_cue: "n 의 범위에서 부등식이 한쪽뿐이다.", feedback: "n-1<m≤n 과 m=c-4, c=2n+2 에서 1<n≤2 이므로 n=2, c=6. 그 뒤 h'(2)=1/f'(h(2)), h(2)=1+√3."}
