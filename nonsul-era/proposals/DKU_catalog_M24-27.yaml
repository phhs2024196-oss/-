# 단국대 모의논술 2024~2027 자연계열 — 오개념 카탈로그 추가 제안 (공용 db/misconceptions.yaml 은 수정하지 않음)
- {id: MC-CAL-1181, name: "F≥0·F(3)=0에서 f=(x-3)²를 근거 없이 단정(g(3)=0 경우 미검토)", concepts: [극값, 이차함수, 곱함수의 부호], used_in: "DKU-M24-01#2", outcome_code: '71', wrong_work: "F(3)=0이고 F≥0이므로 f=(x-3)²로 놓고 시작하여 g(3)=0인 경우를 따지지 않거나, 반대로 g(3)=0만 가정한다.", detect_cue: "답안에 F'(3)=f'(3)g(3)=0에서 f'(3)=0 또는 g(3)=0으로 나누는 문장이 없다.", feedback: "F'(3)=f'(3)g(3)+f(3)g'(3)=f'(3)g(3)이므로 f'(3)=0 또는 g(3)=0 두 경우로 나누고, g(3)=0이면 F=0의 서로 다른 실근이 3개 이상이 되어 F≥0에 모순임을 보여야 한다."}
- {id: MC-CAL-1182, name: "G=e^F의 극대 조건에서 F'(s)=0만 쓰고 극대 여부·부호 변화를 확인하지 않음", concepts: [극대, 합성함수의 미분], used_in: "DKU-M24-01#2", outcome_code: '71', wrong_work: "F'(s)=0, f(s)=g(s), f'(s)g'(s)=-1에서 얻은 s나 g를 그대로 쓰고 x=s에서 F'의 부호가 양에서 음으로 바뀌는지 확인하지 않는다.", detect_cue: "F'의 부호 변화 또는 F(s)>0 확인이 없다.", feedback: "G'=F'e^F이므로 G와 F의 극대 위치는 같다. 구한 s에서 F'의 부호가 +에서 -로 바뀌는지(F=(x-3)²(x-4)²이면 x=7/2에서 극대) 반드시 확인한다."}
- {id: MC-CAL-1183, name: "g(x)g(x+k) 연속성에서 x=-k의 조건 g(-k)=0 누락", concepts: [연속, 좌극한·우극한], used_in: "DKU-M24-02#1", outcome_code: '71', wrong_work: "x=0에서의 조건 g(k)=0만 풀어 k=1, 1±√6(또는 g(k)=0의 모든 근)을 답으로 쓴다.", detect_cue: "x=-k에서 좌우극한을 비교한 식이 없고 k=1 같은 답이 포함된다.", feedback: "g(x+k)는 x=-k에서, g(x)는 x=0에서 불연속이므로 두 점 모두에서 연속이어야 한다. g(k)=0과 g(-k)=0을 동시에 만족하는 k만 남는다."}
- {id: MC-CAL-1184, name: "주기 4인 우함수의 적분에서 구간 분해 오류(33=4×8+1)", concepts: [정적분, 주기함수, 우함수], used_in: "DKU-M24-02#2", outcome_code: '71', wrong_work: "∫_0^33 h = 8∫_0^4 h로 쓰고 남은 ∫_32^33 h를 빠뜨리거나, ∫_2^4 h를 ∫_0^2 h와 부호까지 같다고 보지 않고 다르게 계산한다.", detect_cue: "답이 -192이거나 ∫_2^4 h 처리 근거(h(-x)=h(x), h(x+4)=h(x))가 없다.", feedback: "h(x+4)=h(x)이므로 ∫_2^4 h=∫_{-2}^0 h이고 우함수이므로 ∫_{-2}^0 h=∫_0^2 h. 33=4×8+1이므로 ∫_0^33 h=8∫_0^4 h+∫_0^1 h."}
- {id: MC-CAL-1185, name: "연속 조건 sinα=0에서 α=π 또는 -π 중 한 값만 택함", concepts: [연속, 극한, 부분적분], used_in: "DKU-M25-01#1", outcome_code: '71', wrong_work: "-2π<α<2π, sinα=0에서 α=π만 택해 4π²만 답한다.", detect_cue: "답이 하나뿐이다.", feedback: "α≠0이고 -2π<α<2π인 sinα=0의 해는 α=±π 두 개이며, f=x²-αx에 대해 적분값은 4πα=±4π²이다."}
- {id: MC-CAL-1186, name: "계단함수 u(0)=-1을 놓쳐 s(a_i)를 잘못 계산", concepts: [연속, 계단함수, 시그마], used_in: "DKU-M25-01#3", outcome_code: '71', wrong_work: "x=a_i에서 u(0)을 1(또는 0)로 보아 s(a_i)=2i-5로 계산하여 Σs(a_i)sin a_i의 계수를 -3,-1,1 등으로 잘못 둔다.", detect_cue: "s(a_1)=-5가 아닌 값이 쓰여 있다.", feedback: "u(x)=-1 (x≤0)이므로 u(0)=-1이다. s(a_i)는 왼쪽 극한 2i-7과 같고 s(a_1),s(a_2),s(a_3)=-5,-3,-1이다."}
- {id: MC-CAL-1187, name: "선분까지의 거리를 직선까지의 거리와 동일시", concepts: [점과 직선 사이의 거리, 최솟값 함수], used_in: "DKU-M25-02#1", outcome_code: '71', wrong_work: "직선 AB, BC, CD까지의 거리 세 식의 최솟값을 구간 확인 없이 m(x)로 쓰거나, 수선의 발이 선분 밖인 경우를 따지지 않는다.", detect_cue: "구간 경계(√2-2, 2-√2)가 아닌 x=±1, 0 등을 꺾임점으로 답한다.", feedback: "선분까지의 거리는 수선의 발이 선분 안에 있을 때만 직선까지의 거리와 같다. 점 P(x,0)에서 세 거리 중 최솟값을 구간별로 정리하고 전환점에서 좌우 미분계수를 비교한다."}
- {id: MC-CAL-1188, name: "|m|을 처리하지 않아 m<0 경우를 놓침", concepts: [미분가능성, 절댓값 함수, 좌미분계수·우미분계수], used_in: "DKU-M25-02#2", outcome_code: '71', wrong_work: "F'(2)=8me²+9e²|m|에서 m>0만 가정해 m=1, f(a+k)=-9e²만 답한다.", detect_cue: "153e²가 답에 없고 |m|를 m으로 바꿔 쓴 식이 있다.", feedback: "f(x)=mx+n의 일차항 계수 m은 부호가 정해져 있지 않다. m>0, m<0으로 나누어 8m+9|m|=17를 풀면 m=1, -17 두 경우가 나온다."}
- {id: MC-CAL-1189, name: "a_n-a_{n-1}의 부호 (-1)^n을 (-1)^{n-1}로 잘못 정리", concepts: [귀납적 정의, 삼각함수, 정적분과 미분], used_in: "DKU-M26-01#2", outcome_code: '71', wrong_work: "cos(2π+nπ)=(-1)^n을 (-1)^{n-1}로 쓰거나 항의 개수를 잘못 세어 a_11-a_2=+π 또는 0으로 구한다.", detect_cue: "a_2=a_1-π처럼 첫 차의 부호가 반대다.", feedback: "αk=π이므로 a_n-a_{n-1}=π cos(2π+nπ)=(-1)^nπ이다(n=2이면 +π). a_2=a_1+π, a_3=a_1, ..., a_11=a_1이므로 a_11-a_2=-π이다."}
- {id: MC-CAL-1190, name: "g(-α)=k를 얻고도 기함수를 쓰지 않아 k의 부호를 틀림", concepts: [기함수, 정적분과 미분], used_in: "DKU-M26-01#1", outcome_code: '71', wrong_work: "식 ①에 x=0을 대입해 g(-α)=k를 얻은 뒤 g(α)=-3π를 바로 대입하여 k=-3π (k>0에 모순) 또는 cos(3πα)=1로 푼다.", detect_cue: "k=-3π가 쓰여 있거나 cos(3πα)=1에서 α=2/3, 4/3를 답한다.", feedback: "g가 기함수이므로 g(-α)=-g(α)=3π이고 k=3π (k>0). x=α 대입에서 αg(α)=αk cos(kα) → cos(3πα)=-1이다."}
- {id: MC-CAL-1191, name: "[0,1]에서 최솟값을 x=1/2로만 보고 절댓값 경계 x=t/2를 반영하지 않음", concepts: [절댓값 함수, 구간별 최솟값, 극값], used_in: "DKU-M26-02#1", outcome_code: '71', wrong_work: "f(x)=xe^{2x}-|e^{2x}-e^t|를 t와 무관하게 한 식으로 두고 미분해 g(t)=e^t-e/2 하나로 정리한다.", detect_cue: "t<0, t≥2, 0≤t<2로 나누지 않고 g(x)의 꺾임점이 없다고 답한다.", feedback: "e^{2x}와 e^t의 대소가 x=t/2에서 바뀌므로 구간을 나누어 각 구간의 최솟값 e^t-e/2, 1-e^t를 구하고 두 값의 대소를 비교해 g(t)를 구간별로 쓴다."}
- {id: MC-CAL-1192, name: "h의 불연속점을 g(x)=k+1인 점만 세고 g(x)=k-1인 점을 빠뜨림 (또는 극대점의 접점 처리 오류)", concepts: [극한함수, 불연속, 그래프 교점], used_in: "DKU-M26-02#2", outcome_code: '71', wrong_work: "|g-k|=1을 g=k+1만으로 보거나, k+1이 최댓값과 같은 경계(등호)를 포함해 -1-e/2<k≤-1/2-e/4로 답한다.", detect_cue: "교점 개수 표에 y=k-1의 교점이 없거나 범위의 오른쪽 끝에 등호가 있다.", feedback: "h는 |g-k|=1인 모든 x에서 불연속이다. y=k+1과 y=k-1 각각의 교점을 세어 합이 3이 되려면 k+1이 최댓값 1/2-e/4보다 작고 점근선 -e/2보다 커야 하며, k+1=1/2-e/4이면 전체 교점이 2개뿐이다."}
- {id: MC-CAL-1193, name: "접선과 곡선의 넓이에서 f-ℓ의 부호를 확인하지 않고 ∫(ℓ-f)로 적분", concepts: [넓이, 접선, 정적분], used_in: "DKU-M27-01#2", outcome_code: '71', wrong_work: "S=∫_{-3}^{3}(ℓ-f)dx로 두어 p=27 또는 p=-27이 아닌 값을 얻는다.", detect_cue: "f(x)-ℓ(x)=-(x+3)²(x-3)의 부호 판단 문장이 없다.", feedback: "[-3,3]에서 -(x+3)²(x-3)≥0이므로 위쪽 곡선은 f이고 S=∫(f-ℓ)dx이다. 부호를 확인한 뒤 ∫_{-3}^{3}(-p)dx=∫_{-3}^{3}27dx에서 p=-27."}
- {id: MC-CAL-1194, name: "제곱하지 않고 g(m)을 직접 미분하거나, h'(2)=0 후 최솟값 확인을 생략", concepts: [최솟값, 도함수, 거리], used_in: "DKU-M27-01#3", outcome_code: '71', wrong_work: "g(m)=√(…)를 그대로 미분해 식이 복잡해지거나, h'(2)=0의 해만 구하고 m=2가 최솟값(극값이 하나뿐이고 양 끝에서 ∞)임을 확인하지 않는다.", detect_cue: "답이 a=(-3+√41)/2이지만 m→0+, m→∞에서 g→∞ 확인이 없다.", feedback: "g(m)>0이므로 {g(m)}²이 m=2에서 최소일 때 g도 최소이다. h'(m)=0의 양의 해가 하나뿐이고 양 끝에서 g→∞이므로 그 점이 최솟값이다."}
- {id: MC-CAL-1195, name: "합이 최대일 조건을 a_i를 내림차순으로 배열하는 것으로 오해", concepts: [재배열 부등식, 등비수열, 일대일대응], used_in: "DKU-M27-02#1", outcome_code: '71', wrong_work: "b_n이 증가하므로 큰 a_n에 작은 b_n을 짝지어야 한다고 보아 a_1>a_2>…>a_6으로 배열한다.", detect_cue: "f(1)에 가장 큰 k^m이 대응된다(k<-1에서 f(1)=6).", feedback: "i<j, a_i>a_j일 때 두 항을 맞바꾼 변화량이 (a_i-a_j)(b_j-b_i)>0이므로, 합이 최대이면 a_i<a_j (b_i<b_j)와 같은 순서로 정렬되어야 한다."}
- {id: MC-CAL-1196, name: "'한 점을 제외한 모든 점' 조건을 모든 n에 적용하여 해가 없다고 결론", concepts: [배수 조건, 일대일대응, 점과 직선 사이의 거리], used_in: "DKU-M27-02#2", outcome_code: '71', wrong_work: "n=1,…,6 모두에서 n+2^{f(n)}이 5의 배수여야 한다고 보아 n=5에서 해가 없어 '해 없음'이라 답한다.", detect_cue: "표에서 n=5의 '없음' 이후 결론이 해 없음이다.", feedback: "n=5에서는 어떤 f(5)에 대해서도 5의 배수가 되지 않으므로 G_5가 제외되는 한 점이다. 나머지 n에서 f를 정하고 남는 값을 f(5)에 대응시켜 일대일대응 4개를 얻는다."}
