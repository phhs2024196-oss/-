# 한신대 2025학년도 선행학습영향평가 보고서 문항(HSN-G25H-10~15, G25N-07~15) 오개념 후보 — 번호대 98xx(9801~9815). 후보 단계: 문항에는 연결하지 않음
school: HSN
year: 2025
misconceptions:
- id: MC-ALG-9801
  name: 로그의 밑 $\frac14$ 를 무시하고 $x$축 대칭을 $y=\log_{\frac14}(-x)$ 로 처리
  concepts: []
  item: HSN-G25H-10
  outcome_code: '71'
  wrong_work: $y=\log_{\frac14}(-x)$ 로 놓고 평행이동
  detect_cue: $-\log_{\frac14}x$ 대신 $\log_{\frac14}(-x)$ 가 나타난다
  feedback: $x$축 대칭은 $y\to-y$, 즉 $y=-f(x)$ 입니다($y$축 대칭이 $f(-x)$).
- id: MC-CAL-9802
  name: 절댓값을 풀지 않고 $\lvert x-2\rvert$ 를 $x-2$ 로 두고 $[0,3]$ 전체 적분
  concepts: []
  item: HSN-G25H-11
  outcome_code: '71'
  wrong_work: $\int_0^3x(x-2)dx=0$
  detect_cue: 구간 분할 없이 한 번에 적분
  feedback: 절댓값 안의 부호가 바뀌는 $x=2$에서 구간을 나누어야 합니다.
- id: MC-CAL-9803
  name: 우극한에서 분모를 인수분해하지 않고 $x=1$ 대입해 $\frac00$ 로 둠
  concepts: []
  item: HSN-G25H-12
  outcome_code: '71'
  wrong_work: $\frac{0}{0}=\frac38$ 에서 $a$ 를 구함
  detect_cue: 극한값 없이 대입 결과를 그대로 사용
  feedback: $\frac00$ 꼴은 인수분해로 약분한 뒤 극한을 구하세요.
- id: MC-CAL-9804
  name: 증가함수 조건을 $f'(x)>0$ 으로 잡아 등호를 제외하고 최솟값 없음 처리
  concepts: []
  item: HSN-G25H-13
  outcome_code: '71'
  wrong_work: $D<0$ 에서 $a>1$ 로 최솟값이 없다고 답함
  detect_cue: $D<0$ 으로 쓰고 $a>1$ 이라 결론
  feedback: 증가함수는 $f'(x)\ge0$ 이면 충분합니다(등호가 한 점에서만 성립해도 증가).
- id: MC-ALG-9805
  name: $\sum_{n=1}^{36}a_{2n}$ 의 항 수를 36으로 보아 묶음을 잘못 셈
  concepts: []
  item: HSN-G25H-14
  outcome_code: '71'
  wrong_work: $20\times 4$ 만 계산하고 마지막 $1$을 빠뜨림
  detect_cue: $80$ 이라 답함
  feedback: $n=1\ldots36$ 은 4개씩 9묶음(1,19,…,1)입니다. 묶음 수를 다시 세세요.
- id: MC-ALG-9806
  name: $\lvert\sin\pi x\rvert^2=\sin^2\pi x$ 를 놓치고 $x$를 $0\le x\le2$ 근만 구해 답함
  concepts: []
  item: HSN-G25H-15
  outcome_code: '71'
  wrong_work: $0\le x\le2$ 의 근의 합 4 를 답으로 씀
  detect_cue: 구간 $-2\le x\le4$ 를 무시
  feedback: 구간이 $[-2,4]$ 이므로 주기 2 로 평행이동한 근을 모두 더해야 합니다.
- id: MC-ALG-9807
  name: $\log_9a+\log_9b=\frac72$ 에서 $a,b$ 를 각각 $9^{7/4}$ 처럼 놓고 자연수 순서쌍을 놓침
  concepts: []
  item: HSN-G25N-07
  outcome_code: '71'
  wrong_work: $a=b=3^{7/2}$ 라 하여 순서쌍 1개
  detect_cue: $ab=3^7$ 대신 $a+b$ 로 처리
  feedback: 로그의 합은 곱의 로그입니다. $ab=3^7$ 이므로 약수쌍을 모두 세세요.
- id: MC-CAL-9808
  name: 극한 존재 조건($\frac{0}{0}$)을 쓰지 않고 곧바로 유리화
  concepts: []
  item: HSN-G25N-08
  outcome_code: '71'
  wrong_work: $a$ 를 모른 채 유리화하여 식이 막힘
  detect_cue: 분자를 $a$ 가 있는 채로 유리화
  feedback: 분모가 0으로 가면 분자도 0이어야 합니다. 먼저 $a$ 를 정하세요.
- id: MC-ALG-9809
  name: $\lvert a_{10}\rvert=\lvert a_{28}\rvert$ 에서 $a_{10}=a_{28}$ 한 경우만 고려
  concepts: []
  item: HSN-G25N-09
  outcome_code: '71'
  wrong_work: $d=0$ 이 되어 $m$ 을 못 구함
  detect_cue: $a_{10}=-a_{28}$ 경우가 없음
  feedback: 절댓값 방정식은 $A=B$ 와 $A=-B$ 두 경우로 나눕니다. 공차가 0이면 $a_m=-10$ 불가임도 밝히세요.
- id: MC-CAL-9810
  name: 연속 조건에서 $g(0)$ 대신 $f(0)$ 으로 우극한과 좌극한 비교
  concepts: []
  item: HSN-G25N-10
  outcome_code: '71'
  wrong_work: $a=0$ 으로 처리해 조건 위반
  detect_cue: $f$ 의 좌·우극한을 구하지 않음
  feedback: $g$ 의 좌극한, 우극한, 함숫값이 모두 같아야 합니다. $a\ne0$ 조건도 확인하세요.
- id: MC-CAL-9811
  name: $\lim\frac{f(x-2h)-f(x)}{h}$ 를 $2f'(x)$ 로 부호를 놓침
  concepts: []
  item: HSN-G25N-11
  outcome_code: '71'
  wrong_work: $2f'(x)=4x^2+ax$ 로 놓고 $a=4$
  detect_cue: $-2f'(x)$ 의 부호 누락
  feedback: $f(x-2h)-f(x)$ 는 $-2h$ 에 대한 차분이므로 $-2f'(x)$ 입니다.
- id: MC-GEO-9812
  name: $\angle DBC=\theta$ 인 이유(엇각)를 쓰지 않고 삼각형 BCD의 높이를 새로 구함
  concepts: []
  item: HSN-G25N-12
  outcome_code: '71'
  wrong_work: 삼각형 BCD 를 코사인법칙으로 다시 풀다 계산 오류
  detect_cue: 엇각을 언급하지 않음
  feedback: 사다리꼴에서 $AD\parallel BC$ 이므로 엇각 $\angle ADB=\angle DBC$ 입니다.
- id: MC-CAL-9813
  name: 양변 미분 후 $x=0$ 대입을 하지 못해 $f(x)$ 를 미지수로 방치
  concepts: []
  item: HSN-G25N-13
  outcome_code: '71'
  wrong_work: $xf(x)=3x^2+2ax+b$ 에서 $f(b)$ 계산 불가
  detect_cue: $b=0$ 을 이끌지 못함
  feedback: 다항함수이므로 우변은 $x$ 로 나누어떨어져야 합니다. $x=0$ 을 대입하세요.
- id: MC-CAL-9814
  name: $x=-1$ 이 극솟값이라 잘못 가정하여 $f(-1)=0=-4$ 모순
  concepts: []
  item: HSN-G25N-14
  outcome_code: '71'
  wrong_work: 극솟값 $-4$ 를 $x=-1$ 에서의 값으로 놓음
  detect_cue: 극대·극소 판별 없이 $f(-1)$ 을 사용
  feedback: $x=-1$ 에서는 극대(값 0)이며 극솟값은 다른 임계점입니다. 증감표로 확인하세요.
- id: MC-CAL-9815
  name: 넓이를 $\int_{-1}^1\{g(x)-f(x)\}dx$ 로 하나로 세움
  concepts: []
  item: HSN-G25N-15
  outcome_code: '71'
  wrong_work: $x$ 구간 전체에서 $g-f$ 적분
  detect_cue: $y=-1$ 경계(구간 $[-1,0]$)를 고려하지 않음
  feedback: $y=-1$ 이 아래 경계가 되는 구간과 $f$가 아래 경계가 되는 구간을 나누어야 합니다.
