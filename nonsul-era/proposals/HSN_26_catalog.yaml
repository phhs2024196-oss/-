school: HSN
year: 2026
misconceptions:
- id: MC-ALG-9831
  name: 상수항을 로그 안에 넣을 때 $2=\log_3 2$로 처리
  concepts: []
  item: HSN-G26H-11
  outcome_code: '71'
  wrong_work: $\log_3(5x+3)=\log_3 2(x-1)$에서 $5x+3=2x-2$
  detect_cue: 첫 줄 이후 $5x+3=2(x-1)$ 꼴이 나타난다
  feedback: 상수 $2$는 $\log_3 3^2=\log_3 9$로 바꾸어 로그 하나로 묶어야 합니다.
- id: MC-ALG-9832
  name: 부등식 $n<16$의 경계 $16$을 포함해 최댓값을 16으로 답함
  concepts: []
  item: HSN-G26H-12
  outcome_code: '71'
  wrong_work: $-\dfrac23n+\dfrac{32}{3}>0$에서 $n\le16$이므로 최댓값 16
  detect_cue: $n<16$ 대신 $n\le16$ 또는 $n=16$을 답으로 씀
  feedback: $n=16$이면 $a_{16}=0$이므로 $a_n>0$이 아닙니다. 엄밀한 부등호에서 경계값은 제외하세요.
- id: MC-CAL-9833
  name: '극대·극소 혼동: 극대인 $x=2$의 함숫값을 극솟값으로 답함'
  concepts: []
  item: HSN-G26H-13
  outcome_code: '71'
  wrong_work: $f(2)=-8+6+12-3=7$을 극솟값으로 기술
  detect_cue: $f'(x)=0$의 두 근 중 $x=2$의 값을 구하고 끝남
  feedback: $x=2$는 극대입니다. 다른 근 $x=-1$의 전후에서 $f'$의 부호가 $-$에서 $+$로 바뀌는지 확인해 극소를 찾으세요.
- id: MC-ALG-9834
  name: $(2+a)^2=25$에서 음의 근 $-5$를 누락하고 $a=3$만 답함
  concepts: []
  item: HSN-G26H-14
  outcome_code: '71'
  wrong_work: $(2+a)^2=25$이므로 $2+a=5$, $a=3$
  detect_cue: $a=3$ 하나만 쓰고 $a=-7$이 없다
  feedback: 제곱이 $25$인 수는 $5$와 $-5$ 둘입니다. $2+a=\pm5$를 모두 고려하세요.
- id: MC-GEO-9835
  name: 평행사변형의 밑변을 $2k$로 잡는 등 점의 $x$좌표 간격 오류
  concepts: []
  item: HSN-G26H-15
  outcome_code: '71'
  wrong_work: 넓이 $2k\cdot3=6$에서 $k=1$을 얻어 $a\sin\dfrac\pi3=\dfrac32$로 $a=\sqrt3$
  detect_cue: 밑변을 $CD$가 아닌 $3+k$와 $3$ 사이의 길이로 설정
  feedback: 점 $C$, $D$는 $x=3$에 대해 대칭이므로 $\overline{CD}=(6-k)-(3+k)=3-2k$입니다. 좌표로 길이를 직접 구하세요.
- id: MC-ALG-9836
  name: $\left(\dfrac19\right)^x$을 $3^{2x}$로 변환(음의 부호 누락)
  concepts: []
  item: HSN-G26N-06
  outcome_code: '71'
  wrong_work: $3^{2x}<3^{10-4x}$에서 $2x<10-4x$, $x<\dfrac53$이므로 개수 1
  detect_cue: 밑을 $3$으로 맞추며 지수의 부호를 바꾸지 않음
  feedback: $\dfrac19=3^{-2}$이므로 $\left(\dfrac19\right)^x=3^{-2x}$입니다. 역수는 지수의 부호를 바꿉니다.
- id: MC-CAL-9837
  name: 정적분 $\int_0^1 f(t)\,dt$를 상수로 보지 않고 $f(x)$로 바꿔 미분
  concepts: []
  item: HSN-G26N-07
  outcome_code: '71'
  wrong_work: '양변 미분: $f(x)=6x^2-6xf(x)$'
  detect_cue: $\int_0^1 f(t)\,dt$에 대해 미분하거나 $f(x)$를 대입
  feedback: 상한이 $1$인 정적분은 $x$와 무관한 상수입니다. $k$로 놓고 $x$에 대한 미분에서는 상수로 취급하세요.
- id: MC-ALG-9838
  name: '자연수 조건 누락: $n=1$을 대입해 $m=2\sqrt2$로 답함'
  concepts: []
  item: HSN-G26N-08
  outcome_code: '71'
  wrong_work: $n=1$이면 $m=(2)^{3/2}=2\sqrt2$이므로 $m+n=1+2\sqrt2$
  detect_cue: $m$이 자연수인지 확인하지 않고 가장 작은 $n$을 택함
  feedback: $m^2=(2n)^3$을 만족하는 $m$이 자연수여야 합니다. $(2n)^3$이 완전제곱수가 되는 $n$부터 찾으세요.
- id: MC-ALG-9839
  name: 소거 후 남는 끝항을 $a_{n-1}$로 착각
  concepts: []
  item: HSN-G26N-09
  outcome_code: '71'
  wrong_work: $\sum_{k=1}^{n-1}(a_k-a_{k+1})=a_1-a_{n-1}$
  detect_cue: 합의 마지막 항 $a_{n-1}-a_n$을 보지 않음
  feedback: $k=n-1$일 때의 항이 $a_{n-1}-a_n$이므로 남는 항은 $a_1-a_n$입니다. 처음 몇 항과 마지막 항을 직접 써 보세요.
- id: MC-ALG-9840
  name: 제곱수열의 공비를 $2$로 착각
  concepts: []
  item: HSN-G26N-10
  outcome_code: '71'
  wrong_work: $\{a_n^2\}$의 공비 $2$, 첫째항 $16$으로 $S_n=16(2^n-1)$
  detect_cue: $a_n$의 공비를 그대로 $\{a_n^2\}$에 사용
  feedback: 공비가 $r$인 수열을 제곱하면 공비는 $r^2$입니다. $a_n^2=16\cdot4^{n-1}$처럼 직접 전개해 확인하세요.
- id: MC-CAL-9841
  name: 연속 조건($a+b=4$)만 쓰고 미분계수 조건을 쓰지 않음
  concepts: []
  item: HSN-G26N-11
  outcome_code: '71'
  wrong_work: $a+b=4$에서 $a=3,b=1$ 등 임의로 택하거나 $a-b$를 정하지 못함
  detect_cue: 연속 조건 한 줄 후 풀이가 끝남
  feedback: 미분가능은 연속보다 강한 조건입니다. 좌미분계수와 우미분계수가 같다는 식을 하나 더 세우세요.
- id: MC-GEO-9842
  name: 코사인법칙에서 $\cos$ 항의 부호를 바꿈
  concepts: []
  item: HSN-G26N-12
  outcome_code: '71'
  wrong_work: $24=27+x^2+2\cdot3\sqrt3\cdot x\cdot\dfrac{\sqrt3}{3}$로 $x^2+6x+3=0$, (라) $6$
  detect_cue: 제2코사인법칙의 $-2bc\cos$ 대신 $+$를 사용
  feedback: 코사인법칙은 $a^2=b^2+c^2-2bc\cos A$입니다. 대입 후 부호를 한 번 더 확인하세요.
- id: MC-CAL-9843
  name: 위로 볼록을 아래로 볼록($a>0$)으로 읽어 극대·극소 위치를 뒤바꿈
  concepts: []
  item: HSN-G26N-13
  outcome_code: '71'
  wrong_work: '$a>0$로 두고 $x=0$을 극대, $x=2$를 극소로 대입: $C=3$, $f(2)=-1$에서 $a=3$'
  detect_cue: 그래프의 볼록 방향과 $f'$ 부호 변화를 확인하지 않음
  feedback: $x=0$ 전후에서 $f'$가 $-$에서 $+$로 바뀌면 극소입니다. 그래프에서 부호를 읽고 $a<0$을 확인하세요.
- id: MC-ALG-9844
  name: 대칭 짝짓기에서 $x=\dfrac\pi2$를 두 번 세거나 누락하여 근의 개수를 잘못 셈
  concepts: []
  item: HSN-G26N-14
  outcome_code: '71'
  wrong_work: 근을 $6$개로 보고 $3\pi\times$ 짝 $3$개 $=\dfrac{9\pi}{1}$ 등으로 계산
  detect_cue: 교점 개수를 세지 않고 합을 계산
  feedback: 그래프로 교점이 $7$개임을 먼저 확인하세요. $x=\dfrac\pi2$는 대칭축 위의 단독 근이어서 짝이 없습니다.
- id: MC-CAL-9845
  name: $f(x)=x^2$ 하나만 택하고 구간별 선택을 고려하지 않음
  concepts: []
  item: HSN-G26N-15
  outcome_code: '71'
  wrong_work: $f(x)=x^2$이므로 $f(-2)=4$, $f'(2)=4$, 합 $8$
  detect_cue: (나)에서 $x=-1$의 미분 불가능을 쓰지 않음
  feedback: (나)는 $x=-1$에서 $x^2$과 $1$이 바뀌며 꺾임이 있다는 뜻입니다. $f$가 연속이고 $x^2=1$인 지점에서만 식이 바뀔 수 있음을 이용하세요.
