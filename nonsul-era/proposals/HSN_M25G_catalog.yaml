# 한신대 2025학년도 논술가이드북 모의문제(HSN-M25G-05~08) 오개념 후보 — 번호대 98xx
misconceptions:
- id: MC-ALG-9865
  name: 지수의 뺄셈 a²−b² 를 거듭제곱의 뺄셈 3^(a²)−3^(b²) 로 분리
  item: HSN-M25G-05
  wrong_work: '$3^{a^2-b^2}=3^{a^2}-3^{b^2}$'
  detect_cue: 지수 위의 차를 밑의 거듭제곱의 차로 쓴다
  feedback: 지수의 뺄셈은 나눗셈 $3^{a^2}/3^{b^2}$ 이 된다. $a^2-b^2=(a+b)(a-b)$ 로 인수분해하여 쓴다.
- id: MC-ALG-9866
  name: 등차수열 일반항 a+(n−1)d 에서 (n−1) 을 n 으로 씀
  item: HSN-M25G-06
  wrong_work: '$a_{2025}=1+2025d=4051$'
  detect_cue: 항 번호 그대로를 공차에 곱한다
  feedback: 첫째항에서 $n-1$ 번 공차를 더한다. $a_n=a+(n-1)d$.
- id: MC-CAL-9867
  name: 분수식의 극한에서 곱의 최고차항 계수의 일부를 빠뜨림
  item: HSN-M25G-07
  wrong_work: '$\lim\frac{(3x-7)(2x^2+1)}{x(x^2+7)}=3$'
  detect_cue: 분자 최고차항 계수를 3 으로만 본다
  feedback: 분자 $(3x-7)(2x^2+1)$ 의 최고차항은 $6x^3$ 이다. 곱의 계수를 모두 곱한다.
- id: MC-CAL-9868
  name: 곡선과 x축으로 둘러싸인 넓이를 부호 구분 없이 ∫f(x)dx 로 계산
  item: HSN-M25G-08
  wrong_work: '$\int_0^2 f(x)\,dx=0$ 이므로 넓이 0'
  detect_cue: 구간 [0,1]과 [1,2]에서 부호가 다름을 확인하지 않는다
  feedback: 넓이는 $\int|f(x)|dx$. 부호가 바뀌는 점에서 구간을 나눈다.
