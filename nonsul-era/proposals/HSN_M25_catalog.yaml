# 한신대 2025학년도 모의논술고사(HSN-M25-01~04) 오개념 후보 — db/misconceptions.yaml 반영 전 제안(번호대 98xx)
misconceptions:
- id: MC-ALG-9861
  name: 분수지수의 거듭제곱 (a^m)^n 을 지수의 덧셈 a^(m+n) 으로 계산
  item: HSN-M25-01
  wrong_work: '$\left(a^{\frac16}\right)^{\frac32}=a^{\frac16+\frac32}=a^{\frac53}$'
  detect_cue: 지수를 더해 5/3 제곱을 얻는다
  feedback: 거듭제곱의 거듭제곱은 지수를 곱한다. $(a^m)^n=a^{mn}$.
- id: MC-ALG-9862
  name: 제곱의 합 Σk² 를 (Σk)² 로 계산
  item: HSN-M25-02
  wrong_work: '$\sum_{k=1}^{N}k^2=\left(\frac{N(N+1)}{2}\right)^2$'
  detect_cue: 우변 합 공식과 같은 꼴의 제곱이 나온다
  feedback: $\sum k^2=\frac{N(N+1)(2N+1)}{6}$. 합의 제곱과 제곱의 합은 다르다.
- id: MC-ALG-9863
  name: tan²θ=1 에서 tanθ=±1 의 해를 주어진 범위 확인 없이 모두 취함
  item: HSN-M25-03
  wrong_work: '$\tan\theta=\pm1$ 이므로 $\theta=\frac{3}{4}\pi,\ \frac54\pi,\ \frac74\pi$'
  detect_cue: 범위 $\pi<\theta<\frac32\pi$ 밖의 각이 답에 섞인다
  feedback: 제3사분면에서 $\tan\theta>0$ 이므로 $\tan\theta=1$ 만 가능하다.
- id: MC-CAL-9864
  name: 근과 계수의 관계를 쓰면서 판별식으로 실근의 존재를 확인하지 않음
  item: HSN-M25-04
  wrong_work: '$a^2-5a-4=0$ 에서 곧바로 두 근의 합 5 (판별식 언급 없음)'
  detect_cue: 근이 실수인지 확인하는 줄이 없다
  feedback: '실수 $a$ 의 값을 묻는 문제는 $D>0$ 로 서로 다른 두 실근임을 먼저 확인한다.'
