# 한국항공대 2025학년도(G25E·G25S) 오개념 후보 — 공용 카탈로그(db/misconceptions.yaml) 반영 전 제안.
# ID 범위 MC-*-82501~82599. concepts 의 CON-* 는 db/concepts.yaml 에 아직 없는 제안 개념(반영 시 함께 추가).
# used_in: 이 오개념이 나올 만한 문항·소문항(문항 파일에는 카탈로그 반영 후 misconceptions 로 연결).
misconceptions:
- id: MC-CAL-82501
  name: 곡선 밖의 한 점에서 그은 접선을 구할 때 접점을 미지수로 두지 않고 그 점을 접점으로 취급
  concepts: [CON-CAL-TANGENT-FROM-POINT]
  used_in: ['KAU-G25E-01 소문항 2(3)']
- id: MC-CAL-82502
  name: 서로 다른 두 접선의 조건을 접점에 대한 이차방정식의 판별식 D≥0(등호 포함)으로 처리
  concepts: [CON-CAL-TANGENT-FROM-POINT]
  used_in: ['KAU-G25E-01 소문항 2(3)']
- id: MC-CAL-82503
  name: 구분구적법에서 Δx, x_k 의 대응을 잘못 잡아 적분 구간을 틀리게 설정(예 Δx=2/n 이면서 구간을 [0,2] 로 둠)
  concepts: [CON-CAL-RIEMANN-SUM]
  used_in: ['KAU-G25E-01 소문항 3']
- id: MC-CAL-82504
  name: 치환적분에서 피적분함수만 바꾸고 적분 구간을 새 변수의 값으로 바꾸지 않음
  concepts: [CON-CAL-SUBSTITUTION]
  used_in: ['KAU-G25E-01 소문항 3']
- id: MC-CAL-82505
  name: 두 곡선이 한 점에서 접하는 조건에서 함숫값의 일치만 쓰고 미분계수의 일치를 빠뜨림
  concepts: [CON-CAL-COMMON-TANGENT]
  used_in: ['KAU-G25E-01 소문항 4(2)']
- id: MC-CAL-82506
  name: h(t) 를 미분할 때 α 가 상수임을 놓치고 α'(t) 를 끼워 넣거나 ln(P(t)/(6α)) 의 미분을 P'(t)/P(t) 로 정리하지 못함
  concepts: [CON-CAL-LOG-DIFF]
  used_in: ['KAU-G25E-01 소문항 4(2)']
- id: MC-CAL-82507
  name: 짝함수로 확장된 절댓값 함수에서 대칭점 x=0 과 x<0 쪽 꺾이는 점(-3, -4)을 놓침
  concepts: [CON-CAL-DIFFERENTIABILITY]
  used_in: ['KAU-G25S-01 소문항 2(2)']
- id: MC-CAL-82508
  name: 한쪽 미분계수만 계산하고 좌미분계수와 우미분계수의 일치를 확인하지 않음
  concepts: [CON-CAL-DIFFERENTIABILITY]
  used_in: ['KAU-G25S-01 소문항 2(1)']
- id: MC-CAL-82509
  name: 점과 직선 사이의 거리의 최대를 구간 양 끝점 비교로만 판단하고 접선 조건(기울기 일치)을 쓰지 않음
  concepts: [CON-CAL-DISTANCE-TANGENT]
  used_in: ['KAU-G25S-01 소문항 3(4)']
- id: MC-CAL-82510
  name: 구간별로 정의된 함수의 정적분을 구간을 나누지 않고 한 식으로 계산
  concepts: [CON-CAL-PIECEWISE-INTEGRAL]
  used_in: ['KAU-G25S-02 소문항 4']
- id: MC-CAL-82511
  name: 극값 판정에서 h'(a)=0 의 해 중 조건 a>2 를 벗어나는 해(a=-√6)를 제외하지 않음
  concepts: [CON-CAL-EXTREMA-DOMAIN]
  used_in: ['KAU-G25S-02 소문항 4']
- id: MC-ALG-82501
  name: 수열의 극한의 대소 관계를 쓸 때 부등식을 n² 으로 나눈 뒤 양 끝의 극한이 같음을 확인하지 않고 중간 항의 극한을 임의로 정함
  concepts: [CON-ALG-SQUEEZE]
  used_in: ['KAU-G25E-01 소문항 1']
- id: MC-ALG-82502
  name: 이차함수의 그래프가 x축과 만나지 않는 조건을 D≤0 으로 처리(등호 포함)
  concepts: [CON-ALG-DISCRIMINANT]
  used_in: ['KAU-G25E-01 소문항 1']
- id: MC-ALG-82503
  name: 항등식에 인수가 0이 되는 값을 대입하지 않고 계수 비교만 시도하여 미지수가 많은 연립방정식에서 막힘
  concepts: [CON-ALG-IDENTITY-SUBSTITUTION]
  used_in: ['KAU-G25E-02 소문항 1']
- id: MC-ALG-82504
  name: z·conj(z)=2 를 |z|=2 로 읽어 반지름을 2 로 잡음(|z|²=2 이므로 |z|=√2)
  concepts: [CON-ALG-CONJUGATE]
  used_in: ['KAU-G25S-01 소문항 1']
- id: MC-ALG-82505
  name: 등비수열의 일반항에서 지수를 n 이 아니라 n-1 로 쓰지 않음(첫째항 2 일 때 a_n=2(1/3)^n 으로 오기)
  concepts: [CON-ALG-GEOMETRIC-TERM]
  used_in: ['KAU-G25S-01 소문항 3(1)']
- id: MC-ALG-82506
  name: 원이 두 직선에 접하는 조건의 절댓값식 |A|=|B| 에서 부호가 같은 경우 하나만 풀고 부호가 반대인 경우(a=1)를 빠뜨림
  concepts: [CON-ALG-ABS-CASES]
  used_in: ['KAU-G25S-02 소문항 1']
- id: MC-ALG-82507
  name: n²-2na<0 과 0≤a<1 에서 n²<2n 을 이끌지 못하고 n 을 확정하지 않은 채 k 의 범위를 구하려 함
  concepts: [CON-ALG-INEQUALITY-CHAIN]
  used_in: ['KAU-G25S-02 소문항 2']
- id: MC-ALG-82508
  name: 사인함수와 y=c 의 교점 개수에서 c=0 의 양 끝점 포함과 c=1 의 접점(주기당 1개)을 일반 경우(주기당 2개)와 구분하지 않음
  concepts: [CON-ALG-PERIODIC-INTERSECTION]
  used_in: ['KAU-G25S-02 소문항 3']
- id: MC-GEO-82501
  name: 삼각형의 내접원에서 접선의 길이(AZ=AW, BX=BZ, CX=CW)와 접선 PY=PZ 의 성질을 사용하지 못함
  concepts: [CON-GEO-TANGENT-LENGTH]
  used_in: ['KAU-G25E-02 소문항 2(2),(3)']
- id: MC-GEO-82502
  name: 사인법칙 비 PA/PY 에서 대응하는 각과 변을 잘못 짝지음(변과 마주 보는 각을 혼동)
  concepts: [CON-GEO-SINE-RULE]
  used_in: ['KAU-G25E-02 소문항 2(2)']
- id: MC-GEO-82503
  name: 코사인법칙에서 cos∠BAC 와 cos∠PAQ 를 같은 각으로 보고 식을 세우는 근거(같은 각)를 밝히지 않거나 AQ, PQ 를 y 로 잘못 표현
  concepts: [CON-GEO-COSINE-RULE]
  used_in: ['KAU-G25E-02 소문항 2(3)']
