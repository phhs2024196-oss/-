  name: 밑이 0<a<1인 지수·로그함수를 증가함수로 보고 최댓·최솟값이 생기는 끝점을 잘못 잡음
  concepts: []
  items: [KNG-M26E-01, KNG-M26-01]
- id: MC-ALG-4651
  name: 경우 분류에서 구한 값이 그 경우의 조건($a>1$ 또는 $0<a<1$)을 만족하는지 확인하지 않고 해로 채택함
  concepts: []
  items: [KNG-M26E-01, KNG-M26-01]
- id: MC-ALG-4652
  name: $\tan\theta=1$에서 주어진 각의 범위를 보지 않고 $\theta=\frac\pi4$로 정함
  concepts: []
  items: [KNG-M26E-02]
