# 문항별 오개념 연결 제안 — MC-*-46xx/47xx 를 db/misconceptions.yaml 에 병합한 뒤 각 문항 subparts[].misconceptions 로 옮긴다

KNG-G26E-04:
  - id: MC-ALG-4605
    outcome_code: '71'
    wrong_work: $a>1$이므로 $a^{-x}$는 증가하고 $x=-1$에서 최솟값 $3a=2$, $a=\dfrac23$
    detect_cue: $a^{-x}$를 $a^x$처럼 증가함수로 보았다
    feedback: $a^{-x}=\left(\dfrac1a\right)^x$이므로 $a>1$이면 감소합니다. 밑 $\dfrac1a$를 먼저 확인하세요.
    remedy: []
  - id: MC-ALG-4606
    outcome_code: '72'
    wrong_work: $f(0)=1+2a=2$에서 $a=\dfrac12$이 답
    detect_cue: 구한 값이 가정한 범위 $a>1$에 속하는지 확인하지 않았다
    feedback: 경우를 나누어 구한 값은 그 경우의 조건에 맞아야 합니다. $\dfrac12<1$이므로 이 경우의 해가 아닙니다.
    remedy: []
KNG-G26E-05:
  - id: MC-ALG-4607
    outcome_code: '71'
    wrong_work: 주기 $\dfrac{2\pi}{4}=\dfrac{\pi}{2}$
    detect_cue: 탄젠트함수의 주기에 사인·코사인의 주기 $2\pi$를 사용했다
    feedback: $y=\tan x$의 주기는 $\pi$이므로 $\tan 4x$의 주기는 $\dfrac{\pi}{4}$입니다.
    remedy: []
  - id: MC-ALG-4608
    outcome_code: '71'
    wrong_work: $f\left(\dfrac{\pi}{4}\right)=4\tan\left(\pi+\dfrac{\pi}{4}\right)-1=3$
    detect_cue: $x=\dfrac{\pi}{4}$를 $4x$ 자리에서 4배 하지 않고 대입했다
    feedback: $4x$에 $x=\dfrac{\pi}{4}$를 대입하면 $\pi$이므로 $\tan 2\pi=0$입니다.
    remedy: []
  - id: MC-ALG-4609
    outcome_code: '71'
    wrong_work: 점 $(0,0)$ 또는 $(0,1)$에 대하여 대칭
    detect_cue: 평행이동 $y\to y-1$을 대칭의 중심에 반영하지 않았거나 부호를 반대로 적용했다
    feedback: 그래프를 $y$축 방향으로 $-1$만큼 옮기면 대칭의 중심도 $(0,0)$에서 $(0,-1)$로 옮겨집니다.
    remedy: []
KNG-G26E-06:
  - id: MC-CAL-4610
    outcome_code: '71'
    wrong_work: $f(x+h)-f(x)=x^2+h^2-6x-6h-x^2+6x$
    detect_cue: $(x+h)^2$을 $x^2+h^2$으로 전개했다
    feedback: $(x+h)^2=x^2+2xh+h^2$입니다. 교차항 $2xh$를 빠뜨리지 마세요.
    remedy: []
  - id: MC-CAL-4611
    outcome_code: '72'
    wrong_work: $f'(a)=1$이므로 $2a-6=1$, $a=\dfrac72$
    detect_cue: 수직 조건을 기울기가 같다(평행)로 처리했다
    feedback: 두 직선이 수직이면 기울기의 곱이 $-1$입니다. 접선의 기울기는 $-1$이어야 합니다.
    remedy: []
KNG-G26E-07:
  - id: MC-ALG-4612
    outcome_code: '71'
    wrong_work: $\lvert a_{15}\rvert=\lvert a_{25}\rvert$에서 $a_{15}=a_{25}$만 두어 $d=0$을 얻음
    detect_cue: 절댓값 방정식에서 부호가 반대인 경우 $a_{15}=-a_{25}$를 고려하지 않았다
    feedback: $\lvert A\rvert=\lvert B\rvert$이면 $A=B$ 또는 $A=-B$입니다. $A=B$는 $d\neq0$에 모순입니다.
    remedy: []
  - id: MC-ALG-4613
    outcome_code: '72'
    wrong_work: $S_5=\dfrac{5(2a_1+5d)}{2}=85$
    detect_cue: 등차수열의 합에서 $(n-1)d$ 자리에 $nd$를 썼다
    feedback: $S_n=\dfrac{n\{2a_1+(n-1)d\}}{2}$이므로 $S_5=\dfrac{5(2a_1+4d)}{2}$입니다.
    remedy: []
KNG-G26E-08:
  - id: MC-CAL-4614
    outcome_code: '71'
    wrong_work: 극한값이 존재할 조건을 $a^2+a=a^2+2a$로 놓아 $a=0$만 구함
    detect_cue: 극한값의 존재 조건(좌극한=우극한)과 연속 조건(극한값=함숫값)을 혼동했다
    feedback: 극한값이 존재하려면 좌극한과 우극한이 같으면 됩니다. 함숫값과의 비교는 연속 조건에서 합니다.
    remedy: []
  - id: MC-CAL-4615
    outcome_code: '72'
    wrong_work: $x\to a+$에서 $g(x)=a$, $x\to a-$에서 $g(x)=-x+3a$로 놓아 $a^2+2a=2a$, $a=0$만 구함
    detect_cue: 구간별 함수의 경계 $x<a$, $x\ge a$를 좌우극한에 반대로 적용했다
    feedback: $x\to a-$이면 $x<a$이므로 $g(x)=a$, $x\to a+$이면 $x>a$이므로 $g(x)=-x+3a$입니다.
    remedy: []
KNG-G26E-09:
  - id: MC-CAL-4616
    outcome_code: '71'
    wrong_work: $\displaystyle\int_{-1}^{1}f'(t)\,dt=f(1)+f(-1)=2+2b=0$에서 $b=-1$
    detect_cue: 정적분의 값을 $F(1)-F(-1)$이 아니라 $F(1)+F(-1)$로 계산했다
    feedback: $\displaystyle\int_a^bf'(t)\,dt=f(b)-f(a)$입니다. 상한값에서 하한값을 뺍니다.
    remedy: []
  - id: MC-CAL-4617
    outcome_code: '72'
    wrong_work: $g$가 $x=1$에서 극소이므로 $g(1)=0$
    detect_cue: 극값의 조건을 $g'(1)=0$이 아니라 $g(1)=0$으로 적었다
    feedback: 극값에서는 함숫값이 아니라 미분계수가 0입니다. $g'(x)=f(x)$이므로 $f(1)=0$입니다.
    remedy: []
  - id: MC-CAL-4618
    outcome_code: '73'
    wrong_work: $g'(x)=x^2-1$의 부호를 따지지 않고 $x=1$에서 최댓값, $x=2$에서 최솟값이라 함
    detect_cue: 구간 $[1,2]$에서의 증감을 확인하지 않고 최대·최소 위치를 정했다
    feedback: $[1,2]$에서 $g'(x)=x^2-1\ge0$이므로 $g$는 증가합니다. 따라서 $x=1$에서 최소, $x=2$에서 최대입니다.
    remedy: []
KNG-G26E-10:
  - id: MC-CAL-4619
    outcome_code: '71'
    wrong_work: (가)에서 $f(x)=(x-k)(x-2k)(x-c)$로 놓고 $c$를 미정으로 둠
    detect_cue: 실근이 $k$, $2k$뿐이라는 조건에서 제3의 근 $c$가 $k$ 또는 $2k$(중근)임을 읽지 못했다
    feedback: 실근이 $k$, $2k$뿐이면 삼차방정식의 세 근 중 하나는 중근입니다. 중근이 $k$인 경우와 $2k$인 경우로 나누세요.
    remedy: []
  - id: MC-CAL-4620
    outcome_code: '72'
    wrong_work: $f(x)=(x-k)^2(x-2k)$ 한 가지만 놓고 (나)에서 $k$를 구하려 함
    detect_cue: 두 경우를 (나)에 대입해 걸러내지 않고 한 경우만 택했다
    feedback: $f(x)=(x-k)^2(x-2k)$이면 $\displaystyle\lim_{x\to k}\dfrac{f(x)}{x-k}=0$이므로 (나)에 맞지 않습니다. 두 경우를 모두 확인하세요.
    remedy: []
KNG-G26H-09:
  - id: MC-ALG-4601
    outcome_code: '71'
    wrong_work: $M-m=\log_2 2k-\log_2 k=\log_2(2k-k)=\log_2 k$
    detect_cue: 로그의 차를 진수의 차의 로그로 계산했다
    feedback: $\log_2 a-\log_2 b=\log_2\dfrac{a}{b}$이다. 진수의 차가 아니라 몫을 쓰세요.
    remedy: []
KNG-G26H-10:
  - id: MC-CAL-4604
    outcome_code: '71'
    wrong_work: $f'(x)=\dfrac13x^2-1$
    detect_cue: $x^3$의 미분에서 계수 3을 곱하지 않고 지수만 낮췄다
    feedback: $(x^n)'=nx^{n-1}$이므로 $\left(\dfrac13x^3\right)'=x^2$입니다.
    remedy: []
  - id: MC-CAL-4602
    outcome_code: '71'
    wrong_work: 극댓값은 $-1$이다
    detect_cue: 극값(함숫값)을 구하라는 물음에 극점의 $x$좌표를 답했다
    feedback: 극댓값은 극대가 되는 $x$의 값이 아니라 그때의 함숫값 $f(-1)$입니다.
    remedy: []
  - id: MC-CAL-4602
    outcome_code: '71'
    wrong_work: 극솟값은 $1$이다
    detect_cue: 극값(함숫값)을 구하라는 물음에 극점의 $x$좌표를 답했다
    feedback: 극솟값은 극소가 되는 $x$의 값이 아니라 그때의 함숫값 $f(1)$입니다.
    remedy: []
  - id: MC-CAL-4603
    outcome_code: '71'
    wrong_work: $\displaystyle\int_0^{\sqrt3}f(x)\,dx=\dfrac34$
    detect_cue: 정적분 값을 넓이로 착각해 음수를 양수로 바꿨다
    feedback: 구간에서 $f(x)\le0$이면 정적분은 음수입니다. 정적분은 넓이가 아닙니다.
    remedy: []
KNG-M27-01:
  - id: MC-ALG-4700
    outcome_code: '70'
    wrong_work: $4^{\log_2 x}=2x$로 계산하여 $2x+(-4x)+y=0$
    detect_cue: 지수의 밑 $4$를 $2$로 바꾸면서 지수 $\log_2 x$에 $2$가 곱해지는 것을 놓쳐 $2^{\log_2 x}=x$로 처리했다
    feedback: $4^{\log_2 x}=(2^2)^{\log_2 x}=2^{2\log_2 x}=x^2$처럼 지수 $2$가 로그 안으로 들어가는 과정을 확인하세요.
    remedy: []
KNG-M27-02:
  - id: MC-ALG-4701
    outcome_code: '70'
    wrong_work: $a_5+a_9=8$을 $a_1+a_5=4$에 더해 $a_1+2a_5+a_9=12$로만 처리하고 공비를 구하지 못함
    detect_cue: $a_5+a_9=r^4(a_1+a_5)$로 묶는 등비수열의 성질(항 사이의 비 $r^4$)을 쓰지 못했다
    feedback: $a_9=a_5r^4$, $a_5=a_1r^4$이므로 $a_5+a_9=r^4(a_1+a_5)$임을 이용해 $r^4=2$를 먼저 구하세요.
    remedy: []
KNG-M27-03:
  - id: MC-CAL-4702
    outcome_code: '70'
    wrong_work: $f(x)=x^3+|x|$에서 $x=0$이 미분불가능하므로 극값이 아니라 하고 극댓값만 답함
    detect_cue: 극값은 $f'(x)=0$인 점에서만 생긴다고 생각해 미분불가능한 점 $x=0$을 후보에서 제외했다
    feedback: $x=0$에서 연속이고 $f'(x)$의 부호가 음에서 양으로 바뀌면 미분불가능해도 극소임을 확인하세요.
    remedy: []
KNG-M27-04:
  - id: MC-CAL-4703
    outcome_code: '70'
    wrong_work: (가)에서 $f(0)=0$과 $f'(0)=0$까지 요구하여 $b=0$으로 놓음
    detect_cue: $\lim_{x\to0}\dfrac{f(x)}{x}$의 값이 존재하는 조건을 $f(0)=0$이 아니라 극한값이 $0$이어야 한다고 오해했다
    feedback: 분모가 $0$으로 가는 극한이 존재하려면 분자 $f(x)\to0$, 즉 $f(0)=0$만 필요하고 극한값은 $f'(0)=b$임을 확인하세요.
    remedy: []
