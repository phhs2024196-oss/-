  - CON-PRB-DRAW-ORDER-SYMMETRY
- id: MC-PRB-7211
  name: 상금이 겹치는 경우(두 번 모두 당첨)를 빠뜨리거나 중복하여 확률분포를 잘못 세움
  concepts:
  - CON-PRB-EXPECTATION-DISCRETE
