  - CON-GEO-INSCRIBED-ANGLE
  - CON-GEO-DOT-PRODUCT
- id: MC-CAL-7209
  name: 항의 개수가 늘어나는 합의 극한을 각 항의 극한(0)만 보고 결정
  concepts:
  - CON-CAL-RIEMANN-SUM
- id: MC-PRB-7210
