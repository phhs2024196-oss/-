# KUT 2019 오개념 후보(카탈로그 승격 전). 문항 YAML 에는 아직 연결하지 않음
misconceptions:
- id: MC-ALG-481901
  name: 귀납적 관계식에서 열매가 나무가 되는 시차(2년)를 잘못 반영
  item: KUT-M19A-01
  subpart: 1-1
  outcome_code: '71'
  wrong_work: $a_{n+2}=a_{n+1}+2a_{n+1}$ 또는 $a_{n+1}=a_n+2a_n$ (열매에서 나무가 되는 시차를 1년 또는 0년으로 셈)
  detect_cue: 관계식에 $a_n$, $a_{n+1}$, $a_{n+2}$ 가 모두 나타나지 않거나 계수가 $2a_n$ 이 아니다.
  feedback: 열매는 심은 다다음해에야 열매를 맺는 나무가 됩니다. $(n+2)$년 후의 나무는 $(n+1)$년 후의 나무 전부와 $n$년 후의 나무가 남긴 열매 2개씩으로 이루어집니다.
- id: MC-CAL-481902
  name: 도함수의 연속 조건을 쓰지 않아 이차식의 일차항 계수를 정하지 못함
  item: KUT-M19A-02
  subpart: 1-1
  outcome_code: '71'
  wrong_work: $g(x)=ax^2+bx+c$ 에 $(0,-9)$ 와 $(5,0)$ 만 대입하고 도함수의 연속 조건을 쓰지 않아 $b$ 를 구하지 못함 (또는 $g(x)=ax^2-9$ 로 놓고 $b=0$ 의 근거를 쓰지 않음)
  detect_cue: $b=0$ 의 근거로 $f'(0)=g'(0)$ 가 쓰여 있지 않다.
  feedback: 성질 c의 둘째 문장은 도함수가 $x=0$에서 연속이라는 뜻입니다. $f'(0^-)=g'(0^+)$ 로 $b$ 를 정하세요.
- id: MC-PRB-481903
  name: 조건을 나눈 경우 중 하나만 계산하고 전체 확률로 답함
  item: KUT-M19A-03
  subpart: 1-1
  outcome_code: '71'
  wrong_work: $P(B)$ 를 $P(A\cap B)=\dfrac{8}{45}$ 만으로 답함 (검은 공을 옮긴 경우 누락)
  detect_cue: $P(A^{C}\cap B)$ 또는 $\dfrac{9}{45}$ 가 없다.
  feedback: 주머니 B에 넣는 공이 검은 공인 경우도 흰 공을 뽑을 수 있습니다. 두 경우를 모두 더하세요.
- id: MC-PRB-481904
  name: 조건부확률 P(A|B)와 P(B|A)를 뒤바꿈
  item: KUT-M19A-03
  subpart: 1-2
  outcome_code: '71'
  wrong_work: $P(B\mid A)=\dfrac{4}{9}$ 를 답으로 씀 (조건과 사건을 뒤바꿈)
  detect_cue: 답이 $\dfrac{4}{9}$ 이거나 분모에 $P(B)$ 가 없다.
  feedback: 구하는 것은 B에서 흰 공이 나온 것을 알 때 A에서 흰 공을 옮겼을 확률 $P(A\mid B)$ 입니다. 조건이 되는 사건이 분모에 옵니다.
- id: MC-CAL-481905
  name: 접선의 y절편 부호를 제1사분면 조건으로 고르지 않음
  item: KUT-M19B-01
  subpart: 1-1
  outcome_code: '71'
  wrong_work: $k=\pm\sqrt{5}\left(\dfrac{2}{\sqrt{5}}\right)^n$ 에서 부호를 고르지 않고 $a_n$ 을 $\pm$ 로 답함
  detect_cue: 제1사분면 조건이 쓰이지 않았고 $a_n<0$ 인 값도 답에 포함되어 있다.
  feedback: 기울기가 $-2$ 이고 제1사분면을 지나는 접선의 $y$절편은 양수입니다.
- id: MC-CAL-481906
  name: 극댓값·극솟값을 모두 가질 조건에 판별식 D=0(중근)을 포함시킴
  item: KUT-M19B-02
  subpart: 1-1
  outcome_code: '71'
  wrong_work: 판별식을 $\dfrac{D}{4}\ge0$ 으로 두어 $a\le12$ 로 답함 ($a=12$ 이면 $f'(x)=3(x-2)^2\ge0$ 이라 극값이 없음)
  detect_cue: 답이 $a\le12$ 이다.
  feedback: 중근이면 도함수의 부호가 바뀌지 않아 극값이 생기지 않습니다. 서로 다른 두 실근이어야 하므로 $D>0$ 입니다.
- id: MC-PRB-481907
  name: 확률밀도함수 전체 넓이를 구할 때 삼각형 넓이의 1/2을 빠뜨림
  item: KUT-M19B-03
  subpart: 1-1
  outcome_code: '71'
  wrong_work: 삼각형 넓이를 밑변 $\times$ 높이로 계산하여 $20a=1$, $a=\dfrac{1}{20}$ 로 둠
  detect_cue: $a=\dfrac{1}{20}$ 이거나 넓이식에 $\dfrac12$ 이 없다.
  feedback: 밑변이 20이고 높이가 $a$ 인 삼각형의 넓이는 $\dfrac12\times20\times a$ 입니다.
- id: MC-GEO-481908
  name: 닮음비를 세울 때 삼각형 APS의 높이 80-y 대신 y를 씀
  item: KUT-G19A-01
  subpart: 1-1
  outcome_code: '71'
  wrong_work: $\dfrac{x}{100}=\dfrac{y}{80}$ 로 닮음비를 세워 $y=\dfrac45x$ 를 얻음
  detect_cue: $x$ 가 커질수록 $y$ 도 커지는 식이다.
  feedback: 삼각형 $\mathrm{APS}$ 의 높이는 $y$ 가 아니라 $80-y$ 입니다. 직사각형이 커질수록 위쪽 작은 삼각형은 낮아집니다.
- id: MC-CAL-481909
  name: 구간별 부호를 무시하고 |f(x)|의 정적분을 f(x)의 정적분으로 계산
  item: KUT-G19A-02
  subpart: 2-1
  outcome_code: '71'
  wrong_work: $S(a)=\int_{-1}^{2}f(x)dx$ 로 두어 구간별 부호를 무시함
  detect_cue: 절댓값 또는 $-\int_{-1}^{a}$ 가 없다.
  feedback: $y=f(x)$ 는 $[-1,a]$ 에서 $x$축 아래에 있으므로 넓이는 $-f(x)$ 의 적분입니다.
- id: MC-PRB-481910
  name: 인접 버튼 개수를 잘못 세어 정확히 누를 확률을 틀림
  item: KUT-G19A-03
  subpart: 3-2
  outcome_code: '71'
  wrong_work: 1의 이웃을 2, 4, 5 로 세어 $1-\dfrac38=\dfrac58$ 로 답함 (대각선 방향 5 포함)
  detect_cue: 답이 $\dfrac{5}{8}$ 이다.
  feedback: 대각선 방향은 누르지 않는다고 했습니다. 모서리의 1은 상하좌우 중 이웃이 2, 4 두 개뿐입니다.
- id: MC-GEO-481911
  name: 일반형 x^2+y^2+ax+by+c=0 의 계수를 중심 좌표·반지름으로 착각
  item: KUT-G19B-01
  subpart: 1-3
  outcome_code: '71'
  wrong_work: 일반형의 계수를 그대로 읽어 중심 $(2,-4)$, 반지름 $1$ 이라 함
  detect_cue: 중심이 $(a,b)=(2,-4)$ 이거나 반지름이 $c=1$ 이다.
  feedback: 일반형은 완전제곱식으로 고쳐서 $(x+1)^2+(y-2)^2=4$ 로 읽어야 합니다.
- id: MC-CAL-481912
  name: 극솟값 조건에서 f'(-1)=0 만 쓰고 f(-1)=-1 을 빠뜨림
  item: KUT-G19B-02
  subpart: 2-1
  outcome_code: '71'
  wrong_work: $f'(-1)=0$ 만 쓰고 $f(-1)=-1$ 을 쓰지 않아 $3-4a+3b=0$ 한 식으로 $a$, $b$ 를 정하지 못함
  detect_cue: 극솟값 $-1$ 을 사용한 식 $f(-1)=-1$ 이 없다.
  feedback: 극값은 위치($f'(-1)=0$)와 값($f(-1)=-1$) 두 조건을 모두 줍니다.
- id: MC-PRB-481913
  name: 분산 계산에서 E(X^2)-E(X)를 씀
  item: KUT-G19B-03
  subpart: 3-4
  outcome_code: '71'
  wrong_work: $V(X)=E(X^2)-E(X)=\dfrac{32}{15}-\dfrac43=\dfrac45$ (평균을 제곱하지 않음)
  detect_cue: 분산이 $\dfrac{4}{5}$ 이다.
  feedback: 분산은 $E(X^2)-\{E(X)\}^2$ 입니다. 평균을 제곱해서 빼야 합니다.
