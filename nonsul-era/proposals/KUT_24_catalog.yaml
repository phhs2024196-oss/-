  name: 로그 밑 변환에서 log_a b + log_b a 를 (log_2 a)(log_2 b)의 대칭식으로 바꾸지 못하고 각각 따로 계산
  concepts: [CON-ALG-LOG-BASE-CHANGE]
  items: [KUT-G24A-01]
- id: MC-CAL-482402
  name: 극한 lim f(x)/(x-a) 가 존재해도 f(a)=0 임을 쓰지 않고 분자를 그대로 대입
  concepts: [CON-CAL-LIMIT-INDETERMINATE]
  items: [KUT-G24A-02, KUT-G24B-03, KUT-G24B-06]
- id: MC-CAL-482403
  name: 극한값을 미분계수로 해석하지 못하고 g(-1)=-2 만 구한 채 g'(-1)을 구하지 못함
