# 한국기술교육대 2024학년도 실전(KUT-G24A/B) 오개념 후보 — 공용 카탈로그(db/misconceptions.yaml)에는 사람이 검토 후 병합. 문항 파일에는 아직 연결하지 않음(draft).
misconceptions:
