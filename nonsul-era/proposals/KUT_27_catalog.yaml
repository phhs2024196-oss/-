# 한국기술교육대 2027학년도 온라인 모의논술(KUT-M27-01~10) 오개념 후보 — 공용 카탈로그 병합 전 제안
misconceptions:
- id: MC-ALG-482701
  name: 실수 지수에서 (a^m)^n 을 a^{m+n} 으로 계산하는 등 지수법칙을 혼동
  concepts: []
  items: [KUT-M27-01]
- id: MC-ALG-482702
  name: a^2=b^3=c^4 에서 a=k^2, b=k^3, c=k^4 로 지수를 거꾸로 둠(역수 혼동)
  concepts: []
  items: [KUT-M27-02]
- id: MC-ALG-482703
  name: cos x=t 치환 후 t 의 값마다 x 의 개수가 같다고 보아 t=±1 에서 실근이 2개뿐임(경계값)을 반영하지 않음
  concepts: []
  items: [KUT-M27-03]
- id: MC-CAL-482704
  name: x→3 에서 분모가 0 으로 가는 분수의 극한이 존재할 때 분자도 0 으로 가야 함을 쓰지 않고 f(3) 를 구하지 못함
  concepts: []
  items: [KUT-M27-04]
- id: MC-CAL-482705
  name: 근의 집합으로 f(x) 를 세운 뒤 f'(1)=-2 의 두 해 중 f(0)>0 으로 하나를 고르는 검토를 생략
  concepts: []
  items: [KUT-M27-05]
- id: MC-CAL-482706
  name: |f(x)| 의 연속 조건을 f(x) 의 연속 조건(좌극한=우극한)으로 바꾸어 |a^2-4a+3|=|2a-6| 의 ± 두 경우를 놓침
  concepts: []
  items: [KUT-M27-06]
- id: MC-CAL-482707
  name: 우극한이 0 이 아닌 값 f(-1) 이라는 조건에서 분모 f(x)+2 가 0 으로 간다는 것을 한 번만 쓰고 (x+1)^2 인수를 구성하지 못함
  concepts: []
  items: [KUT-M27-07]
- id: MC-CAL-482708
  name: ∫0^x (x-t) f'(t) dt 를 미분할 때 x 를 적분 밖으로 빼지 않고 (x-t) 를 그대로 미분해 f'(x)+f(x)-f(0) 를 얻지 못함
  concepts: []
  items: [KUT-M27-08]
- id: MC-ALG-482709
  name: |t^2-5t+5|>=1 의 해를 t<=1 또는 t>=4 로만 쓰고 2<=t<=3 구간을 빠뜨리거나 [log_a 2, log_a 4] 의 포함 관계를 분류하지 않음
  concepts: []
  items: [KUT-M27-09]
- id: MC-CAL-482710
  name: g'(x)=|f(x)|-|x| 에서 |x| 를 공통인수로 묶지 않고 f(2)<0, f(6)>0 의 부호 조건 없이 Q(2), Q(6) 의 절댓값만으로 값을 정함
  concepts: []
  items: [KUT-M27-10]
