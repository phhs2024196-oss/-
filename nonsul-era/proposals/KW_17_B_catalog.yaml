# 광운대 2017학년도 실전 자연계열(오후) G17B 문제 1·2 — 오개념 후보 (공용 카탈로그 반영 전 제안). ID 구간 MC-*-81730~81759(오후)
misconceptions:
- id: MC-CAL-81730
  name: $\left|\dfrac{x}{1+x^2}\right|$의 최댓값을 $x>0$만 보고 부호 없이 $p$를 음수까지 허용
  concepts:
  - CON-CAL-ABS-RATIONAL-MAX
  used_in: KW-G17B-01#1
  outcome_code: '71'
  wrong_work: $f(-1)=-\dfrac12$을 최솟값으로 보고 $p=-\dfrac12$ 또는 $-\dfrac12\le p\le\dfrac12$
  detect_cue: $|\cdot|$가 있는데 음수 $p$ 등장
  feedback: $\left|\dfrac{x}{1+x^2}\right|\ge0$이므로 최댓값 $\dfrac12$가 $p$의 최솟값입니다. $y$축 대칭이므로 $x>0$만 조사해도 됩니다.
- id: MC-CAL-81731
  name: 극값만 구하고 $x\to\infty$ 극한·$f(0)$ 비교를 생략
  concepts:
  - CON-CAL-GLOBAL-MAX
  used_in: KW-G17B-01#1
  outcome_code: '72'
  wrong_work: $f^{\prime}(1)=0$에서 극대 $\dfrac12$이므로 최대라고 결론
  detect_cue: 끝값 $f(0)=0$, $\lim f=0$ 언급 없음
  feedback: 극대값이 최댓값이려면 정의역 끝의 값·극한과 비교해야 합니다. $x\to\infty$와 $x=0$에서 $0$이므로 $\dfrac12$이 최댓값입니다.
- id: MC-CAL-81732
  name: 타원의 방정식을 $x^2+4y^2=1$처럼 장축 길이와 혼동
  concepts:
  - CON-GEO-ELLIPSE-DEFINITION
  used_in: KW-G17B-01#2
  outcome_code: '71'
  wrong_work: 거리의 합 $4$를 $a=4$로 두어 $\dfrac{x^2}{16}+\dfrac{y^2}{13}=1$
  detect_cue: $b^2=13$ 등장
  feedback: 두 초점으로부터 거리의 합 $4$는 $2a$이므로 $a=2$, $c=\sqrt3$, $b^2=a^2-c^2=1$입니다.
- id: MC-CAL-81733
  name: 치환적분에서 적분 구간을 바꾸지 않음
  concepts:
  - CON-CAL-SUBST-LIMITS
  used_in: KW-G17B-01#2
  outcome_code: '72'
  wrong_work: $x=2\cos\theta$로 치환하고 $\theta$를 $0$에서 $\sqrt3$까지 적분
  detect_cue: 구간에 $\sqrt3$이 $\theta$의 한계로 남음
  feedback: $x=0,\sqrt3$에 해당하는 $\theta$는 $\dfrac{\pi}{2},\dfrac{\pi}{6}$입니다. $dx=-2\sin\theta\,d\theta$의 부호와 구간 순서를 함께 처리해야 합니다.
- id: MC-GEO-81734
  name: 수선의 발을 $\overrightarrow{OH}=\overrightarrow{OA}$ 사영으로 쓰고 부호·크기를 혼동
  concepts:
  - CON-GEO-FOOT-PERPENDICULAR
  used_in: KW-G17B-01#3
  outcome_code: '71'
  wrong_work: $\overrightarrow{OA}\cdot\overrightarrow{OB}$의 부호를 틀리거나 $\dfrac{4}{\sqrt6}$에서 유리화·정리 없이 멈춤
  detect_cue: 답 $\dfrac{2\sqrt6}{3}$과 다름
  feedback: $\overrightarrow{OA}\cdot\overrightarrow{OB}=-2+6+0=4$이고 $\overline{OH}=\dfrac{4}{\sqrt6}=\dfrac{2\sqrt6}{3}$입니다. $H=tB$에서 $t=\dfrac23$인 점의 좌표를 확인하세요.
- id: MC-CAL-81735
  name: 사이값 정리 보조함수에서 $\cos\left(\dfrac{\pi}{2}x\right)$의 부호를 틀림
  concepts:
  - CON-CAL-IVT-AUX
  used_in: KW-G17B-01#4
  outcome_code: '71'
  wrong_work: $g(x)=f(x)-x+\cos\left(\dfrac{\pi}{2}x\right)$로 정의
  detect_cue: $g(\pm1)$ 부호가 맞지 않음
  feedback: $f(c)=c+\cos\left(\dfrac{\pi}{2}c\right)$를 옮기면 $g(x)=f(x)-x-\cos\left(\dfrac{\pi}{2}x\right)$이고 $g(-1)=f(-1)+1>0$, $g(1)=f(1)-1<0$입니다.
- id: MC-CAL-81736
  name: 부분적분의 경계항 $[x^n\cos x]_0^{\pi/2}$를 $0$이 아니라고 처리
  concepts:
  - CON-CAL-BY-PARTS-BOUNDARY
  used_in: KW-G17B-01#5
  outcome_code: '71'
  wrong_work: $I_n=-\left(\dfrac{\pi}{2}\right)^n\cos\dfrac{\pi}{2}+\ldots$에서 경계항 오계산
  detect_cue: 점화식에 $\left(\dfrac{\pi}{2}\right)^n$ 항이 남음
  feedback: $\cos\dfrac{\pi}{2}=0$이므로 첫 번째 경계항은 $0$이고 두 번째 부분적분의 경계항 $n\left(\dfrac{\pi}{2}\right)^{n-1}$만 남습니다.
- id: MC-CAL-81737
  name: 점화식의 계수 $n(n-1)$을 $n^2$ 또는 $n(n+1)$로 씀
  concepts:
  - CON-CAL-RECURRENCE-INTEGRAL
  used_in: KW-G17B-01#5
  outcome_code: '72'
  wrong_work: $I_n+n^2I_{n-2}=n\left(\dfrac{\pi}{2}\right)^{n-1}$
  detect_cue: $I_{100}+9900I_{98}$와 계수가 맞지 않음
  feedback: 두 번 부분적분하면 미분에서 $n$과 $n-1$이 차례로 나와 계수는 $n(n-1)$($n=100$일 때 $9900$)입니다.
- id: MC-ALG-81738
  name: $S$를 '주기가 있는 다항식'으로 오해하여 일차식도 $S$에 포함
  concepts:
  - CON-ALG-POLY-PERIODIC
  used_in: KW-G17B-02#1
  outcome_code: '71'
  wrong_work: $f(x)=f(x+p)$에서 $a_3p^3+\ldots=0$만 보고 일부 계수만 $0$
  detect_cue: $T-S$에 $a_3=0$인 이차식 이하 제외
  feedback: 모든 거듭제곱 항의 계수를 비교하면 $a_3p=0$, $a_2p=0$, $a_1p=0$이 나와 $a_1=a_2=a_3=0$이므로 $S$는 상수함수입니다.
- id: MC-ALG-81739
  name: $T-S$를 '정수 계수 상수항만 다른 것'으로 서술
  concepts:
  - CON-ALG-SET-DIFFERENCE
  used_in: KW-G17B-02#1
  outcome_code: '72'
  wrong_work: $T-S=\{a_0+\ldots\mid a_0\ne0\}$
  detect_cue: 조건이 $a_0$에 달려 있음
  feedback: 상수함수가 $S$이므로 차집합은 $a_1,a_2,a_3$ 중 적어도 하나가 $0$이 아닌 다항식입니다.
- id: MC-ALG-81740
  name: $f(x^2)=xf(x-2)+12$에서 차수를 비교하지 않고 이차식으로 가정
  concepts:
  - CON-ALG-DEGREE-COMPARE
  used_in: KW-G17B-02#2
  outcome_code: '71'
  wrong_work: $f(x)=ax^2+bx+c$로 두고 계수 비교
  detect_cue: 미지수가 3개이고 모순 해 또는 $a=0$
  feedback: $f(x^2)$의 차수는 $2m$, $xf(x-2)$의 차수는 $m+1$이므로 $m=1$입니다. 먼저 차수를 정하고 $f(x)=ax+b$로 놓습니다.
- id: MC-ALG-81741
  name: 나눗셈에서 $x$로 나눈 몫을 $f(x-2)$로 읽어 $f(x^2)=f(x-2)+12$로 세움
  concepts:
  - CON-ALG-DIVISION-EQUATION
  used_in: KW-G17B-02#2
  outcome_code: '72'
  wrong_work: $f(x^2)=f(x-2)+12$
  detect_cue: 피제수와 몫의 곱 $x\cdot f(x-2)$가 없음
  feedback: $A=BQ+R$에서 $B=x$이므로 $f(x^2)=x\,f(x-2)+12$입니다.
- id: MC-PRF-81742
  name: 몫의 유일성 증명에서 $B(Q_1-Q_2)$의 차수를 $B$의 차수보다 낮다고 비교
  concepts:
  - CON-PRF-CONTRADICTION-DEGREE
  used_in: KW-G17B-02#3
  outcome_code: '71'
  wrong_work: $\deg B(Q_1-Q_2)<\deg B$라고 씀
  detect_cue: 차수 부등호 방향 오류
  feedback: $Q_1\ne Q_2$이면 $\deg B(Q_1-Q_2)\ge\deg B$이고 $\deg(R_2-R_1)<\deg B$이므로 모순입니다.
- id: MC-PRF-81743
  name: $R_1=R_2$를 $Q_1=Q_2$보다 먼저 가정하여 순환 논증
  concepts:
  - CON-PRF-CONTRADICTION-DEGREE
  used_in: KW-G17B-02#3
  outcome_code: '72'
  wrong_work: $R_1=R_2$이므로 $B(Q_1-Q_2)=0$이라 하여 $Q_1=Q_2$
  detect_cue: $R_1=R_2$의 근거가 없음
  feedback: $R_1=R_2$는 결론의 일부입니다. 먼저 차수 모순으로 $Q_1=Q_2$를 얻고 그 뒤 $R_2-R_1=0$을 얻습니다.
- id: MC-CAL-81744
  name: $2^x$를 미분하여 $x2^{x-1}\ln$ 꼴로 거듭제곱 공식 오적용
  concepts:
  - CON-CAL-EXPONENTIAL-DERIVATIVE
  used_in: KW-G17B-02#4-1
  outcome_code: '71'
  wrong_work: $\dfrac{d}{dx}2^x=x\cdot2^{x-1}$
  detect_cue: $\ln2$가 나타나지 않음
  feedback: 제시문 (라)에 의해 $\dfrac{d}{dx}2^x=2^x\ln2$입니다. 거듭제곱 공식은 지수가 상수일 때만 씁니다.
- id: MC-PRF-81745
  name: $a_1=\ln2$가 정수가 아님을 보이지 않고 결론
  concepts:
  - CON-PRF-NON-INTEGER
  used_in: KW-G17B-02#4-1
  outcome_code: '72'
  wrong_work: $a_1=\ln2$이므로 $g\notin T$
  detect_cue: $\ln2$가 정수가 아닌 이유 언급 없음
  feedback: $0<\ln2<1$이므로 정수가 아닙니다. $a_1$은 정수여야 하므로 가정에 모순입니다.
- id: MC-PRF-81746
  name: 귀납 단계에서 $f(k+1)<g(k+1)$을 $n=k+1$만 대입해 확인하고 가정을 쓰지 않음
  concepts:
  - CON-PRF-INDUCTION-STEP
  used_in: KW-G17B-02#4-2
  outcome_code: '71'
  wrong_work: $(k+1)^2-(k+1)-3<2^{k+1}$을 그대로 전개
  detect_cue: $n=k$ 가정이 쓰이지 않음
  feedback: $f(k+1)=f(k)+2k<2^k+2k\le2^k+2^k=g(k+1)$처럼 귀납 가정 $f(k)<g(k)$와 $2k\le2^k$을 함께 써야 합니다.
- id: MC-PRF-81747
  name: 귀납법의 기초 단계 $n=1$을 확인하지 않음
  concepts:
  - CON-PRF-INDUCTION-BASE
  used_in: KW-G17B-02#4-2
  outcome_code: '72'
  wrong_work: $n=k$에서 $n=k+1$만 보이고 결론
  detect_cue: $f(1)=-3<2=g(1)$ 없음
  feedback: 수학적 귀납법은 $n=1$일 때의 성립과 $n=k\Rightarrow n=k+1$ 두 가지가 모두 필요합니다.
