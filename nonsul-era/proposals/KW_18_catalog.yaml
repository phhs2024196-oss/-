# 광운대 2018학년도 실전 자연계열(오전 G18A·오후 G18B)·모의(M18) — 오개념 카탈로그 추가 제안 (공용 db/misconceptions.yaml 은 수정하지 않음). 번호: G18A 81801~81829, G18B 81830~81859, 모의 81880~81899
- {concepts: [직선의 방정식, 점과 직선 사이의 거리], detect_cue: 매개변수 점에서 $z$ 좌표가 $2+t$ 이다., feedback: '$2-z=t$ 이므로 $z=2-t$, 방향벡터는 $(2,1,-1)$ 이다. 거리 제곱은 $6\left(t-\tfrac23\right)^2+\tfrac73$.', id: MC-GEO-81801, name: '직선 $\dfrac{x+1}{2}=y=2-z$ 의 방향벡터를 $(2,1,1)$ 로 읽음', outcome_code: '71', used_in: KW-G18A-01#1-1, wrong_work: '$z$ 의 부호를 놓쳐 $\mathrm{P}(2t-1,t,2+t)$ 로 잡고 거리를 구한다.'}
- {concepts: [이차함수의 최솟값, 두 점 사이의 거리], detect_cue: 답이 $\sqrt5$ 이다., feedback: 직선 위 점 중 원점에 가장 가까운 점은 $t=\tfrac23$ 에서 얻으며 $6t^2-8t+5$ 의 최솟값은 $\tfrac73$ 이다., id: MC-CAL-81802, name: '$\overline{\mathrm{OP}}^2$ 의 이차식을 완성제곱하지 않고 $t=0$ 대입값을 최솟값으로 둠', outcome_code: '71', used_in: KW-G18A-01#1-1, wrong_work: '$t=0$ 일 때 $\overline{\mathrm{OP}}=\sqrt5$ 를 거리로 답한다.'}
- {concepts: [직선과 평면의 교점], detect_cue: '$\mathrm{A}$ 가 $(-3,-1,3)$ 이다.', feedback: '$2t-1-3t+4-2t=-3t+3=0$ 이므로 $t=1$, $\mathrm{A}(1,1,1)$. 평면 $\alpha$ 에 $\mathrm{A}$ 를 대입해 확인한다.', id: MC-GEO-81803, name: '직선과 평면의 교점에서 $t$ 를 구할 때 평면 대입 부호 오류로 $\mathrm{A}$ 가 달라짐', outcome_code: '71', used_in: KW-G18A-01#1-2, wrong_work: $(2t-1)-3t+2(2-t)=0$ 을 $-3t+3=0$ 이 아니라 $-3t-3=0$ 으로 정리해 $t=-1$ 을 얻는다.}
- {concepts: [평면의 방정식, 법선벡터], detect_cue: '평면의 계수가 $(2,1,-1)$ 이다.', feedback: '$\beta$ 는 $\overrightarrow{\mathrm{OA}}=(1,1,1)$ 에 수직이므로 법선벡터가 $(1,1,1)$, 방정식은 $x+y+z-3=0$.', id: MC-GEO-81804, name: '평면 $\beta$ 의 법선벡터를 $\overrightarrow{\mathrm{OA}}$ 가 아닌 직선 $l$ 의 방향벡터로 씀', outcome_code: '71', used_in: KW-G18A-01#1-2, wrong_work: $2x+y-z+d=0$ 꼴로 평면을 세운다.}
- {concepts: [두 평면이 이루는 각, 내적], detect_cue: '분자에 $\lvert\ \rvert$ 가 없거나 $\overrightarrow{n_2}$ 가 $(0,0,1)$ 이 아니다.', feedback: '$xy$평면의 법선벡터는 $(0,0,1)$, $\cos\theta=\dfrac{1}{\sqrt3}=\dfrac{\sqrt3}{3}$.', id: MC-GEO-81805, name: 두 평면이 이루는 각의 $\cos$ 을 절댓값 없이 쓰거나 법선벡터 대신 평면 위의 벡터를 씀, outcome_code: '71', used_in: KW-G18A-01#1-3, wrong_work: '$\overrightarrow{n_1}\cdot\overrightarrow{n_2}$ 를 분자에 그대로 두거나 $xy$평면의 법선벡터를 $(1,0,0)$ 으로 잡는다.'}
- {concepts: [구의 방정식, 내적의 성분 표현], detect_cue: $r$ 이 $2$ 가 아니다., feedback: $(x-5)(x-7)+(y-3)(y-5)+(z-\sqrt2)(z+\sqrt2)=x^2+y^2+z^2-12x-8y+48$ 이고 $=(x-6)^2+(y-4)^2+z^2-4$. $r^2=4$., id: MC-GEO-81806, name: '$\overrightarrow{\mathrm{BP}}\cdot\overrightarrow{\mathrm{CP}}=0$ 을 전개할 때 상수항을 $+48$ 로 정리하고 반지름의 제곱을 구하는 단계에서 오류', outcome_code: '71', used_in: KW-G18A-01#2-1, wrong_work: $(x-6)^2+(y-4)^2+z^2=52-48-2$ 처럼 상수항 $-2$ 를 빠뜨려 반지름을 $\sqrt2$ 등으로 답한다.}
- {concepts: [구의 방정식], detect_cue: 반지름 답이 $4$ 이다., feedback: $r^2=4$ 이므로 $r=2$., id: MC-GEO-81807, name: 반지름을 $r^2=4$ 로 적고 $r=4$ 로 답함, outcome_code: '71', used_in: KW-G18A-01#2-1, wrong_work: $(x-6)^2+(y-4)^2+z^2=4$ 에서 반지름을 $4$ 로 쓴다.}
- {concepts: [구의 지름과 내적, 삼각형의 넓이], detect_cue: '$\mathrm{B},\mathrm{D},\mathrm{C}$ 가 한 직선 위라는 서술이 없다.', feedback: '$\overrightarrow{\mathrm{BP}}\cdot\overrightarrow{\mathrm{CP}}=0$ 이면 $\mathrm{BC}$ 가 지름이므로 $\mathrm{D}$ 는 $\mathrm{BC}$ 의 중점. $\overline{\mathrm{BD}}=\overline{\mathrm{CD}}$ 이고 높이가 같아 $S_1=S_2$.', id: MC-GEO-81808, name: '$\mathrm{B},\mathrm{C}$ 가 구의 지름의 양 끝임을 보이지 않고 $S_1=S_2$ 라 단정', outcome_code: '71', used_in: KW-G18A-01#2-2, wrong_work: '$\mathrm{D}$ 가 $\mathrm{BC}$ 의 중점임을 확인하지 않고 두 삼각형이 합동이라 쓴다.'}
- {concepts: [점과 원 사이의 최단거리, 구와 평면의 교선], detect_cue: '답에 $\sqrt{52}$ 가 있다.', feedback: '$\mathrm{Q}$ 는 구가 아니라 구와 $xy$평면의 교선(원) 위의 점이다. $\mathrm{E}^{\prime}(2,1,0)$ 에서 원까지 최단 $3$, 높이 $3\sqrt3$ 로 $\sqrt{9+27}=6$.', id: MC-GEO-81809, name: '점 $\mathrm{E}$ 와 구의 중심 $\mathrm{D}$ 사이 거리에서 반지름을 빼 최솟값이라 답함(구 위의 점 문제로 착각)', outcome_code: '71', used_in: KW-G18A-01#2-3, wrong_work: '$\overline{\mathrm{ED}}-2=\sqrt{52}-2$ 를 답한다.'}
- {concepts: [점과 원의 위치관계], detect_cue: '$\overline{\mathrm{E}^{\prime}\mathrm{D}}>2$ 라는 서술이 없다.', feedback: '$\mathrm{E}^{\prime}$ 가 원 안에 있으면 최단거리는 $2-\overline{\mathrm{E}^{\prime}\mathrm{D}}$ 이므로 위치 확인이 먼저다. 여기서는 $5>2$.', id: MC-GEO-81810, name: '수선의 발 $\mathrm{E}^{\prime}$ 이 원 바깥인지 확인하지 않고 $\overline{\mathrm{E}^{\prime}\mathrm{Q}^{\prime}}=\overline{\mathrm{E}^{\prime}\mathrm{D}}-2$ 를 씀', outcome_code: '71', used_in: KW-G18A-01#2-3, wrong_work: '$\overline{\mathrm{E}^{\prime}\mathrm{D}}=5$ 와 반지름 $2$ 의 대소 비교 없이 $5-2$ 를 쓴다.'}
- {concepts: [정적분의 부분적분법], detect_cue: $f(1)$ 이 $1-2\cos1$ 이 아니다., feedback: '$\int t\sin t\,dt=-t\cos t+\sin t$ 이므로 $\int_0^1=\sin1-\cos1$ 이고 $f(1)=1-2\cos1$.', id: MC-CAL-81811, name: '$\int_0^1t\sin t\,dt$ 의 부분적분에서 부호를 틀림', outcome_code: '71', used_in: KW-G18A-02#1-2, wrong_work: '$\int_0^1t\sin t\,dt=[t\cos t]_0^1-\int_0^1\cos t\,dt$ 로 써서 $f(1)=3-2\sin1\cdots$ 같은 값을 얻는다.'}
- {concepts: [삼각함수의 값의 대소], detect_cue: '$\dfrac{\sqrt2}{2}<\cos1<\dfrac12$ 처럼 부등호가 반대이다.', feedback: '$[0,\pi]$ 에서 $\cos$ 은 감소하므로 $\cos\dfrac{\pi}{3}<\cos1<\cos\dfrac{\pi}{4}$.', id: MC-CAL-81812, name: '$\cos$ 이 감소함수임을 놓치고 $\cos\dfrac{\pi}{4}<\cos1<\cos\dfrac{\pi}{3}$ 로 씀', outcome_code: '71', used_in: KW-G18A-02#1-2, wrong_work: '$\dfrac{\pi}{4}<1<\dfrac{\pi}{3}$ 이므로 $\cos$ 값도 같은 방향이라 쓴다.'}
- {concepts: [사이값 정리, 연속], detect_cue: $f(1)>-1$ 의 근거가 없다., feedback: '(2)에서 $1-\sqrt2<f(1)$ 이고 $1-\sqrt2>-1$ 이므로 $f(1)>-1>f(0)$. $[0,1]$ 에서 연속임도 쓴다.', id: MC-PRF-81813, name: 사이값 정리에서 $1-\sqrt2>-1$ 을 확인하지 않고 $f(1)>-1$ 로만 서술, outcome_code: '71', used_in: KW-G18A-02#1-3, wrong_work: $f(0)<-1<f(1)$ 만 쓰고 근거로 (2)의 $f(1)<0$ 만 인용한다.}
- {concepts: [정적분과 미분의 관계], detect_cue: '$f^{\prime}(x)$ 에 상수항 $1$ 이 없다.', feedback: '$f^{\prime}(x)=1+2(1-\cos x+x\sin x)=3-2\cos x+2x\sin x$.', id: MC-CAL-81814, name: '$f^{\prime}(x)$ 에서 $x-2$ 의 미분 $1$ 을 빠뜨림', outcome_code: '71', used_in: KW-G18A-02#1-4, wrong_work: '$f^{\prime}(x)=2(1-\cos x+x\sin x)$ 로 쓴다.'}
- {concepts: [곱의 미분법, 오목과 볼록], detect_cue: $\sin x$ 의 계수가 $2$ 이다., feedback: '$(3-2\cos x+2x\sin x)^{\prime}=2\sin x+2\sin x+2x\cos x=4\sin x+2x\cos x$.', id: MC-CAL-81815, name: '$f^{\prime\prime}(x)$ 에서 $(x\sin x)^{\prime}$ 의 곱의 미분을 빠뜨림', outcome_code: '71', used_in: KW-G18A-02#1-5, wrong_work: '$f^{\prime\prime}(x)=2\sin x+2x\cos x$ 로 쓴다.'}
- {concepts: [치환적분], detect_cue: '$a_n$ 의 계수가 $\dfrac{1}{n(n+1)}$ 이다.', feedback: '$u=nx^2$ 로 치환하면 $\int xe^{-nx^2}dx=-\dfrac{1}{2n}e^{-nx^2}$ 이다.', id: MC-CAL-81816, name: '$\int xe^{-nx^2}dx$ 에서 $\dfrac{1}{2n}$ 대신 $\dfrac1n$ 을 씀', outcome_code: '71', used_in: KW-G18A-02#2-2, wrong_work: '$a_n=\dfrac{1}{n(n+1)}\left(1-\dfrac1e\right)$ 로 쓴다.'}
- {concepts: [부분분수, 망원급수], detect_cue: '합이 $\dfrac{98}{99}$ 이다.', feedback: '마지막 항이 $-\dfrac1{100}$ 이므로 합은 $1-\dfrac1{100}=\dfrac{99}{100}$.', id: MC-ALG-81817, name: '$\sum_{n=1}^{99}\left(\dfrac1n-\dfrac1{n+1}\right)$ 의 마지막 항을 $\dfrac1{99}$ 로 둠', outcome_code: '71', used_in: KW-G18A-02#2-2, wrong_work: '합을 $1-\dfrac1{99}$ 로 계산한다.'}
- {concepts: [집합의 상등], detect_cue: 답이 두 개이다., feedback: '$A=B$ 이면 $t+1=3$ 도 만족해야 하므로 $t=-1$ 은 제외, $t=2$.', id: MC-ALG-81830, name: $t=2t^2-t-4$ 의 해 $t=-1$ 을 $3=t+1$ 확인 없이 답에 포함, outcome_code: '71', used_in: KW-G18B-01#1, wrong_work: $t=-1$ 또는 $t=2$ 라고 답한다.}
- {concepts: [명제, 부분집합], detect_cue: 답의 개수가 $7$ 이다., feedback: '$-1\in A$ 이면 $(-1)^2=1\in A$ 이어야 하므로 $\{-1\}$, $\{-1,0\}$ 은 안 된다. 답은 $5$ 개.', id: MC-ALG-81831, name: '조건 (ⅱ)를 만족하지 않는 $\{-1\}$, $\{-1,0\}$ 을 답에 포함', outcome_code: '71', used_in: KW-G18B-01#2, wrong_work: '$\{-1,0,1\}$ 의 공집합 아닌 부분집합 $7$개를 모두 답한다.'}
- {concepts: [유한집합, 귀류법], detect_cue: '$a^{2^n}$ 이 계속 커진다는 서술이 없다.', feedback: '$a\in A$, $\lvert a\rvert\ge2$ 이면 $a,a^2,a^4,\dots\in A$ 가 서로 다르다. 유한집합에 모순.', id: MC-PRF-81832, name: $|a|\ge2$ 인 원소를 무한집합 모순 설명 없이 제외, outcome_code: '71', used_in: KW-G18B-01#2, wrong_work: '"$a$ 가 $2$ 이상이면 안 되므로 $A\subset\{-1,0,1\}$" 라고만 쓴다.'}
- {concepts: [일대일함수, 순열], detect_cue: 답이 $27$ 이다., feedback: 일대일이면 서로 다른 값 $3\cdot2\cdot1=6$., id: MC-CNT-81833, name: $X$ 에서 $X$ 로의 일대일함수의 개수를 $3^3$ 으로 셈, outcome_code: '71', used_in: KW-G18B-01#3-1, wrong_work: 각 원소의 상을 독립으로 고른다고 보아 $27$ 을 답한다.}
- {concepts: [역함수, 합성함수], detect_cue: 답이 $3$ 이다., feedback: '$f^{-1}(2)=3$ ($f(3)=2$), $f^{-1}(3)=1$ ($f(1)=3$) 이므로 답은 $1$.', id: MC-ALG-81834, name: '$(f^{-1}\circ f^{-1})(2)$ 를 $f(f(2))$ 로 계산', outcome_code: '71', used_in: KW-G18B-01#3-2, wrong_work: $f(f(2))=f(1)=3$ 을 답한다.}
- {concepts: [일대일함수, 판별식], detect_cue: $b-ac$ 가 $2$ 이상의 값을 포함한다., feedback: '$g$ 가 일대일이면 $a,b,c$ 는 $1,2,3$ 의 순열. 해는 $(1,3,2)$, $(2,3,1)$ 뿐이고 $b-ac=1$.', id: MC-ALG-81835, name: '$a,b,c$ 가 서로 다름(일대일)을 쓰지 않고 $\{1,2,3\}^3$ 에서 $b^2-4ac>0$ 을 찾음', outcome_code: '71', used_in: KW-G18B-01#3-3, wrong_work: '$(a,b,c)=(1,3,1)$, $(1,3,2)$, $(2,3,1)$ 등을 모두 해로 보고 $b-ac$ 가 여러 값이라 한다.'}
- {concepts: [속도, 운동 방향], detect_cue: 답이 $15$ 이다., feedback: '방향이 바뀔 때는 속도 $v=\dfrac{dx}{dt}=0$ 이고 부호가 바뀐다. $v=-3t(t-10)$ 에서 $t=10$.', id: MC-CAL-81836, name: 운동 방향이 바뀌는 시각을 좌표 $x=0$ 이 되는 시각($t=15$)으로 혼동, outcome_code: '71', used_in: KW-G18B-02#1, wrong_work: $-t^3+15t^2=0$ 에서 $t=15$ 를 답한다.}
- {concepts: [함수의 극한, 연속], detect_cue: 좌극한과 우극한이 같은 값이다., feedback: '$0<x<1$ 이면 $x^n\to0$ 이라 극한은 $-x^2+x+b$, $x\to1-$ 에서 $b$. $x>1$ 이면 $ax^3$, $x\to1+$ 에서 $a$.', id: MC-CAL-81837, name: '$x>1$ 일 때 $\lim_{n\to\infty}$ 에서 $x^n$ 으로 나누지 않고 $x^{n+3}/x^n$ 만 보고 좌극한도 $a$ 로 처리', outcome_code: '71', used_in: KW-G18B-02#2, wrong_work: '$\lim_{x\to1-}f(x)=a$ 로 쓴다.'}
- {concepts: [함수의 연속], detect_cue: '$a,b$ 가 한 값으로 정해지지 않는다.', feedback: '연속이면 $\lim_{x\to1-}f=\lim_{x\to1+}f=f(1)$ 이므로 $a=b=\dfrac ab$, $b\ne0$ 이면 $a=b=1$.', id: MC-CAL-81838, name: 연속 조건에서 $f(1)=\dfrac ab$ 와의 일치를 쓰지 않아 $a=b$ 만 얻음, outcome_code: '71', used_in: KW-G18B-02#2, wrong_work: $a=b$ 라고만 하고 $b$ 의 값을 정하지 않는다.}
- {concepts: [절댓값 함수의 정적분], detect_cue: 분할점이 $k$ 이다., feedback: $2x-k=0$ 에서 $x=\dfrac k2$ 로 나눈다., id: MC-CAL-81839, name: $\lvert2x-k\rvert$ 의 적분 구간 분할점을 $x=k$ 로 잡음, outcome_code: '71', used_in: KW-G18B-02#3, wrong_work: '$\int_0^k(k-2x)\,dx+\int_k^1(2x-k)\,dx$ 로 쓴다.'}
- {concepts: [이차함수의 최솟값], detect_cue: 답이 $1$ 이다., feedback: $S(k)=\dfrac12(k-1)^2+\dfrac12$ 의 꼭짓점 $k=1$ 이 $0\le k\le2$ 안에 있다., id: MC-ALG-81840, name: '$S(k)$ 의 최솟값을 끝점 $k=0,2$ 에서만 비교', outcome_code: '71', used_in: KW-G18B-02#3, wrong_work: '$S(0)=1$, $S(2)=3$ 중 작은 값 $1$ 을 답한다.'}
- {concepts: [미분가능, 함수방정식], detect_cue: (1)의 인용이 없다., feedback: '$f(0)=0$ 은 (1)에서 보인 결과이므로 $\dfrac{f(h)-f(0)}{h}=\dfrac{f(h)}{h}$ 임을 언급한다.', id: MC-PRF-81841, name: '미분계수 $f^{\prime}(0)=\lim\dfrac{f(h)}{h}$ 를 $f(0)=0$ 확인 없이 사용', outcome_code: '71', used_in: KW-G18B-02#4-2, wrong_work: '$f^{\prime}(0)=\lim\dfrac{f(h)-f(0)}{h}$ 에서 $f(0)$ 을 바로 지운다.'}
- {concepts: [극한의 대소 관계], detect_cue: $-\lvert h\rvert\le$ 쪽이 없다., feedback: '제시문 4는 양쪽에서 같은 극한값 $0$ 으로 누르는 경우만 가능. $-\lvert h\rvert\le\dfrac{f(h)}{h}\le\lvert h\rvert$.', id: MC-PRF-81842, name: '$\left\lvert\dfrac{f(h)}{h}\right\rvert\le\lvert h\rvert$ 에서 한쪽 부등식만 쓰고 극한 $0$ 을 단정', outcome_code: '71', used_in: KW-G18B-02#4-2, wrong_work: '$\dfrac{f(h)}{h}\le\lvert h\rvert\to0$ 이므로 극한이 $0$ 이라 쓴다.'}
- {concepts: [미분가능, 함수방정식], detect_cue: $f(x+h)=f(x)+f(h)$ 가 쓰이지 않는다., feedback: '$f^{\prime}(x)=\lim\dfrac{f(x+h)-f(x)}{h}=\lim\dfrac{f(h)}{h}=f^{\prime}(0)=0$.', id: MC-PRF-81843, name: '$f^{\prime}(0)=0$ 만 보고 모든 $x$ 에서 미분가능하다고 결론(덧셈 성질 미사용)', outcome_code: '71', used_in: KW-G18B-02#4-3, wrong_work: $x=0$ 에서만 미분가능함을 보이고 전체로 확장한다.}
- {concepts: [도함수가 $0$ 인 함수], detect_cue: 상수 $C$ 의 값이 없다., feedback: (1)에서 $f(0)=0$ 이므로 $C=0$., id: MC-PRF-81844, name: '$f^{\prime}(x)=0$ 에서 상수함수임은 썼으나 $f(0)=0$ 으로 상수를 정하지 않음', outcome_code: '71', used_in: KW-G18B-02#4-4, wrong_work: $f(x)=C$ 에서 멈춘다.}
- {concepts: [인수분해, 나머지], detect_cue: $f(b)=-1$ 같은 값이 나온다., feedback: '$f$ 의 값은 $0$ 이상 $11$ 이하이므로 $f(\cdot)-1\ge-1$. 가능한 쌍은 $(2,1),(1,2)$ 뿐이고 $f(a)>f(b)$ 에서 $f(a)=3,f(b)=2$.', id: MC-ALG-81880, name: $(f(a)-1)(f(b)-1)=2$ 의 정수쌍에서 $f(a)>f(b)$ 조건을 쓰지 않거나 음의 인수쌍을 포함, outcome_code: '71', used_in: KW-M18-01#1, wrong_work: '$(f(a)-1,f(b)-1)=(2,1),(1,2),(-1,-2),(-2,-1)$ 모두 후보로 두고 값을 혼동한다.'}
- {concepts: [나머지의 성질, 합동식], detect_cue: '$12s+3$, $12t+2$ 꼴이 없다.', feedback: '$a=12s+3$, $b=12t+2$ 로 두고 $2a+b^2=12(\cdots)+10$ 을 보인다.', id: MC-ALG-81881, name: '$f(2a+b^2)$ 를 $f(a),f(b)$ 로 바로 계산하거나 $a,b$ 의 나머지만 쓰고 $b^2$ 의 나머지 처리 오류', outcome_code: '71', used_in: KW-M18-01#1, wrong_work: $f(2a+b^2)=2f(a)+f(b)^2=6+4=10$ 을 이유 없이 쓰거나 $b^2$ 의 나머지를 $2$ 로 둔다.}
- {concepts: [무리수의 성질, 제시문 6], detect_cue: '$\sqrt{21}$ 항이 없다.', feedback: '두 무리수가 섞여 있어 제시문 6 을 바로 못 쓴다. 제곱하여 $2bc\sqrt{21}$ 을 만들어 $bc=0$ 을 얻고 한 항씩 제거한다.', id: MC-ALG-81882, name: $a+b\sqrt3+c\sqrt7=0$ 에서 제곱하지 않고 "무리수라서 각 항이 $0$" 이라 단정, outcome_code: '71', used_in: KW-M18-01#2-1, wrong_work: '$\sqrt3,\sqrt7$ 이 무리수이므로 $a=b=c=0$ 이라고만 쓴다.'}
- {concepts: [명제, 부분집합], detect_cue: 답에 $0$ 이외의 원소가 있다., feedback: '$a\ne0$ 이면 $2a,3a,\dots\in A$ 가 되어 $X$ 안에서 모순이다. $A=\{0\}$.', id: MC-PRF-81883, name: '뺄셈에 닫힌 부분집합으로 $\{-2,0,2\}$ 나 $\{-1,0,1\}$ 을 답함', outcome_code: '71', used_in: KW-M18-01#2-2, wrong_work: '$a,b\in A\rightarrow a-b\in A$ 에서 $1-(-1)=2$ 를 확인하지 않는다.'}
- {concepts: [판별식], detect_cue: 구간 전체에 대한 근거가 없다., feedback: $4a^2-4a+8=4\left(a-\tfrac12\right)^2+7>0$ 으로 모든 실수 $a$ 에서 성립., id: MC-ALG-81884, name: $g$ 의 판별식 $4a^2-4a+8>0$ 을 완전제곱 없이 $a$ 의 범위 $1\le a<2$ 만으로 판단, outcome_code: '71', used_in: KW-M18-01#3-1, wrong_work: '$4a^2-4a+8$ 에 $a=1$, $a=1.9$ 를 대입해 양수라고 한다.'}
- {concepts: [이차부등식, 곱의 부호], detect_cue: 구간이 하나이다., feedback: '$f\le0$ 인 $[-4,8]$ 에서 $g\le0$ 인 $[\alpha,\beta]$ 를 제외한 두 구간에서 곱이 $\le0$ 이다. $L=12-2\sqrt{a^2-a+2}$.', id: MC-ALG-81885, name: '$f(x)g(x)\le0$ 의 해를 $g(x)\le0$ 의 구간 $[\alpha,\beta]$ 하나로만 구함', outcome_code: '71', used_in: KW-M18-01#3-2, wrong_work: '$L=\beta-\alpha=2\sqrt{a^2-a+2}$ 를 답한다.'}
- {concepts: [이차방정식의 근의 위치], detect_cue: $1\le a<2$ 사용 흔적이 없다., feedback: '$1\le a<2$ 에서 $\alpha\ge1-\sqrt2>-4$, $\beta<4<8$ 임을 보인다.', id: MC-ALG-81886, name: $-4<\alpha<\beta<8$ 확인 없이 구간을 나눔, outcome_code: '71', used_in: KW-M18-01#3-2, wrong_work: '$\alpha,\beta$ 가 $-4,8$ 안에 있는지 확인하지 않고 $L$ 을 쓴다.'}
- {concepts: [정적분의 대칭, 우함수와 기함수], detect_cue: 답이 $F(1)$ 의 두 배이다., feedback: '피적분함수 $t^3+4t+1-\sin t^3$ 은 상수항 $1$ 때문에 기함수가 아니다. $\int_{-1}^1$ 에서 기함수 항은 소거되고 $2\int_0^11\,dt=2$.', id: MC-CAL-81887, name: $F(-1)=-F(1)$ 로 보아 $F(1)-F(-1)=2F(1)$ 이라 함, outcome_code: '71', used_in: KW-M18-02#1-1, wrong_work: $F$ 를 기함수로 보고 $2F(1)$ 을 답한다.}
- {concepts: [정적분의 부등식, $\lvert\sin t\rvert\le\lvert t\rvert$], detect_cue: '$\int_0^1(4t+1)\,dt=3$ 이 없다.', feedback: '$-t^3\le-\sin t^3$ 에서 $t^3-\sin t^3\ge0$ 이므로 $F(1)\ge\int_0^1(4t+1)\,dt=3$.', id: MC-CAL-81888, name: $-\sin t^3\le t^3$ 만 쓰고 $-t^3\le-\sin t^3$ (아래쪽 평가)를 빠뜨림, outcome_code: '71', used_in: KW-M18-02#1-2, wrong_work: $F(1)\le3.5$ 만 보이고 $3\le F(1)$ 의 근거를 쓰지 않는다.}
- {concepts: [합성함수의 미분법], detect_cue: '$G^{\prime}$ 에 $2x$ 인자가 없다.', feedback: '$G(x)=F(x^2)-1$ 의 미분은 $F^{\prime}(x^2)\cdot2x$. $x<0$ 에서 음수.', id: MC-CAL-81889, name: '$G^{\prime}(x)=F^{\prime}(x^2)$ 로 쓰고 $2x$ 를 빠뜨림', outcome_code: '71', used_in: KW-M18-02#2-1, wrong_work: '$G^{\prime}(x)=x^6+4x^2+1-\sin x^6>0$ 이라 모든 실수에서 증가, 극값 없음이라 쓴다.'}
- {concepts: [도함수의 부호], detect_cue: $x^6+4x^2$ 항이 없다., feedback: '$F^{\prime}(x^2)=x^6+4x^2+(1-\sin x^6)$ 이고 $x^6+4x^2>0$, $1-\sin x^6\ge0$ 이므로 $>0$.', id: MC-CAL-81890, name: '$x>0$ 에서 $1-\sin(x^6)\ge0$ 만으로 $G^{\prime}>0$ 이라 하고 $x^6+4x^2$ 의 양수성을 쓰지 않음', outcome_code: '71', used_in: KW-M18-02#2-1, wrong_work: '$G^{\prime}=2x(1-\sin x^6)\cdots$ 로 묶어 부호를 판단한다.'}
- {concepts: [정적분으로 정의된 함수, 극값], detect_cue: 답이 $0$ 이다., feedback: $G(x)=F(x^2)-1$ 이므로 $G(0)=F(0)-1=-1$., id: MC-CAL-81891, name: 극솟값을 $G(0)=F(0)=0$ 으로 구함, outcome_code: '71', used_in: KW-M18-02#2-2, wrong_work: $G(0)=F(0)=0$ 을 극솟값으로 답한다.}
- {concepts: [합성함수의 미분법, 곱의 미분법], detect_cue: '$x^2F^{\prime\prime}$ 항의 계수가 $2x$ 이다.', feedback: '$G^{\prime}=2xF^{\prime}(x^2)$ 의 미분은 $2F^{\prime}(x^2)+2x\cdot2xF^{\prime\prime}(x^2)=2F^{\prime}(x^2)+4x^2F^{\prime\prime}(x^2)$.', id: MC-CAL-81892, name: '$G^{\prime\prime}$ 계산에서 $F^{\prime\prime}(x^2)$ 의 합성미분 인자 $2x$ 를 한 번만 곱함', outcome_code: '71', used_in: KW-M18-02#2-3, wrong_work: '$G^{\prime\prime}=2F^{\prime}(x^2)+2xF^{\prime\prime}(x^2)$ 로 쓴다.'}
