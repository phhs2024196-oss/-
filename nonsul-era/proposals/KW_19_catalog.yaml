# 광운대 2019학년도 실전(자연 오전 G19A 문제 1·2 · 오후 G19B 문제 1·2)·모의논술(M19 문제 1·2) — 오개념 후보 (공용 카탈로그 반영 전 제안). ID 구간 MC-*-81901~81929(오전), 81930~81959(오후), 81980~81999(모의)
misconceptions:
- id: MC-CAL-81901
  name: 포물선과 직선 사이 넓이 공식의 $(x_2-x_1)^3$ 지수·계수 혼동
  concepts:
  - CON-CAL-AREA-BOUNDARY
  used_in: KW-G19A-01#1-1
  outcome_code: '71'
  wrong_work: $\dfrac43=\dfrac{(x_2-x_1)^3}{3}$으로 두어 $x_2-x_1=\sqrt[3]{4}$
  detect_cue: 답 $x_2-x_1\ne2$, 제시문 2의 $-\frac{a(\beta-\alpha)^3}{6}$ 미사용
  feedback: 제시문 2에서 $a=1$이면 넓이는 $\dfrac{(\beta-\alpha)^3}{6}$입니다. $\dfrac{(x_2-x_1)^3}{6}=\dfrac43$에서 $x_2-x_1=2$를 얻습니다.
- id: MC-ALG-81902
  name: 근과 계수의 관계에서 $x_1x_2$의 부호를 $b$로 둠
  concepts:
  - CON-ALG-VIETA
  used_in: KW-G19A-01#1-1
  outcome_code: '72'
  wrong_work: $x_1x_2=b$로 두어 $b=(a+1)(a+3)$
  detect_cue: $b$의 부호가 반대, 직선이 $y=2ax+(a+1)(a+3)$
  feedback: $x^2-(4+2a)x-b=0$이므로 $x_1x_2=\dfrac{-b}{1}=-b$입니다. 따라서 $b=-(a+1)(a+3)$입니다.
- id: MC-GEO-81903
  name: 중점의 궤적에서 매개변수 $a$를 소거하지 않고 답함
  concepts:
  - CON-GEO-LOCUS
  used_in: KW-G19A-01#1-2
  outcome_code: '71'
  wrong_work: $x_0=a+2$, $y_0=2ax_0-(a+1)(a+3)$에서 멈춤
  detect_cue: 답에 $a$가 남아 있고 $x_0,y_0$의 관계식이 없음
  feedback: 도형의 방정식은 $x_0,y_0$만의 관계식입니다. $a=x_0-2$를 대입해 $y=x^2-4x+1$을 얻습니다.
- id: MC-GEO-81904
  name: $\overline{AB}$ 길이에서 좌표 차의 부호 오류로 제곱을 생략
  concepts:
  - CON-GEO-DISTANCE
  used_in: KW-G19A-01#2-1
  outcome_code: '71'
  wrong_work: $\overline{AB}=\sqrt{(7-1)+(2-5)}=\sqrt3$
  detect_cue: 답 $\sqrt3$ 등 제곱 누락
  feedback: 두 점 사이의 거리는 $\sqrt{(7-1)^2+(2-5)^2}=\sqrt{45}=3\sqrt5$입니다.
- id: MC-GEO-81905
  name: $\overrightarrow{PA}$ 방향 혼동으로 내분점을 $s:(1-s)$ 대신 $(1-s):s$로 잡음
  concepts:
  - CON-GEO-VECTOR-DIV
  used_in: KW-G19A-01#2-2
  outcome_code: '72'
  wrong_work: $\overrightarrow{PQ}=s\overrightarrow{PA}+(1-s)\overrightarrow{PB}$로 둠
  detect_cue: 계수가 $(1-s)\overrightarrow{PA}+s\overrightarrow{PB}$와 맞지 않는데도 $\overrightarrow{PQ}$로 묶음
  feedback: $(1-s)\overrightarrow{PA}+s\overrightarrow{PB}$는 선분 $AB$를 $s:(1-s)$로 내분하는 점 $Q$에 대한 $\overrightarrow{PQ}$입니다. 범위 $0\le s\le1$이면 $Q$는 선분 $AB$ 위를 움직입니다.
- id: MC-GEO-81906
  name: $\overrightarrow{OP}=\frac13\overrightarrow{OQ}$에서 $P$가 그리는 선분의 길이를 $\overline{AB}$ 그대로 답함
  concepts:
  - CON-GEO-SIMILARITY
  used_in: KW-G19A-01#2-2
  outcome_code: '73'
  wrong_work: $P$가 그리는 선분의 길이 $=3\sqrt5$
  detect_cue: 답 $3\sqrt5$ (닮음비 $\frac13$ 누락)
  feedback: $P$는 $OQ$를 $1:2$로 내분하므로 $P$의 자취는 $AB$를 $\dfrac13$로 축소한 $A'B'$이고 길이는 $3\sqrt5\times\dfrac13=\sqrt5$입니다.
- id: MC-GEO-81907
  name: 사면체의 높이를 $\overline{AM}$으로 오인
  concepts:
  - CON-GEO-TETRA-VOLUME
  used_in: KW-G19A-01#3-1
  outcome_code: '71'
  wrong_work: $V=\dfrac13\times\triangle BCD\times\overline{AM}$
  detect_cue: $\triangle BCD$ 넓이와 $\overline{AM}=1$의 곱으로 계산
  feedback: $\overline{AM}$은 평면 $BCD$에 수직이 아닙니다. $CD\perp$ 평면 $ABM$이므로 $V=\dfrac13\times\overline{CD}\times\triangle ABM$으로 구합니다.
- id: MC-GEO-81908
  name: $\triangle ABM$의 넓이를 $\frac12\cdot1\cdot2$로 계산
  concepts:
  - CON-GEO-TRIANGLE-AREA
  used_in: KW-G19A-01#3-1
  outcome_code: '72'
  wrong_work: $\triangle ABM=\dfrac12\times1\times2=1$ ($\angle AMB=90^\circ$ 가정)
  detect_cue: $V=\dfrac23$ 상수로 $a$ 소거
  feedback: $\angle AMB$는 직각이 아니고 $a$에 따라 변합니다. 높이를 $x$로 두고 $a^2=x^2+b^2$, $1=x^2+(2-b)^2$로 구합니다.
- id: MC-ALG-81909
  name: $a^4-10a^2+9<0$의 범위를 $a^2>1$ 또는 $a^2<9$로 처리
  concepts:
  - CON-ALG-QUADRATIC-INEQ
  used_in: KW-G19A-01#3-2
  outcome_code: '71'
  wrong_work: $(a^2-1)(a^2-9)<0$에서 $a^2<1$ 또는 $a^2>9$
  detect_cue: 범위 $1<a^2<9$ 대신 두 구간 바깥
  feedback: $(a^2-1)(a^2-9)<0$은 두 근 사이에서 성립하므로 $1<a^2<9$입니다. 근호 안이 양수이어야 사면체가 존재합니다.
- id: MC-CAL-81910
  name: $V$의 최댓값을 $a^2$ 구간 끝점에서 찾음
  concepts:
  - CON-CAL-MAX-QUAD
  used_in: KW-G19A-01#3-2
  outcome_code: '72'
  wrong_work: $a^2=1$ 또는 $a^2=9$에서 최대
  detect_cue: 최댓값 $0$ 또는 끝점 값
  feedback: 근호 안 $-(a^2-5)^2+16$은 $a^2=5$에서 최대 $16$이고 $V_{\max}=\dfrac{\sqrt{16}}6=\dfrac23$입니다. 끝점에서는 $V=0$입니다.
- id: MC-CAL-81911
  name: $g(x)$를 전개할 때 $x$의 계수 부호·항 누락
  concepts:
  - CON-CAL-DEFINITE-INTEGRAL
  used_in: KW-G19A-02#1
  outcome_code: '71'
  wrong_work: $(t-x)\left(t-\frac xt\right)=t^2-xt+\frac{x^2}t$로 $-x$ 항 누락
  detect_cue: 1차항 계수가 $-\int(t+1)\ln t\,dt$가 아님
  feedback: $(t-x)\left(t-\frac xt\right)=t^2-x-xt+\frac{x^2}{t}$이므로 $x$의 계수는 $-\int_1^e(t+1)\ln t\,dt$입니다.
- id: MC-CAL-81912
  name: $\int_1^e t\ln t\,dt$ 부분적분에서 $u,dv$를 반대로 잡아 미분 적분이 복잡해짐
  concepts:
  - CON-CAL-INTEGRATION-BY-PARTS
  used_in: KW-G19A-02#1
  outcome_code: '72'
  wrong_work: $u=t+1$, $dv=\ln t\,dt$로 부분적분
  detect_cue: $\int\ln t\,dt$를 모르는 채 중단
  feedback: $\ln t$를 미분하는 쪽($f=\ln t$), $(t+1)dt$를 적분하는 쪽($g^{\prime}$)으로 둡니다.
- id: MC-CAL-81913
  name: 임의의 일차함수 조건을 $g(x)=x$ 한 가지로만 확인
  concepts:
  - CON-ALG-IDENTITY
  used_in: KW-G19A-02#2-1
  outcome_code: '71'
  wrong_work: $g(x)=x$만 대입해 $b=0$만 얻음
  detect_cue: $a$와 $c$의 관계식 누락
  feedback: $g(x)=px+q$가 임의의 일차함수이므로 $p,q$에 대한 항등식이어야 하며 $b=0$, $\dfrac a3+c=0$을 모두 얻습니다.
- id: MC-CAL-81914
  name: 조건 (ⅱ)의 $\int_0^2 f(x)\,dt$를 $x$의 적분으로 계산
  concepts:
  - CON-CAL-DEFINITE-INTEGRAL
  used_in: KW-G19A-02#2-1
  outcome_code: '72'
  wrong_work: $\int_0^2\{f(x)-3+f(t)\}dt$에서 $f(x)$를 $t$에 대한 상수가 아닌 것으로 처리
  detect_cue: $a$가 구해지지 않음
  feedback: 적분변수는 $t$이므로 $f(x)$와 $-3$은 상수이고 $\int_0^2f(x)dt=2f(x)$, $\int_0^2(-3)dt=-6$입니다.
- id: MC-CAL-81915
  name: $\lim\frac{e^h-1}{h}=1$을 쓰지 않고 $e^0=1$로 분자를 대입해 $\frac00$ 처리 중단
  concepts:
  - CON-CAL-EXP-LIMIT
  used_in: KW-G19A-02#2-2
  outcome_code: '71'
  wrong_work: $h\to0$이면 $f(e^h)\to f(1)=2$이므로 극한 $=0$
  detect_cue: 답 $0$
  feedback: $\dfrac{f(e^h)-2}{h}$는 $\dfrac00$ 꼴이므로 인수분해 $3(e^h+1)\dfrac{e^h-1}h$로 바꾸어 $\lim\dfrac{e^h-1}{h}=1$을 사용합니다.
- id: MC-ALG-81916
  name: $f(f(\alpha))=1$에서 $f(\alpha)=1$만 풀고 끝냄
  concepts:
  - CON-ALG-COMPOSITE
  used_in: KW-G19A-02#3-1
  outcome_code: '71'
  wrong_work: $f(\alpha)=1$을 풀어 $\alpha=1$
  detect_cue: 합성 두 번 구조 언급 없음(답은 우연히 일치)
  feedback: 먼저 $f(y)=1$로 $y=1$을 구한 뒤 $f(\alpha)=y=1$을 풀어야 합니다. 두 단계를 명시해야 합니다.
- id: MC-CAL-81917
  name: 극값 판정에서 $f'(p)=0$의 근 $p$를 구하지 않고 극대로 단정
  concepts:
  - CON-CAL-EXTREMUM-TEST
  used_in: KW-G19A-02#3-2
  outcome_code: '72'
  wrong_work: $f^{\prime}(x)=\dfrac{e^x(e^x+x)}{(e^x+1)^2}$에서 $e^x+x$의 부호 미확인
  detect_cue: 극대 또는 판정 근거 없음
  feedback: $e^x+x$는 증가함수이고 $e^p+p=0$이므로 $x<p$에서 $f^{\prime}<0$, $x>p$에서 $f^{\prime}>0$이어서 극소입니다.
- id: MC-CAL-81918
  name: $x=1$ 대입 없이 부등식에서 $a$를 구하려 함
  concepts:
  - CON-CAL-INEQ-CONSTANT
  used_in: KW-G19A-02#3-3
  outcome_code: '71'
  wrong_work: $x\to\infty$ 극한만으로 $a$ 결정
  detect_cue: $a=e$의 근거 없음
  feedback: $x=1$일 때 우변이 $0$이므로 $\lvert ef(1)-a\rvert\le0$에서 $a=ef(1)=e$입니다.
- id: MC-CAL-81919
  name: $b$의 최솟값을 $g(x)$의 최댓값으로 착각해 도달점을 찾음
  concepts:
  - CON-CAL-SUPREMUM
  used_in: KW-G19A-02#3-3
  outcome_code: '72'
  wrong_work: $g(x)=\dfrac{e^{x+1}}{e^x+1}$의 최댓값을 구하려다 존재하지 않아 포기
  detect_cue: $b$를 구하지 못함
  feedback: $g$는 증가하고 $\lim_{x\to\infty}g(x)=e$이므로 모든 $x$에서 $g(x)<e$이고 $b\ge e$이면 충분하며 $b<e$이면 큰 $x$에서 깨집니다. 최솟값은 $e$입니다.
- id: MC-ALG-81930
  name: $(f\circ f)(x)$를 $x$의 부호만으로 두 구간으로 나눔
  concepts:
  - CON-ALG-COMPOSITE
  used_in: KW-G19B-01#1-1
  outcome_code: '71'
  wrong_work: $x\ge0$이면 $e^{e^x}$, $x<0$이면 $f(2x+1)=2(2x+1)+1$
  detect_cue: $-\frac12\le x<0$ 구간 누락
  feedback: $x<0$이어도 $2x+1\ge0$이면 $f(2x+1)=e^{2x+1}$입니다. $f(x)$의 부호로 $x=-\dfrac12$에서 나누어야 합니다.
- id: MC-GEO-81931
  name: $(f\circ f)$ 그래프와 $y=1$, $x=0$, $y=0$ 영역을 삼각형으로 처리
  concepts:
  - CON-GEO-TRAPEZOID-AREA
  used_in: KW-G19B-01#1-2
  outcome_code: '71'
  wrong_work: 넓이 $=\dfrac12\times\dfrac34\times1=\dfrac38$
  detect_cue: 답 $\frac38$ (윗변 $\frac12$ 누락)
  feedback: $y=4x+3$이 $x=-\dfrac34$에서 $0$, $x=-\dfrac12$에서 $1$이므로 영역은 윗변 $\dfrac12$, 아랫변 $\dfrac34$, 높이 $1$인 사다리꼴이고 넓이는 $\dfrac58$입니다.
- id: MC-ALG-81932
  name: 가우스 기호에서 $[x^2-x-3]=[x^2-x]-3$을 쓰지 않고 정수 부분을 분리
  concepts:
  - CON-ALG-GAUSS
  used_in: KW-G19B-01#2-1
  outcome_code: '71'
  wrong_work: $[f(x)]=[x^2-x]-3$ 대신 $[x^2]-[x]-3$으로 분리
  detect_cue: $[a+b]=[a]+[b]$ 사용
  feedback: 가우스 기호는 정수를 더한 경우에만 $[A+n]=[A]+n$이 성립합니다. $x^2-x-3=(x^2-x)-3$이므로 $[x^2-x]-3$입니다.
- id: MC-ALG-81933
  name: $[x^2-x]\ge1$을 $x^2-x>1$로 처리
  concepts:
  - CON-ALG-GAUSS-INEQ
  used_in: KW-G19B-01#2-1
  outcome_code: '72'
  wrong_work: $[x^2-x]\ge1\Rightarrow x^2-x>1$
  detect_cue: 끝점 $\frac{1\pm\sqrt5}2$ 제외
  feedback: $[A]\ge1\iff A\ge1$이므로 끝점 $x=\dfrac{1\pm\sqrt5}{2}$를 포함합니다. $[A]\le19\iff A<20$이므로 $x=5,-4$는 제외됩니다.
- id: MC-ALG-81934
  name: $[x^2-x]\le19$를 $x^2-x\le19$로 처리
  concepts:
  - CON-ALG-GAUSS-INEQ
  used_in: KW-G19B-01#2-1
  outcome_code: '73'
  wrong_work: $[x^2-x]\le19\Rightarrow x^2-x\le19$
  detect_cue: 상한이 $\frac{1+\sqrt{77}}2$ 꼴
  feedback: $[A]\le19$이면 $A<20$입니다. $x^2-x<20$에서 $-4<x<5$입니다.
- id: MC-CAL-81935
  name: $a=1$, $\sqrt2$에서 극한이 존재하지 않음을 한쪽 극한만 보고 판정
  concepts:
  - CON-CAL-ONE-SIDED-LIMIT
  used_in: KW-G19B-01#2-2
  outcome_code: '71'
  wrong_work: $a=1$에서 $\lim_{x\to1-}$만 계산해 $5$로 극한 존재
  detect_cue: $a=1$ 또는 $a=\sqrt2$ 포함
  feedback: 좌극한과 우극한을 모두 구해야 합니다. $a=1$에서 $5\ne4$, $a=\sqrt2$에서 $4\ne\dfrac72$이므로 극한이 존재하지 않습니다.
- id: MC-CAL-81936
  name: $x\to a$일 때 $[x^2]=[a^2]$로 항상 처리
  concepts:
  - CON-CAL-GAUSS-LIMIT
  used_in: KW-G19B-01#2-2
  outcome_code: '72'
  wrong_work: $\lim_{x\to a}[x^2]=[a^2]$ 대입
  detect_cue: 모든 $0<a<\sqrt3$에서 극한 존재로 답함
  feedback: $a^2$가 정수($a=1,\sqrt2$)이면 좌우에서 $[x^2]$의 값이 달라 극한이 존재하지 않습니다.
- id: MC-ALG-81937
  name: $(x+1)P(x)$의 나머지를 $R$로 단정
  concepts:
  - CON-ALG-REMAINDER
  used_in: KW-G19B-01#3-1
  outcome_code: '71'
  wrong_work: 나머지 $=R$ 또는 $R(x+1)$
  detect_cue: 답이 $R$ 또는 $(x+1)R$ (일차식)
  feedback: $2x-5$로 나눈 나머지는 상수입니다. $x=\dfrac52$ 대입으로 $\left(\dfrac52+1\right)R=\dfrac72R$입니다.
- id: MC-PRF-81938
  name: 명제의 증명에서 귀류법 가정을 '$P(\alpha)=0$인 $\alpha$가 존재'로 설정
  concepts:
  - CON-PRF-CONTRADICTION
  used_in: KW-G19B-01#3-2
  outcome_code: '72'
  wrong_work: '가정: $P(\alpha)=0$인 $\alpha$가 $[0,3]$에 존재'
  detect_cue: 결론의 부정이 '모든 $\alpha$에서 $P(\alpha)=0$'이 아님
  feedback: 결론 '$P(\alpha)\ne0$인 $\alpha$가 존재'의 부정은 '$[0,3]$의 모든 $\alpha$에서 $P(\alpha)=0$'입니다.
- id: MC-PRF-81939
  name: $P(0)=P(1)=P(2)=P(3)=0$에서 삼차식과의 모순 근거를 쓰지 않음
  concepts:
  - CON-PRF-FACTOR-THEOREM
  used_in: KW-G19B-01#3-2
  outcome_code: '73'
  wrong_work: 네 점에서 $0$이므로 모순이라고만 서술
  detect_cue: $x(x-1)(x-2)(x-3)Q(x)$ 인수분해 없음
  feedback: 인수정리로 $P(x)=x(x-1)(x-2)(x-3)Q(x)$이므로 $P$의 차수가 $4$ 이상이 되어 삼차식과 모순입니다.
- id: MC-GEO-81940
  name: $y=3^x$와 직선의 교점을 연립해 풀려다 닫힌 형태를 못 구함
  concepts:
  - CON-GEO-INVERSE-SYMMETRY
  used_in: KW-G19B-02#1-1
  outcome_code: '71'
  wrong_work: $3^x=\log_3n-x+n$을 $x$에 대해 해결 시도
  detect_cue: $Q_n$ 좌표를 구하지 못함
  feedback: $y=\log_3x$와 $y=3^x$는 $y=x$에 대해 대칭이고 기울기 $-1$인 직선은 $y=x$에 수직이므로 $Q_n=(\log_3n,n)$입니다.
- id: MC-GEO-81941
  name: $\triangle OP_nQ_n$ 넓이에서 $\overline{P_nB_n}$의 길이를 $n-\log_3 n$ 대신 $\log_3 n$으로 둠
  concepts:
  - CON-GEO-AREA-DECOMP
  used_in: KW-G19B-02#1-2
  outcome_code: '71'
  wrong_work: $\triangle P_nB_nQ_n=\dfrac12(\log_3n)^2$
  detect_cue: $a_n$에 $-\frac12(\log_3n)^2$ 부호 오류
  feedback: $P_n=(n,\log_3n)$, $B_n=(n,n)$이므로 $\overline{P_nB_n}=n-\log_3n$입니다.
- id: MC-GEO-81942
  name: 대칭이동한 도형의 방정식에서 $x$, $y$만 바꾸고 상수항도 바꿈
  concepts:
  - CON-GEO-REFLECTION
  used_in: KW-G19B-02#2-1
  outcome_code: '71'
  wrong_work: $B:\ y^2-4x-4=0$
  detect_cue: $y^2-4x+4=0$이 아님
  feedback: $f(x,y)=0\to f(y,x)=0$이므로 $x^2-4y+4=0$은 $y^2-4x+4=0$이 됩니다. 상수항은 그대로입니다.
- id: MC-ALG-81943
  name: 두 도형이 한 점에서 만남을 연립방정식 판별식 한 번으로만 처리
  concepts:
  - CON-ALG-SIMULTANEOUS
  used_in: KW-G19B-02#2-1
  outcome_code: '72'
  wrong_work: $y$ 소거 4차식의 인수분해 없이 중근이라 주장
  detect_cue: $(x-2)^2(x^2+4x+20)=0$ 정리 없음, $x^2+4x+20$ 허근 확인 없음
  feedback: $(x-2)^2(x^2+4x+20)=0$이고 $x^2+4x+20$의 판별식이 음수이므로 실근은 $x=2$뿐입니다.
- id: MC-CAL-81944
  name: 단면 정삼각형의 넓이를 $\frac12\ell^2$로 계산
  concepts:
  - CON-CAL-VOLUME-CROSS-SECTION
  used_in: KW-G19B-02#2-2
  outcome_code: '71'
  wrong_work: $S(x)=\dfrac12\left(\dfrac14x^2-x+1\right)^2$
  detect_cue: $\sin60^\circ$ 누락, 부피 $\frac{31}{160}$
  feedback: 한 변이 $\ell$인 정삼각형의 넓이는 $\dfrac{\sqrt3}4\ell^2$이고 $V=\dfrac{\sqrt3}{4}\cdot\dfrac{31}{80}=\dfrac{31\sqrt3}{320}$입니다.
- id: MC-CAL-81945
  name: 단면의 한 변의 길이를 $\left\lvert\frac14x^2+1\right\rvert$ 아래 직선과의 차가 아닌 값으로 설정
  concepts:
  - CON-CAL-VOLUME-CROSS-SECTION
  used_in: KW-G19B-02#2-2
  outcome_code: '72'
  wrong_work: 한 변 $=\dfrac14x^2+1$
  detect_cue: $y=x$를 빼지 않음
  feedback: 밑면은 $A$와 $y=x$ 사이의 영역이므로 단면의 한 변은 $\left(\dfrac14x^2+1\right)-x$입니다.
- id: MC-CAL-81946
  name: $f'(x)=0$의 중근 경우($b=-1$)를 제외하지 않고 $b\le-1$로 답함
  concepts:
  - CON-CAL-EXTREMUM-TEST
  used_in: KW-G19B-02#3
  outcome_code: '71'
  wrong_work: $b\le-1$
  detect_cue: 답에 등호 포함
  feedback: $b=-1$이면 $f^{\prime}(x)=(x-1)^2\ge0$으로 극값이 없습니다. 서로 다른 두 실근이 필요하므로 $b<-1$입니다.
- id: MC-ALG-81947
  name: $\cos\theta+\sec\theta$의 부호를 따지지 않고 $b>1$ 가능성을 남김
  concepts:
  - CON-ALG-AM-GM
  used_in: KW-G19B-02#3
  outcome_code: '72'
  wrong_work: 판별식 $b^2-1>0$에서 $b>1$ 또는 $b<-1$
  detect_cue: 산술·기하평균 $-2b\ge2$ 누락
  feedback: $-\pi/2<\theta<\pi/2$에서 $\cos\theta,\sec\theta>0$이므로 $-2b=\cos\theta+\sec\theta\ge2$, 즉 $b\le-1$이어서 $b>1$은 불가능합니다.
- id: MC-CAL-81948
  name: 극대·극소를 $x=\cos\theta$와 $x=\sec\theta$ 중 어느 쪽이 큰지 비교하지 않고 판정
  concepts:
  - CON-CAL-EXTREMUM-TEST
  used_in: KW-G19B-02#3
  outcome_code: '73'
  wrong_work: $\cos\theta$에서 극소, $\sec\theta$에서 극대
  detect_cue: 극대·극소가 뒤바뀜
  feedback: $a=\dfrac13>0$이므로 $f^{\prime}(x)=(x-\cos\theta)(x-\sec\theta)$이고 $\cos\theta<\sec\theta$이므로 $\cos\theta$에서 $+\to-$ (극대), $\sec\theta$에서 $-\to+$ (극소)입니다.
- id: MC-CAL-81949
  name: $\lim_{x\to0}\frac{\tan3x}{x}=3$만으로 $a=3$일 때도 성립한다고 결론
  concepts:
  - CON-CAL-INEQ-MONOTONE
  used_in: KW-G19B-02#4
  outcome_code: '71'
  wrong_work: $x\to0$에서 $\tan3x/x\to3$이므로 $a\le3$이고 $a=3$ 성립
  detect_cue: $a=3$ 성립 근거(증가·하한) 없음
  feedback: $\dfrac{\tan3x}{x}$가 증가하거나 $f^{\prime}\ge0$임을 보여야 $\tan3x>3x$가 성립합니다.
- id: MC-CAL-81950
  name: $f'(0)<0$일 때 구간 $(0,b)$에서 $f<0$이 됨을 보이지 않고 그림으로만 설명
  concepts:
  - CON-CAL-INTERMEDIATE-VALUE
  used_in: KW-G19B-02#4
  outcome_code: '72'
  wrong_work: $f^{\prime}(0)<0$이면 그래프가 아래로 간다고 서술
  detect_cue: 사이값 정리·$\lim f^{\prime}=\infty$ 논증 없음
  feedback: $f^{\prime}$가 연속이고 $f^{\prime}(0)<0$, 오른쪽에서 $+\infty$이므로 사이값 정리로 $f^{\prime}(b)=0$인 $b$가 있고 $(0,b)$에서 $f$는 감소하여 $f<0$입니다.
- id: MC-CAL-81951
  name: $f^{\prime\prime}(x)>0$을 이용하지 않고 $f^{\prime}(x)>0$을 곧바로 가정
  concepts:
  - CON-CAL-SECOND-DERIVATIVE
  used_in: KW-G19B-02#4
  outcome_code: '73'
  wrong_work: $f^{\prime}(x)=3\sec^23x-a>0$을 자명하게 처리
  detect_cue: $f''>0\Rightarrow f'$ 증가 단계 없음
  feedback: $f^{\prime\prime}(x)=18\sec^23x\tan3x>0$이므로 $f^{\prime}$는 증가하고 $f^{\prime}(0)=3-a\ge0$이면 $f^{\prime}>0$입니다.
- id: MC-ALG-81980
  name: 평행이동에서 $f(n)$을 $f(n+k)$로 처리
  concepts:
  - CON-ALG-TRANSLATION
  used_in: KW-M19-01#1
  outcome_code: '71'
  wrong_work: $g(n)=f(n+k)=\sqrt{n+k+2}+\sqrt{n+k+1}$
  detect_cue: 답이 $\sqrt{2019+k+\cdots}$ 꼴
  feedback: $x$축 방향으로 $k$만큼 평행이동하면 $g(n)=f(n-k)$입니다. $k<0$이므로 $n-k+1>0$입니다.
- id: MC-ALG-81981
  name: 분모의 유리화에서 켤레를 곱하지 않고 합을 그대로 둠
  concepts:
  - CON-ALG-RATIONALIZE
  used_in: KW-M19-01#1
  outcome_code: '72'
  wrong_work: $\dfrac2{g(n)}=\dfrac{2}{\sqrt{n-k+2}}+\dfrac{2}{\sqrt{n-k+1}}$
  detect_cue: 분모를 합의 분수로 분리
  feedback: $\dfrac{1}{A+B}\ne\dfrac1A+\dfrac1B$입니다. 켤레 $\sqrt{n-k+2}-\sqrt{n-k+1}$를 곱하면 분모가 $1$이 됩니다.
- id: MC-ALG-81982
  name: 망원급수에서 끝항을 $\sqrt{2019-k}$로 계산
  concepts:
  - CON-ALG-TELESCOPING
  used_in: KW-M19-01#1
  outcome_code: '73'
  wrong_work: $2(\sqrt{2019-k}-\sqrt{2-k})$
  detect_cue: 마지막 항 $n=2018$에서 $\sqrt{n-k+2}=\sqrt{2020-k}$를 놓침
  feedback: $n=2018$일 때 $\sqrt{n-k+2}=\sqrt{2020-k}$이고 $n=1$일 때 $\sqrt{n-k+1}=\sqrt{2-k}$입니다.
- id: MC-CAL-81983
  name: $f$를 3번 합성한 결과를 $f(x)$의 역수로 잘못 계산
  concepts:
  - CON-ALG-COMPOSITE
  used_in: KW-M19-01#2-1
  outcome_code: '71'
  wrong_work: $(f\circ f)(x)=\dfrac1{(1-x)^2}$
  detect_cue: 합성을 곱으로 처리, $g(x)\ne x$
  feedback: $(f\circ f)(x)=f(f(x))=\dfrac{1}{1-\frac1{1-x}}=1-\dfrac1x$이고 $(f\circ f\circ f)(x)=x$입니다.
- id: MC-PRF-81984
  name: $n=3t+2$를 보이는 데 $3t,3t+1$ 경우를 배제하는 근거를 쓰지 않음
  concepts:
  - CON-PRF-CASE-ANALYSIS
  used_in: KW-M19-01#2-2
  outcome_code: '71'
  wrong_work: $f$를 2번 합성하면 $1-\frac1x$이므로 $n=2$라고만 서술
  detect_cue: $n=3t$, $3t+1$ 경우 언급 없음
  feedback: 자연수 $n$은 $3t,3t+1,3t+2$ 중 하나이고 앞의 두 경우 $h(x)$는 $x$, $\dfrac1{1-x}$이므로 조건을 만족할 수 없어 $n=3t+2$입니다.
- id: MC-ALG-81985
  name: $w^{52}$를 $w^{52 \bmod 2}$로 줄임
  concepts:
  - CON-ALG-CUBIC-ROOT-POWER
  used_in: KW-M19-01#3
  outcome_code: '71'
  wrong_work: $w^{52}=1$, $w^{27}=w$로 계산
  detect_cue: $a+bw+1=0$ 에서 $a=-1$, $b=0$
  feedback: $w^3=1$이므로 지수를 $3$으로 나눈 나머지로 줄입니다. $52=3\cdot17+1$, $27=3\cdot9$이므로 $w^{52}=w$, $w^{27}=1$입니다.
- id: MC-ALG-81986
  name: $aw+b+1=0$에서 $a,b$가 실수임을 쓰지 않고 한 식에서 해를 결정
  concepts:
  - CON-ALG-COMPLEX-EQUATION
  used_in: KW-M19-01#3
  outcome_code: '72'
  wrong_work: $aw+b+1=0$이므로 $b=-1-aw$
  detect_cue: $a,b$ 값이 $w$를 포함
  feedback: $w$는 허수이고 $a,b$는 실수이므로 $aw+(b+1)=0$에서 허수부와 실수부를 비교해 $a=0$, $b=-1$입니다.
- id: MC-ALG-81987
  name: $[x^2-2x]=-1$을 $x^2-2x=-1$로 처리
  concepts:
  - CON-ALG-GAUSS-EQ
  used_in: KW-M19-01#4
  outcome_code: '71'
  wrong_work: $x^2-2x=-1\Rightarrow x=1$ (중근)
  detect_cue: 결과는 우연히 $x=1$이나 구간 조건 없음
  feedback: $[A]=-1\iff-1\le A<0$입니다. $x^2-2x\ge-1$은 항상 성립하고 $x^2-2x<0$에서 $0<x<2$이며 정수 $x=1$입니다.
- id: MC-ALG-81988
  name: $[x^2-2x-5]$를 $[x^2-2x]-5$로 정리하지 않고 상수로 처리
  concepts:
  - CON-ALG-GAUSS
  used_in: KW-M19-01#4
  outcome_code: '72'
  wrong_work: $[f(x)]=-3$, $[g(x)]=-5$
  detect_cue: 방정식이 $-5=-6$이 되어 해 없음
  feedback: 정수를 더한 경우에만 $[A+n]=[A]+n$이 성립하므로 $[x^2-2x-3]=[x^2-2x]-3$입니다. $[x^2-2x]$는 상수가 아닙니다.
- id: MC-CAL-81989
  name: 로그함수의 $y$축 평행이동을 $x$축 평행이동으로 처리
  concepts:
  - CON-ALG-TRANSLATION
  used_in: KW-M19-02#1
  outcome_code: '71'
  wrong_work: $y=\log_2(x-c)$로 두고 $(3,k)$ 대입
  detect_cue: $x$절편이 $c+1$ 꼴
  feedback: $y$축 방향으로 $b$만큼 평행이동하면 $y=\log_2x+b$이고 $(3,k)$를 지나므로 $b=k-\log_23$, $x$절편은 $a_k=\dfrac3{2^k}$입니다.
- id: MC-CAL-81990
  name: 무한등비급수의 공비를 $2$로 처리
  concepts:
  - CON-CAL-GEOMETRIC-SERIES
  used_in: KW-M19-02#1
  outcome_code: '72'
  wrong_work: $\sum_{k=1}^\infty\dfrac3{2^k}$에서 첫째항 $3$, 공비 $2$
  detect_cue: 급수가 발산한다고 답함
  feedback: $a_k=\dfrac3{2^k}$이므로 첫째항 $\dfrac32$, 공비 $\dfrac12$이고 합은 $\dfrac{3/2}{1-1/2}=3$입니다.
- id: MC-CAL-81991
  name: 두 후보 $\cos a=\pm\frac1{\sqrt{10}}$ 중 극소 조건($f''(a)>0$)으로 고르지 않음
  concepts:
  - CON-CAL-SECOND-DERIVATIVE
  used_in: KW-M19-02#2
  outcome_code: '71'
  wrong_work: $\tan a=-3$에서 $\cos a=\pm\dfrac1{\sqrt{10}}$ 두 값을 모두 답
  detect_cue: $\cos a$ 값이 두 개
  feedback: $f^{\prime\prime}(a)=e^{-3a}(-10\cos a)>0$이어야 극소이므로 $\cos a<0$이고 $\cos a=-\dfrac1{\sqrt{10}}$입니다.
- id: MC-CAL-81992
  name: $f(x)=e^{-3x}\cos x$의 미분에서 $e^{-3x}$의 도함수 부호 누락
  concepts:
  - CON-CAL-PRODUCT-RULE
  used_in: KW-M19-02#2
  outcome_code: '72'
  wrong_work: $f^{\prime}(x)=e^{-3x}(3\cos x-\sin x)$
  detect_cue: $\tan a=3$
  feedback: $(e^{-3x})^{\prime}=-3e^{-3x}$이므로 $f^{\prime}(x)=-e^{-3x}(3\cos x+\sin x)$입니다.
- id: MC-CAL-81993
  name: $\int\tan x\,dx$를 $\ln\lvert\cos x\rvert+C$로 부호 오류
  concepts:
  - CON-CAL-SUBSTITUTION
  used_in: KW-M19-02#3-1
  outcome_code: '71'
  wrong_work: $t=\cos x$, $dt=\sin x\,dx$로 놓고 $\int\dfrac1t\,dt=\ln\lvert t\rvert$
  detect_cue: 답 $\ln\lvert\cos x\rvert+C$
  feedback: $dt=-\sin x\,dx$이므로 $\int\tan x\,dx=-\int\dfrac1t\,dt=-\ln\lvert\cos x\rvert+C$입니다.
- id: MC-CAL-81994
  name: $\lvert\tan x\rvert$의 적분을 $[(n-\frac14)\pi,(n+\frac14)\pi]$ 전체에서 $\tan x$로 적분해 $0$을 얻음
  concepts:
  - CON-CAL-ABS-INTEGRAL
  used_in: KW-M19-02#3-2
  outcome_code: '71'
  wrong_work: $\int_{(n-1/4)\pi}^{(n+1/4)\pi}\tan x\,dx=0$이므로 $S_n=0$
  detect_cue: 답 $0$
  feedback: $\lvert\tan x\rvert$는 $x=n\pi$ 좌우에서 부호가 달라 대칭이므로 $2\int_0^{\pi/4}\tan x\,dx=\ln2$입니다.
- id: MC-GEO-81995
  name: $\angle AOB$를 $\theta$로 둠
  concepts:
  - CON-GEO-CENTRAL-ANGLE
  used_in: KW-M19-02#4-1
  outcome_code: '71'
  wrong_work: 부채꼴 넓이 $\dfrac12\cdot9\theta$
  detect_cue: 넓이 $\frac92\theta$
  feedback: $\angle OAB=\angle OBA=\dfrac\pi2-\theta$이므로 $\angle AOB=2\theta$이고 부채꼴 넓이는 $9\theta$입니다.
- id: MC-GEO-81996
  name: 영역 $y\ge t(x+2)$의 넓이를 부채꼴-삼각형으로 잘못 설정
  concepts:
  - CON-GEO-SEGMENT-AREA
  used_in: KW-M19-02#4-2
  outcome_code: '71'
  wrong_work: $g(\theta)=9\theta-\dfrac92\sin2\theta$
  detect_cue: 답에 $9\theta-\frac92\sin2\theta$ (활꼴 넓이만)가 있고 $9\pi$가 없음
  feedback: $y\ge t(x+2)$는 중심 $O$를 포함하는 쪽이므로 원 전체에서 활꼴 $9\theta-\dfrac92\sin2\theta$를 뺀 $9\pi-9\theta+\dfrac92\sin2\theta$입니다.
- id: MC-CAL-81997
  name: $g(\theta)=f(\tan\theta)$의 미분에서 $\sec^2\theta$ 연쇄법칙을 빠뜨림
  concepts:
  - CON-CAL-CHAIN-RULE
  used_in: KW-M19-02#4-3
  outcome_code: '71'
  wrong_work: $g^{\prime}(\theta)=f^{\prime}(\tan\theta)$
  detect_cue: $f^{\prime}(1)=g^{\prime}(\pi/4)=-9$
  feedback: $g^{\prime}(\theta)=f^{\prime}(\tan\theta)\sec^2\theta$이므로 $f^{\prime}(1)=\dfrac{g^{\prime}(\pi/4)}{2}=-\dfrac92$입니다.
- id: MC-CAL-81998
  name: $\cos2\theta=1-2\sin^2\theta$를 $1+2\sin^2\theta$로 처리
  concepts:
  - CON-CAL-TRIG-IDENTITY
  used_in: KW-M19-02#4-3
  outcome_code: '72'
  wrong_work: $g^{\prime}(\theta)=-9+9(1+2\sin^2\theta)=18\sin^2\theta$
  detect_cue: $f^{\prime}(1)=+\frac92$
  feedback: $\cos2\theta=1-2\sin^2\theta$이므로 $g^{\prime}(\theta)=-18\sin^2\theta$입니다.
