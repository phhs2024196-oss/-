# 광운대 2022학년도 모의논술 자연계열 [문제 1]·[문제 2] — 오개념 후보 (공용 카탈로그 반영 전 제안). ID 구간 MC-*-82280~82299
misconceptions:
- id: MC-CAL-82280
  name: 방정식 $g(x)=x$의 근 존재를 $g(a)>a$, $g(b)<b$ 경우로 나누지 않고 사잇값 정리를 바로 적용
  concepts:
  - CON-CAL-IVT-FIXEDPOINT
  used_in: KW-M22-01#1-1
  outcome_code: '71'
  wrong_work: $f(a)\cdot f(b)<0$을 가정
  detect_cue: 등호 경우 누락
  feedback: $g(a)=a$ 또는 $g(b)=b$이면 이미 근이고 아니면 $f(a)>0>f(b)$입니다.
- id: MC-CAL-82281
  name: 평균값 정리로 유일성을 보일 때 $\lvert g^{\prime}\rvert<1$과 $g^{\prime}(c)=1$의 모순을 서술하지 않음
  concepts:
  - CON-CAL-MVT-CONTRADICTION
  used_in: KW-M22-01#1-2
  outcome_code: '72'
  wrong_work: $g^{\prime}(c)=1$만 얻고 종결
  detect_cue: 귀류가 없음
  feedback: $\lvert g^{\prime}(x)\rvert<1$에 모순이므로 서로 다른 두 근은 존재할 수 없습니다.
- id: MC-ALG-82282
  name: $\sqrt{2x+1}-2x+k=0$의 두 실근 조건에서 끝점 $\left(-\dfrac12,0\right)$을 지나는 $k=-1$을 열린 경계로 처리
  concepts:
  - CON-ALG-RADICAL-ROOTS
  used_in: KW-M22-01#2
  outcome_code: '71'
  wrong_work: $-\dfrac54<k<-1$ 아닌 $-\dfrac54<k\le-1$ 만으로 답
  detect_cue: (a)와 교집합을 안 취함
  feedback: (b)만으로는 $k\le-1$ 포함이나 (a) $k<-1$과 겹쳐 $-\dfrac54<k<-1$입니다.
- id: MC-GEO-82283
  name: 사각형 $\mathrm{OAPB}$의 넓이 최대에서 $P$를 $AB$의 수직이등분선과 원의 교점 중 $O$ 쪽으로 잡음
  concepts:
  - CON-GEO-QUAD-MAX
  used_in: KW-M22-01#3-2
  outcome_code: '72'
  wrong_work: $\triangle\mathrm{APB}$를 최소로 만드는 $P$ 선택
  detect_cue: 넓이가 작게 나옴
  feedback: $\mathrm{OP}$가 지름이 되는 $P$(원의 반대쪽)에서 사각형 $\mathrm{OAPB}$의 넓이가 최대입니다.
- id: MC-CAL-82284
  name: $px-2\le h(x)\le qx-2$에서 $p$의 최댓값을 끝점 기울기의 최솟값으로 잡음
  concepts:
  - CON-CAL-CONVEX-TANGENT
  used_in: KW-M22-01#4
  outcome_code: '71'
  wrong_work: $p\le\dfrac2e$
  detect_cue: 접선 기울기 $\ln2$와 비교 안 함
  feedback: $h$가 아래로 볼록하므로 $p$의 최댓값은 접선 기울기 $\ln2$이고 $q$의 최솟값은 끝점 $(1,-1)$을 지나는 기울기 $1$입니다.
- id: MC-CAL-82285
  name: 합성함수 $(f\circ f)^{\prime}=f^{\prime}(f(x))f^{\prime}(x)$의 영점을 모두 극값으로 판단
  concepts:
  - CON-CAL-COMPOSITE-EXTREMUM
  used_in: KW-M22-02#1-3
  outcome_code: '72'
  wrong_work: $x=0,3$ 둘 다 극값
  detect_cue: $x=0$에서 부호 변화 없음
  feedback: $x=0$에서는 $f^{\prime}\ge0$이 유지되어 $(f\circ f)^{\prime}$도 부호가 바뀌지 않으므로 극값은 $x=3$뿐입니다.
- id: MC-ALG-82286
  name: $S_n$에서 $a_n=S_n-S_{n-1}$을 $n\ge2$에서만 얻고 $a_1$ 확인을 생략
  concepts:
  - CON-ALG-SUM-GENERAL-TERM
  used_in: KW-M22-02#2-2
  outcome_code: '71'
  wrong_work: $a_n=2\pi n-\dfrac74\pi$ $(n\ge2)$
  detect_cue: $n=1$ 일치 확인 없음
  feedback: $a_1=S_1=\dfrac\pi4$이고 $2\pi-\dfrac74\pi=\dfrac\pi4$이므로 $n\ge1$에서 성립합니다.
- id: MC-CAL-82287
  name: $\displaystyle\int_0^1F(e^x+F)dx$에서 $F^2$ 적분을 $\int F\,F^{\prime}$ 꼴로 바꾸지 못함
  concepts:
  - CON-CAL-INTEGRAL-F
  used_in: KW-M22-02#3-2
  outcome_code: '72'
  wrong_work: $F$를 직접 구하려다 막힘
  detect_cue: $\dfrac{d}{dx}\dfrac{F^2}{2}$ 미사용
  feedback: 조건 (a)로 $F^2=F(f+1-e^x)$로 쓰고 $\int F f=\dfrac{F^2}{2}\big|_0^1$로 계산합니다.
