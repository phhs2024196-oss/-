# 광운대 2023학년도 모의논술(M23_1, M23_2) 오개념 후보 — 공용 카탈로그(db/misconceptions.yaml)에 아직 넣지 않은 제안.
# ID: MC-<영역>-8<yy>NN. 23 모의: 82380~82399. concepts 는 개념 그래프(db/concepts.yaml) 확정 후 채움.
misconceptions:
- id: MC-PRF-82380
  name: cos(2πcos x) 꼴에서 u=cos x 의 값마다 x 가 0≤x<2π 에서 2개씩(u=±1 은 1개) 대응함을 놓쳐 실수 x 의 개수를 u 의 개수로 답함
  concepts: []
  from: KW-M23-01 1-1
- id: MC-ALG-82381
  name: 세 수가 등비수열일 조건 b^2=ac 에서 공비를 한 값(√3/3)만 구하고 sin 의 부호가 반대인 경우(-√3/3)를 빼먹음
  concepts: []
  from: KW-M23-01 1-2
- id: MC-ALG-82382
  name: 복소수 z+1/z 가 실수일 조건에서 y=0 인 경우와 |z|=1 인 경우 중 한쪽만 고려해 곡선을 원 전체 또는 x축 위만으로 그림
  concepts: []
  from: KW-M23-01 2
- id: MC-ALG-82383
  name: x+1/x=√2 에서 x 를 실수로 가정하고 해가 없다고 하거나, 복소수 x=e^{iπ/4} 의 2023 제곱에서 주기 8 로 줄이지 않고 계산함
  concepts: []
  from: KW-M23-01 3-1
- id: MC-ALG-82384
  name: g(f(x)+2) 의 식에서 x^2+1/x^2=(x+1/x)^2-2 로 바꾸는 과정에서 -2 를 빠뜨려 g 의 상수항을 틀림
  concepts: []
  from: KW-M23-01 3-2
- id: MC-PRF-82385
  name: y=|x-a|+x 를 x≥a 와 x<a 로 나눈 뒤 y=√(x+2) 와의 교점 조건 x≥-2, 2x-a≥0 의 외래근 검증을 하지 않고 이차방정식의 판별식만으로 a 의 범위를 구함
  concepts: []
  from: KW-M23-01 4
- id: MC-CAL-82386
  name: 극한함수 f(x)=lim x^{2n}/(sin(x^{2n}π)+x^{2n}) 에서 |x|<1 일 때 sin(tπ)/t→π 임을 쓰지 않고 분모의 sin 항을 0 으로 처리해 f(x)=1 로 답함
  concepts: []
  from: KW-M23-01 5-1
- id: MC-CAL-82387
  name: x=0 에서 극한함수가 정의되지 않음(0/0 꼴이 아니라 모든 n 에서 정의되지 않음)을 무시하고 연속이라고 판단하거나 x=±1 에서 좌극한과 함숫값의 차이를 확인하지 않음
  concepts: []
  from: KW-M23-01 5-1
- id: MC-PRF-82388
  name: 평행이동한 곡선 y=x^2+k 와 f 의 그래프의 교점 개수를 셀 때 f 가 x=0 에서 정의되지 않음을 놓치고 k=1/(π+1) 의 경계 처리와 k=0 의 포함 여부를 틀림
  concepts: []
  from: KW-M23-01 5-2
- id: MC-CAL-82389
  name: 산술·기하평균 부등식 2^a+2^b≥2√(2^{a+b}) 로 최솟값은 구하나 구간의 끝점 (a,b)=(0,1) 에서 최댓값 3 을 확인하지 않음
  concepts: []
  from: KW-M23-02 1-1
