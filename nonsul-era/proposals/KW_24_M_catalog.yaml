# 광운대 2024학년도 모의논술 자연계열 [문제 1]·[문제 2] — 오개념 후보 (공용 카탈로그 반영 전 제안). ID 구간 MC-*-82480~82499
misconceptions:
- id: MC-GEO-82480
  name: $\sin x=\cos x$의 해 중 $y$축에 가장 가까운 점을 잘못 선택
  concepts:
  - CON-GEO-TRIG-TANGENT
  used_in: KW-M24-01#1-1
  outcome_code: '71'
  wrong_work: $\tan x=1$의 해로 $x=\dfrac{5\pi}{4}$를 택함
  detect_cue: 교점이 $\mathrm{A}\left(\frac{\pi}{4},\cdot\right)$가 아님
  feedback: $\tan x=1$의 해는 $\dfrac{\pi}{4}+m\pi$이고 $y$축에 가장 가까운 것은 $x=\dfrac{\pi}{4}$입니다.
- id: MC-GEO-82481
  name: $\overline{\mathrm{BC}}$를 두 $y$절편의 합으로 계산
  concepts:
  - CON-GEO-TRIG-TANGENT
  used_in: KW-M24-01#1-1
  outcome_code: '72'
  wrong_work: $\overline{\mathrm{BC}}=\dfrac{\sqrt2(4+\pi)}{8}+\dfrac{\sqrt2(4-\pi)}{8}=\dfrac{\sqrt2}{2}$, 넓이 $\dfrac{\sqrt2\pi}{16}$
  detect_cue: 답 $\frac{\sqrt2\pi}{16}$
  feedback: $\mathrm{B},\mathrm{C}$가 $y$축 위의 두 점이므로 거리는 $y$절편의 차입니다.
- id: MC-GEO-82482
  name: 사인법칙에서 $2R$의 2를 누락
  concepts:
  - CON-GEO-LAW-SINES
  used_in: KW-M24-01#1-2
  outcome_code: '71'
  wrong_work: $R=\dfrac{a}{\sin A}=\dfrac{3\pi}{8}$
  detect_cue: 답 $\frac{3\pi}{8}$
  feedback: 사인법칙은 $\dfrac{a}{\sin A}=2R$이므로 $R=\dfrac{a}{2\sin A}$입니다.
- id: MC-PRF-82483
  name: 귀납 단계에서 $k+1\ge2$의 근거를 쓰지 않음
  concepts:
  - CON-PRF-INDUCTION
  used_in: KW-M24-01#2-1
  outcome_code: '71'
  wrong_work: $(k+1)!=k!(k+1)\ge2^{k-1}(k+1)\ge2^k$에서 마지막 부등호의 근거 생략
  detect_cue: $k\ge1$이므로 $k+1\ge2$라는 언급 없음
  feedback: $2^{k-1}(k+1)\ge2^{k-1}\cdot2$는 $k+1\ge2$, 즉 $k\ge1$일 때 성립함을 밝혀야 합니다.
- id: MC-ALG-82484
  name: $a_n$의 극한값으로 근사해 $m$을 절단으로 구함
  concepts:
  - CON-ALG-SERIES-BOUND
  used_in: KW-M24-01#2-2
  outcome_code: '72'
  wrong_work: $a_{2024}\approx e-1\approx1.718$이므로 $a_{2024}-2024\approx-2022.28$, $m=-2022$
  detect_cue: 답 $-2022$
  feedback: $m+\alpha$에서 $0\le\alpha<1$이므로 $m$은 내림(바닥)입니다. $-2022.28=-2023+0.72$이므로 $m=-2023$입니다.
- id: MC-CAL-82485
  name: 역함수가 존재할 조건을 $f^{\prime}(x)>0$ 엄격 부등식으로 둠
  concepts:
  - CON-CAL-INVERSE-EXISTS
  used_in: KW-M24-01#3-1
  outcome_code: '71'
  wrong_work: $g(-1)=-n+k>0$에서 $k>n$이므로 최솟값이 없다
  detect_cue: 최솟값이 존재하지 않는다고 결론
  feedback: $f^{\prime}(x)\ge0$이고 등호가 한 점에서만 성립하면 $f$는 증가함수이므로 $k=n$도 가능합니다.
- id: MC-CAL-82486
  name: $f^{\prime}$의 최솟값을 극대점에서 찾음
  concepts:
  - CON-CAL-INVERSE-EXISTS
  used_in: KW-M24-01#3-1
  outcome_code: '72'
  wrong_work: $x=-n-3$에서 $g(x)=e^{-n-2}(n+4)+k\ge0$으로부터 $k\ge-(n+4)e^{-n-2}$
  detect_cue: 답이 음수
  feedback: $g^{\prime}$의 부호로 보면 $x=-n-3$은 극대이고 최솟값은 $x=-1$에서 $g(-1)=k-n$입니다.
- id: MC-ALG-82487
  name: 부분분수 분해에서 계수 $\frac12$ 누락
  concepts:
  - CON-ALG-TELESCOPING
  used_in: KW-M24-01#3-2
  outcome_code: '71'
  wrong_work: $\dfrac{1}{n(n+1)(n+2)}=\dfrac{1}{n(n+1)}-\dfrac{1}{(n+1)(n+2)}$로 보고 합 $\dfrac12$
  detect_cue: 답 $\frac12$
  feedback: $\dfrac{1}{n(n+1)}-\dfrac{1}{(n+1)(n+2)}=\dfrac{2}{n(n+1)(n+2)}$이므로 $\dfrac12$을 곱해야 합니다.
- id: MC-ALG-82488
  name: $\ln k=1$인 경우를 실근 조건에 포함
  concepts:
  - CON-ALG-QUAD-DISCRIMINANT
  used_in: KW-M24-01#4
  outcome_code: '71'
  wrong_work: $\ln k\le1$이면 판별식 조건을 만족하므로 $0<k\le e$
  detect_cue: 답 $0<k\le e$
  feedback: $\ln k=1$이면 방정식이 $1=0$이 되어 근이 없습니다. 이차방정식이므로 $k\ne e$입니다.
- id: MC-ALG-82489
  name: 판별식 부등호 방향 오류
  concepts:
  - CON-ALG-QUAD-DISCRIMINANT
  used_in: KW-M24-01#4
  outcome_code: '72'
  wrong_work: $(\ln k-1)(\ln k-2)\le0$으로 보고 $e\le k\le e^2$
  detect_cue: (가)의 범위가 (나)와 공집합
  feedback: 실근이면 $D\ge0$이므로 $(\ln k-1)(\ln k-2)\ge0$에서 $\ln k\le1$ 또는 $\ln k\ge2$입니다.
- id: MC-ALG-82490
  name: $2\sin^2t\le1$을 $\sin t\le\dfrac12$로 변형
  concepts:
  - CON-ALG-TRIG-INEQ
  used_in: KW-M24-01#4
  outcome_code: '73'
  wrong_work: $\sin t\le\dfrac12$에서 $t\le\dfrac{\pi}{6}$이므로 $0<k<\dfrac{5e}{6}$
  detect_cue: 상한이 $\frac{5e}{6}$
  feedback: $2\sin^2t\le1$이면 $\sin^2t\le\dfrac12$이므로 $-\dfrac{1}{\sqrt2}\le\sin t\le\dfrac{1}{\sqrt2}$입니다.
- id: MC-CAL-82491
  name: $x\ln\lvert x\rvert$의 $x=0$ 극한을 $0\cdot(-\infty)$로 보고 불연속 판단
  concepts:
  - CON-CAL-CONTINUITY-AT-ZERO
  used_in: KW-M24-02#1-1
  outcome_code: '71'
  wrong_work: $x\to0$에서 $x\ln\lvert x\rvert$가 정해지지 않으므로 $x=0$에서 불연속
  detect_cue: 결론이 ’$x=0$에서 불연속’
  feedback: $\ln\lvert x\rvert=t$로 놓으면 $te^t\to0$입니다. 주어진 $\displaystyle\lim_{x\to\infty}\dfrac{x^n}{e^x}=0$을 이용하세요.
- id: MC-CAL-82493
  name: $(1+h)^{\frac1h}$의 극한에서 $\ln$ 누락
  concepts:
  - CON-CAL-LIMIT-DEFINED-FN
  used_in: KW-M24-02#1-2
  outcome_code: '71'
  wrong_work: $\displaystyle\lim_{h\to0-}(1+h)\ln(1+h)^{\frac1h}=1\cdot e=e$
  detect_cue: 좌미분계수가 $e$
  feedback: $\displaystyle\lim_{h\to0}(1+h)^{\frac1h}=e$이므로 $\ln(1+h)^{\frac1h}\to\ln e=1$입니다.
- id: MC-CAL-82494
  name: $\left[\dfrac1e,1\right]$에서 $f(x)=\ln\lvert x\rvert$를 사용
  concepts:
  - CON-CAL-LIMIT-DEFINED-FN
  used_in: KW-M24-02#1-3
  outcome_code: '72'
  wrong_work: $\displaystyle\int_{\frac1e}^{e}\ln x\,dx=\dfrac2e$
  detect_cue: 답 $\frac2e$
  feedback: $\lvert x\rvert<1$에서는 $f(x)=x\ln\lvert x\rvert$이므로 $x=1$에서 구간을 나눠야 합니다.
- id: MC-CAL-82495
  name: 부분적분에서 $\frac12$ 계수 누락
  concepts:
  - CON-CAL-LIMIT-DEFINED-FN
  used_in: KW-M24-02#1-3
  outcome_code: '73'
  wrong_work: $\displaystyle\int_{\frac1e}^{1}x\ln x\,dx=\left[\dfrac12x^2\ln x\right]_{\frac1e}^{1}-\int_{\frac1e}^{1}x\,dx$
  detect_cue: 답 $\frac12+\frac{1}{e^2}$
  feedback: $\displaystyle\int x\ln x\,dx=\dfrac12x^2\ln x-\int\dfrac12x\,dx$입니다. 몫 $\dfrac{x^2}{2}$의 미분 $\dfrac1x\cdot\dfrac{x^2}{2}=\dfrac x2$를 확인하세요.
- id: MC-CAL-82496
  name: 역함수의 미분에서 $g^{\prime}(0)$을 역수로 취하지 않음
  concepts:
  - CON-CAL-INVERSE-DERIV
  used_in: KW-M24-02#2
  outcome_code: '71'
  wrong_work: $(f\circ g^{-1})^{\prime}(e)=f^{\prime}(0)\cdot g^{\prime}(0)=ae=1$, $R(x)=\dfrac xe+\pi$
  detect_cue: $a=\frac1e$
  feedback: $(g^{-1})^{\prime}(e)=\dfrac{1}{g^{\prime}(g^{-1}(e))}=\dfrac{1}{g^{\prime}(0)}$입니다.
- id: MC-CAL-82497
  name: 곱의 미분에서 $(1+3x)^n$의 연쇄법칙 계수 3 누락
  concepts:
  - CON-PRB-INDEPENDENT-TRIAL
  used_in: KW-M24-02#3-2
  outcome_code: '72'
  wrong_work: $f^{\prime}(x)=n(1+3x)^{n-1}x+(1+3x)^n$, $f^{\prime}(1)=2^{2n-2}(n+4)$
  detect_cue: 답 $2^{2n-2}(n+4)$
  feedback: $\dfrac{d}{dx}(1+3x)^n=3n(1+3x)^{n-1}$입니다. 합성함수의 미분에서 속함수의 도함수 3을 곱해야 합니다.
- id: MC-PRB-82498
  name: 독립시행의 확률에서 조합 $\,_n\mathrm{C}_k$ 누락
  concepts:
  - CON-PRB-INDEPENDENT-TRIAL
  used_in: KW-M24-02#3-1
  outcome_code: '71'
  wrong_work: $P_k=\left(\dfrac34\right)^k\left(\dfrac14\right)^{n-k}$
  detect_cue: $\sum P_k\ne1$
  feedback: $n$번 중 $k$번 이기는 순서의 수 $\,_n\mathrm{C}_k$를 곱해야 합니다.
- id: MC-ALG-82499
  name: 등비합에서 분모 $3x$ 약분 누락
  concepts:
  - CON-ALG-BINOMIAL-GEOM-SUM
  used_in: KW-M24-02#3-3
  outcome_code: '72'
  wrong_work: $\displaystyle\sum_{n=1}^{p}(1+3x)^nx=(1+3x)^{p+1}-(1+3x)$에서 $x^2$의 계수 $\dfrac{9p(p+1)}{2}$
  detect_cue: 답 $\frac{9p(p+1)}{2}$
  feedback: 공비 $1+3x$의 합에서 분모 $(1+3x)-1=3x$이므로 $\dfrac{x\{\cdots\}}{3x}=\dfrac13\{\cdots\}$입니다.
