# 광운대 2026학년도 실전 자연계열(1교시 G26A·2교시 G26B) — 오개념 카탈로그 추가 제안 (공용 db/misconceptions.yaml 은 수정하지 않음). 번호: 세션 A 82601~82629, B 82630~82659
- {id: MC-CNT-82601, name: n(B)=k 로 분류할 때 B 가 전체집합인 경우까지 합에 넣음, concepts: [부분집합의 개수, 이항정리], used_in: KW-G26A-01#1, outcome_code: '71', wrong_work: '조건 (나)를 놓치고 $k=1,\dots,6$으로 합해 $602+63=665$를 답한다.', detect_cue: '합의 끝이 ${}_6\mathrm{C}_6$까지이거나 답이 $665$이다.', feedback: '(나) $n(B)<n(U)=6$이므로 $B\ne U$, $k$는 $1$부터 $5$까지다. $B$가 공집합인 경우는 (가)로 이미 제외된다.'}
- {id: MC-CNT-82602, name: A 의 개수를 공집합 제외 없이 $2^k$ 로 셈, concepts: [부분집합의 개수, 이항정리], used_in: KW-G26A-01#1, outcome_code: '71', wrong_work: '$A\subset B$인 $A$의 개수를 $2^k$로 두고 ${}_6\mathrm{C}_k2^k$의 합 $664$를 답한다.', detect_cue: 각 항이 $2^k-1$이 아니라 $2^k$이다., feedback: (가)에서 $n(A)\ne0$이므로 $A$는 공집합이 아니다. $B$의 부분집합 $2^k$개 중 공집합을 빼 $2^k-1$개다.}
- {id: MC-GEO-82603, name: 평행이동한 두 삼각형의 겹친 넓이를 모든 이동 거리에서 평행사변형 넓이 $2a$ 로 둠, concepts: [평행이동, 도형의 넓이], used_in: KW-G26A-01#2-2, outcome_code: '71', wrong_work: $1<a\le2$에서도 $S=2a$로 두어 최댓값을 $4$ 등으로 답한다(또는 모서리 삼각형 두 개를 빼지 않음)., detect_cue: $1<a\le2$ 구간에서 이차식이 아니라 일차식이 쓰였다., feedback: '$a>1$이면 겹침 영역이 꼭짓점 $\mathrm{A}$, $\mathrm{A}^{\prime}$를 대각으로 하는 평행사변형에서 양쪽 모서리 삼각형 $2\times\tfrac12(a-1)\cdot2(a-1)$을 뺀 $-2a^2+6a-2$가 된다.'}
- {id: MC-GEO-82604, name: 원점대칭 점의 좌표에서 부호를 한 좌표만 바꿈, concepts: [원점에 대한 대칭이동], used_in: KW-G26A-01#2-1, outcome_code: '71', wrong_work: '$\mathrm{A}(-1,-1)\to\mathrm{A}^{\prime}(1,-1)$처럼 $x$만 바꿔 $x$축 대칭 같은 점을 쓴다.', detect_cue: '$\mathrm{A}^{\prime}\mathrm{B}^{\prime}\mathrm{C}^{\prime}$의 한 변이 $\mathrm{ABC}$의 변과 같은 직선 위에 있다.', feedback: '원점 대칭은 $(a,b)\to(-a,-b)$로 두 좌표의 부호를 모두 바꾼다.'}
- {id: MC-CAL-82605, name: '$\lvert x^3+k\rvert$ 의 근 $-\sqrt[3]{k}$ 가 $[0,1]$ 에 드는 $k$ 의 범위를 부호 혼동', concepts: [절댓값 정적분, 세제곱근], used_in: KW-G26A-01#3-1, outcome_code: '71', wrong_work: '$0<-\sqrt[3]{k}<1$을 $0<k<1$로 풀어 구간을 나눈다.', detect_cue: 가운데 구간이 $0<k<1$로 적혀 있다., feedback: '$0<-\sqrt[3]{k}<1\iff-1<k<0$. $k\ge0$이면 $x^3+k\ge0$이고 $k\le-1$이면 $[0,1]$에서 $x^3+k\le0$이다.'}
- {id: MC-CAL-82606, name: '근 $x=-\sqrt[3]{k}$ 앞뒤에서 절댓값 부호를 반대로 벗김', concepts: [절댓값 정적분], used_in: KW-G26A-01#3-1, outcome_code: '71', wrong_work: '$-1<k<0$에서 $\int_0^{-\sqrt[3]{k}}(x^3+k)dx+\int_{-\sqrt[3]{k}}^1(-x^3-k)dx$로 쓴다.', detect_cue: $x=0$ 근처에서 $x^3+k<0$인데 피적분함수를 $x^3+k$로 둔다., feedback: '$k<0$이면 $x=0$에서 $x^3+k=k<0$이므로 $0\le x\le-\sqrt[3]{k}$에서 $\lvert x^3+k\rvert=-x^3-k$이다.'}
- {id: MC-CAL-82607, name: '$S(k)=\tfrac32k\sqrt[3]{k}+k+\tfrac14$ 를 미분할 때 $k^{4/3}$ 의 지수 처리 오류', concepts: [거듭제곱의 미분, 극값], used_in: KW-G26A-01#3-2, outcome_code: '71', wrong_work: '$\tfrac32k^{4/3}$의 도함수를 $\tfrac32\cdot\tfrac43k^{1/3}\ne$ 로 쓰지 않고 $\tfrac32k^{1/3}$ 등으로 써서 $k=-\tfrac{8}{27}$ 같은 값을 얻는다.', detect_cue: '$S^{\prime}(k)=0$의 해가 $-\tfrac18$이 아니다.', feedback: '$\dfrac{d}{dk}\left(\tfrac32k^{4/3}\right)=2k^{1/3}$이므로 $S^{\prime}(k)=2\sqrt[3]{k}+1=0$에서 $k=-\tfrac18$.'}
- {id: MC-CAL-82608, name: 구간별 최솟값 비교에서 $-1<k<0$ 의 극솟값을 확인하지 않고 경계값만 비교, concepts: [구간별 함수의 최솟값, 극값], used_in: KW-G26A-01#3-2, outcome_code: '71', wrong_work: '$k\le-1$에서 $\tfrac34$, $k\ge0$에서 $\tfrac14$만 비교해 최솟값 $\tfrac14$를 답한다.', detect_cue: '$-1<k<0$ 구간의 $S^{\prime}$가 쓰이지 않았다.', feedback: '가운데 구간의 극솟값 $S(-\tfrac18)=\tfrac7{32}<\tfrac14$이므로 이것이 전체 최솟값이다.'}
- {id: MC-GEO-82609, name: '코사인법칙에서 $\angle\mathrm{POQ}$ 를 $\alpha+\beta$ 로 놓음', concepts: [코사인법칙, 동경과 각], used_in: KW-G26A-02#1-1, outcome_code: '71', wrong_work: '$\overline{\mathrm{PQ}}^2=2-2\cos(\alpha+\beta)$로 쓴다.', detect_cue: 그림에서 두 동경 사이 각이 $\alpha-\beta$인데 합으로 쓰였다., feedback: '$\mathrm{P}$는 각 $\alpha$, $\mathrm{Q}$는 각 $\beta$의 동경 위에 있으므로 $\angle\mathrm{POQ}=\alpha-\beta$이고, 덧셈정리는 $\beta\to-\beta$ 대입으로 얻는다.'}
- {id: MC-CAL-82610, name: '$\lim\dfrac{\cos h-1}{h}$ 의 값을 $\sin h/h$ 와 같이 $1$ 로 둠(또는 $h^2$ 로 나눈 값 $-\tfrac12$ 와 혼동)', concepts: [삼각함수의 극한, 미분계수의 정의], used_in: KW-G26A-02#1-2, outcome_code: '71', wrong_work: '$\dfrac{\cos h-1}{h}\to1$ 또는 $-\tfrac12$로 쓴다.', detect_cue: '결과가 $(\cos x)^{\prime}=\cos x-\sin x$ 꼴이다.', feedback: '$\dfrac{\cos h-1}{h}=-\dfrac{\sin^2h}{h^2}\cdot\dfrac{h}{\cos h+1}\to-1\cdot0=0$이다.'}
- {id: MC-ALG-82611, name: '$(i-1)^{2026}$ 와 $(1+i)^{2025}$ 를 거듭제곱 주기로 줄일 때 부호·지수 계산 오류', concepts: [복소수의 거듭제곱], used_in: KW-G26A-02#2, outcome_code: '71', wrong_work: '$(1-i)^{2026}$을 $2^{1013}$ 꼴 실수로 보거나 $(1-i)^2=2i$로 계산해 $a=-\tfrac12$을 얻는다.', detect_cue: $a$의 값이 $\tfrac12$이 아니다., feedback: '$(1+i)^2=2i$, $(1-i)^2=-2i$. $(1+i)^8=(1-i)^8=2^4$이므로 $(1+i)^{2025}=2^{1012}(1+i)$, $(1-i)^{2026}=2^{1012}(1-i)^2=2^{1012}(-2i)$.'}
- {id: MC-CNT-82612, name: $\log_bz$ 가 자연수인 $b$ 의 개수를 약수 개수가 아닌 다른 값으로 셈, concepts: [로그의 정의, 약수의 개수], used_in: KW-G26A-02#2, outcome_code: '71', wrong_work: '$z=2^{1012}$에서 $b=2^m$ 꼴만 세어 $1012$개로 답하거나 $b=1$을 포함한다.', detect_cue: 답이 $12$가 아니다., feedback: '$b=2^{1012/p}$($p=\log_bz$)가 자연수이려면 $p$는 $1012=2^2\cdot11\cdot23$의 약수. $b\ne1$이므로 약수 $12$개.'}
- {id: MC-GEO-82613, name: '현 $\mathrm{OP}$ 의 길이를 $\sqrt{2-d^2}$ (현의 절반)로 둠', concepts: [원과 직선, 현의 길이, 점과 직선 사이의 거리], used_in: KW-G26A-02#3-1, outcome_code: '71', wrong_work: '$\overline{\mathrm{OP}}=\sqrt{2-\tfrac{(a+1)^2}{a^2+1}}$로 쓴다.', detect_cue: '$\overline{\mathrm{OP}}$에 계수 $2$가 없다.', feedback: '원점 $\mathrm{O}$가 원 위에 있으므로 $\mathrm{OP}$는 현 전체이며 길이는 $2\sqrt{r^2-d^2}$이다.'}
- {id: MC-CAL-82614, name: $f=\lvert g\rvert$ 에서 $g$ 가 극소인 $a=-\tfrac13$ 을 $f$ 의 극소로 판정, concepts: [절댓값 함수의 극값, 증가와 감소], used_in: KW-G26A-02#3-2, outcome_code: '71', wrong_work: '$g^{\prime}$의 부호만 보고 $a=-\tfrac13$에서 극소 $-4$로 답한다.', detect_cue: $f(a)$의 극값에 음수가 나온다., feedback: '$g(-\tfrac13)=-4<0$이므로 $f=-g$이고 $g$가 극소인 곳에서 $f$는 극대, 극댓값은 $4$이다.'}
- {id: MC-ALG-82630, name: '이중 시그마를 합의 차로 바꿀 때 $\sum_{k=1}^{m-1}$ 을 $\sum_{k=1}^{m}$ 으로 둠', concepts: [시그마의 성질, 거듭제곱의 합], used_in: KW-G26B-01#1, outcome_code: '71', wrong_work: '$\sum_{k=m}^{10}k^2=\sum_{k=1}^{10}k^2-\sum_{k=1}^{m}k^2$로 쓴다(답 $2640$).', detect_cue: '$m=1$일 때 $\sum_{k=1}^{10}k^2$가 $0$이 된다.', feedback: '$\sum_{k=m}^{10}=\sum_{k=1}^{10}-\sum_{k=1}^{m-1}$이어야 하며 $m=1$이면 뺄 것이 없다. 정답은 $2925$.'}
- {id: MC-ALG-82631, name: 항등식 대신 꼭짓점의 좌표를 정점이라 답함, concepts: [항등식, 이차함수], used_in: KW-G26B-01#2-1, outcome_code: '71', wrong_work: '$f^{\prime}(x)=0$에서 $x=-(k+1)$을 구해 $k$에 대한 식을 정점이라 한다.', detect_cue: 답에 $k$가 남아 있다., feedback: 정점은 $k$에 관계없이 지나는 점이므로 $k$에 대해 정리한 $(2x+1)k+x^2+2x+3-y=0$이 모든 $k$에서 성립해야 한다.}
- {id: MC-ALG-82632, name: 선분과 서로 다른 두 점에서 만나는 조건에서 축의 위치 조건을 빠뜨림, concepts: [이차함수와 직선, 근의 위치], used_in: KW-G26B-01#2-2, outcome_code: '71', wrong_work: '$h(-1)\ge0$, $h(3)\ge0$, $D>0$만 써서 $k\in\left[-\tfrac{13}7,-\tfrac{\sqrt3}2\right)\cup\left(\tfrac{\sqrt3}2,1\right]$를 답한다.', detect_cue: '답에 $\left(\tfrac{\sqrt3}{2},1\right]$ 구간이 들어 있다.', feedback: '두 근이 모두 $[-1,3]$ 안에 있으려면 축 $-1<-\tfrac{2k+1}2<3$도 필요하다. 이것으로 $k>\tfrac{\sqrt3}2$ 구간이 제외된다.'}
- {id: MC-ALG-82633, name: 두 점에서 만나는 조건을 양 끝값의 곱 $h(-1)h(3)<0$ 으로 처리, concepts: [이차함수와 직선, 부호 판별], used_in: KW-G26B-01#2-2, outcome_code: '71', wrong_work: $h(-1)h(3)<0$을 사용한다., detect_cue: $h(-1)h(3)<0$이 쓰였고 판별식이 없다., feedback: '$h(-1)h(3)<0$이면 구간 안에서 근이 하나뿐이다. 두 근이면 $h(-1)\ge0$, $h(3)\ge0$이고 구간 안에서 $h<0$인 곳이 있어야 한다.'}
- {id: MC-CNT-82634, name: 한 점에서 여러 선분이 나가는 경우를 빠뜨리고 서로 다른 점 3개씩만 셈, concepts: [조합, 경우의 수], used_in: KW-G26B-01#3, outcome_code: '71', wrong_work: '${}_5\mathrm{C}_3\times{}_7\mathrm{C}_3=350$만 답한다.', detect_cue: 답이 $350$이다., feedback: '선분 끝점이 겹쳐도 교차가 아니므로 $l$ 위 점 1~3개, $m$ 위 점 1~3개를 쓰는 여섯 경우를 모두 센다.'}
- {id: MC-CNT-82635, name: 두 점을 고른 뒤 갈라지는 선분 배치의 가짓수 $2$ 를 곱하지 않음, concepts: [조합, 경우의 수], used_in: KW-G26B-01#3, outcome_code: '71', wrong_work: '$l$에서 2개·$m$에서 3개를 ${}_5\mathrm{C}_2\times{}_7\mathrm{C}_3=350$으로만 셈.', detect_cue: '(ⅱ),(ⅳ),(ⅴ)에 $\times2$가 없다.', feedback: 한쪽 두 점과 다른 쪽 세 점(또는 두 점)을 고르면 겹치는 점을 어느 쪽에 두느냐에 따라 비교차 배치가 $2$가지다.}
- {id: MC-PRB-82636, name: 표본평균의 표준편차를 모표준편차 $5$ 그대로 두고 표준화, concepts: [표본평균의 분포, 표준화], used_in: KW-G26B-01#4, outcome_code: '71', wrong_work: '$Z=\dfrac{\overline{X}-150}{5}$로 둔다.', detect_cue: 표준화 식의 분모가 $5$이다., feedback: '$n=100$이므로 $\overline{X}\sim\mathrm{N}(150,\tfrac{5^2}{100})$, 표준편차 $\tfrac12$이고 $Z=\dfrac{\overline{X}-150}{1/2}$.'}
- {id: MC-PRB-82637, name: '$\mathrm{P}(Z\ge z)\le0.98$ 에서 $0.5$ 를 빼지 않고 $\mathrm{P}(z\le Z\le0)\le0.98$ 로 처리', concepts: [정규분포, 확률의 계산], used_in: KW-G26B-01#4, outcome_code: '71', wrong_work: '$\mathrm{P}(300-10k\le Z\le0)\le0.98$로 두어 $300-10k\ge-\infty$ 같은 조건을 얻는다.', detect_cue: $0.48$이 나타나지 않는다., feedback: '$\mathrm{P}(Z\ge z)=\mathrm{P}(z\le Z\le0)+0.5\le0.98$이므로 $\mathrm{P}(z\le Z\le0)\le0.48=\mathrm{P}(-2.05\le Z\le0)$.'}
- {id: MC-ALG-82640, name: '두 근을 $a_n$, $b_n$ 으로 놓고 $b_n\sqrt3$ 의 $\sqrt3$ 를 빠뜨림', concepts: [이차방정식의 근과 계수의 관계], used_in: KW-G26B-02#1-1, outcome_code: '71', wrong_work: '$x^2-(2+\sqrt3)^nx+a_nb_n=0$의 두 근이 $a_n,b_n$이라 쓴다.', detect_cue: '$b_n$에 $\tfrac1{2\sqrt3}$ 대신 $\tfrac12$ 계수가 있다.', feedback: 합 $(2+\sqrt3)^n$은 $a_n+b_n\sqrt3$이고 곱 $a_n\cdot b_n\sqrt3=\sqrt3a_nb_n$이다. 곱 조건에 $\sqrt3$를 곱해 두 근을 구한다.}
- {id: MC-CAL-82641, name: '$\left(\dfrac{2-\sqrt3}{2+\sqrt3}\right)^n$ 의 수렴을 확인하지 않고 $a_n\approx b_n\sqrt3$ 로 근사', concepts: [등비수열의 극한], used_in: KW-G26B-02#1-2, outcome_code: '71', wrong_work: '$\dfrac{a_n^2-3b_n^2}{a_n}\to0$이라 하거나 극한을 $\tfrac{1}{\sqrt3}\cdot\tfrac{1-1}{1+1}$로 쓴다.', detect_cue: '$\left\lvert\dfrac{2-\sqrt3}{2+\sqrt3}\right\rvert<1$이 쓰이지 않았다.', feedback: '$a_n^2-3b_n^2=1$이고 $\dfrac{b_n}{a_n}=\dfrac1{\sqrt3}\cdot\dfrac{1-r^n}{1+r^n}\to\dfrac1{\sqrt3}$ ($r=\tfrac{2-\sqrt3}{2+\sqrt3}$, $\lvert r\rvert<1$).'}
- {id: MC-CAL-82642, name: '$\int e^x\sin x\,dx$ 를 부분적분하며 같은 적분이 다시 나타나는 것을 처리하지 못함', concepts: [부분적분], used_in: KW-G26B-02#2, outcome_code: '71', wrong_work: '부분적분을 한 번 하고 $e^x\sin x-\int e^x\cos x\,dx$에서 멈추거나 $\tfrac12$ 계수를 놓친다.', detect_cue: 결과에 $\tfrac12$이 없다., feedback: 두 번 부분적분하면 $I=e^x\sin x-e^x\cos x-I$이므로 $I=\tfrac12e^x(\sin x-\cos x)$.}
- {id: MC-CAL-82643, name: $x=0$ 대입에서 $\cos0$ 을 $0$ 으로 계산해 $f(0)=\tfrac32$, concepts: [정적분과 미분의 관계, 초기 조건], used_in: KW-G26B-02#2, outcome_code: '71', wrong_work: $f(0)=0-\cos0+\tfrac32$에서 $\cos0=0$으로 쓴다., detect_cue: $C=\tfrac12$ 등 $C\ne0$이다., feedback: $f(0)+\int_0^0f=-\cos0+\tfrac32=\tfrac12$이므로 $e^0f(0)=1+0+C$에서 $C=0$.}
- {id: MC-CAL-82644, name: '$\sin x=\cos x$ 의 근을 $[0,2\pi)$ 에서 $\tfrac\pi4$ 하나만 구함', concepts: [삼각방정식], used_in: KW-G26B-02#2, outcome_code: '71', wrong_work: $\tan x=1$에서 $x=\tfrac\pi4$만 쓴다., detect_cue: 근이 하나이다., feedback: '$\tan x=1$은 주기 $\pi$이므로 $[0,2\pi)$에서 $\tfrac\pi4,\tfrac{5\pi}4$.'}
- {id: MC-PRF-82645, name: '$\int_0^x2f(t)f^{\prime}(t)dt=\{f(x)\}^2-1$ 의 증명에서 합성함수의 미분(또는 $f(0)=1$)을 쓰지 않음', concepts: [합성함수의 미분, 정적분], used_in: KW-G26B-02#3-1, outcome_code: '71', wrong_work: '$2f(t)f^{\prime}(t)$를 곱의 적분으로 바로 계산하거나 $[f(t)^2]_0^x=f(x)^2$로 쓴다.', detect_cue: '$-\{f(0)\}^2$ 또는 $\frac{d}{dx}\{f(x)\}^2=2f(x)f^{\prime}(x)$가 없다.', feedback: '$\frac{d}{dt}\{f(t)\}^2=2f(t)f^{\prime}(t)$이므로 $\left[\{f(t)\}^2\right]_0^x=\{f(x)\}^2-\{f(0)\}^2=\{f(x)\}^2-1$.'}
- {id: MC-PRF-82646, name: '부등식 (나)나 (다) 하나만 써서 등식 $\{f\}^2=2ff^{\prime}$ 를 얻었다고 결론', concepts: [정적분과 부등식, 샌드위치 논증], used_in: KW-G26B-02#3-2, outcome_code: '71', wrong_work: '(나)에서 $f\le2f^{\prime}$을 등호로 바꿔 $f^{\prime}=\tfrac f2$라 한다.', detect_cue: (다)를 쓰는 줄이 없다., feedback: '(나)로 $\int f^2\le\int2ff^{\prime}$, (다)로 $\int2ff^{\prime}\le\int f^2$을 얻어 두 정적분이 같다. 같은 구간에서 두 부등식이 반대 방향이므로 등식이 된다.'}
- {id: MC-CAL-82647, name: '$\dfrac{f^{\prime}}{f}=\tfrac12$ 을 적분해 $f=\tfrac12x+C$ 또는 $e^{x/2}+C$ 로 씀', concepts: [로그 적분, 미분방정식], used_in: KW-G26B-02#3-2, outcome_code: '71', wrong_work: '$\int\dfrac{f^{\prime}}{f}dx=f$로 처리한다.', detect_cue: $\ln f$가 나타나지 않는다., feedback: '$\int\dfrac{f^{\prime}(x)}{f(x)}dx=\ln f(x)$($f>0$)이므로 $\ln f=\tfrac12x+C$, $f(0)=1$에서 $C=0$.'}
