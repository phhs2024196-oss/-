# 광운대 2027학년도 모의논술 자연계열 — 오개념 카탈로그 추가 제안 (공용 db/misconceptions.yaml 은 수정하지 않음). 번호 82780~82799
- {id: MC-PRF-82780, name: 수학적 귀납법의 귀납 단계에서 결론 $(k+1)!\ge(k+1)^2$ 을 가정으로 사용, concepts: [수학적 귀납법], used_in: KW-M27-01#1, outcome_code: '71', wrong_work: $n=k+1$일 때의 부등식에서 출발해 참인 식으로 변형한다., detect_cue: 귀납가정 $k!\ge k^2$ 대신 결론에서 출발한다., feedback: 가정 $k!\ge k^2$의 양변에 $k+1$을 곱해 $(k+1)!\ge k^2(k+1)\ge(k+1)^2$를 얻는다. 마지막 부등식은 $k\ge4$에서 $k^2\ge k+1$.}
- {id: MC-PRF-82781, name: $n\ge4$ 인 명제의 기초 단계를 $n=1$ 로 확인, concepts: [수학적 귀납법], used_in: KW-M27-01#1, outcome_code: '71', wrong_work: $n=1$일 때 $1!\ge1^2$ 성립을 보이고 귀납 단계로 넘어간다., detect_cue: 기초 단계가 $n=1$이다., feedback: '$n=3$에서는 $3!=6<9$이므로 $n=1,2$로 시작할 수 없다. 기초 단계는 $n=4$.'}
- {id: MC-CAL-82782, name: $\lvert\sin x\rvert\le\lvert x\rvert$ 을 $x>0$ 에서만 보임, concepts: [부등식의 증명, 도함수의 활용], used_in: KW-M27-01#2, outcome_code: '71', wrong_work: $g(x)=x-\sin x$가 증가하므로 $x\ge0$에서 $\sin x\le x$라 하고 끝낸다., detect_cue: $x<0$에서 $\sin x\ge x$가 쓰이지 않았다., feedback: '$g(0)=0$이고 증가하므로 $x<0$이면 $g<0$, 즉 $\sin x>x$이지만 $\lvert\sin x\rvert\le\lvert x\rvert$는 $x<0$에서도 따로 확인해야 한다(기함수 대칭).'}
- {id: MC-CAL-82783, name: 닫힌구간의 양 끝값만 비교해 최솟값을 $f(-\tfrac\pi2)$ 로 답함, concepts: [함수의 최대·최소, 증가와 감소], used_in: KW-M27-01#2, outcome_code: '71', wrong_work: '$f(-\tfrac\pi2)=\tfrac{\pi^2}4$, $f(\pi)=\pi^2-2$ 중 작은 값을 최솟값이라 한다.', detect_cue: '$f^{\prime}$의 부호표가 없고 최솟값이 $\tfrac{\pi^2}4$이다.', feedback: '$f^{\prime}(x)=2(x-\sin x)$는 $x=0$에서 부호가 바뀌므로 $x=0$에서 극소·최소 $f(0)=2$.'}
- {id: MC-CAL-82784, name: '치환적분에서 $bx^2=t$ 로 바꾸고 적분구간을 $[0,1]$ 로 둠', concepts: [치환적분, 정적분], used_in: KW-M27-01#3, outcome_code: '71', wrong_work: '$\int_0^1xe^{bx^2}dx=\int_0^1\tfrac1{2b}e^tdt$로 쓴다.', detect_cue: '위끝이 $1$인 채 $\tfrac{e-1}{2b}$가 나온다.', feedback: '$x:0\to1$이면 $t=bx^2:0\to b$이므로 $\tfrac1{2b}(e^b-1)$.'}
- {id: MC-ALG-82785, name: 항등식의 양변에 $x(x+1)$ 을 곱해 전개할 때 $(bx+b-2)x$ 의 항을 누락, concepts: [항등식, 다항식의 전개], used_in: KW-M27-01#4, outcome_code: '71', wrong_work: $(ax+2)(x+1)+(bx+b-2)x$를 $(a+b)x^2+(a+b)x+2$ 대신 $(a+b)x^2+\cdots$ 로 잘못 정리한다., detect_cue: '$a+b$와 $a^2+b^2$ 조건이 $2$, $3$이 아니다.', feedback: '$(ax+2)(x+1)=ax^2+(a+2)x+2$, $(bx+b-2)x=bx^2+(b-2)x$. 합은 $(a+b)x^2+(a+b)x+2$이고 우변은 $2x^2+2x+a^2+b^2-1$.'}
- {id: MC-ALG-82786, name: $a^5+b^5$ 를 $(a^2+b^2)(a^3+b^3)$ 으로만 계산하고 $-a^2b^2(a+b)$ 를 빠뜨림, concepts: [대칭식, 곱셈공식], used_in: KW-M27-01#4, outcome_code: '71', wrong_work: $a^5+b^5=(a^2+b^2)(a^3+b^3)=3\cdot5=15$., detect_cue: 답이 $15$이다., feedback: '$(a^2+b^2)(a^3+b^3)=a^5+b^5+a^2b^2(a+b)$이므로 $a^5+b^5=15-\tfrac14\cdot2=\tfrac{29}2$.'}
- {id: MC-PRB-82787, name: '조건부확률의 방향을 바꿔 $\mathrm{P}(B\mid A)=0.99$ 를 답함', concepts: [조건부확률], used_in: KW-M27-01#5, outcome_code: '71', wrong_work: 양성일 때 병에 걸렸을 확률을 $0.99$라 답한다., detect_cue: '$\mathrm{P}(B)$를 구하지 않았다.', feedback: '구하는 확률은 $\mathrm{P}(A\mid B)=\dfrac{\mathrm{P}(A\cap B)}{\mathrm{P}(B)}$이며 $\mathrm{P}(B)$는 걸린 경우·안 걸린 경우를 합해 $\tfrac{297}{10000}$.'}
- {id: MC-CAL-82788, name: 로그의 합을 곱으로 묶을 때 telescoping 에서 맨 앞·뒤 항을 잘못 남김, concepts: [로그의 성질, 급수의 합], used_in: KW-M27-02#1, outcome_code: '71', wrong_work: '$\prod_{k=0}^n\dfrac{(n+k-1)(n+k+1)}{(n+k)^2}=\dfrac{n-1}{n}\cdot\dfrac{2n+1}{2n}$을 $\dfrac{n-1}{2n}$ 등으로 쓴다.', detect_cue: '$(1+\tfrac1{2n})^n$ 인자가 없다.', feedback: '$m=n,\dots,2n$에 대해 $\dfrac{m-1}m\cdot\dfrac{m+1}m$의 곱에서 $\dfrac{m-1}m$의 곱은 $\dfrac{n-1}{2n}$, $\dfrac{m+1}m$의 곱은 $\dfrac{2n+1}n$.'}
- {id: MC-CAL-82789, name: $\lim\left(1-\dfrac1n\right)^n$ 을 $1$ 로 처리, concepts: [자연상수 e], used_in: KW-M27-02#1, outcome_code: '71', wrong_work: '$1^n=1$이라 하여 $\ln\left(1\cdot e^{1/2}\right)=\tfrac12$을 답한다.', detect_cue: 답이 $\tfrac12$이다., feedback: '$t=-\tfrac1n$로 놓으면 $(1+t)^{-1/t}\to e^{-1}$. 따라서 $\ln(e^{-1}e^{1/2})=-\tfrac12$.'}
- {id: MC-CAL-82790, name: '$e^{g}$ 에 대한 이차방정식의 두 근 중 음수 근을 선택', concepts: [이차방정식, 지수·로그함수], used_in: KW-M27-02#2-1, outcome_code: '71', wrong_work: '$e^g=x-\sqrt{x^2+1}$를 택해 $g=\ln(x-\sqrt{x^2+1})$이라 한다.', detect_cue: 로그의 진수가 음수다., feedback: '$e^{g}>0$이므로 $x+\sqrt{x^2+1}$만 가능하다($x-\sqrt{x^2+1}<0$).'}
- {id: MC-CAL-82791, name: '$\lim\dfrac{f(2x)-a}{x-\ln\sqrt2}=b$ 를 $b=f^{\prime}(\ln2)$ 로 읽어 합성함수의 $2$ 배를 누락', concepts: [미분계수의 정의, 합성함수의 미분], used_in: KW-M27-02#2-2, outcome_code: '71', wrong_work: '$b=f^{\prime}(\ln2)=\tfrac54$로 두어 $a+b=2$를 답한다.', detect_cue: '$2f^{\prime}(\ln2)$가 아니다.', feedback: '$\dfrac{f(2x)-a}{x-\ln\sqrt2}=2\cdot\dfrac{f(2x)-f(\ln2)}{2x-\ln2}\to2f^{\prime}(\ln2)=\tfrac52$.'}
- {id: MC-CAL-82792, name: '조건 (나)의 좌변을 $\dfrac d{dx}\left(e^{1-\sqrt x}f\right)$ 의 부호 반대로 읽음', concepts: [곱의 미분법, 적분], used_in: KW-M27-02#3, outcome_code: '71', wrong_work: '좌변을 $+\dfrac d{dx}(e^{1-\sqrt x}f)$로 보아 $e^{1-\sqrt x}f=-\sqrt x+C$를 얻는다.', detect_cue: $f(1)=1$에서 $C=2$가 나온다., feedback: '$\dfrac d{dx}\left(e^{1-\sqrt x}f\right)=e^{1-\sqrt x}\left(f^{\prime}-\dfrac f{2\sqrt x}\right)$이므로 좌변은 이것의 $-1$배.'}
- {id: MC-CAL-82793, name: $\sqrt x-1=t$ 치환에서 $dx=2(t+1)dt$ 를 빠뜨림, concepts: [치환적분, 부분적분], used_in: KW-M27-02#3, outcome_code: '71', wrong_work: '$\int_1^4e^{\sqrt x-1}\sqrt x\,dx=\int_0^1e^t(t+1)dt$로 쓴다.', detect_cue: 적분식에 $(t+1)^2$ 대신 $(t+1)$이 있다., feedback: '$x=(t+1)^2$, $dx=2(t+1)dt$이므로 $\int_0^12e^t(t+1)^2dt=4e-2$.'}
- {id: MC-GEO-82794, name: '직각삼각형 $\mathrm{COD}$, $\mathrm{EDC}$ 의 닮음에서 대응 변의 순서를 잘못 적음', concepts: [닮음, 비례식], used_in: KW-M27-02#4, outcome_code: '71', wrong_work: '$\overline{\mathrm{EC}}:\overline{\mathrm{CD}}=\overline{\mathrm{DO}}:\overline{\mathrm{CD}}$로 써서 $\overline{\mathrm{EC}}=\dfrac{(a+b)^2}{2ab}$ 꼴을 얻는다.', detect_cue: '$\overline{\mathrm{EC}}>\overline{\mathrm{CD}}$가 나온다.', feedback: '$\angle\mathrm{ECD}=\angle\mathrm{CDO}$, $\angle\mathrm{COD}=\angle\mathrm{EDC}$이므로 $\mathrm{EC}\leftrightarrow\mathrm{CD}$, $\mathrm{CD}\leftrightarrow\mathrm{DO}$ 대응: $\overline{\mathrm{EC}}:\overline{\mathrm{CD}}=\overline{\mathrm{CD}}:\overline{\mathrm{DO}}$.'}
