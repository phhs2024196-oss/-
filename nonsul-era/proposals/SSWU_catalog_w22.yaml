# w22 오개념 후보 (공용 카탈로그 수정 없음). G21 = 82101~, M22 = 82251~
- {id: MC-CAL-82101, name: '$0\cdot\infty$ 꼴을 0으로 처리', concepts: [삼각함수의 극한, 부정형], used_in: 'SSWU-G21-01#3', outcome_code: '71', wrong_work: '$\cos\frac{\pi}{n}\to1$이므로 $b_n-2a_n\to0$, 따라서 $n^2(b_n-2a_n)\to0$', detect_cue: '답이 $0$이거나 $n^2$을 곱하는 이유를 쓰지 않았다', feedback: '$b_n-2a_n\to0$이어도 $n^2\to\infty$이므로 $\frac{1-\cos x}{x^2}$ 꼴로 바꾸어 극한을 구해야 합니다.'}
- {id: MC-CAL-82102, name: '연속 조건에서 부호 오류', concepts: [연속, 삼각함수의 값], used_in: 'SSWU-G21-02#2', outcome_code: '71', wrong_work: '$f(1)=b\cos\pi=b$로 계산하여 $b=5$', detect_cue: '$\cos\pi$를 $1$로 둔다', feedback: '$\cos\pi=-1$이므로 $f(1)=-b=5$에서 $b=-5$입니다.'}
- {id: MC-GEO-82103, name: '현의 길이 대신 호의 길이 사용', concepts: [호도법, 현의 길이], used_in: 'SSWU-G21-03#2', outcome_code: '71', wrong_work: '$\overline{\mathrm{AA}^{\prime}}=3\times(\text{호 }\mathrm{P}_0\mathrm{P}_1)=3\times2\pi\sqrt3=6\sqrt3\pi$', detect_cue: '답에 $\pi$가 포함된다', feedback: '$\mathrm{AA}^{\prime}$은 점 $\mathrm{P}_0$와 $\mathrm{P}_3$ 사이의 직선 거리이므로 호가 아니라 현 $\mathrm{P}_0\mathrm{P}_1=9$의 세 배입니다.'}
- {id: MC-PRB-82104, name: '경계 위의 격자점 누락', concepts: [격자점, 합의 법칙], used_in: 'SSWU-G21-04#2', outcome_code: '71', wrong_work: '$x=k$ 위의 점의 개수를 $2n-2\lvert k\rvert$로 세어 $N(n)=2n^2$', detect_cue: '$N(1)=2$ 처럼 둘레 위의 점이 빠진다', feedback: '둘레와 내부를 모두 세므로 $x=k$ 위에는 $2n-2\lvert k\rvert+1$개이고 $N(n)=2n^2+2n+1$입니다.'}
- {id: MC-ALG-82251, name: '로그의 합을 곱의 로그로 분리 오류', concepts: [로그의 성질], used_in: 'SSWU-M22-01#3', outcome_code: '71', wrong_work: '$\log_2(A+B)=\log_2A+\log_2B$로 나눔', detect_cue: '$\log_2$ 안의 합을 각각 로그로 분리한다', feedback: '$\log_2(A+B)$는 분리되지 않으므로 먼저 $\left(\frac12\right)^{n+2}(2+\sin4\theta n)$로 묶어 곱 꼴로 만든 뒤 로그를 취합니다.'}
- {id: MC-CAL-82252, name: '평행선 사이 거리를 절편 차로 사용', concepts: [평행선 사이의 거리, 직사각형의 넓이], used_in: 'SSWU-M22-02#3', outcome_code: '71', wrong_work: '직사각형의 변을 $y$절편의 차 $\frac{20\sqrt{15}}{9}$, $4$로 두어 $\frac{80\sqrt{15}}{9}$', detect_cue: '답이 $\frac{80\sqrt{15}}{9}$이다', feedback: '두 접선 사이의 거리는 $y$절편의 차에 $\sin\frac\pi4$(또는 $\frac1{\sqrt2}$)를 곱해야 합니다.'}
- {id: MC-CAL-82253, name: '넓이 급수의 공비를 제곱하지 않음', concepts: [등비급수, 닮음비와 넓이비], used_in: 'SSWU-M22-03#3', outcome_code: '71', wrong_work: '$\sum A_n$의 공비를 $r_n$의 공비 $\frac{1}{\sqrt3\tan(\theta/2)+1}$ 그대로 사용', detect_cue: '$\sum A_n$이 $\frac{\sqrt3}{4}\cdot\frac{2a}{\sqrt3}$ 꼴로 나온다', feedback: '넓이는 변의 길이의 제곱이므로 $A_n$의 공비는 $r_n$의 공비의 제곱입니다.'}
- {id: MC-ALG-82254, name: '$N_k$를 $k$로 오인', concepts: [로그, 약수의 개수], used_in: 'SSWU-M22-04#2', outcome_code: '71', wrong_work: '$n=2^l$ ($l=1,\ldots,k$)이 모두 조건을 만족한다고 보아 $N_k=k$', detect_cue: '$N_6=6$ 처럼 약수가 아닌 $l$까지 센다', feedback: '$k\log_{2^l}2=\frac kl$이 자연수여야 하므로 $l$은 $k$의 약수입니다. $N_6=4$입니다.'}
