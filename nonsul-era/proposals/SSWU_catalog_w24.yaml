# 성신여대 g24.pdf(2023 실전·2024 모의 자연계열) 오개념 후보 — 공용 카탈로그 미수정
- id: MC-CAL-82301
  name: f(x)=x∫g 의 차수 오판
  concepts:
  - 다항함수의 차수
  - 정적분
  used_in: SSWU-G23-01#1
  outcome_code: '71'
  wrong_work: f(x)=x∫0^x g(t)dt 의 차수를 g 와 같다고 보아 g 를 사차함수로 둔다
  detect_cue: g(x)=x^4+… 로 시작한다
  feedback: ∫0^x g(t)dt 는 차수가 1 올라가고 x 가 곱해져 다시 1 올라가므로 f 의 차수는 deg g + 2 입니다.
- id: MC-CAL-82302
  name: 치환적분 시 상수·구간 처리 오류
  concepts:
  - 치환적분
  - 삼각함수의 덧셈정리
  used_in: SSWU-G23-02#1
  outcome_code: '71'
  wrong_work: x+π/4 치환 후 상수 √2·e^{π/4} 를 약분하지 못해 A=B=√2 등으로 답함
  detect_cue: A=B=√2 또는 A=B=e^{π/4}
  feedback: 치환하면 구간이 [0,nπ]로 바뀌고 e^{-π/4} 는 e^{π/4} 와, 1/√2 는 √2 와 약분되어 A=B=1 입니다.
- id: MC-GEO-82303
  name: sin 과 cos 혼동으로 O2M 오산
  concepts:
  - 원의 현
  - 삼각비
  used_in: SSWU-G23-03#1
  outcome_code: '71'
  wrong_work: O2M 을 O1O2 cosθ=2cosθ 로 놓고 MQ 를 구함
  detect_cue: O2M=2cosθ
  feedback: 직각삼각형 O1O2M 에서 θ 의 대변이 O2M 이므로 O1O2 sinθ 입니다.
- id: MC-PRB-82304
  name: 연속 3회 경계 칸 처리 오류
  concepts:
  - 경우의 수
  - 곱의 법칙
  used_in: SSWU-G23-04#2
  outcome_code: '71'
  wrong_work: aaa□□, □aaa□, □□aaa 의 □ 에 10 가지를 모두 허용하여 중복 계산
  detect_cue: 300 꼴 계산
  feedback: 세 번만 연속이려면 aaa 의 앞뒤 칸은 a 가 아니어야 하므로 9 를 곱하고 네·다섯 번 연속은 따로 셉니다.
- id: MC-CAL-82451
  name: 최솟값 계산 오류로 양수 판정 실패
  concepts:
  - 도함수
  - 최솟값
  used_in: SSWU-M24-01#1
  outcome_code: '71'
  wrong_work: f(-1+ln2) 를 4-2ln2 로 계산하지 못하거나 최솟값 계산 없이 f>0 이라 주장
  detect_cue: 최솟값 계산이 없거나 4-2ln2 가 아님
  feedback: e^{1+t}=2 이므로 최솟값은 2-2t=2-2(-1+ln2)=4-2ln2>0 입니다.
- id: MC-GEO-82452
  name: 반각과 θ_n 혼동
  concepts:
  - 원의 접선
  - 배각공식
  used_in: SSWU-M24-02#3
  outcome_code: '71'
  wrong_work: cosθ_n 을 cos(θ_n/2)=√(n/(n+2)) 로 답함
  detect_cue: cosθ_n=√(n/(n+2))
  feedback: OP_n 은 ∠Q_nOR_n 의 이등분선이므로 ∠P_nOR_n=θ_n/2 이고 cosθ_n=2cos²(θ_n/2)-1 입니다.
- id: MC-CAL-82453
  name: 극한 존재 조건 없이 g(1) 결정
  concepts:
  - 함수의 극한
  - 미분계수의 정의
  used_in: SSWU-M24-03#2
  outcome_code: '71'
  wrong_work: lim(f+g)=0 근거 없이 g(1)=1 을 가정
  detect_cue: g(1)=1 의 근거가 없다
  feedback: 분모 (x-1)^2 중 하나는 e^x-e 와 약분되고 남은 (x-1) 때문에 f(x)+g(x)→0 이어야 합니다.
- id: MC-CAL-82454
  name: 정적분 부등식의 부등호 방향 오류
  concepts:
  - 정적분
  - 부등식
  used_in: SSWU-M24-04#3
  outcome_code: '71'
  wrong_work: 아래로 볼록인데 사다리꼴 넓이 ≤ 정적분 으로 비교
  detect_cue: 사다리꼴 ≤ ∫
  feedback: 아래로 볼록한 곡선은 두 끝점을 잇는 선분 아래에 있으므로 정적분 ≤ 사다리꼴 넓이입니다.
