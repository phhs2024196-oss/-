# w25 오개념 후보 — 성신여대 2024 실전·2025 모의 자연계열 (공용 카탈로그 미수정)
- {id: MC-CAL-82401, name: 접선 개수에서 중근(D=0) 경우 누락, concepts: [접선의 방정식, 판별식], used_in: 'SSWU-G24-01#2', outcome_code: '71', wrong_work: '$D>0$인 경우의 $a=-\frac13$만 답으로 쓰고 $a=\frac13$(중근 $t=1$, 합 1)을 빠뜨림', detect_cue: '답이 $a=-\frac13$ 하나뿐이다', feedback: '$D=0$이면 중근도 접점의 $x$좌표이므로 그 값이 합 조건을 만족하는지 따로 확인해야 합니다.'}
- {id: MC-GEO-82402, name: 공통부분 모양이 바뀌는 구간 무시, concepts: [정삼각형의 넓이, 구간별 함수], used_in: 'SSWU-G24-02#1', outcome_code: '71', wrong_work: '$\frac32<t<3$에서도 마름모 공식 $f(t)=\frac{t^2}{2\sqrt3}$를 그대로 사용', detect_cue: '$f(t)$를 구간 구분 없이 한 식으로 씀', feedback: '$t=\frac32$에서 두 변 AB, DE가 겹치기 시작해 공통부분이 마름모에서 육각형으로 바뀝니다.'}
- {id: MC-CAL-82403, name: 비 θ/α를 1로 착각, concepts: [삼각함수의 극한], used_in: 'SSWU-G24-03#2', outcome_code: '71', wrong_work: '$\theta_n,\alpha_n\to0$이므로 $\theta_n\approx\alpha_n$이라 보고 극한을 1로 씀', detect_cue: '답이 1이고 $\tan\theta_n=\frac1{3n}$ 계산이 없다', feedback: '두 각 모두 0으로 가도 비는 $\frac{\tan\theta_n}{\tan\alpha_n}$로 비교해야 하며 $\frac13$입니다.'}
- {id: MC-CAL-82404, name: 부분적분에서 경계항 h(1)을 f(1)로 계산, concepts: [부분적분법], used_in: 'SSWU-G24-04#2', outcome_code: '71', wrong_work: '$h(1)=f(1)=2$로 두어 $2-\int_0^1h=1$, 즉 $\int_0^1h=1$', detect_cue: '답이 +1이다', feedback: '$h(x)=f(x)-2$이므로 $h(1)=f(1)-2=0$입니다.'}
- {id: MC-CAL-82551, name: 곱의 미분에서 한 쪽만 미분, concepts: [곱의 미분법, 삼각함수의 미분], used_in: 'SSWU-M25-01#2', outcome_code: '71', wrong_work: '$\sin(kx+\frac\pi4)$만 미분하여 $f^{\prime}(0)=\sum k\cos\frac\pi4\sin\frac\pi4=\frac{n(n+1)}{4}$', detect_cue: '$f^{\prime}(0)$에 $(k+1)$ 항이 없다', feedback: '곱의 미분법으로 두 인수를 모두 미분해 $k+(k+1)$ 배가 나와야 합니다.'}
- {id: MC-CAL-82552, name: 공통접선 조건에서 함숫값 일치 누락, concepts: [접선의 방정식, 공통접선], used_in: 'SSWU-M25-02#2', outcome_code: '71', wrong_work: '$x=\pm1$ 중 한 점만 택하거나 기울기만 맞추고 $c$를 하나(예 $c=5$)만 구함', detect_cue: '$c$ 값이 하나뿐이다', feedback: '기울기가 같은 $x=1,-1$ 각각에서 함숫값이 같아지도록 $c$를 따로 구해야 합니다.'}
- {id: MC-CAL-82553, name: 치환적분에서 적분 구간 미변환, concepts: [치환적분법], used_in: 'SSWU-M25-03#3', outcome_code: '71', wrong_work: '$u=t^2+1$ 치환 후 구간을 $[0,1]$ 그대로 두어 $\left[-\frac1u\right]_0^1=-\frac12+\infty$ 꼴로 막히거나 $\frac12$ 대신 $-\frac12$로 계산', detect_cue: '$\int\frac1{u^2}du$의 위끝·아래끝이 $t$ 구간 그대로다', feedback: '$t=0,1$은 $u=1,2$이므로 구간도 함께 바꿔야 합니다.'}
- {id: MC-ALG-82554, name: 넓이 합의 공비를 4/5로 착각, concepts: [등비수열, 닮음비], used_in: 'SSWU-M25-04#2', outcome_code: '71', wrong_work: '개수 4배와 길이비 $\frac25$를 곱해 공비를 $\frac85$ 또는 $\frac45$로 둠', detect_cue: '공비가 $\frac{16}{25}$이 아니다', feedback: '넓이비는 길이비의 제곱 $\left(\frac25\right)^2$이므로 공비는 $4\times\frac4{25}=\frac{16}{25}$입니다.'}
