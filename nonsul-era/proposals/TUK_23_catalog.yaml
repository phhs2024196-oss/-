# 한국공학대 2023학년도(G23A·G23B) 오개념 후보 — 공용 db/misconceptions.yaml 에는 넣지 않고 검토 후 병합한다.
# ID 범위: MC-*-442301 ~ 442399.
proposed_misconceptions:
- id: MC-CAL-442301
  name: 삼차함수의 역함수 존재 조건을 판별식 $D>0$ 으로 잘못 세움(증가함수 조건 $p'(x)\ge0$ 을 놓침)
  appears_in: [TUK-G23A-03#3]
  wrong_work: '$p''(x)=3x^2+2(m+3)x+1$ 에서 $D>0$ 을 조건으로 놓아 $m<-3-\sqrt3$ 또는 $m>-3+\sqrt3$ 을 구함'
  detect_cue: 답의 $m$ 범위가 $[-3-\sqrt3,-3+\sqrt3]$ 의 바깥쪽이거나 등호를 빠뜨렸다
- id: MC-CAL-442302
  name: 함수와 그 역함수의 그래프가 만나는 점을 $y=x$ 위가 아닌 점까지 포함하여 넓이 구간을 잡음
  appears_in: [TUK-G23A-03#4]
  wrong_work: '$h(x)=k(x)$ 를 직접 풀려 하거나 구간을 $[0,1]$ 의 한 번만 적분하고 2배를 빠뜨림'
  detect_cue: 답이 $\dfrac1{12}$ 로 나온다
- id: MC-ALG-442303
  name: 조건에 따라 달라지는 점화식에서 $c_n<5$ 판정 기준을 직전 항 $c_{n+1}$ 에 적용
  appears_in: [TUK-G23A-02#3]
  wrong_work: '$c_3$ 을 구할 때 $c_2=4<5$ 로 보아 $\dfrac{(c_2)^2}{c_1}$ 을 사용'
  detect_cue: $c_3=\dfrac{16}6$ 등이 답안에 나타난다
- id: MC-CAL-442304
  name: 닫힌구간의 최솟값이 $-1$ 이 되는 $k$ 에서 극솟점을 포함하는 경우만 세고 $f(-5)=-1$ 인 경우를 놓침
  appears_in: [TUK-G23B-02#4]
  wrong_work: '$x=1\in[k,k+2]$ 만 조사하여 $k=-1,0,1$ 만 답함'
  detect_cue: 답에 $k=-5$ 가 없다
- id: MC-ALG-442305
  name: 삼차방정식이 서로 다른 세 실근을 갖는 조건을 $f(0)<0$ 또는 $f(2)>0$ 한쪽만 쓰거나 $f(0)f(2)\le0$ 로 등호 포함
  appears_in: [TUK-G23B-01#4]
  wrong_work: '$f(0)f(2)\le0$ 에서 $\dfrac12\le a\le8$ 로 답함'
  detect_cue: 답의 범위 끝점에 등호가 있다
