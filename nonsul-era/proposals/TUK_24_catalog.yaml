# 한국공학대 2024학년도(G24A·G24B) 오개념 후보 — 공용 db/misconceptions.yaml 에는 넣지 않고 검토 후 병합한다.
# ID 범위: MC-*-442401 ~ 442499.
proposed_misconceptions:
- id: MC-CAL-442401
  name: 분모가 $0$ 으로 가는 극한식에서 분자도 $0$ 으로 가야 함을 쓰지 않고 곧바로 $f'(0)$ 을 대입
  appears_in: [TUK-G24A-02#1, TUK-G24B-03#3]
  wrong_work: '조건 (나)에서 $f(0)=0$ 을 얻지 않고 $c$ 를 미정으로 둠'
  detect_cue: $f(0)=c=0$ 또는 $f(0)=a$ 를 쓰는 단계가 없다
- id: MC-CAL-442402
  name: 미분계수의 정의 변형에서 $f(a+3h)-f(a)$ 를 $3h$ 로 나누지 않고 $h$ 로 나눈 값을 $f'(a)$ 로 착각
  appears_in: [TUK-G24B-02#1]
  wrong_work: '$f''(a)=9$, $f''(b)=9$ 로 놓고 $3x^2-3x-3=9$ 를 품'
  detect_cue: 'a+b 의 값이 1 이 아니다'
- id: MC-CAL-442403
  name: 속도의 부호가 바뀌는 구간을 나누지 않고 $\int_0^2v(t)dt$ 를 움직인 거리로 사용
  appears_in: [TUK-G24A-02#3, TUK-G24B-02#3]
  wrong_work: '$\int_0^2 v(t)dt$ 를 계산(위치 변화량)'
  detect_cue: 절댓값이나 구간 분할이 없다
- id: MC-CAL-442404
  name: 역함수의 정적분을 $y=x$ 대칭으로 바꿀 때 직사각형 넓이에서 빼는 순서를 뒤바꿈
  appears_in: [TUK-G24A-03#1]
  wrong_work: '$\int_0^1 f(x)dx$ 또는 $1-\int_0^1 f$ 의 부호를 잘못 처리하여 $-\dfrac1{12}$ 또는 $\dfrac{11}{12}$ 를 답함'
  detect_cue: 답이 $\dfrac{13}{12}$ 이 아니다
- id: MC-ALG-442405
  name: 판별식 $D=0$ 에서 얻은 삼각방정식의 근을 $0\le\theta<2\pi$ 에서 하나만 적음
  appears_in: [TUK-G24A-01#1, TUK-G24B-01#1]
  wrong_work: '$\cos\theta=\dfrac12$ 에서 $\theta=\dfrac\pi3$ 만 쓰고 $\dfrac{5\pi}3$ 을 빠뜨림'
  detect_cue: (다)(라) 중 하나가 비어 있다
