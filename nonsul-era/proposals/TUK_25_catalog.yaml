# 한국공학대 2025학년도 실전(G25A·G25B) 오개념 후보 — 공용 카탈로그(db/misconceptions.yaml) 반영 전 제안.
# ID 범위 MC-*-442501~442599. concepts 의 CON-* 는 db/concepts.yaml 에 아직 없는 제안 개념(반영 시 함께 추가).
# used_in: 이 오개념이 나올 만한 문항(문항 파일에는 카탈로그 반영 후 misconceptions 로 연결).
misconceptions:
- id: MC-ALG-442501
  name: 비례식 $p:q=r:s$ 에서 내항의 곱과 외항의 곱이 같다는 것을 쓰지 않고 $\dfrac{p}{q}=\dfrac{s}{r}$ 처럼 뒤집어 세움
  concepts: [CON-ALG-PROPORTION]
  used_in: ['TUK-G25A-02']
- id: MC-ALG-442502
  name: 이차방정식의 두 근 중 문제의 조건($a\ne b$, 양수 등)으로 버려야 할 근을 버리지 않고 둘 다 답으로 취급
  concepts: [CON-ALG-ROOT-SELECTION]
  used_in: ['TUK-G25A-02', 'TUK-G25A-03', 'TUK-G25A-06']
- id: MC-ALG-442503
  name: 지수함수·로그함수 그래프가 제1사분면에서 만날 조건을 한 축과의 교점 하나만으로 처리하고 다른 축 절편 조건을 빠뜨림
  concepts: [CON-ALG-EXPLOG-GRAPH-QUADRANT]
  used_in: ['TUK-G25A-04', 'TUK-G25B-04']
- id: MC-ALG-442504
  name: $\angle A>\dfrac{\pi}{2}$ 인 삼각형에서 $\sin A=\cos B$ 를 $\angle A=\dfrac{\pi}{2}-\angle B$ 로 처리
  concepts: [CON-ALG-TRIG-OBTUSE]
  used_in: ['TUK-G25B-01']
- id: MC-ALG-442505
  name: $S_{n+2}-S_n$ 을 $a_{n+2}$ 한 항으로 착각하여 $a_{n+2}+a_{n+1}$ 로 바꾸지 못함
  concepts: [CON-ALG-SUM-TERM-RELATION]
  used_in: ['TUK-G25B-03']
- id: MC-CAL-442501
  name: 극한 $\lim_{x\to a}\dfrac{h(x)}{x-a}$ 가 유한할 때 $h(a)=0$ 임을 쓰지 않고 곧바로 미분계수로 처리
  concepts: [CON-CAL-LIMIT-DERIVATIVE-DEF]
  used_in: ['TUK-G25A-05', 'TUK-G25B-05']
- id: MC-CAL-442502
  name: 곱의 미분법에서 $\{f(x)g(x)\}'=f'(x)g'(x)$ 로 계산
  concepts: [CON-CAL-DIFF-PRODUCT]
  used_in: ['TUK-G25A-05', 'TUK-G25B-05']
- id: MC-CAL-442503
  name: $\{f(x)\}^2$ 이 연속이면 $f(x)$ 도 연속이라고 보아 $x=1$ 에서 $f$ 의 좌극한·함숫값·우극한을 직접 같다고 놓음
  concepts: [CON-CAL-CONTINUITY-SQUARE]
  used_in: ['TUK-G25A-06']
- id: MC-CAL-442504
  name: 유리함수의 연속 조건에서 $x=0$ 의 연속만 확인하고 분모가 0이 되는 다른 점이 없을 조건(판별식)을 빠뜨림
  concepts: [CON-CAL-CONTINUITY-RATIONAL]
  used_in: ['TUK-G25B-06']
- id: MC-CAL-442505
  name: 곡선과 직선으로 둘러싸인 두 영역의 넓이를 구간을 나누지 않고 한 번에 $\int|{\rm 위}-{\rm 아래}|$ 의 부호 없이 더하거나, 위·아래 함수를 바꾸어 뺌
  concepts: [CON-CAL-AREA-BETWEEN]
  used_in: ['TUK-G25A-07', 'TUK-G25B-07']
- id: MC-CAL-442506
  name: 움직인 거리를 $\int v\,dt$ (위치의 변화량)로 계산하고 속도의 부호가 바뀌는 구간에서 $|v|$ 로 나누어 적분하지 않음
  concepts: [CON-CAL-DISTANCE-ABS-VELOCITY]
  used_in: ['TUK-G25A-08', 'TUK-G25B-08']
- id: MC-CAL-442507
  name: 정적분으로 정의된 항등식에서 양변 미분 후 $f(0)$ 같은 초기 조건(상수항) 결정을 빠뜨림
  concepts: [CON-CAL-FTC-IDENTITY]
  used_in: ['TUK-G25A-09', 'TUK-G25B-09']
- id: MC-CAL-442508
  name: 절댓값이 씌워진 함수의 그래프에서 꺾이는 점의 높이(0)와 접힌 극값을 고려하지 않고 직선과의 교점 개수를 셈
  concepts: [CON-CAL-ABS-GRAPH-INTERSECT]
  used_in: ['TUK-G25B-09']
