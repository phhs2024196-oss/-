# YSM 2023(M23·G23A·G23M) 오개념 후보 — db/misconceptions.yaml 에 합류시켜야 validate 의 "카탈로그에 없음" 오류가 사라진다(공용 파일이라 직접 수정하지 않음)
# 문항 YAML 의 misconceptions 는 합류 전까지 [] 로 둔다. concepts 는 임시 상위 개념.
misconceptions:
- id: MC-CAL-8861
  name: 접선의 $x$절편을 구할 때 $f'(1)=-\dfrac3e$의 부호를 놓쳐 접선의 기울기를 $+\dfrac3e$로 잡고 $\mathrm{P}(0,0)$ 쪽(왼쪽)으로 답함
  concepts:
  - CON-CAL
  source_item: YSM-M23-01
  subpart: 1-1
- id: MC-CAL-8862
  name: $\displaystyle\sum_{k=1}^{n}\dfrac{3}{2e^k}$을 첫째항을 $\dfrac3{2e^0}$로 보고 등비수열의 합을 $\dfrac{3}{2}\cdot\dfrac{1-e^{-n}}{1-e^{-1}}$로 써서 항의 개수·첫째항을 틀림
  concepts:
  - CON-CAL
  source_item: YSM-M23-01
  subpart: 1-2
- id: MC-CAL-8863
  name: $f(x)-g(x)$의 최솟값이 $0$이어야 한다는 접함 조건 대신 $f(x)=g(x)$의 판별식이나 한 점 교점만 확인해 $\sin a=\dfrac12$의 두 해 $\dfrac\pi6$, $\dfrac{5\pi}6$를 그림과 대조하지 않고 모두 답함
  concepts:
  - CON-CAL
  source_item: YSM-M23-02
  subpart: 2-1
- id: MC-CAL-8864
  name: 두 접점 사이 도형 A의 넓이를 $\displaystyle\int_0^{2\pi}(f-g)dx$처럼 접점이 아닌 구간으로 적분함
  concepts:
  - CON-CAL
  source_item: YSM-M23-02
  subpart: 2-3
- id: MC-CAL-8865
  name: 위로 볼록한 포물선과 두 좌표축 사이 도형을 수평선으로 나눈 아래쪽 도형 B의 넓이를 $x$에 대한 적분 $\displaystyle\int_0^p\left(4-\dfrac{x^2}{4}\right)dx$로 쓰는 등 A와 B의 구간·위아래 함수를 혼동함
  concepts:
  - CON-CAL
  source_item: YSM-M23-03
  subpart: 3-2
- id: MC-CAL-8866
  name: $\dfrac{k}{n^2+k}$의 부등식에서 $k$의 범위를 무시하고 모든 항을 $\dfrac1{n^2+1}$ 또는 $\dfrac n{n^2+n}$로 바꿔 극한을 $0$으로 답함
  concepts:
  - CON-CAL
  source_item: YSM-G23A-01
  subpart: 1-1
- id: MC-CAL-8867
  name: $\dfrac{2}{(2k-1)(2k+3)}$를 $\dfrac{1}{2k-1}-\dfrac{1}{2k+3}$처럼 계수 $\dfrac12$ 없이 분해하고 소거 후 앞 두 항만 남는 구조(간격 4)를 첫 항만 남는 것으로 봄
  concepts:
  - CON-CAL
  source_item: YSM-G23A-01
  subpart: 1-2
- id: MC-CAL-8868
  name: 구간별 함수에서 $x=-3$, $x=0$의 함수값 연속만 쓰고 도함수의 연속 조건은 쓰지 않아 $a,b,c,d$가 하나로 정해지지 않음
  concepts:
  - CON-CAL
  source_item: YSM-G23A-02
  subpart: 2-1
- id: MC-CAL-8869
  name: 넓이 계산에서 $f(x)$와 $g(x)$의 위아래를 구분하지 않고 $\displaystyle\int_{-5}^{-1}(g-0)dx$ 또는 $\displaystyle\int_{-3}^{-1}(f-g)dx$로 부호를 틀림
  concepts:
  - CON-CAL
  source_item: YSM-G23A-02
  subpart: 2-2
- id: MC-CAL-8870
  name: $2\sin\dfrac x5+3$의 범위를 $[-2,2]$ 또는 $[-1,1]$로 보고 $f$의 최대·최소를 구해 $M$, $m$을 틀림
  concepts:
  - CON-CAL
  source_item: YSM-G23A-03
  subpart: 3-1
- id: MC-CAL-8871
  name: $|f(x-1)+3|$에서 극대·극소가 뒤바뀌는 것과 $x$절편 C에서 생기는 극소를 놓쳐 $g$의 극값 개수를 $2$개($\alpha=2$)로, 극솟값의 합을 $5$ 아닌 값으로 답함
  concepts:
  - CON-CAL
  source_item: YSM-G23A-03
  subpart: 3-2
- id: MC-CAL-8872
  name: $\displaystyle\lim_{n\to0}\left(\dfrac1{a_n}+1\right)^{1/n}$에서 $a_n\to\infty$임을 쓰지 않고 $\left(1+\dfrac1{a_n}\right)^{a_n}\to e$ 꼴로 바꾸지 못해 $\alpha=e$로 답함
  concepts:
  - CON-CAL
  source_item: YSM-G23M-01
  subpart: 1-1
- id: MC-CAL-8873
  name: $g'(x)=\dfrac{e^{nx}-e^{-nx}}{e^{nx}+e^{-nx}}$가 증가함수임을 보이지 않고 $[0,k]$의 최댓값을 극값 조건 $g''(x)=0$에서 찾으려 함
