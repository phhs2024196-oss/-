# YSM 2026 기출 오개념 후보 — db/misconceptions.yaml 에 합류시켜야 validate 의 "카탈로그에 없음" 오류가 사라진다(공용 파일이라 직접 수정하지 않음)
# concepts 는 db/concepts.yaml 에 세부 개념이 생기기 전 임시로 상위 개념을 지정
misconceptions:
