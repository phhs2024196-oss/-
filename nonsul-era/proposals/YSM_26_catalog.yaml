  - CON-CAL
  source_item: YSM-G26A-01
  subpart: 1-1
- id: MC-CAL-8940
  name: $g(x)=(x-1)(x-3)-5=x^2-4x-2$를 $[0,4]$ 전체에 적용해 구간을 $[0,2],[2,4]$로만 나눔
