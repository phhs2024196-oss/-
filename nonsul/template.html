<title>유형별 수리논술 N제</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;600;700&display=swap">
<style>
/*KATEX_CSS*/
</style>
<style>
/* layout: 왼쪽 유형 목차(학교별 3단) + 오른쪽 시험지형 본문. 좁으면 목차가 위로 접힌다. */
:root{
  --bg:#f3f5f8; --paper:#ffffff; --ink:#16202e; --mute:#5b6778; --line:#d5dbe4;
  --accent:#1f4fa3; --accent-soft:#e3ebf8; --l4:#2d7a4f; --l5:#a8620a; --l6:#b3312b;
  --sans:"Noto Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --serif:"Noto Serif KR","Nanum Myeongjo",Batang,serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151d; --paper:#181f2a; --ink:#e4e9f1; --mute:#96a2b4; --line:#2e3948;
  --accent:#8db2f2; --accent-soft:#1f2c42; --l4:#6cc493; --l5:#e5aa55; --l6:#f08a82; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151d; --paper:#181f2a; --ink:#e4e9f1; --mute:#96a2b4; --line:#2e3948;
  --accent:#8db2f2; --accent-soft:#1f2c42; --l4:#6cc493; --l5:#e5aa55; --l6:#f08a82; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
.wrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:270px minmax(0,1fr);gap:28px;align-items:start}
header.top{max-width:1180px;margin:0 auto 20px}
header.top h1{font-family:var(--serif);font-size:26px;margin:0 0 4px;text-wrap:balance}
header.top p{margin:0;color:var(--mute);font-size:13.5px}
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 24px);overflow:auto;display:flex;flex-direction:column;gap:16px}
.school h2{font-size:12px;letter-spacing:.08em;color:var(--mute);margin:0 0 6px;font-weight:700}
.school nav{display:flex;flex-direction:column;gap:2px}
.school a{display:flex;justify-content:space-between;gap:8px;padding:5px 9px;border-radius:5px;color:var(--ink);text-decoration:none;font-size:13.5px;line-height:1.45}
.school a span{color:var(--mute);font-variant-numeric:tabular-nums;font-size:12px}
.school a:hover{background:var(--accent-soft)}
.school a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.school a.on{background:var(--accent);color:var(--paper);font-weight:500}
.school a.on span{color:var(--paper)}
main{min-width:0}
section.type{background:var(--paper);border:1px solid var(--line);padding:28px clamp(16px,4vw,44px) 36px}
section.type h1{font-family:var(--serif);font-size:23px;margin:0 0 14px;padding-bottom:10px;border-bottom:2px solid var(--ink);text-wrap:balance}
section.type h2{font-size:14px;letter-spacing:.06em;color:var(--accent);margin:30px 0 10px}
section.type h3{font-family:var(--serif);font-size:18px;margin:34px 0 2px;scroll-margin-top:16px}
section.type p{margin:9px 0;max-width:72ch}
section.type hr{border:0;border-top:1px solid var(--line);margin:30px 0 0}
p.loading{color:var(--mute)}
section.type{overflow-wrap:anywhere;overflow-x:hidden;position:relative}
.katex{position:relative}
section.type p,section.type li,section.type td{overflow-x:auto;overflow-y:hidden;padding-block:2px}
p.meta{color:var(--mute);font-size:12.5px;margin:0 0 10px}
.lv{display:inline-block;font-weight:700;font-size:11.5px;padding:0 7px;border:1px solid currentColor;border-radius:3px;margin-right:6px}
.lv.l4{color:var(--l4)} .lv.l5{color:var(--l5)} .lv.l6{color:var(--l6)} .lv.l3{color:var(--mute)}
.tw{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;font-size:13px;width:100%}
th,td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}
th{background:var(--accent-soft);font-weight:700;white-space:nowrap}
td:first-child{white-space:nowrap;font-variant-numeric:tabular-nums}
details.sol{margin:12px 0 0;border-left:3px solid var(--accent);background:var(--bg);padding:2px 16px}
details.sol summary{cursor:pointer;color:var(--accent);font-weight:700;font-size:13.5px;padding:7px 0}
details.sol summary:focus-visible{outline:2px solid var(--accent)}
blockquote{margin:10px 0;padding:8px 16px;border:1px solid var(--line);background:var(--bg)}
code{font-size:.9em}
.katex{font-size:1.06em}
.katex-display{overflow-x:auto;overflow-y:hidden;padding:2px 0}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.tools button{font:inherit;font-size:13px;padding:5px 12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:5px;cursor:pointer}
.tools button:hover{border-color:var(--accent);color:var(--accent)}
@media (max-width:820px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  aside{position:static;max-height:none}
  .school nav{flex-direction:row;flex-wrap:wrap}
  .school a{border:1px solid var(--line);background:var(--paper)}
}
</style>
<header class="top">
  <h1>유형별 수리논술 N제 — 숭실 · 동국 · 세종</h1>
  <p>학교별 10개 유형, 유형마다 풀이 팁 · 설계도 · 10문항. 총 <!--COUNT-->문항, 전 문항 sympy 검산 통과본.</p>
</header>
<div class="wrap">
  <aside>
<!--NAV-->
  </aside>
  <main>
    <div class="tools">
      <button type="button" id="openAll">이 유형 해설 모두 펼치기</button>
      <button type="button" id="closeAll">모두 접기</button>
    </div>
<!--SECTIONS-->
  </main>
</div>
<script>
(function(){
  var links=[].slice.call(document.querySelectorAll('aside a')), done={};
  function load(sec,id){
    if(done[id]) return; done[id]=1;
    fetch('t/'+id+'.html').then(function(r){if(!r.ok)throw 0;return r.text();})
      .then(function(h){sec.innerHTML=h;})
      .catch(function(){done[id]=0;sec.innerHTML='<p class="loading">이 유형을 불러오지 못했습니다. 목차에서 다시 눌러 주세요.</p>';});
  }
  function show(){
    var id=(location.hash||'').slice(1);
    if(!document.getElementById('sec-'+id)) id=links.length?links[0].dataset.id:'';
    document.querySelectorAll('section.type').forEach(function(s){s.hidden=(s.id!=='sec-'+id);});
    links.forEach(function(a){a.classList.toggle('on',a.dataset.id===id);});
    var sec=document.getElementById('sec-'+id); if(sec) load(sec,id);
  }
  function cur(){return document.querySelector('section.type:not([hidden])');}
  document.getElementById('openAll').addEventListener('click',function(){var s=cur();if(s)s.querySelectorAll('details').forEach(function(d){d.open=true;});});
  document.getElementById('closeAll').addEventListener('click',function(){var s=cur();if(s)s.querySelectorAll('details').forEach(function(d){d.open=false;});});
  window.addEventListener('hashchange',function(){show();window.scrollTo(0,0);});
  show();
})();
</script>
